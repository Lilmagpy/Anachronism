name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint, types and tests
        run: scripts/check.sh
      - name: Launch the game command
        run: uv run --locked anachronism

  macos:
    name: Checks (macOS)
    # The owner plays on a Mac. Mac minutes count 10x on private repos, so this job runs only
    # for pull requests, pushes to main and manual runs (D-034).
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint, types and tests
        run: scripts/check.sh
      - name: Launch the game command
        run: uv run --locked anachronism
