name: CI

# The repository is public, so Actions minutes are free (D-110). Each pull request update
# runs once (pushes to other branches do not also run separately), plus pushes to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint, types and tests
        run: scripts/check.sh
      - name: Launch the game command
        run: uv run --locked anachronism

  macos:
    name: Checks (macOS)
    # The owner plays on a Mac (D-034).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint, types and tests
        run: scripts/check.sh
      - name: Launch the game command
        run: uv run --locked anachronism

  app:
    name: Mac app (built on Linux)
    # Exports the game for macOS and uploads it to the run page (D-050). Before that, the same
    # packaging is exported for Linux and started with an empty home folder, to prove that a
    # fresh install unpacks the engine, fetches Python and answers.
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz 'templates/macos.zip' 'templates/linux_release.x86_64' \
            'templates/windows_release_x86_64.exe' 'templates/version.txt' -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Package for Linux and start it as a brand-new user
        run: |
          scripts/package.sh linux ~/godot/godot
          mkdir -p /tmp/fresh-home
          env -i HOME=/tmp/fresh-home PATH=/usr/bin:/bin \
            build/linux/anachronism.x86_64 --headless -- --smoke | tee /tmp/smoke.txt
          grep -q "SMOKE OK" /tmp/smoke.txt
      - name: Package for macOS
        run: scripts/package.sh mac ~/godot/godot
      - uses: actions/upload-artifact@v7
        with:
          name: Meritus-mac
          path: build/Meritus-mac.zip
          retention-days: 30
      - name: Package for Windows
        run: scripts/package.sh windows ~/godot/godot
      - uses: actions/upload-artifact@v7
        with:
          name: Meritus-windows
          path: build/Meritus-windows.zip
          retention-days: 30

  windows:
    name: Windows app (started on Windows)
    # Nobody on the project has a PC to hand (D-306), so a real Windows machine unzips the
    # download as a brand-new user and starts it: the engine unpacks, Python is fetched, a
    # game begins and answers.
    needs: app
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Meritus-windows
      - name: Start the game as a brand-new user
        shell: bash
        run: |
          unzip -q Meritus-windows.zip
          mkdir fresh-home
          export APPDATA="$(cygpath -w "$PWD/fresh-home")"
          Meritus/Meritus.exe --headless --log-file "$(cygpath -w "$PWD/smoke.log")" -- --smoke > smoke.txt 2>&1 || true
          cat smoke.txt
          [ -f smoke.log ] && cat smoke.log
          cat smoke.txt smoke.log 2>/dev/null | grep -q "SMOKE OK"
