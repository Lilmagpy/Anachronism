# Character of the city, district by district, for fill.gd. A district is a circle (lat, lon,
# radius_m); where circles overlap the smaller one wins; a point inside none gets `default`.
#
# Each district has
#   max_density    fraction of its building plots that are built when the city is full
#   saturates_at   city population at which the district reaches max_density; below it the
#                  density grows as (population / saturates_at) ** 0.7 (population.yaml, central
#                  estimate, interpolated in log space); core districts fill first
#   onset          year before which the district is not built at all (open ground, fields, cemetery)
#   eras           list of {from: year, weights: {...}}: from that year the mix of building types
#                  is the weights (relative; casa = small single-storey house of wood/mud-brick or
#                  rubble, domus = atrium house of the well-off, insula = multi-storey tenement,
#                  workshop = craft and storage, horti = walled garden estate with villa).
#                  `shops: x` is the chance that a street frontage has tabernae (shop-fronts).
# The weights are the author's reading of the sources below (design values, not measurements).
# No fabricated numbers about people: nothing here counts inhabitants.
districts:
- id: palatine
  name: Palatine
  lat: 41.8892
  lon: 12.4875
  radius_m: 230
  max_density: 0.85
  saturates_at: 40000
  onset: -509
  eras:
  - {from: -509, weights: {casa: 0.7, domus: 0.3}, shops: 0.0}
  - {from: -200, weights: {casa: 0.15, domus: 0.8, insula: 0.05}, shops: 0.1}
  - {from: -100, weights: {domus: 0.92, insula: 0.08}, shops: 0.05}
  sources: ["topography.yaml (Palatine: the aristocracy's hill in the Late Republic; Platner-Ashby s.v. Palatium)", "Cic. Att. 1.13.6 and Dom. 100-116 (his own house on the Palatine, bought from Crassus 62 BC): # unverified", "Livy 1.7 (Palatine as the oldest settlement)"]
- id: velia
  name: Velia
  lat: 41.8913
  lon: 12.4880
  radius_m: 110
  max_density: 0.85
  saturates_at: 40000
  onset: -509
  eras:
  - {from: -509, weights: {casa: 0.6, domus: 0.4}, shops: 0.05}
  - {from: -200, weights: {domus: 0.75, casa: 0.1, insula: 0.15}, shops: 0.15}
  - {from: -100, weights: {domus: 0.8, insula: 0.2}, shops: 0.15}
