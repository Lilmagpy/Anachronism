# Regions of Rome: the 14 Augustan regiones (7 BC), the 4 Servian regions before them, and the
# `districts` that give each part of the city its character for the 3D fill (fill.gd).
# Polygons are [lat, lon] lists, closed implicitly, hand-drawn and ROUGH: Platner and Ashby say that
# the Augustan outer boundaries cannot be drawn exactly (they were extended during the next three
# centuries) and that the inner boundaries of the Servian regions cannot be drawn with exactness.
# Boundaries follow P-A's verbal description (Regiones Quattuordecim, read on LacusCurtius) and the
# modern landmarks named in it. They are good to a couple of hundred metres at best.
# The Augustan regions are dated 7 BC (Suet. Aug. 30; Cass. Dio 55.8, cited by P-A), i.e. inside the
# game's range (509-27 BC) only as "the city that the regions were later laid over"; before 7 BC the
# four Servian regions applied. The 3D fill uses the 14 only as a spatial index of the city's
# later sub-divisions; its character comes from the `districts` below.
regiones_augustae:
- id: reg_01
  number: 1
  latin: Porta Capena
  polygon: [[41.8897, 12.4912], [41.8870, 12.4915], [41.8840, 12.4893], [41.8800, 12.4900], [41.8740, 12.4945], [41.8680, 12.5010], [41.8610, 12.5090], [41.8560, 12.5170], [41.8545, 12.5215], [41.8610, 12.5170], [41.8700, 12.5075], [41.8770, 12.5000], [41.8830, 12.4950], [41.8880, 12.4935]]
  precision: rough
  text: "An irregular strip from the east corner of the Palatine south past the Porta Capena, bounded on the west by the Palatine and never more than about 150 m wide on average; beyond the Aventine it widened to the Almo, outside the Aurelian wall."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read): 'I, Porta Capena...'"]
- id: reg_02
  number: 2
  latin: Caelimontium
  polygon: [[41.8890, 12.4920], [41.8885, 12.4990], [41.8870, 12.5060], [41.8858, 12.5140], [41.8790, 12.5065], [41.8800, 12.5000], [41.8820, 12.4950], [41.8850, 12.4925]]
  precision: rough
  text: "Most of the Caelian, bounded by Region I, the Aurelian wall, and the straight street from the Colosseum to the Porta Caelimontana and Porta Asinaria."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_03
  number: 3
  latin: Isis et Serapis
  polygon: [[41.8897, 12.4912], [41.8945, 12.4940], [41.8949, 12.4998], [41.8915, 12.4988], [41.8890, 12.4950]]
  precision: rough
  text: "The Colosseum valley and the Oppius, bounded by Region II, the Servian wall, the Clivus Suburanus from the Porta Esquilina west and its prolongation to a point north of the Colosseum, then south to the Meta Sudans. The name comes from temples of Isis and Serapis later built there."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_04
  number: 4
  latin: Templum Pacis
  polygon: [[41.8897, 12.4912], [41.8905, 12.4880], [41.8915, 12.4862], [41.8932, 12.4866], [41.8936, 12.4851], [41.8946, 12.4864], [41.8960, 12.4903], [41.8985, 12.4935], [41.9022, 12.4983], [41.8949, 12.4998], [41.8945, 12.4940]]
  precision: rough
  text: "The Sacra via from its beginning to the atrium Vestae, the Subura and the Cispius; bounded by Region III's line, the Servian wall, the vicus Patricius from the Porta Viminalis to near the Subura, and the line between the Fora of Nerva and Vespasian, embracing the northern part of the Forum. (The name Templum Pacis dates from Vespasian.)"
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_05
  number: 5
  latin: Esquiliae
  polygon: [[41.8915, 12.4988], [41.8949, 12.4998], [41.9022, 12.4985], [41.9055, 12.5040], [41.9020, 12.5130], [41.8960, 12.5160], [41.8905, 12.5160], [41.8857, 12.5148], [41.8885, 12.5045]]
  precision: rough
  text: "The eastern district outside the Servian wall, north of the via Asinaria. In Augustus' time the Campus Viminalis and the ground between the via Tiburtina and the via Salaria lay outside the city and were not in Region V until after Vespasian; the boundary was 300-400 m beyond the later Aurelian wall on the south."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_06
  number: 6
  latin: Alta Semita
  polygon: [[41.8955, 12.4855], [41.8962, 12.4838], [41.8995, 12.4835], [41.9040, 12.4820], [41.9080, 12.4830], [41.9115, 12.4888], [41.9159, 12.4989], [41.9115, 12.5000], [41.9058, 12.4963], [41.9022, 12.4985], [41.8985, 12.4920]]
  precision: rough
  text: "The Quirinal from the imperial fora to the Servian wall between the Porta Viminalis and the Porta Collina, west far enough to take in the horti Sallustiani and north beyond the later Aurelian wall; named for the Alta Semita along the ridge."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)", "Platner-Ashby s.v. Alta Semita (read)"]
- id: reg_07
  number: 7
  latin: Via Lata
  polygon: [[41.8957, 12.4828], [41.9005, 12.4803], [41.9108, 12.4766], [41.9115, 12.4888], [41.9080, 12.4830], [41.9040, 12.4820], [41.8995, 12.4835], [41.8962, 12.4838]]
  precision: rough
  text: "Named for the southern end of the Via Flaminia (the Corso); lay between the Via Flaminia and the western boundary of Region VI, i.e. the east side of the Corso up the slope of the Pincian."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_08
  number: 8
  latin: Forum Romanum vel Magnum
  polygon: [[41.8957, 12.4830], [41.8962, 12.4858], [41.8947, 12.4866], [41.8936, 12.4866], [41.8915, 12.4864], [41.8902, 12.4850], [41.8892, 12.4830], [41.8895, 12.4808], [41.8920, 12.4806]]
  precision: rough
  text: "An irregular region: the Forum (not the whole Sacra via), the (later) imperial fora, the Capitol and the ground south of it, extending to a line drawn north of the Forum Boarium through the Velabrum to the east end of the atrium Vestae."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_09
  number: 9
  latin: Circus Flaminius
  polygon: [[41.8957, 12.4828], [41.9005, 12.4803], [41.9108, 12.4766], [41.9112, 12.4700], [41.9060, 12.4700], [41.8960, 12.4732], [41.8932, 12.4765], [41.8918, 12.4790], [41.8920, 12.4807]]
  precision: rough
  text: "All the ground between the Servian wall, the Via Flaminia and the Tiber: the Campus Martius. After Augustus the name Campus Martius was restricted to the part west of the Via Lata; a boundary stone found near the Pantheon shows that in Augustus' time the southern part was more or less built over and the northern part was open meadow."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)", "Platner-Ashby s.v. Campus Martius (read)"]
- id: reg_10
  number: 10
  latin: Palatium
  polygon: [[41.8912, 12.4855], [41.8909, 12.4885], [41.8903, 12.4905], [41.8885, 12.4905], [41.8872, 12.4890], [41.8870, 12.4865], [41.8880, 12.4845], [41.8898, 12.4846]]
  precision: approx
  text: "The Palatine within the lines Tacitus gives for the first pomerium."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)", "Tac. Ann. 12.24"]
- id: reg_11
  number: 11
  latin: Circus Maximus
  polygon: [[41.8892, 12.4830], [41.8895, 12.4806], [41.8905, 12.4790], [41.8888, 12.4780], [41.8862, 12.4785], [41.8858, 12.4800], [41.8845, 12.4825], [41.8828, 12.4862], [41.8832, 12.4898], [41.8850, 12.4900], [41.8872, 12.4890], [41.8870, 12.4865], [41.8880, 12.4845], [41.8890, 12.4846]]
  precision: rough
  text: "A very irregular region containing the Circus Maximus and the Forum Boarium, bounded by the Tiber and Regions IX, VIII, X, XII and XIII."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_12
  number: 12
  latin: Piscina Publica
  polygon: [[41.8832, 12.4898], [41.8828, 12.4862], [41.8795, 12.4835], [41.8745, 12.4850], [41.8700, 12.4905], [41.8640, 12.4990], [41.8610, 12.5090], [41.8680, 12.5010], [41.8740, 12.4945], [41.8800, 12.4900]]
  precision: rough
  text: "The eastern part of the Aventine and the ground toward the Via Appia; named for a former public reservoir. Bounded by the Via Appia and Region I, the Aurelian wall, and the vicus portae Raudusculanae and vicus Piscinae Publicae."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_13
  number: 13
  latin: Aventinus
  polygon: [[41.8858, 12.4800], [41.8862, 12.4787], [41.8830, 12.4778], [41.8770, 12.4768], [41.8700, 12.4728], [41.8660, 12.4770], [41.8680, 12.4860], [41.8700, 12.4905], [41.8745, 12.4850], [41.8795, 12.4835], [41.8828, 12.4862], [41.8845, 12.4825]]
  precision: rough
  text: "The Aventine and the district south of it, between the boundaries of Region XII and XI, the Aurelian wall, and the Tiber."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]
- id: reg_14
  number: 14
  latin: Trans Tiberim
  polygon: [[41.8700, 12.4720], [41.8770, 12.4752], [41.8830, 12.4762], [41.8885, 12.4772], [41.8925, 12.4748], [41.8960, 12.4712], [41.9060, 12.4682], [41.9070, 12.4600], [41.9030, 12.4530], [41.8950, 12.4500], [41.8860, 12.4520], [41.8780, 12.4600], [41.8700, 12.4680]]
  precision: rough
  text: "All the city on the right bank of the Tiber (Trastevere), with the Tiber island; its limits cannot be fixed, but it included much more than the area within the Aurelian wall: south to the temple of Fors Fortuna, north to include the Vatican district."
  sources: ["Platner-Ashby s.v. Regiones Quattuordecim (read)"]

