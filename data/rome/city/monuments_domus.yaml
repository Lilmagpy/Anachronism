# Houses of the great families (F2 places, D-304). Same format as monuments.yaml (README.md),
# plus `role: domus`, `gens` (a gens id of the rome pack's gentes.yaml) and `owner` (the man the
# sources name). These are places the player visits to see and win over a family. Houses
# already in monuments.yaml (Cicero, Catulus, Clodius, Pompey, Hortensius) keep their records
# there; their families and years are in rome/republic_rules.yaml (city.places.domus), which
# also gives later owners of the houses below. Positions are rough (the site is known only by
# its hill or district); sizes are the domus kit's, not measured plans.
monuments:
- id: domus_valerii_velia
  latin: Aedes P. Valeri Publicolae
  english: House of P. Valerius Publicola below the Velia
  type: house
  role: domus
  gens: valerii
  owner: "P. Valerius Publicola and the Valerii"
  regio: 4
  lat: 41.8912
  lon: 12.4893
  precision: rough
  location: at the foot of the Velia, where the temple of Vica Pota later stood
  built: {year: -509, certainty: traditional, by: "P. Valerius, suspected of aiming at kingship for building on the top of the Velia, had his house pulled down and rebuilt at the foot of the hill (Livy 2.7.5-12; Plut. Publicola 10; Cic. Rep. 2.53)"}
  sources: ["Livy 2.7.5-12", "Plutarch, Publicola 10", "Cicero, De re publica 2.53", "Platner-Ashby s.v. Vica Pota"]
  notes: "Passages not re-read for this pass (unverified). How long the Valerii kept the house is not recorded; the game lets it stand as the family's house. Site rough: the foot of the Velia toward the Forum."
  pleiades: null
  verified: none
  model: domus
  bearing_deg: 16  # unverified
  footprint_m: {length: 30, width: 20}  # unverified
  height_m: 8  # unverified
  geometry_source: "form assumed from date and type, native kit size (no measured plan)"
  geometry_unverified: [bearing_deg, footprint_m, height_m]
