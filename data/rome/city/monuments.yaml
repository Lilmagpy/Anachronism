- id: forum_romanum
  latin: Forum Romanum
  english: Roman Forum
  type: forum
  regio: 8
  lat: 41.8925
  lon: 12.4853
  precision: approx
  location: valley between the Capitol and the Palatine/Velia, drained by the Cloaca Maxima
  built: {year: -600, certainty: traditional, by: "valley drained by sewers (cloacae) under Tarquinius Priscus and plots round the forum assigned for porticoes and shops (Livy 1.38.6); the first open area with a fixed level at 10.60-10.90 m above sea level dates probably to the 6th c. BC (P&A)"}
  events:
  - {year: -210, what: "great fire destroys the shops and houses round the Forum; later rebuilt (Livy 26.27.1-4)"}
  - {year: -174, what: "a new, higher level (c. 174 BC) in the Comitium; the censors of 174 had the Capitoline slope and streets paved (Livy 41.27.5-7; level date from P&A)"}
  - {year: -52, what: "funeral of Clodius: Curia Hostilia burned (Asc. Mil. 29-33; Cic. Mil. 90; Dio 40.49)"}
  - {year: -46, what: "Caesar's replanning: Rostra moved and Curia Iulia begun, Basilica Iulia dedicated (partially) 46 BC (Dio 43.22, 44.5; P&A)"}
  sources: ["Livy 1.38.6", "Livy 26.27.1-4", "Livy 41.27.5", "Cic. Mil. 90", "Cass. Dio 40.49", "Cass. Dio 43.22", "Platner-Ashby s.v. Forum Romanum"]
  notes: "CORRECTED: Livy 1.38.6 says Tarquinius Priscus DRAINED the low ground round the forum with sewers (cloacis fastigio in Tiberim ductis) and gave out building plots; it does not say he paved it, so 'paved' was removed. P&A: the first open area with fixed limits is marked by cappellaccio pavements at 10.60-10.90 m above sea level (c. 6th c.); a new level c. 174 BC; a level attributed to Sulla (Van Deman, uncertain); the Cloaca Maxima credited to the Tarquins (excavations support a 6th-c. date). Livy 26.27.1-4 is the fire of 210 (verified). The plot of land is Pleiades 502866838 (archaeological site; its representative point is about 120 m ESE of the plaza centre used here)."
  pleiades: 502866838
  verified: platner-ashby+pleiades
- id: comitium
  latin: Comitium
  english: Comitium
  type: comitium
  regio: 8
  lat: 41.8928
  lon: 12.4850
  precision: approx
  location: north-west corner of the Forum, below the Curia; round-ish open space for assemblies
  built: {year: null, certainty: traditional, by: "open place of assembly connected with the Curia from the regal period (Livy 1.36.5; Varro LL 5.155); its levels date from the 6th century BC (P&A)"}
  events:
  - {year: -390, what: "debris of buildings burned in the Gallic fire lies under the second level of the Comitium (P&A)"}
  - {year: -145, what: "C. Licinius Crassus, tribune, first leads the legislative assembly from the Comitium to the Forum (Cic. Lael. 25; Varro RR 1.2.9)"}
  - {year: -80, what: "Sulla restores the Curia and Rostra (P&A); Comitium pavement later attributed to Faustus Sulla's rebuilding after the fire of 52"}
  - {year: -45, what: "Caesar's replanning reduces the Comitium; the Rostra is moved (Dio 43.49.1)"}
  form: "open templum, orientated to the cardinal points, with the Curia on its north side, the Rostra and Graecostasis on the south and the Carcer and Basilica Porcia on the west; five successive levels excavated"
  sources: ["Livy 1.36.5", "Livy 5.55", "Livy 45.24.12", "Cic. Rep. 2.11", "Cic. Lael. 25", "Varro LL 5.155", "Dio 43.49.1", "Platner-Ashby s.v. Comitium"]
  notes: "Not in Pleiades. P&A: the Comitium was an open, inaugurated templum (Cic. Rep. 2.11), oriented to the cardinal points, with the Curia on the north side, the Carcer and Basilica Porcia on the west, the Rostra and Graecostasis on the south; five successive levels from c. 390 (after the Gallic fire) to the Caesarian travertine/marble pavement. It was the political centre until the 2nd c. BC; C. Licinius Crassus (tribune 145) first led the assembly from the Comitium to the Forum (Cic. Lael. 25, 96; Varro RR 1.2.9). Faustus Sulla's travertine pavement (12.63 m) is attributed to his restoration after 52 BC. The earlier claim that Sulla 'levelled and rebuilt' the Comitium in 80 BC is not in P&A (it only says Sulla restored the Curia and Rostra) and has been replaced. Dio 43.49.1 not checked here against Dio."
  pleiades: null
  verified: platner-ashby
