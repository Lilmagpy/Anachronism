# Monuments of Rome 509-27 BC. See README.md for the format.
# Years: negative = BC. Coordinates WGS84; precision says how far off they may be.
# Positions are placements of the modern identified remains where they exist, otherwise
# scholarly reconstructions from Platner-Ashby / Lanciani; precision "approx" means 100-300 m,
# "rough" means 300 m or worse (site known only by region/neighbourhood).
monuments:
# ---------------------------------------------------------------- CAPITOL
- id: aedes_iovis_capitolini
  latin: Aedes Iovis Optimi Maximi Capitolini
  english: Temple of Jupiter Optimus Maximus (Capitoline Temple)
  type: temple
  regio: 8
  lat: 41.8922
  lon: 12.4817
  precision: approx
  location: "Capitol, southern summit (Capitolium); podium remains in the Palazzo Caffarelli area (the 'Museo Mussolini' of P&A) and beside the Palazzo dei Conservatori"
  built: {year: -509, certainty: traditional, by: "vowed by Tarquinius Priscus, largely built by Tarquinius Superbus (Livy 1.38.7, 1.55-56; Dion. Hal. 4.61); dedicated on 13 September by the consul M. Horatius Pulvillus in the first year of the Republic (Livy 2.8; Polyb. 3.22.1, which dates the first treaty to that year; Tac. Hist. 3.72)"}
  events:
  - {year: -296, what: "terracotta quadriga on the pediment replaced by a (probably bronze) one (Liv. 10.23.12)"}
  - {year: -193, what: "aediles M. Aemilius Lepidus and L. Aemilius Paullus set gilded shields on the pediment (Liv. 35.10)"}
  - {year: -179, what: "walls and columns re-stuccoed (Liv. 40.51.3)"}
  - {year: -142, what: "cella ceiling gilded (Plin. NH 33.57)"}
  - {year: -83, what: "burned down on 6 July 83 BC (Cic. Cat. 3.9; Sall. Cat. 47.2; Tac. Hist. 3.72; App. BC 1.83); the Sibylline books also lost (Dion. Hal. 4.62)"}
  - {year: -78, what: "rebuilding begun under Sulla, most of it assigned by the Senate to Q. Lutatius Catulus (Val. Max. 9.3.8; Cic. Verr. 2.4.69; Plut. Publ. 15); year approximate, on the old foundations and plan but higher (Tac. Hist. 3.72; Val. Max. 4.4.11)"}
  - {year: -69, what: "dedicated by Q. Lutatius Catulus (Liv. Per. 98; Plut. Publ. 15; Plin. NH 7.138)"}
  form: "Tuscan temple on a tufa podium (stylobate of parallel walls 5.60 m thick, 4-5 m high) of about 55 x 60 m; three cellae side by side (Jupiter centre, Minerva right, Juno left), the cella about 100 ft (27.8 m) square, with a deep pronaos of columns; the first temple had a terracotta statue of Jupiter and a terracotta quadriga, attributed to Vulca of Veii (Plin. NH 35.157; Plut. Publ. 13)"
  materials: [tufa (cappellaccio) podium, timber superstructure, terracotta; marble columns in the Catulus phase]
  sources: ["Livy 1.38.7", "Livy 1.55-56", "Livy 2.8", "Polybius 3.22", "Dion. Hal. 4.61", "Cic. Cat. 3.9", "Cic. Verr. 2.4.69", "Tac. Hist. 3.72", "Livy Per. 98", "Plut. Publicola 13-15", "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus, Aedes"]
  notes: "Checked against P&A 'Iuppiter Optimus Maximus Capitolinus, Aedes' (pp297-302): dedication on 13 Sept (Liv. 2.8, 7.3.8; Polyb. 3.22; Tac. Hist. 3.72); fire 6 July 83 (Cic. Cat. 3.9; Sall. Cat. 47.2; App. BC 1.83); Sulla began the rebuilding (Val. Max. 9.3.8; Tac. Hist. 3.72), most of it fell to Catulus (Cic. Verr. 2.4.69), who dedicated in 69 (Liv. Per. 98; Plut. Publ. 15). The year 78 for the start of rebuilding is not in P&A: it is an approximation. P&A doubts the Olympieion columns were used (coins of 43 BC show Doric). Coordinates moved to Pleiades 871801169 (about 100 m SW of the earlier value)."
  pleiades: 871801169
  verified: platner-ashby+pleiades
- id: arx_capitolina
  latin: Arx
  english: Arx (citadel, northern summit of the Capitol)
  type: citadel
  regio: 8
  lat: 41.8946
  lon: 12.4833
  precision: approx
  location: "Capitol, northern summit, under S. Maria in Aracoeli; about 49 m above sea level, area about one hectare"
  built: {year: null, certainty: traditional, by: "citadel of the City of the Four Regions (regal period); sentinels posted here during comitia in the Campus Martius (Cass. Dio 37.28); held against the Gauls 390 BC (Livy 5.47); M. Manlius Capitolinus's house stood here until destroyed in 384 BC (Livy 6.20.13)"}
  sources: ["Livy 5.47", "Livy 6.20.9", "Livy 6.20.13", "Cass. Dio 37.28", "Platner-Ashby s.v. Arx"]
  notes: "No separate Pleiades place for the Arx: Pleiades 347036492 (Capitolinus Mons) covers the hill. P&A: height c. 49 m, area c. 1 ha; the Auguraculum lay at its north-east corner; the Aracoeli church (9th c.) altered the ground so its original topography is uncertain. P&A gives Liv. 5.47 only through the entry's other references (6.20.9, 6.20.13 for Manlius's house); Livy 5.47 itself (the geese) is the usual citation for the Gallic night attack."
  pleiades: null
  verified: platner-ashby
- id: aedes_iunonis_monetae
