  notes: "Dates uncertain; Cicero (Nat. D. 2.61) says Atilius Calatinus dedicated a temple of Fides (about 254 BC), so the date given is the Cicero attribution. Not in Pleiades. P&A: shrine of Fides ascribed to Numa (Liv. 1.21.4; Dion. Hal. 2.75; Plut. Numa 16); the temple was dedicated, presumably built, by A. Atilius Calatinus in 254 or 250 BC (Cic. Nat. D. 2.61), restored and re-dedicated by M. Aemilius Scaurus in 115; dedication day 1 October. Used for Senate meetings (Val. Max. 3.17; App. BC 1.16) and held treaty tablets. Probably in the south-east corner of the Area Capitolina near the Porta Pandana; exact site unknown."
