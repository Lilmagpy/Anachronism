  sources: ["Livy 1.10.5-7", "Livy 1.33.8", "Livy 4.20", "Dion. Hal. 2.34", "Plut. Marcellus 8", "Nepos Atticus 20.3", "Res Gestae 19", "Platner-Ashby s.v. Iuppiter Feretrius, Aedes"]
  notes: "Not in Pleiades. P&A: very small (15 ft on its longest side, Dion. Hal. 2.34), enlarged by Ancus (Liv. 1.33.8), probably inside the later Area Capitolina. Cossus's spolia opima: Livy dates it 437 (Liv. 4.19-20) but Livy 4.20.5-11 reports Augustus's reading of the linen corselet, which makes Cossus a consul, i.e. 428 (the date in P&A and Diodorus 12.80). Marcellus 222 BC (Liv. Per. 20; Plut. Marc. 8). Augustus's restoration: P&A 'probably about 31 BC' (Nep. Att. 20.3; Mon. Anc. 4.5 = RG 19.2; Liv. 4.20.7), so the event year here is 31, not 32."
  pleiades: null
  verified: platner-ashby
- id: aedes_veiovis
  latin: Aedes Vediovis
  english: Temple of Vediovis
  type: temple
  regio: 8
  lat: 41.8928
  lon: 12.4836
  precision: exact
  location: Capitol, in the saddle (Asylum) between the Arx and the Capitolium; remains under the Tabularium side, near Piazza del Campidoglio
  built: {year: -192, certainty: probable, by: "vowed by L. Furius Purpurio as praetor in the Gallic war of 200 (Livy 31.21.12, emended text); dedicated by the duumvir Q. Marcius Ralla in 192 (Livy 35.41.8, emended text); P&A treats the identification as unsettled"}
  form: "cella wider than deep with pronaos columns added along the flanks (Vitr. 4.8.4); cult statue of a youthful god with arrows and a goat (Gell. 5.12.11; Ov. Fast. 3.443); travertine/tufa remains survive below the Tabularium"
  sources: ["Livy 31.21.12", "Livy 34.53.7", "Livy 35.41.8", "Vitruvius 4.8.4", "Gellius 5.12", "Ovid Fasti 3.429-430", "Platner-Ashby s.v. Veiovis, Aedes; Aedes Veiovis in Capitolio"]
  notes: "CORRECTED. P&A treats two temples of Vediovis. (1) On the Tiber island, known only from an emended text of Liv. 34.53.7 (194 BC: dedicated by the duumvir C. Servilius, vowed six years earlier in the Gallic war by L. Furius Purpurio as praetor, the contract let by him as consul). (2) The Capitoline temple 'inter duos lucos' (Vitr. 4.8.4; Gell. 5.12.5), dedicated on 7 March (Ov. Fast. 3.429-430): Liv. 35.41.8 (192 BC) says Q. Marcius Ralla, duumvir, dedicated a temple vowed by Purpurio, but the MSS read 'aedes duae Iovi' and the emendation to Vediovis is conjectural. P&A says the matter cannot be settled. The previous entry's 'contracted 194; dedicated 192 (Livy 34.53.7)' mixed the island temple with the Capitoline one. Livy 31.21.12 is the vow of 200 (MSS 'deo Iovi'). Pleiades 243075423 gives the standing remains by the Tabularium side."
  pleiades: 243075423
  verified: platner-ashby+pleiades
