  english: Temple of Juno Moneta
  type: temple
  regio: 8
  lat: 41.8939
  lon: 12.4832
  precision: approx
  location: Capitol, Arx, on the site of the house of M. Manlius Capitolinus; under S. Maria in Aracoeli
  built: {year: -344, certainty: certain, by: "vowed 345 by the dictator L. Furius (Camillus) in the Aurunci war; the Senate appointed duumviri to build it on the site of M. Manlius Capitolinus's house; dedicated the next year, 344 (Livy 7.28.4-6), on 1 June (Ov. Fast. 6.183)"}
  sources: ["Livy 7.28.4-6", "Livy 6.20.13", "Livy 4.7.12", "Ovid Fasti 6.183", "Macrob. Sat. 1.12.30", "Platner-Ashby s.v. Iuno Moneta, Aedes"]
  events:
  - {year: -196, what: "prodigy: spear-points burned 'at Moneta' (Liv. 33.26.8)"}
  - {year: -269, what: "the mint was in the temple in the last centuries of the Republic, perhaps from the first silver coinage in 269 (conjecture in P&A)"}
