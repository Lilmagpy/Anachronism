  notes: "P&A calls the vower M. Furius Camillus; Livy 7.28.4-6 names the dictator only as L. Furius (Camillus). Dedicated 1 June (Ov. Fast. 6.183; Macrob. 1.12.30). Site probably the transepts of S. Maria in Aracoeli (Hulsen); no remains found. The Pleiades point is the Aracoeli church."
  pleiades: 76518529
  verified: platner-ashby+pleiades
- id: aedes_iovis_feretri
  latin: Aedes Iovis Feretri
  english: Temple of Jupiter Feretrius
  type: temple
  regio: 8
  lat: 41.8932
  lon: 12.4830
  precision: rough
  location: Capitol, probably near the Capitoline temple (exact site lost)
  built: {year: null, certainty: traditional, by: "Romulus, after winning the spolia opima from Acron of the Caeninenses, said to be the first temple in Rome (Livy 1.10.5-7; Dion. Hal. 2.34; Plut. Rom. 16)"}
  events:
  - {year: -31, what: "roof gone and building neglected; restored by Augustus at the urging of Atticus, probably c. 31 BC (Nep. Att. 20.3; Livy 4.20.7; RG 19.2)"}
