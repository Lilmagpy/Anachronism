# Monuments of Rome 509-27 BC. See README.md for the format.
# Years: negative = BC. Coordinates WGS84; precision says how far off they may be.
# Positions are placements of the modern identified remains where they exist, otherwise
# scholarly reconstructions from Platner-Ashby / Lanciani; precision "approx" means 100-300 m,
# "rough" means 300 m or worse (site known only by region/neighbourhood).
monuments:
# ---------------------------------------------------------------- CAPITOL
- id: aedes_iovis_capitolini
  latin: Aedes Iovis Optimi Maximi Capitolini
  english: Temple of Jupiter Optimus Maximus (Capitoline Temple)
  type: temple
  regio: 8
  model: temple_tuscan_archaic
  bearing_deg: 206.5  # unverified
  footprint_m: {length: 61.42, width: 56.98}
  podium_m: 4.5
  phases: [{from: -83, state: burnt}, {from: -78, state: building}, {from: -69, state: standing, model: temple_tuscan_restored}]
  geometry_source: "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus, Aedes (read: fronted south, main axis 26.5 deg east of the N-S line, stylobate c. 55 x 60 m, 56.98 x 61.42 m with its facing after Paribeni, podium 4-5 m, cella 27.81 m square, hexastyle with three rows of columns in front; Dion. Hal. 4.61 perimeter 800 ft); Vitr. 3.3.5"
  geometry_note: "Platner says the axis deviates '26.5 degrees to the east of the north and south line'; read as the north end swung east, so the south front faces 206.5 (SSW). If the other reading is right the front faces 153.5. Height not given: the kit proportions (Vitr. 4.7) are used."
  geometry_unverified: [bearing_deg, height_m]
  lat: 41.8929
  lon: 12.4827
  precision: approx
  location: Capitol, southern summit (Capitolium); under Palazzo dei Conservatori / Caffarelli
  built: {year: -509, certainty: traditional, by: "vowed by Tarquinius Priscus, built by Tarquinius Superbus; dedicated by the consul M. Horatius (Livy 2.8.6; Polybius 3.22.1 dates the first treaty to the year after, so the Republic already had the temple)"}
  events:
  - {year: -83, what: "burned down 6 July 83 BC (Cic. Cat. 3.9; Tac. Hist. 3.72)"}
  - {year: -78, what: "rebuilding begun under Sulla, completed by Q. Lutatius Catulus (Plut. Publicola 15); same plan on a larger scale, with columns taken from the Olympieion at Athens"}
  - {year: -69, what: "dedicated by Q. Lutatius Catulus (Tac. Hist. 3.72; Cic. Verr. 2.4.69)"}
  form: "Tuscan temple on a very large podium, about 55 x 60 m, three cellae (Jupiter, Juno, Minerva), deep pronaos with three rows of columns; terracotta decoration and quadriga by Vulca of Veii in the first temple"
  materials: [tufa (cappellaccio) podium, timber superstructure, terracotta; marble columns in the Catulus phase]
  sources: ["Livy 2.8.6", "Polybius 3.22", "Dion. Hal. 4.61", "Tac. Hist. 3.72", "Plut. Publicola 15", "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus, Aedes"]
  pleiades: null
