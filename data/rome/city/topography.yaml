    blend: 45
    note: "the arena floor of the Vallis Murcia, 621 x 118 m (Dion. Hal. 3.68) plus the seating margins, kept level (the real floor fell a little toward the Tiber; the valley floor is 10.5-13 m here)"
    sources: ["Dion. Hal. 3.68 (read, monuments.yaml)", "Platner-Ashby s.v. Circus Maximus (read on LacusCurtius, U2)"]
  # STREET CUTS: every street in streets.yaml is cut into the ground with a smoothed profile
  # (a hill road becomes a ramp notched into the slope; a `stairs` street keeps its slope).
  street_cuts: {shoulder_m: 2.0, blend_m: 9.0, smooth_m: 36.0, max_gradient: 0.16}
  # GROVES and gardens inside the city (trees the sources place), each a disc: kinds are pine
  # (umbrella pine), cypress, plane, olive, fig, oak, laurel; `from` = first year (null: always).
  groves:
  - {id: inter_duos_lucos, lat: 41.8940, lon: 12.4840, radius: 45, density: 1.0, mix: {oak: 4, laurel: 2}, from: null, sources: ["Livy 1.8.5: the Asylum 'inter duos lucos', the two groves on the Capitoline saddle # unverified, not re-read", "Platner-Ashby s.v. Asylum # unverified"]}
  - {id: ficus_olea_vitis, lat: 41.8925, lon: 12.4851, radius: 7, density: 1.0, mix: {fig: 1, olive: 1}, from: null, sources: ["Pliny NH 15.77-78: a fig, an olive and a vine in the middle of the Forum by the Lacus Curtius # unverified, from memory"]}
  - {id: ficus_ruminalis, lat: 41.8927, lon: 12.4850, radius: 4, density: 1.0, mix: {fig: 1}, from: null, sources: ["Pliny NH 15.77 (the Ficus Ruminalis in the Comitium), Tac. Ann. 13.58 # unverified, from memory"]}
  - {id: lucus_vestae, lat: 41.8912, lon: 12.4865, radius: 35, density: 0.8, mix: {oak: 3, laurel: 2}, from: null, sources: ["Cic. Div. 1.101 (the lucus Vestae below the Nova Via), P-A s.v. Nova Via (read, streets.yaml)"]}
  - {id: porticus_pompeiana_planes, lat: 41.8953, lon: 12.4750, radius: 60, density: 0.9, mix: {plane: 1}, from: -55, grid: 14, sources: ["Propertius 2.32.11-16: the plane trees of Pompey's portico # unverified, from memory"]}
  - {id: horti_lucullani, lat: 41.9087, lon: 12.4825, radius: 260, density: 0.6, mix: {cypress: 3, pine: 3, plane: 2, laurel: 2}, from: -60, sources: ["Platner-Ashby s.v. Horti Lucullani (read on LacusCurtius, U2)"]}
  - {id: horti_sallustiani, lat: 41.9095, lon: 12.4950, radius: 260, density: 0.6, mix: {cypress: 3, pine: 3, plane: 2, laurel: 2}, from: -40, sources: ["Platner-Ashby s.v. Horti Sallustiani # unverified, not read"]}
  - {id: horti_caesaris, lat: 41.8760, lon: 12.4660, radius: 300, density: 0.6, mix: {cypress: 2, pine: 3, plane: 3, olive: 2}, from: -60, sources: ["Platner-Ashby s.v. Horti Caesaris # unverified, not read"]}
