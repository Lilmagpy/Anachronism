    sources: ["Platner-Ashby s.v. Forum Romanum (read on LacusCurtius, U2)", "Platner-Ashby s.v. Sacra Via (read, streets.yaml)"]
  - id: forum_iulium
    polygon: [[41.89331, 12.48446], [41.8934, 12.48566], [41.89439, 12.48542], [41.8943, 12.48433]]
    level: [13.0, 13.0]
    blend: 20
    note: "the floor of Caesar's forum, a little above the Forum Romanum on the saddle toward the Quirinal; level # unverified"
