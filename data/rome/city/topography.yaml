# Topography of Rome. Heights are modern metres above sea level of the natural summit
# (ancient heights have not changed much on the summits, but valley floors have been raised
# by 5-15 m of later fill: ancient ground level in the Forum was about 10-11 m a.s.l.
# versus 14-16 m today). Coordinates are summit centres, WGS84, approx 100 m.
hills:
- id: capitolinus
  latin: Mons Capitolinus
  english: Capitoline Hill
  height_m: 46
  lat: 41.8934
  lon: 12.4828
  regio: 8
  summits: [{name: Capitolium, location: southern summit (temple of Jupiter), lat: 41.8929, lon: 12.4827}, {name: Arx, location: northern summit, lat: 41.8946, lon: 12.4833}, {name: Asylum, location: the saddle between them, lat: 41.8940, lon: 12.4840}]
  text: "Two summits joined by a saddle (the Intermontium). Steep cliffs to the south (Tarpeian Rock) and a long steep approach, the Clivus Capitolinus, from the Forum."
  sources: ["Livy 1.33; 5.47", "Platner-Ashby s.v. Capitolium; Arx"]
- id: palatinus
  latin: Mons Palatinus
  english: Palatine Hill
  height_m: 51
  lat: 41.8892
  lon: 12.4875
  regio: 10
  summits: [{name: Germalus, location: north-west spur (Cermalus), lat: 41.8895, lon: 12.4851}, {name: Palatium, location: main plateau, lat: 41.8892, lon: 12.4880}, {name: Velia, location: saddle toward the Esquiline, lat: 41.8908, lon: 12.4900}]
  text: "Traditional site of the first settlement of Romulus (Roma Quadrata); the Germalus is the western spur above the Velabrum; house of the aristocracy in the Late Republic."
  sources: ["Livy 1.7; Dion. Hal. 1.79", "Platner-Ashby s.v. Palatium"]
- id: aventinus
  latin: Mons Aventinus
  english: Aventine Hill
  height_m: 46
  lat: 41.8825
  lon: 12.4825
  regio: 13
  summits: [{name: Aventinus Maior, location: north-west knob, lat: 41.8840, lon: 12.4790}, {name: Aventinus Minor, location: south-east knob, lat: 41.8800, lon: 12.4860}]
  text: "Plebeian hill, outside the pomerium until Claudius (AD 49); the secessions of the plebs went to the Aventine or Sacred Mount (Livy 3.50, 3.54)."
  sources: ["Livy 3.50", "Platner-Ashby s.v. Aventinus"]
- id: caelius
  latin: Mons Caelius
  english: Caelian Hill
  height_m: 50
  lat: 41.8855
  lon: 12.4962
  regio: 2
  text: "Elongated spur east of the Palatine, enclosed by the Servian Wall (Porta Caelimontana); said to be settled by Alba refugees (Livy 1.30)."
  sources: ["Livy 1.30", "Platner-Ashby s.v. Caelius Mons"]
- id: esquilinus
  latin: Mons Esquilinus
  english: Esquiline Hill
  height_m: 60
  lat: 41.8930
  lon: 12.5000
  regio: 5
  summits: [{name: Oppius, location: south-western spur (Domus Aurea area), lat: 41.8905, lon: 12.4950}, {name: Cispius, location: northern spur (S. Maria Maggiore), lat: 41.8975, lon: 12.4985}, {name: Fagutal, location: western arm, lat: 41.8918, lon: 12.4945}]
  text: "Largest of the hills; the Servian agger runs across its east side; necropolis for the poor in the plain outside the Porta Esquilina until Maecenas' gardens in the 30s BC."
  sources: ["Varro LL 5.50", "Platner-Ashby s.v. Esquiliae"]
- id: viminalis
  latin: Mons Viminalis
  english: Viminal Hill
  height_m: 57
  lat: 41.9005
  lon: 12.4965
  regio: 6
  text: "Narrow spur between Quirinal and Esquiline, crossed by the Servian agger."
  sources: ["Varro LL 5.51", "Platner-Ashby s.v. Viminalis"]
- id: quirinalis
  latin: Mons Quirinalis
  english: Quirinal Hill
  height_m: 61
  lat: 41.9030
  lon: 12.4895
  regio: 6
  text: "Highest of the traditional seven hills; Sabine (Quirinus, Fides, Salus) settlement; north-east end the Colline Gate."
  sources: ["Varro LL 5.51", "Livy 1.44", "Platner-Ashby s.v. Quirinalis"]
other_heights:
- {id: pincius, latin: Collis Hortulorum, english: Pincian Hill, height_m: 63, lat: 41.9100, lon: 12.4820, text: "Outside the Servian Wall; Gardens of Lucullus and Sallustius (late Republic).", sources: ["Platner-Ashby s.v. Horti Lucullani"]}
- {id: ianiculum, latin: Ianiculum, english: Janiculum, height_m: 82, lat: 41.8890, lon: 12.4610, text: "Ridge across the Tiber, a fort of Ancus Marcius (Livy 1.33.6); military flag raised during comitia centuriata.", sources: ["Livy 1.33.6", "Platner-Ashby s.v. Ianiculum"]}
- {id: vaticanus, latin: Mons Vaticanus, english: Vatican Hill, height_m: 75, lat: 41.9030, lon: 12.4530, text: "North of the Janiculum, outside the city; fields of the Tiber plain.", sources: ["Platner-Ashby s.v. Vaticanus Mons"]}
valleys:
- id: forum_valley
  latin: Forum Romanum
  english: Forum valley
  lat: 41.8925
  lon: 12.4853
  floor_m: 11
  text: "Marshy valley between the Capitol, Palatine, Velia and Quirinal spur, drained by the Cloaca Maxima and paved from about 600 BC; the ancient ground is 4-5 m below present level."
  sources: ["Livy 1.38.6", "Dion. Hal. 3.67", "Platner-Ashby s.v. Forum Romanum"]
- id: velabrum
  latin: Velabrum
  english: Velabrum
  lat: 41.8905
  lon: 12.4830
  floor_m: 10
  text: "Low marshy ground between the Capitol, Palatine and the Forum Boarium; flooded by the Tiber until the Cloaca Maxima drained it; the Vicus Tuscus ran through it; one of the oldest market places."
  sources: ["Varro LL 5.43-44", "Platner-Ashby s.v. Velabrum"]
- id: vallis_murcia
  latin: Vallis Murcia
  english: Valley of Murcia (Circus Maximus)
  lat: 41.8861
  lon: 12.4851
  floor_m: 12
  text: "Long valley between the Palatine and Aventine; site of the Circus Maximus, with the Murtia/Murcia stream."
  sources: ["Livy 1.35.8", "Platner-Ashby s.v. Circus Maximus"]
- id: subura_argiletum
  latin: Subura / Argiletum
  english: Subura valley
  lat: 41.8955
  lon: 12.4905
  floor_m: 18
  text: "Low district between the Viminal, Esquiline and Capitol-Forum; crowded; Argiletum road to the Forum."
  sources: ["Varro LL 5.48", "Platner-Ashby s.v. Subura"]
tiber:
  latin: Tiberis
  english: Tiber
  lat: 41.8900
  lon: 12.4770
  width_m: 60
  text: "River 60-90 m wide through the city, flowing north to south then west; the Tiber Island and fords at the Forum Boarium; the Pons Sublicius is the earliest crossing; floods regular (Livy 7.3.2; 24.9.6; 35.9.2). Floodplain (Campus Martius, Forum Boarium, Forum Holitorium) lay 2-6 m above normal water. Harbour at the Emporium (193 BC)."
  sources: ["Livy 1.4", "Livy 7.3.2", "Livy 35.9.2", "Platner-Ashby s.v. Tiberis"]
  island: {latin: Insula Tiberina, lat: 41.8900, lon: 12.4775, length_m: 270, width_m: 67, channel_east_m: 62, channel_west_m: 48}   # channels = the bridges that span them: Pons Fabricius 62 m (P-A s.v. Pons Fabricius, read, monuments.yaml), Pons Cestius 48 m (P-A s.v. Pons Cestius, read, monuments.yaml)
  course: [[41.9335,12.4668],[41.9200,12.4672],[41.9060,12.4690],[41.9045,12.4675],[41.9026,12.4655],[41.9012,12.4630],[41.8990,12.4645],[41.8975,12.4665],[41.8955,12.4685],[41.8933,12.4707],[41.8915,12.4745],[41.8905,12.4772],[41.8885,12.4783],[41.8830,12.4772],[41.8770,12.4760],[41.8700,12.4720]]
  # U2: points 3-10 added to show the great westward bend round the Campus Martius (Platner-Ashby
  # s.v. Campus Martius: the plain lies "between the Capitoline, Quirinal, Pincian and the Tiber").
  # Positions are read off the modern river at its bridges (Ponte Cavour, Sant'Angelo, Vittorio
  # Emanuele II, Mazzini, Sisto) as a proxy for the ancient bed; the Tiber has shifted in detail
  # and been embanked since (Platner-Ashby s.v. Tiberis). Accurate to ~50 m. # unverified
  surface_m: [6.2, 5.3]   # normal water level a.s.l. at the north and south end of the course
  surface_source: "Platner-Ashby s.v. Campus Martius: the plain was 10-15 m a.s.l. and 3-8 m above the Tiber, so the river stood at about 5-7 m"
  banks: {half_width_m: 45, bank_cut_m: 16, depth_m: 3.4}   # model choice: 90 m wide, the top of the 60-90 m in the text above (Platner-Ashby s.v. Tiberis); varies +-15% along the course
campus_martius:
  latin: Campus Martius
  english: Campus Martius
  lat: 41.9000
  lon: 12.4700
  floor_m: 12
  text: "Floodplain of the river bend west and north of the Capitol, about 2 km long; land of the Tarquins consecrated to Mars (Livy 2.5.2); muster, voting (Saepta), games, later monuments; frequently flooded (Livy 35.9.2)."
  sources: ["Livy 2.5.2", "Strabo 5.3.8", "Platner-Ashby s.v. Campus Martius"]

# U2 terrain model: how the heightfield is built (client/scripts/urbs/terrain.gd). Each hill is a
# ridge (a polyline of [lat, lon, height_a.s.l.]) whose height falls away from the crest between
# `core` metres (flat top) and `outer` metres (foot): a short gap makes a cliff, a long one a slope.
# Valleys are polylines [lat, lon, ancient_floor] flattened to their floor inside `core` and
# blended back to the hills by `outer`. The heights of the summits come from the entries above;
# crest lengths and widths are fitted to the measurements quoted in the sources. The positions of
# the saddles and spurs are the modeller's reading of the sources, not surveyed data.
terrain_model:
  ridges:
  - id: capitol_quirinal
    soft: true   # rounded flanks (a long slope, no cliff)
    pts: [[41.8953,12.4842,38],[41.8985,12.4870,45],[41.9030,12.4895,61],[41.9065,12.4935,60],[41.9085,12.5000,55]]
    core: 80
    outer: 190
    note: "The Quirinal is a narrow irregular tongue a little over 2 km long from the Porta Collina to the Collis Latiaris, sloping off more gradually on the north and west to the Campus Martius; highest point in the Royal Gardens area; a fairly deep depression joined it to the Capitol until Trajan's excavations"
    sources: ["Platner-Ashby s.v. Quirinalis Collis (read on LacusCurtius)"]
  - id: viminalis
    soft: true
    pts: [[41.9000,12.4935,50],[41.9012,12.4975,57],[41.9022,12.5010,55]]
    core: 70
    outer: 110
    note: "Tongue about 700 m long, area about 24 ha, height 50-57 m (originally somewhat higher), extending south-west from the Esquiline plateau; separated from the Cispius by the valley of the Vicus Patricius and from the Quirinal by the depression of the Via Nazionale; named for its osiers"
    sources: ["Platner-Ashby s.v. Viminalis Collis (read on LacusCurtius)", "Varro LL 5.51"]
  - id: esquilinus
    soft: true
    pts: [[41.8905,12.4950,54],[41.8925,12.4975,58],[41.8932,12.5020,60],[41.8932,12.5100,62]]
    core: 90
    outer: 220
    note: "Oppius and Cispius are the two projections of the high eastern ground (Esquiliae, the older name); well wooded at first (groves Fagutalis, Mefitis, Esquilinus, Lucinae); crest positions are the modeller's reading # unverified"
    sources: ["Platner-Ashby s.v. Esquiliae (read on LacusCurtius)", "Varro LL 5.50"]
  - id: cispius
    soft: true
    pts: [[41.8932,12.5000,60],[41.8975,12.4985,60],[41.9000,12.4995,58]]
    core: 60
    outer: 160
    note: "Northern projection of the Esquiline (S. Maria Maggiore), parted from the Viminal by the valley of the Vicus Patricius; position # unverified"
    sources: ["Platner-Ashby s.v. Esquiliae (read on LacusCurtius)"]
  - id: caelius
    soft: true
    pts: [[41.8838,12.4905,48],[41.8855,12.4962,50],[41.8875,12.5050,52],[41.8900,12.5150,55]]
    core: 90
    outer: 190
    note: "Tongue about 2 km long and 400-500 m wide stretching west from the eastern plateau, ending in two promontories (Caeliolus in the east, SS. Giovanni e Paolo in the west)"
    sources: ["Platner-Ashby s.v. Caelius Mons (read on LacusCurtius)"]
  - id: pincius
    soft: true
    pts: [[41.9110,12.4900,60],[41.9118,12.4820,62],[41.9140,12.4790,58],[41.9185,12.4800,56]]
    core: 80
    outer: 200
    note: "Collis Hortulorum: runs west from the Porta Salaria, NNW from the Porta Pinciana to the Muro Torto and west again to the Porta Flaminia, divided from the Quirinal by the valley of the Horti Sallustiani; the substructions of the Horti Lucullani altered its contour (late Republic). Crest heights 56-62 m are modern, # unverified for 509-27 BC"
    sources: ["Platner-Ashby s.v. Pincius Mons (read on LacusCurtius)", "Platner-Ashby s.v. Horti Lucullani"]
  - id: ianiculum
    soft: true
    pts: [[41.8800,12.4660,48],[41.8855,12.4635,69],[41.8880,12.4610,82],[41.8920,12.4610,80],[41.8985,12.4585,66],[41.9020,12.4580,48],[41.9030,12.4551,60],[41.9100,12.4560,75]]
    core: 90
    outer: 260
    note: "Long ridge on the right bank running almost due north from opposite the Aventine, 60-70 m above the Campus Martius on average; 82 m at the Porta Aurelia (S. Pancrazio), 69 m west of S. Pietro in Montorio; the Janiculum proper is the 2 km south of S. Spirito, where the ridge comes within 100 m of the river; not continuous in the north (Vatican). Heights as quoted; crest positions are the modeller's reading # unverified"
    sources: ["Platner-Ashby s.v. Ianiculum (read on LacusCurtius, page Janiculum.html)", "Livy 1.33.6"]
  - id: velia
    soft: true
    pts: [[41.89057, 12.48892, 30], [41.8905, 12.4905, 31], [41.8905, 12.49206, 38], [41.8905, 12.495, 54]]
    core: 30
    outer: 110
    note: "U8: the Velia, the narrow ridge joining the Palatine's north-east corner to the Oppius; the Sacra via crosses its summit (P-A s.v. Sacra Via: c. 27 m a.s.l. at the Clivus Palatinus junction, 27.6 m) and the Nova Via leaves it at 32.30 m (P-A s.v. Nova Via). Heights fitted to those excavated pavements; the crest line is the modeller's reading # unverified"
    sources: ["Platner-Ashby s.v. Sacra Via (read earlier, streets.yaml)", "Platner-Ashby s.v. Nova Via (read earlier, streets.yaml)", "Platner-Ashby s.v. Palatinus Mons (read on LacusCurtius): joined to the Esquiline only by the narrow ridge of the Velia"]
  valleys:
  - id: forum_valley
    pts: [[41.8925,12.4838,10.0],[41.8925,12.4870,10.0],[41.8913,12.4895,13]]
    core: 45
    outer: 110
    note: "ancient floor about 10 m a.s.l. (modern 14-16); the valley centre 'was originally a swamp' (traces of man at 3.6 m, burials at 6-7 m a.s.l. in the excavations)"
    sources: ["Platner-Ashby s.v. Forum Romanum (read on LacusCurtius)", "Ovid Fasti 6.401-2"]
  - id: velabrum
    pts: [[41.8925,12.4838,10.0],[41.8905,12.4830,9.8],[41.8895,12.4800,9.2],[41.8890,12.4782,8.5]]
    core: 55
    outer: 120
    note: "between the Palatine's NW slope and the Capitoline, running to the river; the Forum valley's continuation, once marshy"
    sources: ["Platner-Ashby s.v. Velabrum (read on LacusCurtius)"]
  - id: vallis_murcia
    pts: [[41.8885,12.4825,10.5],[41.8861,12.4853,12],[41.8838,12.4880,13],[41.8815,12.4930,16]]
    core: 65
    outer: 130
    note: "600 m long and 150 m wide, between Palatine and Aventine (Circus Maximus); a stream through it"
    sources: ["Platner-Ashby s.v. Circus Maximus (read on LacusCurtius)"]
  - id: subura
    pts: [[41.8935,12.4865,12],[41.8955,12.4905,18],[41.8970,12.4940,24]]
    core: 40
    outer: 90
    note: "Argiletum and Subura, the low ground between Capitol-Quirinal and Esquiline"
    sources: ["Varro LL 5.48", "Platner-Ashby s.v. Subura"]
  - id: via_nazionale
    pts: [[41.8970,12.4940,24],[41.9005,12.4950,34],[41.9035,12.4975,44]]
    core: 25
    outer: 70
    note: "the depression between Quirinal and Viminal (now the Via Nazionale); the floor rises from the Subura; levels are the modeller's reading # unverified"
    sources: ["Platner-Ashby s.v. Viminalis Collis and Quirinalis Collis (read on LacusCurtius)"]
  plains:
  - id: campus_martius
    pts: [[41.8940,12.4800,12.5],[41.9000,12.4772,12],[41.9060,12.4762,13],[41.9115,12.4765,14]]
    core: 380
    outer: 700
    note: "level ground 10-15 m a.s.l. (13-20 now), 3-8 m above the Tiber, a little under 2 km wide between the Quirinal and the river, with ponds and streams (not modelled)"
    sources: ["Platner-Ashby s.v. Campus Martius (read on LacusCurtius)"]
  # U8 site model (client/scripts/urbs/terrain.gd, site.gd). The three cliff hills are PLATEAUS:
  # a polygon outline with the height a.s.l. at each vertex, interior `peaks` [lat, lon, height]
  # (summits and saddles), and a `flank` width in metres over which the top falls to the ground
  # round it; `shape: cliff` keeps the top edge sharp with a talus foot, `shape: slope` is an even
  # hillside. Outlines are the modeller's reading of the modern plan minus the known fill;
  # the heights come from the entries above and from the excavated pavements quoted in
  # streets.yaml (Nova Via 23.40 m behind the Atrium Vestae, 32.30 m at the Clivus Palatinus;
  # Sacra Via 27.6 m at the Clivus Palatinus junction; Forum floor about 10 m).
  plateaus:
  - id: capitolinus
    outline: [[41.892, 12.4815, 38], [41.89286, 12.48114, 42], [41.89385, 12.48156, 42], [41.89502, 12.48228, 42], [41.89538, 12.48325, 40], [41.89497, 12.48361, 38], [41.89403, 12.48433, 36], [41.89304, 12.48373, 34], [41.89241, 12.48289, 40]]
    peaks: [[41.89259, 12.48216, 45], [41.8946, 12.4833, 46], [41.894, 12.4838, 37]]
    flank: 60
    shape: cliff
    note: "460 x 180 m NE-SW, two summits (Capitolium SW, Arx NE) with the saddle of the Asylum between them at about 37 m; steep cliffs all round except toward the Forum, where the Tabularium fills the slope; the Tarpeian rock at the SW. Outline # unverified (modeller's reading of the modern plan)"
    sources: ["Platner-Ashby s.v. Capitolinus Mons (read on LacusCurtius, U2)", "Platner-Ashby s.v. Tabularium (read, monuments.yaml)", "Livy 1.8.5 (the Asylum inter duos lucos) # unverified, not re-read"]
  - id: palatinus
    outline: [[41.89039, 12.4845, 45], [41.8905, 12.486, 42], [41.8903, 12.488, 42], [41.89057, 12.48892, 36], [41.889, 12.4895, 45], [41.8876, 12.4885, 46], [41.8876, 12.486, 47], [41.8885, 12.484, 47], [41.8898, 12.4838, 47]]
    peaks: [[41.8892, 12.488, 51], [41.8889, 12.48602, 49], [41.88953, 12.48506, 48]]
    flank: 90
    shape: slope
    note: "irregular quadrilateral, highest point 51.20 m; the north flank over the Forum is an even slope (Nova Via pavement at 23.40 m half-way up, P-A s.v. Nova Via), the west (Cermalus) and south (Circus) sides steeper; the Velia leaves the NE corner. Outline # unverified (modeller's reading)"
    sources: ["Platner-Ashby s.v. Palatinus Mons (read on LacusCurtius, U2)", "Platner-Ashby s.v. Nova Via (read, streets.yaml)"]
  - id: aventinus
    outline: [[41.8848, 12.4793, 42], [41.8849, 12.482, 42], [41.8842, 12.48481, 41], [41.8825, 12.486, 38], [41.88, 12.4875, 41], [41.879, 12.48551, 40], [41.88, 12.48299, 41], [41.882, 12.479, 43]]
    peaks: [[41.8835, 12.48108, 46], [41.88026, 12.48651, 43], [41.88233, 12.48433, 38]]
    flank: 80
    shape: cliff
    note: "two knobs (Aventinus Maior NW 46 m, Minor SE 43 m) with a saddle; steep towards the river and the Circus, whose seats lay against its foot. Outline # unverified (P-A s.v. Aventinus Mons could not be fetched)"
    sources: ["Livy 3.50", "Platner-Ashby s.v. Circus Maximus (read on LacusCurtius, U2): the valley 600 x 150 m between Palatine and Aventine"]
  # PLATFORMS: polygons carved flat (the built floors), `level` in metres a.s.l. (two values =
  # a gradient from the first to the last vertex in x), blended into the ground over `blend` m.
  platforms:
  - id: forum_romanum
    polygon: [[41.89317, 12.48379], [41.89174, 12.48379], [41.8916, 12.48482], [41.89115, 12.48578], [41.89115, 12.48711], [41.89196, 12.48735], [41.89277, 12.48687], [41.89317, 12.48602], [41.89349, 12.48554], [41.89349, 12.48458]]
