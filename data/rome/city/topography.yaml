  # QUAYS: stretches of the Tiber bank built up in stone (steps to the water), by distance along
  # the river's course measured from the Pons Aemilius (negative = upstream) and bank side.
  quays:
  - {id: emporium, from_m: 560, to_m: 1110, side: left, from: -174, rise_m: 4.5, sources: ["Livy 41.27.8 (174 BC: the censors paved the Emporium with stone, fenced it and built steps down to the Tiber) # unverified, not re-read", "Platner-Ashby s.v. Emporium # unverified"]}
  - {id: insula_revetment, from_m: 0, to_m: 0, side: island, from: null, rise_m: 3.4, sources: ["Platner-Ashby s.v. Insula Tiberina: the travertine facing in the form of a ship is of the 1st century BC # unverified"]}
  # Trees and scrub, only on the outer ground (never in the built-up centre). Each wood is a disc
  # (centre, radius in metres) with a density (candidates per 100 m^2) and a mix of kinds (oak,
  # pine = umbrella pine, cypress, scrub). The list is the modeller's choice of where the ground was
  # open or wooded; only the Esquiline groves and the Caelian oak name are attested.
  woods:
  - {id: esquiline_groves, lat: 41.8960, lon: 12.5030, radius: 800, density: 0.9, mix: {oak: 5, scrub: 3, cypress: 1}, sources: ["Platner-Ashby s.v. Esquiliae: well wooded at first, groves Fagutalis, Mefitis, Esquilinus, Lucinae (read on LacusCurtius)"]}
