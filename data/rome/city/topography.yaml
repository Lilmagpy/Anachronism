    level: [42.0, 42.0]
    blend: 25
    note: "the terrace of the temple of Jupiter on the Capitolium summit; level set 4 m below the summit figure so the 4-5 m podium (P-A s.v. Iuppiter Optimus Maximus) stands clear. Extent # unverified"
    sources: ["Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus, Aedes (read, monuments.yaml)", "Platner-Ashby s.v. Area Capitolina # unverified, not read"]
  - id: circus_maximus
    polygon: [[41.88848, 12.48358], [41.88442, 12.48922], [41.88333, 12.48782], [41.88739, 12.48217]]
