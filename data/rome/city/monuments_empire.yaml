- id: horologium_augusti
  latin: Horologium Augusti
  english: Sundial (Horologium) of Augustus and its obelisk
  type: obelisk
  regio: 9
  lat: 41.9010
  lon: 12.4790
  precision: approx
  location: Campus Martius, around Piazza di Montecitorio and Via del Campo Marzio; the obelisk now stands in Piazza di Montecitorio
  built: {year: -10, certainty: probable, by: "Augustus; obelisk of Psammetichus II brought from Heliopolis and set up in the Campus Martius as a gnomon, 10 BC (Pliny NH 36.71-73; Res Gestae 'consecrated to the Sun' after Egypt's annexation; Gellius 5.? doubtful)"}
  events:
  - {year: 9, what: "Pliny notes (NH 36.72-73) that the shadow no longer fell correctly 'for thirty years' - already faulty in Pliny's time; Domitian restored it (Hierosolymitan inscription?) - unverified"}
  form: "obelisk about 21.8 m high on a bronze-lettered meridian, with a pavement of bronze lines and Greek letters"
  footprint_m: {length: 160, width: 75}
  bearing_deg: null
  height_m: 21.8
  model: obelisk
  sources: ["Pliny NH 36.71-73", "Res Gestae 12? # unverified", "Platner-Ashby s.v. Horologium Augusti"]
  verified: false
  pleiades: null
  notes: "Whether the meridian really worked as a sundial (Buchner 1982) vs. a monument alone is contested; the 160 x 75 m size and the Ara Pacis alignment are Buchner's reconstruction - unverified. Event line on Domitian flagged unverified."
