  english: Temple of Mars Ultor
  type: temple
  regio: 8
  lat: 41.8943
  lon: 12.4869
  precision: approx
  location: North-east end of the Forum of Augustus, backing on the Subura firewall
  built: {year: -2, certainty: certain, by: "Augustus, vowed at Philippi 42 BC for vengeance on his father's murderers (Suet. Aug. 29.2; Ov. Fast. 5.569-578); work long delayed (Macrob. Sat. 2.4.9); dedicated 1 August 2 BC (Dio 55.10; Vell. 2.100)"}
  events:
