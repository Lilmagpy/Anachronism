  pleiades: null
  notes: "Dimensions from memory (podium ~ 3.5 m high); unverified. Front faces south-west into the forum (bearing_deg is the direction the front faces)."
- id: aedes_apollinis_palatini_empire
  republican_id: aedes_apollinis_palatini
  latin: Aedes Apollinis Palatini
  english: Temple of Apollo on the Palatine
  type: temple
  regio: 10
  lat: 41.8887
  lon: 12.4872
  precision: rough
  location: Palatine, next to Augustus' house; its identification with the podium by the Casa di Livia / the 'Area Apollinis' is debated
  built: {year: -28, certainty: certain, by: "Augustus; vowed 36 BC after Naulochus, dedicated 9 October 28 BC (Res Gestae 19; Suet. Aug. 29; Dio 53.1.3; Vell. 2.81)"}
  events:
  - {year: -28, what: "dedication with library (Greek and Latin) in the adjoining porticus with statues of the Danaids (Suet. Aug. 29; Prop. 2.31)"}
  - {year: 3, what: "burned? A fire on the Palatine in AD 3 destroyed the house of Augustus' neighbour; Augustus's own house burned 3 AD (Dio 55.12.4-5) - not the temple; the Sibylline books were later placed in the base of the statue (Suet. Aug. 31)"}
  form: "temple of Luna marble with quadriga on the roof, doors of ivory; porticus with 50 columns of African marble (Prop. 2.31)"
  footprint_m: null
  bearing_deg: null
  height_m: null
  model: temple_hexastyle
  sources: ["Res Gestae 19", "Suet. Aug. 29", "Dio 53.1.3", "Prop. 2.31", "Platner-Ashby s.v. Apollo Palatinus, Aedes"]
  verified: false
  pleiades: null
  notes: "Site contested (Carettoni's 1960s excavation near the Casa di Livia vs. the podium NE of the Domus Augustana); the 3 AD fire entry is doubtful - check Dio 55.12 before use."
