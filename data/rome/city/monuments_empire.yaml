# Monuments of Rome 27 BC - AD 120 (Augustus to Hadrian's accession years). Format: README.md,
# plus per entry: footprint_m {length, width} or {radius}; bearing_deg (compass bearing of the
# long axis / front, degrees clockwise from north, null if not known); height_m; model (form key
# for the client: temple_hexastyle, temple_octastyle, temple_round, basilica, forum, portico,
# theatre, amphitheatre, baths, arch, column, mausoleum, obelisk, bridge, aqueduct, horrea,
# insula, domus, palace, camp, stadium, odeum, market, colossus, fire, ...).
#
# PROVENANCE WARNING (read this). The session that wrote this file had NO network access to
# LacusCurtius, Perseus or Pleiades (egress proxy refused penelope.uchicago.edu, pleiades.stoa.org).
# Every entry was therefore written from memory of the sources and NONE of the passage numbers
# was re-read. Every entry carries `verified: false`. `pleiades` is null everywhere: ids were
# not looked up and none was guessed. Coordinates are from memory of the identified remains
# (Colosseum, Pantheon, fora, Mausoleum, Ara Pacis, Theatre of Marcellus ...) and are good to
# some tens of metres when precision is "exact"/"approx"; "rough" means the site itself is debated.
# Sizes and bearings are marked unverified in `notes` where they are especially doubtful.
# Entries that duplicate a Republican-file monument carry `republican_id`; their ids differ so
# that the two files can be merged without clashes.
# Out-of-range items (after AD 120) are included only where the task asked, with `beyond_range: true`.
monuments:
# ================================================================ AUGUSTAN FORA AND TEMPLES
- id: forum_augusti
  latin: Forum Augusti
  english: Forum of Augustus
  type: forum
  regio: 8
  lat: 41.8939
  lon: 12.4863
  precision: approx
  location: Between the Forum of Caesar and the Subura wall, north-east of the Forum Romanum; partly under Via dei Fori Imperiali
  built: {year: -2, certainty: certain, by: "Augustus; vowed at Philippi 42 BC, forum opened 2 BC with games (Suet. Aug. 29; Res Gestae 21; Dio 55.10.1-8)"}
  events:
  - {year: -2, what: "dedicated 1 August 2 BC with the temple of Mars Ultor; statues of the summi viri in the porticoes with elogia (Suet. Aug. 31, 29; Ovid Fasti 5.545-598)"}
  form: "colonnaded forum with two apsidal exedrae and a high firewall (travertine/peperino) at the rear against the Subura"
  materials: [Gabine stone and Luna marble, peperino firewall]
  footprint_m: {length: 125, width: 85}
  bearing_deg: 45
  height_m: 33
  model: forum
  sources: ["Suet. Aug. 29", "Suet. Aug. 31", "Res Gestae 21", "Dio 55.10", "Ovid Fasti 5.545-598", "Platner-Ashby s.v. Forum Augustum"]
  verified: false
  pleiades: null
  notes: "Size and bearing from memory of the plan (long axis NE-SW, temple at the NE end); unverified."
- id: aedes_martis_ultoris
