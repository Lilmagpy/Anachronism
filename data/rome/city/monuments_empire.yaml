  verified: true
  unverified_fields: [footprint_m, bearing_deg, height_m]
  pleiades: 823121346
  notes: "Column height, diameter and plan read in Platner-Ashby; temple length and width (35 x 23 m) and the 33 m height are from memory of modern reconstructions, not read. Platner-Ashby says the standards from the Parthians were usually supposed to have been kept here (Mon. Anc. 5.42). Pleiades 823121346 Temple of Mars Ultor."
