# Monuments of Rome 27 BC - AD 120 (Augustus to Hadrian's accession years). Format: README.md,
# plus per entry: footprint_m {length, width} or {radius}; bearing_deg (compass bearing of the
# long axis / front, degrees clockwise from north, null if not known); height_m; model (form key
# for the client: temple_hexastyle, temple_octastyle, temple_round, basilica, forum, portico,
# theatre, amphitheatre, baths, arch, column, mausoleum, obelisk, bridge, aqueduct, horrea,
# insula, domus, palace, camp, stadium, odeum, market, colossus, fire, ...).
#
# PROVENANCE WARNING (read this). The session that wrote this file had NO network access to
# LacusCurtius, Perseus or Pleiades (egress proxy refused penelope.uchicago.edu, pleiades.stoa.org).
# Every entry was therefore written from memory of the sources and NONE of the passage numbers
# was re-read. Every entry carries `verified: false`. `pleiades` is null everywhere: ids were
# not looked up and none was guessed. Coordinates are from memory of the identified remains
# (Colosseum, Pantheon, fora, Mausoleum, Ara Pacis, Theatre of Marcellus ...) and are good to
# some tens of metres when precision is "exact"/"approx"; "rough" means the site itself is debated.
# Sizes and bearings are marked unverified in `notes` where they are especially doubtful.
# Entries that duplicate a Republican-file monument carry `republican_id`; their ids differ so
# that the two files can be merged without clashes.
# Out-of-range items (after AD 120) are included only where the task asked, with `beyond_range: true`.
monuments:
# ================================================================ AUGUSTAN FORA AND TEMPLES
- id: forum_augusti
  latin: Forum Augusti
  english: Forum of Augustus
  type: forum
  regio: 8
  lat: 41.8942
  lon: 12.4866
  precision: approx
  location: Between the Forum of Caesar and the Subura wall, north-east of the Forum Romanum; partly under Via dei Fori Imperiali
  built: {year: -2, certainty: certain, by: "Augustus, with the proceeds of spoils (Mon. Anc. 4.21); the forum was hurried to opening before the temple was finished (Suet. Aug. 29.1); dedicated 1 August 2 BC (Dio 55.10; Vell. 2.100)"}
  events:
  - {year: -2, what: "Augustus placed bronze statues of the triumphatores from Aeneas down in the porticoes with name and cursus honorum (Suet. Aug. 31.1; Ov. Fast. 5.563-566; Dio 55.10.3); Augustus did not manage to buy all the land he wanted, hence the irregular NE end (Suet. Aug. 56.2)"}
  - {year: 19, what: "Tiberius set up two arches beside the temple for the victories of Drusus and Germanicus (Tac. Ann. 2.64; CIL VI 911)"}
  - {year: 120, what: "restored by Hadrian (HA Hadr. 19) - the date is only the reign, not a recorded year"}
  form: "rectangular forum about 125 x 90 m (Platner-Ashby) with an exedra on each long side and one at the NE end; huge firewall (peperino with travertine courses) shutting off the Subura; arched gateway (Arco dei Pantani) survives"
  materials: [peperino firewall with travertine courses, marble lining and stucco inside, wooden dowels (Plin. NH 16.191)]
  footprint_m: {length: 125, width: 90}
  bearing_deg: 45
  height_m: 33
  model: forum
  sources: ["Suet. Aug. 29.1", "Suet. Aug. 31.1", "Suet. Aug. 56.2", "Mon. Anc. 4.21", "Dio 55.10", "Vell. 2.100", "Tac. Ann. 2.64", "Plin. NH 36.102", "HA Hadr. 19", "Platner-Ashby s.v. Forum Augustum (read)"]
  verified: true
  unverified_fields: [bearing_deg, height_m]
  pleiades: 47606496
  notes: "Size, dates and sources read in Platner-Ashby. Bearing from modern plans (not in PA; axis NE-SW perpendicular to the Forum of Caesar). Ovid Fasti 5.551ff. may place a dedication on 12 May (Platner-Ashby notes the conflict). Pleiades 47606496 Forum Augusti (CC BY)."
- id: aedes_martis_ultoris
