# ================================================================ EVENTS ON REPUBLICAN BUILDINGS
events_on_republican:
# Each entry: {monument_id (an id in monuments.yaml), year, what, sources}. All read in Platner-Ashby (LacusCurtius) unless flagged.
- {monument_id: circus_maximus, year: -31, what: "a fire destroyed a considerable part of the circus (Dio 50.10.3, per Platner-Ashby)", sources: ["Dio 50.10.3", "Platner-Ashby s.v. Circus Maximus"]}
- {monument_id: circus_maximus, year: -10, what: "Augustus set up the obelisk of Heliopolis (Ramesses II, now in Piazza del Popolo) on the spina; he also built or restored the pulvinar on the Palatine side (Mon. Anc. 4.4)", sources: ["Plin. NH 36.71", "Amm. Marc. 17.4.12", "Mon. Anc. 4.4", "Platner-Ashby s.v. Circus Maximus"]}
- {monument_id: circus_maximus, year: 36, what: "the part of the circus on the Aventine side burned together with the Aventine; Tiberius paid the owners' losses (Tac. Ann. 6.45, read)", sources: ["Tac. Ann. 6.45", "Dio 58.26.5", "Platner-Ashby s.v. Circus Maximus"]}
- {monument_id: circus_maximus, year: null, what: "reign of Claudius (AD 41-54): Claudius built the starting gates (carceres) of marble instead of tufa and gilded goals instead of wooden metae (Suet. Claud. 21); the year is the reign's start, not recorded", sources: ["Suet. Claud. 21"]}
- {monument_id: circus_maximus, year: 64, what: "the Great Fire broke out in the shops on the Palatine/Caelian side of the circus and swept its full length (Tac. Ann. 15.38, read); Nero rebuilt it - the circus was in use in 68 (Suet. Nero 25; Dio 62.20-21)", sources: ["Tac. Ann. 15.38", "Suet. Nero 25", "Platner-Ashby s.v. Circus Maximus"]}
- {monument_id: circus_maximus, year: null, what: "reign of Domitian (AD 81-96): both long sides were injured by fire under Domitian (Suet. Dom. 5: the circus was later rebuilt with stone from his naumachia); the year of the fire is not recorded", sources: ["Suet. Dom. 5"]}
- {monument_id: circus_maximus, year: null, what: "reign of Trajan (AD 98-117): Trajan restored the circus with the stone of Domitian's naumachia and enlarged the cavea by two stadia in length (Paus. 5.12.6; Dio 68.7.2); Pliny Pan. 51 describes his removal of Domitian's private box. No year is recorded in the sources read", sources: ["Paus. 5.12.6", "Dio 68.7.2", "Plin. Pan. 51", "Platner-Ashby s.v. Circus Maximus"]}
- {monument_id: aedes_iovis_capitolini, year: 69, what: "burned when the Vitellians stormed the Capitol, 19 December AD 69 (Tac. Hist. 3.71-72; Suet. Vit. 15; Dio 64.17)", sources: ["Tac. Hist. 3.71-72", "Suet. Vit. 15", "Dio 64.17", "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus"]}
- {monument_id: aedes_iovis_capitolini, year: 70, what: "rebuilt by Vespasian on its original lines but higher (Tac. Hist. 4.4, 4.9, 4.53; Suet. Vesp. 8; Dio 65.7.10 in Cary numbering); Tac. Hist. 4.53 describes the foundation rites. Platner-Ashby gives no dedication year", sources: ["Tac. Hist. 4.53", "Suet. Vesp. 8", "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus"]}
- {monument_id: aedes_iovis_capitolini, year: 80, what: "burned again in AD 80 (Dio 66.24.2, read) and rebuilt by Domitian, work begun in 80, dedication probably in 82; hexastyle Corinthian, Pentelic marble columns, gilt roof tiles (Suet. Dom. 5; Plut. Publ. 15)", sources: ["Dio 66.24.2", "Suet. Dom. 5", "Plut. Publ. 15", "Platner-Ashby s.v. Iuppiter Optimus Maximus Capitolinus"]}
- {monument_id: rostra_republic, year: -29, what: "Augustus added the rostra of the temple of Divus Julius at the east end of the forum, the platform decorated with the beaks of the ships captured at Actium (Dio 51.19; Frontin. Aq. 129)", sources: ["Dio 51.19", "Platner-Ashby s.v. Iulius, Divus, aedes"]}
- {monument_id: aedes_castoris, year: 6, what: "completely rebuilt by Tiberius and dedicated in AD 6 in his own name and that of his brother Drusus (Suet. Tib. 20; Dio 55.27.4); later made the vestibule of Caligula's palace (Suet. Cal. 22)", sources: ["Suet. Tib. 20", "Dio 55.27.4", "Ov. Fast. 1.707-708", "Platner-Ashby s.v. Castor, Aedes"]}
- {monument_id: aedes_concordiae_forum, year: 10, what: "Tiberius began the restoration in 7 BC with spoils from Germany (Dio 55.8.2); the temple was dedicated as Concordia Augusta in the names of Tiberius and the dead Drusus on 16 January AD 10 (Ov. Fast. 1.640-648)", sources: ["Dio 55.8.2", "Ov. Fast. 1.640-648", "Platner-Ashby s.v. Concordia, Aedes"]}
- {monument_id: theatrum_pompei, year: 21, what: "burned in AD 21 (Jerome a. Abr. 2037) or 22 (Tac. Ann. 3.72); Tiberius took on the restoration but did not complete or dedicate it (Tac. Ann. 6.45, read; Suet. Tib. 47; Suet. Cal. 21); a bronze statue of Sejanus was set up in it (Dio 57.21.3)", sources: ["Tac. Ann. 3.72", "Tac. Ann. 6.45", "Suet. Tib. 47", "Dio 57.21.3", "Platner-Ashby s.v. Theatrum Pompei"]}
- {monument_id: theatrum_pompei, year: 80, what: "the scaena burned in AD 80 (Dio 66.24.2, read) but must have been repaired very soon (Platner-Ashby)", sources: ["Dio 66.24.2", "Platner-Ashby s.v. Theatrum Pompei"]}
- {monument_id: aedes_vestae, year: 64, what: "burned in the Great Fire, together with the Penates, but soon restored, probably by Nero (Tac. Ann. 15.41, read)", sources: ["Tac. Ann. 15.41", "Platner-Ashby s.v. Vesta, Aedes"]}
- {monument_id: aedes_vestae, year: 191, what: "burned again in 191 and restored by Julia Domna (Herodian 1.14.4; Dio 72.24) - beyond range", sources: ["Herodian 1.14.4", "Dio 72.24", "Platner-Ashby s.v. Vesta, Aedes"]}
