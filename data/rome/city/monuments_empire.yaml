  - {year: 59, what: "the Arval Brethren sacrificed here to Mars Ultor, Salus and the genius of the princeps (Act. Arv. 59, 69)"}
  form: "octastyle Corinthian temple, peripteral except at its NE end where it abuts the forum wall; Greek-marble columns 15.30 m high and 1.76 m in diameter (three stand); peperino cella lined with marble, nave and two aisles; octostyle front; cult statues of Mars and Venus (Ov. Fast. 5.551-568)"
