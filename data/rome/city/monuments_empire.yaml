  - {year: 59, what: "the Arval Brethren sacrificed here to Mars Ultor, Salus and the genius of the princeps (Act. Arv. 59, 69)"}
  form: "octastyle Corinthian temple, peripteral except at its NE end where it abuts the forum wall; Greek-marble columns 15.30 m high and 1.76 m in diameter (three stand); peperino cella lined with marble, nave and two aisles; octostyle front; cult statues of Mars and Venus (Ov. Fast. 5.551-568)"
  footprint_m: {length: 35, width: 23}
  bearing_deg: 225
  height_m: 33
  model: temple_octastyle
  sources: ["Suet. Aug. 29.2", "Dio 55.10", "Vell. 2.100", "Ov. Fast. 5.551-578", "Mon. Anc. 5.42", "Act. Arv. 59 and 69", "Platner-Ashby s.v. Forum Augustum (temple described in the same article)"]
  verified: true
  unverified_fields: [footprint_m, bearing_deg, height_m]
  pleiades: 823121346
  notes: "Column height, diameter and plan read in Platner-Ashby; temple length and width (35 x 23 m) and the 33 m height are from memory of modern reconstructions, not read. Platner-Ashby says the standards from the Parthians were usually supposed to have been kept here (Mon. Anc. 5.42). Pleiades 823121346 Temple of Mars Ultor."
