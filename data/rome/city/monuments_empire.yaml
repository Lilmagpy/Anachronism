  events:
  - {year: 80, what: "inaugural games lasted 100 days: 9,000 tame and wild animals killed (Dio 66.25.1); Suetonius says 5,000 beasts in a single day (Titus 7.3); sham sea fights were put on in the old naumachia, and Dio also describes the arena being flooded for a naval show"}
  - {year: 150, what: "changes or additions by Nerva and Trajan (CIL VI 32254); restored by Antoninus Pius (HA Pius 8) - beyond range"}
  - {year: 217, what: "struck by lightning (Dio 78.25); no combats until 222-223 - beyond range"}
  form: "elliptical amphitheatre, outer wall 188 m on the main axis (NW-SE per Platner-Ashby) and 156 m on the minor axis, 48.50 m high in four stories; the lower three are open arcades of 80 arches (76 numbered, 4 unnumbered entrances at the axis ends) with Doric, Ionic and Corinthian engaged half-columns; arena 86 x 54 m in Platner-Ashby (83 x 48 m in recent measurement); podium about 4 m above the arena"
  materials: [travertine facade and skeleton, peperino, tufa and concrete, brick facing, marble seats]
  footprint_m: {length: 188, width: 156}
  bearing_deg: 120
  height_m: 48.5
  model: amphitheatre
  sources: ["Suet. Vesp. 9", "Suet. Tit. 7", "Suet. Dom. 5", "Dio 66.25", "Dio 78.25", "Mart. Spect. 2", "Aur. Vict. Caes. 9.7", "Chronogr. a. 354", "HA Pius 8", "Platner-Ashby s.v. Amphitheatrum Flavium (read)"]
  verified: true
  unverified_fields: [bearing_deg, arena_axes]
  pleiades: 285857974
  notes: "Read in full: Platner-Ashby; Suet. Vesp. 9 and Tit. 7; Dio 66.24-25. Suetonius says only that Vespasian planned an amphitheatre in the heart of the city (Vesp. 9); the lake site comes from Martial Spect. 2 and Platner-Ashby. The start year (c. 70-72) is the task's figure and is not in Platner-Ashby. Bearing: Platner-Ashby says main axis NW-SE, which I have not converted to degrees from a map; 120 is a rough placeholder. Pleiades 285857974 Amphitheatrum Flavium (41.8903, 12.4923)."
