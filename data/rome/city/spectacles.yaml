# Spectacles of Rome: how each ran, with sources (task U6).
#
# READING STATUS (verification pass): every passage below marked as read was read in the text
# named here; a citation with "# unverified" on its line was NOT read and is from memory.
# Texts read (all public domain; paraphrased here):
#   Livy 1, 5, 6, 9, 10, 23, 25, 27, 29, 30, 31, 36, 39, 41, 45 and Cato De agri cultura,
#   Tertullian De spectaculis, Cicero Tusc. 2 and ND 2, Suetonius Domitian, Ovid Fasti 5:
#     Latin, thelatinlibrary.com
#   Dionysius of Halicarnassus Ant. Rom. 7 (Cary, Loeb 1945, archive.org), Plutarch Aemilius
#     Paulus / Camillus / C. Gracchus (Clough, Gutenberg), Josephus BJ 7 (Whiston, Gutenberg),
#     Appian Punica (White, 1899, archive.org), Gellius 14.7 (Beloe 1795, archive.org),
#     Pliny NH 7, 8, 18, 28 (Rackham/Jones, Loeb, archive.org), Dio 49 (Cary, Loeb).
# LacusCurtius/Penelope and Perseus were blocked by the session proxy. Not read: Valerius
# Maximus, Vitruvius, Suetonius Augustus, Tertullian Apologeticum, Dio 51, Martial, Juvenal,
# Cassiodorus, Festus, Servius, Cicero Div. / Sest. / Phil., Plutarch Quaest. Rom.
# Where the evidence is Imperial and the game is set 509-27 BC, the entry says so. Where
# scholars disagree, "disputed" says so. The animation scripts read only fields marked [anim].
version: 2

chariot_race:
  where: "Circus Maximus (monument id circus_maximus); the Circus Flaminius also held games"
  founding_note: "Livy 1.35.9 (read): Tarquinius Priscus marked out the Circus; horses and boxers from Etruria; the games became annual, called Roman or Great. Dion. Hal. 7.71 (read) gives a different origin: the Senate decreed the festival under the vow of the dictator A. Postumius before the battle with the Latins, with 500 minae of silver a year. The two accounts disagree."
  pompa:                                    # [anim] triumph.gd reuses the order for the pompa
    route: "from the Capitol, through the Forum, to the Circus Maximus, led by the principal magistrates"
    source: "Dion. Hal. 7.72.1 (read)"
    order:
      - "sons of the Romans nearing manhood, on horseback if their fathers were of knightly census, on foot (in divisions and companies) if destined for the infantry"
      - "charioteers: some driving four horses abreast, some two, others riding unyoked horses"
      - "contestants in the light and heavy games, naked but for a loincloth"
      - "dancers in three bands (men, youths, boys) with flute-players and seven-stringed ivory lyres, in scarlet tunics with bronze belts, swords and short spears; men with bronze helmets and crests"
      - "mimic dancers dressed as satyrs and sileni, mocking the others"
      - "lyre-players and many flute-players; bearers of censers with perfumes and incense burning along the route"
      - "bearers of the silver and gold show-vessels, sacred and public"
      - "last of all the images of the gods carried on men's shoulders"
    sacrifice_at_end: "after the procession the consuls and priests sacrificed oxen (see the sacrifice entry); then the games (Dion. Hal. 7.72.15-18, 7.73, read)"
  games_order: "Dion. Hal. 7.73 (read): first the race of four-horse chariots, two-horse chariots and unyoked horses; also the old custom of three-horse chariots with a trace-horse and of the apobatai, riders who leap down after the race and run the stadium; then footrace, boxing and wrestling; crowns and proclamations between events."
  start:                                    # [anim]
    carceres: 12
    carceres_source: "Livy 41.27.5-6 (read): in 174 BC the censors Q. Fulvius Flaccus and A. Postumius Albinus let contracts for 'carceres in circo' (and eggs, and metae; the text is damaged here). The count of twelve is the usual modern figure and is not in the passage."
    signal: "the presiding magistrate (editor) drops a cloth, the mappa; gates open together"
    signal_note: "disputed/thin for the Republic: the mappa story is attested later (Cassiod. Var. 3.51 is the usual cite)   # unverified"
  factions:                                 # [anim]
    - {name: albata, colour: white, rgb: [0.93, 0.93, 0.90], source: "Tertullian De spect. 9.5 (read)"}
    - {name: russata, colour: red, rgb: [0.80, 0.16, 0.14], source: "Tertullian De spect. 9.5 (read); Pliny NH 7.186 (read): at the funeral of Felix, charioteer of the Reds, a supporter threw himself on the pyre"}
    - {name: prasina, colour: green, rgb: [0.20, 0.55, 0.28], source: "Tertullian De spect. 9.5 (read)"}
    - {name: veneta, colour: blue, rgb: [0.20, 0.38, 0.75], source: "Tertullian De spect. 9.5 (read)"}
  factions_note: "Tertullian De spect. 9.5 (read): at first there were only two, white (for winter) and red (for summer); later red was dedicated to Mars and white to the Zephyrs, green to Mother Earth or spring, blue to Sky and Sea or autumn. Suetonius Dom. 7.1 (read): Domitian added two factions, gold and purple, to the four existing ones; so four colours stood by his day (AD 81-96). The date at which green and blue joined is disputed; the Republic's evidence is thin. Shown as four because the brief asks. Gold and purple are Domitian's and are not used."
  teams:
    quadriga: "four horses abreast"
    biga: "two horses"
    source: "Dion. Hal. 7.72.3 and 7.73.1 (read)"
  laps:                                     # [anim]
    count: 7
    count_source: "Suetonius Dom. 4.3 (read): to fit 100 races into one day of the Secular Games (AD 88) Domitian cut each race from seven laps (septena spatia) to five; so seven was the normal length by the Empire. The Republican figure is not read."
    counter_republic: "Livy 41.27.6 (read): 'oua ad notas curriculis numerandis', eggs to mark the laps, let by the censors of 174 BC"
    counter_dolphins: "Dio 49.43.2 (read): the aedile Agrippa (33 BC) set up the dolphins and egg-shaped objects because spectators miscounted the laps. Cary's footnote says one egg was removed and one dolphin moved after each lap; that detail is the translator's inference, not Dio's words. Tertullian De spect. 8.3 (read) mentions eggs (for the Castors) and dolphins (for Neptune) in the Circus of his day."
    direction: "anticlockwise round the spina, turns on the left; standard modern reading of the circus layout   # unverified"
    animation_note: "the animation tilts each egg down and darkens it when the leader completes a lap"
  metae:
    description: "three conical pillars at each end of the spina; the turn round them is the dangerous place   # unverified (modern description)"
    source: "Tertullian De spect. 5.7 and 8.6 (read) mention the metae (the altar of Consus lies underground by them) but not their form"
  crashes:
    term: "naufragium, a 'shipwreck'"
    note: "the term is quoted in the modern literature; ancient passage not identified   # unverified"
  races_per_day:
    republic: "unknown"
    imperial: "Suetonius Dom. 4.3 (read): 100 races in a day (centum missus) at Domitian's Secular Games, by shortening the race to five laps; a day of 24 is the usual modern figure for the Empire   # unverified"
    game_use: "the animation shows one race; the programme length is the engine's choice"
  horses: "Pliny NH 8.162-165 (read): horses are not put to racing in the Circus before the age of five."
  pulvinar:
    description: "the shrine-couch from which the gods' images and the presiding magistrate watched; on the Palatine side   # unverified"
    source: "Suet. Aug. 45 (Augustus and the pulvinar) # unverified; Livy 5.13 (lectisternium) # unverified"

munus:
  origin:
    - {year: -264, what: "first gladiators in Rome, three pairs in the Forum Boarium at the funeral of D. Junius Brutus Pera, given by his sons", source: "Livy Per. 16; Val. Max. 2.4.7   # unverified (not read)"}
    - {year: -216, what: "22 pairs of gladiators in the Forum for three days of funeral games, given by the three sons of M. Aemilius Lepidus (twice consul and augur)", source: "Livy 23.30.15 (read)"}
    - {year: -200, what: "25 pairs, four days of funeral games in the Forum for M. Valerius Laevinus by his sons P. and M.", source: "Livy 31.50.4 (read)"}
    - {year: -183, what: "at the funeral of P. Licinius Crassus, the pontifex maximus: a distribution of meat, 120 gladiators, three days of funeral games, then a banquet laid out in the whole Forum", source: "Livy 39.46.2 (read)"}
    - {year: -174, what: "T. Flamininus, for his father, four days of games with a distribution of meat, a banquet and plays; the gladiators fought for three days, 74 men", source: "Livy 41.28.11 (read)"}
    - {year: -176, what: "Antiochus IV's games in Syria included a Roman-style gladiatorial show, at first frightening to the unaccustomed, later made familiar, sometimes fought to wounds, sometimes without missio (without mercy)", source: "Livy 41.20.11-13 (read: text of liv.41 'gladiatorum munus, Romanae consuetudinis ... modo uolneribus tenus, modo sine missione')"}
  origin_nature: "a funeral duty (munus) owed to the dead, given privately by the heirs until the later Republic (Livy as above: all are funeral games)"
  where:
    republic: "in the Forum Romanum (Livy 23.30.15, 31.50.4, 39.46.2, read); Plut. C. Gracchus 12 (read): magistrates built seats round the Forum for a gladiator show to let them for hire; Gaius Gracchus had them removed the night before; Vitruvius 5.1.1 (oblong Forum made for gladiatorial shows) # unverified"
    amphitheatre: "first stone amphitheatre 29 BC, Statilius Taurus, Dio 51.23.1   # unverified"
  armatures:                                # [anim]
    - {name: samnis, arms: "oblong shield (scutum), crested helmet, sword; details of the kit from modern reconstructions   # unverified", source: "Livy 9.40.16-17 (read): after Papirius Cursor's triumph (310 BC) the captured Samnite arms, the gilded shields among them, were shown off; the Campanians armed their gladiators in that style at their banquets, from pride and hatred of the Samnites, and called them Samnites. Cic. Tusc. 2.41 (read) also has 'Samnis' as a gladiator."}
    - {name: gallus, arms: "large round shield, helmet, sword; later called murmillo   # unverified", source: "the name Gallus is Republican, murmillo is the later name. Cic. Phil. 3.31 (read) calls Antony 'ex myrmillone dux, ex gladiatore imperator' (43 BC): murmillo was a gladiator type by then."}
    - {name: thraex, arms: "small square shield (parmula), curved sword (sica), greaves   # unverified", source: "attested late Republic (Spartacus is called a Thracian); passage not read"}
  armatures_note: "retiarius, secutor and others are Imperial; not shown"
  people:
    editor: "the giver of the games (the heir), who decided the outcome: Cic. Tusc. 2.41 (read) shows wounded gladiators sending to their masters (domini) to ask what they wished"
    lanista: "the trainer-dealer who owned and hired out the troupe; Cic. Pro Sestio 134 was cited from memory but 'lanista' was NOT found in the text read: no source for this role here   # unverified"
  bout:                                     # [anim]
    sequence: "pairs matched by arms; the fight until one is wounded or yields"
    yield: "a beaten man grounded his shield and raised a finger; the editor, swayed by the crowd, gave missio (let him live) or the sign for the stroke"
    yield_source: "Livy 41.20.12 (read) confirms the terms 'uolneribus tenus' and 'sine missione' (to wounds only / without mercy), so missio is attested. The raised finger and the crowd's verdict are not read; Martial Spect. 29 and Juvenal 3.36 are Imperial   # unverified"
    gesture_note: "disputed: the raised finger (ad digitum) is Imperial evidence and the 'thumb' signal is ambiguous. The game shows a raised finger and a hand sign only as the engine's decision."
    stroke: "Cic. Tusc. 2.41 (read): a gladiator told to receive the sword does not draw in his neck; an ordinary gladiator does not groan or change face; the crowd and the master are satisfied by courage"

senate:
  summons:                                  # [anim]
    who: "dictator, consuls, praetor, tribune of the plebs, interrex, prefect of the city, in that order of precedence if several are in Rome; in addition the military tribunes with consular power, the decemvirs and the triumvirs for regulating the state"
    source: "Gellius 14.7 (read, Beloe translation; Varro's handbook for Pompey, consul 70 BC)"
    place: "only in a templum, a place inaugurated by the augurs: the Curia Hostilia or Pompeia, later the Julia; the house of Vesta is not a templum"
    place_source: "Gellius 14.7 (read)"
    auspices: "the convener had to sacrifice a victim and take the auspices before the meeting"
    auspices_source: "Gellius 14.7 (read)"
  session:
    relatio: "the presiding magistrate lays the matter before the house (referre ad senatum)"
    business_order: "religious matters first, then matters of the state, then private matters (Gellius 14.7, read)"
    order_of_speaking: "each senator asked in turn, beginning with those of consular rank, from which rank formerly the eldest was asked first; Varro notes a newer practice by which the mover asks first whomever he prefers, still a consular (Gellius 14.7, read)"
    order_source: "Gellius 14.7 (read). That consuls-designate spoke first in the late Republic is from Gellius 4.10 # unverified"
    chair: "the presiding magistrate on a curule chair on the tribunal at the far end; senators sit on benches along the side walls (the Curia Julia had three tiers)   # unverified"
    seats_note: "the 'three broad steps each side' is the Curia Julia as excavated; the Republican Curia Hostilia is not known in detail"
    daylight: "a consultation before sunrise or after sunset is not in due form, and the holders could be called to account by the censors (Gellius 14.7, read)"
    fines: "Varro also treats bribes and the fine for a senator absent when due (Gellius 14.7, read)"
    veto: "intercession belongs to those with equal or higher power than the convener (Gellius 14.7, read); the tribune's veto"
    size: "about 300 senators in the middle Republic; 600 under Sulla; 900 under Caesar   # unverified"
  division:                                 # [anim]
    name: "a decree passed in one of two ways: by the departure (discessio) of those who agree, or, where the case is doubtful, by calling for each man's opinion in turn (Gellius 14.7, read). Capito, via Tubero: no consultation was regular without a division even when taken per relationem."
    formula: "'pedibus in sententiam ire' is the usual phrase; not in the Gellius text read here   # unverified"
    source: "Gellius 14.7 (read)"
    call_formula: "the presiding magistrate called: those who think so, go to this side; those who think otherwise, to that (paraphrase); Pliny Ep. 8.14.19   # unverified"
    note: "voice-vote opinions came first, the division after; the game plays only the division"

sacrifice:
  steps:                                    # [anim] in this order
    - {step: procession, what: "the magistrate (head veiled with the toga), attendants, the victim led to the altar before the temple, flute-player (tibicen) playing", source: "veiled head: Livy 10.7.10 (read: 'capite velato victimam caedet'); Plut. Quaest. Rom. 10   # unverified. The flute: Dion. Hal. 7.72.5 (read) says flutes accompany all the ancient sacrificial ceremonies."}
    - {step: victim, what: "oxen at the great sacrifices; white with gilded horns for a triumph", source: "Plut. Aem. 33 (read: 120 fat oxen with gilded horns, wreathed); Appian Pun. 66 (read: white oxen); the slack rope: Pliny NH 8.183   # unverified"}
    - {step: praefatio, what: "before the sacrifice, incense and wine offered with a prayer to Janus, Jupiter and Juno (Cato); Janus first in every sacrifice (Cicero)", source: "Cato Agr. 134 (read: 'Ture vino Iano Iovi Iunoni praefato, priusquam porcum feminam immolabis'); Cato Agr. 141 (read: 'Ianum Iovemque vino praefamino'); Cic. ND 2.67 (read: Janus first in sacrifice, Vesta named for the hearth)"}
    - {step: wash_and_meal, what: "after washing their hands the consuls and priests purified the victims with clear water and sprinkled grain (the mola, spelt grits mixed with salt) on their heads, then prayed", source: "Dion. Hal. 7.72.15 (read) and Cary's note on the mola salsa"}
    - {step: prayer, what: "the formula in the second person, ending 'macte ... esto' (be honoured by this offering) and asking the god to be willing and propitious to me, my household and my children", source: "Cato Agr. 132, 134, 139, 141 (read). The prayer in the animation is a paraphrase of Cato 141 (to Mars Pater, for a field), used as the pattern for a temple sacrifice: an analogy, not the words of a state sacrifice."}
    - {step: strike, what: "assistants struck the victim on the temple with a club while it stood, others received it on the sacrificial knives as it fell; then it was flayed and cut up", source: "Dion. Hal. 7.72.15-16 (read)"}
    - {step: exta, what: "first-offerings cut from each of the inwards and from every limb, sprinkled with spelt grits and carried in baskets to the priests, who placed them on the altars and poured wine over them while they burned; the reading of the exta and the signs of acceptance (litatio) follow. Cato 141 (read) provides for failure: 'Si minus in omnis litabit' a second victim (piaculum) is offered.", source: "Dion. Hal. 7.72.16-17 (read); Cato Agr. 141 (read); the reading of the liver by a haruspex: Cic. Div. 2.28-36   # unverified"}
    - {step: feast, what: "the daps, a feast: Cato Agr. 132 (read) has the feast for Jupiter Dapalis, with wine and a day of rest for oxen and ploughmen; Livy 45.39 (read) says the Senate's banquet was held on the Capitol after a triumph", source: "Cato Agr. 132 (read); Livy 45.39 (read)"}
  prayer_paraphrase: "Father Mars, we pray that you keep this farm, our household and our flock safe and well, and take this offering in the proper way. If it is not right, we shall do it again."
  prayer_source: "Cato Agr. 141 (read; paraphrased, not translated)"
  favourable_signs: "favourable: exta whole, liver clean; unfavourable: the head of the liver missing, or a defect   # unverified (modern general knowledge; the Cato passage says only that if it does not go well in all victims, a piaculum is offered)"

triumph:
  conditions: "decree of the Senate (Livy 45.38-39, read: the Senate's decree, the people's vote on imperium for the day, soldiers' votes); a general with imperium. The conventional minimum of 5,000 enemy dead (Val. Max. 2.8.1) # unverified"
  senate_and_people: "Livy 45.39 (read, speech): the victor goes up to the Capitol in a chariot 'auratos purpuratosque'; the victims lead the procession; the Senate banquets on the Capitol; captives and spoils wait in the Circus Flaminius; the Porta Triumphalis is closed against one who is refused; soldiers enter wearing laurel, crying 'Triumph' and singing the praises of their general."
  route:                                    # [anim]
    stages:
      - "assembly outside the city: for Vespasian the temple of Isis and the Porticus Octaviae, where the Senate and magistrates waited with ivory chairs on a tribunal (Josephus 7.5.4); for Paulus the Circus Flaminius (Livy 45.39)"
      - "the Porta Triumphalis, 'the Gate of the Pomp', where the triumphal garments were put on and sacrifices made to the gods of the gate (Josephus 7.5.4)"
      - "through the theatres, so the people could see the show (Josephus 7.5.4); the people in white sat on stands in the Circus and round the Forum (Plut. Aem. 32)"
      - "the Circus Maximus, the Via Sacra and the Forum   # unverified (usual reconstruction; Cic. Pis. 55 not read)"
      - "up the Clivus Capitolinus (paved with stone by the censors of 174 BC, Livy 41.27.7, read) to the temple of Jupiter Capitolinus"
    source: "Josephus BJ 7.5.4-6 (modern 7.123-157, read, Whiston); Plut. Aem. 32 (read); Livy 45.38-40 (read); Livy 41.27.7 (read)"
    disputed: "the exact route is disputed (the Velabrum and Circus Maximus before the Via Sacra is the usual reconstruction; Coarelli, Östenberg); the Porta Triumphalis's location is uncertain   # unverified"
  order:                                    # [anim] head to tail
    - {unit: senate_magistrates, what: "the Senate and magistrates lead the way; in Paulus's day the principal men; for Vespasian they waited for him at the Porticus Octaviae", source: "Josephus BJ 7.5.4 (read); Dion. Hal. 5.47 # unverified"}
    - {unit: trumpeters, what: "trumpeters, sounding the notes that rouse the Romans for a charge", source: "Plut. Aem. 33 (read); Appian Pun. 66 (read)"}
    - {unit: spoils, what: "wagons of captured statues, sculptures and paintings (250 carriages the first day); arms and armour the second; silver and gold coin in vessels, borne by four men each; towers carried to represent captured cities, pictures of the war; crowns given to the general", source: "Plut. Aem. 32-33 (read); Appian Pun. 66 (read); Josephus BJ 7.5.5 (read: pageants of three or four stories showing the war)"}
    - {unit: white_oxen, what: "fat oxen with gilded horns, wreathed, led by youths in fringed waistcloths; boys carrying the wine for libations in gold and silver vessels. Appian: white oxen, then elephants", source: "Plut. Aem. 33 (read); Appian Pun. 66 (read); Livy 45.39 (read): the victims go before the general"}
    - {unit: captives, what: "the captive king's chariot with his armour, then his children with their nurses and teachers, then the king himself in a dark cloak and country boots, followed by friends; Appian: captive Carthaginian and Numidian chiefs", source: "Plut. Aem. 33-34 (read); Livy 45.40 (read: Perseus in chains before the chariot); Appian Pun. 66 (read)"}
    - {unit: lictors, what: "lictors (Appian: clad in purple tunics) preceding the general", source: "Appian Pun. 66 (read). Plutarch does not mention lictors."}
    - {unit: musicians, what: "a chorus of musicians and pipers in Etruscan style, in belts and golden crowns, dancing; one wearing a purple cloak and gold bracelets made faces mocking the enemy; then incense-bearers", source: "Appian Pun. 66 (read); not shown in the animation"}
    - {unit: general, what: "the general in a chariot, wearing a golden crown, a purple toga embroidered with gold stars (Plutarch: purple sprinkled with gold), holding a laurel branch in his right hand (Plutarch) and an ivory sceptre (Appian); boys and girls rode in the same chariot with him and young relatives on horses either side (Appian); his two adopted sons followed after the chariot (Livy 45.40). Toga picta and tunica palmata: the dress of the triumphator; the golden chariot: Jupiter's dress.", source: "Plut. Aem. 34 (read); Appian Pun. 66 (read); Livy 45.40 (read); Livy 10.7.10 (read); Livy 30.15.11 (read: toga picta, palmata tunic, ivory sceptre, golden crown and patera, a curule chair given to Masinissa, as the greatest ornaments of a Roman triumph)"}
    - {unit: general_extra, what: "a fascinus (a phallic amulet) hung under the chariot of triumphing generals, and a spoken warning bade the general look back; the slave who whispered it is the translator's note to Pliny and Juvenal 10.41, not Pliny's words. Face painted red: Pliny NH 33.111; Plut. Quaest. Rom. # unverified (not read)", source: "Pliny NH 28.39 (read) for the fascinus and the warning; slave and red face unverified"}
    - {unit: horses_white, what: "four white horses; Camillus (396 BC) was criticised for using them because they were thought sacred to Jupiter and the Sun", source: "Livy 5.23.5 (read); Plut. Cam. 7 (read)"}
    - {unit: soldiers, what: "the army in companies and cohorts following the chariot, all wreathed with laurel, singing old country songs and the paean, praising some officers and mocking others; in a triumph all are free to say what they please", source: "Plut. Aem. 34 (read); Appian Pun. 66 (read); Livy 45.39 (read: soldiers laureati shout 'Triumph' and sing their praises); Dion. Hal. 7.72.11 (read: soldiers may satirise even generals)"}
  order_note: "Plut. Aem. 32-34 describes the triumph of L. Aemilius Paullus (167 BC) over three days (day one statues and paintings, day two arms, day three the procession proper); Josephus BJ 7.123-157 is Vespasian and Titus in AD 71, where the pageants and spoils come first and the generals last (a parallel, Imperial); Appian Pun. 66 is Scipio's triumph (201 BC, read). The animation order follows Appian and Plutarch day three: senate, trumpeters, spoils, oxen, captives, lictors, general, soldiers. Plutarch puts the captives and the king before the general and the army last, as here."
  end:
    sacrifice: "the procession halts at the temple of Jupiter Capitolinus. For Vespasian it was the Roman custom to wait until the death of the enemy general (Simon son of Gioras) was announced: he had been led among the captives, with a rope on his head, dragged to a place in the Forum where condemned men were put to death; when the news came and the people shouted, the sacrifices were begun with the customary prayers, then the generals went to the palace and feasted (Josephus 7.5.6, read). Scipio banqueted his friends in the temple (Appian Pun. 66, read); the Senate's banquet was on the Capitol (Livy 45.39, read)."
    source: "Josephus BJ 7.5.6 (read); Appian Pun. 66 (read); Livy 45.39 (read)"
  dress_of_general: "see order.general"

ludi:
  - {id: ludi_romani, latin: "Ludi Romani", english: "Roman Games", when: "4-19 September in the late Republic   # unverified (fasti not read)", founded: "traditional, by Tarquinius Priscus (Livy 1.35.9, read); Dion. Hal. 7.71 (read) says the Senate ordered the festival under the vow of the dictator A. Postumius (the Latin war), 500 minae a year. In 366 BC a day was added to the games (Livy 6.42.12, read: 'dies unus ad triduum adiceretur'). Repeated (instaurati) for three days in 216 BC (Livy 23.30.16, read).", note: "the extension from one day to 15 over the Republic is the standard story; the later stages are not read"}
  - {id: ludi_plebeii, latin: "Ludi Plebeii", english: "Plebeian Games", when: "4-17 November   # unverified", founded: "origin uncertain; given by the plebeian aediles; attested for 216 BC when they were repeated three times (Livy 23.30.17, read) and again in 200 BC (Livy 31.50.3, read)", note: "given by the plebeian aediles"}
  - {id: ludi_apollinares, latin: "Ludi Apollinares", english: "Games of Apollo", when: "5 July in 208 BC, the day then made fixed (Livy 27.23.7, read); the later fasti run 6-13 July   # unverified", founded: "vowed in 212 BC on the carmina of Marcius (Livy 25.12.1-15, read: games in the Circus Maximus, the praetor presiding, the people watching crowned, banquets in the open); first given by the urban praetor P. Cornelius Sulla; vowed anew each year on an uncertain day until, in the plague of 208 BC, the urban praetor P. Licinius Varus had a law passed to vow them for ever on a fixed day, which he did first, on 5 July (Livy 27.23.5-7, read)", note: "212 BC is the founding; 208 BC makes them annual"}
  - {id: ludi_megalenses, latin: "Ludi Megalenses", english: "Games of the Great Mother", when: "4 April and after   # unverified (fasti not read); the goddess arrived on 12 April, 204 BC (Livy 29.14.14, read: 'pridie idus Apriles')", founded: "the stone of Cybele was brought to Rome in 204 BC; on the day of arrival the people carried gifts to the Palatine and there were a lectisternium and games, 'Megalesia appellata' (Livy 29.14.14, read). The temple was dedicated by M. Iunius Brutus in 191 BC, and games were held for the dedication, which Valerius Antias called the first scenic games, named Megalesia (Livy 36.36.3-4, read).", note: "so 204 BC is the arrival and first games; 191 BC the dedication and the scenic games"}
  - {id: ludi_cereales, latin: "Ludi Cereri", english: "Games of Ceres", when: "12-19 April   # unverified", founded: "uncertain; given by the plebeian aediles; the earlier claim of Livy 30.39.8 was NOT found in the text. Livy 27.6.19 (read) says that in 210 BC the plebeian aediles set bronze statues at the temple of Ceres from fines and gave games 'magnifici apparatus'; that is plebeian, not necessarily the Cerialia.   # unverified"}
  - {id: ludi_florales, latin: "Ludi Florales", english: "Games of Flora", when: "28 April to 3 May   # unverified (fasti not read)", founded: "Pliny NH 18.286 (read): the Floralia were instituted in 238 BC on the oracle of the Sibyl, on 23 April, so that all things should blossom well. Ovid Fasti 5.277-330 (read): the plebeian aediles Publicii used fines to set up the games (and to pave the Clivus Publicius); later, after a blight, the Senate vowed an annual festival and the consuls Postumius and Laenas (173 BC) gave the games, which became annual.", note: "Pliny's date, 23 April, differs from the later calendar date 28 April; the foundation year 238 BC is Pliny's"}
