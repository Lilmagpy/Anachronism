# Streets of Rome, 509-27 BC. Format like monuments.yaml (see README.md).
#
# Each street is a polyline of [lat, lon] points (WGS84, in the direction given by `direction`).
# `precision`: exact (identified remains, a few metres), approx (100-300 m), rough (300 m or worse).
# Every point list was traced by hand from (a) the course described in Platner and Ashby, "A
# Topographical Dictionary of Ancient Rome" (1929; LacusCurtius, public domain) and (b) the course of
# the modern streets that P-A says follow the ancient ones (Corso, Via Cavour, Via Nazionale, Via XX
# Settembre, Via di Marforio, Via Appia Antica...). None is a surveyed line: the best are "approx".
#
# Other fields:
#   kind        street | clivus (hill road) | vicus (street of a neighbourhood) | road (viae outside the walls)
#   width_m     width of the paved or metalled way between kerbs, metres. Only the Sacra via (5 m,
#               P-A s.v. Sacra Via: the Augustan pavement) is measured in the sources we read; the
#               rest are design values chosen by the author for the 3D city (narrow lanes 3-4 m, vici
#               4 m, main roads 5-7 m) and are flagged `width_source: assumed`.
#   exists_from year (negative = BC) the street first exists, or null if older than the Republic.
#   paved_from  year the surface becomes stone (silex = polygonal basalt/lava) paving, or null if the
#               street stays gravel/beaten earth (glarea) within 509-27 BC. Livy 41.27.5 (174 BC): the
#               censors Fulvius Flaccus and Postumius Albinus "were the first of all to contract for
#               paving the streets in the city with silex and for gravelling and edging the roads
#               outside the city" -> every street inside the Servian walls is paved from 174.
#   sources     ancient authors and Platner-Ashby entries; entries without an online article are
#               marked "# unverified" (LacusCurtius has no separate article for them).
streets:
- id: via_sacra
  latin: Sacra Via
  english: Sacred Way
  kind: street
  direction: "from the top of the Velia (Arch of Titus site) to the Forum"
  points: [[41.8905, 12.4908], [41.8909, 12.4897], [41.8913, 12.4886], [41.8917, 12.4876], [41.8921, 12.4867], [41.8925, 12.4859], [41.8927, 12.4851], [41.8927, 12.4846]]
  precision: approx
  width_m: 5.0
  width_source: "P-A s.v. Sacra Via: Augustan pavement 5 m wide"
  exists_from: null
  paved_from: -174
  sources: ["Platner-Ashby s.v. Sacra Via (read): from the summit of the Velia, where it passed near the temple of Jupiter Stator and the later arch of Titus, down to the east end of the Forum by the Regia; a fornix Fabianus spanned it from 121 BC; Sullan-period pavement found at 11.90-12.50 m a.s.l. near the temple of Caesar, c. 14 m at the 'temple of Romulus', c. 27 m at the Clivus Palatinus", "Cic. pro Planc. 17", "Hor. Sat. 1.9.1", "Livy 41.27.5 (paving of the city streets, 174 BC)"]
  notes: "P-A: the 'Sacra via' of the sources is only the stretch from the Velia to the Regia (the common but wrong extension to the Colosseum and across the Forum to the Capitol is modern usage); the line shown continues to the Forum floor at the east end of the Basilica Aemilia. The bend north of the later temple of Divus Iulius is the Augustan line (after 36 BC); before that the street ran straighter to the Regia and Vesta. Nero changed the line east of the arch of Titus (outside our period)."
