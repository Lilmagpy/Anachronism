measured:
  # published measurements (Platner-Ashby, read); the audit compares our footprint and bearing with them
  aedes_castoris: {length: 50, width: 30, source: "Platner-Ashby s.v. Castor, Aedes: the whole about 50 x 30 m (the Augustan temple)"}
  aedes_divi_iulii: {length: 30, width: 26, source: "Platner-Ashby s.v. Divus Iulius, Aedes: podium 3.5 m high, 26 m wide, about 30 m long"}
  carcer: {length: 7, width: 7, source: "Platner-Ashby s.v. Carcer: the lower chamber nearly 7 m in diameter"}
  lacus_curtius: {length: 10, width: 9, source: "Platner-Ashby s.v. Lacus Curtius: a trapezoidal paved field about 10 m long and 9 m wide"}
  pons_fabricius: {length: 62, source: "Platner-Ashby s.v. Pons Fabricius: 62 m long"}
  rostra_augusti: {width: 24, source: "Platner-Ashby s.v. Rostra Augusti: the front about 24 m long"}
explained:
  dates:
    aedes_bellonae: "the matched article is the shrine of Bellona on the Capitol; the temple by the Circus Flaminius was vowed in 296 (Livy 10.19.17) (unverified: passage not re-read)"
    aedes_castoris: "Platner-Ashby: vowed 499, dedicated in 484"
    aedes_concordiae_forum: "Platner-Ashby: vowed by Camillus in 367, the date of building not known; the record draws it from the vow (certainty: traditional, as stated in the record)"
    aedes_dianae_circus_flaminius: "Platner-Ashby s.v. Diana, aedes: vowed 187, dedicated 179; the second matched article (the sacellum) is another shrine"
    aedes_fidei: "Platner-Ashby: dedicated by A. Atilius Calatinus in 254 or 250; the record takes 254"
    aedes_florae: "the temple by the Circus Maximus, built in 241/238 on the Sibyl's command (Pliny NH 18.286; Vell. 1.14.8); the matched article is the Quirinal temple (unverified: passage not re-read)"
    aedes_fortunae_equestris: "Platner-Ashby: vowed 180, dedicated in 173"
    aedes_fortunae_primigeniae: "Platner-Ashby s.v. Fortunae (tres): vowed 204, dedicated in 194"
    aedes_herculis_custodis: "drawn from 218 BC, its first mention; the building date is not known"
    aedes_honoris_virtutis: "Marcellus's rebuilding, dedicated by his son in 205 (Livy 29.11.13) (unverified: passage not re-read)"
    aedes_iovis_statoris_palatine: "the matched article is the other temple of Iuppiter Stator (by the Circus Flaminius, 146 BC); the Palatine temple is Livy 10.37.15 (294 BC) (unverified: passage not re-read)"
    aedes_iunonis_reginae_aventine: "one of the matched articles is the other temple of Iuno Regina (by the Circus Flaminius, 179 BC); the Aventine temple was dedicated by Camillus in 392 (Platner-Ashby)"
    aedes_iunonis_reginae_circus: "one of the matched articles is the Aventine temple (392 BC); this one was dedicated in 179 (Platner-Ashby s.v. Iuno Regina, aedes)"
    aedes_iuventatis: "Platner-Ashby: vowed 207, begun 204, dedicated by C. Licinius Lucullus (191, Livy 36.36.5-6) (unverified: passage not re-read)"
    aedes_libertatis_aventine: "the matched article is the Atrium Libertatis, another building; the Aventine temple of Libertas is dated by Livy 24.16.19 (# unverified passage)"
    aedes_martis_appia: "the matched article is the temple of Mars in circo Flaminio (138 BC); the temple on the Via Appia was dedicated in 388 (Livy 6.5.8)"
    aedes_pietatis: "Platner-Ashby: vowed 191, dedicated in 181"
    aedes_salutis: "Platner-Ashby gives the dedication as 303 BC; the record follows Livy 10.1.9 in the Varronian year 302 (the year of Bubulcus's dictatorship); a one-year difference of chronology, kept"
    aedes_summani: "Platner-Ashby: built during the war with Pyrrhus (280-275); 278 is the usual year (certainty: probable)"
    aedes_veneris_erycinae_collina: "Platner-Ashby s.v. Venus Erucina: vowed 184, dedicated 181"
    circus_maximus: "the traditional date of the first circus under Tarquinius Priscus; Platner-Ashby: nothing permanent before the carceres of 329"
    curia_iulia: "the matched article (Curia Pompiliana) is another building"
    domus_catuli: "Platner-Ashby: built by Catulus after his victory over the Cimbri (101)"
    fornix_scipionis: "the matched article is the house of Scipio Africanus; the arch was built in 190 (Livy 37.3.7) (unverified: passage not re-read)"
    horrea_sempronia: "the matched article (Basilica Sempronia) is another building"
    lares_permarini: "Platner-Ashby: vowed 190, dedicated 22 December 179"
    macellum: "Platner-Ashby s.v. Forum Piscarium: incorporated in the Macellum built by Fulvius Nobilior in 179"
    porta_fontinalis: "the gate of the Servian wall as rebuilt from 378 (Livy 6.32.1); Platner-Ashby names only 193 (unverified: passage not re-read)"
    porticus_minucia_vetus: "Platner-Ashby: built by M. Minucius Rufus, consul 110, from the spoils of his triumph of 106"
    porticus_octaviae: "the matched articles are the Porticus Octavia of Cn. Octavius (168 BC, another portico) and the library founded in 23 BC; the record is the Porticus Metelli of 146 BC, rebuilt by Augustus as the Porticus Octaviae"
    regia: "the matched article (Atrium Regium) is another building"
  scene:
    "in_river:porta_flumentana": "the river gate stood at the bank (Platner-Ashby s.v. Porta Flumentana); one sample point touches the modelled river"
    "in_river:porticus_aemilia": "the hall stood on the river bank; the modelled Tiber (tiber.gd) is an approximation of the ancient bank, a few points touch it"
    "overlaps:aedes_concordiae_forum": "the Augustan temple of Concord was built against the substructure of the Tabularium, its cella under the Tabularium front (the remains); a 3 m contact is the real arrangement"
    "overlaps:aedes_herculis_musarum": "the temple stood inside the Porticus Philippi, which was built round it (Platner-Ashby s.v. Porticus Philippi); not an error"
    "overlaps:circus_maximus": "the shrine of Murcia stood inside the circus valley, by the turning post (Platner-Ashby s.v. Murcia, sacellum); not an error"
    "overlaps:horrea_galbae": "UNRESOLVED: the Marble Plan puts the Horrea Galbae right behind the great hall identified as the Porticus Aemilia (Tucci 2012 argues the hall is the navalia); our 487 x 60 m hall centred on its remains and the 200 x 155 m horrea at their Wikipedia point (+-30 m) overlap by 52 m. A measured plan of both is needed before either is moved"
    "overlaps:porticus_octaviae": "the portico and the theatre stood side by side with a narrow street between; 2.8 m is within the precision of the reconstructed portico corner (Pleiades outlines only its propylon)"
  outlines:
    aedes_apollinis_palatini: "the remains are the concrete core of the podium, stripped of its facing; our 50 x 25 m is not verified and is kept, not shrunk to the core"
    aedes_castoris: "the outline includes the platform and stairs in front; our 50 x 30 m is Platner-Ashby's measurement"
    aedes_divi_iulii: "the outline includes the later platform round the podium; our 30 x 26 m is Platner-Ashby's podium"
    aedes_divi_iulii_empire: "as aedes_divi_iulii"
    aedes_herculis_victoris: "the outline includes the steps round the podium; our circle is the stylobate (14.8 m)"
    aedes_vespasiani: "the remains are cut by the Clivus Capitolinus and the modern road; ours is the restored plan (33 x 22 m)"
    arcus_titi: "the arch is 13.5 m wide and 4.75 m deep; the outline includes the plinth and Valadier's 1821 restoration"
    area_sacra_argentina_b: "the outline includes the front stair; the circle is the round cella and colonnade"
    area_sacra_argentina_c: "the outline is the surviving podium core; our 30 x 14 m is not verified and is kept"
    area_sacra_argentina_d: "temple D is mostly under Via Florida; the outline is the excavated strip"
    auditorium_maecenatis: "the outline includes the walls and the apse; ours is the hall"
    carcer: "the outline is the church of S. Giuseppe dei Falegnami over the prison; ours is the lower chamber (Platner-Ashby nearly 7 m)"
    forum_transitorium: "the outline is the excavated area including the Subura end; our 120 x 40 m is the paved forum between the porticoes"
    lacus_curtius: "the outline includes the later curb and pavement round the field (Platner-Ashby 10 x 9 m)"
    pons_fabricius: "the outline includes the abutments on both banks; Platner-Ashby gives 62 m"
    rostra_augusti: "the outline includes the curved steps behind; the front is 24 m (Platner-Ashby)"
    stadium_palatinum: "the outline includes the two-storey portico round the arena; ours is the arena, about 160 x 50 m"
  positions:
    horti_sallustiani: "a garden estate of many hectares drawn as an area (model none); our point is its middle between the Pincian and the Quirinal, Pleiades outlines the one surviving pavilion in Piazza Sallustio"
    thermae_traiani: "Pleiades outlines only the surviving exedrae on the north-east side (173 x 36 m); our point is the centre of the whole 340 x 330 m precinct"
    domus_aurea: "Pleiades outlines only the surviving Esquiline wing; our point is the centre of the drawn palace grounds, which ran from the Palatine to the Esquiline"
    colossus_neronis: "Pleiades maps the base by the Flavian amphitheatre, where Hadrian moved the statue after AD 120; until then it stood in the vestibule of the Domus Aurea on the site of the later temple of Venus and Rome, where we place it"
    horologium_augusti: "Pleiades' best point is the excavated stretch of the meridian line under Via di Campo Marzio 48; our point is the middle of the paved dial, between it and the obelisk's site"
    emporium: "Pleiades outlines the excavated 165 m of the quay; our record is the whole 500 m river front of the Emporium"
    basilica_ulpia: "Pleiades outlines only the excavated eastern part (57 x 56 m); our record is the whole basilica, 130 m across the north-west end of the forum"
    theatrum_marcelli: "Pleiades' best location is the bounding box of the visible arcades, an arc on the north-east of the cavea; our point is the centre of the circle fitted to that arc (radius 60 m), the centre of the theatre"
    theatrum_marcelli_empire: "the same building as theatrum_marcelli (twin_of): see there"
    porticus_octaviae: "Pleiades maps the surviving propylon, in the middle of the south-west side; our point is the centre of the 130 m enclosure behind it (Platner-Ashby s.v. Porticus Octaviae, read)"
    porticus_octaviae_empire: "the same building as porticus_octaviae (twin_of): see there"
    forum_romanum: "the Pleiades outline (OpenStreetMap) is the whole archaeological area of the Forum, from the Capitol foot to the Velia, so its centre lies 180 m east of the square; our point is the centre of the paved square (the origin of the frame)"
  lines:
    street:vicus_iugarius: "the OpenStreetMap line Pleiades gives runs along the south side of the Basilica Iulia, where no ancient street is attested; Platner-Ashby s.v. Vicus Iugarius (read) says the present pavement preserves the line after the basilica was built, which is the path between the basilica and the temple of Saturn that we follow"
outline_skip:
  aedes_concordiae_forum: "the record's base footprint is the early shrine; the Augustan temple is drawn by its phases"
  atrium_vestae: "the outline is the imperial House of the Vestals, larger than the Republican atrium (the axis is taken from it)"
  basilica_ulpia: "Pleiades outlines only the excavated eastern part"
  casa_romuli: "the outline is the area of the excavated Iron Age huts, not one hut"
  circus_maximus: "the outline is the modern park; the size is Dionysius' (621 x 118 m)"
  colossus_neronis: "the outline is the later base by the amphitheatre"
  curia_iulia: "the outline includes the walls; the record gives the hall (25.2 x 17.6 m, P-A)"
  curia_iulia_empire: "as curia_iulia"
  domus_aurea: "Pleiades outlines only the Esquiline wing"
  emporium: "Pleiades outlines only 165 m of the quay"
  forum_boarium: "the outline is the modern piazza; the ancient square's extent is not known"
  forum_holitorium: "the outline is part of the area by S. Nicola in Carcere"
  forum_romanum: "the outline is the whole archaeological area"
  horrea_agrippiana: "the outline is the excavated part"
  lacus_iuturnae: "the outline is one wall of the basin"
  ludus_magnus: "the outline is the excavated corner"
  pantheon_agrippae: "the outline is Hadrian's rotunda and porch (AD 125), not Agrippa's building"
  pantheon_agrippae_empire: "the outline is Hadrian's building (AD 125)"
  pantheon_hadriani: "the outline includes the porch and the intermediate block"
  pons_aemilius: "the outline is the single surviving arch"
  pons_cestius: "the outline is the 1892 rebuilding (82 m); the ancient bridge was 48 m (Platner-Ashby), drawn from the island end"
  porta_esquilina: "the outline is the arch of Gallienus, the later gate"
  porticus_aemilia: "Pleiades outlines only one section of the hall"
  porticus_octaviae: "Pleiades outlines only the propylon"
  porticus_octaviae_empire: "Pleiades outlines only the propylon"
  regia: "the outline includes the precinct round the building"
  templum_pacis: "the outline is the excavated part"
  theatrum_marcelli: "Pleiades outlines only the arc of surviving arcades (the centre is fitted to it)"
  theatrum_marcelli_empire: "as theatrum_marcelli"
  theatrum_pompei: "Pleiades outlines only a fragment of the remains"
  thermae_traiani: "Pleiades outlines only the surviving exedrae"
