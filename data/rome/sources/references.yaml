# Curated verdicts and measurements for the city audit (F2; src/anachronism/tools/city_audit.py).
# Edit this file, not the report: then run `uv run anachronism-city-audit`.
#
# verdicts.<pleiades|platner>.<key>: {match: id | [ids], note} or {skip: "reason"}.
#   Keys are Pleiades place ids and Platner-Ashby keys (LacusCurtius page#anchor, as listed in the
#   report). A skip says why the entry is not drawn (after AD 120, a district not a building, no
#   location in any source, a duplicate of another entry ...).
# measured.<monument id>: published orientation and size, each with its source:
#   {bearing: front faces this compass bearing | axis_only: true when only the axis is known,
#    length, width (m, length along the axis), source: "..."}.
# explained.<positions|outlines|scene|dates>.<id>: why a remaining flag is not an error.
# outline_skip.<monument id>: reason the outline of the remains is not comparable.
# {missing: "why"} corrects an automatic match that was wrong: the entry counts as missing.
verdicts:
  pleiades: {}
  platner:
    Aedes_Castoris#in_Circo_Flaminio: {missing: "the temple of Castor in circo Flaminio (Vitruvius 4.8.4) is not the Forum temple"}
    Aedes_Martis#in_via_Appia: {missing: "the temple of Mars outside the Porta Capena on the Via Appia (vowed 388 BC, Livy 6.5.8) is not the Campus Martius temple"}
    Aedes_Fortunae#Apotropaios: {missing: "a different Fortuna from the Forum Boarium temple"}
    Aedes_Fortunae#Euelpis: {missing: "a different Fortuna"}
    Aedes_Dianae#p151: {missing: "the Dianium on the Esquiline (Livy 1.48.6), not the Aventine temple"}
    Domus_Valeriorum.html: {missing: "a house, not the Via Valeria"}
    Statuae#Valeriana: {missing: "a statue, not the Via Valeria"}
    Statuae#Romuli: {missing: "a statue, not the hut of Romulus"}
    R#Templum_Divi_Romuli: {missing: "the temple of Divus Romulus (Maxentius' son) on the Sacra Via, not the hut of Romulus"}
    arcus#Traiani2: {missing: "an arch, not the column of Trajan"}
    curiae#Pompiliana: {missing: "not the Curia of Pompey"}
    domus#Flaminia: {missing: "a house, not the Via Flaminia"}
    domus#L.Caecilius_Metellus: {missing: "a house, not the tomb of Caecilia Metella"}
    domus#M.Aemilius_Scaurus: {missing: "Scaurus' house on the Palatine, not his theatre"}
    horrea#Agrippiana: {missing: "the Horrea Agrippiana by the Vicus Tuscus, not the baths of Agrippa"}
    horrea#Nervae: {missing: "a granary, not the Forum of Nerva"}
    porticus#Catuli: {missing: "Catulus' portico on the site of Fulvius Flaccus' house, not Catulus' house"}
    Aemiliana.html: {skip: "a district of the Campus Martius (Varro RR 3.2.6), not a building"}
measured: {}
explained:
  positions:
    horti_sallustiani: "a garden estate of many hectares drawn as an area (model none); our point is its middle between the Pincian and the Quirinal, Pleiades outlines the one surviving pavilion in Piazza Sallustio"
    thermae_traiani: "Pleiades outlines only the surviving exedrae on the north-east side (173 x 36 m); our point is the centre of the whole 340 x 330 m precinct"
    domus_aurea: "Pleiades outlines only the surviving Esquiline wing; our point is the centre of the drawn palace grounds, which ran from the Palatine to the Esquiline"
    colossus_neronis: "Pleiades maps the base by the Flavian amphitheatre, where Hadrian moved the statue after AD 120; until then it stood in the vestibule of the Domus Aurea on the site of the later temple of Venus and Rome, where we place it"
    horologium_augusti: "Pleiades' best point is the excavated stretch of the meridian line under Via di Campo Marzio 48; our point is the middle of the paved dial, between it and the obelisk's site"
    pons_cestius: "kept where the U8 island pass fitted it (D-299): tiber.gd fits the island between the dataset's two bridges, and with the bridges on their remains the 67 m island does not fit the course drawn there; moving the bridges needs the island refitted in tiber.gd (hook for the lead)"
    pons_fabricius: "as pons_cestius: kept where D-299 fitted the island to it (21 m from the remains)"
    emporium: "Pleiades outlines the excavated 165 m of the quay; our record is the whole 500 m river front of the Emporium"
    basilica_ulpia: "Pleiades outlines only the excavated eastern part (57 x 56 m); our record is the whole basilica, 130 m across the north-west end of the forum"
    forum_romanum: "the Pleiades outline (OpenStreetMap) is the whole archaeological area of the Forum, from the Capitol foot to the Velia, so its centre lies 180 m east of the square; our point is the centre of the paved square (the origin of the frame)"
  lines:
    street:vicus_iugarius: "the OpenStreetMap line Pleiades gives runs along the south side of the Basilica Iulia, where no ancient street is attested; Platner-Ashby s.v. Vicus Iugarius (read) says the present pavement preserves the line after the basilica was built, which is the path between the basilica and the temple of Saturn that we follow"
outline_skip: {}
