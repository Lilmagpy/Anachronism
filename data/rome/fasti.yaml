# The Fasti of the Roman Republic, 509-27 BC: who held which office in every year (Varronian
# count; -509 = 509 BC). One entry per year; gap years (the anarchy of 375-371 and the four
# "dictator years") carry `gap:` and seat no consuls. Read in place by the rome pack
# (pack.yaml `external`); fields and method in data/rome/README.md.
# Confidence: high = certain, medium = probable, low = traditional/doubtful (the view says
# "disputed"). A source line ending `# unverified` was not read against a text. Consul names were
# checked against Wikipedia's "List of Roman consuls" (which follows Broughton's MRR), noted per
# year; years where that list differs say so in `notes`. Draft from branch claude/r1-fasti.
fasti:
  - id: fasti_509bc
    year: -509
    confidence: low
    colleges:
      - office: consul
        holders:
          - {person: l_iunius_brutus}
          - {person: l_tarquinius_collatinus}
          - {person: p_valerius_publicola, suffect: true}
          - {name: "Spurius Lucretius Tricipitinus", gens: lucretii, suffect: true}
          - {person: m_horatius_pulvillus, suffect: true}
    notes: "Livy 2.2: the second consul, L. Tarquinius Collatinus, bore an unpopular name and left office; P. Valerius was elected as colleague of Brutus. Livy 2.8: Sp. Lucretius died after a few days in office and M. Horatius Pulvillus was elected in his place; Livy adds that some authors name Horatius immediately after Brutus."
    sources:
      - "Fasti Capitolini"
      - "Livy 2.2"
      - "Livy 2.8"
      - "Wikipedia, List of Roman consuls (after Broughton, MRR; names checked 2026-11-02)"
