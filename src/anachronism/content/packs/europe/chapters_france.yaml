schema_version: 1
# Chronicle mode (D-120, D-XXX): the Capetian kings of France, from Robert the Pious to
# Philip I, 1000-1096. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Rodulfus Glaber, Helgaud of Fleury (Life of King Robert),
# Richer of Reims, Paul of Saint-Pere de Chartres (Orleans, 1022), William of Jumieges,
# William of Poitiers, Orderic Vitalis, Hugh of Flavigny and Fulcher of Chartres, with modern
# work by Dunbabin, Bautier, Hallam, Bradbury and Fliche. Dates of the Bertha affair and of
# Philip's marriage to Bertrade are approximate (the sources differ by a year or two).
# benchmark_provinces counts the provinces of this map the real kings held directly: the
# Ile-de-France always, and Burgundy only in the years 1016-1032, when Robert II and then his
# son held it before it became a cadet duchy under a younger brother. The great fiefs
# (Champagne, Aquitaine, Toulouse, Flanders) were nominally the king's vassals but acted as
# independent princes, so the game's start (six provinces) already puts the player ahead.
chapters:
  - id: fra_bertha
    scenario: year_1000
    civ: france
    year: 1000
    title: "The Excommunicated King"
    place: "Paris"
    speaker: papacy
    speaker_name: "Pope Sylvester II"
    speaker_title: "Gerbert of Aurillac, once your own teacher"
    needs_alive: [papacy]
    benchmark_provinces: 1
    story: >-
      You are Robert, called the Pious, second king of the Capetian line. Your father took
      the crown from the last Carolingians and left you a king who rules little more than
      Paris and Orleans. You sing in your own choir and love your monks.


      You have also married Bertha, widow of the Count of Blois, and she is your cousin. You
      were the godfather of one of her children, which makes the marriage incest by the
      Church's reckoning. Pope Gregory V excommunicated you; the story goes that your own
      servants threw the food you touched to the dogs. Now the new pope, who knows you well, asks you to put
      her away. She has borne you no living child, and a king needs an heir.
    choices:
      - label: "Put Bertha away and submit to the Church"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          In the next few years you part from Bertha, do penance, and are received back into
          the Church. You marry Constance of Arles, daughter of the Count of Provence, who
          brings you a proud and sharp-tongued court from the south, and who will give you
          four sons. The bishops of France are well pleased, and your reputation for piety
          grows.
      - label: "Keep Bertha and hold your ground"
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Your bishops, abbots and even your barons are uneasy. A king who has no heir and no
          peace with the Church is a king whom the great counts need not obey.
      - label: "Ask a council of bishops for a dispensation"
        legitimacy_bp: 300
        wealth_bp: -500
        influence: {clergy: 500}
        outcome: >-
          Your bishops write to Rome and a council is called to hear the case. It takes
          months, and gifts to the churches that must be fed along the way, and the pope
          does not say what he will decide.
    history: >-
      Robert married his cousin Bertha of Burgundy in about 996 and was excommunicated in 998;
      about 1001-1003 he put her away and married Constance of Arles.
    diverged: >-
      The papacy is gone.
    sources: ["Richer of Reims, Histories 4", "Helgaud of Fleury, Life of Robert the Pious", "Dunbabin, France in the Making (1985)"]

  - id: fra_orleans
    scenario: year_1000
    civ: france
    year: 1022
    title: "The Fire at Orleans"
    place: "Orleans"
    speaker: steward
    speaker_name: "Bishop Odalric of Orleans"
    speaker_title: "Who brings the charge"
    benchmark_provinces: 2
    story: >-
      You are Robert, King of the Franks, twenty years on the throne. You hold Burgundy
      now, after a long war with its claimants, and your son is crowned beside you.


      At Christmas you have come to Orleans, and the bishop shows you thirteen men and women
      of the town, among them clerics and a former confessor of your queen, Stephen. They
      are said to deny the sacraments and the virgin birth, to hold that the Church's
      mass is mere show, and to hold their goods in common. They will not take back
      what they have said. Nothing like this has been done in France in your lifetime. The
      people in the square want fire.
    choices:
      - label: "Let the Church condemn them to the fire"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 800
        influence: {clergy: 1200}
        outcome: >-
          Stephen and his companions are stripped of their orders and burned outside the
          town. Paul of Saint-Pere, who tells the story, says that your queen Constance, who
          had known Stephen, struck out one of his eyes with her staff as he was led past.
          Some chroniclers will remember it as a pious deed, and some as the first burning
          of heretics in the Latin West for many centuries.
      - label: "Shut them in monasteries for life"
        legitimacy_bp: -500
        unrest_bp: 300
        influence: {clergy: -300}
        outcome: >-
          The bishop shakes his head. The men are shut away. The doctrine they were accused
          of is whispered in other towns, and the next bishop will have to deal with it.
      - label: "Send them to a council of bishops"
        legitimacy_bp: 300
        wealth_bp: -300
        influence: {clergy: 400}
        outcome: >-
          The bishops of the province are called together and the thirteen are heard again
          before them. The council takes its time, the crowd in the square grows restless, and
          the matter is still unsettled when you leave the town.
    history: >-
      In December 1022, in the presence of King Robert, thirteen canons and laymen of Orleans
      were condemned for heresy and burned.
    sources: ["Paul of Saint-Pere de Chartres, Gesta (Cartulary, 1022)", "Rodulfus Glaber, Histories 3.8", "Moore, The Origins of European Dissent (1977)"]

  - id: fra_mother
    scenario: year_1000
    civ: france
    year: 1031
    title: "Your Mother and Your Brother"
    place: "Fecamp, in Normandy"
    speaker: normandy
    speaker_name: "Duke Robert of Normandy"
    speaker_title: "Who has given you shelter"
    needs_alive: [normandy]
    benchmark_provinces: 1
    story: >-
      You are Henry, King of the Franks, crowned beside your father at Reims in 1027. Your father the king is just dead. Your mother Constance never wanted
      you: she wanted your younger brother Robert, whom she thought the better man, and the
      great castles of the royal lands have taken her side.


      You have fled to the Duke of Normandy, who has taken you in. He will lend you an army
      against your mother, in return for the Vexin, the border country on the river Epte. Or
      you can give your brother something and make peace.
    choices:
      - label: "Take Duke Robert's army against your mother"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          With Norman help you retake your castles, and your mother withdraws from the
          struggle, and dies in 1032. Your brother is satisfied with the duchy of Burgundy, which
          your father won, and you give it to him, for him and his heirs. His line will rule
          there for three hundred years, as dukes under your own. You pay the Normans with
          the Norman Vexin, to your later regret.
        deeds: {give: [m_burgundy]}
      - label: "Share the kingdom with your brother"
        legitimacy_bp: -1000
        unrest_bp: 1200
        outcome: >-
          Your mother's party does not want half of a king. The war goes on for another year,
          and the castles sell themselves to whoever pays.
        deeds: {men: 1500}
      - label: "Buy the castle-lords and fight alone"
        wealth_bp: -1500
        unrest_bp: 500
        legitimacy_bp: 300
        outcome: >-
          You send out your money instead of asking help of the Normans. Some castles open to
          you and some wait for the highest bidder, and the war drags on at your own expense.
        deeds: {men: 2000}
    history: >-
      Robert II died on 20 July 1031. Henry I, with help from Duke Robert of Normandy
      (in return for the Vexin), overcame his mother Constance and his brother Robert, who
      received the duchy of Burgundy in 1032; Constance died in 1032.
    diverged: >-
      Normandy is gone.
    sources: ["Rodulfus Glaber, Histories 3.9", "William of Jumieges 6.10", "Dunbabin, France in the Making (1985)"]

  - id: fra_anne
    scenario: year_1000
    civ: france
    year: 1050
    title: "A Wife from the Far East"
    place: "Reims"
    speaker: rus
    speaker_name: "Prince Yaroslav the Wise"
    speaker_title: "Of Kiev, by his envoys"
    needs_alive: [rus]
    benchmark_provinces: 1
    story: >-
      You are Henry, King of the Franks. Your first wife, Matilda, died childless
      years ago. The Church forbids marriage with anyone related to you within
      seven degrees, and in a Europe where all the royal houses have married each other for
      three hundred years that leaves almost no one eligible.


      Your bishops know of one, far away. Yaroslav, Prince of Kiev, has many daughters, and
      his family is linked by marriage to Norway, Hungary and Poland. His daughter Anna is
      young and said to be clever. Kiev is a long way off, and your court is poor beside
      his. A bishop could carry your offer.
    choices:
      - label: "Send a bishop to Kiev for a bride"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -500
        outcome: >-
          Anna arrives in 1051 and is crowned at Reims. She is astonished by how small and
          rough your court is, and she can write when you cannot. A charter of 1063 has her
          name signed in Cyrillic letters. She gives you three sons, and a prince named
          Philip, a Greek name that no Frankish king has ever borne.
      - label: "Marry a lady of your realm by dispensation"
        legitimacy_bp: -500
        wealth_bp: 300
        outcome: >-
          The bishops give a reluctant dispensation. Your marriage lasts, but the great
          princes see little reason to treat it as a royal one.
      - label: "Seek a bride at the emperor's court"
        legitimacy_bp: 500
        wealth_bp: -300
        outcome: >-
          Your envoys go east to the German court. The emperor's kin are many, but the
          Church's counting is strict, and the search takes a long time and ends without a
          bride.
    history: >-
      Henry I married Anne of Kiev, daughter of Yaroslav the Wise, in 1051; she bore Philip
      (b. 1052), the first Frankish king named Philip.
    diverged: >-
      Rus is gone.
    sources: ["Chronicle of Saint-Denis (Henry I)", "Hugh of Flavigny, Chronicon", "Dunbabin, France in the Making (1985)"]

  - id: fra_varaville
    scenario: year_1000
    civ: france
    year: 1057
    title: "The Tide at Varaville"
    place: "On the river Dives, Normandy"
    speaker: normandy
    speaker_name: "Duke William"
    speaker_title: "The young duke, to whom you once gave your help"
    needs_alive: [normandy]
    benchmark_provinces: 1
    story: >-
      Ten years ago you rescued William, the bastard duke of Normandy, at Val-es-Dunes, and
      broke his rebels. Since then he has grown too strong. In 1054 you invaded his lands in
      two columns; he beat one at Mortemer, and you went home. Now your ally Geoffrey Martel,
      Count of Anjou, wants to try again.


      You are marching through Normandy near the mouth of the Dives. The tide is running.
      Half your army is across the river, and the other half is waiting on the bank.
      Scouts say that Duke William has been watching from the trees, and that he has men.
    choices:
      - label: "Press on across the ford"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          William falls on the half left on the bank, and the rising tide cuts it off from the
          rest. You watch, helpless, as the rearguard is destroyed. You leave Normandy in disgrace,
          and you never come back. You and the Duke will make peace, but he has beaten the
          king, and everyone knows it.
        deeds: {martial_bp: -500}
      - label: "Halt the van and bring the army over"
        legitimacy_bp: 500
        wealth_bp: -300
        outcome: >-
          The delay costs you a day. William is forced to meet the whole army or none, and his
          men stay in the woods.
        deeds: {martial_bp: 300}
      - label: "Turn aside and ravage the Norman fields"
        legitimacy_bp: 300
        wealth_bp: 500
        unrest_bp: 500
        outcome: >-
          You swing the army inland and burn farms and barns, and drive off cattle. The
          countryside suffers; William, who needed a battle, has to follow you.
        deeds: {martial_bp: 200}
    history: >-
      In August 1057 Henry and Geoffrey Martel invaded Normandy; as the French crossed the
      Dives, William of Normandy destroyed their rearguard at Varaville, and Henry withdrew.
    diverged: >-
      Normandy is gone.
    sources: ["William of Jumieges 7.14", "William of Poitiers 1.8", "Douglas, William the Conqueror (1964)"]

  - id: fra_regent
    scenario: year_1000
    civ: france
    year: 1061
    title: "The Guardian from Flanders"
    place: "Paris"
    speaker: steward
    speaker_name: "Count Baldwin V of Flanders"
    speaker_title: "Your uncle by marriage"
    benchmark_provinces: 1
    story: >-
      You are Philip, nine years old, and your father the king died the summer
      before last. On his deathbed, they say, he named your guardian: Baldwin, Count of
      Flanders, his own brother-in-law, who is the richest and most trusted prince in
      France, and whose daughter is married to Duke William of Normandy.


      Your barons are watching: a boy king is a prize. Your mother, Queen Anne, is a
      foreigner of no party. Baldwin has come to Paris with his household and asks whether
      he may rule for you.
    choices:
      - label: "Accept Baldwin as regent"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          Baldwin rules as regent until his death in 1067, and keeps the kingdom steady and
          your treasury full. By his death you have grown up. But you have also seen what a
          king who holds a regent's powers can do, and what a powerful vassal can do to a
          king, which will make you cautious for the rest of your life.
      - label: "Rule through Queen Anne and the royal court"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Baldwin goes back to Lille in a rage. The
          barons divide, and the court is full of quarrelling.
      - label: "Set up a council of bishops and counts"
        legitimacy_bp: 300
        unrest_bp: 500
        influence: {nobility: 500}
        outcome: >-
          A council of the chief bishops and counts is named to rule in your name. It is
          slow, each member watches the others, and nobody is trusted as Baldwin would be.
    history: >-
      Henry I died on 4 August 1060 and the child Philip I was placed under the guardianship of
      Baldwin V of Flanders, who ruled as regent until his death in 1067.
    sources: ["Orderic Vitalis, Ecclesiastical History 5", "Annales Sancti Vedasti", "Hallam and Everard, Capetian France (2001)"]

  - id: fra_bertrade
    scenario: year_1000
    civ: france
    year: 1092
    title: "The Wife of the Count of Anjou"
    place: "Tours"
    speaker: scholar
    speaker_name: "Bishop Ivo of Chartres"
    speaker_title: "A stern churchman"
    benchmark_provinces: 1
    story: >-
      You are Philip, King of the Franks, forty years old and getting fat. You married
      Bertha of Holland in 1072 and she has borne you children, but you find her dull, and
      your barons find you slack. Then you meet Bertrade de Montfort, who is the wife of
      Count Fulk of Anjou, and who is, unlike him, charming.


      Chroniclers will say that you carried her off, and say that she left her husband
      willingly. Either way, you can set Bertha aside as unwanted and make Bertrade your
      queen. The bishops of France are not fond of divorce, and the Pope now, Urban II,
      will not be fond either.
    choices:
      - label: "Send Bertha away and marry Bertrade"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 500
        influence: {clergy: -1500}
        outcome: >-
          A friendly bishop marries you. Ivo of Chartres refuses to bless the marriage and is
          thrown in prison for it. Bertrade gives you children, and she stays at your side
          for the rest of your life. But the Pope excommunicates you at Autun in 1094,
          and again at Clermont the next year, and you will be under the ban, on and off,
          until you promise to give her up in 1104.
      - label: "Keep Bertha, and leave Bertrade at Anjou"
        legitimacy_bp: 500
        influence: {clergy: 500}
        outcome: >-
          The Church is pleased with you, and Bertha is not happy. Your people say you are
          a dull king, and Count Fulk keeps his wife.
      - label: "Ask a council to annul the marriage first"
        legitimacy_bp: -500
        wealth_bp: -400
        influence: {clergy: -300}
        outcome: >-
          A council is called and bishops are asked their views. They are slow, and many
          of them say the king has no ground for it; the case is still being argued when
          Bertrade moves into your household.
    history: >-
      About 1092 Philip I repudiated Bertha of Holland and married Bertrade de Montfort,
      wife of Fulk IV of Anjou; Ivo of Chartres protested and was imprisoned.
    sources: ["Orderic Vitalis, Ecclesiastical History 8", "Hugh of Flavigny, Chronicon", "Ivo of Chartres, Letters 13-16", "Bradbury, Philip I (2000)"]

  - id: fra_clermont
    scenario: year_1000
    civ: france
    year: 1095
    title: "God Wills It"
    place: "Clermont"
    speaker: papacy
    speaker_name: "Pope Urban II"
    speaker_title: "A Frenchman, once Odo of Chatillon"
    needs_alive: [papacy]
    benchmark_provinces: 1
    story: >-
      You are Philip, King of the Franks. In November, in a field outside Clermont, the Pope,
      who is a Frenchman, has called all Christians to march to Jerusalem. He says that
      the Turks are ruining the road to Christ's tomb, and that every knight who goes will
      have his sins forgiven. The great lords of your realm, your own brother Hugh of
      Vermandois among them, kneel and take the cross.


      You are not there. You are under the ban of the Church for your marriage, and the
      Council, in the same week, renews it. The barons of France may go to war, and you
      can send a little of your own, and your blessing.
    choices:
      - label: "Stay at home; your brother may go"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Hugh of Vermandois, Duke Robert of Normandy, Count Raymond of Toulouse and Godfrey
          of Bouillon, a Lotharingian, march east; Jerusalem is taken in 1099. You stay in
          France, watching your barons gone and your own power growing in their absence, with
          your son Louis at your side, who will be a stronger king than you.
      - label: "Go yourself, as king and pilgrim"
        legitimacy_bp: 1000
        unrest_bp: 1000
        wealth_bp: -2000
        outcome: >-
          No Pope will bless an excommunicate at the head of a crusade, and you leave the
          kingdom in the hands of your young son Louis and a quarrelsome court.
      - label: "Send a small royal force and your blessing"
        legitimacy_bp: 300
        wealth_bp: -800
        outcome: >-
          A few of your household knights ride east under your banner, with money from the
          treasury. The Pope notes it and the barons notice that the king himself stayed behind.
        deeds: {men: 1000}
    history: >-
      Philip I, under excommunication, did not take part in the First Crusade, which Urban II
      proclaimed at Clermont in November 1095; his brother Hugh of Vermandois did.
    diverged: >-
      The papacy is gone.
    sources: ["Fulcher of Chartres, History of the Expedition to Jerusalem 1.1", "Orderic Vitalis, Ecclesiastical History 9", "Bradbury, Philip I (2000)"]
