schema_version: 1
# Chronicle mode (D-120, D-XXX): Pergamon of the Attalids, from Philetaerus to the bequest to
# Rome, 264-134 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Strabo 13.4, Polybius 4.48, 18.41, 21.45 and 30.1-3, Livy
# 29.10-14, 33.21, 37.37-44, 44.13 and 45.19-20, Pliny's Natural History 13.70 and 34.84, Justin
# 36.4 and the Pergamene inscriptions (OGIS 338), with modern work by Hansen (The Attalids of
# Pergamon), Allen (The Attalid Kingdom) and Kosmetatou. Dates approximate: the Galatian victory
# and the royal title (c. 238-230), the Great Altar (begun c. 180-165), the library's founding.
# Ages in the scenario are approximate. benchmark_provinces counts the provinces of this map the
# real Attalids held at that date (the conquests of 229-223 are left out: they lasted only a few
# years and Achaeus took them back).
chapters:
  - id: per_treasure
    scenario: punic_wars
    civ: pergamon
    year: -264
    title: "Nine Thousand Talents"
    place: "Pergamon"
    speaker: steward
    speaker_name: "Eumenes"
    speaker_title: "Your nephew and heir"
    benchmark_provinces: 1
    story: >-
      You are Philetaerus, the eunuch from Tieion, and you are about to be seventy-nine. As a
      baby you were hurt in a crowd and made a eunuch for life; the story goes that this is why
      King Lysimachus trusted you with his treasury, nine thousand talents in the rock
      fortress of Pergamon. Then Lysimachus quarrelled with his family, and you changed sides
      to Seleucus; after Seleucus was murdered you ransomed his body, sent it to his son and
      stayed where you were.


      Today you are a servant of the Seleucid king in name and a prince in everything else.
      You pay for temples and walls in the Greek cities, and the coins carry the head of
      Seleucus, not your own. Your nephew Eumenes asks how long you will keep up this
      pretence, and what to do about the king's patience when you are gone.
    choices:
      - label: "Keep the mask, and leave Eumenes the money"
        historical: true
        wealth_bp: 1500
        legitimacy_bp: 1500
        outcome: >-
          You stay what you have always been, the humble governor, and go on spending on
          Greek temples, a theatre and good will. Your coins keep the head of Seleucus. You die
          in 263, leaving Eumenes a small, rich, very well fortified state that nobody can call
          a rebel.
      - label: "Strike coins in your own name"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          The king's governors write letters. The coins are a bold boast, but the Seleucid army
          is two weeks away and your walls are not yet finished.
        deeds: {grudges: {seleucid: 1500}}
    history: >-
      Philetaerus (c. 343-263 BC) held Pergamon and its treasure for nearly twenty years
      under a Seleucid mask, and left it to his nephew Eumenes I in 263.
    sources: ["Strabo 13.4.1-2", "Pausanias 1.8.1", "Hansen, The Attalids of Pergamon (1971)"]

  - id: per_sardis
    scenario: punic_wars
    civ: pergamon
    year: -260
    title: "The Battle Near Sardis"
    place: "Near Sardis"
    speaker: general
    speaker_name: "Your captain"
    speaker_title: "Of the mercenaries"
    benchmark_provinces: 1
    story: >-
      You are Eumenes, nephew of Philetaerus and his heir. The old man is dead, and the king
      Antiochus has marched from his capital to put Pergamon in its place: a governor's
      province, with a governor chosen from court. His army is camped near Sardis, bigger than
      yours, but it is an army of a dozen nations that has spent years fighting Ptolemy in
      Syria.


      Your captains say you have the mercenaries' pay for a year. You can take the
      king's army in the field, or shut the gates and let your walls do their work.
    choices:
      - label: "Meet Antiochus in the field"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -500
        outcome: >-
          You beat him near Sardis. Antiochus, who is old, goes home and dies soon after. You
          now rule Pergamon and the land around it in your own name, and the Seleucids are
          tied down in Syria and Egypt for years to come.
      - label: "Hold the walls and pay him off"
        legitimacy_bp: -800
        wealth_bp: -1500
        outcome: >-
          Antiochus accepts the money and a governor's oath. It buys you a year, but it
          teaches every Seleucid officer the price of Pergamon.
    history: >-
      Eumenes I defeated Antiochus I near Sardis (about 262-261 BC) and ruled Pergamon as an
      independent dynast until 241.
    sources: ["Strabo 13.4.2", "Allen, The Attalid Kingdom (1983)"]

  - id: per_galatians
    scenario: punic_wars
    civ: pergamon
    year: -238
    title: "The Galatians Want Their Tribute"
    place: "Pergamon"
    speaker: general
    speaker_name: "Your captain"
    speaker_title: "Of the guard"
    benchmark_provinces: 1
    story: >-
      You are Attalus, cousin and adopted son of the late Eumenes, who died of drinking after
      twenty-two years. The Galatians, Celtic war-bands settled in the hills of the interior
      since the great crossing from Europe forty years ago, raid every Greek city in Asia.
      Your uncle bought them off with a yearly payment, and now their chiefs ask you for it.


      Your treasury could pay again. Your army is the best that Philetaerus's money could
      buy, led by men who have not yet lost to anyone.
    choices:
      - label: "Refuse, and fight them at the sources of the Caicus"
        historical: true
        legitimacy_bp: 3000
        unrest_bp: -500
        outcome: >-
          You beat the Tolistobogii at the sources of the Caicus river. The Greek cities of Asia
          Minor call you their saviour and the Galatians are driven back inland. The sources
          say that you then took the title of king, the first of your family to do so, and
          called yourself Soter, the Saviour; some modern scholars place the title a few years
          later.
        deeds: {martial_bp: 500, peace_with: [seleucid], men: 6000}
      - label: "Pay the tribute for another year"
        legitimacy_bp: -1000
        wealth_bp: -1000
        outcome: >-
          The Galatians take the silver and are back next spring with more demands. The
          Greek cities in Asia remember who paid and who fought.
    history: >-
      Attalus I (reigned 241-197 BC) refused to pay the Galatians' tribute and defeated them
      (about 238 BC); Polybius says he took the royal title afterwards.
    sources: ["Polybius 18.41", "Strabo 13.4.2", "Livy 38.16"]

  - id: per_gaul
    scenario: punic_wars
    civ: pergamon
    year: -228
    title: "A Bronze Gaul on Your Hill"
    place: "Pergamon"
    speaker: scholar
    speaker_name: "Your sculptor"
    speaker_title: "From Pergamon's workshops"
    benchmark_provinces: 1
    story: >-
      You are King Attalus. The Seleucid prince Antiochus Hierax, who tried to take his
      brother's throne with a Galatian army, has just been beaten by you in Lydia and chased
      out of Asia Minor. For a few seasons you are the lord of everything west of the Taurus.


      Your sculptors have a proposal: a monument to your victories on the hill, in bronze,
      showing the Galatians not as monsters but as brave men dying hard, so the victory
      is worth something. Greeks have never made enemies look like that before.
    choices:
      - label: "Build the monument, and make the Gauls human"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1000
        wealth_bp: -800
        outcome: >-
          The artists of Pergamon, among them Epigonus, create a great school. Their bronzes
          are lost, but the Roman marble copies, the Dying Gaul and the Gaul killing himself
          and his wife, are still admired two thousand years on. They show the enemy
          with respect, which Greek victory monuments rarely did.
        deeds: {peace_with: [seleucid]}
      - label: "Have it made in the usual way, with the Gauls as beasts"
        legitimacy_bp: 500
        outcome: >-
          The monument is soon like all the others on the Greek mainland. It is correct and
          forgotten.
    history: >-
      Attalus I defeated Antiochus Hierax (c. 229-228 BC) and ruled most of Seleucid Asia Minor
      until Achaeus took it back in 223. The Pergamene monuments to the Gauls survive in Roman
      marble copies.
    sources: ["Polybius 4.48", "Pliny, Natural History 34.84", "Pausanias 1.25.2"]

  - id: per_cybele
    scenario: punic_wars
    civ: pergamon
    year: -204
    title: "The Stone of the Great Mother"
    place: "Pergamon"
    speaker: rome
    speaker_name: "Roman envoys"
    speaker_title: "Sent by the Senate"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are King Attalus, friend of Rome since the war against Philip of Macedon, when you
      sailed with the Roman fleet and bought the island of Aegina from the Aetolians for thirty
      talents. Five Roman senators have arrived with a strange request. Rome is deep in its war
      with Hannibal, and the Sibylline Books and Delphi have said that the enemy will leave
      Italy only when the Great Mother of Pessinus is brought to Rome.


      Her sacred black stone lies in the hills inland, in the temple at Pessinus, in a land
      the Galatians hold. They ask your help in bringing it to the sea.
    choices:
      - label: "Help the Romans, and send the stone to Rome"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You escort the senators to Pessinus yourself and the priests hand over the stone. It
          reaches Rome in the spring of 204 and is taken to the temple on the Palatine. A
          year later Hannibal sails from Italy. Later writers say that a ship's grounding
          at the Tiber's mouth was a miracle; whatever the truth, Rome now remembers
          Pergamon as a friend.
        deeds: {peace_with: [rome]}
      - label: "Refuse, saying it is not yours to give"
        legitimacy_bp: -500
        outcome: >-
          Rome finds the stone another way, or finds another friend. Pergamon has made
          itself small.
    history: >-
      In 205-204 BC the Senate sent envoys to Attalus I, who gave them the stone of the Great
      Mother from Pessinus; it was installed in Rome in 204.
    diverged: >-
      Rome is gone.
    sources: ["Livy 29.10-11, 29.14", "Hansen, The Attalids of Pergamon (1971)"]

  - id: per_library
    scenario: punic_wars
    civ: pergamon
    year: -196
    title: "A Library to Rival Alexandria"
    place: "Pergamon"
    speaker: scholar
    speaker_name: "Your librarian"
    speaker_title: "Keeper of the books"
    benchmark_provinces: 1
    story: >-
      You are Eumenes, son of Attalus, and king for a year. Your father left you a rich,
      respected kingdom and a start on a library. In Alexandria, a hundred years of Ptolemies
      have built the greatest library in the world, and have a monopoly on the papyrus that
      books are made of.


      Your scholars want to hire the best copyists and scholars the world has, build halls
      beside the temple of Athena, and, when the Ptolemies hold back papyrus, make writing
      sheets out of prepared skins instead. The cost is large, and the glory of it will
      come long after you.
    choices:
      - label: "Found the library, and make the skins"
        historical: true
        knowledge_bp: 3000
        wealth_bp: -1500
        legitimacy_bp: 1000
        outcome: >-
          Pergamon becomes famous for the books it keeps. Pliny, writing long afterwards,
          says the Ptolemies' ban on exporting papyrus made you invent parchment; skin had
          been written on before, but Pergamon made it a trade, and the Latin word
          for parchment, pergamena, is named for your city. Later Romans tell of two hundred
          thousand rolls, a figure to be taken with care.
      - label: "Spend the money on the army instead"
        wealth_bp: 500
        legitimacy_bp: -300
        outcome: >-
          Your army is larger. The library is a shelf of scrolls in a corner of the temple,
          and your scholars drift to Rhodes and Alexandria.
    history: >-
      Eumenes II (reigned 197-159 BC) turned Pergamon into a centre of scholarship; the
      library was one of the largest of the Greek world, and parchment was first made there
      in quantity.
    sources: ["Strabo 13.4.2", "Pliny, Natural History 13.70", "Plutarch, Antony 58"]

  - id: per_magnesia
    scenario: punic_wars
    civ: pergamon
    year: -190
    title: "Antiochus Against Rome"
    place: "Magnesia on the Sipylus"
    speaker: rome
    speaker_name: "Lucius Cornelius Scipio"
    speaker_title: "Consul of Rome"
    needs_alive: [rome, seleucid]
    benchmark_provinces: 2
    story: >-
      You are Eumenes. Antiochus the Great, king of the Seleucids, has crossed to Europe and
      has now been driven back across the Hellespont by a Roman army under the consul Lucius
      Scipio, with his famous brother Africanus on his staff. His next battle will be on your doorstep. The army he has
      brought, with scythed chariots and elephants, is the biggest of the age.


      You are the only Greek king who has been Rome's friend all along, and the Seleucid king
      is camped within a day's march of Pergamon, which he threatens to burn.
    choices:
      - label: "Fight beside Rome, and take the right wing"
        historical: true
        legitimacy_bp: 3000
        wealth_bp: 1000
        outcome: >-
          At Magnesia in 190 your archers and slingers frighten Antiochus's scythed chariots into
          his own lines, and your cavalry ride them down. In 188, the Treaty of Apamea gives you
          all the Seleucid lands west of the Taurus except the parts given to Rhodes: the
          Thracian Chersonese across the Hellespont, and most of Mysia, Lydia and Phrygia. Your
          kingdom is five times what it was.
        deeds: {take: [sel_asia], grudges: {seleucid: 2000}}
      - label: "Make a separate peace with Antiochus"
        legitimacy_bp: -1500
        wealth_bp: -1000
        outcome: >-
          The Roman army wins without you. Antiochus turns his back on a king who changed
          sides, and Rome, which does not forget who stood where, treats you as one of the
          conquered.
    history: >-
      Eumenes II fought for Rome at Magnesia (winter 190/189 BC); at Apamea (188) he received the
      Chersonese, Lydia, Phrygia, Mysia and other lands in Asia Minor.
    diverged: >-
      Rome or the Seleucid kingdom is gone.
    sources: ["Livy 37.37-44, 38.39", "Polybius 21.45"]

  - id: per_perseus
    scenario: punic_wars
    civ: pergamon
    year: -168
    title: "The King Who Might Have Changed Sides"
    place: "Pergamon"
    speaker: rome
    speaker_name: "Roman envoys"
    speaker_title: "From the Senate"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are King Eumenes. Rome is at war with Perseus, king of Macedon, and you were the first
      to warn the Senate that he was a danger. Rumour now says that you have been
      bargaining with Perseus, who is said to have offered you money to stand aside or to bring
      the war to a close. Roman friends in Pergamon say the Senate believes it.


      In the hills behind you, the Galatians are on the move, and your own brother Attalus is
      in Rome, where the senators receive him far more warmly than you.
    choices:
      - label: "Stay loyal and send your fleet to Rome"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          You stay on Rome's side in name, and the war is over after Pydna in 168. The Senate
          still thinks you were fishing for a better offer: the story is told by Livy, and
          modern scholars doubt the bargain was ever as serious as Rome feared. When you sail
          for Italy the next year the Senate passes a decree that no king may come to Rome,
          and you turn round at Brundisium. The Galatians rise and are beaten in 166. Rome sets them free anyway, on the grounds that
          they are no longer your subjects.
        deeds: {peace_with: [rome]}
      - label: "Take Perseus's money and keep out of it"
        legitimacy_bp: -1500
        wealth_bp: 1000
        outcome: >-
          Rome wins at Pydna without you, and a king who took the enemy's gold is not
          forgiven. The Senate writes a new friend into the book.
        deeds: {grudges: {rome: 2500}}
    history: >-
      Eumenes II stayed formally loyal in the Third Macedonian War, but Rome suspected him of
      secret dealings with Perseus (Livy 44.13); in 167 the Senate refused to receive him, and
      Rome freed the Galatians in 165.
    diverged: >-
      Rome is gone.
    sources: ["Livy 44.13, 45.19-20", "Polybius 29.5-7, 30.1-3"]

  - id: per_prusias
    scenario: punic_wars
    civ: pergamon
    year: -156
    title: "Prusias Burns the Temple"
    place: "Pergamon"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Of the royal household"
    benchmark_provinces: 2
    story: >-
      You are Attalus, who loved your brother Eumenes. When he died in 159 you took the throne. Years
      ago, in Rome, friends urged you to push your brother aside, and you refused. Now
      Prusias, king of Bithynia, has attacked your land, and has burnt the temple of Asclepius
      outside the walls.


      The Senate is slow. You have some soldiers, not many, and a lot of gold.
    choices:
      - label: "Hold the city and appeal to Rome"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Rome sends a commission, and in 154 Prusias is forced to pay you five hundred talents
          and give up twenty ships. In 149 you help put his son Nicomedes on the Bithynian throne,
          and Prusias, a refugee in a temple, is murdered. Your reign also sees the founding of Attaleia and
          a new Philadelphia.
        deeds: {grudges: {bithynia: 1500}}
      - label: "Pay Prusias to leave"
        legitimacy_bp: -1000
        wealth_bp: -1500
        outcome: >-
          The Bithynian army goes home richer. Pergamon is shown to be a rich city that
          can be bought, and the Senate treats your appeal as an embarrassment.
    history: >-
      Attalus II (reigned 159-138 BC) was attacked by Prusias II of Bithynia in 156; Roman
      commissioners forced a settlement in 154, and Attalus helped to replace Prusias with his
      son Nicomedes II in 149.
    sources: ["Polybius 32.15, 33.7, 33.12-13", "Appian, Mithridatic Wars 4-6"]

  - id: per_bequest
    scenario: punic_wars
    civ: pergamon
    year: -134
    title: "The King's Will"
    place: "Pergamon"
    speaker: steward
    speaker_name: "Your chancellor"
    speaker_title: "Keeper of the royal seal"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are Attalus, third of the name, and you are about thirty-seven. The Romans have been
      your family's friends for seventy years. Later writers say that you were half mad, that you
      poisoned your friends and spent your days growing medicinal plants; this may be the
      gossip of Rome, which had reasons to blacken you. You have no sons.


      A claimant is already whispering at the court: a man called Aristonicus, who says he is
      the bastard son of Eumenes the Second. Your people are rich, and the cities of the coast
      love their freedom. Roman officials ask whom the kingdom will go to.
    choices:
      - label: "Make the Roman people your heir"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          You write your will, leaving your kingdom to the Romans and declaring the city of
          Pergamon and the Greek cities free. In 133, while you are busy on the tomb of your
          mother, you die of a stroke, or sunstroke. Aristonicus raises a revolt, with the
          poor and the slaves at his side; it is put down by 129, and the kingdom becomes the
          Roman province of Asia.
      - label: "Leave your kingdom to Aristonicus"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Aristonicus is a bastard and a stranger; the Greek cities will not have him,
          and Rome will not either. The kingdom is torn apart before you are buried.
    history: >-
      Attalus III died in 133 BC, leaving his kingdom to the Roman people by will; Rome accepted,
      put down Aristonicus's revolt by 129, and made the Roman province of Asia.
    diverged: >-
      Rome is gone.
    sources: ["Justin 36.4", "OGIS 338", "Strabo 14.1.38", "Hansen, The Attalids of Pergamon (1971)"]
