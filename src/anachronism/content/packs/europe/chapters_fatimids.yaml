schema_version: 1
# Chronicle mode (D-120, D-155): the Fatimid caliphs of Cairo, from al-Hakim to Badr
# al-Jamali, 1000-1074. Each chapter opens in its year; one choice is what history chose.
# Facts follow al-Maqrizi, Ibn al-Qalanisi, Yahya of Antioch, Nasir-i Khusraw's travel
# book, the Druze epistles and the Cairo Geniza, with modern work by Halm, Walker, Brett and
# Lev. Al-Hakim was described by enemies and by worshippers; the truth is between.
# benchmark_provinces counts the provinces of this map the real Fatimids held.
chapters:
  - id: fat_barjawan
    scenario: year_1000
    civ: fatimids
    year: 1000
    title: "The Regent in the Garden"
    place: "The palace, Cairo"
    speaker: steward
    speaker_name: "Barjawan"
    speaker_title: "Your tutor and regent"
    benchmark_provinces: 4
    story: >-
      You are al-Hakim bi-Amr Allah, 'he who rules by God's command', fifteen years old, the
      sixth Fatimid caliph and the imam of the Ismaili faithful from Morocco to India. Your
      tutor Barjawan, a eunuch, has ruled for you since your father died. He calls you
      'the lizard', and keeps you from the government.


      You want to rule. Barjawan is walking in the palace garden.
    choices:
      - label: "Have Barjawan killed"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 800
        outcome: >-
          Your servant stabs Barjawan in the garden. You go out on horseback to the crowd and
          tell them you are ruling now. They cheer. Over the next twenty years you will execute
          a great many of your ministers.
      - label: "Dismiss him with honour"
        legitimacy_bp: 500
        outcome: >-
          Barjawan retires to his estates, surprised to be alive. The court learns that the
          caliph can be merciful.
    history: >-
      Al-Hakim had his regent Barjawan killed in 1000 and began to rule personally.
    sources: ["al-Maqrizi, Itti'az al-hunafa", "Halm, Die Kalifen von Kairo (2003)"]

  - id: fat_house_knowledge
    scenario: year_1000
    civ: fatimids
    year: 1005
    title: "The House of Knowledge"
    place: "Cairo"
    speaker: scholar
    speaker_name: "Ibn al-Haytham"
    speaker_title: "A scholar from Basra"
    benchmark_provinces: 4
    story: >-
      You want Cairo to have a library open to everyone: Muslims, Christians, Jews; Ismailis
      and Sunnis; scholars of law, grammar, medicine, astronomy and the stars. Paper, ink and
      pens free to anyone who wants to copy a book.


      A scholar from Basra, Ibn al-Haytham, has come to Cairo claiming he can regulate the
      Nile flood with a dam at Aswan. He has gone to look, and come back very quiet.
    choices:
      - label: "Open the House of Knowledge"
        historical: true
        knowledge_bp: 3000
        legitimacy_bp: 800
        outcome: >-
          The Dar al-'Ilm opens with the palace books - tens of thousands of volumes. Ibn
          al-Haytham, afraid to tell you his dam is impossible, pretends to be mad and is
          confined to his house for ten years, where he writes the Book of Optics: the first
          proof that we see because light enters the eye, tested by experiment.
      - label: "Let the scholars study, and send Ibn al-Haytham back to Aswan"
        knowledge_bp: 1500
        outcome: >-
          The House of Knowledge opens. Ibn al-Haytham comes back from Aswan and tells you the
          truth: the river cannot be dammed. You let him go home to Basra.
      - label: "✦ Build the dam at Aswan with dynamite and concrete"
        needs_adopted: [dynamite]
        food_bp: 4000
        materials_bp: -3000
        legitimacy_bp: 2000
        outcome: >-
          Nine hundred years early, a dam closes the Nile at the first cataract. The flood is
          tamed; Egypt has two harvests a year.
    history: >-
      Al-Hakim founded the Dar al-'Ilm in Cairo in 1005. Ibn al-Haytham's story of feigned
      madness after failing to dam the Nile comes from Ibn al-Qifti.
    sources: ["al-Maqrizi, Khitat", "Ibn al-Qifti, Ta'rikh al-hukama'", "Sabra, The Optics of Ibn al-Haytham (1989)"]

  - id: fat_sepulchre
    scenario: year_1000
    civ: fatimids
    year: 1009
    title: "The Church in Jerusalem"
    place: "Cairo"
    speaker: diviner
    speaker_name: "Your chief missionary"
    speaker_title: "Da'i al-du'at"
    benchmark_provinces: 4
    story: >-
      Every Easter in Jerusalem, Christian pilgrims gather at the Church of the Holy Sepulchre
      to see the 'holy fire' kindle itself at the tomb of Jesus. You have heard that it is a
      trick of the priests with balsam oil, and that the pilgrims from Byzantium bring great
      sums of gold. You have lately forbidden Christians and Jews to ride horses, made them
      wear black, and forbidden everyone to eat mulukhiya and play chess.
    choices:
      - label: "Order the church destroyed"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          Your governor demolishes the Church of the Holy Sepulchre down to the bedrock. The
          news travels to Europe slowly, and is not forgotten. Within a few years you change
          your mind about many things and let Christians rebuild their churches.
        deeds: {grudges: {byzantium: 3000, papacy: 2000}}
      - label: "Leave the church alone"
        legitimacy_bp: 500
        outcome: >-
          The pilgrims keep coming, and paying. The holy fire keeps lighting itself.
    history: >-
      In 1009 al-Hakim ordered the destruction of the Church of the Holy Sepulchre; it was
      rebuilt by agreement with Byzantium from the 1030s. The event was remembered in Europe
      at the time of the First Crusade.
    sources: ["Yahya of Antioch", "Adémar of Chabannes", "Halm (2003)"]

  - id: fat_vanished
    scenario: year_1000
    civ: fatimids
    year: 1021
    title: "The Night Ride to Muqattam"
    place: "The Muqattam hills above Cairo"
    speaker: steward
    speaker_name: "Sitt al-Mulk"
    speaker_title: "Your elder sister"
    benchmark_provinces: 4
    story: >-
      You are thirty-six. You wear a plain woollen robe and ride a donkey through the streets
      of Cairo at night, talking to the people. You have freed slaves, abolished taxes, burned
      the old quarter of Fustat when its people mocked you. A group of missionaries, led by
      a Persian called al-Darazi and a man called Hamza, preach that you are God made
      manifest; you have not denied it.


      Your sister Sitt al-Mulk thinks you are dangerous to the dynasty. Tonight you mean to
      ride alone, as you often do, to the hills to watch the stars.
    choices:
      - label: "Ride out alone"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          You never come back. Days later your donkey is found in the hills, and your robe, cut
          with knives. No body is ever found. Your sister rules for your sixteen-year-old son.
          Your worshippers say you have gone into hiding and will return; they will become the
          Druze, who still wait in the mountains of Lebanon.
        deeds: {ruler_falls: "rides into the hills one night and is never seen again"}
      - label: "Take a guard"
        legitimacy_bp: 300
        outcome: >-
          Your guards follow at a distance. You watch the stars, and come home. Your sister
          finds another way to worry.
    history: >-
      On 13 February 1021 al-Hakim rode into the Muqattam hills and disappeared; his sister
      Sitt al-Mulk was widely suspected. The Druze faith holds that he went into occultation.
    sources: ["al-Maqrizi", "Hamza ibn Ali, Druze epistles", "Halm (2003)"]

  - id: fat_nasir
    scenario: year_1000
    civ: fatimids
    year: 1047
    title: "A Traveller from Khorasan"
    place: "Cairo"
    speaker: scholar
    speaker_name: "Nasir-i Khusraw"
    speaker_title: "A Persian traveller and poet"
    benchmark_provinces: 4
    story: >-
      A Persian official, Nasir-i Khusraw, has walked from Khorasan to Cairo in five years. He
      writes everything down. He has seen your treasury, your gardens, your twenty thousand
      shops; merchants who leave their shops unlocked; the caliph's procession on the day the
      Nile flood is let into the canals.


      He would like to stay, and study the faith of the Fatimids.
    choices:
      - label: "Welcome him, and make him a missionary"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 1000
        outcome: >-
          Nasir-i Khusraw stays three years and goes home to Khorasan as a missionary of the
          Fatimid faith. His Book of Travels will describe Cairo at its height: the city where
          'I saw such wealth that if I should describe it, the people of Persia would not
          believe me.'
      - label: "Show him the city, and send him home"
        wealth_bp: 500
        outcome: >-
          Nasir-i Khusraw goes home with stories, and no mission.
    history: >-
      Nasir-i Khusraw visited Cairo in 1047-1050 under al-Mustansir and described its wealth in
      his Safarnama; he became the Fatimid da'i of Khorasan.
    sources: ["Nasir-i Khusraw, Safarnama (tr. Thackston, 1986)"]

  - id: fat_calamity
    scenario: year_1000
    civ: fatimids
    year: 1065
    title: "The Great Calamity"
    place: "Cairo"
    speaker: steward
    speaker_name: "Your vizier"
    speaker_title: "The seventh vizier this year"
    benchmark_provinces: 4
    story: >-
      You are al-Mustansir, caliph for forty years. The Nile has failed to rise, one year after
      another. Your Turkish and black African regiments are fighting each other in the streets
      of Cairo over their pay. The treasury is empty; the Turks have sold your library to pay
      themselves - the books' bindings made into shoes.


      People in Cairo are eating cats and dogs. Some, it is said, are eating each other.
    choices:
      - label: "Sell everything in the palace to feed the city"
        historical: true
        wealth_bp: -4000
        food_bp: 2000
        legitimacy_bp: -1000
        outcome: >-
          The palace treasures are sold in the market: eighty thousand pieces of crystal,
          seventy-five thousand pieces of brocade. It is not enough. Your daughters flee to
          Baghdad. You sit on a mat in an empty palace, living on bread your nurse's daughter
          brings you, and send for the governor of Acre, Badr al-Jamali, to save you.
        deeds: {martial_bp: -1000}
      - label: "Pay the Turks first, to keep order"
        wealth_bp: -3000
        unrest_bp: 1500
        outcome: >-
          The Turks are paid and keep order for a season. The bread lines grow longer.
    history: >-
      The 'Great Calamity' (al-shidda al-'uzma, c. 1065-1072) combined low Nile floods,
      famine and army mutinies; the Fatimid treasures were dispersed. Al-Mustansir called in
      Badr al-Jamali in 1073.
    sources: ["al-Maqrizi, Ighathat al-umma", "Brett, The Fatimid Empire (2017)"]

  - id: fat_badr
    scenario: year_1000
    civ: fatimids
    year: 1074
    title: "The Armenian General"
    place: "Cairo"
    speaker: general
    speaker_name: "Badr al-Jamali"
    speaker_title: "Commander of the armies"
    benchmark_provinces: 3
    story: >-
      Badr al-Jamali, an Armenian former slave who governs Acre, has sailed to Egypt in winter
      with his own army - a thing no one does - and arrived before anyone could stop him. He
      has invited the leaders of the Turkish regiments to a banquet.


      He asks you for full powers: 'commander of the armies', vizier, chief judge and chief
      missionary all in one.
    choices:
      - label: "Give him everything"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: -3000
        outcome: >-
          At the banquet Badr's men kill the Turkish leaders one by one as they arrive. He
          restores order, the Nile rises again, and he builds the great stone gates of Cairo -
          Bab al-Futuh, Bab al-Nasr, Bab Zuwayla - that still stand. From now on the viziers
          rule and the caliphs reign.
        deeds: {men: 7000}
      - label: "Make him general, but keep the government"
        legitimacy_bp: 500
        unrest_bp: -1000
        outcome: >-
          Badr commands the army and sulks in its camp. The Turks are quieter, but not gone.
    history: >-
      Badr al-Jamali arrived in Egypt in 1074, killed the Turkish commanders and took full
      powers as 'commander of the armies'. He rebuilt Cairo's walls and gates (1087-92).
    sources: ["al-Maqrizi, Khitat", "Creswell, Muslim Architecture of Egypt I (1952)"]
