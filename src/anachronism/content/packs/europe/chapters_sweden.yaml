schema_version: 1
# Chronicle mode (D-120, D-XXX): the Swedish kings, from Olof Skötkonung at Svolder to the
# murder of Eric IX, 1000-1160. Each chapter opens in its year; one choice is what history
# chose (historical: true). Sweden before about 1100 is known almost only from Adam of Bremen
# (writing in the 1070s), from Icelandic sagas set down two centuries or more after the
# events (Snorri's Heimskringla, the Hervarar saga) and from runestones and coins, so many
# dates are approximate and some scenes are marked as the sagas' tale. Modern work by Lagerqvist,
# Sawyer, Harrison and Lindkvist. The reigns are approximate: Olof died c.1022 and Anund Jacob
# c.1050; Emund the Old is put two years early (1058) so that Stenkil reigns when his chapter
# opens on the two-year grid; Inge the Elder's reign, with its three-year exile, is folded
# into one. benchmark_provinces counts the provinces of this map (Svealand, Götaland) the real
# kings held; Finland and the other conquests of later centuries are not on it.
chapters:
  - id: swe_svolder
    scenario: year_1000
    civ: sweden
    year: 1000
    title: "The Sound at Svolder"
    place: "Uppsala"
    speaker: denmark
    speaker_name: "Envoys of King Sweyn Forkbeard"
    speaker_title: "Of the Danish court"
    needs_alive: [denmark]
    benchmark_provinces: 2
    story: >-
      You are Olof, called Skötkonung, and you are about twenty. Your mother Sigrid was queen
      in Uppsala, and Adam of Bremen says she later married Sweyn, king of the Danes. Between
      Denmark and Sweden, on the western sea, rules Olaf Tryggvason of Norway, a new Christian
      and a hard one, who has been breaking the old temples and holding other men's kingdoms
      to be his own.


      Sweyn and the Norwegian earl Eric of Lade, whom Olaf drove out, are gathering ships.
      They ask you to join them, and to share in the spoils when Norway is divided.
    choices:
      - label: "Join Sweyn and Eric against Olaf Tryggvason"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 500
        outcome: >-
          In the late summer of the year 1000 the three fleets catch Olaf's ships, with his
          great Long Serpent, in a narrow sea. The place is given as Svolder, and its site is
          still argued over. The saga tellers say Olaf fought until his men were dead, then
          leapt overboard in his mail. Whatever the truth of that, he is never seen again, and
          Norway is shared between Sweyn, Eric and you. The sagas give you a share in the south
          of Norway, but they were written two centuries later and are no sure guide to it.
        deeds: {peace_with: [norway, rus]}
      - label: "Stay out of it, and watch"
        outcome: >-
          The fleets sail without you. Olaf falls all the same, and you gain nothing from his
          death while your rivals divide his kingdom.
      - label: "Send help to Olaf Tryggvason"
        legitimacy_bp: -500
        outcome: >-
          The Swedes would be fighting beside a king who has made the old ways his enemy, and
          your own nobles will not follow you far.
        deeds: {grudges: {denmark: 1500}}
    history: >-
      About September 1000 Olaf Tryggvason of Norway was defeated and killed at Svolder by the
      fleets of Sweyn Forkbeard, Olof Skötkonung and Eric of Lade, who shared Norway between
      them.
    diverged: >-
      Denmark is gone.
    sources: ["Adam of Bremen, Gesta Hammaburgensis, book 2", "Snorri Sturluson, Heimskringla: Óláfs saga Tryggvasonar", "Sawyer, Kings and Vikings (1982)"]

  - id: swe_husaby
    scenario: year_1000
    civ: sweden
    year: 1008
    title: "The Well at Husaby"
    place: "Husaby, in Västergötland"
    speaker: scholar
    speaker_name: "Sigfrid"
    speaker_title: "A missionary bishop from England"
    benchmark_provinces: 2
    story: >-
      You are Olof, and you are twenty-eight. You have coined silver at Sigtuna, the new town on
      the lake, and the legend on it names you, in Latin letters, as king; an Englishman called
      Godwine cut the dies. Your trade goes down the rivers to Russia and across the sea to
      England and Germany, and every merchant you meet is a Christian.


      The missionary Sigfrid, who has come from England, stands before you with a cup of
      water from the spring at Husaby. The archbishop of Hamburg-Bremen also claims Sweden as
      his own, and the Svear of Uppsala keep the old gods.
    choices:
      - label: "Be baptised at Husaby, and welcome Sigfrid's mission"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        influence: {clergy: 1500}
        outcome: >-
          Adam of Bremen says Sigfrid baptised you, and Husaby's spring is still pointed out.
          The first Christian king of the Swedes does not drag his people after him; the Svear
          of Uppsala do not follow, and you take care not to tear down their temple. Churches
          will be built in Västergötland and by the trading town of Sigtuna long before they
          are in the north.
      - label: "Accept a bishop from the archbishop of Bremen instead"
        legitimacy_bp: 500
        influence: {clergy: 1000}
        outcome: >-
          The archbishop is glad to have a Swedish diocese of his own. His claims and your
          English friends' will tangle for a generation.
      - label: "Stay with the old gods"
        legitimacy_bp: 1000
        unrest_bp: -300
        influence: {nobility: 800}
        outcome: >-
          Uppsala is pleased. The merchants and the rivals across the sea are not.
    history: >-
      Olof Skötkonung was baptised, traditionally by the English missionary Sigfrid at Husaby,
      about 1008, and struck the first Swedish coins at Sigtuna, copying English pennies.
    sources: ["Adam of Bremen, book 2 (the baptism and Sigfrid)", "Sawyer, Kings and Vikings (1982)", "Harrison, Sveriges historia 600-1350 (2009)"]

  - id: swe_thorgny
    scenario: year_1000
    civ: sweden
    year: 1018
    title: "The Lawman's Speech"
    place: "The thing at Uppsala"
    speaker: general
    speaker_name: "Thorgny the Lawman"
    speaker_title: "Spokesman of the Svear"
    benchmark_provinces: 2
    story: >-
      You are Olof, and you are about thirty-eight. Olaf Haraldsson, now king of Norway, has
      been quarrelling with you over the lands on the western sea, and his men have been
      raiding. You want to fight him; your lords do not, and trade has suffered from the quarrel. Snorri Sturluson, writing two
      centuries later, tells the scene at the great thing of the Svear at Uppsala, and the tale
      may well be embroidered, but its shape fits what is known.


      The old lawman Thorgny rises before the assembled farmers. He says, in Snorri's tale,
      that your grandfather and father went on viking raids every summer, while you sit at home
      and will not listen to your people. If you refuse them, the farmers will deal with you as
      they dealt with kings before you who would not listen.
    choices:
      - label: "Yield to the thing and make peace with Norway"
        historical: true
        legitimacy_bp: -500
        unrest_bp: -800
        outcome: >-
          The farmers clash their weapons in approval, and you give way. Anund, your son, is made
          king beside you, and the peace is made. Your daughter Ingegerd, who was promised to the
          Norwegian, is in the end married to Yaroslav the Wise of Kiev in 1019, which binds you
          to Russia rather than Norway; your illegitimate daughter Astrid marries Olaf instead.
          So say the sagas.
        deeds: {peace_with: [norway]}
      - label: "Defy the thing and go to war"
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Your own people hold their spears against you. You are left without an army, and the
          Norwegians watch you with scorn.
      - label: "Send Ingegerd to be Olaf's queen at once, and hold the peace by marriage"
        legitimacy_bp: 500
        outcome: >-
          Olaf is satisfied, and so are the farmers. Yaroslav, who had hoped for her himself,
          is not.
    history: >-
      About 1018 the Swedish thing is said to have forced Olof Skötkonung to make peace with
      Olaf Haraldsson of Norway; in 1019 Olof's daughter Ingegerd married Yaroslav of Kiev. The
      speech of Thorgny is Snorri's.
    sources: ["Snorri Sturluson, Heimskringla: Óláfs saga helga", "Sawyer, Kings and Vikings (1982)", "Lindkvist and Sjöberg, Det svenska samhället 800-1720 (1997)"]

  - id: swe_helgea
    scenario: year_1000
    civ: sweden
    year: 1026
    title: "The Holy River"
    place: "Helgeå, in Scania"
    speaker: norway
    speaker_name: "Envoys of King Olaf Haraldsson"
    speaker_title: "Of the Norwegian court"
    needs_alive: [norway]
    benchmark_provinces: 2
    story: >-
      You are Anund Jacob, and you are scarcely eighteen; your father Olof died a few winters
      ago. Cnut, who holds Denmark and England, is gathering a mighty fleet, and Olaf of Norway
      sends word that he will fight, and asks you to hold the Danish coast with him.


      Your counsellors say you are young and Olaf is rash. But Norway and Sweden both have
      reason to fear that Denmark's king is gathering the whole north into his hand.
    choices:
      - label: "Join Olaf of Norway, and meet Cnut at the Helgeå"
        historical: true
        legitimacy_bp: 1000
        influence: {nobility: 800}
        outcome: >-
          The two kings take their ships into the river Helgeå, in the Danish province of
          Scania. The sagas say they dammed the stream to flood Cnut's camp. A great battle
          follows in or about 1026; the English sources claim the victory for Cnut, though the
          Swedes retire with their fleet. Cnut is not beaten. By 1028 Olaf has fled Norway,
          which Cnut rules, and the three northern kingdoms are no longer quite equals.
        deeds: {grudges: {denmark: 1500}}
      - label: "Make a separate peace with Cnut"
        legitimacy_bp: 500
        outcome: >-
          You keep your lands and your ships. Olaf, left alone, is driven out of Norway within
          two years.
      - label: "Stay out of the quarrel altogether"
        outcome: >-
          Sweden watches, and learns that Cnut's patience is long.
    history: >-
      About 1026 Anund Jacob of Sweden and Olaf Haraldsson of Norway fought Cnut the Great
      at the Helgeå in Scania; the outcome was disputed, but Cnut won Norway in 1028.
    diverged: >-
      Norway is gone.
    sources: ["Anglo-Saxon Chronicle (E) 1025/1026", "Encomium Emmae Reginae, book 2", "Snorri Sturluson, Heimskringla: Óláfs saga helga", "Bolton, The Empire of Cnut the Great (2009)"]

  - id: swe_stenkil
    scenario: year_1000
    civ: sweden
    year: 1060
    title: "No King of the Old Line"
    place: "Uppsala"
    speaker: scholar
    speaker_name: "A priest of Sigtuna"
    speaker_title: "In the bishop's household"
    benchmark_provinces: 2
    story: >-
      You are Stenkil. Your people, the Götar, are Christian in the main, with Skara's bishop
      among them, and the Svear of Uppsala hold to the old gods. Your king Emund the Old, who
      was Olof Skötkonung's son and had no sons that lived, has just died. With him ends the line
      that, in the Svear's memory, goes back to Odin.


      Adam of Bremen says the elders of the Götar and the Svear met to choose a king, and that
      the choice fell on you, a powerful man and a friend of the Church. Bishop Adalward the
      Younger is in the north, working to turn the Svear.
    choices:
      - label: "Accept the crown, and support the bishops"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500, nobility: 500}
        outcome: >-
          Stenkil rules for some years in peace, a friend of the bishops and of the Danes. Adam
          says Sweden was never so well governed as under him. After his death, about 1066, his
          sons and kinsmen fight each other, and the old gods have one more season.
        deeds: {peace_with: [rus, norway, denmark]}
      - label: "Insist on a prince of the old line, whoever can be found"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          No one can be certain who he is, and the quarrel is long.
    history: >-
      After Emund the Old's death in about 1060 the Swedes chose Stenkil, a Götar nobleman, as
      king; he ruled until about 1066, and the old royal line was ended.
    sources: ["Adam of Bremen, Gesta Hammaburgensis, book 3", "Sawyer, Kings and Vikings (1982)"]

  - id: swe_uppsala
    scenario: year_1000
    civ: sweden
    year: 1082
    title: "The Sacrifice at Uppsala"
    place: "The temple at Uppsala"
    speaker: diviner
    speaker_name: "A priest of the old gods"
    speaker_title: "Of the temple"
    benchmark_provinces: 2
    story: >-
      You are Inge, the son of Stenkil, and a Christian. Not far from Uppsala stands the temple
      that Adam of Bremen describes, shining with gold, three images in it, and a grove where
      the bodies of men and beasts hang from the trees, which the Svear visit once in nine
      years. At the thing there, they expect their king to join in the sacrifice, as his
      ancestors did.


      The Svear are many and fierce, and you have only the Götar and a few bishops behind you.
      The Hervarar saga tells what follows, some two centuries after the event.
    choices:
      - label: "Refuse to sacrifice, and go into exile in Västergötland"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          The Svear shout you down, and choose your brother-in-law Sweyn, called Blot-Sweyn,
          "the Sacrificer", in your place. You withdraw to the Götar. After about three years
          you ride back and fall upon him by night in his hall. In the saga's tale Sweyn is
          burned or slain. You are king again, the old temple is cast down and the Svear are
          taught that a Christian king will rule them.
      - label: "Sacrifice, and keep the throne"
        legitimacy_bp: 500
        unrest_bp: -500
        influence: {nobility: 800}
        outcome: >-
          The Svear cheer you, but the bishops will have none of you, and your kinsmen the
          Danes grow cold.
      - label: "Raise the Götar against the Svear at once"
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          Civil war begins before you have gathered your host.
    history: >-
      About 1080-1087 the Svear are said to have driven out the Christian Inge the Elder for
      refusing to sacrifice and set up Blot-Sweyn; Inge returned and killed him, and the
      Uppsala temple was ended. The details are from the Hervarar saga.
    sources: ["Adam of Bremen 4.26-4.27 (the temple at Uppsala)", "Hervarar saga ok Heiðreks", "Sawyer, Kings and Vikings (1982)"]

  - id: swe_alvastra
    scenario: year_1000
    civ: sweden
    year: 1144
    title: "Monks from Clairvaux"
    place: "Alvastra, beside Lake Vättern"
    speaker: papacy
    speaker_name: "Letters from Bernard of Clairvaux"
    speaker_title: "The reforming abbot"
    needs_alive: [papacy]
    benchmark_provinces: 2
    story: >-
      You are Sverker, a Götar king, and a man of a land that has long had no stable royal
      house. Two families, yours in the south and the line of Eric in the north, contend for
      the crown; each draws support from its own people, the Götar and the Svear. Sweden has
      Christian bishops, but no archbishop and little order in the Church.


      The monks of Cîteaux, whom Bernard of Clairvaux leads, are building houses in
      lonely places across Europe. Your queen, Ulvhild, is eager that you should invite them, on
      the shores of Lake Vättern.
    choices:
      - label: "Found a Cistercian abbey at Alvastra, and endow it"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1000
        influence: {clergy: 1500}
        outcome: >-
          In 1143 the first Cistercian monks come from Clairvaux to Alvastra, which you endow
          with lands. The order will found Nydala, Varnhem and others, and plough up wastes
          of the Swedish forest for the Church, for the king, and for its own farms. The Church
          in Sweden gains an order that answers to Rome, not to its local lords.
      - label: "Leave the Church to the bishops, and the lords' own foundations"
        outcome: >-
          The bishops are pleased. The country's wastes stay wild, and Rome sees little reason to
          make Sweden an archdiocese.
      - label: "Seize church lands to pay for a larger army"
        wealth_bp: 1500
        legitimacy_bp: -1500
        unrest_bp: 800
        influence: {clergy: -1500}
        outcome: >-
          You are richer for a season, and every bishop in Christendom writes against you.
    history: >-
      Sverker the Elder, king of the Götar and later of Sweden, founded Alvastra Abbey in
      1143, with Cistercian monks from Clairvaux.
    diverged: >-
      The papacy is gone.
    sources: ["Diplomatarium Suecanum (charters of Alvastra)", "Lindkvist and Sjöberg, Det svenska samhället 800-1720 (1997)"]

  - id: swe_sverker
    scenario: year_1000
    civ: sweden
    year: 1156
    title: "Christmas Morning"
    place: "Near Alvastra"
    speaker: steward
    speaker_name: "Your steward"
    speaker_title: "Of your household"
    benchmark_provinces: 2
    story: >-
      You are Sverker, and you are old. You came to the throne of the Götar about 1130, after the
      line of Stenkil died out, and have held on to it through a quarter of a century of quarrels
      between your family and the kin of Eric Jedvardsson, who has the Svear on his side. Your
      son Charles is a young man now, and your rivals watch your every move.


      It is Christmas Day. You rise before the dawn to go to church, as every morning, along the
      road and past your own stable.
    choices:
      - label: "Ride to church as usual"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Your groom kills you on the way to church. The chronicles, written later, disagree on
          who put him up to it: some point to Eric's party, others to a private grudge, and some
          to nobody at all. Eric Jedvardsson is raised on a shield at the thing of the Svear,
          and your son Charles is for a time left alone.
        deeds: {ruler_falls: "is murdered on the way to church"}
      - label: "Keep a guard about you, and a tight watch on the stable"
        legitimacy_bp: 500
        outcome: >-
          Nothing happens that morning, but nobody can guard against every enemy for ever.
    history: >-
      Sverker the Elder was murdered on Christmas Day, 1156 (some dates give 1155 or 1157), on
      his way to church; Eric Jedvardsson succeeded him.
    sources: ["Lindkvist and Sjöberg, Det svenska samhället 800-1720 (1997)", "Harrison, Sveriges historia 600-1350 (2009)"]

  - id: swe_eric
    scenario: year_1000
    civ: sweden
    year: 1160
    title: "Ascension Day at Uppsala"
    place: "Uppsala"
    speaker: scholar
    speaker_name: "A priest of your chapel"
    speaker_title: "Of the Church of the Holy Trinity"
    benchmark_provinces: 2
    story: >-
      You are Eric, who in later years will be called a saint, though you do not know it. You
      are a farmer-king of the Svear, a keeper of the law, and the founder of the Church of the
      Holy Trinity at Uppsala, as a later legend will say. The same legend has you sail across
      the sea to Finland with Bishop Henry of Uppsala to bring the Finns into the Church; modern
      historians doubt that the crusade took place as the legend tells it.


      You are in Uppsala on Ascension Day, 18 May 1160. Word comes to you at Mass that a Danish
      prince, Magnus Henriksson, who claims the Swedish crown through his mother, has landed with
      a band of men and means to take the crown. The Götar of the south have already thrown in
      their lot with him.
    choices:
      - label: "Finish the Mass, then go out to face him"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          The legend says you stayed until the service was done, and said that the rest of the
          festival you would keep in another world. You go out and are struck down at the church
          door; your head is struck off. The Church will make a saint and a patron of you, and
          Uppsala's cathedral will keep your relics. Magnus rules the Svear for a year or two,
          until Charles Sverkersson's party defeats him.
        deeds: {ruler_falls: "is killed after Mass at Uppsala"}
      - label: "Leave the church at once and gather the Svear host"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          You might hold the town. You will not have the blessing of the Church for the
          battle you offer.
      - label: "Flee north to the Svear lands"
        legitimacy_bp: -1500
        outcome: >-
          Magnus seizes Uppsala, and your name is not honoured.
    history: >-
      Eric IX was killed at Uppsala on 18 May 1160 by the Danish prince Magnus Henriksson; he was
      later venerated as a saint and became Sweden's patron.
    sources: ["Legenda sancti Erici (c.1290s)", "Saxo Grammaticus 14", "Lindkvist and Sjöberg, Det svenska samhället 800-1720 (1997)"]
