schema_version: 1
# Chronicle mode (D-120, D-XXX): the Přemyslid dukes of Bohemia, from Boleslaus III's fall to
# Vladislaus II's royal title, 1000-1160. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow Thietmar of Merseburg, Cosmas of Prague
# (writing a century or more after the early events, and full of tales) and the German annals,
# with modern work by Wolverton, Berend, Urbańczyk and Wiszewski, and Žemlička. Several dates
# are approximate (Oldřich's retaking of Moravia, 1019-1029; Bretislav's raid, 1038 or 1039);
# Jaromír's brief return in 1033 is folded into Oldřich's reign. benchmark_provinces counts the
# provinces of this map the real dukes held at that date; Moravia is part of the one Bohemian
# province here, and Silesia, which Bretislav seized, is the second one.
chapters:
  - id: boh_ginger
    scenario: year_1000
    civ: bohemia
    year: 1002
    title: "The Red Duke"
    place: "Prague"
    speaker: poland
    speaker_name: "Envoys of Duke Boleslaw the Brave"
    speaker_title: "Of the Polish court"
    needs_alive: [poland]
    benchmark_provinces: 1
    story: >-
      You are Boleslaus III, the Red, duke of the Bohemians. Thietmar and Cosmas, who both write
      of you from the side of those who suffered under you, call you cruel and say that you drove
      out your brothers Jaromír and Oldřich. Your nobles are in revolt, and the emperor Otto
      III, who knew your house, is dead. His heir, Henry II, is a stranger to you and is
      busy with Poland and Italy.


      Boleslaw the Brave of Poland, who is your first cousin, offers you refuge, and an army. He has
      held Kraków for some years and has his eye on Moravia. His envoys speak very softly.
    choices:
      - label: "Go to Poland, and trust your cousin's hospitality"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Thietmar says the Bohemians drove you out in 1002, and that in 1003 you accepted
          Boleslaw's invitation. Boleslaw has you blinded and takes Prague in the spring. You
          live on in Poland for some thirty years in darkness.
        deeds: {ruler_falls: "is blinded in Poland"}
      - label: "Hold Prague and fight your own nobles"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          You are shut up in your castle by your own people, and Boleslaw will not have long to
          wait.
      - label: "Send to King Henry II for help"
        legitimacy_bp: 500
        outcome: >-
          Henry has other wars in hand. His answer, when it comes, comes too late.
    history: >-
      Boleslaus III was driven out of Bohemia in 1002; in 1003 Boleslaw the Brave of Poland
      blinded him, took Prague, and held Bohemia until 1004.
    diverged: >-
      Poland is gone.
    sources: ["Thietmar of Merseburg, Chronicon, books 4-5", "Cosmas of Prague, Chronica Boemorum, book 1", "Wolverton, Cosmas of Prague (2015)"]

  - id: boh_jaromir
    scenario: year_1000
    civ: bohemia
    year: 1004
    title: "The Emperor's Army at Prague"
    place: "Prague"
    speaker: hre
    speaker_name: "Envoys of King Henry II"
    speaker_title: "Of the German court"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Jaromír, the brother of the blinded duke, and you have spent two years in
      exile. The Poles hold Prague and your people are sick of them; their lords have asked
      Henry II, the German king, to remove them.


      Henry's army is on its way through the forest, and you are to ride with it. He will make
      you duke of the Bohemians, if you will hold your land from him. The Poles also have offers.
    choices:
      - label: "Ride with Henry's army, and take Bohemia as his man"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 800}
        outcome: >-
          In August 1004 the Bohemians rise against the Polish garrison, and the German army
          comes in at their call. Boleslaw flees Prague, and Henry gives you the duchy as his
          vassal. Moravia, however, stays with Poland for fifteen years. Bohemia is now bound to the
          Empire, and will stay so.
        deeds: {take: [m_bohemia], peace_with: [poland, hre]}
      - label: "Make terms with Boleslaw of Poland instead"
        legitimacy_bp: -500
        outcome: >-
          Boleslaw offers a share of power, and not much more. The Bohemian lords will not
          have a Polish ruler for long.
        deeds: {take: [m_bohemia]}
    history: >-
      In 1004 Henry II drove the Poles from Prague and restored Jaromír as duke, holding of
      the Empire; Poland kept Moravia until about 1019.
    diverged: >-
      The Holy Roman Empire is gone.
    sources: ["Thietmar of Merseburg, Chronicon, book 6", "Cosmas of Prague, Chronica Boemorum, book 1", "Berend, Urbańczyk and Wiszewski, Central Europe in the High Middle Ages (2013)"]

  - id: boh_moravia
    scenario: year_1000
    civ: bohemia
    year: 1020
    title: "The Girl at the Spring"
    place: "Olomouc"
    speaker: general
    speaker_name: "Your son Bretislav"
    speaker_title: "Duke Oldřich's heir"
    benchmark_provinces: 1
    story: >-
      You are Oldřich, who threw out your brother Jaromír in 1012 and have ruled since. The
      Poles hold Moravia, and Boleslaw the Brave is old and has quarrelled with the Empire.


      Cosmas tells a tale about your heir: when you were out hunting, you saw a village girl,
      Božena, washing clothes at a spring, and you took her to be your wife, and the child she
      bore you was Bretislav. It is a story told a century later, and it may be only that. What
      is sure is that Bretislav is a man now, brave and ambitious.
    choices:
      - label: "Send Bretislav to take back Moravia, and let him hold it"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 500}
        outcome: >-
          Sometime between 1019 and 1029 Bretislav wins Moravia back, and rules it from Olomouc as
          his father's lieutenant. The Poles, under Mieszko II after 1025, cannot keep it. From
          then on Moravia belongs to the Přemyslids, and its princes are the sons of the dukes.
        deeds: {men: 400}
      - label: "Keep Bretislav at court, and leave Moravia to Poland"
        legitimacy_bp: -500
        outcome: >-
          Bretislav sulks at your court. Moravia stays Polish, for now.
    history: >-
      Oldřich (1012-1034) and his son Bretislav recovered Moravia from Poland, about 1019-1029.
      The story of Božena is Cosmas's.
    sources: ["Cosmas of Prague, Chronica Boemorum, book 1", "Annals of Hildesheim", "Žemlička, Čechy v době knížecí (1997)"]

  - id: boh_gniezno
    scenario: year_1000
    civ: bohemia
    year: 1038
    title: "The Bones of St Adalbert"
    place: "Gniezno"
    speaker: general
    speaker_name: "Your captain of the host"
    speaker_title: "At Prague"
    benchmark_provinces: 2
    story: >-
      You are Bretislav I, the son of Oldřich and Božena, and you have been duke of the
      Bohemians for four years. Poland is in ruins: its king Mieszko II is dead, his son
      Casimir has fled abroad, the nobles have risen and a pagan reaction has burned churches.
      The Church of Poland has almost ceased to exist.


      You have a thought. St Adalbert, Prague's own bishop, whom the Prussians killed, is buried at
      Gniezno, in the cathedral of the Polish archbishop. If his relics were in Prague, Prague
      might be an archbishopric in its own right, and you might hold the Poles in the hollow of
      your hand.
    choices:
      - label: "Ride into Poland, and carry Adalbert's relics home"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 1000
        influence: {clergy: 1500}
        outcome: >-
          Your host takes Gniezno and Poznań in about 1038-39 and bears away Adalbert's bones, and
          Silesia with its capital Wrocław falls to you. The Bohemians keep Adalbert's relics
          to this day, and Prague gets its bishop's glory. But the emperor Henry III does not
          like to see a vassal duke build an empire of his own; in 1040 he will march against you.
        deeds: {take: [m_silesia], grudges: {poland: 1500}, martial_bp: 300}
      - label: "Stay at peace and offer the Poles protection"
        legitimacy_bp: 500
        outcome: >-
          Casimir comes home in time, with German help, and rebuilds his kingdom. You gain nothing.
      - label: "Take only Silesia, and leave Adalbert's tomb"
        legitimacy_bp: 1000
        outcome: >-
          A small gain, and the bishop of Prague will never have his archbishopric.
        deeds: {take: [m_silesia]}
    history: >-
      In 1038 or 1039 Bretislav I invaded Poland, plundered Gniezno, took St Adalbert's
      relics to Prague and occupied Silesia. Henry III forced him to submit in 1041.
    sources: ["Cosmas of Prague, Chronica Boemorum, book 2", "Gallus Anonymus, Chronicle, book 1", "Annals of Hildesheim", "Wolverton, Cosmas of Prague (2015)"]

  - id: boh_seniority
    scenario: year_1000
    civ: bohemia
    year: 1054
    title: "The Law of Seniority"
    place: "Prague"
    speaker: scholar
    speaker_name: "A priest of the cathedral"
    speaker_title: "At the ducal court"
    benchmark_provinces: 1
    story: >-
      You are Bretislav, and you are old. The emperor Henry III made you give back your Polish
      conquests thirteen years ago, and you have rebuilt your power as his man. Poland under
      Casimir has risen again. Casimir took back Silesia a few years since, and Henry's court
      has been asked to judge between you; the terms are that Casimir keeps Silesia, and pays
      you a yearly sum of silver and gold for it.


      Your five sons are growing up. Cosmas tells that you called your nobles together, and
      that you declared the order of your house. You have to choose between a divided
      Bohemia and a single heir.
    choices:
      - label: "Yield Silesia for the tribute, and make the eldest of the house ruler"
        historical: true
        wealth_bp: 1000
        legitimacy_bp: 1000
        influence: {nobility: 1000}
        outcome: >-
          You accept the emperor's judgement, and Casimir pays his tribute for Silesia. The eldest
          living Přemyslid will be duke at Prague, and the younger sons will hold the Moravian
          lordships at Olomouc, Brno and Znojmo. It keeps the peace for a generation, then
          it breeds quarrels of its own: uncles against nephews, and brother against brother,
          for the next hundred years.
        deeds: {give: [m_silesia], give_to: poland}
      - label: "Hold Silesia by force, and give everything to your eldest son"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          The emperor's army would be at your gates, and the younger sons have their own friends.
      - label: "Divide Bohemia equally among your sons"
        unrest_bp: 1500
        outcome: >-
          Within a generation the realm will be five small duchies, each at the mercy of its
          neighbours.
        deeds: {give: [m_silesia], give_to: poland}
    history: >-
      Bretislav I died in January 1055. At the diet of Quedlinburg in 1054 Silesia was
      confirmed to Poland against a yearly tribute, and his decree of seniority, in
      Cosmas's account, laid down that the eldest Přemyslid should rule in Prague.
    sources: ["Cosmas of Prague, Chronica Boemorum, book 2", "Annals of Hildesheim", "Žemlička, Čechy v době knížecí (1997)"]

  - id: boh_crown
    scenario: year_1000
    civ: bohemia
    year: 1085
    title: "A Crown for Your Head Only"
    place: "Mainz"
    speaker: hre
    speaker_name: "King Henry IV"
    speaker_title: "Of the Germans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Vratislaus II, and you have been duke of the Bohemians for twenty-four years. You
      have fought for King Henry IV against the anti-king Rudolf of Swabia, and sent your
      men with him to Rome in 1084, where the pope Gregory VII was driven out. Your own brother
      Jaromír, bishop of Prague, has long been Henry's chancellor.


      Now Henry is the emperor, and he has a gift for you. Both the Church and the German
      princes oppose him, and he needs friends. The gift is a crown.
    choices:
      - label: "Take the crown, and send your host wherever Henry calls"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 800}
        outcome: >-
          At Mainz in 1085 Henry grants you the royal title, and in 1086 the archbishop of Trier
          crowns you in Prague. It is yours alone, not your heirs'; your sons will be dukes. For a
          while the Bohemians are the emperor's favoured friends, and his armies make your
          Bohemia safe.
      - label: "Refuse the crown, and keep out of the emperor's quarrels"
        legitimacy_bp: 500
        outcome: >-
          Henry's anger is brief, but his friendship is cooler. The Bohemian lords wonder
          whether you were wise.
      - label: "Join the pope's party against Henry"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Your bishop, Jaromír, and the emperor himself will be your enemies, and the nobles
          will not follow you.
    history: >-
      In 1085 Henry IV granted Vratislaus II the personal title of king of Bohemia, for his
      loyal service; the title did not become hereditary until 1198.
    diverged: >-
      The Empire is gone.
    sources: ["Cosmas of Prague, Chronica Boemorum, book 2", "Berend, Urbańczyk and Wiszewski, Central Europe in the High Middle Ages (2013)"]

  - id: boh_chlumec
    scenario: year_1000
    civ: bohemia
    year: 1126
    title: "The Battle in the Pass"
    place: "Chlumec, in the Ore Mountains"
    speaker: steward
    speaker_name: "A Czech lord"
    speaker_title: "Of your council"
    benchmark_provinces: 1
    story: >-
      You are Soběslav, brother of the late duke Vladislaus I. When your brother was dying in
      1125 he named your cousin Otto of Olomouc as heir; but the Bohemian lords chose you.
      Otto has gone to the German king Lothair of Supplinburg, and the chroniclers say he
      bribed him, and that Lothair took the silver.


      It is the beginning of 1126. Lothair's army is coming across the mountains to put Otto in
      Prague. The snow is deep. Your people hold the high passes above the Ore Mountains.
    choices:
      - label: "Fight Lothair in the pass at Chlumec"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 800}
        outcome: >-
          On 18 February 1126 your men fall on Lothair's army in a snowstorm near Chlumec. His
          army is routed, many of his lords are killed or taken, and Otto of Olomouc is slain
          in the fight. Lothair, almost trapped, makes peace and confirms you as duke; you swear
          him homage. Bohemia is not conquered again by the Germans for centuries.
        deeds: {martial_bp: 400, peace_with: [hre]}
      - label: "Open the passes, and submit to Otto"
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          You are forced into exile, and Otto is installed by German lances.
      - label: "Buy Lothair off with silver"
        wealth_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          Lothair takes the silver and still wants Otto in Prague.
    history: >-
      On 18 February 1126 Soběslav I defeated King Lothair III at Chlumec; Otto of Olomouc was
      killed, and Soběslav ruled until 1140.
    sources: ["Cosmas of Prague, Chronica Boemorum, book 3", "Canon Vyšehrad (continuator of Cosmas)", "Žemlička, Čechy v době knížecí (1997)"]

  - id: boh_barbarossa
    scenario: year_1000
    civ: bohemia
    year: 1158
    title: "The King's Cavalry at Milan"
    place: "Regensburg"
    speaker: hre
    speaker_name: "Emperor Frederick Barbarossa"
    speaker_title: "King of the Germans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Vladislaus II, and you have been duke of the Bohemians for eighteen years. Your
      wife Judith comes of the princes of Thuringia, and you have served the Empire loyally. The
      emperor Frederick Barbarossa is about to cross the Alps to bring the cities of Lombardy
      to heel, and he has asked for the Bohemian knights.


      In return he offers a crown, as Henry IV once did for Vratislaus. He says it is for
      you, your lifetime, and your service.
    choices:
      - label: "Take the royal crown, and lead your cavalry to Italy"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 800}
        outcome: >-
          In January 1158 Frederick crowns you king at Regensburg, and the Bohemian horse go with
          him into Lombardy and fight at the siege of Milan, the Bohemian knights winning great
          fame in the sources and a bad name among the Italians. Milan fell in 1162. The title is
          still only yours for life, but the kingship is now a habit, and in 1198 it will be made
          hereditary.
        deeds: {men: 800}
      - label: "Stay at home and keep your ducal title"
        legitimacy_bp: -500
        outcome: >-
          The emperor takes your refusal ill. Bohemia must find another way to prosper.
    history: >-
      In January 1158 Frederick Barbarossa granted Vladislaus II the royal title for his life,
      and the Bohemians took part in the Italian campaign.
    diverged: >-
      The Empire is gone.
    sources: ["Otto of Freising and Rahewin, Gesta Friderici", "Vincent of Prague, Annals", "Berend, Urbańczyk and Wiszewski, Central Europe in the High Middle Ages (2013)"]
