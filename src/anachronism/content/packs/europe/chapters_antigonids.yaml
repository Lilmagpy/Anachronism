schema_version: 1
# Chronicle mode (D-120, D-176): the Antigonid kings of Macedon, from the fall of Athens
# to Pydna, 262-168 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Polybius, Livy 31-45, Plutarch's Aratus, Cleomenes and
# Aemilius Paullus, Justin, Pausanias, and inscriptions from Delos and Athens, with modern
# work by Walbank, Gruen, Errington and Hammond. benchmark_provinces counts the provinces
# of this map the real kings held at that date.
chapters:
  - id: ant_athens
    scenario: punic_wars
    civ: macedon
    year: -262
    title: "A Garrison on the Museum Hill"
    place: "Before Athens"
    speaker: athens
    speaker_name: "Envoys of Athens"
    speaker_title: "From the starving city"
    needs_alive: [athens]
    benchmark_provinces: 3
    story: >-
      You are Antigonus, called Gonatas, King of Macedon, grandson of Antigonus One-Eye. You
      studied philosophy in Athens with Zeno the Stoic, and you say that kingship is 'noble
      servitude'.


      Five years ago Athens and Sparta rose against you, with Ptolemy's promises behind them.
      Ptolemy's fleet never came in force; the Spartan king was killed at Corinth. Athens has
      been besieged for two years and is eating its last grain. Its envoys have come to
      surrender.
    choices:
      - label: "Occupy Athens and appoint its magistrates"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Athens surrenders. You put a garrison on the Museum hill, choose its magistrates,
          and remove Chremonides's party. Athens will not be free of Macedonian soldiers for
          thirty years. You leave the philosophers alone.
        deeds: {peace_with: [athens, sparta], tributaries: [athens]}
      - label: "Make peace and leave Athens its freedom"
        legitimacy_bp: 500
        outcome: >-
          The Athenians thank you, put up a statue, and start writing to Ptolemy again.
        deeds: {peace_with: [athens, sparta]}
      - label: "Make peace, but fine Athens heavily"
        legitimacy_bp: 600
        wealth_bp: 1500
        outcome: >-
          Athens pays a large indemnity in silver and keeps its assembly and its walls. The
          citizens are poorer and no less proud.
        deeds: {"peace_with": ["athens"]}
    history: >-
      Athens surrendered to Antigonus Gonatas in 262/1 BC, ending the Chremonidean War, and
      received a Macedonian garrison.
    diverged: >-
      Athens is gone.
    sources: ["Pausanias 3.6", "Diogenes Laertius 7.6-9", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: ant_cos
    scenario: punic_wars
    civ: macedon
    year: -256
    title: "The Flagship at Delos"
    place: "Off the island of Cos"
    speaker: general
    speaker_name: "Your admiral"
    speaker_title: "Of the Macedonian fleet"
    needs_alive: [ptolemaic]
    benchmark_provinces: 3
    story: >-
      For thirty years Ptolemy's fleets have ruled the Aegean and paid Greek cities to fight
      you. Your new fleet is smaller than his, but you have built it around one great ship,
      your flagship.


      The Egyptian fleet is off Cos. Your admiral says the Egyptians are outnumbering you,
      and asks whether to fight. You answer, it is said: "And how many ships do you count me
      for?"
    choices:
      - label: "Give battle off Cos"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The Egyptian fleet is beaten. You dedicate your flagship to Apollo on the sacred
          island of Delos, and found festivals there in your own name. For a generation the
          Aegean is no longer Ptolemy's lake.
        deeds: {ships: 20, grudges: {ptolemaic: 1500}}
      - label: "Wait in harbour and build more ships"
        legitimacy_bp: -500
        wealth_bp: -500
        outcome: >-
          The Egyptians sail past Euboea, and the islands keep paying Ptolemy, while your
          yards go on building.
        deeds: {"ships": 10}
      - label: "Raid Ptolemy's island allies instead"
        legitimacy_bp: 500
        wealth_bp: 800
        outcome: >-
          Your light ships strike at the islands that pay Ptolemy and come away with plunder.
          The Egyptian fleet goes on sailing where it pleases.
        deeds: {"ships": 8}
    history: >-
      Antigonus Gonatas defeated the Ptolemaic fleet off Cos (c. 261-255 BC) and dedicated his
      flagship at Delos.
    diverged: >-
      The Ptolemies are gone.
    sources: ["Plutarch, Moralia 183c, 545b", "Athenaeus 5.209e", "Walbank, in Cambridge Ancient History 7.1 (1984)"]

  - id: ant_corinth
    scenario: punic_wars
    civ: macedon
    year: -243
    title: "The Fetters of Greece"
    place: "Pella"
    speaker: general
    speaker_name: "A survivor of the garrison"
    speaker_title: "From Acrocorinth"
    needs_alive: [achaea]
    benchmark_provinces: 2
    story: >-
      Acrocorinth, the great rock over Corinth, is one of the 'fetters of Greece': whoever
      holds it holds the road into the Peloponnese. Your garrison held it for thirty years.


      Two nights ago Aratus of Sicyon, general of the Achaean League, climbed the rock with
      four hundred men by a path a traitor showed him, and took it at dawn. Corinth has joined
      the Achaeans.
    choices:
      - label: "Concede Corinth and use the Aetolians"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          You make a pact with the Aetolian League to share out Achaea between you. Nothing
          comes of it. You die four years later, at eighty, and Acrocorinth stays Achaean.
        deeds: {give: [mac_corinth], give_to: achaea, grudges: {achaea: 2000}}
      - label: "March at once to retake the rock"
        unrest_bp: 1500
        outcome: >-
          Your army reaches the Isthmus and looks up at the rock, which has never been taken by
          storm.
        deeds: {give: [mac_corinth], give_to: achaea}
      - label: "Offer Aratus a treaty and keep the rest"
        legitimacy_bp: -800
        outcome: >-
          Aratus accepts the peace and keeps Corinth, with your other garrisons left in your
          hands. The Achaeans gain a great fortress and a quieter border.
        deeds: {"give": ["mac_corinth"], "give_to": "achaea", "peace_with": ["achaea"]}
    history: >-
      Aratus seized Acrocorinth from its Macedonian garrison in 243 BC; Corinth joined the
      Achaean League.
    diverged: >-
      The Achaean League is gone.
    sources: ["Plutarch, Aratus 18-24", "Polybius 2.43"]

  - id: ant_sellasia
    scenario: punic_wars
    civ: macedon
    year: -224
    title: "Aratus Changes Sides"
    place: "Pella"
    speaker: achaea
    speaker_name: "Aratus of Sicyon"
    speaker_title: "General of the Achaean League"
    needs_alive: [achaea, sparta]
    benchmark_provinces: 3
    story: >-
      You are Antigonus Doson, guardian of the boy Philip, and king. Cleomenes, King of
      Sparta, has cancelled debts, shared out land, and is beating the Achaean League in
      battle after battle. Aratus, who spent his life fighting Macedon, has swallowed his
      pride and asked for your help.


      Your price: Acrocorinth, back in Macedonian hands.
    choices:
      - label: "Demand Acrocorinth and march south"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Acrocorinth is yours again. At Sellasia in 222 you break Cleomenes, who flees to
          Egypt. You enter Sparta, the first conqueror ever to do so, and treat it gently.
          Then the Illyrians invade Macedon; you hurry home, win, burst a blood vessel shouting
          to your men, and die. Philip, seventeen, is king.
        deeds: {take: [mac_corinth], grudges: {sparta: 2000}}
      - label: "Let the Greeks fight it out"
        legitimacy_bp: -500
        wealth_bp: -300
        outcome: >-
          Cleomenes takes Argos and Corinth. The Peloponnese is Spartan again, for the first
          time in a century.
        deeds: {"men": 5000}
      - label: "Offer to mediate between the two"
        legitimacy_bp: 300
        wealth_bp: -400
        outcome: >-
          Your envoys carry offers to Sparta and to the League. Cleomenes takes the courtesy
          as an insult, and Aratus is cool.
        deeds: {"peace_with": ["sparta", "achaea"]}
    history: >-
      Antigonus Doson helped the Achaeans in return for Acrocorinth (224 BC), defeated
      Cleomenes III at Sellasia (222) and entered Sparta; he died in 221.
    diverged: >-
      Sparta or the Achaeans are gone.
    sources: ["Plutarch, Aratus 38-46, Cleomenes 16-30", "Polybius 2.47-70"]

  - id: ant_hannibal
    scenario: punic_wars
    civ: macedon
    year: -215
    title: "A Treaty with Hannibal"
    place: "Pella"
    speaker: carthage
    speaker_name: "Envoys of Hannibal"
    speaker_title: "From his camp in Italy"
    needs_alive: [carthage, rome]
    benchmark_provinces: 3
    story: >-
      You are Philip V, twenty-three, the darling of the Greeks. The Romans have crossed into
      Illyria, on your western border, and set up their friends there. Now Hannibal has
      destroyed them at Cannae.


      Your envoy Xenophanes has reached Hannibal's camp. A treaty is ready: Carthage and
      Macedon will be friends and allies, and when Rome is beaten, Rome will give up Illyria.
    choices:
      - label: "Make a treaty with Carthage"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          On the way home, your envoys' ship is captured by the Roman fleet, and the treaty
          is read out in the Senate. Rome sends a fleet to the Adriatic and makes friends with
          your enemies in Greece. You fight Rome for nine years without ever meeting Hannibal.
        deeds: {grudges: {rome: 2500}}
      - label: "Stay out and watch"
        legitimacy_bp: -500
        outcome: >-
          You watch from Pella as Rome and Carthage destroy each other's armies, and wait to
          see who is left.
      - label: "Build a fleet and guard the Illyrian coast"
        legitimacy_bp: 200
        wealth_bp: -600
        outcome: >-
          A hundred light ships are laid down at Pella's harbours, and your garrisons watch
          the western frontier. Rome looks on, and does nothing yet.
        deeds: {"men": 6000, "ships": 20}
    history: >-
      Philip V's treaty with Hannibal (215 BC) was discovered when the Romans captured his
      envoys, leading to the First Macedonian War (214-205).
    diverged: >-
      Rome or Carthage is gone.
    sources: ["Polybius 7.9 (the text of the treaty)", "Livy 23.33-39"]

  - id: ant_cynoscephalae
    scenario: punic_wars
    civ: macedon
    year: -197
    title: "The Dog's Heads"
    place: "Cynoscephalae, in Thessaly"
    speaker: rome
    speaker_name: "Titus Quinctius Flamininus"
    speaker_title: "Consul, thirty years old"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      Rome has come back for you. Its consul Flamininus speaks good Greek and tells the
      Greeks he has come to free them from Macedon.


      In fog, in the hills called the Dog's Heads, your phalanx and the legions have run into
      each other. Your right wing has charged downhill and is driving the Romans back. Your
      left wing is still forming up in column on the ridge.
    choices:
      - label: "Throw the whole army into the fight"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          Roman elephants smash your left before it can form. A Roman tribune takes twenty
          maniples round behind your victorious right and cuts it down. The phalanx raises its
          spears in surrender; the Romans, who do not know the sign, keep killing. At the
          Isthmian Games next year, Flamininus announces that the Greeks are free, and the
          crowd shout so loud that birds fall out of the sky.
        deeds: {give: [mac_thessaly, mac_corinth]}
      - label: "Pull the right wing back into the fog"
        legitimacy_bp: -1000
        outcome: >-
          Your army withdraws through the fog in good order. Flamininus writes to Rome that the
          war will be longer than he thought.
      - label: "Break off and open talks with Flamininus"
        legitimacy_bp: -1200
        wealth_bp: -500
        outcome: >-
          You send a herald under a branch and call your men from the hill. Flamininus gives
          you a truce, and his terms are not light.
        deeds: {"peace_with": ["rome"]}
    history: >-
      Flamininus defeated Philip V at Cynoscephalae (197 BC); Macedon gave up Greece, whose
      freedom Flamininus proclaimed at the Isthmian Games of 196.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 18.18-27, 18.46", "Livy 33.6-11, 33.32-33", "Plutarch, Flamininus 7-10"]

  - id: ant_demetrius
    scenario: punic_wars
    civ: macedon
    year: -180
    title: "A Letter from Flamininus"
    place: "Pella"
    speaker: steward
    speaker_name: "Perseus"
    speaker_title: "Your elder son"
    benchmark_provinces: 1
    story: >-
      You have two sons. Demetrius, the younger, lived in Rome as a hostage, made friends
      there, and the Romans like him. Perseus, the elder, your heir, is sure the Romans want
      Demetrius on your throne.


      Perseus has brought you a letter, in Flamininus's name, which says Demetrius has been
      plotting with Rome. Demetrius swears it is a lie.
    choices:
      - label: "Act on Perseus's letter"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Demetrius is poisoned on your orders. Then you learn that the letter was forged. You
          spend your last year wanting to disinherit Perseus, and die before you can.
      - label: "Take Demetrius's word instead"
        unrest_bp: 1500
        outcome: >-
          Perseus is sent to a frontier command, sulking. Rome is pleased with your choice of
          friends.
      - label: "Hold an inquiry before the council"
        legitimacy_bp: 300
        unrest_bp: 400
        outcome: >-
          The council hears both sons for days. The letter's seals look genuine to some and
          false to others, and nothing is settled.
    history: >-
      Philip V had his son Demetrius killed in 180 BC on the strength of a letter, later
      thought to be forged, and died in 179.
    sources: ["Livy 40.5-24, 40.54-56", "Polybius 23.7"]

  - id: ant_pydna
    scenario: punic_wars
    civ: macedon
    year: -168
    title: "The Moon Goes Dark"
    place: "Pydna, on the Macedonian coast"
    speaker: general
    speaker_name: "One of your Companion officers"
    speaker_title: "With the cavalry"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Perseus. For three years you have held off the Romans, and the Greeks have begun
      to look to you. Now the consul Aemilius Paullus, sixty, careful and stubborn, is camped
      across a stream from your army at Pydna.


      Last night the moon went dark, and your soldiers wailed and banged pots. The Romans had
      been told in advance by an officer who knew astronomy. This afternoon a horse got loose
      by the stream, and the skirmishing over it is turning into a battle.
    choices:
      - label: "Order the whole line forward"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The phalanx rolls forward, and Aemilius says afterwards he has never seen anything so
          terrifying. Then it reaches broken ground and opens gaps, and the legionaries get in
          among the pikes with their swords. In an hour it is over. You flee to Samothrace,
          are taken, and walk in Aemilius's triumph in Rome. Macedon is cut into four
          republics. The Antigonid kingdom is over.
        deeds: {ruler_falls: "is taken to Rome in chains"}
      - label: "Keep the line on its own ground"
        legitimacy_bp: -500
        outcome: >-
          Your officers pull the skirmishers back. The phalanx stays on its own ground, and
          Aemilius waits.
      - label: "Withdraw toward the mountains and wait"
        legitimacy_bp: -300
        outcome: >-
          The army breaks camp in the night and withdraws to the foothills. Aemilius follows
          slowly, and your Greek allies begin to ask questions.
        deeds: {"men": 4000}
    history: >-
      Aemilius Paullus defeated Perseus at Pydna (22 June 168 BC, after a lunar eclipse);
      Perseus was led in Aemilius's triumph and Macedon was divided into four republics.
    diverged: >-
      Rome is gone.
    sources: ["Livy 44.36-46, 45.29", "Plutarch, Aemilius Paullus 16-34", "Polybius 29.15-18"]
