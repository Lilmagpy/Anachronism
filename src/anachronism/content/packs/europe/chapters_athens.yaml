schema_version: 1
# Chronicle mode (D-120, D-165): Athens under Alexander, from Philip's death to the end of
# the democracy, 336-322 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Athens had no king: the chronicle follows the leading
# statesman of the day, Demosthenes, then Hyperides, then Phocion. Facts follow the
# speeches of Demosthenes, Aeschines, Hyperides and Lycurgus, Plutarch's Lives of
# Demosthenes and Phocion, Arrian, Diodorus 17-18 and the Lives of the Ten Orators, with
# modern work by Worthington, Habicht and Hansen. Attica is one province throughout.
chapters:
  - id: ath_garland
    scenario: alexander
    civ: athens
    year: -336
    title: "A Garland on the Seventh Day"
    place: "The Assembly on the Pnyx"
    speaker: scholar
    speaker_name: "Aeschines"
    speaker_title: "Orator, your enemy"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Demosthenes, the greatest orator in Athens, and for twenty years the voice
      against Philip of Macedon. Two years ago Philip beat Athens and Thebes at Chaeronea.
      You fought in the line, and ran with everyone else.


      Your daughter died a week ago. This morning a secret messenger told you that Philip has
      been murdered at his daughter's wedding. Before the official news arrives, you have
      come to the Assembly in a white robe and a garland, to propose a sacrifice of
      thanksgiving and a crown for the assassin. Aeschines says it is indecent: a father in
      mourning, celebrating a murder. The new king of Macedon is twenty.
    choices:
      - label: "Celebrate openly and write to the Greeks"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Athens sacrifices. You write to the Persian generals in Asia and to the cities of
          Greece. Alexander comes south so fast that before anyone has an army he is at the
          pass of Thermopylae. Athens sends an embassy to apologise for being slow to
          recognise him. You go with it as far as Mount Cithaeron, and turn back.
        deeds: {grudges: {macedon: 1500}}
      - label: "Mourn your daughter, and wait"
        legitimacy_bp: -500
        outcome: >-
          You stay at home. The Assembly sends the young king its congratulations, which he
          does not believe.
      - label: "Write to the Persians, and say nothing"
        wealth_bp: 500
        unrest_bp: 300
        legitimacy_bp: 200
        outcome: >-
          You wear no garland and make no speech. Your letters go east to the Persian
          generals, and the Assembly hears nothing of it. The money that comes back is used
          quietly, and the young king is not told.
    history: >-
      Demosthenes appeared garlanded in the Assembly on hearing of Philip's murder (336 BC),
      seven days after his daughter's death; Aeschines attacked him for it in 330.
    diverged: >-
      Macedon is gone.
    sources: ["Aeschines, Against Ctesiphon 77", "Plutarch, Demosthenes 22", "Worthington, Demosthenes of Athens and the Fall of Classical Greece (2013)"]

  - id: ath_thebes
    scenario: alexander
    civ: athens
    year: -335
    title: "Thebes Asks for Help"
    place: "The Assembly on the Pnyx"
    speaker: thebes
    speaker_name: "Envoys of Thebes"
    speaker_title: "From the besieged city"
    needs_alive: [thebes, macedon]
    benchmark_provinces: 1
    story: >-
      A rumour came from the north that Alexander had been killed fighting in Illyria. Thebes
      rose, and is besieging the Macedonian garrison in its citadel. You have sent them arms
      bought with Persian gold.


      Now Alexander, very much alive, has marched three hundred miles in thirteen days and is
      outside Thebes. The Theban envoys ask Athens to march. The Assembly has voted to help
      Thebes; it has not yet voted to send anyone.
    choices:
      - label: "Hold the army back and wait"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Athens waits. Alexander storms Thebes, kills six thousand, sells the rest as slaves
          and razes the city, sparing only the temples and the house of the poet Pindar. The
          Athenians are celebrating the Mysteries when the refugees arrive; they stop the
          festival.
      - label: "March to Thebes with the hoplites"
        legitimacy_bp: 1000
        unrest_bp: 1500
        outcome: >-
          The Athenian hoplites reach the passes of Cithaeron. The Macedonians turn to meet
          them.
        deeds: {men: 6000, grudges: {macedon: 4000}}
      - label: "Send a small force to the Isthmus"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          A few thousand men go as far as the Isthmus and stay there, watching the roads,
          while the Assembly argues about the rest. Alexander's army is quicker than the debate.
        deeds: {men: 2000}
    history: >-
      Thebes revolted in 335 BC on a false report of Alexander's death; Athens voted support
      but sent no army, and Thebes was destroyed.
    diverged: >-
      Thebes or Macedon is gone; there was no siege of Thebes.
    sources: ["Arrian, Anabasis 1.7-10", "Diodorus 17.8-14", "Plutarch, Alexander 11-13"]

  - id: ath_orators
    scenario: alexander
    civ: athens
    year: -335
    title: "The King Wants the Orators"
    place: "The Assembly on the Pnyx"
    speaker: steward
    speaker_name: "Demades"
    speaker_title: "Orator, Macedon's friend"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      With Thebes in ruins, Alexander has written to Athens. He wants eight men handed over to
      him: the generals and orators who stirred up the Greeks. You are first on the list.
      Phocion, the old general, says the men on the list should give themselves up for the
      city's sake.


      Demades, an orator who is said to be in Macedon's pay, offers to go to the king and
      talk him out of it - for a fee.
    choices:
      - label: "Send Demades to plead with the king"
        historical: true
        wealth_bp: -1000
        legitimacy_bp: 500
        outcome: >-
          Demades goes, with five talents in his pocket, and Alexander, who wants to get to
          Persia, lets the matter drop: only the general Charidemus is exiled. You tell the
          Assembly the story of the sheep who gave up their dogs to the wolves.
      - label: "Hand the eight men over"
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          The Assembly votes to surrender them. You are taken north under guard.
        deeds: {ruler_falls: "is handed over to Alexander"}
      - label: "Refuse the demand and arm the walls"
        legitimacy_bp: 800
        unrest_bp: 1000
        outcome: >-
          You tell the king's envoys that Athens does not give up her citizens. The walls are
          manned and the young men sent to their posts, and the Assembly waits to see whether
          the king has time to spare.
        deeds: {men: 3000, grudges: {macedon: 3000}}
    history: >-
      In 335 BC Alexander demanded the surrender of Athenian orators and generals, including
      Demosthenes; Demades persuaded him to withdraw the demand.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Demosthenes 23", "Arrian, Anabasis 1.10", "Diodorus 17.15"]

  - id: ath_lycurgus
    scenario: alexander
    civ: athens
    year: -332
    title: "A Theatre of Stone"
    place: "The theatre of Dionysus"
    speaker: steward
    speaker_name: "Lycurgus"
    speaker_title: "Controller of the city's finances"
    benchmark_provinces: 1
    story: >-
      Athens has no more wars to pay for, for now, and Lycurgus runs its finances better than
      anyone has since Pericles. Revenue has doubled. He has built new ship-sheds and an
      arsenal, and made every young citizen do two years of military training.


      Now he wants to rebuild the theatre of Dionysus in stone, for seventeen thousand people;
      to put up bronze statues of Aeschylus, Sophocles and Euripides; and to have official
      copies made of their plays, kept in the state archive, which actors will not be
      allowed to change.
    choices:
      - label: "Build the theatre, and fix the texts"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 1500
        wealth_bp: -1500
        outcome: >-
          The theatre still stands under the Acropolis. The official copies are so famous that
          Ptolemy III of Egypt will borrow them, against a deposit of fifteen talents, and keep
          them in Alexandria, forfeiting the money. Most of what we can read of Greek tragedy
          descends from them.
      - label: "Put the money in the war chest"
        wealth_bp: 2000
        legitimacy_bp: 400
        outcome: >-
          The silver goes into the treasury on the Acropolis. The actors go on improving the
          classics.
      - label: "✦ Print the plays for every citizen"
        needs_adopted: [printing_press]
        knowledge_bp: 5000
        legitimacy_bp: 1000
        outcome: >-
          Every Athenian household that wants one has its Sophocles. Not a play of the great
          three is ever lost.
      - label: "Spend the money on triremes"
        wealth_bp: -800
        legitimacy_bp: 500
        outcome: >-
          The ship-sheds fill with new hulls, and the rowers have work. The theatre waits, and
          the actors go on improving the classics.
        deeds: {ships: 10}
    history: >-
      Lycurgus (in charge of Athenian finances c. 336-324 BC) completed the stone theatre of
      Dionysus and had official texts of the three tragedians deposited in the archive.
    sources: ["[Plutarch], Lives of the Ten Orators 841f", "Galen, Commentary on Hippocrates' Epidemics 3", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: ath_agis
    scenario: alexander
    civ: athens
    year: -331
    title: "Sparta Rises"
    place: "The Assembly on the Pnyx"
    speaker: sparta
    speaker_name: "Envoys of King Agis III"
    speaker_title: "Of Sparta"
    needs_alive: [sparta]
    benchmark_provinces: 1
    story: >-
      Alexander is far away in Mesopotamia, chasing the Great King. Sparta, which never
      joined Philip's League, has risen at last. King Agis has Persian money and eight
      thousand Greek mercenaries who escaped from the battle at Issus. He has beaten a
      Macedonian army and is besieging Megalopolis.


      His envoys ask Athens to join. Your fleet would make the difference. The young men who
      have just done Lycurgus's military training are eager. You are not sure.
    choices:
      - label: "Keep the fleet in the Piraeus"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Athens stays at home. Antipater marches south with forty thousand men and crushes
          Agis at Megalopolis; Agis, wounded, fights on his knees until he is killed. When
          Alexander hears, he calls it a battle of mice.
      - label: "Send the fleet to the Peloponnese"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          The triremes sail round to the Peloponnese. Antipater, who had only Agis to fight,
          now has two enemies.
        deeds: {grudges: {macedon: 3000}}
      - label: "Send Agis gold and arms in secret"
        wealth_bp: -800
        legitimacy_bp: 200
        unrest_bp: 300
        outcome: >-
          A few shiploads of shields and silver go south by night, and the Assembly pretends not to
          know. Agis is grateful, and Antipater, when he hears, is not.
        deeds: {men: 1000}
    history: >-
      Agis III's war against Macedon (331-330 BC) ended with his death at Megalopolis.
      Athens, led by Demosthenes, stayed neutral.
    diverged: >-
      Sparta is gone.
    sources: ["Diodorus 17.62-63", "Curtius 6.1", "Plutarch, Agesilaus 15"]

  - id: ath_crown
    scenario: alexander
    civ: athens
    year: -330
    title: "On the Crown"
    place: "The law court"
    speaker: scholar
    speaker_name: "Aeschines"
    speaker_title: "Orator, your enemy"
    benchmark_provinces: 1
    story: >-
      Six years ago your friend Ctesiphon proposed that Athens give you a golden crown for
      your services. Aeschines sued him for an illegal proposal, and the case has waited
      until now. It is really a trial of you, and of everything you have done against
      Macedon, which has ended in defeat.


      All Greece has come to listen. Aeschines has spoken all morning. Now it is your turn.
    choices:
      - label: "Defend your whole career"
        historical: true
        legitimacy_bp: 2500
        knowledge_bp: 500
        outcome: >-
          You say that Athens was right to fight even though it lost, and swear 'by those who
          stood in the front line at Marathon'. Aeschines does not get a fifth of the votes, is
          fined, and leaves Athens for ever, to teach rhetoric on Rhodes. Your speech will be
          called the greatest ever made.
      - label: "Keep to the legal point"
        legitimacy_bp: 500
        outcome: >-
          Ctesiphon is acquitted, narrowly. Nobody remembers the speech.
      - label: "Turn on Aeschines's own record"
        legitimacy_bp: 1200
        unrest_bp: 500
        outcome: >-
          You go through Aeschines's embassies and his dealings with Philip one by one. The jury
          is moved and amused, and your enemy is made to look small. The question of the crown
          itself is hardly argued.
    history: >-
      In the trial of 330 BC Demosthenes's On the Crown defeated Aeschines's Against
      Ctesiphon; Aeschines left Athens.
    sources: ["Demosthenes 18, On the Crown", "Aeschines 3, Against Ctesiphon", "Plutarch, Demosthenes 24"]

  - id: ath_harpalus
    scenario: alexander
    civ: athens
    year: -324
    title: "The Treasurer's Gold"
    place: "Piraeus"
    speaker: steward
    speaker_name: "Harpalus"
    speaker_title: "Alexander's runaway treasurer"
    benchmark_provinces: 1
    story: >-
      Harpalus, Alexander's boyhood friend and treasurer, has robbed the treasury at Babylon
      and fled, with six thousand mercenaries and seven hundred talents. He has sailed into
      the Piraeus and asked Athens for asylum. With his money, he says, Athens could fight.


      Alexander has just ordered every Greek city to take back its exiles, which for Athens
      means giving up the island of Samos. His envoys will soon be here demanding Harpalus.
    choices:
      - label: "Arrest him, and hold his gold"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Harpalus escapes. When the gold is counted, half of it has gone. A court finds that
          you took twenty talents of it, fines you fifty, and you flee into exile. Your rival
          Hyperides, who prosecuted you, leads Athens now.
        deeds: {ruler_falls: "is convicted of taking Harpalus's gold, and flees"}
      - label: "Take his gold and his soldiers"
        wealth_bp: 3000
        unrest_bp: 1500
        outcome: >-
          Athens has an army and a war chest. Alexander, at Susa, is told.
        deeds: {men: 6000, grudges: {macedon: 4000}}
      - label: "Hand him over to Alexander"
        legitimacy_bp: -500
        wealth_bp: 300
        outcome: >-
          Harpalus is taken to Alexander, who has him executed. The gold goes back to Babylon.
    history: >-
      Harpalus came to Athens in 324 BC; his money was deposited on the Acropolis, half of it
      vanished, and Demosthenes was convicted of taking a bribe and went into exile.
    sources: ["Hyperides, Against Demosthenes", "Plutarch, Demosthenes 25-26", "Diodorus 17.108"]

  - id: ath_lamia
    scenario: alexander
    civ: athens
    year: -323
    title: "Alexander Is Dead"
    place: "The Assembly on the Pnyx"
    speaker: general
    speaker_name: "Leosthenes"
    speaker_title: "General of Athens"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Hyperides. Alexander has died at Babylon, at thirty-two. "Dead?" says Demades.
      "If he were, the whole world would stink of his corpse."


      He is dead. Leosthenes has eight thousand mercenaries waiting at Cape Taenarum, hired
      with the money Harpalus left. The Aetolians and Thessalians will join. You can recall
      Demosthenes from exile, and free Greece.
    choices:
      - label: "Go to war with Macedon"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: 1000
        outcome: >-
          Demosthenes comes home in a state trireme, and the whole city goes down to the
          Piraeus to meet him. Leosthenes beats Antipater and shuts him up in the town of
          Lamia. Then Leosthenes is killed by a stone from the walls, Macedonian armies arrive
          from Asia, and the Athenian fleet is destroyed off Amorgos: the last battle of the
          navy of Salamis.
        deeds: {men: 8000, grudges: {macedon: 5000}}
      - label: "Wait to see who rules Macedon"
        legitimacy_bp: -1000
        wealth_bp: 500
        outcome: >-
          The Macedonian generals quarrel over the empire. Athens keeps its money and its
          ships, and its orators keep talking.
      - label: "Hire the mercenaries, but declare no war"
        legitimacy_bp: 500
        wealth_bp: -800
        outcome: >-
          Leosthenes keeps his men at Taenarum on Athens's pay, and the Assembly votes nothing.
          Every other city sees that Athens is ready and nobody can say that she has declared herself.
        deeds: {men: 4000}
    history: >-
      On Alexander's death (June 323 BC) Athens led a Greek revolt, the Lamian War;
      Leosthenes besieged Antipater at Lamia but was killed, and Athens lost at sea (Amorgos)
      and on land (Crannon) in 322.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 18.8-18", "Hyperides, Funeral Speech", "Plutarch, Demosthenes 27, Phocion 23-26"]

  - id: ath_antipater
    scenario: alexander
    civ: athens
    year: -322
    title: "Antipater's Terms"
    place: "Athens, after Crannon"
    speaker: general
    speaker_name: "Phocion"
    speaker_title: "General, elected forty-five times"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Crannon is lost. Antipater is in Boeotia, and Athens has no army and no fleet. Old
      Phocion, who never wanted this war, has gone to ask for terms.


      They are hard. Athens must pay for the war, accept a Macedonian garrison in the
      Piraeus, and give up the men who started it - Hyperides and Demosthenes. And only men
      with two thousand drachmas of property will be citizens: nine thousand of them. The
      other twelve thousand, the rowers and the poor, will lose the vote. That is the end of
      the democracy.
    choices:
      - label: "Accept the terms"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Antipater's hunters, led by an actor called Archias, catch Hyperides at Aegina and
          put him to death. Demosthenes reaches the temple of Poseidon on Calauria, asks for
          time to write a letter, bites the end of his pen, and dies of the poison hidden in
          it. Athens will have a democracy again, for a while, but never again its own fleet,
          or its own foreign policy.
        deeds: {ruler_falls: "is caught at Aegina and put to death"}
      - label: "Fight on behind the Long Walls"
        food_bp: -2500
        unrest_bp: 2500
        outcome: >-
          The citizens man the walls. Antipater blockades the Piraeus and waits for Athens to
          get hungry.
        deeds: {grudges: {macedon: 3000}}
      - label: "Send Phocion back to bargain harder"
        legitimacy_bp: -1500
        wealth_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Phocion goes back to the camp with an offer of money and a smaller garrison. Antipater
          listens, and then repeats his terms.
    history: >-
      After Crannon (322 BC) Antipater imposed a garrison at Munychia and a property
      qualification on the Athenian citizenship. Hyperides was executed; Demosthenes took
      poison on Calauria.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Demosthenes 28-30, Phocion 27-28", "Diodorus 18.18", "Habicht, Athens from Alexander to Antony (1997)"]
