schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of León, from the child king Alfonso V to Alfonso
# VI's defeat at Sagrajas, 1000-1086. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Historia Silense, the chronicles of
# Pelayo of Oviedo, Lucas of Tuy and Rodrigo Jiménez de Rada, the Historia Roderici, Arabic
# accounts of Sagrajas (Ibn al-Kardabus, al-Maqqari) and the Fuero of León, with modern work by
# Reilly, Fletcher, Collins and Lourie. The kings' ages at accession are approximate. One
# 'province' on this map, 'León and Castile', stands for the whole heartland, so Castile's
# counts and kings are folded into it; benchmark_provinces counts the provinces of this map
# the real kings of León held at that date (León and Castile; Galicia; and Toledo from 1085).
chapters:
  - id: leo_fuero
    scenario: year_1000
    civ: leon
    year: 1017
    title: "The Laws of León"
    place: "León"
    speaker: scholar
    speaker_name: "A bishop of your court"
    speaker_title: "Of the council"
    benchmark_provinces: 2
    story: >-
      You are Alfonso, the fifth of that name, and you are twenty-three. You were crowned at
      five, when your father Vermudo died, and your mother and your guardian Count Menendo ruled
      in your name. Almanzor, who burned León and carried off the bells of Santiago, has been
      dead these fifteen years, and the caliphate he ruled is falling into civil war. Córdoba is
      no longer at your gates.


      Your city is half in ruins. You want it rebuilt, resettled and safe for merchants and
      pilgrims alike. Your bishops want a great council of lords, clergy and townsmen, to give
      the kingdom laws that last. Your barons want your friendship and their old customs
      left alone. Your horsemen want plunder from the divided south.
    choices:
      - label: "Summon a council and issue laws"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -800
        influence: {clergy: 800, guilds: 600}
        outcome: >-
          In 1017 bishops, magnates and townsmen meet at León to hear your laws: the peace of
          the church, of the roads and of the market, and rules on judges and fines. The Fuero
          of León is among the earliest such codes in Christian Spain, and the city it protects
          begins to fill again. Córdoba, tearing itself apart, has no strength left to trouble
          you.
        deeds: {peace_with: [cordoba]}
      - label: "Rule by your court's old customs"
        legitimacy_bp: 500
        unrest_bp: 300
        influence: {nobility: 800}
        outcome: >-
          The nobles are pleased. The townsmen, who had been promised order, are not.
        deeds: {peace_with: [cordoba]}
      - label: "Raid the divided south for plunder"
        wealth_bp: 1500
        unrest_bp: 800
        legitimacy_bp: -300
        outcome: >-
          Your horsemen come back with captives and cattle, but León remains a ruin.
        deeds: {men: 3000, grudges: {cordoba: 1500}}
    history: >-
      Alfonso V held a council at León in 1017 which issued the Fuero of León: laws for the
      kingdom and for the city's market and justice.
    sources: ["Fuero de León (1017), ed. Vázquez de Parga", "Collins, Early Medieval Spain (1983)", "Reilly, The Kingdom of León-Castilla under Queen Urraca (1982)"]

  - id: leo_viseu
    scenario: year_1000
    civ: leon
    year: 1028
    title: "The Siege of Viseu"
    place: "Viseu"
    speaker: general
    speaker_name: "A count of your western march"
    speaker_title: "At the siege"
    benchmark_provinces: 2
    story: >-
      You are Alfonso V, and you have been a good king. You have rebuilt León, given it laws and
      kept the peace with your neighbour the count of Castile. Your daughter Sancha is promised
      to the young count, García Sánchez, and the wedding will unite the two houses.


      In the west, in what is now Portugal, the Moorish town of Viseu is still in Muslim hands.
      You have laid siege to it, and it goes slowly. Some of your captains urge you to take
      command of the assault yourself. Others say a king should not risk his person.
    choices:
      - label: "Direct the assault in person"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          An arrow from the walls strikes you down in 1028. Your son Bermudo is a boy of ten or
          eleven, and his mother Elvira rules for him. The following year young García of
          Castile, who was to marry your daughter, is murdered at León by the Vela family, and
          Sancho the Great of Navarre, García's brother-in-law, takes Castile.
        deeds: {ruler_falls: "is killed by an arrow before Viseu"}
      - label: "Leave the siege to your captains"
        legitimacy_bp: 500
        wealth_bp: -500
        unrest_bp: -300
        outcome: >-
          Viseu holds out another year, but you live to see your daughter wed to the count of
          Castile.
      - label: "Offer the garrison terms to surrender"
        legitimacy_bp: 300
        wealth_bp: 500
        outcome: >-
          The garrison haggles for weeks, and in the end the siege is lifted for a payment and a
          truce. You live to see your daughter wed to the count of Castile.
    history: >-
      Alfonso V was killed by an arrow while besieging Viseu in 1028, leaving a boy king,
      Bermudo III. García Sánchez of Castile was murdered at León in 1029.
    sources: ["Historia Silense 71-72", "Pelayo of Oviedo, Chronicle", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)"]

  - id: leo_tamaron
    scenario: year_1000
    civ: leon
    year: 1037
    title: "Tamarón"
    place: "Tamarón"
    speaker: general
    speaker_name: "A Leonese count"
    speaker_title: "Of your army"
    benchmark_provinces: 2
    story: >-
      You are Bermudo III, the last king of the old line, and you are twenty. Sancho the Great of
      Navarre, who ruled Castile and overshadowed you, died two years ago and divided his lands
      among his sons. His son Ferdinand has Castile, and your sister Sancha is his wife. You
      have taken back the lands between the Cea and the Pisuerga that Sancho held.


      Ferdinand's brother García, the king of Navarre, has marched with him. Their army stands
      at Tamarón, near Burgos.
    choices:
      - label: "Give battle at Tamarón"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          On 4 September 1037 you are killed in the battle. You have no son. Ferdinand, your
          brother-in-law, has your sister Sancha, your father's heiress, as his queen, and he is
          accepted by the lords of León, and crowned king there in 1038. For the first time
          Castile and León have one king. The old Leonese line is at an end.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia], ruler_falls: "falls at Tamarón"}
      - label: "Make peace, acknowledge Ferdinand's rights"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Ferdinand accepts your homage and leaves you your crown, for a while. You are a king
          without heirs, with an ambitious brother-in-law, and the Leonese lords are looking
          around.
        deeds: {peace_with: [navarre]}
      - label: "Fall back to Galicia and gather levies"
        legitimacy_bp: -500
        outcome: >-
          The brothers march on León without you. The lords of the city have no reason to die
          for a king who is not there.
        deeds: {men: 4000}
    history: >-
      Bermudo III was killed at Tamarón on 4 September 1037; Ferdinand I, count of Castile and
      husband of Bermudo's sister Sancha, was crowned king of León in 1038.
    sources: ["Historia Silense 77-80", "Pelayo of Oviedo, Chronicle", "Reilly, The Kingdom of León-Castilla (1982)"]

  - id: leo_parias
    scenario: year_1000
    civ: leon
    year: 1060
    title: "Gold from the Taifas"
    place: "León"
    speaker: steward
    speaker_name: "Queen Sancha"
    speaker_title: "Your wife, heiress of León"
    benchmark_provinces: 2
    story: >-
      You are Ferdinand, king of León and Castile. For more than twenty years you have ruled
      the two united kingdoms, with your wife Sancha at your side. South of the frontier the
      caliphate of Córdoba is gone and its lands are split into little kingdoms, the taifas, of
      Toledo, Zaragoza, Seville and Badajoz, each a rich city with its own king and a small
      army.


      Your knights say you should take the cities one by one. Your treasurers say that gold
      is a better servant than land. Your marshals say a few good raids will bring the
      kings to terms. The monks of Cluny, whom you and Sancha favour, would be glad of gifts.
    choices:
      - label: "Make the taifa kings pay for peace"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 1000
        influence: {clergy: 600}
        outcome: >-
          Your armies ride into the lands of Zaragoza, Toledo, Seville and Badajoz, and the kings
          pay you in gold to go away. In the west you take Viseu and Lamego, and in 1064, after a
          long siege, Coimbra, so that your frontier reaches the Mondego. The gold pays for
          churches and for gifts to Cluny. The Muslim kings are a source of income that you do
          not conquer, and their gold will make your sons greedy.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia]}
      - label: "Besiege Toledo and take it"
        legitimacy_bp: -500
        unrest_bp: 1500
        wealth_bp: -1000
        outcome: >-
          The walls of Toledo, on its rock in the bend of the Tagus, defy you, and your army is
          worn out in front of them.
        deeds: {martial_bp: -500, grudges: {cordoba: 2500}}
      - label: "Raid the taifas' fields for plunder"
        wealth_bp: 1500
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          Your horsemen come back laden with cattle, captives and cloth. The kings of the taifas
          remember it and strengthen their walls, and the gold you might have had in tribute does
          not come.
        deeds: {martial_bp: 500, grudges: {cordoba: 1500}}
    history: >-
      In the 1050s and early 1060s Ferdinand I took Viseu, Lamego and Coimbra, and made the
      taifas of Zaragoza, Toledo, Seville and Badajoz pay parias.
    sources: ["Historia Silense 90-100", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)", "Lourie, 'A Society Organized for War' (1966)"]

  - id: leo_isidore
    scenario: year_1000
    civ: leon
    year: 1063
    title: "The Saint from Seville"
    place: "Seville"
    speaker: scholar
    speaker_name: "Bishop Alvito of León"
    speaker_title: "Your envoy"
    benchmark_provinces: 2
    story: >-
      You are Ferdinand. Your army has ridden into the lands of Seville, and al-Mutadid, its
      king, has agreed to pay you tribute. You can make another demand. Isidore, the great
      bishop of Seville, who wrote the encyclopedia the Etymologies and died in 636, lies in his
      city, among Muslims. You want his bones to rest with the Christians of the north.


      Bishop Alvito of León and Bishop Ordoño of Astorga are ready to go and find them. The Historia
      Silense says that they first sought the body of the martyr Justa, and that a miracle led
      them to Isidore instead.
    choices:
      - label: "Demand Isidore's relics for León"
        historical: true
        legitimacy_bp: 2500
        knowledge_bp: 500
        influence: {clergy: 1500}
        outcome: >-
          In December 1063 the body of Isidore arrives in León, and the king and his people go
          out to meet it. You enlarge the old church of San Juan as a shrine, and it becomes San
          Isidoro, the burial place of the kings of León. A kingdom that claims to be the heir of
          the Goths now has the most learned of Gothic bishops in its capital.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia]}
      - label: "Take tribute only, leave the dead"
        wealth_bp: 1000
        legitimacy_bp: -300
        influence: {clergy: -500}
        outcome: >-
          The king of Seville is pleased, and your bishops are not.
        deeds: {peace_with: [cordoba]}
      - label: "Ask for Seville's Christian captives"
        legitimacy_bp: 1000
        wealth_bp: 500
        influence: {clergy: 500}
        outcome: >-
          Al-Mutadid frees a number of Christian captives and sends them north with gifts. Your
          bishops say it is a good deed, and wonder what became of Isidore.
        deeds: {peace_with: [cordoba]}
    history: >-
      In December 1063 the body of Isidore of Seville was brought from Seville to León, in
      Ferdinand I's time, and placed in the church that became San Isidoro.
    sources: ["Historia Silense 95-100", "Lucas of Tuy, Chronicon Mundi 4", "Fletcher, The Episcopate in the Kingdom of León (1978)"]

  - id: leo_division
    scenario: year_1000
    civ: leon
    year: 1065
    title: "Five Children"
    place: "León"
    speaker: steward
    speaker_name: "Queen Sancha"
    speaker_title: "Your wife"
    benchmark_provinces: 1
    story: >-
      You are Ferdinand, and you are dying. You came to León at Christmas, sick from a campaign,
      and went to pray in the church of San Isidoro, where, says the Historia Silense, you laid
      aside your crown and royal robes and put on penitent's dress.


      You have three sons and two daughters. Sancho, the eldest, is a soldier and a Castilian,
      and wants the whole. Alfonso is, say the chroniclers, your wife's favourite. García is
      the youngest. Urraca and Elvira will need places, too. Your wife says that a divided
      kingdom will need strong hands.
    choices:
      - label: "Divide the realm among your children"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Sancho gets Castile. Alfonso gets León and Asturias. García gets Galicia and your new
          lands in Portugal. Urraca has Zamora, and Elvira Toro. Each of the brothers has the
          parias from a different taifa. You die on 27 December 1065. Within seven years the
          brothers are at war, and only one will keep a throne.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia], give: [m_galicia]}
      - label: "Leave all to Sancho, the eldest"
        legitimacy_bp: 500
        unrest_bp: 800
        influence: {nobility: 500}
        outcome: >-
          The younger sons are outraged, and your wife with them. León does not like being a
          province of Castile.
        deeds: {peace_with: [cordoba]}
      - label: "Leave everything to Alfonso"
        legitimacy_bp: -500
        unrest_bp: 1500
        influence: {nobility: -500}
        outcome: >-
          Sancho, a soldier with a good army, has no intention of sitting at home.
        deeds: {peace_with: [cordoba]}
      - label: "Divide it between the two elder sons"
        legitimacy_bp: -800
        unrest_bp: 1000
        influence: {nobility: 300}
        outcome: >-
          Sancho takes Castile and Alfonso León, and García, who is left a county and a grudge,
          looks to his sisters for friends. Your wife says that the youngest will not be content
          for long.
        deeds: {peace_with: [cordoba]}
    history: >-
      Ferdinand I died in León on 27 December 1065 and divided his lands between his sons
      Sancho (Castile), Alfonso (León) and García (Galicia).
    sources: ["Historia Silense 100-101", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)"]

  - id: leo_zamora
    scenario: year_1000
    civ: leon
    year: 1072
    title: "The Oath at Santa Gadea"
    place: "Burgos"
    speaker: general
    speaker_name: "A Castilian knight"
    speaker_title: "Of Sancho's household"
    benchmark_provinces: 2
    story: >-
      You are Alfonso, the second son. Your brother Sancho beat you at Golpejera in January
      and took your crown, and you went into exile at Toledo, where the Muslim king al-Mamun
      sheltered you. In October word came that Sancho had been killed while besieging your
      sister Urraca at Zamora. The later chronicles name his killer as a knight, Vellido
      Dolfos.


      Now you have come back. Castile's nobles, whose king Sancho was, say you must clear
      yourself of his death. In a later tradition, which appears in no source of the time,
      the young Rodrigo Díaz, the Cid, makes you swear in the church of Santa Gadea that you had
      no part in it.
    choices:
      - label: "Swear the oath and take the crowns"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          The nobles of Castile accept you at Burgos, and the lords of León and Galicia are
          glad to have you back. Your brother García, who lost Galicia to Sancho, is seized and
          kept in the castle of Luna until he dies. For the first time since your father died,
          one king rules the whole kingdom.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia]}
      - label: "Refuse the oath, return to Toledo"
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Castile and León look for another king, and your brother García is waiting.
        deeds: {peace_with: [cordoba]}
      - label: "Swear, and share the realm with García"
        legitimacy_bp: 500
        unrest_bp: 500
        influence: {nobility: 500}
        outcome: >-
          You swear, and offer your brother Galicia as his own. García is wary, and the Castilian
          nobles who wanted a single king are not pleased to see the realm divided again.
        deeds: {martial_bp: 300}
    history: >-
      After Sancho II's death at Zamora in October 1072 Alfonso VI returned from exile in
      Toledo and took the crowns of León, Castile and Galicia; he imprisoned his brother
      García in 1073.
    sources: ["Historia Roderici", "Rodrigo Jiménez de Rada, De rebus Hispaniae 6", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)", "Fletcher, The Quest for El Cid (1989)"]

  - id: leo_cid
    scenario: year_1000
    civ: leon
    year: 1081
    title: "The Cid's Raid"
    place: "León"
    speaker: general
    speaker_name: "García Ordóñez"
    speaker_title: "Count, your counsellor"
    benchmark_provinces: 2
    story: >-
      You are Alfonso VI, king of León, Castile and Galicia. Toledo's king, al-Qadir, is your
      tributary, and pays you to protect him. Rodrigo Díaz, whom the Arabs call the Cid ('sidi',
      my lord), is one of your trusted knights, married by your leave to Jimena, a kinswoman of
      yours. Two years ago you sent him to collect tribute from Seville.


      Now your court says that Rodrigo has raided the lands of Toledo, your client, without your
      leave. Count García Ordóñez, whom Rodrigo beat in battle at Cabra, says it was done to
      shame you.
    choices:
      - label: "Banish Rodrigo from the realm"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Rodrigo is sent away with his men and takes service with the king of Zaragoza, fighting
          for a Muslim lord against Christian counts. Later poems say he was sent away by the
          slander of envious courtiers. You will be accused for ever of wasting the best soldier
          in your kingdom.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia]}
      - label: "Pardon Rodrigo and keep him at court"
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          The rivalries of your court go on. Rodrigo stays, and the lords who hated him now hate
          you.
        deeds: {martial_bp: 300}
      - label: "Imprison Rodrigo until he submits"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          Rodrigo's friends and his Castilian knights rise on his behalf.
        deeds: {martial_bp: -300}
    history: >-
      Alfonso VI exiled Rodrigo Díaz, the Cid, in 1081 after he raided Toledo's lands without
      permission; Rodrigo then served the king of Zaragoza.
    sources: ["Historia Roderici 14-20", "Poem of the Cid (c.1200; poetic, not history)", "Fletcher, The Quest for El Cid (1989)"]

  - id: leo_toledo
    scenario: year_1000
    civ: leon
    year: 1084
    title: "The Keys of Toledo"
    place: "Toledo"
    speaker: general
    speaker_name: "Al-Qadir"
    speaker_title: "King of Toledo"
    benchmark_provinces: 3
    story: >-
      You are Alfonso VI. Al-Qadir, the king of Toledo, whom your help restored when his own
      subjects drove him out, cannot keep his city. For years you have blockaded it, burning the
      harvests in its fields, and the citizens are hungry and divided.


      Al-Qadir offers a bargain: he will give you the city if you will help him to the kingdom
      of Valencia in exchange. Your bishops want the great mosque. The people of Toledo, Muslim,
      Mozarab and Jewish, want to keep their homes.
    choices:
      - label: "Accept Toledo's surrender on terms"
        historical: true
        legitimacy_bp: 3000
        wealth_bp: 1500
        knowledge_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          On 25 May 1085 you enter the city of the Visigothic kings. The Muslims keep their
          property and their great mosque. Within two years your queen Constance and Archbishop
          Bernard of Sauvetat, a monk from Cluny, take the mosque for a cathedral, against the
          terms. For the first time since the Moors came, the Christians hold the old
          Visigothic capital, and with it the books and scholars of Toledo.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia, m_toledo]}
      - label: "Storm the city before winter"
        wealth_bp: 2000
        unrest_bp: 2000
        legitimacy_bp: -1000
        knowledge_bp: -1000
        outcome: >-
          The city defends itself bitterly and the damage is great. The Muslim kings of the
          south are terrified, and look for help from Africa.
        deeds: {take: [m_toledo], grudges: {cordoba: 2000}}
      - label: "Keep al-Qadir on his throne as a tributary"
        wealth_bp: 1000
        legitimacy_bp: 300
        knowledge_bp: 500
        unrest_bp: -300
        outcome: >-
          Al-Qadir keeps his city and pays you a yearly sum for your protection. His subjects grow
          no fonder of him, and your bishops ask why the great mosque is still a mosque.
        deeds: {peace_with: [cordoba]}
    history: >-
      Toledo surrendered to Alfonso VI on 25 May 1085, with guarantees for its Muslim inhabitants
      that were soon broken.
    sources: ["Historia Roderici", "Ibn Bassam, Dhakhira", "Rodrigo Jiménez de Rada, De rebus Hispaniae 6", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)"]

  - id: leo_sagrajas
    scenario: year_1000
    civ: leon
    year: 1086
    title: "Sagrajas"
    place: "Zaragoza"
    speaker: general
    speaker_name: "A captain of your household"
    speaker_title: "At the siege"
    benchmark_provinces: 3
    story: >-
      You are Alfonso VI, who has just taken Toledo, and now besiege Zaragoza. The Muslim kings
      of the south, who are afraid of you, have invited the Almoravids, the veiled warriors of
      the Sahara, to cross to Spain. Yusuf ibn Tashfin has crossed at Algeciras with an army,
      and the kings of Seville, Granada and Badajoz have joined him.


      Your captains say you should lift the siege and meet them before they have time to
      assemble. Others say to wait for the knights you have sent for to France and Aragon,
      or to fall back on Toledo and let the Almoravids come to you.
    choices:
      - label: "Meet them at once, with what you have"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          At Sagrajas, near Badajoz, on 23 October 1086, a Friday, the Almoravid horse and their
          drums break your charge. You are wounded in the leg, and, Arabic chroniclers say, escape
          with a few hundred men. Yusuf, however, has news of the death of his son in Africa,
          and goes home. The taifa kings pay him less than he hoped, and he will come back.
        deeds: {peace_with: [cordoba], take: [m_leon, m_galicia, m_toledo], martial_bp: -1000}
      - label: "Wait for the knights from France"
        legitimacy_bp: -1000
        wealth_bp: -1000
        unrest_bp: 300
        outcome: >-
          Yusuf takes Badajoz and the road to Toledo. The French knights arrive, too late.
        deeds: {men: 3000, martial_bp: -300}
      - label: "Withdraw to Toledo and wait behind the walls"
        legitimacy_bp: -1000
        unrest_bp: 800
        food_bp: -500
        outcome: >-
          The Almoravids besiege Toledo as the summer ends. Your own towns are plundered in the
          meantime.
        deeds: {martial_bp: 300}
    history: >-
      On 23 October 1086 the Almoravids under Yusuf ibn Tashfin defeated Alfonso VI at Sagrajas
      (Zallaqa); Yusuf went back to Africa but returned in 1090.
    sources: ["Ibn al-Kardabus, Kitab al-iktifa", "al-Maqqari, Nafh al-tib", "Lourie, 'A Society Organized for War' (1966)", "Reilly, The Kingdom of León-Castilla under Alfonso VI (1988)"]
