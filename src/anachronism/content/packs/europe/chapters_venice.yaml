schema_version: 1
# Chronicle mode (D-120, D-173): the doges of Venice, from Pietro II Orseolo's Dalmatian
# voyage to the Golden Bull and Corfu, 1000-1084. Each chapter opens in its year; one
# choice is what history chose (historical: true). Venice elected its doges: the chronicle
# follows them in turn. Facts follow John the Deacon (who sailed with Pietro II), Peter
# Damian, the chronicle of Andrea Dandolo (14th century, used with care), Anna Komnene and
# the Golden Bull of 1082, with modern work by Nicol, Lane, Madden and Ortalli.
# benchmark_provinces counts the provinces of this map the real Venice held at that date.
chapters:
  - id: ven_dalmatia
    scenario: year_1000
    civ: venice
    year: 1000
    title: "The Narentine Tribute"
    place: "The lagoon, off the Lido"
    speaker: scholar
    speaker_name: "John the Deacon"
    speaker_title: "Your chaplain and chronicler"
    benchmark_provinces: 2
    story: >-
      You are Pietro Orseolo, Doge of Venice. Your city lives on the sea, and the sea is
      plagued by Narentine and Croat pirates who take tribute from Venetian ships every year.
      The Latin towns of the Dalmatian coast - Zara, Trau, Spalato, Ragusa - would rather
      be protected by Venice than robbed by the Croats.


      It is Ascension Day. Your fleet is ready at the Lido, and the bishop of Olivolo is
      waiting to bless it.
    choices:
      - label: "Lead the fleet down the coast"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 1500
        outcome: >-
          Town after town comes out to swear loyalty to you. The pirates' island strongholds
          are taken, and the Narentines give up their tribute. You come home 'Duke of the
          Venetians and of the Dalmatians'. Every Ascension Day from now on the doge will sail
          out to the Lido; in later centuries he will throw a ring into the sea and marry it.
      - label: "Pay the pirates' tribute, as usual"
        wealth_bp: -1000
        legitimacy_bp: -500
        outcome: >-
          The ships sail safely, at a price, and the Dalmatian towns look elsewhere for
          protection.
      - label: "Escort the merchant convoys"
        wealth_bp: 1500
        legitimacy_bp: 1500
        deeds: {ships: 3}
        outcome: >-
          Armed galleys sail beside the merchantmen, and fewer ships are robbed, and the dues of safe trade fill the treasury. The pirates'
          island strongholds stay where they are, and the Dalmatian towns look to the Croats.
    history: >-
      In 1000 Pietro II Orseolo led a fleet down the Dalmatian coast, received the
      submission of its towns and took the title Duke of the Dalmatians; the Ascension Day
      ceremony grew from it.
    sources: ["John the Deacon, Istoria Veneticorum 4.48-55", "Nicol, Byzantium and Venice (1988)"]

  - id: ven_fork
    scenario: year_1000
    civ: venice
    year: 1004
    title: "A Princess with a Golden Fork"
    place: "The doge's palace"
    speaker: byzantium
    speaker_name: "Envoys of Basil II"
    speaker_title: "From Constantinople"
    needs_alive: [byzantium]
    benchmark_provinces: 2
    story: >-
      Last year your fleet broke the Saracen siege of Bari, the Byzantine capital in Italy,
      and the Emperor Basil is grateful. He offers his niece, Maria Argyropoulina, as a wife
      for your son Giovanni, whom you have made your co-doge. The wedding will be in
      Constantinople, by the patriarch himself.


      Some of your citizens mutter that the Orseolo are making themselves into a royal
      family.
    choices:
      - label: "Send Giovanni to Constantinople"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        outcome: >-
          Giovanni and Maria come home in splendour. Maria bathes in dew collected by her
          servants, perfumes her rooms, and eats with a little golden fork, which scandalises
          Venice: a saint, Peter Damian, will write that God punished her vanity. In 1006 the
          plague takes them both, and their baby son. You never recover from it.
      - label: "Thank the emperor, and keep your son at home"
        legitimacy_bp: 500
        outcome: >-
          Basil is a little offended. Your citizens are a little reassured.
      - label: "Decline the bride, and ask for lower tolls"
        wealth_bp: 1500
        legitimacy_bp: 1700
        unrest_bp: 500
        outcome: >-
          Basil grants a small reduction in what Venetian ships pay, and does not hide that he
          is disappointed. In Venice, your family seems less like a royal house.
    history: >-
      After Venice relieved Bari (1002-1003), Giovanni Orseolo married Maria Argyropoulina in
      Constantinople (c. 1004); both died of plague in about 1006. Peter Damian told the
      story of her fork.
    diverged: >-
      Byzantium is gone.
    sources: ["John the Deacon, Istoria Veneticorum 4.58-66", "Peter Damian, Institutio monialis 11"]

  - id: ven_otto
    scenario: year_1000
    civ: venice
    year: 1024
    title: "The Doge's Family"
    place: "The Piazza"
    speaker: steward
    speaker_name: "A spokesman of the citizens"
    speaker_title: "Of the old families"
    benchmark_provinces: 2
    story: >-
      You are Otto Orseolo, doge since you were seventeen, married to the sister of the King
      of Hungary. One of your brothers is Patriarch of Grado and another Bishop of Torcello.
      Your family's enemies, the Gradenigo, say the Orseolo are turning the dogeship into a
      monarchy.


      The citizens want you to give up the Orseolo bishoprics, and to swear that no doge will
      ever again name his son as co-doge.
    choices:
      - label: "Refuse the demands outright"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          In 1026 a rising drives you out. Your beard is shaved, the mark of a deposed ruler,
          and you are sent into exile in Constantinople, where you die. Venice never again
          allows a dynasty of doges.
      - label: "Agree, and give up the bishoprics"
        legitimacy_bp: 300
        unrest_bp: 500
        influence: {clergy: -1000, nobility: -800}
        outcome: >-
          Your brothers resign their sees, and your kin and their friends do not forgive it.
          You stay doge, and the Orseolo become one family among others.
      - label: "Give up Torcello but keep Grado"
        legitimacy_bp: -300
        unrest_bp: 800
        influence: {clergy: -500}
        outcome: >-
          One brother resigns his see; the other stays. The Gradenigo call it a trick, and
          your own kinsmen call it weakness.
    history: >-
      Otto Orseolo (doge 1008-1026) was deposed in 1026, shaved and exiled to Constantinople;
      the Orseolo were finally excluded in 1032.
    sources: ["Andrea Dandolo, Chronica per extensum descripta 9", "Nicol, Byzantium and Venice (1988)"]

  - id: ven_flabanico
    scenario: year_1000
    civ: venice
    year: 1033
    title: "A Silk Merchant Doge"
    place: "The general assembly of Venice"
    speaker: steward
    speaker_name: "The assembly"
    speaker_title: "Of the people of Venice"
    benchmark_provinces: 2
    story: >-
      You are Domenico Flabanico, a silk merchant, elected doge after the Orseolo were
      finally thrown out. You were not of the old ducal families, which is exactly why you
      were chosen.


      The assembly proposes a law: no doge may ever again appoint a co-doge or successor,
      and the doge must govern with two councillors beside him.
    choices:
      - label: "Bind the doge to two councillors"
        historical: true
        legitimacy_bp: 2000
        influence: {guilds: 1500, nobility: -500}
        outcome: >-
          The law is passed. The doge of Venice becomes the elected head of a republic, bound
          by councils. In time the councils will become the Great Council, and Venice will be
          governed this way for seven hundred and sixty years.
      - label: "Keep the doge's powers as they are"
        legitimacy_bp: -1000
        influence: {nobility: 1000}
        outcome: >-
          The assembly gives way, for now, and watches you.
      - label: "Take the councillors, but keep your heir"
        legitimacy_bp: 1500
        influence: {guilds: 500, nobility: 500}
        outcome: >-
          The assembly grumbles but agrees: the councillors are appointed and you may name an
          heir, though the old families watch you closely.
    history: >-
      Under Domenico Flabanico (1032-1043) Venice forbade co-doges and set two ducal
      councillors beside the doge.
    sources: ["Andrea Dandolo, Chronica 9", "Lane, Venice: A Maritime Republic (1973)"]

  - id: ven_san_marco
    scenario: year_1000
    civ: venice
    year: 1063
    title: "The Chapel of St Mark"
    place: "The doge's chapel of St Mark"
    speaker: scholar
    speaker_name: "Your master builder"
    speaker_title: "Trained in Constantinople"
    benchmark_provinces: 2
    story: >-
      You are Domenico Contarini. The body of St Mark, stolen from Alexandria by two
      Venetian merchants two hundred years ago, lies in the doge's chapel, which is too small
      and too plain for the patron of a sea power.


      Your builder, trained in Constantinople, would copy the Church of the Holy Apostles
      there, where the emperors are buried: a Greek cross with five domes, to be covered one
      day in gold mosaic. Churchmen from the mainland would rather see a church like those of
      Lombardy, and some of your councillors would sooner spend the money on ships.
    choices:
      - label: "Rebuild on a Constantinople model"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -2000
        influence: {clergy: 1500}
        outcome: >-
          The new St Mark's is begun. Every ship that comes home from the east will be
          expected to bring a marble column or a carving for it. When the Holy Apostles in
          Constantinople is pulled down by the Ottomans, St Mark's will be the best picture of
          what it looked like.
      - label: "Rebuild in the mainland Lombard manner"
        legitimacy_bp: 1500
        wealth_bp: -1500
        outcome: >-
          A handsome brick church rises, and nobody from Constantinople is impressed.
      - label: "Mend the old chapel and refit the fleet"
        legitimacy_bp: 300
        wealth_bp: -500
        deeds: {ships: 2}
        outcome: >-
          The chapel is patched and the money goes to new galleys. Visitors from the east
          notice that the patron of a sea power still has a plain house.
    history: >-
      Rebuilding of St Mark's Basilica began under Doge Domenico Contarini in 1063, on the
      model of the Holy Apostles in Constantinople.
    sources: ["Andrea Dandolo, Chronica 9", "Demus, The Church of San Marco in Venice (1960)"]

  - id: ven_golden_bull
    scenario: year_1000
    civ: venice
    year: 1082
    title: "Alexios Asks for Ships"
    place: "Constantinople"
    speaker: byzantium
    speaker_name: "Alexios I Komnenos"
    speaker_title: "Emperor of the Romans"
    needs_alive: [byzantium]
    benchmark_provinces: 2
    story: >-
      You are Domenico Selvo, married to a Byzantine princess. The Normans of southern Italy,
      under Robert Guiscard, have crossed the Adriatic and are besieging Durazzo, the gateway
      to the Byzantine Balkans. The new emperor, Alexios Komnenos, has no fleet worth the
      name. Your fleet has already beaten the Normans at sea off Durazzo.


      Alexios asks for your help again and offers a reward. Your own councillors are divided
      about what to ask for.
    choices:
      - label: "Take the emperor's terms"
        historical: true
        wealth_bp: 4000
        legitimacy_bp: 1500
        outcome: >-
          Venetian merchants may trade in every port of the empire, except the Black Sea,
          without paying any taxes at all, and have their own quarter and wharves in
          Constantinople. Greek merchants still pay. It is the foundation of Venice's empire
          of trade, and the beginning of a Greek grudge that will end with Venetian ships at
          the walls of Constantinople in 1204.
      - label: "Ask for less, and stay friends with the Greeks"
        wealth_bp: 1500
        outcome: >-
          Venice takes a modest reduction in customs, and Greek merchants do not learn to hate
          you.
      - label: "Take a yearly sum of gold instead"
        wealth_bp: 4000
        legitimacy_bp: 1000
        outcome: >-
          Alexios agrees to pay a yearly sum to the doge and his church. It is a good price, but
          it is paid at the emperor's pleasure, and your merchants gain nothing from it.
    history: >-
      Alexios I's chrysobull (probably 1082) granted Venice tax-free trade across most of the
      empire and a quarter in Constantinople, in return for naval help against the Normans.
    diverged: >-
      Byzantium is gone.
    sources: ["Chrysobull of Alexios I (in Tafel and Thomas, Urkunden)", "Anna Komnene, Alexiad 4.2, 6.5", "Madden, Venice: A New History (2012)"]

  - id: ven_corfu
    scenario: year_1000
    civ: venice
    year: 1084
    title: "Defeat off Corfu"
    place: "The Piazza"
    speaker: steward
    speaker_name: "A crowd in the Piazza"
    speaker_title: "Angry"
    benchmark_provinces: 2
    story: >-
      Robert Guiscard came back. Off Corfu, after two Venetian victories, his ships caught
      yours heavy-laden and unready, and sank or took most of them. Thousands of Venetians
      were killed or captured, and some came home with their eyes put out.


      A crowd has gathered in the Piazza. They blame you.
    choices:
      - label: "Give way to the crowd"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          You are deposed, and end your days as a monk. Vitale Falier, who led the crowd, is
          the new doge. The next year Guiscard dies of fever on Cephalonia, and the Norman
          threat dies with him.
        deeds: {ruler_falls: "is deposed and becomes a monk"}
      - label: "Face them down"
        unrest_bp: 2000
        legitimacy_bp: -1500
        outcome: >-
          You stay in the palace. The crowd stays in the Piazza, and the mood grows uglier
          with every day.
      - label: "Promise a new fleet at once"
        wealth_bp: -1500
        legitimacy_bp: -1000
        deeds: {ships: 8}
        outcome: >-
          You open the treasury and the shipyards. The crowd breaks up, but no one forgets who
          led the fleet to Corfu.
    history: >-
      After the Venetian defeat off Corfu (1084), Domenico Selvo was deposed and replaced by
      Vitale Falier.
    sources: ["Anna Komnene, Alexiad 6.5", "Andrea Dandolo, Chronica 9"]
