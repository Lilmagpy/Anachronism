schema_version: 1
# Chronicle mode (D-120, D-XXX): the papacy, from Sylvester II to Gregory VII, 1000-1085.
# Each chapter opens in its year; one choice is what history chose (historical: true). Facts
# follow Thietmar of Merseburg, Berno of Reichenau, Peter Damian, Bonizo of Sutri, Humbert of
# Silva Candida, the letters and Register of Gregory VII, Lampert of Hersfeld and Bruno of
# Merseburg (partisan, used with care), with modern work by Cowdrey, Robinson, Blumenthal,
# Tellenbach and Reuter. The pope's ages at accession are approximate; the short reigns of
# John XVII (1003), Sylvester III (1045) and Benedict IX's two returns are not given a
# separate ruler. benchmark_provinces counts the provinces of this map the real popes held
# at that date (Rome and its Patrimony only).
chapters:
  - id: pap_gniezno
    scenario: year_1000
    civ: papacy
    year: 1000
    title: "The Emperor's Pilgrimage"
    place: "Rome"
    speaker: hre
    speaker_name: "Otto III"
    speaker_title: "Emperor of the Romans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Gerbert of Aurillac, once a schoolmaster at Reims, who learned the abacus and
      the astrolabe from the books and teachers of Catalonia and taught the young Otto. Last
      year the emperor made you pope. You took the name Sylvester, after the pope who stood at
      Constantine's side; everyone understands what you mean by it.


      Otto has come back from a pilgrimage to Gniezno, where the martyred bishop Adalbert of
      Prague lies buried. He treated Duke Boleslaw of Poland as a friend and partner of the
      empire, and he wants Poland to have an archbishop of its own, answering to Rome and not
      to Magdeburg. The archbishop of Magdeburg is furious.
    choices:
      - label: "Make Gniezno an archbishopric"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          Adalbert's half-brother Radim Gaudentius becomes the first archbishop of Gniezno, with
          new bishoprics under him at Kraków, Wrocław and Kołobrzeg. Poland has a church of its
          own, and Magdeburg loses a mission field. Together with the crown you will send to
          Hungary, it is the making of two new Latin kingdoms.
      - label: "Keep the Poles under Magdeburg"
        legitimacy_bp: 1100
        wealth_bp: 400
        outcome: >-
          The German archbishop is pleased and the emperor is not. Boleslaw gets his missionary
          bishops from the west, and keeps his own counsel.
      - label: "Put the Polish mission under a legate"
        legitimacy_bp: 800
        wealth_bp: -400
        outcome: >-
          A legate of yours goes to Gniezno to oversee the new churches directly, with no
          archbishop of its own. Magdeburg is not pleased, nor is Boleslaw, who wanted more.
    history: >-
      In March 1000 Otto III, with the consent of Pope Sylvester II, founded the archbishopric
      of Gniezno, independent of the German church.
    diverged: >-
      The empire is gone.
    sources: ["Thietmar of Merseburg 4.44-45", "Gallus Anonymus 1.6", "Althoff, Otto III (1996)"]

  - id: pap_tusculum
    scenario: year_1000
    civ: papacy
    year: 1013
    title: "The Count's Son on Peter's Chair"
    place: "Rome"
    speaker: hre
    speaker_name: "Henry II"
    speaker_title: "King of the Romans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Theophylact of the counts of Tusculum, Benedict VIII. For years the Crescentii
      kept the city and the chair of Peter in their pocket. When your predecessor Sergius IV
      died last year, their party elected a rival, Gregory, and your family's men elected you.
      You won in the streets. Gregory has fled over the Alps to ask King Henry II for help.


      Henry has not given it. Instead he wants to come to Rome to be crowned emperor, and he
      has asked, says the monk Berno of Reichenau, why the Creed is not sung at Mass in Rome.
      The Romans answered that their church has never strayed into heresy and does not need
      to chant it.
    choices:
      - label: "Crown Henry and grant his requests"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 800}
        outcome: >-
          On 14 February 1014 you crown Henry and his queen Kunigunde in St Peter's. At his
          request the Creed is sung at Mass. His soldiers keep your family's rivals quiet, and
          he leaves you to govern Rome and its estates, while your brother and your relatives
          hold the offices of the city.
      - label: "Make him settle with the Crescentii first"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Henry is not a man to be dictated to. He waits across the Alps, and your rivals use
          the delay to rouse the city against you.
      - label: "Crown him if he confirms Rome's estates"
        legitimacy_bp: 1000
        wealth_bp: 500
        unrest_bp: 300
        outcome: >-
          Henry confirms the lands and rights of the Roman church in writing before the crown is
          set on his head. It costs him little, and he is a careful man.
    history: >-
      Benedict VIII (1012-1024) crowned Henry II emperor on 14 February 1014, and ruled Rome
      with the support of his Tusculan family.
    diverged: >-
      The empire is gone.
    sources: ["Thietmar of Merseburg 7.1", "Berno of Reichenau, De officio missae 2", "Herrin and Wickham, Rome in the early eleventh century"]

  - id: pap_benedict9
    scenario: year_1000
    civ: papacy
    year: 1044
    title: "A Godfather's Offer"
    place: "Rome"
    speaker: steward
    speaker_name: "Archpriest John Gratian"
    speaker_title: "Your godfather"
    benchmark_provinces: 1
    story: >-
      You are Theophylact, Benedict IX, nephew of two popes, elected as a very young man in
      1032. Later churchmen will say your life was a scandal; they were not fond of the
      Tusculans. In September the Romans drove you out and in January they put the bishop of
      Sabina on the chair as Sylvester III. In March your family's men took the city back.
      Two popes now claim the Church.


      Your godfather John Gratian, archpriest of San Giovanni at the Latin Gate, is a pious
      and respected man. He has come to you with an offer. Later writers say you wished to
      marry. He has come to you with an offer about the chair.
    choices:
      - label: "Resign in favour of your godfather"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: -2500
        unrest_bp: 800
        outcome: >-
          In 1045 you give up the chair and John Gratian becomes Gregory VI. The Romans, who
          hate both Sylvester and you, are glad. The reformers, Peter Damian among them,
          rejoice at first that a good man is pope. Only later does it come out that he bought
          the office, and what is bought is called simony, the heresy that the reform party
          hates most.
        deeds: {ruler_falls: "sells the papacy to his godfather"}
      - label: "Fight on against Sylvester"
        unrest_bp: 1500
        wealth_bp: -500
        outcome: >-
          Rome is a city of towers and gangs. The fighting goes on for months, and the Church
          has two popes, and then a third.
        deeds: {men: 2000}
      - label: "Resign and ask nothing"
        legitimacy_bp: 500
        unrest_bp: -300
        outcome: >-
          John Gratian refuses to be paid for what he never asked to be given, and begs you to
          stay. You decide that you are tired of the whole business.
      - label: "Appeal to Henry III to judge between the popes"
        legitimacy_bp: 500
        unrest_bp: 500
        wealth_bp: -300
        outcome: >-
          A messenger goes north with your case. Henry is busy in Hungary and the Alps lie
          between you and his answer, and meanwhile the towers of Rome stay armed.
    history: >-
      In 1045 Benedict IX resigned in favour of John Gratian (Gregory VI) for a payment, which
      was later condemned as simony.
    sources: ["Bonizo of Sutri, Liber ad amicum 5", "Peter Damian, Letters 13", "Blumenthal, The Investiture Controversy (1988)"]

  - id: pap_sutri
    scenario: year_1000
    civ: papacy
    year: 1046
    title: "Sutri"
    place: "Sutri"
    speaker: hre
    speaker_name: "Henry III"
    speaker_title: "King of the Germans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Gregory VI, John Gratian, and for nineteen months you have tried to be a good
      pope. You have dealt with the robber bands that ambushed pilgrims on the roads to Rome.
      A young chaplain of yours called Hildebrand has served you loyally.


      Now Henry III, a pious young king who hates simony, has come over the Alps to be crowned
      emperor, and he has called a synod at Sutri, north of Rome. The three popes, you,
      Sylvester III and Benedict IX, are summoned to account for themselves.
    choices:
      - label: "Resign, and go with the king"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The accounts of Sutri disagree: that you confessed the payment, or that you were
          judged and deposed. Either way, you step down on 20 December 1046. Sylvester is
          condemned, and Benedict is deposed by a Roman synod three days later. The king's
          German bishop Suidger of Bamberg is made Clement II and crowns Henry on Christmas Day.
          You go north with Hildebrand and die in exile in Germany. From now on the emperor
          chooses the pope, and reformers like Hildebrand are watching.
        deeds: {ruler_falls: "resigns at the synod of Sutri"}
      - label: "Defend your election"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          You point out that the money bought no office, only your godfather's exit. The king
          does not agree, and neither do the German bishops.
      - label: "Slip away to Rome and shut the gates"
        wealth_bp: 1500
        legitimacy_bp: 600
        unrest_bp: 1500
        outcome: >-
          Henry's army camps outside the walls. The Romans have no wish to starve for a pope
          they did not choose, and a quarter of them are Tusculan men.
    history: >-
      In December 1046 the synod of Sutri ended the schism: Gregory VI gave up the office, and
      Henry III's candidate Clement II crowned him emperor on Christmas Day.
    diverged: >-
      The empire is gone.
    sources: ["Annals of Altaich 1046", "Wipo, Gesta Chuonradi 'Tetralogus'", "Bonizo of Sutri, Liber ad amicum 5", "Blumenthal, The Investiture Controversy (1988)"]

  - id: pap_civitate
    scenario: year_1000
    civ: papacy
    year: 1052
    title: "The Normans in the South"
    place: "Benevento"
    speaker: general
    speaker_name: "Humphrey of Hauteville"
    speaker_title: "Norman count of Apulia"
    benchmark_provinces: 1
    story: >-
      You are Bruno of Egisheim, Leo IX, a cousin of the emperor and bishop of Toul, who walked
      into Rome in pilgrim's dress three years ago and has since travelled over half of
      Christendom holding councils against simony and clerical marriage.


      The south is your trouble. Norman adventurers who came to fight for Lombard and Greek
      princes have turned to taking what they please, and the people of Benevento, which the
      emperor has given to you, have driven out their own lord and begged you for protection.
      The Normans ravage the land. You have asked Henry III for an army, and he has sent only a
      small body of German troops.
    choices:
      - label: "Lead out the troops you have"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          At Civitate, in June 1053, the Norman horsemen scatter your Italian levies and cut down
          the Swabians. The conquerors kneel to you, kiss your hands and ask your blessing, and
          then keep you prisoner at Benevento for nine months. The pope has shown that the
          Church cannot fight with swords, and has begun to wonder what it may fight with.
        deeds: {martial_bp: -500}
      - label: "Make terms with the Normans"
        legitimacy_bp: 500
        outcome: >-
          The Normans keep what they have, and you keep your freedom. The Lombards of Benevento
          and Capua do not forgive you.
      - label: "Raise a levy and wait for the emperor"
        unrest_bp: 500
        wealth_bp: -400
        outcome: >-
          Henry III has the Hungarians to deal with and does not come. The Normans grow
          bolder.
        deeds: {men: 2000}
    history: >-
      Leo IX led an army against the Normans and was defeated and captured at Civitate on 18
      June 1053. Within five years the popes had made the Normans their allies.
    sources: ["Amatus of Montecassino, History of the Normans 3", "William of Apulia, Gesta Roberti Wiscardi 2", "Cowdrey, Pope Gregory VII (1998)"]

  - id: pap_schism
    scenario: year_1000
    civ: papacy
    year: 1053
    title: "A Letter from Constantinople"
    place: "Rome"
    speaker: byzantium
    speaker_name: "Michael Cerularius"
    speaker_title: "Patriarch of Constantinople"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Leo IX, released from your captivity, and tired and ill. A letter has come from
      Constantinople. The Patriarch Michael Cerularius, supported by Leo, archbishop of Ohrid,
      has closed the Latin churches in the capital and accuses Rome of using unleavened bread
      for Mass, and of other errors. You are not a man to take insults.


      The emperor Constantine IX, on the other hand, wants an alliance against the Normans, who
      threaten his holdings in Italy. Your adviser Humbert of Silva Candida is eager to go and
      speak for you in Constantinople. He is a learned man with a hot temper.
    choices:
      - label: "Send Humbert to answer in your name"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Humbert, Frederick of Lorraine and Peter of Amalfi reach Constantinople in the summer.
          You die in April, before they get there. On 16 July Humbert lays a bull of
          excommunication on the altar of Hagia Sophia, naming Cerularius and his supporters,
          not the Greek church. Cerularius condemns the legates in turn. Neither side imagines
          they have divided Christendom for ever.
        deeds: {grudges: {byzantium: 1500}}
      - label: "Write to Cerularius and propose a council"
        legitimacy_bp: 500
        unrest_bp: -300
        outcome: >-
          Cerularius, who does not mean to have Rome meddling in the east, ignores the letter.
          The Normans stay.
      - label: "Answer through the emperor and seek his alliance"
        legitimacy_bp: 800
        wealth_bp: -300
        outcome: >-
          Your letter goes to Constantine IX and not to the patriarch. The emperor is friendly
          and the Normans are a real danger to him, but he cannot make the patriarch obey.
    history: >-
      Leo IX's legates laid a bull of excommunication against Cerularius on the altar of
      Hagia Sophia on 16 July 1054, three months after Leo died. The mutual excommunications
      of 1054 are the traditional date of the Great Schism, though the break came gradually.
    diverged: >-
      Byzantium is gone.
    sources: ["Humbert, Brevis et succincta commemoratio (the excommunication of 1054)", "Michael Cerularius, Letters", "Kolbaba, Inventing Latin Heretics (2008)", "Runciman, The Eastern Schism (1955)"]

  - id: pap_nicholas
    scenario: year_1000
    civ: papacy
    year: 1059
    title: "Who Chooses the Pope?"
    place: "The Lateran"
    speaker: scholar
    speaker_name: "Peter Damian"
    speaker_title: "Cardinal-bishop of Ostia"
    benchmark_provinces: 1
    story: >-
      You are Gerard of Burgundy, Nicholas II. Stephen IX died last year, and the Roman nobles
      put a pope of their own on the chair, who is called Benedict X. The reform party, with
      Hildebrand, chose you at Siena instead, and the Normans' swords helped to put you in
      Rome. The German court is run by a young king's mother and has not approved.


      You do not want it to happen again. A pope chosen by the Roman nobility is one man's
      trick; a pope chosen by the emperor is another's. The reformers have a plan.
    choices:
      - label: "Give the first voice to the cardinal-bishops"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          In April 1059 the Lateran synod decrees that the cardinal-bishops will meet first
          and name a candidate, the other cardinals will then approve, and the people and the
          king will be asked for consent, with 'due honour' to the young Henry IV. In August
          you meet Robert Guiscard at Melfi, who swears allegiance as your duke of Apulia and
          Calabria, and, with your help, Sicily. The Germans refuse to accept the decree, and
          when you die, they set up their own pope.
        deeds: {grudges: {hre: 800}}
      - label: "Leave the choice to the empress-regent"
        legitimacy_bp: -500
        influence: {nobility: 500}
        outcome: >-
          Your friend Agnes holds the young king's seal, but not the Roman nobles' loyalty. The
          reformers fear the next pope will be another count's son.
      - label: "Return it to the clergy and people of Rome"
        wealth_bp: 500
        legitimacy_bp: 1100
        unrest_bp: 500
        influence: {nobility: 500}
        outcome: >-
          The old form is kept, in which the clergy and people of Rome acclaim their bishop. It
          is open to every count with a street gang, and the reformers are not pleased.
    history: >-
      Nicholas II's synod of April 1059 gave the election of popes to the cardinals, and in
      August he invested Robert Guiscard with Apulia, Calabria and Sicily at Melfi.
    diverged: >-
      Peter Damian's world has moved on.
    sources: ["Decretum in nomine Domini (1059)", "Amatus of Montecassino 4", "Robinson, The Papacy 1073-1198 (1990)", "Blumenthal, The Investiture Controversy (1988)"]

  - id: pap_dictatus
    scenario: year_1000
    civ: papacy
    year: 1075
    title: "Twenty-Seven Sentences"
    place: "Rome"
    speaker: hre
    speaker_name: "Henry IV"
    speaker_title: "King of the Germans"
    needs_alive: [hre]
    benchmark_provinces: 1
    story: >-
      You are Hildebrand, Gregory VII, a small man, once a monk, chosen pope by the crowd at
      Alexander II's funeral. You mean to free the Church from the great lords and the kings.
      Last year's synod banned lay investiture, the practice of kings giving rings and staffs
      to bishops. In March you set down in your register twenty-seven short sentences, called
      the Dictatus papae: the pope alone may depose bishops, may use the imperial insignia,
      and may depose emperors.


      King Henry IV, who is twenty-four, does not intend to give up his bishops. In January his
      synod at Worms declares that you are no pope but a false monk, and orders you to come
      down from the chair.
    choices:
      - label: "Excommunicate the king and free his subjects"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        influence: {clergy: 1000}
        outcome: >-
          At the Lenten synod of 1076 you suspend Henry from his rule and forbid his subjects to
          obey him. No pope has ever done this to a king. His German enemies, the Saxons and
          the southern dukes, are overjoyed. In October the princes at Tribur tell Henry that
          unless he is absolved within a year, they will choose another king.
        deeds: {grudges: {hre: 3000}}
      - label: "Warn him again and call a council"
        legitimacy_bp: 1100
        influence: {clergy: 500}
        outcome: >-
          Henry reads your patience as weakness, and the bishops of Lombardy declare themselves
          for him.
      - label: "Offer Henry a compromise on investiture"
        legitimacy_bp: -500
        influence: {clergy: -500}
        outcome: >-
          Your legates offer that Henry's bishops keep their rings and staves if the Church names
          the candidates. Henry will accept nothing that limits his choice, and the reformers
          think you have given too much.
    history: >-
      In February 1076 Gregory VII excommunicated and deposed Henry IV, the first time a pope
      had done this to a king. The 'Dictatus papae' (March 1075) survives in his register.
    diverged: >-
      The kingdom of the Germans is gone.
    sources: ["Gregory VII, Register 2.55a (Dictatus papae)", "Henry IV, letter to Gregory VII (Worms, 1076)", "Cowdrey, Pope Gregory VII (1998)", "Robinson, Henry IV of Germany (1999)"]

  - id: pap_canossa
    scenario: year_1000
    civ: papacy
    year: 1077
    title: "Three Days in the Snow"
    place: "Canossa"
    speaker: general
    speaker_name: "Matilda of Tuscany"
    speaker_title: "Countess, lady of Canossa"
    benchmark_provinces: 1
    story: >-
      You are Gregory VII, on your way to Germany to hold a council of the princes and judge
      the king there. Instead you have taken refuge in the Apennine fortress of Matilda of
      Tuscany at Canossa, because Henry IV has crossed the Alps in the depths of winter.


      On 25 January, he stands barefoot in the snow in the castle courtyard, in the clothes of a
      penitent, for three days, asking to be absolved. Matilda and Abbot Hugh of Cluny, the
      king's godfather, plead for him. Your own men say that he will promise anything.
      But a priest who is asked for penance has no right to refuse it.
    choices:
      - label: "Absolve him and lift the ban"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 800
        outcome: >-
          You lift the ban, as a priest must for a penitent, and on 28 January you share the
          Mass with him. Your allies in Germany feel betrayed, and in March they choose
          Rudolf of Rheinfelden as an anti-king. Civil war begins. In 1080 you excommunicate
          Henry again, but now he has his own pope, Wibert of Ravenna, ready.
        deeds: {grudges: {hre: 1500}}
      - label: "Make him wait for the council"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Henry rides off to Lombardy, where the bishops who hate you are waiting with an army.
          The king's enemies in Germany are left to fight alone.
      - label: "Absolve him on written promises"
        legitimacy_bp: 800
        unrest_bp: 500
        outcome: >-
          Henry puts his promises in writing and swears to them before Matilda and Abbot Hugh.
          You lift the ban, and the princes of Germany ask what such oaths are worth.
    history: >-
      Henry IV did penance at Canossa from 25 to 28 January 1077 and was absolved by Gregory
      VII. The princes elected Rudolf of Rheinfelden as king in March.
    diverged: >-
      The kingdom of the Germans is gone.
    sources: ["Gregory VII, letter to the German princes (Register 4.12)", "Lampert of Hersfeld, Annals 1077", "Cowdrey, Pope Gregory VII (1998)"]

  - id: pap_salerno
    scenario: year_1000
    civ: papacy
    year: 1084
    title: "The Normans Come to Rome"
    place: "Castel Sant'Angelo"
    speaker: general
    speaker_name: "Robert Guiscard"
    speaker_title: "Duke of Apulia and Calabria"
    benchmark_provinces: 1
    story: >-
      You are Gregory VII, and you are besieged in the Castel Sant'Angelo. In March Henry IV
      forced his way into Rome and set up his own pope, Wibert of Ravenna, as Clement III. At
      Easter, in St Peter's, Wibert crowned Henry emperor. Most of the Romans no longer want
      you.


      Your one friend is Robert Guiscard, the Norman duke you once feared, who is marching
      north. Henry, hearing of it, has already left Rome. The Normans will drive out your
      enemies, but they are a rough army, and the Romans have not forgotten Civitate.
    choices:
      - label: "Call Guiscard to Rome"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          In May Guiscard's army breaks into the city. Soldiers plunder, the Romans rise
          against them, and a great part of the city, from the Lateran to the Colosseum, burns.
          When Guiscard leaves, you must go with him. You die in Salerno on 25 May 1085.
          Tradition gives you the last words 'I have loved justice and hated iniquity, and
          therefore I die in exile.' The pope who deposed an emperor has failed. His ideas
          have not.
      - label: "Stay in Sant'Angelo and hold out"
        unrest_bp: 1000
        outcome: >-
          Without Guiscard, the Romans give way to Henry's pope. You are left in the castle
          with a few cardinals.
      - label: "Flee to Matilda in Tuscany"
        legitimacy_bp: -500
        outcome: >-
          Matilda shelters you, but Rome is Wibert's, and the Normans will not be thanked.
    history: >-
      Guiscard drove Henry IV's forces from Rome in May 1084 and his army sacked the city;
      Gregory VII left with the Normans and died at Salerno on 25 May 1085.
    sources: ["Bonizo of Sutri, Liber ad amicum 9", "Amatus of Montecassino 7", "Cowdrey, Pope Gregory VII (1998)"]
