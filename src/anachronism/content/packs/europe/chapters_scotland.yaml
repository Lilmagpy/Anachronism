schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Alba, from Kenneth III to Malcolm Canmore,
# 1004-1092. Each chapter opens in its year; one choice is what history chose (historical:
# true). Facts follow the Annals of Ulster and of Tigernach, the Chronicle of the Kings of
# Alba, the Anglo-Saxon Chronicle, Symeon of Durham, Marianus Scotus, the Orkneyinga saga
# (with care), Turgot's Life of St Margaret and the Register of the Priory of St Andrews, with
# modern work by Duncan, Broun, Hudson, Woolf and Oram. Shakespeare's Macbeth (1606) is
# drama built on Holinshed's Chronicles (1577), which merged several kings: the Macbeth,
# Duncan, Banquo, three witches, Birnam Wood, and Macduff of the play are fiction, and the
# chapters say so where it matters. Dates are approximate by a year or two where noted:
# Monzievaird (1005), Carham (usually 1018; 1016 and 1006 have been argued), Margaret's
# marriage (1069-1070). The map has only one province for Scotland (Alba), so benchmark is
# 1 throughout, and Lothian, Strathclyde and Moray are told in the story, not in the
# province count. The first chapter is dated 1004: nothing in the sources is firm enough
# for Kenneth III's earlier years to be told as a choice.
chapters:
  - id: sco_monzievaird
    scenario: year_1000
    civ: scotland
    year: 1004
    title: "The Cousin's Claim"
    place: "Strathearn"
    speaker: general
    speaker_name: "A thane of Strathearn"
    speaker_title: "Come to warn you"
    benchmark_provinces: 1
    story: >-
      You are Kenneth, son of Dub, King of Alba. Your kingdom reaches from the Forth to the
      Spey, with Moray beyond, and the Gaelic kings and the Norse earls of the islands for
      neighbours. Seven years ago you killed your cousin Constantine, son of Culen, and took
      his crown. The crown of Alba has been passing between two branches of the same
      family for generations, from one man killed to the next.


      Now the other branch has found its man. Malcolm, son of the earlier Kenneth, is
      about fifty, and has gathered his followers. He is marching down Strathearn towards
      Monzievaird, where you are camped, and your captains are asking what to do.
    choices:
      - label: "Stand and fight him at Monzievaird"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1000
        outcome: >-
          The Annals of Ulster say only that you were killed by Malcolm, son of Kenneth. The
          chronicle of the kings says you fell at Monzievaird. Malcolm is made king of Alba, and
          he will keep the crown for thirty years by being quicker and more ruthless than
          anyone else in the family.
        deeds: {ruler_falls: "is killed by Malcolm at Monzievaird"}
      - label: "Withdraw north and offer Malcolm a share of the kingdom"
        legitimacy_bp: -1000
        outcome: >-
          Your followers think you a coward. Malcolm does not want a share, and your enemies
          wait for a better moment.
    history: >-
      Kenneth III, who had killed Constantine III about 997, was killed by Malcolm II,
      son of Kenneth II, at Monzievaird in 1005.
    sources: ["Annals of Ulster 1005", "Chronicle of the Kings of Alba (Version A)", "Duncan, Scotland: the Making of the Kingdom (1975)", "Broun, Scottish Independence and the Idea of Britain (2007)"]

  - id: sco_carham
    scenario: year_1000
    civ: scotland
    year: 1018
    title: "The Battle of Carham"
    place: "On the river Tweed"
    speaker: general
    speaker_name: "Owain the Bald"
    speaker_title: "King of the Cumbrians, your ally"
    benchmark_provinces: 1
    story: >-
      You are Malcolm, King of Alba, about sixty-four years old, and you have been king for
      thirteen years. Twelve years ago you besieged Durham, and Earl Uhtred of Northumbria
      cut your army to pieces: the women of Durham washed the heads of your dead and hung
      them on poles. You remember it.


      Since then the English kings have changed. Cnut has taken England, Uhtred has been murdered, and
      the earldom is in the hands of Uhtred's brother Eadulf, who is old and timid. The
      land between the Forth and the Tweed, Lothian, has belonged to the Northumbrians for
      centuries. Owain of Strathclyde offers his army. This is your chance.
    choices:
      - label: "Join Owain and march on the Tweed"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 1000}
        outcome: >-
          At Carham, on the Tweed, you and Owain defeat the Northumbrians in a great battle.
          Symeon of Durham says that almost the whole people between Tees and Tweed was killed,
          and that the old bishop of Durham died of grief when he heard. Eadulf, the old earl,
          accepts the Tweed as the border, and from now on Lothian is Scots. The kingdom of
          the Scots, which has been Gaelic, has become half-English.
      - label: "Keep the peace with Northumbria"
        legitimacy_bp: -500
        outcome: >-
          The Tweed stays the English border for another reign, and Cnut has time to settle his
          new kingdom.
    history: >-
      Malcolm II, with Owain of Strathclyde, defeated the Northumbrians at Carham on the
      Tweed in about 1018; the Tweed became the border and Lothian passed to the Scots.
    sources: ["Symeon of Durham, History of the Kings, 1018", "De Obsessione Dunelmi", "Duncan, The Kingship of the Scots (2002)", "Woolf, From Pictland to Alba (2007)"]

  - id: sco_cnut
    scenario: year_1000
    civ: scotland
    year: 1031
    title: "The King of the English Comes North"
    place: "On the border"
    speaker: england
    speaker_name: "King Cnut"
    speaker_title: "King of England and Denmark, come with an army"
    needs_alive: [england]
    benchmark_provinces: 1
    story: >-
      You are Malcolm, King of Alba, about seventy-seven years old, and you have no son to
      follow you. You have a daughter, Bethoc, whose son Duncan you hope will be king after
      you, and (the sagas say) another daughter whose son Thorfinn is Earl of Orkney. You
      have killed a good many rivals to keep it that way.


      Now Cnut, who has taken England, Denmark and, three years ago, Norway, has marched into
      Scotland. He wants the kings of the north to bow. The Anglo-Saxon Chronicle says that
      Malcolm and two other kings will do it.
    choices:
      - label: "Submit to Cnut"
        historical: true
        legitimacy_bp: -500
        wealth_bp: -1000
        outcome: >-
          You go to Cnut, and become his man, as the chronicle says, and so do the two other
          kings, Macbeth and Iehmarc, a lord of the Irish sea. Cnut goes home. It makes
          little difference in the Highlands. In a few years you die, perhaps of old age,
          though later writers say you were murdered at Glamis.
      - label: "Refuse, and keep your army in the hills"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Cnut has a fleet and an army, and neither of them hurts the Scots. But he will not
          forget it.
    history: >-
      In 1031 Cnut marched to Scotland, and, according to the Anglo-Saxon Chronicle, Malcolm
      and two other kings (Macbeth and Iehmarc) submitted; Malcolm died in 1034.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1031 (E)", "Annals of Ulster 1034", "Lawson, Cnut (2004)", "Woolf, From Pictland to Alba (2007)"]

  - id: sco_duncan
    scenario: year_1000
    civ: scotland
    year: 1040
    title: "A Young King in Moray"
    place: "Moray"
    speaker: general
    speaker_name: "Macbeth, son of Findlaech"
    speaker_title: "Mormaer of Moray"
    benchmark_provinces: 1
    story: >-
      You are Duncan, son of Crinan, grandson of Malcolm, and you became King of Alba six
      years ago. You are about thirty-nine, a young man by the standards of your family.
      Shakespeare made you an old and gentle king murdered in his sleep; that is a fiction,
      and the real man had a hot temper and few friends.


      Last year you besieged Durham, as your grandfather did, and had to retreat with a
      great loss of horsemen. Now you must prove yourself. In the north, in Moray, is a
      mormaer called Macbeth, son of Findlaech. His father was killed by his own cousins, and he took
      revenge. He is the greatest man in the north, and his wife Gruoch is the granddaughter
      of a king.
    choices:
      - label: "March north to bring Macbeth to heel"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          In August you meet Macbeth at Bothnagowan, near Elgin. You are killed in the fighting,
          not in your bed, and not by treachery in a castle. Macbeth takes the throne. Your
          sons Malcolm, who is about nine, and Donald, who is younger, are sent away to
          safety, and the sources do not agree on where. Macbeth will rule Scotland, apparently well, for
          seventeen years.
        deeds: {ruler_falls: "is killed by Macbeth near Elgin"}
      - label: "Make terms with Macbeth, and leave Moray alone"
        legitimacy_bp: -500
        outcome: >-
          Macbeth sends gifts, and watches you carefully. A king who fails at Durham and
          fails to defend his borders has not got long.
    history: >-
      After the failed Durham campaign of 1039, Duncan I was killed in battle by Macbeth at
      Bothnagowan, near Elgin, on 14 August 1040.
    sources: ["Annals of Tigernach 1040", "Chronicle of the Kings of Alba", "Symeon of Durham, History of the Kings 1039", "Broun, Scottish Independence (2007)"]

  - id: sco_rome
    scenario: year_1000
    civ: scotland
    year: 1050
    title: "Silver Like Seed"
    place: "Scone"
    speaker: scholar
    speaker_name: "Marianus Scotus"
    speaker_title: "An Irish monk, who writes a world chronicle"
    benchmark_provinces: 1
    story: >-
      You are Macbeth, King of Alba, ten years on the throne. Unlike the play, your
      kingdom is quiet: the great men of Alba accept you, your wife Gruoch is the granddaughter
      of a king, and her son Lulach, whom you have raised as your own, is your heir. You and
      Gruoch have given land at Loch Leven to the Culdees, the hermit-monks there.


      You think of going to Rome. It is a long way off, and a king who leaves for a year may
      come back to find his crown on another head: Duncan's sons are somewhere abroad. But a
      kingdom at peace can be left for a time, and a king who has been to Rome is honoured
      by every church in Europe.
    choices:
      - label: "Go to Rome on pilgrimage"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          You go to Rome, and, as the Irish monk Marianus Scotus writes in his chronicle, the
          king of the Scots, Macbeth, scatters silver among the poor like seed. You come home
          to a kingdom still at peace.
      - label: "Stay at home, and build churches"
        legitimacy_bp: 500
        outcome: >-
          You give more land to the Culdees, and the people of Alba grow used to a king at home.
    history: >-
      Macbeth ruled Scotland for seventeen years (1040-1057); in 1050 he made a pilgrimage
      to Rome, where, according to Marianus Scotus, he gave money to the poor.
    sources: ["Marianus Scotus, Chronicle 1050", "Register of the Priory of St Andrews (Kirkness charter)", "Aitchison, Macbeth: Man and Myth (2000)"]

  - id: sco_dunsinane
    scenario: year_1000
    civ: scotland
    year: 1054
    title: "The Seven Sleepers"
    place: "Dunsinane"
    speaker: general
    speaker_name: "A Norman captain"
    speaker_title: "One of the knights who serve you for pay"
    benchmark_provinces: 1
    story: >-
      You are Macbeth, King of Alba, and the English have come. Earl Siward of Northumbria, a
      great man of Danish stock, with a large army and the exiled Malcolm, Duncan's son, is
      marching up from the south. Shakespeare sets the end of Macbeth here, and in the play it is
      with a walking wood and a man not born of woman. The real battle has no wood, and the
      real Macbeth survives it.


      King Edward the Confessor in London is supporting Malcolm's claim, and Siward has a
      reputation. Your army, with some Normans in your pay (perhaps exiles from England, two years ago),
      waits at the hill of Dunsinane above the Tay, where later tradition places the
      battle. It is the feast of the Seven Sleepers.
    choices:
      - label: "Meet Siward and fight"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          It is a hard fight. The Irish annalists say that three thousand Scots and fifteen
          hundred of the English fell, among them Siward's son Osbern and his nephew. The
          Normans in your service are cut down. You flee north to Moray, where you can hold the
          country, while Malcolm is set up as king in the south by Siward, in the lands
          that were once your own.
      - label: "Retreat north without fighting"
        legitimacy_bp: -1000
        outcome: >-
          The south is lost without a battle. Malcolm and Siward ride into Perthshire, and
          you have given up everything but Moray.
    history: >-
      In July 1054 Earl Siward of Northumbria defeated Macbeth in a battle in which
      thousands died; Macbeth survived and held the north until his death, in battle with
      Malcolm Canmore, at Lumphanan in 1057.
    sources: ["Annals of Ulster 1054", "Anglo-Saxon Chronicle 1054 (D)", "Marianus Scotus, Chronicle", "Aitchison, Macbeth: Man and Myth (2000)"]

  - id: sco_margaret
    scenario: year_1000
    civ: scotland
    year: 1070
    title: "A Queen from the Wessex Line"
    place: "Dunfermline"
    speaker: general
    speaker_name: "Edgar the Atheling"
    speaker_title: "Heir of the old English kings"
    benchmark_provinces: 1
    story: >-
      You are Malcolm, called Canmore (ceann mor, "great head" or "great chief"), King of Alba for twelve years. You killed
      Macbeth in 1057, and his stepson Lulach the year after. You have been married to
      Ingibiorg, the widow of Earl Thorfinn of Orkney, and she has given you sons.


      Now the English have a new king, William, a Norman. Edgar the Atheling, who is the last of the old
      royal line of Wessex, has fled with his mother and his sisters Margaret and Christina.
      The story goes that they were driven by a storm into the Firth of Forth. They have
      come to your court, and Margaret, who is about twenty-four, is learned and very pious.
      If you marry her, you will be the brother-in-law of the English heir, and the Normans
      will not forget.
    choices:
      - label: "Marry Margaret, and shelter Edgar"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 2000}
        knowledge_bp: 1000
        outcome: >-
          Margaret becomes your queen. Her biographer, the monk Turgot, says that she persuaded
          the bishops to change the Scots church to the customs of Rome: Lent, Easter and
          the mass. She founds the church at Dunfermline, and the poor are fed every day at her
          table. She gives you eight children, three of whom will be kings of Scots. The
          Norman king resents you, and you raid the north of England that year.
        deeds: {grudges: {england: 1500}}
      - label: "Send the exiles to King William"
        legitimacy_bp: -500
        outcome: >-
          William is pleased, and nothing more. Edgar's friends in the English north will
          not forget it, and Scotland has made no friends.
    history: >-
      Malcolm III married Margaret of Wessex, sister of Edgar the Atheling, in about 1070,
      having sheltered the English exiles; she reformed the Scottish church.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1067-1070 (D, E)", "Turgot, Life of St Margaret", "Orderic Vitalis, Ecclesiastical History 4", "Oram, Domination and Lordship (2011)"]

  - id: sco_abernethy
    scenario: year_1000
    civ: scotland
    year: 1072
    title: "The Conqueror at Abernethy"
    place: "Abernethy, on the Tay"
    speaker: england
    speaker_name: "King William"
    speaker_title: "The Conqueror, at the head of an army"
    needs_alive: [england]
    benchmark_provinces: 1
    story: >-
      You are Malcolm, King of Alba. For two years you have raided northern England,
      and burnt Cleveland and Teesdale. King William has hanged or crushed his own northern
      rebels with the Harrying of the North, and has built a castle at York. Now he has
      brought an army across the Tweed, with a fleet that sails along the coast.


      Your own men are in the hills, and William is at Abernethy. His army is a great deal
      bigger than yours, and it has a lot of horsemen.
    choices:
      - label: "Meet William and accept him as lord"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          The Peterborough chronicle says that you came to him, gave hostages and became
          his man. Among the hostages is your eldest son Duncan, from Ingibiorg, who will
          grow up at the Norman court. William goes home without a fight, and you go on ruling
          Alba as you did.
      - label: "Retreat into the hills and let the English starve"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          William's army, without supplies in the Highland autumn, would have withered away, but
          a Conqueror does not forgive being made to look a fool, and he will come again.
    history: >-
      In 1072 William I invaded Scotland and met Malcolm III at Abernethy; Malcolm gave
      hostages (including his son Duncan) and became William's man.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1072 (E)", "Florence of Worcester 1072", "Barrow, Kingship and Unity (1981)"]

  - id: sco_alnwick
    scenario: year_1000
    civ: scotland
    year: 1092
    title: "Rufus at Carlisle"
    place: "Edinburgh"
    speaker: england
    speaker_name: "William Rufus"
    speaker_title: "King of the English, son of the Conqueror"
    needs_alive: [england]
    benchmark_provinces: 1
    story: >-
      You are Malcolm, King of Alba, and you are sixty, with your sons nearly grown. Your
      queen Margaret, who has been ill for years, fasts and prays in her room. Last year you
      invaded England while Rufus was in Normandy, and were glad to make peace through his
      brother Robert and Edgar the Atheling.


      This year Rufus has marched north to Carlisle, the border town that your people
      believed was theirs, and built a castle there, and sent English farmers to settle the
      Cumbrian land. He is the king of a far larger kingdom than yours, and he offers to settle
      the borders at his court in Gloucester.
    choices:
      - label: "Go to Gloucester, as Rufus asks"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          In 1093 you ride the length of England, and Rufus will not see you. He says you must
          do him homage in his own court of barons, and you refuse, and ride home in a rage.
          That November, raiding Northumbria, you are caught at Alnwick, and you and your son
          Edward are killed. Margaret, who is dying, hears that the king and her eldest son
          are dead, and is said, by Turgot, to thank God for her suffering, and dies three days later. The
          sons of Margaret will be the Scottish kings in due course, after Donald Ban and
          a time of troubles.
      - label: "Attack Northumbria at once"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          You raid the north in the spring. Rufus's barons are ready, and the war goes on.
    history: >-
      In 1092 William Rufus took Carlisle; Malcolm III was refused a meeting at Gloucester in 1093
      and was killed on 13 November at Alnwick; Margaret died three days later.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1091-1093 (E)", "Turgot, Life of St Margaret", "Symeon of Durham, History of the Kings 1093", "Duncan, Kingship of the Scots (2002)"]
