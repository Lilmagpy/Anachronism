schema_version: 1
# Chronicle mode (D-120, D-170): the Árpád kingdom of Hungary, from Stephen's crown to the
# Tihany charter, 1000-1055. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow Stephen's Admonitions and laws, the legends of St
# Stephen and St Gerard, Thietmar, Wipo, the Annals of Altaich and the later Hungarian
# chronicles (the Illuminated Chronicle, used with care), with modern work by Engel, Kontler,
# Berend and Györffy. benchmark_provinces counts the provinces of this map the real kings
# held at that date.
chapters:
  - id: hun_crown
    scenario: year_1000
    civ: hungary
    year: 1000
    title: "A Crown from Rome"
    place: "Esztergom"
    speaker: papacy
    speaker_name: "Pope Sylvester II"
    speaker_title: "Bishop of Rome"
    needs_alive: [papacy]
    benchmark_provinces: 2
    story: >-
      You are Vajk, baptised Stephen, prince of the Magyars. Your great-grandfathers rode from
      the steppe and raided as far as Spain, until the Germans broke them on the Lech. Your
      father made peace and let in missionaries. When he died, your pagan kinsman Koppány
      claimed your mother as his wife and the land with her; you had him quartered and
      nailed to the gates of four castles.


      Now you want to be a king, like the Christian kings. Byzantium would give you a crown,
      and a bishop who answers to Constantinople. The pope in Rome, the scholar Gerbert,
      would give you one too, with the blessing of his friend the emperor Otto III.
    choices:
      - label: "Take the crown from Rome"
        historical: true
        legitimacy_bp: 3000
        influence: {clergy: 2000}
        outcome: >-
          The pope sends a crown and an apostolic blessing, and on Christmas Day 1000, or New
          Year's Day 1001, you are anointed King of Hungary. You found an archbishopric at
          Esztergom and order every ten villages to build a church. Hungary will be a Latin
          kingdom, facing west, for the next thousand years.
      - label: "Take the crown from Constantinople"
        legitimacy_bp: 2000
        knowledge_bp: 1000
        outcome: >-
          A crown of Greek enamels arrives, with a Greek archbishop. The Germans regard you
          with suspicion, and the Byzantines regard you as their vassal.
    history: >-
      Stephen I was crowned around 1000-1001 with a crown sent by Pope Sylvester II, with
      Otto III's consent, and founded the archbishopric of Esztergom.
    diverged: >-
      The papacy is gone.
    sources: ["Thietmar of Merseburg 4.59", "Hartvic, Life of St Stephen 9", "Engel, The Realm of St Stephen (2001)"]

  - id: hun_gyula
    scenario: year_1000
    civ: hungary
    year: 1003
    title: "Your Mother's Brother"
    place: "Esztergom"
    speaker: general
    speaker_name: "One of your German knights"
    speaker_title: "Of the queen's household"
    benchmark_provinces: 2
    story: >-
      Your uncle Gyula rules Transylvania, east of the great plain, as a prince in his own
      right. He was baptised in Constantinople, keeps his own court, and pays you no tribute.
      His salt and his gold are the richest in the land.


      Your knights say a kingdom cannot have two princes.
    choices:
      - label: "March on Transylvania"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1500
        outcome: >-
          Gyula is captured with his wife and sons, and Transylvania becomes a province of the
          kingdom under a royal governor. The salt mines are the king's.
        deeds: {martial_bp: 500}
      - label: "Leave him his principality"
        legitimacy_bp: -1000
        outcome: >-
          Gyula sends gifts, and keeps his salt.
    history: >-
      In about 1003 Stephen conquered Transylvania from his maternal uncle Gyula.
    sources: ["Annals of Hildesheim 1003", "Illuminated Chronicle 66", "Engel, The Realm of St Stephen (2001)"]

  - id: hun_pilgrims
    scenario: year_1000
    civ: hungary
    year: 1018
    title: "The Road to Jerusalem"
    place: "Esztergom"
    speaker: diviner
    speaker_name: "Abbot Odilo of Cluny"
    speaker_title: "In a letter to you"
    benchmark_provinces: 2
    story: >-
      Pilgrims from France and Germany to Jerusalem have always gone by sea, from Italy, at
      great cost and risk. Now that your kingdom is Christian, there could be a road by land,
      down the Danube, through your country and the Byzantine Balkans.


      This year the Emperor Basil has finished conquering Bulgaria, with your soldiers' help.
      The road is clear, if you will keep it safe, build hostels, and let the pilgrims pass
      without tolls.
    choices:
      - label: "Open the road"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 500
        knowledge_bp: 1000
        outcome: >-
          Pilgrims pour down the Danube: Abbot Odilo writes to thank you, and you found hostels
          for Hungarian pilgrims in Jerusalem, Rome and Constantinople. In seventy years the
          crusaders will take the same road.
      - label: "Charge them a toll"
        wealth_bp: 1500
        outcome: >-
          The pilgrims pay, grumbling, and some of them go by sea again.
    history: >-
      After about 1016-1018 Stephen opened an overland pilgrim route through Hungary to the
      Byzantine Balkans; Hungarian troops helped Basil II's final campaigns in Bulgaria.
    sources: ["Rodulfus Glaber, Histories 3.1", "Hartvic, Life of St Stephen 13", "Engel, The Realm of St Stephen (2001)"]

  - id: hun_ajtony
    scenario: year_1000
    civ: hungary
    year: 1028
    title: "The Salt on the Maros"
    place: "Esztergom"
    speaker: general
    speaker_name: "Csanád"
    speaker_title: "Ajtony's former commander"
    benchmark_provinces: 2
    story: >-
      In the south-east, beyond the Tisza, a chieftain named Ajtony rules from his fortress on
      the Maros river. He has horses beyond counting and has taken baptism from the Greeks.
      Now he is stopping your salt barges on the Maros and taxing them.


      His own commander, Csanád, has deserted to you. He offers to lead your army against
      him, if you will give him Ajtony's land.
    choices:
      - label: "Send Csanád"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        outcome: >-
          Csanád kills Ajtony and takes his fortress, which is renamed Csanád after him. You
          found a bishopric there for the Venetian monk Gerard, who will teach the princes and
          write a strange, learned book about the Song of the Three Children.
        deeds: {martial_bp: 500}
      - label: "Pay Ajtony's toll"
        wealth_bp: -1500
        outcome: >-
          The salt moves again, at Ajtony's price.
    history: >-
      Csanád defeated Ajtony around 1028 (dates vary), and the see of Csanád was founded for
      Bishop Gerard (Gellért).
    sources: ["Legenda maior sancti Gerhardi 8", "Engel, The Realm of St Stephen (2001)"]

  - id: hun_conrad
    scenario: year_1000
    civ: hungary
    year: 1030
    title: "The Emperor Goes Hungry"
    place: "The western border"
    speaker: hre
    speaker_name: "Conrad II"
    speaker_title: "Emperor"
    needs_alive: [hre]
    benchmark_provinces: 2
    story: >-
      The new emperor, Conrad II, is no friend of the old alliance. His army has crossed the
      border and is marching down the Danube toward the Rába river. Your army is smaller, and
      the Germans want a battle.
    choices:
      - label: "Give no battle; empty the land in front of them"
        historical: true
        food_bp: -1500
        legitimacy_bp: 1500
        outcome: >-
          Your people drive off their cattle and burn their stores. Conrad's army marches
          through a wasteland, finds nothing to eat, and turns back. Your men follow it and
          take Vienna. In the peace, the emperor gives you the land between the Leitha and the
          Fischa.
        deeds: {grudges: {hre: 1000}}
      - label: "Meet them in battle"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          The German knights ride down your archers on the Rába, and the emperor demands
          tribute.
    history: >-
      Conrad II's invasion of Hungary in 1030 failed for lack of supplies; the Hungarians
      took Vienna, and the peace of 1031 ceded the Leitha-Fischa land.
    diverged: >-
      The empire is gone.
    sources: ["Annals of Altaich 1030", "Wipo, Gesta Chuonradi 26"]

  - id: hun_imre
    scenario: year_1000
    civ: hungary
    year: 1031
    title: "A Boar in the Forest"
    place: "Székesfehérvár"
    speaker: steward
    speaker_name: "Queen Gisela"
    speaker_title: "Your wife, sister of Emperor Henry II"
    benchmark_provinces: 2
    story: >-
      Your son Imre, for whom you wrote a book of advice on how to rule, has been killed by a
      boar while hunting. He was twenty-four. You have no other son.


      Your nearest male kinsman is your cousin Vazul, who is said to be half a pagan and is
      under guard at Nyitra for plotting. Your sister's son, Peter Orseolo, the son of the
      Doge of Venice, has grown up at your court and is a Christian, and a foreigner. The
      queen favours Peter.
    choices:
      - label: "Name Peter your heir"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Vazul tries to have you killed, it is said, and is blinded, and molten lead poured
          into his ears. His sons Levente, Andrew and Béla flee to Bohemia and Poland and Kiev.
          They will be back.
      - label: "Name Vazul, and trust him"
        legitimacy_bp: 500
        influence: {clergy: -1500}
        outcome: >-
          Vazul is brought to court and sworn to keep the faith. The bishops pray for the
          kingdom.
    history: >-
      After the death of Prince Imre (1031), Stephen chose Peter Orseolo as heir; Vazul was
      blinded and his sons fled abroad.
    sources: ["Annals of Hildesheim 1031", "Illuminated Chronicle 69", "Stephen I, Admonitions"]

  - id: hun_peter
    scenario: year_1000
    civ: hungary
    year: 1040
    title: "The Venetian King"
    place: "Székesfehérvár"
    speaker: general
    speaker_name: "Samuel Aba"
    speaker_title: "Palatine, husband of Stephen's sister"
    benchmark_provinces: 2
    story: >-
      You are Peter Orseolo, king since Stephen died. The Hungarians call you 'the Venetian'.
      You trust Germans and Italians and give them offices and castles; you have driven out
      Stephen's widow; your nobles say you have taken their wives and daughters.


      Your palatine, Samuel Aba, of the old Kabar nobility, has come with the bishops to tell
      you to send your foreigners home.
    choices:
      - label: "Keep your own men"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          The nobles rise. You flee to the court of the German king Henry III. Samuel Aba is
          crowned in your place.
        deeds: {ruler_falls: "is driven out by his nobles"}
      - label: "Send the foreigners home"
        legitimacy_bp: 500
        influence: {nobility: 1500}
        outcome: >-
          Your German knights ride home, and the Hungarian lords take their castles, and make
          you their king, on their terms.
    history: >-
      Peter Orseolo (r. 1038-1041) was overthrown by the nobility in 1041 and replaced by
      Samuel Aba.
    sources: ["Annals of Altaich 1041", "Illuminated Chronicle 71-72"]

  - id: hun_menfo
    scenario: year_1000
    civ: hungary
    year: 1044
    title: "The Emperor Brings Peter Back"
    place: "Ménfő, near Győr"
    speaker: hre
    speaker_name: "Henry III"
    speaker_title: "King of Germany"
    needs_alive: [hre]
    benchmark_provinces: 2
    story: >-
      You are Samuel Aba, King of Hungary. You have raided Austria twice; you have angered
      your own bishops by favouring commoners; you have executed fifty nobles who plotted
      against you. Henry III of Germany has come to put Peter back on the throne, and your
      enemies have gone over to him.


      Your army is at Ménfő. The Germans are across the marsh.
    choices:
      - label: "Fight"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          A wind blows dust into your men's faces, and the Germans break through. You flee,
          and are killed by your own people near the Tisza. Henry puts Peter back on the
          throne, and Peter does homage to Henry for Hungary, as his vassal. He gives Henry a
          golden lance.
        deeds: {ruler_falls: "is killed fleeing the battle of Ménfő"}
      - label: "Offer terms"
        legitimacy_bp: -1000
        wealth_bp: -2000
        outcome: >-
          You pay, and Henry goes home with your gold and without Peter, this time.
    history: >-
      Henry III defeated Samuel Aba at Ménfő in 1044 and restored Peter Orseolo as his
      vassal; Aba was killed in flight.
    diverged: >-
      The empire is gone.
    sources: ["Annals of Altaich 1044", "Hermann of Reichenau, Chronicle 1044", "Illuminated Chronicle 76"]

  - id: hun_vata
    scenario: year_1000
    civ: hungary
    year: 1046
    title: "The Rising of Vata"
    place: "Székesfehérvár"
    speaker: diviner
    speaker_name: "Bishop Gerard"
    speaker_title: "Of Csanád"
    benchmark_provinces: 2
    story: >-
      You are Peter Orseolo again, king by the grace of the German king, and the Hungarians
      hate you more than before. Vazul's sons Andrew and Levente have come home from Kiev.


      A pagan named Vata has raised the countryside: men shave their heads in the old way,
      kill priests and tax collectors, and sing pagan songs. Andrew and Levente have joined
      them, and promised them the old ways back. Bishop Gerard and the other bishops are on
      the road to meet Andrew and beg him to save the church. Gerard asks whether you will
      fight.
    choices:
      - label: "Try to reach the German border"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          On the Danube, the rebels catch the bishops: Gerard is put in a cart and thrown down
          the hill at Buda that will bear his name. Your guard is cut down at Zámoly and you
          are blinded, and die. Andrew is crowned, sends the pagans home, and keeps the church.
        deeds: {ruler_falls: "is caught by the rebels and blinded"}
      - label: "Fight Vata with the knights you have"
        unrest_bp: 1500
        outcome: >-
          Your German knights cut through the rebels. Andrew and Levente wait in the east for
          a better day.
    history: >-
      The Vata pagan uprising (1046) brought down Peter Orseolo, who was blinded; Bishop
      Gerard was martyred; Andrew I was crowned and restored Christian order.
    sources: ["Legenda maior sancti Gerhardi 15", "Illuminated Chronicle 82-86", "Annals of Altaich 1046"]

  - id: hun_tihany
    scenario: year_1000
    civ: hungary
    year: 1055
    title: "On the Road to Fehérvár"
    place: "The Tihany peninsula, Lake Balaton"
    speaker: diviner
    speaker_name: "The first abbot of Tihany"
    speaker_title: "A Benedictine"
    benchmark_provinces: 2
    story: >-
      You are Andrew I. You have kept the Germans out - Henry III's fleet on the Danube was
      sunk by your divers, it is said, who cut holes in the boats - and the kingdom is quiet.
      You are building an abbey on the hill over Lake Balaton, where you want to be buried.


      The abbot is drawing up its founding charter, in Latin, listing the lands you have
      given it. Nobody in Latin knows the names of Hungarian fields, roads and streams. He
      asks whether he may write them in Hungarian.
    choices:
      - label: "Write them in Hungarian"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 500
        outcome: >-
          Among the Latin, the abbot writes 'feheruuaru rea meneh hodu utu rea': 'on the
          military road that goes to Fehérvár'. It is the oldest written Hungarian sentence to
          survive. You are buried in the abbey's crypt, where you still lie.
      - label: "Latin only"
        knowledge_bp: 500
        outcome: >-
          The charter is correct and elegant, and nobody can find the fields it gives away.
    history: >-
      The founding charter of the Tihany Abbey (1055) contains the earliest surviving
      fragments of written Hungarian; Andrew I is buried there.
    sources: ["Tihany founding charter (Pannonhalma archives)", "Engel, The Realm of St Stephen (2001)"]
