schema_version: 1
# Chronicle mode (D-120, D-156): the Seleucid kings, from Antiochus II to Antiochus the
# Great, 260-187 BC. Each chapter opens in its year; one choice is what history chose.
# Facts follow Polybius (books 5, 8, 10, 11, 16, 18, 21), Livy 33-38, Appian's Syrian Wars,
# Justin, the Babylonian astronomical diaries and chronicles, and modern work by Grainger,
# Kosmin, Ma and Strootman. benchmark_provinces counts the provinces of this map the real
# Seleucid kings held at that date.
chapters:
  - id: sel_berenice
    scenario: punic_wars
    civ: seleucid
    year: -253
    until_year: -248
    title: "Berenice's Dowry"
    place: "Antioch"
    speaker: ptolemaic
    speaker_name: "Envoys of Ptolemy II"
    speaker_title: "From Alexandria"
    needs_alive: [ptolemaic]
    benchmark_provinces: 8
    story: >-
      You are Antiochus II, called Theos, 'the god', by the grateful Milesians. For seven years
      you have fought Ptolemy of Egypt for Syria and the Aegean coast, and neither of you can
      win.


      Ptolemy offers peace - and his daughter Berenice, with a dowry so large that she will be
      called 'the dowry-bringer'. The price: you must put away your wife Laodice, a great lady
      of Asia Minor, and make Berenice's son your heir instead of Laodice's.
    choices:
      - label: "Marry Berenice, and put away Laodice"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 800
        outcome: >-
          Berenice comes to Antioch with her dowry, and Ptolemy sends her water from the Nile,
          so that she will drink nothing else. Laodice goes to Ephesus with her sons. A few
          years later you go back to her - and die there, suddenly. Everyone in Antioch says
          Laodice poisoned you.
        deeds: {peace_with: [ptolemaic]}
      - label: "Refuse, and fight on"
        unrest_bp: 1000
        food_bp: -2000
        outcome: >-
          The war for Syria goes on. Laodice is grateful.
        deeds: {war_with: [ptolemaic]}
    history: >-
      Antiochus II ended the Second Syrian War in 253 BC by marrying Berenice, daughter of
      Ptolemy II, and repudiating Laodice; he died in 246, perhaps poisoned by Laodice.
    diverged: >-
      Egypt is gone.
    sources: ["Appian, Syriaca 65", "Jerome, On Daniel 11", "Grainger, The Syrian Wars (2010)"]

  - id: sel_laodice
    scenario: punic_wars
    civ: seleucid
    year: -246
    until_year: -241
    title: "The Laodicean War"
    place: "Ephesus"
    speaker: steward
    speaker_name: "Laodice"
    speaker_title: "Your mother"
    needs_alive: [ptolemaic]
    benchmark_provinces: 8
    story: >-
      You are Seleucus II, Laodice's son. Your father is dead, and your mother's friends in
      Antioch have murdered Berenice and her little son. Berenice's brother has just become
      King of Egypt as Ptolemy III, and he is coming to avenge her with the whole army of Egypt.
      The Ptolemaic fleet already holds the Syrian coast.
    choices:
      - label: "Meet him in Syria"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Ptolemy marches through Syria almost to Babylon before trouble at home calls him back,
          carrying off the statues of Egypt's gods that the Persians stole three centuries ago.
          You hold the inland cities, but the great port of Seleucia, Antioch's harbour, will be
          Egyptian for thirty years. Your queen Berenice of Egypt dedicates a lock of her hair for
          her husband's safe return; astronomers find it among the stars.
        deeds: {war_with: [ptolemaic], give: [sel_cilicia], give_to: ptolemaic}
      - label: "Abandon Syria, and hold the east"
        legitimacy_bp: -2500
        outcome: >-
          Ptolemy takes Antioch. You rule from Babylon.
        deeds: {war_with: [ptolemaic], give: [sel_syria], give_to: ptolemaic}
    history: >-
      In the Third Syrian War (246-241 BC) Ptolemy III invaded the Seleucid empire after
      Berenice's murder, reaching Mesopotamia; Seleucia Pieria stayed Ptolemaic until 219.
    diverged: >-
      Egypt is gone.
    sources: ["Polybius 5.58", "Gurob papyrus", "Catullus 66 (the Lock of Berenice)"]

  - id: sel_molon
    scenario: punic_wars
    civ: seleucid
    year: -222
    until_year: -218
    title: "The Young King and the Rebel"
    place: "Antioch"
    speaker: steward
    speaker_name: "Hermeias"
    speaker_title: "Your chief minister"
    benchmark_provinces: 7
    story: >-
      You are Antiochus, eighteen. Your brother the king was murdered by his own officers in
      Asia Minor. Molon, satrap of Media, has rebelled and beaten two royal armies; he has
      taken Babylon and calls himself king.


      Your minister Hermeias, who controls everything at court, says to send another general.
      Your old generals say only the king himself can make the soldiers of the east remember
      their oath.
    choices:
      - label: "Go yourself"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          You march east across the Tigris. When Molon's left wing sees the young king himself in
          front of them, it changes sides. Molon kills himself; his body is crucified on the
          highest point of the Zagros. On the way home, you have Hermeias murdered.
        deeds: {martial_bp: 1000}
      - label: "Send a general, as Hermeias says"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Your general is beaten too. Molon takes Seleucia on the Tigris.
        deeds: {give: [sel_media]}
    history: >-
      Antiochus III (r. 222-187 BC) personally defeated the usurper Molon in 220 BC and had his
      minister Hermeias assassinated.
    sources: ["Polybius 5.40-56"]

  - id: sel_raphia
    scenario: punic_wars
    civ: seleucid
    year: -217
    until_year: -213
    title: "Raphia"
    place: "Raphia, on the border of Egypt"
    speaker: general
    speaker_name: "Theodotus the Aetolian"
    speaker_title: "A deserter from Ptolemy"
    needs_alive: [ptolemaic]
    benchmark_provinces: 8
    story: >-
      You have taken back Seleucia and most of Syria. Now Ptolemy IV has come out of Egypt
      with an army of seventy thousand - including, for the first time, Egyptians trained as a
      phalanx - and seventy-three African elephants. You have sixty-eight thousand and a
      hundred and two Indian elephants.


      The night before the battle, Theodotus, who knows Ptolemy's camp, slipped in to kill
      Ptolemy in his tent - and found the wrong man.
    choices:
      - label: "Lead the cavalry on the right yourself"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Your Indian elephants drive off Ptolemy's smaller African ones, and you lead your
          horsemen in a charge that breaks his left. You chase them for miles. When you come
          back, your phalanx has been beaten by Ptolemy's Egyptians. You lose ten thousand men
          and Coele-Syria. Egypt's victory has armed its own people, and it will regret it.
        deeds: {peace_with: [ptolemaic]}
      - label: "Stay with the centre and command the whole line"
        legitimacy_bp: 2000
        outcome: >-
          You let your cavalry chase and keep the phalanx steady. The Egyptian centre breaks.
          Ptolemy flees to Pelusium, and Coele-Syria is yours.
        deeds: {take: [pto_coele_syria], peace_with: [ptolemaic]}
    history: >-
      At Raphia (217 BC) Antiochus III won on his right but lost the battle when his phalanx
      was defeated by Ptolemy IV's newly trained Egyptian phalangites.
    diverged: >-
      Egypt is gone.
    sources: ["Polybius 5.79-86", "Raphia decree (Pithom stele)"]

  - id: sel_anabasis
    scenario: punic_wars
    civ: seleucid
    year: -212
    title: "To the Edge of the World"
    place: "Antioch"
    speaker: general
    speaker_name: "Your companions"
    speaker_title: "Of the royal guard"
    benchmark_provinces: 8
    story: >-
      The east has slipped away: Armenia pays no tribute; Arsaces of Parthia calls himself
      king; Euthydemus rules Bactria as a Greek king of his own. You are thirty, and you want
      to do what Seleucus and Alexander did: march to the end of the world and make the east
      remember.


      It will take years. Your ministers fear for the west while you are gone.
    choices:
      - label: "March east"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          Seven years. Armenia submits; Arsaces is beaten and made an ally. You besiege
          Euthydemus in Bactra for two years, and he persuades you that the nomads behind him
          will overrun you both, so you make him king and your ally, and marry his son to your
          daughter. You cross the Hindu Kush and renew friendship with an Indian king, who gives
          you elephants. You come home by the Persian Gulf, and from now on you are Antiochus
          the Great.
        deeds: {men: 20000, martial_bp: 1500}
      - label: "Stay in the west and watch Egypt and Rome"
        legitimacy_bp: -500
        outcome: >-
          The east goes its own way. The kings of Parthia and Bactria grow stronger.
    history: >-
      Antiochus III's eastern expedition (212-205 BC) reasserted Seleucid authority over
      Armenia, Parthia and Bactria and earned him the title Megas.
    sources: ["Polybius 10.27-31, 10.49, 11.34"]

  - id: sel_panium
    scenario: punic_wars
    civ: seleucid
    year: -200
    until_year: -196
    title: "Panium"
    place: "The source of the Jordan"
    speaker: general
    speaker_name: "Antiochus the Younger"
    speaker_title: "Your eldest son"
    needs_alive: [ptolemaic]
    needs_owner: {pto_coele_syria: ptolemaic}
    benchmark_provinces: 8
    story: >-
      Ptolemy IV is dead, and his heir is a child; his ministers are murdering each other in
      Alexandria. Philip V of Macedon and you have agreed, it is rumoured, to divide Egypt's
      overseas lands between you. Coele-Syria - Phoenicia, Judea, the land you lost at Raphia -
      is defended by the Aetolian mercenary general Scopas.
    choices:
      - label: "Attack Scopas at Panium with the elephants"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your son's cavalry takes the hill and your elephants break the Aetolian line. Scopas
          shuts himself up in Sidon and surrenders. Coele-Syria is Seleucid at last; the Jews of
          Jerusalem, who helped you, are given the right to live by their own laws.
        deeds: {war_with: [ptolemaic], take: [pto_coele_syria]}
      - label: "Make a treaty with Egypt's regents"
        legitimacy_bp: 300
        outcome: >-
          The regents pay you to stay out of Coele-Syria. Philip of Macedon takes the islands.
    history: >-
      Antiochus III won the battle of Panium (200 BC) and took Coele-Syria in the Fifth Syrian
      War; Josephus preserves his decree for Jerusalem.
    diverged: >-
      Coele-Syria is not Egypt's, or Egypt is gone.
    sources: ["Polybius 16.18-19", "Josephus, Antiquities 12.138-146"]

  - id: sel_hannibal
    scenario: punic_wars
    civ: seleucid
    year: -195
    title: "A Guest from Carthage"
    place: "Ephesus"
    speaker: general
    speaker_name: "Hannibal"
    speaker_title: "An exile from Carthage"
    benchmark_provinces: 9
    story: >-
      Roman envoys have told you to keep out of Europe and to leave the Greek cities of Asia
      alone. You told them that Asia was none of Rome's business. Now Hannibal, the greatest
      general alive, has fled to your court from Carthage, where Rome's friends wanted him dead.


      He has a plan: give him a hundred ships and ten thousand men, and he will land in Africa,
      raise Carthage, and invade Italy again, while you bring your army into Greece.
    choices:
      - label: "Keep him at court, and make your own plan"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          Your courtiers whisper that Hannibal wants the glory for himself; Roman envoys make a
          point of talking to him. You never quite trust him. He is given a few ships and
          beaten at sea off Side by the Rhodians. You go into Greece on your own.
      - label: "Give him the ships and the men"
        wealth_bp: -2500
        legitimacy_bp: 1000
        outcome: >-
          Hannibal sails west with a hundred ships. Rome, which thought it was done with him,
          recalls its legions from Greece to guard Italy.
        deeds: {ally_with: [carthage], grudges: {rome: 3000}}
    history: >-
      Hannibal joined Antiochus III in 195 BC; his proposal to invade Italy was not taken up,
      and he was given a minor naval command.
    sources: ["Livy 34.60, 35.19", "Appian, Syriaca 7-14"]

  - id: sel_magnesia
    scenario: punic_wars
    civ: seleucid
    year: -190
    until_year: -186
    title: "Magnesia"
    place: "Below Mount Sipylus, in Asia"
    speaker: general
    speaker_name: "Hannibal"
    speaker_title: "Your adviser"
    needs_alive: [rome]
    benchmark_provinces: 9
    story: >-
      You crossed into Greece, and the Romans drove you out at Thermopylae. Now the consul Lucius
      Scipio - with his brother Africanus, the victor of Zama, as his adviser - has crossed into
      Asia. You have seventy thousand men, scythed chariots, elephants, and camels with Arab
      archers. Looking at your gilded army, you ask Hannibal if it will be enough for the Romans.
      'Enough,' he says, 'however greedy they are.'
    choices:
      - label: "Lead the right wing yourself again"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Your cavalry breaks the Roman left and chases it to its camp. Meanwhile the Romans'
          Pergamene allies stampede your scythed chariots back into your own lines, and the
          phalanx, hemmed in by panicking elephants, is slaughtered. By the treaty of Apamea you
          give up everything north of the Taurus, pay fifteen thousand talents, and promise to
          hand over Hannibal. He escapes first.
        deeds: {peace_with: [rome], give: [sel_asia], give_to: pergamon}
      - label: "Hold the whole line together"
        legitimacy_bp: 1500
        outcome: >-
          The chariots stay back; the cavalry stays in line. The Romans attack your phalanx and
          cannot break it. At dusk both armies are still on the field, and the Scipios begin to
          talk about terms.
        deeds: {peace_with: [rome]}
    history: >-
      At Magnesia (190/189 BC) the Romans destroyed Antiochus III's army; by the Treaty of
      Apamea (188) he ceded Asia Minor north of the Taurus and paid a vast indemnity.
    diverged: >-
      Rome is gone.
    sources: ["Livy 37.37-44", "Appian, Syriaca 30-36", "Aulus Gellius 5.5"]

  - id: sel_bel
    scenario: punic_wars
    civ: seleucid
    year: -187
    title: "The Temple of Bel"
    place: "Elymais, in the Zagros"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Counting the Roman indemnity"
    benchmark_provinces: 8
    story: >-
      You owe Rome a thousand talents a year for twelve years. The treasury cannot pay. In the
      mountains of Elymais there is a temple of Bel, rich with centuries of offerings.


      Your treasurer suggests that the gods might lend the king what he needs.
    choices:
      - label: "Take the temple's treasure"
        historical: true
        legitimacy_bp: -2000
        wealth_bp: 2000
        outcome: >-
          You march into Elymais by night. The people of the hills rise to defend their god,
          and kill you and your soldiers in the temple. Antiochus the Great dies a temple
          robber. Your son Seleucus will spend his reign paying Rome.
        deeds: {ruler_falls: "is killed robbing the temple of Bel"}
      - label: "Tax the cities of Syria instead"
        unrest_bp: 1500
        wealth_bp: 1500
        outcome: >-
          The cities pay and grumble. The god of Elymais keeps his gold.
    history: >-
      Antiochus III was killed in 187 BC while plundering a temple of Bel in Elymais to pay
      the Roman indemnity.
    sources: ["Diodorus 28.3, 29.15", "Justin 32.2"]
