schema_version: 1
# Chronicle mode (D-120, D-180): the Middle Elamite kingdom of Anshan and Susa, from the
# ziggurat of Chogha Zanbil to Nebuchadnezzar's revenge, c. 1272-1110 BC. Each chapter
# opens in its year; one choice is what history chose (historical: true). Facts follow the
# Elamite kings' own inscriptions on bricks, steles and statues, the Babylonian chronicles
# and Nebuchadnezzar I's texts, and the excavations at Susa and Chogha Zanbil, with modern
# work by Potts, Carter and Stolper and Álvarez-Mon. Reign dates are approximate.
# benchmark_provinces counts the provinces of this map the real kings held at that date.
chapters:
  - id: ela_ziggurat
    scenario: kadesh
    civ: elam
    year: -1272
    title: "A City for the Gods"
    place: "The plain of Susiana"
    speaker: diviner
    speaker_name: "The high priest of Inshushinak"
    speaker_title: "Patron god of Susa"
    benchmark_provinces: 2
    story: >-
      You are Untash-Napirisha, King of Anshan and Susa. Your kingdom joins two worlds: the
      highlands of Anshan, where the Elamite gods live on the mountains, and the lowland
      plain of Susa, which looks to Mesopotamia. Each has its own gods, temples and priests.


      You want to build a new holy city between them, twenty-five miles from Susa, where all
      the gods of highland and lowland are worshipped together, around a great stepped tower
      higher than any in Babylon.
    choices:
      - label: "Build the city and its tower"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -2000
        influence: {clergy: 2000}
        outcome: >-
          Al-Untash-Napirisha rises: a ziggurat of millions of baked bricks, thousands of them
          stamped with your name and the gods', inside three rings of walls. When you die,
          building stops, and the city is left half-empty. The ziggurat is still standing,
          the best preserved in the world; we call it Chogha Zanbil.
      - label: "Rebuild the old temples of Susa instead"
        legitimacy_bp: 1000
        influence: {clergy: 1000}
        outcome: >-
          The priests of Susa are delighted. The priests of the highlands are not.
    history: >-
      Untash-Napirisha founded Al-Untash-Napirisha (Chogha Zanbil), with its great ziggurat,
      in the 13th century BC.
    sources: ["Brick inscriptions of Untash-Napirisha", "Potts, The Archaeology of Elam (2016)", "Ghirshman, Tchoga Zanbil (1966-1968)"]

  - id: ela_napirasu
    scenario: kadesh
    civ: elam
    year: -1260
    title: "A Queen in Bronze"
    place: "The temple of Ninhursag, Susa"
    speaker: scholar
    speaker_name: "Your master founder"
    speaker_title: "Of the royal workshops"
    benchmark_provinces: 2
    story: >-
      You want a statue of your queen, Napir-Asu, for the temple at Susa: life-size, in
      bronze, with her hands folded over her flowered robe.


      Your master founder says he can do it in two pours: a copper shell cast around a core,
      and the core itself filled with solid bronze, so that it weighs as much as twenty men.
      No one in the world has cast so large a figure.
    choices:
      - label: "Cast the queen"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 1000
        wealth_bp: -1000
        outcome: >-
          The statue is cast and set up, weighing nearly two tons, with an inscription that
          curses anyone who damages it or takes away her name. Her head is lost, but the rest
          of her stands in the Louvre.
      - label: "Carve her in stone, as usual"
        knowledge_bp: 500
        outcome: >-
          A fine stone statue is set up in the temple, and broken in the next war.
    history: >-
      The bronze statue of Queen Napir-Asu (c. 1250 BC), found at Susa, weighs about 1,750 kg
      and was cast with a solid core.
    sources: ["Statue of Napir-Asu (Louvre Sb 2731)", "Álvarez-Mon, The Arjan Tomb (2010)"]

  - id: ela_raids
    scenario: kadesh
    civ: elam
    year: -1224
    title: "Raids on Nippur"
    place: "Susa"
    speaker: general
    speaker_name: "Your commander of chariots"
    speaker_title: "Back from the Tigris"
    needs_alive: [assyria]
    benchmark_provinces: 2
    story: >-
      You are Kidin-Hutran. Tukulti-Ninurta of Assyria has conquered Babylon and put his own
      puppet on its throne. The Babylonian countryside is in disorder; its cities are rich
      and badly guarded.


      Your commanders say the moment is perfect: cross the Tigris, strike Nippur and Der,
      and show the Assyrians that Babylonia is not theirs alone.
    choices:
      - label: "Raid Babylonia"
        historical: true
        wealth_bp: 2500
        legitimacy_bp: 1000
        outcome: >-
          Your chariots sack Nippur and scatter its people, and drive the Assyrian puppet
          from his throne. A few years later you come again, to Isin and Marad. Then Elam
          falls into a long quarrel over its own throne, and your family loses it to a new
          house.
        deeds: {grudges: {assyria: 2000}}
      - label: "Stay behind the mountains"
        legitimacy_bp: -500
        outcome: >-
          The Assyrians tighten their grip on Babylonia, and look east.
    history: >-
      Kidin-Hutran III raided Babylonia in the time of the Assyrian puppet kings (c. 1224-1217
      BC), attacking Nippur, Der and Isin.
    diverged: >-
      Assyria is gone.
    sources: ["Chronicle P (ABC 22)", "Potts, The Archaeology of Elam (2016)"]

  - id: ela_stele
    scenario: kadesh
    civ: elam
    year: -1158
    title: "Trophies for Inshushinak"
    place: "Sippar, in Babylonia"
    speaker: general
    speaker_name: "Kutir-Nahhunte"
    speaker_title: "Your son and general"
    needs_alive: [babylon]
    benchmark_provinces: 3
    story: >-
      You are Shutruk-Nakhunte. You married a Kassite princess, and you have written to the
      Babylonian court that your claim to its throne is better than theirs. Now you have
      taken seven hundred towns, and your army stands at Sippar.


      In Sippar's temples stand the great monuments of Mesopotamia's past: the victory stele
      of Naram-Sin of Akkad, a thousand years old, and the law stele of Hammurabi. Your son
      says Inshushinak deserves trophies.
    choices:
      - label: "Carry them to Susa"
        historical: true
        legitimacy_bp: 2500
        wealth_bp: 3000
        outcome: >-
          The steles go to Susa on rollers and rafts. On Naram-Sin's you carve your own
          inscription: you took it from Sippar and brought it to your god. On Hammurabi's you
          have a few laws chiselled away for an inscription that is never written. In 1901
          French archaeologists dig them both up in Susa.
        deeds: {take: [bab_babylon]}
      - label: "Take tribute, and leave the monuments"
        wealth_bp: 2000
        outcome: >-
          Babylon pays. The steles stay in Sippar, and are lost when the temple falls, as most
          things are.
    history: >-
      Shutruk-Nakhunte invaded Babylonia (c. 1158 BC) and carried the steles of Naram-Sin and
      Hammurabi to Susa, adding his own inscription to Naram-Sin's.
    diverged: >-
      Babylon is gone.
    sources: ["Shutruk-Nakhunte's inscription on the Naram-Sin stele (Louvre Sb 4)", "Code of Hammurabi stele (Louvre Sb 8)"]

  - id: ela_marduk
    scenario: kadesh
    civ: elam
    year: -1155
    title: "The God Comes to Susa"
    place: "Babylon"
    speaker: general
    speaker_name: "Kutir-Nahhunte"
    speaker_title: "Your son, in Babylon"
    benchmark_provinces: 3
    story: >-
      The last Kassite king, Enlil-nadin-ahi, has fought you for three years. Now Babylon has
      fallen to your son. In its great temple, the Esagila, stands Marduk, king of the gods of
      Babylon, whose statue was carried off by the Assyrians once and brought home.


      Your son wants to carry Marduk to Susa, so that Babylon has no god-king but yours.
    choices:
      - label: "Bring Marduk to Susa"
        historical: true
        legitimacy_bp: 2000
        influence: {clergy: 1500}
        outcome: >-
          Marduk's statue is taken to Elam, with the Kassite king. Babylon's poets will write
          that Marduk went of his own will, to punish his city. In Susa you build on and on;
          you die soon after, an old man, the greatest king Elam has had.
        deeds: {grudges: {babylon: 3000}}
      - label: "Leave Marduk in his temple"
        legitimacy_bp: -500
        influence: {clergy: -1000}
        outcome: >-
          The priests of Babylon offer sacrifices for your health, and plot.
    history: >-
      Kutir-Nahhunte ended the Kassite dynasty (c. 1155 BC) and took Marduk's statue to Elam.
    sources: ["Marduk Prophecy", "Chronicle of Nebuchadnezzar I", "Potts, The Archaeology of Elam (2016)"]

  - id: ela_shilhak
    scenario: kadesh
    civ: elam
    year: -1140
    title: "Bricks with the Names of Kings"
    place: "Susa"
    speaker: scholar
    speaker_name: "The scribes of Inshushinak"
    speaker_title: "At the temple"
    benchmark_provinces: 3
    story: >-
      You are Shilhak-Inshushinak. You took the throne, and the widow, of your brother
      Kutir-Nahhunte. Your armies have marched up the Tigris as far as the Assyrian border and
      come back with tribute.


      Now you are rebuilding the temples of Susa. Your scribes propose that the bricks be
      inscribed not only with your name, but with the names of every king who built here
      before you, back for centuries, so that the gods remember them all.
    choices:
      - label: "Inscribe the old kings' names"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 1500
        outcome: >-
          Thousands of bricks list your predecessors and their works. They are one of the main
          ways we know the history of Elam at all.
      - label: "Only your own name"
        legitimacy_bp: 1000
        outcome: >-
          The bricks praise you alone. The kings before you are forgotten a little faster.
    history: >-
      Shilhak-Inshushinak (c. 1150-1120 BC) campaigned in the Tigris region and rebuilt
      temples at Susa with inscribed bricks commemorating earlier kings' work.
    sources: ["Inscriptions of Shilhak-Inshushinak (König, Die elamischen Königsinschriften)", "Potts, The Archaeology of Elam (2016)"]

  - id: ela_ulai
    scenario: kadesh
    civ: elam
    year: -1110
    title: "Fire on the Road"
    place: "The Ulai river"
    speaker: general
    speaker_name: "Your commander"
    speaker_title: "On the Ulai"
    needs_alive: [babylon]
    benchmark_provinces: 2
    story: >-
      You are Hutelutush-Inshushinak. A new king rules in Babylon, Nebuchadnezzar, and he
      has sworn to bring Marduk home. He has marched in the middle of summer, when no one
      fights: his inscriptions will say the axes burned like fire and the roads scorched like
      flame, and the horses fell.


      His army has reached the Ulai river. Yours is waiting.
    choices:
      - label: "Fight at the Ulai"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The dust of the battle darkens the sky. A Babylonian chariot officer breaks your
          line, and you flee to the mountains and vanish from history. Nebuchadnezzar takes
          Marduk home in triumph. Elam falls silent for three hundred years.
        deeds: {ruler_falls: "flees into the mountains, and vanishes", give: [bab_babylon], give_to: babylon}
      - label: "Send Marduk back, and make peace"
        legitimacy_bp: -1500
        influence: {clergy: -1500}
        outcome: >-
          Marduk goes home on a barge, and Nebuchadnezzar goes home with him, without a
          battle.
        deeds: {give: [bab_babylon], give_to: babylon}
    history: >-
      Nebuchadnezzar I defeated Hutelutush-Inshushinak at the Ulai river (c. 1110 BC) and
      recovered Marduk's statue; Elam's history goes dark until the 8th century.
    diverged: >-
      Babylon is gone.
    sources: ["Kudurru of Shitti-Marduk (BM 90858)", "Nebuchadnezzar I's texts on the return of Marduk"]
