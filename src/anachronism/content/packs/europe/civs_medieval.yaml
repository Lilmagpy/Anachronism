schema_version: 1
# Medieval Europe and its neighbours (AD 1000).
civs:
  - id: england
    name: England
    adjective: English
    lineage: england
    colour: "#c8102e"
    symbol: dragon
    emblem: ENG
    portrait: medieval_king
    description: >-
      An Anglo-Saxon kingdom of shires and burhs, rich enough that Viking raiders keep coming back for more silver.
  - id: scotland
    name: Scotland
    adjective: Scottish
    lineage: scotland
    colour: "#1f4e9c"
    symbol: lion
    emblem: SCO
    portrait: medieval_king
    description: >-
      The kingdom of Alba, Gaelic and Pictish, among the hills and firths of the north.
  - id: ireland
    name: Ireland
    adjective: Irish
    lineage: ireland
    colour: "#2e8b57"
    symbol: harp
    emblem: ÉIR
    portrait: celtic
    description: >-
      A land of many kings and learned monasteries, where Brian Boru of Munster is making himself High King.
  - id: france
    name: France
    adjective: French
    lineage: france
    colour: "#1d4ed8"
    symbol: lily
    emblem: FRA
    portrait: medieval_king
    description: >-
      The kingdom of the Franks, whose king rules little beyond Paris while great dukes and counts go their own way.
  - id: normandy
    name: Normandy
    adjective: Norman
    lineage: normandy
    colour: "#b8860b"
    symbol: longship
    emblem: NOR
    portrait: viking
    description: >-
      Vikings turned French lords: a duchy of fierce knights and new abbeys, loyal to its duke before its king.
  - id: hre
    name: Holy Roman Empire
    adjective: Imperial
    lineage: hre
    colour: "#e3b505"
    symbol: eagle
    emblem: HRE
    portrait: medieval_king
    description: >-
      The empire of the Ottonian kings, from the North Sea to Rome, whose young emperor dreams of restoring the Roman Empire.
  - id: papacy
    name: Papacy
    adjective: Papal
    lineage: papacy
    colour: "#f5f0e1"
    symbol: crown
    emblem: PAP
    portrait: bishop
    description: >-
      Rome and the lands of Saint Peter, now under Gerbert of Aurillac - the most learned man in Europe, who brought Arabic numerals and the abacus north.
  - id: venice
    name: Venice
    adjective: Venetian
    lineage: venice
    colour: "#a51c30"
    symbol: lion
    emblem: VEN
    portrait: doge
    description: >-
      A city of merchants built on a lagoon, trading between Byzantium and the West, now sailing to master the Adriatic.
  - id: denmark
    name: Denmark
    adjective: Danish
    lineage: denmark
    colour: "#c1272d"
    symbol: raven
    emblem: DAN
    portrait: viking
    description: >-
      The Viking kingdom of the Danes, whose king has his eye on England's silver and Norway's crown.
  - id: norway
    name: Norway
    adjective: Norwegian
    lineage: norway
    colour: "#9e2a2b"
    symbol: longship
    emblem: NRG
    portrait: viking
    description: >-
      A kingdom of fjords and sea-kings, whose Christian king is about to face his enemies at sea.
  - id: sweden
    name: Sweden
    adjective: Swedish
    lineage: sweden
    colour: "#1e5aa8"
    symbol: crown
    emblem: SVE
    portrait: viking
    description: >-
      The Svear and Götar, traders to the east along the rivers of Rus.
  - id: poland
    name: Poland
    adjective: Polish
    lineage: poland
    colour: "#dc143c"
    symbol: eagle
    emblem: POL
    portrait: medieval_king
    description: >-
      A young Christian kingdom whose duke has just hosted the emperor at Gniezno.
  - id: bohemia
    name: Bohemia
    adjective: Bohemian
    lineage: bohemia
    colour: "#7b2d8b"
    symbol: lion
    emblem: BOH
    portrait: medieval_king
    description: >-
      A duchy of silver mines and castles in the heart of Europe, within the empire's orbit.
  - id: hungary
    name: Hungary
    adjective: Hungarian
    lineage: hungary
    colour: "#3c8d2f"
    symbol: cross
    emblem: MAG
    portrait: medieval_king
    description: >-
      The Magyars, horse raiders a generation ago, now becoming a Christian kingdom under their first king.
  - id: rus
    name: Kievan Rus'
    adjective: Rus'
    lineage: rus
    colour: "#b5451b"
    symbol: trident
    emblem: РУСЬ
    portrait: rus
    description: >-
      A vast realm of river cities from Novgorod to Kiev, newly Christian, trading furs and slaves to Constantinople.
  - id: byzantium
    name: Byzantine Empire
    adjective: Byzantine
    lineage: byzantium
    colour: "#6b2c91"
    symbol: cross
    emblem: ΡΩΜ
    portrait: byzantine
    description: >-
      The Roman Empire of the East, with its capital the greatest city in Christendom, at war with the Bulgarians.
  - id: bulgaria
    name: Bulgaria
    adjective: Bulgarian
    lineage: bulgaria
    colour: "#2f6b3a"
    symbol: horse
    emblem: БЪЛ
    portrait: medieval_king
    description: >-
      A Balkan empire fighting for its life against Basil II from its mountain capital at Ohrid.
  - id: cordoba
    name: Caliphate of Córdoba
    adjective: Andalusi
    lineage: cordoba
    colour: "#0f7b5b"
    symbol: moon
    emblem: COR
    portrait: turban
    description: >-
      Al-Andalus at its height: Córdoba, a city of half a million with libraries, paved streets and street lamps, ruled by the chamberlain al-Mansur in the caliph's name.
  - id: leon
    name: León
    adjective: Leonese
    lineage: leon
    colour: "#8b1a1a"
    symbol: lion
    emblem: LEÓ
    portrait: medieval_king
    description: >-
      The Christian kingdom of the north-west, battered by al-Mansur's raids.
  - id: navarre
    name: Navarre
    adjective: Navarrese
    lineage: navarre
    colour: "#b22222"
    symbol: star
    emblem: NAV
    portrait: medieval_king
    description: >-
      A small Basque kingdom in the Pyrenees, whose next king will make it the strongest in Christian Spain.
  - id: barcelona
    name: Barcelona
    adjective: Catalan
    lineage: barcelona
    colour: "#e6a817"
    symbol: star
    emblem: BAR
    portrait: medieval_king
    description: >-
      The County of Barcelona, a march of Christendom on the Mediterranean coast.
  - id: fatimids
    name: Fatimid Caliphate
    adjective: Fatimid
    lineage: fatimids
    colour: "#2f8f4e"
    symbol: star
    emblem: FAT
    portrait: turban
    description: >-
      A Shia caliphate ruling Egypt and Syria from its new city of Cairo, with its great mosque-university of al-Azhar.
  - id: zirids
    name: Zirids
    adjective: Zirid
    lineage: zirids
    colour: "#8a9a5b"
    symbol: star
    emblem: ZIR
    portrait: turban
    description: >-
      Berber princes ruling Ifriqiya from Kairouan in the name of the Fatimids.
  - id: sicily_emirate
    name: Emirate of Sicily
    adjective: Sicilian
    lineage: sicily_emirate
    colour: "#1f7a8c"
    symbol: moon
    emblem: SIC
    portrait: turban
    description: >-
      A Muslim emirate in Palermo, famous for its gardens, irrigation and new crops.
  - id: buyids
    name: Buyid Emirate
    adjective: Buyid
    lineage: buyids
    colour: "#556b2f"
    symbol: moon
    emblem: BUY
    portrait: turban
    description: >-
      Persian emirs ruling Baghdad and western Iran, keeping the Abbasid caliph as a figurehead.
  - id: armenia
    name: Armenia
    adjective: Armenian
    lineage: armenia
    colour: "#d2691e"
    symbol: eagle
    emblem: ARM
    portrait: medieval_king
    description: >-
      The Bagratid kingdom, with its capital Ani, the city of a thousand and one churches.
  - id: georgia
    name: Georgia
    adjective: Georgian
    lineage: georgia
    colour: "#8b0000"
    symbol: cross
    emblem: GEO
    portrait: medieval_king
    description: >-
      A Caucasian kingdom on the brink of unification under the Bagratid kings.
  - id: ghaznavids
    name: Ghaznavids
    adjective: Ghaznavid
    lineage: ghaznavids
    colour: "#4b0082"
    symbol: elephant
    emblem: GHZ
    portrait: turban
    description: >-
      A Turkish dynasty of slave-soldiers turned sultans, taking Khorasan from the collapsing Samanids.
  - id: makuria
    name: Makuria
    adjective: Makurian
    lineage: makuria
    colour: "#8b5a2b"
    symbol: cross
    emblem: MAK
    portrait: kushite
    description: >-
      A Christian Nubian kingdom on the Nile, strong enough to keep Egypt at bay for centuries.
