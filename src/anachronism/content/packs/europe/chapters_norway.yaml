schema_version: 1
# Chronicle mode (D-120, D-XXX): Norway from Svolder to Stamford Bridge, 1000-1066. Each
# chapter opens in its year; one choice is what history chose (historical: true). Facts
# follow Adam of Bremen, Thietmar of Merseburg, the Anglo-Saxon Chronicle, the skaldic verse
# (Hallfred, Sigvat Thordarson, Arnorr Thordarson) and, with care, the later sagas (Snorri's
# Heimskringla, Agrip, Fagrskinna, Morkinskinna), which are our only full narratives and
# which tell many scenes in a later and more heroic voice. Modern work by Sawyer, Bagge,
# Lawson, Andersson and Bolton. The ruler line is the real one of the player's state: Olaf
# Tryggvason (to Svolder), the Hakonarson jarls under Danish overlordship (Eric left for
# England about 1014-1015; Sweyn lost at Nesjar in 1016), Olaf Haraldsson (to Stiklestad,
# 1030), Svein Knutsson (Cnut's son, with his mother Aelfgifu; Hakon Eiriksson's brief
# jarldom of 1028-29 is left out; Svein's reign is dated a year early, 1034), Magnus the Good
# (to 1047, with Harald Hardrada as co-king from 1046), Harald Hardrada (to Stamford Bridge,
# 1066). Dates in the sagas are approximate to a year or two. The denmark chronicle (chapters
# 1000, 1016, 1028, 1034) tells the same events from Denmark; deeds here match it: Viken
# passes to the Danes after Svolder, returns to Olaf Haraldsson at Nesjar (taken back), and
# passes to Cnut in 1028. benchmark_provinces counts the provinces of this map held by
# the real kings of Norway at that date (Trondelag always; Viken in 1016-1028 and after 1035).
chapters:
  - id: nor_svolder
    scenario: year_1000
    civ: norway
    year: 1000
    title: "The Long Serpent"
    place: "Off the island of Svolder"
    speaker: general
    speaker_name: "Einar Thambarskelfir"
    speaker_title: "Your best archer, aboard the Long Serpent"
    needs_alive: [denmark]
    benchmark_provinces: 1
    story: >-
      You are Olaf Tryggvason, King of Norway. Five years ago you came home from Ireland and
      England, took the crown from the old Jarl Hakon's family, and started making the
      country Christian, with a hard hand. Your enemies are many: Hakon's sons Eric and
      Sweyn, who fled abroad; Sweyn Forkbeard of Denmark, whose sister Thyri you married
      without his leave; and Olof Skotkonung of Sweden, who is Sweyn's stepson.


      You have been to the Wendish coast to claim Thyri's old estates, and you are sailing
      home with a dozen ships and your great Long Serpent, the biggest warship in the north.
      Your scouts say that a large fleet is waiting behind an island ahead. Your men say
      there are only a few, and are eager to fight.
    choices:
      - label: "Sail on, and fight them"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1000
        outcome: >-
          The Danes, Swedes and Norwegian exiles tie their ships together and wear you down. The
          sagas say your archer Einar Thambarskelfir shot until his bowstring snapped, and that
          when the king asked what had broken, Einar answered, "Norway, from your hand, King."
          When the Long Serpent is cleared, you leap overboard in your mail, and are not seen
          again. Some of your followers will say for years that you swam to safety. Norway is
          divided: the Danes and Swedes take the south, and Eric and Sweyn Hakonarson hold the
          north as jarls under Sweyn Forkbeard.
        deeds: {ruler_falls: "is lost at Svolder", give: [m_viken], give_to: denmark}
      - label: "Turn back, and take the long way home"
        legitimacy_bp: -500
        outcome: >-
          Your men grumble, and the Danes hear that you have run. You reach Norway safely,
          but the same enemies will be waiting next year.
    history: >-
      In September 1000 Olaf Tryggvason was defeated at Svolder by Sweyn Forkbeard, Olof of
      Sweden and Eric Hakonarson; he was lost in the sea, and Norway was divided.
    diverged: >-
      Denmark is gone.
    sources: ["Adam of Bremen 2.40", "Thietmar of Merseburg 4.40", "Hallfredr, Erfidrapa Olafs", "Snorri, Heimskringla, Olaf Tryggvason's saga 107-112"]

  - id: nor_nesjar
    scenario: year_1000
    civ: norway
    year: 1016
    title: "Palm Sunday at Nesjar"
    place: "Off the Skagerrak coast, Viken"
    speaker: general
    speaker_name: "Olaf Haraldsson"
    speaker_title: "A young sea-king, baptised in Normandy"
    benchmark_provinces: 2
    story: >-
      You are Sweyn Hakonarson, jarl, who rules Norway under the Danish kings. Your brother Eric has gone to England with Cnut. Last year, Olaf Haraldsson,
      a great-grandson of Harald Finehair, who has fought in England and been
      baptised in Rouen, landed in Norway with a few ships and a couple of hundred men, and
      took your young nephew Hakon prisoner.


      Now Olaf has come to the south coast with a growing fleet. It is Palm Sunday. The
      farmers and chiefs of the south are going over to the young man, and the sagas say
      that you lashed your ships together in a narrow sound to wait for him.
    choices:
      - label: "Fight Olaf at Nesjar"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          Olaf's men board your ships, and your fleet breaks. Your brother's army is far away.
          You flee to Sweden, and you die there soon after. Olaf is made king over all of
          Norway, and sets about making it Christian for good.
        deeds: {peace_with: [denmark, sweden, hre, scotland], take: [m_viken]}
      - label: "Make terms with Olaf and keep your lands"
        legitimacy_bp: -1000
        outcome: >-
          Olaf says he will take no oath from a Hakonarson, and no jarl will be left in
          Norway who can raise the farmers against him.
    history: >-
      On Palm Sunday 1016 Olaf Haraldsson defeated Jarl Sweyn Hakonarson at Nesjar;
      Sweyn fled to Sweden and Olaf became king of all Norway.
    sources: ["Sigvatr Thordarson, Nesjavisur", "Snorri, Heimskringla, Olaf the Saint's saga 48-54", "Sawyer, Kings and Vikings (1982)"]

  - id: nor_moster
    scenario: year_1000
    civ: norway
    year: 1024
    title: "The Law on Moster Island"
    place: "Moster, in Hordaland"
    speaker: scholar
    speaker_name: "Bishop Grimkell"
    speaker_title: "Your English bishop"
    benchmark_provinces: 2
    story: >-
      You are Olaf Haraldsson, King of Norway. For eight years you have been travelling
      from one district to the next with your ships and your men, and everywhere you have
      said the same thing: that there is only one God and the farmers must stop sacrificing
      to Thor and Frey. You have brought English bishops and priests, among them Grimkell, to
      teach your people.


      Now a Thing meets at Moster island in Hordaland. If you declare a Christian law for the
      whole country, with Grimkell's churches, fasts and holy days, the chiefs will have
      little choice. Many of them hate you already: you have forced gifts of food from them,
      seized their silver, and mutilated or blinded the petty kings who would not bow.
    choices:
      - label: "Proclaim the Christian law, and enforce it"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 2000
        influence: {clergy: 2000}
        deeds: {peace_with: [denmark, sweden, hre, scotland], take: [m_viken]}
        outcome: >-
          The law is proclaimed at Moster. The sagas say that those who will not be baptised
          lose their farms, or lose their eyes, and the farmers who are brought to the font
          remember it. The churches are built and the Christian law lasts. But in
          Trondelag, the old chiefs begin to count the silver that the Danes are offering
          them.
      - label: "Win the chiefs with gifts and patience"
        legitimacy_bp: 500
        unrest_bp: -500
        wealth_bp: -2000
        outcome: >-
          The chiefs accept your gifts and your priests. It takes a generation, but fewer
          of them are your enemies when the Danes come.
    history: >-
      About 1024 Olaf Haraldsson, with Bishop Grimkell, proclaimed a Christian law at the
      Moster Thing; his forced conversions made him many enemies among the chiefs.
    sources: ["Snorri, Heimskringla, Olaf the Saint's saga 75-80, 98", "Agrip 25", "Bagge, From Viking Stronghold to Christian Kingdom (2010)"]

  - id: nor_flight
    scenario: year_1000
    civ: norway
    year: 1028
    title: "English Silver"
    place: "Trondheimsfjord"
    speaker: general
    speaker_name: "Sigvatr Thordarson"
    speaker_title: "Your skald"
    needs_alive: [denmark]
    benchmark_provinces: 1
    story: >-
      You are Olaf the Stout, King of Norway. For two years King Cnut of England and Denmark
      has sent men with English silver to your chiefs, who take the money and say little.
      Your skald Sigvatr has been travelling, and brings you news of how many have taken it.


      Now Cnut has sailed to Norway with fifty ships. He is at Trondheimsfjord, and the
      chiefs are gathering at the Thing to take him as their king. You still have a few
      loyal ships and men, your queen, and your young son Magnus.
    choices:
      - label: "Leave Norway, and go east by way of Sweden to Kiev"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1000
        outcome: >-
          You flee across the mountains to Sweden, and in the winter you reach Kiev, where
          Prince Yaroslav gives you a home. Your son Magnus is raised in his court. Cnut is
          proclaimed king at Nidaros, and leaves his nephew Hakon Eiriksson as jarl. In
          the south of Norway the Danes are now the masters.
        deeds: {give: [m_viken], give_to: denmark}
      - label: "Stay and fight in the mountains"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Your few ships are caught in the fjord. The chiefs who hated you are glad.
    history: >-
      In 1028 Cnut sailed to Norway and was accepted as king; Olaf Haraldsson fled to Sweden
      and then to Kievan Rus.
    diverged: >-
      Denmark is gone.
    sources: ["Anglo-Saxon Chronicle 1028", "Sigvatr Thordarson, Vestrfararvisur", "Snorri, Heimskringla, Olaf the Saint's saga 151-160"]

  - id: nor_stiklestad
    scenario: year_1000
    civ: norway
    year: 1030
    title: "Stiklestad"
    place: "Stiklestad, in the Verdal valley"
    speaker: general
    speaker_name: "Harald Sigurdsson"
    speaker_title: "Your half-brother, fifteen years old"
    benchmark_provinces: 1
    story: >-
      You are Olaf Haraldsson. You have spent a winter in Kiev, at a court that shows
      you better than any church in Norway how a Christian king lives. Your Norwegian
      friends write: Hakon, the jarl, has drowned at sea; Cnut's young son Svein governs
      with his mother Aelfgifu, and has the Norwegians groaning under new taxes.


      You have come back through Sweden with about 3,000 men, among them your half-brother
      Harald, who is fifteen, and a company of Swedes. In Verdal the farmers of Trondelag
      and the chiefs, Kalf Arnesson and Thorir Hund among them, have come out against you,
      with many more men than you have. The sagas say they had four times as many.
    choices:
      - label: "Fight them at Stiklestad"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Late in the summer your army is beaten in a fierce battle, and you are killed with
          a spear and an axe. The sagas say that the sun darkened during the fight, and
          there was an eclipse that week. Your half-brother Harald is wounded, and escapes
          into the forest. Within a year, the same farmers who killed you are talking of
          miracles at your grave. In 1031 Bishop Grimkell has you declared a saint, at Nidaros,
          and Norway becomes Christian in earnest. As St Olaf you will be the king of Norway
          for ever.
      - label: "Stay in Sweden, and wait for a better season"
        legitimacy_bp: -1000
        outcome: >-
          The chiefs hear that you have turned back. Svein and Aelfgifu keep Norway for another
          winter.
    history: >-
      Olaf Haraldsson fell at Stiklestad on 29 August 1030 (the date is traditional) against
      the farmers' army; he was declared a saint in 1031 and became Norway's patron.
    sources: ["Sigvatr Thordarson, Erfidrapa Olafs helga", "Arnorr Thordarson, Hrynhenda", "Snorri, Heimskringla, Olaf the Saint's saga 205-245", "Bagge, From Viking Stronghold to Christian Kingdom (2010)"]

  - id: nor_magnus
    scenario: year_1000
    civ: norway
    year: 1036
    title: "Magnus and the Poet"
    place: "Nidaros"
    speaker: scholar
    speaker_name: "Sigvatr Thordarson"
    speaker_title: "Skald to your father"
    benchmark_provinces: 2
    story: >-
      You are Magnus, Olaf's son, eleven or twelve years old. A year ago, the chiefs of
      Norway sent to Kiev for you, and Svein and Aelfgifu fled to Denmark. Cnut is dead, and
      the Danes have a king of their own again. Everyone in Norway now agrees that
      Olaf was a saint.


      Some of your guardians are chiefs who fought against him at Stiklestad, and your
      father's old friends whisper that you should avenge him: drive out those who fought
      there, and burn their farms. Sigvatr, who was your father's poet, offers you a poem: that a king who burns
      the farms of his subjects will not keep them.
    choices:
      - label: "Heed the poet, and forgive"
        historical: true
        legitimacy_bp: 3000
        unrest_bp: -2000
        outcome: >-
          Snorri tells us that you took the poet's advice, and ruled by the law. The Norwegians call you Magnus
          the Good. In 1038 you make a treaty with the Danish king Harthacnut that whoever
          lives longer shall inherit the other's lands, and in 1042, when Harthacnut dies, you
          become King of Denmark.
        deeds: {peace_with: [denmark, sweden, hre, scotland], take: [m_viken]}
      - label: "Take vengeance on the farmers"
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          Farms are burned in Trondelag, and the chiefs who fought against your father find
          that they have more to fear from you than from the Danes.
    history: >-
      Magnus Olafsson became king of Norway in 1035 and, following the advice of Sigvatr,
      ruled mildly; in 1042 he became king of Denmark by the pact of 1038.
    sources: ["Sigvatr Thordarson, Bersoglisvisur", "Snorri, Heimskringla, Magnus the Good's saga 16-19", "Morkinskinna"]

  - id: nor_harald
    scenario: year_1000
    civ: norway
    year: 1046
    title: "The Gold of Constantinople"
    place: "Denmark"
    speaker: general
    speaker_name: "Harald Sigurdsson"
    speaker_title: "Soon to be called Hardrada"
    benchmark_provinces: 2
    story: >-
      You are Magnus, King of Norway and Denmark. For four years you have beaten the Wends at
      Lyrskov Heath and held the Danes down, though Sweyn Estridsson, whom you made your jarl
      there, has had himself proclaimed king and rebelled against you.


      Now your uncle Harald, your father's half-brother, has come home. He has served
      the Emperor in Constantinople at the head of the Varangian Guard, and has come away,
      so they say, with more gold than any Northman before him. He has married the daughter
      of Prince Yaroslav of Kiev. And he has made friends with Sweyn. He asks to share your
      kingdom, with half of his treasure.
    choices:
      - label: "Share the kingdom with Harald, for half his gold"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 3000
        deeds: {peace_with: [denmark, sweden], take: [m_viken]}
        outcome: >-
          You make him your co-king, and the treasure is divided between you. The two of you do
          not get on, but the quarrel is patched up. A year later, in the autumn of 1047, you die in Denmark,
          still a young man. Harald is left as sole king, and he will be a very different
          sort of king from you.
      - label: "Refuse, and fight him with the army you have"
        unrest_bp: 2000
        legitimacy_bp: -1000
        outcome: >-
          Harald has Sweyn's help and the Danish fleet. You win him over in the end, but you
          have lost a year, and the wars are not over.
    history: >-
      Harald Sigurdsson returned from Byzantium and Kiev and in 1046 was made co-king of
      Norway by Magnus, who died in 1047.
    sources: ["Snorri, Heimskringla, Harald Hardrada's saga 22-32", "Adam of Bremen 3.12-17", "Morkinskinna", "Bolton, Cnut the Great (2017)"]

  - id: nor_peace
    scenario: year_1000
    civ: norway
    year: 1064
    title: "Fifteen Summers"
    place: "On the Danish border"
    speaker: denmark
    speaker_name: "Sweyn Estridsson"
    speaker_title: "King of the Danes"
    needs_alive: [denmark]
    benchmark_provinces: 2
    story: >-
      You are Harald, King of Norway, and you are called Hardrada, the hard ruler. You have
      done much in these seventeen years: made peace with the chiefs by shows of strength
      and by killing a few, put a stop to the revolts, minted silver of your own, and
      founded, the story goes, the town of Oslo.


      For fifteen summers you have gone to war against Sweyn of Denmark to win his crown,
      which Magnus held. You have burned Hedeby and half the Danish coast. You beat his fleet
      at the Nis river in 1062. But he is still king, and the farmers on both sides are
      weary of the war.
    choices:
      - label: "Make peace, and let each keep his own kingdom"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          You and Sweyn make a treaty of friendship, and shake hands on the border. You have
          wasted many ships and men on Denmark, and never won it. Your eyes now turn to
          another throne across the sea: the English, where your claim as Magnus's heir is
          as good as anyone's.
        deeds: {peace_with: [denmark, hre], take: [m_viken]}
      - label: "Fight on for the Danish crown"
        legitimacy_bp: -1000
        materials_bp: -2000
        outcome: >-
          Another summer, another burnt harbour, and Sweyn is still on his throne.
    history: >-
      After about fifteen years of war Harald Hardrada and Sweyn Estridsson made peace in about
      1064-1065, each keeping his own kingdom.
    diverged: >-
      Denmark is gone.
    sources: ["Snorri, Heimskringla, Harald Hardrada's saga 62-79", "Adam of Bremen 3.16-17", "Sawyer, Kings and Vikings (1982)"]

  - id: nor_stamford
    scenario: year_1000
    civ: norway
    year: 1066
    title: "The Last Viking"
    place: "Nidaros, in the summer"
    speaker: general
    speaker_name: "Earl Tostig Godwinson"
    speaker_title: "An English exile, brother of King Harold"
    needs_alive: [england]
    benchmark_provinces: 2
    story: >-
      You are Harald Hardrada, fifty years old, and very tall. Earl Tostig,
      the brother of the new King of England, has come to you. Last year the northerners
      of England drove him out, and his brother, King Harold Godwinson, did not save him. He
      says that England is yours, as Magnus's heir, if you are bold, and that the northern
      earls will follow you.


      Duke William of Normandy is building ships to take the same crown, and King Harold
      cannot hold both coasts at once. If you sail now, with all the ships you can raise,
      you could be master of England by the autumn.
    choices:
      - label: "Sail for England with three hundred ships"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          In September you sail up the Humber, beat the northern earls at Fulford, and take
          York. Then on 25 September, at Stamford Bridge, you stand on one side of the river
          Derwent, many of your men without their mail in the heat, when King Harold comes
          from the south in four days with his army. You are killed, the sagas say by an arrow in the
          throat, and Tostig falls with you. Twenty-four ships of the three hundred will be enough
          to carry the survivors home. Three weeks later, at Hastings, King Harold meets
          Duke William.
        deeds: {grudges: {england: 1500}}
      - label: "Stay at home, and keep the peace"
        legitimacy_bp: 500
        outcome: >-
          Tostig sails away, offended, to find another king. Norway is at peace, and England's
          crown goes to another.
    history: >-
      Harald Hardrada invaded England with Tostig in September 1066, won at Fulford (20
      September) and was killed at Stamford Bridge (25 September).
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1066 (C, D)", "Snorri, Heimskringla, Harald Hardrada's saga 80-96", "Morkinskinna", "Lawson, The Battle of Stamford Bridge (2002)"]
