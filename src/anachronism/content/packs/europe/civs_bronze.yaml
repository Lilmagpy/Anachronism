schema_version: 1
# The Late Bronze Age Near East (1275 BC).
civs:
  - id: egypt
    name: Egypt
    adjective: Egyptian
    lineage: egypt
    colour: "#d4a017"
    symbol: eye
    emblem: KMT
    portrait: pharaoh
    description: >-
      The oldest great kingdom on earth, at the height of its power: temples, gold from Nubia, chariots and an army of scribes.
  - id: hatti
    name: Hatti
    adjective: Hittite
    lineage: hatti
    colour: "#8b3a3a"
    symbol: eagle
    emblem: HT
    portrait: hittite
    description: >-
      The Hittite empire of Anatolia, rival of Egypt, master of a thousand gods and the secret of working iron.
  - id: assyria
    name: Assyria
    adjective: Assyrian
    lineage: assyria
    colour: "#3c6e9e"
    symbol: winged
    emblem: ASR
    portrait: assyrian
    description: >-
      A rising power on the Tigris, fresh from humbling the last of Mitanni.
  - id: hanigalbat
    name: Hanigalbat
    adjective: Hurrian
    lineage: hanigalbat
    colour: "#7a5c99"
    symbol: horse
    emblem: HNG
    portrait: assyrian
    description: >-
      The last remnant of the Mitanni kingdom of chariot lords, now a vassal of Assyria and eager to break free.
  - id: babylon
    name: Babylon
    adjective: Babylonian
    lineage: babylon
    colour: "#2e8b57"
    symbol: lion
    emblem: BAB
    portrait: assyrian
    description: >-
      The ancient heart of Mesopotamian learning, ruled by the Kassite kings, friends of Hatti.
  - id: elam
    name: Elam
    adjective: Elamite
    lineage: elam
    colour: "#b0703c"
    symbol: snake
    emblem: ELM
    portrait: assyrian
    description: >-
      A kingdom of the Iranian highlands and the Susa plain, building great ziggurats.
  - id: mycenae
    name: Mycenae
    adjective: Achaean
    lineage: mycenae
    colour: "#c05a2a"
    symbol: lion
    emblem: ΑΧ
    portrait: greek
    description: >-
      The Achaean Greeks of the palace age: sea raiders, traders and builders of walls so large later Greeks thought giants made them.
  - id: wilusa
    name: Wilusa
    adjective: Trojan
    lineage: wilusa
    colour: "#4f7942"
    symbol: horse
    emblem: WIL
    portrait: hittite
    description: >-
      A wealthy city on the straits, bound by treaty to the Hittites - the city later Greeks called Troy.
  - id: alashiya
    name: Alashiya
    adjective: Cypriot
    lineage: alashiya
    colour: "#1f7a8c"
    symbol: star
    emblem: ALA
    portrait: punic
    description: >-
      The copper island, trading with every great king of the age.
  - id: amurru
    name: Amurru
    adjective: Amorite
    lineage: amurru
    colour: "#8c6d3a"
    symbol: ram
    emblem: AMR
    portrait: punic
    description: >-
      A small kingdom on the Syrian coast, changing sides between Egypt and Hatti as the wind blows.
  - id: ugarit
    name: Ugarit
    adjective: Ugaritic
    lineage: ugarit
    colour: "#6b8e23"
    symbol: anchor
    emblem: UGR
    portrait: punic
    description: >-
      A great port of merchants and scribes, who have invented a new way of writing with only thirty signs.
