schema_version: 1
# Chronicle mode (D-120, D-XXX): the kings of Amurru, from Benteshina's change of sides to the
# collapse, c. 1275-1177 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow Hattusili III's treaty with Benteshina (CTH 92),
# Tudhaliya IV's treaty with Sausgamuwa (CTH 105), the Egyptian monuments of Ramesses II and
# Ramesses III, and the Amarna letters of Aziru, with modern work by Beckman, Bryce, Singer
# and Cline. Reign dates are approximate: Benteshina's death and Sausgamuwa's reign are not
# firmly dated, and the name of Amurru's last king is not known. Shapili, the man set up in
# Benteshina's place, is known from the prologue of Hattusili's treaty; his family place is
# unknown. Amurru is one province throughout.
chapters:
  - id: amu_defects
    scenario: kadesh
    civ: amurru
    year: -1275
    title: "The Grandson of Aziru"
    place: "Amurru"
    speaker: egypt
    speaker_name: "Ramesses II"
    speaker_title: "Pharaoh of Egypt"
    needs_alive: [egypt, hatti]
    benchmark_provinces: 1
    story: >-
      You are Benteshina, king of Amurru, the hill country behind the Syrian coast. Your
      family has lived between the great powers for four generations. Your ancestor Aziru
      wrote to the Pharaoh of his day as a loyal servant while he made his peace with the
      Hittites, and kept his kingdom by it.


      Now you are a Hittite vassal, and young Pharaoh Ramesses is marching up the coast with
      an army, carving his name on the rocks. He offers you his protection if you open your
      ports to him. Muwatalli of Hatti is gathering his own army, and he does not forgive.
    choices:
      - label: "Go over to Egypt"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 500
        outcome: >-
          You receive Ramesses, and Amurru is named among his conquests on the monuments. Your
          young men march with the Egyptians. Muwatalli notes it down.
        deeds: {grudges: {hatti: 1500}}
      - label: "Stay loyal to Hatti"
        legitimacy_bp: -500
        outcome: >-
          Ramesses finds the gates shut and marches past. Muwatalli thanks you, and sends no
          reward.
        deeds: {peace_with: [hatti], grudges: {egypt: 2000}}
      - label: "Trade with both and take no side"
        wealth_bp: 1000
        legitimacy_bp: 1000
        unrest_bp: 300
        outcome: >-
          Your ports sell grain and timber to the Egyptian army and to the Hittite one. Both
          pay, and neither trusts you, and each notes that you have not yet chosen.
    history: >-
      Benteshina of Amurru went over from Hatti to Egypt shortly before the battle of Kadesh
      (1274 BC); Ramesses II's army passed through Amurru, and Amurrite troops are shown
      arriving at the battle on his reliefs.
    diverged: >-
      Egypt or Hatti is gone.
    sources: ["Treaty of Hattusili III with Benteshina (CTH 92)", "Kadesh reliefs of Ramesses II", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: amu_deposed
    scenario: kadesh
    civ: amurru
    year: -1272
    title: "The Guest in Hattusili's House"
    place: "Amurru"
    speaker: hatti
    speaker_name: "Muwatalli II"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      Egypt has gone home. The Hittite army has not. It stands in your kingdom, and the Great
      King Muwatalli sends for you.


      Your life is in his hands. His brother Hattusili, who governs the northern Hittite lands
      and has been a friend to you, pleads for it. Muwatalli may spare you, but he will not
      leave you a king.
    choices:
      - label: "Go to Hattusa as Hattusili's guest"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Muwatalli takes your kingdom and gives it to another man, Shapili. You live in
          Hattusili's house in the north, among his servants, and wait. Your host will not
          forget that he gave you shelter.
        deeds: {peace_with: [hatti], ruler_falls: "is deposed by Muwatalli and taken to Hatti"}
      - label: "Flee to Egypt with your family"
        legitimacy_bp: -2000
        outcome: >-
          Ramesses finds you a house. The Hittites put their own man on your throne, and
          Amurru is a province of Hatti in all but name.
        deeds: {peace_with: [hatti], ruler_falls: "flees to Egypt"}
      - label: "Hold the hill forts against him"
        unrest_bp: 1500
        outcome: >-
          Your fortresses hold for a season. Then Egypt does not come, and the Great King
          does.
        deeds: {men: 1500, grudges: {hatti: 3000}}
    history: >-
      After Kadesh, Muwatalli II deposed Benteshina and put Shapili on the throne of Amurru.
      Hattusili, Muwatalli's brother, took Benteshina into his own household.
    diverged: >-
      Hatti is gone.
    sources: ["Treaty of Hattusili III with Benteshina (CTH 92), prologue", "Singer on Amurru, in Bryce's Kingdom of the Hittites"]

  - id: amu_restored
    scenario: kadesh
    civ: amurru
    year: -1266
    title: "The King Comes Home"
    place: "Amurru"
    speaker: hatti
    speaker_name: "Hattusili III"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      You are Benteshina again. The man who kept you in his house is now the Great King:
      Hattusili has pushed his nephew Urhi-Teshub off the throne of Hatti. He has sent you home
      to Amurru, and Shapili is gone.


      The scribes have the treaty ready. It recites your family's history from Aziru to
      yourself, your fall and your return, and says that Amurru will be yours, and your sons'
      after you, as long as you keep faith with Hatti. It leaves nothing on the page about
      what you owe if Egypt writes again.
    choices:
      - label: "Swear the treaty"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 1000}
        outcome: >-
          You swear before the thousand gods of Hatti and the gods of Amurru. The tablet is
          sealed and a copy is laid before a god. Your son's right to follow you is written
          into it. You are Hittite for the rest of your life, and your family will remain so
          for longer than the empire.
        deeds: {peace_with: [hatti]}
      - label: "Swear, but write privately to Ramesses"
        legitimacy_bp: 2000
        wealth_bp: 1500
        unrest_bp: 500
        outcome: >-
          You swear, and Ramesses, who is still at war with Hatti, is glad to hear from you
          and sends gifts. Hattusili, who has spies everywhere, will hear of it too, in
          time.
        deeds: {peace_with: [hatti], grudges: {hatti: 2000}}
      - label: "Swear, and ask for a Hittite garrison"
        legitimacy_bp: 2000
        unrest_bp: 300
        outcome: >-
          Hattusili agrees at once: a Hittite company will hold your border fortresses, and
          your own people will feed it. It makes Amurru safe against Egypt, and it makes the
          Great King's wishes very plain in your own hill country.
        deeds: {men: 3000, martial_bp: 1500}
    history: >-
      Hattusili III, after taking the throne (c. 1267 BC), restored Benteshina to Amurru and
      bound him by treaty. The prologue recounts the family's history from Aziru onwards.
    diverged: >-
      Hatti is gone.
    sources: ["CTH 92, translated in Beckman, Hittite Diplomatic Texts (1999)", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: amu_embargo
    scenario: kadesh
    civ: amurru
    year: -1230
    title: "A Clause About Assyria"
    place: "Amurru"
    speaker: hatti
    speaker_name: "Tudhaliya IV"
    speaker_title: "Great King of Hatti, your brother-in-law"
    needs_alive: [hatti, assyria]
    benchmark_provinces: 1
    story: >-
      You are Sausgamuwa, son of Benteshina, king of Amurru. You have married the sister of the
      Great King Tudhaliya, and your house is tied to his by blood as well as by oath.


      Tudhaliya has been beaten by the Assyrians at Nihriya, and cannot beat them again. So
      his scribes have written a new treaty for you with a clause that no earlier Hittite
      treaty had. Assyria's merchants are to be kept out of Amurru, your own merchants are
      not to go to Assyria, and no ship of Ahhiyawa is to carry goods there either. Amurru
      lives on the sea trade, and Assyria buys what it carries.
    choices:
      - label: "Accept the embargo"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -1000
        outcome: >-
          The clause is written: as the king of Assyria is the enemy of Hatti, so he must be
          your enemy. It is the oldest trade embargo that history knows, and it is aimed at
          the rising power of the age. Your merchants lose a market and your house keeps the
          Great King's favour.
        deeds: {grudges: {assyria: 1500}}
      - label: "Plead for a coastal exemption"
        wealth_bp: 500
        legitimacy_bp: -1000
        outcome: >-
          Tudhaliya replies that a vassal does not bargain with his lord. He sends the treaty
          again, unchanged, and adds a line about your loyalty.
      - label: "Accept, but ask for silver in return"
        legitimacy_bp: 700
        wealth_bp: -300
        outcome: >-
          Tudhaliya, who needs the coast, agrees to a payment in silver for your lost
          markets. It is smaller than the markets were worth, and it comes with the
          reminder that the treaty is not a bargain between equals.
    history: >-
      Tudhaliya IV's treaty with Sausgamuwa of Amurru (c. 1230 BC) forbids trade with Assyria
      and forbids ships of Ahhiyawa to carry goods there; the name Ahhiyawa was later erased
      from the list of the Great Kings in the text.
    diverged: >-
      Hatti or Assyria is gone.
    sources: ["Treaty of Tudhaliya IV with Sausgamuwa (CTH 105)", "Beckman, Hittite Diplomatic Texts (1999)"]

  - id: amu_camp
    scenario: kadesh
    civ: amurru
    year: -1179
    title: "A Camp in Amurru"
    place: "The coast of Amurru"
    speaker: scholar
    speaker_name: "A scribe of Ugarit"
    speaker_title: "A refugee on the coast road"
    benchmark_provinces: 1
    story: >-
      You are the king of Amurru. The tablets do not say what your name was. To the north,
      Ugarit is ash, and its king's last letters are still lying in the kiln. Hatti has no
      Great King to ask for help.


      Raiders and migrants are moving down the coast from the north, by land and by sea,
      with their families on ox-carts. Egypt, which you once served, has an army on its
      northern frontier. You can see the smoke from your walls.
    choices:
      - label: "Hold the towns behind their walls"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          They come. Amurru is not heard of again as a kingdom. A few years later Pharaoh
          Ramesses III will tell the story on the walls of his temple at Medinet Habu: the
          invaders set up a camp in Amurru, and the land was laid waste. The coast falls to
          the Canaanites and the Arameans, and later to the Phoenician cities.
        deeds: {ruler_falls: "is lost with his kingdom"}
      - label: "Send your family to Egypt"
        legitimacy_bp: -1500
        wealth_bp: -1000
        outcome: >-
          Ramesses receives your family at Pi-Ramesses, and the treasure goes with it. The
          coast is left to the raiders.
        deeds: {ruler_falls: "leaves his kingdom"}
      - label: "Pay the raiders to pass by"
        wealth_bp: -1500
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Grain, oil and silver go out to the camps on ox-carts. The columns take them and
          move on down the coast, and there is much less left in your storehouses than before.
    history: >-
      Ramesses III's record of his year 8 (c. 1177 BC) lists Amurru among the lands the Sea
      Peoples ravaged and says they set up a camp there; Amurru does not appear again as a
      kingdom. The date and the details of its fall are not known.
    sources: ["Medinet Habu inscription of Ramesses III", "Cline, 1177 BC (2014)", "Singer, on the end of Amurru"]
