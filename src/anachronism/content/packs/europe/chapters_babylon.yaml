schema_version: 1
# Chronicle mode (D-120, D-163): Kassite Babylon, from Kadesh to the fall of the dynasty,
# 1266-1155 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Hattusili III's letter to Kadashman-Enlil II (KBo 1.10),
# the Tukulti-Ninurta Epic, Chronicle P and the Assyrian Synchronistic History, Kassite
# boundary stones (kudurrus), Nabonidus's building inscriptions, Shutruk-Nakhunte's
# inscriptions on the monuments he took to Susa, and modern work by Brinkman, Bryce,
# Podany, Paulus and George. Dates follow Brinkman's chronology. benchmark_provinces counts
# the provinces of this map the real kingdom held at that date.
chapters:
  - id: bab_brother
    scenario: kadesh
    civ: babylon
    year: -1266
    title: "A Brother in Hattusa"
    place: "Babylon"
    speaker: hatti
    speaker_name: "Hattusili III"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 2
    story: >-
      You are Kadashman-Turgu, King of Karduniash: Babylonia, as foreigners call it. Your
      family came down from the Zagros mountains as Kassite horse-breeders three hundred years
      ago, and have ruled Babylon ever since, in Babylonian style. Babylon's scholars, its
      astronomers and its god Marduk are the most respected in the world.


      In Hattusa, Hattusili has taken the throne from his nephew. The Egyptians call him a
      usurper, and his nephew has fled to Egypt. Hattusili has written to you as 'my brother',
      as one great king to another, to ask you to recognise him, and to stand by him if
      Pharaoh Ramesses makes war.
    choices:
      - label: "Recognise him and promise troops"
        historical: true
        legitimacy_bp: 1000
        influence: {nobility: 500}
        outcome: >-
          You write that if Egypt attacks Hatti, you will march with him, and you break off
          relations with Pharaoh's messengers. Hattusili will remember: years later he writes
          to your son, "Your father was my friend."
        deeds: {grudges: {egypt: 1000}}
      - label: "Send equal gifts to both courts"
        wealth_bp: 1000
        legitimacy_bp: -300
        outcome: >-
          Your envoys go to Thebes and to Hattusa with equal gifts, and come home with equal gold.
          Neither great king thinks you much of a friend.
      - label: "Offer to mediate between Hatti and Egypt"
        legitimacy_bp: 500
        knowledge_bp: 500
        outcome: >-
          You write to both courts that a quarrel between brothers should be settled by a third
          brother. Both reply politely, and neither is moved.
    history: >-
      Hattusili III recalls in his letter to Kadashman-Enlil II that Kadashman-Turgu offered
      to send troops against Egypt and broke relations with the Egyptian court.
    diverged: >-
      Hatti is gone.
    sources: ["KBo 1.10 (Hattusili III to Kadashman-Enlil II)", "Bryce, Letters of the Great Kings (2003)"]

  - id: bab_vizier
    scenario: kadesh
    civ: babylon
    year: -1263
    title: "The Vizier's Answer"
    place: "Babylon"
    speaker: steward
    speaker_name: "Itti-Marduk-balatu"
    speaker_title: "Vizier"
    benchmark_provinces: 2
    story: >-
      You are Kadashman-Enlil II, and you are a boy. Your vizier Itti-Marduk-balatu governs for
      you, and he does not like the Hittites.


      Hattusili of Hatti has written again, a long, hurt letter. Why have your messengers
      stopped coming? The vizier told his envoy the roads are unsafe, because of the Ahlamu
      nomads and the Assyrians. Hattusili says that is nonsense. Babylonian merchants have
      been killed in the west, and he promises justice. The Babylonian doctor you lent him has
      died in Hatti, and he swears it was not his fault. And he says he hears you have grown
      up and go hunting: "Go to an enemy land and strike it down!"
    choices:
      - label: "Let the vizier answer as he likes"
        historical: true
        legitimacy_bp: -500
        influence: {nobility: 1000}
        outcome: >-
          The messengers go slowly, and the gifts are small. Hattusili turns to Egypt instead,
          and four years later signs a treaty of peace with Ramesses.
      - label: "Write back as his brother, and send the gifts"
        wealth_bp: -1000
        legitimacy_bp: 500
        outcome: >-
          Lapis lazuli and horses go west, and a new doctor. Hattusili sends back iron and a
          letter full of compliments.
      - label: "Take his advice, and raid the Assyrian frontier"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Your chariots burn a few Assyrian villages across the Diyala. Assyria will not forget
          it.
        deeds: {grudges: {assyria: 2500}}
    history: >-
      Hattusili's letter to the young Kadashman-Enlil II (KBo 1.10) complains of the vizier
      Itti-Marduk-balatu and urges the king to go to war; relations cooled as Hatti made peace
      with Egypt in 1259.
    sources: ["KBo 1.10 (Hattusili III to Kadashman-Enlil II)", "Bryce, Letters of the Great Kings (2003)"]

  - id: bab_gilgamesh
    scenario: kadesh
    civ: babylon
    year: -1250
    title: "He Who Saw the Deep"
    place: "The temple school, Uruk"
    speaker: scholar
    speaker_name: "Sin-leqi-unninni"
    speaker_title: "Exorcist and scholar of Uruk"
    benchmark_provinces: 2
    story: >-
      You are Kudur-Enlil. The scribes of your kingdom copy the old stories of Gilgamesh, the
      king of Uruk who went to look for the secret of eternal life, in a dozen versions, old
      and new, Sumerian and Babylonian.


      A scholar of Uruk, Sin-leqi-unninni, wants to make them one book: eleven tablets, with
      a new beginning - "He who saw the Deep" - and the flood story told by the one man who
      survived it. He asks for copies of every version in the temple libraries of the
      kingdom.
    choices:
      - label: "Open the temple libraries to him"
        historical: true
        knowledge_bp: 2500
        influence: {clergy: 1000}
        outcome: >-
          The standard Epic of Gilgamesh is copied for a thousand years, from Babylon to
          Nineveh. In 1872 a young man at the British Museum, George Smith, reads the flood
          tablet from Nineveh, and is so excited he starts taking off his clothes.
      - label: "Keep the old versions as they are"
        knowledge_bp: 500
        outcome: >-
          The scribes go on copying their own versions. The story survives, in pieces.
      - label: "✦ Print the epic, and sell it in the market"
        needs_adopted: [printing_press]
        knowledge_bp: 5000
        legitimacy_bp: 500
        outcome: >-
          Gilgamesh goes out in a thousand copies on clay pressed from carved blocks. Children
          in Babylon learn to read from the story of the flood.
      - label: "Commission a new epic of the king's own deeds"
        knowledge_bp: 1500
        legitimacy_bp: 1000
        outcome: >-
          The court poets are set to work on a song of your own victories, in the grand old
          manner. It is much admired at court, and the old stories are left to the temple schools.
    history: >-
      Babylonian tradition names Sin-leqi-unninni as the editor of the standard Epic of
      Gilgamesh, usually dated to the Kassite period; George Smith identified the flood tablet
      in 1872.
    sources: ["George, The Babylonian Gilgamesh Epic (2003)", "Damrosch, The Buried Book (2007)"]

  - id: bab_foundation
    scenario: kadesh
    civ: babylon
    year: -1240
    title: "A Message for the Future"
    place: "The temple of Eulmash, Sippar-Anunitum"
    speaker: diviner
    speaker_name: "The temple's high priest"
    speaker_title: "Of the goddess Anunitum"
    benchmark_provinces: 2
    story: >-
      You are Shagarakti-Shuriash. The temple of the goddess Anunitum at Sippar is crumbling.
      Your builders will pull it down to its foundations and build it again.


      The high priest reminds you of the custom: in the foundations, the king buries an
      inscription saying who built the temple and when, for the kings who will rebuild it
      after him. Most kings write a line or two. He thinks you could write more.
    choices:
      - label: "Rebuild the whole temple at once"
        historical: true
        legitimacy_bp: 1000
        materials_bp: -1000
        influence: {clergy: 1500}
        outcome: >-
          The temple rises again and your inscription goes into the brickwork. Seven hundred
          years later, the last king of Babylon, Nabonidus, who loves the past, digs down to
          your foundations, finds it, and writes that Shagarakti-Shuriash built here
          'eight hundred years before me'. He is out by about a century; he is also the first
          archaeologist.
      - label: "Patch the walls and rebuild later"
        wealth_bp: 500
        legitimacy_bp: -300
        outcome: >-
          The cracks are filled. Nobody will ever find out who did it.
      - label: "Rebuild it in stages, as funds allow"
        legitimacy_bp: 500
        wealth_bp: -500
        influence: {clergy: 500}
        outcome: >-
          The work takes twice as long, and the priests are impatient. The new temple is finished
          within your reign, with a line or two buried in its foundations.
    history: >-
      Nabonidus (r. 556-539 BC) records finding Shagarakti-Shuriash's foundation inscription
      when rebuilding the Eulmash temple at Sippar-Anunitum, which he dated 800 years before
      himself.
    sources: ["Nabonidus, Sippar cylinder", "Schaudig, Die Inschriften Nabonids (2001)", "Brinkman, Materials and Studies for Kassite History (1976)"]

  - id: bab_oath
    scenario: kadesh
    civ: babylon
    year: -1227
    title: "The Broken Oath"
    place: "Before Babylon"
    speaker: assyria
    speaker_name: "Tukulti-Ninurta I"
    speaker_title: "King of Assyria"
    needs_alive: [assyria]
    benchmark_provinces: 1
    story: >-
      You are Kashtiliash IV. Tukulti-Ninurta of Assyria, who has already conquered
      Hanigalbat, has marched to your border. He says you have broken the oath your fathers
      swore to his, and he has had the treaty tablet carried in front of his army, so that
      the gods can see who is guilty.


      The Assyrians are better soldiers than yours, and they say their god Ashur hates you.
      Your nobles say Marduk will not let Babylon fall.
    choices:
      - label: "Offer him battle outside the city"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2500
        knowledge_bp: -1000
        outcome: >-
          Your army is broken. You are led to Ashur in chains, and the Assyrians tear down the
          walls of Babylon, loot its temples, and carry Marduk's statue into exile in Assyria.
          Tukulti-Ninurta's poets write an epic of his victory; his scribes carry off your
          libraries, and Babylonian learning moves north. For seven years Babylon is ruled by
          Assyrian puppets.
        deeds: {ruler_falls: "is led to Ashur in chains", give: [bab_babylon], give_to: assyria}
      - label: "Send tribute and the treaty tablet back"
        wealth_bp: -2500
        legitimacy_bp: -1000
        influence: {nobility: -500}
        outcome: >-
          Tukulti-Ninurta takes the gold and calls it Ashur's due. He will be back.
        deeds: {peace_with: [assyria], grudges: {assyria: 1000}}
      - label: "Shut the gates and hold the walls"
        legitimacy_bp: -500
        unrest_bp: 1000
        food_bp: -1500
        outcome: >-
          The army is drawn into Babylon, and the siege begins. The Assyrians bring up their
          engines and the city grows hungry.
        deeds: {men: 8000}
    history: >-
      Tukulti-Ninurta I defeated and captured Kashtiliash IV (c. 1225 BC), sacked Babylon and
      removed Marduk's statue; Babylon was ruled by Assyrian vassals until about 1217.
    diverged: >-
      Assyria is gone.
    sources: ["Tukulti-Ninurta Epic", "Chronicle P (ABC 22)", "Machinist, The Epic of Tukulti-Ninurta I (1978)"]

  - id: bab_revolt
    scenario: kadesh
    civ: babylon
    year: -1216
    title: "The Nobles of Akkad"
    place: "The Sealand"
    speaker: steward
    speaker_name: "A noble of Akkad"
    speaker_title: "Of the old Kassite houses"
    benchmark_provinces: 2
    story: >-
      You are Adad-shuma-usur, a son of the old royal house. The Elamites have raided Nippur
      and Isin twice, and the Assyrian puppet kings could do nothing about it. Tukulti-Ninurta
      is far away, building himself a new city, and his own nobles hate him.


      The nobles of Akkad and Karduniash have driven out the last Assyrian puppet. They have
      come to you, and they want you on the throne in Babylon.
    choices:
      - label: "Accept the nobles' offer of the throne"
        historical: true
        legitimacy_bp: 2500
        unrest_bp: -1500
        outcome: >-
          Babylon is yours again. You will rule for thirty years. A few years from now, in his
          new city, Tukulti-Ninurta is shut in a room by his own son and killed, and Assyria
          falls into a long quarrel. You write to two of its next kings together, "the kings
          of Assyria", in a letter so insulting that scholars still enjoy it.
        deeds: {take: [bab_babylon]}
      - label: "Wait in the south until Assyria is weaker"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          You keep five thousand men under arms in the Sealand and wait. The nobles find another
          prince, who is less patient than you.
        deeds: {men: 5000}
      - label: "Take the throne and pay Assyria tribute for peace"
        legitimacy_bp: 2500
        wealth_bp: -1000
        unrest_bp: -2000
        outcome: >-
          You are crowned, and send silver north to Tukulti-Ninurta with every courtesy. The
          nobles grumble at the price, and Babylon has its king. Assyrian tax-gatherers keep the
          roads open, and the south is quiet.
        deeds: {take: [bab_babylon], peace_with: [assyria]}
    history: >-
      The nobles of Babylonia rebelled and made Adad-shuma-usur king (c. 1216 BC). He reigned
      for some 30 years; Tukulti-Ninurta I was murdered by his son around 1207.
    sources: ["Chronicle P (ABC 22)", "Grayson, Assyrian and Babylonian Chronicles (1975)", "Brinkman, Materials and Studies for Kassite History (1976)"]

  - id: bab_princess
    scenario: kadesh
    civ: babylon
    year: -1180
    title: "A Princess for Susa"
    place: "Babylon"
    speaker: elam
    speaker_name: "Shutruk-Nakhunte"
    speaker_title: "King of Anshan and Susa"
    needs_alive: [elam]
    benchmark_provinces: 2
    story: >-
      You are Meli-Shipak. Your kingdom is at peace and growing rich again. You reward your
      servants with land, and set up boundary stones carved with the symbols of the gods and
      curses on anyone who moves them; you have given one to your own daughter.


      Shutruk-Nakhunte, the new king of Elam, asks for the hand of your eldest daughter. A
      marriage would make Elam family. It would also give his sons Kassite royal blood.
    choices:
      - label: "Send your eldest daughter to Susa"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -1000
        outcome: >-
          The wedding is grand, and the peace holds while you live. A generation later, a king
          of Elam writes to the court of Babylon that he is the grandson of a Kassite king, and
          has a better claim to its throne than whoever is on it.
      - label: "Refuse the match and strengthen the border"
        legitimacy_bp: 500
        outcome: >-
          Four thousand more men are posted on the Elamite border. Shutruk-Nakhunte marries
          elsewhere, and remembers.
        deeds: {men: 4000, grudges: {elam: 2000}}
      - label: "Offer a treaty and rich gifts, but no bride"
        wealth_bp: -1000
        legitimacy_bp: 300
        outcome: >-
          Your envoys carry gold and an oath of friendship to Susa. Shutruk-Nakhunte takes them,
          but he is not flattered.
    history: >-
      Meli-Shipak's daughter married into the Elamite royal house; a later Elamite letter
      (the 'Berlin letter') claims the throne of Babylon through Kassite descent.
    diverged: >-
      Elam is gone.
    sources: ["Berlin letter (VAT 17020)", "Meli-Shipak kudurru (Louvre Sb 23)", "Potts, The Archaeology of Elam (2016)"]

  - id: bab_stele
    scenario: kadesh
    civ: babylon
    year: -1158
    title: "The Stele of Hammurabi"
    place: "Sippar"
    speaker: diviner
    speaker_name: "The priests of Shamash"
    speaker_title: "At Sippar"
    needs_alive: [elam]
    benchmark_provinces: 2
    story: >-
      You are Zababa-shuma-iddin, king for a few months. Shutruk-Nakhunte of Elam has crossed
      the Tigris with his army and taken seven hundred towns. He is at Sippar.


      In the temple of the sun god at Sippar stands the stele of Hammurabi, a man's height of
      black stone carved with his laws, five hundred years old. Near it stands the victory
      stele of Naram-Sin, older still. The priests beg you to hide them.
    choices:
      - label: "Meet the Elamites in the field"
        historical: true
        legitimacy_bp: -2000
        knowledge_bp: -1500
        outcome: >-
          You are beaten and deposed. Shutruk-Nakhunte carries the steles to Susa as trophies,
          chisels a few laws off Hammurabi's, and carves his own name on Naram-Sin's. In 1901
          French archaeologists dig them up at Susa, and they are in the Louvre today.
        deeds: {ruler_falls: "is deposed by Shutruk-Nakhunte of Elam"}
      - label: "Bury the steles and hold the walls"
        legitimacy_bp: 500
        food_bp: -1500
        outcome: >-
          The priests bury the laws of Hammurabi under the temple floor. The Elamites look for
          them, and do not find them.
        deeds: {men: 5000}
      - label: "Pay the Elamite king to turn back"
        wealth_bp: -2000
        legitimacy_bp: -500
        outcome: >-
          Envoys carry silver and gifts to Shutruk-Nakhunte's camp. He takes the silver, and goes
          on looting the towns he has already taken.
    history: >-
      Shutruk-Nakhunte invaded Babylonia about 1158 BC, deposed Zababa-shuma-iddin and took
      Hammurabi's law stele and Naram-Sin's victory stele to Susa, where they were found in
      1898-1901.
    diverged: >-
      Elam is gone.
    sources: ["Shutruk-Nakhunte's inscriptions (Louvre Sb 4, Sb 8)", "Potts, The Archaeology of Elam (2016)"]

  - id: bab_marduk
    scenario: kadesh
    civ: babylon
    year: -1155
    title: "Marduk Goes to Elam"
    place: "Babylon"
    speaker: steward
    speaker_name: "The high priest of Marduk"
    speaker_title: "Of the Esagila temple"
    needs_alive: [elam]
    benchmark_provinces: 1
    story: >-
      You are Enlil-nadin-ahi. For three years you have fought the Elamites, now under
      Shutruk-Nakhunte's son Kutir-Nahhunte, and the cities have fallen one by one. Babylon
      is all that is left.


      The high priest of Marduk asks what will happen to the god. If Babylon falls, the
      Elamites will take his statue, as the Assyrians did seventy years ago. He asks you to
      fight to the end.
    choices:
      - label: "Hold Babylon against the Elamites"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Babylon falls. You are carried off to Elam, and so is Marduk. The Kassite dynasty,
          after nearly six hundred years, is over. In forty years a new king, Nebuchadnezzar I,
          will march to Susa and bring Marduk home, and the poets will say that Marduk let
          himself be taken, to punish Babylon.
        deeds: {ruler_falls: "is carried off to Elam"}
      - label: "Hide the god in the marshes and make terms"
        legitimacy_bp: -1000
        wealth_bp: -2500
        outcome: >-
          The statue goes south on a reed boat by night. Kutir-Nahhunte takes the gold and the
          city and searches the temple, and finds nothing.
      - label: "Take the army to the marshes and fight on"
        legitimacy_bp: -800
        food_bp: -1000
        outcome: >-
          The army leaves Babylon by night, with the god's statue. In the Sealand's reed-beds the
          Elamites cannot easily follow, and nobody can easily feed an army there.
        deeds: {men: 6000}
    history: >-
      Kutir-Nahhunte ended the Kassite dynasty about 1155 BC and took Marduk's statue to
      Elam; Nebuchadnezzar I brought it back about 1110 BC.
    diverged: >-
      Elam is gone.
    sources: ["Chronicle of Nebuchadnezzar I", "Marduk Prophecy", "Brinkman, A Political History of Post-Kassite Babylonia (1968)"]
