schema_version: 1
# Chronicle mode (D-120, D-168): Denmark from Svolder to the end of Cnut's North Sea empire,
# 1000-1035. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Anglo-Saxon Chronicle, the Encomium Emmae Reginae,
# Thietmar of Merseburg, Adam of Bremen, Cnut's letters of 1020 and 1027, the skaldic
# verse and (with care) the later sagas of Snorri, with modern work by Lawson, Bolton,
# Sawyer and Keynes. benchmark_provinces counts the provinces of this map the real Danish
# kings held at that date; their other realms appear as tributaries.
chapters:
  - id: den_svolder
    scenario: year_1000
    civ: denmark
    year: 1000
    title: "The Long Serpent"
    place: "Off the island of Svolder"
    speaker: sweden
    speaker_name: "Olof Skotkonung"
    speaker_title: "King of the Swedes, your stepson"
    needs_alive: [norway]
    benchmark_provinces: 2
    story: >-
      You are Sweyn Forkbeard, King of the Danes. You drove your own father off his throne,
      and you have taken silver from England more than once. Olaf Tryggvason, King of Norway,
      has married your sister without your leave and is sailing home from the Baltic with his
      great ship, the Long Serpent, and only a few others.


      Your stepson Olof, King of the Swedes, and Eric, the exiled Norwegian jarl, have joined
      you. Your fleets are hidden behind an island on Olaf's route.
    choices:
      - label: "Ambush Olaf's fleet with your allies"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Olaf's ships are lashed together and fight to the last. When the Long Serpent is
          cleared, Olaf leaps overboard in his armour, and is never seen again. Norway is
          divided: you take the south, and Eric and his brother rule the rest as your jarls.
        deeds: {peace_with: [norway], tributaries: [norway]}
      - label: "Let him pass and wait for a better chance"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          Olaf sails home. Your allies go home grumbling, and the ships are not paid for a
          summer's waiting, which saves you silver.
      - label: "Settle with Olaf over your sister's dower"
        wealth_bp: -500
        legitimacy_bp: 2700
        outcome: >-
          You send word that Thyri's dower lands will be paid. Olaf is satisfied for the present,
          and your allies mutter that you have let the chance go. Denmark's chiefs honour a king
          who keeps the peace by paying what is owed.
        deeds: {peace_with: [norway]}
    history: >-
      In 1000 Sweyn Forkbeard, Olof of Sweden and Eric Hakonarson defeated Olaf Tryggvason
      at Svolder; Olaf leapt into the sea, and Norway was divided under Danish overlordship.
    diverged: >-
      Norway is already gone.
    sources: ["Adam of Bremen 2.40", "Hallfredr, Erfidrapa Oláfs", "Snorri, Heimskringla, Olaf Tryggvason's saga"]

  - id: den_brice
    scenario: year_1000
    civ: denmark
    year: 1003
    title: "St Brice's Day"
    place: "Roskilde"
    speaker: steward
    speaker_name: "A survivor from England"
    speaker_title: "Come over the sea"
    needs_alive: [england]
    benchmark_provinces: 2
    story: >-
      Last November, on St Brice's Day, King Aethelred of England ordered that all the Danes
      in England be killed. In Oxford they took refuge in a church, and the townspeople burned
      it with them inside. Later stories say your own sister Gunnhild, a hostage, was among
      the dead.


      Your warriors want revenge, and the silver that comes with it.
    choices:
      - label: "Sail for England with your own fleet"
        historical: true
        wealth_bp: 2500
        legitimacy_bp: 1000
        outcome: >-
          You sail to England yourself. Exeter is betrayed to you and burned; next year
          Norwich. At Thetford the East Anglian ealdorman Ulfcytel fights you so hard your men
          say they have never met worse handplay in England. From now on the English pay more
          every few years: 24,000 pounds of silver, then 36,000, then 48,000.
        deeds: {grudges: {england: 1500}}
      - label: "Demand blood money through envoys"
        wealth_bp: 1500
        legitimacy_bp: -300
        outcome: >-
          Aethelred pays, and says nothing about the massacre. Your warriors think you weak, and
          you both know it is not over.
      - label: "Send a jarl's raiding fleet and stay at home"
        wealth_bp: 2200
        legitimacy_bp: 800
        outcome: >-
          A fleet of thirty ships goes under a trusted jarl, while you deal with troubles nearer
          home. It brings back silver, but less than you would have taken yourself. The jarl's
          fleet does well, and your name is honoured for it.
        deeds: {ships: 30}
    history: >-
      Aethelred ordered the St Brice's Day massacre of Danes in England (13 November 1002);
      Sweyn raided England in 1003-1004, sacking Exeter and Norwich.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1002-1004", "Æthelred's St Frideswide charter (S 909)", "William of Jumièges 5.6"]

  - id: den_conquest
    scenario: year_1000
    civ: denmark
    year: 1012
    title: "King of England for Forty Days"
    place: "Roskilde"
    speaker: steward
    speaker_name: "Your son Cnut"
    speaker_title: "Seventeen, ready to sail"
    needs_alive: [england]
    benchmark_provinces: 2
    story: >-
      Thorkell the Tall, the greatest of the Danish chiefs in England, has plundered it for
      three years. His drunken men pelted the Archbishop of Canterbury to death with ox bones
      at Greenwich when he would not let himself be ransomed. Now Thorkell has taken 48,000
      pounds and gone over to King Aethelred, with forty-five ships.


      The English are exhausted, and they hate their king. Your son Cnut says: not raids this
      time. The kingdom.
    choices:
      - label: "Invade England to take the crown"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          You sail up the Humber to Gainsborough, and the north submits to you at once. Then
          Oxford, Winchester, and at last London. Aethelred sends his wife and sons to Normandy
          and follows them. At Christmas the English take you for their king. Five weeks later
          you are dead, at Gainsborough. The fleet chooses Cnut as king.
        deeds: {tributaries: [england]}
      - label: "Outbid Aethelred for Thorkell's ships"
        wealth_bp: -2500
        outcome: >-
          Thorkell takes your silver and brings thirty ships over to you, but Aethelred's pay
          keeps the rest of his men in England, waiting to see who pays more.
        deeds: {ships: 30}
      - label: "Raid England again for silver, as before"
        wealth_bp: 1000
        legitimacy_bp: 1500
        outcome: >-
          A fleet goes out for the summer's plunder, and comes home with silver and with men who
          have seen how weak the English are. The kingdom is left for another year. Your warriors
          are pleased to be on the old road to silver.
        deeds: {men: 6000}
    history: >-
      Sweyn conquered England in 1013 and was accepted as king at Christmas; he died at
      Gainsborough on 3 February 1014.
    diverged: >-
      England is gone.
    sources: ["Anglo-Saxon Chronicle 1011-1014", "Thietmar of Merseburg 7.36-40"]

  - id: den_brother
    scenario: year_1000
    civ: denmark
    year: 1014
    title: "The Brother's Fleet"
    place: "Roskilde"
    speaker: steward
    speaker_name: "Cnut"
    speaker_title: "Your younger brother"
    benchmark_provinces: 2
    story: >-
      You are Harald, King of the Danes since your father died. Your brother Cnut was chosen
      king by the fleet in England. Then the English invited Aethelred back, and Cnut had to
      run. On his way out he put ashore at Sandwich the hostages his father had taken, with
      their hands, ears and noses cut off.


      Now he is here. He asks you to share the kingdom of Denmark with him, until he can win
      England back.
    choices:
      - label: "Keep Denmark, but lend him ships"
        historical: true
        legitimacy_bp: 500
        materials_bp: -1500
        outcome: >-
          Cnut sails in 1015 with two hundred ships; Thorkell rejoins him. At Assandun in 1016
          he beats Edmund Ironside, and when Edmund dies that November, Cnut is King of all
          England. He pays his army with the largest tax England has ever raised, and marries
          Aethelred's widow, Emma of Normandy.
        deeds: {ally_with: [england]}
      - label: "Share the kingdom with him for now"
        legitimacy_bp: -1000
        outcome: >-
          Cnut stays in Denmark, and the brothers rule together, until they quarrel.
        deeds: {break_away: [england]}
      - label: "Lend him silver but no ships"
        wealth_bp: -1500
        legitimacy_bp: 200
        outcome: >-
          You pay for Cnut's hired men and send him on his way. He sails for England with fewer
          men than he hoped, and does not forget who gave him less than he asked.
    history: >-
      After Sweyn's death the English recalled Aethelred (1014). Harald II refused to share
      Denmark with Cnut but supported his invasion of 1015-1016, which made Cnut king of
      England.
    sources: ["Encomium Emmae Reginae 2.2-3", "Anglo-Saxon Chronicle 1014-1017"]

  - id: den_nesjar
    scenario: year_1000
    civ: denmark
    year: 1016
    title: "The Fat Man Comes Home"
    place: "Roskilde"
    speaker: steward
    speaker_name: "Jarl Sweyn Hakonarson"
    speaker_title: "Who ruled Norway for you"
    needs_alive: [norway]
    benchmark_provinces: 2
    story: >-
      Olaf Haraldsson, a Norwegian sea-king who fought in England for Aethelred and was
      baptised in Normandy, has come home to Norway and claimed the crown. Your jarl Sweyn
      Hakonarson met his fleet at Nesjar on Palm Sunday, and lost.


      The jarl asks for a Danish fleet to win Norway back. Your brother's war in England is
      taking every ship you have.
    choices:
      - label: "England first; let Norway go for now"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Jarl Sweyn flees to Sweden and dies there. Olaf makes himself king of all Norway, and
          sets about making it Christian with the sword.
        deeds: {break_away: [norway]}
      - label: "Send a fleet to win Norway back"
        materials_bp: -2000
        outcome: >-
          The jarl sails back with Danish ships, and Norway has two kings fighting for it.
        deeds: {ships: 30}
      - label: "Send the jarl silver and ten ships, nothing more"
        wealth_bp: -1000
        legitimacy_bp: 200
        outcome: >-
          The jarl sails back with a small squadron. It is too few to beat Olaf, and too many to
          be forgotten.
        deeds: {ships: 10}
    history: >-
      Olaf Haraldsson defeated Jarl Sweyn Hakonarson at Nesjar (1016) and became king of all
      Norway.
    diverged: >-
      Norway is gone.
    sources: ["Sigvatr Thordarson, Nesjavisur", "Snorri, Heimskringla, Olaf the Saint's saga"]

  - id: den_cnut
    scenario: year_1000
    civ: denmark
    year: 1019
    title: "A Letter to the English"
    place: "Roskilde"
    speaker: steward
    speaker_name: "Archbishop Lyfing"
    speaker_title: "Of Canterbury, your envoy"
    benchmark_provinces: 2
    story: >-
      You are Cnut, King of England and, now that your brother is dead, King of the Danes. You
      have come to Denmark to take your crown and deal with your enemies here.


      The English are nervous with their king overseas. The archbishop suggests a letter, to
      be read out in every shire: that you have made Denmark safe so that no more Vikings will
      come to England, that you will keep the laws of King Edgar, and that the English should
      obey your earls. And the fleet that won England for you is eating its head off.
    choices:
      - label: "Write to the English and pay off the fleet"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -2000
        outcome: >-
          The letter is read in every shire: you have risked your own life, you say, so that
          no harm will come to them from Denmark. The great fleet is paid off with an enormous
          tax and sails home, apart from forty ships. You rule England as an English king, with
          English bishops and Danish earls, and the English are, on the whole, glad of the
          peace.
      - label: "Keep the whole fleet in English pay"
        unrest_bp: 2000
        outcome: >-
          The fleet stays. The English pay for it every year, and hate it every year.
        deeds: {ships: 40}
      - label: "Pay off the fleet and rule through Danish earls"
        legitimacy_bp: 1500
        wealth_bp: -2000
        outcome: >-
          The fleet goes home, and the shires hear your will from your earls rather than from a
          letter. The English find it harder to believe in your good intentions. The English fear
          the earls, and the Danes respect a king who does not need a fleet.
    history: >-
      Cnut's letter to the English (1019-1020), written from Denmark, promised good law and
      claimed he had removed the Danish threat; most of his fleet was paid off in 1018.
    sources: ["Cnut's letter of 1020 (Liebermann, Gesetze I)", "Anglo-Saxon Chronicle 1018-1020", "Lawson, Cnut (2004)"]

  - id: den_holy_river
    scenario: year_1000
    civ: denmark
    year: 1026
    title: "The Holy River"
    place: "Roskilde"
    speaker: steward
    speaker_name: "Ulf Jarl"
    speaker_title: "Your regent in Denmark, husband of your sister"
    benchmark_provinces: 2
    story: >-
      While you were in England, your regent Ulf, your sister's husband, had the Danes
      proclaim your eight-year-old son Hardecnut king, without asking you. He says it was
      to steady them, because the kings of Norway and Sweden are raiding Denmark together.


      You have come with your fleet and beaten them, more or less, at the Holy River, where
      they opened a dam and flooded your ships. Ulf's ships came to your rescue. Now he wants
      your thanks.
    choices:
      - label: "Have Ulf put to death at Roskilde"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          At Christmas, the story goes, after a quarrel over a game of chess, your housecarls
          kill Ulf in the church of the Holy Trinity at Roskilde. You give the church great
          estates in penance. Ulf's son Sweyn will one day be King of Denmark himself.
      - label: "Thank him and keep him as regent"
        legitimacy_bp: -500
        unrest_bp: -500
        outcome: >-
          Ulf keeps his place and his ambitions. Hardecnut learns that kings can be made by
          other people.
      - label: "Strip him of the regency and send him abroad"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Ulf loses his office and his lands near the court, and goes into exile. His wife, your
          sister, pleads for him in vain.
    history: >-
      Cnut fought Olaf of Norway and Anund Jacob of Sweden at the Holy River (Helgeå) in
      about 1026, and had his regent Ulf killed at Roskilde soon after.
    sources: ["Anglo-Saxon Chronicle 1025", "Snorri, Heimskringla, Olaf the Saint's saga 145-153", "Bolton, Cnut the Great (2017)"]

  - id: den_rome
    scenario: year_1000
    civ: denmark
    year: 1027
    title: "Two Emperors and a King"
    place: "St Peter's, Rome"
    speaker: hre
    speaker_name: "Conrad II"
    speaker_title: "The new emperor"
    benchmark_provinces: 2
    story: >-
      You have come to Rome as a pilgrim, to see Conrad crowned emperor by the pope at Easter.
      You walk in the procession beside King Rudolf of Burgundy, next to the emperor himself:
      a Viking's son among the kings of Christendom.


      You have three requests to make while you are here: that English and Danish pilgrims
      pay fewer tolls on the road to Rome, that your archbishops pay less for their pallium,
      and that the emperor gives you the land north of the river Eider.
    choices:
      - label: "Press all three of your requests"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          You get them all. You write a letter home to the English telling them so, and
          promising to rule justly. Your daughter will marry Conrad's son. The border of
          Denmark is set at the Eider, where it stays for eight hundred years.
      - label: "Pray in Rome and ask for nothing"
        legitimacy_bp: 1000
        influence: {clergy: 1000}
        outcome: >-
          You light candles at every altar in Rome, and go home a little poorer and much
          admired.
      - label: "Ask for the tolls and the pallium only"
        wealth_bp: 500
        legitimacy_bp: 2000
        outcome: >-
          You ask for what your pilgrims and bishops need, and nothing for the crown. The emperor
          grants it readily. The emperor receives your modest request graciously, and your name is
          remembered.
    history: >-
      Cnut attended Conrad II's imperial coronation in Rome at Easter 1027 and won
      concessions for pilgrims and archbishops, described in his letter of 1027.
    sources: ["Cnut's letter of 1027 (in John of Worcester)", "Wipo, Gesta Chuonradi 16", "Adam of Bremen 2.56"]

  - id: den_norway
    scenario: year_1000
    civ: denmark
    year: 1028
    title: "Silver for the Norwegian Chiefs"
    place: "Nidaros, Norway"
    speaker: steward
    speaker_name: "Einar Thambarskelfir"
    speaker_title: "A Norwegian chief"
    needs_alive: [norway]
    benchmark_provinces: 2
    story: >-
      King Olaf of Norway has made himself hated by his chiefs: he has burned their temples,
      killed their kin and made them bow. For two years your agents have been going from
      farm to farm in Norway with English silver.


      Now you have sailed to Norway with fifty English ships. The chiefs are waiting to see
      who is stronger.
    choices:
      - label: "Buy the chiefs, and take the crown"
        historical: true
        wealth_bp: -2000
        legitimacy_bp: 2000
        outcome: >-
          Olaf's men melt away. He flees across the mountains to Sweden and then to Kiev. At
          Nidaros the Thing takes you as King of Norway, and you leave your nephew Hakon as
          jarl. You call yourself 'King of all England and Denmark, of the Norwegians and part
          of the Swedes'.
        deeds: {tributaries: [norway]}
      - label: "Leave Norway to King Olaf for now"
        legitimacy_bp: -500
        wealth_bp: 1000
        outcome: >-
          The silver goes back into the chests, and three thousand men are kept in Danish pay on
          the border. Olaf goes on making enemies.
        deeds: {men: 3000}
      - label: "Invade Norway with the fleet and fight Olaf"
        legitimacy_bp: 1500
        unrest_bp: 800
        outcome: >-
          You land in force and force Olaf to fight where he is strongest. The chiefs watch and
          wait, and the cost is high.
        deeds: {men: 20000, ships: 30}
    history: >-
      In 1028 Cnut took Norway, largely by bribing its chiefs; Olaf Haraldsson fled to
      Kievan Rus.
    diverged: >-
      Norway is gone.
    sources: ["Anglo-Saxon Chronicle 1028", "Sigvatr Thordarson, Vestrfararvisur", "Lawson, Cnut (2004)"]

  - id: den_stiklestad
    scenario: year_1000
    civ: denmark
    year: 1034
    title: "Aelfgifu's Time"
    place: "Winchester"
    speaker: steward
    speaker_name: "Aelfgifu of Northampton"
    speaker_title: "Your first wife, regent of Norway"
    needs_alive: [norway]
    benchmark_provinces: 2
    story: >-
      Olaf came back from Kiev in 1030 and was killed by his own farmers at Stiklestad. Within
      a year the Norwegians were calling him a saint: his body would not decay, his hair and
      nails kept growing.


      You sent your son Svein, a boy, to rule Norway with his mother Aelfgifu. She has taxed
      the Norwegians as no one ever has: a cow from every hearth at Yule, a share of every
      catch. Now the chiefs have gone to Kiev to fetch Olaf's young son Magnus. Aelfgifu asks
      for an army.
    choices:
      - label: "Recall Svein and his mother to Denmark"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Svein and his mother flee to Denmark, and Magnus is made king. You die at Shaftesbury
          that November, at about forty. Within seven years all your sons are dead, and your
          North Sea empire has fallen apart.
        deeds: {break_away: [norway]}
      - label: "Send the fleet to Norway"
        materials_bp: -2500
        unrest_bp: 1500
        outcome: >-
          Danish and English ships sail for Nidaros. The Norwegians, with St Olaf's son at
          their head, wait for them.
        deeds: {ships: 40, grudges: {norway: 3000}}
      - label: "Send envoys and silver to the Norwegian chiefs"
        wealth_bp: -1500
        legitimacy_bp: 300
        outcome: >-
          A bishop goes to the chiefs with silver and promises of milder taxes. Whether they
          believe him is another matter.
    history: >-
      The harsh rule of Svein Knutsson and Aelfgifu in Norway ended in 1035 when Magnus
      Olafsson was recalled; Cnut died on 12 November 1035.
    diverged: >-
      Norway is gone.
    sources: ["Anglo-Saxon Chronicle 1035", "Agrip af Noregskonungasogum 27", "Bolton, Cnut the Great (2017)"]
