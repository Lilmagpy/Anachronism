schema_version: 1
# Chronicle mode (D-120, D-XXX): the counts of Barcelona, from Ramon Borrell to Ramon
# Berenguer IV, 1010-1148. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Catalan counts' charters, the Gesta comitum
# Barchinonensium (a later compilation, used with care), Ibn Idhari and Ibn Hayyan on the
# Córdoba expedition, the Liber Maiolichinus on the Balearic campaign and the Usatges, with
# modern work by Bonnassie, Bisson, Kosto, Salrach and Ryder. Dates approximate where
# sources differ: the Truce assembly at Toluges is 1027 (opened in 1028 on the turn grid),
# the Usatges' first articles are dated by tradition to about 1058, and the Gualba murder
# is early December 1082. benchmark_provinces counts the provinces of this map the real
# counts held at that date: Barcelona alone until the union with Aragon, which stands for
# the Zaragoza province (Provence, Besalú and the like have no province of their own here).
chapters:
  - id: bar_cordoba
    scenario: year_1000
    civ: barcelona
    year: 1010
    title: "Gold at Córdoba"
    place: "Barcelona"
    speaker: steward
    speaker_name: "An envoy of Muhammad al-Mahdi"
    speaker_title: "Pretender to the caliphate"
    needs_alive: [cordoba]
    benchmark_provinces: 1
    story: >-
      You are Ramon Borrell, count of Barcelona, Girona and Osona. Twenty-five years ago the
      great chamberlain Almanzor burned your city, and your father's generation never forgot
      it. Almanzor is dead now, and the caliphate he governed is tearing itself apart.


      An envoy from Córdoba stands before you. One claimant to the caliph's throne, Muhammad
      al-Mahdi, has been thrown out by the Berber soldiers who back another, and he needs
      Christian lances. He offers pay in gold, more than your whole county raises in years.
      Your brother Ermengol, count of Urgell, is ready to ride with you.
    choices:
      - label: "Take the gold and march on Córdoba"
        historical: true
        wealth_bp: 4000
        legitimacy_bp: 1000
        outcome: >-
          You and Ermengol march south with your knights and join Muhammad's army. Outside
          Córdoba you beat the Berbers in the summer of 1010, and the city and the great palace
          town of Madinat al-Zahra are plundered. Ermengol dies in Córdoba. You come home
          within months with more gold than any count of Barcelona has seen. The Berbers will
          take their revenge on the city itself before the end of the year.
        deeds: {peace_with: [cordoba], ally_with: [cordoba], men: 500}
      - label: "Refuse; Córdoba's quarrels are not yours"
        legitimacy_bp: 300
        outcome: >-
          You keep your knights at home and your frontier quiet. The envoy goes on to the
          counts of Castile.
      - label: "Ask for frontier castles instead of gold"
        wealth_bp: 800
        outcome: >-
          The envoy promises, but a pretender with no throne has no castles to give, and the
          bargaining drags on until his cause is lost.
    history: >-
      In 1010 Ramon Borrell and his brother Ermengol I of Urgell led a Catalan army to
      Córdoba in the pay of Muhammad II al-Mahdi, helped defeat the Berbers and plundered the
      city and Madinat al-Zahra. Ermengol died there; Ramon Borrell returned rich.
    diverged: >-
      Córdoba is gone.
    sources: ["Ibn Idhari, al-Bayan al-Mughrib", "Ibn Hayyan (via Ibn Bassam)", "Bonnassie, La Catalogne (1975)", "Kennedy, Muslim Spain and Portugal (1996)"]

  - id: bar_truce
    scenario: year_1000
    civ: barcelona
    year: 1028
    title: "A Truce for the Lord's Day"
    place: "Toluges, in Roussillon"
    speaker: scholar
    speaker_name: "Oliba"
    speaker_title: "Abbot of Ripoll and Bishop of Vic"
    benchmark_provinces: 1
    story: >-
      You are Berenguer Ramon, count of Barcelona, son of the man who plundered Córdoba. Your father's castles are held by men who have learned
      that a sword is the surest title. Peasants are robbed, churches burned, and the
      castellans answer to no court.


      Last year Oliba, abbot of Ripoll and bishop of Vic, a man of your own wide kin, called
      the lords and bishops together at Toluges. The assembly decreed that from the ninth
      hour of Saturday until the first hour of Monday, no man may attack another. Now Oliba
      asks you to make the truce binding in your own lands and have your knights swear it.
    choices:
      - label: "Swear it, and make your knights swear"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        influence: {clergy: 1500, nobility: -300}
        outcome: >-
          The oath spreads from county to county. The truce is stretched in later years to
          more days of the week and to the great feasts, and the church's peace becomes the
          model for the counts' own. Violence goes on, but now it has a rule to break.
      - label: "Leave it to the bishops; keep your own law"
        influence: {clergy: -500, nobility: 500}
        outcome: >-
          Your knights are glad. The bishops, less so. Oliba's truce stays a church matter,
          and the castellans learn that the count will not hold them to it.
      - label: "Proclaim your own count's peace as well"
        legitimacy_bp: 500
        influence: {nobility: -800}
        outcome: >-
          The lords call it meddling. Your judges find that nobody will bring a case to a
          count who cannot enforce his sentences.
    history: >-
      The assembly of Toluges in 1027, presided over by Abbot-Bishop Oliba, made the first
      known Truce of God, and the Catalan counties spread and extended it in the following
      decades.
    sources: ["Oliba's letters and the Toluges decree", "Bonnassie, La Catalogne (1975)", "Bisson, The Crisis of the Twelfth Century (2009)"]

  - id: bar_regency
    scenario: year_1000
    civ: barcelona
    year: 1036
    title: "Your Grandmother's Regency"
    place: "Barcelona"
    speaker: steward
    speaker_name: "Ermesinde of Carcassonne"
    speaker_title: "Your grandmother, widow of Ramon Borrell"
    benchmark_provinces: 1
    story: >-
      You are Ramon Berenguer, thirteen years old. Your father died last year, as your
      grandfather had before him, and you are count of Barcelona, Girona and Osona with no
      beard and no army. The great lords have noticed.


      Your grandmother Ermesinde, a countess of Carcassonne by birth and the widow of Ramon
      Borrell, ruled beside her son in his youth, and she is the one person in the court who
      knows every castellan's price. She offers to govern in your name until you are old
      enough.
    choices:
      - label: "Let your grandmother govern for you"
        historical: true
        legitimacy_bp: 800
        influence: {nobility: 300}
        outcome: >-
          Ermesinde rules in your name for some years. She holds the court together, settles
          oaths with the castellans, and teaches you who can be trusted. When you are of age
          you will find, as many a young prince has, that a wise regent is harder to
          dismiss than to obey.
      - label: "Let a council of the great lords rule"
        unrest_bp: 1200
        influence: {nobility: 1000}
        outcome: >-
          Each lord on the council wants the others kept weak. By the end of the year the
          council has given away three castles and agreed on nothing else.
      - label: "Declare yourself of age"
        legitimacy_bp: -800
        unrest_bp: 800
        outcome: >-
          Nobody believes you, least of all the men who meant to test you.
    history: >-
      After Berenguer Ramon I died in 1035, his mother Ermesinde of Carcassonne governed
      Catalonia in the name of the boy Ramon Berenguer I for some years, until about 1041.
    sources: ["Gesta comitum Barchinonensium", "Charters of Ermesinde", "Salrach, Història de Catalunya (1978)"]

  - id: bar_usatges
    scenario: year_1000
    civ: barcelona
    year: 1058
    title: "The Customs of Barcelona"
    place: "Barcelona"
    speaker: steward
    speaker_name: "Your judges"
    speaker_title: "Of the count's court"
    benchmark_provinces: 1
    story: >-
      You are Ramon Berenguer, called the Old though you are only thirty-five. For years the
      castellans of your marches have sworn and broken oaths. Mir Geribert, lord of Olèrdola,
      even styled himself 'prince' and defied you, and the castles you could not storm you
      have had to buy, one oath at a time. Now Mir Geribert has come to terms, and the
      castle holders are tired of the quarrels too.


      Your wife Almodis and your judges suggest an assembly. Let the customs of the country,
      the old Gothic law and the practices of the courts, be set down: what the count may
      demand, what the castellans owe him, what a knight may and may not take from a peasant.
    choices:
      - label: "Hold the assembly and write the customs down"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -800
        influence: {nobility: -300, guilds: 400}
        outcome: >-
          The assembly, held in Barcelona, sets down the rules that later generations call the
          Usatges. The count alone is prince: roads, castles and markets are his to protect, and
          every castle holder owes him service. In the following centuries the book is copied
          and enlarged, and it is one of the first written feudal laws in Europe. Mir Geribert
          is dead within a few years; his rebellion dies with him.
      - label: "Break the castellans one by one with war"
        legitimacy_bp: 500
        unrest_bp: 1500
        influence: {nobility: -1200}
        outcome: >-
          Two castles fall. The third costs you a summer, and the lords who watched swear
          allegiance to anyone but you.
      - label: "Keep buying their oaths with gold"
        wealth_bp: -2000
        outcome: >-
          It works every time, and every time costs more. Your treasury, which has begun to
          fill with the gold of the Muslim kings of Lleida and Zaragoza, empties again.
    history: >-
      Around 1058 Ramon Berenguer I and Almodis held an assembly in Barcelona, which later
      tradition and the Usatges' own prologue name as the origin of that law code; modern
      historians date the first articles to the 1050s and 1060s and the book's compilation
      to the twelfth century.
    sources: ["Usatges de Barcelona", "Bonnassie, La Catalogne (1975)", "Kosto, Making Agreements in Medieval Catalonia (2001)"]

  - id: bar_gualba
    scenario: year_1000
    civ: barcelona
    year: 1082
    title: "The Hunt at Gualba"
    place: "Barcelona"
    speaker: steward
    speaker_name: "A steward of your household"
    speaker_title: "Of the count's court"
    benchmark_provinces: 1
    story: >-
      You are Ramon Berenguer, called 'Towhead' for your tufted hair. Six years ago your
      father died, leaving the counties to you and to your twin brother Berenguer Ramon,
      jointly, to share like two oxen under one yoke. Neither of you has ever been content
      with half. The great lords take sides.


      It is December. Your household says there are whispers at court, and that the roads to
      the hunting grounds in the Montseny are not safe. A hunt is arranged near Gualba, as
      always at this season.
    choices:
      - label: "Keep to your father's will, and hunt as usual"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2500
        outcome: >-
          In the woods near Gualba you are ambushed and killed. Most say your twin was behind
          it, and it will be said of him for the rest of his life; he swears he was not. Your
          infant son, another Ramon Berenguer, will be count one day, and the lords will
          have to decide meanwhile whom to follow.
        deeds: {ruler_falls: "is murdered while hunting near Gualba"}
      - label: "Divide the counties between you, once and for all"
        legitimacy_bp: -300
        unrest_bp: 1000
        outcome: >-
          Your twin accepts, and then disputes the line through the middle of Barcelona. The
          lords stay on both sides of the line.
      - label: "Lock your twin in a castle"
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          Half the court calls it justice, the other half murder. Your twin's friends have
          castles of their own.
    history: >-
      In December 1082 Ramon Berenguer II was killed in an ambush while hunting near Gualba;
      his twin Berenguer Ramon II was suspected and ruled alone until 1097, when he left
      power and Ramon Berenguer II's son, Ramon Berenguer III, took the counties.
    sources: ["Gesta comitum Barchinonensium", "Liber Feudorum Maior", "Salrach, Història de Catalunya (1978)"]

  - id: bar_balearics
    scenario: year_1000
    civ: barcelona
    year: 1114
    title: "The Pisan Fleet"
    place: "Barcelona"
    speaker: papacy
    speaker_name: "A legate of Pope Paschal II"
    speaker_title: "Come with the Pisan fleet"
    benchmark_provinces: 1
    story: >-
      You are Ramon Berenguer, third of the name, thirty-two years old and lord of more than
      any count of Barcelona before you. You hold Barcelona, Girona and Osona, Besalú since
      1111, and, through your wife Douce, heiress of Provence, the lands of the south of
      France. Your ships now sail the western sea in earnest.


      The Balearic isles are a nest of pirates, and the Muslim governor there, whom the
      Pisan poets call Nazaredeolus, raids the coasts of Catalonia and Italy. Pisa has gathered
      a great fleet, blessed by the pope, and its leaders are in your port. They want you as
      their ally, and as the landlord who will take the islands off their hands.
    choices:
      - label: "Join the Pisans against Majorca"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1000
        influence: {clergy: 600}
        outcome: >-
          Catalans and Pisans take Ibiza, then land on Majorca and besiege its city through the
          winter. In April 1115 it falls to a storm of Pisan men; the Pisan poem says thousands of
          captives are freed, and the city is sacked. You come home first, because, the sources say, the
          Almoravids have moved against your lands, and you leave the Pisans to finish. The islands will not
          stay in Christian hands: within a few years the Almoravids return.
        deeds: {ships: 2, men: 500}
      - label: "Stay home and fortify the frontier"
        legitimacy_bp: 200
        outcome: >-
          The Pisans sail without you. Your coast is quiet, and your name is not on the poem.
      - label: "Let the Pisans go; offer only ships and provisions"
        wealth_bp: 500
        outcome: >-
          They sail with your ships and your stores and take the islands for themselves, and
          there is no place for you at the banquet.
    history: >-
      In 1113-1115 Ramon Berenguer III and a Pisan fleet, with the pope's blessing, attacked
      the Balearics, taking Ibiza and, in April 1115, Palma on Majorca; the Almoravids soon
      recovered the islands.
    sources: ["Liber Maiolichinus de gestis Pisanorum illustribus", "Ryder, Catalan expansion in the Mediterranean (1991)"]

  - id: bar_aragon
    scenario: year_1000
    civ: barcelona
    year: 1137
    title: "A Cradle for the Crown"
    place: "Barbastro"
    speaker: steward
    speaker_name: "Ramiro the Monk"
    speaker_title: "King of Aragon, once a monk"
    benchmark_provinces: 2
    story: >-
      You are Ramon Berenguer, fourth of the name, count of Barcelona, who succeeded his
      father six years ago. In Aragon, King Alfonso the Battler died with no son, leaving his
      kingdom to the knightly orders; the Aragonese lords refused, and took his brother
      Ramiro out of his monastery to be their king. Ramiro was a bishop and a monk, not a
      father, and he has a daughter barely a year old.


      The kings of Navarre and of León-Castile each want Aragon. Ramiro offers you his
      daughter, Petronilla, in marriage, and the government of the kingdom with her. He
      will return to his monastery. The Aragonese lords will not see you as king, only as
      their prince.
    choices:
      - label: "Betroth the infant and take the government"
        historical: true
        legitimacy_bp: 2000
        influence: {nobility: 800}
        outcome: >-
          At Barbastro in August 1137 the betrothal is made, and Ramiro goes back to the
          monastery at Huesca, though he keeps the title of king. You rule Aragon as 'prince'
          and Catalonia as count. The marriage itself will wait thirteen years, but your
          two lands now have one lord, and it will be centuries before they part.
        deeds: {take: [m_zaragoza], grudges: {navarre: 1500, leon: 1000}}
      - label: "Refuse; stay a count of Barcelona"
        outcome: >-
          Ramiro's offer goes to another suitor, and the long border behind your county is
          held by someone else.
      - label: "Demand the crown and not just the government"
        legitimacy_bp: -800
        unrest_bp: 1000
        outcome: >-
          The Aragonese lords walk out. Ramiro, the monk, will not hear of it.
    history: >-
      In 1137 Ramiro II of Aragon betrothed his baby daughter Petronilla to Ramon Berenguer IV
      and handed him the government of the kingdom; the wedding was in 1150, and their son
      Alfonso II would inherit both lands, the beginning of the Crown of Aragon.
    sources: ["Gesta comitum Barchinonensium", "Chronicon of San Juan de la Peña", "Bisson, The Medieval Crown of Aragon (1986)"]

  - id: bar_tortosa
    scenario: year_1000
    civ: barcelona
    year: 1148
    title: "The Crusade at Tortosa"
    place: "Tortosa"
    speaker: general
    speaker_name: "A captain of Genoa"
    speaker_title: "Commander of the fleet"
    benchmark_provinces: 2
    story: >-
      You are Ramon Berenguer IV, prince of Aragon and count of Barcelona. The Almoravids who
      once ruled the Muslim south are collapsing, and a new power, the Almohads, is crossing
      the strait. Pope Eugenius III has offered the same indulgence for fighting in Spain as
      for fighting in the east, and the ships of Genoa and the crusaders from the north have
      come to your harbour.


      Tortosa, at the mouth of the Ebro, has resisted the counts of Barcelona for decades.
      The Genoese will help you take it. They ask a third of the city, as their pay.
    choices:
      - label: "Take the crusaders and the Genoese on their terms"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -500
        influence: {clergy: 500}
        outcome: >-
          You besiege Tortosa through the second half of 1148, and it surrenders on terms at
          the very end of the year. Genoa has its third. In 1149 the Ebro valley falls too,
          with Fraga and Lleida; you will marry Petronilla in 1150, and your county will have
          doubled in a lifetime.
        deeds: {ships: 2, men: 800}
      - label: "Wait for the Aragonese lords"
        legitimacy_bp: 300
        outcome: >-
          They come in the spring, but the Genoese fleet has sailed home.
      - label: "Make a truce with Tortosa and the Almohads"
        wealth_bp: 1000
        legitimacy_bp: -500
        outcome: >-
          The tribute is good while it lasts. Your allies, and your reputation, do not last.
    history: >-
      In 1148 Ramon Berenguer IV, with Genoese and other crusaders, took Tortosa (which
      surrendered on 30 December) and in 1149 Lleida and Fraga; he married Petronilla in 1150
      and died in 1162, when their son Alfonso II inherited Aragon and Catalonia together.
    sources: ["Gesta comitum Barchinonensium", "Caffaro, Annals of Genoa", "Bisson, The Medieval Crown of Aragon (1986)"]
