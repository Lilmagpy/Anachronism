schema_version: 1
# Chronicle mode (D-120, D-164): Mycenaean Greece - the Ahhiyawa of the Hittite letters -
# from the Tawagalawa letter to the burning of Pylos, 1251-1180 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# No Mycenaean king's name survives in a document of his own time: the Linear B tablets
# call the king only 'wanax', and the Hittites 'the king of Ahhiyawa'. The chronicle does
# the same, and keeps Homer's heroes out of the facts. Facts follow the Hittite letters
# (Tawagalawa, Milawata, the Sausgamuwa treaty) as edited by Beckman, Bryce and Cline, the
# Linear B tablets of Pylos (Ventris and Chadwick), and the excavations at Mycenae, Pylos,
# Tiryns and Thebes, with modern work by Shelmerdine, Dickinson and Cline. Provinces stand
# for the palace states that the wanax of Mycenae led or dominated; benchmark_provinces
# counts those still standing at that date.
chapters:
  - id: myc_piyamaradu
    scenario: kadesh
    civ: mycenae
    year: -1251
    title: "A Letter from the Great King"
    place: "The palace of Mycenae"
    speaker: hatti
    speaker_name: "Hattusili III"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 6
    story: >-
      You are the wanax, the king, of Mycenae, first among the palace kings of the Achaeans.
      Your people hold Miletus - Millawanda, the Hittites call it - on the coast of Anatolia,
      and your ships trade and raid along that coast.


      A Hittite messenger has brought a long letter from the Great King Hattusili, who calls
      you 'my brother', as an equal: the only Greek king ever to be called so. A warlord
      named Piyamaradu has been raiding Hittite lands and carrying off thousands of people as
      slaves, and he shelters in Millawanda, where your governor is his son-in-law. Hattusili
      asks you, politely, to hand him over, or at least send him away. "Now that we have come
      to an agreement about Wilusa, over which we were at war," he writes, "let there be no
      bad feeling between us."
    choices:
      - label: "Reply politely, and do nothing"
        historical: true
        wealth_bp: 1000
        outcome: >-
          Piyamaradu sails off when the Hittite army comes near Millawanda, and comes back when
          it leaves. His raids go on for years. The Hittites keep his name in their archives;
          you keep his slaves.
        deeds: {grudges: {hatti: 1500}}
      - label: "Hand Piyamaradu over"
        legitimacy_bp: -500
        outcome: >-
          Piyamaradu is sent to Hattusa in chains. The Great King sends you a gift of fine
          linen, and your nobles mutter that you take orders from Anatolians.
    history: >-
      The 'Tawagalawa letter' (c. 1250 BC), probably from Hattusili III to the king of
      Ahhiyawa, asks for the surrender of Piyamaradu and mentions an earlier dispute over
      Wilusa. How the king of Ahhiyawa answered is not known; Piyamaradu was still active
      later.
    diverged: >-
      Hatti is gone; no Great King writes.
    sources: ["Tawagalawa letter (CTH 181)", "Beckman, Bryce and Cline, The Ahhiyawa Texts (2011)"]

  - id: myc_lion_gate
    scenario: kadesh
    civ: mycenae
    year: -1250
    title: "The Lion Gate"
    place: "The citadel of Mycenae"
    speaker: steward
    speaker_name: "Your master builder"
    speaker_title: "Of the palace workshops"
    benchmark_provinces: 6
    story: >-
      The citadel of Mycenae sits on a hill between two ravines, ringed by walls of stones so
      big that later Greeks will say only the one-eyed giants, the Cyclopes, could have moved
      them.


      Your master builder proposes to extend the walls to take in the old royal graves, and
      to make a new gate: two great uprights and a lintel of twenty tons, and over the lintel
      a triangle of stone carved with two lions standing on either side of a column. Every
      visitor will walk under them.
    choices:
      - label: "Build the Lion Gate"
        historical: true
        legitimacy_bp: 1500
        materials_bp: -1500
        outcome: >-
          The lions go up. Their heads, made separately, will be lost; their bodies are still
          there, the oldest large sculpture in Europe. Inside the new walls, the shaft graves
          of your ancestors become a sacred circle. Three thousand years later Heinrich
          Schliemann digs them up and finds a gold mask, and telegraphs that he has gazed on
          the face of Agamemnon. He has not: it is three hundred years too old.
      - label: "Spend it on ships"
        wealth_bp: -1000
        outcome: >-
          Twenty new ships are built at Nauplion. The old gate does well enough.
        deeds: {ships: 20}
    history: >-
      The Lion Gate and the western extension of Mycenae's walls, enclosing Grave Circle A,
      date to about 1250 BC.
    sources: ["Wace, Mycenae (1949)", "French, Mycenae: Agamemnon's Capital (2002)"]

  - id: myc_tablets
    scenario: kadesh
    civ: mycenae
    year: -1239
    title: "Counting Sheep"
    place: "The archive room, palace of Pylos"
    speaker: scholar
    speaker_name: "A palace scribe"
    speaker_title: "The 'Hand' of the sheep tablets"
    benchmark_provinces: 6
    story: >-
      Your palaces run on writing. Scribes record in Linear B - a script of syllables borrowed
      from the Minoans of Crete and bent to fit Greek - every sheep, every bronze-smith's ration
      of metal, every jar of perfumed oil sent to the gods, every slave woman and her
      children. They write on palm-sized tablets of clay, let them dry in the sun, and wipe
      them clean at the end of the year.


      Nobody writes anything else: no letters, no laws, no songs. The scribe asks whether the
      palace wants more of them trained.
    choices:
      - label: "Keep the scribes to the accounts"
        historical: true
        knowledge_bp: 500
        wealth_bp: 1000
        outcome: >-
          The accounts are perfect, and when the palaces burn, the fire bakes the last year's
          tablets hard. In 1952 an English architect, Michael Ventris, works out that they are
          Greek. They tell us how many sheep the wanax owned, and nothing at all about what he
          thought.
      - label: "Teach writing to the sons of the nobles"
        knowledge_bp: 1500
        influence: {nobility: 1000}
        outcome: >-
          A few nobles learn to sign their names in syllables, and one writes down a song.
      - label: "✦ Use the letters of the alphabet instead"
        needs_adopted: [alphabet]
        knowledge_bp: 4000
        legitimacy_bp: 500
        outcome: >-
          Twenty-odd signs instead of ninety. Within a generation merchants, potters and
          sailors can write, and the bards write their songs down.
    history: >-
      Linear B, used by Mycenaean palace scribes for administrative records, survives on clay
      tablets baked when the palaces burned; Michael Ventris deciphered it as Greek in 1952.
    sources: ["Ventris and Chadwick, Documents in Mycenaean Greek (1973)", "Shelmerdine, ed., Cambridge Companion to the Aegean Bronze Age (2008)"]

  - id: myc_millawanda
    scenario: kadesh
    civ: mycenae
    year: -1230
    title: "The Borders of Millawanda"
    place: "Miletus"
    speaker: steward
    speaker_name: "Your governor in Millawanda"
    speaker_title: "On the Anatolian coast"
    needs_alive: [hatti]
    benchmark_provinces: 5
    story: >-
      The new Great King of Hatti, Tudhaliya IV, is not as polite as his father. His army has
      come down to the coast. His vassals have restored the deposed king of Wilusa, and the
      Hittites are drawing new borders for Millawanda.


      Your governor writes that he cannot hold the town against the Hittite army. He can make
      his peace with the Great King, and keep his house, if you let him go.
    choices:
      - label: "Let Millawanda go"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Millawanda goes over to the Hittites. A few years later, when Tudhaliya makes a
          treaty with the king of Amurru, his scribe lists the great kings who are his equals:
          Egypt, Babylon, Assyria, and Ahhiyawa - and then rubs out Ahhiyawa.
        deeds: {give: [myc_millawanda], give_to: hatti}
      - label: "Send ships and men to hold it"
        materials_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your ships reach Millawanda. The Hittites stop at the hills behind it, and the Great
          King writes to his vassals that Ahhiyawa is now his enemy.
        deeds: {men: 2000, grudges: {hatti: 3000}}
    history: >-
      The Milawata letter (c. 1235 BC) shows Millawanda under Hittite control and Walmu of
      Wilusa being restored; in the Sausgamuwa treaty (c. 1225) the 'king of Ahhiyawa' is
      erased from the list of great kings.
    diverged: >-
      Hatti is gone.
    sources: ["Milawata letter (CTH 182)", "Sausgamuwa treaty (CTH 105)", "Beckman, Bryce and Cline, The Ahhiyawa Texts (2011)"]

  - id: myc_walls
    scenario: kadesh
    civ: mycenae
    year: -1209
    title: "Water Under the Walls"
    place: "The citadel of Mycenae"
    speaker: general
    speaker_name: "Commander of the citadel"
    speaker_title: "Mycenae"
    benchmark_provinces: 4
    story: >-
      Something is wrong. The palace of Thebes has burned, nobody is quite sure by whose hand.
      The trade from the east is thinner each year. There have been earthquakes, and in the
      north there are rumours of raiders.


      Your commander wants to make Mycenae ready for a siege: a tunnel cut through the rock
      under the walls, down a hundred steps to a hidden cistern fed from a spring, so the
      citadel will never run out of water. At Corinth, the other palaces are talking about a
      wall across the Isthmus, to stop whatever is coming from the north.
    choices:
      - label: "Cut the tunnel, and build the Isthmus wall"
        historical: true
        materials_bp: -2000
        unrest_bp: 1000
        legitimacy_bp: 500
        outcome: >-
          The tunnel and its cistern are finished; you can still walk down them by torchlight.
          At Tiryns and Athens the citadels dig for water too. The Isthmus wall is begun.
          Nobody knows if it was ever finished.
        deeds: {martial_bp: 500, give: [myc_thebes]}
      - label: "Send to the east for grain and copper instead"
        wealth_bp: -2000
        food_bp: 1500
        outcome: >-
          Your ships come back with Cypriot copper and Egyptian grain, and fewer of them come
          back each voyage.
        deeds: {give: [myc_thebes]}
    history: >-
      Around 1200 BC Mycenae, Tiryns and Athens secured hidden water supplies; a wall may have
      been built across the Isthmus. Thebes's palace was destroyed in the later 13th century.
    sources: ["Mylonas, Mycenae and the Mycenaean Age (1966)", "Dickinson, The Aegean from Bronze Age to Iron Age (2006)"]

  - id: myc_pylos
    scenario: kadesh
    civ: mycenae
    year: -1180
    title: "Watchers on the Coast"
    place: "The palace of Pylos"
    speaker: scholar
    speaker_name: "The scribes of Pylos"
    speaker_title: "Writing in haste"
    benchmark_provinces: 3
    story: >-
      At Pylos, in the west, the scribes are writing tablets nobody has written before. Rowers
      are to go to Pleuron. 'Watchers are guarding the coast': ten groups of them, with their
      officers, along the whole shore. The temples are to give up their bronze, to be made
      into spear-points and javelins.


      The wanax of Pylos asks Mycenae for help. Nobody has said who the enemy is.
    choices:
      - label: "Each palace must look to itself"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          That spring, Pylos burns. The fire bakes the last tablets, still listing the
          watchers. Within a generation Mycenae and Tiryns burn too, the palaces are not
          rebuilt, and writing is forgotten in Greece for four hundred years, until the Greeks
          borrow an alphabet from the Phoenicians and write down Homer.
        deeds: {give: [myc_pylos]}
      - label: "Send ships and men to Pylos"
        materials_bp: -2000
        outcome: >-
          Your ships find the raiders' fleet off the Messenian coast. Pylos holds, this year.
        deeds: {men: 3000}
    history: >-
      The last Linear B tablets from Pylos record rowers, 'watchers guarding the coast' and
      the collection of temple bronze for weapons; the palace was destroyed by fire around
      1180 BC, as the Mycenaean palace system collapsed.
    sources: ["Pylos tablets An 1, An 657, Jn 829", "Chadwick, The Mycenaean World (1976)", "Cline, 1177 BC (2014)"]
