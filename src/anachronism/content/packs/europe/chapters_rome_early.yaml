schema_version: 1
# Chronicle mode (D-120, D-XXX): the Roman Republic before the Punic wars, from the Latin
# settlement to the surrender of Tarentum, 336-272 BC. Rome had no king and no single ruler:
# two consuls a year, a Senate, censors, dictators in emergencies. So the "ruler" here is the
# leading magistrate of each crisis (Furius Camillus, Postumius, Appius Claudius, Valerius
# Corvus, Fabius Rullianus, Hortensius, Laevinus, Appius Claudius again, Curius Dentatus,
# Papirius Cursor), not a continuous reign; each leaves office in the chapter's outcome.
# Dates are the traditional Roman ones (Livy's), several of which are doubtful by a year or
# two before 300; the Hortensian law (c. 287) and Hortensius's death in office are
# approximate. The settlement with the Latins belongs to 338-337, two years before the
# scenario opens; the first chapter shows it still being applied. Facts follow Livy 8-10
# and the Periochae, Diodorus 20, Plutarch's Pyrrhus, Dionysius of Halicarnassus, Appian,
# Cassius Dio/Zonaras 8, Pliny the Elder and Aulus Gellius, with modern work by Cornell,
# Forsythe and Oakley. benchmark_provinces counts the provinces of this map the real Rome
# held at that date. This is a different chronicle from the Punic Wars one (chapters_rome).
chapters:
  - id: rome_latins
    scenario: alexander
    civ: rome
    year: -336
    title: "The Settlement of Latium"
    place: "The Senate house, Rome"
    speaker: steward
    speaker_name: "A senator"
    speaker_title: "Of the old families"
    benchmark_provinces: 2
    story: >-
      You are Lucius Furius Camillus. Two summers ago you and your fellow consul Gaius Maenius
      beat the Latins, your own cousins in language and religion, who had long fought beside
      Rome and now wanted equal shares of everything. The Latin League is finished, and the
      Senate is still deciding what to do with each of its cities.


      Some senators want to punish them all. Others want no Latin city to be left with a
      grievance. The cities of Campania, who sent their knights to your side, are waiting to
      hear what they have won.
    choices:
      - label: "Treat each city on its merits"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Lanuvium, Aricia, Nomentum and Pedum are made Roman citizens. Tibur and Praeneste
          lose land and may not make treaties among themselves. Antium is forbidden the sea,
          its warships are burned, and their bronze beaks are fixed to the speakers' platform
          in the Forum, which is called the Rostra from then on. The Campanian knights are made
          citizens without the vote. Latium does not rise against Rome again.
        deeds: {ruler_falls: "lays down his office at the end of his term", take: [a3_campania]}
      - label: "Keep the Latin League, with Rome at its head"
        unrest_bp: 500
        outcome: >-
          The League is allowed to go on meeting. Its cities go on thinking that they, and not
          Rome, ought to be the equals of one another.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
      - label: "Break every Latin city that rose against you"
        unrest_bp: 1000
        legitimacy_bp: -500
        outcome: >-
          Walls are pulled down and senators sent away across the Tiber. The cities that were
          spared, and those that were not, remember it.
        deeds: {ruler_falls: "lays down his office at the end of his term", take: [a3_campania]}
    history: >-
      After the Latin War Rome dissolved the Latin League (338-337 BC) and gave each city its own
      terms, Roman citizenship to some, and partial citizenship to the Campanian knights;
      Antium's ships were taken and their beaks displayed in the Forum.
    sources: ["Livy 8.13-14", "Cornell, The Beginnings of Rome (1995)"]

  - id: rome_caudine
    scenario: alexander
    civ: rome
    year: -321
    title: "The Caudine Forks"
    place: "A mountain pass near Caudium, in Samnium"
    speaker: general
    speaker_name: "Titus Veturius Calvinus"
    speaker_title: "Your fellow consul"
    benchmark_provinces: 2
    story: >-
      You are Spurius Postumius Albinus, consul. A Samnite shepherd told your scouts that the
      Samnite army was far off in Apulia, besieging Luceria. It was a trick. You marched your
      two legions into a valley with one narrow gap at each end, and when you reached the
      second gap it was blocked with felled trees and rocks, and the first was closed
      behind you.


      The Samnite general, Gavius Pontius, did not attack. He asked his father Herennius what
      to do. The old man's advice, as Livy tells it, was to let every Roman go home
      unharmed, as friends, or else kill every one of them. Pontius did neither. His terms are
      these: the Romans will leave their arms, go under the yoke, withdraw their colonies and
      make peace.
    choices:
      - label: "Accept the terms, and make the treaty"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          You and your officers swear to the treaty and give six hundred knights as hostages.
          The army walks under the yoke in its tunics, between the Samnite spears, and the
          country people come out to jeer. At Rome the city goes into mourning. The Senate
          then refuses to accept the peace: you and the other officers who swore it are sent
          back to Pontius, who refuses to take you. The war goes on, and the Romans never go
          into that kind of country again without scouting every mile.
        deeds: {ruler_falls: "lays down his office at the end of his term", martial_bp: 1000}
      - label: "Break out and fight"
        legitimacy_bp: -1000
        outcome: >-
          Your men are packed in a ravine with nowhere to form a line. You fight until
          you cannot, and the Samnites put the survivors to the sword.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      In 321 BC (Livy's date) two Roman armies were trapped by the Samnites at the Caudine
      Forks and sent under the yoke; the Senate disowned the treaty that the consuls had sworn.
    sources: ["Livy 9.1-12", "Oakley, Commentary on Livy 6-10 (1998)"]

  - id: rome_appia
    scenario: alexander
    civ: rome
    year: -312
    title: "The Road and the Water"
    place: "The Forum, Rome"
    speaker: steward
    speaker_name: "Gaius Plautius"
    speaker_title: "Your fellow censor"
    benchmark_provinces: 2
    story: >-
      You are Appius Claudius, censor, of the old patrician family whose men have always been
      proud. A censor's office, by law, runs for eighteen months. Your colleague Gaius Plautius
      says that is enough.


      You want to build something to last. A road from Rome to Capua, straight and paved,
      so that legions can reach Campania in a few days instead of weeks. And a channel to bring
      spring water into the city from eleven miles away, nearly all of it underground, out of
      reach of enemy armies. The money is there. The year and a half is not.
    choices:
      - label: "Stay in office and build both"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 1000
        influence: {nobility: -500}
        outcome: >-
          Plautius resigns, ashamed. You stay. The Appian Way runs south out of the Porta
          Capena, and the Aqua Appia carries the first piped water Rome has ever had. You
          also put the sons of freed slaves into the Senate lists, to the horror of the
          nobles, who undo it two years later. The road and the water are called after you
          for centuries; the censors who followed you were afraid to try the same.
        deeds: {ruler_falls: "lays down his office at the end of his term", martial_bp: 500}
      - label: "Resign with Plautius after eighteen months"
        legitimacy_bp: 500
        outcome: >-
          You obey the law, and the work is left to censors who may or may not want it.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      The censor Appius Claudius Caecus, in 312 BC, began the Via Appia and the Aqua Appia, and
      kept his office beyond the legal eighteen months.
    sources: ["Livy 9.29-30", "Diodorus 20.36", "Frontinus, De aquaeductu 5"]

  - id: rome_ogulnian
    scenario: alexander
    civ: rome
    year: -300
    title: "Priests for the People"
    place: "The Forum"
    speaker: steward
    speaker_name: "The tribunes Quintus and Gnaeus Ogulnius"
    speaker_title: "Brothers"
    benchmark_provinces: 2
    story: >-
      You are Marcus Valerius Corvus, consul. Everything that touches the gods is run by
      patricians: the pontiffs, who keep the calendar and the law, and the augurs, who
      say whether the gods approve. Plebeians can be consul, dictator and censor, but they may
      not read the omens.


      The tribunes Ogulnius propose to add four pontiffs and five augurs, all of them
      plebeians. Appius Claudius, now old, will oppose it in the Forum; Publius Decius Mus,
      the plebeian whose father died for Rome, will answer him.
    choices:
      - label: "Let the plebeians into the priesthoods"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        influence: {clergy: -500, nobility: -500}
        outcome: >-
          The law passes. The gods, to everyone's surprise, raise no objection. Within a few
          years plebeians hold every great office of the state, and the old families have only
          their names left to be proud of. In the same year you carry a law that no
          magistrate may flog or behead a citizen who appeals to the people.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
      - label: "Keep the priesthoods for the patricians"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          The tribunes wait. The plebeians remember.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      The Ogulnian law (300 BC) opened the colleges of pontiffs and augurs to plebeians, and
      the consul Valerius Corvus renewed the right of appeal to the people.
    sources: ["Livy 10.6-9", "Cornell, The Beginnings of Rome (1995)"]

  - id: rome_sentinum
    scenario: alexander
    civ: rome
    year: -295
    title: "Sentinum"
    place: "A plain in Umbria"
    speaker: general
    speaker_name: "Publius Decius Mus"
    speaker_title: "Your fellow consul"
    benchmark_provinces: 2
    story: >-
      You are Quintus Fabius Maximus Rullianus, five times consul, an old man who has
      fought the Samnites since you were young. Now the Samnites, the Gauls, the Etruscans and
      the Umbrians have joined together, and the army facing you across the plain at
      Sentinum is as big as any Rome has met.


      You command the right, Decius the left. The Gauls fight from chariots, and the
      noise of them frightens Roman horses. You could throw your men at the enemy at
      once. Or you could keep them back, and let the Samnites and Gauls use up their
      strength first, since the Gauls are quick to start and quick to tire.
    choices:
      - label: "Hold back, and let them tire"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          On the left, Decius charges early, and his horse is scattered by the Gallic
          chariots. His line wavers. He asks the pontiff to teach him the words, and then
          rides alone into the enemy, having given himself and the enemy army to the gods
          below. The legions hold. Then you advance and the Samnites break, and the Gauls
          are caught between you. Livy puts the enemy dead at twenty-five thousand. After
          this the alliance that threatened Rome falls apart.
        deeds: {ruler_falls: "lays down his office at the end of his term", martial_bp: 1000}
      - label: "Attack at once, with both wings"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Your men, tired by the march, meet an enemy ready for them, and the battle swings
          back and forth until nightfall without a decision.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      The Romans under Fabius Rullianus and Decius Mus beat the Samnites and Gauls at Sentinum
      (295 BC); Decius died after devoting himself to the gods below.
    sources: ["Livy 10.27-30", "Oakley, Commentary on Livy 6-10 (1998)"]

  - id: rome_hortensia
    scenario: alexander
    civ: rome
    year: -287
    title: "The Plebeians on the Janiculum"
    place: "The Janiculum hill"
    speaker: steward
    speaker_name: "The leaders of the plebeians"
    speaker_title: "In their camp across the Tiber"
    benchmark_provinces: 3
    story: >-
      You are Quintus Hortensius, made dictator in an emergency. Samnium has been beaten for
      good, but the war has left the poor of Rome in debt to the rich, and the plebeians have
      left the city and camped on the Janiculum hill, refusing to work or serve.


      They have the law that plebeians may be consul and priest. What they want is that a
      resolution of their own assembly should bind the whole people, without needing the
      consent of the Senate. A dictator can pass a law, and no one can appeal against one.
    choices:
      - label: "Make their resolutions law for everyone"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -2000
        influence: {nobility: -500}
        outcome: >-
          The law passes, and the plebeians come home. From now on the assembly of the
          plebeians can pass laws that bind patrician and plebeian alike, and the long quarrel
          between the orders, which began two hundred years ago, is over. Later writers say you
          died in office that year, and were given a funeral at public cost.
        deeds: {ruler_falls: "lays down his office at the end of his term", take: [a3_samnium]}
      - label: "Relieve their debts, but keep the Senate's veto"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Some debts are eased. The plebeians return, and are back within a few years.
        deeds: {ruler_falls: "lays down his office at the end of his term", take: [a3_samnium]}
    history: >-
      Around 287 BC a secession of the plebs over debt ended with the dictator Quintus Hortensius
      passing the lex Hortensia, making plebiscites binding on all citizens. Later writers say
      he died in office.
    sources: ["Livy, Periochae 11", "Pliny, Natural History 16.37", "Aulus Gellius 15.27", "Gaius, Institutes 1.3"]

  - id: rome_heraclea
    scenario: alexander
    civ: rome
    year: -280
    title: "The River Siris"
    place: "The banks of the Siris, near Heraclea"
    speaker: general
    speaker_name: "Your scouts"
    speaker_title: "Just back from the king's camp"
    needs_alive: [epirus]
    benchmark_provinces: 3
    story: >-
      You are Publius Valerius Laevinus, consul. The Tarentines have hired King Pyrrhus of
      Epirus, a cousin of Alexander the Great, and he has crossed with twenty-odd thousand men
      and some elephants, which no Roman has ever seen. Your colleague, Tiberius Coruncanius,
      is in Etruria with the other army.


      Pyrrhus has captured some of your scouts, shown them his camp and his troops, and let
      them go, to tell you what you are facing. They say it is a great deal. He is across the
      river Siris. You could wait for your colleague. You could cross now.
    choices:
      - label: "Cross the river and fight"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Seven times the Romans and the Greeks drive each other back. Then Pyrrhus brings up
          his elephants, and your horses bolt, and the day is his. The dead are many on both
          sides, and more of them are yours. But Pyrrhus loses his best officers, and Rome
          calls up the men to replace the army you lost.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
      - label: "Wait for Coruncanius"
        legitimacy_bp: 500
        outcome: >-
          You fall back, joined by the other consul, and make Pyrrhus come to you. He is
          pleased to.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      Pyrrhus beat the consul Laevinus at Heraclea in 280 BC, in his first battle in Italy, using
      elephants; his own losses were heavy.
    diverged: >-
      Epirus has no king to bring across the sea.
    sources: ["Plutarch, Pyrrhus 15-17", "Dionysius of Halicarnassus 19.11-14"]

  - id: rome_speech
    scenario: alexander
    civ: rome
    year: -279
    title: "A Blind Man in the Senate"
    place: "The Senate house"
    speaker: epirus
    speaker_name: "Cineas"
    speaker_title: "Envoy of Pyrrhus"
    needs_alive: [epirus]
    benchmark_provinces: 3
    story: >-
      You are Appius Claudius, called Caecus, the Blind, who built the road and the aqueduct
      thirty-three years ago. You have long been too blind to attend the Senate. Cineas, the
      king's envoy, a pupil of Demosthenes, has been among the senators with gifts for them
      and their wives, and with the king's terms: leave the Greek cities of Italy alone,
      restore what you took from the Samnites and the Lucanians, and Pyrrhus will be your
      friend.


      The Senate is close to agreeing. Your sons carry you in on a chair.
    choices:
      - label: "Say that Rome makes no peace while Pyrrhus is in Italy"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          They listen, and the Senate votes to say that Pyrrhus must leave Italy first. Cineas
          goes home and tells the king that the Senate seemed to him an assembly of kings.
          Plutarch tells how the envoy Gaius Fabricius refused the gold Pyrrhus offered,
          and how the war went on to a second battle at Asculum, where Pyrrhus won again.
        deeds: {ruler_falls: "lays down his office at the end of his term", martial_bp: 500}
      - label: "Accept the king's terms"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          The Greeks of Italy keep their king, and Rome keeps what she held before. In every
          Italian town, people ask whether Rome was ever the master.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      After Heraclea Pyrrhus's envoy Cineas offered terms in Rome (winter of 280-279 BC); the
      aged Appius Claudius Caecus persuaded the Senate to refuse while Pyrrhus remained in Italy.
    diverged: >-
      Epirus has no king to bring across the sea.
    sources: ["Plutarch, Pyrrhus 18-20", "Appian, Samnite History 10", "Cicero, Cato Maior 16"]

  - id: rome_beneventum
    scenario: alexander
    civ: rome
    year: -275
    title: "Beneventum"
    place: "A hill camp near Maleventum, in Samnium"
    speaker: general
    speaker_name: "Your tribunes"
    speaker_title: "Watching the hills"
    benchmark_provinces: 3
    story: >-
      You are Manius Curius Dentatus, consul. You have beaten the Samnites before, and the
      Sabines, and you are known for living on turnips and having refused a gift of gold. Pyrrhus
      has come back from Sicily with the army he took there, and is camped near Maleventum, and
      his Samnite scouts say he will attack your camp by night.


      Your other consul, Lentulus, is far away in Lucania. You have the hills, and a camp on
      ground the elephants find hard to reach.
    choices:
      - label: "Stay on the hills and fight where he finds you"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The king's night march loses its way in the woods and the torches burn out, and dawn
          finds him under your camp. The elephants come up, and your javelins and burning
          missiles drive them back. A wounded young one, says Plutarch, cries out and its
          mother turns to find it, and the herd tramples its own side. Pyrrhus leaves Italy
          within the year, and the Romans change the name of the place to Beneventum. You
          are given a triumph in which, later writers say, elephants are seen in Rome for the
          first time.
        deeds: {ruler_falls: "lays down his office at the end of his term", martial_bp: 500}
      - label: "Refuse battle, and wait behind your ramparts"
        legitimacy_bp: -500
        outcome: >-
          Pyrrhus waits, then moves on, and tells the world that the Romans would not meet
          him.
        deeds: {ruler_falls: "lays down his office at the end of his term"}
    history: >-
      Manius Curius Dentatus beat Pyrrhus near Maleventum (Beneventum) in 275 BC; Pyrrhus left
      Italy soon afterwards, leaving a garrison in Tarentum.
    diverged: >-
      Epirus has no king to bring across the sea.
    sources: ["Plutarch, Pyrrhus 24-25", "Eutropius 2.14", "Pliny, Natural History 8.16"]

  - id: rome_tarentum
    scenario: alexander
    civ: rome
    year: -272
    title: "The Fall of Tarentum"
    place: "Tarentum"
    speaker: general
    speaker_name: "The garrison commander"
    speaker_title: "Milo, left by Pyrrhus"
    benchmark_provinces: 4
    story: >-
      You are Lucius Papirius Cursor, consul, son of the great general of the Samnite wars.
      Pyrrhus has died at Argos in Greece; the garrison he left in Tarentum has no king to
      obey and no money. Its commander Milo has been pressed from both sides, by the
      Tarentines, and by you, and is willing to give up the citadel and sail home.


      The richest city of the Greek west is yours to deal with. The Tarentines have
      called a foreign king into Italy and caused you ten years of trouble.
    choices:
      - label: "Let them keep their freedom, but take their arms and ships"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        outcome: >-
          Milo leaves the citadel with the king's men. The Tarentines pay a tribute, give up
          their warships and weapons, and the walls are pulled down; and they keep their own
          laws as allies of Rome. The rest of the south follows. Rome now holds all of Italy
          from the Po plains to the toe of the peninsula, as allies, colonies and subjects, and
          has something no city of Latium had before: neighbours across the sea.
        deeds: {take: [a3_magna_graecia]}
      - label: "Sack the city"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          The treasures of Tarentum come to Rome, and every Greek city of the south sees
          what to fear. They fight on.
        deeds: {take: [a3_magna_graecia]}
    history: >-
      Tarentum surrendered to Rome in 272 BC after Pyrrhus's death, on terms: it kept self-rule
      but gave up its arms and fleet and had its walls pulled down. Rome was then master of the Italian
      peninsula south of the Po plains.
    sources: ["Zonaras 8.6", "Livy, Periochae 14", "Cornell, The Beginnings of Rome (1995)"]
