schema_version: 1
# Chronicle mode (D-120, D-XXX): Sparta from the League of Corinth to Pyrrhus' attack,
# 336-272 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Diodorus 16-20, Arrian 2, Curtius 4 and 6, Justin, Livy 10,
# Plutarch's Pyrrhus, Agesilaus and Agis-Cleomenes, Polybius 9 and Pausanias 1 and 3, with
# modern work by Cartledge and Spawforth (Hellenistic and Roman Sparta), Badian and Bosworth.
# Sparta had two kings at once; the ruler in each chapter is the king whose story it tells:
# Agis III (Eurypontid, to his death at Megalopolis in 331), Eudamidas I (Eurypontid,
# to about 305), Archidamus IV (Eurypontid, to about 275) and Areus I (Agiad, from 309; the
# player takes the role in 275, which is a simplification). Reign dates after Agis III are
# approximate and come from the usual king-lists. benchmark_provinces counts the provinces
# of this map the real Sparta held at that date: it is one (Laconia), since Philip gave
# border lands to Sparta's neighbours in 338 and Messenia was free.
chapters:
  - id: spaa_league
    scenario: alexander
    civ: sparta
    year: -336
    title: "Sparta Stands Alone"
    place: "The Assembly of Sparta"
    speaker: steward
    speaker_name: "An ephor"
    speaker_title: "Magistrate of Sparta"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Agis III, king of Sparta. Two years ago, on the same day as the battle of
      Chaeronea, according to some, your father Archidamus died fighting in Italy for
      Tarentum, and his army was beaten. Philip of Macedon then marched
      into Laconia and cut away Sparta's borderlands, giving them to Argos, Tegea, Megalopolis
      and Messene. You did not fight him, and you did not bow to him.


      Philip has now been murdered, and his son Alexander is calling the Greeks to Corinth to
      confirm him as leader against Persia. Almost every state of Greece has sent envoys, and Sparta has not.
      Your elders say that Sparta has always led and never followed.
    choices:
      - label: "Send no envoys, and keep Sparta out of the League"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 300
        outcome: >-
          Sparta stays out of the League of Corinth and out of the Persian war. Plutarch's
          collections of Spartan sayings have a story that when Philip threatened, "If I enter
          Laconia, I will raze Sparta", the Spartans replied with a single word: "If". Alexander
          leaves you alone for now, since he has Persia to deal with. But Sparta is poor,
          has few citizens, and is isolated.
        deeds: {grudges: {macedon: 500}}
      - label: "Send envoys to Corinth and join the League"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          You are one voice among the Greek states and the borderlands will not come back. The
          old men say that Lycurgus never meant Spartans to do as they were told.
    history: >-
      Sparta alone refused to take part in the League of Corinth, first under Philip in
      338-337 BC, and then under Alexander in 336.
    diverged: >-
      Macedon is gone.
    sources: ["Justin 9.5", "Polybius 9.28", "Diodorus 16.88", "Plutarch, Camillus 19", "Cartledge and Spawforth (2002)"]

  - id: spaa_siphnos
    scenario: alexander
    civ: sparta
    year: -333
    title: "Persian Gold at Siphnos"
    place: "The island of Siphnos"
    speaker: general
    speaker_name: "Pharnabazus"
    speaker_title: "Persian admiral"
    needs_alive: [persia]
    benchmark_provinces: 1
    story: >-
      You are Agis III. Alexander is in Asia, and the Persian fleet commands the Aegean. You
      have sailed on a single trireme to the island of Siphnos to speak to its admirals,
      Pharnabazus and Autophradates, and to ask them for money and ships to raise the
      Peloponnese against Macedon.


      While you are with them, word comes that Darius has been beaten at Issus. The admirals,
      who were willing a day ago, are now afraid. Eight thousand Greek mercenaries who got
      out of the battle are making their way to Crete.
    choices:
      - label: "Take what Persia will give, and prepare a war"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Arrian says that Pharnabazus gave you thirty talents and ten triremes, and that you
          the ships went to your brother Agesilaus in Crete. Diodorus
          says that you then took command of the mercenaries from Issus, and made Crete yours. It is not much. But it is
          more than anyone else in Greece has.
        deeds: {men: 2000, martial_bp: 500}
      - label: "Refuse Persian gold, and wait"
        legitimacy_bp: 500
        outcome: >-
          Sparta does not take money from the Great King, whom Agesilaus once fought. You
          are poorer and safer, for a while.
    history: >-
      In 333 BC Agis III asked the Persian admirals for help; they gave him money and ships
      after Issus, and he took Crete and the mercenaries.
    diverged: >-
      Persia is gone.
    sources: ["Arrian 2.13", "Curtius 4.1", "Diodorus 17.48"]

  - id: spaa_megalopolis
    scenario: alexander
    civ: sparta
    year: -331
    title: "Megalopolis"
    place: "Before Megalopolis, Arcadia"
    speaker: general
    speaker_name: "Your Spartan officer"
    speaker_title: "At the king's side"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Agis III. For two years you have been raising Greeks against Macedon. Alexander
      has gone to Mesopotamia, and his regent in Europe, Antipater, is busy in Thrace. You
      have the Eleans, the Achaeans (but not Athens) and the mercenaries, a Greek army of
      some twenty thousand. You have beaten a Macedonian general, and now you are besieging
      Megalopolis, the Arcadian city that has stood by Macedon.


      Antipater has settled the north, and is marching south with forty thousand men. If you
      stay he will pin you against the walls of Megalopolis.
    choices:
      - label: "Stand and fight before the walls"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          Your men fight with great courage. Diodorus says that when you were wounded
          you were carried from the field, and that you rose and fought on one knee until a
          javelin killed you. Plutarch says that when Alexander heard,
          he called it a battle of mice. Sparta's rising is over.
        deeds: {ruler_falls: "is killed at Megalopolis", martial_bp: -1500}
      - label: "Withdraw to Laconia and let Antipater come to you"
        legitimacy_bp: -500
        outcome: >-
          The siege is lifted. Your allies drift home, and the Macedonians ravage what they like.
    history: >-
      Agis III was defeated and killed at Megalopolis in 331 BC (or 330), fighting Antipater.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 17.62-63", "Curtius 6.1", "Plutarch, Agesilaus 15", "Badian, Alexander the Great (2012)"]

  - id: spaa_hostages
    scenario: alexander
    civ: sparta
    year: -330
    title: "The Price of the Rising"
    place: "Sparta"
    speaker: steward
    speaker_name: "An elder"
    speaker_title: "Of the Gerousia"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Eudamidas I, who has taken the Eurypontid throne after Agis' death. Sparta has
      lost the flower of the army, and its allies. Antipater has won, and says he will march into Laconia unless Sparta pays for
      the rising. Curtius says he asks for fifty
      noble boys as hostages.


      The elders cannot say no. Some of them say that nobody can dictate to Sparta. The only man
      who can really decide is Alexander himself, far off in Asia.
    choices:
      - label: "Send envoys to Alexander and the League, and yield what they ask"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          The matter is sent to Alexander, who passes it back to the council of the League
          at Corinth. Diodorus tells how Sparta's envoys went to Asia, and that the settlement
          was a mild one. Sparta keeps its land and its laws.
        deeds: {grudges: {macedon: 500}}
      - label: "Refuse any terms, and defend the passes"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          The elders say that Spartans do not give hostages. The Macedonians have forty
          thousand men.
    history: >-
      After Agis' defeat, Sparta sent envoys to Alexander, who referred the matter to the League
      of Corinth. The settlement was mild, and Sparta kept its land.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 17.73", "Curtius 6.1.19-20"]

  - id: spaa_acrotatus
    scenario: alexander
    civ: sparta
    year: -314
    title: "A Prince Sails Without Leave"
    place: "Gytheion"
    speaker: steward
    speaker_name: "An ephor"
    speaker_title: "Magistrate of Sparta"
    benchmark_provinces: 1
    story: >-
      You are Eudamidas I. The people of Acragas in Sicily, afraid of Agathocles of Syracuse,
      have sent to Sparta for a general, as Greek cities always do. Acrotatus, the elder son of
      Cleomenes II, your fellow king, wants to go. The ephors have said no.


      Acrotatus is a proud young man, and he has a ship. He says that Sparta ought not to let
      the Greeks of the west be eaten by tyrants and Carthaginians.
    choices:
      - label: "Let him go, but without the city's blessing"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Diodorus says Acrotatus sailed without the consent of the ephors. At Acragas he made
          himself hated by his haughtiness and his luxury and, Diodorus says, by a treacherous
          murder, and he left in disgrace. The Greeks of the west will turn to
          Sparta again, and be disappointed again.
      - label: "Forbid it, and lay up the ship"
        legitimacy_bp: 500
        outcome: >-
          Acrotatus stays at home, and sulks. Acragas finds some other general.
    history: >-
      In about 314 BC Acrotatus, son of Cleomenes II, went to Acragas against the wishes of the
      ephors, behaved badly, and came home.
    sources: ["Diodorus 19.70-71"]

  - id: spaa_areus
    scenario: alexander
    civ: sparta
    year: -309
    title: "Cleonymus Is Passed Over"
    place: "The Gerousia"
    speaker: steward
    speaker_name: "An elder"
    speaker_title: "Of the Gerousia"
    benchmark_provinces: 1
    story: >-
      You are Eudamidas I. Cleomenes II, king of the Agiad house for sixty years, has died. His
      elder son Acrotatus, who sailed to Sicily, is dead before him; Acrotatus's son Areus is
      a boy. Cleomenes' younger son Cleonymus, a grown man, a soldier, and in your eyes a
      bully, is certain that the crown is his.


      The elders have to name the king. Plutarch says that the Spartans passed Cleonymus over
      because of his violence, and that he never forgave it.
    choices:
      - label: "Make the boy Areus king"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Areus becomes king of the Agiad house, and will rule for forty-four years. Cleonymus
          nurses his grudge, and will take it abroad, and, in the end, back to the walls of
          Sparta, with an Epirote king at his side.
      - label: "Make Cleonymus king"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Cleonymus is a good soldier, and the elders are sure of it. Sparta has a king it does
          not quite trust.
    history: >-
      On the death of Cleomenes II in 309 BC, Areus I, his grandson, became king and Cleonymus was
      passed over.
    sources: ["Plutarch, Pyrrhus 26", "Pausanias 3.6", "Cartledge and Spawforth (2002)"]

  - id: spaa_cleonymus
    scenario: alexander
    civ: sparta
    year: -303
    title: "Tarentum Calls for a General"
    place: "Taenarum"
    speaker: general
    speaker_name: "Cleonymus"
    speaker_title: "Son of Cleomenes II"
    benchmark_provinces: 1
    story: >-
      You are Archidamus IV, king of Sparta, a young man who has taken the Eurypontid throne
      after Eudamidas I. Tarentum, the colony for which your grandfather died, is at war with
      the Lucanians and calls on Sparta again for a general. Cleonymus, uncle of your fellow king Areus, offers to
      go. He has been raising mercenaries at Taenarum, the cape where soldiers for hire come
      together.


      You know why he wants to go. A man with an army abroad does not need Sparta's leave.
    choices:
      - label: "Let him raise his mercenaries and sail"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Diodorus says Cleonymus did sail, with a mercenary army raised at Taenarum, and held
          Metapontum. Livy has him raiding in the Adriatic around 302, as far as the territory
          of Patavium, where he was driven off. Diodorus has him seize Corcyra as well.
          He is a conqueror, but not for Sparta.
      - label: "Refuse, and keep Sparta's men at home"
        legitimacy_bp: 500
        outcome: >-
          Tarentum finds another general, and Cleonymus finds another cause. Sparta has few men.
    history: >-
      In about 303 BC Cleonymus took mercenaries to Italy for Tarentum, later raiding the
      Adriatic coast and holding Corcyra.
    sources: ["Diodorus 20.104-105", "Livy 10.2", "Cartledge and Spawforth (2002)"]

  - id: spaa_pyrrhus
    scenario: alexander
    civ: sparta
    year: -272
    title: "Archidamia and the Women"
    place: "The ditch before Sparta"
    speaker: general
    speaker_name: "Acrotatus"
    speaker_title: "Your son"
    needs_alive: [epirus]
    benchmark_provinces: 1
    story: >-
      You are Areus I, king of Sparta, and you are at sea, coming home from Crete with two
      thousand men. Pyrrhus of Epirus, with twenty-five thousand men and twenty-four elephants, has
      marched into Laconia with Cleonymus beside him, who says Sparta is his by right. The story you have heard is that he was
      sure he would take it without a blow.


      The Spartans have no army and no walls. The elders voted to send the women to Crete. Then Archidamia, the old
      woman, came into the Gerousia with a sword and said that the women had not come to live
      when Sparta was lost. They dug a ditch outside the city and sunk wagons in it. The young
      men are fighting in the dark at it; and your son Acrotatus is among them.
    choices:
      - label: "Land at Gytheion and march in at once"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -1000
        outcome: >-
          Plutarch says the women dug the trench, and the elephants and the men of Pyrrhus could not get
          across it; the Spartans held for two days. You come in with your men, and with
          Ameinias's mercenaries from Corinth, and then Pyrrhus draws off for Argos, where he will be
          killed that year by a tile thrown from a rooftop.
        deeds: {martial_bp: 500}
      - label: "Wait in Crete for more ships"
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          Your son and the women hold the ditch until dawn, and then without you it will be
          hard to hold any longer.
    history: >-
      In 272 BC Pyrrhus attacked Sparta with Cleonymus; the Spartans held a trench through the night
      under Acrotatus, with Archidamia and the women helping, until Areus, and mercenaries from Corinth, relieved
      them. Pyrrhus left for Argos.
    diverged: >-
      Epirus is gone.
    sources: ["Plutarch, Pyrrhus 26-30", "Pausanias 1.13", "Justin 25.4"]
