schema_version: 1
# Chronicle mode (D-120, D-XXX): the Achaean League, from the freeing of Sicyon to the fall of
# Corinth, 251-146 BC. Each chapter opens in its year (odd years open on the next turn); one
# choice is what history chose (historical: true). The League had a general (strategos) elected
# each year and no king, so the "ruler" is its leading man in each chapter: Aratus of Sicyon,
# Philopoemen, Aristaenus, Philopoemen again, Callicrates, Diaeus. Margos of Caryneia, the first
# sole general (255), is only the ruler before Aratus; his death date is not recorded. Aratus
# is general in alternate years; the dates of his chapters are the real years. Dates in the
# 140s are approximate to a year; Callicrates' fall from power is not recorded (the scenario
# has him leave office in 166). Facts follow Polybius 2, 4, 7, 11, 18, 20, 23, 30, 38-39,
# Plutarch's Aratus, Cleomenes, Philopoemen and Flamininus, Livy 32-39, 45, and Pausanias 7,
# with modern work by Walbank, Walbank (Aratos of Sicyon, 1933), Gruen and Errington.
# benchmark_provinces counts the provinces of this map the real League held at that date
# (Achaea; Corinth 243-224 and 196-146; Sparta 192-146 with a gap when it seceded, ignored here).
chapters:
  - id: ach_sicyon
    scenario: punic_wars
    civ: achaea
    year: -251
    title: "The Exile Comes Home"
    place: "Sicyon"
    speaker: scholar
    speaker_name: "A Sicyonian"
    speaker_title: "An exile of twenty years"
    benchmark_provinces: 1
    story: >-
      You are Aratus, twenty years old. When you were seven, the tyrant Abantidas murdered your
      father Cleinias, the first man of Sicyon, and you were smuggled out to Argos in the night.
      Since then you have kept in touch with the exiles, and with a few friends in the city.


      On a night of full moon you came over the wall with a small band, took the tyrant
      Nicocles' guards by surprise, and held the market place at dawn. Nicocles has fled over
      the Gulf. The people have come out to cheer. The exiles want their old houses back, and
      the men who have the houses now do not want to give them up.
    choices:
      - label: "Bring Sicyon into the Achaean League"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The Achaean League is a loose union of small cities on the south shore of the Gulf of
          Corinth, and no one takes it seriously. Sicyon joins, and its cavalry and its name
          start to matter. You go to Egypt for money to settle the exiles' claims, and Ptolemy II
          gives you a large sum for it.
      - label: "Keep Sicyon alone and free"
        legitimacy_bp: 2000
        wealth_bp: -300
        outcome: >-
          The citizens are proud to be free of tyrants and of kings, and they pay for walls and
          a watch. Nicocles is still across the water, and the king of Macedon is still nearby.
          Sicyon is small to stand alone.
      - label: "Seek Antigonus Gonatas's friendship"
        legitimacy_bp: -1000
        wealth_bp: 800
        outcome: >-
          The king is glad to have you, and sends money to settle the exiles' claims. He does
          not do it for nothing.
    history: >-
      Aratus freed Sicyon from the tyrant Nicocles in 251 BC and brought it into the Achaean
      League, then a small union of towns. He went to Ptolemy II for money to settle the
      exiles.
    sources: ["Plutarch, Aratus 3-13", "Polybius 2.43", "Walbank, Aratos of Sicyon (1933)"]

  - id: ach_acrocorinth
    scenario: punic_wars
    civ: achaea
    year: -243
    title: "Four Hundred Men on the Rock"
    place: "Corinth"
    speaker: general
    speaker_name: "Erginus"
    speaker_title: "A Syrian, once a thief in Corinth"
    needs_alive: [macedon]
    benchmark_provinces: 2
    story: >-
      You are Aratus, general of the League for the second time. Acrocorinth, the great rock
      above Corinth, is held by a Macedonian garrison under Persaeus, King Antigonus's old
      philosopher friend. Whoever holds the Acrocorinth holds the neck of the Peloponnese.
      The garrison thinks the rock cannot be taken.


      Erginus, a Syrian who has been a thief in Corinth, says there is a path up the cliff
      where one man can climb at a time. He will guide four hundred of your men up it on a
      moonless night, if you will pay him. If you fail, there will be no second chance, and
      no pardon for you or for them.
    choices:
      - label: "Climb the cliff path by night"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          Your men climb into the town, and the Corinthians open the gates in the morning.
          Persaeus flees by sea. The Achaean League now holds the Acrocorinth, Corinth and
          the Isthmus, and Megara, Troezen and Epidaurus join. The Macedonian king, who spent
          half his life holding the rock, has lost it in a night.
        deeds: {take: [mac_corinth], peace_with: [macedon], men: 40000, martial_bp: 5000, grudges: {macedon: 2500}}
      - label: "Accept Antigonus's friendship"
        legitimacy_bp: -1000
        wealth_bp: 1000
        outcome: >-
          Antigonus has been sending you friendly letters and gifts. You turn a good moment
          into a comfortable one, and the rock stays in Macedonian hands.
        deeds: {peace_with: [macedon]}
      - label: "Wait for a larger force"
        legitimacy_bp: 500
        outcome: >-
          You wait, and call up more men and train them through the winter. Persaeus changes
          the watch and the path is closed. Few chances like this return, but your army is
          larger.
        deeds: {men: 10000, martial_bp: 1500}
      - label: "Seize the lower town first"
        legitimacy_bp: 2500
        wealth_bp: 500
        outcome: >-
          Your men take the walls of the town below the rock by day, with Corinth's citizens
          behind them, and the Macedonians draw back into the Acrocorinth. The rock holds, and
          the siege begins.
        deeds: {men: 15000, martial_bp: 2000}
    history: >-
      Aratus seized Acrocorinth by night in 243 BC with four hundred men; Corinth, Megara,
      Troezen and Epidaurus joined the League.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Aratus 16-24", "Polybius 2.43", "Walbank, Aratos of Sicyon (1933)"]

  - id: ach_doson
    scenario: punic_wars
    civ: achaea
    year: -226
    title: "Cleomenes or Doson"
    place: "Argos"
    speaker: sparta
    speaker_name: "Cleomenes III"
    speaker_title: "King of Sparta"
    needs_alive: [macedon, sparta]
    benchmark_provinces: 1
    story: >-
      You are Aratus. Cleomenes became King of Sparta nine years ago. Two years ago he cancelled debts and
      shared out the land, and since then he has beaten the League in battle after battle. The
      last was at Hecatombaeon, where you lost an army. Argos and the cities of Arcadia
      are going over to him, and the poor of the League's cities cheer him.


      He has proposed peace, on one condition: that he command the League's forces. Sparta
      would lead the Peloponnese again. The other way is the old enemy. Antigonus Doson,
      the regent of Macedon, would come to your help, but his price will be the Acrocorinth.
    choices:
      - label: "Ask Antigonus Doson for help"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Cleomenes takes Argos and then Corinth. Doson marches south in 224, gets Acrocorinth
          from you and the other cities at the Isthmus, and forms a new Hellenic League with the
          Achaeans, Boeotians, Epirotes and Thessalians. Two years later at Sellasia he breaks
          the Spartan army. The rock you took with four hundred men goes back to Macedon.
        deeds: {peace_with: [macedon], give: [mac_corinth], give_to: macedon, grudges: {sparta: 2500}}
      - label: "Accept Cleomenes' command"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          The Spartan king takes the League's army and makes his peace with you. The rich of
          the Peloponnese, who feared his cancelled debts, bar their doors to him. Doson
          watches from the north.
        deeds: {peace_with: [sparta], martial_bp: 1500}
      - label: "Fight on without allies"
        legitimacy_bp: -500
        unrest_bp: 2000
        outcome: >-
          You raise every man and every mercenary the League can pay for. Every year
          Cleomenes is stronger and you are weaker.
        deeds: {men: 5000, martial_bp: 1500}
    history: >-
      After Cleomenes' victories (227-225 BC) Aratus negotiated with Antigonus III Doson,
      promising him Acrocorinth; Doson beat Cleomenes at Sellasia in 222 BC.
    diverged: >-
      Macedon or Sparta is gone.
    sources: ["Plutarch, Aratus 38-44", "Plutarch, Cleomenes 15-28", "Polybius 2.46-70"]

  - id: ach_ithome
    scenario: punic_wars
    civ: achaea
    year: -214
    title: "The Two Horns of the Ox"
    place: "Mount Ithome, Messenia"
    speaker: macedon
    speaker_name: "Philip V"
    speaker_title: "King of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Aratus, fifty-seven years old, and the adviser the young king of Macedon trusts
      most. Philip V has come to Messenia and climbed Mount Ithome, the fortress above Messene, to sacrifice to
      Zeus. Messene is torn by quarrels between its nobles and its people, and Philip has come to settle them. One of his companions, Demetrius of
      Pharos, tells him that whoever has Ithome and the Acrocorinth holds the horns of the ox:
      the cattle go where he leads them. Philip's own men can seize the fortress now.


      You hear Philip turn to you. He is twenty-four, and he wants your advice.
    choices:
      - label: "Advise him to leave Messene free"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Philip listens, and gives up the idea. The Messenians will remember it. Plutarch
          says that Philip later grew cold, and that he wronged your household. Aratus was
          to die within the year.
        deeds: {peace_with: [aetolia], grudges: {macedon: 500}}
      - label: "Support Demetrius and seize Ithome"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Philip's men take Ithome. The Messenians lose their freedom, and Greece sees what it
          means to be Philip's friend.
        deeds: {men: 4000, grudges: {macedon: 1000}}
      - label: "Advise a garrison, but free laws"
        legitimacy_bp: 1000
        wealth_bp: 500
        unrest_bp: 300
        outcome: >-
          Philip leaves a small garrison on Ithome and lets Messene keep its laws. The nobles
          and the people both grumble, and both put up with it. Neither side thinks the
          bargain permanent.
        deeds: {men: 3000}
    history: >-
      Polybius (7.11-14) says Philip V at Ithome (214 BC) took Aratus's advice and spared
      Messene against Demetrius of Pharos. Aratus died in 213 BC; Plutarch says that Philip
      poisoned him, a charge Polybius did not confirm.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 7.11-14, 8.12", "Plutarch, Aratus 49-54", "Walbank, Philip V of Macedon (1940)"]

  - id: ach_mantinea
    scenario: punic_wars
    civ: achaea
    year: -207
    title: "Mantinea"
    place: "The plain of Mantinea"
    speaker: sparta
    speaker_name: "Machanidas"
    speaker_title: "Tyrant of Sparta"
    needs_alive: [sparta]
    benchmark_provinces: 1
    story: >-
      You are Philopoemen of Megalopolis, general of the Achaean League. Your people used to
      go to war in light armour, with no drill, and run when the Aetolians came. You have given
      them the long Macedonian pike and heavy shield and the habit of marching in step.


      Now Machanidas, the Spartan tyrant, comes up the road towards Mantinea with his
      mercenaries and his machines. You can hold the town, or put
      your army in the plain across the road and meet him.
    choices:
      - label: "Fight him on the plain"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          The pike phalanx holds the centre. Machanidas
          rides along the ditch to cut off your wing, and you cut him down yourself with a
          spear. His army scatters, and Sparta is, for the moment, harmless. At the Nemean games
          the Greeks stand and cheer you.
        deeds: {martial_bp: 500, peace_with: [aetolia], grudges: {sparta: 1500}, ruler_falls: "completes his term as general"}
      - label: "Hold the walls"
        legitimacy_bp: 300
        unrest_bp: 600
        outcome: >-
          Machanidas burns the fields. The farmers who followed you to Mantinea go home
          unpaid, and your drilled pikemen see no battle.
        deeds: {martial_bp: 800, men: 2000, ruler_falls: "completes his term as general"}
      - label: "Hire another army"
        legitimacy_bp: 3200
        wealth_bp: -500
        outcome: >-
          Mercenaries fight well when they are paid on time. Your hired captains hold the
          centre and the day is won, though the victory is as much theirs as yours, and the
          Cretans in the line expect to be paid again.
        deeds: {men: 6000, martial_bp: 1500, ruler_falls: "completes his term as general"}
    history: >-
      Philopoemen, as general (208/7 BC), reorganised the League's army with pike and heavy
      shield, then defeated and killed Machanidas at Mantinea in 207.
    diverged: >-
      Sparta is gone.
    sources: ["Polybius 11.9-18", "Plutarch, Philopoemen 7-10", "Livy 28.5-7"]

  - id: ach_rome
    scenario: punic_wars
    civ: achaea
    year: -198
    title: "Philip or the Romans?"
    place: "Sicyon"
    speaker: rome
    speaker_name: "Lucius Calpurnius"
    speaker_title: "Envoy of Rome"
    needs_alive: [macedon, rome]
    benchmark_provinces: 1
    story: >-
      You are Aristaenus of Megalopolis, general of the League. Philip V has been your
      ally since the Social War. He also garrisons Corinth and Argos, and his friend Nabis
      of Sparta raids your borders. The Romans are at Corinth with a fleet, and
      King Attalus of Pergamon, Rhodes and Athens have all sent envoys to ask the League to
      join them.


      The League's assembly has met at Sicyon.  The cities are
      split down the middle: Dyme and Megalopolis would rather stay out. Cycliadas, the old
      general, supports Philip.
    choices:
      - label: "Join Rome against Philip"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: 1000
        outcome: >-
          After three days of debate, the vote goes to Rome: most cities are for it. Dyme and
          Megalopolis secede for a while, and Cycliadas goes to Philip. The League's troops
          besiege Corinth beside the Romans. The Roman victory at Cynoscephalae
          (197) breaks Macedon, and at the Isthmian Games in 196 Flamininus declares Greece
          free and gives Corinth to the League.
        deeds: {grudges: {macedon: 2500}, ruler_falls: "completes his term as general"}
      - label: "Keep faith with Philip"
        legitimacy_bp: -1000
        wealth_bp: -500
        outcome: >-
          Rome and Attalus ravage your coast. You are on the side that loses.
        deeds: {ruler_falls: "completes his term as general"}
      - label: "Stay out of the war"
        legitimacy_bp: 1500
        wealth_bp: -500
        unrest_bp: 500
        outcome: >-
          The cities that wanted to stay out are pleased, and the cities that wanted war are
          not. Neither Rome nor Philip forgives it.
        deeds: {ruler_falls: "completes his term as general"}
    history: >-
      The Achaean League voted at Sicyon in autumn 198 BC to join Rome against Philip V,
      though Dyme and Megalopolis seceded briefly. Corinth was awarded to the League in 196.
    diverged: >-
      Macedon or Rome is gone.
    sources: ["Livy 32.19-23, 33.31-34", "Polybius 18.13, 18.42-46"]

  - id: ach_sparta
    scenario: punic_wars
    civ: achaea
    year: -192
    title: "Sparta Without a Tyrant"
    place: "Tegea"
    speaker: aetolia
    speaker_name: "Alexamenus"
    speaker_title: "An Aetolian officer"
    needs_alive: [sparta]
    benchmark_provinces: 3
    story: >-
      You are Philopoemen, back from Crete and general again. Nabis of Sparta, who held the
      Peloponnese in terror for twenty years, was murdered by an Aetolian officer, Alexamenus,
      who had come to Sparta as his ally. The Aetolians then plundered the city, and the
      Spartans killed them. Sparta has no king, no tyrant and no friends.


      Aetolia is calling Antiochus of Syria to Greece. If you do not take Sparta, someone else
      will. The city has never been a member of the League. Its people hate the Achaeans, who
      have been at war with Sparta for as long as anyone can remember.
    choices:
      - label: "Make Sparta join the League"
        historical: true
        legitimacy_bp: 2500
        unrest_bp: 1000
        outcome: >-
          You summon the Spartan leaders to Tegea and give them a choice that is not much
          of one. Sparta enters the Achaean League. It will not stay quiet: four years
          later, when it secedes, you take the city again, pull down its walls, and abolish
          the laws of Lycurgus. Eighty Spartans are put to death, and the League's name is stained.
        deeds: {take: [mac_corinth, spa_laconia], grudges: {sparta: 3000}}
      - label: "Leave Sparta alone"
        legitimacy_bp: -1000
        outcome: >-
          Sparta puts up another tyrant, or lets the Romans in. You will fight it again later,
          on worse terms.
        deeds: {take: [mac_corinth]}
      - label: "Ask Rome to judge Sparta"
        legitimacy_bp: -500
        outcome: >-
          Rome likes being asked, and likes it more each year.
        deeds: {take: [mac_corinth]}
      - label: "Offer Sparta an equal alliance"
        legitimacy_bp: 2300
        wealth_bp: -300
        unrest_bp: 300
        outcome: >-
          You send your envoys to Sparta with an offer of friendship and a seat at the table.
          The Spartans, who have not been offered one in your lifetime, consider it with
          suspicion, and in the end sign.
        deeds: {take: [mac_corinth], peace_with: [sparta]}
    history: >-
      In 192 BC Philopoemen forced Sparta into the Achaean League after Nabis' murder; in 188
      he razed its walls and abolished the laws of Lycurgus after it seceded.
    diverged: >-
      Sparta is gone.
    sources: ["Livy 35.35-37, 38.30-34", "Plutarch, Philopoemen 12-16", "Polybius 21.32c"]

  - id: ach_hostages
    scenario: punic_wars
    civ: achaea
    year: -167
    title: "A Thousand Names"
    place: "Aegium"
    speaker: rome
    speaker_name: "Gaius Claudius"
    speaker_title: "Roman commissioner"
    needs_alive: [rome]
    benchmark_provinces: 3
    story: >-
      You are Callicrates of Leontion. For years you have told the Romans that the League
      cannot be trusted, and that its leaders are secretly friends of Perseus of Macedon.
      Perseus is beaten now. The Roman commissioners have come to Greece with the Senate's
      permission to punish the League's disloyal. You are Rome's friend.


      They want names. Many of the Achaean leaders do not like Rome, and some have
      been in touch with Macedon. It is also true that some of them are your rivals, and
      that none of them has been shown to have broken the treaty. Among them is a cavalry
      officer called Polybius, the son of Lycortas.
    choices:
      - label: "Give the commissioners a list of a thousand"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2500
        outcome: >-
          A thousand Achaeans are taken to Italy and spread among the towns of Etruria, with no
          trial. Polybius is among them, and spends seventeen years there, much of the time in
          Rome in the house of Scipio Aemilianus' family, writing the history that explains how
          Rome came to rule the world. About three hundred are alive when the survivors are
          allowed home. You rule the League for as long as Rome lets you, and no one forgets
          how.
        deeds: {ruler_falls: "loses power as the exiles return"}
      - label: "Say no one in the League is disloyal"
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          The commissioners were not asking permission. They send others to find the names.
        deeds: {grudges: {rome: 1500}, ruler_falls: "loses power as the exiles return"}
      - label: "Name only a few of the guilty"
        legitimacy_bp: -500
        outcome: >-
          Rome does not want a few. It wanted a lesson, and so it sets one.
        deeds: {ruler_falls: "loses power as the exiles return"}
    history: >-
      In 167 BC, on the denunciation of Callicrates and others, about a thousand Achaeans were
      deported to Italy without trial after Pydna. Polybius, the historian, was among them;
      about three hundred survivors were released in 150.
    diverged: >-
      Rome is gone.
    sources: ["Pausanias 7.10.7-11", "Polybius 30.13, 30.32", "Livy 45.31", "Gruen, The Hellenistic World and the Coming of Rome (1984)"]

  - id: ach_corinth
    scenario: punic_wars
    civ: achaea
    year: -146
    title: "The Isthmus"
    place: "Corinth"
    speaker: rome
    speaker_name: "Lucius Mummius"
    speaker_title: "Consul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Diaeus of Megalopolis. The exiles came home with their grudges. Last year a
      Roman commission told the League that Sparta, Corinth, Argos and two other cities were
      to be separated from it. The crowd in Corinth rioted against the Romans, and the League
      voted for war. The general Critolaus has lost his army to Metellus in Locris and has vanished, perhaps dead. You took over his command, with freed slaves in the ranks.


      Mummius has arrived at the Isthmus with the consul's army. Metellus, a milder man, has
      offered terms. Corinth is the richest city in Greece, and the war council meets there.
    choices:
      - label: "Fight at the Isthmus"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 3000
        outcome: >-
          Your army is beaten at Leucopetra. The people leave Corinth in the night. Mummius
          burns the city, tears down its walls and ships its art off to Rome.
          The League is dissolved. You kill your wife and take poison, as Pausanias tells.
          Greece belongs to Rome.
        deeds: {give: [mac_corinth, spa_laconia], grudges: {rome: 4000}}
      - label: "Take Metellus' terms"
        legitimacy_bp: -1000
        outcome: >-
          The terms are that the five cities leave the League. The League shrinks, but it
          survives, for a time.
        deeds: {give: [spa_laconia]}
      - label: "Break the league up yourself"
        legitimacy_bp: -2000
        outcome: >-
          The cities scatter. Rome, which has not asked, is not grateful.
        deeds: {give: [mac_corinth, spa_laconia]}
    history: >-
      The Achaean War of 147-146 BC ended with Mummius' victory at Leucopetra and the
      destruction of Corinth in 146 BC. The League was dissolved, and Greece was put under
      the governor of Macedonia.
    diverged: >-
      Rome is gone.
    sources: ["Pausanias 7.12-16", "Polybius 38.9-18", "Livy, Periochae 52", "Gruen, The Hellenistic World and the Coming of Rome (1984)"]
