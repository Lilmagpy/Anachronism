schema_version: 1
# Chronicle mode (D-120, D-XXX): the merchant republic of Rhodes, from the fall of the Colossus
# to the treaty with Rome, 226-164 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow Polybius 4.45-52, 5.88-90, 16.2-9, 21.46, 29.19, 30.5,
# 30.20-31 and 31.31, Livy 31.2, 37.9-30 and 45.20-25, Strabo 14.2.5 and Pliny's Natural History
# 34.41, with modern work by Berthold (Rhodes in the Hellenistic Age), Gabrielsen (The Naval
# Aristocracy of Hellenistic Rhodes) and Wiemer. Rhodes was a republic, so the ruler is "the
# prytaneis", the rotating presidents of the council, who held office for six months; no single
# name is given. The scenario starts in 264 BC but its first event, the Colossus, is about 226
# (approximate, Polybius gives no year); the treaty with Rome is c. 164 (approximate).
# benchmark_provinces counts the provinces of this map the real Rhodes held at that date: one
# (the island). Its mainland holdings in Caria and Lycia (188-167) are not on this map.
chapters:
  - id: rho_colossus
    scenario: punic_wars
    civ: rhodes
    year: -226
    title: "The Colossus Falls"
    place: "Rhodes"
    speaker: steward
    speaker_name: "Your chief of works"
    speaker_title: "Of the harbour"
    benchmark_provinces: 1
    story: >-
      You are the prytaneis of Rhodes. Last night the earth shook, and when day broke the
      great bronze Helios, the Colossus that has stood by your harbour for fifty-six years,
      was lying in pieces, snapped off at the knees. Walls, docks and arsenals are shattered
      too, and the people are afraid.


      Within days the messages begin. Kings and cities send gold, timber, grain and craftsmen:
      Hiero of Syracuse and his son Gelon, Ptolemy of Egypt, Antigonus of Macedon, the
      Seleucid king, the princes of Bithynia and Pontus. They all want to be the benefactor of
      the free Rhodians. At Delphi, the oracle is asked what to do with the statue.
    choices:
      - label: "Repair the walls and docks before anything else"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 2000
        influence: {guilds: 1000}
        outcome: >-
          You rebuild the walls, the arsenals and the shipyards with the kings' gifts; Polybius
          tells that Rhodes made more of the disaster than it had lost. Strabo says the Delphic
          oracle forbade putting the statue back up, and it is left where it fell. Two hundred
          years later Pliny sees the broken giant and says that few men can put their arms
          round its thumb. The story that it lay for eight hundred years, until it was sold for
          scrap, comes from later writers.
      - label: "Set the Colossus back on its feet"
        legitimacy_bp: 1000
        wealth_bp: -2000
        outcome: >-
          The kings' gifts go into bronze and scaffolding; the harbour works wait. Priests
          say the god has turned his face from the plan, and the dockyards are a year late.
      - label: "Share the gifts among the citizens who lost homes"
        legitimacy_bp: 800
        wealth_bp: 800
        unrest_bp: -800
        outcome: >-
          The kings' grain and gold go to the families whose houses fell. The people are
          grateful. The walls and the harbour wait their turn, and the god lies where he fell.
    history: >-
      Rhodes was shaken by an earthquake about 226 BC which broke the Colossus; the Hellenistic
      kings sent great gifts to rebuild the city, and the statue was never put up again.
    sources: ["Polybius 5.88-90", "Strabo 14.2.5", "Pliny, Natural History 34.41"]

  - id: rho_tolls
    scenario: punic_wars
    civ: rhodes
    year: -220
    title: "The Tolls of the Bosporus"
    place: "Rhodes"
    speaker: general
    speaker_name: "Your admiral"
    speaker_title: "Of the fleet"
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. Byzantium, a city that stands at the narrow mouth of the Black Sea,
      has begun to charge a toll on every ship that passes in or out. Grain, fish, hides and
      slaves from the north are the life of your harbour, and every merchant now pays twice: once
      at Byzantium, and again in the price of what he sells you.


      The Byzantines say they have to pay the Gauls who are camped nearby, and that they can
      do what they like in their own strait. A dozen cities have complained to
      you.
    choices:
      - label: "Go to war with Byzantium over the toll"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -500
        outcome: >-
          You gather allies, among them Prusias of Bithynia, who has his own grievances. Your
          admiral Xenophantus sails with the fleet, and Byzantium soon finds that war costs
          more than tolls. The Byzantines give in, the toll on ships is ended, and the straits
          are open again. Rhodes has shown that no city, however well placed, may close the sea.
      - label: "Pay the toll, and press for relief"
        legitimacy_bp: -1000
        wealth_bp: -1000
        outcome: >-
          Rhodian grain ships go on paying, and every captain from Egypt to Crete sees that
          Rhodes will not defend the freedom of the sea.
      - label: "Call the trading cities to a congress"
        legitimacy_bp: 600
        wealth_bp: -300
        influence: {"guilds": 500}
        outcome: >-
          Delegates from a dozen cities meet at Rhodes and sign a protest. Byzantium reads it,
          and cuts the toll a little while it waits to see what you will do.
    history: >-
      About 220 BC Rhodes fought a short war against Byzantium over its tolls on the Black Sea
      trade, and the Byzantines agreed to end the toll on shipping.
    sources: ["Polybius 4.46-52"]

  - id: rho_chios
    scenario: punic_wars
    civ: rhodes
    year: -200
    title: "Philip's Pirates"
    place: "Rhodes"
    speaker: general
    speaker_name: "Your admiral"
    speaker_title: "Of the fleet"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. Philip V of Macedon, who has made friends with the pirates of Crete,
      has seized islands and sold the free people of Cios and Thasos into slavery. Last year
      you fought him off Chios beside Attalus of Pergamon, and then near Lade; your admiral
      Theophiliscus was badly wounded in the first fight and died of it.


      Philip is not beaten. He sits in the harbours of Caria and threatens the grain route. You
      cannot hold the seas alone, and the great power in the west has just made peace with
      Carthage.
    choices:
      - label: "Ask Rome for help, with Attalus"
        historical: true
        legitimacy_bp: 1000
        influence: {guilds: 500}
        outcome: >-
          In Rome the envoys tell the Senate that Philip means to rule all Greece. The Senate is
          slow to give up a short peace, but Philip's attack on Athens decides it: in 200 Rome declares
          war on Macedon. For the first time a Roman fleet and a Rhodian one sail together.
        deeds: {peace_with: [rome], grudges: {macedon: 2000}}
      - label: "Make peace with Philip"
        legitimacy_bp: -1000
        wealth_bp: -500
        outcome: >-
          Philip is happy to take your ships out of the war. When he comes for you after Athens
          and Pergamon, nobody is left to help.
        deeds: {"peace_with": ["macedon"]}
      - label: "Build more ships and fight Philip alone"
        legitimacy_bp: 500
        wealth_bp: -1500
        outcome: >-
          Your yards work through the winter and a larger fleet puts to sea in the spring.
          Philip's ships avoid it and his troops stay in Caria.
        deeds: {"ships": 30, "men": 3000}
    history: >-
      In 201-200 BC Rhodes and Pergamon fought Philip V at Chios and Lade and appealed to
      Rome, which declared war on Philip in 200.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 16.2-9, 16.24", "Livy 31.2"]

  - id: rho_myonessos
    scenario: punic_wars
    civ: rhodes
    year: -190
    title: "Myonessos"
    place: "Off Teos"
    speaker: rome
    speaker_name: "Lucius Aemilius Regillus"
    speaker_title: "Admiral of Rome"
    needs_alive: [rome, seleucid]
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. Antiochus, king of the Seleucids, has asked Rhodes to keep out of
      his war with Rome, and has promised to respect your trade. Your admiral Pausistratus was
      killed earlier this year, caught in a harbour by a trick of the Seleucid admiral Polyxenidas,
      who pretended to desert and then fell on him.


      Hannibal himself has been sent with a Phoenician fleet from the south, to join
      Polyxenidas. The Romans offer you a place at their side, and you know what that means:
      your ships will meet the Seleucids twice, once off Pamphylia and once north of Ephesus.
    choices:
      - label: "Join the Roman fleet at sea"
        historical: true
        legitimacy_bp: 2500
        wealth_bp: -500
        outcome: >-
          Your admiral Eudamus meets Hannibal's fleet at the river Eurymedon and drives it back
          with Rhodian skill; it is said to be the only sea battle Hannibal ever fought, and he lost it. A few
          weeks later, at Myonessos, Rhodes' quick ships and fire-pots help Rome sink or take
          forty-two of Polyxenidas's ships. The Seleucid fleet never recovers.
        deeds: {peace_with: [rome]}
      - label: "Stay neutral, as Antiochus asks"
        legitimacy_bp: -1500
        wealth_bp: 800
        outcome: >-
          The Seleucids keep their word until the day they no longer need you. Rome does not
          forget which ships were not there.
        deeds: {"ships": 10, "grudges": {"rome": 2500}}
      - label: "Join Rome, but keep your fleet near home"
        legitimacy_bp: 1200
        wealth_bp: 300
        outcome: >-
          Rhodes sends a squadron to the Romans and keeps its main fleet in its own waters.
          Rome takes the help, and notes the rest.
        deeds: {"peace_with": ["rome"], "ships": 10}
    history: >-
      In 190 BC the Rhodians under Eudamus defeated a fleet commanded by Hannibal at the
      Eurymedon, and fought with the Romans at Myonessos where Polyxenidas was beaten.
    diverged: >-
      Rome or the Seleucid kingdom is gone.
    sources: ["Livy 37.9-30"]

  - id: rho_apamea
    scenario: punic_wars
    civ: rhodes
    year: -188
    title: "Caria and Lycia"
    place: "Rome"
    speaker: rome
    speaker_name: "A senator"
    speaker_title: "Of the Senate"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. Antiochus has been beaten at Magnesia, and the Senate is dividing
      what he held. Rome will keep nothing itself. King Eumenes gets the lion's share of Asia
      Minor. For Rhodes, which fought at sea, the Senate has a gift: Lycia, and Caria south
      of the Maeander, with their harbours and hill towns.


      Your envoys had hoped for a different prize, the freedom of the Greek cities of the coast.
      Lycia will not like being ruled by your republic.
    choices:
      - label: "Accept the grant of Lycia and Caria"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Rhodes is, for the first time, a power on land. The Lycians, who have lived
          freely in their league, protest again and again; within ten years they rise, and Rome
          is slow to back you. The gift will cost you more than it
          earns.
      - label: "Ask for the Greek cities' freedom instead"
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          The Senate admires your principles and keeps its gifts for others.
      - label: "Take Caria, and leave Lycia free"
        legitimacy_bp: 600
        wealth_bp: 1000
        unrest_bp: 200
        outcome: >-
          You take the harbours of Caria and ask the Senate to leave the Lycian league alone.
          The Senate is surprised, and a little amused.
    history: >-
      By the Treaty of Apamea (188 BC) Rhodes received Lycia and southern Caria; the Lycians
      resented Rhodian rule and Rome later took the lands away.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 21.46", "Livy 37.54-56, 38.39"]

  - id: rho_pydna
    scenario: punic_wars
    civ: rhodes
    year: -168
    title: "The Mediators"
    place: "Rhodes"
    speaker: steward
    speaker_name: "A Rhodian envoy"
    speaker_title: "Newly come from Rome"
    needs_alive: [rome, macedon]
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. For three years Rome has fought King Perseus of Macedon, and the
      war has hurt your sea trade. Many in your city think the war is wearing Rome as much as
      Macedon, and that it is time somebody stood between the two.


      Your envoys are already in Perseus's camp and the Roman one. If Rhodes mediates, and
      Rome wins, Rome will remember. If Rome wins anyway, you may be remembered for
      something else.
    choices:
      - label: "Offer to arbitrate between Rome and Macedon"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          The offer arrives in Rome the day the news from Pydna comes in, and the Senate answers
          with open anger. Rome takes Caria and Lycia away in 167, declaring them free,
          and the Senate talks of declaring war on you. The old Cato speaks for you, saying that
          a city may wish for a different outcome and still not be an enemy; war is
          not declared, but you must prove your loyalty.
        deeds: {grudges: {rome: 3000}}
      - label: "Send your fleet to join Rome's blockade"
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Your fleet joins the blockade. You cannot say you were with Rome all along, but the
          Senate cannot say you were against it.
      - label: "Recall the envoys and keep the fleet home"
        legitimacy_bp: -300
        wealth_bp: 300
        unrest_bp: 400
        outcome: >-
          Your envoys come home from both camps and the fleet stays in harbour. Nobody can say
          Rhodes took a side, and nobody thanks you for it.
    history: >-
      In 168 BC Rhodes tried to mediate in the war between Rome and Perseus; Rome took it as
      hostility, removed Lycia and Caria from Rhodes in 167, and only dropped the threat of war
      after Cato spoke for the Rhodians.
    diverged: >-
      Rome or Macedon is gone.
    sources: ["Polybius 29.19", "Livy 44.14, 45.20-25"]

  - id: rho_delos
    scenario: punic_wars
    civ: rhodes
    year: -166
    title: "A Free Port at Delos"
    place: "Rhodes"
    speaker: steward
    speaker_name: "Your customs collector"
    speaker_title: "Of the harbour dues"
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. The Senate has given the island of Delos, the old sacred island in
      the Cyclades, to Athens, and has declared it a free port: no harbour dues for
      anyone. The idea is to hurt Rhodes, whose harbour has taken the dues of the whole eastern
      sea. Merchants from Syria, Egypt and Italy are moving to Delos, with their slaves and
      their ships.


      Your harbour dues, once a million drachmas a year, are falling fast.
    choices:
      - label: "Protest to Rome and look for new trade"
        historical: true
        wealth_bp: -2500
        legitimacy_bp: -500
        influence: {guilds: -1000}
        outcome: >-
          Polybius reports that your harbour dues fall from a million drachmas to a hundred and
          fifty thousand. The Senate does not give Delos back. You turn to your navy,
          which becomes an official ally of Rome, and to the schools of rhetoric and
          the arts, which still draw students from all over the Roman world.
      - label: "Cut the harbour dues to match Delos"
        wealth_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          Merchants come back for a time, but your treasury is empty and the navy goes
          unpaid.
      - label: "Hire your fleet out against pirates"
        wealth_bp: -500
        legitimacy_bp: 400
        influence: {"guilds": -500}
        outcome: >-
          Rhodian warships escort convoys and hunt pirates for a fee. The money is small but
          steady, and the merchants of Delos are glad of it.
        deeds: {"ships": 10}
    history: >-
      In 167-166 BC Rome gave Delos to Athens as a free port, and the harbour dues of Rhodes fell
      from about a million drachmas to a hundred and fifty thousand.
    sources: ["Polybius 30.20, 31.7", "Strabo 14.2.5"]

  - id: rho_alliance
    scenario: punic_wars
    civ: rhodes
    year: -164
    title: "Rhodes Becomes Rome's Ally"
    place: "Rome"
    speaker: rome
    speaker_name: "A senator"
    speaker_title: "Of the Senate"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the prytaneis. Three years of suspicion have brought down your trade, your prestige
      and your hold on the mainland. You have put to death those in the city who spoke
      for Perseus, and sent a crown of gold to Rome. Still the Senate has not
      answered the one question that matters: whether Rhodes is a friend or an enemy.


      An alliance is on offer, and with it Rome's protection. In return you must have the
      same friends and enemies as Rome, and send ships when asked.
    choices:
      - label: "Sign the alliance on Rome's terms"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 500
        outcome: >-
          Rhodes becomes the friend of Rome. The island is left free, but its fleet is now Rome's
          to call on, and its ships help to clear the pirates from the sea. Over the next century
          Rhodes remains rich and learned, a place where Cicero and Caesar will go to
          study, and no longer a great power.
        deeds: {peace_with: [rome]}
      - label: "Keep Rhodes free of alliances"
        legitimacy_bp: -1000
        wealth_bp: 600
        outcome: >-
          Rome has no use for a neutral rival at sea. Your friends in the Senate cannot defend
          you for ever.
        deeds: {"ships": 10, "grudges": {"rome": 2000}}
      - label: "Ask for a friendship without obligations"
        legitimacy_bp: 600
        wealth_bp: 300
        outcome: >-
          Rome says it values Rhodian friendship and writes nothing down. You are neither safe
          nor threatened.
        deeds: {"peace_with": ["rome"]}
    history: >-
      About 164 BC Rhodes made a treaty of alliance with Rome, ending its time as a free
      naval power.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 30.5, 31.7", "Livy 45.25"]
