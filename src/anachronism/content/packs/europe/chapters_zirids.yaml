schema_version: 1
# Chronicle mode (D-120, D-XXX): the Zirid emirs of Ifriqiya, from the boy al-Mu'izz to the
# loss of Mahdia, 1016-1148. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Ibn Idhari, Ibn al-Athir, Ibn Khaldun, al-Tijani and al-Bakri,
# the Cairo Geniza letters, the Pisan Carmen in victoriam and Roger II's court chroniclers
# (Romuald of Salerno, Ibn al-Athir on 1148), with modern work by Idris (La Berbérie orientale
# sous les Zirides, 1962), Brett, Talbi and Abulafia. Dates approximate where the sources
# differ: the break with Cairo is 1048-49, the battle of Haydaran 1052, the fall of Kairouan
# 1057, the Pisan-Genoese raid on Mahdia 1087, Roger's failed attack 1123. Counts of the
# Banu Hilal and the tribes' numbers in the chronicles are large and unreliable. The Zirids
# rule Ifriqiya and Tripolitania at the start; after Haydaran only Ifriqiya is left here
# (the coast with Mahdia). benchmark_provinces counts the provinces of this map the real
# emirs held at that date; the last chapter, after Mahdia fell, has none to compare.
chapters:
  - id: zir_boy
    scenario: year_1000
    civ: zirids
    year: 1016
    title: "A Boy on the Throne"
    place: "Sabra al-Mansuriya, near Kairouan"
    speaker: steward
    speaker_name: "Your guardians"
    speaker_title: "The elders of the Sanhaja"
    benchmark_provinces: 2
    story: >-
      You are al-Mu'izz ibn Badis, eight years old. Your father has just died, and the
      Sanhaja chiefs, the Berbers of the mountains who put your family in power, have set
      you on his throne. You govern Ifriqiya in the name of the Fatimid caliph in Cairo, whom most of your subjects consider a heretic: they are Sunnis of the Maliki school, and the Fatimids are Ismaili Shi'a.


      Your father's cousin Hammad, the governor in the west, has already thrown off Cairo's
      authority and has fought your father. Now there are riots in Kairouan against the Shi'a
      living there. Your guardians ask what the boy emir will do.
    choices:
      - label: "Keep Cairo's name, restore order"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        outcome: >-
          Your guardians hold the court together, the Fatimid caliph confirms you, and the
          killing is stopped, though not before many have died. The war with Hammad goes on
          for some years, and in the end the two branches of your house settle into a
          rivalry of neighbours. You grow up a pious, learned and rather stubborn prince, and
          under you Ifriqiya will be rich: Mahdia's harbour and the markets of Kairouan are
          full.
        deeds: {peace_with: [fatimids]}
      - label: "Declare for Baghdad's caliph at once"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The mob cheers. The Fatimid caliph, whose gold and wheat shipments pay your army,
          does not. You are eight years old and have just made an enemy of Egypt.
        deeds: {grudges: {fatimids: 2500}}
      - label: "Let the Sanhaja chiefs crush the riots"
        legitimacy_bp: 300
        unrest_bp: -500
        outcome: >-
          The chiefs ride into Kairouan and the riots end in blood. The Maliki jurists hold
          you responsible, and the elders learn that they need not ask you.
        deeds: {martial_bp: 300}
    history: >-
      Badis died in 1016 and his son al-Mu'izz, aged about eight, succeeded him as Fatimid
      governor of Ifriqiya; anti-Shi'a riots broke out in Kairouan and elsewhere at about
      the same time, and the war with Hammad ibn Buluggin's western branch of the family
      continued for several years.
    diverged: >-
      Cairo is gone.
    sources: ["Ibn Idhari, al-Bayan al-Mughrib 1", "Ibn Khaldun, Kitab al-Ibar", "Idris, La Berbérie orientale sous les Zirides (1962)", "Brett, The Rise of the Fatimids (2001)"]

  - id: zir_break
    scenario: year_1000
    civ: zirids
    year: 1048
    title: "The Name in the Friday Prayer"
    place: "Kairouan"
    speaker: scholar
    speaker_name: "A Maliki jurist of Kairouan"
    speaker_title: "A teacher at the Great Mosque"
    needs_alive: [fatimids]
    benchmark_provinces: 2
    story: >-
      You are al-Mu'izz ibn Badis, forty years old, emir of Ifriqiya for thirty-two years.
      The country is rich: wheat, olive oil, the trade of Mahdia's harbour. Your people are
      overwhelmingly Maliki Sunnis, and every Friday in their mosques the preacher names
      the Fatimid caliph in Cairo as the lord of the believers. Many of them hate it.


      The jurists of Kairouan urge you to stop. The caliph of Baghdad, the Abbasid, is
      willing to send you a robe of honour and a banner. Egypt is far away, and has other means than armies.
    choices:
      - label: "Name the Abbasid caliph at prayer"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -800
        influence: {clergy: 1500}
        outcome: >-
          You remove the Fatimid name from the coins and the sermon, receive the Abbasid
          caliph's robe and black banner, and the Shi'a of Ifriqiya are in great danger. The
          crowds are with you. In Cairo, the Fatimids decide to send you not an army but a plague of nomads.
        deeds: {grudges: {fatimids: 3000}}
      - label: "Keep Cairo's name in the sermon"
        legitimacy_bp: -800
        unrest_bp: 1500
        influence: {clergy: -1500}
        outcome: >-
          Your jurists call you a puppet of heretics, and your capital grumbles. Cairo is
          pleased, and the gold keeps coming.
        deeds: {peace_with: [fatimids]}
      - label: "Keep both: Cairo's coins, Baghdad's blessing"
        legitimacy_bp: 200
        outcome: >-
          Nobody is fooled. By next year your jurists have decided for you.
    history: >-
      Around 1048-49 al-Mu'izz cut the Fatimid caliph's name from the coinage and the Friday
      sermon and acknowledged the Abbasid caliph of Baghdad.
    diverged: >-
      The Fatimids are gone.
    sources: ["Ibn Idhari, al-Bayan al-Mughrib 1", "Ibn Khaldun, Kitab al-Ibar", "Idris, La Berbérie orientale sous les Zirides (1962)", "Talbi, L'Émirat aghlabide (1966) for the background"]

  - id: zir_haydaran
    scenario: year_1000
    civ: zirids
    year: 1052
    title: "Haydaran"
    place: "Near Gabès"
    speaker: general
    speaker_name: "Your Sanhaja commander"
    speaker_title: "Master of your cavalry"
    benchmark_provinces: 1
    story: >-
      You are al-Mu'izz. Cairo has sent no army against you: it has let loose the nomad
      tribes of the Banu Hilal and Banu Sulaym from Upper Egypt, who have crossed into
      Barqa and Tripolitania and are moving west with their flocks, their families and their
      horsemen. They are not conquerors but a whole people on the move, and where they pass,
      the cultivated land turns to grazing.


      The chroniclers say your army is many times larger than theirs, but the Arab horse
      are fast and your own cavalry is brave and proud. Your commanders ask whether to meet
      them in the open or to stay behind walls.
    choices:
      - label: "Meet them in the field, near Gabès"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2500
        outcome: >-
          In 1052, at Haydaran, your horsemen break and run. The Arabs plunder the camp
          and the countryside, and the loss of your army is the loss of the open country. Tripoli
          and the south are gone. The roads, the villages and the farms between the towns
          begin to belong to the tribes. It will take them five years to break Kairouan.
        deeds: {give: [m_tripolitania]}
      - label: "Hold the walled cities and buy off the chiefs"
        legitimacy_bp: -500
        wealth_bp: -1500
        unrest_bp: 800
        outcome: >-
          Some chiefs take your gold and some sell it to their rivals. The countryside is lost
          more slowly than it would have been in battle, but not saved.
        deeds: {give: [m_tripolitania]}
      - label: "Call the whole realm to arms"
        legitimacy_bp: 300
        unrest_bp: 1500
        outcome: >-
          The peasants come, and are cut down in the field.
        deeds: {give: [m_tripolitania]}
    history: >-
      In 1052 the Zirid army was routed at Haydaran near Gabès by the Banu Hilal and Banu
      Sulaym, tribes sent westwards from Egypt after the break with Cairo; Tripolitania and
      the open country were lost.
    sources: ["Ibn Khaldun, Kitab al-Ibar 6", "Ibn Idhari, al-Bayan al-Mughrib 1", "Idris, La Berbérie orientale sous les Zirides (1962)", "Brett, 'The Arab Conquest and the Rise of Islamic Ifriqiya' (1995)"]

  - id: zir_mahdia
    scenario: year_1000
    civ: zirids
    year: 1058
    title: "The Last Days of Kairouan"
    place: "Mahdia"
    speaker: steward
    speaker_name: "The qadi of Kairouan"
    speaker_title: "Come to you by sea"
    benchmark_provinces: 1
    story: >-
      You are al-Mu'izz, fifty. In the last five years the nomad tribes have taken the open
      country, the roads and finally Kairouan itself, the great city of the Maliki scholars,
      which you left for Mahdia on the sea. The tribes, with their camels, have occupied the
      fields; the fine buildings of Kairouan are being stripped. The qadi and some of its
      scholars have fled to you in Mahdia with stories of the destruction.


      Your court asks whether you will go on with the war, or settle in your fortified
      peninsula on the sea and live off trade. The Arab chiefs, who are not foolish, are
      willing to take your gold.
    choices:
      - label: "Trade from behind Mahdia's walls"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 1500
        unrest_bp: -500
        outcome: >-
          Mahdia is a peninsula behind a great wall, with its own harbour and its fleet and its
          arsenal. The Arab chiefs hold the plains, and you hold Mahdia and a few of the ports. You still have your ships and your merchants, and the tribes' wheat has to
          pass through the towns to be sold. You are poorer than your father, and have a few
          years left. The scholars of Kairouan scatter across the western Mediterranean.
      - label: "Fight on for Kairouan"
        legitimacy_bp: 200
        unrest_bp: 2000
        wealth_bp: -1500
        outcome: >-
          You spend the treasure on a field army that cannot win and cannot retire.
      - label: "Make terms with the Arab chiefs"
        wealth_bp: -2500
        legitimacy_bp: -800
        outcome: >-
          They accept your gold, and a month later demand more.
    history: >-
      The Banu Hilal took Kairouan in 1057; al-Mu'izz had retreated to Mahdia, where the
      Zirids held the coastal towns for another century.
    sources: ["Ibn Khaldun, Kitab al-Ibar 6", "al-Tijani", "Idris, La Berbérie orientale sous les Zirides (1962)", "Brett, 'The Arab Conquest and the Rise of Islamic Ifriqiya' (1995)"]

  - id: zir_pisans
    scenario: year_1000
    civ: zirids
    year: 1088
    title: "Ships off Mahdia"
    place: "Mahdia"
    speaker: general
    speaker_name: "The harbour captain"
    speaker_title: "Of the arsenal of Mahdia"
    benchmark_provinces: 1
    story: >-
      You are Tamim ibn al-Mu'izz, fifty-six, and for twenty-six years you have ruled the
      coast. Your fleets have raided Sicily and Italy, Pisan and Genoese merchants have
      traded in your ports, and your poets write verses about your gardens. But Italian
      cities have grown strong, and the Pisans and Genoese want to be rid of the corsairs
      of Mahdia.


      Last year a fleet of Pisan, Genoese, Amalfitan and other ships came out of the night.
      They took Zawila, the suburb on the mainland, and a part of Mahdia's own harbour,
      burned ships, and killed many, and it was only after a day's fighting that your men
      stopped them. The attackers came in the name of St Peter, they say, and the pope is
      said to have blessed them.
    choices:
      - label: "Make peace on terms, and pay"
        historical: true
        legitimacy_bp: -300
        wealth_bp: -2500
        outcome: >-
          The attackers sail away with a large payment, the release of captives, and the
          promise that the corsairs will stop raiding Italian shores. You have kept Mahdia and
          you have kept your word to the Italians, for the most part. Your merchants will go on trading with the Italians for another generation.
      - label: "Rebuild the fleet and strike back"
        legitimacy_bp: 500
        wealth_bp: -2500
        unrest_bp: 800
        outcome: >-
          You spend the treasury on new ships. The Italians, as it turns out, have more.
        deeds: {ships: 3}
      - label: "Ask Egypt, or the tribes, for help"
        legitimacy_bp: -800
        wealth_bp: -500
        outcome: >-
          Nobody answers. You are neither a friend of Cairo nor of the nomads.
    history: >-
      In 1087 a fleet from Pisa, Genoa, Amalfi and other cities stormed part of Mahdia and
      sacked Zawila, and withdrew when Tamim agreed to pay a large sum and release captives;
      it is often seen as a first step of the Italian cities' conquests in the Mediterranean.
    sources: ["Carmen in victoriam Pisanorum", "Ibn al-Athir, al-Kamil", "Idris, La Berbérie orientale sous les Zirides (1962)", "Abulafia, The Two Italies (1977)"]

  - id: zir_roger_first
    scenario: year_1000
    civ: zirids
    year: 1123
    title: "The Count of Sicily Lands"
    place: "Mahdia"
    speaker: general
    speaker_name: "A coast watcher"
    speaker_title: "From the cape"
    benchmark_provinces: 1
    story: >-
      You are al-Hasan ibn Ali, sixteen years old and emir of Mahdia for two years. Your
      father and grandfather were old men when they died, and the realm they left you is the
      coast between Tunis and Gabès, a few ports, a great fleet in decline, and a court that
      likes poetry.


      In Palermo, Roger, the son of the first Norman count of Sicily, has been sending
      envoys. This summer a Sicilian fleet appears off Mahdia and an army lands near the
      fortress of al-Dimas. Your advisers say Roger wants not plunder but the harbour.
    choices:
      - label: "Hold the walls against the landing"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -300
        outcome: >-
          The Sicilians besiege the city in the summer heat, and fever and thirst do the rest.
          Roger withdraws and loses much of his force. Until 1135 your coast will be left alone, but you know the next fleet will be larger.
      - label: "Sail out and meet them at sea"
        legitimacy_bp: 300
        wealth_bp: -800
        outcome: >-
          Your fleet is smaller than theirs, and so is your luck.
        deeds: {ships: 2}
      - label: "Offer Roger a treaty and a tribute"
        wealth_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          The Sicilians take the first payment and come back for the second.
    history: >-
      In 1123 Roger II of Sicily's expedition against Mahdia failed, with heavy losses;
      he did not attack the African coast again in earnest until the 1130s.
    sources: ["Ibn al-Athir, al-Kamil", "Ibn Idhari", "Abulafia, The Two Italies (1977)", "Houben, Roger II of Sicily (2002)"]

  - id: zir_mahdia_falls
    scenario: year_1000
    civ: zirids
    year: 1148
    title: "George of Antioch Comes"
    place: "Mahdia"
    speaker: general
    speaker_name: "George of Antioch"
    speaker_title: "Admiral of King Roger"
    story: >-
      You are al-Hasan ibn Ali, forty-one. Roger, now King of Sicily and a conqueror in the
      Mediterranean, has taken the island of Djerba and Tripoli, and in the last few years
      his admiral, George of Antioch, a Greek Christian from Syria, has raided and held the
      coast of Ifriqiya. Other towns of the coast have fallen or gone over to him.


      Now the Sicilian fleet, said to be two hundred and fifty ships, comes to Mahdia. Your
      own people have been struck by famine, and the Arab tribes of the interior will not
      help. Your counsellors say you can fight, leave, or treat.
    choices:
      - label: "Withdraw from Mahdia"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          You and your household leave the city before George's fleet arrives. George takes
          Mahdia without a battle, and the Sicilian king, who leaves the Muslims their laws and
          their courts, will hold the coast for twelve years. You flee westward into Algeria, and will later live as a pensioner of the Almohads, who will end Roger's rule in Africa in 1160.
      - label: "Fight behind the walls"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          Mahdia's wall is the strongest in Africa, and your people are starving. The Sicilians
          try you for a few weeks.
      - label: "Surrender on terms to George"
        legitimacy_bp: -1500
        wealth_bp: -1000
        outcome: >-
          Roger accepts your submission and promises you a pension.
    history: >-
      In June 1148 George of Antioch's fleet reached Mahdia; al-Hasan, the last Zirid, left
      the city and the Sicilians took it without a fight. Roger's African kingdom lasted until
      the Almohads took Mahdia in 1160.
    sources: ["Ibn al-Athir, al-Kamil", "Romuald of Salerno, Chronicon", "Abulafia, The Two Italies (1977)", "Houben, Roger II of Sicily (2002)"]
