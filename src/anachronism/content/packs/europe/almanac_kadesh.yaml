schema_version: 1
# Chronicle mode (D-120, D-133): meanwhile, in the world, 1275-1200 BC (told in an Egyptian
# chronicle). Dates are approximate, as all Bronze Age dates are.
almanac:
  - {id: kd_ugarit_alphabet, scenario: kadesh, year: -1274, needs_alive: [ugarit], text: "In Ugarit, scribes press thirty wedge-shaped letters into clay tablets: an alphabet, each sign a single sound. They use it to write down their songs of Baal and the sea."}
  - {id: kd_adad_nirari, scenario: kadesh, year: -1270, needs_alive: [assyria], text: "King Adad-nirari of Assyria writes to the Hittite king calling himself his 'brother'. The Hittite king replies: 'Were you and I born of the same mother?'"}
  - {id: kd_hanigalbat_falls, scenario: kadesh, year: -1263, needs_alive: [assyria], text: "Shalmaneser of Assyria crushes the last king of Mitanni and claims to have blinded 14,400 prisoners. Assyria now stands on the Euphrates, facing Hatti."}
  - {id: kd_wilusa, scenario: kadesh, year: -1260, needs_alive: [wilusa], text: "On the Anatolian coast, the Hittite king complains to the king of Ahhiyawa - the Achaean Greeks - about a war over Wilusa. Three thousand years later, scholars will wonder whether Wilusa is Homer's Ilios: Troy."}
  - {id: kd_pylos, scenario: kadesh, year: -1250, needs_alive: [mycenae], text: "In the palace of Pylos, scribes record on clay tablets in Linear B every sheep, chariot wheel and jar of oil in the kingdom of Nestor - in an early form of Greek."}
  - {id: kd_lion_gate, scenario: kadesh, year: -1250, needs_alive: [mycenae], text: "At Mycenae, the walls are rebuilt with stones so huge that later Greeks will say only the Cyclopes could have lifted them. Over the new gate, two lions stand on either side of a column."}
  - {id: kd_babylon_letter, scenario: kadesh, year: -1250, needs_alive: [babylon], text: "The king of Babylon complains that his merchants have been murdered on the road through Syria, and that the Hittite king calls him a weakling. Great kings write to each other in Akkadian, the French of the Bronze Age."}
  - {id: kd_tukulti, scenario: kadesh, year: -1225, needs_alive: [assyria, babylon], text: "Tukulti-Ninurta of Assyria sacks Babylon, carries off the statue of Marduk and makes himself king of Sumer and Akkad. A poem is written to celebrate it. His own sons will murder him."}
  - {id: kd_nimrud_hatti_famine, scenario: kadesh, year: -1215, needs_alive: [hatti], text: "Hatti is short of grain. Hittite kings write urgently to Ugarit and to Egypt: a ship of grain is 'a matter of life or death'."}
  - {id: kd_ugarit_last, scenario: kadesh, year: -1190, needs_alive: [ugarit], text: "The king of Ugarit writes to the king of Alashiya: 'My father, behold, the enemy's ships came; my cities were burned.' The tablet is still in the kiln when the city falls."}
