schema_version: 1
# Chronicle mode (D-120, D-137): England from Æthelred to Hastings, 1002-1066.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Anglo-Saxon Chronicle, Thietmar of Merseburg, the Encomium Emmae
# Reginae, William of Jumièges and William of Poitiers, the Bayeux Tapestry, Henry of
# Huntingdon and William of Malmesbury (the last two a century later, and fond of a story),
# with modern work by Keynes, Lawson, Bolton, Barlow, Baxter and Licence. England's kings
# here run on through Cnut and his sons, as they did: the chronicle follows the crown,
# not one family. benchmark_provinces counts the provinces of this map the English crown held.
chapters:
  - id: eng_emma
    scenario: year_1000
    civ: england
    year: 1002
    title: "Where the Danes Winter"
    place: "Winchester"
    speaker: steward
    speaker_name: "Eadric Streona"
    speaker_title: "A rising ealdorman"
    benchmark_provinces: 4
    story: >-
      The Danish fleets have been raiding your coasts for twenty years, and they have
      learned that the cheapest place to winter and refit is across the Channel, in
      Normandy, where Duke Richard's people speak their language and buy their plunder.


      Duke Richard has a sister, Emma, about seventeen. Your counsellors say a marriage would
      close the Norman harbours to the Danes. Your first wife is dead; you have six sons
      already. Emma's children, if she has them, will be Normans by their mother.
    choices:
      - label: "Marry Emma of Normandy"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Emma lands in the spring and is crowned queen. She is renamed Ælfgifu, an English
          name, which she will ignore all her life. Her son Edward will be half Norman - and
          one day a Norman duke will claim England through her.
        deeds: {ally_with: [normandy]}
      - label: "Marry an English noblewoman"
        legitimacy_bp: 500
        influence: {nobility: 1500}
        deeds: {men: 1000}
        outcome: >-
          The great families are pleased, and bring their thegns to your muster. The Norman
          harbours stay open to the Danes.
      - label: "Pay Duke Richard to close his harbours"
        wealth_bp: -1000
        legitimacy_bp: 300
        outcome: >-
          Richard takes the silver and promises to turn the Danes away. His promise lasts as
          long as the silver.
    history: >-
      Æthelred married Emma, sister of Duke Richard II of Normandy, in 1002. Through her, her
      great-nephew William would later claim the English throne.
    sources: ["Anglo-Saxon Chronicle 1002", "Encomium Emmae Reginae", "Keynes, The Diplomas of King Æthelred (1980)"]

  - id: eng_st_brice
    scenario: year_1000
    civ: england
    year: 1002
    title: "St Brice's Day"
    place: "Winchester"
    speaker: steward
    speaker_name: "Eadric Streona"
    speaker_title: "A rising ealdorman"
    benchmark_provinces: 4
    story: >-
      You have paid the Danes twenty-four thousand pounds this year to go away. But many
      Danes live in England - settlers, traders, mercenaries in your own pay - and your
      counsellors say they are plotting to kill you and your council and seize the
      kingdom.


      They suggest a solution: on St Brice's day, the thirteenth of November, every Dane
      in England is to be killed.
    choices:
      - label: "Give the order"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          In Oxford the Danes flee into St Frideswide's church, and the townsmen burn it down
          with them inside. Somewhere in England, it is said, the victims include Gunnhild,
          sister of King Sweyn Forkbeard of Denmark. Sweyn swears revenge.
        deeds: {grudges: {denmark: 6000}}
      - label: "Expel the Danish mercenaries, and spare the settlers"
        legitimacy_bp: 300
        outcome: >-
          The mercenaries are paid off and shipped home. The Danish farmers of the north go on
          ploughing - and remember who spared them.
        deeds: {grudges: {denmark: 1500}}
      - label: "Do nothing; it is a rumour"
        legitimacy_bp: -300
        outcome: >-
          No plot appears. Your counsellors say that proves how well it was hidden.
    history: >-
      Æthelred ordered the killing of 'all the Danish men who were among the English' on
      13 November 1002. A charter of 1004 describes the burning of St Frideswide's church in
      Oxford, and in 2008 a mass grave of young men killed around this time was found at St
      John's College, Oxford.
    sources: ["Anglo-Saxon Chronicle 1002", "St Frideswide's charter (S 909)", "Wallis, St John's College excavations (2014)"]

  - id: eng_danegeld
    scenario: year_1000
    civ: england
    year: 1006
    title: "Danegeld"
    place: "Shropshire"
    speaker: steward
    speaker_name: "Archbishop Wulfstan"
    speaker_title: "Archbishop of York"
    benchmark_provinces: 4
    story: >-
      The Danish army has marched across Wessex in midwinter, past your forces, lighting
      their 'beacons' - your burning villages - and has sat on the downs at Cwichelm's Barrow,
      where an old saying promised they would never get back to the sea alive. They got back
      to the sea.


      Now they want thirty-six thousand pounds to leave. Archbishop Wulfstan says that the
      Danes are God's punishment for England's sins, and that paying them is like feeding a
      wolf.
    choices:
      - label: "Pay the Danes to leave"
        historical: true
        wealth_bp: -4000
        unrest_bp: 800
        outcome: >-
          The silver is collected from every shire and handed over. The Danes sail away for a
          year. So much English silver goes to Scandinavia that, a thousand years later, more
          of your coins will be found in Sweden than in England.
      - label: "Raise the shires and fight"
        food_bp: -2000
        legitimacy_bp: 500
        outcome: >-
          The shire levies gather - and wait for each other, and argue about who is in
          command. The Danes burn two more towns and leave anyway.
        deeds: {war_with: [denmark], men: 8000}
      - label: "✦ Pay them in paper, and keep the silver"
        needs_adopted: [paper_money]
        wealth_bp: -1000
        legitimacy_bp: 300
        outcome: >-
          The Danes are paid in printed notes promising silver at your mints. They spend them
          in English markets, and the silver never leaves England.
      - label: "Pay half now and half after they sail"
        wealth_bp: -2500
        unrest_bp: 500
        legitimacy_bp: -300
        outcome: >-
          The Danes take the first half and, after some argument, wait for the second. They
          leave only when it is paid, and meanwhile they eat the shire.
    history: >-
      In 1006-7 a Danish army ravaged Wessex; in 1007 Æthelred paid 36,000 pounds. Huge
      numbers of Æthelred's silver pennies have been found in Scandinavia.
    sources: ["Anglo-Saxon Chronicle 1006-7", "Wulfstan, Sermo Lupi ad Anglos (1014)", "Blackburn, Viking Coinage and Currency (2011)"]

  - id: eng_fleet
    scenario: year_1000
    civ: england
    year: 1008
    title: "The Great Fleet"
    place: "Sandwich"
    speaker: general
    speaker_name: "Brihtric"
    speaker_title: "Brother of Eadric Streona"
    benchmark_provinces: 4
    story: >-
      You have ordered the whole kingdom to build a fleet: every three hundred and ten
      hides of land must provide a warship, every eight hides a helmet and a mail coat. Now
      the ships are gathered at Sandwich: more than England has ever had.


      But one of your captains, Wulfnoth of Sussex, has been accused of treason by Brihtric,
      the brother of your favourite Eadric, and has sailed off with twenty ships to go
      raiding on his own. Brihtric wants eighty ships to hunt him down.
    choices:
      - label: "Let Brihtric go after him"
        historical: true
        legitimacy_bp: -1500
        materials_bp: -2000
        outcome: >-
          A storm drives Brihtric's eighty ships onto the shore, and Wulfnoth burns them. The
          rest of the fleet sails back to London, 'and let all the nation's toil thus lightly
          pass away,' says the chronicle. That summer Thorkell the Tall lands with the
          biggest Danish army yet.
        deeds: {ships: 30}
      - label: "Keep the fleet together, and leave Wulfnoth"
        legitimacy_bp: 500
        materials_bp: -2000
        unrest_bp: 500
        outcome: >-
          The fleet stays at Sandwich all summer, and the crews grow sick of waiting. When
          Thorkell's army appears off the coast, it finds England's ships waiting, and goes to
          France instead.
        deeds: {ships: 120}
      - label: "✦ Build caravels that can beat to windward"
        needs_adopted: [caravel]
        legitimacy_bp: 1500
        materials_bp: -2500
        outcome: >-
          Your shipwrights build high-sided ships with lateen sails that can sail into the
          wind. The Danish longships, which must row against it, are caught off the coast and
          sunk one after another.
        deeds: {ships: 150, grudges: {denmark: 2000}}
      - label: "Pardon Wulfnoth and call him back"
        legitimacy_bp: 500
        wealth_bp: -500
        unrest_bp: 500
        deeds: {ships: 70}
        outcome: >-
          Wulfnoth comes back with his twenty ships, and Brihtric's friends say you have made a
          pirate a captain. The fleet sails, with some bad feeling in the ranks.
    history: >-
      In 1008 Æthelred ordered a national fleet; in 1009 Brihtric's quarrel with Wulfnoth
      (father of Earl Godwin) and a storm destroyed much of it, and Thorkell's great army
      arrived.
    sources: ["Anglo-Saxon Chronicle 1008-9"]

  - id: eng_alphege
    scenario: year_1000
    civ: england
    year: 1012
    title: "Ælfheah's Ransom"
    place: "Greenwich"
    speaker: diviner
    speaker_name: "Ælfheah"
    speaker_title: "Archbishop of Canterbury, a prisoner"
    benchmark_provinces: 4
    story: >-
      Thorkell's army took Canterbury by treachery last autumn and carried off the
      archbishop, Ælfheah, in chains. For seven months they have dragged him round with them,
      waiting for a ransom of three thousand pounds.


      You could pay it. But Ælfheah has sent word: he forbids anyone to pay a penny for him.
      His people are poor enough already.
    choices:
      - label: "Respect his wish"
        historical: true
        legitimacy_bp: 800
        influence: {clergy: 1500}
        outcome: >-
          At Easter the Danes, drunk on wine from the south, pelt the archbishop with ox bones
          and cattle skulls at their feast, until one of them, a man he had baptised the day
          before, kills him with the back of an axe. Thorkell, who tried to stop them, is
          disgusted. He changes sides, and brings forty-five ships into your service.
        deeds: {ships: 45, men: 4000}
      - label: "Pay the ransom anyway"
        wealth_bp: -2000
        legitimacy_bp: 800
        influence: {clergy: 500}
        outcome: >-
          Ælfheah comes home, furious and alive, and preaches against you for buying him like
          a slave.
      - label: "Send a party to seize him back"
        legitimacy_bp: 1500
        unrest_bp: 500
        deeds: {men: 1500}
        outcome: >-
          Your thegns ride for Greenwich by night. They arrive too late, and find the Danes
          already drunk and the archbishop dead.
    history: >-
      Archbishop Ælfheah (St Alphege) was killed by Danes at Greenwich on 19 April 1012
      after refusing to be ransomed. Thorkell the Tall then entered Æthelred's service with
      45 ships.
    sources: ["Anglo-Saxon Chronicle 1011-12", "Thietmar of Merseburg 7.42-43"]

  - id: eng_sweyn
    scenario: year_1000
    civ: england
    year: 1013
    until_year: 1016
    title: "Forkbeard"
    place: "London"
    speaker: denmark
    speaker_name: "Sweyn Forkbeard"
    speaker_title: "King of Denmark"
    needs_alive: [denmark]
    benchmark_provinces: 4
    story: >-
      Sweyn of Denmark has come himself, this time not for silver but for the kingdom. He
      sailed up the Humber, and the whole of the north and the Danelaw submitted to him at
      once. Oxford and Winchester have opened their gates. Only London, with Thorkell and
      his ships, still holds out for you.


      Your counsellors are going over to Sweyn one by one. Emma has already taken your young
      sons to her brother in Normandy.
    choices:
      - label: "Follow your family to Normandy"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1500
        outcome: >-
          You spend Christmas on the Isle of Wight and cross to Normandy. London submits. Sweyn
          is accepted as king of all England. Then, five weeks later, on the third of February
          1014, Sweyn dies at Gainsborough.
        deeds: {give: [m_northumbria, m_mercia, m_east_anglia], give_to: denmark}
      - label: "Hold London and fight to the end"
        legitimacy_bp: 1000
        food_bp: -3000
        outcome: >-
          London's walls hold all winter. The north is Sweyn's; the south still yours. England
          is two kingdoms.
        deeds: {war_with: [denmark], give: [m_northumbria, m_east_anglia], give_to: denmark}
      - label: "Offer Sweyn tribute and keep Wessex"
        legitimacy_bp: -1500
        wealth_bp: -1500
        deeds: {give: [m_northumbria], give_to: denmark}
        outcome: >-
          Your envoys carry gold and a promise of homage for the north. Sweyn answers that he
          will take the whole kingdom, and that your gold may pay for the part he leaves you.
    history: >-
      In 1013 Sweyn Forkbeard conquered England and Æthelred fled to Normandy. Sweyn died on
      3 February 1014, after barely five weeks as king.
    diverged: >-
      Denmark is gone, and Sweyn never comes.
    sources: ["Anglo-Saxon Chronicle 1013-14"]

  - id: eng_return
    scenario: year_1000
    civ: england
    year: 1014
    until_year: 1018
    after: [eng_sweyn]
    title: "The King Over the Water"
    place: "Rouen"
    speaker: steward
    speaker_name: "Your son Edward"
    speaker_title: "Ten years old, your envoy"
    benchmark_provinces: 1
    story: >-
      Sweyn is dead. His army in England has chosen his son Cnut as king. But the English
      councillors have sent to you in Normandy: they will take you back, they say, 'if he
      would govern them more justly than he did before'.


      You have sent your young son Edward to them with your promise. They want more than a
      promise: they want you to forgive everyone who went over to the Danes, and to correct
      everything that was done wrong.
    choices:
      - label: "Accept the councillors' terms"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          It is the first time an English king has made terms with his people to get his
          throne. You land in the spring with an army; Cnut sails back to Denmark - after
          cutting off the hands, ears and noses of the hostages his father took, and leaving
          them on the beach at Sandwich.
        deeds: {take: [m_northumbria, m_mercia, m_east_anglia]}
      - label: "Promise nothing, and take the throne back by force"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          You land with Norman knights and take back Wessex. The north waits for Cnut.
        deeds: {take: [m_mercia]}
      - label: "Come home with Norman knights and a limited pardon"
        legitimacy_bp: 1500
        unrest_bp: 500
        deeds: {men: 3000}
        outcome: >-
          Duke Richard lends knights, and you promise to pardon only those who stood by you. The
          councillors accept, but whisper that the pardon is thin.
    history: >-
      In 1014 the English invited Æthelred back on condition that he rule more justly; he
      returned and drove Cnut out. The agreement is sometimes called the first constitutional
      settlement in English history.
    sources: ["Anglo-Saxon Chronicle 1014"]

  - id: eng_assandun
    scenario: year_1000
    civ: england
    year: 1016
    until_year: 1020
    title: "Ironside"
    place: "Assandun, in Essex"
    speaker: general
    speaker_name: "Edmund Ironside"
    speaker_title: "The king's son"
    needs_alive: [denmark]
    benchmark_provinces: 4
    story: >-
      Cnut has come back with a great army, and your father Æthelred is dead in London. You
      are king now, Edmund, and they call you Ironside. You have fought Cnut five times this
      year, from Somerset to Kent, and won three of them.


      Now the armies face each other at Assandun in Essex. Ealdorman Eadric Streona, who has
      already changed sides twice, is commanding your right wing.
    choices:
      - label: "Fight with Eadric on the right"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          In the middle of the battle Eadric and his men turn and leave the field. 'All the
          nobility of the English race was there destroyed.' You and Cnut meet on an island in
          the Severn at Alney and divide the kingdom: you keep Wessex, he takes the north. Six
          weeks later you are dead - of wounds, of illness or, some will say, of murder.
        deeds: {give: [m_northumbria, m_mercia], give_to: denmark}
      - label: "Dismiss Eadric before the battle"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Eadric is sent away in disgrace and takes his men home. The thinned English line holds
          for a day and then gives way, and Cnut takes the north. You are still young, and you
          have time.
        deeds: {give: [m_northumbria], give_to: denmark, grudges: {denmark: 2000}}
      - label: "✦ Fight with crossbows from behind a wall of stakes"
        needs_adopted: [crossbow]
        legitimacy_bp: 2500
        outcome: >-
          Your levies, armed with crossbows any farmer can shoot, cut down the Danish charge
          before it reaches your shield wall. Cnut gets away with a few ships. Eadric, seeing
          which way it went, stays loyal.
        deeds: {war_with: [denmark], grudges: {denmark: 3000}}
      - label: "Withdraw behind London's walls"
        legitimacy_bp: -500
        food_bp: -1000
        deeds: {give: [m_northumbria], give_to: denmark}
        outcome: >-
          You refuse battle and retire to London, leaving the north to Cnut. The city's walls
          hold, and your levies melt away over the winter.
    history: >-
      Æthelred died in April 1016. Edmund Ironside fought Cnut repeatedly and lost at Assandun
      on 18 October after Eadric Streona deserted; the kingdoms were divided at Alney, and
      Edmund died on 30 November. Cnut became king of all England.
    diverged: >-
      Denmark is gone; there is no Cnut to fight.
    sources: ["Anglo-Saxon Chronicle 1016", "Encomium Emmae Reginae 2"]

  - id: eng_north_sea
    scenario: year_1000
    civ: england
    year: 1018
    title: "Cnut Takes Stock"
    place: "Oxford"
    speaker: steward
    speaker_name: "Earl Godwin"
    speaker_title: "A Sussex thegn, newly made earl"
    benchmark_provinces: 2
    story: >-
      Cnut is king of England. He has married Æthelred's widow, Emma - who has agreed on
      condition that her sons by Cnut come first. He has had Eadric Streona executed, 'so
      that he would be paid what he was owed'. He has paid off his Danish army with the
      largest geld ever raised: eighty-two thousand pounds.


      And now his brother the King of Denmark has died. Cnut could be king of both
      kingdoms, with the North Sea between them as a road. An Englishman called Godwin, whose
      father was the pirate Wulfnoth, has become his most trusted adviser.
    choices:
      - label: "Rule England by Edgar's laws"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -1500
        outcome: >-
          At Oxford, English and Danes swear to keep the laws of King Edgar. The Danish army
          is sent home, except for a guard of housecarls. England is at peace for the first
          time in a generation, and Cnut rules from Winchester an empire of England, Denmark
          and Norway.
        deeds: {take: [m_northumbria, m_mercia], peace_with: [denmark], ally_with: [denmark]}
      - label: "Rule England as a Danish conquest"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Danish earls take the English lands. The English nobility sulk on their estates and
          wait for an Æthelred's son to come back from Normandy.
        deeds: {take: [m_northumbria, m_mercia]}
      - label: "Share the earldoms among both peoples"
        legitimacy_bp: 2700
        unrest_bp: -1000
        deeds: {take: [m_northumbria, m_mercia], peace_with: [denmark]}
        outcome: >-
          Danes and English hold earldoms side by side, and each suspects the other of being
          favoured. The country is quieter than it has been in years.
    history: >-
      Cnut (r. 1016-1035) married Emma in 1017, paid off his fleet with a huge geld in 1018
      and agreed at Oxford to rule by Edgar's laws. He became king of Denmark in 1019 and of
      Norway in 1028. Godwin rose to be Earl of Wessex.
    sources: ["Anglo-Saxon Chronicle 1017-19", "Cnut's letter to the English (1019/20)"]

  - id: eng_waves
    scenario: year_1000
    civ: england
    year: 1027
    title: "A Flatterer's Remark"
    place: "The shore at Southampton"
    speaker: steward
    speaker_name: "One of your courtiers"
    speaker_title: "A flatterer"
    benchmark_provinces: 4
    story: >-
      You have come back from Rome, where you watched Emperor Conrad crowned, walked in the
      procession beside him, and persuaded the Pope and the Burgundians to lower the tolls on
      English pilgrims. You are the most powerful king in the north.


      Your courtiers are saying that even the sea would obey you. You have had your chair
      carried down to the shore as the tide is coming in.
    choices:
      - label: "Let the tide come in, then speak"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 800}
        outcome: >-
          The tide comes in over your feet. You stand up and tell the courtiers: 'Let all men
          know how empty and worthless is the power of kings.' Then, the story goes, you hang
          your crown on a crucifix at Winchester and never wear it again.
      - label: "Have the chair moved back"
        legitimacy_bp: 300
        outcome: >-
          The courtiers laugh, and the tide comes in over nothing in particular.
      - label: "Dismiss the flatterers from court"
        legitimacy_bp: 1200
        influence: {nobility: -500}
        outcome: >-
          You send the loudest of your courtiers away. The rest are careful about what they say,
          and the nobles resent the lesson.
    history: >-
      Cnut went to Rome in 1027 for Conrad II's coronation and negotiated lower tolls for
      pilgrims. The story of Cnut and the waves is first told by Henry of Huntingdon (c.
      1130) - as a lesson in humility, not arrogance.
    sources: ["Cnut's letter of 1027", "Henry of Huntingdon, Historia Anglorum 6.17"]

  - id: eng_alfred
    scenario: year_1000
    civ: england
    year: 1036
    title: "The Ætheling at Guildford"
    place: "Guildford"
    speaker: steward
    speaker_name: "Earl Godwin"
    speaker_title: "Earl of Wessex"
    benchmark_provinces: 4
    story: >-
      Cnut is dead at forty. His son Harold Harefoot holds England, while Harthacnut, Emma's
      son by Cnut, is stuck in Denmark fighting the Norwegians. And now Emma's other son by
      Æthelred, Alfred the Ætheling, has landed from Normandy with a few hundred men -
      invited, he says, by a letter from his mother.


      Earl Godwin has met Alfred on the road and offered him hospitality for the night at
      Guildford. Godwin is waiting for your answer: whose side is he on?
    choices:
      - label: "Let Harold's men take Alfred"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          In the night Alfred's men are seized, sold, mutilated or killed. Alfred is blinded
          on board a ship and dies of it at Ely. Godwin swears for the rest of his life that he
          had nothing to do with it. Alfred's brother Edward never believes him.
      - label: "Protect the ætheling"
        legitimacy_bp: 800
        unrest_bp: 1500
        outcome: >-
          Godwin escorts Alfred to Winchester, to his mother. England has two claimants and a
          civil war brewing.
      - label: "Send Alfred back to Normandy"
        legitimacy_bp: -500
        wealth_bp: -300
        outcome: >-
          Alfred is escorted back to the coast and set on a ship. His mother is angry, and
          so is half of Wessex.
    history: >-
      Alfred the Ætheling was captured at Guildford in 1036 while in Godwin's company and
      died after being blinded. Godwin's part in it was never cleared up.
    sources: ["Anglo-Saxon Chronicle 1036 (C)", "Encomium Emmae Reginae 3"]

  - id: eng_confessor
    scenario: year_1000
    civ: england
    year: 1043
    title: "The King from Normandy"
    place: "Winchester"
    speaker: steward
    speaker_name: "Earl Godwin"
    speaker_title: "Earl of Wessex"
    benchmark_provinces: 4
    story: >-
      Harold Harefoot is dead. Harthacnut, who had Harold's body dug up and thrown in the
      Thames, has died too, at a wedding feast, 'as he stood at his drink'. The line of Cnut
      is finished.


      The English want Edward, Æthelred's son by Emma, who has lived in Normandy for
      twenty-five years and is more Norman than English. Earl Godwin has made himself
      kingmaker. His price: Edward marries Godwin's daughter Edith.
    choices:
      - label: "Crown Edward on Godwin's terms"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 1500}
        outcome: >-
          Edward is crowned at Winchester at Easter 1043. He marries Edith. He fills his court
          with Normans and starts building a great abbey at Westminster. There will be no
          children. The Godwins grow richer every year.
      - label: "Refuse Godwin, and rule with the Normans"
        legitimacy_bp: -500
        unrest_bp: 1000
        influence: {nobility: -1500}
        outcome: >-
          Edward appoints a Norman as archbishop and a Norman as earl. The Godwins go home to
          Wessex and begin to plan.
        deeds: {ally_with: [normandy]}
      - label: "Crown Edward, and keep Godwin at bay"
        legitimacy_bp: 1500
        unrest_bp: 500
        influence: {nobility: 500}
        outcome: >-
          Edward is crowned, and Godwin's price is not paid. The earl goes home to Wessex, and
          the Norman courtiers are pleased.
    history: >-
      Harthacnut died in June 1042; Edward the Confessor was crowned in 1043 and married
      Godwin's daughter Edith in 1045. The marriage was childless.
    sources: ["Anglo-Saxon Chronicle 1040-45", "Vita Ædwardi Regis"]

  - id: eng_harold_oath
    scenario: year_1000
    civ: england
    year: 1064
    title: "William's Guest"
    place: "Bayeux, Normandy"
    speaker: normandy
    speaker_name: "William, Duke of Normandy"
    speaker_title: "Cousin of King Edward"
    needs_alive: [normandy]
    benchmark_provinces: 4
    story: >-
      Harold Godwinson, Earl of Wessex and the greatest man in England after the king,
      crossed the Channel on some errand and was shipwrecked on the coast of Ponthieu. Its
      count threw him in prison for ransom; Duke William of Normandy rescued him, and has
      been feasting him and taking him on campaign in Brittany.


      Now William asks Harold for something in return: an oath, sworn on holy relics, to
      support William's claim to the English throne when old King Edward dies.
    choices:
      - label: "Harold gives William his oath"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Harold lays his hands on two reliquaries and swears. Then William lifts the cloth to
          show the bones of saints hidden beneath. Harold goes home with William's gifts and
          an oath he will break.
      - label: "Harold refuses, and stays a prisoner"
        legitimacy_bp: 500
        outcome: >-
          William keeps Harold in Rouen as a 'guest'. England sends envoys to ransom its earl.
        deeds: {grudges: {normandy: 2000}}
      - label: "Harold offers silver instead of an oath"
        wealth_bp: -800
        legitimacy_bp: 300
        outcome: >-
          William takes the silver, and says that a guest who is rescued does not offer coin.
          Harold is kept at Rouen until he agrees to something.
    history: >-
      The Bayeux Tapestry and Norman writers say Harold swore an oath to William around 1064;
      English sources are silent. What Harold promised, and whether under duress, is unknown.
    diverged: >-
      Normandy is gone; no duke claims England.
    sources: ["Bayeux Tapestry", "William of Poitiers, Gesta Guillelmi 1.41-42", "Eadmer, Historia Novorum"]

  - id: eng_stamford
    scenario: year_1000
    civ: england
    year: 1066
    title: "Hardrada at York"
    place: "York"
    speaker: general
    speaker_name: "Harold Godwinson"
    speaker_title: "King of England"
    benchmark_provinces: 4
    story: >-
      Edward is dead, and on his deathbed he gave the kingdom to you, Harold, with his hand
      outstretched. You were crowned the same day in his new abbey at Westminster. All
      summer you have waited on the south coast for Duke William, who swears you are a
      perjurer and is building a fleet.


      Instead, the King of Norway has come: Harald Hardrada, the last great Viking, who has
      fought for the emperor in Constantinople. Your exiled brother Tostig is with him. They
      have beaten the northern earls at Fulford and taken York. You have marched two hundred
      miles north in four days.
    choices:
      - label: "Attack the Norwegians at once"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          The Norwegians are caught resting on both banks of the Derwent, without their
          armour. Legend says one huge Norwegian holds the bridge alone until an Englishman
          floats under it in a barrel and spears him from below. Hardrada is killed with an
          arrow in his throat; Tostig falls. The Norwegians came in three hundred ships and go
          home in twenty-four. Three days later, William lands at Pevensey.
        deeds: {men: 5000}
      - label: "Offer Tostig his earldom back if he changes sides"
        legitimacy_bp: 800
        deeds: {men: 1500}
        outcome: >-
          Your envoy carries the offer and a few hundred of your northern men are sent to cover
          the talks. Tostig asks what Hardrada will get. 'Seven feet of English ground,' you answer, 'or
          as much more as he is taller than other men.' Tostig stays with Hardrada. The battle
          is fought anyway, and won.
      - label: "Wait for the northern earls first"
        legitimacy_bp: 2000
        deeds: {men: 3000}
        outcome: >-
          The northern earls bring in their men, and the army marches larger. The Norwegians
          have another day to form up before you reach them.
    history: >-
      Edward the Confessor died on 5 January 1066; Harold was crowned the next day. On 25
      September he destroyed Harald Hardrada's army at Stamford Bridge. William landed at
      Pevensey on 28 September.
    sources: ["Anglo-Saxon Chronicle 1066", "Snorri Sturluson, Haralds saga Sigurðarsonar", "Henry of Huntingdon 6.27"]

  - id: eng_hastings
    scenario: year_1000
    civ: england
    year: 1066
    title: "Senlac Hill"
    place: "Near Hastings"
    speaker: general
    speaker_name: "Gyrth Godwinson"
    speaker_title: "Your brother"
    benchmark_provinces: 4
    story: >-
      You have marched your army back south in two weeks, gathering levies on the way. Duke
      William is at Hastings, burning the villages of your own earldom to draw you on. Your
      brother Gyrth begs you to stay in London and let him fight: you swore an oath to
      William, he says, and if you are killed, England has no king. And half your army is
      still on the road.


      William has knights, archers and crossbowmen. You have a shield wall of housecarls and
      farmers, on a ridge.
    choices:
      - label: "Fight at once, on the ridge"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 3000
        outcome: >-
          All day the shield wall holds the ridge. Twice the Normans pretend to flee and draw
          the English down after them. Late in the afternoon you are killed - by an arrow in
          the eye, the story will say, and by knights who cut you down. Gyrth and Leofwine die
          beside you. On Christmas Day William is crowned in Westminster Abbey. The young
          ætheling Edgar, the last of the old royal line, is all that is left.
        deeds: {ruler_falls: "is killed at Hastings", give: [m_wessex, m_east_anglia], give_to: normandy}
      - label: "Wait in London for the whole army"
        legitimacy_bp: 300
        food_bp: -2000
        unrest_bp: 1500
        outcome: >-
          You stay in London. William's army burns the south coast and takes the towns of Kent
          while the south wonders where its king is. When you march out in November, you have
          twice as many men.
        deeds: {war_with: [normandy], grudges: {normandy: 3000}}
      - label: "✦ Line the ridge with musketeers"
        needs_adopted: [musket]
        legitimacy_bp: 3000
        outcome: >-
          The Norman knights charge up the hill into rolling volleys of smoke and lead. Their
          horses will not face the noise. By noon Duke William is dead and his army is
          fleeing to its ships. England will not be Norman.
        deeds: {war_with: [normandy], grudges: {normandy: 4000}}
      - label: "Let Gyrth lead the fight"
        legitimacy_bp: -1000
        unrest_bp: 1500
        deeds: {give: [m_wessex], give_to: normandy}
        outcome: >-
          Gyrth takes the army south and you stay in London. The battle is lost, though the king
          is alive, and the south is William's.
    history: >-
      On 14 October 1066 William defeated and killed Harold at Hastings, after a battle that
      lasted most of the day. William was crowned on 25 December. Edgar Ætheling submitted, and
      lived until about 1126.
    sources: ["Anglo-Saxon Chronicle 1066", "William of Poitiers", "Bayeux Tapestry", "Baxter & Lewis, on the battle (2016-)"]
