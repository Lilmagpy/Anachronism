schema_version: 1
# Chronicle mode (D-120, D-XXX): the kings of Pamplona and Navarre, from Sancho III's Castilian
# marriage to the restoration of García Ramírez, 1000-1160 (the first chapter opens in 1010).
# Each chapter opens in its year; one choice is what history chose (historical: true). Facts
# follow the Codex of Roda, the Historia Silense, the charters of San Millán and Leyre, and the
# Navarrese and Aragonese chronicles of the 12th and 13th centuries, with modern work by
# Collins, Reilly, Lacarra and Fletcher. The traditional story of Sancho III's
# division of his realm among his sons is disputed by some modern historians, and the text
# says so. benchmark_provinces counts the provinces of this map the real kings held: Navarre
# (which stands for the whole Basque kingdom, and from 1076 to 1134 for Aragon as well); León and
# Castile for the single year 1034 only (Sancho III held Castile from 1029, but this map
# folds Castile into León and the kings of Castile are counted in the León chronicle); and
# Zaragoza from 1118 to 1134. Alfonso the Battler's death is put at 1133 (it was September 1134) so that García Ramírez
# reigns when the 1134 chapter opens on the two-year grid.
chapters:
  - id: nav_bride
    scenario: year_1000
    civ: navarre
    year: 1010
    title: "The Count's Daughter"
    place: "Nájera"
    speaker: steward
    speaker_name: "Your mother's chancellor"
    speaker_title: "Of the royal court"
    benchmark_provinces: 1
    story: >-
      You are Sancho Garcés, the king of Pamplona, and you are twenty. You were a boy when your
      father García the Trembler died. Your aunt Abda was the wife of the great Almanzor, whose
      raids once terrified every Christian king, but he is dead, his sons are dead or fallen,
      and Córdoba is tearing itself apart in civil war. The danger from the south has gone.


      To the west lies Castile, the county of Sancho García, a frontier land full of horsemen.
      His daughter Muniadona is of marriageable age. Your lords tell you that a marriage would
      end a dangerous quarrel on your frontier. Others say a Gascon bride would give you friends in
      the north, and leave the Castilian border to your horsemen.
    choices:
      - label: "Wed Muniadona, the count's daughter"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 800}
        outcome: >-
          About 1010 you marry Muniadona, and the long quarrel with Castile is stilled. Her brother
          García will be the last count of his line, and one day her marriage will matter more
          than anyone now guesses. Meanwhile you turn to the south, where the Moorish lords of
          the Ebro valley are weak and divided.
        deeds: {peace_with: [cordoba]}
      - label: "Wed a princess of Gascony"
        legitimacy_bp: 1700
        influence: {nobility: 500}
        outcome: >-
          The Gascon dukes are glad of you, and the match is praised across the Pyrenees, but
          Castile is left to quarrel on your western border.
        deeds: {martial_bp: 300}
      - label: "Guard the border, and wed no one yet"
        unrest_bp: 500
        wealth_bp: 500
        outcome: >-
          Your horsemen are kept busy, and the count of Castile makes ready.
        deeds: {men: 2000}
    history: >-
      About 1010 Sancho III of Pamplona (reigned 1004-1035) married Muniadona, daughter of
      Count Sancho García of Castile; her claim would bring him Castile in 1029.
    sources: ["Codex of Roda (Códice de Roda)", "Collins, The Basques (1986)", "Fletcher, The Quest for El Cid (1989)"]

  - id: nav_castile
    scenario: year_1000
    civ: navarre
    year: 1030
    title: "The Murder at León"
    place: "Pamplona"
    speaker: general
    speaker_name: "A Castilian count"
    speaker_title: "At your court"
    benchmark_provinces: 1
    story: >-
      You are Sancho, and you are forty. You have been king for twenty-six years and you have
      doubled your realm: Sobrarbe and Ribagorza in the Pyrenees, Álava and Rioja along the
      Ebro, and the road to Santiago passes through your cities. Cluniac monks have come to
      your monasteries.


      In May 1029 the young count García of Castile, Muniadona's brother, went to León to marry
      the infanta Sancha, the sister of King Vermudo III, and was murdered there by the Vela
      family on the steps of a church. His line is ended. His sister is your queen. Castile has no
      count, and Vermudo of León would like to have it.
    choices:
      - label: "Take Castile in your queen's name"
        historical: true
        legitimacy_bp: 2000
        influence: {nobility: 800}
        outcome: >-
          The Castilian lords accept you, and your son Ferdinand is made count of the land. The king of León has a claim, but not the strength. You are now the most powerful
          Christian king in Spain, with lands from Aragon to the edge of León.
        deeds: {martial_bp: 300, peace_with: [cordoba]}
      - label: "Leave Castile to the king of León"
        legitimacy_bp: -1000
        influence: {nobility: -300}
        outcome: >-
          Vermudo takes the county without trouble. Your queen weeps for her brother, and your
          barons murmur at your weakness.
        deeds: {peace_with: [leon]}
      - label: "Take only Castile's eastern marches"
        legitimacy_bp: 1600
        influence: {nobility: 400}
        outcome: >-
          You take the lands along the Ebro and the Rioja road, which are closest to your own,
          and leave the western counties to Vermudo. The Castilian lords there are not pleased
          to be divided, but what you hold is secure and your title is widely accepted.
        deeds: {martial_bp: 200}
    history: >-
      After the murder of Count García in 1029 Sancho III took Castile through his wife
      Muniadona, and placed his son Ferdinand in it.
    sources: ["Historia Silense", "Codex of Roda", "Fletcher, The Quest for El Cid (1989)"]

  - id: nav_emperor
    scenario: year_1000
    civ: navarre
    year: 1034
    title: "King of the Spains"
    place: "León"
    speaker: scholar
    speaker_name: "A monk of Leyre"
    speaker_title: "Your chancellor"
    benchmark_provinces: 2
    story: >-
      You are Sancho, and you are forty-four. Vermudo III of León, a young king with a divided
      court, has quarrelled with his own barons. Your army is in
      the field, the Leonese lords are leaving their king, and the road to León is open.


      Your monks and clerks have a name for you: "king of the Spains", the lord of all the Christian
      lands from the Pyrenees to Galicia. Some of them have even said "emperor", as the
      Leonese kings once did. It is a bold title for the lord of a mountain valley, and Vermudo still has friends.
    choices:
      - label: "Take León from the weakened Vermudo"
        historical: true
        legitimacy_bp: 3000
        influence: {clergy: 800, nobility: 800}
        outcome: >-
          In 1034 you ride into León; Vermudo flees to Galicia. Your charters call you king of
          the Spains and the title of emperor, once held by Alfonso III, is yours too. It will
          last no longer than you do. Your sons, who cannot hold it together, will share it.
        deeds: {take: [m_leon], peace_with: [cordoba]}
      - label: "Take his border lands, spare his crown"
        legitimacy_bp: 2500
        influence: {nobility: 500}
        outcome: >-
          Vermudo keeps León, a vassal in all but name, and you keep what you have. The
          Christian world hears that you spared an anointed king, and your name rises.
        deeds: {martial_bp: 300, peace_with: [leon]}
      - label: "Hold what you have, go no further"
        legitimacy_bp: -800
        unrest_bp: -500
        outcome: >-
          Vermudo's barons are relieved, and your enemies forget their fear.
        deeds: {peace_with: [leon]}
    history: >-
      In 1034 Sancho III entered León, forcing King Vermudo III into Galicia, and used the
      titles of king of the Spains and emperor in his charters.
    sources: ["Historia Silense", "Codex of Roda", "Collins, Early Medieval Spain (1983)"]

  - id: nav_division
    scenario: year_1000
    civ: navarre
    year: 1036
    title: "Your Father's Will"
    place: "Pamplona"
    speaker: ruler
    speaker_name: "Your brother Ferdinand"
    speaker_title: "Count of Castile"
    benchmark_provinces: 1
    story: >-
      You are García, and you are sixteen. Your father, Sancho the Great, died last October and is
      buried at Oña. The tradition is that he divided his realm among his sons before he died:
      to you, the eldest, Pamplona with Álava and Rioja; to Ferdinand, Castile, with the title
      of king; to Gonzalo, Sobrarbe and Ribagorza; and to Ramiro, his son by another woman,
      the mountain county of Aragon. Some modern historians think he intended less than that,
      and that the later chroniclers shaped the story.


      Vermudo III has already come back to León, and your brothers are watching each other. You
      are the eldest, and you hold the royal title of Pamplona. Is that enough?
    choices:
      - label: "Accept the division, keep Pamplona"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You rule Pamplona, and the other brothers rule their own lands. León is Vermudo's again,
          and Ferdinand, the second son, will kill him at Tamarón in 1037 and inherit his whole
          kingdom. You have the oldest title and the least land.
        deeds: {give: [m_leon], give_to: leon}
      - label: "Claim your brothers' lands as the eldest son"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          They will not obey you, and each of them has his own army.
        deeds: {give: [m_leon], give_to: leon}
      - label: "Keep León too, and fight Vermudo for it"
        legitimacy_bp: 1000
        unrest_bp: 300
        outcome: >-
          The Leonese accept a boy as their king for the sake of peace, and the barons are quiet
          for now. Ferdinand, watching, will make good use of the first chance.
    history: >-
      Sancho III died in October 1035, and his kingdom passed to his sons in the traditional
      division: García in Pamplona, Ferdinand in Castile, Gonzalo and Ramiro in the Pyrenean
      counties. Vermudo III recovered León.
    sources: ["Historia Silense", "Codex of Roda", "Lacarra, Historia política del reino de Navarra (1972-73)", "Reilly, The Kingdom of León-Castilla under Queen Urraca (1982)"]

  - id: nav_atapuerca
    scenario: year_1000
    civ: navarre
    year: 1054
    title: "The Field of Atapuerca"
    place: "Atapuerca, east of Burgos"
    speaker: general
    speaker_name: "Your knights"
    speaker_title: "Of the Navarrese host"
    benchmark_provinces: 1
    story: >-
      You are García, king of Pamplona, and you are about thirty-five. You have made Nájera your
      capital and built the church of Santa María la Real there. You have taken tribute from the Moorish kings to the south and added lands to your
      kingdom.


      Your brother Ferdinand now rules León and Castile, and he is the strongest king in Spain.
      The border between you has been disputed for years, in the hills east of Burgos. He is
      advancing with his army. Your men are many, but his are better led.
    choices:
      - label: "Meet Ferdinand's army in the field"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          On 15 September 1054 the two armies meet in the hills at Atapuerca and García is
          killed. The battle ends your kingdom's greatest days. Your young son Sancho is
          proclaimed king, and Ferdinand takes the lands of Bureba and Montes de Oca. Navarre's
          frontier is pushed back eastward, and it will not recover it.
      - label: "Treat with Ferdinand over the frontier"
        legitimacy_bp: -800
        unrest_bp: 500
        outcome: >-
          Bureba and the pass at Oca are Ferdinand's. You still live to see your son grow
          up.
        deeds: {peace_with: [leon]}
      - label: "Fall back on Nájera and defend it"
        legitimacy_bp: -1000
        wealth_bp: -800
        outcome: >-
          Ferdinand has the larger army and the time, and your land is laid waste while you wait.
    history: >-
      García Sánchez III was killed fighting his brother Ferdinand I of León-Castile at
      Atapuerca on 15 September 1054; Ferdinand annexed the Bureba and the Montes de Oca.
    diverged: >-
      León is gone.
    sources: ["Historia Silense", "Codex of Roda", "Fletcher, The Quest for El Cid (1989)"]

  - id: nav_penalen
    scenario: year_1000
    civ: navarre
    year: 1076
    title: "The Cliff at Peñalén"
    place: "Peñalén, above the Ebro"
    speaker: steward
    speaker_name: "An old retainer"
    speaker_title: "In your household"
    benchmark_provinces: 1
    story: >-
      You are Sancho IV, and you have reigned for twenty-two years. Your neighbours have
      not left you in peace. Alfonso VI of León-Castile presses on the Rioja border, and your
      cousin Sancho Ramírez, king of Aragon, holds the mountains. You have quarrelled with your
      own nobles as well as with your neighbours.


      Your brother Ramón and your sister Ermesinda are ill content. They have the ear of some of
      those lords, and the retainer who warns you has seen a good deal in his life. You are
      riding with Ramón along the clifftops at Peñalén. It is June.
    choices:
      - label: "Keep to your ride with Ramón"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          On 4 June 1076 Ramón and Ermesinda push you over the cliff of Peñalén. The murder
          cannot be hidden. Alfonso VI takes the Rioja, Álava and the Basque coast, and the
          Navarrese lords, who do not wish to be ruled from Burgos, turn to your cousin
          Sancho Ramírez of Aragon and acclaim him king at Pamplona. Aragon and Navarre have the
          same king for the next fifty-eight years.
        deeds: {ruler_falls: "is thrown from the cliff at Peñalén", peace_with: [leon]}
      - label: "Arrest Ramón and Ermesinda first"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          You take the plotters by surprise, and your hold on Navarre lasts a little longer.
          Alfonso VI and Sancho Ramírez are waiting.
        deeds: {martial_bp: 300}
      - label: "Divide the realm between Alfonso and Sancho Ramírez"
        legitimacy_bp: -2000
        outcome: >-
          You give your neighbours what they want, and your own nobles hate you for it.
        deeds: {peace_with: [leon]}
    history: >-
      Sancho IV of Pamplona was murdered by his brother Ramón and sister Ermesinda at Peñalén on
      4 June 1076. Alfonso VI took the Rioja and the Basque lands, and Sancho Ramírez of Aragon
      was acclaimed king of Pamplona.
    sources: ["Codex of Roda", "Crónica de San Juan de la Peña", "Lacarra, Historia política del reino de Navarra (1972-73)", "Fletcher, The Quest for El Cid (1989)"]

  - id: nav_zaragoza
    scenario: year_1000
    civ: navarre
    year: 1118
    title: "The Battler at Zaragoza"
    place: "Zaragoza"
    speaker: general
    speaker_name: "A knight of the Crusade"
    speaker_title: "In the royal host"
    benchmark_provinces: 2
    story: >-
      You are Alfonso, called the Battler, and you rule Aragon and Navarre together. You are
      not a man for the court, and you have no heir; you married Urraca of León and Castile
      to make an alliance, but it came to nothing and ended in a divorce. Your whole life is war
      with the Moors.


      Zaragoza, the great city of the Ebro, is rich, divided and ill defended. The pope has
      granted crusade indulgences against it, and French knights have come south with the
      Gaston of Béarn and Rotrou of Perche. The city's walls are strong.
    choices:
      - label: "Besiege Zaragoza, with the French crusaders"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 2000
        outcome: >-
          After a siege through the summer and autumn, the city of Zaragoza surrenders on 18
          December 1118. The Muslim inhabitants are allowed to stay in the city, and you make it
          your capital. It makes you the greatest of the kings in Spain; a few years later you
          have taken Tudela and Calatayud as well.
        deeds: {take: [m_zaragoza]}
      - label: "Take tribute from Zaragoza's king instead"
        wealth_bp: 2500
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Zaragoza's king pays you a heavy tribute and stays rich and weak. Your knights, and
          the French crusaders, are disappointed to leave the walls unscaled, but the gold is
          real and your name is respected.
        deeds: {peace_with: [cordoba]}
      - label: "Turn instead against Castile and Urraca"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Your quarrel with Urraca gives you nothing but more quarrels.
        deeds: {men: 3000}
    history: >-
      Alfonso I the Battler of Aragon and Navarre captured Zaragoza on 18 December 1118, after
      a siege with French crusaders, and made it his capital.
    sources: ["Crónica de San Juan de la Peña", "Collins, The Basques (1986)", "Reilly, The Kingdom of León-Castilla under Queen Urraca (1982)"]

  - id: nav_restoration
    scenario: year_1000
    civ: navarre
    year: 1134
    title: "The Restoration"
    place: "Pamplona"
    speaker: steward
    speaker_name: "The bishop of Pamplona"
    speaker_title: "Of the cathedral"
    benchmark_provinces: 1
    story: >-
      You are García Ramírez, a lord of Monzón, and you are about thirty-four. Your great-grandfather
      was García III, killed at Atapuerca, and your mother Cristina was a daughter of the Cid.
      Alfonso the Battler was defeated by the Moors at Fraga in the summer, and died of his wounds in September. He left a
      will that gave his whole kingdom to the Templars, the Hospitallers and the canons of the
      Holy Sepulchre, as he had no sons.


      The nobles of Navarre will not have it. They are meeting at Pamplona to choose a king of
      their own, as they did before the kings of Aragon came. The Aragonese have turned
      to Alfonso's brother, the monk Ramiro. Alfonso VII, king of León and Castile, is waiting
      with an army.
    choices:
      - label: "Accept the crown of Navarre, and part from Aragon"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 800, clergy: 500}
        outcome: >-
          In the autumn of 1134 the Navarrese nobles elect you at Pamplona. You are king, but not of
          Aragon, and not of Zaragoza, which stays with the Aragonese. For a few years you must
          pay homage to Alfonso VII of León and Castile, but Navarre is a kingdom of its own again,
          and it will stay one for nearly four centuries.
        deeds: {give: [m_zaragoza], give_to: barcelona, peace_with: [leon]}
      - label: "Accept Alfonso's will and the rule of the military orders"
        legitimacy_bp: -1500
        influence: {clergy: 1500, nobility: -1000}
        outcome: >-
          The Templars are far away, and the Navarrese nobles are angry at being given away.
        deeds: {give: [m_zaragoza], give_to: barcelona}
      - label: "Submit to the king of León and Castile as your overlord"
        influence: {nobility: -800}
        legitimacy_bp: 2700
        outcome: >-
          Alfonso VII is pleased, and as his vassal you have his protection and the recognition
          of the courts of Spain. Your own nobles, who wanted a free Navarre, take it badly.
        deeds: {give: [m_zaragoza], give_to: barcelona}
    history: >-
      After Alfonso the Battler's death in September 1134, the Navarrese elected García Ramírez
      as king, restoring a separate kingdom; the Aragonese chose Ramiro II. Zaragoza stayed
      with Aragon.
    sources: ["Crónica de San Juan de la Peña", "Lacarra, Historia política del reino de Navarra (1972-73)", "Collins, The Basques (1986)"]
