schema_version: 1
# Chronicle mode (D-120, D-139): the last Achaemenid king, Darius III, 336-330 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Persia left no history of its own for these years; everything here comes from the Greek
# and Roman writers on Alexander (Arrian, Diodorus 17, Curtius Rufus, Plutarch, Justin), who
# made Darius a coward to make Alexander a hero, with Babylonian records and modern work by
# Briant (Darius in the Shadow of Alexander), Kuhrt and Llewellyn-Jones. The player can
# change the story: the 'other' choices are the ones Darius's own advisers urged on him.
# benchmark_provinces counts the provinces of this map the real Persia held at that date.
chapters:
  - id: per_bagoas
    scenario: alexander
    civ: persia
    year: -336
    title: "The Kingmaker's Cup"
    place: "The palace at Susa"
    speaker: steward
    speaker_name: "Bagoas"
    speaker_title: "Chiliarch, the commander of the thousand"
    benchmark_provinces: 21
    story: >-
      Two years ago the eunuch Bagoas poisoned King Artaxerxes III. He put the king's young
      son Arses on the throne, and when Arses began to show a will of his own, he poisoned him
      too, with his children. Then he chose you: Artashata, a distant royal cousin, famous
      for killing a Cadusian champion in single combat. You have taken the throne name Darius.


      Now Bagoas has brought you a cup of wine with his own hands, and is watching you very
      closely. Your physician, standing behind him, has gone pale.
    choices:
      - label: "Hand Bagoas the cup, and make him drink it"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 1500}
        outcome: >-
          You thank Bagoas warmly for his loyalty, and insist that he drink first, as an
          honour. He drinks, and dies. The court learns that the new king is no one's puppet.
      - label: "Pour it out, and keep Bagoas close"
        legitimacy_bp: 500
        outcome: >-
          Bagoas watches the wine soak into the carpet and smiles. You will have to watch every
          cup for the rest of your reign.
    history: >-
      Diodorus says the eunuch Bagoas poisoned Artaxerxes III (338 BC) and Arses (336), made
      Darius III king, and tried to poison him in turn, but was forced by Darius to drink the
      poison himself.
    sources: ["Diodorus 17.5", "Briant, Darius in the Shadow of Alexander (2015)"]

  - id: per_zeleia
    scenario: alexander
    civ: persia
    year: -334
    until_year: -332
    title: "Memnon's Advice"
    place: "The council of satraps at Zeleia"
    speaker: general
    speaker_name: "Memnon of Rhodes"
    speaker_title: "Commander of the Greek mercenaries"
    needs_alive: [macedon]
    needs_owner: {a3_ionia: persia}
    benchmark_provinces: 21
    story: >-
      The young king of Macedon has crossed the Hellespont with thirty-seven thousand men and
      supplies for thirty days, and only seventy talents in his treasury. Your satraps of the
      west have gathered at Zeleia with their cavalry and Memnon's Greek mercenaries.


      Memnon, a Greek from Rhodes who knows the Macedonians, says: do not fight him. Fall
      back, burn the crops and the villages in front of him, and let him starve. Meanwhile
      take the fleet across to Greece and raise Athens and Sparta behind him.


      Arsites, satrap of Hellespontine Phrygia, says he will not let one house of his
      people be burned. The other satraps agree: they suspect Memnon wants the war to last
      so that he stays important.
    choices:
      - label: "Let the satraps fight at the Granicus"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          The satraps line the river bank with their cavalry. Alexander charges across it. A
          brother-in-law of yours, Mithridates, is killed by Alexander himself; Spithridates
          nearly kills him first. The Greek mercenaries are massacred. Arsites goes away and
          kills himself. Sardis surrenders without a fight.
        deeds: {war_with: [macedon], give: [a3_ionia, a3_lydia, a3_caria], give_to: macedon}
      - label: "Burn the land, and give Memnon the fleet"
        legitimacy_bp: 500
        food_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Smoke rises over the Troad. The Macedonian army marches through an empty country
          with nothing to eat, and turns back to the Hellespont before the summer is out.
          Memnon's ships sail for Greece with Persian gold.
        deeds: {war_with: [macedon], grudges: {macedon: 1000}}
    history: >-
      At Zeleia in 334 BC the satraps rejected Memnon's scorched-earth plan and fought at the
      Granicus, where they were defeated. Arrian reports the debate.
    diverged: >-
      Ionia is not yours, or Macedon is gone: the satraps never gather at Zeleia.
    sources: ["Arrian, Anabasis 1.12-16", "Diodorus 17.18-21"]

  - id: per_memnon
    scenario: alexander
    civ: persia
    year: -333
    title: "The Fever at Mytilene"
    place: "Susa"
    speaker: general
    speaker_name: "Pharnabazus"
    speaker_title: "Memnon's nephew"
    benchmark_provinces: 18
    story: >-
      You made Memnon commander of the whole western sea. He has taken Chios and most of
      Lesbos, and was besieging Mytilene; Greek cities were sending him envoys; the Spartans
      were ready to rise. Alexander had sent his own fleet home because he could not pay it.


      And now Memnon is dead of a fever at Mytilene. His nephew Pharnabazus wants to carry
      on the war at sea. Your generals want the Greek mercenaries brought back to join the
      royal army, which you will lead yourself.
    choices:
      - label: "Recall the mercenaries; the king will fight himself"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The mercenaries march east to join the great army gathering at Babylon. The war at
          sea fizzles out. Everything now depends on one battle.
        deeds: {men: 30000}
      - label: "Give Pharnabazus the fleet and the gold, and carry the war to Greece"
        wealth_bp: -3000
        outcome: >-
          Persian ships land Spartan and Athenian exiles in the Peloponnese. Antipater, ruling
          Macedon while Alexander is away, has a war at home.
        deeds: {grudges: {macedon: 2000}}
    history: >-
      Memnon died in 333 BC while besieging Mytilene. Darius recalled the Greek mercenaries to
      the royal army; the naval counter-offensive faded.
    sources: ["Arrian, Anabasis 2.1-2", "Diodorus 17.29-31"]

  - id: per_issus
    scenario: alexander
    civ: persia
    year: -333
    until_year: -331
    title: "The Narrow Plain"
    place: "Sochoi, in Syria"
    speaker: general
    speaker_name: "Amyntas, son of Antiochus"
    speaker_title: "A Macedonian exile in your service"
    needs_alive: [macedon]
    needs_war_with: [macedon]
    benchmark_provinces: 18
    story: >-
      You have gathered the royal army on the wide plain at Sochoi in Syria, where your
      cavalry and your numbers can be used. Alexander has been lying sick at Tarsus, and then
      dawdling in Cilicia. Your courtiers say he is afraid of you, and urge you to go and
      find him.


      Amyntas, a Macedonian exile who knows Alexander, begs you to wait. He will come, he
      says. And when he does, he will want to fight you here, where the ground suits you.
    choices:
      - label: "March to find him, through the mountains to Issus"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          You get behind him and take Issus - and find yourself on a plain too narrow for your
          army, with Alexander coming back at you. His Companions charge straight for your
          chariot. You turn and flee, leaving your shield and your cloak - and your mother,
          your wife, your daughters and your little son in your camp. Alexander treats them
          with every honour. You will not see them again.
        deeds: {give: [a3_cilicia, a3_cappadocia], give_to: macedon}
      - label: "Wait at Sochoi, as Amyntas says"
        legitimacy_bp: 500
        food_bp: -1500
        outcome: >-
          You wait. Alexander comes over the Syrian Gates in his own time, onto the open plain,
          and finds your cavalry on both flanks. He does not attack. Neither do you. The
          summer ends with both armies in their camps.
      - label: "✦ Wait - and dig a line of cannon across the plain"
        needs_adopted: [cannon]
        legitimacy_bp: 3000
        outcome: >-
          When the Companions charge, your guns fire grape shot at a hundred paces. The charge
          dissolves; Alexander is carried from the field. His army falls back to Cilicia.
        deeds: {grudges: {macedon: 3000}}
    history: >-
      Darius left the open plain at Sochoi against Amyntas's advice and met Alexander at Issus
      in November 333 BC, where he was defeated and his family captured.
    diverged: >-
      There is no war with Macedon.
    sources: ["Arrian, Anabasis 2.6-12", "Plutarch, Alexander 20"]

  - id: per_letter
    scenario: alexander
    civ: persia
    year: -332
    until_year: -330
    title: "Half the Empire"
    place: "Babylon"
    speaker: steward
    speaker_name: "Your chiliarch"
    speaker_title: "Commander of the thousand"
    needs_alive: [macedon]
    needs_war_with: [macedon]
    benchmark_provinces: 16
    story: >-
      Your mother, Sisygambis, and your family are Alexander's prisoners. You have written to
      him as one king to another, asking for them back and offering friendship. He replied
      as if you were his subject: come to me and ask, and do not write to me as an equal.


      Now your council proposes a greater offer: ten thousand talents, your daughter's hand,
      and everything west of the Euphrates. Half the empire.
    choices:
      - label: "Make the offer"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Alexander reads the letter to his council. Parmenion says that if he were Alexander
          he would accept. Alexander says: so would I, if I were Parmenion. The war goes on.
          You start raising a new army in the east, greater than the last.
        deeds: {men: 40000}
      - label: "Make no offers; raise every man in the east"
        legitimacy_bp: 800
        outcome: >-
          The horsemen of Bactria, Sogdia and the Saka steppe are called to Babylon. You order
          scythed chariots and send to India for elephants.
        deeds: {men: 50000}
    history: >-
      Darius made at least two peace offers after Issus, including the lands west of the
      Euphrates; Alexander refused them.
    diverged: >-
      The war with Macedon is over.
    sources: ["Arrian, Anabasis 2.14, 2.25", "Curtius 4.11"]

  - id: per_gaza
    scenario: alexander
    civ: persia
    year: -332
    until_year: -330
    title: "Batis at Gaza"
    place: "Gaza"
    speaker: general
    speaker_name: "Batis"
    speaker_title: "Commander of Gaza"
    needs_war_with: [macedon]
    needs_owner: {a3_judea: persia}
    benchmark_provinces: 16
    story: >-
      Tyre has fallen after seven months; Alexander crucified two thousand of its men along
      the beach. Your Phoenician fleets have gone over to him. Only Gaza, on its mound at the
      edge of the desert, stands between him and Egypt.


      Its commander, Batis, a eunuch with a garrison of Arabs and Persians, says he can hold
      out for months. The Macedonian engineers say the walls are too high to be taken.
    choices:
      - label: "Tell Batis to hold to the end"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Gaza holds for two months. Alexander is wounded in the shoulder by a catapult bolt.
          When the city falls, its men are killed and its women sold, and Batis, the story
          goes, is dragged round the walls behind Alexander's chariot, as Achilles dragged
          Hector. Egypt opens its gates to Alexander without a fight.
        deeds: {give: [a3_phoenicia, a3_judea, a3_egypt, a3_upper_egypt], give_to: macedon}
      - label: "Send the satrap of Egypt's army to relieve Gaza"
        food_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          Mazaces marches out of Egypt with every man he has. Gaza holds; Egypt is left empty,
          and its people, who hate Persian rule, rise.
        deeds: {give: [a3_phoenicia, a3_egypt], give_to: macedon}
    history: >-
      Gaza resisted Alexander for two months in 332 BC; the story of Batis being dragged behind
      a chariot is in Curtius. Egypt's satrap Mazaces then surrendered without fighting.
    diverged: >-
      Gaza is not yours, or the war is over.
    sources: ["Arrian, Anabasis 2.25-27", "Curtius 4.6"]

  - id: per_gaugamela
    scenario: alexander
    civ: persia
    year: -331
    until_year: -329
    title: "The Levelled Plain"
    place: "Gaugamela, east of the Tigris"
    speaker: general
    speaker_name: "Mazaeus"
    speaker_title: "Satrap of Babylon, commander of the right"
    needs_war_with: [macedon]
    needs_alive: [macedon]
    benchmark_provinces: 12
    story: >-
      This time you have chosen the ground. The plain at Gaugamela has been levelled for your
      two hundred scythed chariots. You have Bactrian and Saka horsemen in armour, fifteen
      Indian elephants, and more men than anyone has counted.


      Alexander's campfires are in the hills. Your scouts say he may attack in the dark. Your
      generals want the army to stand to arms all night, in case he does.
    choices:
      - label: "Keep the army standing all night"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Your army waits all night in its armour. In the morning, tired, it watches Alexander
          slide his line to the right, off your levelled ground. Your chariots charge and are
          let through the Macedonian ranks and cut down. A gap opens in your left; Alexander
          drives into it, straight at you. Once more you turn your chariot and flee. Babylon
          and Susa open their gates.
        deeds: {give: [a3_assyria, a3_babylonia, a3_susiana], give_to: macedon}
      - label: "Let the men sleep, with pickets out"
        legitimacy_bp: 500
        outcome: >-
          Your army wakes rested. When Alexander slides to the right, your Bactrian cavalry
          follows and holds him. The battle grinds on until evening, and both armies are still
          on the field at nightfall.
        deeds: {grudges: {macedon: 2000}}
      - label: "✦ Muskets behind the chariots"
        needs_adopted: [musket]
        legitimacy_bp: 3500
        outcome: >-
          Behind your chariots stand ten thousand Immortals with matchlocks. When the Companions
          come, they fire. The Macedonian charge breaks against smoke and lead, and the
          Macedonians retreat over the Tigris.
        deeds: {grudges: {macedon: 4000}}
    history: >-
      At Gaugamela on 1 October 331 BC Darius's army, kept under arms all night, was broken
      by Alexander's oblique attack; Darius fled to Ecbatana.
    diverged: >-
      The war with Macedon is over.
    sources: ["Arrian, Anabasis 3.8-15", "Babylonian Astronomical Diary for 331 BC"]

  - id: per_gates
    scenario: alexander
    civ: persia
    year: -330
    until_year: -328
    title: "The Persian Gates"
    place: "The pass to Persepolis"
    speaker: general
    speaker_name: "Ariobarzanes"
    speaker_title: "Satrap of Persis"
    needs_war_with: [macedon]
    needs_owner: {a3_persis: persia}
    benchmark_provinces: 9
    story: >-
      Alexander is marching on Persepolis, the heart of Persia, through the Zagros mountains in
      winter. Ariobarzanes, satrap of Persis, has walled the narrow pass called the Persian
      Gates and is waiting above it with his men. The Macedonians walked into the gorge, and
      he rolled boulders down on them until they ran.


      But prisoners say there may be another way round, by a shepherd's path through the
      forest. Ariobarzanes has too few men to guard both.
    choices:
      - label: "Hold the gates; trust the snow to guard the path"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          A Lycian shepherd leads Alexander round by night through the snow. At dawn trumpets
          sound behind you. Ariobarzanes and his men fight their way out and are cut down. The
          treasury of Persepolis falls, and the palace of your fathers is burned.
        deeds: {give: [a3_persis], give_to: macedon}
      - label: "Send men to guard the shepherd's path"
        legitimacy_bp: 2000
        outcome: >-
          The Macedonians come along the path at night and meet spears in the dark. Alexander
          has to turn back to the plains. Persepolis is safe this winter.
        deeds: {grudges: {macedon: 2000}}
    history: >-
      In January 330 BC Ariobarzanes held the Persian Gates until Alexander was guided round
      by a herdsman; Persepolis fell and its palace was burned that spring.
    diverged: >-
      Persis is not yours, or the war is over.
    sources: ["Arrian, Anabasis 3.18", "Curtius 5.3-4"]

  - id: per_bessus
    scenario: alexander
    civ: persia
    year: -330
    until_year: -327
    title: "Patron's Warning"
    place: "The road east from Ecbatana"
    speaker: general
    speaker_name: "Patron"
    speaker_title: "Captain of your Greek guard"
    needs_war_with: [macedon]
    benchmark_provinces: 6
    story: >-
      You are retreating east with what is left, to raise a new army in Bactria. Bessus,
      satrap of Bactria and your kinsman, and Nabarzanes, your chiliarch, have proposed that
      you hand over command to Bessus 'for a while', since the gods seem to have turned
      against you. You drew your sword on them. They begged forgiveness.


      Now Patron, captain of the four thousand Greek mercenaries still loyal to you, has come
      to your tent in the night. Bessus and Nabarzanes mean to seize you, he says. Come and
      sleep among the Greeks.
    choices:
      - label: "'I will not trust foreigners over my own Persians'"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          Bessus's men put you in golden chains and a covered wagon. When Alexander's
          horsemen catch up, they stab you and leave you in the wagon by the road. A
          Macedonian soldier finds you dying and gives you water. Bessus rides east and
          calls himself King of Kings, Artaxerxes.
        deeds: {ruler_falls: "is murdered by Bessus and the satraps"}
      - label: "Sleep among the Greeks, and arrest Bessus at dawn"
        legitimacy_bp: 1000
        outcome: >-
          At dawn Patron's men take Bessus and Nabarzanes in their tents. You ride east with
          your Greeks and the Bactrian horsemen, and in the mountains of Bactria you begin to
          raise another army. Alexander will have to come a very long way to find you.
        deeds: {men: 15000}
    history: >-
      In July 330 BC Bessus and Nabarzanes seized Darius, after he had refused Patron's offer
      of protection, and killed him as Alexander closed in. Bessus was executed in 329.
    diverged: >-
      The war has ended another way.
    sources: ["Curtius 5.9-13", "Arrian, Anabasis 3.21"]
