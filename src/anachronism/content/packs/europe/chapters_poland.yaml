schema_version: 1
# Chronicle mode (D-120, D-169): the first Piast kingdom of Poland, from the Congress of
# Gniezno to Casimir the Restorer, 1000-1054. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow Thietmar of Merseburg (a hostile
# witness), Gallus Anonymus, the Russian Primary Chronicle, Cosmas of Prague, Wipo and the
# Annals of Quedlinburg and Hildesheim, with modern work by Knoll, Berend, Urbańczyk and
# Davies. benchmark_provinces counts the provinces of this map the real Piasts held at that
# date.
chapters:
  - id: pol_gniezno
    scenario: year_1000
    civ: poland
    year: 1000
    title: "Otto at Gniezno"
    place: "The cathedral of Gniezno"
    speaker: hre
    speaker_name: "Otto III"
    speaker_title: "Emperor of the Romans"
    needs_alive: [hre]
    benchmark_provinces: 4
    story: >-
      You are Bolesław, Duke of the Poles. Three years ago you bought back from the pagan
      Prussians the body of Bishop Adalbert of Prague, whom they had killed, for its weight in
      gold. Now Adalbert is a saint, and the young emperor Otto III, who loved him, has walked
      barefoot through your country to pray at his tomb.


      Otto dreams of a renewed Roman empire of equal Christian peoples - Italy, Germany, Gaul
      and 'Sclavinia' - and you could be its eastern pillar. He has brought an archbishop for
      Gniezno, so that your church answers to Rome and not to the Germans.
    choices:
      - label: "Give Otto relics and knights"
        historical: true
        legitimacy_bp: 2500
        influence: {clergy: 2000}
        outcome: >-
          Otto takes the imperial diadem from his own head and sets it on yours, gives you a
          copy of the Holy Lance, and calls you brother and partner of the empire. Poland has
          its own archbishop. A German bishop, Thietmar, will write: "God forgive the emperor
          for making a tributary into a lord."
      - label: "Feast him, and keep the relics"
        legitimacy_bp: 2300
        wealth_bp: -300
        outcome: >-
          Otto is pleased with the feasting and goes home with fine furs. The archbishopric is
          granted, and your own people keep the saint's body. The feast costs a great deal.
      - label: "Offer tribute and ask for a royal crown"
        legitimacy_bp: 1000
        wealth_bp: -1000
        influence: {clergy: 500}
        outcome: >-
          Otto hears you graciously and does not refuse. The crown, he says, belongs to the
          great plan he has in mind, and for that there is time. Your gold is gone.
    history: >-
      At the Congress of Gniezno (March 1000) Otto III honoured Bolesław as 'brother and
      partner of the empire' and founded the archbishopric of Gniezno.
    diverged: >-
      The empire is gone; nobody came to Gniezno.
    sources: ["Thietmar of Merseburg 4.45-46", "Gallus Anonymus 1.6", "Knoll, The Resurgence of Polish Monarchy (1972)"]

  - id: pol_prague
    scenario: year_1000
    civ: poland
    year: 1003
    title: "Prague Is in Your Hands"
    place: "Prague"
    speaker: steward
    speaker_name: "One of your Bohemian partisans"
    speaker_title: "In Prague castle"
    needs_alive: [bohemia]
    benchmark_provinces: 4
    story: >-
      Otto III is dead, and the new king of Germany, Henry II, is no friend of yours. In
      Bohemia, Duke Boleslaus III, your cousin, has been thrown out by his nobles; you put
      him back on his throne. He has repaid you by massacring the nobles at a feast.


      Now the Bohemians are begging you to rid them of him, and Prague is in your hands.
    choices:
      - label: "Depose your cousin and rule Bohemia"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Boleslaus is blinded, and you are Duke of Bohemia as well as of Poland, refusing to
          do homage for it to Henry. In 1004 Henry marches on Prague, the Bohemians rise for
          their own princes, and your men flee. It is the beginning of fifteen years of war
          with Germany.
        deeds: {grudges: {bohemia: 3000, hre: 2500}}
      - label: "Give Bohemia to a Bohemian prince"
        legitimacy_bp: 500
        outcome: >-
          A Premyslid prince takes the throne, and owes it to you. Henry is suspicious, but has
          no excuse for war.
      - label: "Keep Boleslaus on his throne, under guard"
        legitimacy_bp: -500
        deeds: {men: 1000}
        outcome: >-
          A Polish garrison stays in Prague castle behind your cousin. The Bohemian nobles who
          wrote to you feel betrayed, and Henry watches the garrison.
    history: >-
      In 1003 Bolesław restored, then blinded, Boleslaus III of Bohemia and ruled Prague until
      Henry II drove him out in 1004.
    diverged: >-
      Bohemia is gone.
    sources: ["Thietmar of Merseburg 5.23-30, 6.11-12", "Cosmas of Prague 1.34-36"]

  - id: pol_bautzen
    scenario: year_1000
    civ: poland
    year: 1018
    title: "Peace at Bautzen"
    place: "Bautzen, in Lusatia"
    speaker: hre
    speaker_name: "Henry II"
    speaker_title: "Emperor"
    needs_alive: [hre]
    benchmark_provinces: 4
    story: >-
      For fifteen years Henry II has invaded your lands, and every time he has gone home with
      nothing. Last year his whole army failed before the little fortress of Niemcza, where
      your men put up crosses on the walls because Henry had pagan Slavs in his army.


      His envoys are offering peace at Bautzen. You keep Lusatia and Milsko, the lands you
      took from the empire. You need peace in the west, because in the east your son-in-law
      Sviatopolk has been driven out of Kiev.
    choices:
      - label: "Make peace, and turn east"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The peace is sworn in January. Four days later you marry Oda, daughter of the
          margrave of Meissen, your fourth wife. In the summer you march on Kiev.
        deeds: {peace_with: [hre]}
      - label: "Fight on for Meissen"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The war goes on into its sixteenth year. Your nobles are tired of it.
        deeds: {martial_bp: 500, grudges: {hre: 2000}}
      - label: "Make peace, and hold the west"
        legitimacy_bp: 2700
        wealth_bp: -500
        deeds: {peace_with: [hre], men: 2000}
        outcome: >-
          The peace is sworn and your garrisons go up in Lusatia and on the Oder. They are
          expensive, and Kiev stays out of your sights.
    history: >-
      The Peace of Bautzen (30 January 1018) ended Bolesław's wars with Henry II, leaving him
      Lusatia and Milsko.
    diverged: >-
      The empire is gone.
    sources: ["Thietmar of Merseburg 8.1", "Annals of Quedlinburg 1018"]

  - id: pol_kiev
    scenario: year_1000
    civ: poland
    year: 1018
    title: "The Road to Kiev"
    place: "Before Kiev"
    speaker: steward
    speaker_name: "Sviatopolk"
    speaker_title: "Your son-in-law, exiled prince of Kiev"
    needs_alive: [rus]
    benchmark_provinces: 5
    story: >-
      Your son-in-law Sviatopolk, the eldest son of Vladimir of Kiev, has been driven out by
      his brother Yaroslav. Your army has beaten Yaroslav on the Bug river, where you were
      teased by his men across the water for your belly, and charged straight into the river
      to answer them. The road to Kiev is open.


      Sviatopolk wants to be put back on his throne. Your knights would like Kiev's gold.
    choices:
      - label: "Take Kiev, and keep the frontier towns"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 3000
        outcome: >-
          You ride into Kiev on 14 August and, the story goes, strike the Golden Gate with your
          sword, notching it: Polish kings will be crowned with a sword called the Notched
          one. You put Sviatopolk on the throne, take Yaroslav's sister Predslava for yourself,
          and go home with Kiev's treasure and the Cherven towns on the frontier. Sviatopolk
          lasts a year.
        deeds: {take: [m_volhynia]}
      - label: "Restore Sviatopolk and take tribute"
        legitimacy_bp: 1500
        wealth_bp: 3000
        deeds: {men: 2000}
        outcome: >-
          Sviatopolk is put back on his throne, and pays a heavy tribute in silver. Part of his
          men join your army, and you take no towns. He is grateful, for a season. Yaroslav is
          not.
      - label: "Garrison Kiev for Sviatopolk"
        legitimacy_bp: 1000
        wealth_bp: 1000
        deeds: {men: 3000}
        outcome: >-
          Your knights hold Kiev for Sviatopolk and eat its stores. The Rus resent them, and
          the gold goes to feed the garrison.
    history: >-
      Bolesław took Kiev on 14 August 1018 for Sviatopolk and annexed the Cherven towns; the
      story of the notched sword (Szczerbiec) is a later legend.
    diverged: >-
      Kiev is gone.
    sources: ["Russian Primary Chronicle 6526", "Thietmar of Merseburg 8.31-33", "Gallus Anonymus 1.7"]

  - id: pol_crown
    scenario: year_1000
    civ: poland
    year: 1024
    title: "Henry's Death"
    place: "Gniezno"
    speaker: diviner
    speaker_name: "The Archbishop of Gniezno"
    speaker_title: "Your own archbishop"
    benchmark_provinces: 5
    story: >-
      Emperor Henry II has died without a son, and the Germans are busy choosing another.
      For twenty-five years you have wanted what Otto III promised you at Gniezno: not a
      diadem as a favour, but a crown of your own, as King of the Poles. The pope has never
      dared to allow it while Henry lived.


      You are nearly sixty. Your archbishop is ready.
    choices:
      - label: "Have the archbishop crown you"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          At Easter 1025 you are anointed and crowned King of the Poles in Gniezno cathedral.
          The Germans call it presumption. You die two months later, and your son Mieszko has
          himself crowned at once, so that the crown is not lost.
      - label: "Ask the new emperor's permission"
        legitimacy_bp: 500
        outcome: >-
          The new emperor, Conrad, says he will think about it. He is still thinking about it
          when you die.
      - label: "Ask the pope for a crown"
        legitimacy_bp: 3000
        wealth_bp: -500
        outcome: >-
          Your envoys cross the Alps with gold and the pope receives them well. The crown is
          promised for the next year, and the pope's answer is still on the road.
    history: >-
      Bolesław was crowned king at Easter 1025, after Henry II's death, and died on 17 June
      1025; Mieszko II was crowned the same year.
    sources: ["Annals of Quedlinburg 1025", "Wipo, Gesta Chuonradi 9", "Gallus Anonymus 1.16"]

  - id: pol_collapse
    scenario: year_1000
    civ: poland
    year: 1030
    title: "Two Armies and a Brother"
    place: "Gniezno"
    speaker: steward
    speaker_name: "Queen Richeza"
    speaker_title: "Your wife, niece of Otto III"
    benchmark_provinces: 4
    story: >-
      You are Mieszko II. You read Latin and Greek; a duchess in Germany has sent you a
      prayer-book, praising you as a king who can praise God in three languages. But your
      brother Bezprym, whom your father passed over, has gone to the Emperor Conrad and to
      Yaroslav of Kiev, and both have promised him your throne.


      Now Conrad is crossing the Oder and Yaroslav is marching on the Cherven towns, together.
      Your queen, Richeza, says the nobles will not fight for you on two fronts.
    choices:
      - label: "Flee to Bohemia"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2500
        outcome: >-
          Yaroslav takes back the Cherven towns, Conrad takes back Lusatia, and Bezprym takes
          the throne and sends the royal crown to Conrad, so that no Pole wears it again. In
          Bohemia you are thrown into prison. Richeza goes home to Germany with your son
          Casimir.
        deeds: {ruler_falls: "flees to Bohemia", give: [m_volhynia], give_to: rus}
      - label: "Stand and fight in the east"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          You muster the army and march against Yaroslav. Conrad takes Lusatia behind you.
        deeds: {men: 2500, grudges: {rus: 2000}}
      - label: "Give up the Cherven towns, fight Conrad"
        legitimacy_bp: -1500
        deeds: {give: [m_volhynia], give_to: rus, men: 2000}
        outcome: >-
          Your envoy offers Yaroslav the Cherven towns for a truce, and the army turns west.
          Your nobles say the king gives away what his father won.
    history: >-
      In 1031 Conrad II and Yaroslav attacked Poland together; Mieszko II fled to Bohemia and
      his brother Bezprym took power, sending the crown to Conrad. Bezprym was murdered in
      1032 and Mieszko returned, dying in 1034.
    sources: ["Wipo, Gesta Chuonradi 29", "Russian Primary Chronicle 6539", "Annals of Hildesheim 1031-1034"]

  - id: pol_relics
    scenario: year_1000
    civ: poland
    year: 1038
    title: "The Saint Is Carried Off"
    place: "The court of the Emperor"
    speaker: hre
    speaker_name: "Henry III"
    speaker_title: "King of Germany, son of the emperor"
    benchmark_provinces: 3
    story: >-
      You are Casimir, son of Mieszko II. After your father died, the nobles rose against
      you, the peasants rose against the nobles and the priests, and the old gods came back.
      You fled to your mother's people in Germany.


      Now Duke Bretislav of Bohemia has ridden through Poland, sacked Gniezno, broken open
      the tomb of St Adalbert and carried his body off to Prague, with the treasure of the
      cathedral, and Silesia too. A cupbearer named Masław has made himself prince of Masovia, and owns no master.
      The emperor's son offers you five hundred knights, if you will hold Poland as his
      man.
    choices:
      - label: "Accept Henry's knights"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You come back with the German knights and begin again, from Kraków, because Gniezno
          is a ruin. They will call you Casimir the Restorer.
        deeds: {capital: m_lesser_poland, give: [m_silesia], give_to: bohemia}
      - label: "Go home alone, as nobody's man"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          You ride back to Poland with a few friends, and find the castles held by whoever
          seized them.
        deeds: {give: [m_silesia], give_to: bohemia}
      - label: "Accept, and rebuild Gniezno"
        legitimacy_bp: 1500
        wealth_bp: -500
        deeds: {give: [m_silesia], give_to: bohemia}
        outcome: >-
          You come home with German knights and set the masons to work on the ruined cathedral.
          Gniezno is far from the frontier and slow to mend, and the money runs out.
    history: >-
      Bretislav I of Bohemia sacked Gniezno in 1038 and took St Adalbert's relics to Prague;
      Casimir I returned with imperial support in 1039 and made Kraków his seat.
    sources: ["Cosmas of Prague 2.2-5", "Gallus Anonymus 1.19", "Berend, Urbańczyk and Wiszewski, Central Europe in the High Middle Ages (2013)"]

  - id: pol_maslaw
    scenario: year_1000
    civ: poland
    year: 1047
    title: "The Cupbearer's Kingdom"
    place: "On the Vistula"
    speaker: rus
    speaker_name: "Yaroslav the Wise"
    speaker_title: "Grand Prince of Kiev, your brother-in-law"
    benchmark_provinces: 3
    story: >-
      You have married Yaroslav of Kiev's sister, Maria Dobroniega, and given back the
      captives your grandfather took from Kiev. Now Yaroslav has come with his army, as he
      promised, to help you against Masław, the former cupbearer who rules Masovia with
      Prussian and Pomeranian allies.
    choices:
      - label: "Join Yaroslav in battle"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Masław's army is destroyed on the Vistula; he flees to the Prussians, who kill him.
          Masovia answers to Kraków again.
        deeds: {martial_bp: 500}
      - label: "Offer Masław terms"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          Masław keeps Masovia as your vassal, and pays when he feels like it.
      - label: "Crush Masław with your own army"
        legitimacy_bp: 1500
        unrest_bp: 500
        deeds: {martial_bp: 300}
        outcome: >-
          Your levies march alone. Masław's army is beaten after a hard campaign, and the
          nobles who served grumble about the burden.
    history: >-
      Casimir I, with Yaroslav's help, defeated Masław of Masovia in 1047.
    diverged: >-
      Kiev is gone.
    sources: ["Russian Primary Chronicle 6555", "Gallus Anonymus 1.20"]

  - id: pol_silesia
    scenario: year_1000
    civ: poland
    year: 1054
    title: "Silesia at a Price"
    place: "Quedlinburg"
    speaker: hre
    speaker_name: "Henry III"
    speaker_title: "Emperor"
    needs_alive: [bohemia]
    benchmark_provinces: 4
    story: >-
      You took Silesia back from Bohemia by force in 1050. The emperor, who sees himself as
      the judge of all the princes of the east, has summoned you and the Duke of Bohemia to
      his court at Quedlinburg.


      His ruling: Silesia stays yours, but you will pay Bohemia every year for it, five
      hundred marks of silver and thirty of gold.
    choices:
      - label: "Accept, and pay"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 1000
        outcome: >-
          You pay. Silesia stays Polish for three hundred years, and the tribute becomes one
          more thing for Poles and Czechs to argue about.
        deeds: {take: [m_silesia]}
      - label: "Refuse the emperor's judgement"
        unrest_bp: 1000
        outcome: >-
          You keep Silesia without paying, and the emperor and the Bohemians remember.
        deeds: {take: [m_silesia], grudges: {bohemia: 2000, hre: 2000}}
      - label: "Offer a smaller yearly sum"
        legitimacy_bp: 500
        wealth_bp: -800
        unrest_bp: 300
        deeds: {take: [m_silesia]}
        outcome: >-
          Your envoys haggle in front of the emperor. Bohemia says it is an insult, and Henry
          orders you to pay what he has set.
    history: >-
      Henry III's judgement at Quedlinburg (1054) confirmed Silesia to Casimir I in return for
      an annual tribute to Bohemia.
    diverged: >-
      Bohemia is gone.
    sources: ["Cosmas of Prague 2.13", "Annals of Altaich 1054"]
