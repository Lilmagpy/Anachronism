schema_version: 1
# Chronicle mode (D-120, D-140): the Hittite empire from Kadesh to its fall, 1275-1190 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the royal archives of Hattusa (the treaties, Hattusili III's 'Apology', the
# letters of the great kings and of Queen Puduhepa, the Bronze Tablet), the Egyptian
# monuments, and the letters from Ugarit, with modern work by Bryce, Beckman, Klengel and
# Singer. Hittite dates are uncertain by a decade or more. benchmark_provinces counts the
# provinces of this map the real Hatti held at that date.
chapters:
  - id: hat_shasu
    scenario: kadesh
    civ: hatti
    year: -1275
    title: "Two Bedouins"
    place: "Behind the walls of Kadesh"
    speaker: general
    speaker_name: "Hattusili"
    speaker_title: "Your brother, lord of the Upper Land"
    benchmark_provinces: 8
    story: >-
      King Benteshina of Amurru has gone over to Egypt, and the young pharaoh Ramesses is
      marching north to take Kadesh. You have called every vassal of the Great King of
      Hatti: Arzawa, Masa, Lukka, Kizzuwatna, Carchemish, Aleppo, Ugarit - forty thousand men
      and two and a half thousand chariots, three men to a chariot. You have emptied your
      treasury to pay them.


      You have hidden this whole army behind the city of Kadesh, on the far side of the
      Orontes. Now you need Ramesses to think you are far away. Your brother Hattusili has
      two Shasu nomads who are willing to walk into the Egyptian camp and lie.
    choices:
      - label: "Send the Shasu, and spring the ambush"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Ramesses believes them and rushes ahead with one division. Your chariots fall on the
          division of Re on the march and scatter it, and break into the pharaoh's camp. Then
          your charioteers stop to plunder the camp, the young men of Amurru arrive from the
          coast, and Ramesses counter-attacks. Your chariots are driven back into the river.
          But Kadesh is still yours, and Ramesses goes home. Your army follows him south and
          takes the land of Upe, around Damascus.
        deeds: {war_with: [egypt], take: [egy_upe], grudges: {egypt: 2000}}
      - label: "Meet him in open battle north of the city"
        legitimacy_bp: 800
        food_bp: -1500
        outcome: >-
          The two armies meet in a great battle on the plain. Both are badly hurt. Ramesses
          goes home to carve a victory on his temples; you go home to Hattusa to count the
          dead.
        deeds: {war_with: [egypt], grudges: {egypt: 2000}}
    history: >-
      At Kadesh in 1274 BC Muwatalli II's ambush nearly destroyed Ramesses II's army; the
      battle ended without a decisive result, but the Hittites kept Kadesh and took Upe.
    sources: ["Bryce, The Kingdom of the Hittites (2005)", "The Kadesh Poem and Bulletin"]

  - id: hat_amurru
    scenario: kadesh
    civ: hatti
    year: -1272
    title: "The Traitor of Amurru"
    place: "Amurru"
    speaker: general
    speaker_name: "Hattusili"
    speaker_title: "Your brother"
    needs_alive: [amurru]
    benchmark_provinces: 9
    story: >-
      Egypt has gone home, and Benteshina of Amurru, who betrayed you, is alone. Your army is
      in his kingdom. Your brother Hattusili, who has a soft spot for him, asks you to spare
      his life: send him to Hattusa, he says, and I will keep him in my own house.
    choices:
      - label: "Depose him, and let Hattusili keep him"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Benteshina goes to Hattusa as Hattusili's guest. A loyal man sits on the throne of
          Amurru. One day Hattusili will put Benteshina back on it - and marry his daughter
          to Benteshina's son.
        deeds: {war_with: [amurru], conquer: [amurru]}
      - label: "Make Amurru a vassal again, with Benteshina on the throne"
        legitimacy_bp: 500
        outcome: >-
          Benteshina swears loyalty to Hatti for the second time. He will keep it about as well
          as the first.
        deeds: {tributaries: [amurru]}
    history: >-
      After Kadesh, Muwatalli deposed Benteshina and took him to Hatti, where Hattusili kept
      him; Hattusili later restored him as king of Amurru.
    diverged: >-
      Amurru is gone already.
    sources: ["Treaty of Hattusili III with Benteshina (CTH 92)"]

  - id: hat_brother
    scenario: kadesh
    civ: hatti
    year: -1269
    title: "Born of the Same Mother?"
    place: "The new capital at Tarhuntassa"
    speaker: assyria
    speaker_name: "Envoy of Adad-nirari"
    speaker_title: "From the King of Assyria"
    needs_alive: [assyria]
    benchmark_provinces: 9
    story: >-
      The king of Assyria has been eating up what is left of Mitanni on your eastern border,
      and now he has sent you a letter. He calls himself a Great King. And he calls you his
      'brother', as the great kings of Egypt and Babylon call each other.


      Assyria was a vassal of Mitanni within living memory. Your scribes await your answer.
    choices:
      - label: "'Were you and I born of the same mother?'"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your reply is famous for its scorn: 'You keep talking about brotherhood... Were you
          and I born of the same mother? As my father and grandfather did not write of
          brotherhood to the king of Assyria, so you should not write to me.' Assyria does not
          forget it.
        deeds: {grudges: {assyria: 2500}}
      - label: "Call him brother: you have enough enemies"
        legitimacy_bp: -500
        outcome: >-
          Adad-nirari is delighted. His merchants come to Hattusa, and his armies go on eating
          Mitanni.
        deeds: {peace_with: [assyria]}
    history: >-
      A Hittite king, probably Urhi-Teshub, rebuffed an Assyrian king's claim to brotherhood
      in a letter found at Hattusa (KUB 23.102).
    sources: ["KUB 23.102", "Bryce, Letters of the Great Kings (2003)"]

  - id: hat_uncle
    scenario: kadesh
    civ: hatti
    year: -1267
    title: "The Uncle and the Nephew"
    place: "Hattusa"
    speaker: general
    speaker_name: "Hattusili"
    speaker_title: "Your uncle, lord of the Upper Land"
    benchmark_provinces: 9
    story: >-
      Your father Muwatalli is dead, and you are king, Urhi-Teshub, though your mother was a
      concubine. You have moved the court back from Tarhuntassa to Hattusa. You have also
      been taking away, one by one, the lands of your uncle Hattusili - the hero of Kadesh, the
      man who governs the north and has made himself loved there.


      Now you have taken his last fortress, Hakpissa. Hattusili has written to you, very
      formally, declaring war. He says the goddess Ishtar of Samuha will judge between you.
    choices:
      - label: "Fight him"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          The nobles of the north go over to Hattusili, and Ishtar, he will say, takes his
          side. You are besieged in Samuha and taken. Your uncle makes himself king as
          Hattusili III and sends you into exile in Syria - from which you will escape to
          Egypt.
        deeds: {ruler_falls: "is overthrown by his uncle Hattusili"}
      - label: "Give him back his lands and make him your chief minister"
        legitimacy_bp: 1000
        influence: {nobility: 1500}
        outcome: >-
          Hattusili accepts with dignity. The kingdom is spared a civil war. You will spend
          your reign in your uncle's shadow, but you will spend it on the throne.
    history: >-
      Hattusili III overthrew his nephew Urhi-Teshub (Mursili III) around 1267 BC and
      justified it in his 'Apology', the first royal autobiography.
    sources: ["Hattusili III, the 'Apology' (CTH 81)"]

  - id: hat_treaty
    scenario: kadesh
    civ: hatti
    year: -1259
    until_year: -1245
    title: "Eternal Peace"
    place: "Hattusa"
    speaker: steward
    speaker_name: "Puduhepa"
    speaker_title: "Great Queen of Hatti"
    needs_alive: [egypt]
    benchmark_provinces: 9
    story: >-
      Assyria has swallowed Mitanni and stands on the Euphrates, looking at Carchemish. The
      deposed king Urhi-Teshub is in Egypt, and Ramesses will not give him up. You cannot
      fight Egypt and Assyria at once.


      Your queen, Puduhepa - a priestess's daughter from Kizzuwatna, cleverer than anyone at
      court - proposes something new: not a truce, but a treaty of eternal peace and
      alliance with Egypt, written in silver, with your seals on it and hers.
    choices:
      - label: "Send the silver tablet to Ramesses"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        outcome: >-
          Ramesses accepts. Neither king will attack the other; each will help the other
          against enemies and rebels; fugitives will be sent home unharmed. The treaty keeps
          the peace between Egypt and Hatti for as long as Hatti lasts. Puduhepa writes to
          Ramesses's queen as her sister.
        deeds: {peace_with: [egypt], ally_with: [egypt]}
      - label: "Stay at war for Kadesh and Upe"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          The war on the Orontes goes on, and Assyrian scouts cross the Euphrates.
        deeds: {war_with: [egypt], grudges: {assyria: 1500}}
    history: >-
      Hattusili III and Ramesses II made the first known parity treaty in 1259 BC; Puduhepa
      corresponded with Ramesses and his queen and co-sealed state documents.
    diverged: >-
      Egypt is gone; there is no one to make peace with.
    sources: ["CTH 91", "Puduhepa's letters (KUB 21.38)", "Singer, on Puduhepa (2002)"]

  - id: hat_dowry
    scenario: kadesh
    civ: hatti
    year: -1246
    until_year: -1235
    title: "A Queen's Letter"
    place: "Hattusa"
    speaker: steward
    speaker_name: "Puduhepa"
    speaker_title: "Great Queen of Hatti"
    needs_alive: [egypt]
    needs_peace_with: [egypt]
    benchmark_provinces: 9
    story: >-
      Ramesses wants your eldest daughter as his wife, and keeps writing to ask where the
      dowry is. Puduhepa is writing back to him herself.


      The truth is that the storehouse in Hattusa burned, and Urhi-Teshub's men took what
      was left. The question is what the Great Queen of Hatti should say to the Pharaoh of
      Egypt about it.
    choices:
      - label: "Tell him plainly, and tell him off"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1000
        outcome: >-
          Puduhepa writes: 'Does my brother possess nothing at all? ... Should I now marry my
          daughter to you for profit?' She asks him for Egyptian help in return, and sends
          the princess south in winter with a dowry of gold, silver, horses, cattle and slaves.
          Ramesses makes her a great royal wife.
        deeds: {ally_with: [egypt]}
      - label: "Send the dowry promptly, whatever it costs"
        wealth_bp: -3000
        legitimacy_bp: 500
        outcome: >-
          The princess goes south with a dowry worthy of an empire. Your treasury is empty
          until next harvest.
        deeds: {ally_with: [egypt]}
    history: >-
      Puduhepa's letter to Ramesses (KUB 21.38) about the delayed dowry survives. Her daughter
      married Ramesses around 1245 BC as Maathorneferure.
    diverged: >-
      Egypt is not at peace with you, or is gone.
    sources: ["KUB 21.38", "The Marriage Stela"]

  - id: hat_nihriya
    scenario: kadesh
    civ: hatti
    year: -1233
    until_year: -1225
    title: "The Embargo"
    place: "Hattusa"
    speaker: general
    speaker_name: "Sausgamuwa"
    speaker_title: "King of Amurru, your brother-in-law"
    needs_alive: [assyria]
    benchmark_provinces: 9
    story: >-
      Your father Hattusili is dead, and you are King Tudhaliya. You marched against Assyria
      and met its king Tukulti-Ninurta at Nihriya, and your army ran. The Assyrians say they
      took twenty-eight thousand prisoners.


      You cannot beat Assyria in the field. But Assyria needs things it cannot make: tin,
      fine goods from the sea. Your scribes are drafting a treaty with your vassal of Amurru,
      on the coast, and you are thinking of adding a clause.
    choices:
      - label: "Forbid all trade with Assyria - and keep Ahhiyawa's ships away"
        historical: true
        legitimacy_bp: 800
        wealth_bp: -800
        outcome: >-
          The treaty says: 'As the King of Assyria is my enemy, so must he be your enemy. Your
          merchants shall not go to Assyria, and you shall not let its merchants into your
          land. No ship of Ahhiyawa may go to him.' It is the first trade embargo on record.
        deeds: {grudges: {assyria: 2000}}
      - label: "Make peace with Assyria"
        legitimacy_bp: -800
        wealth_bp: 1000
        outcome: >-
          Your envoys go to Assur with gifts. Tukulti-Ninurta turns south and sacks Babylon
          instead.
        deeds: {peace_with: [assyria]}
    history: >-
      Tudhaliya IV was defeated by Tukulti-Ninurta I of Assyria at Nihriya (c. 1230 BC). His
      treaty with Sausgamuwa of Amurru contains the earliest known trade embargo, aimed at
      Assyria, and mentions the 'king of Ahhiyawa' - perhaps a Mycenaean Greek.
    diverged: >-
      Assyria is gone.
    sources: ["Treaty with Sausgamuwa (CTH 105)", "Letter RS 34.165"]

  - id: hat_yazilikaya
    scenario: kadesh
    civ: hatti
    year: -1225
    title: "The Rock of the Thousand Gods"
    place: "Yazilikaya, outside Hattusa"
    speaker: diviner
    speaker_name: "Your chief priest"
    speaker_title: "Of the Storm God of Hatti"
    benchmark_provinces: 9
    story: >-
      Outside the walls of Hattusa there is an open-air sanctuary among the rocks. You want it
      carved: the gods of Hatti in procession along the rock walls, sixty-four of them, the
      Storm God meeting the Sun Goddess of Arinna, and yourself, Tudhaliya, in the embrace of
      your protecting god.


      Meanwhile, the harvests have been poor for three years running, and your priests are
      counting every temple's grain.
    choices:
      - label: "Carve the thousand gods"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -1500
        influence: {clergy: 2000}
        outcome: >-
          The procession of the gods is cut into the rock, so finely that it will still be
          there, worn but clear, three thousand years later. You also make a great census of
          all the cults of your kingdom, temple by temple, so that no god is forgotten.
      - label: "Feed the people first"
        food_bp: 2000
        influence: {clergy: -1000}
        outcome: >-
          The temples' grain goes to the hungry towns. The priests say the gods will
          remember.
    history: >-
      The reliefs of Yazilikaya, with the procession of gods and the figure of Tudhaliya IV
      embraced by the god Sharruma, date to the late 13th century BC. Tudhaliya also
      reorganised the state cults.
    sources: ["Seeher, Gods Carved in Stone (2011)", "Hazenbos, The Organization of the Anatolian Local Cults (2003)"]

  - id: hat_grain
    scenario: kadesh
    civ: hatti
    year: -1212
    title: "A Matter of Life or Death"
    place: "Hattusa"
    speaker: steward
    speaker_name: "Your chief of the granaries"
    speaker_title: "Keeper of the royal storehouses"
    benchmark_provinces: 9
    story: >-
      The rains have failed again. In the cities of the plateau people are hungry, and the
      granaries are nearly empty. Your vassal at Ugarit, the richest port in the world, has
      ships; Egypt, your ally, has grain.


      The king of Ugarit has been slow to send his ship. Your scribe is drafting a letter.
    choices:
      - label: "Write that it is a matter of life or death"
        historical: true
        food_bp: 2500
        legitimacy_bp: -500
        outcome: >-
          'It is a matter of life or death!' The letter goes to Ugarit with a royal seal. The
          grain ship sails to Ura on the Cilician coast, and wagons carry the grain up into
          the mountains. Egypt sends grain too, for its old enemy. It is not enough for long.
      - label: "Move the people of the plateau down to the coast"
        unrest_bp: 1500
        food_bp: 1500
        outcome: >-
          Long columns of families come down from the plateau to Cilicia and Syria, where there
          is food. Hattusa feels empty.
      - label: "✦ Store the harvest in sealed tins for the lean years"
        needs_adopted: [canning]
        food_bp: 4000
        legitimacy_bp: 1000
        outcome: >-
          For years your workshops have been sealing cooked grain and meat in tin-lined jars.
          The stores open; no one starves.
    history: >-
      Late-13th-century letters from Hatti to Ugarit demand grain shipments, one calling it
      'a matter of life or death'; Merneptah of Egypt also sent grain to Hatti.
    sources: ["Letter RS 20.212", "Singer, 'A Political History of Ugarit' (1999)", "Karnak inscription of Merneptah"]

  - id: hat_alashiya
    scenario: kadesh
    civ: hatti
    year: -1205
    title: "Battle at Sea"
    place: "Off the coast of Alashiya (Cyprus)"
    speaker: general
    speaker_name: "Suppiluliuma"
    speaker_title: "The last Great King of Hatti"
    benchmark_provinces: 9
    story: >-
      Enemy ships are raiding the coasts: no one knows who they are, only that they come from
      the sea, in great numbers, and burn whatever they find. Alashiya, the copper island, has
      been sending its ships against Hatti's coast.


      The Hittites have never fought at sea. You have ordered ships built in Ugarit and
      Cilicia, and you mean to command them yourself.
    choices:
      - label: "Sail out and fight them at sea"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Three times your ships meet the ships of Alashiya, and three times you win and burn
          them at sea. Then you land and fight them on the shore. You carve it on a stone at
          Hattusa: the first sea battle in history whose victor tells us about it.
        deeds: {ships: 40, war_with: [alashiya]}
      - label: "Hold the coast with forts, and keep the army at home"
        legitimacy_bp: 300
        outcome: >-
          The coastal towns are walled and garrisoned. The raiders go elsewhere - to Ugarit,
          to Amurru, to Egypt.
    history: >-
      Suppiluliuma II recorded three sea victories over the ships of Alashiya and a landing on
      the coast, around 1200 BC, on an inscription found at Hattusa.
    sources: ["Inscription KBo 12.38", "Bryce, The Kingdom of the Hittites"]

  - id: hat_end
    scenario: kadesh
    civ: hatti
    year: -1190
    title: "The City on the Hill"
    place: "Hattusa"
    speaker: steward
    speaker_name: "Your chief scribe"
    speaker_title: "Keeper of the tablet archives"
    benchmark_provinces: 9
    story: >-
      Ugarit has fallen to the raiders from the sea; its last letter is still in the kiln.
      Alashiya and Amurru are burning. The Kaska tribes from the northern hills are raiding
      the heartland, and the harvest has failed again. Your cousins in Tarhuntassa call
      themselves Great Kings now. In Carchemish your viceroy rules as if alone.


      Hattusa has walls, and the gods on the rock. But it has no food.
    choices:
      - label: "Take the court and the archives, and leave Hattusa"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          The court leaves in an orderly way, taking everything of value. The city that ruled
          Anatolia for five hundred years is left empty, and then burned. Thirty thousand
          clay tablets stay behind in its archives, waiting for a German archaeologist and a
          Czech linguist to read them in the twentieth century. In Carchemish and the cities of
          Syria, kings will call themselves Hittite for another five hundred years.
        deeds: {capital: hat_carchemish}
      - label: "Stay, whatever comes"
        legitimacy_bp: 1500
        food_bp: -3000
        unrest_bp: 2000
        outcome: >-
          The Great King stays in his city. The granaries are scraped clean. Whatever comes
          will find the King of Hatti on his throne.
    history: >-
      Hattusa was abandoned around 1185 BC - apparently in an orderly way - and later burned.
      The Hittite language was deciphered by Bedřich Hrozný in 1915; Neo-Hittite kingdoms
      survived in Syria until the Assyrian conquest.
    sources: ["Seeher, 'Die Zerstörung der Stadt Hattusa' (2001)", "Bryce, The World of the Neo-Hittite Kingdoms (2012)"]
