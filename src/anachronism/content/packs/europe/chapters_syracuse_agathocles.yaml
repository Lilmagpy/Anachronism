schema_version: 1
# Chronicle mode (D-120, D-XXX): Syracuse from Timoleon's death to Agathocles' death,
# 336-289 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Diodorus 16 and 19-21 (our main source, who drew on
# Timaeus, hostile to Agathocles, and Callias, friendly to him), Justin 22-23, Plutarch's
# Timoleon and Pyrrhus, with modern work by Consolo Langher, Lewis, Hans and Kolb. The ruler
# is the Six Hundred under Timoleon's settlement until Agathocles seizes power in 317, then
# Agathocles until his death in 289 (his dates: born about 361, died 289 aged 72, Diodorus 21.16).
# Dates of 317 (the coup), 314 and about 304 (the royal title; Diodorus tells it near 306)
# are approximate. The poisoning of Agathocles is a story told by Diodorus and Justin and is
# labelled so. benchmark_provinces counts the provinces of this map the real Syracuse held:
# it is one throughout; the Carthaginian west of Sicily is a separate province, and
# Agathocles' holdings in Africa (310-307) and Bruttium were never lasting.
chapters:
  - id: syra_timoleon
    scenario: alexander
    civ: syracuse
    year: -336
    title: "The Blind Liberator Is Dead"
    place: "The theatre of Syracuse"
    speaker: steward
    speaker_name: "A magistrate of the Six Hundred"
    speaker_title: "The city's council"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred, the council of Syracuse. Timoleon of Corinth is dead. Eight
      years ago he drove out the tyrant Dionysius II, beat the Carthaginians at the Crimissus,
      and cleared the island of tyrants. Then he accepted only a house and a farm, and
      a seat in the theatre, where the people carried him in a cart when he went blind, and
      asked his advice.


      The council has to decide how to bury him, and who shall lead Syracuse in the wars
      to come. Carthage still holds the west of the island, and nobody doubts that it will
      come back.
    choices:
      - label: "Give him a public funeral, and send to Corinth for generals in time of war"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 500}
        outcome: >-
          Plutarch says the people followed his bier in tens of thousands, the young men of the
          city carried it, and a gymnasium called the Timoleonteion was built round his tomb. It
          was decreed that games would be held on the day of his death each year, and that
          whenever Syracuse had to fight foreigners it would send to Corinth, its mother city,
          for a general. The law was meant to keep the city safe from its own ambitious men.
        deeds: {peace_with: [carthage], martial_bp: 1500}
      - label: "Elect a Syracusan general with full powers, for as long as the war lasts"
        legitimacy_bp: -500
        unrest_bp: 800
        influence: {nobility: 1000}
        outcome: >-
          The city has a strong man at once, and the old ghosts of tyranny walk again. The
          Corinthians say nothing, which is not the same as agreeing.
    history: >-
      Timoleon died in about 337 BC and was buried at public expense. Syracuse kept his laws
      and, in Plutarch's account, voted to ask Corinth for its foreign-war generals.
    diverged: >-
      Carthage is gone.
    sources: ["Plutarch, Timoleon 36-39", "Diodorus 16.82 and 16.90", "Nepos, Timoleon 4"]

  - id: syra_coup
    scenario: alexander
    civ: syracuse
    year: -317
    title: "The Potter's Son Comes Home"
    place: "Syracuse, the Temple of Demeter"
    speaker: general
    speaker_name: "Acestorides"
    speaker_title: "General from Corinth"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred. Two years ago you drove out Agathocles, a soldier of fortune
      who rose from a potter's trade to command men. He has been a general in Italy, and now
      he is back at the head of an army of exiles and hirelings, with the democrats of the
      poor quarters at his back.


      Hamilcar, the Carthaginian general in Sicily, and Acestorides, your Corinthian general,
      offer a settlement. Agathocles will swear before Demeter and Kore to keep the
      constitution, and will be guardian of the peace for two years. Hamilcar vouches for him.
      Some of you remember that Hamilcar is his friend.
    choices:
      - label: "Accept the oath, and give him the army"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2500
        outcome: >-
          Agathocles takes the oath. A few days later his soldiers fall on the city. Diodorus
          puts the dead at more than four thousand, with another six thousand driven into
          exile, and the Six Hundred are among them. Agathocles then has himself named general
          with full powers, cancels debts, and promises land to the poor. Syracuse has a
          tyrant again, and he will rule for twenty-eight years.
        deeds: {ruler_falls: "is destroyed by Agathocles' soldiers", grudges: {carthage: 500}}
      - label: "Refuse him, and shut the gates"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          The oath is refused, and Hamilcar's soldiers stand beside Agathocles' outside the
          walls. The poor of the lower town open a gate for him on the third night.
    history: >-
      In 317 BC Agathocles, sworn to keep the constitution, used the army to massacre the
      oligarchs of Syracuse and took power as general with full powers.
    diverged: >-
      Carthage is gone.
    sources: ["Diodorus 19.3-9", "Justin 22.1-2", "Consolo Langher, Agatocle (2000)"]

  - id: syra_himera
    scenario: alexander
    civ: syracuse
    year: -311
    title: "Beaten at the Himera"
    place: "Syracuse"
    speaker: general
    speaker_name: "Antander"
    speaker_title: "Your brother"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Agathocles. For six years you have fought Carthage and the Greek cities that
      would rather be Carthage's friends than your subjects. Now Hamilcar son of Gisco has
      landed with a great fleet and army. He has beaten you at the river Himera, and cities
      that you thought your own are going over to him one after another.


      Hamilcar will come to Syracuse next. The harbours are the finest in Sicily and the walls
      are the strongest in Greece, but the Syracusans do not love you, and you cannot beat an
      army in the field. Antander says you could ask for terms.
    choices:
      - label: "Shut yourself in Syracuse, and think of something else"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          You gather every man and every coin behind the walls, and send word to the
          Carthaginian general that you will not talk. Hamilcar camps outside the city and
          blockades its harbours. Diodorus says that you were secretly making ready for
          something no one expected.
        deeds: {martial_bp: 500}
      - label: "Ask Carthage for terms"
        legitimacy_bp: -1500
        outcome: >-
          Hamilcar is gracious, and it is the sort of grace that costs everything. Your
          allies see that your word is worth nothing, and the poor of Syracuse begin to ask
          who the tyrant is working for.
    history: >-
      Hamilcar defeated Agathocles at the Himera in 311 BC, many cities of Sicily came over
      to Carthage, and Agathocles was blockaded in Syracuse.
    diverged: >-
      Carthage is gone.
    sources: ["Diodorus 19.102-110"]

  - id: syra_africa
    scenario: alexander
    civ: syracuse
    year: -310
    title: "The Ships Burn"
    place: "Cape Bon, Africa"
    speaker: general
    speaker_name: "Archagathus"
    speaker_title: "Your son"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Agathocles. In the summer you slipped out of the harbour of Syracuse past the
      Carthaginian fleet as a grain convoy came in, with sixty ships, fourteen thousand men
      and your two sons, leaving your brother Antander to hold the city. On the sixth day the
      sun went dark in an eclipse, and the men were sure that the gods meant Carthage to win.


      You have landed at Cape Bon, and Carthage, which has never seen an enemy in Africa,
      has no army in the field. But you cannot guard a hundred ships and an army as well, and
      you cannot go home.
    choices:
      - label: "Burn the ships, and march on Carthage"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        wealth_bp: -800
        outcome: >-
          Diodorus says that you made a vow to Demeter and Kore and set fire to your own
          fleet, so that the soldiers had no way home but through victory. The Carthaginians
          raise their citizen army; you beat it, and take many towns on the
          coast, and Tunis. Carthage is shut inside its walls. Some modern scholars think the
          burning was exaggerated, and that you burned only some of them.
        deeds: {martial_bp: 1500}
      - label: "Keep the fleet, and plunder the coast"
        legitimacy_bp: 500
        outcome: >-
          The ships are ready for flight, and your men know it. They fight less hard.
    history: >-
      Agathocles sailed in August 310 BC, landed in Africa after an eclipse (15 August), and
      defeated the Carthaginians in the field; Diodorus and Justin say he burned his ships.
    diverged: >-
      Carthage is gone.
    sources: ["Diodorus 20.3-18", "Justin 22.4-6", "Lewis, Greek Tyrants (2009)"]

  - id: syra_ophellas
    scenario: alexander
    civ: syracuse
    year: -308
    title: "Ophellas of Cyrene"
    place: "Near Carthage"
    speaker: general
    speaker_name: "Ophellas"
    speaker_title: "Ruler of Cyrene"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Agathocles. Ophellas of Cyrene, once a general of Alexander and Ptolemy and now
      his own master, has marched along the African coast with an army and with his wives and
      children behind him, because you promised him Africa to settle and rule while you took
      Sicily.


      He is in your camp, and he trusts you. His army is larger than yours. Without him you
      cannot hold Africa, and with him you will not own it.
    choices:
      - label: "Murder him and take his army"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Diodorus says you had him killed in the camp, after a quarrel in the camp,
          and then told his soldiers that they could take your pay or starve between two
          deserts. They took it. Most of the army of Cyrene is yours, and the Cyrenaeans never
          trust you again. Cyrene soon returns to Ptolemy's rule.
        deeds: {men: 3000}
      - label: "Share Africa with him"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Ophellas takes a province for himself, and the Carthaginians, who would very much like
          to split your enemies, send gold to him as well.
    history: >-
      Agathocles killed Ophellas in 308 BC and took over his army, Diodorus says by treachery.
      Later Cyrene came back under Ptolemy.
    sources: ["Diodorus 20.40-42", "Justin 22.7"]

  - id: syra_abandon
    scenario: alexander
    civ: syracuse
    year: -307
    title: "Leaving the Army"
    place: "The African coast"
    speaker: general
    speaker_name: "Your captain"
    speaker_title: "At the harbour"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Agathocles. A year ago you went back to Sicily to put down a revolt; you
      beat the rebels, and you came back to Africa to find that Archagathus has lost a
      battle, that your men are mutinous and short of pay, and that the Carthaginians have
      shut you out of the interior. The enemy is advancing on your camp.


      You have a single ship ready to go. You are the only man the Sicilians will follow, and
      your sons and your soldiers are on the shore.
    choices:
      - label: "Slip away at night, and save Sicily"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          You sail by night with a few friends, and leave the army and your sons behind. When
          the soldiers learn what you have done, they kill Archagathus and Heraclides, and
          then make terms with Carthage. You land in Sicily, and in revenge, so Diodorus says, you
          massacre the people of Segesta and treat the rest with a cruelty which no excuse
          covers.
        deeds: {grudges: {carthage: 500}}
      - label: "Stay with the army, and fight at the gates"
        legitimacy_bp: 1000
        outcome: >-
          You stand with your men; they fight, and are beaten.
    history: >-
      In 307 BC Agathocles left his army in Africa to its fate; his sons were killed and the
      army surrendered. He returned to Sicily.
    diverged: >-
      Carthage is gone.
    sources: ["Diodorus 20.69-72", "Justin 22.8"]

  - id: syra_peace
    scenario: alexander
    civ: syracuse
    year: -306
    title: "A Peace Without Victors"
    place: "Syracuse"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Syracuse"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Agathocles. Six years of war have left you with Syracuse and the Greek towns of
      the east, a hole in your treasury, and the exiles of Syracuse still leading a rebel army
      under Deinocrates. Carthage, too, has had enough.


      Carthage's envoys say that the old frontier will do: the west of the island to Carthage,
      and Greek Sicily to you. It is not what you hoped for when you landed in Africa.
    choices:
      - label: "Make peace on the old frontier"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Diodorus says that you made peace with Carthage in 306 BC, and that you soon came to
          terms with Deinocrates, the leader of the exiles. You
          are master of eastern Sicily and need no one's leave.
        deeds: {peace_with: [carthage]}
      - label: "Fight on, and build a new fleet"
        unrest_bp: 2000
        wealth_bp: -1000
        outcome: >-
          The treasury is empty, and the soldiers' pay is late. Your enemies can wait.
    history: >-
      Agathocles made peace with Carthage in 306 BC on the old frontier, and came to terms with the
      exile leader Deinocrates soon after.
    diverged: >-
      Carthage is gone.
    sources: ["Diodorus 20.77-79 and 20.89-90", "Justin 22.8"]

  - id: syra_king
    scenario: alexander
    civ: syracuse
    year: -304
    title: "The Diadem"
    place: "Syracuse"
    speaker: scholar
    speaker_name: "A Greek envoy"
    speaker_title: "Newly arrived from the east"
    benchmark_provinces: 1
    story: >-
      You are Agathocles. The news from the east is that Alexander's generals, Antigonus, Ptolemy,
      Seleucus, Lysimachus, have each put on the diadem and called themselves king. The
      Greeks of the east say it is the new fashion.


      You rule more of Sicily than any man since Dionysius, and you have been lord of Africa in
      all but name. Your title is "general with full powers"; the poorest mason in the city
      knows that the title means a tyrant. The Greek envoy asks whether you are less than the
      men in Asia.
    choices:
      - label: "Take the title of king"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          You put on the diadem, and and you are a king among kings. Diodorus says you thought your power no
          smaller than theirs. The Syracusans
          see the same man under a new name. Your daughter Lanassa will marry Pyrrhus of
          Epirus within a few years, and Plutarch says that Corcyra was her dowry.
      - label: "Stay general of the Syracusans"
        legitimacy_bp: 500
        outcome: >-
          The people like the old title. The kings in the east do not notice either way.
    history: >-
      Agathocles took the title of king, in the manner of the successors of Alexander, in about
      304 BC.
    sources: ["Diodorus 20.54 and 21.4", "Justin 23.2", "Plutarch, Pyrrhus 9"]

  - id: syra_death
    scenario: alexander
    civ: syracuse
    year: -289
    title: "The Old King's Last Illness"
    place: "Syracuse"
    speaker: steward
    speaker_name: "Maenon of Segesta"
    speaker_title: "A favourite of the king"
    benchmark_provinces: 1
    story: >-
      You are Agathocles, seventy-two, king for fifteen years and master of Syracuse for
      twenty-eight. You have held Corcyra and Croton; you have outlived
      your sons, and your grandson Archagathus has murdered your son Agathocles, who was to be
      your heir. Your wife Texena and her infant sons cannot rule.


      Your mouth is bleeding and the gums are rotting. Diodorus says that Maenon of Segesta,
      a Segestan who had been among your favourites, gave you a poisoned quill to clean your teeth; others
      say it was a disease. You must decide what becomes of Syracuse.
    choices:
      - label: "Give the city its freedom, and the democracy back"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          So Diodorus and Justin tell it. You will not leave it to your grandson, so you ask the
          Syracusans to take back their city. The story is that you were then put on the pyre
          while you still breathed, because the pain had made you helpless. After your death the
          city is free, and unquiet. Hicetas becomes its master within a few years, and Carthage is in Sicily
          again.
        deeds: {ruler_falls: "dies, poisoned, the story goes"}
      - label: "Leave the kingdom to your grandson Archagathus"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Archagathus is a murderer, and the city knows it. Syracuse is not ready for a boy
          king who started by killing his uncle.
    history: >-
      Agathocles died in 289 BC, after Diodorus and Justin say he was poisoned, having reportedly
      restored the freedom of Syracuse. Hicetas ruled the city a few years later.
    sources: ["Diodorus 21.16", "Justin 23.2", "Consolo Langher, Agatocle (2000)"]
