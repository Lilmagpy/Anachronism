schema_version: 1
# Chronicle mode (D-120, D-XXX): the Massyli and Masaesyli of Numidia, from Masinissa's years
# in Spain to the fall of Jugurtha, 206-105 BC. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow Polybius 15 and 36, Livy 27-30 and 34
# (the Sophonisba story is Livy's; Appian tells it a little differently), Appian's Punic
# Wars and Sallust's Jugurthine War, with modern work by Walsh, Lancel, Hoyos and Syme.
# The map shows two Numidian provinces: the Massyli (east, Cirta) and the Masaesyli (west,
# Siga). Syphax held the west until 203; benchmark_provinces counts the provinces of this map
# the real kingdom held at that date. Dates approximate: Gala's death c. 207, Masinissa's
# return to Africa 206-205, his flight in 204, the dispute over Emporia (Livy 34.62 is under
# 193), Oroscopa (c. 151-150), Jugurtha's seizure of power 118-117. The ruler line passes over
# Gala's brother Oezalces and his sons, and Micipsa's brother-heirs Hiempsal and Adherbal
# (Jugurtha is shown as the ruler of the whole kingdom).
chapters:
  - id: num_spain
    scenario: punic_wars
    civ: numidia
    year: -206
    title: "The Prince in Spain"
    place: "Spain"
    speaker: rome
    speaker_name: "Marcus Junius Silanus"
    speaker_title: "A Roman officer"
    needs_alive: [rome, carthage]
    benchmark_provinces: 1
    story: >-
      You are Masinissa, son of Gala, king of the Massyli. For years you have led Carthage's
      Numidian horsemen in Spain, and you are the best cavalry commander in the army. This
      year the Romans broke that army at Ilipa, and Carthage is losing Spain for good. You
      remember that Scipio once sent your captured nephew home with gifts and without ransom.


      Word has come from Africa: your father is dead. His brother Oezalces now holds the
      throne, and the Massyli are not sure whom they will follow. A Roman officer has
      made it known that he would like to talk.
    choices:
      - label: "Meet the Roman officer, then go home"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You meet the Roman officer in secret and promise nothing but friendship. Then you
          cross to Africa. In the next months Oezalces dies, his son Capussa is killed in battle
          by a rival, Mazetullus, who sets up a boy king; you gather the Massyli, win with the
          help of King Bocchar of the Moors, and take your father's throne.
        deeds: {give: [num_masaesyli]}
      - label: "Sail home as Carthage's ally"
        legitimacy_bp: 1200
        wealth_bp: 500
        outcome: >-
          Carthage welcomes you and lends you three thousand of its Numidian horse. Hasdrubal,
          son of Gisgo, is already courting Syphax, your rival in the west, with the offer of
          his daughter.
        deeds: {men: 3000}
      - label: "Go to Scipio and ask for Roman help"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Scipio is courteous but has no ships to spare for a Numidian pretender. You are
          still far from Africa, without an army, while your cousins quarrel over your father's
          throne.
    history: >-
      After Ilipa (206 BC) Masinissa secretly met the Romans and left Spain for Africa after
      his father Gala's death. He won back the Massyli kingdom from Mazetullus and the boy
      Lacumazes in 206-205.
    diverged: >-
      Rome is gone.
    sources: ["Livy 27.19, 28.35, 29.29-30", "Appian, Punic Wars 10-14", "Walsh, Livy Book XXIX"]

  - id: num_exile
    scenario: punic_wars
    civ: numidia
    year: -204
    title: "Syphax and Sophonisba"
    place: "Between Hippo and the desert"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio"
    speaker_title: "Roman general"
    needs_alive: [rome, carthage]
    benchmark_provinces: 1
    story: >-
      You are Masinissa, king of the Massyli. Syphax of the Masaesyli, who for years played
      Rome against Carthage, has now chosen Carthage. Hasdrubal, son of Gisgo, gave him his
      daughter Sophonisba, a woman, Livy says, who was once promised to you.


      Syphax has invaded your kingdom and beaten you in the field. You have fled to the
      hills with a handful of horsemen, with your people scattered and your throne
      lost again. Scipio's army has landed near Utica.
    choices:
      - label: "Join Scipio's army"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          You ride to Scipio's camp with what horsemen you have left. He has no use for a
          pretender, but he has a great use for a Numidian cavalry commander who hates Syphax.
          For the next year you fight at his side, burning camps and raiding with Laelius. You
          have thrown in your lot with the winning side, if it does win.
      - label: "Hide in the desert and wait for Syphax to make mistakes"
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          For weeks you live in the dry hills with a few men while Syphax's riders comb the
          valleys. Hardly anyone is willing to follow a king with no army.
      - label: "Make peace with Syphax and accept a small kingdom"
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          Syphax's price is low in gold and high in humiliation: you hold what he lets you
          hold. Your own nobles never forgive you, and Carthage never stops watching you.
      - label: "Raid Syphax's flanks with your horsemen"
        legitimacy_bp: 400
        unrest_bp: 500
        outcome: >-
          You gather the horsemen who still follow you and strike at Syphax's herds and
          baggage trains. It is hard living, and it keeps your name alive among the Massyli.
        deeds: {men: 3000}
    history: >-
      In 204 BC Syphax drove Masinissa from the Massyli kingdom; Masinissa joined Scipio
      after the Roman landing in Africa and served as his cavalry commander.
    diverged: >-
      Rome is gone.
    sources: ["Livy 29.23, 29.29-34", "Appian, Punic Wars 10-14"]

  - id: num_sophonisba
    scenario: punic_wars
    civ: numidia
    year: -203
    title: "Sophonisba"
    place: "Cirta"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio"
    speaker_title: "Roman general"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are Masinissa. Scipio burnt the Carthaginian and Numidian camps by night, Syphax
      fled, and you and Laelius ran him down and captured him. You rode on to Cirta,
      Syphax's capital, and the gates opened.


      In the palace you met his wife, Sophonisba. She begged you not to hand her to the
      Romans to be paraded in a triumph. The story, as Livy tells it, is that you married her
      that same day. Now Scipio sends word: she is the Romans' prisoner, and you have no right
      to her.
    choices:
      - label: "Send her a cup of poison"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          You cannot keep your promise to her, and you cannot break your word to Scipio. So you
          send her poison, with the message that this is the only wedding gift you can still
          give. By Livy's account she drinks it without flinching. Scipio, Livy says, wishes
          to soften your grief: in front of the army he hails you as king and gives you a
          golden crown. Syphax is taken to Rome in chains.
        deeds: {take: [num_masaesyli]}
      - label: "Hand her over to Scipio"
        legitimacy_bp: -1000
        outcome: >-
          Sophonisba is taken to the Roman camp. You have kept your honour with Scipio and
          lost her. You keep Cirta and Syphax's lands as Rome's ally, but your own men think
          the less of a king who cannot protect his wife.
        deeds: {take: ["num_masaesyli"]}
      - label: "Refuse, and keep her"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Scipio is furious, and the Romans have a long memory for an ally who keeps what is
          theirs. Your kingdom is poor, and you have made an enemy of the one man who could
          give you a bigger one.
        deeds: {grudges: {rome: 2000}}
    history: >-
      In 203 BC Masinissa and Laelius captured Syphax and took Cirta. According to Livy,
      Masinissa married Sophonisba and then sent her poison when Scipio demanded her; Appian
      tells a similar story.
    diverged: >-
      Rome is gone.
    sources: ["Livy 30.11-15", "Appian, Punic Wars 27-28", "Polybius 14.1"]

  - id: num_zama
    scenario: punic_wars
    civ: numidia
    year: -202
    title: "Zama"
    place: "Near Zama, south-west of Carthage"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio"
    speaker_title: "Roman general"
    needs_alive: [rome, carthage]
    benchmark_provinces: 2
    story: >-
      You are Masinissa. Hannibal has come home from Italy with his veterans and eighty
      elephants, and Scipio has gone to meet him. You have brought him six thousand foot
      and four thousand horse, and without them Scipio, who has few cavalry, would not have
      dared to fight on this plain.


      Scipio puts you on the right wing, facing the Carthaginian cavalry, which Hannibal
      has far fewer of than you. Laelius commands the Roman horse on the other flank.
    choices:
      - label: "Break the cavalry, then return and hit Hannibal's rear"
        historical: true
        legitimacy_bp: 3000
        wealth_bp: 1000
        outcome: >-
          You and Laelius sweep away the Carthaginian cavalry and chase them far from the
          field. When you turn back, Hannibal's veterans are locked with the Roman lines. You
          fall on their rear and the battle is over. Under the treaty of 201 you are given
          the lands of your ancestors, and Syphax's kingdom, with Cirta. Carthage may make
          war in Africa only with Rome's leave, which means that your neighbour cannot defend
          itself against you.
      - label: "Keep chasing the routed cavalry to destroy it"
        legitimacy_bp: 3200
        wealth_bp: 1000
        outcome: >-
          Your horse run the Carthaginians down for miles. When you finally return, the infantry
          fight is already decided, and Scipio's victory owes less to you than it might have.
          Hannibal's horse is destroyed to the last squadron, and your name is on every
          tongue. Scipio is less pleased that his infantry were left alone.
      - label: "Keep your horse back to protect the Roman camp"
        legitimacy_bp: -1500
        outcome: >-
          Scipio is less grateful for caution than for a charge, and Rome does not hurry to give
          you a kingdom.
    history: >-
      At Zama (202 BC) Masinissa's cavalry drove off Hannibal's horse and returned to attack
      his rear. In the treaty of 201 BC Rome made Masinissa king of the Massyli and Syphax's
      old kingdom, and forbade Carthage to make war without Rome's leave.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 15.5-14", "Livy 30.29-37, 30.44", "Appian, Punic Wars 39-48", "Lancel, Hannibal (1995)"]

  - id: num_emporia
    scenario: punic_wars
    civ: numidia
    year: -193
    title: "The Seaboard of the Syrtis"
    place: "Emporia"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio Africanus"
    speaker_title: "Roman commissioner"
    needs_alive: [rome, carthage]
    benchmark_provinces: 2
    story: >-
      You are Masinissa, king of the Numidians. Carthage may no longer wage war without
      Rome's leave, and you have used the fact. Your horsemen take a field here, a
      town there, from Carthaginian land on the plains, and every time Carthage complains,
      Rome sends a commission and does nothing.


      This year you have been at the rich coast of Emporia on the Syrtis, where Leptis alone
      pays Carthage a talent a day. Carthage's envoys have come to Rome. A commission,
      led by your old friend Scipio Africanus, has arrived to hear both sides.
    choices:
      - label: "Plead your ancestors' claim before the commission"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 1000
        outcome: >-
          Scipio hears you and the Carthaginians out, then declines to decide. Rome likes
          Carthage weak and Numidia strong, and it likes both to need Rome. You keep your
          gains, and Carthage learns that no commission will help it.
      - label: "Give back what you took and keep Rome's favour"
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Carthage takes the land back, thanks the commission, and begins to complain about
          something else. Your own chiefs are not pleased.
      - label: "Ignore the commission and take more"
        wealth_bp: 1500
        unrest_bp: 500
        legitimacy_bp: 500
        outcome: >-
          Your riders take more of the coast before the commissioners have left. The Senate
          frowns but does nothing, as usual.
          The coast is yours for the taking.
        deeds: {grudges: {carthage: 1500}}
    history: >-
      In 193 BC a Roman commission headed by Scipio Africanus heard the quarrel over Emporia
      between Carthage and Masinissa and left it undecided. Masinissa kept pressing: Polybius
      and Appian report further seizures, Tysca among them, in the 160s.
    diverged: >-
      Rome or Carthage is gone.
    sources: ["Livy 34.62", "Polybius 31.21", "Appian, Punic Wars 67-68"]

  - id: num_oroscopa
    scenario: punic_wars
    civ: numidia
    year: -150
    title: "Oroscopa"
    place: "Near Oroscopa"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio Aemilianus"
    speaker_title: "A tribune of the Roman army in Spain"
    needs_alive: [rome, carthage]
    benchmark_provinces: 2
    story: >-
      You are Masinissa, king of the Numidians, almost ninety years old and still a horseman.
      You have taken town after town of Carthage's land, and the Carthaginians, in
      desperation, have driven out the men in their own city who were your friends. Your son
      Gulussa, coming home from an embassy to Carthage, was attacked on the road.


      Now Hasdrubal, a Carthaginian general, has marched out with a large army, far bigger
      than the treaty of 201 allows. You are besieging Oroscopa.
      Scipio Aemilianus, grandson by adoption of your old friend, has come from Spain on an
      errand for the Senate and is watching from a hill.
    choices:
      - label: "Meet them in the field, with Rome as your witness"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 1000
        outcome: >-
          Your horsemen and infantry hold off the Carthaginians until evening. Scipio watches
          from a hill and, Appian says, later liked to boast that he was the third to watch a
          battle from a mountain, after Zeus and Poseidon. Hasdrubal's army is shut in by a ditch and starved. Tens of
          thousands, by Appian's count nearly sixty thousand, die of hunger and disease.
          Carthage had made war without Rome's leave, and Rome declares war in 149.
      - label: "Accept Scipio's offer to mediate"
        legitimacy_bp: -500
        outcome: >-
          Scipio proposes terms; the Carthaginians refuse to give up the land. Nothing is
          settled.
      - label: "Wait for Rome's decision before you fight"
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Waiting costs you the field. Hasdrubal enters Oroscopa and the Senate does not hurry.
      - label: "Cut off Hasdrubal's supplies instead of fighting"
        legitimacy_bp: 1800
        wealth_bp: 1200
        unrest_bp: 500
        outcome: >-
          Your horsemen ride round the Carthaginian army and take its convoys and its watering
          places. Hasdrubal has to fight or starve, and Scipio sees it all from his hill.
        deeds: {men: 5000}
    history: >-
      Around 150 BC Carthage's army under Hasdrubal fought Masinissa near Oroscopa and was
      destroyed. Since Carthage had broken the treaty of 201, Rome declared the Third Punic
      War in 149.
    diverged: >-
      Rome or Carthage is gone.
    sources: ["Appian, Punic Wars 67-74", "Polybius 36.16", "Livy, Periochae 48-49"]

  - id: num_deathbed
    scenario: punic_wars
    civ: numidia
    year: -148
    title: "The Old King's Last Year"
    place: "Cirta"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio Aemilianus"
    speaker_title: "Roman commander in Africa"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are Masinissa. You are ninety, you have ruled for nearly sixty years, and you have
      lived to see Carthage under siege by Rome. Polybius says you were still mounting your
      horse without help, and that your youngest son is only four years old.


      Rome has come to destroy the city you hoped to have for yourself, and Appian says you
      were bitter about it. You have sons: Micipsa, Gulussa
      and Mastanabal. You also know that when a Numidian king dies, his sons and his
      nephews fight. You have asked Scipio Aemilianus to come to Cirta and settle the
      kingdom.
    choices:
      - label: "Share the kingdom among three sons"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 1000}
        outcome: >-
          You die before he arrives. Scipio finds you dead, and, by Appian's account, divides the royal duties
          among your three sons: Micipsa the court and treasury, Gulussa the army, Mastanabal
          justice. For a time it works. Gulussa and Mastanabal die within a few years, and
          Micipsa rules alone.
      - label: "Name Micipsa alone, and tell the others to obey"
        legitimacy_bp: 1000
        unrest_bp: 500
        wealth_bp: 1000
        outcome: >-
          Gulussa, who commands the army, doubts that he will obey a brother. Rome steps in anyway.
          A single king can keep the treasury and the army together while he lives.
      - label: "Divide the kingdom into three halves"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Three small kingdoms are easy for Rome to manage and impossible for any of them to
          defend.
    history: >-
      Masinissa died in 148 BC aged about ninety. Scipio Aemilianus divided his duties among
      his sons Micipsa, Gulussa and Mastanabal; Micipsa was sole king from the 140s until 118.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 36.16", "Appian, Punic Wars 105-106", "Sallust, Jugurtha 5"]

  - id: num_cirta
    scenario: punic_wars
    civ: numidia
    year: -112
    title: "The Siege of Cirta"
    place: "Cirta"
    speaker: rome
    speaker_name: "Roman envoys"
    speaker_title: "Sent by the Senate"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are Jugurtha, nephew and adopted son of Micipsa. As a young man you were sent with
      Numidian horse to serve Scipio at Numantia, probably in the hope that you would
      not come back; instead Scipio praised you in a letter to your uncle. When Micipsa
      died in 118, he left the kingdom to you and his own two sons, Hiempsal and Adherbal.


      Hiempsal was murdered at your order. A Roman commission divided the kingdom, and the
      richer eastern half went to Adherbal. Rome's senators, as you have noticed, can be
      bought. Now you have besieged Adherbal in Cirta, and a second embassy of young
      Roman nobles has arrived to tell you to stop. Inside the walls many Italian
      merchants are helping to defend the city.
    choices:
      - label: "Take the city, and put Adherbal to death"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1000
        wealth_bp: 1500
        outcome: >-
          Adherbal surrenders on the advice of the Italians, who believe Rome will protect them.
          You torture him to death. Your men kill every adult male in the city without
          distinction, including the Italian traders. In Rome, the news makes it impossible for the
          Senate's friends to defend you. War is declared in 111. You will spend years
          in a war that you cannot win by battle and might win by bribery.
        deeds: {grudges: {rome: 4000}}
      - label: "Lift the siege at the Romans' word"
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Adherbal lives and keeps the east. You have lost face in the eyes of your own army,
          which was told that Cirta would pay for the long campaign.
      - label: "Take Adherbal prisoner, and spare the Italians"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          You hold Adherbal captive. The Senate demands his release.
    history: >-
      In 112 BC Jugurtha stormed Cirta, tortured Adherbal to death and massacred its defenders,
      Italian merchants among them. Rome declared war in 111.
    diverged: >-
      Rome is gone.
    sources: ["Sallust, Jugurtha 5-26", "Syme, Sallust (1964)"]

  - id: num_bocchus
    scenario: punic_wars
    civ: numidia
    year: -105
    title: "King Bocchus's Embassy"
    place: "Mauretania"
    speaker: rome
    speaker_name: "Lucius Cornelius Sulla"
    speaker_title: "Quaestor of Gaius Marius"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Jugurtha. For six years you have outfought and outbribed Rome's generals,
      until Metellus and then Marius broke your armies. You have lost nearly everything
      except your father-in-law, Bocchus, king of Mauretania, who joined you, was twice
      defeated, and has now sent a message: he wishes to make peace with Rome. He wants to
      bring you to a friendly meeting.


      Bocchus has Roman envoys too: the young quaestor Sulla, whom Marius has sent with a
      small escort. He seems determined to deal with whichever of you proves less
      troublesome.
    choices:
      - label: "Go to the meeting with a few friends"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Bocchus's men fall on your companions and bind you hand and foot. You are given
          to Sulla. In January 104 you walk in front of Marius's chariot in the triumph at Rome,
          and are thrown into the Tullianum, the state prison, where you die of cold and hunger
          within days. Bocchus is rewarded with the western part of Numidia. Gauda, a weak
          half-brother, whom the Romans prefer, takes the throne.
        deeds: {ruler_falls: "is betrayed by Bocchus and handed to Sulla", give: [num_masaesyli]}
      - label: "Refuse, and flee into the desert with your treasure"
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          The desert is large, but you cannot live in it for long. Your army melts away on the
          march, and your own men are starting to bargain with Bocchus for your life.
        deeds: {martial_bp: -800}
      - label: "Fight on with Gaetulian horse"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Eight thousand Gaetulian horsemen follow you for a season. They are brave, but they
          will not follow a king without a kingdom or a chance.
        deeds: {men: 8000}
    history: >-
      In 105 BC Bocchus, Jugurtha's father-in-law, betrayed him to Sulla. Jugurtha was led in
      Marius's triumph on 1 January 104 and died in the Tullianum. Bocchus got western Numidia;
      Gauda was king in the east.
    diverged: >-
      Rome is gone.
    sources: ["Sallust, Jugurtha 100-114", "Plutarch, Marius 10-12, Sulla 3", "Livy, Periochae 67"]
