schema_version: 1
scenarios:
  - id: kadesh
    name: "Egypt and the Hittites, 1275 BC"
    description: >-
      1275 BC. The Late Bronze Age: a world of great kings who write to each other as brothers
      and fight over the cities of Syria. Young Ramesses II is marching north to take Kadesh
      from the Hittite king Muwatalli II - the greatest chariot battle in history is a year
      away. Assyria is rising, Babylon teaches the stars, and Mycenaean ships raid the coasts.
      In Ugarit, scribes have just invented an alphabet.
    start_year: -1275
    years_per_turn: 10
    player_civ: egypt
    map: europe
    cost_scale: 10
    civs:
      egypt:
        disposition: aggressive
        scripts:
          - {id: "battle_of_kadesh", goal: "conquer", target: "hatti", preconditions: {after_year: -1280}, note: "Ramesses II marches north; the battle of Kadesh ends in a bloody draw (1274 BC)."}
          - {id: "eternal_treaty", goal: "ally", target: "hatti", preconditions: {after_year: -1265}, depends_on: ["battle_of_kadesh"], note: "Egypt and Hatti sign the first recorded peace treaty (1259 BC)."}
        capital: egy_delta
        leader: Ramesses II
        leader_age: 28
        successors: [{name: "Merneptah", age: 55, disposition: "cautious"}, {name: "Seti II", age: 40}]
        pitch: "Ramesses II is young and hungry for glory, and Kadesh is in Hittite hands. Win with ideas what chariots cannot."
        provinces:
          egy_delta: 1300000
          egy_middle: 900000
          egy_thebes: 800000
          egy_kush: 300000
          egy_canaan: 400000
          egy_upe: 150000
