schema_version: 1
scenarios:
  - id: alexander
    name: "Alexander's inheritance, 336 BC"
    description: >-
      336 BC. Philip II of Macedon, master of Greece since Chaeronea, has been murdered
      at his daughter's wedding, days before he was to lead the Greeks against Persia.
      His son Alexander is twenty. In Susa, Darius III has just taken the throne of the
      Achaemenid empire, from the Aegean to the edge of India. In the west, Carthage and
      Syracuse fight over Sicily, and a city called Rome is at war in the Samnite hills.
    start_year: -336
    years_per_turn: 10
    player_civ: macedon
    map: europe
    cost_scale: 10
    # what every state of the age knows, where it has the prerequisites
    common_techs: {written_law: widespread}
    civs:
      macedon:
        disposition: aggressive
        capital: a3_pella
        leader: "Alexander"
        leader_age: 20
