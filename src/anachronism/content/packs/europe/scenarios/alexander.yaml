        successors: [{name: "Philip III Arrhidaeus", age: 36, disposition: cautious}, {name: "Cassander", age: 50, disposition: aggressive}]
        martial_bp: 40000
        pitch: "Your father Philip has been murdered at his daughter's wedding. You are twenty, Greece is restless, and Persia is waiting. History says you conquer it all; make it last longer than you do."
