schema_version: 1
# Rome at the founding of the Republic, 509 BC (D-286). Every fact has its source in a note or comment; passage numbers
# were read against the English translations on Perseus and LacusCurtius in October 2026. Where Livy and others
# disagree on a date it is said so. Chapters: chapters_rome_509.yaml.
scenarios:
  - id: rome_509
    name: "The Republic is born, 509 BC"
    description: >-
      509 BC. The last king of Rome, Tarquinius Superbus, has been driven out, and the Romans have sworn
      never again to suffer a king. Two consuls, Lucius Junius Brutus and Lucius Tarquinius Collatinus, hold office
      for a year. Rome is one small city and its fields on the Tiber. Round it stand the Latin cities, the Etruscans of
      Veii, Caere and Tarquinii, Porsenna of Clusium who will take the exiled Tarquins' side, and the hill peoples
      who raid every summer. Far off lie Greek Cumae and Croton, Syracuse and Carthage, which signs its first treaty
      with Rome this very year. A hundred years of wars, secessions and laws lie ahead.
    start_year: -509
    years_per_turn: 5
    campaign_years_per_turn: 1
    player_civ: rome
    map: europe
    music: roman
    confidence: low
    sources:
      - "Livy 1.60 and 2.1-2.8 (expulsion; first consuls Brutus and Collatinus; Collatinus resigns, Valerius elected; Brutus killed at the Arsian wood; Horatius dedicates the Capitoline temple)"
      - "Polybius 3.22 (first treaty with Carthage 'in the year of Lucius Junius Brutus and Marcus Horatius'; Polybius's consuls differ from Livy's)"
      - "Populations: no ancient census survives for these peoples; figures are order-of-magnitude judgements. Livy 1.44 and Dionysius 5.20 give census totals of adult male citizens that modern historians doubt; Rome is set at about 90,000 people (some 25,000 adult male citizens), well inside the province's capacity."
      - "Techs are judgements from the archaeological record, not from a sourced list. 'republic' and 'written_law' are given to Rome as game conventions: Rome has no public code until the Twelve Tables (Livy 3.57.10, 449)."
      - "Rulers' ages are approximate; no birth years are recorded."
    civs:
      rome:
        # Rome in 509: one city and its fields. No coinage (bronze is weighed, Pliny NH 33.43 unverified), no aqueducts, no paved roads.
        # Leaders: Livy 1.60.3-4 names Brutus and Collatinus; Livy 2.2.10-11 has Collatinus resign and P. Valerius elected; Livy 2.6.9 Brutus dies in battle (509).
        disposition: cautious
        navy_bp: 500
        scripts:
          - {id: "r509_cassian_treaty", goal: "ally", target: "e5_latins", preconditions: {after_year: -497}, depends_on: ["r509_regillus"], note: "Treaty with the Latin cities, struck by Spurius Cassius alone (493): Livy 2.33.4 and 2.33.9; text in Dionysius 6.95.2."}
          - {id: "r509_hernici_treaty", goal: "ally", target: "e5_hernici", preconditions: {after_year: -487}, note: "Treaty with the Hernici, two-thirds of their land taken (486): Livy 2.41.1."}
          - {id: "r509_vs_volsci", goal: "conquer", target: "e5_volsci", preconditions: {after_year: -496}, note: "Wars with the Volsci: Livy 2.22, 2.30-31 (494), 2.33-40 (Coriolanus, 491-488); they go on to 338 (Livy 8.14)."}
          - {id: "r509_vs_aequi", goal: "conquer", target: "e5_aequi", preconditions: {after_year: -495}, note: "Wars with the Aequi: Livy 2.30.3 (494); Cincinnatus at Algidus 458 (Livy 3.25-29); again in 389 (Livy 6.2-4)."}
          - {id: "r509_vs_sabines", goal: "conquer", target: "e5_sabines", preconditions: {after_year: -505, before_year: -450}, note: "Sabine wars: Livy 2.16.1-6 (505-503), 2.31.1 (494), 3.26.1-2 (458)."}
          - {id: "r509_vs_veii_fabii", goal: "conquer", target: "e5_veii", preconditions: {after_year: -481, before_year: -472}, note: "The Fabii take the war with Veii on themselves (479) and are destroyed at the Cremera (477); forty-year truce 474: Livy 2.48.8-2.54.1."}
          - {id: "r509_fidenae", goal: "conquer", target: "e5_veii", preconditions: {after_year: -439, before_year: -425}, note: "Fidenae revolts to Lars Tolumnius of Veii; Cossus kills him (437): Livy 4.17-20."}
          - {id: "r509_fall_of_veii", goal: "conquer", target: "e5_veii", preconditions: {after_year: -407}, note: "Siege of Veii from 406; Camillus takes the city in 396: Livy 4.58-60 and 5.19-22."}
          - {id: "r509_vs_falisci", goal: "conquer", target: "e5_falisci", preconditions: {after_year: -397, before_year: -392}, note: "Capena and Falerii submit after Veii falls (395-394): Livy 5.24 and 5.27."}
        capital: it_roma
        generals:
          - {name: "Publius Valerius Publicola", skill: 3, note: "Consul 509; beat Veii and Tarquinii at the Arsian wood and triumphed: Livy 2.6.6, 2.7.4."}
          - {name: "Titus Largius", skill: 3, note: "First dictator, on Livy's best reading (Livy 2.18.4-5). Spelled 'Larcius' elsewhere."}
          - {name: "Aulus Postumius Albus", skill: 3, trait: bold, note: "Dictator at Lake Regillus: Livy 2.19-20; Dionysius 6.2."}
          - {name: "Lucius Quinctius Cincinnatus", skill: 3, note: "Dictator, called from the plough, 458: Livy 3.26-29. Not available until then in history."}
          - {name: "Aulus Cornelius Cossus", skill: 3, trait: horse, note: "Killed Lars Tolumnius in single combat, 437: Livy 4.19-20."}
          - {name: "Marcus Furius Camillus", skill: 5, trait: siege, note: "Dictator who took Veii, 396: Livy 5.19-22."}
