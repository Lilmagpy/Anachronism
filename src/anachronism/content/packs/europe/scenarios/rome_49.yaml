schema_version: 1
# Late-Republic start 2 of 2 (R1, late agent).
# DECISION (explained in the report): the player's "Rome" is the Republic as a whole, ruled by the Senate and its
# consuls, with Pompey as its best general (the Senate gave him the command in the crisis: Caesar, Civil War 1.1-6).
# Caesar is a separate civ, e1_caesar, holding his three provinces (Cisalpine Gaul, Gallia Comata and Illyricum:
# Suetonius, Divus Iulius 22; Plutarch, Caesar 14). Pompey's holdings (Spain through his legates, the East through his
# settlement) are Roman provinces held by the Republic. The civil war is a war between rome and e1_caesar.
# verified: consuls Lentulus and C. Claudius Marcellus: Dio 41.1 and his consul table (read); Crus and Marcellus's praenomen:
# Wikipedia cross-check only. Populations are the pack's scale, not census counts; Gaul's are cut by Caesar's wars
# (Plutarch, Caesar 15: about a million killed and as many enslaved, read). Ages are approximate where noted.
scenarios:
  - id: rome_49
    name: "Caesar crosses the Rubicon, 49 BC"
    description: >-
      January 49 BC. Caesar's ten years in Gaul are almost over, and the Senate, led by Pompey's friends, will not let him stand
      for a second consulship without giving up his army. The consuls Gaius Claudius Marcellus and Lucius Cornelius Lentulus
      Crus have refused to hear his letter fairly; his tribune Antony has fled to his camp. A river on the road to Ariminum marks
      the boundary of his province. Across it lie Italy, a Republic that holds every other province, and Pompey, who
      beat the pirates and the kings and now commands what the Senate can raise. In Egypt a boy king and his sister quarrel
      over the throne; in Parthia a king has just destroyed a Roman army at Carrhae.
    start_year: -49
    years_per_turn: 5
    campaign_years_per_turn: 1
    player_civ: rome
    map: europe
    music: roman
    cost_scale: 10
    republic: true
    common_techs: {written_law: widespread}
    sources:
      - "Dio 41.1 and Dio's consul tables for 53-27 BC (read): consuls of 49 were L. Cornelius Lentulus and C. Claudius Marcellus"
      - "Caesar, Civil War 1.1-11 (read, Wikisource translation): the consuls, the Senate and the failed negotiations"
      - "Suetonius, Divus Iulius 22, 31-35 (read): Caesar's provinces; the Rubicon; the war in Spain and Macedonia"
      - "Plutarch, Caesar 15, 32 (read): Gaul's losses; the Rubicon as the boundary of Cisalpine Gaul"
      - "Plutarch, Crassus 21-31 (read): Orodes (Hyrodes), Surena and the king of Armenia Artavasdes"
      - "Caesar, Civil War 3.107-108 (read): Ptolemy's will, the boy king, Pothinus and Cleopatra"
      - "Appian, Mithridatic Wars 120-121 (read): Pharnaces, king of the Bosporus for fifteen years; Bithynia and Pontus governed by an annual praetor"
      - "Annexation dates of Cyprus (58) and Cyrenaica: verified: no (cross-checked on Wikipedia only)"
    confidence: medium
    civs:
      rome:
        navy_bp: 8000
        martial_bp: 12000
        disposition: cautious
        scripts:
          - {id: "senate_vs_caesar", goal: "conquer", target: "e1_caesar", preconditions: {after_year: -50}, note: "The Senate refuses Caesar's terms and the consul Lentulus threatens to act without him; Caesar crosses (Caesar, BC 1.1-9; Suetonius, Div. Iul. 31-32)."}
          - {id: "rome_vs_juba", goal: "conquer", target: "numidia", preconditions: {after_year: -48}, depends_on: ["senate_vs_caesar"], note: "Caesar's war in Africa ends with Scipio's camps taken near Thapsus and Juba and Petreius dead by each other's hand (Plutarch, Caesar 53; Appian, BC 2.100)."}
          - {id: "rome_vs_pharnaces", goal: "conquer", target: "pontus", preconditions: {after_year: -48, before_year: -46}, depends_on: ["senate_vs_caesar"], note: "Caesar defeats Pharnaces near Zela: 'Came, saw, conquered' (Plutarch, Caesar 50)."}
          - {id: "julian_calendar", goal: "adopt", target: "astronomy_calendar", preconditions: {after_year: -46}, note: "Caesar reforms the calendar in his third consulship (Suetonius, Div. Iul. 40; verified in part: the footnote on the 355-day year)."}
          - {id: "antony_parthian_war", goal: "conquer", target: "e1_parthia", preconditions: {after_year: -37, before_year: -34}, depends_on: ["senate_vs_caesar"], note: "Antony marches through Armenia on Praaspa, to get back the standards and prisoners lost with Crassus (Dio 49.24-25)."}
          - {id: "antony_captures_artavasdes", goal: "conquer", target: "e1_armenia", preconditions: {after_year: -36, before_year: -33}, note: "Antony takes the king of Armenia captive (Dio 50.1; the Alexandria triumph, Dio 49.40)."}
          - {id: "war_on_cleopatra", goal: "conquer", target: "ptolemaic", preconditions: {after_year: -33}, depends_on: ["senate_vs_caesar"], note: "The Senate declares war on Cleopatra, not on Antony (Dio 50.4); Actium, 2 September 31 (Dio 51.1)."}
