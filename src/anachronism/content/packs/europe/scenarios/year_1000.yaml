schema_version: 1
scenarios:
  - id: year_1000
    name: "Europe in the Year 1000"
    description: >-
      AD 1000. Vikings still raid England; the new kingdoms of Poland and Hungary are being
      born; a young emperor, Otto III, dreams of restoring Rome, and the scholar-pope Sylvester
      II has brought Arabic numerals north. Byzantium under Basil II is the richest state in
      Christendom, Córdoba the most brilliant city in the west, and Cairo is the new capital
      of the Fatimid caliphs. Europe's great age is about to begin - or is it?
    start_year: 1000
    years_per_turn: 10
    campaign_years_per_turn: 2
    player_civ: england
    map: europe
    cost_scale: 10
    # what every state of the age knows, where it has the prerequisites (Justinian's code and Germanic law codes; Islamic and Byzantine soap, glass and hospitals)
    common_techs: {written_law: widespread, soap: adopted, glassmaking: adopted, hospitals: adopted, census: adopted}
    civs:
      england:
        disposition: cautious
        capital: m_wessex
        leader: Æthelred II
        leader_age: 34
        leader_died: 1015
        # the crown's real line to 1066: Æthelred died in April 1016, Edmund in November, and
        # the dates are a year early where two reigns ended in one turn (D-137)
        successors: [{name: "Edmund Ironside", age: 26, disposition: "aggressive", died: 1016}, {name: "Cnut the Great", age: 21, disposition: "aggressive", died: 1035}, {name: "Harold Harefoot", age: 19, died: 1040}, {name: "Harthacnut", age: 22, died: 1042}, {name: "Edward the Confessor", age: 39, disposition: "pious", died: 1065}, {name: "Harold Godwinson", age: 44, disposition: "aggressive", until: 1068}, {name: "Edgar the Ætheling", age: 14, disposition: "cautious"}]
        pitch: "The Danes are raiding again and Æthelred pays them to leave. Find a better idea than silver."
        provinces:
          m_wessex: 700000
          m_mercia: 600000
          m_east_anglia: 450000
          m_northumbria: 300000
        stockpiles: {food: 3280, materials: 820, wealth: 1025, knowledge: 420}
