schema_version: 1
# Late-Republic start 1 of 2 (R1, late agent). Civs: rome, numidia, seleucid, ptolemaic, pontus, bithynia,
# massalia (civs_ancient.yaml) and e1_* (civs_rome_late.yaml). Provinces: provinces_italy.yaml (it_*, si_*,
# sa_*, co_*) and provinces_ancient.yaml for everything outside Italy.
# Populations are the pack's scale (a share of each province's capacity), not census counts: the
# census of 131 BC counted 318,823 citizens (Livy, Periochae 59), a figure that excludes women,
# children, slaves and the allies.
# Ages are approximate where the sources give none: the consuls' ages follow the minimum for the office.
# verified: consuls of 133 (Scaevola, Piso Frugi) cross-checked on Wikipedia (not cited); Plutarch, TG 9 confirms Scaevola was consul that year (read).
scenarios:
  - id: rome_133
    name: "The Gracchi, 133 BC"
    description: >-
      133 BC. Carthage and Corinth lie in ruins and Rome rules the western Mediterranean, but the harvest
      of conquest has gone to the few. Rich men farm the public land with slave gangs while the farmers who
      won the wars lose their holdings; the Italian allies who fill half of every army have no vote. The
      young tribune Tiberius Gracchus is about to propose a land law, King Attalus of Pergamon has just died
      and left his kingdom to the Roman people, and Scipio Aemilianus is besieging Numantia. Beyond the Alps
      Gauls still hold the road to Spain; in Numidia, a prince named Jugurtha serves Rome in Spain; far to the
      east, a boy in Pontus will one day be Mithridates.
    start_year: -133
    years_per_turn: 10
    campaign_years_per_turn: 2
    player_civ: rome
    map: europe
    music: roman
    cost_scale: 10
    republic: true
    common_techs: {written_law: widespread}
    sources:
      - "Fasti Capitolini (consuls of 133 BC: P. Mucius Scaevola and L. Calpurnius Piso Frugi); Livy, Periochae 58"
      - "Plutarch, Tiberius Gracchus 8-21; Appian, Civil Wars 1.7-17 (the land law, the bequest of Attalus, the riot)"
      - "Appian, Spanish Wars 84-98 (Scipio Aemilianus consul a second time and sent to Numantia, 134 BC)"
      - "Livy, Periochae 51-52 (Carthage taken by Scipio, Metellus triumphs over Andriscus, Mummius destroys Corinth after defeating the Achaeans) - read. The organisation of Africa and Macedonia as provinces (146 and 148): verified: no"
      - "Livy, Periochae 58-59 and Plutarch, Tiberius Gracchus 14 (Attalus' will makes the Roman people his heir; Aristonicus occupies Asia, Crassus is defeated and killed, Perperna takes his surrender) - read"
      - "Polybius 6.19-26 (the Roman army and the allies' contingents): verified: no"
      - "Provinces and populations are scaled to the pack's map; Italy north of the Apennines counts as Roman because of its colonies (verified: no). Year-level dates cross-checked on Wikipedia year pages, never cited"
    confidence: medium
    civs:
      rome:
        navy_bp: 3000
        martial_bp: 12000
        disposition: aggressive
        scripts:
          - {id: "numantine_war", goal: "conquer", target: "e1_numantia", preconditions: {after_year: -134}, note: "Scipio Aemilianus takes command in Spain (134) and starves out Numantia, which falls in 133 (Appian, Spanish Wars 84-98)."}
          - {id: "tiberian_land_law", goal: "adopt", target: "surveying", preconditions: {after_year: -133}, note: "Ti. Gracchus' land law (133) sets up a three-man commission to survey and re-assign public land (Plutarch, TG 9-13; Appian, BC 1.9-13)."}
          - {id: "fulvius_vs_gauls", goal: "conquer", target: "e1_allobroges", preconditions: {after_year: -125}, note: "M. Fulvius Flaccus is sent to help Massalia against the Salluvii (125); Sextius founds Aquae Sextiae; Domitius beats the Allobroges at Vindalium; Fabius beats them and Bituitus (121) (Livy, Per. 60-61)."}
          - {id: "arverni_war", goal: "conquer", target: "e1_arverni", preconditions: {after_year: -122}, depends_on: ["fulvius_vs_gauls"], note: "Q. Fabius Maximus defeats Bituitus, king of the Arverni (121); Bituitus goes to Rome to answer to the Senate and is kept at Alba (Livy, Per. 61)."}
          - {id: "gracchan_franchise", goal: "ally", target: "e1_socii", preconditions: {after_year: -125}, note: "Fulvius Flaccus, consul and land commissioner, tries to give the Italians citizenship for their lost land (125) and the Senate blocks him (Appian, BC 1.21)."}
          - {id: "jugurthine_war", goal: "conquer", target: "numidia", preconditions: {after_year: -112}, note: "The Senate goes to war after Cirta (112); Jugurtha buys off Bestia and sends Aulus Albinus' army under the yoke (110); Metellus and Marius wear him down; Bocchus hands him over (105) (Sallust, BJ 26-114; Livy, Per. 65, 67)."}
          - {id: "cimbric_war", goal: "conquer", target: "e1_cimbri", preconditions: {after_year: -113}, note: "Carbo's army is routed by the Cimbri (113); Arausio costs Manlius and Caepio's armies (105); Marius beats the Teutones near Aquae Sextiae (102) and the Cimbri with Catulus (101) (Livy, Per. 63, 67, 68; Plutarch, Marius 18-27)."}
          - {id: "social_war", goal: "conquer", target: "e1_socii", preconditions: {after_year: -91}, note: "The murder of Livius Drusus (91) sets the Italian allies in revolt (Livy, Per. 71-72; Appian, BC 1.35-39); Rome ends it by extending citizenship (Appian, BC 1.49)."}
          - {id: "first_mithridatic_war", goal: "conquer", target: "pontus", preconditions: {after_year: -89}, note: "Mithridates VI overruns Asia (88); Sulla beats his armies at Orchomenus and meets him at Dardanus (85) (Appian, Mith. 49-54; Plutarch, Sulla 24)."}
          - {id: "third_mithridatic_war", goal: "conquer", target: "pontus", preconditions: {after_year: -74}, depends_on: ["first_mithridatic_war"], note: "Nicomedes IV's bequest of Bithynia (74) sets off the war; Pompey, voted the command by the Manilian law (66), ends it; Mithridates dies in 63 (Livy, Per. 93; Plutarch, Pompey 30; Appian, Mith. 112)."}
          - {id: "crassus_parthian_expedition", goal: "conquer", target: "e1_parthia", preconditions: {after_year: -55, before_year: -52}, note: "Crassus marches against Parthia and is destroyed by Surena near Carrhae (53) (Plutarch, Crassus 17-31)."}
        capital: it_roma
        generals: [{name: "Publius Cornelius Scipio Aemilianus", skill: 5, trait: siege, note: "Conqueror of Carthage, made consul a second time for Numantia (Appian, Spanish Wars 84)."}, {name: "Quintus Caecilius Metellus Macedonicus", skill: 3, trait: shield, note: "Consul who defeated Andriscus in Macedonia (148); not verified here beyond the Fasti."}, {name: "Decimus Junius Brutus Callaicus", skill: 3, trait: bold, note: "Counter-guerrilla commander against the Lusitanians, who crossed the Lethe and took Talabriga (Appian, Spanish Wars 71-73)."}, {name: "Marcus Perperna", skill: 2, trait: horse, note: "Consul who receives Aristonicus' surrender (Livy, Per. 59)."}, {name: "Gaius Marius", skill: 2, trait: quartermaster, note: "A young equestrian officer at Numantia, noticed by Scipio (Sallust, BJ 7: Scipio relied on the young Jugurtha, and Marius is not named there; Marius was consul in 107)."}, {name: "Lucius Cornelius Sulla", skill: 5, trait: bold, note: "Quaestor under Marius, he receives Jugurtha from Bocchus (Sallust, BJ 102-113) and fights Mithridates' armies at Orchomenus (Appian, Mith. 49)."}]
