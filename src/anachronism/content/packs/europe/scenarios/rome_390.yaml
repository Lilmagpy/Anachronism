schema_version: 1
# Rome after Veii and before the Gauls, 390 BC (D-286). Passage numbers read against Perseus/LacusCurtius English texts, Oct 2026.
# The date is the traditional Roman one; Polybius (1.6.1-2) puts the same events in 387-386. Chapters: chapters_rome_390.yaml.
scenarios:
  - id: rome_390
    name: "The Gauls at the gates, 390 BC"
    description: >-
      390 BC, by the traditional Roman reckoning (Polybius dates the same event to 387-386). Rome has just
      taken Veii and shared out its land, and has become the first city of central Italy. Then a host of Senonian Gauls
      under Brennus, who have been besieging Clusium, hear that Roman envoys fought against them and march south
      for Rome. The army sent to stop them is led by tribunes who have never faced an enemy like this. After the
      Gauls come the long struggles for the Licinian-Sextian laws, the Latin cities' revolt, and Samnium.
    start_year: -390
    years_per_turn: 5
    campaign_years_per_turn: 1
    player_civ: rome
    republic: true
    map: europe
    music: roman
    confidence: low
    sources:
      - "Livy 5.35-5.49 (the Gauls at Clusium, the envoys, the Allia, the sack, the ransom, Camillus), 5.50-5.55 and 6.1-6.5 (rebuilding; wars with Volsci, Aequi and Etruscans, 389)"
      - "Polybius 1.6.1-2 (the capture of Rome in the year of the Peace of Antalcidas, 387-386, when Dionysius was besieging Rhegium) and 2.18.2-3 (the Gauls leave because the Veneti invade their land): the date 390 is the traditional Roman one."
      - "Livy 6.35-6.42 and 7.1 (Licinian-Sextian laws; the first plebeian consul); 7.9-10 (361); 7.19-20 and 7.22 (354-351); 7.27.2 (Carthage treaty, 348); 7.29-8.2 (First Samnite War); 8.3-8.14 (Latin War and its settlement)."
      - "Populations are order-of-magnitude judgements, as in rome_509. After Veii (396) Rome's territory was several times its 509 size; Rome is set at 160,000 people in the ager Romanus and the Veientine land (Livy 5.30.8: seven iugera a head given to the plebs from Veientine land)."
      - "Techs are judgements from the archaeological record. Rome has the Twelve Tables (Livy 3.57.10) but no coinage and no aqueduct."
      - "Rulers' ages are approximate."
    civs:
      rome:
        # Veii and its fields were taken in 396 (Livy 5.19-22) and the Veientine land shared out (Livy 5.30.8). Falerii and Capena submitted soon after (Livy 5.24, 5.27).
        # Rome has no coinage in 390 (no source; bronze is weighed), no aqueduct. Four new tribes were made from the Veientine land (Livy 6.5: Stellatina, Tromentina, Sabatina, Arniensis).
        disposition: aggressive
        navy_bp: 800
        scripts:
          - {id: "r390_vs_volsci", goal: "conquer", target: "e5_volsci", preconditions: {after_year: -390}, note: "Camillus defeats the Volsci, Aequi and Etruscans (389): Livy 6.2-6.4. The Volscian wars go on to 338 (Livy 8.14)."}
          - {id: "r390_vs_aequi", goal: "conquer", target: "e5_aequi", preconditions: {after_year: -390, before_year: -380}, note: "Aequi beaten alongside the Volsci in 389-388: Livy 6.2-6.4."}
          - {id: "r390_vs_etruscans", goal: "conquer", target: "e5_etruscan_league", preconditions: {after_year: -390, before_year: -384}, note: "Etruscans besiege Sutrium and are beaten by Camillus (389): Livy 6.2.2 and 6.3.1-2."}
          - {id: "r390_vs_hernici", goal: "conquer", target: "e5_hernici", preconditions: {after_year: -363, before_year: -356}, note: "The Hernici are declared war on (362): Livy 7.6.1-3."}
          - {id: "r390_vs_tarquinii", goal: "conquer", target: "e5_tarquinii", preconditions: {after_year: -359, before_year: -350}, note: "War with Tarquinii: 307 Roman prisoners sacrificed (358), forty-year truce in 351: Livy 7.15.10, 7.22.5."}
          - {id: "r390_caere_peace", goal: "ally", target: "e5_caere", preconditions: {after_year: -355, before_year: -350}, note: "Caere pardoned and given a hundred-year truce in memory of its care of the Vestals (353): Livy 7.20.7-9."}
          - {id: "r390_samnite_treaty", goal: "ally", target: "e5_samnites", preconditions: {after_year: -355, before_year: -345}, note: "Treaty of friendship with the Samnites (354): Livy 7.19.4."}
          - {id: "r390_carthage_treaty", goal: "trade", target: "carthage", preconditions: {after_year: -349, before_year: -340}, note: "Treaty with Carthage (348): Livy 7.27.2; Polybius 3.24 gives a second treaty without a date."}
          - {id: "r390_first_samnite_war", goal: "conquer", target: "e5_samnites", preconditions: {after_year: -344}, depends_on: ["r390_samnite_treaty"], note: "Capua appeals to Rome and the First Samnite War opens (343-341), ended by a renewed treaty: Livy 7.29-8.2."}
          - {id: "r390_capua", goal: "ally", target: "e5_campanians", preconditions: {after_year: -344}, note: "Capua surrenders itself to Rome (343): Livy 7.31."}
          - {id: "r390_latin_war", goal: "conquer", target: "e5_latins", preconditions: {after_year: -341}, note: "The Latin War (340-338) and the League's dissolution: Livy 8.3-8.14."}
        capital: it_roma
