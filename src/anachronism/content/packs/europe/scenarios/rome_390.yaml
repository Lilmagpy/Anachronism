          - {name: "Marcus Manlius Capitolinus", skill: 3, trait: shield, note: "Woken by the geese, held the Capitol: Livy 5.47.4."}
          - {name: "Titus Manlius Torquatus", skill: 4, trait: bold, note: "Killed a Gaul in single combat at the Anio and took his torque: Livy 7.10."}
          - {name: "Marcus Valerius Corvus", skill: 4, trait: bold, note: "Killed a Gaul with a crow on his helmet: Livy 7.26; won at Mount Gaurus in 343: Livy 7.32-33."}
          - {name: "Publius Decius Mus", skill: 3, trait: shield, note: "Devoted himself and the enemy to the gods at Veseris, 340: Livy 8.9."}
          - {name: "Lucius Furius Camillus", skill: 3, note: "Consul in 338; settled Latium: Livy 8.13-8.14."}
