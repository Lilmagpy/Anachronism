schema_version: 1
scenarios:
  - id: punic_wars
    name: "Rome and Carthage, 264 BC"
    description: >-
      264 BC. Rome has just made itself master of Italy; Carthage rules the western sea.
      A quarrel over Messana in Sicily is about to become the First Punic War. In the east,
      the heirs of Alexander - Ptolemies in Egypt, Seleucids in Asia, Antigonids in
      Macedon - fight endless wars, while Athens and Sparta make one last stand for Greek
      freedom. In Syracuse, a young man named Archimedes is beginning to think.
    start_year: -264
    years_per_turn: 10
    player_civ: rome
    map: europe
    cost_scale: 10
    civs:
      rome:
        disposition: aggressive
        scripts:
          - {id: "first_punic_war", goal: "conquer", target: "carthage", preconditions: {after_year: -266}, note: "Rome crosses to Sicily and the First Punic War begins (264-241 BC)."}
          - {id: "rome_vs_gauls", goal: "conquer", target: "cisalpine_gauls", preconditions: {after_year: -230}, note: "Rome defeats the Gauls at Telamon and conquers the Po valley (225-222 BC)."}
          - {id: "first_macedonian_war", goal: "conquer", target: "macedon", preconditions: {after_year: -216}, depends_on: ["first_punic_war"], note: "Philip V allies with Hannibal; Rome turns east (214 BC)."}
          - {id: "rome_vs_antiochus", goal: "conquer", target: "seleucid", preconditions: {after_year: -195}, depends_on: ["first_macedonian_war"], note: "Rome defeats Antiochus III at Magnesia (190 BC)."}
        capital: rom_latium
        leader: Consul Appius Claudius Caudex
        pitch: "Italy is yours; Sicily beckons. Carthage rules the sea you have never sailed. Give Rome ideas before it gives the world its legions."
        provinces:
          rom_latium: 900000
          rom_etruria: 600000
          rom_campania: 800000
          rom_samnium: 350000
          rom_umbria: 450000
          rom_apulia: 400000
          rom_tarentum: 250000
          rom_bruttium: 200000
