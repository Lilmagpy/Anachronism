schema_version: 1
# Rome and the Latins, 340 BC: the start point of the mid-Republic chronicle (D-286).
# Ages given for rulers are placeholders: the sources do not state them.
# Populations are about three-quarters of each province's capacity in provinces_italy.yaml. Starting
# techs are an era baseline and approximate. Every historical statement carries its source in a
# note or comment: sources read for this file are Livy (Gutenberg translation, books 8-10 and the
# Periochae), Polybius 1-3, Plutarch (Pyrrhus, Timoleon), Diodorus 16 and 20 and Cassius Dio 9-10 (Zonaras).
scenarios:
  - id: rome_340
    name: "Rome and the Latins, 340 BC"
    description: >-
      340 BC. Rome is the strongest city of Latium, but not yet its master. The Latin cities, her old allies,
      have asked for a consul and half the Senate, and the Campanians and Volsci stand with them; behind Rome
      lie the Samnites, her partners in a treaty renewed only last year. Beyond them are the Etruscan cities,
      the Gauls of the north, the Greek cities of the south, and - far away - Timoleon in Syracuse, Carthage
      camped in Sicily, and Philip of Macedon about to make himself master of Greece. The year is that of the
      consuls Manlius Torquatus and Decius Mus, and of the Latin War.
    start_year: -340
    years_per_turn: 5
    campaign_years_per_turn: 1
    player_civ: rome
    map: europe
    music: roman  # the client plays client/music/<name>.mp3 (D-208)
    cost_scale: 10
    confidence: medium
    sources:
      - "Livy 8.1-8.14 (the Latin War and settlement, 340-338 BC)"
      - "Livy 8.19-8.26 and 9.1-9.46, 10.1-10.30 (the Samnite wars, Appius Claudius, Sentinum)"
      - "Livy, Periochae 11-15 (290-268 BC)"
      - "Polybius 2.17-2.20 (the Gauls of Italy and their wars with Rome)"
      - "Plutarch, Pyrrhus (280-272 BC); Plutarch, Timoleon; Diodorus 16.77-16.82 (Crimisus); Cassius Dio 9.39 and 10 (Tarentum)"
    # what every state of the age knows, where it has the prerequisites
    common_techs: {written_law: widespread}
    civs:
      rome:
        # Rome had no king: the 'ruler' is the leading magistrate of each crisis, each leaving office in his chapter (see chapters_rome_340.yaml).
        # Ages are placeholders: the sources do not give them. Torquatus is consul for the third time in 340 BC (Livy 8.3.9) with P. Decius Mus.
        navy_bp: 500
        disposition: aggressive
        scripts:
          - {id: "rome_latin_war", goal: "conquer", target: "e3_latins", preconditions: {after_year: -341}, note: "The Latin War (340-338 BC): Livy 8.3-8.14."}
          - {id: "rome_second_samnite_war", goal: "conquer", target: "e3_samnites", preconditions: {after_year: -328}, depends_on: ["rome_latin_war"], note: "Rome declares war on the Samnites after Palaepolis (Livy 8.23-8.25); the Caudine Forks, 321 BC (Livy 9.1-9.12)."}
          - {id: "rome_roads", goal: "adopt", target: "roads", preconditions: {after_year: -313}, note: "Appius Claudius, as censor, makes the road later called the Appian (Livy 9.29)."}
          - {id: "rome_aqueduct", goal: "adopt", target: "aqueduct", preconditions: {after_year: -313}, note: "The same censor brings water into the city (Livy 9.29)."}
          - {id: "rome_vs_etruscans", goal: "conquer", target: "e3_etruscans", preconditions: {after_year: -312}, depends_on: ["rome_second_samnite_war"], note: "War with the Etruscans: Sutrium, the Ciminian forest, truces (Livy 9.32-9.41)."}
          - {id: "rome_vs_umbrians", goal: "conquer", target: "e3_umbrians", preconditions: {after_year: -311}, depends_on: ["rome_vs_etruscans"], note: "The Umbrians rise in 308 BC and are beaten (Livy 9.36-9.41)."}
          - {id: "rome_vs_hernici", goal: "conquer", target: "e3_hernici", preconditions: {after_year: -307}, depends_on: ["rome_second_samnite_war"], note: "Anagnia and the Hernici go to war with Rome in 306 BC (Livy 9.42-9.43)."}
          - {id: "rome_third_samnite_war", goal: "conquer", target: "e3_samnites", preconditions: {after_year: -299}, depends_on: ["rome_second_samnite_war"], note: "The Lucanians appeal and Rome declares war on the Samnites (298 BC, Livy 10.11-10.12); Sentinum, 295 BC (Livy 10.27-10.30)."}
          - {id: "rome_vs_sabellians", goal: "conquer", target: "e3_sabellians", preconditions: {after_year: -291}, depends_on: ["rome_third_samnite_war"], note: "Curius Dentatus, consul in 290 BC, subdues the Samnites and the rebellious Sabines (Livy, Periochae 11)."}
          - {id: "rome_coinage", goal: "adopt", target: "coinage", preconditions: {after_year: -290}, note: "Rome strikes coin: Livy, Periochae 15, has silver coin first used by the Roman people about 268 BC; cast bronze is dated by numismatists to the decades before that."}
          - {id: "rome_vs_senones", goal: "conquer", target: "e3_senones", preconditions: {after_year: -285}, note: "The Senones kill Roman envoys and are driven out of their land; Sena is founded (Polybius 2.19.7-2.19.13; Livy, Periochae 12)."}
          - {id: "rome_vs_boii", goal: "conquer", target: "e3_boii", preconditions: {after_year: -284}, depends_on: ["rome_vs_senones"], note: "The Boii and Etruscans are beaten at Lake Vadimo (Polybius 2.20.1-2.20.6)."}
          - {id: "rome_vs_tarentum", goal: "conquer", target: "e3_tarentum", preconditions: {after_year: -283}, note: "The Tarentines sink Roman ships and insult the envoys (Cassius Dio 9.39; Livy, Periochae 12); Rome declares war."}
          - {id: "rome_vs_lucanians", goal: "conquer", target: "e3_lucanians", preconditions: {after_year: -283}, note: "Samnites, Lucanians, Bruttians and Etruscans fight Rome (Livy, Periochae 12)."}
          - {id: "rome_vs_bruttii", goal: "conquer", target: "e3_bruttii", preconditions: {after_year: -281}, depends_on: ["rome_vs_lucanians"], note: "Operations against Lucanians, Bruttians and Samnites (Livy, Periochae 13-14)."}
          - {id: "rome_vs_pyrrhus", goal: "conquer", target: "epirus", preconditions: {after_year: -281}, depends_on: ["rome_vs_tarentum"], note: "Pyrrhus defeats Laevinus at Heraclea in 280 BC (Plutarch, Pyrrhus 16-17), wins again at Asculum (Plutarch, Pyrrhus 21) and is beaten near Beneventum in 275 BC (Plutarch, Pyrrhus 25)."}
        capital: it_roma
        generals: [{name: "Titus Manlius Torquatus", skill: 4, trait: shield, note: "Kept the triarii back until the Latins were spent at the Veseris, and put his own son to death for fighting out of order (Livy 8.7, 8.10)."}, {name: "Quintus Fabius Maximus Rullianus", skill: 5, trait: horse, note: "Won at Imbrinium against orders (Livy 8.30), led the army through the Ciminian forest (Livy 9.36) and held back at Sentinum until the enemy tired (Livy 10.28-29)."}, {name: "Lucius Papirius Cursor", skill: 4, trait: beloved, note: "Called by Livy by far the most celebrated general of his age; won the men's goodwill by visiting the wounded (Livy 8.29, 8.36)."}, {name: "Publius Decius Mus", skill: 3, trait: bold, note: "Devoted himself and the enemy to the gods below at the Veseris (Livy 8.9); his son did the same at Sentinum (Livy 10.28)."}, {name: "Quintus Publilius Philo", skill: 3, trait: siege, note: "Held command beyond his year, the first prorogation, to finish the siege of Palaepolis (Livy 8.23, 8.26)."}, {name: "Manius Curius Dentatus", skill: 4, trait: shield, note: "Held his camp against Pyrrhus near Beneventum and drove back the elephants with javelins (Plutarch, Pyrrhus 25)."}, {name: "Gaius Fabricius Luscinus", skill: 3, note: "Refused Pyrrhus's bribe and gave warning of a plot to poison him (Plutarch, Pyrrhus 20-21; Cassius Dio 10, fragments)."}]
