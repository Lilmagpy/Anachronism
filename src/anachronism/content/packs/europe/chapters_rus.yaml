schema_version: 1
# Chronicle mode (D-120, D-149): Kievan Rus from Vladimir to Yaroslav the Wise, 1000-1054.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Primary Chronicle (the Tale of Bygone Years, compiled in Kiev around
# 1113, with its own loyalties), Thietmar of Merseburg, the Scandinavian sagas, the
# Russkaya Pravda and modern work by Franklin & Shepard, Martin and Raffensperger.
# benchmark_provinces counts the provinces of this map the real princes of Kiev held.
chapters:
  - id: rus_feasts
    scenario: year_1000
    civ: rus
    year: 1000
    title: "Bread for the Poor"
    place: "Kiev"
    speaker: diviner
    speaker_name: "Anastas of Cherson"
    speaker_title: "Priest of the Tithe Church"
    benchmark_provinces: 6
    story: >-
      Twelve years ago you, Vladimir, chose the faith of the Greeks for Rus, threw the idol of
      Perun into the Dnieper, and married the Byzantine emperor's sister. You had five wives
      and eight hundred concubines before, the chronicle will say; now you are a Christian
      prince, and your priests read you the Gospels.


      'Blessed are the merciful,' they read. You have been thinking about it.
    choices:
      - label: "Feed the poor of Kiev from the palace"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          Every beggar may come to the palace for food and drink. For those too sick to walk,
          carts go round the city loaded with bread, meat, fish, honey and kvass. Every Sunday
          you feast your retainers, and when they complain about wooden spoons, you have
          silver ones made: 'With silver and gold I cannot get a retinue, but with a retinue I
          can get silver and gold.'
      - label: "Feed your warriors first"
        influence: {nobility: 1000}
        outcome: >-
          Your retinue eats well. The beggars of Kiev pray for someone else.
        deeds: {martial_bp: 500}
    history: >-
      The Primary Chronicle describes Vladimir's charity and his feasts for his retinue after
      the conversion of 988, including the silver spoons.
    sources: ["Primary Chronicle, 996"]

  - id: rus_novgorod
    scenario: year_1000
    civ: rus
    year: 1014
    title: "Novgorod Refuses Tribute"
    place: "Kiev"
    speaker: general
    speaker_name: "Boris"
    speaker_title: "Your favourite son"
    benchmark_provinces: 6
    story: >-
      Your son Yaroslav, whom you set over Novgorod in the north, has stopped sending you the
      two thousand grivnas a year Novgorod owes Kiev. He has hired Varangians from across the
      sea. Your other son Sviatopolk, whom you suspect of plotting with his father-in-law
      Bolesław of Poland, is under guard.


      You are old. You order the roads to Novgorod cleared and bridges built for a war on
      your own son.
    choices:
      - label: "Prepare to march on Novgorod"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          You fall ill before the army can march, and die the next summer at Berestovo. Your
          body is smuggled out of the palace at night, wrapped in a carpet, so that Sviatopolk
          will not hear of it too soon. He hears.
      - label: "Forgive Yaroslav, and name your heir"
        legitimacy_bp: 800
        outcome: >-
          You name Boris your heir before the boyars. Yaroslav pays his tribute. Sviatopolk, in
          his prison, makes plans.
    history: >-
      In 1014 Yaroslav refused Novgorod's tribute; Vladimir prepared war but died on 15 July
      1015.
    sources: ["Primary Chronicle, 1014-1015"]

  - id: rus_boris_gleb
    scenario: year_1000
    civ: rus
    year: 1015
    title: "Boris and Gleb"
    place: "Kiev"
    speaker: steward
    speaker_name: "Putsha"
    speaker_title: "A boyar of Vyshgorod"
    benchmark_provinces: 6
    story: >-
      Your father Vladimir is dead, and you, Sviatopolk, have taken Kiev, handing out gifts
      to the people. But your half-brother Boris has the army - your father's army, which
      would make him prince tomorrow if he asked. He has not asked. He is camped on the Alta
      river, praying.


      Putsha and the men of Vyshgorod say they will do whatever you want.
    choices:
      - label: "Send them to the Alta"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          Boris is killed in his tent, singing the psalms; his young brother Gleb is killed on
          a boat on the Dnieper. They will be the first saints of Rus - martyrs who would not
          raise a hand against their brother. You will be called Sviatopolk the Accursed.
          Yaroslav in Novgorod is gathering his Varangians.
        deeds: {martial_bp: -500}
      - label: "Make peace with your brothers and share the land"
        legitimacy_bp: 1000
        outcome: >-
          Boris swears loyalty; Gleb keeps Murom. Yaroslav in Novgorod is the only brother
          still against you.
    history: >-
      In 1015 Sviatopolk had Boris and Gleb murdered; they were canonised as the first saints
      of Rus. Yaroslav defeated Sviatopolk at Lyubech in 1016.
    sources: ["Primary Chronicle, 1015", "Tale of Boris and Gleb"]

  - id: rus_alta
    scenario: year_1000
    civ: rus
    year: 1018
    until_year: 1022
    title: "Bolesław at the Golden Gate"
    place: "Kiev"
    speaker: poland
    speaker_name: "Bolesław the Brave"
    speaker_title: "Your father-in-law, Duke of Poland"
    needs_alive: [poland]
    benchmark_provinces: 6
    story: >-
      Yaroslav beat you at Lyubech and took Kiev. But your father-in-law Bolesław has come with
      a Polish army, beaten Yaroslav on the Bug river, and marched into Kiev, where legend says
      he struck the Golden Gate with his sword and notched it. He has carried off Yaroslav's
      sisters and treasury.


      Now he is settling his troops in the towns of Rus for the winter, and the people of Kiev
      are complaining. And Yaroslav is coming back from Novgorod with a new army.
    choices:
      - label: "Turn on the Poles, and keep Kiev alone"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          You order the Poles killed in their quarters. Bolesław goes home with the treasure,
          the princesses and a few towns. Yaroslav comes back. On the Alta river, where Boris
          died, your army is destroyed. You flee west through the forests, half mad, and die
          somewhere in the wilderness. Yaroslav is Prince of Kiev.
        deeds: {ruler_falls: "flees into the wilderness and dies"}
      - label: "Keep the Poles, and make Bolesław your shield"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          Polish garrisons stay in Kiev. Yaroslav's army meets them on the Alta, and the battle
          is long and hard.
        deeds: {ally_with: [poland]}
    history: >-
      Bolesław I took Kiev for Sviatopolk in 1018; Sviatopolk soon turned on his Polish allies.
      Yaroslav defeated him on the Alta in 1019; Sviatopolk died in flight.
    diverged: >-
      Poland is gone.
    sources: ["Primary Chronicle, 1018-1019", "Thietmar 8.31-33", "Gallus Anonymus 1.7"]

  - id: rus_pravda
    scenario: year_1000
    civ: rus
    year: 1020
    title: "The Truth of Rus"
    place: "Novgorod"
    speaker: scholar
    speaker_name: "A Novgorod clerk"
    speaker_title: "Of the prince's court"
    benchmark_provinces: 6
    story: >-
      You are Yaroslav, Prince of Kiev at last. You owe your throne to the men of Novgorod, who
      paid for your Varangians, and to the Varangians, who brawled in the Novgorod streets
      and were killed for it.


      Novgorod wants its customs written down so that no prince can change them: the fine for
      killing a man, for pulling a man's beard, for riding another man's horse without asking.
    choices:
      - label: "Write down the Pravda"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1000
        unrest_bp: -1000
        outcome: >-
          The Russkaya Pravda: forty grivnas for a man killed, twelve for a beard pulled, three
          for a horse ridden without leave. Blood feud is allowed among close kin, and a fine
          paid to the prince by everyone else. It is the first written law of the East Slavs.
      - label: "Keep the law in the prince's head"
        influence: {nobility: 1000}
        outcome: >-
          Your judgements are wise, and nobody can predict them.
    history: >-
      The Short Pravda, attributed to Yaroslav (c. 1016-1054), is the oldest East Slavic law
      code.
    sources: ["Russkaya Pravda (Short redaction)", "Franklin & Shepard, The Emergence of Rus (1996)"]

  - id: rus_pechenegs
    scenario: year_1000
    civ: rus
    year: 1036
    title: "The Battle Under the Walls"
    place: "Kiev"
    speaker: general
    speaker_name: "Ivan Tvorimirich"
    speaker_title: "Commander of the Kiev militia"
    benchmark_provinces: 6
    story: >-
      Your brother Mstislav, who made you share Rus with him along the Dnieper, has died
      hunting. You are sole prince again. And the Pechenegs, the horse nomads of the steppe,
      have come in their thousands and are camped outside Kiev itself.
    choices:
      - label: "Fight them in the open field"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The battle lasts until evening. The Pechenegs break and are drowned in the rivers as
          they flee. They never threaten Kiev again. On the field where your army stood, you
          build a great cathedral, St Sophia, with golden domes and mosaics by Greek masters,
          and a Golden Gate for the city.
        deeds: {take: [m_pecheneg]}
      - label: "Hold the walls"
        legitimacy_bp: 300
        outcome: >-
          The Pechenegs burn the suburbs and ride away with captives.
    history: >-
      In 1036 Yaroslav defeated the Pechenegs at Kiev; he built St Sophia's Cathedral on the
      battlefield (consecrated 1040s).
    sources: ["Primary Chronicle, 1036-1037"]

  - id: rus_constantinople
    scenario: year_1000
    civ: rus
    year: 1043
    until_year: 1048
    title: "The Last Sea Raid"
    place: "The mouth of the Dnieper"
    speaker: general
    speaker_name: "Vladimir Yaroslavich"
    speaker_title: "Your eldest son"
    needs_alive: [byzantium]
    benchmark_provinces: 7
    story: >-
      A Rus merchant has been killed in Constantinople in a brawl, and the emperor has refused
      compensation. Your son Vladimir and the Varangian Ingvar want to take the fleet down the
      Dnieper and across the Black Sea, as the princes of old did, and teach the Greeks a
      lesson.


      The Greeks have a fire that burns on water.
    choices:
      - label: "Send the fleet"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          A storm scatters your boats off the Bulgarian coast, and the Greek ships come out
          with their fire-siphons. Thousands of Rus are drowned or captured; the captives are
          blinded and their right hands cut off. It is the last Rus attack on Constantinople.
          Three years later you make peace, and your son marries a Greek princess.
        deeds: {martial_bp: -500, grudges: {byzantium: 1500}}
      - label: "Demand compensation through envoys"
        legitimacy_bp: 300
        wealth_bp: 500
        outcome: >-
          The emperor pays, after a year of letters. Rus merchants go on trading in
          Constantinople.
    history: >-
      The Rus-Byzantine war of 1043 ended in a disastrous defeat for the Rus fleet; peace
      followed in 1046 with a dynastic marriage.
    diverged: >-
      Byzantium is gone.
    sources: ["Psellos, Chronographia 6.90-95", "Primary Chronicle, 1043"]

  - id: rus_daughters
    scenario: year_1000
    civ: rus
    year: 1051
    title: "The Father-in-Law of Europe"
    place: "Kiev"
    speaker: steward
    speaker_name: "Ingegerd"
    speaker_title: "Your wife, a Swedish princess"
    benchmark_provinces: 7
    story: >-
      King Henry of France, a widower, has sent envoys a very long way to ask for your daughter
      Anna. Your daughter Elisabeth is already married to Harald Hardrada, now king of Norway;
      Anastasia to the king of Hungary. Your sons have married a Greek, a Polish and a German
      princess.


      Anna can read and write. Henry of France cannot.
    choices:
      - label: "Send Anna to France"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Anna becomes Queen of France and signs a royal charter in her own hand, in Cyrillic
          letters - while the French nobles beside her make their marks with a cross. She
          writes home that France is a barbarous country. Her son Philip will be king of France.
        deeds: {ally_with: [france, norway, hungary]}
      - label: "Keep her home for a prince of Rus"
        influence: {nobility: 1000}
        outcome: >-
          Anna marries a boyar's son. France looks for a bride elsewhere.
    history: >-
      Anna Yaroslavna married Henry I of France in 1051; a charter of 1063 bears her signature
      in Cyrillic. Yaroslav's children married into the royal houses of much of Europe.
    sources: ["Charter of Soissons (1063)", "Raffensperger, Reimagining Europe (2012)"]

  - id: rus_testament
    scenario: year_1000
    civ: rus
    year: 1054
    title: "Love One Another"
    place: "Vyshgorod"
    speaker: steward
    speaker_name: "Iziaslav"
    speaker_title: "Your eldest living son"
    benchmark_provinces: 7
    story: >-
      You are seventy-six and dying. You have five sons. Rus is too big for one of them and
      too precious to split into five kingdoms.


      You have an idea: the eldest will rule in Kiev as a father to the others; each brother
      will have his own city - Chernigov, Pereyaslavl, Smolensk, Vladimir - and when the
      eldest dies, each will move up a seat, like men at a table.
    choices:
      - label: "Divide the cities by seniority, and tell them to love one another"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          'My sons, love one another, for you are brothers of one father and mother.' Within
          twenty years the brothers are fighting over the seats; within a century, Rus is a
          dozen principalities, and too divided to stand when the Mongols come.
      - label: "Leave everything to the eldest"
        legitimacy_bp: 800
        unrest_bp: 2000
        outcome: >-
          Iziaslav takes everything. His brothers go to their father-in-law kings for armies.
    history: >-
      Yaroslav died in 1054, dividing Rus among his sons under a rule of seniority; the system
      led to generations of conflict.
    sources: ["Primary Chronicle, 1054", "Martin, Medieval Russia 980-1584 (2007)"]
