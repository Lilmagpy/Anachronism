schema_version: 1
# Chronicle mode (D-120, D-XXX): the kings of Alashiya (Cyprus), c. 1275-1170 BC. Each chapter
# opens in its year; one choice is what history chose (historical: true). The kings of
# Alashiya left few records of their own; facts follow the Amarna letters EA 33-40 (as
# background), the Hittite inscription of Suppiluliuma II from Hattusa (the 'Sudburg'), the
# letters found at Ugarit (RS 20.18, RS 20.238), the Medinet Habu inscription of Ramesses III,
# and the excavations at Enkomi, Kition and Hala Sultan Tekke, with modern work by Knapp,
# Bryce, Cline and Kassianidou. No king of Alashiya in this period is named here: the
# names are lost to us. Reign dates are invented placeholders for the turn grid only.
# Whether Alashiya is Cyprus as a whole or its east coast is debated; this chronicle takes
# the usual view that it stands for the island. Alashiya is one province throughout.
chapters:
  - id: ala_copper
    scenario: kadesh
    civ: alashiya
    year: -1275
    title: "The Copper Brothers"
    place: "The harbour of Alashiya"
    speaker: steward
    speaker_name: "Your chief of the copper stores"
    speaker_title: "Keeper of the ingots"
    benchmark_provinces: 1
    story: >-
      You are the king of Alashiya, the island of copper. Your mines in the Troodos hills
      feed every smith from Egypt to the Aegean, and your smelters pour the metal into
      ingots the shape of an ox-hide, a man can carry on his back. Your grandfathers' letters
      to the Pharaoh, kept in Egypt, call him 'my brother' and ask for silver and gold in
      return for copper, and complain that raiders from Lukka take your villages.


      Now Pharaoh Ramesses is marching to Syria and the Great King of Hatti is gathering his
      army. Both want copper, because bronze is war. Your harbour is full of foreign
      captains.
    choices:
      - label: "Sell to every buyer, and stay out of the war"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 500
        outcome: >-
          Cypriot ingots and Cypriot pottery turn up all over the sea in these years: in
          Egypt, in Ugarit, on the wreck of a trading ship that sank off southern Anatolia
          a generation or two before, and in the Aegean. You are rich, and nobody at Kadesh asks you for
          men.
      - label: "Sell only to Egypt, for gold"
        wealth_bp: 3000
        legitimacy_bp: -500
        outcome: >-
          Egypt pays handsomely. Hatti's merchants find the ingots dearer elsewhere, and its
          king remembers.
        deeds: {grudges: {hatti: 2000}}
    history: >-
      Late Cypriot copper was traded across the eastern Mediterranean in the 13th century BC;
      the letters of an earlier king of Alashiya to Egypt (Amarna letters EA 33-40) show the
      island's copper trade and its exchange of gifts with the Pharaoh as 'brother'.
    sources: ["Amarna letters EA 33-40", "Knapp, The Archaeology of Cyprus (2013)", "Bass, the Uluburun wreck reports"]

  - id: ala_tribute
    scenario: kadesh
    civ: alashiya
    year: -1230
    title: "The Great King's Fleet"
    place: "The south coast of Alashiya"
    speaker: hatti
    speaker_name: "Tudhaliya IV"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      The Hittites have never been a sea power. But the new Great King Tudhaliya has ships
      built in Ugarit and the Cilician ports, and they have been seen off your coast with
      soldiers aboard. He wants copper without paying for it, and a king of Hatti to be
      named in your letters before yourself.


      A later Hittite king will say on a rock at Hattusa that his father conquered Alashiya
      and laid tribute on it. What your own court says is not recorded.
    choices:
      - label: "Send tribute and keep your throne"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          Your ships carry copper and silver to the Hittite port, and the landing parties go
          home. The Great King puts the victory on a stone. Your people remember it as
          a bad year, and the trade goes on.
        deeds: {peace_with: [hatti]}
      - label: "Man the shore and refuse"
        materials_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your coast towns fight off the first landing. Hatti has more ships to send.
        deeds: {ships: 10, grudges: {hatti: 3000}}
    history: >-
      An inscription of Suppiluliuma II says his father (Tudhaliya IV) conquered Alashiya and
      made it pay tribute. The conquest, if it happened as stated, was brief and left no trace
      in the archaeology of the island.
    diverged: >-
      Hatti is gone.
    sources: ["Suppiluliuma II, Sudburg inscription (KBo 12.38)", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: ala_fleet
    scenario: kadesh
    civ: alashiya
    year: -1206
    title: "Three Times at Sea"
    place: "The Cilician coast"
    speaker: general
    speaker_name: "Your admiral"
    speaker_title: "Commander of the fleet"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      A new Great King sits in Hattusa, Suppiluliuma, and he has built ships of his own. Yours
      have been sailing against his coast. The Hittite record does not say why: perhaps to
      throw off the tribute your father paid, perhaps because the raiders who trouble the
      whole sea were among your crews.


      Now his fleet is out, and so is yours. Your admiral asks whether to meet it.
    choices:
      - label: "Meet the Hittite fleet at sea"
        historical: true
        materials_bp: -2000
        legitimacy_bp: -1000
        outcome: >-
          The Hittite king will say that your ships met his three times in battle, and that
          each time they were destroyed, and that he drew the survivors up on the beach and
          burned them. It is a Hittite claim. It is the only account of the first sea battle
          known to us in the Mediterranean, and you lose it.
      - label: "Keep the fleet in harbour"
        wealth_bp: -1000
        outcome: >-
          The Hittite ships raid the coast and leave. The raiders of the sea notice that
          Alashiya has no navy.
    history: >-
      Suppiluliuma II claims three sea victories over the ships of Alashiya and a fight on
      the shore, c. 1200 BC. His account is the only one.
    diverged: >-
      Hatti is gone.
    sources: ["Suppiluliuma II, Sudburg inscription (KBo 12.38)", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: ala_ships
    scenario: kadesh
    civ: alashiya
    year: -1188
    title: "Twenty Enemy Ships"
    place: "The palace of Alashiya"
    speaker: steward
    speaker_name: "Eshuwara"
    speaker_title: "Chief prefect of Alashiya"
    benchmark_provinces: 1
    story: >-
      Your watchers report twenty enemy ships at sea, near the Cilician coast and moving toward
      Ugarit. Ugarit is your best customer and your oldest friend on the mainland, and its king
      Ammurapi has written to ask what you know.


      His army is in Hatti and his own fleet is in the land of Lukka. Your chief prefect,
      Eshuwara, asks what the letter should say.
    choices:
      - label: "Warn Ugarit and tell it to wall its towns"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The letter goes: if enemy ships have been seen, be strong; bring in your troops and
          chariots and surround your cities with walls. Ammurapi answers in despair that his
          cities have already been burned and his troops are away. You cannot help him. A
          little later the sea comes to your own shore.
      - label: "Send ships and men to Ugarit"
        materials_bp: -2000
        wealth_bp: -1000
        outcome: >-
          Your ships reach the harbour and find smoke. They sail home with the news.
        deeds: {men: 1500}
    history: >-
      The letters from Ugarit include an answer from Eshuwara, chief prefect of Alashiya,
      about twenty enemy ships, and Ammurapi's reply that the enemy's ships had come and his
      cities were burned (RS 20.18, RS 20.238). Ugarit was destroyed c. 1185 BC.
    sources: ["RS 20.18", "RS 20.238", "Cline, 1177 BC (2014)"]

  - id: ala_rebuilt
    scenario: kadesh
    civ: alashiya
    year: -1170
    title: "The Island Rebuilt"
    place: "Enkomi"
    speaker: steward
    speaker_name: "Your master builder"
    speaker_title: "Of the walled towns"
    benchmark_provinces: 1
    story: >-
      Ramesses III's temple in Egypt lists Alashiya among the lands that fell before the
      invaders. The harbour towns have burned, some of them twice. Enkomi has been rebuilt
      with great blocks of dressed stone, and Kition has a new temple by its harbour. Foreign
      pots are appearing in the markets, in an Aegean style, and strangers in the streets.


      Whether those newcomers are refugees or conquerors your scribes cannot agree, and
      nothing says that they are the same people who burned the towns. The copper still has
      to be mined.
    choices:
      - label: "Rebuild in stone, and make room for the newcomers"
        historical: true
        materials_bp: -1500
        legitimacy_bp: 1000
        knowledge_bp: 500
        outcome: >-
          The new walls go up. The newcomers settle and work with your smelters, and in a few
          generations their pots and yours are hard to tell apart. A bronze figure of a man
          standing on an ingot is buried in a sanctuary at Enkomi. Copper will be Cyprus's
          fortune for another three thousand years, and the island's name will survive in the
          name of the metal.
      - label: "Drive the newcomers out"
        unrest_bp: 1500
        legitimacy_bp: -500
        outcome: >-
          Your garrison clears the quarters by the harbour. Some of the strangers go inland to
          the hills, and some take to their ships.
    history: >-
      Enkomi and Kition were rebuilt after destructions c. 1200 BC with ashlar masonry; new
      Aegean-style pottery and settlers appear in the early 12th century; Cypriot copper
      working continued, and the island kept its role in the metal trade. Whether the strangers
      arrived as refugees or in force is argued.
    sources: ["Knapp, The Archaeology of Cyprus (2013)", "Medinet Habu inscription of Ramesses III", "Cline, 1177 BC (2014)"]
