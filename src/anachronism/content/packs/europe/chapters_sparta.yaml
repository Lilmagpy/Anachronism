schema_version: 1
# Chronicle mode (D-120, D-XXX): Sparta, from the end of the Chremonidean War to its fall into
# the Achaean League, 264-188 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow Plutarch's Agis and Cleomenes (largely from the lost
# Phylarchus and the Cleomenean writer Sphaerus, so partisan), Polybius 2 and 4 and 13, Livy 32,
# 34, 35 and 38, Pausanias 3 and 8, with modern work by Cartledge and Spawforth (Hellenistic and
# Roman Sparta), Shimron, Walbank and Piper. Sparta had two kings at once; the ruler in each
# chapter is the king whose story it tells (Acrotatus II, Agis IV, Cleomenes III) and later
# the tyrants Lycurgus, Machanidas and Nabis. Dates approximate: Acrotatus' death c. 262, the
# reign of Lycurgus (219 to about 211). Polybius is hostile to Nabis, and what he tells of
# him is told here as his account. benchmark_provinces counts the provinces of this map the
# real Sparta held at that date: it is one (Laconia and Messenia). The towns Cleomenes held
# in Arcadia and the Argolid are not on the map; the Achaean League took Sparta in 192.
chapters:
  - id: spa_areus
    scenario: punic_wars
    civ: sparta
    year: -264
    title: "Areus Is Dead"
    place: "Sparta"
    speaker: steward
    speaker_name: "An elder of the Gerousia"
    speaker_title: "Council of Sparta"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Acrotatus, son of Areus, and king of the Agiad house. Last year your father fell
      fighting before Corinth, trying to force the lines of Antigonus Gonatas, and the
      Spartan army that marched north with such hope under the Athenians' banner is
      beaten. Athens, which began the war for freedom with Ptolemy's promises, is besieged by
      the Macedonians and starving. Ptolemy's fleet has not come.


      There are not even four thousand Spartiates left in your city. The elders ask whether
      Sparta should try to relieve Athens or make Laconia safe first.
    choices:
      - label: "Bring the army home and defend Laconia"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Sparta leaves the war. Athens holds out until 262 or 261 and then surrenders to
          Antigonus, who puts a garrison in the Piraeus. Without your father, and with the land
          going into fewer and fewer hands, Sparta is a small and quarrelsome power. You
          yourself will fall in a battle at Megalopolis in the next few years.
        deeds: {peace_with: [macedon]}
      - label: "Try to relieve Athens"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          The march north is a gamble with nobody to back it. The Macedonian garrisons in
          Corinth and Megara block the isthmus, and your men are far from home.
        deeds: {martial_bp: -300, grudges: {macedon: 2000}}
    history: >-
      King Areus I fell at Corinth in 265 BC, and Sparta left the Chremonidean War, which ended
      with the surrender of Athens (about 262-261). His son Acrotatus II was killed fighting the
      tyrant of Megalopolis soon after.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Agis 3", "Pausanias 3.6.4-6, 8.27.11", "Cartledge & Spawforth, Hellenistic and Roman Sparta (1989)"]

  - id: spa_agis
    scenario: punic_wars
    civ: sparta
    year: -242
    title: "Burning the Debts"
    place: "The Agora of Sparta"
    speaker: steward
    speaker_name: "Lysander"
    speaker_title: "An ephor, and your friend"
    benchmark_provinces: 1
    story: >-
      You are Agis, king of the Eurypontid house, twenty years old, and you want to bring back
      the Sparta of Lycurgus. Gold has come into the city; land has gathered into a few hands;
      there are hardly seven hundred Spartiates left, and most of those are in debt. Your mother
      and your grandmother, the richest women in Sparta, have sold their wealth to back you.


      Lysander the ephor proposes a law: cancel all debts, share the land into new lots for
      Spartiates and for the free men of the surrounding towns, and bring back the common
      meals. The other king, Leonidas, who has lived long at the court of the Seleucids,
      sees the rich lined up behind him.
    choices:
      - label: "Burn the debts, and promise the land"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        influence: {nobility: -1500}
        outcome: >-
          The debt records are carried to the agora and burnt. The rich say that the land is
          next. Leonidas is deposed in 242 and flees to a temple; his daughter's husband
          Cleombrotus takes his place. But the sharing of land is put off, the rich turn on you
          while you are away in 241 leading troops to help Aratus against the Aetolians, and
          Leonidas comes home. The ephor Amphares has you dragged out of the temple, tried
          and strangled in prison, and your mother and grandmother are strangled as well.
        deeds: {ruler_falls: "is strangled in prison by the ephors"}
      - label: "Move slowly, reform nothing until both kings agree"
        legitimacy_bp: -500
        outcome: >-
          Leonidas and the rich are quite happy to wait. Your supporters think you have lost
          your nerve.
    history: >-
      Agis IV (reigned about 244-241 BC) cancelled debts but did not divide the land; Leonidas II
      was restored in 241 and Agis was tried and strangled.
    sources: ["Plutarch, Agis 5-21", "Cartledge & Spawforth (1989)"]

  - id: spa_cleomenes
    scenario: punic_wars
    civ: sparta
    year: -226
    title: "The Ephors Are Killed"
    place: "Sparta"
    speaker: scholar
    speaker_name: "Sphaerus"
    speaker_title: "A Stoic philosopher at your court"
    benchmark_provinces: 1
    story: >-
      You are Cleomenes, son of Leonidas, king for nine years. You married Agis's widow Agiatis, and
      she told you about her husband's plans. The philosopher Sphaerus has taught you and the
      young men of Sparta what the old discipline was. You have been at war with the Achaean
      League since 229, and you are winning against Aratus.


      The ephors, whom the rich control, hold your armies back. You have your mercenaries in
      the city and a brother who is willing. Sphaerus says that nothing short of making
      the old laws live again will save Sparta.
    choices:
      - label: "Kill the ephors and re-found Lycurgus's Sparta"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        influence: {nobility: -2500}
        outcome: >-
          Your men cut down four of the five ephors, and you banish eighty of the city's
          leading men. The ephorate is abolished, debts are cancelled and the land is divided into
          four thousand lots. Perioikoi become citizens. Your brother Eucleidas is made your
          fellow king; the young men train in the old way, now with the long Macedonian
          spear. Later you will let helots buy their freedom for five minas each. The Achaeans
          call you a tyrant, but the poor of Sparta call you a king.
        deeds: {martial_bp: 1000}
      - label: "Win the ephors over"
        legitimacy_bp: -300
        outcome: >-
          The ephors give way a little, and then not at all. A reform that needs the
          consent of those who lose by it is a reform that does not happen.
    history: >-
      Cleomenes III (reigned about 235-222 BC) overthrew the ephorate in 227, cancelled debts,
      shared out land and rebuilt the army on Macedonian lines.
    sources: ["Plutarch, Cleomenes 7-11", "Polybius 2.47-49", "Cartledge & Spawforth (1989)"]

  - id: spa_sellasia
    scenario: punic_wars
    civ: sparta
    year: -222
    title: "Sellasia"
    place: "North of Sparta"
    speaker: general
    speaker_name: "Eucleidas"
    speaker_title: "Your brother, and fellow king"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Cleomenes. You have taken Megalopolis, Argos and much of Arcadia, but the
      Achaeans have sold Acrocorinth to Antigonus Doson, and Ptolemy, your paymaster, has
      begun to think that his money is better spent elsewhere. Now Antigonus is marching on
      Laconia with nearly thirty thousand men, and you have twenty thousand.


      You hold the hills at Sellasia, north of the city, two ridges and the river
      between. Your brother commands the one, you the other. Behind you, there are no
      walls, and no more army.
    choices:
      - label: "Hold the hills and fight at Sellasia"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1000
        outcome: >-
          Eucleidas is killed on the hill by the Macedonian phalanx, and your own line breaks.
          You escape with a few horsemen and sail from Gytheion to Egypt. Antigonus enters
          Sparta, the first conqueror it has ever known, and treats it gently, restoring
          the old constitution and the ephors before he goes home to fight the Illyrians. You
          die in Alexandria in 219, after an attempted rising against Ptolemy IV fails.
        deeds: {peace_with: [macedon], ruler_falls: "flees to Egypt after Sellasia"}
      - label: "Fall back on Sparta and make Antigonus come to you"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          The city has no walls. Antigonus camps in the Eurotas valley and the Peloponnesian cities
          that rose for you turn back to him one by one.
    history: >-
      Antigonus Doson defeated Cleomenes III at Sellasia in 222 BC; Cleomenes fled to Egypt, where
      he died in 219. Sparta was occupied by an enemy for the first time.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 2.65-70", "Plutarch, Cleomenes 27-37"]

  - id: spa_nabis
    scenario: punic_wars
    civ: sparta
    year: -206
    title: "After Mantinea"
    place: "Sparta"
    speaker: steward
    speaker_name: "A citizen of Sparta"
    speaker_title: "Of the guards"
    benchmark_provinces: 1
    story: >-
      You are Nabis, who claims descent from the old Spartan king Demaratus. Machanidas, who
      ruled Sparta for the child king Pelops, was killed last year at Mantinea by Philopoemen of
      the Achaeans, and the city is yours to take. The older families of Sparta remember Cleomenes
      and fear what you will do.


      Sparta needs money, soldiers and a leader. The sources on you are Polybius, who hated
      tyrants, and the Achaeans, who feared you. Polybius says that you ruled by terror.
    choices:
      - label: "Take power, free the slaves and seize the land of the rich"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 500
        influence: {nobility: -2500, guilds: 500}
        outcome: >-
          You free many helots and give them land; you exile or kill the old Spartan families,
          and give their wives to your men, which Polybius tells with horror. He also tells
          of a mechanical statue of your wife Apega that crushed rich men who would not give
          up their gold. This may be a hostile story. For ten years you rule Sparta, and rebuild
          its army and navy.
        deeds: {martial_bp: 1000}
      - label: "Rule with the old families and the ephors"
        legitimacy_bp: 500
        outcome: >-
          The old families accept you, and nothing changes. The poor keep waiting for a
          leader who never comes.
    history: >-
      Nabis (reigned 207-192 BC) seized power after the death of Machanidas, freed slaves and
      redistributed property, and built a strong army and fleet.
    sources: ["Polybius 13.6-8", "Livy 34.31-32", "Cartledge & Spawforth (1989)"]

  - id: spa_argos
    scenario: punic_wars
    civ: sparta
    year: -198
    title: "The Gift of Argos"
    place: "Argos"
    speaker: macedon
    speaker_name: "Philip V"
    speaker_title: "King of Macedon"
    needs_alive: [macedon, rome]
    benchmark_provinces: 1
    story: >-
      You are Nabis. Rome has a legion army in Greece and is beating Philip V, who holds
      Argos, the city of your enemy the Achaean League. Philip offers you Argos as a gift
      if you join him against Rome. The Achaeans, who want it back, are about to take Rome's
      side.


      Rome's commander Flamininus invites you to meet him on the coast. If you hold Argos and
      talk to both sides, you can name your price twice.
    choices:
      - label: "Take Argos, then sell your friendship to Rome"
        historical: true
        wealth_bp: 1000
        legitimacy_bp: 1000
        outcome: >-
          You take Argos, and your wife Apega goes there to squeeze its rich families for their gold.
          Then you meet Flamininus, agree a four-month truce and send troops to help Rome
          against Philip. Philip is beaten at Cynoscephalae in 197. Rome
          does not ask you to give Argos back, but Flamininus tells Greece that Argos is a
          Greek city and must be free.
        deeds: {grudges: {achaea: 2500}}
      - label: "Stay with Philip"
        legitimacy_bp: -500
        outcome: >-
          Philip is beaten without you, and you are the last of his friends. Rome has no
          reason to be kind.
        deeds: {grudges: {rome: 2500}}
    history: >-
      In 198-197 BC Nabis took Argos from Philip V, then changed sides to Rome; after the
      war Flamininus's declaration of Greek freedom left Argos unresolved.
    diverged: >-
      Macedon or Rome is gone.
    sources: ["Livy 32.38-40", "Polybius 18.17"]

  - id: spa_flamininus
    scenario: punic_wars
    civ: sparta
    year: -195
    title: "Flamininus at the Gates"
    place: "Sparta"
    speaker: rome
    speaker_name: "Titus Quinctius Flamininus"
    speaker_title: "Proconsul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Nabis. Rome has declared a war on you at a council of Greek states, in the name
      of the freedom of Argos. Flamininus has an army of fifty thousand, Roman, Achaean,
      Macedonian and Pergamene, with the fleets of Eumenes and the Rhodians off your coast.
      The coastal towns have gone. The Romans are camped outside Sparta, which you have
      walled only in part and made up the rest with ditches and barricades.


      Flamininus offers terms. He hopes that your ruin will bring peace; many of the allies
      want your head.
    choices:
      - label: "Give up Argos and the coast, and accept Rome's terms"
        historical: true
        legitimacy_bp: -1500
        wealth_bp: -1500
        outcome: >-
          You return Argos, give up your coastal towns, your warships (all but two small
          boats) and hostages, including your son, and promise to pay silver over eight years.
          You keep Sparta itself and Laconia. Flamininus takes his army home in 194. For you it
          is a reprieve, no more, and you start again to rebuild.
        deeds: {martial_bp: -1000, peace_with: [rome, achaea]}
      - label: "Fight on behind the barricades"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The siege is long and costly. Flamininus can afford it and you cannot.
        deeds: {grudges: {rome: 2000, achaea: 2000}}
    history: >-
      In 195 BC Flamininus and his allies besieged Nabis, who lost Argos, the coastal towns and
      his fleet by treaty, and kept only Sparta itself.
    diverged: >-
      Rome is gone.
    sources: ["Livy 34.22-41", "Plutarch, Flamininus 13"]

  - id: spa_aetolians
    scenario: punic_wars
    civ: sparta
    year: -192
    title: "Help from the Aetolians"
    place: "Sparta"
    speaker: aetolia
    speaker_name: "Alexamenus"
    speaker_title: "Commander of the Aetolian troops"
    needs_alive: [aetolia]
    benchmark_provinces: 1
    story: >-
      You are Nabis. Rome is busy with Antiochus, and you have tried to win back your coastal
      towns. The Achaean general Philopoemen has beaten your army in the field and driven
      you back into Sparta. The Aetolians, who hate Rome and want Antiochus on Greek soil, send you a thousand
      men and a commander, Alexamenus, to "help".


      Each day the Aetolian commander drills his men in the city and asks you to ride out to
      review them. Some of your friends say they do not like it.
    choices:
      - label: "Ride out to review the Aetolians"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          At the review the Aetolians kill you. They begin to loot the city, but the Spartans
          rise and kill most of them. In the confusion Philopoemen arrives with the Achaean
          army and persuades the Spartans to join the League. Sparta is now one city among the
          cities of the Achaean League.
        deeds: {ruler_falls: "is murdered by an Aetolian guest at Sparta"}
      - label: "Keep the Aetolians outside the walls"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Your friends are pleased. The Aetolians go away and Sparta stands alone against the
          Achaeans and Rome.
    history: >-
      In 192 BC Nabis was murdered by Aetolians whom he had invited as allies; Philopoemen then
      brought Sparta into the Achaean League.
    diverged: >-
      The Aetolian League is gone.
    sources: ["Livy 35.35-37", "Plutarch, Philopoemen 15"]

  - id: spa_walls
    scenario: punic_wars
    civ: sparta
    year: -188
    title: "The Walls Come Down"
    place: "Sparta"
    speaker: achaea
    speaker_name: "Philopoemen"
    speaker_title: "General of the Achaean League"
    needs_alive: [achaea]
    benchmark_provinces: 1
    story: >-
      You are the magistrates of Sparta, in a city that the Achaean League holds against its will.
      Your exiles, who left under Nabis, want to come home, and your people have refused to take
      them. Philopoemen has come with an army and demands the men who started the quarrel.
      Rome, which broke Antiochus at Magnesia two years ago, will not stop him.


      You have been told what the League wants: that Sparta give up the laws of Lycurgus, the
      old training of the boys, and the walls that Nabis built.
    choices:
      - label: "Accept the Achaean terms"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1000
        outcome: >-
          The walls come down and the exiles come home. The Spartans lose their laws and the
          famous training, and the people whom Nabis freed are sold. Sparta lives on, a
          city among cities, but it is no longer Sparta. Under Rome, much later, the old
          training will be revived as a show for visitors.
        deeds: {peace_with: [achaea]}
      - label: "Refuse, and send to Rome for help"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The Senate listens, as it usually does, to both sides and decides nothing for years,
          while the Achaean army camps in your fields.
        deeds: {grudges: {achaea: 2500}}
    history: >-
      In 188 BC Philopoemen forced Sparta to give up its laws and tear down its walls, and brought
      the exiles back. Rome reduced the Achaeans' power over Sparta only later.
    diverged: >-
      The Achaean League is gone.
    sources: ["Livy 38.30-34", "Plutarch, Philopoemen 16", "Pausanias 8.51"]
