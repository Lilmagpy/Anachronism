schema_version: 1
# Chronicle mode (D-120): the Bagratid kingdom of Ani, from Gagik I's cathedral to the last
# king's surrender of Ani, 1000-1044, with the Seljuk sack of Ani (1064) and Manzikert (1071)
# told as an epilogue in the last chapter, since the kingdom is gone by then. Facts follow
# Aristakes of Lastivert, Stephen of Taron (Asoghik), Matthew of Edessa and Skylitzes, with
# modern work by Garsoian, Hewsen, Redgate and Runciman's summaries. Dates are approximate
# where noted: Gagik I's death (1017 or 1020 in different sources), Ashot IV's death (about
# 1040) and the exact date of the surrender of Ani (1045). benchmark_provinces is 1: the map
# holds the kingdom as the single province of Ani.
chapters:
  - id: arm_cathedral
    scenario: year_1000
    civ: armenia
    year: 1000
    title: "The Cathedral of Ani"
    place: "Ani"
    speaker: scholar
    speaker_name: "Trdat"
    speaker_title: "Master builder"
    benchmark_provinces: 1
    story: >-
      You are Gagik, king of the Armenians, the Bagratid lord of Ani. Your brother Smbat began
      a great cathedral here, and you have had the walls of the city built round a rising town
      of merchants and caravans from Georgia, Byzantium and the Muslim east. The architect
      who raised the dome of Hagia Sophia in Constantinople when an earthquake broke it, Trdat,
      is your master builder.


      The cathedral is nearly done. But the emperor Basil II has his armies in the east,
      the emirs of Dvin and Ganja watch your borders, and your treasury cannot pay both
      for stone and for soldiers.
    choices:
      - label: "Complete the great church"
        historical: true
        legitimacy_bp: 2000
        knowledge_bp: 800
        wealth_bp: -1000
        influence: {clergy: 1500}
        outcome: >-
          The cathedral is completed in about 1001, a domed church of dark and rose stone
          with tall blind arcades. People of the east call Ani the city of a thousand and one
          churches, though that is later boasting. Your kingdom has the finest building
          in Armenia, and a treasury nearly empty.
      - label: "Double the border garrisons"
        legitimacy_bp: -500
        unrest_bp: -300
        outcome: >-
          The garrisons are doubled and the half-built walls of the great church stand under
          scaffolding for years. Your bishops are not pleased.
        deeds: {martial_bp: 500}
      - label: "Buy peace with gifts to your neighbours"
        wealth_bp: -1000
        legitimacy_bp: 1800
        unrest_bp: -500
        outcome: >-
          Silver and fine cloth go to Constantinople and to the emirs of Dvin and Ganja. The
          borders stay quiet, and your court is praised for buying peace for its people. The
          scaffolding stays up, and the treasury is thinner than before.
    history: >-
      Smbat II began the cathedral of Ani, designed by Trdat, and it was finished under Gagik I
      about 1001.
    sources: ["Stephen of Taron, Universal History", "Kouymjian, 'Ani and the Armenian Bagratids'", "Redgate, The Armenians (1998)"]

  - id: arm_heirs
    scenario: year_1000
    civ: armenia
    year: 1020
    title: "Two Brothers, One Crown"
    place: "Ani"
    speaker: ruler
    speaker_name: "The Catholicos Peter"
    speaker_title: "Head of the Armenian Church"
    benchmark_provinces: 1
    story: >-
      You are Hovhannes-Smbat, eldest son of the dead king Gagik. Your father is buried, and he
      left two sons: you, quiet and peaceable, and your younger brother Ashot, a soldier,
      who does not like to wait his turn. Ashot has been giving orders to the army and
      the nobles since your father's last years.


      You hold the capital and the crown. Ashot is saying that he is the stronger king,
      and some of the nobles agree. The Georgians have an army to spare, and the emperor's
      agents are watching how you rule.
    choices:
      - label: "Keep Ani, leave Ashot the army"
        historical: true
        unrest_bp: 800
        legitimacy_bp: -500
        outcome: >-
          The brothers divide the realm in all but name. You keep the crown, and the title, and the
          churches, and Ashot has the soldiers and the eastern lands. A civil war begins, and
          your enemies take note.
      - label: "Crown Ashot as your co-king"
        legitimacy_bp: 500
        influence: {nobility: 500}
        outcome: >-
          Ashot accepts for a season, and then does as he likes. The nobles learn that the king's
          word is a bargain, and bargains can be broken.
      - label: "Name Ashot your heir, keep the crown"
        legitimacy_bp: 400
        unrest_bp: -400
        influence: {nobility: 300}
        outcome: >-
          Ashot is named heir, and the catholicos blesses the arrangement. Ashot bides his time
          for a season, and some of the nobles wonder how long you will be allowed to reign.
    history: >-
      Gagik I died in 1020 (some sources say 1017). His sons Hovhannes-Smbat and Ashot IV
      divided the kingdom between them, and war between them followed.
    sources: ["Aristakes of Lastivert", "Stephen of Taron", "Redgate, The Armenians (1998)"]

  - id: arm_will
    scenario: year_1000
    civ: armenia
    year: 1022
    title: "A Will for the Emperor"
    place: "Trebizond"
    speaker: byzantium
    speaker_name: "Basil II"
    speaker_title: "Emperor of the Romans"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Hovhannes-Smbat. Basil II, the emperor, has come east to punish the Georgians
      for the lands of Tao, and he has beaten them in battle. Armenian princes have come to
      his camp to make peace, and you have too, with the kingdom of Ani in the balance.


      Ashot has the army and the Georgians' friendship. You have neither. The emperor's offer
      is a simple one: he will protect you in your old age, and all he asks in return is
      your kingdom, after your death.
    choices:
      - label: "Name Basil heir to Ani"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1000
        influence: {nobility: -1000}
        outcome: >-
          You write a will leaving Ani and its lands to Basil II, and the emperor receives you
          with honours and a Byzantine title. Your brother and your nobles are furious, and
          the Georgians call it a betrayal. Basil is satisfied, and he never needs to
          fight for Ani, only to wait. The kingdom now has an end date, whatever its king does.
        deeds: {grudges: {georgia: 1000}}
      - label: "Decline his offer, stay free"
        legitimacy_bp: 1000
        unrest_bp: 300
        outcome: >-
          Basil goes home with the Georgians' lands in his hands, and you with your kingdom
          and your quarrel with your brother. The emperor will find another way to remind
          you that he has the larger army.
        deeds: {grudges: {byzantium: 1500}}
      - label: "Pay Basil tribute and do homage"
        wealth_bp: -1500
        legitimacy_bp: -300
        influence: {nobility: 300}
        outcome: >-
          You kneel, swear homage and promise a yearly gift. Basil accepts and goes home, and the
          kingdom remains yours and your heirs'. Your treasury and your pride are poorer for it.
        deeds: {peace_with: [byzantium]}
    history: >-
      In 1022 Hovhannes-Smbat met Basil II and agreed to leave Ani to Byzantium on his death;
      the Armenian lords and Ashot IV refused to accept it.
    diverged: >-
      Byzantium is gone.
    sources: ["Aristakes of Lastivert", "Skylitzes, Synopsis", "Redgate, The Armenians (1998)"]

  - id: arm_succession
    scenario: year_1000
    civ: armenia
    year: 1040
    title: "The Will Is Called In"
    place: "Ani"
    speaker: general
    speaker_name: "Vahram Pahlavuni"
    speaker_title: "Commander of the army"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Hovhannes-Smbat, and you are an old man. Your brother Ashot is dead or dying, and
      you have no heir of age. Nearly twenty years have passed since the will, and the
      emperor in Constantinople has not forgotten it. Byzantine envoys are in your palace
      reminding you of a promise you made.


      Your nobles are divided. Some say a Byzantine Ani is better than a Turkish one, since
      the new Seljuk Turks are already in Persia. Others, led by the general Vahram
      Pahlavuni, say the will was never the nation's to give.
    choices:
      - label: "Leave the will unconfirmed"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          You die in 1041 without confirming or cancelling the will. Your young nephew Gagik
          is named king by the Pahlavuni party, and the emperor's envoys say the throne is theirs.
          The kingdom is left as a quarrel.
      - label: "Seal a formal pledge to the emperor"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The pledge is signed and sealed, and the nobles of Ani, who never agreed, begin to
          choose between Constantinople and rebellion.
      - label: "Annul the will before your lords"
        legitimacy_bp: 1000
        unrest_bp: 300
        influence: {nobility: 800}
        outcome: >-
          Before the assembled lords you declare that the kingdom was never yours to give. The
          nobles cheer, and the emperor's envoys leave in silence. Constantinople does not forget.
        deeds: {grudges: {byzantium: 2000}}
    history: >-
      Ashot IV died about 1040 and Hovhannes-Smbat in 1041. The will of 1022 left the Byzantines
      with a claim on Ani, which his successor refused to honour.
    diverged: >-
      Byzantium is gone.
    sources: ["Aristakes of Lastivert", "Matthew of Edessa", "Redgate, The Armenians (1998)"]

  - id: arm_gagik
    scenario: year_1000
    civ: armenia
    year: 1042
    title: "The Boy King of Ani"
    place: "Ani"
    speaker: general
    speaker_name: "Vahram Pahlavuni"
    speaker_title: "Commander of the army"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Gagik, a young man of seventeen or so, the second of your name. Your uncle
      Hovhannes-Smbat has died, and Ani is yours if you can hold it. The emperor in
      Constantinople claims the city by the will your uncle made. The magnate Sargis, who
      sided with him, has fled to the Byzantines, and a Byzantine army is on the march.


      Vahram Pahlavuni, your commander, has the soldiers and the nobles behind him. He
      says Ani can be held, and that the Greeks can be beaten from behind the walls.
    choices:
      - label: "Trust Pahlavuni to hold the walls"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -500
        influence: {nobility: 1000}
        outcome: >-
          Pahlavuni beats the Byzantine army, and you are crowned at Ani. Constantinople has
          other wars, and for three years you rule a free kingdom. But the emperor still has
          the will, and he does not need to win battles.
        deeds: {martial_bp: 500}
      - label: "Treat with the emperor for terms"
        legitimacy_bp: -1500
        unrest_bp: 1500
        wealth_bp: 1500
        outcome: >-
          The emperor's men are polite, and take you as an honoured guest. Your own lords
          and the common people of Ani do not forgive it.
      - label: "Call on the Georgian king for troops"
        unrest_bp: -500
        legitimacy_bp: 2700
        wealth_bp: -500
        outcome: >-
          Georgian horsemen ride to Ani and the combined army beats the Byzantines in the field,
          but the price is high and the king of Georgia expects to be heard in your counsels.
          Pahlavuni is not pleased to share the command.
        deeds: {men: 6000}
    history: >-
      Gagik II was crowned in 1042; Vahram Pahlavuni defeated a Byzantine army sent to claim
      Ani, and Gagik reigned as an independent king until 1045.
    diverged: >-
      Byzantium is gone.
    sources: ["Aristakes of Lastivert", "Matthew of Edessa", "Redgate, The Armenians (1998)"]

  - id: arm_last
    scenario: year_1000
    civ: armenia
    year: 1044
    title: "The Last King"
    place: "Constantinople"
    speaker: byzantium
    speaker_name: "Constantine IX Monomachos"
    speaker_title: "Emperor of the Romans"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Gagik II. Your lords quarrel, and the great Pahlavuni family is divided. The
      emperor Constantine IX has invited you to Constantinople, with promises of honours, and
      some of your own nobles and bishops say you should go. Ani has nobody who can lead its
      army while you are away.


      The emperor wants one thing, and it is Ani. In return he offers you rich estates in
      Cappadocia and the title of a Byzantine lord. You can refuse, hear his terms, or
      look for another bargain.
    choices:
      - label: "Cede Ani for Cappadocian estates"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          In 1045 you give up the city and the crown, and Ani becomes a Byzantine province.
          You live in Cappadocia as an imperial noble, and are said to have been killed by
          Armenian lords around 1079. Twenty years after you leave, the Seljuk sultan Alp Arslan
          storms and sacks the undefended city (1064), and in 1071 he beats the emperor at
          Manzikert, ending the Greek rule in the east. The Bagratid kingdom is gone.
        deeds: {ruler_falls: "gives up Ani and is sent to Cappadocia"}
      - label: "Refuse and return to Ani"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          You return to a city whose lords no longer follow you, while the emperor's army
          waits at the border. The city is lost anyway.
      - label: "Offer tribute and keep your crown"
        legitimacy_bp: 500
        wealth_bp: -2000
        unrest_bp: 500
        outcome: >-
          The emperor hears your envoys politely and sets your yearly price high. Ani remains
          yours on paper, and the emperor's patience is not unlimited.
        deeds: {peace_with: [byzantium]}
    history: >-
      In 1045 Gagik II surrendered Ani to Constantine IX and took estates in Cappadocia. Ani
      was sacked by Alp Arslan's Seljuks in 1064, and Manzikert (1071) opened Armenia and
      Anatolia to them.
    diverged: >-
      Byzantium is gone.
    sources: ["Aristakes of Lastivert", "Matthew of Edessa", "Redgate, The Armenians (1998)"]
