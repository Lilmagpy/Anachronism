schema_version: 1
# Chronicle mode (D-120, D-138): Carthage from Messana to its destruction, 264-146 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Polybius (who knew Scipio Aemilianus and walked Hannibal's route), Livy,
# Appian, Diodorus and Cornelius Nepos's life of Hannibal - all written by Greeks and
# Romans; no Carthaginian history survives. Modern work: Lancel, Goldsworthy, Hoyos, Miles.
# Carthage was a republic run by its council of elders and two annual suffetes, so the
# chapters speak to its leaders as a council. benchmark_provinces counts the provinces of
# this map the real Carthage held at that date.
chapters:
  - id: car_messana
    scenario: punic_wars
    civ: carthage
    year: -264
    title: "The Garrison at Messana"
    place: "The Council of Elders, Carthage"
    speaker: general
    speaker_name: "Hanno"
    speaker_title: "Commander of the Messana garrison"
    benchmark_provinces: 6
    story: >-
      Messana, on the strait between Sicily and Italy, belongs to the Mamertines - Italian
      mercenaries who murdered its men twenty years ago and took their wives and houses.
      Besieged by King Hiero of Syracuse, they asked you for help, and you sent Hanno with a
      garrison. Then, being Mamertines, they also asked Rome.


      Now a Roman consul is on the Italian shore with two legions, and the Mamertines have
      thrown Hanno out. He has come home to explain himself. Rome has never fought outside
      Italy. Your fleet rules the sea.
    choices:
      - label: "Crucify Hanno, and make war on Rome"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Hanno dies on a cross for his cowardice. Carthage and Syracuse besiege Messana
          together - and the Romans cross the strait by night anyway and beat both armies.
          Hiero changes sides. A war over one town will last twenty-three years. You hire
          Iberians, Celts, Ligurians and Numidians by the tens of thousands.
        deeds: {war_with: [rome], men: 30000, grudges: {rome: 2000}}
      - label: "Let Rome have Messana, and keep the rest of Sicily"
        legitimacy_bp: -300
        wealth_bp: 500
        outcome: >-
          Rome takes the town and signs a treaty, and the trade of Sicily goes on as before.
          Your merchants watch the legions on the other side of the strait and wonder how
          long it will hold.
        deeds: {grudges: {rome: 1000}}
      - label: "Buy Messana back from the Mamertines"
        wealth_bp: -2000
        outcome: >-
          The Mamertines take your silver and let your garrison back in. The Roman consul
          finds the gates shut and goes home. The Romans do not like being made fools of.
        deeds: {take: [messana], grudges: {rome: 2500}}
    history: >-
      In 264 BC the Mamertines expelled the Carthaginian garrison and admitted Rome; the
      Carthaginians crucified their commander Hanno. The First Punic War followed.
    sources: ["Polybius 1.10-12", "Hoyos, Unplanned Wars (1998)"]

  - id: car_xanthippus
    scenario: punic_wars
    civ: carthage
    year: -256
    until_year: -252
    title: "The Spartan Drillmaster"
    place: "Carthage"
    speaker: general
    speaker_name: "Xanthippus"
    speaker_title: "A Spartan mercenary"
    needs_war_with: [rome]
    benchmark_provinces: 6
    story: >-
      The Romans have built fleets - copied, they say, from one of your own ships that ran
      aground - fitted them with a boarding bridge with an iron spike, and beaten your navy
      at Mylae and Ecnomus. Now the consul Regulus has landed in Africa, taken three hundred
      towns and camped outside your walls. His peace terms are so harsh your envoys walked
      out.


      A Spartan mercenary captain, Xanthippus, has been telling anyone who will listen that
      your generals lost because they fought in the hills, where elephants and cavalry are
      useless. Give him the army, he says, and fight on the plain.
    choices:
      - label: "Put Xanthippus in command on the plain"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Xanthippus drills the citizen army in front of the walls for days, and the people
          cheer. On the plain by the Bagradas he sends a hundred elephants into the legions
          and four thousand horsemen round their flanks. Of fifteen thousand Romans, two
          thousand escape. Regulus is taken prisoner. Xanthippus sails home before anyone
          can grow jealous of him.
        deeds: {men: 20000, grudges: {rome: 2000}}
      - label: "Accept Regulus's terms"
        legitimacy_bp: -3000
        wealth_bp: -3000
        outcome: >-
          You give up Sicily and Sardinia, pay Rome's war costs and promise to have no navy.
          Rome has won.
        deeds: {peace_with: [rome], give: [car_lilybaeum, car_sardinia], give_to: rome}
      - label: "Recall the army from Sicily to defend Africa"
        legitimacy_bp: 1800
        wealth_bp: -300
        outcome: >-
          Hasdrubal's veterans and their elephants come home across the sea to cheers from the
          walls, and you hold the city under your own generals. Regulus's army stays in the field outside, and the
          war drags on with Sicily left to its garrisons.
        deeds: {men: 15000}
    history: >-
      In 255 BC the Spartan Xanthippus reorganised Carthage's army and destroyed Regulus's
      army at the Bagradas; Regulus was captured.
    diverged: >-
      There is no Roman army in Africa.
    sources: ["Polybius 1.32-36"]

  - id: car_drepana
    scenario: punic_wars
    civ: carthage
    year: -249
    until_year: -245
    title: "The Sacred Chickens"
    place: "The harbour of Drepana, Sicily"
    speaker: general
    speaker_name: "Adherbal"
    speaker_title: "Admiral at Drepana"
    needs_war_with: [rome]
    benchmark_provinces: 6
    story: >-
      The consul Publius Claudius Pulcher is sailing to attack your fleet in the harbour of
      Drepana at dawn. Your lookouts on the hills saw him coming. You hear later that before
      he sailed, his sacred chickens refused to eat - the worst of omens - and he threw them
      into the sea: 'Then let them drink.'


      His ships are straggling in a long line round the headland into the harbour mouth.
      Your ships are in the harbour.
    choices:
      - label: "Sail out by the far side of the harbour mouth"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your ships row out by the far side of the harbour mouth and take the Romans from the
          sea side, with the rocks behind them. Ninety-three Roman ships are taken. It is the
          worst naval defeat Rome ever suffers. Claudius is put on trial at home - for the
          chickens.
        deeds: {ships: 60}
      - label: "Stay in harbour and wait for the storm season"
        legitimacy_bp: 300
        outcome: >-
          The Romans blockade the harbour. Two months later a storm wrecks their whole fleet
          off the south coast, without any help from you.
      - label: "Land the crews and hold the harbour from the shore"
        wealth_bp: -500
        legitimacy_bp: 2700
        outcome: >-
          Your oarsmen man the quays with slings and javelins while the Romans nose into the
          harbour mouth. They cannot land under your fire, and they cannot bring the ships in
          one by one. After a day of it they draw off, and neither side has won anything.
        deeds: {men: 6000}
    history: >-
      At Drepana in 249 BC Adherbal destroyed the fleet of Claudius Pulcher, the only great
      Carthaginian naval victory of the war. The chicken story is in Cicero and Suetonius.
    diverged: >-
      The war with Rome is over.
    sources: ["Polybius 1.49-51", "Cicero, De Natura Deorum 2.7"]

  - id: car_barca
    scenario: punic_wars
    civ: carthage
    year: -247
    until_year: -243
    title: "The Thunderbolt"
    place: "Mount Heirkte, above Panormus"
    speaker: general
    speaker_name: "Hamilcar Barca"
    speaker_title: "'Barca', the lightning"
    needs_war_with: [rome]
    benchmark_provinces: 6
    story: >-
      A young officer, Hamilcar, whose men call him Barca - 'lightning' - wants the
      command in Sicily. He does not want to fight pitched battles. He has found a
      mountain outside Roman Panormus with a harbour below it and pasture on top, and he
      wants to sit on it and raid the coasts of Italy and the Roman lines for as long as it
      takes Rome to tire.


      His wife has just given birth to their first son. They have named him Hannibal.
    choices:
      - label: "Give Hamilcar the Sicilian command"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          For seven years Hamilcar holds his mountain, and then Mount Eryx, raiding Italy as far
          as Cumae and never losing a fight. The Romans cannot dig him out. But Carthage's
          council, which prefers farming in Africa to war in Sicily, sends him less and less.
        deeds: {martial_bp: 1500}
      - label: "Keep the money for the fleet"
        wealth_bp: 1000
        outcome: >-
          Hamilcar sulks in Carthage. The Sicilian war goes on, slowly, without him.
        deeds: {ships: 40}
      - label: "Send Hanno to push the frontier in Africa"
        food_bp: 800
        legitimacy_bp: 1000
        outcome: >-
          The council, which would rather conquer farmland than fight Romans, sends Hanno and
          an army against the Libyan towns. The harvests improve and the landowners are
          delighted. In Sicily your garrisons
          hold what they have and are given nothing to do more.
        deeds: {men: 10000}
    history: >-
      Hamilcar Barca held Heirkte (247-244 BC) and then Eryx until the end of the war,
      undefeated in Sicily.
    diverged: >-
      The war with Rome is over.
    sources: ["Polybius 1.56-58", "Nepos, Hamilcar"]

  - id: car_aegates
    scenario: punic_wars
    civ: carthage
    year: -241
    until_year: -236
    title: "The Aegates Islands"
    place: "Off western Sicily"
    speaker: general
    speaker_name: "Hanno"
    speaker_title: "Commander of the supply fleet"
    needs_war_with: [rome]
    benchmark_provinces: 6
    story: >-
      The Roman treasury is empty, so Rome's richest men have paid for a new fleet out of
      their own pockets: two hundred quinqueremes, built light and fast. Your own fleet has
      been laid up for years to save money. You have had to scrape one together, untrained,
      and loaded it with grain and supplies for Hamilcar's men on Eryx.


      The Romans are waiting off the Aegates islands. The wind is behind you, and against
      them. Hanno wants to unload at Eryx first and take on Hamilcar's veterans as marines.
    choices:
      - label: "Sail on for Eryx with the wind behind you"
        historical: true
        legitimacy_bp: -3000
        wealth_bp: -3000
        outcome: >-
          The Romans row out into the wind and fall on your laden ships. Fifty are sunk and
          seventy captured. Carthage has no more money and no more ships. Hamilcar is told to
          make peace: Sicily is lost, and three thousand two hundred talents must be paid over
          ten years. He signs, and marches his army down from Eryx with its weapons, unbeaten.
        deeds: {peace_with: [rome], give: [car_lilybaeum], give_to: rome}
      - label: "Turn back, and come with a trained fleet next year"
        legitimacy_bp: -1000
        wealth_bp: -2000
        outcome: >-
          The supply fleet turns back, and the council pays for oarsmen to be drilled through
          the winter. On Eryx, Hamilcar's men tighten their belts. The Romans keep the sea
          meanwhile, and the war goes on.
        deeds: {ships: 40}
      - label: "Slip the grain in by night in small boats"
        legitimacy_bp: -1000
        wealth_bp: -1500
        outcome: >-
          Fishing boats and light craft run the Roman cordon in the dark, a few at a time. Some
          are caught, but enough get through to feed Hamilcar's men for a while. The silver
          drains away and the Romans keep the sea.
        deeds: {ships: 15}
    history: >-
      On 10 March 241 BC the Roman fleet of Lutatius Catulus destroyed Hanno's fleet off the
      Aegates islands, ending the First Punic War. Warship rams from the battle have been
      found on the seabed since 2004.
    diverged: >-
      The war with Rome has ended another way.
    sources: ["Polybius 1.59-63", "Tusa & Royal, Egadi Islands survey (2012)"]

  - id: car_truceless
    scenario: punic_wars
    civ: carthage
    year: -240
    title: "The Truceless War"
    place: "Sicca, in Africa"
    speaker: general
    speaker_name: "Hanno the Great"
    speaker_title: "Commander in Africa"
    benchmark_provinces: 5
    story: >-
      Twenty thousand mercenaries have come home from Sicily: Libyans, Iberians, Celts,
      Greeks, Balearic slingers. They are owed years of pay. Hanno the Great has gone to tell
      them that Carthage is poor and they must accept less.


      They are camped at Sicca, a few days from the city, and their leaders - Spendius, a
      runaway Campanian slave, and Matho, a Libyan - are telling them that Carthage means to
      cheat them.
    choices:
      - label: "Tell them Carthage must pay them less"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 3000
        outcome: >-
          The mercenaries march on Carthage, and the Libyan towns rise with them. For three
          years the war is fought with a cruelty that horrifies even Polybius: prisoners'
          hands cut off, envoys buried alive. Hamilcar ends it by trapping the rebels in a
          gorge called the Saw, where they eat each other before surrendering.
        deeds: {martial_bp: -1000}
      - label: "Pay every man in full now"
        wealth_bp: -4000
        legitimacy_bp: 500
        outcome: >-
          The silver is raised by melting the temple plate and taxing the landowners. The
          mercenaries go home, and Carthage is poor, and at peace.
      - label: "✦ Pay them with bills of credit on the city's bank"
        needs_adopted: [banking]
        wealth_bp: -1500
        legitimacy_bp: 800
        outcome: >-
          Each man gets a sealed note promising his full pay, with interest, over five years,
          payable at any Carthaginian trading post from Gades to Tyre. The mercenaries
          disperse grumbling - and keep coming back to spend the money in Carthage.
      - label: "Take the best of them into a standing army"
        wealth_bp: -2500
        unrest_bp: 1000
        outcome: >-
          The Libyans and Iberians who will serve are paid up and enrolled; the rest are shipped
          home with half their arrears and a good deal of anger. You now have a hard core of
          professionals, and a council that does not like paying them.
        deeds: {men: 10000}
    history: >-
      The Mercenary War (241-237 BC) nearly destroyed Carthage. Hamilcar won it at the Saw.
      Gustave Flaubert's novel Salammbo is set in it.
    sources: ["Polybius 1.65-88"]

  - id: car_sardinia
    scenario: punic_wars
    civ: carthage
    year: -238
    title: "Sardinia Stolen"
    place: "Carthage"
    speaker: rome
    speaker_name: "Roman envoys"
    speaker_title: "From the Senate"
    needs_peace_with: [rome]
    needs_owner: {car_sardinia: carthage}
    benchmark_provinces: 5
    story: >-
      The mercenaries in Sardinia rebelled too, and asked Rome for help. Rome refused - then.
      Now that you have put down the revolt in Africa and are sending ships to recover
      Sardinia, the Senate has decided that those ships are preparing to attack Italy. Rome
      will have Sardinia, and twelve hundred talents more, or war.


      You have no fleet and no money. Everyone in the room knows this is robbery.
    choices:
      - label: "Yield the island and pay the talents"
        historical: true
        legitimacy_bp: -1500
        wealth_bp: -1500
        outcome: >-
          You pay and give up the island. Polybius, a Greek who admired Rome, will write that
          it was the true cause of the next war: the anger of Hamilcar and every Carthaginian
          who watched it.
        deeds: {give: [car_sardinia], give_to: rome, grudges: {rome: 4000}}
      - label: "Refuse, and take your chances at sea"
        legitimacy_bp: 1000
        unrest_bp: 1500
        outcome: >-
          The Roman legions land in Sardinia. You have no fleet to stop them.
        deeds: {war_with: [rome]}
      - label: "Offer the silver but keep the island"
        wealth_bp: -2500
        legitimacy_bp: -800
        outcome: >-
          Rome takes the money, says that the island is hers anyway, and lands a legion on it. Your
          garrison, which you raised and paid for, can only watch.
        deeds: {men: 6000, grudges: {rome: 2000}}
    history: >-
      In 238/237 BC Rome seized Sardinia and demanded an extra 1,200 talents, which Carthage,
      exhausted, accepted. Polybius saw this as a chief cause of the Second Punic War.
    diverged: >-
      Sardinia is not yours, or you are at war already.
    sources: ["Polybius 1.88, 3.10"]

  - id: car_oath
    scenario: punic_wars
    civ: carthage
    year: -237
    title: "The Oath at the Altar"
    place: "The temple of Baal Hammon, Carthage"
    speaker: general
    speaker_name: "Hamilcar Barca"
    speaker_title: "Commander of the army"
    benchmark_provinces: 4
    story: >-
      Hamilcar wants to take the army to Spain, where your old trading cities sit on the
      edge of a country full of silver mines and fighting men. He will win a new empire
      there, he says, to make up for Sicily and Sardinia - and the council will not have to
      pay for it.


      Before he sails, he is sacrificing to Baal Hammon. His son Hannibal, nine years old,
      begs to go with him. Hamilcar takes the boy to the altar and tells him to lay his hand
      on the victim and swear.
    choices:
      - label: "Let Hannibal go with his father and swear at the altar"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The boy swears. He will remember it fifty years later, telling the story to a Syrian
          king. Hamilcar sails for Gades with his son, and in nine years makes southern Spain
          Carthaginian.
        deeds: {take: [east_iberia], grudges: {rome: 2000}}
      - label: "Send Hamilcar to Spain, and leave the boy at home"
        legitimacy_bp: 500
        outcome: >-
          Hamilcar goes to Spain alone. Hannibal grows up in Carthage, reading Greek with his
          tutor.
        deeds: {take: [east_iberia]}
      - label: "Keep the army in Africa and settle the veterans"
        food_bp: 2000
        legitimacy_bp: -500
        outcome: >-
          Hanno the Great's party carries the day: the veterans are given land in the African
          interior and Spain is left to the merchants of Gades. Hamilcar goes quietly, as a
          private man, with his sons.
        deeds: {men: 10000}
    history: >-
      Hamilcar went to Spain in 237 BC; Polybius has Hannibal tell Antiochus III of the oath
      he swore as a boy. Hamilcar drowned in 228 BC; his son-in-law Hasdrubal founded New
      Carthage (Cartagena).
    sources: ["Polybius 3.11", "Livy 21.1"]

  - id: car_saguntum
    scenario: punic_wars
    civ: carthage
    year: -219
    until_year: -215
    title: "Peace or War"
    place: "The Council of Elders, Carthage"
    speaker: rome
    speaker_name: "Quintus Fabius"
    speaker_title: "Envoy of the Roman Senate"
    needs_alive: [rome]
    needs_peace_with: [rome]
    benchmark_provinces: 5
    story: >-
      Hannibal, twenty-eight, commands in Spain now. He has taken Saguntum, a Spanish town
      that had made itself Rome's friend, after an eight-month siege. Rome has sent envoys.
      The oldest of them, Fabius, gathers a fold of his toga in his hand.


      'Here we bring you peace and war,' he says. 'Choose which you please.'
    choices:
      - label: "Defend Hannibal and let Rome choose"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Fabius shakes out his toga: 'Then we give you war.' 'We accept it!' the elders
          shout. In Spain, Hannibal is already gathering ninety thousand men and thirty-seven
          elephants.
        deeds: {war_with: [rome], take: [celtiberia]}
      - label: "Hand Hannibal over to Rome"
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          The council votes to give up its own general. In Spain, the army will not hear of
          it, and its loyalty to the council is shaken. Hannibal stays where he is, and
          Carthage has made itself small for nothing.
        deeds: {martial_bp: -1500}
      - label: "Offer to submit Saguntum to arbitration"
        wealth_bp: -200
        legitimacy_bp: 700
        outcome: >-
          Your envoys argue that the old treaty with Hasdrubal never named Saguntum, and offer
          to let neutral cities judge. Rome will not hear it. You have spent a winter and built
          some ships against the day it fails.
        deeds: {ships: 20}
    history: >-
      After Hannibal took Saguntum (219 BC), a Roman embassy demanded his surrender; Fabius's
      gesture with his toga is in Livy and Polybius. War was declared in 218.
    diverged: >-
      Carthage and Rome are already at war, or Rome is gone.
    sources: ["Polybius 3.20-33", "Livy 21.18"]

  - id: car_alps
    scenario: punic_wars
    civ: carthage
    year: -218
    until_year: -214
    title: "The Alps"
    place: "A pass in the high Alps"
    speaker: general
    speaker_name: "Hannibal"
    speaker_title: "Commander of the army of Spain"
    needs_war_with: [rome]
    benchmark_provinces: 7
    story: >-
      Rome expects you to come by sea, and its fleets are waiting. Instead you have marched
      overland from Spain, across the Pyrenees, across the Rhone - floating the elephants
      on rafts covered in earth - and into the Alps in October. The mountain tribes roll
      boulders down on you. Snow is falling. A landslide has blocked the path.


      Your men are starving and frozen. But from the top of the pass you can show them the
      plain of the Po, where the Gauls are waiting to join you against Rome.
    choices:
      - label: "Cut a path through the slide and press on"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Your engineers heat the rock with great fires, pour sour wine over it to crack it,
          and cut a path. You come down into Italy with twenty-six thousand men, out of the
          fifty thousand who started. In December, at the Trebia, you destroy the first
          Roman army sent against you. The Gauls of the Po join you.
        deeds: {ally_with: [cisalpine_gauls], take: [rom_umbria]}
      - label: "Go back, and come by sea next year"
        legitimacy_bp: -2000
        wealth_bp: -2000
        outcome: >-
          The army goes back down to Gaul, and the council pays for the transports that will
          take it by sea. The Romans have a year to prepare.
        deeds: {ships: 40}
      - label: "✦ Blast the path with black powder"
        needs_adopted: [gunpowder]
        legitimacy_bp: 3000
        outcome: >-
          Kegs of black powder shatter the fallen rock in an afternoon. The army comes down
          into Italy a week sooner and twice as strong, and the Gauls rise everywhere.
        deeds: {ally_with: [cisalpine_gauls], take: [rom_umbria, rom_etruria]}
      - label: "Winter in the valley and go down in the spring"
        food_bp: -200
        legitimacy_bp: 2200
        outcome: >-
          You camp among the friendly tribes of the high valleys and feed the army on what they
          will sell, and the rested men think well of the general who did not throw them at the
          snow. Gauls who were waiting for you on the Po lose heart, and the Romans use the
          winter to raise new legions.
        deeds: {men: 8000}
    history: >-
      Hannibal crossed the Alps in autumn 218 BC, arriving with about 26,000 men, and won at
      the Trebia that December. Livy's story of breaking the rock with fire and vinegar is
      often doubted, but the technique was known to ancient miners.
    diverged: >-
      There is no war to carry into Italy.
    sources: ["Polybius 3.47-56", "Livy 21.37", "Mahaney et al., on the Col de la Traversette (2016)"]

  - id: car_cannae
    scenario: punic_wars
    civ: carthage
    year: -216
    until_year: -212
    title: "Cannae"
    place: "The plain of Cannae, Apulia"
    speaker: general
    speaker_name: "Maharbal"
    speaker_title: "Commander of the cavalry"
    needs_war_with: [rome]
    benchmark_provinces: 7
    story: >-
      You have destroyed a second Roman army in the fog at Lake Trasimene. Now Rome has sent
      the largest army it has ever raised - eighty thousand men under both consuls - to
      finish you on the open plain at Cannae. You have forty thousand.


      Your plan: put your weakest troops in the centre, in a bulge towards the Romans, and
      let it give way slowly. Your African veterans on the wings. Your cavalry to drive off
      theirs and come round behind. Win this, and you must still decide what the victory is for.
    choices:
      - label: "Win, then turn south and bring the allies over"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          The Roman legions push into the bending centre until they are packed so tight they
          cannot use their swords. The Africans turn inward; the cavalry closes the back. By
          evening fifty thousand Romans are dead, one of the consuls among them. Capua and the
          south go over to you. Maharbal begs you to march on Rome at once: 'In five days you
          will dine on the Capitol.' You do not. 'You know how to win a victory, Hannibal,'
          he says, 'but not how to use one.'
        deeds: {take: [rom_campania, rom_apulia, rom_bruttium]}
      - label: "Win, and march straight on Rome"
        legitimacy_bp: 2500
        unrest_bp: 1000
        outcome: >-
          You win as completely, and march on Rome with no siege train. The city shuts its
          gates and arms its slaves. You camp outside the walls, and they hold.
        deeds: {take: [rom_campania, rom_apulia]}
      - label: "✦ Win - and bring up cannon against the walls of Rome"
        needs_adopted: [cannon]
        legitimacy_bp: 4000
        outcome: >-
          Your bronze guns, hauled from Capua, open the Servian Wall in three days. The Senate
          meets you in the Forum to ask for terms. Rome survives - as a small city in Latium,
          an ally of Carthage.
        deeds: {take: [rom_campania, rom_apulia, rom_bruttium, rom_samnium], peace_with: [rome]}
      - label: "Win, then send envoys offering Rome terms"
        legitimacy_bp: 2200
        wealth_bp: 1000
        outcome: >-
          The Romans have lost fifty thousand men and will not hear of terms. The Senate refuses
          to ransom its prisoners and will not even receive your envoy inside the city limits.
          The winter goes by in talk while the Romans raise new legions from boys and slaves.
        deeds: {take: [rom_apulia]}
    history: >-
      At Cannae on 2 August 216 BC Hannibal's double envelopment annihilated a Roman army of
      some 80,000. Maharbal's reproach is in Livy. Hannibal stayed in Italy fifteen more
      years without taking Rome.
    diverged: >-
      There is no war in Italy.
    sources: ["Polybius 3.107-117", "Livy 22.44-51"]

  - id: car_metaurus
    scenario: punic_wars
    civ: carthage
    year: -207
    until_year: -204
    title: "A Head Thrown into the Camp"
    place: "Bruttium"
    speaker: general
    speaker_name: "Mago"
    speaker_title: "Your youngest brother"
    needs_war_with: [rome]
    benchmark_provinces: 7
    story: >-
      For nine years you have marched up and down Italy, winning every battle and losing the
      war: the Romans will not fight you in the open any more, they retake your towns one by
      one, and Carthage sends almost nothing. Capua has fallen.


      Now your brother Hasdrubal has crossed the Alps with a second army to join you. His
      messengers have been captured on the way, and you do not know where he is.
    choices:
      - label: "Hold your ground and wait for word"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          The Roman consul Nero slips north with seven thousand men, joins his colleague, and
          destroys Hasdrubal's army on the river Metaurus. A few days later a Roman rider
          throws your brother's head into your camp. 'I see there the fate of Carthage,' you
          say.
        deeds: {give: [rom_apulia], give_to: rome}
      - label: "March north at once to meet him"
        legitimacy_bp: 1000
        food_bp: -2000
        outcome: >-
          You march north, shaking off the consuls, and meet Hasdrubal in Umbria. Two armies
          of Barcids are in Italy together. Rome begins to be afraid again, but the garrisons
          you left behind in the south are overrun by the legions you have slipped past.
        deeds: {men: 20000, give: [rom_apulia], give_to: rome}
      - label: "Offer battle to the consul in front of you"
        legitimacy_bp: -500
        food_bp: -1000
        outcome: >-
          You march out against the Roman army in the south and force it to stand. It does not
          lose, and you cannot break it, but it is held there. Your brother, somewhere to the
          north, learns nothing of this.
        deeds: {men: 8000}
    history: >-
      In 207 BC Hasdrubal Barca was defeated and killed at the Metaurus; his head was thrown
      into Hannibal's camp.
    diverged: >-
      There is no war in Italy.
    sources: ["Livy 27.43-51", "Polybius 11.1-3"]

  - id: car_zama
    scenario: punic_wars
    civ: carthage
    year: -202
    until_year: -198
    title: "Zama"
    place: "Near Zama, in Africa"
    speaker: general
    speaker_name: "Hannibal"
    speaker_title: "Called home from Italy"
    needs_war_with: [rome]
    benchmark_provinces: 5
    story: >-
      Scipio, the young Roman who took New Carthage and all of Spain, has landed in Africa.
      The Numidian prince Masinissa has gone over to him with the best cavalry in Africa.
      You have been called home from Italy after sixteen years.


      You met Scipio between the armies, with interpreters. You admired each other. Neither
      gave way. Tomorrow you fight. You have eighty elephants, many of them untrained.
    choices:
      - label: "Open with the elephants"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Scipio has left lanes in his lines, and the trumpets drive the elephants down them
          or back into your own cavalry. Masinissa's horsemen come back to strike your rear.
          You escape to Hadrumetum. You tell the council it must make peace on any terms. Rome
          takes Spain, your fleet - five hundred ships are burnt in the harbour - and the
          right to make war without its leave.
        deeds: {peace_with: [rome], give: [car_gades, east_iberia, celtiberia], give_to: rome}
      - label: "Wait behind the walls of Carthage"
        legitimacy_bp: -500
        food_bp: -3000
        outcome: >-
          Scipio cannot take Carthage, and you cannot drive him out. Africa is stripped bare to
          feed the city. The war drags on into another year.
        deeds: {men: 10000}
      - label: "✦ Muskets in the front rank"
        needs_adopted: [musket]
        legitimacy_bp: 3500
        outcome: >-
          Your front rank fires; the Roman maniples vanish in smoke and noise. Masinissa's
          horses bolt. Scipio, wounded, is carried from the field. Rome sues for peace.
        deeds: {peace_with: [rome], grudges: {rome: 4000}}
      - label: "Make peace on Scipio's terms before the battle"
        legitimacy_bp: -2000
        wealth_bp: -2500
        outcome: >-
          You send to Scipio, who offers you the terms of the year before: Spain given up, the
          fleet surrendered, and an indemnity. The council grumbles and agrees. The army goes
          home without fighting, and Hannibal with it.
        deeds: {peace_with: [rome], give: [car_gades, east_iberia], give_to: rome}
    history: >-
      At Zama in 202 BC Scipio defeated Hannibal, ending the Second Punic War. Carthage gave
      up Spain, its fleet and its independence in foreign policy.
    diverged: >-
      The war has ended another way.
    sources: ["Polybius 15.5-19", "Livy 30.29-35"]

  - id: car_suffete
    scenario: punic_wars
    civ: carthage
    year: -196
    title: "Hannibal the Suffete"
    place: "Carthage"
    speaker: general
    speaker_name: "Hannibal"
    speaker_title: "Elected suffete"
    benchmark_provinces: 3
    story: >-
      Defeated, Hannibal has turned to politics, and been elected suffete, one of the two
      chief magistrates. He has found that the city's finances are stolen by the families on
      the council of judges, who hold office for life. He proposes to make the judges stand
      for election every year and to collect the taxes honestly - and promises that Carthage
      can pay Rome without new taxes at all.


      The great families are writing to Rome that Hannibal is plotting a new war.
    choices:
      - label: "Back Hannibal's reform of the judges"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 1500
        influence: {nobility: -2000}
        outcome: >-
          The judges are made elected; the stolen money comes back. Carthage pays off its war
          debt years early. Then Roman envoys arrive to 'settle a border dispute', and
          Hannibal, who knows why they have really come, rides out of the city that night
          and sails east to the court of Antiochus. He will never see Carthage again.
      - label: "Leave the great families their seats"
        influence: {nobility: 1500}
        wealth_bp: -1000
        outcome: >-
          The reforms are voted down. Hannibal goes back to his estates. Rome is satisfied.
      - label: "Audit the taxes, but leave the judges' tenure alone"
        wealth_bp: 3000
        legitimacy_bp: 1700
        influence: {nobility: -500}
        outcome: >-
          The great families accept honest tax collection so long as their seats are safe. Most
          of the money comes back, and the judges quietly see that not all of it does. Hannibal is
          not satisfied, and Rome is not reassured.
    history: >-
      As suffete in 196 BC Hannibal reformed the judges' tenure and the finances; accused
      to Rome by his enemies, he fled to Antiochus III in 195. He killed himself in Bithynia
      in about 183 BC rather than be handed to Rome.
    sources: ["Livy 33.45-49", "Nepos, Hannibal 7"]

  - id: car_delenda
    scenario: punic_wars
    civ: carthage
    year: -150
    until_year: -140
    title: "Carthage Must Be Destroyed"
    place: "Carthage"
    speaker: rome
    speaker_name: "Roman consuls"
    speaker_title: "Encamped at Utica"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      For fifty years Carthage has kept its word: no fleet, no wars, and it has grown rich
      again on its farms. Old Cato ends every speech in the Senate, whatever its subject,
      with 'Carthage must be destroyed', and shows the senators fresh figs that were picked in
      Carthage three days before.


      Masinissa's Numidians have been stealing your land for years, and this year, against
      the treaty, you fought back. Now a Roman army is at Utica. You have handed over three
      hundred children as hostages and all your weapons - two hundred thousand suits of armour
      and two thousand catapults. And the consuls have given their final demand: leave the
      city, and build a new one ten miles from the sea.
    choices:
      - label: "Refuse, and arm the city from its workshops"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -2000
        outcome: >-
          The temples become workshops; the women cut off their hair for catapult ropes. The
          city holds for three years. In the spring of 146 the Romans break in and fight for
          six days, house by house. Fifty thousand survivors are sold as slaves. The general
          Scipio Aemilianus, watching the city burn, weeps and quotes Homer: 'A day will come
          when sacred Troy shall perish.' Carthage burns for seventeen days.
        deeds: {war_with: [rome]}
      - label: "Leave the city as Rome demands"
        legitimacy_bp: -4000
        outcome: >-
          The people of Carthage walk out of the city their ancestors built six hundred years
          ago. The Romans tear it down behind them.
        deeds: {give: [car_carthage], give_to: rome}
      - label: "Offer gold, more hostages and the coast of Emporia"
        wealth_bp: -500
        legitimacy_bp: 2700
        unrest_bp: -2000
        outcome: >-
          Your envoys go to the consuls once more with everything that is left, and with the
          trading coast to the east. They listen and give no answer. The assembly, moved by
          the offer, swears to hold whatever comes. A week later the demand comes again, word
          for word.
        deeds: {give: [car_emporia], give_to: rome}
    history: >-
      Rome declared war in 149 BC, disarmed Carthage, then demanded it abandon the city. The
      Carthaginians resisted until 146 BC, when the city was destroyed. The story of salting
      the earth is a modern invention.
    diverged: >-
      Rome is gone; Carthage has outlived its enemy.
    sources: ["Appian, Punica 74-135", "Polybius 38.21-22", "Plutarch, Cato the Elder 27"]
