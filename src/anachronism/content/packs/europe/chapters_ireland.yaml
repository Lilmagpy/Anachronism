schema_version: 1
# Chronicle mode (D-120, D-172): Brian Boru and his heirs, 1000-1064.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Annals of Ulster, the Annals of Inisfallen, Chronicum Scotorum, the
# Book of Armagh, and (with care, for it is a partisan saga of a century later) the Cogad
# Gáedel re Gallaib and Njal's saga, with modern work by Duffy, Ó Corráin and Ní Mhaonaigh.
# The map's two Irish provinces stand for Brian's Munster and the north he forced to
# submit. benchmark_provinces counts what the real kings held at that date.
chapters:
  - id: ire_glenmama
    scenario: year_1000
    civ: ireland
    year: 1000
    title: "Christmas in Dublin"
    place: "Dublin"
    speaker: steward
    speaker_name: "Sitric Silkbeard"
    speaker_title: "King of the Dublin Norse"
    benchmark_provinces: 2
    story: >-
      You are Brian, son of Cennétig, of the small Dál Cais people of Thomond, now King of
      Munster at nearly sixty. A week ago at Glenmama you broke the army of Leinster and of
      the Norse of Dublin. You have spent Christmas in Dublin, the richest town in Ireland,
      eating the Norsemen's food.


      Sitric Silkbeard, its young king, fled north and found no one to take him in. He has
      come back and knelt to you. His mother Gormflaith, sister of the King of Leinster, was
      once the wife of the King of Dublin and then of the High King Máel Sechnaill. She is a
      widow again.
    choices:
      - label: "Return Dublin to Sitric as your man"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1500
        outcome: >-
          Sitric keeps Dublin and pays tribute, and its ships sail for you. You marry
          Gormflaith, and give Sitric your daughter. For the moment, everyone is family.
      - label: "Burn Dublin, and keep the plunder"
        wealth_bp: 3000
        legitimacy_bp: -500
        outcome: >-
          Dublin burns. The Norse go elsewhere to trade, and Ireland is poorer for it.
      - label: "Garrison Dublin with your own men"
        legitimacy_bp: 500
        wealth_bp: 800
        deeds: {men: 2000}
        outcome: >-
          You put a Munster garrison in the town and let Sitric live in it as your guest. The
          Norse markets keep trading, but the townsmen know who holds the gates.
    history: >-
      After Glenmama (December 999) Brian occupied Dublin, restored Sitric Silkbeard as a
      tributary, and married Gormflaith, Sitric's mother.
    sources: ["Annals of Inisfallen 1000", "Annals of Ulster 999-1000", "Duffy, Brian Boru and the Battle of Clontarf (2013)"]

  - id: ire_tara
    scenario: year_1000
    civ: ireland
    year: 1002
    title: "The High King Submits"
    place: "Athlone, on the Shannon"
    speaker: steward
    speaker_name: "Máel Sechnaill"
    speaker_title: "High King of Ireland, of the Uí Néill"
    benchmark_provinces: 2
    story: >-
      For five hundred years the kingship of Tara, the high kingship of Ireland, has belonged
      to the Uí Néill of the north and the midlands. Máel Sechnaill, their king, is a brave
      man; he once took the collar of gold from a Norse king. But his kinsmen in the north
      will not come to help him, and your armies are on the Shannon.


      He has come to your camp to make his submission.
    choices:
      - label: "Take his hostages and the high kingship"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Máel Sechnaill gives you hostages and his kingship. For the first time, a king of
          Munster is King of Ireland, and the Uí Néill monopoly is broken for ever. You leave
          him his own kingdom of Meath.
      - label: "Leave him Tara, as your ally"
        legitimacy_bp: 500
        outcome: >-
          The old order stands, with a stronger Munster beside it.
      - label: "Take hostages and tribute, leave him Tara"
        legitimacy_bp: 1000
        wealth_bp: 800
        outcome: >-
          You take hostages and a heavy tribute from Máel Sechnaill, and leave him the high
          kingship in name. The Uí Néill are shamed, but they are still kings at Tara.
    history: >-
      Máel Sechnaill II submitted to Brian in 1002, making Brian high king.
    sources: ["Annals of Ulster 1002", "Annals of Inisfallen 1002"]

  - id: ire_armagh
    scenario: year_1000
    civ: ireland
    year: 1005
    title: "Emperor of the Irish"
    place: "Armagh"
    speaker: diviner
    speaker_name: "Máel Suthain"
    speaker_title: "Your secretary and confessor"
    benchmark_provinces: 2
    story: >-
      You have come to Armagh, the church of St Patrick and the head of the Irish church, in
      the heart of the north where your enemies live. The monks keep the Book of Armagh, with
      Patrick's own writings.


      Your secretary Máel Suthain proposes that you lay twenty ounces of gold on the altar,
      confirm Armagh's rights over all the churches of Ireland, and let him write that in
      the Book.
    choices:
      - label: "Give the gold and confirm Armagh's rights"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -1000
        influence: {clergy: 2000}
        outcome: >-
          In the Book of Armagh, Máel Suthain writes in Latin that he has done this 'in the
          sight of Brian, Imperator Scottorum': Emperor of the Irish. The page is still there,
          in Trinity College, Dublin.
      - label: "Keep the gold for your army's pay"
        deeds: {men: 3000}
        wealth_bp: 1000
        influence: {clergy: -1000}
        outcome: >-
          The monks of Armagh pray for you without enthusiasm.
      - label: "Give less gold and confirm fewer rights"
        legitimacy_bp: 800
        wealth_bp: -400
        influence: {clergy: 800}
        outcome: >-
          You lay a smaller gift on the altar and confirm Armagh's rights over its own
          churches only. The monks are polite, and Armagh's scribes write nothing grand.
    history: >-
      In 1005 Brian visited Armagh, gave twenty ounces of gold and confirmed its primacy; the
      Book of Armagh records him as 'Imperator Scotorum'.
    sources: ["Book of Armagh, fol. 16v (Trinity College Dublin MS 52)", "Annals of Ulster 1005"]

  - id: ire_north
    scenario: year_1000
    civ: ireland
    year: 1010
    title: "Hostages from the North"
    place: "Kincora, your palace on the Shannon"
    speaker: general
    speaker_name: "Murchad"
    speaker_title: "Your eldest son"
    benchmark_provinces: 2
    story: >-
      Every king in Ireland has given you hostages except the northern Uí Néill, the
      Cenél nEógain and the Cenél Conaill, behind their mountains. Without them, the
      high kingship is a word.


      Your son Murchad, your best soldier, wants to take the army north, by land and sea,
      every year until they give in.
    choices:
      - label: "Take the hostages of the north"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: 500
        outcome: >-
          The armies go north year after year. In 1011 the Cenél Conaill give you hostages at
          last, and the King of Ireland is king of all of it.
        deeds: {martial_bp: 500}
      - label: "Leave the north alone"
        unrest_bp: -300
        wealth_bp: 500
        legitimacy_bp: -500
        outcome: >-
          The north keeps its own kings, and laughs at Kincora.
      - label: "Send Murchad north for one campaign"
        legitimacy_bp: 800
        deeds: {men: 4000, martial_bp: 200}
        outcome: >-
          Murchad takes a strong army north for a single season and comes back with what he
          can win. The northern kings hear what he did and wait to see what you do next.
    history: >-
      Between 1005 and 1011 Brian forced the northern kingdoms to give hostages, completing
      his high kingship.
    sources: ["Annals of Ulster 1006-1011", "Annals of Inisfallen 1011"]

  - id: ire_dublin
    scenario: year_1000
    civ: ireland
    year: 1013
    title: "A Game of Chess at Kincora"
    place: "Kincora"
    speaker: steward
    speaker_name: "Gormflaith"
    speaker_title: "Your wife, now put away"
    benchmark_provinces: 2
    story: >-
      You have put Gormflaith away. Her brother Máel Mórda, King of Leinster, came to
      Kincora with a tribute of pine masts; watching a game of chess, he gave Murchad bad
      advice, and Murchad told him he had given the Norse bad advice at Glenmama too. Máel
      Mórda left in the night without a word. That is the saga's story; the annals say only
      that Leinster and Dublin have risen against you.


      Sitric of Dublin and Máel Mórda are sending to the Norse of the islands for help. Your
      army is ready to march on Dublin.
    choices:
      - label: "March on Dublin and besiege it"
        historical: true
        food_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          You sit outside Dublin from September to Christmas, and the town does not fall. You
          go home for the winter. Sitric's envoys sail to the Orkneys and the Isle of Man,
          promising the kingship of Ireland - and his mother's hand - to anyone who will come.
      - label: "Make peace with Leinster"
        legitimacy_bp: -1000
        wealth_bp: -1000
        outcome: >-
          Máel Mórda accepts gifts and keeps his kingdom. Dublin pays its tribute again, late.
      - label: "Ravage Leinster, and leave Dublin"
        legitimacy_bp: 200
        food_bp: -500
        deeds: {men: 5000}
        outcome: >-
          You send Murchad to burn the farms of Leinster and drive off its cattle, and leave
          Dublin to its walls. Máel Mórda is hurt, and Sitric is not.
    history: >-
      Leinster and Dublin rebelled in 1013; Brian's siege of Dublin failed, and Sitric sought
      allies from Orkney and Man.
    sources: ["Annals of Ulster 1013", "Cogad Gáedel re Gallaib 81-88", "Njal's saga 154-155"]

  - id: ire_clontarf
    scenario: year_1000
    civ: ireland
    year: 1014
    title: "Good Friday at Clontarf"
    place: "Clontarf, north of Dublin"
    speaker: general
    speaker_name: "Murchad"
    speaker_title: "Your son, commanding the army"
    benchmark_provinces: 1
    story: >-
      The Norse have come: Sigurd, Earl of Orkney, and Brodir from the Isle of Man, with men
      in mail. With the Leinstermen and the Dublin Norse, they are drawn up on the shore at
      Clontarf. Máel Sechnaill and the men of Meath stand aside, waiting.


      It is Good Friday. You are past seventy. Your son Murchad will lead the army; your guards want you to keep clear of the fighting, and some of your chiefs want you at the head of the army.
    choices:
      - label: "Let Murchad lead while you pray"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The battle lasts from dawn to dusk. The Norse are driven into the sea at high tide,
          and Earl Sigurd falls under his raven banner. Murchad is killed, and his young son.
          In the evening Brodir, fleeing through the woods, finds your tent almost unguarded,
          and kills you. Ireland mourns its emperor. Máel Sechnaill is High King again, and
          Brian's sons go home to quarrel over Munster.
        deeds: {ruler_falls: "is killed in his tent at Clontarf", give: [m_ulster]}
      - label: "Ride at the head of the army"
        deeds: {men: 4000, martial_bp: 300}
        legitimacy_bp: 1500
        unrest_bp: 1000
        outcome: >-
          You ride out in front of the army on Good Friday, an old man on a white horse. The
          Norse are broken, and you come back to Kincora alive.
      - label: "Fall back to the Shannon line"
        legitimacy_bp: -800
        deeds: {men: 5000}
        outcome: >-
          You tell Murchad to break camp and hold the Shannon, and to meet the Norse where the
          ground is better. The army grumbles at the retreat, and Máel Sechnaill watches it
          go.
    history: >-
      At Clontarf (23 April 1014) Brian's army defeated Leinster and the Norse, but Brian,
      his son Murchad and his grandson were killed.
    sources: ["Annals of Ulster 1014", "Cogad Gáedel re Gallaib 90-118", "Njal's saga 156-157"]

  - id: ire_law
    scenario: year_1000
    civ: ireland
    year: 1040
    title: "A Law for Sunday"
    place: "Killaloe"
    speaker: diviner
    speaker_name: "The abbot of Killaloe"
    speaker_title: "Of your family's church"
    benchmark_provinces: 1
    story: >-
      You are Donnchad, son of Brian. Your father's empire died with him at Clontarf; you
      have spent twenty-five years winning back Munster from your brothers and cousins, and
      the countryside is full of armed men, cattle-raiders and blood feuds.


      The abbot proposes a law, proclaimed with the church's blessing and the king's
      penalties: that no one shall steal, or carry arms, or work, on Sundays, and that
      raiders shall pay twice over.
    choices:
      - label: "Proclaim the abbot's law in full"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          The annalists of Inisfallen record it: a law and a restraint, so that no one dared
          to steal or to do violence. It is the first time an Irish king has tried to make
          peace by law rather than by hostages.
      - label: "Keep order by the sword"
        deeds: {men: 3000}
        wealth_bp: -300
        legitimacy_bp: -300
        unrest_bp: 500
        outcome: >-
          Your war-band rides out after the raiders, and finds them, and the feuds go on.
      - label: "Proclaim a law against raiders only"
        legitimacy_bp: 600
        unrest_bp: -600
        influence: {clergy: 300}
        outcome: >-
          You proclaim the double penalty for raiders and leave the Sunday rules out. The
          clergy are half content, and the raiders are afraid.
    history: >-
      In 1040 Donnchad mac Briain made a law against theft, violence and Sunday work in
      Munster, recorded in the Annals of Inisfallen.
    sources: ["Annals of Inisfallen 1040", "Ó Corráin, Ireland before the Normans (1972)"]

  - id: ire_rome
    scenario: year_1000
    civ: ireland
    year: 1063
    title: "The Road to Rome"
    place: "Kincora"
    speaker: steward
    speaker_name: "Toirdelbach Ua Briain"
    speaker_title: "Your nephew, grandson of Brian"
    benchmark_provinces: 1
    story: >-
      You are Donnchad, son of Brian, King of Munster for fifty years. You never became High
      King like your father, though you called yourself King of Ireland when you could. Your
      brother Tadc was murdered in 1023, and men said you were glad of it.


      Now Tadc's son Toirdelbach has come back with the King of Leinster's army, and your
      own men are leaving you.
    choices:
      - label: "Give up the kingship for a pilgrimage"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          You go as a pilgrim to Rome, and die there in the monastery of Santo Stefano, where
          a stone tablet remembers you. Later Irish stories say you gave the pope your
          father's crown. Toirdelbach becomes the strongest king in Ireland, and his son
          Muirchertach will give the Rock of Cashel to the Church.
        deeds: {ruler_falls: "goes on pilgrimage to Rome, and dies there"}
      - label: "Fight Toirdelbach for the kingship"
        deeds: {men: 4000}
        legitimacy_bp: -500
        unrest_bp: 2000
        outcome: >-
          You march out with what men you have left. Toirdelbach and the Leinstermen wait.
      - label: "Treat with your nephew for terms"
        legitimacy_bp: -500
        wealth_bp: -800
        outcome: >-
          You send to Toirdelbach with an offer of a share of Munster's tribute if he will
          leave you the kingship. He listens, and takes the tribute and not the offer.
    history: >-
      Donnchad mac Briain was deposed by his nephew Toirdelbach in 1063 and died in Rome in
      1064.
    sources: ["Annals of Inisfallen 1063-1064", "Annals of Ulster 1064"]
