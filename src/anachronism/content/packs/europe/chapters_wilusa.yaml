schema_version: 1
# Chronicle mode (D-120, D-XXX): Wilusa, c. 1275-1180 BC. Each chapter opens in its year; one
# choice is what history chose (historical: true). Facts follow the Hittite texts that name
# Wilusa (the treaty of Muwatalli II with Alaksandu, CTH 76; the Tawagalawa letter; the
# Milawata letter) and the excavations at Troy (Hisarlik) by Blegen, Korfmann and Rose.
# Wilusa is widely, not universally, identified with Troy. Any link to Homer is TRADITION,
# not history: the Iliad was composed centuries later, and nothing in the Bronze Age
# evidence confirms its story. Three kings of Wilusa are named in the Hittite texts
# (Kukkunni, Alaksandu and Walmu); the rest are lost. Reign dates are approximate or invented
# placeholders for the turn grid; Alaksandu's and Walmu's actual reigns are not firmly dated.
# Wilusa is one province throughout.
chapters:
  - id: wil_oath
    scenario: kadesh
    civ: wilusa
    year: -1275
    title: "The Oath of Alaksandu"
    place: "Wilusa"
    speaker: hatti
    speaker_name: "Muwatalli II"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      You are Alaksandu, king of Wilusa, the walled city by the strait where the winds from the
      north make ships wait for days. Across the water are the Greeks the Hittites call
      Ahhiyawa; behind you is Arzawa, and behind that, the Great King of Hatti.


      Muwatalli has written you a treaty. He will protect you, and your sons after you, and
      Hatti's enemies will be yours. In return you will send men when he calls, and you will
      not turn to Ahhiyawa. The gods of Wilusa are named among the witnesses, among them one
      called Apaliunas, whose name some scholars hear as Apollo's. The Great King is about to
      march to Kadesh and wants his western vassals sworn.
    choices:
      - label: "Swear to Hatti"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          You swear, and the treaty is sealed in Hattusa. Later Greeks will call Priam's son
          Alexandros, a name like yours: the story goes, as a memory or a coincidence, nobody
          can say. Wilusa is a Hittite vassal for as long as there is a Hatti.
        deeds: {peace_with: [hatti]}
      - label: "Keep your hands free: write to Ahhiyawa as well"
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Ships come to your quay from across the water with gifts. Hatti notes it.
        deeds: {grudges: {hatti: 2000}}
    history: >-
      The treaty of Muwatalli II with Alaksandu of Wilusa (c. 1280 BC) makes Wilusa a vassal of
      Hatti. It names the gods of Wilusa, including Apaliunas, among its witnesses.
    sources: ["CTH 76, translated in Beckman, Hittite Diplomatic Texts (1999)", "Latacz, Troy and Homer (2004)", "Bryce, The Trojans and Their Neighbours (2006)"]

  - id: wil_settled
    scenario: kadesh
    civ: wilusa
    year: -1248
    title: "The Matter of Wilusa"
    place: "Wilusa"
    speaker: hatti
    speaker_name: "Hattusili III"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      You are the king of Wilusa; your name is lost. Your predecessor Alaksandu is dead. A
      warlord from Anatolia with friends among the Ahhiyawans, Piyamaradu, has raided your
      land and the island of Lazpa; the Great King of Hatti and the king of Ahhiyawa have
      each said the other is to blame.


      Now their letters are going back and forth. A Hittite letter to the king of Ahhiyawa
      will say that Wilusa is the matter over which the two of them had been hostile. You
      are told that the quarrel is to be settled, and not told how.
    choices:
      - label: "Accept what the Great Kings agree"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The two Great Kings come to terms over your head. Wilusa remains a Hittite vassal.
          Piyamaradu moves on to other targets. Your harbour is as busy as before.
        deeds: {peace_with: [mycenae]}
      - label: "Send your own envoys to Ahhiyawa"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          The wanax receives them politely. Hatti hears of it within the month.
        deeds: {grudges: {hatti: 1500}}
    history: >-
      In the Tawagalawa letter, a Hittite Great King (probably Hattusili III) tells the king
      of Ahhiyawa that the quarrel over Wilusa had been settled. Piyamaradu's attacks on
      Wilusa are mentioned in this and in the letter of Manapa-Tarhunta of the Seha River Land.
    diverged: >-
      Hatti is gone.
    sources: ["Tawagalawa letter (CTH 181)", "Letter of Manapa-Tarhunta (CTH 191)", "Beckman, Bryce and Cline, The Ahhiyawa Texts (2011)"]

  - id: wil_exile
    scenario: kadesh
    civ: wilusa
    year: -1239
    title: "Walmu Driven Out"
    place: "Wilusa"
    speaker: general
    speaker_name: "Your captain of the guard"
    speaker_title: "Of the house of Wilusa"
    benchmark_provinces: 1
    story: >-
      You are Walmu, king of Wilusa. Someone has turned the city against you. The Hittite
      letters that tell the story do not say who, and do not say how: a rival at home, a
      stronger neighbour, men from over the water. Your captain says the gates will not
      hold the night.


      The Great King Tudhaliya sits in Hattusa; his treaty protects you, if you can reach him.
      The coast road and the sea are both open.
    choices:
      - label: "Flee to the Great King"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          You leave by ship, and then by the roads of Arzawa to Hattusa, where Tudhaliya
          receives you as a vassal who has been wronged. Your rival sits on your throne, and
          you wait to be sent back.
        deeds: {ruler_falls: "is driven from his throne"}
      - label: "Fight in the streets"
        unrest_bp: 2000
        outcome: >-
          Your guards hold the citadel gate for one night. By morning your rival has the
          lower town.
        deeds: {ruler_falls: "is driven from his throne"}
    history: >-
      The Milawata letter of Tudhaliya IV says that Walmu, king of Wilusa, was driven from his
      throne and came to the Great King as a refugee. The letter does not say by whom.
    sources: ["Milawata letter (CTH 182)", "Beckman, Bryce and Cline, The Ahhiyawa Texts (2011)"]

  - id: wil_restored
    scenario: kadesh
    civ: wilusa
    year: -1230
    title: "Back to Wilusa"
    place: "Mira, on the way home"
    speaker: hatti
    speaker_name: "Tudhaliya IV"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      You are Walmu again. Years in Hattusa have taught you what a vassal is worth. Tudhaliya
      has written to Tarkasnawa, king of Mira, the strongest of his vassals in the west: send
      Walmu back to Wilusa and restore him, as the Great King wishes.


      The letter also argues over the border of Millawanda, where the Ahhiyawans have a foothold.
      You are the pawn in a larger game, and you know it. But the road home is open.
    choices:
      - label: "Go home as the Great King's man"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Tarkasnawa's escort brings you to your own gate, and the people of Wilusa are told
          that Tudhaliya has sent you. You will be a loyal vassal. The Hittite armies, which
          could restore a king, will not be able to save a city.
        deeds: {peace_with: [hatti]}
      - label: "Stay with Mira and bargain"
        legitimacy_bp: -1000
        outcome: >-
          Tarkasnawa does not like it, and the Great King likes it less. The letter is
          repeated.
    history: >-
      In the Milawata letter (c. 1235-1225 BC) Tudhaliya IV tells Tarkasnawa of Mira to restore
      Walmu to Wilusa. The Hittite king claims Wilusa as his vassal.
    diverged: >-
      Hatti is gone.
    sources: ["Milawata letter (CTH 182)", "Beckman, Bryce and Cline, The Ahhiyawa Texts (2011)"]

  - id: wil_jars
    scenario: kadesh
    civ: wilusa
    year: -1212
    title: "Jars in the Floors"
    place: "The citadel of Wilusa"
    speaker: steward
    speaker_name: "Your chief of the stores"
    speaker_title: "Of the citadel"
    benchmark_provinces: 1
    story: >-
      The harvest is poor, as it is all over the sea. The south sends nothing, and Hatti, which
      once protected Wilusa, is starving and has stopped answering letters. Raiders have
      been seen along the Aegean.


      The citadel is crowded: new houses built against the walls, big storage jars sunk in the
      floors of the rooms. There is room for one more row, if the market square goes. The
      captains say the walls are good enough if the stores are full.
    choices:
      - label: "Fill every house with jars, and repair the walls"
        historical: true
        food_bp: 2000
        materials_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          The houses of the citadel fill with great storage jars of grain, oil and wine. The
          diggers of three thousand years later will read it this way: a town preparing to be
          besieged.
      - label: "Send your ships for grain"
        wealth_bp: -1500
        food_bp: 1500
        outcome: >-
          The ships come back with a little grain and a lot of news, none of it good.
    history: >-
      The citadel of Troy VIIa (late 13th-early 12th century BC) is crowded, with large storage
      jars sunk into the floors; its excavator, Carl Blegen, read this as preparation for a
      siege. The interpretation is not certain.
    sources: ["Blegen, Troy IV (1958)", "Korfmann and Latacz on Troy and Wilusa", "Rose, The Archaeology of Greek and Roman Troy (2014)"]

  - id: wil_fire
    scenario: kadesh
    civ: wilusa
    year: -1182
    title: "The Burning of the Citadel"
    place: "Wilusa"
    speaker: general
    speaker_name: "Your captain of the guard"
    speaker_title: "On the wall"
    benchmark_provinces: 1
    story: >-
      You are the king of Wilusa; your name is lost. The Great King of Hatti has no army to
      send, and nothing has been heard from him in years. Ugarit has burned; the coast
      is full of rumours. Now there are strangers on the plain, with fire.


      The Greeks of later times will say that Troy fell after a ten-year siege and a wooden
      horse, and will fix the year at about 1184 BC. That is the tradition. Your captain can only
      tell you what he sees: the lower town on fire, and the citadel gate not yet.
    choices:
      - label: "Hold the citadel"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          Wilusa burns. Where the diggers find the burned layer, they find arrowheads, sling
          stones, and the bones of people who were not buried. Whether the attackers were
          raiders from the sea, from the north, from across the water or an enemy from the
          next valley, the ground does not say. A smaller town grows over the ashes.
        deeds: {ruler_falls: "is lost when the citadel burns"}
      - label: "Take the people and leave by sea"
        legitimacy_bp: -1500
        outcome: >-
          Your ships take the families away before the fire. The city burns empty.
        deeds: {ruler_falls: "leaves with his people"}
    history: >-
      The citadel of Troy VIIa (Blegen's term; Korfmann's Troy VIi) was destroyed by fire around
      1180 BC. It was resettled in a poorer form. The cause is unknown, and any link between this
      destruction and Homer's Trojan War is tradition, not demonstrated history.
    sources: ["Blegen, Troy IV (1958)", "Latacz, Troy and Homer (2004)", "Cline, 1177 BC (2014)"]
