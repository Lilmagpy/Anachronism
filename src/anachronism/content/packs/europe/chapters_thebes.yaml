schema_version: 1
# Chronicle mode (D-120, D-XXX): Thebes under the Macedonian garrison, its revolt and
# destruction, and its refounding, 336-316 BC. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow Arrian's Anabasis 1.7-9, Diodorus 17.3-4
# and 17.8-14 and 19.53-54, Plutarch's Alexander 11-13, Justin 11.2-3 and Pausanias 9.7, with
# modern work by Bosworth and Hammond. Several of these chapters share the single year 335 BC
# (the revolt, the siege and the verdict were weeks apart). benchmark_provinces is 1 throughout:
# this map has one Theban province, which the real city lost for nineteen years (335-316);
# the player's state carries on as the scattered Thebans. Thebes had no king, so the player's
# ruler is the city itself, with no name.
chapters:
  - id: theb_garrison
    scenario: alexander
    civ: thebes
    year: -336
    title: "The Garrison on the Cadmea"
    place: "The assembly of Thebes"
    speaker: athens
    speaker_name: "Demosthenes"
    speaker_title: "Orator of Athens"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are the people of Thebes. Two years ago Philip of Macedon broke the Greek armies at
      Chaeronea and the Sacred Band, your best men, died where they stood. Philip left a
      garrison on the Cadmea, the citadel in the middle of your city, and left your government
      to a few of his friends.


      Now news has come that Philip has been murdered at a wedding, and that his son is a boy
      of twenty. In Athens, Demosthenes is saying that the tyrant is dead and Greece should
      be free. His messengers have reached your assembly.
    choices:
      - label: "Vote to put the garrison out"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 500
        outcome: >-
          The assembly votes to throw the Macedonians out of the Cadmea. It stays a vote. The
          young king marches south faster than anyone expected, through Thessaly and past
          Thermopylae, and the Greek cities think better of defiance. The garrison stays on
          your citadel, and so does your anger.
        deeds: {grudges: {macedon: 1000}}
      - label: "Send envoys to the new king"
        legitimacy_bp: -300
        wealth_bp: -300
        outcome: >-
          You greet Alexander with words of loyalty and gifts. He is pleased. Your own people
          are not, and the garrison does not leave.
      - label: "Arm the citizens and wait for Athens to move"
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          The armouries are opened and the young men drill in the agora. You vote nothing, and
          wait to see whether Athens will really rise.
        deeds: {men: 2000}
    history: >-
      After Chaeronea (338 BC) Philip garrisoned the Cadmea. When he died in 336 the Thebans
      voted to expel the garrison, but Alexander's rapid march south brought the Greek cities
      into line, and the garrison remained.
    diverged: >-
      Macedon is gone, and with it the garrison.
    sources: ["Diodorus 17.3-4", "Justin 9.4, 11.2", "Arrian, Anabasis 1.1", "Bosworth, Conquest and Empire (1988)"]

  - id: theb_rumour
    scenario: alexander
    civ: thebes
    year: -335
    title: "The Rumour of Alexander's Death"
    place: "The agora of Thebes"
    speaker: general
    speaker_name: "Phoenix"
    speaker_title: "Leader of the returned exiles"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are the people of Thebes. Alexander has gone north to fight the Triballi and the
      Illyrians, and no letter has come for weeks. Then a story runs through Greece that he is
      dead, killed in a battle in the mountains. Some say Demosthenes in Athens has produced a
      man who swears he saw it.


      A band of Theban exiles has slipped back into the city. They have already killed two
      Macedonian officers outside the Cadmea, and they stand before your assembly asking you
      to rise and shut the garrison in its citadel.
    choices:
      - label: "Rise and besiege the Cadmea"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 1000
        influence: {nobility: -500}
        outcome: >-
          The assembly votes for freedom. You dig a ditch and a palisade around the Cadmea to
          shut the garrison in. Diodorus adds that slaves were freed and resident foreigners
          armed. Athens votes you its support, and its orators send arms; no Athenian army
          marches.
        deeds: {men: 3000, grudges: {macedon: 3000}}
      - label: "Wait for proof, but arm the walls"
        legitimacy_bp: 1700
        unrest_bp: 1000
        outcome: >-
          The assembly puts off its vote, and fifteen hundred men are put on the walls while you
          wait. The exiles grow impatient. Before the rumour can be tested, Alexander himself
          arrives. Cautious citizens approve, though the exiles are bitter.
        deeds: {men: 1500, grudges: {macedon: 500}}
      - label: "Send word to Alexander that Thebes is loyal"
        legitimacy_bp: -1000
        unrest_bp: 800
        wealth_bp: -300
        outcome: >-
          The exiles call you cowards, and your assembly splits. Your letter will find
          Alexander a long way from his throne.
    history: >-
      In 335 BC, on a false report that Alexander had died in Illyria, Theban exiles killed
      two Macedonian officers and persuaded the assembly to revolt. The Thebans besieged the
      Cadmea.
    diverged: >-
      Macedon is gone: there is no garrison to besiege.
    sources: ["Arrian, Anabasis 1.7.1-4", "Diodorus 17.8", "Justin 11.2", "Plutarch, Demosthenes 23"]

  - id: theb_ultimatum
    scenario: alexander
    civ: thebes
    year: -335
    after: [theb_rumour]
    title: "The King at Onchestus"
    place: "The walls of Thebes"
    speaker: macedon
    speaker_name: "Alexander"
    speaker_title: "King of Macedon, alive"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      He is not dead. Alexander has come south from Illyria in a march of about two weeks,
      and he is camped at Onchestus, a day's march from your gates. He does not attack. He
      waits to see whether you will repent.


      His heralds ask for two of your leaders, Phoenix and Prothytes, and promise a pardon to
      the rest, and a place in the League of Corinth. Your citizens crowd the walls. Everyone
      has heard how fast he marched.
    choices:
      - label: "Refuse, and call on the Greeks to rise"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You answer by demanding Philotas and Antipater, two of his generals. Then a herald on
          your walls proclaims that whoever will join the Great King and Thebes in freeing
          Greece from the tyrant may come over. Alexander says that you have brought
          whatever follows on yourselves, and moves his camp up to the city.
        deeds: {grudges: {macedon: 2000}}
      - label: "Give up the two leaders and accept a garrison"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The two men are handed over, and the assembly shakes with shame. You are spared for
          now, with a garrison, and a name for betrayal.
        deeds: {grudges: {macedon: 500}}
      - label: "Offer to treat on terms of your own"
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Alexander does not bargain with a city that has a garrison under siege. His heralds
          return with the same two names. The Greeks admire a city that does not bow at once.
    history: >-
      Alexander camped at Onchestus and gave Thebes time to give in; it refused, asked in return
      for two of his generals and proclaimed a call to freedom. He then moved up to the city.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.7.5-11", "Diodorus 17.9", "Plutarch, Alexander 11"]

  - id: theb_assault
    scenario: alexander
    civ: thebes
    year: -335
    after: [theb_ultimatum]
    title: "The Palisade Breaks"
    place: "The ditch and stockade around the Cadmea"
    speaker: general
    speaker_name: "Phoenix"
    speaker_title: "Leader of the Theban defence"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Alexander has set his army on the side of the city facing the Cadmea, so that the
      Macedonians in the citadel may join him. Your light troops sally out and skirmish with
      his, and he holds back, hoping you will still think better of it.


      Then one of his officers, Perdiccas, who is guarding the stockade, rushes it without
      orders. He gets inside the first palisade, and another battalion follows. Alexander sends
      more men in after them, and the Macedonians in the citadel come down.
    choices:
      - label: "Fight on in the streets and squares"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 2000
        outcome: >-
          Your men fight hard, in the temples and the squares, and they do not give ground
          easily. But the Macedonians are through the stockade and the garrison is behind you.
          Your cavalry gallops out across the plain. The rest of the city is cut down.
          Arrian says the Boeotian allies of Alexander were among the cruellest.
        deeds: {peace_with: [macedon]}
      - label: "Break out by the gates with all who can run"
        legitimacy_bp: 1000
        unrest_bp: 1500
        outcome: >-
          Some of your fighting men get out, and some fall at the gates. Behind them the city is
          lost without a fight in the streets. Those who get away are honoured as the last
          defenders of the city.
        deeds: {peace_with: [macedon]}
      - label: "Open the gates and plead for mercy"
        legitimacy_bp: -1500
        outcome: >-
          No one is left to open them: the fighting is already in the streets.
        deeds: {peace_with: [macedon]}
    history: >-
      Perdiccas broke into the stockade without orders and the Macedonians took Thebes by
      assault. About six thousand Thebans were killed.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.8", "Diodorus 17.11-13", "Plutarch, Alexander 11"]

  - id: theb_verdict
    scenario: alexander
    civ: thebes
    year: -335
    after: [theb_assault]
    title: "The Allies Decide"
    place: "The ruins of Thebes"
    speaker: scholar
    speaker_name: "Cleadas"
    speaker_title: "A Theban prisoner"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are what is left of Thebes, a crowd of prisoners under guard. Alexander has told
      the council of his Greek allies to judge you, and the allies who have hated you longest
      sit in it: Phocians, Plataeans, Thespians and men from Orchomenus, all of whom Thebes
      once treated harshly.


      Cleadas, one of the prisoners, asks to speak for the city.
    choices:
      - label: "Plead the city's case before the allies"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The council votes to put a garrison in the Cadmea, to raze the city to the ground,
          to divide the land among the allies, and to sell the women and children as slaves.
          Priests, and the guest-friends of Philip and Alexander, are spared, and so are the
          descendants of the poet Pindar, whose house is left standing. Six thousand Thebans
          have died, and about thirty thousand are sold. The story goes that a woman named
          Timocleia, whose brother had died at Chaeronea, was brought before Alexander after
          killing a Thracian officer who had wronged her, and was set free with her family.
        deeds: {peace_with: [macedon], grudges: {macedon: 3000}}
      - label: "Ask only for the ringleaders"
        legitimacy_bp: 300
        outcome: >-
          The allies are not listening. They remember what Thebes did to them.
        deeds: {peace_with: [macedon]}
      - label: "Offer the allies your land for your lives"
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          You offer your fields to the allies who have most wanted them, if they will let the
          citizens live free. The allies are tempted, but the council has already made up its
          mind. The offer is admired as a generous one.
        deeds: {peace_with: [macedon]}
    history: >-
      Alexander left the fate of Thebes to his Greek allies, who voted to destroy the city. Only
      the temples and Pindar's house were spared. Plutarch reports that he later regretted it.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.9", "Diodorus 17.13-14", "Plutarch, Alexander 11-13", "Justin 11.3"]

  - id: theb_refounding
    scenario: alexander
    civ: thebes
    year: -316
    title: "Cassander Rebuilds Thebes"
    place: "The Boeotian plain"
    speaker: macedon
    speaker_name: "Cassander"
    speaker_title: "Ruler of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Nineteen years have passed. The Thebans have been scattered across Greece, Italy and
      Sicily; the Cadmea has been a garrison, and the old city no more than rubble, its fields
      divided among your enemies. Alexander is dead, and his generals are carving up the empire.


      Now Cassander, who holds Macedon and wants friends in Greece, proposes to rebuild Thebes.
      Athens, which sheltered many of your refugees, will help with the walls. Whether the
      offer comes from kindness, or because a friendly Thebes is useful to him, nobody can say.
    choices:
      - label: "Accept, and come home"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 1000
        unrest_bp: -1000
        outcome: >-
          Athens, other Greek cities, and even Greeks in Italy and Sicily send money, and the
          returned Thebans raise the walls again. A new Thebes stands on the old ground,
          grateful to Cassander, and not wholly trusting him.
        deeds: {grudges: {macedon: 500}}
      - label: "Refuse Cassander's help"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          You stay in exile, owing him nothing. The rubble stays too.
      - label: "Rebuild in secret without him"
        legitimacy_bp: 2000
        wealth_bp: 2000
        unrest_bp: 500
        outcome: >-
          A few families return to the ruins. Cassander's soldiers notice. Athens and other Greeks
          send money for a city that will owe nobody.
    history: >-
      In 316 BC Cassander had Thebes rebuilt, with money and labour from Athens and from other
      Greek cities, twenty years after its destruction.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 19.53-54", "Pausanias 9.7.1-4"]
