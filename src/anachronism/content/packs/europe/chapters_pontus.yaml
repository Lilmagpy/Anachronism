schema_version: 1
# Chronicle mode (D-120, D-XXX): the kings of Pontus, from Mithridates II's war on Sinope to
# the young Mithridates VI's first conquests, 220-108 BC. Each chapter opens in its year; one
# choice is what history chose (historical: true). Facts follow Polybius 4-5 and 23-26 (the
# books on Pontus survive only in fragments), Strabo 7, 10 and 12, Appian's Mithridatic
# Wars and Punic Wars, and Justin's epitome of Pompeius Trogus 37-38, with modern work by
# McGing (The Foreign Policy of Mithridates VI Eupator, 1986), Mayor (The Poison King, 2009)
# and Magie. Pontus is one province on this map throughout; the Cappadocian, Paphlagonian,
# Phrygian and Bosporan lands the kings won or lost are not provinces here, so
# benchmark_provinces is 1 at every date. Regnal dates are approximate: Mithridates II c.
# 250-220, III c. 220-185, Pharnaces I c. 185-170, Mithridates IV c. 170-150, V c. 150-120,
# VI 120-63. The kingdom's chronology is poorly attested and chapters give the best guess.
chapters:
  - id: pon_sinope
    scenario: punic_wars
    civ: pontus
    year: -220
    title: "The City on the Headland"
    place: "Sinope"
    speaker: rhodes
    speaker_name: "Rhodian envoys"
    speaker_title: "Sent to Sinope"
    needs_alive: [rhodes]
    benchmark_provinces: 1
    story: >-
      You are Mithridates, king of Pontus, descended from Persian nobles who fled Alexander's
      successors. Your kingdom is mountain valleys, iron and timber, with a few fortresses
      inland; its only good sea-gate is Sinope, a rich Greek city on a headland, which pays
      you nothing. Not long ago you married your daughter Laodice to the young King
      Antiochus III, and your standing in Asia has never been higher.


      Now you have laid siege to Sinope. The city has sent to Rhodes, which calls itself the
      guardian of free Greek seas, and Rhodian ships have started to arrive with food,
      and weapons for the walls.
    choices:
      - label: "Press the siege, even against Rhodes"
        historical: true
        wealth_bp: -500
        legitimacy_bp: 500
        outcome: >-
          Rhodes sends money, wine, catapult rope and engineers rather than a fleet,
          and Sinope holds. Polybius records the Rhodian gifts, but not the siege's end; your
          kingdom still has no harbour of its own. The city stays free for about forty years.
      - label: "Lift the siege and offer a trading treaty"
        wealth_bp: 500
        legitimacy_bp: 100
        outcome: >-
          Sinope grants you a trading charter and refuses all else. Your mountain barons grumble
          that the sea is not for kings.
      - label: "Ask Antiochus, your son-in-law, for ships"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Antiochus III is busy: Molon's rebellion has only just been put down and he has a
          war with Ptolemy to plan. He sends warm words.
    history: >-
      In about 220 BC Mithridates of Pontus besieged Sinope, and Rhodes sent the city
      supplies; the siege failed. Sinope stayed free until Pharnaces I took it in 183.
    diverged: >-
      Rhodes is gone.
    sources: ["Polybius 4.56, 5.43", "Strabo 12.3.11", "McGing (1986)"]

  - id: pon_pharnaces
    scenario: punic_wars
    civ: pontus
    year: -183
    title: "Pharnaces Takes Sinope"
    place: "Sinope"
    speaker: rhodes
    speaker_name: "Rhodian envoys"
    speaker_title: "Sent to Rome"
    needs_alive: [rhodes]
    benchmark_provinces: 1
    story: >-
      You are Pharnaces, king of Pontus, grandson of Antiochus III through your mother. Your
      grandfather lost to the Romans at Magnesia seven years ago, and Pontus has been quietly
      growing while the great kings sat in their ruins. You have already pushed your borders
      along the coast. What you have never been able to do is take Sinope.


      The city is rich, but divided; it knows it has no friends nearer than Rhodes. You
      have an army on the coast, and if you strike now, before Rome or Pergamon make up
      their minds about you, the city may have no time to prepare.
    choices:
      - label: "Take Sinope, and make it your capital"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Sinope falls to you. The Rhodians send ambassadors to Rome, and Rome sends commissioners,
          but nothing is undone. Eumenes of Pergamon and Ariarathes of Cappadocia begin to
          see in you a threat, and join against you. You make Sinope the royal city of Pontus;
          its harbour, shipyards and Greek merchants will give your descendants a navy.
        deeds: {grudges: {pergamon: 1500, rhodes: 1500}}
      - label: "Leave Sinope and fight your neighbours"
        legitimacy_bp: 1100
        wealth_bp: 1500
        outcome: >-
          The city survives for another generation, and so does your lack of a sea-gate. Your
          army takes some villages from the Galatians and Cappadocians instead.
        deeds: {men: 3000}
      - label: "Offer Sinope an alliance instead of a siege"
        legitimacy_bp: -1000
        wealth_bp: 500
        outcome: >-
          Sinope's council politely declines. It knows what an alliance with Pontus means.
    history: >-
      In 183 BC Pharnaces I seized Sinope and made it his capital. Rhodes protested to Rome
      without effect, and Pergamon and Cappadocia went to war against him.
    diverged: >-
      Rhodes is gone.
    sources: ["Polybius 23.9", "Strabo 12.3.11", "Mayor, The Poison King (2009)"]

  - id: pon_war_179
    scenario: punic_wars
    civ: pontus
    year: -179
    title: "The War of the Kings"
    place: "Pontus"
    speaker: rome
    speaker_name: "Roman commissioners"
    speaker_title: "Sent by the Senate"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Pharnaces, king of Pontus. For four years you have been at war with Eumenes of
      Pergamon and Ariarathes of Cappadocia. Galatian chiefs have taken both sides. Both
      sides have sent envoys to Rome again and again, and the Senate sends commissioners who
      say they are looking for the truth.


      Now the Romans press terms on you that Eumenes is willing to accept. You
      would give up your conquests in Galatia and Paphlagonia and pay your enemies for the
      war, but you would keep Sinope.
    choices:
      - label: "Accept, and keep Sinope"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          You give up your conquests and pay your enemies. Rome's commissioners cross the
          sea satisfied, and you keep Sinope. Eumenes will watch Pontus warily for the rest of
          his reign.
      - label: "Fight on and press your claims"
        legitimacy_bp: 500
        unrest_bp: 1500
        wealth_bp: -1000
        outcome: >-
          The war drags on another year, and the Senate's patience runs out.
        deeds: {grudges: {pergamon: 1500}}
      - label: "Give Sinope back to appease Rhodes and Rome"
        legitimacy_bp: -1500
        wealth_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Rhodes is grateful. Your barons, who counted on the sea, are not.
    history: >-
      The war of 183-179 BC ended in a treaty in 179 BC under which Pharnaces gave up his
      conquests in Galatia and Paphlagonia and paid indemnities, but kept Sinope. He died
      around 170.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 23-26 (fragments)", "Strabo 12.3.41", "McGing (1986)", "Magie, Roman Rule in Asia Minor (1950)"]

  - id: pon_punic
    scenario: punic_wars
    civ: pontus
    year: -148
    title: "Ships for Rome"
    place: "Sinope"
    speaker: rome
    speaker_name: "A Roman envoy"
    speaker_title: "From the Senate"
    needs_alive: [rome, carthage]
    benchmark_provinces: 1
    story: >-
      You are Mithridates V Euergetes, "the Benefactor", king of Pontus, whom ancient writers
      remember as a friend of Rome. Rome and Carthage are at war again, and Rome's fleet is
      much stretched. A Roman envoy has come to ask kings in Asia for help. Your sea-gate,
      Sinope, has shipyards and a large harbour.


      You may not be anxious about Carthage, but you are anxious about Rome. A king who
      helps Rome in its need can ask Rome for help in his own.
    choices:
      - label: "Send a small squadron to Rome"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Appian says you helped Rome in the Third Punic War with a small squadron. It is a
          cheap gesture, and Rome likes cheap gestures from kings it hopes to rely on.
      - label: "Send a large fleet and troops"
        legitimacy_bp: 1500
        wealth_bp: -1400
        outcome: >-
          Rome is warmly grateful, and your treasury is empty.
      - label: "Keep your fleet at home"
        legitimacy_bp: -500
        outcome: >-
          Rome notes the absence.
    history: >-
      Mithridates V Euergetes was the first Pontic king to be a steady friend of Rome. Appian
      says he sent ships against Carthage in 149-146 BC.
    diverged: >-
      Rome or Carthage is gone.
    sources: ["Appian, Mithridatic Wars 10, 12", "Justin 37.1", "McGing (1986)"]

  - id: pon_aristonicus
    scenario: punic_wars
    civ: pontus
    year: -128
    title: "The Gift of Phrygia"
    place: "Asia Minor"
    speaker: rome
    speaker_name: "Manius Aquillius"
    speaker_title: "Roman commissioner in Asia"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Mithridates V Euergetes, king of Pontus. When King Attalus III of Pergamon
      died, he left his kingdom to Rome in his will, and his half-brother Aristonicus rose
      to claim it with an army of slaves, the poor and the landless. Rome has taken years
      to beat him, and you sent troops to help. Now the Roman commissioner Manius Aquillius
      is organising the new province of Asia.


      Greater Phrygia, inland of Pergamon, lies open. Aquillius is willing to give it
      to a friend who has been useful, and it is whispered that a great gift of money would make him
      more willing.
    choices:
      - label: "Win Aquillius with gold, and take Phrygia"
        historical: true
        wealth_bp: -1000
        legitimacy_bp: 1500
        influence: {nobility: 1000}
        outcome: >-
          Greater Phrygia becomes yours, for money, say Appian and Justin. When you are
          murdered in 120, the Senate will say that the grant was bought with a bribe, and
          take it back.
        deeds: {grudges: {pergamon: 1000}}
      - label: "Ask the Senate to grant it to you"
        legitimacy_bp: 1100
        influence: {nobility: 500}
        outcome: >-
          The Senate listens and hesitates, then keeps Phrygia for the new province.
      - label: "Decline Phrygia and stay Rome's quiet friend"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          Nobody thanks you for modesty, and Phrygia goes to someone else.
    history: >-
      After the war with Aristonicus (133-129 BC), Manius Aquillius gave Greater Phrygia to
      Mithridates V, according to Appian and Justin for a bribe. The Senate took it back
      after his death.
    diverged: >-
      Rome is gone.
    sources: ["Appian, Mithridatic Wars 12, 56", "Justin 37.1"]

  - id: pon_poison
    scenario: punic_wars
    civ: pontus
    year: -120
    title: "The Banquet at Sinope"
    place: "Sinope"
    speaker: steward
    speaker_name: "Your steward"
    speaker_title: "Of the royal household"
    benchmark_provinces: 1
    story: >-
      You are Mithridates V Euergetes. You have ruled for thirty years as Rome's friend,
      and Pontus is richer and safer than it has ever been. Your wife Laodice, a Seleucid
      princess, has borne you two sons, Mithridates and a younger brother of the same
      name, and she is not fond of the elder. Ancient writers say there were friends at court who wished you dead.


      Tonight you are to hold a banquet at Sinope.
    choices:
      - label: "Hold the banquet as planned, among your court"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Conspirators murder you at the banquet; poison is the usual story. You leave two
          sons, the elder about fourteen, and a widow who will rule for them. The elder son,
          the boy Mithridates, will not be a boy for long.
      - label: "Cancel the banquet and arrest suspects"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          You arrest your friends, and some of them confess to nothing. Your court no longer
          trusts you.
      - label: "Name your elder son as sole heir at once"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Laodice, who prefers the younger, sets her faction against the choice.
    history: >-
      Mithridates V Euergetes was murdered at Sinope in about 120 BC. His widow Laodice ruled
      for her sons Mithridates VI and Mithridates Chrestus.
    sources: ["Justin 37.1-2", "Strabo 10.4.10", "Appian, Mithridatic Wars 112", "Mayor (2009)"]

  - id: pon_eupator
    scenario: punic_wars
    civ: pontus
    year: -112
    title: "The King Comes Home"
    place: "Pontus"
    speaker: steward
    speaker_name: "An old friend of your father"
    speaker_title: "From the royal household"
    benchmark_provinces: 1
    story: >-
      You are Mithridates VI Eupator, "of a noble father". Your father is dead. Your
      mother, Laodice, ruled for you, and favoured your younger brother, and there was talk
      of a plot to kill you. You went into the mountains. For about seven years you hunted
      on foot, slept in the open, and fought wild beasts. The story goes that you
      took tiny doses of poison until none could harm you.


      You are about twenty-two. You have come out of the mountains. The people of Pontus remember your father, and
      many are ready to follow his son. In the palace Laodice has her guards, and your
      younger brother, Mithridates Chrestus, whom she prefers.
    choices:
      - label: "Take the throne from your mother and brother"
        historical: true
        legitimacy_bp: 2000
        influence: {nobility: 1000}
        outcome: >-
          Laodice is shut in prison, where she dies. Your brother, Justin says, is put to
          death too. You are now alone on the throne, and you have never been in the
          habit of sharing.
      - label: "Share the throne with your brother"
        wealth_bp: 1000
        legitimacy_bp: 1600
        unrest_bp: 1000
        outcome: >-
          Two kings in one palace has never worked in Pontus. A year later it is the same
          court plot and the same quarrel again.
      - label: "Seek Rome's backing from exile"
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Rome has no use for a pretender with no army. The senators wait to see which of
          you lasts.
    history: >-
      About 113-112 BC the young Mithridates VI came out of hiding, took the throne from
      his mother Laodice and her chosen heir, and began a reign of fifty years.
    sources: ["Justin 37.2-3", "Appian, Mithridatic Wars 112", "Pliny, Natural History 25.6-7 (the poison story)", "Mayor (2009)"]

  - id: pon_bosporus
    scenario: punic_wars
    civ: pontus
    year: -108
    title: "The Scythians and the Crimea"
    place: "Chersonesus"
    speaker: scholar
    speaker_name: "Diophantus"
    speaker_title: "A general of Pontus"
    benchmark_provinces: 1
    story: >-
      You are Mithridates VI Eupator, king of Pontus. You hold the Black Sea coast on either side of
      Sinope, and Colchis lies within your reach.
      North of the sea, in the Crimea, the Greek city of Chersonesus is under attack from the
      Scythian king Palacus, whose people have grown strong.


      Chersonesus has sent to ask for your protection. If the Greeks of the Crimea
      are yours, so are the grain and fish of the northern shore, and the kingdom of the
      Bosporus beyond, which is already in trouble with the Scythians.
    choices:
      - label: "Send Diophantus with an army"
        historical: true
        wealth_bp: 1500
        legitimacy_bp: 1500
        outcome: >-
          Diophantus beats Palacus and his Roxolani allies in the field, and takes
          Chersonesus under Pontus's protection. The Bosporan king, Parisades, is
          murdered by a rebel; Diophantus puts the revolt down, and the Bosporan kingdom
          comes to you. Your fleet and army now have more food and more men than ever.
        deeds: {martial_bp: 500}
      - label: "Send gold and a small squadron"
        wealth_bp: -500
        legitimacy_bp: -500
        outcome: >-
          Gold and a few ships do not turn back a Scythian cavalry charge.
        deeds: {ships: 3}
      - label: "Decline, and raise men for Asia Minor"
        wealth_bp: 1500
        legitimacy_bp: 1100
        outcome: >-
          Chersonesus will find another protector, perhaps a Scythian one.
        deeds: {men: 2000}
    history: >-
      About 110-107 BC Mithridates' general Diophantus defeated the Scythians under Palacus,
      and the Bosporan kingdom passed to Pontus. The grain and recruits of the north shore
      fed the wars to come.
    sources: ["Strabo 7.4.3-4", "Appian, Mithridatic Wars 12-13", "Strabo 7.3.17", "McGing (1986)"]
