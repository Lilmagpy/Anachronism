schema_version: 1
# Chronicle mode (D-120, D-XXX): Muslim Sicily, from the last Kalbid emirs to the fall of
# Noto, 1018-1091. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Ibn al-Athir, Ibn Hawqal, al-Nuwayri and Ibn Khaldun, Amatus
# of Montecassino, Geoffrey Malaterra, Skylitzes and the Chronicle of Cambridge, with modern
# work by Amari (Storia dei musulmani di Sicilia), Metcalfe (Muslims and Christians in Norman
# Sicily, 2003, and The Muslims of Medieval Italy, 2009), Brett and Loud. The Arabic sources
# for these years are late and thin, and the reigns of the 1020s-1050s are uncertain: Ja'far's
# deposition is placed in 1019 and Ahmad al-Akhal's reign ends about 1036-38 (set here to
# 1037 so that Hasan al-Samsam is emir at the 1040 chapter); the names of the later rulers
# of Palermo and Noto are not reliably recorded and are called by their offices. The turn
# grid is two years. benchmark_provinces counts the provinces of this map the real Muslim
# states held (Sicily is one province here, and counts as held while any Muslim emir held
# part of it); the last chapter, after Noto, has none to compare.
chapters:
  - id: sic_jafar
    scenario: year_1000
    civ: sicily_emirate
    year: 1018
    title: "The Notables of Palermo"
    place: "Palermo"
    speaker: steward
    speaker_name: "Your brother Ahmad"
    speaker_title: "Called al-Akhal"
    benchmark_provinces: 1
    story: >-
      You are Ja'far al-Kalbi, emir of Sicily under the Fatimid caliph in Cairo. Your family
      has ruled the island for a generation. Under the Kalbids Palermo is a city of
      mosques and markets, gardens with lemons, sugar cane and cotton, and fleets that raid the Italian coasts for plunder and captives.


      But the notables of Palermo, and the Berber soldiers of the countryside, are unhappy
      with your taxes and your temper, and the Arabic chroniclers speak of a harsh rule. Your brother Ahmad,
      called al-Akhal, the 'squint-eyed', is spoken of as the man the notables would prefer.
      You are told that a plot is forming.
    choices:
      - label: "Hold on, and trust your guard"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          The notables and soldiers rise in 1019, and you are removed. Your brother Ahmad al-Akhal
          takes over the island, and the caliph in Cairo confirms him. The family stays in
          power; only the man changes.
        deeds: {ruler_falls: "is deposed by the notables"}
      - label: "Step aside in favour of Ahmad"
        legitimacy_bp: 500
        unrest_bp: -500
        outcome: >-
          Your brother thanks you and the notables are satisfied. The family keeps the island, and you keep your head.
        deeds: {ruler_falls: "steps down in favour of his brother"}
      - label: "Ask Cairo for troops"
        legitimacy_bp: -800
        outcome: >-
          Cairo is far away, and has its own troubles. The envoy comes home with a robe of honour
          and a letter of sympathy.
    history: >-
      Ja'far al-Kalbi was deposed in 1019 by a revolt of the notables and his brother Ahmad
      al-Akhal became emir of Sicily, confirmed by the Fatimids.
    sources: ["Ibn al-Athir, al-Kamil", "al-Nuwayri", "Amari, Storia dei musulmani di Sicilia", "Metcalfe, The Muslims of Medieval Italy (2009)"]

  - id: sic_maniakes
    scenario: year_1000
    civ: sicily_emirate
    year: 1040
    title: "The Greeks and the Northmen"
    place: "Palermo"
    speaker: general
    speaker_name: "A son of the Zirid emir"
    speaker_title: "Come with the Ifriqiyan army"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Hasan, called al-Samsam, 'the Sword of the State', of the Kalbid house.
      The Byzantine emperor has sent the general George Maniakes with an army of Greeks,
      Lombards, Normans, and the Varangian guard, among whom a Norwegian called Harald, who
      will one day be a king. They have taken Messina, and have beaten your forces at
      Troina. Syracuse has fallen.


      A son of the Zirid emir of Ifriqiya has come with an army from Africa to help you. And now news arrives that Maniakes has quarrelled with the admiral Stephen, the emperor's brother-in-law, and has been called home in chains.
    choices:
      - label: "Hold Palermo, and let the Greeks quarrel"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -500
        outcome: >-
          Maniakes sails away, and his Greek army falls to pieces. Within a couple of years most
          of what he took has been lost again, and the Norman mercenaries, who were not paid,
          go back to Italy, where they will make their own war. Sicily is yours again, and
          still divided.
        deeds: {peace_with: [byzantium]}
      - label: "Throw everything at the retreating Greeks"
        legitimacy_bp: 2000
        wealth_bp: 500
        unrest_bp: 500
        outcome: >-
          You win a battle and take the Greek baggage train, and lose most of your cavalry,
          which you cannot replace.
        deeds: {peace_with: [byzantium]}
      - label: "Pay the Normans to change sides"
        wealth_bp: -2000
        legitimacy_bp: -300
        outcome: >-
          The Normans take your gold and go home, which they were about to do anyway.
        deeds: {peace_with: [byzantium]}
    history: >-
      George Maniakes' expedition took Messina (1038) and Syracuse (1040) before the general
      was recalled, after which the Muslims recovered most of what had been lost; some of the
      Norman mercenaries went home to southern Italy.
    diverged: >-
      Byzantium is gone.
    sources: ["Skylitzes, Synopsis Historion", "Amatus of Montecassino, Ystoire de li Normant 2", "Malaterra, De rebus gestis Rogerii 1", "Metcalfe, The Muslims of Medieval Italy (2009)"]

  - id: sic_qaids
    scenario: year_1000
    civ: sicily_emirate
    year: 1053
    title: "The Four Lords of Sicily"
    place: "Palermo"
    speaker: steward
    speaker_name: "The notables of Palermo"
    speaker_title: "Come to your hall"
    benchmark_provinces: 1
    story: >-
      You are Hasan al-Samsam, and you are tired. Your reign has been long and not happy; the
      Fatimids, who named you, have lost their grip, and the Zirids in Africa have their own
      troubles. The island is full of strongmen who call themselves qa'ids and answer to
      nobody: Ibn al-Thumna at Syracuse and Catania, Ibn al-Hawwas at Castrogiovanni and
      Agrigento, and others elsewhere.


      The notables of Palermo come to you with a proposal. The qa'ids do not need an emir,
      they say, and an emir who cannot control the qa'ids is of no use to anyone. Better, they
      say, that the island be shared out by consent than fought over.
    choices:
      - label: "Share the island out and step down"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Within a few years the island is a patchwork of lordships, each with its own castle
          and its own war. The qa'ids fight each other, and Ibn al-Thumna, losing to Ibn
          al-Hawwas, will look for an ally beyond the sea. The Muslims of Sicily have not
          changed their faith, only forgotten they had a common cause.
        deeds: {ruler_falls: "is driven from power by the qa'ids"}
      - label: "Fight the qa'ids and keep the title"
        legitimacy_bp: 500
        unrest_bp: 2000
        wealth_bp: -1500
        outcome: >-
          You win one war and lose another. The qa'ids join together just long enough to force
          you out, and then fall out again.
      - label: "Ask Cairo for a governor"
        legitimacy_bp: -800
        outcome: >-
          Cairo is far away, and sends a letter.
    history: >-
      Hasan al-Samsam's rule ended around 1053, and Muslim Sicily broke into rival lordships,
      among them those of Ibn al-Thumna and Ibn al-Hawwas.
    sources: ["Ibn al-Athir, al-Kamil", "Amari, Storia dei musulmani di Sicilia", "Metcalfe, The Muslims of Medieval Italy (2009)"]

  - id: sic_thumna
    scenario: year_1000
    civ: sicily_emirate
    year: 1060
    title: "A Letter to Calabria"
    place: "Catania"
    speaker: general
    speaker_name: "A Norman knight"
    speaker_title: "Of Count Roger's household"
    benchmark_provinces: 1
    story: >-
      You are Muhammad ibn al-Thumna, whom the Latin writers call Betumen, lord of Syracuse
      and Catania. For years you have fought your brother-in-law Ibn al-Hawwas, who is the stronger, and who has beaten you in the field. Your pride is hurt and your cause is going badly.


      Across the Strait of Messina, the sons of Tancred de Hauteville have made themselves
      lords in Calabria. Robert Guiscard is the duke, and his younger brother Roger has less land than he wants. Your agents say they are the best horsemen in Europe, and that
      they are hungry.
    choices:
      - label: "Invite the Normans in as allies"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          You cross to Calabria and meet the brothers. In 1061 Roger lands near Messina with a
          few hundred knights and takes the city, and together you march inland. Roger sees how
          weak the island is. You will not live to see what he makes of it: you will be dead within a few years.
      - label: "Make peace with Ibn al-Hawwas"
        legitimacy_bp: -500
        outcome: >-
          Ibn al-Hawwas accepts, and you give up your claims. Within a year he has broken the
          treaty.
      - label: "Ask the Zirids of Ifriqiya for help"
        wealth_bp: -800
        outcome: >-
          The Zirid emir is fighting for his own life against the nomad tribes, and sends good wishes.
    history: >-
      In about 1060 Ibn al-Thumna appealed to Robert Guiscard and Roger de Hauteville; Roger
      crossed the strait in 1061 and took Messina, the beginning of the Norman conquest of
      Sicily. Ibn al-Thumna was dead within a few years.
    sources: ["Malaterra, De rebus gestis Rogerii 2", "Amatus of Montecassino, Ystoire de li Normant 5", "Ibn al-Athir, al-Kamil", "Loud, The Age of Robert Guiscard (2000)"]

  - id: sic_palermo
    scenario: year_1000
    civ: sicily_emirate
    year: 1072
    title: "The Fall of Palermo"
    place: "Palermo"
    speaker: general
    speaker_name: "Robert Guiscard"
    speaker_title: "Duke of Apulia and Calabria"
    benchmark_provinces: 1
    story: >-
      You are the emir of Palermo. Eleven years ago Roger de Hauteville crossed the strait;
      since then the Normans have taken Messina and much of the east and the interior, and have beaten the Muslim armies at Cerami. Last August they besieged Palermo by land and sea, and no help has come from Africa.


      It is January. Palermo is hungry. The great city of mosques and gardens is shut up behind its walls. Duke Robert's
      envoys offer terms: the city will keep its faith, its judges and its law, and the
      Normans will keep the fortress.
    choices:
      - label: "Surrender on terms"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        influence: {clergy: -1000}
        outcome: >-
          The Normans enter on 10 January 1072. They turn the cathedral mosque back into a
          church. The Muslims keep their law and courts, under their own qadi, and for a long
          time Arabic will be the language of the island's tax rolls. Roger will be count of
          Sicily; Duke Robert returns to Italy.
        deeds: {ruler_falls: "surrenders Palermo to Duke Robert"}
      - label: "Fight on through the winter"
        legitimacy_bp: 200
        unrest_bp: 2500
        outcome: >-
          The bread runs out. You hold out a few more weeks, and the terms are worse.
      - label: "Leave by ship for Ifriqiya"
        legitimacy_bp: -2000
        outcome: >-
          A boat carries you and a few hundred families to Africa. The city is left to be
          bargained over by its judges.
        deeds: {ruler_falls: "leaves for Africa"}
    history: >-
      Palermo, besieged since August 1071 by Robert Guiscard and Roger, fell on 10 January
      1072. The Muslims were allowed to keep their religion and laws.
    sources: ["Malaterra, De rebus gestis Rogerii 2", "Amatus of Montecassino, Ystoire de li Normant 6", "Ibn al-Athir, al-Kamil", "Metcalfe, The Muslims of Medieval Italy (2009)"]

  - id: sic_syracuse
    scenario: year_1000
    civ: sicily_emirate
    year: 1086
    title: "Benavert's Fleet"
    place: "Syracuse"
    speaker: general
    speaker_name: "Your admiral"
    speaker_title: "Of the fleet of Syracuse"
    benchmark_provinces: 1
    story: >-
      You are Ibn Abbad, whom the Latin writers call Benavert, emir of Syracuse and Noto.
      You are a sailor and a lord of some standing, and almost the last of the island's Muslim lords. Palermo fell fourteen years ago;
      Catania and Taormina have gone; Count Roger now holds most of the island.


      Roger is besieging Syracuse by land, and his son Jordan has brought the fleet to
      seal the harbour. You have your own ships, and a messenger who can slip through to
      Ifriqiya. Your council is divided between fighting at sea and holding the walls.
    choices:
      - label: "Take the fleet out and fight"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1500
        outcome: >-
          In the harbour battle your ships are overwhelmed, and Ibn Abbad dies in the fighting.
          Syracuse, which was once the capital of Greek Sicily, falls to the Normans, and
          Noto is left with the last emir.
        deeds: {ruler_falls: "dies in the sea fight off Syracuse"}
      - label: "Hold the walls and wait for Africa"
        legitimacy_bp: 600
        unrest_bp: 1000
        outcome: >-
          The ships from Africa do not come. You eat the last of the grain.
      - label: "Offer Roger tribute for Syracuse"
        wealth_bp: -2000
        legitimacy_bp: -800
        outcome: >-
          The count wants the city, not the tribute.
    history: >-
      Syracuse fell in 1086 after a siege by Roger and a sea fight in which its emir Benavert
      (Ibn Abbad) was killed; Agrigento and Castrogiovanni fell the next year.
    sources: ["Malaterra, De rebus gestis Rogerii 4", "Ibn al-Athir, al-Kamil", "Metcalfe, The Muslims of Medieval Italy (2009)"]

  - id: sic_noto
    scenario: year_1000
    civ: sicily_emirate
    year: 1090
    title: "The Last City"
    place: "Noto"
    speaker: steward
    speaker_name: "Your qadi"
    speaker_title: "Of the last Muslim city"
    benchmark_provinces: 1
    story: >-
      You are the emir of Noto, the last of the Muslim lords of Sicily. Of the old island of
      gardens, sugar and fleets, you hold one hill town and its fields. Everything else
      belongs to Count Roger, who is now rich in land, and moves among his Greek, Latin, and
      Muslim subjects as a lord of all three, and who has used Muslim soldiers in his own
      army.


      Roger is at your gates. He offers what he gave Palermo: life, faith, law. Your people are
      tired. The ships that might have crossed from Ifriqiya have not come, and it is not
      certain that there are any.
    choices:
      - label: "Surrender Noto on terms"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Noto capitulates in February 1091, and Malta submits not long after. The Muslims of
          Sicily will live under the Normans for another century and more, in the island's
          towns and as farmers in its hills, till the wars and deportations of the thirteenth century under Frederick II. But no Muslim prince will rule here again.
      - label: "Fight to the last"
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          The town falls anyway, and worse terms follow.
      - label: "Sail for Africa with those who will follow"
        legitimacy_bp: -1500
        outcome: >-
          A few shiploads of families go to Ifriqiya. The rest stay and make their own terms.
    history: >-
      Noto, the last Muslim stronghold, capitulated in February 1091, and Malta soon
      afterwards; Muslim rule in Sicily had lasted about two centuries. The Muslim population
      remained under Norman rule for generations.
    sources: ["Malaterra, De rebus gestis Rogerii 4", "Ibn al-Athir, al-Kamil", "Metcalfe, Muslims and Christians in Norman Sicily (2003)", "Brett, Muslims in the Norman Kingdom (2001)"]
