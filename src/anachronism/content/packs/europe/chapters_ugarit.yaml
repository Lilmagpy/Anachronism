schema_version: 1
# Chronicle mode (D-120, D-179): the kings of Ugarit, from Kadesh to the burning of the
# city, c. 1275-1185 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the tablets of Ugarit's archives in Akkadian and in the
# Ugaritic alphabet (RS numbers below), the Hittite treaties and edicts found there, and
# the Egyptian records of Kadesh, with modern work by Singer, Yon, Bryce, Pardee and Cline.
# Reign dates are approximate (Singer). Ugarit is one province throughout.
chapters:
  - id: uga_kadesh
    scenario: kadesh
    civ: ugarit
    year: -1275
    title: "Chariots for the Great King"
    place: "The palace of Ugarit"
    speaker: hatti
    speaker_name: "Muwatalli II"
    speaker_title: "Great King of Hatti, your overlord"
    needs_alive: [hatti, egypt]
    benchmark_provinces: 1
    story: >-
      You are Niqmepa, King of Ugarit, the richest port on the Syrian coast. Ships come to
      your harbour from Cyprus, Crete, Egypt and the Aegean; caravans from Mesopotamia; your
      merchants are rich enough to lend to kings. Your grandfather swore loyalty to the
      Hittite Great King, and your city has prospered under his protection.


      Now Muwatalli is gathering every vassal he has against Pharaoh Ramesses, who is
      marching north to retake Kadesh. He wants your chariots.
    choices:
      - label: "Send your chariots to Kadesh"
        historical: true
        legitimacy_bp: 1000
        materials_bp: -800
        outcome: >-
          The men of Ugarit fight at Kadesh among the Great King's allies, and Pharaoh's
          scribes list them by name in the temple inscriptions that claim his victory. Both
          sides claim to have won. Your chariots come home, most of them.
      - label: "Send gold instead of men"
        wealth_bp: -1000
        outcome: >-
          The Great King takes the gold, and notes that Ugarit's chariots stayed at home.
    history: >-
      Ugarit's troops fought on the Hittite side at Kadesh (1274 BC) and appear in Ramesses
      II's list of the Hittite allies.
    diverged: >-
      Hatti or Egypt is gone.
    sources: ["Kadesh inscriptions of Ramesses II (the Poem)", "Singer, 'A Political History of Ugarit' (1999)"]

  - id: uga_alphabet
    scenario: kadesh
    civ: ugarit
    year: -1266
    title: "Thirty Signs"
    place: "The house of a high priest, Ugarit"
    speaker: scholar
    speaker_name: "A master scribe"
    speaker_title: "Of the scribal school"
    benchmark_provinces: 1
    story: >-
      Your scribes learn Babylonian cuneiform, with its hundreds of signs, because every king
      from Egypt to Babylon writes his letters in it. It takes years.


      But in Ugarit, scribes have also learned to press just thirty wedge-signs into clay,
      one for each sound of your own language, in a fixed order that pupils chant: 'a, b, g,
      h, d...'. With them, a merchant or a priest can write anything. The master scribe asks
      whether the school should teach only the new signs.
    choices:
      - label: "Keep both scripts"
        historical: true
        knowledge_bp: 2000
        outcome: >-
          Letters to Great Kings stay in Babylonian. Everything else - accounts, contracts,
          prayers, the poems of Baal and of King Kirta - is written in your thirty signs. A
          schoolboy's tablet with the whole alphabet in order will be dug up in 1949, and the
          order is the one you learned at school: a, b, g, d.
      - label: "Write everything in the thirty signs"
        knowledge_bp: 3000
        legitimacy_bp: -500
        outcome: >-
          The foreign envoys complain they cannot read your letters. The merchants learn to
          write in a month.
    history: >-
      The Ugaritic cuneiform alphabet of thirty signs was used for local texts, including the
      Baal Cycle, alongside Akkadian; abecedary tablets show the same letter order as later
      alphabets.
    sources: ["Abecedary RS 12.063", "Pardee, The Ugaritic Texts and the Origins of West-Semitic Literary Composition (2012)"]

  - id: uga_divorce
    scenario: kadesh
    civ: ugarit
    year: -1245
    title: "The Great Lady's Sin"
    place: "Ugarit"
    speaker: amurru
    speaker_name: "Benteshina"
    speaker_title: "King of Amurru, your father-in-law"
    needs_alive: [amurru]
    benchmark_provinces: 1
    story: >-
      You are Ammistamru II. Your wife, the daughter of Benteshina of Amurru, has committed
      what the tablets call only a 'great sin' against you. You have divorced her, and she has
      fled home to her brother in Amurru.


      You want her back - to punish her. Amurru will not give her up. The Hittite Great King
      is the judge of all his vassals, and has agreed to hear the case.
    choices:
      - label: "Pay the Great King to have her sent back"
        historical: true
        wealth_bp: -2000
        legitimacy_bp: 500
        outcome: >-
          The Hittite court rules for you. You pay Amurru fourteen hundred shekels of gold for
          her, and your soldiers fetch her. The tablets do not say what happened next, and do
          not need to. Her sons by you are disinherited and sent away from Ugarit.
        deeds: {grudges: {amurru: 2000}}
      - label: "Let her stay in Amurru"
        legitimacy_bp: -1000
        outcome: >-
          She stays with her brother. The other kings of the coast say the King of Ugarit
          cannot keep order in his own house.
    history: >-
      Ammistamru II divorced the 'daughter of the great lady' of Amurru for a 'great sin'; Hittite
      edicts settled the case, and Ugarit paid 1,400 shekels of gold to have her extradited.
    diverged: >-
      Amurru is gone.
    sources: ["RS 17.159, RS 17.228, RS 17.372A (Hittite edicts)", "Singer, 'A Political History of Ugarit' (1999)"]

  - id: uga_exemption
    scenario: kadesh
    civ: ugarit
    year: -1236
    title: "Gold Instead of Soldiers"
    place: "Ugarit"
    speaker: hatti
    speaker_name: "Tudhaliya IV"
    speaker_title: "Great King of Hatti"
    needs_alive: [hatti, assyria]
    benchmark_provinces: 1
    story: >-
      The Great King is at war with Assyria. He has forbidden your merchants to trade with
      Assyria, and demands that Ugarit send its soldiers and chariots to the eastern front.


      Your soldiers are needed at home, and your merchants are needed at sea. The Great
      King's officials hint that a payment might excuse you.
    choices:
      - label: "Pay fifty minas of gold"
        historical: true
        wealth_bp: -2500
        legitimacy_bp: 500
        outcome: >-
          The Great King accepts. Ugarit is excused from his war with Assyria for as long as it
          lasts. He loses the battle at Nihriya, and his letters to you grow shorter and
          sharper.
      - label: "Send the army"
        materials_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your chariots march east. Your merchants wonder who will guard the harbour.
    history: >-
      A Hittite edict records that Ugarit paid fifty minas of gold to be released from
      military service in the Hittite war against Assyria, in Tudhaliya IV's reign.
    diverged: >-
      Hatti or Assyria is gone.
    sources: ["RS 17.59", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: uga_grain
    scenario: kadesh
    civ: ugarit
    year: -1215
    title: "A Matter of Life or Death"
    place: "Ugarit"
    speaker: hatti
    speaker_name: "The Great King's envoy"
    speaker_title: "From Hattusa"
    needs_alive: [hatti]
    benchmark_provinces: 1
    story: >-
      You are Niqmaddu III. Year after year the rains have failed in Anatolia, and the
      Hittite homeland is starving. The Great King's letters have grown frantic. The latest
      demands a ship and its crew to carry two thousand measures of grain from Mukish to Ura,
      the Hittite port in Cilicia, in one or at most two voyages. "It is a matter of life or
      death!"
    choices:
      - label: "Send the grain"
        historical: true
        food_bp: -2000
        legitimacy_bp: 1000
        outcome: >-
          Your ships carry grain to Ura. Pharaoh sends grain too, by sea. The Hittite empire is
          still standing. It is eating its seed corn.
      - label: "Keep the grain for Ugarit"
        food_bp: 1000
        legitimacy_bp: -1500
        outcome: >-
          You write back that there are no ships to spare. The next letter from Hattusa calls
          you 'my servant', and threatens.
        deeds: {grudges: {hatti: 2000}}
    history: >-
      Late Hittite letters to Ugarit demand urgent grain shipments to Ura during famine,
      calling it 'a matter of life or death' (RS 20.212).
    diverged: >-
      Hatti is gone.
    sources: ["RS 20.212", "Cline, 1177 BC (2014)", "Singer, 'A Political History of Ugarit' (1999)"]

  - id: uga_ships
    scenario: kadesh
    civ: ugarit
    year: -1185
    title: "The Enemy's Ships Came"
    place: "The palace of Ugarit"
    speaker: alashiya
    speaker_name: "Eshuwara"
    speaker_title: "Chief prefect of Alashiya (Cyprus)"
    benchmark_provinces: 1
    story: >-
      You are Ammurapi, the last king of Ugarit, though you do not know it. Your army and
      chariots are in the land of Hatti, where the Great King called them. Your ships are in
      the land of Lukka, on the south coast of Anatolia, where he sent them. Raiders from the
      sea have been seen up and down the coast.


      A letter has come from Cyprus: twenty enemy ships have been seen; watch out, gather
      your troops, build up your walls. You have almost nothing to gather.
    choices:
      - label: "Write to Cyprus for help"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          You write to the King of Alashiya: "My father, behold, the enemy's ships came; my
          cities were burned, and they did evil things in my country. Does not my father know
          that all my troops and chariots are in the land of Hatti, and all my ships in the
          land of Lukka?" Seven enemy ships have done it. Soon after, Ugarit burns, and is never
          rebuilt. Its archives lie under the ashes until a farmer's plough strikes a tomb in
          1928.
        deeds: {ruler_falls: "is lost when Ugarit burns"}
      - label: "Arm the merchants and man the walls"
        materials_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Every merchant's son is given a spear. When the ships come, the harbour is full of
          men, and they sail on to an easier town.
    history: >-
      Ugarit was destroyed around 1185 BC during the collapse of the Late Bronze Age; its
      last letters describe enemy ships while its army and fleet were away in Hittite service.
    sources: ["RS 20.238 (Ammurapi to the king of Alashiya)", "RS 20.18 (Eshuwara to the king of Ugarit)", "Cline, 1177 BC (2014)"]
