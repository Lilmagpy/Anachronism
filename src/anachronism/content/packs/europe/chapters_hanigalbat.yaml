schema_version: 1
# Chronicle mode (D-120, D-XXX): Hanigalbat (the remnant of Mitanni) under Assyrian pressure,
# 1275-1263 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the royal inscriptions of Adad-nirari I and Shalmaneser I
# (Grayson, Assyrian Royal Inscriptions I) with modern work by Harrak, Bryce and Radner. Only
# Assyrian sources survive for these events, so Hanigalbat's side is told through its enemies;
# Wasashatta's fate is not recorded, and the relationship of Shattuara II to Wasashatta is
# probable, not certain. The short span is honest: there is very little else to say.
# Hanigalbat is two provinces.
chapters:
  - id: han_gifts
    scenario: kadesh
    civ: hanigalbat
    year: -1275
    title: "Gifts for the Great King"
    place: "Taidu"
    speaker: general
    speaker_name: "Your commander on the Khabur"
    speaker_title: "Of the army of Hanigalbat"
    needs_alive: [assyria]
    benchmark_provinces: 2
    story: >-
      You are Wasashatta, king of Hanigalbat. A century ago your land was Mitanni, the
      chariot kingdom that Egypt and Hatti both courted. Your father Shattuara
      was forced to pay Assyria tribute, and now the Assyrian king Adad-nirari is back with an
      army.


      His army is in your land and your cities are falling one at a time. You can send to the Great King of Hatti, your old protector
      across the Euphrates, with gifts and a plea for help. Or you can swear to Assyria again.
    choices:
      - label: "Send gifts to Hatti and ask for help"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -1000
        outcome: >-
          The gifts go west. As far as the records show, no Hittite army comes. Adad-nirari
          takes your cities one by one, and puts a record of it on his own inscriptions: Taidu,
          Washukanni, Irridu and others. Your family is carried off to Assur.
        deeds: {peace_with: [assyria], ruler_falls: "is swept aside as Assyria takes his cities"}
      - label: "Swear to Assyria again and pay tribute"
        legitimacy_bp: -1000
        wealth_bp: -500
        outcome: >-
          You keep your throne, and Adad-nirari keeps your sons as hostages. Assyria's
          governors take their seats beside yours.
        deeds: {peace_with: [assyria]}
      - label: "Call up every man and defend the Khabur towns"
        legitimacy_bp: 500
        food_bp: -1000
        outcome: >-
          You summon the levies of the cities and the chariots of the steppe to the river. Your
          commanders say they will hold the fords as long as the bread lasts.
        deeds: {men: 6000}
    history: >-
      Adad-nirari I of Assyria crushed Wasashatta and annexed Hanigalbat's main cities, making
      the rest a tributary kingdom. Hatti did not come to Wasashatta's help in time.
    diverged: >-
      Assyria is gone.
    sources: ["Adad-nirari I, royal inscriptions (RIMA 1 A.0.76)", "Harrak, Assyria and Hanigalbat (1987)", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: han_thirst
    scenario: kadesh
    civ: hanigalbat
    year: -1263
    title: "Shattuara and the Thirsty Army"
    place: "The passes of Hanigalbat"
    speaker: steward
    speaker_name: "Your chief of the water-rights"
    speaker_title: "Keeper of the wells"
    needs_alive: [assyria]
    benchmark_provinces: 2
    story: >-
      You are Shattuara, king of Hanigalbat, who has sent gifts to Assyria every year of
      your reign. Adad-nirari is dead and his son Shalmaneser is new on the throne of
      Assur. Everyone knows that a new king must prove himself in war.


      You have a little time. Hittite and Aramean mercenaries are for hire, and the passes
      and wells of your dry country are yours to hold. An army that cannot drink cannot
      fight. But Assyria's army is larger than yours, and Shalmaneser is a king who writes
      down what he does.
    choices:
      - label: "Rebel, hiring Hittite and Aramean help"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Shalmaneser's army arrives thirsty and exhausted. He fights through anyway,
          and says that he destroyed nine of your fortified places and a hundred and eighty
          cities, and that he blinded fourteen thousand four hundred prisoners. Those numbers
          are Shalmaneser's own boast, and nobody else has recorded them. What is certain is
          that Hanigalbat does not rise again, and that Assyria has become a neighbour of Hatti.
        deeds: {grudges: {assyria: 3000}}
      - label: "Send tribute and swear loyalty to the new king"
        legitimacy_bp: -1000
        wealth_bp: -1000
        outcome: >-
          Shalmaneser accepts the tribute and keeps your sons. For the moment the passes are
          quiet.
        deeds: {peace_with: [assyria]}
      - label: "Fortify the wells and passes, and break no oath"
        legitimacy_bp: 1200
        outcome: >-
          You keep your oath to Assyria and make your country hard to cross: forts at the wells,
          guards on the passes. Shalmaneser is not told why.
        deeds: {men: 4000}
    history: >-
      Shalmaneser I (c. 1263 BC) crushed Shattuara of Hanigalbat, who had rebelled with
      Hittite and Ahlamu help, and annexed his land. Shalmaneser's inscription says he blinded
      14,400 prisoners; the figure is the king's own and cannot be checked.
    diverged: >-
      Assyria is gone.
    sources: ["Shalmaneser I, royal inscriptions (RIMA 1 A.0.77.1)", "Harrak, Assyria and Hanigalbat (1987)", "Radner, on Middle Assyrian deportation"]
