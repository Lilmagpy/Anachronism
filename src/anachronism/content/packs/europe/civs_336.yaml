schema_version: 1
# States new in 336 BC (the others come from civs_ancient.yaml).
civs:
  - id: persia
    name: Achaemenid Persia
    adjective: Persian
    lineage: persia
    colour: "#7d3c98"
    emblem: ΠΕΡ
    portrait: assyrian
    description: >-
      The largest empire the world has seen, from the Aegean to the Indus, ruled by the King of Kings from Susa and Persepolis.
  - id: thebes
    name: Thebes
    adjective: Theban
    lineage: thebes
    colour: "#1f618d"
    emblem: ΘΗΒ
    portrait: greek
    description: >-
      The city of Epaminondas, whose Sacred Band broke Sparta - and was destroyed by Philip at Chaeronea.
  - id: odrysians
    name: Odrysian Thrace
    adjective: Thracian
    lineage: odrysians
    colour: "#a04000"
    emblem: ODR
    portrait: steppe
    description: >-
      The kingdom of the Thracian horse-lords, rich in gold, now forced to pay tribute to Macedon.
  - id: illyrians
    name: Illyrians
    adjective: Illyrian
    lineage: illyrians
    colour: "#566573"
    emblem: ILL
    portrait: celtic
    description: >-
      Warlike hill peoples and pirates of the Adriatic, old enemies of Macedon's kings.
  - id: scythians
    name: Scythians
    adjective: Scythian
    lineage: scythians
    colour: "#b7950b"
    emblem: SKY
    portrait: steppe
    description: >-
      Horse archers of the Pontic steppe, buried in golden mounds.
