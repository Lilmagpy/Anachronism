schema_version: 1
# Chronicle mode (D-120, D-141): the dukes of Normandy, from Richard II to William the
# Conqueror, 1002-1087. Each chapter opens in its year; one choice is what history chose.
# Facts follow Dudo of Saint-Quentin, William of Jumièges, William of Poitiers (William's
# chaplain), Orderic Vitalis, the Anglo-Saxon Chronicle, the Bayeux Tapestry and Domesday
# Book, with modern work by Douglas, Bates and Morris. Norman writers flattered their dukes;
# Orderic, writing later, is fond of a deathbed speech. benchmark_provinces counts the
# provinces of this map the real dukes held at that date.
chapters:
  - id: nor_emma
    scenario: year_1000
    civ: normandy
    year: 1002
    title: "A Sister for England"
    place: "Rouen"
    speaker: england
    speaker_name: "Envoys of King Æthelred"
    speaker_title: "From England"
    needs_alive: [england]
    benchmark_provinces: 1
    story: >-
      Your grandfather's grandfather Rollo was a Viking chief; the King of the Franks gave
      him Rouen to stop him raiding up the Seine. A hundred years later your court speaks
      French and your monks copy Latin, but your harbours still welcome Danish fleets to sell
      their English plunder and refit for next year.


      King Æthelred of England wants that to stop. His envoys propose a marriage: your
      sister Emma, seventeen and very sharp, to be Queen of England.
    choices:
      - label: "Send Emma to England"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Emma sails for England and is crowned queen. Your harbours close to the Danes - most
          of the time. Her son Edward will grow up in your court, and her great-nephew will
          one day claim England through her.
        deeds: {ally_with: [england]}
      - label: "Keep the Danish trade, and build ships"
        wealth_bp: 1500
        legitimacy_bp: 500
        outcome: >-
          The Danish ships keep coming to Rouen to sell English silver and slaves, and you
          use the profits to lay down five ships of your own. England remembers.
        deeds: {ships: 5, grudges: {england: 2000}}
      - label: "Offer England a treaty, but keep your sister"
        legitimacy_bp: 600
        wealth_bp: 500
        outcome: >-
          Your envoys swear, as your father's did, not to shelter England's enemies, and
          Emma stays at Rouen. Æthelred is not satisfied, and the Danes are not turned away
          from your quays quite as firmly as he would like.
        deeds: {peace_with: [england]}
    history: >-
      Emma, daughter of Richard I and sister of Richard II of Normandy, married Æthelred II in
      1002. Through her, William claimed kinship with Edward the Confessor.
    diverged: >-
      England is gone; there is no one to marry.
    sources: ["Anglo-Saxon Chronicle 1002", "William of Jumièges 5.4"]

  - id: nor_exiles
    scenario: year_1000
    civ: normandy
    year: 1013
    title: "Guests from England"
    place: "Rouen"
    speaker: steward
    speaker_name: "Queen Emma"
    speaker_title: "Your sister, Queen of England"
    benchmark_provinces: 1
    story: >-
      Sweyn Forkbeard of Denmark has conquered England. Your sister Emma has fled across the
      Channel with her two young sons, Edward and Alfred, and King Æthelred himself is on his
      way.


      Sweyn's envoys have come too. Normandy, they point out, has always been a friend to the
      Danes.
    choices:
      - label: "Take them in, all of them"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The English royal family lives at your court. Æthelred goes home the next year when
          Sweyn dies; the boys Edward and Alfred stay with you, and grow up Normans.
        deeds: {grudges: {denmark: 1500}}
      - label: "Send them on to Flanders"
        legitimacy_bp: 400
        wealth_bp: 800
        outcome: >-
          Emma never forgives you. The Danes send gifts.
      - label: "Shelter the queen and her sons, but not the king"
        legitimacy_bp: 700
        unrest_bp: 200
        outcome: >-
          Emma and the boys are given rooms at Rouen. Æthelred is lodged at the monastery of
          Fécamp, out of the way, and treated with courtesy and no great warmth. The Danes
          note that the exiled king is only half welcome.
    history: >-
      In 1013 Emma, her sons and then Æthelred took refuge with Richard II in Normandy.
      Edward the Confessor spent most of the next 28 years in Normandy.
    sources: ["Anglo-Saxon Chronicle 1013", "William of Jumièges 5.7"]

  - id: nor_herleva
    scenario: year_1000
    civ: normandy
    year: 1028
    title: "The Tanner's Daughter"
    place: "Falaise"
    speaker: steward
    speaker_name: "Your chamberlain"
    speaker_title: "At the castle of Falaise"
    benchmark_provinces: 1
    story: >-
      Your brother Richard III is dead after a year as duke - poisoned, some say, and some
      look at you when they say it. You are Duke Robert now.


      At Falaise, the story goes, you saw a girl washing hides in the stream below the
      castle: Herleva, daughter of a tanner. You want her. Your chamberlain points out that
      a duke's heir should be born to a noble wife in a church wedding, and that the barons
      laugh at tanners.
    choices:
      - label: "Bring Herleva to the castle"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Herleva rides in through the main gate, not the back door, the legend says, dressed
          in her best. Within the year she gives you a son. You name him William. His enemies
          will call him William the Bastard all his life, and hang hides on their walls to
          mock him.
      - label: "Marry for an alliance instead"
        legitimacy_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          You marry a sister of the King of the English, Cnut. It does not last. You have no
          son.
      - label: "Keep Herleva quietly at Falaise, and marry later"
        legitimacy_bp: 200
        unrest_bp: 300
        outcome: >-
          Herleva is lodged in a house below the castle, and the court pretends not to know
          her name. A noble marriage is promised for later, and the barons, who like promises,
          wait.
    history: >-
      Robert I became duke in 1027 after the sudden death of Richard III. His son William was
      born at Falaise around 1028 to Herleva, a tanner's (or embalmer's) daughter.
    sources: ["Orderic Vitalis, Interpolations in William of Jumièges", "Bates, William the Conqueror (2016)"]

  - id: nor_pilgrim
    scenario: year_1000
    civ: normandy
    year: 1034
    title: "The Road to Jerusalem"
    place: "Fécamp"
    speaker: steward
    speaker_name: "Archbishop Robert of Rouen"
    speaker_title: "Your uncle"
    benchmark_provinces: 1
    story: >-
      You want to go on pilgrimage to Jerusalem, barefoot, to atone for your sins - and some
      say for your brother's death. Your barons are horrified: you have no legitimate son.
      You have only William, the tanner's daughter's boy, who is seven.


      You have summoned them to Fécamp to swear to William as your heir before you go.
    choices:
      - label: "Make them swear to the boy, and go"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          The barons swear, unwillingly. You reach Jerusalem, and on the way home you die at
          Nicaea, in the summer of 1035. Normandy has a seven-year-old bastard for a duke,
          and the barons begin to build castles.
      - label: "Stay at home, and marry"
        legitimacy_bp: 600
        unrest_bp: 400
        outcome: >-
          The pilgrimage is put off. Your barons are relieved; your confessor is not.
      - label: "Send a bishop to Jerusalem in your place"
        legitimacy_bp: 400
        wealth_bp: -600
        outcome: >-
          A bishop and a train of monks set out for the Holy Sepulchre with your gifts and a
          great store of candles. Your barons are glad that you have stayed, and your
          confessor is not wholly satisfied.
    history: >-
      Robert I named William his heir before going on pilgrimage in 1034/5 and died at Nicaea
      in July 1035. William's minority was violent: three of his guardians were murdered.
    sources: ["William of Jumièges 6.11-12"]

  - id: nor_val_es_dunes
    scenario: year_1000
    civ: normandy
    year: 1047
    title: "Val-ès-Dunes"
    place: "The plain south-east of Caen"
    speaker: general
    speaker_name: "King Henry I of France"
    speaker_title: "Your overlord"
    needs_alive: [france]
    benchmark_provinces: 1
    story: >-
      You are nineteen. Your childhood was a nightmare of murder: your guardian Gilbert of
      Brionne cut down while riding, your steward Osbern killed in the room where you slept.
      Now the barons of western Normandy, under your cousin Guy of Burgundy, have risen to
      depose you; you escaped from Valognes at night, riding alone across the bay at low
      tide.


      King Henry of France has come to help you - for a price, no doubt. The rebel army is on
      the plain of Val-ès-Dunes.
    choices:
      - label: "Fight beside the king"
        historical: true
        legitimacy_bp: 2500
        unrest_bp: -2000
        influence: {nobility: -1000}
        outcome: >-
          The rebel army breaks and is driven into the river Orne, where so many drown that the
          mills downstream are said to be choked with bodies. You knock down the rebels'
          castles and proclaim the Truce of God. From now on, Normandy is yours.
        deeds: {ally_with: [france]}
      - label: "Buy off the rebels"
        wealth_bp: -2000
        legitimacy_bp: -500
        outcome: >-
          The rebels take your silver and go home. They will be back.
      - label: "Meet them with the loyal barons, without the king"
        legitimacy_bp: 2500
        unrest_bp: -1800
        wealth_bp: -300
        outcome: >-
          You gather the barons of eastern Normandy and the levy of the Bessin. The fight
          is hard, and the king, who has come to help you, is left to watch. You win it
          yourself, but you cannot say that Normandy owes France nothing.
        deeds: {men: 8000}
    history: >-
      In 1047 William and Henry I of France defeated the Norman rebels at Val-ès-Dunes,
      William's first battle, which established his rule.
    diverged: >-
      France is gone, and no king comes to help.
    sources: ["William of Poitiers 1.8-9", "Wace, Roman de Rou"]

  - id: nor_matilda
    scenario: year_1000
    civ: normandy
    year: 1050
    title: "Matilda of Flanders"
    place: "Eu"
    speaker: diviner
    speaker_name: "Lanfranc of Pavia"
    speaker_title: "Prior of Le Bec"
    benchmark_provinces: 1
    story: >-
      You want to marry Matilda, daughter of the Count of Flanders, granddaughter of a King
      of France. She is tiny - a little over four feet tall - and proud. The story goes that
      she said she would rather be a nun than marry a bastard, and that you rode to Bruges,
      pulled her off her horse by her braids and rode away; and that she then said she would
      marry no one else.


      The Pope has forbidden the marriage: you are too closely related. Lanfranc, the brilliant
      Italian prior of Le Bec, has criticised it publicly. You have ordered him exiled.
    choices:
      - label: "Marry her anyway"
        historical: true
        legitimacy_bp: 1000
        influence: {clergy: -1500}
        outcome: >-
          You marry Matilda at Eu. Lanfranc, on his way into exile on a lame horse, meets you
          on the road; you laugh, and he goes to Rome to argue your case instead. The Pope
          lifts the ban in 1059 on condition that you each found an abbey: the Abbaye aux
          Hommes and the Abbaye aux Dames at Caen.
        deeds: {martial_bp: 500}
      - label: "Obey the Pope, and seek a bride in France"
        influence: {clergy: 1500}
        legitimacy_bp: 500
        outcome: >-
          You look elsewhere for a wife, and write to the French court. Flanders makes its
          alliance with France instead.
        deeds: {peace_with: [france]}
      - label: "Marry her, and send gifts to Rome to ask pardon"
        legitimacy_bp: 900
        influence: {clergy: -500}
        wealth_bp: -600
        outcome: >-
          You marry Matilda at Eu and send silver and relics to the Pope with a humble letter.
          Rome's answer is slow, and the bishops who dislike the match are only half
          appeased.
    history: >-
      William married Matilda of Flanders around 1050-51 despite a papal prohibition; it was
      lifted in 1059, and the couple founded the two great abbeys at Caen in penance.
      Lanfranc became William's closest adviser.
    sources: ["William of Jumièges 7.21", "Chronicle of Tours", "Bates (2016)"]

  - id: nor_mortemer
    scenario: year_1000
    civ: normandy
    year: 1054
    title: "Mortemer"
    place: "Eastern Normandy"
    speaker: general
    speaker_name: "Roger of Mortemer"
    speaker_title: "Your captain in the east"
    needs_alive: [france]
    benchmark_provinces: 1
    story: >-
      King Henry of France, who helped you at Val-ès-Dunes, has decided you have grown too
      strong. He has invaded Normandy with two armies, one north and one south of the Seine.


      Your captains in the east report that the northern French army has camped at
      Mortemer, and spent the night drinking and looting.
    choices:
      - label: "Surround the camp at dawn and burn it"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your men fall on the camp at dawn and fight until afternoon. The French army is
          destroyed. You send a herald up a tree outside the king's camp in the night to shout
          the news. Henry goes home. Three years later he tries again, and you catch his army
          half across the ford at Varaville as the tide comes in. After that, he leaves you
          alone.
        deeds: {men: 6000, grudges: {france: 2000}}
      - label: "Make peace with the king"
        legitimacy_bp: -800
        outcome: >-
          You give up a border castle and kneel. The king goes home pleased with himself.
        deeds: {grudges: {france: 500}}
      - label: "Hold the fords and wait for the king to cross"
        legitimacy_bp: 1800
        wealth_bp: -200
        outcome: >-
          You leave the northern army to its drinking and hold the crossings of the Seine in
          strength. The king's southern army is stopped, and his northern one goes home
          without the glory of a fight.
        deeds: {men: 4000}
    history: >-
      In 1054 William's men destroyed a French army at Mortemer; in 1057 he beat Henry I again
      at Varaville. Normandy became effectively independent of the French crown.
    diverged: >-
      France is gone.
    sources: ["William of Poitiers 1.29-34", "Orderic Vitalis"]

  - id: nor_fleet
    scenario: year_1000
    civ: normandy
    year: 1066
    title: "The Fleet at Dives"
    place: "The mouth of the Dives"
    speaker: diviner
    speaker_name: "Lanfranc"
    speaker_title: "Abbot of Saint-Étienne, Caen"
    needs_alive: [england]
    benchmark_provinces: 1
    story: >-
      King Edward of England is dead, and Harold Godwinson had himself crowned the same day -
      Harold, who swore on holy relics at Bayeux to support your claim. You have sent
      Lanfranc's friends to Rome, and the Pope has sent you a blessed banner.


      Now you are building a fleet - seven hundred ships, carpenters cutting trees all over
      Normandy - to carry seven thousand men and three thousand horses across the Channel.
      Nothing like it has been tried since the Romans. Your barons ask whether it is madness.
    choices:
      - label: "Build the fleet, and wait for the wind"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -3000
        outcome: >-
          The ships gather at the mouth of the Dives in August, and the wind blows from the
          north for six weeks. You move to Saint-Valery and pray. Then, on the twenty-seventh
          of September, the wind turns south - two days after Harold has beaten the
          Norwegians at Stamford Bridge, two hundred miles to the north. You land at Pevensey
          unopposed. Stepping ashore, you trip and fall on your face; you get up with your
          hands full of sand: 'I have taken England in both hands.'
        deeds: {ships: 150, men: 10000, war_with: [england]}
      - label: "Press your claim by embassy, and wait for Harold to make a mistake"
        legitimacy_bp: -500
        outcome: >-
          Your envoys go to Westminster. Harold sends them back with gifts and a refusal.
        deeds: {grudges: {england: 2000}}
      - label: "Ask the Danes to share the venture"
        legitimacy_bp: 1200
        wealth_bp: -1500
        outcome: >-
          Your envoys go to Denmark, where King Sweyn has his own quarrel with England. He
          promises ships, though not as many as you hoped and not for nothing; the Norman
          shipwrights build a smaller fleet of their own.
        deeds: {ships: 60, men: 5000}
    history: >-
      William assembled his invasion fleet at Dives-sur-Mer in summer 1066, moved to
      Saint-Valery-sur-Somme, and landed at Pevensey on 28 September. The 'both hands' story is
      told by William of Malmesbury and Wace.
    diverged: >-
      England is gone; there is no crown to claim.
    sources: ["William of Poitiers 2.1-8", "Ship list of William the Conqueror", "Bayeux Tapestry"]

  - id: nor_hastings
    scenario: year_1000
    civ: normandy
    year: 1066
    after: [nor_fleet]
    title: "The Shield Wall"
    place: "Senlac Hill, near Hastings"
    speaker: general
    speaker_name: "Odo"
    speaker_title: "Bishop of Bayeux, your half-brother"
    needs_war_with: [england]
    benchmark_provinces: 4
    story: >-
      Harold has come south faster than anyone thought possible and drawn up his army on a
      ridge: a wall of shields, housecarls with great two-handed axes, and the levies of the
      southern shires behind. Your archers and knights have been attacking it since nine in
      the morning, and it has not moved.


      A rumour has run through your Breton troops on the left that you are dead, and they are
      running.
    choices:
      - label: "Ride to the wavering left and rally it"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          You ride along the line bareheaded: 'Look at me! I am alive, and with God's help I
          will win.' The English who chased the fleeing Bretons down the hill are cut off and
          killed. Twice more your knights pretend to flee, and twice more the English follow.
          At dusk Harold falls, and the shield wall breaks. On Christmas Day you are crowned
          King of England in Westminster Abbey.
        deeds: {take: [m_wessex, m_east_anglia, m_mercia]}
      - label: "Fall back to the ships and try again tomorrow"
        legitimacy_bp: -1500
        outcome: >-
          The army retreats to Hastings. Harold's levies keep arriving.
      - label: "Order a feigned retreat on the right"
        legitimacy_bp: 2800
        unrest_bp: 200
        outcome: >-
          Your knights on the right turn their horses and gallop back in seeming flight. The
          English break ranks to chase them, and the knights wheel and cut them down on the
          open slope. The shield wall is thinner after it.
        deeds: {martial_bp: 300}
    history: >-
      At Hastings on 14 October 1066 the Normans broke the English shield wall after a day of
      fighting, helped by real or feigned flights. Harold was killed. William was crowned on
      25 December 1066.
    diverged: >-
      The war with England has ended another way.
    sources: ["William of Poitiers 2.15-25", "Bayeux Tapestry", "Anglo-Saxon Chronicle 1066"]

  - id: nor_harrying
    scenario: year_1000
    civ: normandy
    year: 1069
    title: "The North Rises"
    place: "York"
    speaker: general
    speaker_name: "William fitz Osbern"
    speaker_title: "Your oldest friend"
    benchmark_provinces: 4
    story: >-
      The north of England has risen, with a Danish fleet and the young ætheling Edgar. They
      have stormed York and killed your garrison - three thousand men, the chroniclers say.
      This is the third revolt in three years.


      You have retaken York. Now you must decide what to do with the north.
    choices:
      - label: "Lay it waste, so that it can never rise again"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 2500
        food_bp: -2000
        outcome: >-
          All winter your soldiers move through Yorkshire burning crops, seed corn, ploughs and
          cattle. Tens of thousands starve; people sell themselves into slavery for food. Twenty
          years later your own surveyors will write 'waste' beside village after village. On
          his deathbed, Orderic will have you say you regret it.
        deeds: {take: [m_northumbria]}
      - label: "Pardon the rebels, and govern through English lords"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          The northern earls swear to you again. They have sworn before.
        deeds: {take: [m_northumbria]}
      - label: "Garrison the north with castles and Norman lords"
        legitimacy_bp: 700
        wealth_bp: -800
        unrest_bp: 1000
        outcome: >-
          Castles go up at York, Lincoln and Nottingham, and Norman knights are given the
          lands of the northern lords who have fallen. The north is held, at a cost, by
          strangers who do not speak its language.
        deeds: {take: [m_northumbria], men: 4000}
    history: >-
      In the winter of 1069-70 William's 'Harrying of the North' devastated Yorkshire; Domesday
      Book records much of it as waste in 1086.
    sources: ["Orderic Vitalis 4", "Domesday Book, Yorkshire"]

  - id: nor_domesday
    scenario: year_1000
    civ: normandy
    year: 1085
    title: "The Great Survey"
    place: "Gloucester, at Christmas"
    speaker: steward
    speaker_name: "Your chancellor"
    speaker_title: "Keeper of the royal seal"
    benchmark_provinces: 5
    story: >-
      A Danish invasion threatened this summer, and you had to billet a great army of
      mercenaries on England. It made you wonder exactly what England has, and who holds it.


      Your council has 'very deep speech' with you at Gloucester. Your chancellor proposes
      sending commissioners into every shire to find out how much land each man holds, how
      many ploughs, mills, fishponds, pigs and people there are on it - and what it was worth
      when King Edward was alive.
    choices:
      - label: "Send the commissioners"
        historical: true
        knowledge_bp: 2000
        wealth_bp: 2000
        unrest_bp: 800
        outcome: >-
          Within a year the whole of England is written down: thirteen thousand places. 'There
          was not a single hide nor an ox nor a pig left out,' the English chronicler writes
          bitterly. The English call it Domesday Book, because there is no appeal against it,
          as at the Last Judgement. It will be consulted in law courts for nine hundred years.
      - label: "Trust the sheriffs' old lists"
        wealth_bp: 300
        legitimacy_bp: -300
        outcome: >-
          The sheriffs send in what they always send. Nobody really knows what England is
          worth.
      - label: "✦ Print the survey, and send every lord his own entry"
        needs_adopted: [printing_press]
        knowledge_bp: 3000
        wealth_bp: 3000
        legitimacy_bp: 800
        outcome: >-
          The survey is set in type and printed. Every landholder receives a copy of what he
          owes; every dispute is settled from the same page. Your clerks are astonished at how
          quickly the taxes come in.
      - label: "Make every landholder swear fealty, and list only the greatest"
        knowledge_bp: 1200
        wealth_bp: 1500
        legitimacy_bp: 600
        outcome: >-
          Every man of any consequence is called to Salisbury to swear to be faithful to you
          against all other men, and your clerks write down the tenants-in-chief and what
          they hold. The lesser tenants and their ploughs go unwritten.
    history: >-
      William ordered the Domesday survey at Gloucester at Christmas 1085; it was compiled in
      1086. It remains the most complete record of any medieval European kingdom.
    sources: ["Anglo-Saxon Chronicle 1085", "Domesday Book (National Archives)"]

  - id: nor_mantes
    scenario: year_1000
    civ: normandy
    year: 1086
    title: "The Fire at Mantes"
    place: "Rouen"
    speaker: steward
    speaker_name: "Robert Curthose"
    speaker_title: "Your eldest son"
    benchmark_provinces: 5
    story: >-
      You are fat now: the King of France joked that you look pregnant, and you swore to light
      a hundred thousand candles at your churching. You burned Mantes in answer, and as you
      rode through the burning town your horse stumbled on the embers, and the pommel of
      the saddle drove into your belly.


      You are dying at Rouen. Your eldest son Robert, nicknamed Curthose, 'short boots', has
      rebelled against you twice. Your second son William Rufus is loyal, loud and clever.
      Your youngest, Henry, is twenty.
    choices:
      - label: "Divide Normandy, England and the silver"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          Robert gets Normandy because it was promised; William Rufus sails for England with
          your letter to Lanfranc before you are dead. Henry weighs his five thousand pounds of
          silver. At your funeral at Caen, a man claims the grave was dug on land you stole
          from his father; the body is too large for the stone coffin, and bursts.
      - label: "Everything to William Rufus, who is loyal"
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          Robert Curthose raises the Norman barons the day after the funeral. Your sons will
          fight over your bones.
      - label: "Everything to Robert, as the eldest son"
        legitimacy_bp: 600
        unrest_bp: 1200
        outcome: >-
          Robert, the eldest, is named heir of Normandy and England together, as custom
          would have it. William Rufus is bitter, and the English barons doubt a duke who
          has rebelled so often, but nobody has broken the custom.
    history: >-
      William was injured at Mantes in July 1087 and died at Rouen on 9 September. He left
      Normandy to Robert and England to William II Rufus; Henry later took both.
    sources: ["Orderic Vitalis 7.14-16", "Anglo-Saxon Chronicle 1087"]
