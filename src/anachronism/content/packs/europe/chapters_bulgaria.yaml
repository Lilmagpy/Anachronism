schema_version: 1
# Chronicle mode (D-120, D-XXX): the Bulgarian empire of Tsar Samuel, 1000-1018. Each
# chapter opens in its year; one choice is what history chose (historical: true). Facts follow
# the History of John Skylitzes (the main source, written some sixty years later and hostile
# to Samuel), the Chronicle of Yahya of Antioch, the Life of Saint Naum, the Bulgarian
# Apocryphal Chronicle (used with care) and the Greek inscription on Samuel's own stone from
# Prespa, with modern work by Stephenson, Holmes, Treadgold, Fine and Curta. Samuel's age and
# those of his son and nephew are approximate; the dates of Vidin, Skopje and Pernik are
# those of Skylitzes and some are disputed by a year or two. benchmark_provinces counts the
# provinces of this map the real Bulgarian tsars held at that date.
chapters:
  - id: bul_pliska
    scenario: year_1000
    civ: bulgaria
    year: 1000
    title: "The Old Capital"
    place: "Prespa"
    speaker: general
    speaker_name: "Gavril Radomir"
    speaker_title: "Your son, commander of the army"
    benchmark_provinces: 1
    story: >-
      You are Samuel, tsar of the Bulgarians. You came to the throne after your brothers died,
      and you are the real power in a land that once stretched from the Black Sea to the
      Adriatic. Your capital is in the mountains of the west, at Prespa and Ohrid, among the
      lakes. The old Bulgarian heartland, with the first capitals of Pliska and Preslav,
      lies in the east beyond the Balkan range, close to the emperor.


      Basil II has stopped fighting the Fatimids and turned on you. His generals have marched
      through the passes with a great army. Your son and your captains argue over where the
      army should stand: in the east, before the old cities, or in the western hills.
    choices:
      - label: "Hold the west, give up the old cities"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Pliska, Great Preslav and Little Preslav go over to the Greeks without a decisive
          battle. The eastern lands, which had been ruled by Bulgarian tsars for three
          hundred years, are lost, and Greek garrisons settle in the old palaces. Your army is
          whole, and it is in the hills, where the emperor's heavy horsemen are worth less.
        deeds: {give: [m_moesia], give_to: byzantium, martial_bp: 500}
      - label: "Meet Basil's army before Preslav"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The great army of Bulgaria meets Basil's veterans in the open. Samuel's best men
          are lost, and with them the hope of winning a pitched battle.
        deeds: {martial_bp: -1500}
      - label: "Garrison Preslav, keep the army west"
        unrest_bp: 300
        legitimacy_bp: 200
        outcome: >-
          A strong garrison shuts itself inside Preslav while the rest of the army stays in the
          hills. The garrison holds for a season, but nobody can come to its help.
        deeds: {men: 4000, martial_bp: -500}
    history: >-
      In 1000-1001 Basil II's generals Theodorokanos and Nikephoros Xiphias recaptured Great
      Preslav, Pliska and Little Preslav; Samuel's power remained in the west.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 21-22", "Stephenson, Byzantium's Balkan Frontier (2000)", "Fine, The Early Medieval Balkans (1983)"]

  - id: bul_vidin
    scenario: year_1000
    civ: bulgaria
    year: 1002
    title: "Vidin"
    place: "Prespa"
    speaker: steward
    speaker_name: "Your chancellor"
    speaker_title: "Keeper of the royal seal"
    benchmark_provinces: 1
    story: >-
      You are Samuel. Basil II has fought his way down the Danube and laid siege to Vidin, the
      fortress on the river. The city has held out for months, and the emperor intends to
      starve it, however long it takes. Your army cannot beat his in the open field.


      The emperor has left his own cities poorly defended. There is a great fair at Adrianople
      at Pentecost, and your scouts say it is poorly guarded.
    choices:
      - label: "Raid the Adrianople Pentecost fair"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 500
        outcome: >-
          Your horsemen plunder the Pentecost fair at Adrianople and bring back a great train
          of captives and carts. Basil does not turn back. Vidin holds for eight months and is
          starved into surrender, and the emperor marches south to hunt you down.
        deeds: {martial_bp: 500}
      - label: "March to relieve the siege of Vidin"
        wealth_bp: 2200
        outcome: >-
          Your army meets the emperor's in a bloody battle. You take his baggage train, with its
          stores and silver, but lose heavily, and Vidin falls anyway.
        deeds: {martial_bp: -1000}
      - label: "Offer Basil a truce through the bishops"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Basil will accept nothing short of submission, and your own nobles do not forgive you
          for asking.
    history: >-
      In 1002-03 Samuel raided Adrianople while Basil II besieged Vidin; Vidin fell after about
      eight months and Basil turned on Samuel's Macedonian heartland.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 26-27", "Stephenson, Byzantium's Balkan Frontier (2000)"]

  - id: bul_skopje
    scenario: year_1000
    civ: bulgaria
    year: 1004
    title: "The Flooded River"
    place: "Skopje"
    speaker: general
    speaker_name: "Gavril Radomir"
    speaker_title: "Your son"
    benchmark_provinces: 1
    story: >-
      You are Samuel. Basil II is marching on Skopje, the great fortress on the upper Vardar,
      with a large army. You have camped on the far bank of the Vardar, which is high with rain
      and, you are sure, too deep for the emperor's heavy cavalry to ford.


      Your son wants a stronger watch on the river. Your captains say the flood is guard
      enough, and the men need rest.
    choices:
      - label: "Keep the camp across the river"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          The emperor's scouts find a ford. His cavalry cross in the night and fall on your
          sleeping camp. You and your son are both wounded, and escape only because Gavril
          carries you from the field. Skopje surrenders, and the Greeks take a great deal of
          booty, including your treasure. Basil then marches off with the stronghold's
          commander made a patrician.
      - label: "Withdraw to the mountains at once"
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          Skopje falls anyway, but your army is whole and Basil has nobody to fight in the
          hills.
      - label: "Post pickets at every ford"
        legitimacy_bp: -800
        unrest_bp: 300
        outcome: >-
          Pickets watch every ford for miles, and your army is strung out along the bank. When
          the emperor crosses, no one has the whole force in hand. Skopje falls, but you and your
          son escape unhurt.
        deeds: {martial_bp: 300}
    history: >-
      In 1004 Basil II crossed the swollen Vardar and surprised Samuel's army outside Skopje;
      Samuel and his son were wounded, and the city surrendered.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 28-29", "Stephenson, Byzantium's Balkan Frontier (2000)"]

  - id: bul_ashot
    scenario: year_1000
    civ: bulgaria
    year: 1005
    title: "The Son-in-Law"
    place: "Dyrrachium"
    speaker: ruler
    speaker_name: "Miroslava"
    speaker_title: "Your daughter"
    benchmark_provinces: 1
    story: >-
      You are Samuel. Years ago you ambushed the Byzantine governor of Thessalonica, Gregory
      Taronites, and took his son Ashot, an Armenian prince, alive. Your daughter Miroslava
      has fallen in love with the prisoner and says she will have no other husband.


      Ashot says he is loyal to you now. Dyrrachium, on the Adriatic, is the finest port you
      still hold, and it needs a governor you can trust.
    choices:
      - label: "Wed them and give Ashot Dyrrachium"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Within a short time Ashot and Miroslava escape with their ships to Constantinople, and
          Dyrrachium is handed to the emperor. The story goes that Ashot only pretended to be
          loyal. You have lost your only port on the Adriatic.
        deeds: {grudges: {byzantium: 500}}
      - label: "Hold Ashot under guard at Prespa"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Your daughter will not forgive you. Dyrrachium has a Bulgarian governor, but he is
          not a clever one.
      - label: "Ransom Ashot to his father"
        wealth_bp: 2000
        legitimacy_bp: 200
        outcome: >-
          Gregory Taronites pays a heavy ransom and takes his son home. Miroslava weeps and will
          not speak to you. Dyrrachium still needs a governor, and you choose a local man.
    history: >-
      In 1005 Ashot Taronites, Samuel's Armenian son-in-law, fled with his wife Miroslava to
      Constantinople and delivered Dyrrachium to Basil II.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 29", "Yahya of Antioch, Histoire (ed. Kratchkovsky and Vasiliev)"]

  - id: bul_kleidion
    scenario: year_1000
    civ: bulgaria
    year: 1014
    title: "The Wall at Kleidion"
    place: "The Belasitsa mountains"
    speaker: general
    speaker_name: "Gavril Radomir"
    speaker_title: "Your son"
    benchmark_provinces: 1
    story: >-
      You are Samuel, and you are an old man. For years you have fought Basil's armies every
      summer. Now he has come again, down the Strumica valley towards your lands.
      You have built a wall across the narrow pass of Kleidion, the Key, and manned it with
      your army. For weeks the emperor's attacks have failed.


      The Greeks have sent a column to find a way around. Their commander, Nikephoros Xiphias,
      is said to be looking for a goat track over the Belasitsa mountains.
    choices:
      - label: "Hold the wall and watch the heights"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          On 29 July 1014 Xiphias comes down behind the wall, while the emperor attacks from
          the front. Your army breaks, and you escape thanks to your son. Skylitzes says that
          about fifteen thousand men were taken prisoner, and that Basil blinded them all, except
          one man in every hundred, who kept one eye to lead the others home. When the column of
          blind men reaches you at Prespa, you are struck down, and you die on 6 October. They
          will call Basil 'the Bulgar-slayer'.
        deeds: {martial_bp: -3000}
      - label: "Abandon the pass, and fall back on your fortresses"
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          The emperor takes the pass, and nobody is blinded. You are tracked through the
          mountains for another winter.
      - label: "Attack Basil's camp before he finds a way round"
        legitimacy_bp: -2000
        unrest_bp: 800
        outcome: >-
          Your men cannot take the fortified camp, and you are beaten at the pass.
        deeds: {martial_bp: -1500}
    history: >-
      On 29 July 1014 Nikephoros Xiphias took Samuel's army in the rear at Kleidion; Skylitzes
      reports that 15,000 prisoners were blinded (a figure that may be inflated), and Samuel
      died at Prespa on 6 October 1014.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 35", "Stephenson, The Legend of Basil the Bulgar-Slayer (2003)", "Fine, The Early Medieval Balkans (1983)"]

  - id: bul_radomir
    scenario: year_1000
    civ: bulgaria
    year: 1015
    title: "The Hunt"
    place: "Lake Ostrovo"
    speaker: general
    speaker_name: "A hunter of the court"
    speaker_title: "Who has heard talk in the camp"
    benchmark_provinces: 1
    story: >-
      You are Gavril Radomir, Samuel's son, tsar after him. You are a brave soldier, and
      you have beaten the Greeks at Thessalonica this year. Your father had your cousin Aron
      killed with his wife and children for treachery, and you begged for the life of Aron's
      son, Ivan Vladislav, and your father spared him.


      Ivan now serves in your army. Your hunters warn you that Ivan is plotting, and that he
      has been seen talking to Greeks. He has invited you to hunt in the forests near Lake
      Ostrovo.
    choices:
      - label: "Accept Ivan's invitation to the hunt"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          In the forest, your cousin falls on you and stabs you. Ivan Vladislav takes the crown,
          and your wife and your army's captains swear fealty to him. Basil, who has been
          corresponding with him, says he will accept his submission.
        deeds: {ruler_falls: "is murdered by his cousin Ivan"}
      - label: "Have Ivan Vladislav arrested"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Ivan's friends among the nobles are alarmed, and Basil's armies stand on the frontier.
          You are tsar, and you have a kinsman's blood on your hands.
      - label: "Make Ivan your heir, to bind him to you"
        legitimacy_bp: 500
        outcome: >-
          Ivan swears an oath. He has already decided what to do.
    history: >-
      In 1015 Gavril Radomir was murdered while hunting near Lake Ostrovo by his cousin Ivan
      Vladislav, who took the throne.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 36-37", "Yahya of Antioch"]

  - id: bul_dyrrachium
    scenario: year_1000
    civ: bulgaria
    year: 1017
    title: "The Last Tsar"
    place: "Dyrrachium"
    speaker: ruler
    speaker_name: "Tsaritsa Maria"
    speaker_title: "Your wife"
    benchmark_provinces: 1
    story: >-
      You are Ivan Vladislav, the last tsar. You killed your cousin to rule, and since then
      you have lost fortress after fortress. Basil II has taken Ostrovo and Moglena and
      is marching down the valleys, while your noble Krakra of Pernik, who held that fortress
      against him last year, is still holding out.


      The emperor has taken Dyrrachium, the port that was once yours. You think that if you
      take it back, the Adriatic is open and the people will rally.
    choices:
      - label: "Lay siege to Dyrrachium"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          In February 1018 you are killed outside the walls, in a Greek ruse, by an unknown
          hand. Your wife Maria leads your children and the court to Basil. By the end of the
          year, Ohrid itself has opened its gates, and Basil enters it. Your nobles take
          Roman titles. Bulgaria, which had been a state for three hundred years, is part of the
          empire again.
        deeds: {martial_bp: -1500}
      - label: "Offer Basil homage as his vassal"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Basil will take the whole kingdom or nothing. Your nobles, hearing of your offer, begin
          to look for the emperor's favour themselves.
      - label: "Hold the mountains around Ohrid"
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          The Greeks starve the mountain forts one by one. The nobles of Bulgaria are tired of
          war.
        deeds: {martial_bp: 500}
    history: >-
      Ivan Vladislav was killed in February 1018 besieging Dyrrachium; in the following months
      his widow and the nobles surrendered, and Bulgaria became a Byzantine theme.
    diverged: >-
      The empire is gone.
    sources: ["Skylitzes, Basil II 39-44", "Stephenson, Byzantium's Balkan Frontier (2000)", "Holmes, Basil II and the Governance of Empire (2005)"]
