schema_version: 1
# Chronicle mode (D-120, D-133): Egypt under Ramesses II and Merneptah, 1275-1208 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Egyptian monuments (the Kadesh 'Poem' and 'Bulletin' and reliefs at
# Abydos, Luxor, Karnak, the Ramesseum and Abu Simbel; the treaty in its Egyptian and
# Hittite copies; the Marriage Stela; the Merneptah stela) and the Hittite archives of
# Hattusa (Hattusili III's 'Apology', the royal letters), with modern work by Kitchen,
# Bryce and Spalinger. Dates follow the usual 'low' chronology and are uncertain by a few
# years. benchmark_provinces counts the provinces of this map the real Egypt held.
chapters:
  - id: egy_four_gods
    scenario: kadesh
    civ: egypt
    year: -1275
    title: "The Army of Four Gods"
    place: "Pi-Ramesses, in the eastern Delta"
    speaker: general
    speaker_name: "Mehy"
    speaker_title: "Commander of the chariotry"
    benchmark_provinces: 6
    story: >-
      Last year your army marched up the coast of Canaan, and King Benteshina of Amurru
      changed sides: he has thrown off the Hittite king and sworn himself your servant.
      Muwatalli of Hatti will not let that stand. All Syria is waiting to see which great
      king is the greater.


      Your new city, Pi-Ramesses, has workshops that turn out a thousand bronze arrowheads a
      day and stables for four hundred and sixty horses. You have four divisions, each named
      for a god - Amun, Re, Ptah and Seth - five thousand men apiece, and a corps of young
      men from Amurru, the Ne'arin, coming by the coast road. You are twenty-eight.
    choices:
      - label: "March on Kadesh with all four divisions"
        historical: true
        legitimacy_bp: 800
        food_bp: -1500
        outcome: >-
          In the spring of your fifth year, the army sets out from the fortress of Sile.
          Twenty-nine days later you are in the valley of the Orontes, with the walls of
          Kadesh on the horizon.
        deeds: {war_with: [hatti]}
      - label: "Hold Amurru and the coast; let Hatti come to you"
        legitimacy_bp: -300
        outcome: >-
          You fortify the coast road and wait. Muwatalli does not come. Benteshina wonders
          what kind of protector he has chosen.
      - label: "✦ Arm the chariot corps with iron"
        needs_adopted: [iron_working]
        legitimacy_bp: 1000
        materials_bp: -1500
        outcome: >-
          The smiths of Pi-Ramesses learn to forge the dark metal that only the Hittites were
          thought to know: blades that bend and do not break, and arrowheads that go through
          bronze scale. You march north with a weapon your enemy believed was his alone.
        deeds: {war_with: [hatti], martial_bp: 2500}
    history: >-
      In 1274 BC (year 5 of his reign), Ramesses II marched on Kadesh with four divisions
      after Amurru defected to Egypt. Pi-Ramesses, his new capital at Qantir, has yielded
      chariot workshops and stables for hundreds of horses.
    sources: ["Kitchen, Pharaoh Triumphant (1982)", "Pusch, excavations at Qantir"]

  - id: egy_kadesh
    scenario: kadesh
    civ: egypt
    year: -1274
    until_year: -1266
    title: "Kadesh"
    place: "The Orontes valley, south of Kadesh"
    speaker: general
    speaker_name: "Mehy"
    speaker_title: "Commander of the chariotry"
    needs_war_with: [hatti]
    needs_alive: [hatti]
    needs_owner: {hat_kadesh: hatti}
    benchmark_provinces: 6
    story: >-
      Two Shasu nomads came into the camp this morning: deserters, they say, from the
      Hittite army. Muwatalli is far to the north at Aleppo, they say, and afraid of you.
      Kadesh is undefended.


      If they are telling the truth, you can be at the walls tonight with the division of
      Amun, and the city is yours before the other three divisions have even crossed the
      river. If they are lying, the Hittite army - forty thousand men and three thousand
      chariots, they say, from every vassal of Hatti - is hidden somewhere behind the
      city, and you will be alone.
    choices:
      - label: "Believe them, and ride for Kadesh with Amun"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        outcome: >-
          You camp north-west of the city. Your scouts beat two Hittite spies until they talk:
          the whole Hittite army is behind Kadesh. As you hear it, their chariots smash into
          the division of Re on the march and scatter it, and come on into your camp. Your
          army runs. You charge them six times with your household, and the god Amun, you
          will say, holds your hand. Then the Ne'arin arrive by the coast road, and Ptah by
          evening. The Hittites fall back over the river. Kadesh is not taken - but you are
          alive, and you will tell it as the greatest victory of all time.
        deeds: {grudges: {hatti: 3000}}
      - label: "Wait for all four divisions before you move"
        legitimacy_bp: 500
        food_bp: -1500
        outcome: >-
          You wait two days. A patrol catches the Hittite spies; the trap is sprung on
          nobody. The two armies face each other across the Orontes, each too wary to
          cross. Both go home, and both kings claim it as a victory.
        deeds: {grudges: {hatti: 1500}}
      - label: "✦ Link the divisions with relays of riders, and spring the trap on them"
        needs_adopted: [postal_relay]
        legitimacy_bp: 3000
        outcome: >-
          Riders posted every few miles carry word between the four divisions in less than
          an hour. When the Hittite chariots come out from behind Kadesh, Re is ready and
          Ptah and Seth are already wheeling round the city. The Hittite army is caught
          between them and the river. Kadesh opens its gates.
        deeds: {take: [hat_kadesh], grudges: {hatti: 5000}}
    history: >-
      At Kadesh in 1274 BC the Hittites ambushed Ramesses' divided army after planting false
      informants. Ramesses' counter-attack and the arrival of the Ne'arin saved him; the
      battle ended without a decision and Kadesh stayed Hittite. It is the earliest battle
      whose tactics we know in detail, and the largest chariot battle ever fought.
    diverged: >-
      There is no war over Kadesh, or Kadesh is no longer Hittite: the famous battle never happens.
    sources: ["The Kadesh Poem and Bulletin (Luxor, Karnak, Abydos, Abu Simbel, the Ramesseum)", "Spalinger, The Transformation of an Ancient Egyptian Narrative (2002)"]

  - id: egy_sherden
    scenario: kadesh
    civ: egypt
    year: -1272
    title: "The Sherden of the Sea"
    place: "The Delta coast"
    speaker: general
    speaker_name: "The commander of the Delta"
    speaker_title: "Guardian of the river mouths"
    benchmark_provinces: 6
    story: >-
      Raiders in horned helmets, carrying round shields and long swords, have been
      sailing into the mouths of the Nile in warships: the Sherden, 'whom none could ever
      fight', from somewhere out in the sea to the west. Your fleet has caught a whole
      squadron of them asleep at anchor.


      They are the best fighters anyone in the Delta has seen. What will you do with them?
    choices:
      - label: "Take the captives into your own bodyguard"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          The Sherden swear to you and are given land. From now on they fight beside your
          chariot in their horned helmets - and they will be carved on the walls of your
          temples, guarding you at Kadesh in the next war.
        deeds: {men: 4000}
      - label: "Make an example of them on the shore"
        legitimacy_bp: 300
        unrest_bp: -200
        outcome: >-
          The heads are set on stakes at the river mouths. The Sherden do not come back this
          year. Their cousins remember.
      - label: "Hire their captains as pilots, to map the western sea"
        knowledge_bp: 1500
        wealth_bp: 800
        outcome: >-
          The Sherden captains teach your scribes the islands and harbours of the west: Crete,
          the big island of copper, the land of the Libyans' cousins. Your merchants follow.
    history: >-
      In his second year Ramesses II defeated Sherden sea-raiders in the Delta and took many
      into his service; Sherden guardsmen appear in the Kadesh reliefs. A century later the
      Sherden are among the 'Sea Peoples' who attack Egypt.
    sources: ["Tanis stela II", "Abu Simbel and Luxor Kadesh reliefs"]

  - id: egy_pentaur
    scenario: kadesh
    civ: egypt
    year: -1270
    after: [egy_kadesh]
    title: "Carve It in Stone"
    place: "Thebes"
    speaker: diviner
    speaker_name: "Nebwenenef"
    speaker_title: "High priest of Amun"
    benchmark_provinces: 6
    story: >-
      The scribes have written the poem of Kadesh. In it you stand alone in your chariot
      before two thousand five hundred Hittite chariots, and you call on your father Amun,
      and he answers; and you slaughter the enemy until they throw themselves into the
      Orontes 'as crocodiles fall'. Your army, the poem says, deserted you. It does not
      say that Kadesh is still Hittite.


      Your high priest wants the poem carved on the walls of Karnak, Luxor, Abydos, your
      memorial temple at Thebes - and on the great temple you are cutting into the cliff at
      Abu Simbel, where every Nubian chief who comes downriver will see it.
    choices:
      - label: "Carve the poem on every great temple in Egypt"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          For twenty years the sculptors cut your victory into the stone. It will survive
          the empire, the gods and the language. Three thousand years later visitors will
          still walk past you, alone in your chariot, at Abu Simbel.
      - label: "Carve it - and honour the Ne'arin who saved you"
        legitimacy_bp: 1200
        materials_bp: -1500
        influence: {nobility: 800}
        outcome: >-
          The reliefs show the young men of Amurru arriving in the nick of time. Your
          officers are surprised to find themselves in the poem, and pleased.
      - label: "✦ Write it in the new letters, for everyone to read"
        needs_adopted: [alphabet]
        legitimacy_bp: 2500
        knowledge_bp: 1500
        influence: {clergy: -1000}
        outcome: >-
          Instead of the hundreds of signs only scribes can read, the poem is copied out in
          two dozen letters of sound, the way the scribes of Ugarit have begun to write. Boat
          captains and stone-cutters read it aloud to each other. The priests are not
          pleased to share their craft.
    history: >-
      Ramesses had his version of Kadesh carved on at least five temples - the most widely
      published royal propaganda of the ancient world. The Hittite records treat the battle
      as a Hittite success, and the Hittites went on to take Upe (Damascus) for a time.
    sources: ["Lichtheim, Ancient Egyptian Literature II (1976)", "Bryce, The Kingdom of the Hittites (2005)"]

  - id: egy_amurru
    scenario: kadesh
    civ: egypt
    year: -1269
    until_year: -1260
    title: "The Fate of Benteshina"
    place: "Pi-Ramesses"
    speaker: amurru
    speaker_name: "A messenger from Amurru"
    speaker_title: "From Benteshina's court"
    needs_alive: [amurru]
    needs_war_with: [hatti]
    benchmark_provinces: 6
    story: >-
      After Kadesh, the Hittite army marched into Amurru. Benteshina, who trusted you, has
      been seized and sent in chains to Hattusa, and a new king who swears by the Storm God
      of Hatti sits in his palace.


      His messenger, who got out by boat, asks only one thing: will Egypt come?
    choices:
      - label: "No: Amurru is lost, and Egypt must lick its wounds"
        historical: true
        legitimacy_bp: -800
        outcome: >-
          The messenger goes back with gold and no army. Amurru is a Hittite vassal again.
          The princes of Syria take note of what Egypt's friendship is worth.
        deeds: {break_away: [amurru]}
      - label: "March north again, and put Benteshina's son on the throne"
        legitimacy_bp: 1000
        food_bp: -2000
        unrest_bp: 800
        outcome: >-
          Your army fights its way up the coast for a summer and sets the boy on his
          father's throne. The Hittites will be back.
        deeds: {grudges: {hatti: 2000}}
      - label: "Send ships to bring out the royal family"
        wealth_bp: -800
        legitimacy_bp: 300
        outcome: >-
          Benteshina's wife and children land at Pi-Ramesses. Amurru is lost, but its royal
          house lives in Egypt, and will be useful one day.
        deeds: {break_away: [amurru]}
    history: >-
      After Kadesh, Muwatalli deposed Benteshina and took him to Hatti. Ramesses campaigned
      in Syria in his 8th and 10th years, taking Dapur, but could not hold the north.
      Benteshina was later restored by Hattusili III.
    diverged: >-
      Amurru is gone, or Hatti and Egypt are not at war: Benteshina's fate is another.
    sources: ["Bryce, The Kingdom of the Hittites (2005)", "Treaty of Hattusili III with Benteshina (CTH 92)"]

  - id: egy_urhi_teshub
    scenario: kadesh
    civ: egypt
    year: -1264
    until_year: -1255
    title: "A King at the Gate"
    place: "Pi-Ramesses"
    speaker: hatti
    speaker_name: "Envoy of Hattusili III"
    speaker_title: "From the Great King of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 6
    story: >-
      Muwatalli of Hatti is dead. His young son reigned as Mursili III - until his uncle
      Hattusili threw him off the throne and sent him into exile. The deposed king,
      Urhi-Teshub, slipped away from his exile and has turned up in your kingdom, asking for
      your protection and, perhaps, an army to win back his throne.


      Hattusili's envoy is courteous and very firm. The Great King of Hatti asks his
      brother of Egypt to send the fugitive home.
    choices:
      - label: "Keep Urhi-Teshub, and tell Hatti you know nothing of him"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Hattusili's letters grow angry: you are lying, he says, and he knows it. For a
          while it looks like war again. But he has Assyria on his other border, and you
          have a valuable guest - a rival king you can send north whenever you like.
        deeds: {grudges: {hatti: 2000}}
      - label: "Send him back in chains"
        legitimacy_bp: -500
        outcome: >-
          Hattusili thanks you warmly. Urhi-Teshub is never heard of again.
        deeds: {peace_with: [hatti]}
      - label: "Give him an army, and set him on the throne of Hatti"
        legitimacy_bp: 800
        food_bp: -2000
        unrest_bp: 1000
        outcome: >-
          An Egyptian army marches north under a Hittite pretender's banner. The vassals of
          Hatti hesitate. Hattusili does not.
        deeds: {war_with: [hatti], grudges: {hatti: 4000}}
    history: >-
      Hattusili III seized the throne from his nephew Urhi-Teshub (Mursili III) around
      1267 BC. Urhi-Teshub fled and seems to have reached Egypt; Hattusili's letters demand
      his return and accuse Ramesses of lying about it.
    diverged: >-
      Hatti has fallen, and no deposed king comes to your gate.
    sources: ["Hattusili III, the 'Apology' (CTH 81)", "Letter KUB 21.38", "Bryce, Letters of the Great Kings (2003)"]

  - id: egy_treaty
    scenario: kadesh
    civ: egypt
    year: -1259
    until_year: -1245
    title: "The Silver Tablet"
    place: "Pi-Ramesses"
    speaker: hatti
    speaker_name: "Tili-Teshub and Ramose"
    speaker_title: "Envoys of Hatti"
    needs_alive: [hatti]
    benchmark_provinces: 6
    story: >-
      The envoys have brought a tablet of silver. On one side, the seal of the Storm God
      embracing the King of Hatti; on the other, the treaty. Egypt and Hatti will be at
      peace forever. Neither will attack the other. Each will help the other against any
      enemy - and against rebels. Fugitives will be sent home, and not punished. A thousand
      gods of Hatti and a thousand gods of Egypt are witnesses.


      In the east, Assyria has swallowed the old kingdom of Mitanni and stands on the
      Euphrates. Hattusili needs peace. So, after sixteen years of war, do you.
    choices:
      - label: "Accept, and become brothers"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1500
        unrest_bp: -800
        outcome: >-
          You have the treaty carved on the walls of Karnak and the Ramesseum. Your queen
          Nefertari writes to the Hittite queen Puduhepa as her sister. Egypt and Hatti will
          not fight again. A copy of the treaty will one day hang on a wall of the United
          Nations in New York.
        deeds: {peace_with: [hatti], ally_with: [hatti]}
      - label: "Accept peace, but no alliance"
        legitimacy_bp: 800
        outcome: >-
          The fighting stops. The two courts remain coldly polite.
        deeds: {peace_with: [hatti]}
      - label: "Refuse: Kadesh must be Egyptian"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          The envoys take their silver tablet home. The war on the Orontes goes on.
        deeds: {war_with: [hatti], grudges: {hatti: 2000}}
    history: >-
      The treaty of 1259 BC is the earliest peace treaty whose text survives in both
      parties' versions: in Egyptian hieroglyphs at Karnak and in Akkadian on clay tablets
      from Hattusa. Peace held until the Hittite empire fell around 1180 BC.
    diverged: >-
      Hatti is gone: there is no one left to make peace with.
    sources: ["Karnak and Ramesseum copies", "Hattusa tablets (CTH 91)", "Edel, Der Vertrag zwischen Ramses II. und Hattusili III. (1997)"]

  - id: egy_abu_simbel
    scenario: kadesh
    civ: egypt
    year: -1256
    title: "The Temples in the Cliff"
    place: "Abu Simbel, in Nubia"
    speaker: steward
    speaker_name: "Paser"
    speaker_title: "Vizier of the South"
    benchmark_provinces: 6
    story: >-
      Far up the Nile, where the gold of Kush comes downriver, your workmen have spent
      twenty years cutting two temples into the sandstone cliff. On the face of the greater
      one sit four colossal statues of you, twenty metres high. The smaller one is for your
      great royal wife Nefertari and the goddess Hathor: her statues stand as tall as yours,
      which no queen has been given before.


      Nefertari is ill. Your vizier asks whether the dedication should wait.
    choices:
      - label: "Sail to Abu Simbel with Nefertari, and dedicate them now"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          The queen sails south with you and her daughter Meritamen to see her temple. Twice
          a year the rising sun will shine down the length of the great temple, sixty metres
          into the rock, to light your statue in the sanctuary. Nefertari does not appear in
          the records again. Her tomb in the Valley of the Queens is the most beautiful
          ever painted.
      - label: "Wait until the queen is well"
        legitimacy_bp: 300
        outcome: >-
          The temples wait. So, in the end, does the queen, who never sees hers.
      - label: "✦ Pour concrete foundations, and build a third temple for Kush"
        needs_adopted: [concrete]
        legitimacy_bp: 2000
        materials_bp: -1500
        outcome: >-
          With the new mortar of burnt lime and ash that sets even under water, your builders
          raise a temple-fortress on an island in the cataract that the Nile's floods cannot
          touch. The chiefs of Kush send their sons to be schooled there.
        deeds: {martial_bp: 1000}
    history: >-
      The Abu Simbel temples were completed around 1255 BC. Nefertari probably died soon
      after their dedication. In the 1960s the temples were cut into blocks and moved 65
      metres up the cliff to save them from Lake Nasser.
    sources: ["Desroches-Noblecourt, Ramses II (1996)", "UNESCO Nubia campaign records"]

  - id: egy_bride
    scenario: kadesh
    civ: egypt
    year: -1246
    until_year: -1235
    title: "A Bride from Hatti"
    place: "The road through Canaan"
    speaker: hatti
    speaker_name: "Queen Puduhepa"
    speaker_title: "Great Queen of Hatti"
    needs_alive: [hatti]
    needs_peace_with: [hatti]
    benchmark_provinces: 6
    story: >-
      Puduhepa, Hattusili's queen, has been writing to you about the marriage of her eldest
      daughter for two years. You complained the dowry was late; she replied, sharply, that
      Hatti's storehouses had burned, and asked whether Egypt was really so short of
      silver that it must count a bride's.


      Now the princess is on the road, in winter, with a dowry of gold, silver, horses,
      cattle and slaves, and Hittite soldiers escorting her to the border. It is the wrong
      season to cross the mountains. Your priests say you can ask the god Seth for good
      weather.
    choices:
      - label: "Pray to Seth for summer weather, and welcome her as a queen"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 2000
        outcome: >-
          The rain stops, the stela will say, and the sun shines in midwinter, so that
          Egyptian and Hittite soldiers eat and drink together on the road 'like brothers'.
          You name the princess Maathorneferure, 'she who sees the beauty of Ra', and make
          her a great royal wife.
        deeds: {ally_with: [hatti]}
      - label: "Receive her, but as a minor wife"
        wealth_bp: 2000
        legitimacy_bp: 300
        outcome: >-
          The princess disappears into the harem at Mi-Wer. Puduhepa's next letters are
          very cold.
        deeds: {grudges: {hatti: 1500}}
    history: >-
      Around 1245 BC Ramesses married Hattusili and Puduhepa's daughter, renamed
      Maathorneferure, after a long correspondence over the dowry. The Marriage Stela at
      Abu Simbel claims Seth stopped the winter rain for the journey.
    diverged: >-
      Egypt and Hatti are not at peace, or Hatti is gone: there is no royal marriage.
    sources: ["The Marriage Stela (Abu Simbel, Karnak)", "Letter of Puduhepa (KUB 21.38)"]

  - id: egy_khaemwaset
    scenario: kadesh
    civ: egypt
    year: -1243
    title: "The Prince Who Read the Old Stones"
    place: "Memphis and Saqqara"
    speaker: scholar
    speaker_name: "Prince Khaemwaset"
    speaker_title: "High priest of Ptah at Memphis"
    benchmark_provinces: 6
    story: >-
      Your fourth son, Khaemwaset, is a strange prince. He spends his days at Saqqara among
      the pyramids of kings who died a thousand years before you, reading their worn names,
      repairing their tombs, and carving labels on them so that people will know whose they
      were.


      He has found a statue of a prince of the old kings buried in the sand at Memphis and
      wants a shrine for it. He also wants something new: a great underground gallery for
      the sacred Apis bulls, so that every bull can lie in its own chamber forever. Your
      jubilee is coming, and the priests of Ptah would like to be remembered in it.
    choices:
      - label: "Give him the gallery and the money to restore the old tombs"
        historical: true
        legitimacy_bp: 1200
        knowledge_bp: 1500
        materials_bp: -1000
        influence: {clergy: 1500}
        outcome: >-
          The Serapeum is begun, and the pyramids get their labels. Khaemwaset becomes a
          legend: a thousand years later Egyptians will still tell stories of the magician
          prince who read the forbidden book of Thoth. Archaeologists will call him the first
          Egyptologist.
      - label: "Tell him the living need temples more than the dead"
        materials_bp: 500
        outcome: >-
          Khaemwaset bows and goes back to Memphis. The old pyramids crumble a little more.
      - label: "✦ Found a school beside the Serapeum for anyone who can learn"
        needs_adopted: [schools]
        knowledge_bp: 3000
        legitimacy_bp: 800
        influence: {clergy: -500}
        outcome: >-
          The prince opens his workshop of copyists to the sons of craftsmen. Within ten
          years Memphis has more people who can read than all the rest of Egypt.
    history: >-
      Khaemwaset (died c. 1225 BC), high priest of Ptah, restored and labelled Old Kingdom
      monuments at Saqqara and Giza, and began the Serapeum galleries for the Apis bulls.
      He became the hero of Demotic tales a millennium later.
    sources: ["Gomaa, Chaemwese (1973)", "Setne Khamwas tales (Ptolemaic papyri)"]

  - id: egy_libyan_forts
    scenario: kadesh
    civ: egypt
    year: -1235
    title: "Forts in the Western Desert"
    place: "The western edge of the Delta"
    speaker: general
    speaker_name: "Neb-Re"
    speaker_title: "Commander of the western fortresses"
    benchmark_provinces: 6
    story: >-
      Every year more Libyans come out of the western desert into the Delta with their
      flocks and families: the Libu and the Meshwesh, driven by drought, some say, from their
      own pastures. Some come to trade, some to settle, some to raid.


      Your commander in the west proposes a chain of forts along the coast road to Libya,
      each a day's march from the next, with wells and granaries, as far as Zawiyet Umm
      el-Rakham, three hundred kilometres west of the Delta.
    choices:
      - label: "Build the chain of forts"
        historical: true
        materials_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          The forts go up, and the Libyans stay on the far side of them - for now. Your
          garrisons trade with them for ostriches and cattle, and buy wine and oil from
          ships that come from Crete and Canaan.
        deeds: {martial_bp: 800}
      - label: "Settle the Libyans in the Delta as soldiers"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          Libyan chiefs are given land and Egyptian titles. Their sons will be your soldiers -
          and, one day, their grandsons will be Egypt's kings.
        deeds: {men: 6000}
      - label: "Strike into Libya and teach them to stay away"
        legitimacy_bp: 600
        food_bp: -1500
        outcome: >-
          Your army burns the Libyan camps on the coast and drives the herds home. The
          Libyans go back into the desert, angry and hungry.
        deeds: {take: [br_libya]}
    history: >-
      Ramesses II built a line of forts west of the Delta, the largest at Zawiyet Umm
      el-Rakham, against growing Libyan pressure. Libyan soldiers later settled in Egypt,
      and a Libyan dynasty (the 22nd) ruled Egypt from about 945 BC.
    sources: ["Snape, Zawiyet Umm el-Rakham excavations (2003-)", "Kitchen, Pharaoh Triumphant"]

  - id: egy_perire
    scenario: kadesh
    civ: egypt
    year: -1208
    until_year: -1200
    title: "The Peoples of the Sea"
    place: "Perire, in the western Delta"
    speaker: general
    speaker_name: "The commander of the western fortresses"
    speaker_title: "Holding the frontier"
    benchmark_provinces: 6
    story: >-
      Ramesses the Great is dead, after sixty-six years on the throne: most of Egypt never
      knew another king. Twelve of his sons died before him.


      Now, in the fifth year of his son's reign, King Meryey of the Libu is marching on the
      Delta with his wives, his children and his household gods - and with him come
      strangers from the sea: Sherden, Shekelesh, Lukka, Tursha and Ekwesh, 'northerners
      coming from all lands'. They do not come to raid. They come to stay.
    choices:
      - label: "Meet them at Perire with archers and chariots"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          After six hours of battle the Libyans and their allies break. Meryey flees by
          night, leaving his sandals, his bow and his quiver. Thousands are dead; you count
          the hands cut from the slain. On the stela of victory your scribes list the
          peoples of Canaan you have humbled - and among them, for the first time anywhere in
          writing, a people called Israel.
        deeds: {take: [br_libya]}
      - label: "Hold the forts and let them break their strength on the walls"
        food_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          The invaders spill round the forts and ravage the western Delta for a season
          before hunger sends them home. They will come back.
      - label: "Let them settle the empty lands of the west, as subjects"
        unrest_bp: 1500
        legitimacy_bp: -800
        outcome: >-
          The Libyan chiefs swear to you and spread across the western Delta. Your officials
          count new taxpayers. Your generals count new rivals.
        deeds: {men: 8000}
    history: >-
      Ramesses II died in 1213 BC aged about ninety. In 1208 BC his son Merneptah defeated a
      Libyan invasion joined by 'Sea Peoples' at Perire. His victory stela contains the
      first known mention of Israel. Thirty years later the Sea Peoples helped bring down
      Hatti, Ugarit and the whole Bronze Age world.
    diverged: >-
      Egypt's story has run another way.
    sources: ["The Merneptah ('Israel') stela", "Great Karnak Inscription of Merneptah"]
