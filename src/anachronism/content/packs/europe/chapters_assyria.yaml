schema_version: 1
# Chronicle mode (D-120, D-151): Middle Assyria, from Adad-nirari I to the murder of
# Tukulti-Ninurta I, 1275-1207 BC. Each chapter opens in its year; one choice is what
# history chose. Facts follow the Assyrian royal inscriptions, the Tukulti-Ninurta Epic,
# the letters between the great kings, the Babylonian chronicles, and modern work by
# Grayson, Machinist, Bryce and Radner. Dates are uncertain by a decade.
# benchmark_provinces counts the provinces of this map the real Assyria held at that date.
chapters:
  - id: asy_brother
    scenario: kadesh
    civ: assyria
    year: -1275
    title: "Brother of the Great Kings"
    place: "Assur"
    speaker: steward
    speaker_name: "Your chief scribe"
    speaker_title: "Writer of the royal letters"
    benchmark_provinces: 3
    story: >-
      Two generations ago Assyria was a vassal of Mitanni. Now Mitanni is a broken kingdom
      called Hanigalbat, and you, Adad-nirari, have beaten its king and made him your vassal.
      You call yourself 'king of the universe'.


      The real great kings - of Egypt, Hatti and Babylon - call each other 'brother' in their
      letters. Your scribe asks how you would like to write to the new king of Hatti.
    choices:
      - label: "Greet him as an equal king"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your letter calls the Hittite king 'my brother'. The reply is famous: 'Were you and I
          born of the same mother? As my father and grandfather did not write of brotherhood to
          the king of Assyria, so you should not write to me.' You decide that the Hittites will
          have to learn.
        deeds: {grudges: {hatti: 2000}}
      - label: "Greet him as a lesser king"
        legitimacy_bp: 600
        wealth_bp: 500
        outcome: >-
          The Hittite king answers kindly, as a father to a son. Your court is ashamed.
      - label: "Send rich gifts and a plain request for friendship"
        wealth_bp: -800
        legitimacy_bp: 300
        outcome: >-
          The gifts go west with a courteous letter that claims no rank. The Hittite king takes
          the gifts and answers in the same courteous tone, without conceding anything.
    history: >-
      Adad-nirari I (r. c. 1295-1264 BC) claimed equal status with the great kings; a Hittite
      reply to an Assyrian king rejecting 'brotherhood' survives at Hattusa.
    sources: ["KUB 23.102", "Grayson, Assyrian Royal Inscriptions I (1972)"]

  - id: asy_hanigalbat
    scenario: kadesh
    civ: assyria
    year: -1263
    until_year: -1255
    title: "The End of Mitanni"
    place: "Washukanni"
    speaker: general
    speaker_name: "Your commander in the west"
    speaker_title: "Of the army of Ashur"
    needs_alive: [hanigalbat]
    benchmark_provinces: 3
    story: >-
      You are Shalmaneser, your father's son. Shattuara, king of Hanigalbat, has rebelled with
      Hittite and Aramean help, and seized the passes and the water sources. Your army is
      thirsty and outnumbered.
    choices:
      - label: "Fight through to the wells and the passes"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        outcome: >-
          You break Shattuara's army and destroy nine of his fortified towns. You will boast
          that you blinded fourteen thousand four hundred prisoners and carried off his people.
          Mitanni, which once ruled from the Zagros to the Mediterranean, disappears. Assyria
          stands on the Euphrates, looking at Hatti.
        deeds: {war_with: [hanigalbat], conquer: [hanigalbat], grudges: {hatti: 2000}}
      - label: "Take the land and move the people to Assyrian villages"
        legitimacy_bp: 1000
        outcome: >-
          The people of Hanigalbat are moved to new villages under Assyrian governors. In a
          generation they will think of themselves as Assyrians.
        deeds: {war_with: [hanigalbat], conquer: [hanigalbat]}
      - label: "Offer Shattuara terms as your vassal"
        legitimacy_bp: 500
        wealth_bp: 800
        outcome: >-
          Shattuara is allowed his throne if he pays tribute and gives up the passes. He agrees
          for the moment, and your army drinks. Your commanders say a vassal who has broken one
          oath may break another.
        deeds: {tributaries: [hanigalbat]}
    history: >-
      Shalmaneser I (r. c. 1263-1234 BC) annexed Hanigalbat after crushing Shattuara II; his
      inscription claims 14,400 prisoners blinded.
    diverged: >-
      Hanigalbat is gone already.
    sources: ["Grayson, Assyrian Royal Inscriptions I", "Harrak, Assyria and Hanigalbat (1987)"]

  - id: asy_nihriya
    scenario: kadesh
    civ: assyria
    year: -1233
    until_year: -1225
    title: "Nihriya"
    place: "The upper Tigris"
    speaker: general
    speaker_name: "Your commander of chariots"
    speaker_title: "Of the army of Ashur"
    needs_alive: [hatti]
    benchmark_provinces: 5
    story: >-
      You are Tukulti-Ninurta, young and ambitious. The Hittite king Tudhaliya has marched
      into the hill country north of Hanigalbat, and is at Nihriya. He has written to you,
      offering peace if you will stop meddling in his vassals' lands.


      Your scribes have prepared several replies, from the humble to the defiant.
    choices:
      - label: "Refuse his terms and march on Nihriya"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          At Nihriya the Hittite army breaks. You claim twenty-eight thousand eight hundred
          Hittite prisoners carried across the Euphrates. The Hittite king forbids his vassals
          to trade with you, and tells his Mycenaean friends to keep their ships away. Your
          merchants find other roads.
        deeds: {men: 8000, grudges: {hatti: 3000}}
      - label: "Accept his peace and withdraw"
        legitimacy_bp: 1600
        wealth_bp: 1000
        outcome: >-
          Tudhaliya withdraws. The trade roads to the west stay open.
        deeds: {peace_with: [hatti]}
      - label: "Ask him to leave Hanigalbat first, then talk"
        legitimacy_bp: 500
        wealth_bp: -400
        outcome: >-
          Your envoy repeats your demand. Tudhaliya neither withdraws nor attacks, and both armies
          dig in on either side of the hills while the letters go back and forth.
        deeds: {men: 3000}
    history: >-
      Tukulti-Ninurta I defeated Tudhaliya IV at Nihriya (c. 1237-1230 BC), boasting of 28,800
      Hittite prisoners; Hatti responded with a trade embargo.
    diverged: >-
      Hatti is gone.
    sources: ["Grayson, ARI I", "Letter RS 34.165", "Treaty with Sausgamuwa (CTH 105)"]

  - id: asy_babylon
    scenario: kadesh
    civ: assyria
    year: -1225
    until_year: -1215
    title: "The God in Chains"
    place: "Babylon"
    speaker: diviner
    speaker_name: "Your chief priest of Ashur"
    speaker_title: "Keeper of the temple of Ashur"
    needs_alive: [babylon]
    benchmark_provinces: 6
    story: >-
      King Kashtiliash of Babylon has broken his oath, you say, and the gods have handed him
      to you. Your army has defeated his and taken him prisoner, and you have entered Babylon,
      the holiest city of all, where Marduk lives in his temple Esagila.


      Your priests are divided. Some say take Marduk home to Assur; others say the gods of
      Babylon should stay in their own temples.
    choices:
      - label: "Carry Marduk's statue off to Assur"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 1500
        outcome: >-
          You tear down the walls of Babylon and carry off Marduk's statue, with the king in
          chains. You call yourself king of Sumer and Akkad. A poet writes the Epic of
          Tukulti-Ninurta to celebrate it. But the Babylonians never accept you, and many
          Assyrians think you have committed sacrilege.
        deeds: {war_with: [babylon], conquer: [babylon]}
      - label: "Leave Marduk in Esagila and rule gently"
        legitimacy_bp: 2000
        influence: {clergy: 1500}
        outcome: >-
          You worship Marduk in Esagila and appoint a Babylonian governor. Babylon is quiet, and
          prays for your health.
        deeds: {war_with: [babylon], conquer: [babylon]}
      - label: "Set a vassal on the throne and take tribute"
        legitimacy_bp: 800
        wealth_bp: 1000
        outcome: >-
          A Babylonian of good family is crowned in Kashtiliash's place, to rule as your servant
          and send gold north each year. It is cheaper than a garrison, and it will hold for
          only as long as he fears you.
        deeds: {tributaries: [babylon]}
    history: >-
      Tukulti-Ninurta I captured Kashtiliash IV, sacked Babylon and removed Marduk's statue to
      Assur around 1225 BC; Babylon rebelled after a few years.
    diverged: >-
      Babylon is gone already.
    sources: ["Tukulti-Ninurta Epic", "Chronicle P", "Machinist, The Epic of Tukulti-Ninurta I (1978)"]

  - id: asy_kar
    scenario: kadesh
    civ: assyria
    year: -1220
    title: "A City of One's Own"
    place: "Across the Tigris from Assur"
    speaker: steward
    speaker_name: "Your master builder"
    speaker_title: "Of the palace works"
    benchmark_provinces: 7
    story: >-
      You do not like Assur any more. The old city is full of priests and great families who
      grumble about Babylon and about you. Across the river there is open land.


      Your builder has plans for a new city with your own name: Kar-Tukulti-Ninurta, 'Port of
      Tukulti-Ninurta', with a palace, a temple to Ashur and a canal. You would live there,
      among people who owe everything to you.
    choices:
      - label: "Build a new city across the river"
        historical: true
        materials_bp: -2500
        legitimacy_bp: -500
        influence: {nobility: -2000, clergy: -1000}
        outcome: >-
          The city rises in a few years, painted palaces and all. You live in it, more and more
          alone with your courtiers. In Assur, your son and the nobles talk.
      - label: "Rebuild the walls and temples of Assur"
        materials_bp: -1500
        legitimacy_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          Assur gets new walls and temples. The old families are pleased to see you at home.
      - label: "Build a fortified palace outside Assur's walls"
        materials_bp: -1200
        legitimacy_bp: 200
        influence: {nobility: -300}
        outcome: >-
          A great palace rises on the plain beyond the old city's walls. You live apart from the
          priests and are near enough to Assur to call them to you when you wish.
    history: >-
      Tukulti-Ninurta I founded Kar-Tukulti-Ninurta across the Tigris from Assur; it was
      largely abandoned after his death.
    sources: ["Eickhoff, Kar Tukulti Ninurta (1985)", "Grayson, ARI I"]

  - id: asy_murder
    scenario: kadesh
    civ: assyria
    year: -1208
    title: "The Palace in the New City"
    place: "Kar-Tukulti-Ninurta"
    speaker: steward
    speaker_name: "Ashur-nadin-apli"
    speaker_title: "Your son"
    benchmark_provinces: 5
    story: >-
      Babylon has rebelled and taken its king back. The nobles of Assur say the gods have
      turned against you for what you did to Marduk.


      Your son Ashur-nadin-apli has come to see you with some nobles. They want you to come
      back to Assur and hand the government over to them while you rest. You are sixty.
    choices:
      - label: "Refuse to give up the government"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2500
        outcome: >-
          That night they shut you up in a room of your own palace and kill you with the sword.
          A Babylonian chronicle notes it with satisfaction. Assyria falls into a century of
          weakness, as the Bronze Age world collapses around it.
        deeds: {ruler_falls: "is murdered by his son in his own palace"}
      - label: "Go back to Assur, and share power"
        legitimacy_bp: 500
        outcome: >-
          You return to Assur. Your son governs; you sit in the temple of Ashur. The new city is
          slowly abandoned.
      - label: "Name your son regent but keep the army"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          You give Ashur-nadin-apli the name of regent and keep the troops at your own gate. The
          nobles go away with a grievance and a plan that has not been ruined, only put off.
    history: >-
      Tukulti-Ninurta I was murdered around 1208 BC by his son Ashur-nadin-apli and nobles,
      who shut him in a room in Kar-Tukulti-Ninurta.
    sources: ["Chronicle P", "Grayson, Assyrian and Babylonian Chronicles (1975)"]
