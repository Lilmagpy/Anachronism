schema_version: 1
# Chronicle mode (D-120, D-XXX): the Scythians of the Black Sea steppe, 336-325 BC. A short
# chronicle: the Scythians left no writing, and our sources are Greek and Roman, written
# from outside and often long afterwards. Facts follow Justin 9.2-3 and 12.1-2 (Pompeius
# Trogus), Strabo 7.3.18 and Plutarch's Sayings of Kings and Commanders on Ateas, Arrian
# (Anabasis 1.3-4, 3.30, 4.1-4, 4.15) and Curtius 8.1 and 10.1 on Alexander's dealings with
# Scythians, and Macrobius (Saturnalia 1.11.33, 5th century AD) on Olbia, with modern work by
# Rolle, Melyukova, Bosworth and Heckel. The date of Zopyrion's expedition is disputed:
# Justin puts it about 331 BC, Curtius after Alexander's return from India (about 325), and
# this file follows Curtius, as most modern scholars do. The kings of the western Scythians
# after Ateas (killed in 339) are not named in our sources, so the ruler here is only "the
# king of the Scythians". Two episodes are left out on purpose: the Sarmatians'
# advance is known only from later, undated remarks (Diodorus 2.43), and the Bosporan
# wars of 310-309 (Diodorus 20.22-24) were fought by kings of the Kuban and Azov steppe, not
# by the Scythians of this map, so they do not belong to this chronicle. benchmark_provinces
# counts the provinces of this map the real Scythians held (two: the steppe and the Dobruja).
chapters:
  - id: scy_after_ateas
    scenario: alexander
    civ: scythians
    year: -336
    title: "The Horse and the Flute"
    place: "The steppe north of the Danube"
    speaker: scholar
    speaker_name: "A Greek writer, long after"
    speaker_title: "Who tells the Scythians' story from outside"
    benchmark_provinces: 2
    story: >-
      You are king of the Scythians of the western steppe, from the Danube mouth to the
      Dnieper. Three years ago your old king Ateas, said to be ninety, fell in battle against
      Philip of Macedon. The Greek writers tell the story as a lesson. Ateas had asked Philip
      for help against the Istrians, offering to make him his heir, and then, when
      the Istrian king died, sent Philip's army home and refused to pay it. When
      Philip's envoys complained, Ateas is said to have answered that he liked
      the neighing of his horse better than the flute-playing of the Athenian
      Ismenias. Philip took twenty thousand mares and twenty thousand women and children.


      Now Philip is murdered, and a youth of twenty, Alexander, rules in Macedon. Your
      nobles say the Macedonians are weak and the Danube is only a river. Your elders say that
      the Greeks go to war about gold, and that there is no gold in a Scythian camp.
    choices:
      - label: "Stay north of the Danube and let Macedon be"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Alexander crosses the Danube in 335 and burns a Getic town, but Arrian names the
          Getae and the Triballi as his enemies, and no Scythians. He goes south again.
          For several years nothing is heard of a Scythian war with Macedon.
      - label: "Raid the Thracian villages across the river"
        unrest_bp: 300
        wealth_bp: 600
        outcome: >-
          Your horsemen do well in the Thracian villages and return rich. But Alexander
          is not Philip, and you have taught his officers where the river
          can be crossed.
        deeds: {grudges: {macedon: 1500}}
      - label: "Post riders at the Danube fords"
        wealth_bp: -300
        legitimacy_bp: 300
        outcome: >-
          Your horsemen take turns to watch the crossings, and the Thracians on the far bank see
          them there. The watch is dull and costs you the summer's grazing, but no army can
          cross unseen.
        deeds: {men: 1500}
    history: >-
      Philip II defeated and killed the aged Scythian king Ateas in 339 BC (Justin 9.2,
      Strabo 7.3.18). Alexander's Danube campaign in 335 BC was fought against the Getae
      and Triballi (Arrian 1.2-4); no source records a war between him and the Scythians
      of the western steppe.
    sources: ["Justin 9.2-3", "Strabo 7.3.18", "Plutarch, Sayings of Kings and Commanders (Ateas)", "Arrian 1.3-4", "Rolle, The World of the Scythians (1989)"]

  - id: scy_jaxartes
    scenario: alexander
    civ: scythians
    year: -329
    title: "Another Scythia on the Tanais"
    place: "The steppe, far from the Jaxartes"
    speaker: scholar
    speaker_name: "A Greek writer, long after"
    speaker_title: "Who says 'Scythians' of many peoples"
    benchmark_provinces: 2
    story: >-
      You are the king of the Scythians. A rumour has come across the whole breadth of the
      steppe: that Alexander, who burned the Persian king's palace, has reached the river
      Jaxartes, in Sogdiana, and has built a city there. His men call the river the Tanais,
      the name of the Don, which runs near you. Beyond it live nomads whom the Greeks also
      call Scythians. They are the Saka, a different people, a month or more of riding
      to the east, who speak a related Iranian tongue.


      Arrian says that Alexander crossed the river on rafts and floats, drove the Saka horsemen
      back with archers and slingers, and that their king then sent to him to say that the
      raiders had been outlaws, not his people. The Greeks call you the Scythians of Europe, and
      Alexander's court is curious how large your realm is.
    choices:
      - label: "Send envoys to Alexander with gifts"
        historical: true
        legitimacy_bp: 600
        knowledge_bp: 300
        outcome: >-
          The Greek writers say that envoys of the Scythians of Europe came to Alexander in
          Sogdiana in the winter of 329-328. Curtius adds that a Scythian king offered his
          daughter in marriage. Alexander is said to have declined the marriage, accepted
          friendship, and sent men of his own back with the envoys to see your country. Nothing
          more comes of it in the sources.
      - label: "Stay out of it; the Saka are another people"
        wealth_bp: 300
        legitimacy_bp: -200
        outcome: >-
          Nothing happens. Alexander's army is far away, and the Danube stays quiet.
      - label: "Send envoys to the Saka kings across the steppe"
        knowledge_bp: 400
        legitimacy_bp: 200
        wealth_bp: -200
        outcome: >-
          Your envoys ride a long road to the eastern steppe and come back with news of the
          Saka, their horse-herds and their quarrels with the Greeks. It is a friendship of
          distance, and neither side can help the other much.
    history: >-
      Alexander fought the Saka (Asian Scythians) on the Jaxartes in 329 BC and founded
      Alexandria Eschate (Arrian 4.1-4). Arrian and Curtius also report an embassy from the
      Scythians of Europe to Alexander in Sogdiana (Arrian 4.15; Curtius 8.1), which is the
      only direct contact between the two in the sources.
    sources: ["Arrian 3.30, 4.1-4, 4.15", "Curtius 7.7-9, 8.1", "Bosworth, Conquest and Empire (1988)", "Rolle, The World of the Scythians (1989)"]

  - id: scy_zopyrion
    scenario: alexander
    civ: scythians
    year: -325
    title: "Zopyrion Before Olbia"
    place: "The Greek city of Olbia, at the Bug estuary"
    speaker: macedon
    speaker_name: "Zopyrion"
    speaker_title: "Alexander's governor, with a great army"
    needs_alive: [macedon]
    benchmark_provinces: 2
    story: >-
      You are the king of the Scythians. A Macedonian army has marched across the Danube and
      is camped before Olbia, the Greek trading city on your coast. Curtius calls its commander
      Zopyrion, governor of Thrace; Justin says Pontus. Both give him thirty thousand men
      and say he wanted a glory of his own to match Alexander's. A late writer, Macrobius, says
      that the besieged people of Olbia freed their slaves, gave them citizenship and
      cancelled debts, to make every man defend the walls.


      Your horsemen are on every road. Your elders say that the Greeks cannot live on the
      steppe and need only be left to starve in the open. Your young men want a battle.
    choices:
      - label: "Draw him onto the open grass and harry him"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Curtius says that Zopyrion's whole army was destroyed, by sudden storms and by the
          enemy. Justin says the same, that he fell with every man. The Greek writers do not describe the fighting.
        deeds: {men: 3000}
      - label: "Strike his camp at Olbia in the field"
        legitimacy_bp: 500
        unrest_bp: 400
        deeds: {men: 4000}
        outcome: >-
          It is a hard fight. Many of your men fall before the Macedonian pikes, but the
          camp breaks. Alexander's governor does not live to write home.
      - label: "Drive the herds beyond the Dnieper and leave Olbia to itself"
        legitimacy_bp: 1100
        wealth_bp: 500
        outcome: >-
          The herds and tents move east out of his reach and the grass is burned behind
          them, as your fathers did against the Persians. Olbia must hold alone, and its Greeks
          do not forget that you were not there.
        deeds: {men: 2000}
    history: >-
      Zopyrion, Alexander's governor, led about thirty thousand men against the Scythians and
      was destroyed with his army (Curtius 10.1.43-45, Justin 12.1-2), by a date put
      anywhere between about 331 and 325 BC. The siege of Olbia is known only from later
      writers (Macrobius 1.11.33). Alexander did not return north: he was in Persia, then in
      Babylon, where he died in 323.
    diverged: >-
      Macedon is gone.
    sources: ["Curtius 10.1.43-45", "Justin 12.1-2", "Macrobius, Saturnalia 1.11.33", "Heckel, Marshals of Alexander's Empire (1992)", "Rolle, The World of the Scythians (1989)"]
