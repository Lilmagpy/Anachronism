schema_version: 1
# Chronicle mode (D-120, D-171): the Ghaznavid sultans, Mahmud and Masud, 1000-1040.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow al-Utbi's Kitab-i Yamini, Bayhaqi's history of Masud, Gardizi, al-Biruni's
# own books, Nizami Aruzi's Four Discourses (for the Firdawsi story, a later tradition)
# and Ibn al-Athir, with modern work by Bosworth, Thapar (on Somnath) and Nazim. The map
# shows the Ghaznavid lands as Khorasan; their Indian campaigns go beyond its edge and are
# told in the outcomes. benchmark_provinces counts the provinces of this map the real
# sultans held at that date.
chapters:
  - id: gha_peshawar
    scenario: year_1000
    civ: ghaznavids
    year: 1000
    title: "The Raja's Pyre"
    place: "Ghazni"
    speaker: general
    speaker_name: "Altuntash"
    speaker_title: "One of your Turkish generals"
    benchmark_provinces: 1
    story: >-
      You are Mahmud, son of a Turkish slave-soldier who made himself lord of Ghazni, in the
      mountains of Afghanistan. You have taken Khorasan from your father's old masters, the
      Samanids, and the caliph in Baghdad has named you 'Right Hand of the State'. You have
      vowed to make war on India every year.


      Jayapala, the Hindu Shahi raja of the Punjab, has fought your father and lost, and
      fought you, and lost. He is waiting near Peshawar with twelve thousand horse, thirty
      thousand foot and three hundred elephants.
    choices:
      - label: "Ride for Peshawar"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 3000
        outcome: >-
          Jayapala is beaten and taken prisoner with his sons and grandsons, wearing
          necklaces of jewels your secretary values at hundreds of thousands of dinars. You
          ransom him. In his own country, disgraced, he hands the kingdom to his son and burns
          himself alive on a pyre.
        deeds: {martial_bp: 1000}
      - label: "Turn west, to Iran"
        legitimacy_bp: 500
        outcome: >-
          Your army turns to the Buyid lands. India's rajas are left to their own wars.
        deeds: {grudges: {buyids: 2000}}
    history: >-
      Mahmud defeated and captured Jayapala near Peshawar on 27 November 1001; Jayapala,
      released, abdicated and immolated himself.
    sources: ["al-Utbi, Kitab-i Yamini", "Gardizi, Zayn al-akhbar", "Bosworth, The Ghaznavids (1963)"]

  - id: gha_firdawsi
    scenario: year_1000
    civ: ghaznavids
    year: 1010
    title: "The Book of Kings"
    place: "Ghazni"
    speaker: scholar
    speaker_name: "Firdawsi of Tus"
    speaker_title: "Poet"
    benchmark_provinces: 1
    story: >-
      An old poet from Tus has come to court with a book he has worked on for thirty years:
      the Shahnameh, the Book of Kings, the whole history of Iran from the first king to the
      Arab conquest, in sixty thousand couplets of almost pure Persian. He has dedicated it to
      you.


      You are a Turk, and your court prefers Arabic; your ministers say the book praises the
      fire-worshipping kings of old. The story goes that you promised the poet a gold dinar
      for every couplet.
    choices:
      - label: "Pay him in silver"
        historical: true
        wealth_bp: 500
        legitimacy_bp: -500
        outcome: >-
          The silver arrives while Firdawsi is at the bath. He divides it between the bath-
          keeper and a sherbet-seller, writes a satire on you, and leaves Ghazni. Years later,
          the story goes, you repent and send camels loaded with gold to Tus; they enter one
          gate as his coffin leaves by another. The Shahnameh is read in Persian to this day.
      - label: "Pay him in gold, as promised"
        wealth_bp: -2500
        knowledge_bp: 1500
        legitimacy_bp: 1500
        outcome: >-
          Sixty thousand dinars go to Tus. Every poet in the Persian world sets out for your
          court.
    history: >-
      Firdawsi completed the Shahnameh in about 1010 and dedicated it to Mahmud; the story of
      the silver payment is told by Nizami Aruzi a century later.
    sources: ["Nizami Aruzi, Chahar maqala 2.9", "Davis, introduction to the Shahnameh (2006)"]

  - id: gha_biruni
    scenario: year_1000
    civ: ghaznavids
    year: 1017
    title: "The Scholars of Khwarazm"
    place: "Gurganj, capital of Khwarazm"
    speaker: scholar
    speaker_name: "Abu Rayhan al-Biruni"
    speaker_title: "Astronomer of the Khwarazm-shah"
    benchmark_provinces: 1
    story: >-
      Your brother-in-law, the Khwarazm-shah, has been murdered by his own soldiers, and you
      have marched in to avenge him and take his kingdom. His court was the most learned in
      the east. The young physician Ibn Sina has already slipped away into the desert rather
      than serve you.


      The astronomer al-Biruni is still here. He measures the stars, the earth and the
      calendars of every people. You can take him, and the other scholars, to Ghazni.
    choices:
      - label: "Carry the scholars off to Ghazni"
        historical: true
        knowledge_bp: 3000
        outcome: >-
          Al-Biruni comes to Ghazni, unwillingly. He follows your armies into India, learns
          Sanskrit, and writes a book about India's sciences, beliefs and customs so fair that
          scholars still use it. From a mountain in the Punjab he measures the size of the
          earth to within a few per cent.
      - label: "Let them stay at the court of Khwarazm"
        knowledge_bp: 500
        outcome: >-
          The scholars stay, and dedicate their books to your governor.
    history: >-
      Mahmud conquered Khwarazm in 1017 and took al-Biruni and other scholars to Ghazni; Ibn
      Sina had fled. Al-Biruni wrote his book on India around 1030.
    sources: ["al-Biruni, Kitab fi tahqiq ma li'l-Hind", "Nizami Aruzi, Chahar maqala", "Bosworth, The Ghaznavids (1963)"]

  - id: gha_mathura
    scenario: year_1000
    civ: ghaznavids
    year: 1018
    title: "The City of Krishna"
    place: "Mathura, on the Yamuna"
    speaker: scholar
    speaker_name: "al-Utbi"
    speaker_title: "Your secretary and historian"
    benchmark_provinces: 1
    story: >-
      Your army has crossed the rivers of the Punjab and reached Mathura, the city of Krishna,
      with a thousand stone buildings and temples. Your secretary writes that it would take
      two hundred years and a hundred thousand gold dinars to build such a city.


      Beyond it lies Kannauj, the old imperial city of the north, whose king has fled. Your
      soldiers want its gold. Your secretary is writing it all down for history.
    choices:
      - label: "Sack Mathura, and march on Kannauj"
        historical: true
        wealth_bp: 4000
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          Mathura's temples are burned for twenty days and their gold idols melted down. Kannauj
          surrenders. You go home with gold, slaves and elephants, and build a great mosque in
          Ghazni with the spoil. In the Indian lands, the memory of these raids lasts much
          longer than the treasure.
      - label: "Take tribute, and spare the temples"
        wealth_bp: 2000
        legitimacy_bp: -500
        outcome: >-
          The rajas pay. Your soldiers grumble that a ghazi should not take money from
          idolaters to leave their idols alone.
    history: >-
      Mahmud sacked Mathura and took Kannauj in 1018-1019, as al-Utbi records.
    sources: ["al-Utbi, Kitab-i Yamini", "Bosworth, The Ghaznavids (1963)"]

  - id: gha_somnath
    scenario: year_1000
    civ: ghaznavids
    year: 1025
    title: "Across the Desert to Somnath"
    place: "Multan"
    speaker: general
    speaker_name: "One of your commanders"
    speaker_title: "Of the army of India"
    benchmark_provinces: 1
    story: >-
      On the coast of Gujarat, at Somnath, stands a temple of Shiva, rich with the gifts of
      centuries, where thousands of pilgrims come at every eclipse. It is far beyond the
      reach of any earlier raid, across the Thar desert.


      You are fifty-five. Your commanders say thirty thousand camels can carry the water.
    choices:
      - label: "Cross the desert"
        historical: true
        wealth_bp: 4000
        legitimacy_bp: 1500
        outcome: >-
          Somnath is taken after a fierce fight on the walls; its defenders die in thousands.
          The temple is looted and the lingam broken, and pieces of it are set in the steps of
          the mosque at Ghazni. The Muslim world hails you as a hero of the faith. Within a few
          years the temple is rebuilt by the kings of Gujarat; the raid will be remembered, and
          argued over, for a thousand years.
      - label: "Spare yourself the desert"
        legitimacy_bp: -500
        outcome: >-
          The army goes home by the usual road, and the poets have less to sing about.
    history: >-
      Mahmud raided and sacked the Somnath temple in January 1026; it was soon rebuilt. Its
      memory has been reinterpreted many times since.
    sources: ["Ibn al-Athir, al-Kamil 9", "Thapar, Somanatha: The Many Voices of a History (2004)"]

  - id: gha_turkmen
    scenario: year_1000
    civ: ghaznavids
    year: 1028
    title: "Let the Turkmen In"
    place: "Khorasan"
    speaker: general
    speaker_name: "Arslan Jadhib"
    speaker_title: "Governor of Tus"
    benchmark_provinces: 1
    story: >-
      Four thousand tents of Oghuz Turkmen, herdsmen of the Seljuk clan, have asked to cross
      the Oxus and graze their flocks in Khorasan, under your protection. Their chief, Arslan
      Isra'il, is already your prisoner in a fortress in India.


      Your governor at Tus says you should not let them in. If you must, he says, cut off
      their thumbs so they cannot draw a bow.
    choices:
      - label: "Let them in"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The Turkmen graze their sheep on the steppes of Khorasan, and before long they are
          raiding your villages. Their kinsmen Tughril and Chaghri, Seljuk's grandsons, are
          watching from across the river.
      - label: "Keep them beyond the Oxus"
        legitimacy_bp: -500
        outcome: >-
          Your border guards turn the herds back. The Turkmen go west, to look for pasture in
          someone else's country.
    history: >-
      Mahmud allowed Turkmen followers of Arslan Isra'il to settle in Khorasan (c. 1025);
      the Seljuk Turkmen later overran it.
    sources: ["Bayhaqi, Tarikh-i Masudi", "Bosworth, The Ghaznavids (1963)"]

  - id: gha_rayy
    scenario: year_1000
    civ: ghaznavids
    year: 1029
    title: "The Library of Rayy"
    place: "Rayy"
    speaker: diviner
    speaker_name: "Your chief qadi"
    speaker_title: "Judge of the army"
    needs_alive: [buyids]
    benchmark_provinces: 2
    story: >-
      The Buyid prince of Rayy, Majd al-Dawla, has asked you to help him against his own
      soldiers. You have come, and taken Rayy, and Majd al-Dawla, who you say spends his
      time reading and with his women.


      Rayy has a famous library. Your judge says it is full of the books of heretics and
      philosophers, and of Shi'ites who curse the Prophet's companions.
    choices:
      - label: "Burn the heretics' books"
        historical: true
        legitimacy_bp: 1000
        knowledge_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          The books of the philosophers and the Mu'tazilites are burned under the trees where
          the heretics are hanged. The rest are carried off to Ghazni. You write to the caliph
          that you have cleansed Rayy.
        deeds: {take: [m_jibal]}
      - label: "Send the whole library to Ghazni"
        knowledge_bp: 2000
        outcome: >-
          A hundred camel-loads of books go east, heretics and all.
        deeds: {take: [m_jibal]}
    history: >-
      Mahmud took Rayy from the Buyid Majd al-Dawla in 1029, burned books he judged heretical,
      and sent others to Ghazni. He died in April 1030.
    diverged: >-
      The Buyids are gone.
    sources: ["Ibn al-Athir, al-Kamil 9", "Bosworth, The Ghaznavids (1963)"]

  - id: gha_canon
    scenario: year_1000
    civ: ghaznavids
    year: 1031
    title: "An Elephant Load of Silver"
    place: "Ghazni"
    speaker: scholar
    speaker_name: "Abu Rayhan al-Biruni"
    speaker_title: "Astronomer"
    benchmark_provinces: 2
    story: >-
      You are Masud, Mahmud's son. Your father died last year, and you took the throne from
      your brother Muhammad, who has been blinded. You are tall, brave, generous and a heavy
      drinker.


      Al-Biruni has finished his great book of astronomy - the motions of the sun, moon and
      planets, the size of the earth, the coordinates of six hundred places - and has named
      it the Masudic Canon, after you. You mean to reward him with an elephant's load of
      silver coins.
    choices:
      - label: "Send the silver"
        historical: true
        wealth_bp: -1500
        knowledge_bp: 2500
        legitimacy_bp: 1000
        outcome: >-
          Al-Biruni sends it back. He says he has enough to live on, and does not want his
          learning to be paid for. He goes on working until he dies, at seventy-five, asking a
          visiting lawyer a question about inheritance law on his deathbed.
      - label: "Give him an office instead"
        knowledge_bp: 1000
        outcome: >-
          Al-Biruni becomes your court astrologer, and finds he has less time for the stars.
    history: >-
      Al-Biruni dedicated al-Qanun al-Masudi (c. 1031) to Masud, and refused the elephant-load
      of silver offered for it.
    sources: ["Yaqut, Mu'jam al-udaba (on al-Biruni)", "al-Biruni, al-Qanun al-Masudi"]

  - id: gha_dandanaqan
    scenario: year_1000
    civ: ghaznavids
    year: 1040
    title: "Thirst at Dandanaqan"
    place: "The desert road to Merv"
    speaker: general
    speaker_name: "One of your Indian commanders"
    speaker_title: "With the elephants"
    benchmark_provinces: 1
    story: >-
      The Seljuk Turkmen your father let in have taken Merv and Nishapur, and their chief
      Tughril has sat on your throne in Nishapur and called himself sultan. You have marched
      against them with fifty thousand men, elephants and a great baggage train.


      The Seljuks will not fight. They ride around you, block the wells, and wait. Your army
      is in the desert near the small fort of Dandanaqan, and there is no water.
    choices:
      - label: "Fight your way to the wells"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Your thirsty army breaks. Some of your Turkish slave-soldiers go over to the Seljuks.
          You fight your way out with a few men and ride back to Ghazni, and set out for India
          to raise a new army. On the way your own soldiers depose you, and your brother
          Muhammad's men kill you. Khorasan belongs to the Seljuks, who will soon rule from
          Baghdad.
        deeds: {ruler_falls: "is deposed by his own soldiers", give: [m_jibal]}
      - label: "Retreat to Ghazni with the army whole"
        legitimacy_bp: -1500
        outcome: >-
          You march back to Ghazni in good order, and the Seljuks keep Khorasan.
        deeds: {give: [m_jibal]}
    history: >-
      The Seljuks defeated Masud at Dandanaqan in May 1040; Masud was deposed and killed in
      1041, and the Ghaznavids withdrew to Afghanistan and India.
    sources: ["Bayhaqi, Tarikh-i Masudi", "Bosworth, 'Dandanqan', Encyclopaedia Iranica"]
