schema_version: 1
# Chronicle mode (D-120, D-XXX): Seuthes III and the Odrysian kingdom of Thrace, 336-313 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true). Facts
# follow Arrian's Anabasis 1, Diodorus 16.71, 18.14 and 19.73, Curtius 10.1 and Justin 12.1,
# with modern work by Archibald (The Odrysian Kingdom of Thrace, 1998), Delev and Theodossiev.
# Dates are approximate: Seuthes's revolt (about 325-324), the founding of Seuthopolis (late
# fourth century) and Seuthes's death (about 300) are not fixed by the sources. The scenario
# gives the player Seuthes from the start; the real Seuthes came to power later, in the 330s or
# 320s, and Kotys, Teres and Kersebleptes of the older line are background only. The Odrysians
# are one province here. benchmark_provinces is 1 throughout.
chapters:
  - id: ody_philips_death
    scenario: alexander
    civ: odrysians
    year: -336
    title: "The Tribute-Taker Is Dead"
    place: "The royal hall of the Odrysians"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Keeper of the tribute"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Seuthes, king of the Odrysians. Your people were once the greatest power of
      Thrace, and kings like Kotys took gold from Greek cities on the Hellespont and the Black
      Sea. Then Philip of Macedon came. He beat your kings in the 340s, took the tribute of the
      Thracian valleys, and put a Macedonian town, Philippopolis, on the plain of the Hebros.


      Now Philip has been murdered at a wedding. His son is twenty. The tribute chest is half
      full, and your chiefs want to know whether to send it to Pella.
    choices:
      - label: "Keep paying, and watch"
        historical: true
        legitimacy_bp: 300
        wealth_bp: -500
        outcome: >-
          You pay, and the chiefs grumble. In the spring the young king appears north of the
          mountains with an army. Those who rose in Thrace that year learn what he can do.
      - label: "Keep the tribute and rebuild your army"
        wealth_bp: 500
        unrest_bp: 500
        outcome: >-
          The chiefs cheer. Your army is the better for it, but Alexander's attention turns
          your way sooner.
        deeds: {men: 2000, grudges: {macedon: 1500}}
    history: >-
      After Philip's campaigns of the 340s the Odrysian kings paid tribute to Macedon. When
      Philip died in 336 BC, his son Alexander made the Thracian lands safe before going to Asia.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 16.71", "Arrian, Anabasis 1.1-2", "Archibald, The Odrysian Kingdom of Thrace (1998)"]

  - id: ody_haemus
    scenario: alexander
    civ: odrysians
    year: -335
    title: "The King Crosses the Haemus"
    place: "The Shipka pass of the Haemus mountains"
    speaker: macedon
    speaker_name: "Alexander"
    speaker_title: "King of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Alexander has marched from Amphipolis with Macedonians, Greek allies and Thracian
      auxiliaries. He wants the mountain peoples quiet before he goes to Asia, and he has begun
      with the free Thracians, who hold the pass of the Haemus with a barricade of wagons. They
      mean to roll the wagons down on his men.


      He has told his men to open ranks and, where they cannot, to lie down under their shields
      and let the wagons bounce over them. You are watching from the south. If the free
      Thracians are beaten, he will come to you for men.
    choices:
      - label: "Send horsemen to ride with him"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The wagons crash over the Macedonian shields and few men are hurt; the Thracians are
          driven off the pass. Thracian horsemen ride east with Alexander's army in the spring,
          and your spears are carried to Asia. You keep your throne, and your tribute.
        deeds: {men: 1000}
      - label: "Send help to the free Thracians"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          A few hundred of your men reach the Haemus too late. Alexander notices whose spears
          were found there.
        deeds: {grudges: {macedon: 2500}}
    history: >-
      In 335 BC Alexander forced the pass of the Haemus against free Thracians, then went on
      to defeat the Triballi on the Danube. Thracian cavalry then served in his army in Asia.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.1-2, 1.14", "Archibald, The Odrysian Kingdom of Thrace (1998)"]

  - id: ody_zopyrion
    scenario: alexander
    civ: odrysians
    year: -325
    title: "Zopyrion Does Not Come Back"
    place: "The plains south of the Danube"
    speaker: general
    speaker_name: "Your marshal"
    speaker_title: "Commander of the Odrysian horse"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Alexander is far away, in Persia and beyond, and he left a governor over Thrace,
      Zopyrion. Zopyrion thought to win glory of his own and led an army, said to have been
      thirty thousand strong, across the Danube against the Getae. The Roman writer Justin
      says he perished there with all his men. Curtius says storms and enemy attacks finished
      them. No one doubts that the army was lost.


      Your men have seen Macedonian garrisons left behind. Your marshal says the Odrysians will
      never get a better chance to be a kingdom again.
    choices:
      - label: "Raise Thrace against the garrisons"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          You call the clans, drive out the officers who collect the tribute, and send word to
          the Getae and the Greek towns of the coast that the Odrysian kingdom is back.
          Alexander is too far away to answer, and his regent Antipater has his hands full.
        deeds: {martial_bp: 1000, grudges: {macedon: 2500}}
      - label: "Stay quiet and bury the dead"
        legitimacy_bp: -800
        unrest_bp: 800
        outcome: >-
          The chiefs say Seuthes has missed his moment. The tribute goes on.
    history: >-
      After Zopyrion's army was destroyed in the north, about 325 BC, Seuthes rose in revolt and
      asserted the Odrysian kingship against Macedon. The exact date and cause are uncertain.
    diverged: >-
      Macedon is gone.
    sources: ["Curtius 10.1.43-45", "Justin 12.1", "Archibald (1998)"]

  - id: ody_lysimachus
    scenario: alexander
    civ: odrysians
    year: -323
    title: "Lysimachus Is Given Thrace"
    place: "On the border of the Odrysian lands"
    speaker: macedon
    speaker_name: "Lysimachus"
    speaker_title: "Newly appointed governor of Thrace"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Alexander has died in Babylon. His generals, meeting there, have divided his empire, and
      Thrace has gone to Lysimachus, a Companion of the dead king. Lysimachus is a hard
      soldier, and he has come to take his province.


      You are the king of the Odrysians, and the greatest ruler in Thrace. Your scouts say you
      outnumber him, with a large army, much of it horse. His army is small and his friends
      are far away. The Greeks, meanwhile, are in revolt against Antipater, and
      Lysimachus is needed elsewhere.
    choices:
      - label: "Meet him in the field"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          You fight him twice. Diodorus says you had many more men, and he says the fighting
          was hard and the outcome in doubt. Lysimachus does not break you, and you do not
          destroy him. His army stays in Thrace, busy with you, while the Greeks rise against
          Antipater in the Lamian War.
        deeds: {men: 3000, grudges: {macedon: 2000}}
      - label: "Pay him and become his tributary"
        wealth_bp: -1500
        legitimacy_bp: -1500
        outcome: >-
          Lysimachus takes your gold and is free to go south. The chiefs remember it.
    history: >-
      Lysimachus was given Thrace in 323 BC. Seuthes, with a larger army, fought him in two hard
      battles, and Lysimachus could not impose his rule then.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 18.3, 18.14", "Justin 13.4", "Archibald (1998)"]

  - id: ody_seuthopolis
    scenario: alexander
    civ: odrysians
    year: -318
    title: "A City for the King"
    place: "The valley of the Tonzos, among the burial mounds of your fathers"
    speaker: scholar
    speaker_name: "A Greek builder"
    speaker_title: "From the cities of the coast"
    benchmark_provinces: 1
    story: >-
      The Thracian kings have always moved with their courts, from hall to hall among the
      hills, feasting and giving gifts. Your fathers lie in great burial mounds in this valley,
      with their horses and their gold. Greek towns on the sea have walls, a market and a
      council, and your chiefs admire them and fear them.


      A Greek builder offers to lay out a city for you in the Greek manner, with walls, streets
      on a grid, a palace, a hearth of the Great Gods and a mint, in the valley beside the
      royal tombs.
    choices:
      - label: "Build the city and call it Seuthopolis"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1000
        knowledge_bp: 1500
        outcome: >-
          A walled town goes up, with a palace, houses of stone and mud brick, and a sanctuary.
          Your name goes on its coins in Greek letters, and Greek is used at your court. The
          town is yours, and a Greek-style capital for Thracian kings. The chiefs do not all
          like it.
        deeds: {martial_bp: 500}
      - label: "Keep the old ways, and the moving court"
        legitimacy_bp: -300
        outcome: >-
          Your hall remains a hall. The Greeks keep their walls.
    history: >-
      Seuthes III founded Seuthopolis, a walled town built in Greek style in the valley of
      Kazanlak, in the late fourth century BC (a precise date is not known), and issued coins
      with his name. It lasted into the next century.
    sources: ["Archaeological excavations at Seuthopolis (1948-54)", "Archibald (1998)", "Delev, in Thracians and Their Neighbours"]

  - id: ody_antigonus
    scenario: alexander
    civ: odrysians
    year: -313
    title: "The Greek Towns Rise"
    place: "The pass between the Haemus and the Black Sea"
    speaker: macedon
    speaker_name: "Lysimachus"
    speaker_title: "King of Thrace, as he calls himself"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      Antigonus One-Eye, who rules most of Asia, has a quarrel with Lysimachus, Cassander and
      Ptolemy. He has sent agents to the Greek towns of the Black Sea coast, who have risen
      against Lysimachus's garrisons: Callatis first, then others.


      Lysimachus has marched against the rebels. Their messengers have reached your court and
      asked you to stand with them.
    choices:
      - label: "Join the coastal towns"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Diodorus has Seuthes standing with the rebel towns, and Antigonus's men fighting in
          the same war. The fighting is hard, and the sources for it are thin. Lysimachus does
          not break you: Seuthes stays a king, and his coins carry on until about 300.
        deeds: {martial_bp: 500, grudges: {macedon: 2000}}
      - label: "Stay out of it"
        legitimacy_bp: -300
        outcome: >-
          The rebel towns fall alone, and Lysimachus remembers who did not help them. Thrace
          is quiet.
    history: >-
      In 313 BC the Greek towns of the western Black Sea, with Seuthes and help from Antigonus,
      rose against Lysimachus. Seuthes stayed on his throne until his death, about 300.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 19.73", "Archibald (1998)"]
