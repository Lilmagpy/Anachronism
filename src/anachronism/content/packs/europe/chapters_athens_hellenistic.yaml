schema_version: 1
# Chronicle mode (D-120, D-XXX): Athens in the age of the kings and of Rome, from the last year
# of the Chremonidean War to the fall of Corinth, 264-146 BC. Each chapter opens in its year
# (odd years open on the next turn); one choice is what history chose (historical: true).
# Athens had no king: the "ruler" is the leading man of the period - Chremonides in the war,
# then the Assembly under the Macedonian garrison, Eurycleides (with his brother Micion) after
# 229, and from the war with Philip the Assembly itself, since no single name is safe for
# 200-146. Dates: the surrender is dated 262/1 or 261 by different scholars (Habicht); Eurycleides'
# death is not recorded (the date in the scenario is a stand-in); the Oropus affair is 156/5.
# Facts follow Plutarch's Aratus, Pausanias 1, 3 and 7, Polybius, Livy 31 and 45, and the
# Athenian decrees as read by Habicht (Athens from Alexander to Antony), with Gruen. This is a
# different chronicle from the Alexander-era one (chapters_athens). Attica is one province.
chapters:
  - id: athp_siege
    scenario: punic_wars
    civ: athens
    year: -264
    title: "The Walls and the Fleet at Helene"
    place: "Athens, under siege"
    speaker: general
    speaker_name: "An officer of the walls"
    speaker_title: "Of the Long Walls"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Chremonides, who four years ago proposed the decree that brought Athens, Sparta
      and King Ptolemy of Egypt into one alliance for the freedom of Greece. Now Antigonus
      Gonatas, king of Macedon, has his army round Athens and his ships off the coast.


      King Areus of Sparta marched north to help you, and is dead at Corinth; his army has gone
      home. Ptolemy's admiral Patroclus has a fleet at Helene, the island off Sunium, and the
      two fleets have not fought. The
      grain ships do not come, and the bread ration has been cut again.
    choices:
      - label: "Hold out, and wait for Ptolemy"
        historical: true
        food_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          Athens holds for another year. Patroclus waits at Helene and Ptolemy sends no army.
          The people eat what they can find, and the walls stand, because Antigonus prefers to starve a city he admires
          rather than storm it.
      - label: "Open talks with Antigonus now"
        legitimacy_bp: -500
        outcome: >-
          The king, who calls himself the pupil of Zeno the Stoic, receives your envoys
          courteously. He asks for the end of the alliance and for garrisons, and he gets them
          a year sooner than he would have.
        deeds: {peace_with: [macedon]}
      - label: "Ask Ptolemy for soldiers, not only ships"
        unrest_bp: 500
        outcome: >-
          Your envoy sails to Alexandria. Ptolemy has soldiers, but his eyes are on Syria. The
          fleet stays where it is.
    history: >-
      Areus fell in battle near Corinth (265 or 264 BC) and Ptolemy's fleet under Patroclus
      never forced a fight. Athens held out until the winter of 262/1 BC (some scholars say 261).
    diverged: >-
      Macedon is gone.
    sources: ["Pausanias 3.6", "Justin 26.2", "Plutarch, Agis 3", "Habicht, Athens from Alexander to Antony (1997)", "Gruen, The Hellenistic World and the Coming of Rome (1984)"]

  - id: athp_surrender
    scenario: punic_wars
    civ: athens
    year: -261
    title: "The Gates Are Opened"
    place: "Athens"
    speaker: general
    speaker_name: "Antigonus Gonatas"
    speaker_title: "King of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Chremonides. There is no grain left and no help coming. Zeno the Stoic, whom
      Antigonus honoured as a teacher, has died this winter; the king's herald brings his terms
      and, with them, his courtesy.


      Antigonus asks that the war end, that the alliance with Egypt end, and that his soldiers
      hold the Piraeus and the harbour forts. He does not ask for the city to be burned. You and your brother Glaucon, who led the war,
      expect to be the men he wants out of Athens.
    choices:
      - label: "Open the gates, and go abroad"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          You and Glaucon leave for Alexandria, where Ptolemy gives you commands at sea. Athens
          is spared, but not free: a Macedonian garrison sits in the Piraeus for thirty years,
          and the Assembly learns to vote as Pella wishes.
        deeds: {peace_with: [macedon], ruler_falls: "goes abroad to serve Ptolemy"}
      - label: "Fight on to the last"
        unrest_bp: 2000
        food_bp: -2000
        outcome: >-
          The weakest die first, and the strongest soon after. The terms the king offers on
          the next day are worse.
        deeds: {peace_with: [macedon], ruler_falls: "goes abroad to serve Ptolemy"}
      - label: "Ask for terms that spare the walls and the Assembly"
        legitimacy_bp: -800
        wealth_bp: -700
        outcome: >-
          Your envoys haggle in the king's tent. Antigonus gives a little on the walls and on
          the Assembly, and takes it back in money and in the Piraeus garrison. You are
          named among the men who may not stay.
        deeds: {peace_with: [macedon], ruler_falls: "is sent into exile by the king's terms"}
    history: >-
      Athens surrendered in 262/1 BC (or 261). Macedonian garrisons held the Piraeus and the
      forts; Chremonides and Glaucon went into Ptolemy's service.
    diverged: >-
      Macedon is gone.
    sources: ["Pausanias 3.6.4-6", "Diogenes Laertius 7.6-12 (Zeno)", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_freedom
    scenario: punic_wars
    civ: athens
    year: -229
    title: "The Price of the Piraeus"
    place: "The Piraeus"
    speaker: ruler
    speaker_name: "Diogenes"
    speaker_title: "Macedonian commander of the Piraeus"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Eurycleides, and with your brother Micion you lead what is left of Athenian
      politics. For thirty-two years Macedonian soldiers have held the Piraeus. Now King
      Demetrius II is dead, his heir is a child, and the Macedonian commander, Diogenes, is
      willing to sell the forts.


      He wants a hundred and fifty talents. Athens has not got them. Aratus of Sicyon, who
      leads the Achaean League and wants Athens as a member, offers to give a share of it. He
      does not say so, but you would owe him.
    choices:
      - label: "Buy the garrison out, and join no league"
        historical: true
        wealth_bp: -2500
        legitimacy_bp: 3000
        unrest_bp: -1500
        outcome: >-
          Diogenes marches out with his men. Plutarch says Aratus gave twenty of the hundred and
          fifty talents. Athens is free for the first time since 262, and thanks Diogenes with a
          festival named for him. The city does not join the Achaean League, nor any other. For
          the next thirty years its policy is to be friendly to everyone, and a danger to no
          one.
      - label: "Join the Achaean League, and let Aratus pay"
        legitimacy_bp: 2800
        wealth_bp: -700
        unrest_bp: 300
        outcome: >-
          Athens would be the League's greatest city, and its first quarrel would be with
          Macedon, the moment a grown king sat in Pella.
        deeds: {grudges: {macedon: 1500}}
      - label: "Wait for the Macedonians to leave of their own accord"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          The new king's regents are not generous. The garrison stays another winter.
    history: >-
      In 229 BC Diogenes handed over the Piraeus, Munychia, Salamis and Sunium for a payment,
      arranged by Eurycleides and Micion with help from Aratus. Athens did not join the Achaean
      League.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Aratus 34", "Pausanias 2.8.6", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_ptolemais
    scenario: punic_wars
    civ: athens
    year: -224
    title: "A Vote for a King"
    place: "The Assembly on the Pnyx"
    speaker: ptolemaic
    speaker_name: "Ptolemy's envoy"
    speaker_title: "From Alexandria"
    needs_alive: [ptolemaic]
    benchmark_provinces: 1
    story: >-
      You are Eurycleides. Athens is free but small, with no army worth the name. To the north
      Antigonus Doson is marching into the Peloponnese to fight Cleomenes of Sparta. Overseas
      Ptolemy III of Egypt has been the city's friend since Chremonides' day and sends grain
      and gifts.


      There is a way to please a king for the price of a vote. Athens has twelve tribes, named
      for heroes and, since 307, for two Macedonian kings. A thirteenth could be named for
      Ptolemy, with its own seat on the Council. His envoy hints that he would not mind.
    choices:
      - label: "Name a thirteenth tribe for Ptolemy"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 1500
        outcome: >-
          The Council grows from six hundred to six hundred and fifty. Ptolemy is flattered
          and his gifts continue. Athenians will say, with a shrug, that this is how you stay
          free when you are weak.
      - label: "Honour Antigonus Doson instead"
        legitimacy_bp: 1000
        wealth_bp: 1200
        outcome: >-
          Doson is pleased, and sends gifts, and Ptolemy is not. Next winter Doson, busy in the south, forgets
          you; Ptolemy remembers.
        deeds: {grudges: {ptolemaic: 1000}}
      - label: "Honour no king, whatever it costs"
        legitimacy_bp: 500
        food_bp: -800
        outcome: >-
          Athens keeps its dignity and loses the grain.
    history: >-
      Athens created a thirteenth tribe, Ptolemais, in 224/3 BC, in honour of Ptolemy III
      Euergetes, whose benefactions to the city continued.
    diverged: >-
      Egypt is gone.
    sources: ["Pausanias 1.5.5", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_philip
    scenario: punic_wars
    civ: athens
    year: -200
    title: "Two Strangers at the Mysteries"
    place: "The Assembly on the Pnyx"
    speaker: steward
    speaker_name: "A magistrate"
    speaker_title: "Of the Council"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are the Assembly of Athens, and today you must decide a matter of life and death. In
      the autumn two young men from Acarnania, Philip's allies, walked into the sanctuary at
      Eleusis during the Mysteries without being initiated. They were seized and killed, as the
      law requires. Acarnania has complained to Philip of Macedon.


      Philip has sent an army to Attica. His men have burned the farms and stand outside the
      walls. Attalus of Pergamon and a Roman squadron have just sailed into the Piraeus. For
      thirty years Athens has been friendly to everyone.
    choices:
      - label: "Declare war, and call on Rome and Attalus"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 1000
        food_bp: -1000
        outcome: >-
          The Assembly votes to cut Philip's name out of every inscription and pull down his
          statues, and the priests curse him. The two tribes named for old Macedonian kings are
          closed, and a new tribe is called Attalis. Philip burns the Lyceum and the
          Cynosarges outside the walls, and goes away. Athens is in Rome's war.
        deeds: {grudges: {macedon: 2500}}
      - label: "Stay neutral, as for thirty years"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Philip's soldiers are in Attica anyway. They ruin the farms, and no one on earth
          will thank you for your neutrality.
      - label: "Open the gates and treat with Philip"
        legitimacy_bp: -2500
        outcome: >-
          The Macedonian king enters in good humour. Your friends in Rome will not forget it.
        deeds: {grudges: {rome: 1500}}
      - label: "Ask Rhodes and Pergamon to mediate with Philip"
        legitimacy_bp: 1200
        wealth_bp: -500
        unrest_bp: 400
        outcome: >-
          Envoys from Rhodes and Pergamon go to Philip's camp and are heard with
          impatience. The Assembly honours you for the attempt, though Philip goes on
          burning the farms while the talks go on.
    history: >-
      Athens declared war on Philip V in 200 BC, was ravaged by him, and was relieved by
      Attalus I and a Roman squadron. The Assembly erased Philip's honours and added the tribe
      Attalis.
    diverged: >-
      Macedon is gone.
    sources: ["Livy 31.14-16, 31.24, 31.44", "Polybius 16.25-26", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_delos
    scenario: punic_wars
    civ: athens
    year: -167
    title: "A Gift Taken from Rhodes"
    place: "The Assembly on the Pnyx"
    speaker: rome
    speaker_name: "The Roman Senate"
    speaker_title: "Through its commissioners"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Assembly of Athens. Rome has beaten Perseus of Macedon at Pydna, and the
      Senate is deciding who deserves a reward and who deserves a lesson. Rhodes, which sat on
      the fence in the war, is to lose its mainland lands in Caria and Lycia and a great deal of
      its trade.


      Athens, which stood firmly with Rome, is invited to ask for something. Delos, the holy
      island with its harbour, and Lemnos, are on offer. Rhodes was Athens' friend, and the
      people of Delos have lived there for ages.
    choices:
      - label: "Accept Delos and Lemnos"
        historical: true
        wealth_bp: 3500
        legitimacy_bp: 1500
        outcome: >-
          The Delians are sent away, many of them to the Achaean cities. Athenian settlers
          take their place, and Rome makes Delos a free port. In a few years its slave market
          and its warehouses are among the richest in the Mediterranean. Rhodes does not
          forgive you.
        deeds: {grudges: {rhodes: 1500}}
      - label: "Plead for Rhodes, your old friend"
        legitimacy_bp: -500
        outcome: >-
          The commissioners listen politely, and the Senate hears nothing about it.
      - label: "Ask only for Rome's friendship"
        legitimacy_bp: 500
        outcome: >-
          The Senate smiles and gives the islands to someone else.
      - label: "Take Lemnos, and leave Delos to its people"
        wealth_bp: 2500
        legitimacy_bp: 1200
        knowledge_bp: 800
        outcome: >-
          Athenian settlers are sent to Lemnos, and the Delians keep their island and their
          temples. Delos stays a quiet sanctuary with a modest harbour, and Rhodes is
          grateful that you did not take the other prize.
    history: >-
      After Pydna (168 BC) Rome gave Delos and Lemnos to Athens, expelled the Delians, and
      (in 166) made Delos a free port at Rhodes' expense.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 30.20, 30.31", "Strabo 10.5.4", "Pausanias 3.23.3", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_philosophers
    scenario: punic_wars
    civ: athens
    year: -155
    title: "The Fine for Oropus"
    place: "The Assembly on the Pnyx"
    speaker: scholar
    speaker_name: "Carneades"
    speaker_title: "Head of the Academy"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Assembly of Athens. Last year your men sacked the town of Oropus, which Athens rules. The Oropians
      appealed to Rome, and Rome asked Sicyon, a neutral city, to judge. Sicyon has fined
      Athens five hundred talents, without a hearing.


      Athens cannot pay it. But Athens has other things. Three of the most famous teachers in
      the world live in the city: Carneades of the Academy, Diogenes of the Stoa and Critolaus
      of the Lyceum.
    choices:
      - label: "Send the three philosophers to Rome"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        outcome: >-
          The three speak in Rome and the young men fill the lecture rooms. Carneades argues for
          justice one day and against it the next, which scandalises Cato, who tells the Senate
          to send the Greeks home before they spoil the young. The fine is cut to a hundred
          talents. Athens, which can no longer fight Rome, has found a way to talk to it.
      - label: "Refuse to pay and ignore Sicyon"
        unrest_bp: 1000
        legitimacy_bp: -1000
        outcome: >-
          Rome has no patience for cities that refuse its judges. The Roman people see Athens as
          one more quarrelsome Greek town.
      - label: "Pay the five hundred talents"
        wealth_bp: -4000
        outcome: >-
          It nearly empties the treasury. It does end the matter.
      - label: "Send your best orators and Pergamene friends to Rome"
        legitimacy_bp: 2000
        wealth_bp: 900
        unrest_bp: 200
        outcome: >-
          Athenian orators go to Rome with letters from Attalus of Pergamon. They are heard
          with courtesy, and the fine is reduced, though less than your friends had hoped.
    history: >-
      In 155 BC Athens sent Carneades, Diogenes of Babylon and Critolaus to Rome to plead
      against a fine of five hundred talents for the sack of Oropus; it was reduced to a hundred.
      Cato asked the Senate to send them away.
    diverged: >-
      Rome is gone.
    sources: ["Pausanias 7.11.4-5", "Plutarch, Cato the Elder 22", "Cicero, De oratore 2.155", "Gellius 6.14", "Habicht, Athens from Alexander to Antony (1997)"]

  - id: athp_corinth
    scenario: punic_wars
    civ: athens
    year: -146
    title: "Smoke over the Isthmus"
    place: "The Acropolis"
    speaker: steward
    speaker_name: "A traveller"
    speaker_title: "Just arrived from the Isthmus"
    needs_alive: [achaea, rome]
    benchmark_provinces: 1
    story: >-
      You are the Assembly of Athens. The Achaean League has fought Rome and lost. Consul
      Mummius's legions have beaten the League's army near the Isthmus, and Corinth, the
      richest city in Greece, has been emptied of its people and burned. The paintings and
      statues have gone to Rome by the shipload. The League has been broken up.


      Some in the Assembly say Athens ought to have joined the League and fought. They are
      few, and no one is in a mood to hear them.
    choices:
      - label: "Keep faith with Rome, as for fifty years"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 1000
        outcome: >-
          Athens, which stood aside, keeps its freedom and its treaty with Rome. Greece becomes
          a Roman province in all but name. For the next sixty years the city lives on its
          past: its schools, its festivals and Delos' warehouses.
      - label: "Take in the refugees from the League"
        unrest_bp: 1500
        legitimacy_bp: -500
        outcome: >-
          Some of the sick and starving are fed. Mummius is told, and does not like it.
        deeds: {grudges: {rome: 1000}}
      - label: "Send an embassy and gifts to honour Mummius"
        legitimacy_bp: 900
        wealth_bp: 700
        outcome: >-
          A statue and a delegation of Athens' oldest families go to the consul's camp. Mummius
          accepts them with the air of a man collecting what is owed, and Athens' name is
          kept off the list of cities to be punished.
    history: >-
      Athens took no part in the Achaean War (146 BC) and kept its free status under Rome.
    diverged: >-
      The Achaean League or Rome is gone.
    sources: ["Pausanias 7.15-16", "Polybius 38-39", "Habicht, Athens from Alexander to Antony (1997)", "Gruen, The Hellenistic World and the Coming of Rome (1984)"]
