schema_version: 1
# Chronicle mode (D-120, D-145): the Roman Empire of the East from Basil II to Alexios
# Komnenos, 1000-1081. Each chapter opens in its year; one choice is what history chose.
# Facts follow Michael Psellos's Chronographia (a courtier who saw most of it), John
# Skylitzes, Michael Attaleiates (who was at Manzikert), Anna Komnene, Yahya of Antioch and
# Aristakes of Lastivert, with modern work by Holmes, Kaldellis, Stephenson and Angold.
# 'You' are the emperor of the moment: the chronicle follows the throne, which passed
# through many hands. benchmark_provinces counts the provinces of this map the real empire
# held at that date.
chapters:
  - id: byz_campaigns
    scenario: year_1000
    civ: byzantium
    year: 1001
    title: "The Emperor Who Lived in a Tent"
    place: "Constantinople"
    speaker: general
    speaker_name: "Nikephoros Ouranos"
    speaker_title: "Commander in the west"
    needs_alive: [bulgaria]
    benchmark_provinces: 10
    story: >-
      You are Basil, and you have never married, never feasted, never read a book for
      pleasure. You were humiliated by Tsar Samuel of Bulgaria at the Gates of Trajan fifteen
      years ago, and you have not forgotten. You have made a ten-year truce with the Fatimids
      in the east. Now you mean to finish Bulgaria.


      Your general Ouranos says that Samuel will not fight a pitched battle. Bulgaria will
      have to be taken fortress by fortress, valley by valley, every summer, for as long as
      it takes.
    choices:
      - label: "Campaign every summer until it is done"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Year after year your army marches out in spring and comes home in autumn: Serdica,
          Vidin after an eight-month siege, Skopje, Edessa. You winter in the field more often
          than in the palace. Your soldiers love you; your courtiers do not.
        deeds: {war_with: [bulgaria], martial_bp: 1500}
      - label: "Make peace, and rebuild the treasury"
        wealth_bp: 2000
        outcome: >-
          Samuel accepts gifts and a border. He uses the peace to rebuild his army.
        deeds: {peace_with: [bulgaria]}
    history: >-
      From 1001 Basil II campaigned against Samuel's Bulgaria almost every year, taking it
      fortress by fortress over nearly two decades.
    diverged: >-
      Bulgaria is gone already.
    sources: ["Skylitzes, Basil II 23-35", "Holmes, Basil II and the Governance of Empire (2005)"]

  - id: byz_kleidion
    scenario: year_1000
    civ: byzantium
    year: 1014
    until_year: 1018
    title: "The Pass of Kleidion"
    place: "The Belasitsa mountains"
    speaker: general
    speaker_name: "Nikephoros Xiphias"
    speaker_title: "Commander of Philippopolis"
    needs_alive: [bulgaria]
    needs_war_with: [bulgaria]
    benchmark_provinces: 10
    story: >-
      Samuel has walled the pass of Kleidion against you, and your attacks have failed.
      Nikephoros Xiphias led his men over the mountain by goat tracks and came down behind the
      wall, and the Bulgarian army has broken. Samuel escaped. You have fifteen thousand
      prisoners.


      What will you do with them?
    choices:
      - label: "Blind them, and send them home to Samuel"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Ninety-nine of every hundred men are blinded; every hundredth keeps one eye to lead
          the rest. When the long lines of blind men reach Samuel at Prespa, he collapses and
          dies two days later. You will be remembered as Boulgaroktonos, the Bulgar-slayer.
        deeds: {martial_bp: 1000, grudges: {bulgaria: 5000}}
      - label: "Ransom them"
        wealth_bp: 2500
        outcome: >-
          Samuel pays in gold and gets his army back. The war goes on.
      - label: "Enlist them in your own army"
        legitimacy_bp: 500
        outcome: >-
          Fifteen thousand Bulgarians are sent east to garrison Armenia. Bulgaria has lost its
          army without gaining a martyr.
        deeds: {men: 15000}
    history: >-
      After Kleidion (1014) Basil II blinded the prisoners - 15,000 according to Skylitzes,
      perhaps an exaggeration - and Samuel died of shock.
    diverged: >-
      Bulgaria is gone already, or at peace.
    sources: ["Skylitzes, Basil II 35", "Stephenson, The Legend of Basil the Bulgar-Slayer (2003)"]

  - id: byz_ohrid
    scenario: year_1000
    civ: byzantium
    year: 1018
    until_year: 1022
    title: "The Keys of Ohrid"
    place: "Ohrid"
    speaker: bulgaria
    speaker_name: "Tsaritsa Maria"
    speaker_title: "Widow of the last tsar"
    needs_alive: [bulgaria]
    benchmark_provinces: 10
    story: >-
      Samuel's son died within a year; his murderer, Ivan Vladislav, has died besieging
      Dyrrachium. Now Ivan's widow Maria has come to your camp with her children and the keys
      of Ohrid. The Bulgarian nobles are surrendering one after another.


      Bulgaria is yours. The question is how to rule it.
    choices:
      - label: "Rule it gently: their own taxes, their own church"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -1000
        outcome: >-
          The Bulgarians keep paying their taxes in kind, as under their tsars. Their church
          keeps its own archbishop at Ohrid. Their nobles get Roman titles and Roman wives. You
          make a pilgrimage to Athens and give thanks in the Parthenon, which is a church of
          the Virgin.
        deeds: {conquer: [bulgaria]}
      - label: "Rule it as Roman land, Roman taxes, Roman bishops"
        legitimacy_bp: 1000
        unrest_bp: 1500
        wealth_bp: 1500
        outcome: >-
          Imperial tax collectors arrive in Ohrid with their lists. The Bulgarians remember
          their tsars.
        deeds: {conquer: [bulgaria]}
    history: >-
      Bulgaria submitted in 1018. Basil II let it keep taxes in kind and an autocephalous
      archbishopric at Ohrid, then celebrated in Athens.
    diverged: >-
      Bulgaria is gone already.
    sources: ["Skylitzes, Basil II 41-44"]

  - id: byz_heir
    scenario: year_1000
    civ: byzantium
    year: 1024
    title: "No Heir"
    place: "The Great Palace"
    speaker: steward
    speaker_name: "Your chamberlain"
    speaker_title: "Keeper of the treasury"
    benchmark_provinces: 12
    story: >-
      You are sixty-six. You have doubled the empire. The treasury holds two hundred thousand
      pounds of gold, so much that new vaults have had to be dug. You are planning a campaign
      to retake Sicily from the Arabs.


      But you have no wife and no son. Your brother Constantine, sixty-four, is a charming
      man who likes horse races and banquets and has never governed anything. His daughters,
      Zoe and Theodora, are in their forties and unmarried, because you never let anyone
      marry them.
    choices:
      - label: "Leave it to Constantine, and to God"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          You die the next year, preparing the expedition to Sicily. You are buried, at your own
          request, outside the city among your soldiers. Constantine spends three years at the
          races, and on his deathbed marries Zoe to the first suitable senator.
      - label: "Marry Zoe to a general now, and make him your heir"
        legitimacy_bp: 800
        influence: {nobility: 1000}
        outcome: >-
          Zoe marries Constantine Dalassenos, a hard soldier from the eastern frontier. The
          army is pleased; the court is not.
    history: >-
      Basil II died on 15 December 1025, leaving no heir and a vast treasury. Constantine
      VIII reigned until 1028. The next half-century saw the empire's strength squandered.
    sources: ["Psellos, Chronographia 1-2", "Skylitzes"]

  - id: byz_bath
    scenario: year_1000
    civ: byzantium
    year: 1034
    title: "The Emperor's Bath"
    place: "The Great Palace"
    speaker: steward
    speaker_name: "John the Orphanotrophos"
    speaker_title: "A eunuch, head of the orphanage"
    benchmark_provinces: 12
    story: >-
      You are Romanos, married to the Empress Zoe at sixty by order of her dying father. You
      have tried to be a new Marcus Aurelius and a new Justinian; you have built a great
      church and lost a battle in Syria. Zoe hates you. She has fallen in love with a handsome
      young man called Michael, brother of John the eunuch.


      Your physicians say you look ill. Your sister has warned you about Zoe and Michael. You
      are going to take your bath.
    choices:
      - label: "Take your bath as usual"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          In the great bath, your attendants hold you under the water for a long time. They
          pull you out still breathing; you die before morning. That same night Zoe marries
          Michael, and the patriarch, paid fifty pounds of gold, crowns him emperor.
        deeds: {ruler_falls: "is drowned in his bath"}
      - label: "Have Michael exiled, and set a guard on the baths"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Michael is sent to a monastery in Paphlagonia. Zoe stops speaking to you. The eunuch
          John begins to plan something else.
    history: >-
      Romanos III died in his bath on 11 April 1034, almost certainly murdered; Zoe married
      Michael IV the same day. Psellos describes the scene.
    sources: ["Psellos, Chronographia 3.26", "Skylitzes, Romanos III"]

  - id: byz_sicily
    scenario: year_1000
    civ: byzantium
    year: 1038
    until_year: 1042
    title: "Maniakes in Sicily"
    place: "Messina"
    speaker: general
    speaker_name: "George Maniakes"
    speaker_title: "Commander of the Sicilian expedition"
    needs_alive: [sicily_emirate]
    benchmark_provinces: 12
    story: >-
      George Maniakes, a giant of a man who took Edessa from the Arabs, has landed in Sicily
      with an army of Greeks, Lombards, Norman mercenaries and the Varangian Guard - among them
      a young Norwegian prince called Harald, who will one day be king of Norway and die at
      Stamford Bridge. Messina has fallen, and Syracuse.


      But Maniakes has quarrelled with the admiral Stephen, your brother-in-law, who let the
      Arab emir escape by sea. Maniakes beat him with a whip, calling him a fat useless
      eunuch. Stephen has written to you.
    choices:
      - label: "Recall Maniakes in chains"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Maniakes is brought home and imprisoned. Without him, the Sicilian campaign falls
          apart; the Arabs retake everything but Messina. The Normans, unpaid and insulted, go
          home to Apulia and start conquering it for themselves.
        deeds: {war_with: [sicily_emirate]}
      - label: "Recall Stephen instead, and give Maniakes everything he asks"
        legitimacy_bp: 1500
        materials_bp: -1500
        outcome: >-
          Stephen goes home in disgrace. Maniakes takes Palermo the next spring. Sicily is Roman
          for the first time in two hundred years.
        deeds: {war_with: [sicily_emirate], conquer: [sicily_emirate]}
    history: >-
      Maniakes's Sicilian expedition (1038-1040) took much of eastern Sicily; he was recalled
      after striking the admiral Stephen, Michael IV's brother-in-law, and the gains were lost.
      Harald Hardrada served in the Varangian Guard.
    diverged: >-
      Muslim Sicily is gone already.
    sources: ["Skylitzes, Michael IV", "Snorri, Haralds saga 5-10", "Amatus of Montecassino 2"]

  - id: byz_zoe
    scenario: year_1000
    civ: byzantium
    year: 1042
    title: "The People Want Their Mother"
    place: "Constantinople"
    speaker: steward
    speaker_name: "Michael Psellos"
    speaker_title: "A young secretary at court"
    benchmark_provinces: 12
    story: >-
      You are Michael V, nephew of the last emperor, adopted by the Empress Zoe to be her son.
      You are tired of her. Two nights ago you had her head shaved and sent her into exile on
      an island, and announced to the city that she had plotted to poison you.


      The city has risen. Men and women are tearing down the houses of your family and
      marching on the palace, shouting for Zoe, 'our mother', and for her sister Theodora,
      whom they have fetched from her convent.
    choices:
      - label: "Hold the palace"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Three thousand people die in the fighting. You flee to the monastery of Stoudios and
          cling to the altar. Theodora's men drag you out and blind you in the street. Psellos,
          who sees it, will write the story down. Zoe and Theodora rule together, the first
          time two women have reigned in their own right.
        deeds: {ruler_falls: "is dragged from sanctuary and blinded"}
      - label: "Bring Zoe back at once, and beg her forgiveness"
        legitimacy_bp: -1000
        outcome: >-
          Zoe is brought back from the island and shown to the crowd from the balcony of the
          Hippodrome, with you kneeling at her feet. The crowd goes home. Zoe does not forgive
          you.
    history: >-
      In April 1042 Michael V exiled Zoe; the people of Constantinople rose, he was deposed
      and blinded, and Zoe and Theodora reigned jointly before Zoe married Constantine IX.
    sources: ["Psellos, Chronographia 5.15-51", "Skylitzes, Michael V"]

  - id: byz_schism
    scenario: year_1000
    civ: byzantium
    year: 1054
    title: "The Bull on the Altar"
    place: "Hagia Sophia"
    speaker: diviner
    speaker_name: "Michael Keroularios"
    speaker_title: "Patriarch of Constantinople"
    benchmark_provinces: 12
    story: >-
      The Normans are conquering southern Italy, and you, Emperor Constantine Monomachos, need
      the Pope as an ally against them. The Pope has sent three legates under Cardinal Humbert,
      a man of very little tact. The Patriarch Keroularios, a man of even less, has refused to
      receive them, and has been closing the Latin churches of the city for using unleavened
      bread.


      This afternoon, during the liturgy, Humbert walked into Hagia Sophia and laid a bull of
      excommunication against the patriarch on the high altar, shook the dust from his feet,
      and walked out.
    choices:
      - label: "Let the patriarch excommunicate the legates back"
        historical: true
        influence: {clergy: 1500}
        legitimacy_bp: 500
        outcome: >-
          Keroularios's synod anathematises the legates. Nobody thinks of it as the end of
          anything: popes and patriarchs have quarrelled before. But the churches of Rome and
          Constantinople will not be reconciled for nine hundred years.
      - label: "Silence the patriarch, and keep the Pope as your ally"
        influence: {clergy: -2000}
        legitimacy_bp: -500
        outcome: >-
          The patriarch is ordered to keep quiet. He stirs up the city against you instead.
          The Pope's men go home pleased.
        deeds: {ally_with: [papacy]}
    history: >-
      On 16 July 1054 Cardinal Humbert excommunicated Patriarch Michael Keroularios in Hagia
      Sophia; the patriarch's synod replied in kind. The mutual excommunications were lifted
      only in 1965.
    sources: ["Psellos", "Humbert's bull (Patrologia Latina 143)", "Kolbaba, The Byzantine Lists (2000)"]

  - id: byz_manzikert
    scenario: year_1000
    civ: byzantium
    year: 1071
    title: "Manzikert"
    place: "Near Lake Van, in Armenia"
    speaker: general
    speaker_name: "Michael Attaleiates"
    speaker_title: "A judge on your staff"
    benchmark_provinces: 12
    story: >-
      You are Romanos Diogenes, a soldier who married the widowed empress and has spent three
      years trying to stop the Seljuk Turks from raiding Anatolia. Now you have brought the
      whole army east - Romans, Armenians, Normans, Turkish mercenaries - and met the Sultan
      Alp Arslan himself near Manzikert.


      The Sultan has sent envoys offering peace. Your generals want the decisive battle. The
      rearguard is commanded by Andronikos Doukas, nephew of the last emperor, whose family
      wants your throne.
    choices:
      - label: "Refuse the peace, and attack"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          All day you advance and the Turkish horse archers fall back. At dusk you turn for camp
          - and Andronikos tells the reserve that the emperor is dead, and leads it away. The
          Turks close in. You fight until your horse is killed under you, and are taken to the
          Sultan, who puts his foot on your neck and then treats you as a guest. He lets you go
          for a ransom. At home, the Doukas family has made itself emperor; they blind you.
          Within ten years the Turks are on the shores of the Aegean.
        deeds: {ruler_falls: "is captured at Manzikert, and blinded by his rivals", give: [m_armeniakon]}
      - label: "Accept the Sultan's peace"
        legitimacy_bp: -500
        outcome: >-
          You make peace and march home with the army whole. The Doukas family says you were
          afraid. The Sultan turns south against the Fatimids.
    history: >-
      At Manzikert (26 August 1071) Romanos IV was defeated and captured by Alp Arslan, after
      Andronikos Doukas withdrew the reserve. Released, he was deposed and blinded, and died
      in 1072. Anatolia was opened to Turkish settlement.
    sources: ["Attaleiates, History 20", "Psellos, Chronographia 7", "Hillenbrand, Turkish Myth and Muslim Symbol (2007)"]

  - id: byz_alexios
    scenario: year_1000
    civ: byzantium
    year: 1081
    title: "The Golden Bull"
    place: "Constantinople"
    speaker: venice
    speaker_name: "Envoys of the Doge"
    speaker_title: "From Venice"
    needs_alive: [venice]
    benchmark_provinces: 11
    story: >-
      You are Alexios Komnenos, a general of twenty-four who took the throne this spring.
      The treasury is empty; the Turks hold most of Anatolia; and Robert Guiscard, the Norman
      who took Bari and southern Italy, has landed in Albania with his son Bohemond and is
      besieging Dyrrachium, the gateway to the road to Constantinople.


      Venice, whose ships could cut the Normans off from Italy, offers its fleet. Its price:
      the right to trade in every port of the empire without paying any taxes at all, and a
      quarter of Constantinople for its merchants.
    choices:
      - label: "Grant Venice everything"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -1500
        outcome: >-
          The Venetian fleet beats the Normans at sea. Your golden bull of privileges makes
          Venice rich - and Venice will remember, a hundred and twenty years later, how rich
          Constantinople is.
        deeds: {ally_with: [venice]}
      - label: "Fight the Normans alone"
        legitimacy_bp: 1000
        food_bp: -2000
        outcome: >-
          Your army, with its Varangian Guard of English exiles from Hastings, meets the
          Normans at Dyrrachium. It is a hard fight, and a long war.
    history: >-
      Alexios I Komnenos took the throne in 1081, fought Robert Guiscard at Dyrrachium, and
      granted Venice sweeping trading privileges (the chrysobull of 1082). Many Varangians
      were by then English exiles.
    diverged: >-
      Venice is gone.
    sources: ["Anna Komnene, Alexiad 4-6", "Frankopan, The First Crusade (2012)"]
