schema_version: 1
# Chronicle mode (D-120, D-XXX): the Gauls of the Po valley, the Insubres and the Boii, from
# the land law of 232 BC to the Boii's defeat in 191 BC (the last chapter opens in 190). Each chapter opens in its year; one
# choice is what history chose (historical: true). Facts follow Polybius 2 and 3 (Telamon,
# Clastidium, Hannibal's arrival), Livy 21, 23, 31, 32, 34 and 36, and Plutarch's Marcellus,
# with modern work by Williams (The Making of a Roman Cisalpine Gaul), Peyre and Cunliffe.
# The Gauls left no written history: everything is told by Greeks and Romans, their enemies.
# Telamon (225), the Boii ambush (216) and the Placentia and Cremona fights (200) happen in
# odd years and open on the next turn. The ruler is a council of chiefs (the Gauls' own
# names for their offices are not known), except for Viridomarus, whom Polybius calls king of the
# Insubres in 222 (Plutarch writes Britomartus). benchmark_provinces is 2 while the Gauls
# held both provinces of the map and 1 from the Boii chapter on (Insubria had fallen by about 194; the game never removes the
# player's last province, so the Boii chapter counts one).
chapters:
  - id: gau_land_law
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -232
    title: "The Land of the Senones"
    place: "Mediolanum"
    speaker: steward
    speaker_name: "A Boian chief"
    speaker_title: "From the south of the Po"
    benchmark_provinces: 2
    story: >-
      You are the council of the Insubres and the Boii, the Gauls south and north of the Po.
      Your grandfathers sacked Rome, but that was long ago. Fifty years ago the Romans destroyed
      the Senones and took the coast of Picenum, and ever since the Boii have watched their
      armies and colonies creep up the Adriatic road.


      This year a Roman tribune, Gaius Flaminius, has carried a law dividing the old Gallic
      land on the Adriatic among the poor citizens of Rome, against the Senate's wishes.
      Your young men want to fight at once. Your elders say wait.
    choices:
      - label: "Hire the Gaesatae from beyond the Alps"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          Polybius says your chiefs sent envoys over the Alps, with gifts, to the Gauls of the
          Rhône valley, the hired spearmen called Gaesatae. It takes years to prepare, and
          Rome watches. Meanwhile you make allies of the Taurisci and the Alpine tribes.
        deeds: {peace_with: [rome], martial_bp: 500, men: 5000}
      - label: "Make a treaty with Rome, and give up the road"
        wealth_bp: 500
        legitimacy_bp: -1000
        unrest_bp: 600
        outcome: >-
          Rome accepts and, in time, builds a road through your country.
        deeds: {peace_with: [rome]}
      - label: "Arm your own men, and wait"
        wealth_bp: -500
        unrest_bp: 500
        outcome: >-
          You call out the home levy and drill it through the winters. It is a smaller
          force than a hired army would be, and your young men do not wait; some raid south
          on their own.
        deeds: {martial_bp: 800, men: 2000}
    history: >-
      The land law of Gaius Flaminius (232 BC) alarmed the Gauls. Polybius says the Boii and
      Insubres then sent to the Gaesatae of the Rhône valley and spent years preparing the war,
      which broke out in 225 BC.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 2.21-2.22", "Cicero, Brutus 57 and Cato 11 (Flaminius' law)"]

  - id: gau_telamon
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -225
    title: "Between Two Armies at Telamon"
    place: "The Etruscan coast"
    speaker: general
    speaker_name: "Your war-leader"
    speaker_title: "Of the Gaesatae"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are the council of the Insubres and Boii. Fifty thousand foot and twenty thousand
      horse and chariots, Boii, Insubres and Gaesatae under their kings Concolitanus and
      Aneroestus, have crossed the Apennines and overrun Etruria. The Roman army that tried to
      stop you at Faesulae was beaten, and Rome itself is only three days' march away.


      Now, laden with loot, you are marching home along the coast. Behind you comes a
      consul, Atilius's colleague; in front, by chance, the other consular army has landed at
      Pisa and is on the road to meet you. Your kings must decide where to fight.
    choices:
      - label: "Face both ways, back to back, on the coast at Telamon"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          You fight on two fronts: your line divided to face both armies. Polybius tells that the Gaesatae
          stripped to the waist for their spears, and the Romans were struck by the din of your
          horns and trumpets. But Roman javelins and cavalry did their work: some forty thousand of
          your men were killed and ten thousand taken. Aneroestus killed himself and Concolitanus
          was captured.
        deeds: {men: 8000, ruler_falls: "is cast down by the people after Telamon", grudges: {rome: 2500}}
      - label: "Drop the loot and break through to the Apennine passes"
        wealth_bp: -2000
        outcome: >-
          Most of the army escapes, with none of the booty it was fighting for. The Gaesatae,
          who came to be paid, melt away.
        deeds: {grudges: {rome: 1500}}
      - label: "Surrender your captives and sue for terms"
        legitimacy_bp: -2000
        outcome: >-
          Rome takes the captives and your chiefs go home in disgrace.
        deeds: {peace_with: [rome]}
    history: >-
      At Telamon in 225 BC the Gauls were caught between two consular armies and destroyed;
      Polybius gives about 40,000 killed and 10,000 captured. The consul Atilius fell. In 224 the
      Boii submitted.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 2.23-2.31"]

  - id: gau_clastidium
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -222
    title: "The King at Clastidium"
    place: "Clastidium"
    speaker: general
    speaker_name: "A Gaesatae captain"
    speaker_title: "At the king's side"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are Viridomarus, king of the Insubres, whose name Plutarch gives as Britomartus. The Romans have
      crossed the Po, beaten your people at the river Addua, and the Boii have already given in.
      Your men are besieging the Roman ally Acerrae on the Po. A Roman army under the consul
      Gnaeus Scipio is encamped across the river from you, and Marcellus, the other consul,
      is near with a force of horse.


      You have ten thousand Gaesatae with you. You can try to draw the siege off, or ride at
      once to Clastidium, where the Romans have a fort, to cut their supplies and draw them away
      from Acerrae. They say Marcellus is bold, and a little reckless.
    choices:
      - label: "Strike at Clastidium to draw the Romans off"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Marcellus meets you with a small force of horse. In the clash, Plutarch tells that you
          rode out against each other, and he killed you in single combat and stripped your armour:
          the third and last time in Roman history that a Roman general dedicated the spolia
          opima. The Gaesatae lose heart and Mediolanum falls to Scipio soon after.
        deeds: {peace_with: [rome], ruler_falls: "is killed by Marcellus at Clastidium", grudges: {rome: 1500}}
      - label: "Keep the siege and fight the main army"
        unrest_bp: 800
        outcome: >-
          Marcellus finds your camp divided by a river. It goes badly either way.
        deeds: {men: 2000, ruler_falls: "is killed in the river camp", grudges: {rome: 1500}}
      - label: "Withdraw across the Alps with the Gaesatae"
        legitimacy_bp: -1000
        outcome: >-
          Your mercenaries want their pay and go home. The Insubres are left alone.
        deeds: {men: 4000, ruler_falls: "is deserted by his Gaesatae", grudges: {rome: 1000}}
    history: >-
      In 222 BC, at Clastidium, the consul Marcus Claudius Marcellus killed the Insubrian king
      Viridomarus in single combat and took the spolia opima. Rome then took Mediolanum, and
      the Insubres submitted.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 2.34", "Plutarch, Marcellus 6-8"]

  - id: gau_hannibal
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -218
    title: "Colonies on the Po"
    place: "The Po valley"
    speaker: general
    speaker_name: "A Carthaginian envoy"
    speaker_title: "Sent by Hannibal"
    benchmark_provinces: 2
    story: >-
      You are the council of the Boii and Insubres. Three years after Clastidium the Romans have
      planted two colonies on the Po, Placentia on the south bank and Cremona on the north, six
      thousand settlers each, on land your people consider theirs. You have sworn peace. But
      the Roman land-surveyors are measuring your fields.


      Envoys from Hannibal, who is coming over the Alps with an army, have come to you.
      Polybius says he promised to take no land and to fight only Rome. He asks for guides, food
      and men, and for you to rise against the colonies.
    choices:
      - label: "Rise against the colonies, and welcome Hannibal"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: -500
        outcome: >-
          The Boii drive the Roman surveyors out and besiege them at Mutina; the consul's relief
          army is ambushed. When Hannibal arrives, tired, with half his army lost in the mountains,
          Gauls join him in thousands. He wins his first great victories on your land at the
          Ticinus and the Trebia. Many of your men march south with him.
        deeds: {martial_bp: 300, men: 12000, grudges: {rome: 3000}}
      - label: "Keep your peace with Rome, and guard the Po"
        legitimacy_bp: -1000
        wealth_bp: 300
        unrest_bp: -300
        outcome: >-
          Hannibal's army, starved and sick, finds your valley hostile. Rome's colonies take root.
        deeds: {peace_with: [rome]}
      - label: "Take Hannibal's gold, but keep your men at home"
        wealth_bp: 1000
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          You are pleased. Neither side trusts you afterwards.
    history: >-
      In 218 BC, as Rome planted Placentia and Cremona, the Boii rose and Hannibal reached the
      Po. Gauls from both peoples joined his army, and his victories at the Ticinus and Trebia
      followed.
    sources: ["Polybius 3.40, 3.44, 3.60-3.70", "Livy 21.25-21.26, 21.29"]

  - id: gau_litana
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -216
    title: "The Litana Forest"
    place: "Silva Litana"
    speaker: general
    speaker_name: "A Boian war-leader"
    speaker_title: "Of the forest tribes"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      You are the council of the Boii. Hannibal has crushed the Romans at Cannae, and the south
      of Italy is going over to him. Rome has sent an army north to punish you and to keep the
      Gauls from joining Hannibal: Lucius Postumius Albinus, who has just been elected
      consul, leads twenty-five thousand men through the forest of Litana.


      You know the forest and the Romans do not. You could ambush them, or avoid battle and
      withdraw behind the Po.
    choices:
      - label: "Ambush the Romans in the Litana forest"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          Livy tells that the Boii cut most of the trees so that they stood, and a push made
          them fall onto one another. The Romans were crushed and struck down; Postumius died with
          most of his army. Livy says the Boii hung up the spoils in their holiest temple, and
          the skull of the dead consul was cleaned and gilded and used by the priests as a
          sacred cup, as their custom was. Rome will remember.
        deeds: {grudges: {rome: 2500}}
      - label: "Retreat behind the Po and let the army pass"
        legitimacy_bp: -1000
        wealth_bp: 300
        outcome: >-
          The Romans march home with nothing to show but burnt farms. Your people say you were
          afraid.
      - label: "Send all the men south to join Hannibal"
        unrest_bp: 800
        outcome: >-
          Your country is left unguarded. Rome returns the next summer.
        deeds: {martial_bp: 300}
    history: >-
      In 216 BC the Boii destroyed the army of Lucius Postumius Albinus in the Litana Forest;
      Livy says only a handful escaped. The Gauls of the Po went on fighting Rome, on and off,
      for many years.
    diverged: >-
      Rome is gone.
    sources: ["Livy 23.24"]

  - id: gau_placentia
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -200
    title: "Hamilcar and Placentia"
    place: "Placentia"
    speaker: carthage
    speaker_name: "Hamilcar"
    speaker_title: "A Carthaginian officer left in Gaul"
    benchmark_provinces: 2
    story: >-
      You are the council of the Boii and Insubres. Carthage has lost the war: Hannibal has gone
      home and Zama is over. But a Carthaginian officer, Hamilcar, left behind in Gaul since the
      raid of Mago, still travels among your tribes, talking about Rome's weakness. Livy says he
      has raised Insubres, Cenomani and Boii, and the Ligurians as well.


      Hamilcar wants you to follow him against the Roman colonies on the Po. He says Rome
      is exhausted and busy in the east. Her colonists, the men of Placentia and Cremona, are
      frightened and few.
    choices:
      - label: "Join Hamilcar and fall on Placentia"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 300
        outcome: >-
          Livy says you sacked and burned Placentia, so that scarcely two thousand people were
          left among the ruins, and then marched on Cremona. But Cremona's walls held, and the
          Romans came. In a battle outside Cremona the praetor Lucius Furius Purpureo broke your
          army; Livy says thirty-five thousand fell, including Hamilcar. The figure is probably
          exaggerated, but the army was destroyed.
        deeds: {men: 6000, grudges: {rome: 2500}}
      - label: "Stay out of it, and let Hamilcar go on alone"
        legitimacy_bp: -500
        outcome: >-
          Hamilcar's rising comes to nothing without you. Rome thinks you too clever.
      - label: "Make a separate peace and give hostages"
        wealth_bp: -500
        legitimacy_bp: -800
        outcome: >-
          Rome takes the hostages. Her colonies remain.
        deeds: {peace_with: [rome]}
    history: >-
      In 200 BC the Gauls under the Carthaginian Hamilcar sacked Placentia, and were beaten
      outside Cremona by the praetor Lucius Furius Purpureo; Hamilcar died. Cremona itself was
      not taken.
    sources: ["Livy 31.10-31.11, 31.21"]

  - id: gau_boii_end
    scenario: punic_wars
    civ: cisalpine_gauls
    year: -190
    title: "Half the Land"
    place: "The Boian lands"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio Nasica"
    speaker_title: "Consul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the chiefs of the Boii. Rome has beaten the Insubres at the Mincio, and in the
      years since has taken their towns, Comum and Mediolanum among them. Only your people
      still fight. For some years Roman consuls have marched through your country and
      burned what they found, and the war has dragged on without a decision.


      Last summer the consul Scipio Nasica came against you with two armies and fought a pitched
      battle. Livy says you lost twenty-eight thousand dead, which is surely too many, and
      thousands taken. Now Nasica offers terms: half your land, in return for peace.
    choices:
      - label: "Accept the terms: half the land for peace"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Livy says Rome took half your land. A colony is planted at Bononia in 189, and other
          colonies follow. Later writers say many of the Boii left the plain and went north over
          the Alps; some may be the Boii of Bohemia, whose name stays on the map. You are
          left with the rest, and the Romans have a road through it.
        deeds: {grudges: {rome: 1500}}
      - label: "Fight on from the hills"
        unrest_bp: 800
        legitimacy_bp: -500
        outcome: >-
          The Romans burn the plain, and the hills are bare of food by winter.
        deeds: {grudges: {rome: 2500}}
      - label: "Abandon the plain and take your people north over the Alps"
        legitimacy_bp: -500
        wealth_bp: -1500
        outcome: >-
          Your people take their herds and wagons into the mountains and leave the Po valley to
          the Romans.
    history: >-
      The Boii were defeated by Publius Cornelius Scipio Nasica in 191 BC, ceded about half of
      their land, and Bononia was founded in 189 BC. The Insubres and Cenomani had submitted
      earlier and the Po valley became Roman.
    diverged: >-
      Rome is gone.
    sources: ["Livy 32.30, 34.46-34.47, 35.4-35.5, 36.38-36.40, 37.57", "Strabo 5.1.6"]
