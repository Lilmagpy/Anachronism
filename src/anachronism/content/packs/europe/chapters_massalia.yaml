schema_version: 1
# Chronicle mode (D-120, D-XXX): Massalia, Rome's Greek friend in the west, 218-118 BC. Each
# chapter opens in its year; one choice is what history chose (historical: true). Facts follow
# Polybius 3 and 33, Livy 21-22 and the Periochae (47, 60), Appian's Celtic Wars, Strabo 4.1.5
# (the Six Hundred and the Fifteen) and Justin 43, with modern work by Clerc (Massalia), Rivet
# (Gallia Narbonensis) and Dietler. Massalia is one province on this map throughout, so
# benchmark_provinces is 1 at every date; the land Rome later wins for it is not counted.
# The ruler is the council: the Six Hundred (timouchoi), who served for life, with the Fifteen
# as their executive. Chapter years follow the turn grid (even years), so 217 and 125 BC
# open in 216 and 126 BC. Exact book and chapter numbers for Livy are approximate.
chapters:
  - id: mas_rhone
    scenario: punic_wars
    civ: massalia
    year: -218
    title: "Guides for a Consul"
    place: "Massalia"
    speaker: rome
    speaker_name: "Publius Cornelius Scipio"
    speaker_title: "Consul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred of Massalia, the council of the old Greek city that Phocaean
      sailors founded on this coast four centuries ago. Rome has been your friend since the
      days when the Gauls burned her; Justin says you sent gold to help pay her ransom. Your
      merchants trade with Spain and the Gauls, and you have heard what Hannibal has done to
      Saguntum. The Roman envoys, coming home from Carthage, stopped in your country and the
      Gaulish tribes behind it; Livy says they found that Hannibal's agents had been there before
      them.


      Now the Roman fleet has put in, bringing the consul Scipio. He thinks Hannibal is still
      beyond the Pyrenees. In fact the Carthaginian army is already crossing the Rhône, four
      days up the river from the sea. The consul asks for scouts and for men who know the
      Gaulish tribes, and the Carthaginians, whose agents are in your markets, will hear what
      you answer.
    choices:
      - label: "Give Rome guides, scouts and a safe harbour"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Livy tells that Scipio sent three hundred picked horsemen up the river, guided by
          men of Massalia and followed by Gaulish auxiliaries, to see where Hannibal was. They
          found his rearguard and the camp he had just left. Scipio came three days too late;
          the Carthaginians were across the river, and he sent most of his army on to Spain with
          his brother Gnaeus and went back to Italy himself. Carthage will remember which side
          you were on.
        deeds: {grudges: {carthage: 1500}}
      - label: "Help Rome in secret, and keep a seat at Carthage's table"
        wealth_bp: 500
        legitimacy_bp: -500
        outcome: >-
          Your council tells the consul where the river tribes are, but sends no guides. Rome
          takes it as coolness, and Carthage as a mere pretence.
      - label: "Plead neutrality, and trade with both"
        wealth_bp: 1000
        legitimacy_bp: -1500
        outcome: >-
          The Carthaginians pass by, and your warehouses are untouched. But the consul remembers
          that his oldest friend in the west shut the gates.
        deeds: {grudges: {rome: 1500}}
    history: >-
      In 218 BC the consul Scipio landed at the mouths of the Rhône; Massaliots guided his
      scouts, who clashed with Hannibal's horse, but Hannibal had already crossed. Massalia
      stayed Rome's ally throughout the war.
    diverged: >-
      Rome is gone.
    sources: ["Livy 21.20, 21.25-26, 21.29", "Polybius 3.41-3.49", "Justin 43.5"]

  - id: mas_ebro
    scenario: punic_wars
    civ: massalia
    year: -216
    title: "Ships at the Ebro"
    place: "Massalia's harbour"
    speaker: rome
    speaker_name: "Gnaeus Cornelius Scipio"
    speaker_title: "Commander of the Roman army in Spain"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred. Last summer Gnaeus Scipio, the consul's brother, held the Spanish
      coast north of the Ebro, and the Carthaginians sent their fleet to challenge him. Your
      swift scouting ships, which know every cove from here to Emporion, were out ahead of the
      Roman fleet. They brought word that the enemy fleet, some forty ships, lay at the mouth of
      the Ebro, careless, with the crews ashore.


      Gnaeus Scipio now asks you for more ships of Massalia, for scouting and for the line of
      battle. A fleet is expensive, and Massalia does not own a navy to lose.
    choices:
      - label: "Send the fleet, and fight beside the Romans"
        historical: true
        wealth_bp: -1000
        legitimacy_bp: 1000
        outcome: >-
          Livy credits the ships of Massalia with the scouting, and says they fought in the
          line. The Carthaginians, caught with half their men ashore, ran their ships onto the
          beach; the Romans took twenty-five of them. For a long time afterwards the Romans hold
          the sea off Spain, and your own coastal trade is safe.
      - label: "Send only the scouts"
        wealth_bp: -300
        outcome: >-
          Your scouts bring the news and nothing more. Rome notices who risked what.
      - label: "Keep the fleet at home"
        wealth_bp: 500
        legitimacy_bp: -1000
        outcome: >-
          The ships stay safe in harbour. In the Senate, Massalia's words of friendship begin to
          sound cheap.
        deeds: {grudges: {rome: 1000}}
    history: >-
      In 217 BC Gnaeus Scipio sailed with thirty-five ships, guided by Massaliot scouts, to the
      Ebro and routed a Carthaginian fleet; Livy says the Massaliots fought well in the line.
    diverged: >-
      Rome is gone.
    sources: ["Livy 22.19-22.20", "Polybius 3.95-3.96"]

  - id: mas_ligurians
    scenario: punic_wars
    civ: massalia
    year: -154
    title: "The Ligurians at Antipolis"
    place: "Massalia"
    speaker: rome
    speaker_name: "A Massaliot envoy"
    speaker_title: "Returned from Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred. The Ligurian tribes of the hills, the Oxybii and the Deceates,
      have attacked Antipolis and Nicaea, your daughter towns on the coast to the east, and are
      besieging them. Your city has traded in these parts since the days of Pytheas, who sailed
      out of Massalia to the northern ocean, but your citizens are merchants, not soldiers.


      You have sent to Rome for help. The Senate sent three commissioners with a letter to the
      Ligurian chiefs. The Ligurians heard them in a rage, broke into the ship where they
      lodged and wounded one of the envoys. The Senate is now much angrier than you are.
    choices:
      - label: "Keep appealing to Rome, and let her send an army"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -300
        outcome: >-
          The consul Quintus Opimius comes with an army in 154. The Ligurian towns fall, their
          leaders are sent to Rome, and their lands are given to Massalia. You are safe again.
          You have also set a pattern: whenever the tribes of Gaul press you, Rome will send her
          legions and Rome will stay.
        deeds: {men: 3000}
      - label: "Hire Gaulish mercenaries and drive the Ligurians off yourselves"
        wealth_bp: -2000
        outcome: >-
          A summer's war empties the treasury. The Ligurians retire to the hills and return
          the next year.
        deeds: {martial_bp: 500}
      - label: "Pay the Ligurians to leave Antipolis and Nicaea alone"
        wealth_bp: -1500
        legitimacy_bp: -500
        outcome: >-
          The chiefs take the silver and ask for more the next year.
    history: >-
      In 154 BC the Oxybii and Deceates attacked Antipolis and Nicaea; after Roman envoys were
      attacked the consul Quintus Opimius defeated them and gave their land to Massalia.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 33.7-33.10", "Livy, Periocha 47"]

  - id: mas_salluvii
    scenario: punic_wars
    civ: massalia
    year: -126
    title: "The Salluvii at the Gates"
    place: "Massalia"
    speaker: rome
    speaker_name: "Marcus Fulvius Flaccus"
    speaker_title: "Consul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred. The Salluvii, the great Ligurian-Celtic tribe whose hill-forts
      stand on the heights of Entremont, press harder every year on your land and your
      trade-roads. Your envoys have gone to Rome again, as in your grandfathers' day.


      This time the Senate is talking not of a punishing raid but of an army that stays. Your
      friends in Rome warn you: a Roman garrison on the roads of Gaul will protect Massalia, and
      it will also surround her.
    choices:
      - label: "Ask Rome for her army"
        historical: true
        legitimacy_bp: 800
        wealth_bp: -300
        outcome: >-
          The consul Flaccus relieves you in 125, and Sextius Calvinus finishes the war. In 122
          he founds a Roman fort and baths at Aquae Sextiae, among the springs north of you. The
          Salluvii are broken, and Rome has a foothold in Gaul.
        deeds: {men: 2000}
      - label: "Try to buy the Salluvian chiefs with trade"
        wealth_bp: -1500
        outcome: >-
          Salluvian chiefs enjoy the wine and the silver and keep raiding.
      - label: "Make peace with the tribes and tell Rome to stay at home"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Rome answers that the friend who refuses her help also refuses her friendship.
        deeds: {grudges: {rome: 1000}}
    history: >-
      In 125 BC Massalia appealed to Rome against the Salluvii; Marcus Fulvius Flaccus and then
      Gaius Sextius Calvinus defeated them, and in 122 Sextius founded Aquae Sextiae, the first
      Roman town in Gaul.
    diverged: >-
      Rome is gone.
    sources: ["Livy, Periocha 60", "Strabo 4.1.5", "Appian, Celtic Wars 12"]

  - id: mas_province
    scenario: punic_wars
    civ: massalia
    year: -118
    title: "A Roman Port on Your Coast"
    place: "Massalia"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Of the harbour dues"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the Six Hundred. In 121 BC Rome beat the Allobroges and the Arvernian king
      Bituitus, and now her army has built a road, later called the Via Domitia, from Italy
      toward Spain through the land behind you. This year a Roman colony is to be founded on
      the coast at Narbo, to guard the road and the new province.


      Your merchants fear it: Narbo will be a Roman port on the road to Spain and the tin
      route, beside the city that has had that trade to itself. In Rome the proposal is
      disputed in the Senate, though a powerful speaker, Licinius Crassus, favours it.
    choices:
      - label: "Keep your friendship and your trade, and let Narbo rise"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Narbo is founded in 118. Massalia is not recorded as opposing it, and she keeps her
          freedom as an ally of Rome, with her own laws and her council, inside the Roman
          province. In later years she will keep the Greek language and schools, and will later
          pay for choosing the losing side in a Roman civil war.
      - label: "Send envoys to Rome to oppose the colony"
        wealth_bp: -300
        legitimacy_bp: -500
        outcome: >-
          The Senate listens politely and does what it wishes.
        deeds: {grudges: {rome: 500}}
    history: >-
      The Roman colony at Narbo Martius was founded in 118 BC, making the province of Gaul
      beyond the Alps. Massalia remained a free ally of Rome within it.
    diverged: >-
      Rome is gone.
    sources: ["Cicero, Brutus 160", "Strabo 4.1.5, 4.1.12", "Rivet, Gallia Narbonensis (1988)"]
