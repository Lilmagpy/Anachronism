schema_version: 1
# Chronicle mode (D-120, D-134): Alexander the Great, 336-323 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Arrian's Anabasis (from the lost memoirs of Ptolemy and Aristobulus), with
# Plutarch's Life, Diodorus 17, Curtius Rufus and Justin, and modern work by Bosworth,
# Lane Fox and Heckel. The ancient writers wrote three to five centuries later and loved a
# good story; where a famous tale is doubtful, the history note says so. This map ends at
# Parthia, so the campaigns in Bactria and India happen off its eastern edge.
# benchmark_provinces counts the provinces of this map the real Alexander held.
chapters:
  - id: alx_aegae
    scenario: alexander
    civ: macedon
    year: -336
    title: "Murder in the Theatre"
    place: "The theatre at Aegae"
    speaker: steward
    speaker_name: "Antipater"
    speaker_title: "Your father's oldest general"
    benchmark_provinces: 5
    story: >-
      This morning your father walked into the theatre at Aegae, alone and in white, to
      show the Greeks he needed no guards. One of his own bodyguards, Pausanias, ran up and
      stabbed him under the ribs. Pausanias tripped on a vine as he fled and was speared by
      your friends. Philip is dead at forty-six.


      You are twenty. Antipater, who has served your father for thirty years, has brought
      the army to acclaim you king. But your father's last wife, Cleopatra Eurydice, has a
      baby son; her uncle Attalus commands half the advance guard in Asia; your cousin
      Amyntas has a better claim than you by blood. And your mother Olympias is already
      on her way from Epirus.
    choices:
      - label: "Make yourself safe: let no rival live"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        influence: {nobility: -1000}
        outcome: >-
          Amyntas is executed for plotting. An agent goes to Asia, and Attalus is dead within
          weeks. Olympias, behind your back, has Cleopatra's baby killed and drives its
          mother to hang herself. You are angry with her, men say. You do not undo it.
      - label: "Spare the child and the cousin; rule by law"
        legitimacy_bp: -500
        unrest_bp: 800
        influence: {nobility: 1000}
        outcome: >-
          The old nobles respect you for it. Attalus writes secretly to Athens.
    history: >-
      Philip II was murdered at Aegae in 336 BC. Alexander, acclaimed by the army with
      Antipater's backing, eliminated Amyntas IV and Attalus; Olympias killed Cleopatra
      Eurydice's child. Whether Alexander or Olympias were behind Pausanias is still argued.
    sources: ["Diodorus 16.91-95", "Plutarch, Alexander 10", "Justin 9.7"]

  - id: alx_thebes
    scenario: alexander
    civ: macedon
    year: -335
    until_year: -332
    title: "Thebes Rises"
    place: "Before the walls of Thebes"
    speaker: general
    speaker_name: "Perdiccas"
    speaker_title: "Commander of a phalanx battalion"
    needs_alive: [thebes]
    benchmark_provinces: 5
    story: >-
      You were in the mountains of Illyria when a rumour reached Greece that you were dead.
      Thebes rose at once and besieged your garrison in its citadel. Demosthenes is sending
      Persian gold and Athenian weapons.


      You marched four hundred kilometres in thirteen days, and the Thebans woke to find
      you at their gates. You have offered pardon to all but two ringleaders. From the
      towers they shouted back that anyone who wants to free Greece from the tyrant should
      join them.
    choices:
      - label: "Storm the city, and let the Greeks decide its fate"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Perdiccas's battalion breaks into the city and the rest follow. Six thousand
          Thebans die in the streets. Your Greek allies - Phocians, Plataeans, all the old
          enemies of Thebes - vote to destroy it. The city is razed to the ground: only the
          temples and the house of the poet Pindar are left standing. Thirty thousand are
          sold as slaves. Athens sends congratulations.
        deeds: {conquer: [thebes], grudges: {athens: 2000, sparta: 1000}}
      - label: "Take the city and spare it"
        legitimacy_bp: 800
        outcome: >-
          Thebes is taken and garrisoned, and its people kept in their homes. The Greeks
          wonder whether you are as soft as you are lucky.
        deeds: {conquer: [thebes], grudges: {athens: 500}}
      - label: "Accept a fine and hostages, and march on"
        wealth_bp: 1500
        legitimacy_bp: -500
        outcome: >-
          Thebes pays, and hates you for it. You have Asia to think of.
        deeds: {tributaries: [thebes]}
    history: >-
      In 335 BC Alexander marched from Illyria to Thebes in about two weeks, took the city
      and, by the vote of his Greek allies, destroyed it, sparing Pindar's house. The terror
      kept Greece quiet while he was in Asia.
    diverged: >-
      Thebes is gone, or yours already: there is no revolt.
    sources: ["Arrian, Anabasis 1.7-9", "Plutarch, Alexander 11-13"]

  - id: alx_diogenes
    scenario: alexander
    civ: macedon
    year: -336
    title: "Stand Out of My Sun"
    place: "Corinth"
    speaker: scholar
    speaker_name: "Diogenes of Sinope"
    speaker_title: "A philosopher who lives in a jar"
    benchmark_provinces: 5
    story: >-
      The Greeks have met at Corinth and elected you leader of the war against Persia, as
      they elected your father. Every philosopher and statesman in Greece has come to
      congratulate you - except one. Diogenes, who lives in a large clay jar by the
      gymnasium and sleeps in the street, did not come.


      So you have gone to him. He is lying in the sun. You ask whether there is anything
      he wants from you. 'Yes,' he says. 'Stand out of my sun.'
    choices:
      - label: "Laugh: 'If I were not Alexander, I would be Diogenes'"
        historical: true
        legitimacy_bp: 600
        knowledge_bp: 800
        outcome: >-
          Your companions are laughing at the old man. You say that if you were not
          Alexander you would be Diogenes. The story will be told for two thousand years -
          and nobody will remember who else came to Corinth.
      - label: "Have him moved somewhere less in the way"
        legitimacy_bp: -300
        outcome: >-
          Two soldiers carry the jar, with Diogenes in it, to the other end of the square. He
          does not seem to mind. The Greeks do.
      - label: "Invite him to Asia with you"
        knowledge_bp: 1500
        outcome: >-
          Diogenes says he has seen Asia, and it is just like Greece but with more Persians.
          He sends a student instead.
    history: >-
      The meeting of Alexander and Diogenes at Corinth is told by Plutarch and Diogenes
      Laertius; it may be legend, but it was already famous in antiquity.
    sources: ["Plutarch, Alexander 14", "Diogenes Laertius 6.38"]

  - id: alx_granicus
    scenario: alexander
    civ: macedon
    year: -334
    until_year: -331
    title: "The Granicus"
    place: "The banks of the Granicus, in Asia"
    speaker: general
    speaker_name: "Parmenion"
    speaker_title: "Your father's great general"
    needs_alive: [persia]
    needs_owner: {a3_ionia: persia}
    benchmark_provinces: 6
    story: >-
      At the Hellespont you threw a spear from your ship into the beach and leapt ashore in
      armour: Asia, won by the spear. You sacrificed at Troy and laid a wreath on the tomb of
      Achilles. Now the Persian satraps of the west are waiting for you on the far bank of
      the river Granicus, cavalry along the top of the steep bank, Greek mercenaries behind.


      Memnon of Rhodes, their best general, told them to burn the crops and starve you; they
      refused. Parmenion says it is late in the day and the bank is steep: camp, and cross at
      dawn. You have thirty-two thousand foot and five thousand horse - and seventy talents
      in your treasury.
    choices:
      - label: "Cross now, at the head of the Companions"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          You lead the charge across the river. A Persian noble splits your helmet with an
          axe; Black Cleitus cuts off his arm before he can strike again. The Persian horse
          breaks; the Greek mercenaries are surrounded and cut down. Sardis opens its gates
          to you without a fight, and the cities of Ionia follow.
        deeds: {war_with: [persia], take: [a3_ionia, a3_lydia, a3_caria]}
      - label: "Wait for dawn, as Parmenion says"
        legitimacy_bp: 1000
        outcome: >-
          At dawn you cross upstream, unopposed, and the Persians, outflanked, fall back.
          The victory is cheaper and less glorious. Memnon withdraws to the coast and starts
          raising a fleet.
        deeds: {war_with: [persia], take: [a3_ionia, a3_lydia]}
    history: >-
      In May 334 BC Alexander forced the crossing of the Granicus against the satraps; Cleitus
      saved his life. Sardis surrendered and the Ionian cities were 'liberated'. Miletus and
      Halicarnassus had to be besieged.
    diverged: >-
      The road into Asia is not Persia's to hold: there is no battle at the river.
    sources: ["Arrian, Anabasis 1.13-17", "Plutarch, Alexander 16"]

  - id: alx_gordium
    scenario: alexander
    civ: macedon
    year: -333
    until_year: -330
    title: "The Knot at Gordium"
    place: "The citadel of Gordium, Phrygia"
    speaker: diviner
    speaker_name: "Aristander of Telmessus"
    speaker_title: "Your seer"
    needs_war_with: [persia]
    benchmark_provinces: 9
    story: >-
      In the old palace of the Phrygian kings stands an ox-cart, its yoke tied to its pole
      with a knot of cornel bark so tangled that no end can be seen. Whoever unties it, the
      prophecy says, will rule Asia.


      Half the army has come to watch. Aristander says the gods are watching too.
    choices:
      - label: "Draw your sword and cut it"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          One stroke, and the knot falls apart. That night there is thunder and lightning,
          which Aristander declares to be Zeus agreeing. Phrygia is yours, and from now on
          you will be the man who cut the Gordian knot.
        deeds: {take: [a3_phrygia]}
      - label: "Pull out the pin of the pole, and slip the knot off"
        legitimacy_bp: 1000
        knowledge_bp: 500
        outcome: >-
          You find the peg that holds the yoke and draw it out; the knot slides free. The
          clever ones are impressed. The soldiers are a little disappointed.
        deeds: {take: [a3_phrygia]}
      - label: "Leave it; you need no omens"
        legitimacy_bp: -500
        outcome: >-
          The cart stays in its temple. Somewhere in the army, men start to say that the
          prophecy was not for you.
        deeds: {take: [a3_phrygia]}
    history: >-
      At Gordium in 333 BC Alexander undid the Gordian knot - by cutting it, says most of the
      tradition; by drawing out the pole-pin, says Aristobulus.
    diverged: >-
      The war with Persia is over before you reach Gordium.
    sources: ["Arrian, Anabasis 2.3", "Plutarch, Alexander 18"]

  - id: alx_issus
    scenario: alexander
    civ: macedon
    year: -333
    until_year: -330
    title: "Issus"
    place: "The narrow plain by the Pinarus river"
    speaker: general
    speaker_name: "Parmenion"
    speaker_title: "Commander of the left"
    needs_war_with: [persia]
    needs_alive: [persia]
    benchmark_provinces: 10
    story: >-
      Darius himself has come with the royal army - a hundred thousand men, they say, though
      no one has counted. While you were sick with fever at Tarsus he slipped round behind
      you through the mountains and is now between you and Macedon, on the coast at Issus.
      He has cut your road home and killed your wounded in the hospital he found there.


      But the plain between the mountains and the sea is narrow, too narrow for his
      numbers. And you can see, in the centre of his line, the King of Kings in his war
      chariot.
    choices:
      - label: "Charge straight at Darius"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          The Companions cross the river and drive at the king's chariot. Darius turns and
          flees, throwing off his royal cloak and bow. His camp falls to you with his mother,
          his wife and his daughters. When his mother Sisygambis kneels to your friend
          Hephaestion, thinking him the king, you lift her up: 'You were not wrong, mother.
          He too is Alexander.'
        deeds: {take: [a3_cilicia, a3_cappadocia]}
      - label: "Hold the river line and let him break himself on the phalanx"
        legitimacy_bp: 1200
        outcome: >-
          Darius's Greek mercenaries cross and are slaughtered at the river. He withdraws in
          good order, with his family. The war will be long.
        deeds: {take: [a3_cilicia]}
      - label: "✦ Ride him down with stirruped lancers"
        needs_adopted: [stirrup]
        legitimacy_bp: 3500
        outcome: >-
          Braced in the stirrups, your lancers hit the royal guard like a battering ram and
          go straight through it. Darius is taken alive in his chariot, and the King of Kings
          sits in your tent as a prisoner. His satraps begin to wonder whom they serve.
        deeds: {take: [a3_cilicia, a3_cappadocia, a3_syria], grudges: {persia: 2000}}
    history: >-
      At Issus in November 333 BC Alexander broke Darius's army; Darius fled, leaving his
      family, whom Alexander treated with royal honour. The Alexander Mosaic from Pompeii
      shows the moment.
    diverged: >-
      Darius never comes to Issus.
    sources: ["Arrian, Anabasis 2.6-12", "Curtius 3.8-12", "The Alexander Mosaic (Naples)"]

  - id: alx_darius_letter
    scenario: alexander
    civ: macedon
    year: -332
    until_year: -330
    title: "If I Were Parmenion"
    place: "The camp before Tyre"
    speaker: persia
    speaker_name: "Envoys of Darius"
    speaker_title: "From the King of Kings"
    needs_war_with: [persia]
    needs_alive: [persia]
    benchmark_provinces: 12
    story: >-
      Darius has written again. This time he offers ten thousand talents of silver for his
      family, his daughter's hand in marriage, and every land west of the Euphrates. Asia
      Minor, Syria, Phoenicia, Egypt: half the empire, and peace.


      Parmenion, in council, says: 'If I were Alexander, I would accept.'
    choices:
      - label: "'So would I, if I were Parmenion'"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You tell the envoys that the money is yours already, and so is his daughter if you
          want her, and that if Darius wants anything else he can come and ask for it in
          person. The war goes on, to the end.
        deeds: {grudges: {persia: 2000}}
      - label: "Accept the Euphrates border, and half the empire"
        legitimacy_bp: 500
        wealth_bp: 4000
        unrest_bp: -500
        outcome: >-
          Peace is sworn. Syria, Phoenicia and Egypt are handed over by their satraps. You are
          king of the west at twenty-four. Your soldiers can go home rich - and the older ones
          do.
        deeds: {peace_with: [persia], take: [a3_syria, a3_phoenicia, a3_judea, a3_egypt]}
    history: >-
      Darius made at least two peace offers; the famous exchange with Parmenion is reported
      by Arrian and Plutarch, and the offer of the land west of the Euphrates probably came
      in 332 or 331 BC.
    diverged: >-
      The war with Persia has ended; there is no offer to refuse.
    sources: ["Arrian, Anabasis 2.25", "Plutarch, Alexander 29"]

  - id: alx_tyre
    scenario: alexander
    civ: macedon
    year: -332
    until_year: -330
    title: "The Island City"
    place: "Tyre"
    speaker: general
    speaker_name: "Diades of Thessaly"
    speaker_title: "Your chief engineer"
    needs_owner: {a3_phoenicia: persia}
    benchmark_provinces: 12
    story: >-
      Tyre, the queen of Phoenician cities, stands on an island half a mile out to sea, with
      walls forty-five metres high on the landward side. It would not let you sacrifice to
      its god. Its fleet is the best in Darius's navy, and as long as it holds, Persia rules
      the sea behind you.


      Your engineer says you can build a causeway across the strait to the walls, if the
      army will carry the stones.
    choices:
      - label: "Build the mole, whatever it takes"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -2500
        outcome: >-
          For seven months the army carries stones and tree trunks into the sea while the
          Tyrians burn your towers with fire-ships. Then the Phoenician and Cypriot fleets
          desert Darius and join you, and the walls fall to rams on ships. Eight thousand
          Tyrians die; two thousand are crucified along the shore; thirty thousand are sold.
          The causeway will turn Tyre into a peninsula forever.
        deeds: {take: [a3_phoenicia, a3_judea, a3_cyprus]}
      - label: "Leave Tyre blockaded and march on Egypt"
        legitimacy_bp: 300
        outcome: >-
          You leave a force to watch the island and march south. The Tyrian fleet raids your
          supply ships for a year.
        deeds: {take: [a3_judea]}
      - label: "✦ Pour a concrete causeway that sets under water"
        needs_adopted: [concrete]
        legitimacy_bp: 2500
        materials_bp: -1500
        outcome: >-
          Your engineers sink wooden frames into the strait and fill them with lime, volcanic
          ash and rubble that sets hard under the sea. The causeway reaches the walls in
          seven weeks instead of seven months. Tyre surrenders before its fleet can come home.
        deeds: {take: [a3_phoenicia, a3_judea, a3_cyprus, a3_syria]}
    history: >-
      The siege of Tyre lasted from January to July 332 BC. Alexander's mole, widened by
      silt, still joins the old island to the mainland.
    diverged: >-
      Tyre is not Persia's: there is no siege.
    sources: ["Arrian, Anabasis 2.16-24", "Curtius 4.2-4", "Marriner et al., on the Tyre tombolo (2007)"]

  - id: alx_alexandria
    scenario: alexander
    civ: macedon
    year: -331
    until_year: -328
    title: "A City by the Sea"
    place: "The coast west of the Nile mouths"
    speaker: steward
    speaker_name: "Deinocrates of Rhodes"
    speaker_title: "Your architect"
    needs_owner: {a3_egypt: persia}
    benchmark_provinces: 15
    story: >-
      Egypt has opened its gates without a fight: the Egyptians hated their Persian masters,
      and the priests at Memphis have crowned you Pharaoh. You have walked along the coast
      to a narrow strip of land between the sea and a lake, with an island offshore.


      Your architect has no chalk to mark out the streets, so he is using barley meal. Birds
      have come down and are eating the lines. Your seer says it means the city will feed
      the world. Then there is the oracle of Ammon at Siwa, three weeks into the desert,
      who is said to know whether you are the son of a god.
    choices:
      - label: "Found the city, and ride to Siwa"
        historical: true
        legitimacy_bp: 2500
        knowledge_bp: 1000
        outcome: >-
          Alexandria is laid out in a grid between the sea and the lake. At Siwa, the priest
          greets you as 'son of Ammon' - perhaps a mistake in his Greek, perhaps not. What
          the oracle told you in private, you never say. Within a century Alexandria will
          be the greatest city in the world.
        deeds: {take: [a3_egypt, a3_upper_egypt]}
      - label: "Take Egypt, and go straight back to war"
        legitimacy_bp: 1000
        outcome: >-
          You leave a governor in Memphis and march north. The barley meal is swept away.
        deeds: {take: [a3_egypt, a3_upper_egypt]}
      - label: "✦ Found the city around a printing house and a library"
        needs_adopted: [woodblock_printing]
        legitimacy_bp: 2000
        knowledge_bp: 4000
        outcome: >-
          At the heart of the new city you build a hall where scribes carve the books of the
          Greeks onto wooden blocks and print them by the thousand. Within twenty years
          every city in your empire has Homer and Aristotle on its shelves.
        deeds: {take: [a3_egypt, a3_upper_egypt]}
    history: >-
      Egypt surrendered to Alexander in 332 BC; in early 331 he founded Alexandria and
      visited the oracle of Ammon at Siwa. The barley-meal story is in Plutarch.
    diverged: >-
      Egypt is not Persia's to give up.
    sources: ["Arrian, Anabasis 3.1-4", "Plutarch, Alexander 26-27"]

  - id: alx_gaugamela
    scenario: alexander
    civ: macedon
    year: -331
    until_year: -328
    title: "Gaugamela"
    place: "The plain of Gaugamela, beyond the Tigris"
    speaker: general
    speaker_name: "Parmenion"
    speaker_title: "Commander of the left"
    needs_war_with: [persia]
    needs_alive: [persia]
    benchmark_provinces: 16
    story: >-
      Darius has chosen his ground this time: a wide, flat plain where his numbers can tell.
      He has had it levelled for his two hundred scythed chariots, and he has elephants
      from India and horsemen from Bactria and the steppe. His army stands to arms all night,
      afraid of a surprise.


      Parmenion, looking at the campfires that fill the plain, begs you to attack in the
      dark. You have forty-seven thousand men.
    choices:
      - label: "'I will not steal a victory': fight by daylight"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          You sleep so soundly that Parmenion has to wake you. At dawn you lead your line
          obliquely to the right, drawing the Persian left after you, until a gap opens in
          their centre - and you drive into it with the Companions, straight at Darius. He
          flees again. Babylon opens its gates and showers your road with flowers.
        deeds: {take: [a3_assyria, a3_babylonia]}
      - label: "Attack by night, as Parmenion says"
        legitimacy_bp: 1500
        outcome: >-
          Your night attack throws the Persian camp into chaos; thousands are killed in the
          dark. Darius escapes. Men say you won like a thief, but you won.
        deeds: {take: [a3_assyria, a3_babylonia]}
    history: >-
      At Gaugamela on 1 October 331 BC Alexander defeated Darius decisively. Arrian reports
      the refusal of a night attack. Babylon and Susa surrendered with their treasuries.
    diverged: >-
      The war with Persia is over; there is no last battle.
    sources: ["Arrian, Anabasis 3.8-15", "Babylonian Astronomical Diary for 331 BC"]

  - id: alx_persepolis
    scenario: alexander
    civ: macedon
    year: -330
    until_year: -326
    title: "The Palace of the Kings"
    place: "Persepolis"
    speaker: general
    speaker_name: "Parmenion"
    speaker_title: "Commander of the left"
    needs_owner: {a3_persis: persia}
    benchmark_provinces: 18
    story: >-
      Persepolis, the ceremonial heart of Persia, is yours, and its treasury holds a hundred
      and twenty thousand talents - more silver than all the Greek world has ever seen. It
      will take ten thousand mule pairs and five thousand camels to move it.


      Tonight there is a feast in the great hall of Xerxes, the king who burned Athens a
      hundred and fifty years ago. The Athenian courtesan Thais, very drunk, says it would be
      fitting for a woman of Athens to set fire to it. Parmenion says it is your own property
      now, and a king does not burn his own house.
    choices:
      - label: "Take a torch and burn it"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 3000
        influence: {nobility: -1000}
        outcome: >-
          The cedar roof of the hall of a hundred columns burns like dry grass. The Greeks
          cheer: Athens is avenged. In the morning, sober, you are said to regret it. The
          Persians will not forget it.
        deeds: {take: [a3_persis, a3_susiana]}
      - label: "Spare it, and hold court there as the new Great King"
        legitimacy_bp: 1500
        wealth_bp: 3000
        influence: {nobility: 1000}
        outcome: >-
          You sit on Darius's throne, under a golden canopy, as the nobles of Persia file
          past. Your Macedonians mutter. The Persians begin to think you might be a king they
          can serve.
        deeds: {take: [a3_persis, a3_susiana]}
    history: >-
      Alexander took Persepolis in early 330 BC and burned the palace that spring, either as
      deliberate revenge for Xerxes or, as the story goes, at a drunken feast. The burnt
      level and the ash of the hall's cedar beams were excavated in the 1930s.
    diverged: >-
      Persepolis is not Persian: there is no palace to burn.
    sources: ["Arrian, Anabasis 3.18", "Diodorus 17.72", "Schmidt, Persepolis I (1953)"]

  - id: alx_darius_dies
    scenario: alexander
    civ: macedon
    year: -330
    until_year: -326
    title: "The Last Achaemenid"
    place: "A road in Parthia"
    speaker: general
    speaker_name: "Craterus"
    speaker_title: "Commander of the phalanx"
    needs_alive: [persia]
    benchmark_provinces: 22
    story: >-
      You have chased Darius across the mountains for days, through the Caspian Gates, at a
      pace that killed horses. This morning your scouts found him in a covered wagon by the
      road - stabbed by his own satrap Bessus and left to die. Bessus has ridden east and
      calls himself King of Kings.


      Darius died before you reached him. His body lies in the wagon.
    choices:
      - label: "Cover him with your cloak, bury him as a king, and hunt Bessus"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 1500}
        outcome: >-
          You send the body to Persepolis to be buried in the tombs of his fathers. Now you
          are not a conqueror of the Persian empire but the avenger of its king. When Bessus
          is caught, you have his nose and ears cut off, Persian-style, and send him to be
          executed. The empire of Cyrus is yours.
        deeds: {conquer: [persia]}
      - label: "Declare the war won, and go home"
        legitimacy_bp: 500
        unrest_bp: -1000
        outcome: >-
          Your veterans cheer. Bessus holds the east, and his horsemen will raid your
          provinces for years.
        deeds: {take: [a3_media]}
    history: >-
      In July 330 BC Darius III was murdered by Bessus and his fellow satraps as Alexander
      closed in. Alexander gave him a royal burial and executed Bessus in 329.
    diverged: >-
      Persia is gone already.
    sources: ["Arrian, Anabasis 3.21-22, 4.7", "Curtius 5.13"]

  - id: alx_cleitus
    scenario: alexander
    civ: macedon
    year: -328
    title: "Black Cleitus"
    place: "Maracanda (Samarkand)"
    speaker: general
    speaker_name: "Cleitus the Black"
    speaker_title: "The man who saved your life at the Granicus"
    benchmark_provinces: 25
    story: >-
      Two hard years in the mountains of Bactria and Sogdiana, fighting horsemen who will
      not stand and cities that will not stay taken. You have begun to wear Persian robes
      and to have Persians kneel to you, and the old Macedonians hate it.


      At a drinking party in Maracanda, flatterers are comparing you to the gods. Cleitus,
      very drunk, stands up and says that your father did more than you, that Macedonians
      won your victories, and that it was his hand that saved your life at the Granicus.
      Your friends drag him out. He comes back in, still shouting. A guard's spear is
      within your reach.
    choices:
      - label: "Snatch the spear"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        influence: {nobility: -1500}
        outcome: >-
          You run him through. Then you try to fall on the spear yourself, and your friends
          hold you back. For three days you lie in your tent without eating, calling his
          name. The army begs you to live. Aristotle's nephew Callisthenes, who will not
          kneel, says nothing - for now.
      - label: "Walk out of the tent"
        legitimacy_bp: 300
        influence: {nobility: 500}
        outcome: >-
          You leave without a word. In the morning a sober Cleitus comes to apologise. He
          will die old, in Macedon, still telling the story of the Granicus.
    history: >-
      In 328 BC Alexander killed Cleitus in a drunken quarrel at Maracanda, and was
      overcome with remorse. The quarrel turned on Alexander's adoption of Persian customs.
    sources: ["Arrian, Anabasis 4.8-9", "Plutarch, Alexander 50-52"]

  - id: alx_hyphasis
    scenario: alexander
    civ: macedon
    year: -326
    title: "The River Where It Ended"
    place: "The Hyphasis river, in the Punjab"
    speaker: general
    speaker_name: "Coenus"
    speaker_title: "Commander of a phalanx battalion"
    benchmark_provinces: 25
    story: >-
      You have crossed the Hindu Kush and beaten King Porus and his elephants on the
      Hydaspes. Your horse Bucephalus died there; you named a city after him. Now you are on
      the bank of another river, and beyond it, you are told, lie the kingdom of the
      Nandas, two hundred thousand infantry, and four thousand elephants - and then the
      Ganges, and the end of the world.


      The army will not cross. It has marched eighteen thousand kilometres in eight years,
      through monsoon rains that have rotted its tents and armour. Coenus, your oldest
      general, speaks for them all: 'Sir, if there is one thing a man should know when to
      do, it is to stop.'
    choices:
      - label: "Sulk for three days - then turn back"
        historical: true
        legitimacy_bp: -500
        unrest_bp: -1500
        outcome: >-
          You shut yourself in your tent. Then the omens for crossing turn out bad, and you
          announce that you are going home. The soldiers weep and cheer. You build twelve
          huge altars on the riverbank to mark the end of your march. The road home will be
          by the desert of Gedrosia, and it will kill more of them than any battle.
      - label: "Cross with whoever will follow"
        legitimacy_bp: 1000
        unrest_bp: 3000
        outcome: >-
          Barely a third of the army follows you across. The rest stay on the bank, and
          their officers begin to talk about who should lead them home.
      - label: "Promise them home - by sea, in ships built here"
        legitimacy_bp: 500
        unrest_bp: -1000
        knowledge_bp: 1000
        outcome: >-
          You turn back to the Indus and build a fleet of two thousand boats. The army sails
          down to the ocean, and your admiral Nearchus finds the sea road home to Persia.
    history: >-
      At the Hyphasis (Beas) in 326 BC Alexander's army refused to go further. He turned back,
      sailed down the Indus and led part of the army through the Gedrosian desert, with heavy
      losses; Nearchus brought the fleet along the coast.
    sources: ["Arrian, Anabasis 5.25-29, 6.22-26", "Arrian, Indica"]

  - id: alx_susa
    scenario: alexander
    civ: macedon
    year: -324
    title: "The Weddings at Susa"
    place: "Susa"
    speaker: steward
    speaker_name: "Hephaestion"
    speaker_title: "Your dearest friend, and your second"
    benchmark_provinces: 25
    story: >-
      You are back in Persia, and you have an idea. Macedonians and Persians will be one
      people, with one king. You will marry Darius's daughter Stateira; Hephaestion her
      sister; and ninety of your Companions will take Persian noble brides, all on the same
      day, in Persian style, in a pavilion of a hundred couches. Ten thousand soldiers who
      have taken Asian wives will get wedding presents.


      And you have thirty thousand Persian boys, trained in Macedonian drill and armed with
      the sarissa. You call them the Successors.
    choices:
      - label: "Hold the weddings, and bring in the Successors"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 1000}
        unrest_bp: 1200
        outcome: >-
          The weddings last five days. Few of the marriages will survive your death. At Opis
          the Macedonian army mutinies when you send the veterans home - 'Go home, then, all
          of you!' you shout, and give their titles to Persians, until they come to your
          tent, weeping, and beg to be called your kinsmen again. You kiss them all.
        deeds: {men: 30000}
      - label: "Keep the army Macedonian"
        influence: {nobility: -1000}
        unrest_bp: -500
        outcome: >-
          The Persian boys are sent home. Your veterans are happy. The Persian nobles watch
          the doors to power close, and remember.
    history: >-
      The mass wedding at Susa in 324 BC joined Macedonian officers to Persian noblewomen;
      the mutiny at Opis followed. Most of the marriages were abandoned after Alexander's
      death; Seleucus's to Apama was a famous exception.
    sources: ["Arrian, Anabasis 7.4-11", "Plutarch, Alexander 70-71"]

  - id: alx_babylon
    scenario: alexander
    civ: macedon
    year: -323
    title: "To the Strongest"
    place: "The palace of Nebuchadnezzar, Babylon"
    speaker: general
    speaker_name: "Perdiccas"
    speaker_title: "Your second-in-command"
    benchmark_provinces: 25
    story: >-
      Hephaestion died last autumn, and you have not been yourself since. Now you are
      planning the conquest of Arabia, and the fleet is ready. Ten days ago, after a long
      night of drinking at the house of your friend Medius, you came down with a fever. It
      has not broken. You can no longer speak above a whisper. The soldiers have forced
      their way into the palace to file past your bed one by one.


      Your wife Roxana is pregnant. Your half-brother Arrhidaeus is simple-minded. Perdiccas
      bends over you and asks: to whom do you leave your kingdom?
    choices:
      - label: "Whisper: 'To the strongest'"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 3000
        outcome: >-
          You give Perdiccas your ring. You say, it is reported, that you foresee great
          funeral games. You die on the evening of the eleventh of June, aged thirty-two.
          Within weeks your generals are fighting over your body. It will take them forty
          years to divide your empire, and none of your family will survive it.
        deeds: {ruler_falls: "dies of fever in Babylon, aged thirty-two"}
      - label: "Name Perdiccas regent for Roxana's child"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          You die with a regent named and a plan made. The generals swear to it over your
          body. Some of them even mean it.
        deeds: {ruler_falls: "dies of fever in Babylon, aged thirty-two"}
      - label: "✦ Let your physicians treat the fever as an infection"
        needs_adopted: [germ_theory]
        legitimacy_bp: 2000
        outcome: >-
          Your doctors boil your water, keep the flies away and wash their hands, as your
          notebooks from the future say; they bring down the fever with bark and cold baths.
          On the twelfth day you sit up and ask for the reports from the fleet. History has
          lost the Hellenistic age. You have thirty years to do something else with it.
    history: >-
      Alexander died at Babylon on 10 or 11 June 323 BC, aged 32, probably of a fever
      (malaria, typhoid and poison have all been suggested). The wars of his successors
      lasted until about 281 BC; his son Alexander IV was murdered in 309.
    sources: ["Arrian, Anabasis 7.24-28", "Plutarch, Alexander 75-77", "Babylonian Astronomical Diary for 323 BC"]
