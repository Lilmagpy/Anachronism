schema_version: 1
# Chronicle mode (D-120, D-157): the Ptolemies of Alexandria, 264-196 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Polybius, the Letter of Aristeas (a legend), Callimachus and Catullus, the
# papyri and decrees in Greek and Egyptian (Canopus, Raphia, the Rosetta Stone), and modern
# work by Hölbl, Manning, Fraser and Thompson. benchmark_provinces counts the provinces of
# this map the real Ptolemies held at that date.
chapters:
  - id: pto_library
    scenario: punic_wars
    civ: ptolemaic
    year: -262
    title: "Every Book in the World"
    place: "The Museum, Alexandria"
    speaker: scholar
    speaker_name: "Callimachus"
    speaker_title: "Poet and cataloguer of the Library"
    benchmark_provinces: 6
    story: >-
      You are Ptolemy II, called Philadelphus, 'sister-loving', because you married your own
      sister Arsinoe, as the pharaohs did. Your father founded the Museum - the shrine of the
      Muses where scholars live at royal expense, eat together and argue - and its Library.


      Callimachus has begun a catalogue of every author in Greek, in a hundred and twenty
      volumes. Now the Library wants more: every ship that comes into Alexandria to have its
      books seized and copied, the copies returned and the originals kept.
    choices:
      - label: "Copy every ship's books, keep originals"
        historical: true
        knowledge_bp: 3000
        legitimacy_bp: 500
        influence: {guilds: -1000}
        outcome: >-
          The 'ships' books' pile up in the Library. Your successor will borrow the official
          copies of Aeschylus, Sophocles and Euripides from Athens, against a deposit of fifteen
          talents, and keep them, forfeiting the money. The legend says you also have the
          Hebrew scriptures translated into Greek by seventy-two scholars: the Septuagint.
      - label: "Buy rolls from the book dealers"
        knowledge_bp: 1500
        wealth_bp: -1500
        outcome: >-
          Book dealers from every port bring their wares to Alexandria, and forgers begin to
          make a good living.
      - label: "✦ Print every book in the Library"
        needs_adopted: [printing_press]
        knowledge_bp: 5000
        legitimacy_bp: 1500
        outcome: >-
          The Library becomes a press. Copies of every book go out to Antioch, Pergamon, Rome and
          Carthage by the thousand. When the Library burns, centuries later, nothing is lost.
      - label: "Send agents abroad to buy libraries"
        knowledge_bp: 3200
        wealth_bp: -700
        legitimacy_bp: 1200
        outcome: >-
          Your agents comb Rhodes, Athens and the Ionian cities and return with whole shelves of
          rolls, some of them rare, and a few private libraries bought entire. The treasury
          pays, but the catalogue grows faster than Callimachus had hoped.
    history: >-
      The Library of Alexandria flourished under Ptolemy II; Callimachus compiled the Pinakes.
      Galen tells the stories of the 'ships' books' and the Athenian tragedians' texts.
    sources: ["Galen, Commentary on Hippocrates' Epidemics 3", "Letter of Aristeas", "Fraser, Ptolemaic Alexandria (1972)"]

  - id: pto_berenice
    scenario: punic_wars
    civ: ptolemaic
    year: -246
    until_year: -241
    title: "A Sister to Avenge"
    place: "Alexandria"
    speaker: steward
    speaker_name: "Queen Berenice"
    speaker_title: "Your wife, princess of Cyrene"
    needs_alive: [seleucid]
    benchmark_provinces: 6
    story: >-
      You are Ptolemy III, newly king. Your sister, also called Berenice, was married to the
      Seleucid king Antiochus II to seal a peace. He is dead, and his first wife Laodice's
      people have murdered your sister and her baby son in Antioch.


      Your army and fleet are ready. Your wife, Berenice of Cyrene, has vowed a lock of her
      hair to the gods if you come home safely.
    choices:
      - label: "March on Antioch with army and fleet"
        historical: true
        legitimacy_bp: 2500
        wealth_bp: 2000
        outcome: >-
          You march through Syria to the Euphrates and beyond, and come home with forty thousand
          talents and the statues of Egypt's gods that the Persians carried off three hundred
          years ago. The Egyptian priests call you Euergetes, 'the benefactor'. The queen's
          lock of hair vanishes from the temple; the court astronomer Conon finds it in the sky,
          and names the constellation Coma Berenices.
        deeds: {take: [sel_cilicia], grudges: {seleucid: 3000}}
      - label: "Seize the Syrian coast, then halt"
        wealth_bp: 1800
        legitimacy_bp: 2300
        outcome: >-
          Seleucia, the port of Antioch, is yours, and its harbour dues and plunder come home to
          Alexandria with a victory the priests celebrate. The rest of the Seleucid empire stays
          Seleucid.
        deeds: {take: [sel_cilicia], grudges: {seleucid: 2000}}
      - label: "Demand silver and hostages by treaty"
        legitimacy_bp: -500
        wealth_bp: 1000
        outcome: >-
          Seleucus II, Laodice's son, cannot afford a war with you and pays in silver and
          hostages. Your army stays home. At Alexandria the priests murmur that your sister
          is unavenged, and the court is cooler towards you.
        deeds: {peace_with: [seleucid], grudges: {seleucid: 500}}
    history: >-
      Ptolemy III invaded the Seleucid empire in 246 BC (the Third Syrian War), recovering
      Egyptian cult statues. The story of the Lock of Berenice is told by Callimachus and
      translated by Catullus.
    diverged: >-
      The Seleucids are gone.
    sources: ["Gurob papyrus", "Canopus decree (238 BC)", "Catullus 66"]

  - id: pto_eratosthenes
    scenario: punic_wars
    civ: ptolemaic
    year: -240
    title: "The Size of the Earth"
    place: "The Museum, Alexandria"
    speaker: scholar
    speaker_name: "Eratosthenes of Cyrene"
    speaker_title: "Librarian of Alexandria"
    benchmark_provinces: 6
    story: >-
      Your new librarian, Eratosthenes, is so good at everything that the other scholars call
      him 'Beta': second best at all of it. He has heard that at Syene, far up the Nile, the
      sun shines straight down a well at noon on midsummer's day. In Alexandria, at the same
      moment, a stick casts a short shadow.


      He wants the royal surveyors who pace out the distances between towns to tell him exactly
      how far Syene is from Alexandria.
    choices:
      - label: "Lend him the royal surveyors"
        historical: true
        knowledge_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          The shadow's angle is a fiftieth of a circle; the distance is five thousand stades.
          So the Earth, Eratosthenes announces, is two hundred and fifty thousand stades round -
          within a few per cent of the truth, depending on the stade. He also draws a map of the
          world with lines of latitude, and finds a sieve for prime numbers.
      - label: "Put the surveyors to the tax roll"
        legitimacy_bp: 700
        wealth_bp: 2000
        unrest_bp: -500
        outcome: >-
          The surveyors finish the land register for the tax collectors, and the revenue grows.
          Eratosthenes writes a book on comedy instead.
      - label: "Fund his star-charts and armillary"
        knowledge_bp: 1500
        wealth_bp: -500
        outcome: >-
          The bronze rings of an armillary are cast in the Museum workshops, and Eratosthenes
          fixes the slant of the sun's path with great care. The size of the Earth waits for
          another year.
    history: >-
      Eratosthenes (c. 276-194 BC), librarian at Alexandria, measured the Earth's
      circumference from the sun's angle at Syene and Alexandria.
    sources: ["Cleomedes, On the Circular Motions 1.7", "Roller, Eratosthenes' Geography (2010)"]

  - id: pto_raphia
    scenario: punic_wars
    civ: ptolemaic
    year: -217
    until_year: -213
    title: "Arming the Egyptians"
    place: "Alexandria"
    speaker: steward
    speaker_name: "Sosibius"
    speaker_title: "Chief minister"
    needs_alive: [seleucid]
    benchmark_provinces: 6
    story: >-
      You are Ptolemy IV. Antiochus III has taken back Seleucia and most of Coele-Syria, and is
      coming for the rest. You do not have enough Greek and Macedonian soldiers to stop him.


      Your minister Sosibius has a solution nobody has tried in a hundred years: train twenty
      thousand native Egyptians as a Macedonian-style phalanx. Some of your Greek officers say
      that once the Egyptians have learned how to fight, they will not forget it.
    choices:
      - label: "Arm native Egyptians as phalangites"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: 1500
        outcome: >-
          At Raphia, Antiochus's cavalry breaks your left and chases it out of sight - and your
          Egyptian phalanx breaks his centre. Coele-Syria is saved. A decree in three scripts
          celebrates you as a pharaoh. Twelve years later, Upper Egypt rises in revolt, led by
          men who learned to fight at Raphia, and Thebes has its own pharaohs for twenty years.
        deeds: {men: 20000, take: [pto_coele_syria]}
      - label: "Hire Cretans, Thracians and Gauls"
        wealth_bp: -3000
        legitimacy_bp: 500
        outcome: >-
          Cretans, Thracians and Gauls are hired at great cost. At Raphia the battle is close,
          and Antiochus keeps part of Coele-Syria.
        deeds: {men: 12000}
      - label: "Stall with envoys, hold the border forts"
        legitimacy_bp: 1500
        wealth_bp: -1500
        unrest_bp: -500
        outcome: >-
          Embassies drag on through the winter while the forts of Pelusium are stocked and
          garrisoned at great expense. Antiochus loses patience and attacks anyway, and you meet
          him behind the walls with the men you have; the court, seeing the frontier held,
          praises your foresight.
        deeds: {men: 6000}
    history: >-
      At Raphia (217 BC) Ptolemy IV defeated Antiochus III with the help of 20,000 Egyptians
      trained as phalangites. The Great Theban Revolt followed (206-186 BC).
    diverged: >-
      The Seleucids are gone.
    sources: ["Polybius 5.65, 5.79-86, 5.107", "Raphia decree"]

  - id: pto_rosetta
    scenario: punic_wars
    civ: ptolemaic
    year: -196
    title: "A Decree in Three Scripts"
    place: "Memphis"
    speaker: diviner
    speaker_name: "The high priest of Ptah"
    speaker_title: "At Memphis"
    benchmark_provinces: 5
    story: >-
      You are Ptolemy V, thirteen. Your father died in mysterious circumstances, your mother was
      murdered by the ministers, and the Seleucids have taken Coele-Syria at Panium. Thebes is
      in revolt. You have just been crowned in Memphis, in the old way, by the Egyptian priests.


      In return, the priests want their temple taxes reduced, their prisoners released and
      their privileges confirmed. They will publish a decree praising you on stone, in every
      temple of Egypt.
    choices:
      - label: "Confirm the temples' demands in full"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -1500
        influence: {clergy: 2500}
        outcome: >-
          The decree is cut in hieroglyphs for the gods, demotic for the Egyptians and Greek for
          the court, and set up in temples across Egypt. One copy will be found in 1799 by French
          soldiers digging a fort at Rosetta, and with it, a young Frenchman called Champollion
          will learn to read the hieroglyphs.
      - label: "Keep the taxes; the crown needs coin"
        wealth_bp: 1500
        unrest_bp: 2000
        outcome: >-
          The priests crown you and say nothing. The temples of Upper Egypt pray for the rebels.
      - label: "Confirm their rights, keep the taxes"
        legitimacy_bp: 1500
        wealth_bp: -1000
        influence: {clergy: 1000}
        outcome: >-
          The priests accept the half-measure with grace, and the decree goes up in most temples
          with a good many words. Memphis is quiet and Thebes less hostile, though the
          concession costs you more than you planned.
    history: >-
      The Memphis decree of 27 March 196 BC, issued by the priests for Ptolemy V, survives in
      several copies, including the Rosetta Stone (British Museum).
    sources: ["Rosetta Stone (BM EA 24)", "Parkinson, Cracking Codes (1999)"]
