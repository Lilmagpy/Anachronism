schema_version: 1
# Chronicle mode (D-120, D-153): the fall of the Caliphate of Córdoba, 1002-1031.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Ibn Hayyan (quoted by Ibn Bassam and Ibn Idhari), Ibn Hazm, the Latin
# chronicles of León, and modern work by Kennedy, Scales, Fierro and Catlos. 'You' are
# whoever holds power in Córdoba: the chamberlain al-Mansur and his sons, then the
# caliphs of the civil war. benchmark_provinces counts the provinces of this map the real
# rulers of Córdoba held at that date.
chapters:
  - id: cor_mansur
    scenario: year_1000
    civ: cordoba
    year: 1002
    title: "The Fifty-Seventh Campaign"
    place: "Córdoba"
    speaker: general
    speaker_name: "Abd al-Malik"
    speaker_title: "Your son"
    benchmark_provinces: 6
    story: >-
      You are Muhammad ibn Abi Amir, called al-Mansur, 'the Victorious'. You began as a scribe;
      you are now the chamberlain who rules al-Andalus in the name of the caliph Hisham, a
      pious recluse who never leaves his palace. You have led fifty-six campaigns into the
      Christian north. You sacked Barcelona and León, and carried the bells of Santiago de
      Compostela to Córdoba on Christian backs to be hung as lamps in the Great Mosque.


      You are sixty-four, and ill. Your son says: let him lead this year's campaign.
    choices:
      - label: "Lead it yourself"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You ride north into Castile and sack the monastery of San Millán. On the way home you
          are carried in a litter, and you die at Medinaceli. You are buried in the dust you
          have shaken from your clothes after every campaign, collected for this. A Christian
          chronicler writes: 'Almanzor died, and was buried in hell.'
        deeds: {grudges: {leon: 2000, navarre: 1500}}
      - label: "Send your son, and rest"
        legitimacy_bp: 1200
        wealth_bp: 300
        outcome: >-
          Abd al-Malik leads the army north and comes home victorious. You live another two
          years, and teach him how to manage the caliph.
          The campaign is a success, and the army sees the heir at its head.
      - label: "Lead a short raid on the border with a small force"
        legitimacy_bp: 800
        wealth_bp: 600
        outcome: >-
          You ride out with a small column, raid the border country and come home in a few
          weeks. The army is spared the long march, and so are you.
        deeds: {men: 4000}
    history: >-
      Al-Mansur died at Medinaceli in August 1002 returning from his last campaign. His
      sons ruled after him as chamberlains.
    sources: ["Ibn Idhari, al-Bayan al-Mughrib", "Chronicon Burgense", "Kennedy, Muslim Spain and Portugal (1996)"]

  - id: cor_sanchuelo
    scenario: year_1000
    civ: cordoba
    year: 1008
    title: "Sanchuelo"
    place: "Córdoba"
    speaker: steward
    speaker_name: "A courtier of the Umayyad family"
    speaker_title: "At the caliph's palace"
    benchmark_provinces: 6
    story: >-
      Your brother Abd al-Malik is dead, perhaps of poison. You are Abd al-Rahman, called
      Sanchuelo, 'little Sancho', because your mother was a Navarrese princess. You have done
      what your father and brother never dared: you have made the caliph Hisham name you his
      heir, so that the caliphate will pass from the Umayyads to the Amirids.


      The Umayyad princes are furious. It is winter, but you want a victory in the north to
      prove yourself, and you mean to march against León. Your courtiers say Córdoba is
      restless.
    choices:
      - label: "March north in winter"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 3000
        outcome: >-
          While you are stuck in the snow, an Umayyad prince, Muhammad, seizes Córdoba, forces
          Hisham to abdicate, and loots and burns your father's palace city, Madinat
          al-Zahira. Your army melts away. You come back to Córdoba to beg for mercy, and are
          killed on the road. Al-Andalus has begun twenty years of civil war.
        deeds: {ruler_falls: "is killed on the road to Córdoba"}
      - label: "Stay in Córdoba and give up the succession"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          You announce that you never wanted to be caliph. The Umayyad princes are suspicious,
          and your own supporters, who staked their careers on you, are bitter.
      - label: "Send a general north, and stay in Córdoba"
        legitimacy_bp: -800
        wealth_bp: -1500
        outcome: >-
          A general takes the army north in your name while you stay in the city. He wins
          little, the cost is heavy, and the Umayyad princes see that the heir does not lead.
        deeds: {men: 8000}
    history: >-
      Sanchuelo had himself named heir by Hisham II in 1008-9; while he campaigned in winter,
      Muhammad II al-Mahdi seized Córdoba and destroyed Madinat al-Zahira. Sanchuelo was
      killed in March 1009.
    sources: ["Ibn Hayyan in Ibn Bassam, al-Dhakhira", "Scales, The Fall of the Caliphate of Córdoba (1994)"]

  - id: cor_zahra
    scenario: year_1000
    civ: cordoba
    year: 1010
    title: "The City of the Flower"
    place: "Before Córdoba"
    speaker: general
    speaker_name: "Wadih"
    speaker_title: "Commander of the Slav guards"
    benchmark_provinces: 6
    story: >-
      Córdoba has a new caliph - several, in fact. The Berber soldiers of al-Mansur's old army,
      hated in the city, have proclaimed their own Umayyad, Sulayman, and brought in Count
      Sancho of Castile with his knights. They are besieging Córdoba.


      Outside the walls stands Madinat al-Zahra, the 'City of the Flower', built by the great
      caliph Abd al-Rahman III: a palace city of marble and fountains, where a bowl of mercury
      in the reception hall threw sunlight round the room like lightning.
    choices:
      - label: "Hold Córdoba and leave the palace city to its fate"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          The Berbers sack Madinat al-Zahra. Its marble is carried off to new palaces all over
          Spain and North Africa; its ruins will be found a thousand years later. Córdoba holds
          for now. The Berbers come back in 1013 and take it too.
      - label: "Make peace with the Berbers and pay them"
        wealth_bp: -3000
        legitimacy_bp: -500
        outcome: >-
          The Berbers are paid and settled in the south. Córdoba and al-Zahra are spared. The
          Castilian count goes home rich.
        deeds: {grudges: {leon: 1000}}
      - label: "Hire Catalan knights from Barcelona"
        legitimacy_bp: -500
        wealth_bp: -2000
        outcome: >-
          A Catalan count's knights are hired for silver and come to Córdoba. They break up
          the Berber lines for a while, and then ask for their pay.
        deeds: {men: 3000}
    history: >-
      In 1010-13 Berber troops sacked Madinat al-Zahra and then Córdoba during the fitna (civil
      war) of al-Andalus.
    sources: ["Ibn Idhari", "Vallejo Triano, Madinat al-Zahra (2004)"]

  - id: cor_dove
    scenario: year_1000
    civ: cordoba
    year: 1022
    title: "The Ring of the Dove"
    place: "Xàtiva"
    speaker: scholar
    speaker_name: "Ibn Hazm"
    speaker_title: "A poet and jurist in exile"
    benchmark_provinces: 4
    story: >-
      Ibn Hazm grew up in the harem of a vizier's palace in Córdoba, among the women who taught
      him to read and write poetry. He has seen his father ruined, his house plundered by
      Berbers, his friends killed. He has been a vizier for a few weeks to a caliph who was
      murdered.


      Now, in exile at Xàtiva, a friend has asked him to write about love. He wants your
      protection while he does.
    choices:
      - label: "Protect him, and let him write"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 500
        outcome: >-
          'The Ring of the Dove' describes love at first sight, love from a description, the
          lover's messenger, the spy, the slanderer, forgetting and death - with stories from
          the ruined palaces of his youth. It will be read eight hundred years later as the
          tenderest book of medieval Spain.
      - label: "Tell him to write law instead"
        influence: {clergy: 1000}
        knowledge_bp: 1200
        unrest_bp: -800
        outcome: >-
          Ibn Hazm writes on law, quarrels with every jurist in al-Andalus, and his books are
          burned in Seville.
          The jurists applaud the patronage, even as he quarrels with them.
      - label: "Make him a teacher at the mosque school"
        knowledge_bp: 1000
        legitimacy_bp: 500
        influence: {clergy: 500}
        outcome: >-
          Ibn Hazm teaches at the school beside the Great Mosque. His pupils learn a great
          deal, and the jurists are pleased with the arrangement.
    history: >-
      Ibn Hazm (994-1064) wrote Tawq al-Hamama, 'The Ring of the Dove', around 1022 in Xàtiva.
    sources: ["Ibn Hazm, The Ring of the Dove (tr. Arberry, 1953)"]

  - id: cor_last_caliph
    scenario: year_1000
    civ: cordoba
    year: 1031
    title: "No More Caliphs"
    place: "Córdoba"
    speaker: steward
    speaker_name: "Abu al-Hazm ibn Jahwar"
    speaker_title: "Chief of Córdoba's notables"
    benchmark_provinces: 4
    story: >-
      You are Hisham III, the last Umayyad they could find. You have spent your reign in the
      palace while your vizier taxes the city to pay Berber soldiers. Córdoba has had nine
      caliphs in twenty-two years. Seville, Toledo, Zaragoza and Valencia are ruled by their
      own kings now.


      The notables of Córdoba, led by Ibn Jahwar, have come to the palace. They are not
      asking for anything.
    choices:
      - label: "Leave Córdoba"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The notables declare that the caliphate is abolished, and that Córdoba will be
          governed by a council. You are escorted out of the city and die in exile in Lleida.
          Al-Andalus breaks into more than twenty kingdoms - the taifas - rich, cultured,
          quarrelsome, and weak. In León and Castile, kings begin to collect tribute from them.
        deeds: {ruler_falls: "is deposed, and the caliphate abolished", give: [m_toledo, m_zaragoza, m_valencia]}
      - label: "Call on the Berbers to defend you"
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          The Berber captains come, set their own man on the throne, and take Toledo as their
          price.
        deeds: {give: ["m_toledo"]}
      - label: "Offer the notables a council, with yourself at its head"
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          You offer to rule with the notables as a council, with a place for you at its head.
          They take the council and give you the palace, and the outlying cities leave.
        deeds: {give: ["m_zaragoza"]}
    history: >-
      In 1031 the notables of Córdoba deposed Hisham III and abolished the Umayyad caliphate;
      al-Andalus fragmented into the taifa kingdoms.
    sources: ["Ibn Idhari", "Kennedy (1996)", "Catlos, Kingdoms of Faith (2018)"]
