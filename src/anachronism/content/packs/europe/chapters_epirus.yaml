schema_version: 1
# Chronicle mode (D-120, D-166): the Molossian kings of Epirus, from Alexander I's wedding
# to Pyrrhus's death at Argos, 336-272 BC. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow Plutarch's Pyrrhus, Livy 8, Justin
# 12, 17-18 and 23-25, Diodorus 16-22, Dionysius of Halicarnassus 19-20, Strabo and
# Pausanias, with modern work by Hammond, Lévêque and Champion. benchmark_provinces counts
# the provinces of this map the real kings held at that date.
chapters:
  - id: epi_wedding
    scenario: alexander
    civ: epirus
    year: -336
    title: "Murder at the Wedding"
    place: "The theatre at Aegae, Macedon"
    speaker: macedon
    speaker_name: "Alexander of Macedon"
    speaker_title: "Your nephew, now king"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Alexander, king of the Molossians of Epirus. Philip of Macedon made you king;
      your sister Olympias was his wife, until he set her aside. To make peace with you he
      gave you his daughter Cleopatra, your own niece, in marriage, and the wedding was the
      greatest feast Macedon had seen.


      This morning, in the theatre, in front of everyone, a bodyguard stabbed Philip to death.
      People are already whispering that your sister had a hand in it. Her son, your nephew
      and now brother-in-law, is twenty, and the army has just proclaimed him king.
    choices:
      - label: "Stand by your nephew"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You stand beside the young Alexander at the funeral, and go home to Dodona with your
          bride. Olympias has Philip's last wife and her baby killed. Your nephew will soon be
          on his way to Asia, and you begin to wonder what lies to the west.
      - label: "Make the most of the confusion"
        legitimacy_bp: -500
        outcome: >-
          You take your bride home and seize a few border valleys while Macedon mourns. Your
          nephew notices.
        deeds: {grudges: {macedon: 2000}}
    history: >-
      Philip II was assassinated in 336 BC at the wedding of his daughter Cleopatra to her
      uncle Alexander I of Epirus.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 16.91-94", "Justin 9.6-7", "Hammond, Epirus (1967)"]

  - id: epi_italy
    scenario: alexander
    civ: epirus
    year: -334
    title: "The Call from Tarentum"
    place: "The oracle of Zeus at Dodona"
    speaker: diviner
    speaker_name: "The priestess of Dodona"
    speaker_title: "Who hears the sacred oak"
    benchmark_provinces: 2
    story: >-
      Tarentum, the richest Greek city in Italy, is being pressed by the Lucanians and
      Bruttians of the hills, and has asked you to come and save it, at its expense. Your
      nephew has gone east to conquer Asia. You say, it is told, that he has gone to fight
      women, and you are going to fight men.


      The oak of Dodona has spoken: beware of the water of Acheron, and of Pandosia. There is
      a river Acheron and a town Pandosia here in Epirus. You will keep away from both.
    choices:
      - label: "Sail for Italy"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You land at Tarentum and win battle after battle against the Lucanians, the
          Bruttians and the Samnites. Town after town on the coast is yours. You begin to
          think of a kingdom in the west, and Tarentum begins to wonder whom it has hired.
        deeds: {take: [a3_magna_graecia], men: 15000}
      - label: "Stay at home"
        knowledge_bp: 500
        outcome: >-
          Tarentum hires someone else. The oracle is pleased with you.
    history: >-
      Alexander I of Epirus campaigned in southern Italy for Tarentum from 334 BC, taking
      Heraclea, Consentia, Terina and Sipontum.
    sources: ["Livy 8.3, 8.24", "Justin 12.2", "Strabo 6.1.5"]

  - id: epi_rome
    scenario: alexander
    civ: epirus
    year: -332
    title: "Friends of the Romans"
    place: "Your camp in Apulia"
    speaker: rome
    speaker_name: "Envoys of Rome"
    speaker_title: "A city of Latium"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      Your conquests have brought you to the borders of the Samnites, the mountain people of
      central Italy. Beyond the Samnites is a city of Latium you have barely heard of, at war
      with them on and off for years. Its envoys have come to your camp.


      They propose friendship. The Samnites are their enemies too.
    choices:
      - label: "Make a treaty with Rome"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You make peace and friendship with the Romans. It is the first time a king of the
          Greeks has made a treaty with them. It will not be the last time a king of Epirus
          deals with them.
      - label: "Send them home; Italy is yours"
        legitimacy_bp: 500
        outcome: >-
          The Roman envoys go home. They will remember the name of Epirus.
        deeds: {grudges: {rome: 2000}}
    history: >-
      Livy records a peace made between Rome and Alexander of Epirus in 332 BC.
    diverged: >-
      Rome is gone.
    sources: ["Livy 8.17", "Justin 12.2"]

  - id: epi_pandosia
    scenario: alexander
    civ: epirus
    year: -331
    title: "The River Acheron"
    place: "Near Pandosia, in Bruttium"
    speaker: general
    speaker_name: "Your Lucanian guide"
    speaker_title: "An exile in your service"
    benchmark_provinces: 1
    story: >-
      Your army is camped on three hills in the land of the Bruttians, cut off by the winter
      rains. The Lucanians and Bruttians have surrounded two of them. You must cross the
      river below with your best men and break through.


      As you ride into the swollen water, one of your Lucanian guides calls out the river's
      name. It is called Acheron. The town on the hill behind you is called Pandosia.
    choices:
      - label: "Cross"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          In midstream a Lucanian exile drives a spear through you. Your body is cut in half by
          the enemy, and the halves are sent home to Epirus, to your sister and your wife. Your
          conquests in Italy fall apart in a season.
        deeds: {ruler_falls: "is killed crossing the river Acheron", give: [a3_magna_graecia]}
      - label: "Turn back, and fight on the hill"
        legitimacy_bp: -500
        outcome: >-
          You turn your horse. The army holds the hill until spring, half starved, and gets
          out by sea. You never cross a river again without asking its name.
        deeds: {give: [a3_magna_graecia]}
    history: >-
      Alexander I of Epirus was killed near Pandosia, at a river called Acheron, in 331 BC,
      fulfilling the oracle of Dodona.
    sources: ["Livy 8.24", "Justin 12.2", "Strabo 6.1.5"]

  - id: epi_olympias
    scenario: alexander
    civ: epirus
    year: -317
    title: "The Child in the Illyrian King's Lap"
    place: "Passaron, Epirus"
    speaker: steward
    speaker_name: "Olympias"
    speaker_title: "Mother of Alexander the Great, your kinswoman"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Aeacides, king of the Molossians. Alexander the Great died six years ago, and
      his generals are tearing his empire apart. Olympias, his mother, is fighting Cassander
      for Macedon and for her grandson, Alexander's little son. She has asked you to bring
      your army.


      Your soldiers do not want to go. They say Olympias's wars are not theirs. You have a
      son of two, Pyrrhus.
    choices:
      - label: "March to help Olympias"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          At the passes your army mutinies, sends you home, and the Molossians vote to depose
          you. Your friends smuggle little Pyrrhus out of the country to Glaucias, king of the
          Illyrians. Glaucias is afraid of Cassander, until the child crawls across the floor,
          pulls himself up by the king's robe and stands at his knees. Glaucias keeps him.
          Olympias is stoned to death the next year.
        deeds: {ruler_falls: "is deposed by his own soldiers"}
      - label: "Stay at home"
        legitimacy_bp: 500
        outcome: >-
          Olympias fights alone, and loses. Cassander takes Macedon, and looks at Epirus.
        deeds: {grudges: {macedon: 1000}}
    history: >-
      In 317 BC the Epirotes deposed Aeacides when he tried to help Olympias; the infant
      Pyrrhus was taken to Glaucias of the Taulantii.
    diverged: >-
      Macedon is gone; Alexander's heirs have no war to fight.
    sources: ["Plutarch, Pyrrhus 2-3", "Diodorus 19.11, 19.36", "Justin 17.3"]

  - id: epi_ipsus
    scenario: alexander
    civ: epirus
    year: -301
    title: "The Battle of the Kings"
    place: "Ipsus, in Phrygia"
    speaker: general
    speaker_name: "Demetrius the Besieger"
    speaker_title: "Your brother-in-law"
    benchmark_provinces: 1
    story: >-
      You are Pyrrhus. You were made king at twelve, and thrown out at seventeen while you were
      at a wedding. Now you are with your brother-in-law Demetrius and his father, old
      Antigonus One-Eye, who is trying to win back the whole of Alexander's empire.


      At Ipsus, in Asia, they face all the other kings together, and four hundred war
      elephants. Demetrius commands the cavalry; he gives you a squadron.
    choices:
      - label: "Ride with Demetrius"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You break the enemy horse - and Demetrius chases them too far. The elephants close
          the gap behind you, Antigonus dies under a shower of javelins at eighty-one, and his
          empire is shared out. You end up a hostage at the court of Ptolemy in Egypt, where
          you charm the queen, marry her daughter, and come home with Ptolemy's money and
          soldiers to take back your throne.
        deeds: {martial_bp: 1000}
      - label: "Stay with the infantry"
        legitimacy_bp: -500
        outcome: >-
          Your squadron holds its place in the line while the battle is lost on the wings.
    history: >-
      Pyrrhus fought for Antigonus and Demetrius at Ipsus (301 BC), went to Egypt as a
      hostage, married Antigone and was restored in Epirus with Ptolemy I's help in 297.
    sources: ["Plutarch, Pyrrhus 4-5, Demetrius 28-29", "Diodorus 21.1"]

  - id: epi_cineas
    scenario: alexander
    civ: epirus
    year: -281
    title: "And Then We Shall Rest"
    place: "Ambracia, your capital"
    speaker: scholar
    speaker_name: "Cineas"
    speaker_title: "Your adviser, a pupil of Demosthenes"
    benchmark_provinces: 2
    story: >-
      Tarentum is at war with Rome, the city your great-uncle once made a treaty with, which
      now rules most of Italy. The Tarentines ask you to come, as they asked Alexander, and
      promise three hundred and fifty thousand foot and twenty thousand horse from the
      Italians.


      Your friend Cineas asks: what will you do when you have beaten the Romans? Take Sicily.
      And then? Carthage, and Africa. And then? Then, you say, we shall rest, and drink, and
      talk. "Then why not rest now?" says Cineas.
    choices:
      - label: "Go to Italy"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You sail with twenty-five thousand men and twenty elephants. A storm scatters the
          fleet; you swim ashore at night. In Tarentum you close the theatres and the
          gymnasia and put the Tarentines in your army, and they discover they have hired a
          master.
        deeds: {take: [a3_magna_graecia], men: 25000}
      - label: "Rest now"
        unrest_bp: -500
        knowledge_bp: 500
        outcome: >-
          Cineas is delighted. Your soldiers are not. Tarentum fights Rome alone.
    history: >-
      Pyrrhus crossed to Italy in 280 BC at Tarentum's invitation; Plutarch tells the
      conversation with Cineas.
    sources: ["Plutarch, Pyrrhus 13-16", "Dionysius of Halicarnassus 19.8-9"]

  - id: epi_heraclea
    scenario: alexander
    civ: epirus
    year: -280
    title: "An Assembly of Kings"
    place: "After the battle of Heraclea"
    speaker: scholar
    speaker_name: "Cineas"
    speaker_title: "Your envoy to Rome"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      At Heraclea the Romans fought you seven times up and down the field, until your
      elephants, beasts no Roman had ever seen, broke their horse. You won, and lost your
      best officers. You walked among the Roman dead: every one with his wounds in front.


      Cineas, who they say has won more cities with words than you with spears, offers to go
      to Rome with gifts and a peace: Rome to leave the Greeks of Italy alone, and be your
      friend.
    choices:
      - label: "Send Cineas to Rome"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The Senate nearly agrees. Then old Appius Claudius, blind, is carried into the
          Senate house by his sons and tells them Rome does not make peace with an enemy on
          Italian soil. Cineas comes back and tells you that the Senate seemed to him an
          assembly of kings.
      - label: "March on Rome"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          You march to within forty miles of the city. Every Roman town on the way shuts its
          gates, and a second consular army is waiting.
        deeds: {grudges: {rome: 3000}}
    history: >-
      Pyrrhus defeated the Romans at Heraclea (280 BC) and sent Cineas to Rome; Appius
      Claudius Caecus's speech persuaded the Senate to refuse peace.
    diverged: >-
      Rome is gone.
    sources: ["Plutarch, Pyrrhus 17-19", "Appian, Samnite History 10"]

  - id: epi_asculum
    scenario: alexander
    civ: epirus
    year: -279
    title: "Another Such Victory"
    place: "Asculum, in Apulia"
    speaker: general
    speaker_name: "One of your officers"
    speaker_title: "Come to congratulate you"
    needs_alive: [rome]
    benchmark_provinces: 2
    story: >-
      A second battle, at Asculum, over two days. The Romans brought wagons with spikes and
      fire against your elephants. You have won again; you have also been wounded by a
      javelin, and lost most of the men you brought from Epirus, and nearly all your
      generals. The Romans, as always, have a new army coming.


      An officer comes to congratulate you on the victory.
    choices:
      - label: "'Another such victory, and we are undone'"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          You say it, and the world has called a victory that costs too much a 'Pyrrhic
          victory' ever since. You look for a way out of Italy with honour. The Greeks of
          Sicily are about to offer you one.
      - label: "Raise new troops from the Italians"
        wealth_bp: -2000
        unrest_bp: 1500
        outcome: >-
          The Samnites and Lucanians send you their young men. They are brave, and they are
          not Epirotes.
        deeds: {men: 10000}
    history: >-
      Pyrrhus won at Asculum (279 BC) at great cost; Plutarch reports his remark that
      another such victory would ruin him.
    diverged: >-
      Rome is gone.
    sources: ["Plutarch, Pyrrhus 21", "Dionysius of Halicarnassus 20.1-3"]

  - id: epi_sicily
    scenario: alexander
    civ: epirus
    year: -278
    title: "King of Sicily"
    place: "Syracuse"
    speaker: syracuse
    speaker_name: "The Syracusans"
    speaker_title: "Besieged by Carthage"
    needs_alive: [carthage]
    benchmark_provinces: 3
    story: >-
      The Greeks of Sicily have lost their king and are besieged in Syracuse by a Carthaginian
      fleet and army. They offer you everything: Syracuse, its fleet, the crown of Sicily, if
      you will drive out Carthage. Your son by the daughter of their last king, Agathocles,
      could inherit it all.
    choices:
      - label: "Sail to Sicily"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The Carthaginians lift the siege when your fleet appears. You storm Eryx, first over
          the wall yourself, and take Panormus, until Carthage holds only Lilybaeum, on its
          rock by the sea. That one you cannot take. Then you start treating the Sicilian
          Greeks as subjects, and they start talking to Carthage.
        deeds: {take: [a3_west_sicily], grudges: {carthage: 3000}}
      - label: "Stay and finish the Romans"
        legitimacy_bp: -500
        outcome: >-
          Syracuse makes terms with Carthage. You stay in Italy, among allies who are tiring of
          you.
    history: >-
      Pyrrhus campaigned in Sicily (278-276 BC), taking almost all of Carthaginian Sicily
      except Lilybaeum, before the Sicilian Greeks turned against him.
    diverged: >-
      Carthage is gone.
    sources: ["Plutarch, Pyrrhus 22-24", "Diodorus 22.8-10"]

  - id: epi_beneventum
    scenario: alexander
    civ: epirus
    year: -275
    title: "A Wrestling Ground"
    place: "Maleventum, in Samnium"
    speaker: general
    speaker_name: "Your son Helenus"
    speaker_title: "With the army"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You have come back from Sicily, losing half your fleet to Carthage on the way. As your
      ship pulled away, you looked back at the island and said: "What a wrestling ground we
      are leaving for Carthage and Rome."


      Now the consul Manius Curius waits for you near Maleventum with a Roman army. You plan
      to fall on his camp at night, across the hills. Your son says the night is long and
      the paths are bad.
    choices:
      - label: "Attack in the night"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Your columns get lost in the woods, the torches burn out, and dawn finds you in
          sight of the Roman camp. The Romans have learned to fight elephants: a wounded calf
          panics its mother, and the herd tramples your own line. You go home to Epirus with
          eight thousand men. The Romans rename the town Beneventum: 'good outcome'.
        deeds: {give: [a3_magna_graecia, a3_west_sicily]}
      - label: "Go home without a battle"
        legitimacy_bp: -1000
        outcome: >-
          You leave a garrison in Tarentum and sail home. The Romans take the Greek cities of
          the south one by one.
        deeds: {give: [a3_magna_graecia, a3_west_sicily]}
    history: >-
      Pyrrhus left Sicily in 276 BC and was defeated by Manius Curius Dentatus near
      Maleventum (renamed Beneventum) in 275, ending his Italian war.
    diverged: >-
      Rome is gone.
    sources: ["Plutarch, Pyrrhus 24-26", "Dionysius of Halicarnassus 20.11-12", "Orosius 4.2"]

  - id: epi_argos
    scenario: alexander
    civ: epirus
    year: -272
    title: "A Tile from a Rooftop"
    place: "The streets of Argos"
    speaker: general
    speaker_name: "Your son Helenus"
    speaker_title: "Outside the walls"
    benchmark_provinces: 1
    story: >-
      You have beaten Antigonus Gonatas and taken half of Macedon, failed to take Sparta, and
      now one faction of Argos has opened a gate to you at night. Your elephants are stuck in
      the gateway with their towers on, and the streets are full of fighting in the dark.


      Your son is outside the walls with the rest of the army. You send word for him to break
      down a section of the wall to let you out. He misunderstands, and comes in.
    choices:
      - label: "Fight your way through the streets"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          An Argive spearman wounds you. His old mother, watching from a rooftop, throws a tile
          at the man attacking her son. It hits you on the back of the neck. You fall from
          your horse, and a soldier of Antigonus cuts off your head. Antigonus weeps when it is
          brought to him. Hannibal will name you the greatest general who ever lived, after
          Alexander.
        deeds: {ruler_falls: "is struck down by a roof tile in the streets of Argos"}
      - label: "Get out the way you came"
        legitimacy_bp: -1000
        outcome: >-
          You cut your way back to the gate, leaving two elephants and a lot of good men in
          Argos. There is always another war.
    history: >-
      Pyrrhus was killed in street fighting at Argos in 272 BC, struck by a roof tile thrown
      by an old woman; Plutarch and Livy record Hannibal's ranking of him.
    sources: ["Plutarch, Pyrrhus 32-34", "Pausanias 1.13.8", "Livy 35.14"]
