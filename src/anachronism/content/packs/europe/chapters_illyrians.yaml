schema_version: 1
# Chronicle mode (D-120, D-XXX): the Illyrians, from Cleitus's revolt at Pelium to Glaucias's
# restoration of Pyrrhus, 335-307 BC. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow Arrian's Anabasis 1.5-6, Plutarch's Pyrrhus
# 2-4, Diodorus 19.67 and 19.70 and Justin 17.3, with modern work by Wilkes (The Illyrians,
# 1992), Hammond and Bosworth. The Pelium chapters share the year 335. Cleitus (son of
# Bardylis) and Glaucias are the two Illyrian kings of Arrian's story; what became of Cleitus
# after Pelium is not recorded, so the chronicle passes to Glaucias, who is king of the
# Taulantii and whose death date is unknown. The Illyrian chronology of 314-312 is thin;
# those chapters claim little. benchmark_provinces is 2 throughout (Illyria and Dardania).
chapters:
  - id: ill_pelium
    scenario: alexander
    civ: illyrians
    year: -335
    title: "The Heights Above Pelium"
    place: "Pelium, in the hills west of Macedon"
    speaker: general
    speaker_name: "Glaucias"
    speaker_title: "King of the Taulantii, your ally"
    needs_alive: [macedon]
    benchmark_provinces: 2
    story: >-
      You are Cleitus, son of Bardylis, whom Philip beat. Philip is dead, and his son Alexander
      is twenty. You have raised the hill peoples, and Glaucias, king of the Taulantii, has
      promised to come to you with his army. Alexander is on the road already, through the
      mountains toward Pelium, your stronghold above the river.


      You hold the hills around the town, and you sacrifice before the battle: three boys,
      three girls and three black rams, Arrian says, the old rite of your people. Below you,
      on the plain, the young king's army has halted. Glaucias is a day or two behind.
    choices:
      - label: "Hold the hills and watch him"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Alexander does not charge. He drills his army on the plain below, in silence: spears
          up, spears down, wheel left, wheel right, the phalanx in a wedge, and then a great
          shout and a clash of spears on shields. Your men have never seen the like of it. They
          give up the hills and run into Pelium. Glaucias has still not come.
      - label: "Charge down before his army is ready"
        legitimacy_bp: 800
        unrest_bp: 500
        outcome: >-
          Your men cheer the charge. You come down on the plain in a rush. The Macedonians are not in the loose order you
          hoped, and you lose men before you reach them. You return to the town.
        deeds: {martial_bp: -300}
      - label: "Withdraw into Pelium to wait for Glaucias"
        legitimacy_bp: 500
        outcome: >-
          You draw your men back behind the walls of Pelium and wait for the Taulantii. The
          town fills with soldiers, the grain runs short, and Alexander makes camp below the
          walls with all the time he needs.
        deeds: {men: 3000}
    history: >-
      Alexander marched against Cleitus and Glaucias in 335 BC. At Pelium he drilled his army in
      full view of the Illyrians, who abandoned the hills for the town.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.5", "Wilkes, The Illyrians (1992)"]

  - id: ill_flight
    scenario: alexander
    civ: illyrians
    year: -335
    after: [ill_pelium]
    title: "The Night at Pelium"
    place: "The river below Pelium"
    speaker: general
    speaker_name: "Glaucias"
    speaker_title: "King of the Taulantii"
    needs_alive: [macedon]
    benchmark_provinces: 2
    story: >-
      Glaucias has come with the Taulantii. Alexander, caught between your two armies in a
      narrow country, got out of the valley by a careful retreat along the river. Your men followed him, and he
      turned and drove them back.


      Now your camp lies outside Pelium, and your men think the war is won. They have set no
      proper watch.
    choices:
      - label: "Burn Pelium and go to Glaucias"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          In the dark, Alexander crosses the river with his Agrianians and archers and falls on
          your sleeping camp. Many are killed, others are chased into the Taulantian hills.
          You set fire to Pelium, leave it, and flee to Glaucias. Alexander turns south to
          deal with Thebes, and what happens to you next is not told.
        deeds: {ruler_falls: "burns Pelium and flees to Glaucias", grudges: {macedon: 1500}}
      - label: "Make a stand in Pelium"
        legitimacy_bp: 300
        unrest_bp: 800
        outcome: >-
          You close the gates. A siege with Glaucias's army still outside is a long affair, and
          Alexander's patience is short.
        deeds: {ruler_falls: "is killed at Pelium", grudges: {macedon: 3000}}
      - label: "Send a herald to ask for terms"
        legitimacy_bp: -1500
        outcome: >-
          Alexander's herald offers none. Pelium falls with the camp.
        deeds: {ruler_falls: "is captured at Pelium"}
    history: >-
      Alexander took the Illyrians' camp by surprise at night; Cleitus burned Pelium and fled
      to Glaucias. The sources do not say what happened to Cleitus afterwards.
    diverged: >-
      Macedon is gone.
    sources: ["Arrian, Anabasis 1.5-6", "Wilkes, The Illyrians (1992)"]

  - id: ill_pyrrhus
    scenario: alexander
    civ: illyrians
    year: -317
    title: "A Child at the Hearth"
    place: "The hall of the Taulantii"
    speaker: epirus
    speaker_name: "The friends of the king of Epirus"
    speaker_title: "Fugitives with a small child"
    benchmark_provinces: 2
    story: >-
      You are Glaucias, king of the Taulantii. The Molossians of Epirus have turned on their
      king, Aeacides, who tried to help Olympias against Cassander, and have thrown him out.
      The friends of his house have saved his infant son. They have walked a long way, and the
      story goes that they carried him over a flooded river by shouting to men on the other
      bank.


      They have come into your hall and laid the child, Pyrrhus, on the hearth. Cassander, who
      is now strongest in Macedon, would like him dead.
    choices:
      - label: "Take the child in and raise him as your own"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your queen and you raise him with your own sons. Plutarch says Cassander offered you
          two hundred talents to hand him over, and you refused.
        deeds: {grudges: {macedon: 2000}}
      - label: "Hand the child to Cassander's envoys"
        wealth_bp: 2000
        legitimacy_bp: -1000
        influence: {clergy: -500}
        outcome: >-
          You take the silver. Your people say that the hearth has been defiled, and the priests
          agree.
      - label: "Send the child on to the Aetolians"
        legitimacy_bp: 600
        outcome: >-
          You give the party a guide, food and a horse, and send them south into Aetolia, which
          has no love for Cassander. The child is out of your hands, and out of your quarrel.
    history: >-
      After Aeacides was deposed in 317 BC the infant Pyrrhus was taken to Glaucias, who
      sheltered him and refused Cassander's offer of money for him.
    diverged: >-
      Macedon is gone.
    sources: ["Plutarch, Pyrrhus 2-3", "Justin 17.3", "Diodorus 19.36"]

  - id: ill_cassander
    scenario: alexander
    civ: illyrians
    year: -314
    title: "The Coast Towns"
    place: "The Adriatic coast, near Apollonia and Epidamnus"
    speaker: macedon
    speaker_name: "Cassander"
    speaker_title: "Ruler of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 2
    story: >-
      Cassander has not forgotten the child at your hearth. He has come west in these years
      to pull the Greek towns on the Adriatic, Apollonia and Epidamnus among them, into his
      alliance. Those towns have been under Illyrian pressure, and your kinsmen have an eye on
      their harbours and their silver.


      Diodorus tells this story shortly, and only from Cassander's side.
    choices:
      - label: "Fight Cassander for the coast"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 300
        outcome: >-
          You fight for the towns over the next two years, and the fighting goes back and forth.
          Neither side wins it clearly. You do not give up Pyrrhus.
        deeds: {martial_bp: 500, grudges: {macedon: 1500}}
      - label: "Make peace with Cassander"
        legitimacy_bp: 200
        wealth_bp: 500
        outcome: >-
          He is pleased, and the coast trade goes on. He is the stronger, and you may regret
          the peace.
        deeds: {peace_with: [macedon]}
      - label: "Offer the coast towns your protection"
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Your envoys tell Apollonia and Epidamnus that the Illyrians, not Macedon, are their
          friends against the pirates. The Greeks listen politely, hold on to both sides,
          and pay you something for the garrisons.
        deeds: {men: 4000}
    history: >-
      Cassander and Glaucias fought over Apollonia and Epidamnus around 314-312 BC; the sources
      are brief and the dates uncertain.
    diverged: >-
      Macedon is gone.
    sources: ["Diodorus 19.67, 19.70", "Wilkes, The Illyrians (1992)"]

  - id: ill_restoration
    scenario: alexander
    civ: illyrians
    year: -307
    title: "The Boy Is Twelve"
    place: "The mountains of Epirus"
    speaker: epirus
    speaker_name: "The Molossian elders"
    speaker_title: "Who want a king of their own line"
    benchmark_provinces: 2
    story: >-
      The child at your hearth is twelve years old. He has grown up with your sons. In
      Epirus, the kings who followed Aeacides have not held on, and the Molossians are willing
      to take his son back.


      The Molossian elders are asking you to bring the boy home.
    choices:
      - label: "Take him home with an army"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 500}
        outcome: >-
          You march with the boy into Epirus, and the Molossians accept him as king. You give
          him guardians. He has a throne at twelve and you have a friend on your southern
          border. Pyrrhus will remember who sheltered him.
        deeds: {men: 4000, grudges: {macedon: 1000}}
      - label: "Send him with a small escort and your envoys"
        legitimacy_bp: 1000
        outcome: >-
          The boy goes with a few spearmen and two of your counsellors, and the Molossians
          have a child to rule them with no army behind him. It is not clear he will keep his
          seat.
        deeds: {men: 1000}
      - label: "Keep him until Epirus is settled"
        wealth_bp: 500
        legitimacy_bp: -500
        outcome: >-
          He is useful to you where he is. Epirus has other kings, and they are not friendly.
    history: >-
      In 307 BC, when Pyrrhus was twelve, Glaucias brought him back to Epirus with an army and
      he was made king.
    sources: ["Plutarch, Pyrrhus 3-4", "Justin 17.3"]
