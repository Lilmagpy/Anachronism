schema_version: 1
# Chronicle mode (D-120, D-XXX): the Aetolian League, from the war against Demetrius II to the
# treaty with Rome, 238-189 BC. Each chapter opens in its year (odd years open on the next
# turn); one choice is what history chose (historical: true). The League chose a general
# (strategos) each year, so the "ruler" is its leading man in each chapter: Scopas (220 and
# 211), Agelaus of Naupactus (217), Pyrrhias (206), Phaeneas (198, 191, 189), Thoas (192). The
# ruler before 222 is an unnamed general, since no name is safe for the 230s. The offices
# are approximate: Pyrrhias' generalship may be 208/7 rather than 206, and Thoas was an envoy
# to Antiochus, not necessarily general, in 192. The League is one province on this map; its
# real lands in Phocis, Locris and Acarnania, and Delphi, are not on it. Facts follow Polybius
# 2, 4, 5, 9, 10, 18, 20 and 21, Livy 26, 29, 31-38, Pausanias 10, and the Delphic
# inscriptions, with modern work by Scholten (The Politics of Plunder, 2000), Grainger (The
# League of the Aitolians, 1999), Gruen and Walbank.
chapters:
  - id: aet_demetrius
    scenario: punic_wars
    civ: aetolia
    year: -238
    title: "Old Enemies, New Friends"
    place: "Thermum, the League's sanctuary"
    speaker: achaea
    speaker_name: "Aratus of Sicyon"
    speaker_title: "General of the Achaeans"
    needs_alive: [macedon, achaea]
    benchmark_provinces: 1
    story: >-
      You are the general of the Aetolians. Some years ago you and old Antigonus Gonatas of
      Macedon had a plan to carve up the Achaean League between you. Then Gonatas died, and
      his son Demetrius II sits on the throne in Pella. Demetrius has married a princess of
      Epirus, and Epirus is your neighbour on the west. The new king has no use for Aetolian
      raids.


      Aratus of Sicyon has sent to ask whether the Aetolians, who raided Achaean towns only
      three years ago, would now join the Achaeans against Macedon. An old quarrel against
      a new one.
    choices:
      - label: "Join the Achaeans against Demetrius"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The Achaean and Aetolian leagues, enemies a year ago, stand side by side. Demetrius
          fights on two fronts for ten years and loses ground, and dies in 229 in the
          war against the Dardanians in the north. The two leagues drift apart afterwards,
          and their old quarrel is never far below the surface.
        deeds: {grudges: {macedon: 1500}}
      - label: "Stay in alliance with Macedon"
        legitimacy_bp: 1000
        wealth_bp: 500
        outcome: >-
          Demetrius takes your help and pays you in gold, but gives you no land. The
          Achaeans do not forget whose side you chose.
      - label: "Keep out of it, and raid whom you please"
        unrest_bp: 500
        wealth_bp: 1000
        outcome: >-
          Everybody's war is good for business, until somebody's army turns on you.
    history: >-
      The Aetolians had allied with Antigonus Gonatas against the Achaeans, but after his death
      (239 BC) joined the Achaeans against Demetrius II in the Demetrian War (c. 238-229).
    diverged: >-
      Macedon or the Achaean League is gone.
    sources: ["Polybius 2.43-46", "Plutarch, Aratus 33", "Grainger, The League of the Aitolians (1999)"]

  - id: aet_raid
    scenario: punic_wars
    civ: aetolia
    year: -220
    title: "The Cattle of Messenia"
    place: "Thermum"
    speaker: general
    speaker_name: "Dorimachus"
    speaker_title: "Son of Nicostratus, of Trichonium"
    benchmark_provinces: 1
    story: >-
      You are Scopas, general of the Aetolians. Your people have a custom: any Aetolian may
      raid any foreign land at peace or at war, and the League is not answerable. Foreign
      cities find this a nuisance. The Aetolians have never found it so.


      Dorimachus, a young man with a talent for such things, has taken his band into Messenia
      and driven off cattle at a time of peace with the Achaeans. They are Messene's
      allies. The Messenians complain. The new King of Macedon,
      Philip V, is seventeen, and the Greek league that Antigonus Doson founded now looks to him. The Assembly of the Aetolians meets, and Dorimachus is waiting to see
      what you say.
    choices:
      - label: "Let the raiding go on"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 1500
        outcome: >-
          The Assembly does not punish him. The Hellenic League sees it as war. Within a year
          you have taken Dium's temple in Pieria and Dorimachus has sacked the sanctuary of
          Dodona, and Philip is coming. So begins the Social War.
        deeds: {grudges: {macedon: 2000, achaea: 2000}, ruler_falls: "completes his term as general"}
      - label: "Punish Dorimachus and make restitution"
        legitimacy_bp: 500
        wealth_bp: -1000
        outcome: >-
          The Assembly is furious. The Messenians are not impressed, and they were looking
          for an excuse in any case.
        deeds: {ruler_falls: "completes his term as general"}
      - label: "Bring Sparta and Elis into a raiding league"
        legitimacy_bp: 1000
        wealth_bp: 1000
        outcome: >-
          Sparta is in no condition to be anyone's ally, but Elis is willing, and the three of
          you share what the raiders bring home.
        deeds: {men: 2000, ruler_falls: "completes his term as general"}
    history: >-
      Dorimachus' raid in Messenia in 220 BC, which the Aetolian assembly (under the general
      Scopas) refused to punish, began the Social War (220-217 BC) against Philip V and the
      Hellenic League.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 4.3-6, 4.67", "Scholten, The Politics of Plunder (2000)"]

  - id: aet_naupactus
    scenario: punic_wars
    civ: aetolia
    year: -217
    title: "A Cloud in the West"
    place: "Naupactus"
    speaker: macedon
    speaker_name: "Philip V"
    speaker_title: "King of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Agelaus of Naupactus, general of the Aetolians. The Social War has gone badly.
      Philip V burned Thermum, the sanctuary where you hold your assemblies, and wrecked every
      mountain village within reach of the roads. You have ravaged Epirus and Pieria in turn.
      Hannibal has crossed the Alps and beaten the Romans at Lake Trasimene.


      Philip has said he will talk. The envoys meet at Naupactus. It is a short step to say what
      you think, and some of the men round you would hold out. They are not the ones who have
      seen what the war costs.
    choices:
      - label: "Make peace, and ask the Greeks to unite"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You tell the assembly that Greeks should stop fighting each other, because if the
          cloud now gathering in the west settles on Greece, no prayers will move it.
          Polybius, who gives the speech, calls it a warning that proved right. Peace is made on the terms of
          each side keeping what it holds. Philip goes home, and thinks of Italy.
        deeds: {peace_with: [macedon, achaea], ruler_falls: "completes his term as general"}
      - label: "Fight on, and wait for Philip to tire"
        legitimacy_bp: 1000
        wealth_bp: 1000
        unrest_bp: 1000
        outcome: >-
          Philip has the larger army and the Achaeans behind him. Thermum burns again, though
          your raiders bring home plunder from Epirus.
        deeds: {men: 5000, ruler_falls: "completes his term as general"}
      - label: "Ask Rome for help against Philip"
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Rome has just lost an army at Lake Trasimene and has little to spare for Greece,
          but a few ships come, and the news of them travels.
        deeds: {ships: 5, ruler_falls: "completes his term as general"}
    history: >-
      The Peace of Naupactus (217 BC) ended the Social War; Polybius gives Agelaus of Naupactus
      the speech about the war clouds in the west.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 5.103-105"]

  - id: aet_rome
    scenario: punic_wars
    civ: aetolia
    year: -211
    title: "An Ally Who Keeps the Booty"
    place: "Thermum"
    speaker: rome
    speaker_name: "Marcus Valerius Laevinus"
    speaker_title: "Roman commander in Greece"
    needs_alive: [rome, macedon]
    benchmark_provinces: 1
    story: >-
      You are Scopas, general of the Aetolians again. Rome has been at war with Hannibal for
      seven years and with Philip V for three. Its fleet commander, Laevinus, has come to the
      Aetolian assembly with a proposal. Together the two will fight Philip. The Aetolians
      will have the lands and the cities that fall; Rome will take the movable goods and the
      captives.


      The Aetolians have never been Rome's allies before. Rome keeps its word to its friends, but its idea of friendship is its own.
    choices:
      - label: "Ally with Rome against Philip"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 1500
        outcome: >-
          The treaty is cut into stone. Together the allies take Oeniadae and Nasos, and, in
          210, Aegina, which the Romans sell to Attalus of Pergamon for thirty talents. The Romans
          sell the people of the captured towns into slavery, and the Greeks hold it against
          Rome and against its allies.
        deeds: {grudges: {macedon: 3000}, ruler_falls: "completes his term as general"}
      - label: "Stay at peace with Philip"
        legitimacy_bp: 500
        wealth_bp: 1500
        outcome: >-
          Rome fights without you. Philip, who has made peace twice, pays you well to
          stay out, and does not forget how close you came.
        deeds: {ruler_falls: "completes his term as general"}
      - label: "Bargain with Rome for more of the spoils"
        wealth_bp: 1000
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Laevinus gives a little ground on the booty, and the assembly grumbles that it is
          still too little. The talks drag on through the winter.
        deeds: {ruler_falls: "completes his term as general"}
    history: >-
      In 211 BC the Aetolian League, under Scopas, allied with Rome against Philip V: Aetolia
      would keep the cities taken, Rome the booty. The treaty is known from a fragment of the stone.
    diverged: >-
      Rome or Macedon is gone.
    sources: ["Livy 26.24", "Polybius 9.39", "Livy 27.30, 28.5-8"]

  - id: aet_peace
    scenario: punic_wars
    civ: aetolia
    year: -206
    title: "Peace Without Rome"
    place: "Thermum"
    speaker: macedon
    speaker_name: "Philip V"
    speaker_title: "King of Macedon"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are Pyrrhias, general of the Aetolians. The war has gone on for five years. The
      Roman fleet came for one season and went away. Attalus of Pergamon, whom you chose
      to command your army, has gone home to fight his own wars, and Philip of Macedon has
      wrecked your farmland over and over.


      The Aetolian cities are tired. Envoys from Egypt, Rhodes, Chios and Athens have been
      pressing for a peace conference. Philip is willing. The Romans, who have no army
      here, would be furious, and some of the assembly would like to see them furious.
    choices:
      - label: "Make peace with Philip alone"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Peace is signed, and the war ends. Rome says you have broken your treaty, which is
          true. A year later Rome makes its own peace with Philip at Phoenice, and Aetolia is
          left without a friend. Rome calls it desertion, and will remember it.
        deeds: {peace_with: [macedon, achaea], grudges: {rome: 2000}, ruler_falls: "completes his term as general"}
      - label: "Hold out with Rome"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          Philip's army is in your hills, and the Romans' fleet is not. Your raiders strike
          back as best they can.
        deeds: {men: 4000, ruler_falls: "completes his term as general"}
      - label: "Ask Rome for ships and a new general"
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Rome is busy in Spain and Africa, and sends only a small squadron.
        deeds: {ships: 10, ruler_falls: "completes his term as general"}
    history: >-
      In 206 BC the Aetolians made a separate peace with Philip V, through the mediation of
      Egypt, Rhodes, Chios and Athens. Rome made its own at Phoenice in 205.
    diverged: >-
      Macedon is gone.
    sources: ["Livy 29.12", "Polybius 10.42"]

  - id: aet_nicaea
    scenario: punic_wars
    civ: aetolia
    year: -198
    title: "The Conference at Nicaea"
    place: "Nicaea, on the Malian Gulf"
    speaker: rome
    speaker_name: "Titus Quinctius Flamininus"
    speaker_title: "Roman consul"
    needs_alive: [rome, macedon]
    benchmark_provinces: 1
    story: >-
      You are Phaeneas, general of the Aetolians. Rome and Philip are at war again. The Romans
      sent you envoys last year and you are back in the alliance, a good deal more reluctantly
      than before. The Roman consul, Flamininus, a young man who speaks Greek, has brought
      Philip, your allies and the leaders of the Greek leagues to a conference on the beach at
      Nicaea.


      Philip has offered to give up some of the Greek cities he holds. He has not offered
      the Aetolians their old claims in Thessaly. Flamininus lets you speak first.
    choices:
      - label: "Insist Philip leave every town in Greece"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          The talks end with no peace, and Flamininus sends them to the Senate. Next summer the
          Roman legions and the Aetolian cavalry beat Philip in the hills at Cynoscephalae. The
          Aetolians claim they won it, and the Romans say that their legions did. The Greek
          cities ask who is the bigger boaster. Flamininus will not give you Thessaly.
        deeds: {grudges: {macedon: 2500, rome: 500}, ruler_falls: "completes his term as general"}
      - label: "Accept Philip's offer of peace now"
        legitimacy_bp: -1000
        outcome: >-
          The war ends, and the Roman consul is angry. A Roman general who has
          been cheated of a victory finds ways to cheat you in turn.
        deeds: {grudges: {rome: 1500}, ruler_falls: "completes his term as general"}
      - label: "Ask Rome for the cities in Thessaly now"
        wealth_bp: 500
        outcome: >-
          Flamininus says that the matter will be settled when the war is.
        deeds: {ruler_falls: "completes his term as general"}
    history: >-
      At Nicaea (winter 198/7 BC) Phaeneas, the Aetolian general, argued against any peace
      leaving Philip in Greece. Aetolian cavalry fought at Cynoscephalae (197), and the Aetolians
      claimed the credit.
    diverged: >-
      Rome or Macedon is gone.
    sources: ["Livy 32.32-37, 33.7-13", "Polybius 18.1-12, 18.34"]

  - id: aet_antiochus
    scenario: punic_wars
    civ: aetolia
    year: -192
    title: "A King to Free Greece"
    place: "Naupactus"
    speaker: seleucid
    speaker_name: "Antiochus III"
    speaker_title: "The Great King"
    needs_alive: [seleucid, rome]
    benchmark_provinces: 1
    story: >-
      You are Thoas, the Aetolian envoy. Four years ago Flamininus declared that all the Greeks
      were free, and two years ago the Roman legions went home. The Aetolians were given nothing for
      Cynoscephalae, which they say they won. They have been refused Thessaly and the cities
      of Phthia, and the Senate has told them to go back to Flamininus, who has told them
      the same.


      Antiochus the Great of Syria has an army in Asia, and the Aetolians have sent to him,
      to Philip and to Nabis of Sparta. Your friend Alexamenus has gone to Sparta with a
      thousand men as Nabis' ally. He has plans of his own.
    choices:
      - label: "Invite Antiochus to Greece as arbiter"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The assembly decrees that Antiochus come to Greece to free it from Rome and to judge
          between the Aetolians and the Romans. In the autumn he lands at Demetrias with ten
          thousand men, a small force for such a war. The Roman Senate declares war on you both.
        deeds: {grudges: {rome: 3500}, ruler_falls: "completes his term as general"}
      - label: "Stay quiet in friendship with Rome"
        legitimacy_bp: -1500
        outcome: >-
          You get nothing and expect nothing. Sparta is lost, Thessaly is lost, and the
          assembly mutters.
        deeds: {ruler_falls: "completes his term as general"}
      - label: "Ask Philip of Macedon to join you"
        wealth_bp: -500
        outcome: >-
          Philip, whom Rome has treated well since Cynoscephalae, will not act against it.
        deeds: {ruler_falls: "completes his term as general"}
    history: >-
      In 192 BC the Aetolian assembly decided to call in Antiochus III to free Greece and arbitrate
      between Aetolia and Rome; Thoas was sent to him. The Aetolian Alexamenus killed Nabis of
      Sparta that year.
    diverged: >-
      Rome or the Seleucid kingdom is gone.
    sources: ["Livy 35.12, 35.32-35", "Polybius 20.1-3", "Appian, Syriake 12"]

  - id: aet_thermopylae
    scenario: punic_wars
    civ: aetolia
    year: -191
    title: "Thermopylae Again"
    place: "The pass of Thermopylae"
    speaker: rome
    speaker_name: "Manius Acilius Glabrio"
    speaker_title: "Roman consul"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Phaeneas. Antiochus has come, but the Aetolians he promised to rescue have given him
      only four thousand men, and the Greek cities have not come out for him. The Romans have
      sent a consul with twenty thousand legionaries, and Antiochus has put his army in the pass
      of Thermopylae, the narrow strip between the hills and the sea where three hundred
      Spartans once held a Persian king.


      The Aetolians hold the hill forts above the pass. Marcus Porcius Cato, a Roman officer
      under the consul, goes up the mountain at night against two of them. The king's front line
      is struck, and breaks.
    choices:
      - label: "Ask the consul for terms"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          After the battle you go to the consul and say that you put yourselves in the faith
          of Rome. In Roman law that means you surrender and have no terms. The Aetolians
          thought it meant mercy. The consul tells you to hand over your leaders and your allies,
          and you refuse. Antiochus goes home to Asia, and the Romans besiege Heraclea and
          Naupactus.
        deeds: {grudges: {rome: 2500}}
      - label: "Fight on from the walls"
        unrest_bp: 1500
        outcome: >-
          Heraclea falls to the Romans, then Naupactus nearly does. Flamininus, who has no wish
          to see the Aetolians destroyed, intervenes to save Naupactus.
      - label: "Send to Antiochus for a new army"
        wealth_bp: -500
        outcome: >-
          The king is on the far side of the sea, writing letters.
    history: >-
      At Thermopylae in 191 BC Acilius Glabrio, with Cato's flank march, beat Antiochus III. The
      Aetolians offered to "entrust themselves to Roman good faith" (fides), a surrender, and
      the war continued at Heraclea and Naupactus.
    diverged: >-
      Rome is gone.
    sources: ["Livy 36.15-35", "Polybius 20.9-10", "Plutarch, Cato the Elder 13-14"]

  - id: aet_treaty
    scenario: punic_wars
    civ: aetolia
    year: -189
    title: "The Majesty of the Roman People"
    place: "Ambracia"
    speaker: rome
    speaker_name: "Marcus Fulvius Nobilior"
    speaker_title: "Roman consul"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Phaeneas. Antiochus has been beaten at Magnesia, and Asia is lost to him. The
      Aetolians have been fighting alone for two years. The consul Fulvius Nobilior has laid
      siege to Ambracia, which Aetolia has held for a generation, and the city has fought
      back with a determination its Roman besiegers did not expect. In the end the city
      has surrendered.


      Your envoys have been to Rome and have come back with the Senate's terms. Aetolia will
      lose its western cities, pay five hundred talents in silver, give up the prisoners and
      deserters, and have the same friends and enemies as Rome. And it must also, with no pretence
      of treachery, preserve the dominion and the majesty of the Roman people.
    choices:
      - label: "Accept the terms"
        historical: true
        legitimacy_bp: -1500
        wealth_bp: -3500
        outcome: >-
          Aetolia pays two hundred talents at once and the rest in six years. Ambracia and Cephallenia
          are lost; the League keeps its home in the mountains but has to follow Rome's lead
          in anything that matters. Its days as a power are over. Rome will not grind it down,
          but twenty years later the Roman commissioners will be the ones deciding which Aetolians
          live.
        deeds: {peace_with: [rome]}
      - label: "Go on fighting in the mountains"
        legitimacy_bp: -500
        unrest_bp: 2500
        outcome: >-
          The consul's patience is short and the mountain forts are many. The League bleeds,
          and the winter finds you in the hills with what men you have left.
        deeds: {men: 4000}
      - label: "Bargain over the indemnity and hostages"
        legitimacy_bp: -1500
        wealth_bp: -3000
        outcome: >-
          The Senate listens, trims a little, and demands hostages from the best families
          of the League. The peace is signed on those terms.
        deeds: {peace_with: [rome]}
    history: >-
      The treaty of 189 BC ended Aetolia's war with Rome: an indemnity of five hundred talents,
      the loss of Ambracia and Cephallenia, and the clause to uphold the majesty of Rome. Aetolia
      remained in Rome's shadow until Roman rule in Greece.
    diverged: >-
      Rome is gone.
    sources: ["Livy 38.1-11", "Polybius 21.25-32"]
