schema_version: 1
# Chronicle mode (D-120): the Buyid emirs of Baghdad and Iran, from Baha al-Dawla to the
# arrival of Tughril Beg, 1000-1056. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow Miskawayh and Ibn al-Athir for the
# Buyid age, Ibn Sina's own autobiography as completed by al-Juzjani, and al-Khatib
# al-Baghdadi, with modern work by Kennedy (The Prophet and the Age of the Caliphates),
# Busse, Kraemer (Humanism in the Renaissance of Islam) and Bosworth. Dates are approximate
# where noted: the Qadiri creed (1017-1018, reissued 1029), the title 'King of Kings'
# (about 1037) and the death years of Sultan al-Dawla (1024) and Musharrif al-Dawla (1025).
# The map holds Buyid power as four provinces (Baghdad, Basra, Fars, Jibal), and the Buyid
# house in fact divided them among several princes; benchmark_provinces is the number the
# ruler of Baghdad and his family still held. Fars and Khuzestan stayed in the family for a
# few years after 1055; the benchmark after Tughril (2) is an approximation.
chapters:
  - id: buy_learning
    scenario: year_1000
    civ: buyids
    year: 1000
    title: "The House of Learning"
    place: "Baghdad"
    speaker: scholar
    speaker_name: "A librarian of Karkh"
    speaker_title: "Of the House of Learning"
    benchmark_provinces: 4
    story: >-
      You are Baha al-Dawla, a Daylami prince from the hills by the Caspian, now emir of
      Baghdad and the lord of Fars and Iraq. The caliph al-Qadir sits in the palace by the
      Tigris, and the Abbasid caliphs, who once ruled from Spain's border to India, rule now
      over little more than their own prayers. Your soldiers keep the order, and you take the
      taxes.


      Your vizier's House of Learning in the Karkh quarter, founded some years ago, holds
      thousands of books for any scholar to read. The librarian asks you for money to
      copy more, and to pay the scholars who come. The Daylami and Turkish soldiers have not
      been paid on time.
    choices:
      - label: "Keep funding the House of Learning"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 500
        wealth_bp: -600
        influence: {clergy: 500, guilds: 500}
        outcome: >-
          The books are copied and the scholars are fed. Under the Buyids Baghdad is a city of
          poets, philosophers, physicians and mathematicians, Sunni and Shia, Christian and
          Jewish, and the emirs of the age are known for their libraries. The soldiers grumble,
          and the library will be burned when the Seljuks come, according to the later writers.
      - label: "Pay the soldiers, and cut the library"
        wealth_bp: 500
        unrest_bp: -300
        knowledge_bp: -500
        outcome: >-
          The soldiers are satisfied for a season, and the scholars go to the courts of other
          emirs.
        deeds: {martial_bp: 300}
      - label: "Pay the soldiers first, the scholars after"
        knowledge_bp: 500
        wealth_bp: -400
        unrest_bp: -200
        legitimacy_bp: 200
        outcome: >-
          You order the soldiers paid in full, and the library paid from what is left. The
          copyists work more slowly, and the scholars grumble, but the books stay on their
          shelves.
    history: >-
      Under Baha al-Dawla (988-1012) Baghdad remained a great city of learning, with libraries
      such as the House of Learning founded by the vizier Shapur ibn Ardashir.
    sources: ["Miskawayh, Experiences of the Nations", "Yaqut, Dictionary of Countries", "Kraemer, Humanism in the Renaissance of Islam (1986)"]

  - id: buy_manifesto
    scenario: year_1000
    civ: buyids
    year: 1011
    title: "The Baghdad Manifesto"
    place: "Baghdad"
    speaker: scholar
    speaker_name: "Al-Sharif al-Radi"
    speaker_title: "Poet and leader of the Alids"
    needs_alive: [fatimids]
    benchmark_provinces: 4
    story: >-
      You are Baha al-Dawla, a Shia emir who rules for a Sunni caliph. In Cairo the Fatimid
      caliph al-Hakim says he is the true imam, descended from the Prophet's daughter Fatima,
      and the Fatimid missionaries are at work in Iraq. One of your border emirs has already
      had the Fatimid ruler's name read in his Friday prayers.


      The caliph al-Qadir wants a public statement, signed by judges and noble Alid families,
      that the Fatimids' claim to descend from Ali is false. The Alid nobles in Baghdad are
      your own coreligionists, and some of them are reluctant. The statement would make
      the caliph a leader again, after years of being a pensioner.
    choices:
      - label: "Let the Alid nobles sign the statement"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          In 1011 the notables of Baghdad, Sunni judges and Alid nobles of your own faith among
          them, put their names to a document denying the Fatimids' ancestry. The Fatimid
          missionaries lose ground in Iraq, and the caliph al-Qadir learns that he can speak in
          his own voice again. A Shia emir has made a Sunni caliph a champion of the faith,
          which will matter after you.
        deeds: {grudges: {fatimids: 1000}}
      - label: "Take no part in the statement"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          The caliph finds the signatures without you, and does not forget that his protector
          stood aside.
      - label: "Let the caliph issue it alone"
        legitimacy_bp: 500
        unrest_bp: 300
        influence: {clergy: 500}
        outcome: >-
          You tell the caliph he may publish his own statement with the signatures of the
          Sunni judges alone, and that the Alid families will not be asked. It is a weaker
          paper than he hoped for.
    history: >-
      In 1011 the Abbasid caliph al-Qadir had a manifesto signed in Baghdad by judges and Alid
      notables denying the Fatimid caliphs' descent from Ali; Baha al-Dawla died in 1012.
    diverged: >-
      The Fatimids are gone.
    sources: ["Ibn al-Athir, Complete History", "Kennedy, The Prophet and the Age of the Caliphates (2004)", "Busse, Chalif und Grosskönig (1969)"]

  - id: buy_creed
    scenario: year_1000
    civ: buyids
    year: 1018
    title: "The Caliph's Creed"
    place: "Baghdad"
    speaker: steward
    speaker_name: "The chamberlain"
    speaker_title: "Of the emir's court"
    benchmark_provinces: 4
    story: >-
      You are Sultan al-Dawla, a young emir, son of Baha. The caliph al-Qadir has found a voice,
      and uses it. He is having a statement of Sunni belief read out in the palace and the
      mosques, which condemns the rationalist Mu'tazilites and other teachers, and tells the
      judges what they may and may not say.


      Your own household is Shia, and so are many of your soldiers. The caliph does not
      ask your leave. He only wants you not to forbid it, and the Sunni crowds in Baghdad
      are on his side.
    choices:
      - label: "Let the caliph proclaim his creed"
        historical: true
        legitimacy_bp: 500
        influence: {clergy: 1000}
        outcome: >-
          The creed is read, and the scholars of the rationalist schools lose their places.
          The caliph is a leader of the Sunnis again, and you keep the soldiers and the money.
          The Baghdad of the next generation will be more Sunni than your father's was.
      - label: "Forbid it, to keep the peace"
        legitimacy_bp: -1000
        unrest_bp: 1000
        influence: {clergy: -500}
        outcome: >-
          The crowds are angry, and the street fights between Sunni and Shia quarters, which the
          Buyids have been trying to prevent, grow worse than before.
      - label: "Allow it, but ban preaching in the streets"
        legitimacy_bp: 200
        unrest_bp: 300
        influence: {clergy: 300}
        outcome: >-
          You tell the caliph the creed may be read in the palace and the mosques, but that no
          preacher may take it into the streets. The Sunni crowds are not pleased, and the
          Shia are only half satisfied.
    history: >-
      Around 1017-1018 the caliph al-Qadir issued the Qadiri creed, a Sunni statement of belief,
      reissued in 1029; the Buyids did not stop him.
    sources: ["Ibn al-Jawzi, al-Muntazam", "Makdisi, Ibn 'Aqil (1997)"]

  - id: buy_sina
    scenario: year_1000
    civ: buyids
    year: 1020
    title: "The Physician at Hamadan"
    place: "Hamadan"
    speaker: scholar
    speaker_name: "Ibn Sina"
    speaker_title: "Physician and philosopher"
    benchmark_provinces: 4
    story: >-
      You are Sultan al-Dawla, and your kinsman Shams al-Dawla rules Hamadan, in the western
      hills. A few years ago the prince fell sick, and the physician Ibn Sina, then in his
      thirties and already famous, was brought to cure him. Shams made him his vizier.


      The soldiers hate him. They say he is a clever boy who takes their pay for the state's
      purposes, and they have surrounded his house. They demand that Shams give him up. The
      physician is writing the book on medicine that Europeans will call the Canon. Shams
      sends to ask you what a prince should do.
    choices:
      - label: "Tell Shams to let the vizier go"
        historical: true
        legitimacy_bp: -300
        knowledge_bp: -500
        unrest_bp: -500
        outcome: >-
          Shams yields and sends Ibn Sina away, and the scholar hides in a friend's house for
          weeks, writing. When Shams falls ill again he is called back, but the prince dies
          in 1021 and the physician goes on to Isfahan, to another court. Buyid Iran loses
          the best mind in the east to its rivals, and the soldiers keep their pay.
      - label: "Tell Shams to defend his vizier"
        unrest_bp: 1500
        legitimacy_bp: 500
        outcome: >-
          Shams stands by his vizier, and the soldiers riot. In the end the physician is
          sent away in any case, and the prince's authority with him.
        deeds: {martial_bp: -300}
      - label: "Offer him a place at your own court"
        knowledge_bp: 800
        wealth_bp: -400
        unrest_bp: 300
        legitimacy_bp: -200
        outcome: >-
          You send word to Hamadan that Ibn Sina is welcome in Baghdad, where you can protect
          him. He is a famous guest, and the soldiers of Baghdad do not like him any better
          than those of Hamadan.
    history: >-
      Ibn Sina served Shams al-Dawla of Hamadan as physician and vizier; soldiers' anger forced
      his dismissal, and he left after the prince's death in 1021 for Isfahan.
    sources: ["Ibn Sina and al-Juzjani, Autobiography and Life", "Gutas, Avicenna and the Aristotelian Tradition (1988)"]

  - id: buy_division
    scenario: year_1000
    civ: buyids
    year: 1028
    title: "A House Divided"
    place: "Baghdad"
    speaker: general
    speaker_name: "A Daylami captain"
    speaker_title: "Of the guard"
    benchmark_provinces: 4
    story: >-
      You are Jalal al-Dawla, Baha's son, emir of Baghdad. Your family are Daylami, who
      always shared power among the sons. A kinsman rules Rayy, your nephew Abu Kalijar
      has Fars, and you have Iraq. They fight, make peace and fight again. In Baghdad the Turkish
      soldiers and the Daylami are always at each other's throats, and they riot when they
      are not paid.


      You can try to make yourself master of the whole family and take Fars, or you can
      keep your own lands, let each prince keep his, and pay the soldiers from what you have.
    choices:
      - label: "Keep Iraq, and let each prince keep his own"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        wealth_bp: -500
        outcome: >-
          The family stays divided, with no head. It is a house that cannot raise one army
          for one purpose, and the Turkish soldiers, who are paid by whoever pays, learn their
          value. Quarrels will go on for twenty years, to the benefit of every outside
          power.
      - label: "Make yourself master of the family"
        unrest_bp: 1500
        wealth_bp: -1500
        outcome: >-
          The war eats the money, the soldiers revolt for want of pay, and your kinsmen call in
          neighbours. You gain nothing but the debt.
        deeds: {martial_bp: 500}
      - label: "Ally with your kinsmen against the soldiers"
        legitimacy_bp: 300
        wealth_bp: -500
        deeds: {men: 3000}
        outcome: >-
          You send envoys to Fars and Rayy proposing that the family stand together against
          the unruly soldiers. The princes agree to some things and not to others, and a loose
          alliance is formed.
    history: >-
      After the deaths of Sultan al-Dawla (1024) and Musharrif al-Dawla (1025), Jalal al-Dawla
      held Baghdad from 1027; the Buyid house stayed divided between Jalal, Abu Kalijar in Fars
      and the prince of Rayy.
    sources: ["Miskawayh and Ibn al-Athir", "Bosworth, The Islamic Dynasties (1967)"]

  - id: buy_rayy
    scenario: year_1000
    civ: buyids
    year: 1029
    title: "Mahmud at Rayy"
    place: "Rayy"
    speaker: ghaznavids
    speaker_name: "Mahmud of Ghazni"
    speaker_title: "Sultan of Ghazni"
    needs_alive: [ghaznavids]
    benchmark_provinces: 3
    story: >-
      You are Jalal al-Dawla. Your kinsman Majd al-Dawla holds Rayy, in the north of the hills,
      with its libraries and its wealthy citizens. His soldiers have mutinied against him, and
      Mahmud of Ghazni, who has been an enemy of your house for years, is at the gate. Mahmud
      says he is helping an old ally against his own soldiers.


      Rayy has a famous library. Mahmud's judges say its books are full of heretical works. The
      Daylami princes cannot agree on who should stand against him. Baghdad is far, and the
      caliph, who likes Mahmud's Sunni zeal, is not asking you to defend a Shia kinsman.
    choices:
      - label: "Let Mahmud take Rayy unopposed"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        knowledge_bp: -500
        outcome: >-
          Mahmud takes Rayy in 1029, makes Majd al-Dawla his prisoner, and burns the books his
          judges think heretical. The rest of the hill country to the west falls under his
          sons' hands within a year. You still hold Baghdad, Basra and Fars, and the caliph
          does not object.
        deeds: {peace_with: [ghaznavids], give: [m_jibal], give_to: ghaznavids}
      - label: "March to Rayy with the Daylami"
        unrest_bp: 1500
        legitimacy_bp: -500
        outcome: >-
          Your army is paid late and marches slowly, and Mahmud's army is
          the richer and the stronger. You reach Rayy after it has fallen.
        deeds: {martial_bp: 500, peace_with: [ghaznavids], give: [m_jibal], give_to: ghaznavids}
      - label: "Bring the Rayy library to Baghdad"
        knowledge_bp: 400
        legitimacy_bp: -800
        unrest_bp: 500
        deeds: {peace_with: [ghaznavids], give: [m_jibal], give_to: ghaznavids}
        outcome: >-
          You send carts and clerks to Rayy to take as much as they can carry before Mahmud
          arrives. Some of the books arrive in Baghdad; the rest are left to his judges.
    history: >-
      Mahmud of Ghazni took Rayy from the Buyid Majd al-Dawla in 1029, burned books he judged
      heretical, and the western hill country became Ghaznavid land.
    diverged: >-
      Mahmud's empire is gone.
    sources: ["Ibn al-Athir, Complete History", "Bosworth, The Ghaznavids (1963)"]

  - id: buy_king
    scenario: year_1000
    civ: buyids
    year: 1037
    title: "King of Kings"
    place: "Baghdad"
    speaker: scholar
    speaker_name: "A jurist of Baghdad"
    speaker_title: "A judge of the caliph's court"
    benchmark_provinces: 3
    story: >-
      You are Jalal al-Dawla, and you want a title. Your father and his brothers were content
      with the names the caliph gave them, such as 'Crown of the State'. The old
      Persian title 'King of Kings' belongs to the ancient shahs, and the rulers of
      Baghdad have been using it on coins. You want it officially, from the caliph.


      The jurists of Baghdad are divided. Some say the title is for God alone, and no
      Muslim may take it. Others say the caliph can allow it. The caliph al-Qa'im does not like
      it, but you control his income.
    choices:
      - label: "Insist that the caliph grant the title"
        historical: true
        legitimacy_bp: 1000
        influence: {clergy: -500}
        unrest_bp: 300
        outcome: >-
          After a quarrel in Baghdad the caliph gives way and the jurists pronounce the title
          permitted, though many of them do not like it. You are King of Kings, as your fathers
          were not, and the caliph has shown that he cannot refuse his protector.
      - label: "Drop the title to keep the peace"
        unrest_bp: -200
        legitimacy_bp: -300
        influence: {clergy: 500}
        outcome: >-
          The jurists are pleased, the soldiers are puzzled, and the title is used on coins
          anyway.
      - label: "Use the title without the caliph's leave"
        legitimacy_bp: 500
        unrest_bp: 200
        influence: {clergy: -300}
        outcome: >-
          You have the title cut on your coins and read in the sermons without waiting for the
          caliph. The jurists are divided, and he sends no answer.
    history: >-
      About 1037 Jalal al-Dawla had the caliph al-Qa'im grant him the title Malik al-Muluk
      (King of Kings) after a dispute among the jurists of Baghdad.
    sources: ["Ibn al-Athir, Complete History", "Busse, Chalif und Grosskönig (1969)"]

  - id: buy_basasiri
    scenario: year_1000
    civ: buyids
    year: 1054
    title: "The Turkish General"
    place: "Baghdad"
    speaker: general
    speaker_name: "Al-Basasiri"
    speaker_title: "Turkish commander of Baghdad"
    benchmark_provinces: 3
    story: >-
      You are al-Malik al-Rahim, the last Buyid emir of Baghdad, son of Abu Kalijar. You came
      to the throne young, and your Daylami troops no longer trust the Turks. The best of
      your Turkish commanders is al-Basasiri, who has risen from slave soldier to the master of
      your army, and the people of Baghdad both fear and like him.


      Out east, the Seljuk Turks have swept over Khorasan and Persia under Tughril Beg and
      are now said to be coming to Iraq. You can trust al-Basasiri and give him more power, or
      you can curb him, and risk the Turkish soldiers turning against you.
    choices:
      - label: "Rely on al-Basasiri to hold Baghdad"
        historical: true
        unrest_bp: 800
        legitimacy_bp: -300
        outcome: >-
          Al-Basasiri holds the city for you, and the caliph resents his power. It will not be
          enough to stop what is coming from the east, and in the end the man will go his
          own way.
        deeds: {martial_bp: 500}
      - label: "Curb him and rely on the Daylami"
        deeds: {men: 4000}
        unrest_bp: 1500
        legitimacy_bp: -500
        outcome: >-
          The Turkish soldiers sulk and desert, and the Daylami are too few to keep order. When
          the Seljuks come there is nobody to meet them.
      - label: "Share the command between both"
        legitimacy_bp: 100
        unrest_bp: 300
        deeds: {men: 3000, martial_bp: 200}
        outcome: >-
          You divide the command of Baghdad between al-Basasiri and a Daylami captain, and
          tell each to watch the other. The soldiers see what you mean by it.
    history: >-
      In the 1050s the Turkish commander al-Basasiri held great power in Baghdad under
      al-Malik al-Rahim (1048-1055), while the Seljuk sultan Tughril Beg approached Iraq.
    sources: ["Ibn al-Athir, Complete History", "Bosworth, The Islamic Dynasties (1967)"]

  - id: buy_tughril
    scenario: year_1000
    civ: buyids
    year: 1055
    title: "Tughril Beg Enters Baghdad"
    place: "Baghdad"
    speaker: steward
    speaker_name: "The caliph's chamberlain"
    speaker_title: "From the Abbasid palace"
    benchmark_provinces: 2
    story: >-
      You are al-Malik al-Rahim. The Seljuk sultan Tughril Beg has come to Baghdad, a Sunni
      Turk who claims to protect the caliph from heretics. Your people have no stomach for a
      fight. The caliph al-Qa'im has sent to say that he will receive the sultan with honour.


      The Buyids, who came out of the Caspian hills a century ago and held the caliph as a
      prisoner of their goodwill, now have the choice of fighting a hopeless battle, fleeing
      to Basra, or giving the city up.
    choices:
      - label: "Open the gates to Tughril Beg"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1000
        outcome: >-
          In December 1055 Tughril enters Baghdad and the caliph receives him as Sultan,
          giving him the style of protector of the faith. Al-Malik al-Rahim is arrested and
          dies in prison a few years later. Buyid power in Iraq is gone after a century, and
          the caliph has a new master, who is at least a Sunni. The Buyids of Fars hold on
          until the Seljuks reach them.
        deeds: {give: [m_baghdad], ruler_falls: "is arrested by Tughril Beg"}
      - label: "Fight Tughril in the streets"
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          Your Daylami fight and are beaten, and the Turkish troops of Baghdad open the gates to
          the sultan. The city suffers for it.
        deeds: {give: [m_baghdad], ruler_falls: "is arrested by Tughril Beg"}
      - label: "Withdraw with the court to Basra"
        legitimacy_bp: -1500
        unrest_bp: 500
        deeds: {give: [m_baghdad], men: 2000}
        outcome: >-
          You leave Baghdad with the court and the treasury and take the road to Basra. The
          caliph receives the sultan, and the city is no longer yours.
    history: >-
      Tughril Beg entered Baghdad in December 1055, ending Buyid rule there; al-Malik al-Rahim was
      arrested and died in prison in 1058. Buyid Fars fell to the Seljuks within a few years.
    sources: ["Ibn al-Athir, Complete History", "Bosworth, The Islamic Dynasties (1967)"]
