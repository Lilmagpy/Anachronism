schema_version: 1
# Chronicle mode (D-120, D-XXX): Epirus after Pyrrhus, from the regency of Olympias to the
# Roman sack of 167 BC, 240-167 BC. A second Epirus chronicle, for the punic_wars scenario,
# beside chapters_epirus.yaml (Pyrrhus, scenario alexander). Each chapter opens in its year;
# one choice is what history chose (historical: true). Facts follow Justin 28, Polybius 2, 4,
# 27 and 30, Livy 29, 32, 42-43 and 45, Plutarch's Aemilius Paullus and Strabo 7.7.3, with
# modern work by Hammond (Epirus, 1967), Cabanes (L'Epire, 1976) and Walbank. Dates are
# approximate for the early chapters: Olympias' regency c. 242-238, Ptolemy c. 238-235,
# Deidameia's death c. 233-232. After her the Epirote League (the koinon of the Epirotes, run
# by a yearly general and an assembly of its three leading peoples, Molossians, Thesprotians
# and Chaonians) governs, and the player's ruler is called The Epirote Assembly. Epirus
# is one province on this map throughout, so benchmark_provinces is 1 at every date.
chapters:
  - id: epp_phthia
    scenario: punic_wars
    civ: epirus
    year: -240
    title: "A Daughter for Macedon"
    place: "Ambracia"
    speaker: aetolia
    speaker_name: "An Aetolian ambassador"
    speaker_title: "From the League of Aetolia"
    needs_alive: [aetolia, macedon]
    benchmark_provinces: 1
    story: >-
      You are Olympias, widow of King Alexander II of Epirus and daughter of Pyrrhus, whose
      conquests ended in the street fight at Argos. Your husband is dead, and your sons
      Pyrrhus and Ptolemy are boys. You rule for them. The Aetolians, your allies, have grown
      hungry, and are eating up their neighbours in Acarnania; the Achaeans are rising in the
      Peloponnese. The new king of Macedon, Demetrius II, wants allies against both.


      You have a daughter, Phthia. A marriage to Demetrius would tie your small kingdom to
      the strongest army in Greece and make the Aetolians' enemies your friends.
    choices:
      - label: "Marry Phthia to Demetrius of Macedon"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: 500
        unrest_bp: 500
        outcome: >-
          Phthia becomes queen of Macedon. Epirus leaves its old alliance with Aetolia and
          stands beside Demetrius in the war that follows, the Demetrian War of the next ten
          years. The Aetolians and Achaeans, who have joined against him, do not forgive
          you. Phthia's son will be Philip V.
        deeds: {grudges: {aetolia: 1500}}
      - label: "Stay with the Aetolians"
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          The Aetolians are a better friend to your riches than to your safety. Macedon
          marks you as an enemy.
        deeds: {grudges: {macedon: 1500}}
      - label: "Stay out of it"
        legitimacy_bp: -500
        outcome: >-
          Epirus is a mountain kingdom with open valleys and a boy king. Both neighbours
          watch it hungrily.
    history: >-
      Around 239-238 BC Olympias, regent for her sons, married her daughter Phthia to Demetrius
      II of Macedon and allied Epirus with him against Aetolia and the Achaean League.
    diverged: >-
      Aetolia or Macedon is gone.
    sources: ["Justin 28.1", "Hammond, Epirus (1967)", "Cabanes, L'Epire (1976)"]

  - id: epp_deidameia
    scenario: punic_wars
    civ: epirus
    year: -232
    title: "The Last of the Aeacids"
    place: "Ambracia"
    speaker: steward
    speaker_name: "The magistrates of Ambracia"
    speaker_title: "Of the Epirote assembly"
    benchmark_provinces: 1
    story: >-
      You are Deidameia, daughter of Pyrrhus II, granddaughter of the great Pyrrhus. Your
      grandfather's whole house has gone: your father and your uncle Ptolemy are dead, and
      you are the last of the Aeacid kings of Epirus, who traced their line back to
      Achilles himself.


      The Epirotes are tired of kings. Their villages have heard, in the last years, of
      Greek cities that vote their own laws and choose their own generals. The people of
      the three tribes, Molossians, Thesprotians and Chaonians, are meeting in assembly, and
      what they say about you is not kind.
    choices:
      - label: "Keep the crown, and take refuge in the temple when the crowd comes"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1500
        outcome: >-
          The story goes that you flee into a temple, and the crowd comes in anyway, and
          you are killed at the altar. A Greek writer later says that the gods punished the
          murderers with disaster for years. The Epirotes abolish the kingship and form a
          league, with a general elected each year. Epirus is no longer a kingdom.
        deeds: {ruler_falls: "is killed in a temple by the Epirotes"}
      - label: "Give up the crown, and go to your Macedonian cousins"
        legitimacy_bp: -2000
        outcome: >-
          You are safe, and you are no queen. A league takes over, and you die in a foreign
          court.
      - label: "Offer to rule with elected magistrates"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          It is a good offer, a few years too late. The assembly votes you out all the same.
    history: >-
      Around 233-232 BC the Aeacid dynasty of Epirus ended with the death of Deidameia, killed
      according to Justin and Polyaenus in a temple at Ambracia, after which the Epirotes
      governed themselves as a league.
    sources: ["Justin 28.3", "Polyaenus 8.52", "Cabanes, L'Epire (1976)"]

  - id: epp_phoenice
    scenario: punic_wars
    civ: epirus
    year: -230
    title: "The Gauls at Phoenice"
    place: "Phoenice"
    speaker: general
    speaker_name: "Your general"
    speaker_title: "Commander in the field"
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes, and your first general is in the field. The
      Illyrians of Queen Teuta have been raiding the Adriatic coast, and their ships have
      landed at Phoenice, your richest city. Eight hundred Gauls hired to guard the
      city have gone over to the Illyrians, and the gates are open.


      The city is lost and so are its people and its gold. You can still send the
      army to take it back, though your general is nervous, because the Illyrians
      know the hills better than you do.
    choices:
      - label: "March with the whole army to retake Phoenice"
        historical: true
        legitimacy_bp: -1000
        wealth_bp: -1500
        unrest_bp: 500
        outcome: >-
          The army camps in a bad place, and the Illyrians, helped by troops from another
          Illyrian leader, Scerdilaidas, strike when it is scattered. Many Epirotes are
          killed or captured; the rest flee to Atintania. You ask the Aetolians and Achaeans
          for help, and they come, and the Illyrians turn aside. In the end the city and its free
          prisoners are ransomed, and Epirus makes a treaty with the queen. Polybius
          tells it as the day Epirus first learned what the Illyrians could do.
      - label: "Pay a ransom and ask for terms"
        legitimacy_bp: -500
        wealth_bp: -2000
        outcome: >-
          The Illyrians take the money, but they do not leave, and the next demand will be higher.
      - label: "Ask the Aetolians and Achaeans to fight first"
        legitimacy_bp: -1000
        outcome: >-
          They come, but late, and their price is not low.
    history: >-
      In 230 BC Illyrian forces took Phoenice with the help of its Gallic garrison and
      defeated the Epirote relief army. The Aetolians and Achaeans helped, and Epirus
      ransomed the city and made a treaty with Teuta. The next year Rome crossed the
      Adriatic to deal with the Illyrians.
    sources: ["Polybius 2.5-6, 2.9", "Cabanes, L'Epire (1976)"]

  - id: epp_dodona
    scenario: punic_wars
    civ: epirus
    year: -220
    title: "Philip's League and the Aetolians"
    place: "Corinth"
    speaker: macedon
    speaker_name: "Philip V"
    speaker_title: "King of Macedon, aged seventeen"
    needs_alive: [macedon]
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes. Philip V of Macedon, a boy of seventeen, has
      inherited from his guardian Antigonus Doson the Hellenic League, a Macedonian-led
      alliance of the Achaeans, the Boeotians, Phocians, Acarnanians and you. The Aetolians,
      who are not in it, have raided the Peloponnese and Messenia, and the allies have
      called a meeting at Corinth to decide on war.


      The Aetolians are your neighbours and have plundered your lands before. They also
      have a fleet and a very good army, and Macedon is far away.
    choices:
      - label: "Join Philip's war against Aetolia"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          The Epirotes vote for war. In the summer of 219 the Aetolian commander Dorimachus
          raids Epirus and plunders Dodona, the oracle of Zeus, burning its colonnades
          and pulling down the sacred building. Philip is away in Aetolia at the time. The war,
          called the Social War, ends in 217 with the Peace of Naupactus.
        deeds: {grudges: {aetolia: 2500}}
      - label: "Stay neutral"
        legitimacy_bp: -1000
        outcome: >-
          The allies are angry. Aetolia raids anyway, and now you have no friends.
      - label: "Join the Aetolians"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Philip regards you as a traitor, and the young king has a long memory.
        deeds: {grudges: {macedon: 2500}}
    history: >-
      In 220 BC the Epirotes joined Philip V's Hellenic League in the Social War against
      Aetolia. In 219 the Aetolians plundered Dodona; the war ended in 217.
    diverged: >-
      Macedon is gone.
    sources: ["Polybius 4.9, 4.15, 4.67", "Walbank, Philip V of Macedon (1940)"]

  - id: epp_peace
    scenario: punic_wars
    civ: epirus
    year: -205
    title: "The Peace of Phoenice"
    place: "Phoenice"
    speaker: rome
    speaker_name: "Publius Sempronius Tuditanus"
    speaker_title: "Roman proconsul"
    needs_alive: [rome, macedon]
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes, still allies of Philip V of Macedon. For ten
      years Rome and Macedon have been at war across the Adriatic, and your valleys
      have often been in the way. This year a Roman army has landed at
      Apollonia: the proconsul has 35 ships, 11,000 foot and a thousand horse. Philip's
      other allies are weary too.


      No one wants a battle. The Aetolians have already made their own peace with Philip.
      Rome has Hannibal in Italy and Scipio about to sail for Africa. You can offer to speak
      to both.
    choices:
      - label: "Offer Phoenice as the place for a peace conference"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -500
        outcome: >-
          The Epirote ambassadors go to Philip, then to the Roman camp. Philip and the
          proconsul meet at Phoenice. The peace gives Rome the Parthini and other Illyrian
          places, and Philip keeps Atintania, if the Senate allows. Your name is on the
          list of Philip's allies who accept the treaty. Epirus has peace, and a reputation.
      - label: "Stand beside Philip to the end"
        legitimacy_bp: 500
        outcome: >-
          Philip does not need your help, and Rome does not forget who stood against it.
        deeds: {grudges: {rome: 1500}}
      - label: "Go over to the Romans"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Philip's army is close, and your valleys are in the way of it.
        deeds: {grudges: {macedon: 2500}}
    history: >-
      In 205 BC the Epirotes, tired of the war, brought Philip V and the Roman proconsul
      Sempronius together at Phoenice, where the peace ending the First Macedonian War was
      made. Epirus was named among Philip's allies in the treaty.
    diverged: >-
      Rome or Macedon is gone.
    sources: ["Livy 29.12", "Walbank, Philip V of Macedon (1940)"]

  - id: epp_aous
    scenario: punic_wars
    civ: epirus
    year: -198
    title: "The Shepherd's Path"
    place: "The Aous gorge"
    speaker: rome
    speaker_name: "Titus Quinctius Flamininus"
    speaker_title: "Roman consul"
    needs_alive: [rome, macedon]
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes. Rome and Philip V of Macedon are at war again,
      and for forty days the armies have faced each other across the river Aous in your
      mountains. Philip holds the gorge with his best troops, and the Roman consul, Flamininus,
      cannot get through.


      Epirus is Philip's ally on paper. The leading man of your assembly, Charops, is Rome's
      friend. Flamininus's army is hungry, and your shepherds know the hill paths well.
    choices:
      - label: "Send a shepherd to guide the Romans over the mountain"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          Livy says Charops sent a herdsman to the consul. Four thousand Roman foot and three
          hundred horse climb by night, and at dawn they come down on Philip's rear. Philip's
          army breaks. He retreats through Epirus into Thessaly, and the Epirotes change sides. You are Rome's ally now.
      - label: "Block the path and stay with Philip"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          For a few weeks you keep the Romans out, and then they find another way.
        deeds: {grudges: {rome: 2000}}
      - label: "Stay neutral and let them fight it out"
        legitimacy_bp: -500
        outcome: >-
          Both armies take what they need from your valleys, and neither thanks you.
    history: >-
      In 198 BC Flamininus got round Philip V's position in the Aous gorge by a path shown by
      local herdsmen, sent, says Livy, by the Epirote Charops. Philip withdrew into Thessaly,
      and Epirus passed to the Roman side.
    diverged: >-
      Rome or Macedon is gone.
    sources: ["Livy 32.5-6, 32.10-14", "Plutarch, Flamininus 3-4", "Walbank, Philip V of Macedon (1940)"]

  - id: epp_perseus
    scenario: punic_wars
    civ: epirus
    year: -170
    title: "Two Kings for Epirus"
    place: "Epirus"
    speaker: rome
    speaker_name: "A Roman envoy"
    speaker_title: "From the consul"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes. Rome has been your ally for twenty-eight years,
      since the Aous. Now Perseus, King of Macedon, son of Philip, is at war with it, and
      his envoys visit the Epirote cities. The Chaonians and Thesprotians are loyal to Rome.
      In the Molossian land, the largest, a faction under a man named Cephalus
      thinks that Perseus will win, and that Rome has made Epirus pay in men and money for
      long enough.


      Rome's friends among your own leaders have been writing to the Senate against their
      rivals. Roman officers are asking for hostages and for troops.
    choices:
      - label: "Hold to Rome, and let the Molossians go their own way"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1500
        influence: {nobility: -1000}
        outcome: >-
          The League as a whole stays Roman, but Cephalus takes the Molossians over to
          Perseus. Epirus is divided against itself. Polybius says that
          Rome's friends write to the Senate about every Epirote they do not like. The Romans
          start counting.
      - label: "Go over to Perseus"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Perseus welcomes you, with promises. Rome treats all Epirus as an enemy.
        deeds: {grudges: {rome: 3000}}
      - label: "Declare neutrality"
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Neither side believes you, and the Roman consul starts counting your granaries.
    history: >-
      In the Third Macedonian War (171-168 BC) the Chaonians and Thesprotians held to Rome while
      the Molossians, under Cephalus, went over to Perseus. The Romans remembered which was
      which.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 27.15, 30.7", "Livy 42.38, 43.21, 45.26", "Hammond, Epirus (1967)"]

  - id: epp_sack
    scenario: punic_wars
    civ: epirus
    year: -167
    title: "Seventy Towns"
    place: "Epirus"
    speaker: rome
    speaker_name: "Lucius Aemilius Paullus"
    speaker_title: "Victor of Pydna"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are the assembly of the Epirotes. Perseus lost the war at Pydna in 168 and
      has surrendered. The Roman general Lucius Aemilius Paullus is not coming home yet.
      His army has been promised a reward, and the Senate's decree lets his soldiers
      plunder the cities of Epirus that sided with the enemy.


      Roman officers have gone to every city and said that the garrisons are going to be
      withdrawn, and that the leading citizens of each place are to bring their gold and
      silver to the general. Everyone knows how Rome treats its enemies. Not everyone is
      sure that you are one.
    choices:
      - label: "Open the gates, bring in the silver, and hope"
        historical: true
        legitimacy_bp: -3000
        wealth_bp: -4000
        unrest_bp: 3000
        outcome: >-
          On the appointed day, the legions fall on seventy Epirote towns at once and plunder
          them. The walls of many are razed. A hundred and fifty thousand people are sold as
          slaves; Plutarch, who tells it with horror, says that when the booty was shared, each
          soldier received eleven drachmas. Most of the dead and enslaved are Molossians, but not
          all. Rome's friends, Charops chief among them, are left in power over what remains.
          Strabo, writing a century and a half later, says that Epirus was a land of ruins.
        deeds: {grudges: {rome: 1000}}
      - label: "Shut the gates and resist"
        legitimacy_bp: 500
        wealth_bp: -2000
        unrest_bp: 2000
        outcome: >-
          Paullus's veterans have just beaten the army of Alexander's Macedonia. A few towns hold
          for a day or two.
      - label: "Send an embassy to the Senate at once"
        legitimacy_bp: -1000
        wealth_bp: -1000
        unrest_bp: 1500
        outcome: >-
          The Senate listens politely. Paullus's men are already on their way.
    history: >-
      In 167 BC Aemilius Paullus, by Senate order, had seventy towns of Epirus, mostly Molossian,
      plundered at one time and about 150,000 people sold into slavery. Epirus never recovered
      its former strength.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 30.15 (via Strabo 7.7.3)", "Livy 45.34", "Plutarch, Aemilius Paullus 29", "Hammond, Epirus (1967)"]
