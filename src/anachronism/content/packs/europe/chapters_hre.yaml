schema_version: 1
# Chronicle mode (D-120, D-148): the Western Empire from Otto III to Canossa, 1000-1085.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Thietmar of Merseburg, Wipo's Deeds of Conrad, Lampert of Hersfeld (hostile
# to Henry IV), Bruno's Saxon War, Gregory VII's letters, and modern work by Althoff,
# Weinfurter, Robinson and Cowdrey. The chronicle follows the crown: Ottonians, then
# Salians. benchmark_provinces counts the provinces of this map the real emperors held.
chapters:
  - id: hre_aachen
    scenario: year_1000
    civ: hre
    year: 1000
    title: "The Tomb of Charlemagne"
    place: "Gniezno, then Aachen"
    speaker: poland
    speaker_name: "Bolesław the Brave"
    speaker_title: "Duke of the Poles"
    needs_alive: [poland]
    benchmark_provinces: 7
    story: >-
      It is the year one thousand. You are Otto III, twenty, Emperor of the Romans, son of a
      Byzantine princess, pupil of the most learned man in Europe - Gerbert, whom you made
      pope as Sylvester II. You mean to renew the empire of Rome, with its capital in Rome.


      You have walked barefoot to the tomb of your friend, the martyr Adalbert, at Gniezno in
      Poland. Duke Bolesław, who bought the saint's body back from the pagans for its weight in
      gold, has received you with a magnificence you did not expect. On the way home you mean
      to open Charlemagne's tomb at Aachen.
    choices:
      - label: "Honour Bolesław as an equal partner"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          You place your own crown on Bolesław's head and give him a copy of the Holy Lance; he
          gives you an arm of St Adalbert. Gniezno becomes an archbishopric: Poland's church
          will answer to Rome, not to German bishops. At Aachen, they say, you find Charlemagne
          seated on his throne, uncorrupted, and take a tooth and a gold cross from his neck.
        deeds: {ally_with: [poland]}
      - label: "Receive Bolesław as a vassal duke"
        legitimacy_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          Bolesław kneels, smiling. Poland's church stays under the archbishop of Magdeburg.
          Bolesław remembers.
        deeds: {tributaries: [poland]}
      - label: "Honour the saint's shrine, but grant nothing"
        wealth_bp: 300
        legitimacy_bp: 1000
        influence: {clergy: 500}
        outcome: >-
          You pray at Adalbert's tomb, accept the relic and thank the duke warmly. No crown, no
          archbishopric, no promises. Bolesław sees you off with exact courtesy. Pilgrims and
          clergy praise an emperor who comes as a penitent.
    history: >-
      At the Congress of Gniezno in March 1000, Otto III honoured Bolesław I and founded the
      archbishopric of Gniezno; he then opened Charlemagne's tomb at Aachen.
    diverged: >-
      Poland is gone.
    sources: ["Thietmar 4.44-47", "Gallus Anonymus 1.6", "Althoff, Otto III (2003)"]

  - id: hre_rome
    scenario: year_1000
    civ: hre
    year: 1001
    title: "Are You Not My Romans?"
    place: "Rome"
    speaker: steward
    speaker_name: "Bernward of Hildesheim"
    speaker_title: "Your old tutor, bishop of Hildesheim"
    benchmark_provinces: 7
    story: >-
      You have built your palace on the Aventine hill in Rome, given your officials Byzantine
      titles, and spared the town of Tivoli, which had rebelled. The Romans, furious that you
      spared their rivals, have risen and shut you up in your palace.


      You climb a tower to speak to them. Your advisers want you to leave Rome for the north,
      where your army is, before you are killed.
    choices:
      - label: "Speak to them - then leave"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          'Are you not my Romans? For you I have left my country and my kin...' The crowd is
          ashamed, and hands over two of its leaders. But you leave Rome anyway, and never
          return. Within a year you are dead of fever at twenty-one, outside the city you loved.
          Your body is carried home over the Alps, through Italians shouting insults.
      - label: "Stay, and send for the army"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The German army storms Rome. You hold the city, and the Romans hate you for it.
      - label: "Punish Tivoli for the Romans and stay"
        legitimacy_bp: 300
        unrest_bp: -800
        wealth_bp: -500
        outcome: >-
          You agree to the Romans' demand and punish the rebellious town. The mob is quieted and
          the Aventine palace is safe, for a time.
    history: >-
      Rome revolted against Otto III in 1001; Thangmar records his speech from a tower. Otto
      died near Rome in January 1002, aged 21.
    sources: ["Thangmar, Life of Bernward 25", "Thietmar 4.48-51"]

  - id: hre_bautzen
    scenario: year_1000
    civ: hre
    year: 1004
    until_year: 1010
    title: "Henry and Bolesław"
    place: "Saxony"
    speaker: general
    speaker_name: "Margrave Gunzelin"
    speaker_title: "Of Meissen, Bolesław's brother-in-law"
    needs_alive: [poland]
    benchmark_provinces: 7
    story: >-
      You are Henry II, cousin of the dead emperor. You had to seize the imperial regalia from
      Otto's funeral procession to be elected. Bolesław of Poland, who loved Otto, does not
      love you: he has occupied Meissen and Lusatia, and taken Bohemia.


      You are a pious man; you are building a great cathedral at Bamberg. But you have just
      made an alliance with the pagan Liutizi tribes against Christian Poland, and your
      bishops are scandalised.
    choices:
      - label: "Fight Poland, with the Liutizi as allies"
        historical: true
        legitimacy_bp: 500
        influence: {clergy: -1500}
        outcome: >-
          Fifteen years of war follow, in three wars with two truces. Your armies march east
          with the pagan idols carried in front of the Liutizi. In 1018, at Bautzen, you make
          peace: Bolesław keeps Lusatia. He goes on to take Kiev.
        deeds: {war_with: [poland]}
      - label: "Make peace and leave Bohemia to Bolesław"
        legitimacy_bp: -800
        outcome: >-
          Bolesław keeps his gains. The eastern frontier is quiet, and Poland grows.
        deeds: {peace_with: [poland]}
      - label: "Fight Poland alone, and break with the Liutizi"
        legitimacy_bp: 800
        influence: {clergy: 500}
        outcome: >-
          You give up the pagan alliance to please your bishops, and send the Saxon and Bavarian
          levies east. The war is slower, and the bishops are content.
        deeds: {men: 12000}
    history: >-
      Henry II fought Bolesław I in 1002-1018, scandalously allied with the pagan Liutizi;
      the peace of Bautzen (1018) left Bolesław Lusatia.
    diverged: >-
      Poland is gone.
    sources: ["Thietmar 5-8", "Bruno of Querfurt, letter to Henry II (1008)"]

  - id: hre_conrad
    scenario: year_1000
    civ: hre
    year: 1027
    title: "Two Kings at the Coronation"
    place: "St Peter's, Rome"
    speaker: steward
    speaker_name: "Wipo"
    speaker_title: "Your chaplain"
    benchmark_provinces: 7
    story: >-
      Henry II died childless. The princes met on a plain by the Rhine and chose you, Conrad
      the Salian, a Franconian count. Now you are in Rome for your imperial coronation. Two
      kings have come to watch: Rudolf of Burgundy, old and childless, and Cnut of England and
      Denmark, the master of the North Sea.


      Rudolf would like to make you his heir. Cnut would like lower tolls for English pilgrims,
      and a German bride for his son.
    choices:
      - label: "Court both kings and promise each something"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -500
        outcome: >-
          You walk out of St Peter's between the two kings. Cnut's pilgrims pay less; Cnut's
          daughter will marry your son. Rudolf makes you his heir, and in 1032 Burgundy - the
          kingdom of the Rhone, from Basel to Arles - comes into the empire.
        deeds: {take: [m_burgundy], ally_with: [denmark]}
      - label: "Court Rudolf alone and take his inheritance"
        legitimacy_bp: 1000
        outcome: >-
          Burgundy will be yours. Cnut goes home with full tolls to pay. The princes admire the
          single clear aim.
        deeds: {take: [m_burgundy]}
      - label: "Court Cnut alone, and make him a friend"
        legitimacy_bp: 800
        wealth_bp: 500
        outcome: >-
          You agree to a marriage between your son and Cnut's daughter, and let Burgundy's old
          king think what he likes. Rudolf is not pleased.
        deeds: {ally_with: [denmark]}
    history: >-
      Conrad II was crowned emperor in Rome on 26 March 1027 in the presence of Cnut and Rudolf
      III of Burgundy, whose kingdom passed to Conrad in 1032-1034.
    sources: ["Wipo, Gesta Chuonradi 16", "Cnut's letter of 1027"]

  - id: hre_sutri
    scenario: year_1000
    civ: hre
    year: 1046
    title: "Three Popes"
    place: "Sutri, near Rome"
    speaker: diviner
    speaker_name: "Abbot Odilo of Cluny"
    speaker_title: "A reformer"
    needs_alive: [papacy]
    benchmark_provinces: 8
    story: >-
      You are Henry III, Conrad's son, a serious and devout man. You have come to Italy to be
      crowned emperor and found three men claiming to be pope: Benedict IX, who sold the
      papacy to his godfather; Gregory VI, the godfather who bought it to reform it; and
      Sylvester III, whom one Roman faction elected in between.


      The reformers of Cluny want a clean Church: no buying of offices, no married priests.
      You can make it happen.
    choices:
      - label: "Depose all three and name a German reformer"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 2000}
        outcome: >-
          At synods at Sutri and Rome the three popes are deposed. Your candidate, the bishop of
          Bamberg, crowns you emperor on Christmas Day. You will choose four popes in ten years,
          all reformers. One day, the reformed papacy will turn on your son.
        deeds: {ally_with: [papacy]}
      - label: "Recognise Gregory VI and stay out of it"
        legitimacy_bp: -300
        influence: {clergy: -500}
        outcome: >-
          Gregory crowns you. Rome's factions go on fighting over the papacy.
        deeds: {peace_with: [papacy]}
      - label: "Let a council judge them and the Romans elect"
        legitimacy_bp: 1500
        unrest_bp: 500
        influence: {clergy: 1000}
        outcome: >-
          You call the clergy of Rome to a council. They are slow and quarrelsome, and the new
          pope is a Roman of their own choosing. Rome's own clergy are honoured, and the choice
          carries weight.
    history: >-
      At the Synod of Sutri (1046) Henry III deposed three rival popes and installed Clement
      II; the reform papacy he sponsored later clashed with his son.
    diverged: >-
      The Papacy is gone.
    sources: ["Annales Romani", "Hermann of Reichenau", "Weinfurter, The Salian Century (1999)"]

  - id: hre_kaiserswerth
    scenario: year_1000
    civ: hre
    year: 1062
    title: "The Boat at Kaiserswerth"
    place: "Kaiserswerth, on the Rhine"
    speaker: steward
    speaker_name: "Anno"
    speaker_title: "Archbishop of Cologne"
    benchmark_provinces: 8
    story: >-
      Your father Henry III died when you were six. You are Henry IV, twelve years old, and your
      mother the Empress Agnes rules for you - badly, say the archbishops.


      Archbishop Anno of Cologne has invited you to see his magnificent new ship on the Rhine.
      As soon as you step aboard, the rowers pull away from the bank.
    choices:
      - label: "Leap overboard into the Rhine"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You leap overboard and nearly drown before Count Ekbert dives in after you. Anno
          takes you, the regalia and the government to Cologne. Your mother retires to a
          convent. You will never trust a bishop again.
      - label: "Sit down and wait"
        legitimacy_bp: -500
        unrest_bp: -300
        outcome: >-
          Anno takes you, the regalia and the government to Cologne. You learn to smile at
          archbishops.
      - label: "Order the rowers back to the bank"
        legitimacy_bp: 200
        outcome: >-
          The oarsmen glance at the archbishop and go on rowing. You are a boy of twelve, and
          nobody has been told to obey you.
    history: >-
      In 1062 Archbishop Anno of Cologne kidnapped the young Henry IV at Kaiserswerth; Henry
      jumped into the Rhine and was rescued. Anno took over the regency.
    sources: ["Lampert of Hersfeld, Annales 1062", "Robinson, Henry IV of Germany (1999)"]

  - id: hre_worms
    scenario: year_1000
    civ: hre
    year: 1076
    title: "No Pope, but a False Monk"
    place: "Worms"
    speaker: diviner
    speaker_name: "Gregory VII, by letter"
    speaker_title: "Pope"
    needs_alive: [papacy]
    benchmark_provinces: 8
    story: >-
      The new pope, Gregory VII - Hildebrand, a Tuscan of humble birth and iron will - says that
      no layman, not even an emperor, may appoint a bishop, and that the pope may depose
      emperors. You have just appointed the archbishop of Milan.


      Gregory has written to you threatening excommunication. Your German bishops, meeting at
      Worms, are ready to declare that he is no pope at all.
    choices:
      - label: "Declare Gregory no longer pope"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2500
        outcome: >-
          Your letter is addressed to 'Hildebrand, now not pope but false monk' and ends: 'Come
          down, come down, to be damned for all eternity.' Gregory excommunicates you, and
          releases your subjects from their oaths. The Saxons and the southern dukes begin to
          talk of electing another king. They give you a year.
        deeds: {war_with: [papacy]}
      - label: "Give up Milan and negotiate"
        legitimacy_bp: -800
        influence: {clergy: 1500}
        outcome: >-
          You write to Gregory as a son. He replies as a father. The quarrel goes underground.
        deeds: {peace_with: [papacy]}
      - label: "Summon a council of princes and bishops"
        legitimacy_bp: 500
        unrest_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          You summon the great men of the realm to hear Gregory's letter before you answer. Some
          come, and some stay away, and the answer is a long time in coming.
    history: >-
      At the Synod of Worms (January 1076) Henry IV and his bishops repudiated Gregory VII;
      Gregory excommunicated Henry in February, starting the Investiture Contest.
    diverged: >-
      The Papacy is gone.
    sources: ["Henry IV's letter to Gregory VII (1076)", "Gregory VII, Register 3.10a"]

  - id: hre_canossa
    scenario: year_1000
    civ: hre
    year: 1077
    after: [hre_worms]
    title: "Canossa"
    place: "Before the castle of Canossa, in the snow"
    speaker: steward
    speaker_name: "Matilda of Tuscany"
    speaker_title: "Countess, Gregory's protector"
    needs_alive: [papacy]
    benchmark_provinces: 8
    story: >-
      The German princes will elect another king if you are not freed from excommunication by
      the anniversary. You have crossed the Alps in the worst winter in memory, your queen and
      baby son carried over the ice in ox hides. Gregory, who was on his way to Germany to judge
      you, has taken refuge in the castle of Canossa, with Countess Matilda.


      The gates are shut.
    choices:
      - label: "Go to the gate and ask for absolution"
        historical: true
        legitimacy_bp: 1000
        influence: {clergy: 1500}
        outcome: >-
          For three days you stand at the gate in a penitent's woollen shirt, barefoot, fasting.
          On the fourth Gregory lifts the excommunication. You have humiliated yourself - and
          saved your throne; the princes elect a rival anyway, but have lost their best excuse.
          Seven years later you take Rome, have your own pope crown you, and Gregory dies in
          exile: 'I have loved justice and hated iniquity; therefore I die in exile.'
      - label: "Go back to Germany and fight the princes"
        legitimacy_bp: -1000
        unrest_bp: 2500
        outcome: >-
          The princes elect Rudolf of Swabia king. Germany goes to war with itself.
      - label: "Rally the Lombard bishops to your side"
        legitimacy_bp: 500
        outcome: >-
          The Lombard bishops, who dislike Gregory's reforms, gather to you in strength. Gregory
          remains shut up in Canossa, and the princes' deadline passes.
        deeds: {men: 8000}
    history: >-
      In January 1077 Henry IV waited three days in the snow at Canossa until Gregory VII
      absolved him. 'Going to Canossa' still means humbling oneself.
    diverged: >-
      The Papacy is gone, or the quarrel never came.
    sources: ["Gregory VII, Register 4.12", "Lampert of Hersfeld 1077"]
