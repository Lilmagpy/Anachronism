schema_version: 1
# Chronicle mode (D-120, D-XXX): Carthage and the tyrant of Syracuse, 317-277 BC. Each chapter
# opens in its year; one choice is what history chose (historical: true). No Carthaginian
# history survives: every fact comes from Greeks and Romans, chiefly Diodorus 19-22 (who drew
# on Timaeus, a bitter enemy of Agathocles, and on Callias and Duris), Justin 22 and 18,
# Polybius 3 and Livy 9, with modern work by Lancel, Hoyos, Miles and Huss. Carthage was a
# republic run by its council of elders and two annual suffetes, so the chapters speak to the
# council as one ruler. benchmark_provinces counts the provinces of this map the real Carthage
# held at that date: four (Carthage, Byzacena, the west of Sicily and Sardinia), and also in
# 277, when Pyrrhus took all of Sicily but Lilybaeum. The sacrifice of children in 310 (told by
# Diodorus alone, and disputed by modern scholars in detail) is told with that caveat. Dates
# are approximate for 317 (Hamilcar's mediation) and 277 (Pyrrhus' siege of Lilybaeum, 277-276). The Roman treaty of 306 (Livy 9.43) is
# not on Polybius' list of treaties (509, an undated second, and 279), and is mentioned in the 279 chapter.
chapters:
  - id: carag_hamilcar
    scenario: alexander
    civ: carthage
    year: -317
    title: "Hamilcar Vouches for a Potter's Son"
    place: "The Council of Elders, Carthage"
    speaker: general
    speaker_name: "Hamilcar son of Gisco"
    speaker_title: "General in Sicily"
    needs_alive: [syracuse]
    benchmark_provinces: 4
    story: >-
      You are the Council of Carthage. Syracuse is torn between its oligarchs, the Six Hundred,
      and the poor, led by an ambitious soldier called Agathocles. The oligarchs have exiled
      him once already, and now he is back with an army of hirelings and the men of the lower town.
      Both sides have called on your general in Sicily, Hamilcar son of Gisco, to make peace.


      Hamilcar writes that Agathocles is his friend. He proposes to vouch for him before the
      gods, in exchange for a Syracuse that will cause Carthage no trouble. A weak, divided Syracuse is good for you; a strong one is
      not.
    choices:
      - label: "Let Hamilcar mediate, and trust Agathocles' oath"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Agathocles swears before Demeter and Kore, and is made guardian of the peace.
          Soon after, Diodorus says, his soldiers kill over four thousand of the Six
          Hundred's party in the streets of Syracuse. Carthage's friend is now the master
          of the largest Greek city of the west. Within a few years he will be at war with you.
      - label: "Forbid Hamilcar to meddle"
        legitimacy_bp: 500
        outcome: >-
          Hamilcar obeys, and Syracuse tears itself to pieces without you. The Six Hundred have
          no love for Carthage. Agathocles has even less.
    history: >-
      In about 317 BC the Carthaginian general Hamilcar helped bring about a reconciliation between
      Agathocles and the Syracusan oligarchs; Agathocles then seized the city.
    diverged: >-
      Syracuse is gone.
    sources: ["Diodorus 19.4-9", "Justin 22.2", "Huss, Die Karthager (1985)"]

  - id: carag_himera
    scenario: alexander
    civ: carthage
    year: -311
    title: "Hamilcar at the Himera"
    place: "The Council of Elders, Carthage"
    speaker: general
    speaker_name: "Hamilcar son of Gisco"
    speaker_title: "General in Sicily"
    needs_alive: [syracuse]
    benchmark_provinces: 4
    story: >-
      You are the Council. Agathocles has broken the treaty and attacked the Sicilian cities that
      are under your protection. You sent Hamilcar with a hundred
      and thirty ships and a great army of Africans and mercenaries. He has beaten Agathocles
      at the river Himera; most of the Greek cities of the island have come over to him; and the
      tyrant has been shut up in Syracuse.


      Hamilcar writes that he could take Syracuse by siege, and be master of Sicily. Some of
      the Council say that the war has won enough, and that Agathocles would sign anything.
    choices:
      - label: "Besiege Syracuse and finish the war"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -1000
        outcome: >-
          Hamilcar camps before the walls and sets a fleet across the harbours. The following
          summer the tyrant slips out of the blockade with an army, and lands in Africa, while
          Hamilcar is still before the walls.
        deeds: {martial_bp: 500}
      - label: "Take the peace Agathocles will beg for"
        legitimacy_bp: -500
        outcome: >-
          Agathocles keeps Syracuse, and has the chance to try his strength again, perhaps
          against you.
    history: >-
      After Hamilcar's victory at the Himera in 311 BC, Carthage besieged Syracuse
      and almost won the war in Sicily.
    diverged: >-
      Syracuse is gone.
    sources: ["Diodorus 19.106-110"]

  - id: carag_africa
    scenario: alexander
    civ: carthage
    year: -310
    title: "The Altars of Kronos"
    place: "Carthage"
    speaker: diviner
    speaker_name: "A priest of Kronos"
    speaker_title: "Of the old gods of Tyre"
    needs_alive: [syracuse]
    benchmark_provinces: 4
    story: >-
      You are the Council. Agathocles has landed on the African coast and burned his ships.
      You sent out a citizen army under Hanno and Bomilcar, who quarrelled; it was beaten, and
      Hanno died. The enemy have taken the towns of the countryside, and from the walls you can see
      their fires. Your army and fleet are in Sicily.


      The priests say that the gods are angry. Diodorus says that in the old days the best
      sons of the city were given to Kronos, and that more recently the leading families had been
      buying other children and rearing them to give instead. The priests say that, and that
      the offerings to Heracles of Tyre, your mother city, have been neglected. Greek writers say
      the sacrifices were real; modern scholars argue about how often.
    choices:
      - label: "Renew the sacrifices in the old way, and send gifts to Tyre"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1000
        influence: {clergy: 1500}
        outcome: >-
          Diodorus reports that two hundred sons of the noble families were sacrificed in public, and
          that three hundred other citizens offered themselves. He also says that you sent gold and
          silver to the temple of Heracles at Tyre. The war goes on, and the dead do not
          come back. Greek writers, Plutarch among them, will use the story against you for centuries.
        deeds: {martial_bp: 500}
      - label: "Offer money and ships to the gods, and keep the children at home"
        legitimacy_bp: -500
        unrest_bp: 1000
        influence: {clergy: -1000}
        outcome: >-
          The priests grumble, and half the city fears that the gods are not satisfied. The
          army fights harder, or does not.
    history: >-
      In 310 BC, Diodorus says, the Carthaginians made a mass sacrifice of children to Kronos
      in the face of Agathocles' invasion, and sent offerings to Tyre.
    diverged: >-
      Syracuse is gone.
    sources: ["Diodorus 20.10-14", "Plutarch, On Superstition 171", "Lancel, Carthage (1995)"]

  - id: carag_bomilcar
    scenario: alexander
    civ: carthage
    year: -308
    title: "Bomilcar Wants a Crown"
    place: "The agora of Carthage"
    speaker: steward
    speaker_name: "A suffete"
    speaker_title: "Of Carthage"
    needs_alive: [syracuse]
    benchmark_provinces: 4
    story: >-
      You are the Council. Bomilcar, who was elected general against Agathocles, has been a
      disappointment, and a danger. He has been in no hurry to destroy the enemy. Now,
      Diodorus says, he has gathered five hundred of his
      friends and some four thousand hired soldiers, and marched on the New Town.


      His men are cutting down citizens in the streets. He has declared himself tyrant. The
      Council meets in the Old Town, with only the guards it can find.
    choices:
      - label: "Rally the citizens and fight him in the streets"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: -500
        influence: {nobility: 500}
        outcome: >-
          The citizens fight back, and Bomilcar's men are driven to a hill and surrender
          on a promise of mercy. Diodorus says Bomilcar alone was crucified in the agora, calling the
          citizens ungrateful, and that the rest were spared. The Council keeps its power and its fear of generals.
      - label: "Make terms with Bomilcar"
        legitimacy_bp: -1500
        unrest_bp: 2500
        outcome: >-
          A tyrant at the head of Carthage is something the Greeks have always accused you of
          being afraid of. Now you have one.
    history: >-
      In 308 BC the Carthaginian general Bomilcar attempted a coup. Diodorus says the people
      beat him in the streets, and he was crucified.
    diverged: >-
      Syracuse is gone.
    sources: ["Diodorus 20.43-44", "Justin 22.7", "Aristotle, Politics 2.11"]

  - id: carag_peace
    scenario: alexander
    civ: carthage
    year: -306
    title: "The End of Agathocles' War"
    place: "The Council of Elders, Carthage"
    speaker: steward
    speaker_name: "A suffete"
    speaker_title: "Of Carthage"
    needs_alive: [syracuse]
    benchmark_provinces: 4
    story: >-
      You are the Council. Agathocles left his sons and his army in Africa, who surrendered, and
      went home to Sicily by night. Some of you want to have Syracuse for good: the tyrant is
      unpopular, and the exiles of the Six Hundred are still fighting him. But the war has cost
      you ships, money, and the loyalty of several African tribes.


      Agathocles offers peace on the old frontier. A war of conquest would cost more than the
      west of Sicily is worth.
    choices:
      - label: "Make peace on the old frontier"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Diodorus says peace was made in 306 BC, and that you kept what you held before. Carthage
          stays master of the west of Sicily. It has not conquered Syracuse, and the
          Sicilian Greeks have learned that your empire can be reached by sea.
        deeds: {peace_with: [syracuse]}
      - label: "Press the war, and support the exiles"
        legitimacy_bp: -500
        wealth_bp: -1500
        outcome: >-
          The treasury is not deep enough, and the Libyans you rely on for soldiers
          are tired.
    history: >-
      Carthage and Agathocles made peace in 306 BC, on roughly the old frontier in Sicily.
    diverged: >-
      Syracuse is gone.
    sources: ["Diodorus 20.79", "Justin 22.8"]

  - id: carag_rome
    scenario: alexander
    civ: carthage
    year: -279
    title: "Mago Brings Ships to Rome"
    place: "The Council of Elders, Carthage"
    speaker: general
    speaker_name: "Mago"
    speaker_title: "Admiral"
    needs_alive: [rome]
    benchmark_provinces: 4
    story: >-
      You are the Council. Pyrrhus of Epirus is in Italy with elephants, and has beaten the
      Romans twice. You have kept your treaties with Rome. Polybius lists two treaties
      before this: the first in 509 BC, when the Republic was new, and a second, which he does not
      date. Livy knows of a renewal in 306 that Polybius does not list. By the old terms the
      Romans may trade in your part of Sicily but may not sail beyond the Fair Promontory, and
      you hold no city in Latium.


      Pyrrhus has also been asked to Sicily by the Greek cities. If he takes the island,
      he will be at your gates. Mago, your admiral, offers to take a hundred and twenty ships
      to Rome, to offer help.
    choices:
      - label: "Send Mago to Rome with the fleet, and renew the treaty"
        historical: true
        legitimacy_bp: 1000
        wealth_bp: -500
        outcome: >-
          Mago lands, and the Senate thanks him but declines the soldiers. A treaty is
          made, with a clause, as Polybius gives it, that whichever state is helped by the
          other will receive ships to carry its men, and that each will pay its own soldiers.
          Justin adds that Mago then went to Pyrrhus to find out his plans. Pyrrhus is the enemy
          of both.
        deeds: {ships: 20}
      - label: "Keep the fleet at home, and see who wins"
        legitimacy_bp: -500
        outcome: >-
          Rome sees that Carthage can be relied on for nothing.
    history: >-
      In 279 BC (or 278) Carthage and Rome made a treaty against Pyrrhus, as Polybius records it. Justin
      says Mago's fleet offered help, and that Rome declined it.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 3.22-26", "Livy 9.43", "Justin 18.2", "Hoyos, Hannibal's Dynasty (2003)"]

  - id: carag_pyrrhus
    scenario: alexander
    civ: carthage
    year: -277
    title: "Pyrrhus in Sicily"
    place: "Lilybaeum"
    speaker: general
    speaker_name: "Your envoy"
    speaker_title: "To Pyrrhus"
    needs_alive: [epirus]
    benchmark_provinces: 4
    story: >-
      You are the Council. Pyrrhus has crossed to Sicily on the invitation of the Greek cities,
      and in two seasons he has taken every Carthaginian town on the island but the
      fortress of Lilybaeum, which stands on a rock on the sea with the supplies of Carthage in
      the harbour. He is besieging it, and he has not been able to break it.


      Pyrrhus is a great general, but he has no fleet that can stop yours. He could be
      bought off. Plutarch says he has begun to plan a fleet and a crossing to Africa, as Agathocles once
      did.
    choices:
      - label: "Hold Lilybaeum, and offer him money and ships for peace"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -1000
        outcome: >-
          Plutarch says the Carthaginians offered him money and ships if he would make peace
          with them, and that he refused unless Carthage left Sicily and made the Libyan sea its frontier. His own allies
          are beginning to hate him, and his army cannot take the walls. You wait.
      - label: "Offer him the whole of Sicily, if he will leave Lilybaeum"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          You surrender the west of the island, and your last bridgehead. Pyrrhus takes it,
          and is not satisfied.
        deeds: {give: [a3_west_sicily], give_to: epirus}
    history: >-
      In 277-276 BC Pyrrhus took all of Carthaginian Sicily but Lilybaeum, which he could not take.
      His Greek allies turned on him and he left for Italy in 276; Carthage soon recovered
      its holdings.
    diverged: >-
      Epirus is gone.
    sources: ["Plutarch, Pyrrhus 22-23", "Diodorus 22.8-10", "Justin 23.3"]
