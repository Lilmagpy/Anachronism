schema_version: 1
# Chronicle mode (D-120, D-134): meanwhile, in the world, 336-320 BC (told in Alexander's chronicle).
almanac:
  - {id: ax_aristotle_lyceum, scenario: alexander, year: -335, text: "In Athens, your old tutor Aristotle opens a school in the gymnasium of the Lyceum, where he lectures walking up and down. His students start collecting everything: constitutions, animals, plants, plays."}
  - {id: ax_rome_samnites, scenario: alexander, year: -326, needs_alive: [rome], text: "Rome goes to war with the Samnites of the Apennines. It will take forty years, and in its first years the Romans will be trapped in a mountain pass and made to walk under a yoke of spears."}
  - {id: ax_alexander_epirus, scenario: alexander, year: -331, needs_alive: [epirus], text: "Your uncle, Alexander of Epirus, who crossed to Italy to fight for the Greek cities there, is killed at Pandosia by a Lucanian exile - at the very river an oracle had told him to beware."}
  - {id: ax_agis, scenario: alexander, year: -331, needs_alive: [sparta], text: "King Agis of Sparta rises against Macedon with Persian gold. Antipater crushes him at Megalopolis. Alexander, told of it in Asia, calls it 'a battle of mice'."}
  - {id: ax_pytheas, scenario: alexander, year: -325, text: "Pytheas of Massalia sails out past the Pillars of Heracles, round Britain, and north to a land of midnight sun and a frozen sea he calls Thule."}
  - {id: ax_lycurgus, scenario: alexander, year: -330, needs_alive: [athens], text: "In Athens, Lycurgus finishes the stone theatre of Dionysus and has official copies made of the plays of Aeschylus, Sophocles and Euripides, so that actors can no longer change the words."}
  - {id: ax_chandragupta, scenario: alexander, year: -324, text: "In India, a young man called Chandragupta, who is said to have met Alexander in the Punjab, begins gathering an army against the Nanda kings."}
  - {id: ax_harpalus, scenario: alexander, year: -324, needs_alive: [athens], text: "Harpalus, Alexander's treasurer, runs away to Athens with five thousand talents. Demosthenes is accused of taking twenty of them, convicted and fined, and flees the city."}
  - {id: ax_aristotle_leaves, scenario: alexander, year: -323, needs_alive: [athens], text: "With Alexander dead, Athens turns against everything Macedonian. Aristotle leaves the city, 'lest the Athenians sin twice against philosophy'. He dies the next year."}
  - {id: ax_diogenes_dies, scenario: alexander, year: -323, text: "In Corinth, the old philosopher Diogenes dies - on the same day as Alexander, some will say."}
