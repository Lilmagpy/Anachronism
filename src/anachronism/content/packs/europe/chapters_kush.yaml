schema_version: 1
# Chronicle mode (D-120, D-XXX): the Kingdom of Kush at Meroe, 264-204 BC. Each chapter opens
# in its year; one choice is what history chose (historical: true). Facts follow Diodorus 3.5-3.6
# (drawn from Agatharchides, a Greek writer in Ptolemaic Alexandria), Strabo 16.4 and 17.1,
# the Pithom stela, and the temple inscriptions of Musawwarat es-Sufra, Dakka, Dabod and Philae,
# with modern work by Edwards (The Nubian Past), Torok (The Kingdom of Kush), Hintze, Welsby
# and Hoelbl. The Meroitic script is not yet read in the royal annals, so every date here is
# approximate: kings' reigns are only roughly known and the order of the early kings between
# Arkamani I and Arnekhamani is uncertain. The ruler list in the scenario is
# Arkamani I (Ergamenes, to c. 258), Amanislo (c. 258-236), Arnekhamani (c. 236-218),
# Arqamani II (c. 218-206), Adikhalamani (c. 206-186); Amanislo's place and the length of
# each reign are scholarly reconstructions. Kush is one province on this map throughout, so
# benchmark_provinces is 1 at every date.
chapters:
  - id: kus_priests
    scenario: punic_wars
    civ: kush
    year: -264
    title: "The God Commands the King to Die"
    place: "The Golden Shrine"
    speaker: diviner
    speaker_name: "The priests of Amun"
    speaker_title: "Of the Golden Shrine"
    benchmark_provinces: 1
    story: >-
      You are Arkamani, king of Kush, whom the Greeks call Ergamenes. You have been taught Greek
      letters and Greek philosophy, which is rare for a king of the upper Nile. The story, told
      by Greek writers, runs that in the old days the priests sent a messenger to the king
      whenever they pleased, saying that the god had ordered him to die, and the kings,
      believing the god had spoken, took their own lives.


      Whether or not the custom was ever real, the priests of Amun still claim a power over
      kings, and the god's oracle at Napata and the great shrine of Meroe stand on their side.
      A message has come: the god has spoken.
    choices:
      - label: "Break the priests' power by force"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        influence: {clergy: -2500, nobility: 1000}
        outcome: >-
          The story as the Greek writers tell it says you went to the shrine with an armed
          band, killed the priests and abolished the custom. Modern scholars doubt every detail
          of it, but think it tells something true: the kings of Kush stopped taking orders from
          the old priesthood of Amun, and Meroe began to outrank Napata.
      - label: "Submit to the priests' verdict"
        legitimacy_bp: -2000
        influence: {clergy: 2000}
        outcome: >-
          The kingdom is left to the priests' choice of your heir. The Greeks will never hear of
          you again.
      - label: "Buy the priests off with land and treasure"
        wealth_bp: -2000
        influence: {clergy: 1000}
        legitimacy_bp: 300
        outcome: >-
          The priests take the offering and keep the right to speak in the god's name. The next
          king will have to fight the same quarrel.
    history: >-
      According to Diodorus (3.6), who draws on the Greek writer Agatharchides, Ergamenes, a king
      of Meroe in the time of Ptolemy II, broke the priests' power by force. The tale is a
      Greek one and not found in Kushite sources; the king's name is the Greek form of Arkamani.
    sources: ["Diodorus 3.5-3.6", "Torok, The Kingdom of Kush (1997)", "Edwards, The Nubian Past (2004)"]

  - id: kus_dodekaschoinos
    scenario: punic_wars
    civ: kush
    year: -262
    title: "The Twelve Schoinoi"
    place: "The first cataract"
    speaker: ptolemaic
    speaker_name: "A Ptolemaic envoy"
    speaker_title: "From the court at Alexandria"
    needs_alive: [ptolemaic]
    benchmark_provinces: 1
    story: >-
      You are Arkamani. To the north, Ptolemy II rules Egypt, and his armies have been in Nubia:
      a stela from Pithom tells of a campaign into your northern lands, and his hunters have set
      up stations on the Red Sea coast to catch elephants for his armies. The strip of river
      between Aswan and the north end of your lands, the Greeks call the Dodekaschoinos, the
      Twelve Schoinoi, and Egypt treats it as hers, with the temples of Isis at Philae at its
      head.


      A Ptolemaic envoy has come south. He wants gold from the desert mines, elephants and
      ivory, and a settled border. Your own forces could dispute the strip. They could also
      stay at home.
    choices:
      - label: "Accept the border and trade for peace"
        historical: true
        wealth_bp: 1500
        legitimacy_bp: 500
        outcome: >-
          Kush and Egypt will not fight a great war for the next sixty years, and the border
          holds. Greek and Egyptian merchants come to Meroe, and you get Mediterranean goods and,
          before long, Greek stories about you.
        deeds: {peace_with: [ptolemaic]}
      - label: "Dispute the strip, and send soldiers north"
        unrest_bp: 800
        outcome: >-
          Your army can hold the river but not the Egyptian grain behind it. The Ptolemies
          send mercenaries and ships, and your gold fills their treasury anyway.
        deeds: {martial_bp: 300, grudges: {ptolemaic: 2000}}
      - label: "Close the roads to Egypt"
        wealth_bp: -1000
        outcome: >-
          Trade shifts to the Red Sea coast, and the elephants go to Alexandria by sea, beyond
          your control.
    history: >-
      After Ptolemy II's Nubian campaign (c. 275-274 BC) the Ptolemies held the Dodekaschoinos
      and traded with Kush; relations seem to have been mostly peaceful for much of the third
      century.
    diverged: >-
      The Ptolemies are gone.
    sources: ["Pithom stela", "Strabo 16.4.7", "Hoelbl, A History of the Ptolemaic Empire (2001)"]

  - id: kus_meroe_tomb
    scenario: punic_wars
    civ: kush
    year: -260
    title: "Where the King Will Lie"
    place: "Meroe"
    speaker: diviner
    speaker_name: "A priest of Amun"
    speaker_title: "From Napata"
    benchmark_provinces: 1
    story: >-
      You are Arkamani, now an old man. Since the days of Taharqa, the kings of Kush have been
      buried at Nuri, near the holy mountain of Gebel Barkal, under steep little pyramids. But
      you have spent much of your reign at Meroe, a long way up the river, where the land is rich
      in iron and cattle, and where the rains fall.


      The old priests at Napata would like you to lie where your fathers lie. Your own court
      is in the south.
    choices:
      - label: "Be buried at Meroe, beside the new capital"
        historical: true
        legitimacy_bp: 1000
        influence: {clergy: -500, nobility: 500}
        outcome: >-
          You are the first king known to be buried in the royal cemetery at Meroe, in a stone
          pyramid, and your successors follow you for centuries. Napata stays holy. It is where
          the god will crown kings. But the heart of the kingdom moves south.
      - label: "Return to Nuri, like your ancestors"
        legitimacy_bp: 500
        influence: {clergy: 1500}
        outcome: >-
          Your tomb joins the old pyramids at Nuri, and the court's power remains tied to the
          priests of Napata.
      - label: "Be buried at Gebel Barkal, in the god's own temple"
        legitimacy_bp: -300
        influence: {"clergy": 800}
        outcome: >-
          The temple is old and sacred, and holds no room for a king's tomb.
    history: >-
      The cemetery of Nuri ceased to be used; Arkamani (Ergamenes) is the first king known to be
      buried at Meroe, c. 260 BC (approximate). Napata remained a holy city.
    sources: ["Torok, The Kingdom of Kush (1997)", "Welsby, The Kingdom of Kush (1996)"]

  - id: kus_lion
    scenario: punic_wars
    civ: kush
    year: -234
    title: "A Lion-Headed God"
    place: "Musawwarat es-Sufra"
    speaker: diviner
    speaker_name: "The priests of Apedemak"
    speaker_title: "At the Great Enclosure"
    benchmark_provinces: 1
    story: >-
      You are Arnekhamani, king of Kush. In the dry steppe east of the Nile, south of the great
      bend, your predecessors have been raising the vast stone maze at Musawwarat es-Sufra:
      courtyards, ramps and walls, with no dwellings that anyone has found. Nobody now knows
      for certain what it was for, whether a pilgrim's shrine, a school for temple servants, or a
      stage for the great festival.


      Apedemak, a god with a lion's head, seems to belong to the savannah people of the south,
      your own cattle-breeders and hunters, rather than to Egypt. You can give him a temple in your
      stone-building style, beside the old Egyptian gods, or let the old gods have the money.
    choices:
      - label: "Raise a temple to Apedemak at Musawwarat"
        historical: true
        legitimacy_bp: 1200
        wealth_bp: -800
        influence: {clergy: 500, nobility: 500}
        outcome: >-
          The Lion Temple at Musawwarat carries your name and relief of the god and king
          together. In later years Apedemak is one of the great gods of Kush, and the kings of
          Meroe will build him other temples, at Naqa and elsewhere.
      - label: "Spend the money on Amun at Napata"
        wealth_bp: -800
        influence: {clergy: 1500}
        legitimacy_bp: 300
        outcome: >-
          Napata's priests are delighted and the southern herdsmen are not.
      - label: "Dig canals and a reservoir for the herds"
        food_bp: 1500
        wealth_bp: -800
        unrest_bp: -500
        outcome: >-
          Cattle drink in dry years, but nobody builds you a temple.
    history: >-
      The Lion Temple at Musawwarat es-Sufra, with the name of King Arnekhamani, c. 235-218 BC
      (approximate), is among the earliest Kushite temples to the lion god Apedemak.
    sources: ["Welsby, The Kingdom of Kush (1996)", "Edwards, The Nubian Past (2004)"]

  - id: kus_dakka
    scenario: punic_wars
    civ: kush
    year: -212
    title: "A Temple at Pselchis"
    place: "Pselchis (Dakka)"
    speaker: ptolemaic
    speaker_name: "A Ptolemaic official"
    speaker_title: "From Philae"
    needs_alive: [ptolemaic]
    benchmark_provinces: 1
    story: >-
      You are Arqamani, king of Kush, whom the Greeks also call Ergamenes. You have a good
      relationship with the Ptolemies. At Pselchis, the town the Egyptians call Dakka, in the
      Dodekaschoinos, there is a chapel of the god Thoth, whom the Greeks identify with
      Hermes. It is on the border of your lands and Egypt's.


      You have been asked to build or enlarge the temple with your name on it, and the Ptolemies,
      who hold the strip, would add theirs. A joint building shows the gods that both kings are
      friends. It also shows Egypt's priests, and Egypt's soldiers, how far south a Pharaoh
      reaches.
    choices:
      - label: "Build the temple jointly with the Ptolemies"
        historical: true
        legitimacy_bp: 800
        wealth_bp: -500
        outcome: >-
          The chapel at Dakka carries your name, and Ptolemy IV adds his. Two kings are named
          beside Thoth and Isis, and the strip is held in common, for as long as it lasts.
        deeds: {peace_with: [ptolemaic]}
      - label: "Build alone, and claim the strip for Kush"
        legitimacy_bp: 600
        unrest_bp: 300
        wealth_bp: -500
        outcome: >-
          The Ptolemaic governor of the Thebaid protests loudly and sends more soldiers to
          Philae.
        deeds: {"men": 2000, "grudges": {"ptolemaic": 1500}}
      - label: "Spend the money on granaries instead"
        legitimacy_bp: -200
        food_bp: 600
        outcome: >-
          Dakka remains a small chapel, and the granaries at Meroe fill.
    history: >-
      The oldest part of the temple at Dakka was built by the Kushite king Arqamani (Ergamenes
      II), who reigned c. 218-206 BC (approximate), and Ptolemy IV added to it. The Greeks called
      the town Pselchis.
    diverged: >-
      The Ptolemies are gone.
    sources: ["Hoelbl, A History of the Ptolemaic Empire (2001)", "Torok, The Kingdom of Kush (1997)"]

  - id: kus_thebes
    scenario: punic_wars
    civ: kush
    year: -204
    title: "Pharaohs at Thebes"
    place: "Meroe"
    speaker: general
    speaker_name: "Your general at the border"
    speaker_title: "Of the northern marches"
    needs_alive: [ptolemaic]
    benchmark_provinces: 1
    story: >-
      You are Adikhalamani, king of Kush. Ptolemy IV is dead, and a child sits on the throne in
      Alexandria while ministers quarrel. In Upper Egypt, Egyptian soldiers who fought at Raphia,
      and priests who are tired of the Greek court, have raised a Theban, Horwennefer, as
      Pharaoh. A little later another man, Ankhwennefer, will follow him.


      The rebels need friends in the south, and a quiet southern frontier. The governors of
      the Dodekaschoinos have far fewer soldiers than before.
    choices:
      - label: "Occupy the river temples, avoid the war"
        historical: true
        legitimacy_bp: 800
        wealth_bp: 300
        outcome: >-
          For a time the Ptolemies lose their grip on the south. Scholars think that the
          Kushites held the strip about this time: your name is carved at Philae and at Dabod,
          beside the Ptolemies' later cartouches. When the Ptolemies recover Thebes, in 186, they
          will take the temples back, and your kingdom will be left with the memory.
        deeds: {grudges: {ptolemaic: 1000}}
      - label: "Send an army north to help the rebels"
        unrest_bp: 800
        outcome: >-
          The Theban pharaohs welcome your men, but when the Ptolemaic armies come south you
          will fight them alone.
        deeds: {martial_bp: 300, grudges: {ptolemaic: 3000}}
      - label: "Keep the peace with Alexandria"
        wealth_bp: 500
        outcome: >-
          Alexandria is grateful, and the rebel pharaohs in Thebes do not forget it.
        deeds: {peace_with: [ptolemaic]}
    history: >-
      During the Theban revolt (205-186 BC) the Ptolemies lost control of the south. The
      Kushite king Adikhalamani (c. 206-186 BC, approximate) is named in the oldest part of the
      temple at Dabod, and some scholars think Kush held the Dodekaschoinos in those years.
    diverged: >-
      The Ptolemies are gone.
    sources: ["Hoelbl, A History of the Ptolemaic Empire (2001)", "Torok, The Kingdom of Kush (1997)", "McGing, Revolt Egyptian Style (1997)"]
