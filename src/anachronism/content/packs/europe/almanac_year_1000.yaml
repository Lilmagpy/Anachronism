schema_version: 1
# Chronicle mode (D-120, D-137): meanwhile, in the world, 1000-1066 (told in an English chronicle).
almanac:
  - {id: y1_vinland, scenario: year_1000, year: 1001, text: "Leif Eriksson, sailing west from Greenland, lands on a coast with grapes and salmon and calls it Vinland. Norse houses will be found at L'Anse aux Meadows in Newfoundland, nine centuries later."}
  - {id: y1_otto, scenario: year_1000, year: 1002, needs_alive: [hre], text: "Emperor Otto III, who dreamed of restoring the Roman empire with its capital in Rome, dies of fever outside the city at twenty-one."}
  - {id: y1_basil, scenario: year_1000, year: 1014, needs_alive: [byzantium, bulgaria], text: "At Kleidion, Emperor Basil II captures the Bulgarian army. He blinds fifteen thousand prisoners, leaving one eye to every hundredth man to lead them home. Tsar Samuel dies of shock at the sight."}
  - {id: y1_genji, scenario: year_1000, year: 1008, text: "In Kyoto, a lady-in-waiting called Murasaki Shikibu is writing The Tale of Genji, which many will call the world's first novel."}
  - {id: y1_avicenna, scenario: year_1000, year: 1025, text: "In Persia, Ibn Sina - Avicenna - finishes his Canon of Medicine, which Europe's universities will use as their textbook for six hundred years."}
  - {id: y1_cordoba, scenario: year_1000, year: 1031, needs_alive: [cordoba], text: "The caliphate of Córdoba breaks apart into a mosaic of quarrelling taifa kingdoms. The most brilliant city of the west will never be a capital again."}
  - {id: y1_guido, scenario: year_1000, year: 1026, text: "In Italy, a monk called Guido of Arezzo teaches choirboys to sing from lines on a page, with notes named ut, re, mi, fa, sol and la."}
  - {id: y1_alhazen, scenario: year_1000, year: 1021, needs_alive: [fatimids], text: "In Cairo, Ibn al-Haytham finishes his Book of Optics, explaining that we see because light enters the eye, and testing his ideas by experiment."}
  - {id: y1_seljuks, scenario: year_1000, year: 1055, text: "The Seljuk Turks, horsemen from the steppe, enter Baghdad, and the caliph names their leader Tughril 'Sultan' - the holder of power."}
  - {id: y1_schism, scenario: year_1000, year: 1054, text: "In Constantinople, a papal legate lays a bull of excommunication on the altar of Hagia Sophia, and the patriarch excommunicates him back. The Catholic and Orthodox churches are split."}
  - {id: y1_supernova, scenario: year_1000, year: 1054, text: "Chinese astronomers record a 'guest star' in Taurus so bright it is visible by day for three weeks. Its remains will one day be called the Crab Nebula."}
  - {id: y1_halley, scenario: year_1000, year: 1066, text: "In April a long-haired star blazes across the sky for a week. Men say it is an omen of the death of kings. It will come back every seventy-six years and be named after an astronomer called Halley."}
