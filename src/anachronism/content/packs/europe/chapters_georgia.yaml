schema_version: 1
# Chronicle mode (D-120): the kingdom of Georgia, from Bagrat III to David the Builder and
# the taking of Tbilisi, 1000-1122. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Georgian royal chronicles (Kartlis
# Tskhovreba, including the 'History of the King of Kings David'), Skylitzes, Aristakes of
# Lastivert and Matthew of Edessa, with modern work by Rapp, Suny, Lordkipanidze and
# Rayfield. Dates are approximate where noted: the Svindax battle (1022), the title
# 'King of Kings' and the length of the Turkish raids of the 1080s are not fixed by the
# sources. The map holds Georgia as the single province of Kutaisi, so benchmark_provinces
# is 1 throughout.
chapters:
  - id: geo_taos
    scenario: year_1000
    civ: georgia
    year: 1000
    title: "The Curopalates Is Dead"
    place: "Kutaisi"
    speaker: byzantium
    speaker_name: "Basil II"
    speaker_title: "Emperor of the Romans"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are Bagrat, king of the Abkhazians, ruling from Kutaisi by the Black Sea. Your father
      Gurgen holds Kartli, the old Georgian heartland inland. Your kinsman David, prince of Tao
      and a Byzantine curopalates, has just died, and with him the strongest Georgian lord. His
      great fortresses along the upper Euphrates are full of treasure and soldiers.


      Years ago David borrowed Basil II's help against a rebel and promised his lands to the
      emperor after his death. Now Basil is coming to claim them, and your Georgian nobles say
      Tao belongs to the Georgian crown. Basil has the strongest army in the world, but the
      fortresses are strong too.
    choices:
      - label: "Treat with Basil and keep your own lands"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          The emperor takes David's lands and garrisons his fortresses, and gives honours to
          your house in return for peace. Your father receives a Byzantine title, and no
          Georgian army fights the Romans. Tao, the cradle of Georgian monasteries, is a
          Byzantine province, and it will be a quarrel between your house and Constantinople
          for another generation.
      - label: "Send nobles to hold Tao's fortresses"
        unrest_bp: 800
        legitimacy_bp: 500
        outcome: >-
          The garrisons will not stand when the emperor's army arrives, and the nobles who
          went to Tao are scattered or taken. Basil remembers who held the walls against him.
        deeds: {men: 4000, grudges: {byzantium: 1500}}
      - label: "Call the Armenian princes to a joint stand"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          The Armenian lords answer politely and send little, since each has his own quarrel with
          the emperor's agents. Basil takes David's lands, and you have made yourself known to him.
        deeds: {men: 3000}
    history: >-
      David III of Tao died in 1000; Basil II took his lands, and by 1001 had made terms with
      Gurgen and Bagrat of the Bagratid house.
    diverged: >-
      Byzantium is gone.
    sources: ["Skylitzes, Synopsis", "Kartlis Tskhovreba", "Rapp, Studies in Medieval Georgian Historiography (2003)"]

  - id: geo_king
    scenario: year_1000
    civ: georgia
    year: 1008
    title: "The First King of All Georgia"
    place: "Kutaisi"
    speaker: ruler
    speaker_name: "Bishop of Kutaisi"
    speaker_title: "Keeper of your father's seal"
    benchmark_provinces: 1
    story: >-
      You are Bagrat III. Your father Gurgen is dead, and his kingdom of Kartli comes to you
      with your Abkhazian crown. For the first time in centuries one man is lord of the whole
      west, from the sea to the mountains, and the lords of Tao who live in exile come to your
      court.


      Tbilisi is still a Muslim emirate, and Kakheti in the east has its own kings. But you are
      the king of the Abkhazians and the Georgians now. Your bishops ask where the crown should
      sit: at Kutaisi, where you built the great cathedral, or among the old Kartli lords who
      are not sure they want an Abkhazian king.
    choices:
      - label: "Take one crown and rule from Kutaisi"
        historical: true
        legitimacy_bp: 2500
        influence: {clergy: 1000, nobility: 500}
        outcome: >-
          Kutaisi becomes the royal city of a united kingdom, and the Kartli lords, who dislike
          it, submit one by one. The cathedral you built there, which the Georgians will call
          Bagrati, is the church of the whole kingdom. Georgia begins its long life as one
          country, though the eastern valleys still look their own way.
      - label: "Keep Abkhazia and Kartli as two crowns"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          The two lands keep their own councils and customs, and neither feels its king is
          really its own. Your heir will find the crowns harder to hold together than you did.
      - label: "Move your court to Kartli's old towns"
        legitimacy_bp: 1000
        influence: {nobility: 800}
        unrest_bp: 300
        outcome: >-
          The Kartli lords are flattered and the western nobles are not. The sea road and the
          cathedral at Kutaisi are left to lesser men, and you are a stranger in your father's
          fortresses.
    history: >-
      On the death of his father Gurgen in 1008, Bagrat III became the first king of a united
      Georgian kingdom, ruling from Kutaisi, where the Bagrati cathedral had been built.
    sources: ["Kartlis Tskhovreba", "Suny, The Making of the Georgian Nation (1988)"]

  - id: geo_basil
    scenario: year_1000
    civ: georgia
    year: 1022
    title: "The Emperor Comes to Georgia"
    place: "Near the Tao frontier"
    speaker: general
    speaker_name: "A Georgian commander"
    speaker_title: "From the field after Shirimni"
    needs_alive: [byzantium]
    benchmark_provinces: 1
    story: >-
      You are George, king of the Georgians, not yet twenty-five. Your father died eight years
      ago and you have been claiming David's old lands of Tao ever since. You raided them, took
      the fortresses of Kola and Artaan, and joined rebel Byzantine generals against the
      emperor. In 1021 Basil II came in person to answer.


      At Shirimni your army and the Armenian princes' were beaten, and a second battle has been
      fought since. The old emperor is camped in Georgian land with the best army in the world.
      His terms are heavy: Tao and the border fortresses for the empire, and your son, a
      little boy, as a hostage in Constantinople.
    choices:
      - label: "Accept Basil's terms and send your son"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Georgia gives up Tao, Kola, Artaan and the border lands, and your small son
          Bagrat is sent to Constantinople, where he will grow up at the emperor's court. Basil
          withdraws and never reaches Kutaisi. You keep your kingdom, and the Georgians do not
          forget the loss of the lands of Tao.
      - label: "Withdraw to the mountains and fight on"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          The emperor burns the valleys of Javakheti and Kartli before the winter, and your
          villages pay for the pride of the king. You make peace in the end, on worse terms.
        deeds: {grudges: {byzantium: 1500}}
      - label: "Cede the border forts, keep your son"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Basil takes Kola, Artaan and the border lands, but he wants his hostage too. The war
          drags on through a hard winter, and in the end you give way.
        deeds: {martial_bp: -300}
    history: >-
      Basil II's campaigns of 1021-1022 beat George I at Shirimni (1021) and Svindax (1022).
      George gave up Tao, Phasiane, Kola and Artaan and sent his small son Bagrat to
      Constantinople as a hostage.
    diverged: >-
      Byzantium is gone.
    sources: ["Skylitzes, Synopsis", "Aristakes of Lastivert", "Kartlis Tskhovreba"]

  - id: geo_alp
    scenario: year_1000
    civ: georgia
    year: 1068
    title: "The Sultan in Kartli"
    place: "Kutaisi"
    speaker: steward
    speaker_name: "A royal steward"
    speaker_title: "Of the treasury"
    benchmark_provinces: 1
    story: >-
      You are Bagrat IV, king of the Georgians for forty years. You came to the throne as a
      boy, spent your youth fighting the great lord Liparit, and made peace with Byzantium. The
      Turks are new. Their sultan Alp Arslan took Ani in 1064 and has raided the Georgian lands
      since. Now he is coming again, with a larger army, and your valleys lie in front of him.


      Your lords say he cannot be beaten in the open field. They have seen what became of the
      Armenians and of the emperor's troops. The sultan wants submission, and tribute, and will
      take the cities in the east if he does not get them.
    choices:
      - label: "Submit and pay the sultan's tribute"
        historical: true
        legitimacy_bp: -500
        wealth_bp: -1000
        outcome: >-
          Alp Arslan accepts your submission and takes the tribute, and his raiders go home. The
          Georgians are the Sultan's tribute-payers for the time being, and Tbilisi, with the
          rest of the east, lies under Muslim rule. Your kingdom survives by bending, and by
          waiting for a better day.
      - label: "Hold the passes against his army"
        unrest_bp: 1500
        wealth_bp: -500
        outcome: >-
          Your highlanders hold one pass and lose the next. The Turks burn Kartli and carry off
          thousands before you ask for terms at last, and the terms are no better.
        deeds: {martial_bp: 500}
      - label: "Send hostages and gifts, not tribute"
        legitimacy_bp: -300
        wealth_bp: -600
        unrest_bp: 500
        outcome: >-
          The sultan's envoys weigh your gifts and are not satisfied. They take your hostages home
          and the raiders stay a season longer before the terms are settled.
    history: >-
      Bagrat IV reigned 1027-1072. Alp Arslan raided Georgia in 1064 and again in 1068, and
      Bagrat accepted the sultan's suzerainty and paid tribute.
    sources: ["Kartlis Tskhovreba", "Rayfield, Edge of Empires (2012)"]

  - id: geo_malik
    scenario: year_1000
    civ: georgia
    year: 1080
    title: "The Great Turkish Invasion"
    place: "The mountains of Svaneti"
    speaker: general
    speaker_name: "A captain of the guard"
    speaker_title: "Who came up from Kartli"
    benchmark_provinces: 1
    story: >-
      You are George II, a young king. Your father Bagrat died when you were eighteen. The
      sultan Malik-Shah has come in person, and the chroniclers will call these years the Great
      Turkish Invasion. His armies and the Turkish nomads who follow them have taken the plains
      of Kartli, the towns are burning, and the farmers are leaving their fields.


      You can submit to the sultan and pay him what he asks, or withdraw into the mountains
      and wait for the Turks to move on, as the Georgians have done in every war.
    choices:
      - label: "Submit to the sultan and keep your crown"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        food_bp: -1000
        outcome: >-
          The sultan accepts and gives you back your crown, and the Turkish nomads settle for
          the winters in the Kartli plains. The countryside is half empty, whole villages have
          fled to the hills, and the kingdom you rule is smaller and poorer every year.
      - label: "Withdraw to the hills and wait"
        unrest_bp: 2000
        legitimacy_bp: -1000
        outcome: >-
          The Turks do not stay in the hills. They take the lowlands for good, with every town
          that pays them, and the Georgian monarchy is left to the mountains.
      - label: "Strip the plains and hold Kutaisi"
        food_bp: -1500
        unrest_bp: 800
        legitimacy_bp: 300
        outcome: >-
          The granaries of Kartli are emptied and the herds driven west. The Turks find little to
          eat and move on, but the peasants have lost their harvest and blame their king.
        deeds: {martial_bp: 300}
    history: >-
      George II (1072-1089) faced the Great Turkish Invasion of the 1080s, under Malik-Shah,
      and paid tribute to the Seljuks; the Kartli countryside was ravaged. The details of the
      years are poorly dated in the chronicles.
    sources: ["Kartlis Tskhovreba", "Matthew of Edessa", "Rayfield, Edge of Empires (2012)"]

  - id: geo_tribute
    scenario: year_1000
    civ: georgia
    year: 1100
    title: "The Last Tribute"
    place: "Kutaisi"
    speaker: ruler
    speaker_name: "The chronicler of the king"
    speaker_title: "Who writes of your reign"
    benchmark_provinces: 1
    story: >-
      You are David, called by your subjects the Builder. You were sixteen when your father
      stepped down, and the Turks were then in the Georgian plains. You have used the years to
      build up a following of loyal lords, to bring peasant levies into the army, and to wait
      for the sultans to quarrel among themselves. Malik-Shah is dead, and the Seljuks have
      split into rival houses. The First Crusade has taken Jerusalem.


      The tribute is due again. Your counsellors say now is the time to refuse. Others say you
      are not strong enough, and that a Turkish army would find your people no readier than it
      did twenty years ago.
    choices:
      - label: "Withhold the tribute and raise the levies"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 500}
        outcome: >-
          You send no tribute, and the Turks send no army. The next years go in small campaigns,
          taking back fortress after fortress in Kartli. Georgia has stopped being a tributary,
          and the Turkish nomads have to go.
        deeds: {martial_bp: 1000}
      - label: "Pay once more, and train your army"
        wealth_bp: -800
        legitimacy_bp: -500
        outcome: >-
          The tribute goes east again, and your army grows a little. Your lords murmur that the
          king is too careful, and the Turks grow no weaker.
        deeds: {martial_bp: 500}
      - label: "Pay half, and build border forts"
        legitimacy_bp: 300
        wealth_bp: -500
        outcome: >-
          The sultan's collector takes half and grumbles, and the new forts rise along the
          passes. Your lords find the king neither brave nor cowardly, and wait to see which he
          will turn out to be.
        deeds: {martial_bp: 500, men: 2000}
    history: >-
      About 1099 David IV stopped paying tribute to the Seljuks and began to clear the Turks
      from Georgia, taking the fortresses of Kartli in the following years.
    sources: ["Kartlis Tskhovreba, History of the King of Kings David", "Rayfield, Edge of Empires (2012)"]

  - id: geo_gelati
    scenario: year_1000
    civ: georgia
    year: 1106
    title: "The Monastery at Gelati"
    place: "Gelati, near Kutaisi"
    speaker: scholar
    speaker_name: "Ioane Petritsi"
    speaker_title: "Philosopher, who studied in Constantinople"
    benchmark_provinces: 1
    story: >-
      You are David the Builder. The church council at Ruisi-Urbnisi three years ago set your
      bishops in order and made the church obey the king. Now you want a monument for the
      kingdom, and a school to match it.


      Your scholars say you should build a great monastery near Kutaisi, with an academy, and
      fill it with the scholars of the Greek and Georgian world. The cost would be huge, and the
      army still needs paying.
    choices:
      - label: "Found a great monastery at Gelati"
        historical: true
        knowledge_bp: 2500
        legitimacy_bp: 1500
        wealth_bp: -1500
        influence: {clergy: 1000}
        outcome: >-
          In 1106 you lay the first stones of the monastery at Gelati and give it lands, books
          and treasure. Its academy will draw scholars who translate the Greek philosophers into
          Georgian, and later Georgians will call it a second Athens. You are buried in its
          gate.
      - label: "Spend the money on the army first"
        wealth_bp: -500
        legitimacy_bp: 300
        unrest_bp: -300
        outcome: >-
          The soldiers are paid and the mountains are garrisoned. The school will have to wait
          for a quieter year, and the scholars go elsewhere.
        deeds: {martial_bp: 500}
      - label: "Send scholars to study abroad"
        knowledge_bp: 1500
        wealth_bp: -800
        legitimacy_bp: 300
        outcome: >-
          Young Georgians go to Constantinople, Antioch and the Georgian houses on Mount Athos and
          return with their learning in Greek. The kingdom has no school of its own to hold them.
    history: >-
      David IV founded the monastery of Gelati in 1106, with an academy that became a centre
      of Georgian learning; he is buried at its gate.
    sources: ["Kartlis Tskhovreba", "Rayfield, Edge of Empires (2012)"]

  - id: geo_kipchaks
    scenario: year_1000
    civ: georgia
    year: 1118
    title: "Soldiers from the Steppe"
    place: "Tbilisi road"
    speaker: general
    speaker_name: "Your marshal"
    speaker_title: "Of the army"
    benchmark_provinces: 1
    story: >-
      You are David. Georgia is free of tribute, but your armies are small, and the landowners
      who owe you service come home when the harvest is due. North of the Caucasus the Kipchak
      tribes are in trouble, and their chiefs have been pushed out of their pastures by war.
      They are fine horse-archers, and some of them are your kinsmen by marriage.


      Your marshal proposes to bring them over the mountains: give them land in return for
      soldiers who serve the king, and not the nobles.
    choices:
      - label: "Settle the Kipchaks on royal lands"
        historical: true
        legitimacy_bp: 1000
        influence: {nobility: -500}
        unrest_bp: 300
        outcome: >-
          Tens of thousands of Kipchak families come down from the steppe; the chronicler says
          forty thousand households, though that may be exaggerated. The men are given lands, fed,
          and trained, and they serve the king alone. You also form a royal guard, the
          Monaspa. For the first time since the Turks came, Georgia has an army that can meet the
          sultan's.
        deeds: {martial_bp: 2000, men: 5000}
      - label: "Rely on the nobles' levies"
        legitimacy_bp: 500
        influence: {nobility: 500}
        unrest_bp: -300
        outcome: >-
          The levies are loyal and untrained, and the nobles grow bolder. When the sultans come
          in force, the field will be harder.
        deeds: {martial_bp: 500}
      - label: "Hire Alan and Frankish mercenaries"
        wealth_bp: -1500
        legitimacy_bp: 300
        outcome: >-
          Alan horsemen and a few Frankish knights take the king's pay and serve well, while it
          lasts. The treasury cannot bear a larger army for long.
        deeds: {men: 3000, martial_bp: 500}
    history: >-
      About 1118 David IV settled many thousands of Kipchak families in Georgia in exchange for
      military service and built a standing army around them and the royal guard, the Monaspa.
    sources: ["Kartlis Tskhovreba, History of the King of Kings David", "Rayfield, Edge of Empires (2012)"]

  - id: geo_didgori
    scenario: year_1000
    civ: georgia
    year: 1121
    title: "Didgori and Tbilisi"
    place: "The Didgori hills"
    speaker: general
    speaker_name: "A Kipchak commander"
    speaker_title: "From the royal army"
    benchmark_provinces: 1
    story: >-
      You are David. The Muslim princes of the East have called a holy war against Georgia.
      Ilghazi, the lord of Mardin, leads their great host, and the sultan's emirs march with
      him. The Georgian chronicle gives their numbers as several times your own. You have some
      fifty thousand men, among them the Kipchaks, a few Frankish knights and Alans.


      You can wait behind walls and let the sultan come to you; offer battle on the open
      plains of Kartli, where your horsemen can ride; or meet him in the broken valleys at
      Didgori, where a large army cannot spread out, and attack from the hills.
    choices:
      - label: "Strike the host from the hills"
        historical: true
        legitimacy_bp: 3000
        influence: {nobility: 500}
        outcome: >-
          On 12 August 1121 your army charges down the hillside onto the Muslim camp before it
          can form up, and the host breaks. The Georgian chroniclers called it a miracle. In
          1122 Tbilisi, under Muslim rule for four centuries, opens its gates, and you make it
          your capital. You will take Ani in 1124 and die the following year, having made
          Georgia the greatest Christian power of the East.
        deeds: {martial_bp: 1500}
      - label: "Wait behind the walls of Kartli"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          The Muslim host plunders for a season and the Kipchaks, who are horsemen and not
          wall-keepers, grow restless. The lords of the east keep Tbilisi for now.
        deeds: {martial_bp: 300}
      - label: "Offer battle on the plains of Kartli"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          The great host overlaps your line, and the Kipchak horse cannot make up the difference.
          The day ends in a bloody withdrawal, and Tbilisi remains in Muslim hands.
        deeds: {martial_bp: 800}
    history: >-
      David IV beat the Muslim coalition at Didgori on 12 August 1121 and took Tbilisi in 1122,
      making it his capital; he took Ani in 1124 and died in 1125.
    sources: ["Kartlis Tskhovreba, History of the King of Kings David", "Rayfield, Edge of Empires (2012)"]
