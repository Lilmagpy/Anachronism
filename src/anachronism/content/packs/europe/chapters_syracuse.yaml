schema_version: 1
# Chronicle mode (D-120, D-175): Syracuse under Hiero II and Archimedes, to the Roman
# conquest, 263-212 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Polybius 1, 7 and 8, Livy 21-25, Diodorus 23,
# Plutarch's Marcellus, Athenaeus 5 (on the Syracusia), Vitruvius 9 (on the crown) and
# Archimedes' own Sand-Reckoner, with modern work by Lazenby, Eckstein and Netz.
# Syracuse is one province throughout.
chapters:
  - id: syr_switch
    scenario: punic_wars
    civ: syracuse
    year: -263
    title: "The Romans at the Gates"
    place: "Syracuse"
    speaker: rome
    speaker_name: "Manius Valerius"
    speaker_title: "Consul of Rome"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Hiero, King of Syracuse, a soldier the army made general and then king. Last
      year you and the Carthaginians besieged the Mamertines, Italian mercenaries who had
      seized Messana; the Romans crossed the strait to help them and beat you both. Now both
      consuls are marching on Syracuse with four legions, and the towns of eastern Sicily are
      opening their gates to them.


      The consul's envoys say Rome has no quarrel with you, only with Carthage.
    choices:
      - label: "Make peace and ally with Rome"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1500
        outcome: >-
          You pay a hundred talents, give back the prisoners, and keep your kingdom, now Rome's
          ally. For the rest of the war your granaries feed the Roman legions in Sicily, and
          you keep out of the fighting. You will keep Rome's friendship for the rest of your
          life, which will be very long.
        deeds: {peace_with: [rome], break_away: [carthage]}
      - label: "Stand by Carthage and hold out"
        wealth_bp: -500
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          The legions dig in around Syracuse. The Carthaginian fleet promises to come.
        deeds: {men: 6000, grudges: {rome: 2000}}
      - label: "Ask Rome for a truce, not an alliance"
        wealth_bp: -1000
        unrest_bp: 500
        legitimacy_bp: 1700
        outcome: >-
          You send envoys to the consul with a hundred talents and ask only for a truce. The consul is
          willing to listen and Carthage does not know how to read it; the legions remain on your
          frontier while the talks go on, and the citizens grumble at paying so much for so little.
        deeds: {peace_with: [rome]}
    history: >-
      In 263 BC Hiero II made peace with Rome, paying an indemnity, and remained Rome's loyal
      ally for nearly fifty years.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 1.16", "Diodorus 23.4", "Lazenby, The First Punic War (1996)"]

  - id: syr_grain_law
    scenario: punic_wars
    civ: syracuse
    year: -258
    title: "A Tenth of Every Harvest"
    place: "Syracuse"
    speaker: steward
    speaker_name: "Your treasurer"
    speaker_title: "Of the royal granaries"
    benchmark_provinces: 1
    story: >-
      Your kingdom is the grain basket of eastern Sicily. Farmers pay taxes in many ways and
      cheat in all of them. Your treasurer proposes one rule for everyone: every farmer
      declares his sown land and his harvest, and pays a tenth of it to the king's
      collectors, who bid for the right to collect it, with fixed penalties for fraud on both
      sides.
    choices:
      - label: "Make it the law"
        historical: true
        food_bp: 2000
        wealth_bp: 2000
        outcome: >-
          Hiero's law works so well that when the Romans take over Sicily they keep it, word
          for word, for centuries. Cicero will quote it in court against a corrupt Roman
          governor.
      - label: "Leave the old customs"
        wealth_bp: -300
        legitimacy_bp: 500
        outcome: >-
          The farmers are grateful. The granaries are emptier.
      - label: "Apply it to the great estates only"
        food_bp: 2000
        wealth_bp: 1800
        unrest_bp: 600
        legitimacy_bp: 400
        outcome: >-
          You tax the great estates by the new tenth and leave the small farmers to the old customs.
          The royal granaries and treasury fill, and the small farmers have no complaint; the great
          landowners complain loudly and some close their gates to your officers.
    history: >-
      Hiero's tithe law (lex Hieronica) regulated grain taxation in his kingdom and was kept
      by the Romans in their province of Sicily.
    sources: ["Cicero, Against Verres 2.3", "Diodorus 25.14"]

  - id: syr_crown
    scenario: punic_wars
    civ: syracuse
    year: -250
    title: "Eureka"
    place: "The palace"
    speaker: scholar
    speaker_name: "Archimedes"
    speaker_title: "Mathematician, your kinsman"
    benchmark_provinces: 1
    story: >-
      You gave a goldsmith a weight of gold to make a wreath for the gods. The wreath he
      delivered weighs the same, but you have heard that he kept some of the gold and mixed
      in silver. You cannot melt down a sacred offering to find out.


      You have asked your young kinsman Archimedes, the cleverest man in Syracuse, to find a
      way.
    choices:
      - label: "Ask Archimedes to find a way"
        historical: true
        knowledge_bp: 2500
        outcome: >-
          The story goes that he notices the water rise as he climbs into the bath, sees the
          answer - a wreath with silver in it would be bulkier, and push out more water than
          the same weight of gold - and runs home naked, shouting 'Eureka!': I have found it!
          The goldsmith is caught. Archimedes goes on to work out how bodies float, and why.
      - label: "Have the goldsmith questioned by force"
        unrest_bp: 300
        legitimacy_bp: 2400
        outcome: >-
          The goldsmith confesses under torture and is put to death, and the gods are honoured with a
          wreath of full weight. The court praises your swift justice; Archimedes is the only one who
          is not satisfied, and a few at court whisper about the confession.
      - label: "Order a new wreath from another smith"
        wealth_bp: -800
        legitimacy_bp: 200
        outcome: >-
          You pay a second goldsmith to make a new wreath, and give the first one back. It
          settles nothing, but the gods have been served, and your treasury is lighter.
    history: >-
      Vitruvius, two centuries later, tells the story of Archimedes and Hiero's crown; the
      principle of buoyancy is in Archimedes' own On Floating Bodies.
    sources: ["Vitruvius, On Architecture 9 preface 9-12", "Archimedes, On Floating Bodies", "Netz and Noel, The Archimedes Codex (2007)"]

  - id: syr_mercenaries
    scenario: punic_wars
    civ: syracuse
    year: -240
    title: "Help for an Old Enemy"
    place: "Syracuse"
    speaker: carthage
    speaker_name: "Envoys of Carthage"
    speaker_title: "From the besieged city"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      Carthage lost the war with Rome and could not pay its mercenaries, who have mutinied and
      raised the whole of Libya against it. Carthage is besieged in its own walls.


      Its envoys have come to you for grain. Your Roman friends would not mind seeing Carthage
      fall. You are not so sure that you want Rome to be the only great power left in the
      west.
    choices:
      - label: "Send them the grain they ask"
        historical: true
        food_bp: -2000
        legitimacy_bp: 500
        outcome: >-
          You send everything they ask for. Polybius will write that you understood that it
          is never wise to help any power grow so great that no one can stand against it.
          Carthage survives. So, for a while, does the balance.
      - label: "Let Carthage fend for itself"
        legitimacy_bp: -200
        food_bp: 1000
        outcome: >-
          Carthage survives without you, and remembers.
        deeds: {grudges: {carthage: 1500}}
      - label: "Sell them grain at a high price"
        wealth_bp: 1000
        food_bp: -1000
        deeds: {grudges: {carthage: 500}}
        outcome: >-
          You agree to ship grain to Carthage, but only for silver, and at the price of a
          besieged city. Carthage pays, and remembers the price.
    history: >-
      During the Mercenary War (241-237 BC) Hiero supplied Carthage, judging, says Polybius,
      that Rome should not become all-powerful.
    diverged: >-
      Carthage is gone.
    sources: ["Polybius 1.83"]

  - id: syr_ship
    scenario: punic_wars
    civ: syracuse
    year: -238
    title: "The Greatest Ship in the World"
    place: "The harbour of Syracuse"
    speaker: scholar
    speaker_name: "Archias of Corinth"
    speaker_title: "Shipwright"
    benchmark_provinces: 1
    story: >-
      You have had a ship built such as no one has seen: the Syracusia, with three decks,
      twenty banks of oars, a gymnasium, a garden of vines, a temple of Aphrodite with an
      agate floor, a library, a bath with bronze tubs, and eight towers with catapults that
      Archimedes designed. Archimedes launched her by himself, with a system of pulleys.


      She is too big for any harbour in Sicily but your own. Egypt has had a bad harvest.
    choices:
      - label: "Send her to Egypt laden with grain"
        historical: true
        food_bp: -1500
        legitimacy_bp: 2000
        outcome: >-
          The Syracusia sails to Alexandria with sixty thousand measures of grain, ten thousand
          jars of salted fish and twenty thousand talents of wool. Ptolemy renames her the
          'Alexandris', and she is laid up in Alexandria as a wonder, because no other port can
          take her. Archimedes' screw pumps out her bilge.
      - label: "Keep her as your flagship"
        wealth_bp: -600
        unrest_bp: 300
        legitimacy_bp: 1500
        outcome: >-
          The Syracusia rides at anchor in your harbour, the wonder of the Greek world, and visitors
          come from far to see her. Her upkeep is heavy, and the crews' pay and the dockyard bills are
          not popular.
      - label: "Build ten lesser warships instead"
        wealth_bp: -600
        legitimacy_bp: 300
        deeds: {ships: 10}
        outcome: >-
          You break up the plans for a second great ship and build ten smaller warships for
          your own harbour. They are less famous and more useful.
    history: >-
      Athenaeus describes the Syracusia, built for Hiero under Archias with Archimedes'
      help, and sent as a gift to Ptolemy of Egypt.
    sources: ["Athenaeus, Deipnosophists 5.206d-209e (from Moschion)"]

  - id: syr_victory
    scenario: punic_wars
    civ: syracuse
    year: -216
    title: "A Golden Victory for Rome"
    place: "Syracuse"
    speaker: steward
    speaker_name: "Your son Gelon"
    speaker_title: "Who thinks Rome is finished"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      Hannibal has destroyed Roman armies at the Trebia, at Lake Trasimene, and now at Cannae,
      where fifty thousand Romans died in an afternoon. Your son Gelon, and half of Syracuse,
      think Rome is finished and that it is time to go over to Carthage.


      You are ninety, and you have been Rome's friend for nearly fifty years.
    choices:
      - label: "Stand by Rome, as before"
        historical: true
        food_bp: -2000
        wealth_bp: -1500
        legitimacy_bp: 1000
        outcome: >-
          You send Rome a golden statue of Victory weighing three hundred and twenty pounds,
          three hundred thousand measures of wheat, and a thousand archers and slingers. The
          Senate puts the Victory in the temple of Jupiter on the Capitol. Gelon dies soon
          after. A year later, so do you.
      - label: "Open talks with Hannibal's agents"
        unrest_bp: 800
        wealth_bp: 500
        legitimacy_bp: -1000
        outcome: >-
          You open talks with Hannibal's agents. The Roman fleet off Lilybaeum is told.
        deeds: {men: 3000, grudges: {rome: 3000}}
      - label: "Send a small gift and keep neutral"
        food_bp: -800
        wealth_bp: -500
        legitimacy_bp: 500
        outcome: >-
          You send Rome a modest gift of grain and the regrets of an old friend, and tell both sides
          that Syracuse will stand apart. Rome notes the size of the gift.
    history: >-
      After Trasimene and Cannae, Hiero sent Rome a gold Victory, grain and troops; his son
      Gelon favoured Carthage. Hiero died in 215 BC.
    diverged: >-
      Rome is gone.
    sources: ["Livy 22.37, 23.30", "Polybius 7.8"]

  - id: syr_hieronymus
    scenario: punic_wars
    civ: syracuse
    year: -215
    title: "The Boy King"
    place: "Syracuse"
    speaker: carthage
    speaker_name: "Hippocrates and Epicydes"
    speaker_title: "Hannibal's agents, Syracusans by descent"
    needs_alive: [carthage]
    benchmark_provinces: 1
    story: >-
      You are Hieronymus, Hiero's grandson, fifteen years old and king. You wear a diadem
      and purple, and ride in a chariot drawn by white horses, as your grandfather never did.


      Hannibal has sent two brothers, Hippocrates and Epicydes, born in Carthage of a
      Syracusan family. They say Carthage will give you half of Sicily if you change sides,
      and then, when you ask for more, all of it.
    choices:
      - label: "Take the Carthaginian offer"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          You make the treaty. Thirteen months into your reign, at Leontini, conspirators
          stab you to death in a narrow street. Syracuse becomes a republic again, and murders
          your whole family. Hippocrates and Epicydes win the city over, and the Romans come.
        deeds: {grudges: {rome: 2000}}
      - label: "Keep your grandfather's alliance"
        unrest_bp: -300
        legitimacy_bp: 500
        outcome: >-
          You send Hannibal's agents home. Rome sends you its thanks, and a garrison.
      - label: "Treat with both, and join neither"
        wealth_bp: 500
        unrest_bp: 500
        legitimacy_bp: -200
        outcome: >-
          You receive the envoys of both sides, and promise each of them an answer in good
          time. For a while they pay court to you, and neither is pleased.
    history: >-
      Hieronymus allied with Carthage in 215-214 BC and was assassinated at Leontini; Syracuse
      fell under Hippocrates and Epicydes and broke with Rome.
    diverged: >-
      Carthage is gone.
    sources: ["Polybius 7.2-7", "Livy 24.4-7"]

  - id: syr_claws
    scenario: punic_wars
    civ: syracuse
    year: -213
    title: "The Claws of Archimedes"
    place: "The sea walls of Syracuse"
    speaker: scholar
    speaker_name: "Archimedes"
    speaker_title: "Seventy-five, still working"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      You are Epicydes, general of Syracuse. Marcellus, the Roman 'sword of Rome', has
      brought sixty quinqueremes against the sea wall, some lashed together in pairs with
      great scaling ladders, 'sambucas', on their bows. His army is attacking from the land.


      Old Archimedes has spent years building machines for Hiero, who never had to use them; your captains do not agree on whether they will work.
    choices:
      - label: "Give Archimedes charge of the walls"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Catapults of every range hit the Roman ships as they come in. Cranes swing out over
          the walls and drop stones and lead on the sambucas. Iron claws grab the bows of the
          ships, lift them up and drop them, so they capsize. The Romans are so frightened that
          if they see a rope or a beam over the wall they run, shouting that Archimedes is
          aiming something at them. Marcellus gives up the assault, and settles down to a
          blockade.
        deeds: {martial_bp: 1500}
      - label: "Trust to the walls and the soldiers"
        deeds: {men: 4000}
        legitimacy_bp: 300
        unrest_bp: 1000
        outcome: >-
          The sambucas reach the walls, and the fighting is hand to hand.
      - label: "Raid the Roman camp by night"
        wealth_bp: 300
        unrest_bp: 300
        legitimacy_bp: 2200
        outcome: >-
          You send picked men out of the gate in the dark to burn the Roman siege-works. They burn two
          engines, bring home captured arms, and are driven back by dawn. The city cheers its raiders;
          the Romans double their guard.
        deeds: {martial_bp: 300}
    history: >-
      Archimedes' machines defeated Marcellus's assault on Syracuse in 213 BC; the siege
      became a blockade. The 'burning mirrors' are a much later story.
    diverged: >-
      Rome is gone.
    sources: ["Polybius 8.3-7", "Plutarch, Marcellus 14-17", "Livy 24.34"]

  - id: syr_circles
    scenario: punic_wars
    civ: syracuse
    year: -212
    title: "Do Not Disturb My Circles"
    place: "Syracuse"
    speaker: scholar
    speaker_name: "Archimedes"
    speaker_title: "At his drawings"
    needs_alive: [rome]
    benchmark_provinces: 1
    story: >-
      It is the festival of Artemis, and the city is drinking. A deserter has told Marcellus
      that one stretch of the wall at Epipolae is low and lightly held. Your scouts say
      Roman ladders have been seen in the dark.


      Archimedes is at home, drawing figures in the sand. He will not stop.
    choices:
      - label: "Go to the walls yourself"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2500
        outcome: >-
          By morning the Romans are on Epipolae. You slip away to Agrigentum. The rest of the
          city falls by treachery months later and is sacked. A Roman soldier finds
          Archimedes still drawing; he tells the man not to disturb his circles, and is killed.
          Marcellus, who had ordered him spared, gives him a burial. On his tomb, as he asked,
          is a sphere inside a cylinder. The treasures of Syracuse go to Rome, and Romans
          start to take an interest in Greek art.
        deeds: {ruler_falls: "flees to Agrigentum"}
      - label: "Cancel the festival"
        legitimacy_bp: -500
        outcome: >-
          The citizens grumble and go sober to the walls. The Roman ladders are seen in time.
      - label: "Post a strong guard at Epipolae"
        legitimacy_bp: 300
        unrest_bp: 300
        deeds: {men: 2000}
        outcome: >-
          You send the best of your men to the low stretch of wall at Epipolae and keep the
          festival going elsewhere. The guard is strong, and the night is long.
    history: >-
      Marcellus took Syracuse in 212 BC after surprising the Epipolae wall during a festival;
      Archimedes was killed in the sack. Cicero found his tomb in 75 BC.
    diverged: >-
      Rome is gone.
    sources: ["Livy 25.23-31", "Plutarch, Marcellus 18-19", "Cicero, Tusculan Disputations 5.64-66"]
