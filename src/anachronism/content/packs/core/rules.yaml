schema_version: 1
# Every tunable number the engine uses (documented in content/schema/rules.py).
# Flows are per decade (reference_years) and scaled to each scenario's turn length.
# Rates are basis points: 10000 = 100%, and 100 = one point on a 0-100 stat.
rules:
  reference_years: 10
  stacking_decay_bp: 8000
  economy:
    workforce_per_1000_bp: 10000
    surplus_share_bp: 2000
    diversion_floor_bp: 3000
    food_consumption_per_1000_bp: 10000
    granary_per_1000_bp: 20000
    spoilage_bp: 1000
    wealth_per_1000_bp: 3000
    admin_upkeep_per_province: 3
    knowledge_per_1000_bp: 500
    knowledge_per_1000_literate_bp: 30000
    base_trade_bp: 1000
    coastal_trade_bp: 1500
    river_trade_bp: 1000
    resource_materials_accessible: 6
    resource_materials_limited: 3
  projects:
    labour: [6, 18, 36, 60, 90]
    materials: [4, 8, 12, 16, 20]
    knowledge: [5, 10, 15, 20, 25]
    wealth: [3, 6, 9, 12, 15]
    heavy_categories: [metallurgy, construction, military]
    heavy_materials_bp: 20000
    duration_decades: [1, 2, 3, 4, 6]
    anachronism_bp_per_century: 500
    anachronism_cap_bp: 5000
    setback_chance_bp: 500
