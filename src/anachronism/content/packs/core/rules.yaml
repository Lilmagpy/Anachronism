    unrest_from_strain_bp: 4000
    unrest_from_famine_bp: 6000
    unrest_recovery_bp: 1500
    unrest_recovery_legitimacy_bp: 400
    labour_penalty_at_full_unrest_bp: 5000
    literacy_attrition_bp: 500
    resistance_unrest_bp: 300
    legitimacy_baseline_bp: 5000
