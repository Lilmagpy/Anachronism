schema_version: 1
# Chance events (content/schema/happenings.py). chance_bp is per decade per state;
# changes are in basis points (population/stores: shares; unrest/legitimacy: points x100).
happenings:
  - id: plague
    name: Plague
    kind: disaster
    message: "Plague sweeps through {province}. The dead are carried out by cartloads."
    chance_bp: 700
    population_bp: -1200
    unrest_bp: 400
    softened_by: health

  - id: flood
    name: Great flood
    kind: disaster
    message: "The river bursts its banks in {province}; fields and granaries are drowned."
    chance_bp: 900
    river: true
    population_bp: -200
    food_bp: -2500
    unrest_bp: 200
    softened_by: storage

  - id: drought
    name: Drought
    kind: disaster
    message: "No rain falls on {province}. The wells run dry and the crops wither."
    chance_bp: 700
    terrain: [plains, steppe, desert, hills]
    food_bp: -2500
    unrest_bp: 300
    softened_by: storage

  - id: locusts
    name: Locusts
    kind: disaster
    message: "A cloud of locusts darkens the sky over {province} and strips the fields bare."
    chance_bp: 500
    terrain: [plains, river_plains, steppe]
    food_bp: -2000
    unrest_bp: 200

  - id: earthquake
    name: Earthquake
    kind: disaster
    message: "The earth shakes in {province}; walls and houses fall."
    chance_bp: 300
    terrain: [mountains, hills]
    population_bp: -200
    materials_bp: -2000
    legitimacy_bp: -200

  - id: fire
    name: Great fire
    kind: disaster
    message: "A great fire rages through {province} for three days."
    chance_bp: 300
    wealth_bp: -1500
    materials_bp: -1000
    unrest_bp: 100

  - id: bandits
    name: Bandits
    kind: disaster
    message: "Bandits hold the roads of {province}; merchants dare not travel."
    chance_bp: 500
    terrain: [hills, forest, mountains, marsh]
    wealth_bp: -1000
    unrest_bp: 300

  - id: storm
    name: Great storm
    kind: disaster
    message: "A storm from the sea wrecks boats and harbours in {province}."
    chance_bp: 500
    coastal: true
    wealth_bp: -800
    food_bp: -800

  - id: bumper_harvest
    name: Bumper harvest
    kind: blessing
    message: "The harvest in {province} is the best in living memory."
    chance_bp: 800
    food_bp: 2500
    legitimacy_bp: 200

  - id: silver_strike
    name: Silver strike
    kind: blessing
    message: "Prospectors strike a rich vein of silver in {province}!"
    chance_bp: 300
    terrain: [hills, mountains]
    needs_adopted: [ore_prospecting]
    wealth_bp: 3000

  - id: wandering_sage
    name: A wandering sage
    kind: blessing
    message: "A famous sage arrives in {province} and gathers students around him."
    chance_bp: 500
    needs_adopted: [writing]
    knowledge_bp: 2500

  - id: good_omen
    name: A good omen
    kind: blessing
    message: "A comet blazes over {province}; the diviners declare it a sign of Heaven's favour."
    chance_bp: 400
    legitimacy_bp: 400
    unrest_bp: -300

  # --- Consequences: second-order effects of advancements (brief §6.7) ---------------------
  # Things the ruler did not plan for. kind: consequence needs the advancement it follows.

  - id: pamphlet_wars
    name: Pamphlet wars
    kind: consequence
    message: "Printed pamphlets mocking the priests pass from hand to hand in {province}. The temples are furious."
    chance_bp: 900
    needs_adopted: [printing_press]
    unrest_bp: 500
    influence: {clergy: -800, guilds: 300}

  - id: scripture_for_all
    name: Scripture for all
    kind: consequence
    message: "Cheap printed scriptures reach the villages of {province}. Every farmer now argues theology."
    chance_bp: 600
    needs_adopted: [printing_press]
    knowledge_bp: 500
    influence: {clergy: -500}
    unrest_bp: 300

  - id: gunpowder_levels_knights
    name: The end of the knights
    kind: consequence
    message: "A peasant with a handgun shot a lord off his horse in {province}. The nobles feel the ground shift."
    chance_bp: 700
    needs_adopted: [gunpowder]
    influence: {nobility: -900}
    legitimacy_bp: -300

  - id: paper_money_inflation
    name: Inflation
    kind: consequence
    message: "The mints print too freely: prices in {province} double in a season, and savings melt away."
    chance_bp: 800
    needs_adopted: [paper_money]
    wealth_bp: -2000
    unrest_bp: 600

  - id: clock_discipline
    name: The tyranny of the clock
    kind: consequence
    message: "Workshops in {province} now ring a bell for every hour. Work is steadier; the workers grumble."
    chance_bp: 500
    needs_adopted: [mechanical_clock]
    materials_bp: 1000
    unrest_bp: 200
    influence: {guilds: 400}

  - id: telescope_heresy
    name: The heavens are wrong
    kind: consequence
    message: "Astronomers in {province} say the heavens are not as the priests taught. Sermons answer them."
    chance_bp: 600
    needs_adopted: [telescope]
    influence: {clergy: -600}
    suspicion_bp: 500
    knowledge_bp: 800

  - id: newspapers_opinion
    name: Public opinion
    kind: consequence
    message: "The newspapers of {province} criticise the court. A ruler must now win arguments, not just battles."
    chance_bp: 700
    needs_adopted: [newspapers]
    legitimacy_bp: -400
    influence: {guilds: 500, nobility: -300}

  - id: schools_restless_youth
    name: Restless scholars
    kind: consequence
    message: "Students of {province} who learned to read have read things the court would rather they had not."
    chance_bp: 500
    needs_adopted: [universities]
    knowledge_bp: 1000
    unrest_bp: 400

  - id: steam_unemployment
    name: Machine breakers
    kind: consequence
    message: "Hand weavers in {province}, put out of work by machines, smash the new engines by night."
    chance_bp: 800
    needs_adopted: [spinning_machine]
    unrest_bp: 700
    materials_bp: -800
    influence: {guilds: -700}

  - id: railway_boom
    name: Railway fever
    kind: consequence
    message: "Everyone in {province} wants shares in the new railways. Fortunes are made, and some are lost."
    chance_bp: 600
    needs_adopted: [railways]
    wealth_bp: 1500
    influence: {guilds: 500}

  - id: quarantine_trade_loss
    name: Ships held at the harbour
    kind: consequence
    message: "Quarantine keeps the merchant ships of {province} waiting forty days. The merchants count their losses."
    chance_bp: 600
    coastal: true
    needs_adopted: [quarantine]
    wealth_bp: -800
    influence: {guilds: -300}

  - id: vaccination_fear
    name: Fear of the needle
    kind: consequence
    message: "Rumours in {province} say the cowpox cure turns children into cattle. Mothers hide from the doctors."
    chance_bp: 700
    needs_adopted: [vaccination]
    unrest_bp: 400
    suspicion_bp: 600

  - id: compass_adventurers
    name: Adventurers sail
    kind: consequence
    message: "With the compass, captains from {province} sail beyond sight of land - and some come back rich."
    chance_bp: 500
    coastal: true
    needs_adopted: [compass]
    wealth_bp: 1200

  - id: written_law_lawyers
    name: Lawyers
    kind: consequence
    message: "Now that the laws are written down, clever men in {province} argue about every word of them."
    chance_bp: 400
    needs_adopted: [written_law]
    legitimacy_bp: 300
    influence: {nobility: -300, guilds: 300}
