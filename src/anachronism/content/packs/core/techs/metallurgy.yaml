schema_version: 1
techs:
  - id: copper_smelting
    name: Copper smelting
    keywords: [copper, smelting, smelt]
    category: metallurgy
    year: -5000
    complexity: 1
    requires: {materials: [copper]}
    effects: [{type: materials_output, bp: 500}]
    flavour: Green stone in the fire, red metal in the ashes.
    history: "Copper was first smelted from ore around 5000 BC, at sites such as Belovode in Serbia and in Iran."

  - id: bronze_working
    name: Bronze working
    keywords: [bronze, tin, alloy, casting]
    category: metallurgy
    year: -3300
    complexity: 2
    prerequisites: [copper_smelting]
    requires: {materials: [copper, tin]}
    effects: [{type: materials_output, bp: 600}, {type: military_strength, bp: 800}]
    flavour: A little tin makes copper hard enough to hold an edge.
    history: "Bronze - copper hardened with tin - spread across the Near East from about 3300 BC, giving the Bronze Age its name."

  - id: ore_prospecting
    name: Ore prospecting
    keywords: [prospecting, ore, mining, mines, surveying ore, geology, gold, silver, gold mining, silver mines]
    category: metallurgy
    year: -2000
    complexity: 2
    visibility: 1
    prerequisites: [copper_smelting]
    effects: [{type: unlocks_resource, target: iron}]
    flavour: Rust-red streams and bitter springs point to iron below.
    history: "Miners of the Bronze Age learned to read the land for ore - coloured stains, bitter springs, telltale plants."

  - id: iron_working
    name: Iron working
    keywords: [iron, ironworking, smithing, blacksmith, forge]
    category: metallurgy
    year: -1200
    complexity: 3
    prerequisites: [bronze_working, charcoal_burning]
    requires: {materials: [iron]}
    effects: [{type: materials_output, bp: 800}, {type: military_strength, bp: 1000}]
    flavour: Hammered, folded, quenched. The bloom becomes a blade.
    history: "The Hittites worked iron before 1200 BC; after the Bronze Age collapse it spread across the Mediterranean and beyond."

  - id: coal_mining
    name: Coal mining
    keywords: [coal, coal mining, collieries, fossil fuel]
    category: metallurgy
    year: -300
    complexity: 2
    prerequisites: [ore_prospecting]
    effects: [{type: unlocks_resource, target: coal}, {type: materials_output, bp: 300}]
    flavour: Black stone that burns hotter and longer than wood.
    history: "Coal was burned for metalworking in China by 300 BC; England's coal trade began in the 13th century."

  - id: blast_furnace
    name: Blast furnace
    keywords: [blast furnace, cast iron, furnace, pig iron]
    category: metallurgy
    year: -400
    complexity: 4
    prerequisites: [iron_working, piston_bellows]
    requires: {materials: [iron], widespread: [charcoal_burning], buildings: [forge]}
    effects: [{type: materials_output, bp: 1500}, {type: military_strength, bp: 600}]
    flavour: Iron poured like water instead of beaten like dough.
    history: "Chinese foundries poured cast iron from blast furnaces by the 5th century BC; Europe had them only around AD 1150."

  - id: crucible_steel
    name: Crucible steel
    keywords: [steel, crucible steel, damascus, hardened steel, swords, sword, blades, better swords, sharper blades]
    category: metallurgy
    year: -300
    complexity: 4
    prerequisites: [iron_working, pottery_kiln]
    requires: {materials: [iron], buildings: [forge]}
    effects: [{type: military_strength, bp: 1200}, {type: materials_output, bp: 500}]
    flavour: Sealed in clay and fired for days, the steel comes out patterned like water.
    history: "Wootz steel, made in sealed crucibles, was produced in southern India by about 300 BC and sold to Rome and Persia."
