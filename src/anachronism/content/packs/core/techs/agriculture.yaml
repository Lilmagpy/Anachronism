schema_version: 1
# year = approximate first historical appearance anywhere (placeholder values pending the
# Phase 5 source review, see DECISIONS D-040). complexity 1-5 drives cost and duration.
techs:
  - id: agriculture
    name: Agriculture
    keywords: [farming, farms, crops, planting, sowing, seeds, harvest, grain]
    category: agriculture
    year: -9500
    complexity: 1
    visibility: 1
    effects: [{type: food_output, bp: 1000}]
    flavour: Seed saved is a harvest promised.
    history: "First in the Fertile Crescent, around 9500 BC: wheat, barley and lentils sown by villagers along the Levant and upper Euphrates."

  - id: irrigation
    name: Irrigation canals
    keywords: [irrigate, irrigation, canals, ditches, watering, river water, river, rivers, floodwater, channels, dykes, rice paddies, paddy, paddies]
    category: agriculture
    year: -6000
    complexity: 2
    prerequisites: [agriculture]
    effects: [{type: food_output, bp: 1000}, {type: population_cap, bp: 500}]
    flavour: The river is taught to walk into the fields.
    history: "In Mesopotamia by about 6000 BC, farmers led the Tigris and Euphrates into their fields through dug channels."

  - id: ox_plough
    name: Ox-drawn plough
    keywords: [plough, plow, oxen, ox, tilling, furrows]
    category: agriculture
    year: -4000
    complexity: 2
    prerequisites: [agriculture]
    effects: [{type: food_output, bp: 800}, {type: labour_output, bp: 400}]
    flavour: One ox does the digging of ten men.
    history: "Ox-drawn ploughs were turning the soil of Mesopotamia by about 4000 BC."

  - id: iron_plough
    name: Iron-tipped plough
    keywords: [iron plough, iron plow, ploughshare, mouldboard]
    category: agriculture
    year: -500
    complexity: 2
    prerequisites: [ox_plough, iron_working]
    requires: {materials: [iron]}
    effects: [{type: food_output, bp: 1000}, {type: labour_output, bp: 500}]
    flavour: An iron share bites where wood only scratches.
    history: "Iron ploughshares were common in China and the Mediterranean by about 500 BC."

  - id: heavy_plough
    name: Heavy mouldboard plough
    keywords: [heavy plough, wheeled plough, clay soil, mouldboard plough]
    category: agriculture
    year: 600
    complexity: 3
    prerequisites: [iron_plough]
    requires: {materials: [iron]}
    effects: [{type: food_output, bp: 1200}]
    flavour: It turns the heavy wet soils nobody could farm before.
    history: "The heavy wheeled mouldboard plough opened the wet clay soils of northern Europe from about AD 600."

  - id: horse_collar
    name: Horse collar
    keywords: [horse collar, harness, draught horse, padded collar]
    category: agriculture
    year: 500
    complexity: 2
    prerequisites: [ox_plough, horse_riding]
    requires: {materials: [horses]}
    effects: [{type: labour_output, bp: 600}, {type: food_output, bp: 600}, {type: mobility, bp: 500}]
    flavour: A padded collar, and suddenly the horse can pull without choking.
    history: "The padded horse collar was developed in China by the 5th century AD and reached Europe around AD 900."

  - id: crop_rotation
    name: Three-field crop rotation
    keywords: [crop rotation, rotate crops, fallow, three field, legumes, clover, rotation]
    category: agriculture
    year: 800
    complexity: 2
    visibility: 1
    prerequisites: [ox_plough]
    effects: [{type: food_output, bp: 1200}, {type: population_cap, bp: 600}]
    flavour: Beans one year, grain the next, rest the third. The soil remembers.
    history: "Three-field rotation spread across Frankish Europe from about AD 800."
