schema_version: 1
# Ideas from after Rome: what a player is most likely to bring back. Each is measured against
# the nearest thing Rome had (see agriculture.yaml for the dating rule: where Rome never had
# it, year = when it reached Europe).
techs:
  - id: eyeglasses
    name: Eyeglasses
    keywords: [eyeglasses, spectacles, glasses, lenses for eyes, reading glasses]
    category: craft
    year: 1286
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}, {type: literacy_growth, bp: 20}]
    flavour: "Old senators read again; old craftsmen see their work."
    history: "Nero watched the games through an emerald (Pliny NH 37.64) and Seneca knew a glass globe of water makes letters large (Seneca, NQ 1.6.5), but no Roman ground a lens for the eye. Eyeglasses were invented in Pisa about 1286."
    sources: ["Pliny NH 37.64 # unverified", "Seneca, Naturales quaestiones 1.6.5 # unverified"]
    confidence: medium

  - id: glassmaking
    name: Blown glass
    keywords: [glass, glassmaking, glassblowing, clear glass, windows, glass vessels, vitrum]
    category: craft
    year: -50
    complexity: 2
    prerequisites: [pottery_kiln]
    requires: {materials: [clay]}
    effects: [{type: wealth_output, bp: 400}, {type: health, bp: 200}]
    flavour: "Sand and natron made into something you can see through."
    history: "Glassblowing was invented on the Syrian coast about 50 BC and glass vessels, once a luxury, were soon cheaper than bronze cups at Rome (Strabo 16.2.25); Pliny tells the story of glass and its workshops (Pliny NH 36.190-199). Window glass came with the Empire."
    sources: ["Strabo 16.2.25 # unverified", "Pliny NH 36.190-199 # unverified"]
    confidence: medium

  - id: lenses
    name: Ground lenses
    keywords: [lens, lenses, magnifying glass, ground glass, optics, burning glass]
    category: knowledge
    year: 1021
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}]
    flavour: "A curved glass that makes the small large."
    history: "Romans lit altar fires with a burning glass (Pliny NH 37.28) and knew that water in a glass magnifies (Seneca, NQ 1.6.5), but the science of lenses waited for Ibn al-Haytham's Optics, about 1021."
    sources: ["Pliny NH 37.28 # unverified", "Seneca, Naturales quaestiones 1.6.5 # unverified"]
    confidence: medium

  - id: telescope
    name: Telescope
    keywords: [telescope, spyglass, looking glass, see far]
    category: knowledge
    year: 1608
    complexity: 3
    prerequisites: [lenses, astronomy_calendar]
    effects: [{type: knowledge_gain, bp: 800}, {type: naval_strength, bp: 500}]
    flavour: "The moon has mountains, and the enemy's sails are seen an hour sooner."
    history: "Roman lookouts on the Capitol and Rome's watchtowers saw with the naked eye alone. Hans Lipperhey applied for a patent on the telescope in 1608; Galileo turned one on the heavens in 1609."
    sources: ["Lipperhey's patent application, 1608 (modern accounts) # unverified"]
    confidence: high

  - id: microscope
    name: Microscope
    keywords: [microscope, tiny creatures, small life, animalcules]
    category: health
    year: 1670
    complexity: 3
    prerequisites: [lenses]
    effects: [{type: knowledge_gain, bp: 600}, {type: health, bp: 400}]
    flavour: "A drop of pond water holds a city of tiny beasts."
    history: "Varro guessed that marshes breed 'minute creatures, invisible to the eye' that enter by mouth and nose and cause disease (Varro RR 1.12.2): a guess without a glass. Leeuwenhoek saw them in 1676."
    sources: ["Varro, De re rustica 1.12.2 # unverified"]
    confidence: high

  - id: germ_theory
    name: Germ theory
    keywords: [germs, germ theory, disease is caused by, invisible creatures cause disease, contagion, wash hands]
    category: health
    year: 1860
    complexity: 4
    prerequisites: [microscope, quarantine]
    requires: {literacy_bp: 2000}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: health, bp: 1500}, {type: population_cap, bp: 600}]
    flavour: "Sickness is not a curse or a bad air. It is alive, and it can be killed."
    history: "Varro's invisible marsh creatures (Varro RR 1.12.2) and Vitruvius' care to site a city away from marshes (Vitr. 1.4.1) were as near as Rome came. Pasteur showed microbes cause disease in the 1860s; Koch proved it germ by germ."
    sources: ["Varro, De re rustica 1.12.2 # unverified", "Vitruvius 1.4.1 # unverified"]
    confidence: high

  - id: vaccination
    name: Vaccination
    keywords: [vaccine, vaccination, cowpox, jenner, immunise]
    category: health
    year: 1796
    complexity: 3
    prerequisites: [inoculation]
    effects: [{type: health, bp: 1200}]
    resistance: [{group: clergy, level: 1}]
    flavour: "The milkmaids never caught smallpox. Now no one has to."
    history: "Rome's answer to pestilence was the Sibylline Books and a temple to Apollo the Healer (Livy 4.25.3, 433 BC). Edward Jenner vaccinated a boy with cowpox in 1796."
    sources: ["Livy 4.25.3 # unverified"]
    confidence: high

  - id: soap
    name: Soap
    keywords: [soap, washing, lye, cleanliness, sapo]
    category: health
    year: 77
    complexity: 1
    prerequisites: [pottery_kiln]
    effects: [{type: health, bp: 400}]
    flavour: "Fat, ash and water - and fewer fevers."
    history: "Romans cleaned themselves with oil and a scraper (strigil) at the baths; soap (sapo) of tallow and ash was a Gallic invention, which Pliny says men used to redden their hair (Pliny NH 28.191, AD 77). Babylon had made soap by 2800 BC."
    sources: ["Pliny NH 28.191 # unverified"]
    confidence: medium

  - id: distillation
    name: Distillation
    keywords: [distillation, distil, still, spirits, alcohol, alembic]
    category: craft
    year: 800
    complexity: 2
    prerequisites: [alchemy]
    effects: [{type: wealth_output, bp: 400}, {type: health, bp: 300}]
    flavour: "Wine boiled, its spirit caught - for medicine, and for merriment."
    history: "Dioscorides caught the vapour of boiling pitch on fleeces to make pitch-oil (Dioscorides 1.72) and the alchemists of Alexandria built the first stills in the 1st-3rd centuries AD; strong spirits came with the Arab chemists about AD 800."
    sources: ["Dioscorides, De materia medica 1.72 # unverified"]
    confidence: medium

  - id: mechanical_clock
    name: Mechanical clock
    keywords: [clock, mechanical clock, escapement, timekeeping, hours, bell tower]
    category: craft
    year: 1280
    complexity: 3
    prerequisites: [wheel, iron_working, astronomy_calendar]
    effects: [{type: labour_output, bp: 500}, {type: knowledge_gain, bp: 400}]
    flavour: "The bell in the tower tells the whole town when to work and when to pray."
    history: "Rome told the hour by sundials and water clocks (Pliny NH 7.212-215), whose hours lengthened in summer and shrank in winter. Weight-driven clocks with an escapement appeared in European church towers about 1280."
    sources: ["Pliny NH 7.212-215 # unverified"]
    confidence: high

  - id: printing_press
    name: Printing press
    keywords: [printing press, gutenberg, press, printed books, mass printing, books for everyone]
    category: knowledge
    year: 1450
    complexity: 4
    prerequisites: [movable_type, paper]
    requires: {literacy_bp: 500, buildings: [workshop]}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: literacy_growth, bp: 100}, {type: knowledge_gain, bp: 1500}, {type: cultural_influence, bp: 1000}]
    flavour: "A screw press, metal type and oily ink - a thousand pages a day."
    history: "Rome had the screw press for wine and oil (Pliny NH 18.317) and book-copying workshops of slaves (Nepos, Atticus 13.3); nobody married the two. Gutenberg did, at Mainz about 1450."
    sources: ["Pliny NH 18.317 # unverified", "Cornelius Nepos, Atticus 13.3 # unverified"]
    confidence: high

  - id: newspapers
    name: Newspapers
    keywords: [newspaper, news sheets, gazette, broadsheet, journalism, acta diurna, daily news]
    category: knowledge
    year: 1605
    complexity: 2
    prerequisites: [printing_press, postal_relay]
    resistance: [{group: nobility, level: 1}]
    effects: [{type: information_speed, bp: 1500}, {type: literacy_growth, bp: 50}, {type: unrest, bp: 100}]
    flavour: "Everyone knows everything by the Ides - including what the Senate would rather hide."
    history: "Caesar's acta diurna (59 BC) posted the day's business of Senate and people in the Forum and were copied for the provinces (Suet. Iul. 20.1): a gazette by hand. The first printed newspaper, the Relation, appeared in Strasbourg in 1605."
    sources: ["Suetonius, Iulius 20.1"]
    confidence: high

  - id: scientific_method
    name: The scientific method
    keywords: [scientific method, experiment, hypothesis, test ideas, evidence, science, natural philosophy]
    category: knowledge
    year: 1620
    complexity: 3
    prerequisites: [writing, place_value_numerals, schools]
    requires: {literacy_bp: 1000}
    resistance: [{group: clergy, level: 2}]
    effects: [{type: knowledge_gain, bp: 2000}]
    flavour: "Do not argue about how many teeth a horse has. Open its mouth and count."
    history: "Lucretius taught Romans that nature works by atoms and law, not gods (Lucretius 1.146-158), and Pliny gathered twenty thousand facts without testing one (Pliny NH praef. 17). Francis Bacon's Novum Organum (1620) set out reasoning from careful experiment."
    sources: ["Lucretius 1.146-158 # unverified", "Pliny NH praefatio 17 # unverified"]
    confidence: high

  - id: universities
    name: Universities
    keywords: [university, universities, college, academy of scholars, higher learning, athenaeum]
    category: knowledge
    year: 1088
    complexity: 3
    prerequisites: [schools, writing]
    requires: {buildings: [school]}
    effects: [{type: knowledge_gain, bp: 1000}, {type: literacy_growth, bp: 50}, {type: cultural_influence, bp: 500}]
    flavour: "Scholars gather where there are books and freedom to argue."
    history: "Young Romans of means finished their studies at Athens and Rhodes (Cicero, Brutus 315); Hadrian's Athenaeum at Rome (AD 135; Aurelius Victor, Caes. 14.3) was a hall for lectures, not a corporation of scholars. Bologna's university dates from 1088."
    sources: ["Cicero, Brutus 315 # unverified", "Aurelius Victor, De Caesaribus 14.3 # unverified"]
    confidence: medium

  - id: algebra
    name: Algebra
    keywords: [algebra, equations, unknowns, al-jabr, mathematics]
    category: knowledge
    year: 820
    complexity: 3
    prerequisites: [place_value_numerals]
    effects: [{type: knowledge_gain, bp: 800}, {type: wealth_output, bp: 300}]
    flavour: "Name the unknown x, and it gives itself up."
    history: "Roman mathematics was the surveyor's and the architect's geometry (Vitruvius 9 praef. 6-8 tells the problems of Plato and Pythagoras); Diophantus of Alexandria wrote the first book of equations about AD 250. Al-Khwarizmi named algebra in Baghdad about 820."
    sources: ["Vitruvius 9 praef. 6-8 # unverified"]
    confidence: medium

  - id: double_entry
    name: Double-entry bookkeeping
    keywords: [double entry, double-entry, debits and credits, balance sheet, pacioli]
    category: trade
    year: 1300
    complexity: 2
    prerequisites: [bookkeeping]
    effects: [{type: wealth_output, bp: 800}, {type: trade_income, bp: 500}]
    flavour: "Every coin is written twice, and the books always balance - or someone is stealing."
    history: "Roman ledgers listed receipts and payments side by side (Cicero, Pro Roscio Comoedo 4-9) but never made them balance each other. Double-entry books were kept by Italian merchants by 1300; Pacioli described the method in 1494."
    sources: ["Cicero, Pro Roscio Comoedo 4-9 # unverified"]
    confidence: high

  - id: banking
    name: Bankers and bills of exchange (argentarii)
    keywords: [bank, banking, bills of exchange, credit, loans, letters of credit, interest, argentarii, bankers, moneylenders, permutatio]
    category: trade
    year: -269
    complexity: 3
    prerequisites: [coinage, bookkeeping]
    requires: {buildings: [market]}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: trade_income, bp: 1200}, {type: wealth_output, bp: 600}]
    flavour: "Gold stays safe at home; a letter travels instead."
    history: "Bankers' shops (tabernae argentariae) stood in the Forum by 310 BC (Livy 9.40.16) and the censors of 179 built new ones (Livy 40.51.5). Cicero sent money to his son in Athens by a banker's letter of exchange (permutatio: Cicero, Att. 12.24.1, 15.15.4). Genoa's and Florence's banks came in the 12th century."
    sources: ["Livy 9.40.16 # unverified", "Livy 40.51.5", "Cicero, Ad Atticum 12.24.1 and 15.15.4 # unverified"]
    confidence: medium

  - id: joint_stock_company
    name: Shareholders' companies (societates publicanorum)
    keywords: [joint stock, shares, company, stock exchange, investors, corporation, publicani, tax farmers, societas, partes]
    category: trade
    year: -215
    complexity: 3
    prerequisites: [banking, double_entry]
    effects: [{type: trade_income, bp: 1500}, {type: naval_strength, bp: 500}]
    flavour: "Many purses, one contract, and the risk shared by all."
    history: "The companies of publicani farmed the taxes and built the public works; in 215 BC three companies of nineteen men supplied the army in Spain on the state's credit (Livy 23.48.10-49.4). Almost every citizen had a share in the contracts (Polybius 6.17.3-4), and shares (partes) were bought and sold (Cicero, In Vatinium 29). The Dutch East India Company (1602) is the modern form."
    sources: ["Livy 23.48.10-49.4 # unverified", "Polybius 6.17.3-4 # unverified", "Cicero, In Vatinium 29 # unverified"]
    confidence: medium

  - id: caravel
    name: Ocean-going ships
    keywords: [caravel, ocean ship, carrack, galleon, ocean going, lateen sail, blue water]
    category: maritime
    year: 1440
    complexity: 3
    prerequisites: [sternpost_rudder, compass]
    requires: {materials: [timber], buildings: [harbour]}
    effects: [{type: naval_strength, bp: 1200}, {type: trade_income, bp: 1000}, {type: mobility, bp: 600}]
    flavour: "A ship that can sail against the wind and come home from beyond the edge of the map."
    history: "Caesar's fleet was beaten by the Veneti's oak ships built for the Atlantic (Caesar, BG 3.13); Roman merchantmen hugged the coasts and laid up from November to March (Vegetius 4.39). Portuguese caravels that could sail into the wind explored Africa from the 1440s."
    sources: ["Caesar, De bello Gallico 3.13", "Vegetius 4.39 # unverified"]
    confidence: high

  - id: astrolabe
    name: Navigation by the stars
    keywords: [astrolabe, quadrant, sextant, latitude, navigation, star navigation, pole star, steer by the stars]
    category: maritime
    year: -150
    complexity: 2
    prerequisites: [astronomy_calendar, sailing]
    effects: [{type: naval_strength, bp: 400}, {type: mobility, bp: 400}]
    flavour: "The pole star's height tells the sailor how far north he is."
    history: "Hipparchus of Rhodes (about 150 BC) built the first star catalogue and the plane astrolabe's geometry; Vitruvius describes the anaphoric clock that turns the heavens (Vitr. 9.8.8-15). Roman pilots steered by the Bears and the Pole (Lucan 8.167-184); Arab navigators perfected the astrolabe about AD 800."
    sources: ["Vitruvius 9.8.8-15 # unverified", "Lucan, Pharsalia 8.167-184 # unverified", "Pliny NH 2.95 (Hipparchus) # unverified"]
    confidence: medium

  - id: cannon
    name: Cannon
    keywords: [cannon, artillery, bombard, siege gun, big guns]
    category: military
    year: 1326
    complexity: 3
    prerequisites: [gunpowder, bronze_working]
    requires: {buildings: [forge]}
    effects: [{type: military_strength, bp: 1200}]
    flavour: "No wall stands for long against a gun that throws stone balls."
    history: "Rome's wall-breakers were the ram and the torsion stone-thrower (Vitruvius 10.13, 10.11). The first European picture of a cannon is from 1326; Chinese bronze guns are older."
    sources: ["Vitruvius 10.11 and 10.13 # unverified"]
    confidence: high

  - id: musket
    name: Muskets
    keywords: [musket, arquebus, matchlock, firearms, guns, rifle, harquebus, volley, volleys]
    category: military
    year: 1450
    complexity: 3
    prerequisites: [gunpowder, iron_working]
    effects: [{type: military_strength, bp: 1500}]
    flavour: "A farmer with a month's drill and a gun can stop a horseman."
    history: "The legionary's missile was the pilum, thrown at fifteen paces (Polybius 6.23.9-11). Handguns spread through Europe in the 1400s; the matchlock musket came about 1450."
    sources: ["Polybius 6.23.9-11 # unverified"]
    confidence: high

  - id: star_fort
    name: Star forts
    keywords: [star fort, bastion, trace italienne, angled walls, artillery fortress]
    category: military
    year: 1500
    complexity: 3
    prerequisites: [cannon, fortification, surveying]
    effects: [{type: military_strength, bp: 800}, {type: legitimacy, bp: 100}]
    flavour: "Low, thick, angled walls that cannon cannot break and every gun can cover."
    history: "Roman walls were high and square-towered (Vitruvius 1.5 wants round or polygonal towers against the ram). Italian engineers built angled bastions against cannon from about 1500."
    sources: ["Vitruvius 1.5.1-5 # unverified"]
    confidence: high

  - id: seed_drill
    name: Seed drill
    keywords: [seed drill, sow in rows, planting machine]
    category: agriculture
    year: 1701
    complexity: 2
    prerequisites: [ox_plough, iron_working]
    effects: [{type: food_output, bp: 700}]
    flavour: "Seeds in neat rows, not scattered to the birds."
    history: "Roman sowers broadcast the seed by hand from a basket and harrowed it in (Varro RR 1.29.1-2; Columella 2.9); China had iron seed drills by the 2nd century BC, and Jethro Tull built Europe's in 1701."
    sources: ["Varro, De re rustica 1.29.1-2 # unverified", "Columella 2.9 # unverified"]
    confidence: medium

  - id: new_world_crops
    name: New crops (maize, potatoes)
    keywords: [potato, potatoes, maize, corn, sweet potato, new crops]
    category: agriculture
    year: 1550
    complexity: 2
    prerequisites: [agriculture]
    effects: [{type: food_output, bp: 1200}, {type: population_cap, bp: 800}]
    flavour: "A crop that grows where wheat will not, and feeds twice as many."
    history: "Rome's new crops came from the East: the cherry Lucullus brought from Pontus in 74 BC (Pliny NH 15.102), peaches and apricots. Maize and potatoes, grown in the Americas for thousands of years, reached Europe after 1492."
    sources: ["Pliny NH 15.102 # unverified"]
    confidence: high

  - id: spinning_wheel
    name: Spinning wheel
    keywords: [spinning wheel, spinning, thread, yarn, textiles, wool]
    category: craft
    year: 1280
    complexity: 2
    prerequisites: [wheel]
    effects: [{type: wealth_output, bp: 500}, {type: labour_output, bp: 300}]
    flavour: "A wheel turns, and a day's thread is spun in an hour."
    history: "Roman matrons spun with distaff and drop spindle, the virtue Augustus made his daughters learn (Suet. Aug. 64.2; the tombstone's 'lanam fecit'). The spinning wheel came from India about AD 1000 and reached Europe in the 13th century."
    sources: ["Suetonius, Augustus 64.2 # unverified", "CIL VI 15346 (Claudia: domum servavit, lanam fecit) # unverified"]
    confidence: medium

  - id: spinning_machine
    name: Spinning machines
    keywords: [spinning jenny, water frame, textile machine, cotton mill, factory, mill]
    category: craft
    year: 1765
    complexity: 4
    prerequisites: [spinning_wheel, water_wheel]
    requires: {buildings: [workshop]}
    resistance: [{group: guilds, level: 2}]
    effects: [{type: wealth_output, bp: 1500}, {type: labour_output, bp: 1000}]
    flavour: "One machine, eight spindles - and the spinners riot."
    history: "Vespasian refused a machine to haul columns cheaply, saying he must let the poor earn their bread (Suet. Vesp. 18): the Roman objection to labour-saving engines. Hargreaves' spinning jenny (about 1765) began the factory age."
    sources: ["Suetonius, Vespasianus 18 # unverified"]
    confidence: high

  - id: coke_smelting
    name: Coke smelting
    keywords: [coke, coke smelting, coal iron, darby]
    category: metallurgy
    year: 1709
    complexity: 3
    prerequisites: [coal_mining, blast_furnace]
    requires: {materials: [coal], buildings: [forge, mine]}
    effects: [{type: materials_output, bp: 1500}]
    flavour: "Iron from coal, not forests - and suddenly iron is cheap."
    history: "Roman smelting ate the forests: the iron works of Elba were moved to the mainland for want of wood (Diodorus 5.13.1). Abraham Darby smelted iron with coke at Coalbrookdale in 1709."
    sources: ["Diodorus 5.13.1 # unverified"]
    confidence: high

  - id: steam_engine
    name: Steam engine
    keywords: [steam engine, steam power, boiling water push, piston engine, watt, newcomen, engine, aeolipile]
    category: craft
    year: 1712
    complexity: 5
    prerequisites: [coke_smelting, piston_bellows]
    requires: {materials: [iron, coal], literacy_bp: 1500, buildings: [mine]}
    effects: [{type: labour_output, bp: 1500}, {type: materials_output, bp: 1000}]
    flavour: "Fire makes water into a giant that never sleeps."
    history: "Hero of Alexandria spun a ball by its jets of steam (Pneumatica 2.11, 1st century AD) and Vitruvius knew the aeolipile (Vitr. 1.6.2): a toy, since no Roman needed it to pump a mine. Newcomen's engine pumped one in 1712."
    sources: ["Hero of Alexandria, Pneumatica 2.11 # unverified", "Vitruvius 1.6.2 # unverified"]
    confidence: high

  - id: railways
    name: Railways
    keywords: [railway, railroad, train, locomotive, rails, steam train]
    category: construction
    year: 1825
    complexity: 5
    prerequisites: [steam_engine, roads]
    requires: {materials: [iron, coal], buildings: [mine]}
    effects: [{type: mobility, bp: 2000}, {type: trade_income, bp: 1500}, {type: military_strength, bp: 500}]
    flavour: "Iron roads and fire horses: a month's journey in a day."
    history: "The nearest Rome came to a railway was the diolkos, the paved slipway on which ships were hauled across the Isthmus of Corinth in grooves (Strabo 8.2.1). The Stockton and Darlington Railway opened in 1825."
    sources: ["Strabo 8.2.1 # unverified", "Pliny NH 4.10 (the Isthmus) # unverified"]
    confidence: high

  - id: lightning_rod
    name: Lightning rod
    keywords: [lightning rod, electricity, franklin, lightning]
    category: knowledge
    year: 1752
    complexity: 2
    prerequisites: [scientific_method, iron_working]
    effects: [{type: knowledge_gain, bp: 400}, {type: legitimacy, bp: 100}]
    flavour: "Heaven's fire, led politely into the ground."
    history: "To Romans lightning was Jupiter's word, read by Etruscan haruspices and buried where it struck (Pliny NH 2.138-146, the Etruscan books on thunderbolts). Franklin proved it electricity in 1752 and invented the rod."
    sources: ["Pliny NH 2.138-146 # unverified"]
    confidence: high

  - id: hospitals
    name: Hospitals
    keywords: [hospital, hospitals, infirmary, care for the sick, valetudinarium, sick house]
    category: health
    year: 390
    complexity: 2
    prerequisites: [herbal_medicine, masonry]
    requires: {buildings: [temple]}
    effects: [{type: health, bp: 800}, {type: legitimacy, bp: 100}]
    flavour: "A house where the sick are cared for, not merely prayed over."
    history: "Sick slaves were abandoned at the temple of Aesculapius on the Tiber island (Suet. Claud. 25.2) and the legions kept an infirmary (valetudinarium) in every camp (Hyginus, De munitionibus castrorum 4). The first hospital for all comers at Rome was Fabiola's, about AD 390 (Jerome, Ep. 77.6)."
    sources: ["Suetonius, Claudius 25.2 # unverified", "Hyginus, De munitionibus castrorum 4 # unverified", "Jerome, Epistulae 77.6 # unverified"]
    confidence: medium

  - id: census
    name: The census
    keywords: [census, count the people, population count, registry, records of people, property classes, lustrum]
    category: governance
    year: -509
    complexity: 2
    prerequisites: [writing, standard_measures]
    effects: [{type: wealth_output, bp: 600}, {type: labour_output, bp: 300}]
    flavour: "Count every citizen and his property, and the levy and the tax cannot be dodged."
    history: "Servius Tullius was said to have first counted the citizens by property, 80,000 of them (Livy 1.42.5, 1.44.1-2); the Republic's first census, in 508 BC, found 130,000 (Dion. Hal. 5.20). The count was held about every five years and closed with the lustrum sacrifice."
    sources: ["Livy 1.42.5", "Livy 1.44.1-2", "Dionysius of Halicarnassus 5.20 # unverified"]
    confidence: high

  - id: written_law
    name: Written law (the Twelve Tables)
    keywords: [law code, written law, laws, legal code, courts, justice, twelve tables, decemvirs, publish the laws, codified law]
    category: governance
    year: -450
    complexity: 2
    prerequisites: [writing]
    effects: [{type: legitimacy, bp: 200}, {type: unrest, bp: -100}]
    flavour: "The same law for the plebeian and the patrician - in bronze, in the Forum."
    history: "After the plebs demanded that the law be written down, the decemvirs set up ten tables in 451 BC and two more in 450 (Livy 3.34.6-7, 3.57.10); the Twelve Tables were the 'source of all public and private law' (Livy 3.34.6) that schoolboys still learned by heart in Cicero's youth (Cicero, De legibus 2.59). Hammurabi's stele is 1,300 years older."
