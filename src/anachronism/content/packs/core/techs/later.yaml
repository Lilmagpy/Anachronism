schema_version: 1
# Medieval to early-modern advancements: the ideas a player is most likely to bring back.
# year = approximate first appearance anywhere (placeholder values pending the source review,
# see DECISIONS D-040 and D-075). complexity 1-5 drives cost and duration.
techs:
  - id: eyeglasses
    name: Eyeglasses
    keywords: [eyeglasses, spectacles, glasses, lenses for eyes, reading glasses]
    category: craft
    year: 1286
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}, {type: literacy_growth, bp: 20}]
    flavour: "Old scholars read again; old craftsmen see their work."
    history: "Eyeglasses were invented in Pisa around 1286."

  - id: glassmaking
    name: Clear glass
    keywords: [glass, glassmaking, glassblowing, clear glass, windows]
    category: craft
    year: -100
    complexity: 2
    prerequisites: [pottery_kiln]
    requires: {materials: [clay]}
    effects: [{type: wealth_output, bp: 400}, {type: health, bp: 200}]
    flavour: "Sand and ash made into something you can see through."
    history: "Clear glass was made in Alexandria in the 1st century BC; glassblowing was invented in Syria at about the same time."

  - id: lenses
    name: Ground lenses
    keywords: [lens, lenses, magnifying glass, ground glass, optics]
    category: knowledge
    year: 1000
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}]
    flavour: "A curved glass that makes the small large."
    history: "Ibn al-Haytham's 'Book of Optics' (around 1021) explained how lenses and the eye work."

  - id: telescope
    name: Telescope
    keywords: [telescope, spyglass, looking glass, see far]
    category: knowledge
    year: 1608
    complexity: 3
    prerequisites: [lenses, astronomy_calendar]
    effects: [{type: knowledge_gain, bp: 800}, {type: naval_strength, bp: 500}]
    flavour: "The moon has mountains, and the enemy's sails are seen an hour sooner."
    history: "Hans Lipperhey applied for a patent on the telescope in 1608; Galileo turned one on the heavens in 1609."

  - id: microscope
    name: Microscope
    keywords: [microscope, tiny creatures, small life, animalcules]
    category: health
    year: 1670
    complexity: 3
    prerequisites: [lenses]
    effects: [{type: knowledge_gain, bp: 600}, {type: health, bp: 400}]
    flavour: "A drop of pond water holds a city of tiny beasts."
    history: "Antonie van Leeuwenhoek saw bacteria through his own lenses in 1676."

  - id: germ_theory
    name: Germ theory
    keywords: [germs, germ theory, disease is caused by, invisible creatures cause disease, contagion, wash hands]
    category: health
    year: 1860
    complexity: 4
    prerequisites: [microscope, quarantine]
    requires: {literacy_bp: 2000}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: health, bp: 1500}, {type: population_cap, bp: 600}]
    flavour: "Sickness is not a curse or a bad air. It is alive, and it can be killed."
    history: "Louis Pasteur showed in the 1860s that microbes cause rot and disease; Robert Koch proved it germ by germ."

  - id: vaccination
    name: Vaccination
    keywords: [vaccine, vaccination, cowpox, jenner, immunise]
    category: health
    year: 1796
    complexity: 3
    prerequisites: [inoculation]
    effects: [{type: health, bp: 1200}]
    resistance: [{group: clergy, level: 1}]
    flavour: "The milkmaids never caught smallpox. Now no one has to."
    history: "Edward Jenner vaccinated a boy with cowpox in 1796, protecting him from smallpox."

  - id: soap
    name: Soap
    keywords: [soap, washing, lye, cleanliness]
    category: health
    year: -2800
    complexity: 1
    prerequisites: [pottery_kiln]
    effects: [{type: health, bp: 400}]
    flavour: "Fat, ash and water - and fewer fevers."
    history: "A Babylonian clay tablet of about 2800 BC records soap made from fat and wood ash."

  - id: distillation
    name: Distillation
    keywords: [distillation, distil, still, spirits, alcohol, alembic]
    category: craft
    year: 800
    complexity: 2
    prerequisites: [alchemy]
    effects: [{type: wealth_output, bp: 400}, {type: health, bp: 300}]
    flavour: "Wine boiled, its spirit caught - for medicine, and for merriment."
    history: "Arab chemists such as Jabir ibn Hayyan refined distillation around AD 800; strong spirits came later."

  - id: mechanical_clock
    name: Mechanical clock
    keywords: [clock, mechanical clock, escapement, timekeeping, hours]
    category: craft
    year: 1280
    complexity: 3
    prerequisites: [wheel, iron_working, astronomy_calendar]
    effects: [{type: labour_output, bp: 500}, {type: knowledge_gain, bp: 400}]
    flavour: "The bell in the tower tells the whole town when to work and when to pray."
    history: "Weight-driven clocks with escapements appeared in European church towers around 1280."

  - id: printing_press
    name: Printing press
    keywords: [printing press, gutenberg, press, printed books, mass printing, books for everyone]
    category: knowledge
    year: 1450
    complexity: 4
    prerequisites: [movable_type, paper]
    requires: {literacy_bp: 500, buildings: [workshop]}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: literacy_growth, bp: 100}, {type: knowledge_gain, bp: 1500}, {type: cultural_influence, bp: 1000}]
    flavour: "A screw press, metal type and oily ink - a thousand pages a day."
    history: "Johannes Gutenberg printed with metal type on a screw press in Mainz around 1450; his Bible appeared in 1455."

  - id: newspapers
    name: Newspapers
    keywords: [newspaper, news sheets, gazette, broadsheet, journalism]
    category: knowledge
    year: 1605
    complexity: 2
    prerequisites: [printing_press, postal_relay]
    resistance: [{group: nobility, level: 1}]
    effects: [{type: information_speed, bp: 1500}, {type: literacy_growth, bp: 50}, {type: unrest, bp: 100}]
    flavour: "Everyone knows everything by Thursday - including what the court would rather hide."
    history: "The first printed newspaper, the 'Relation', was published in Strasbourg in 1605."

  - id: scientific_method
    name: The scientific method
    keywords: [scientific method, experiment, hypothesis, test ideas, evidence, science]
    category: knowledge
    year: 1620
    complexity: 3
    prerequisites: [writing, place_value_numerals, schools]
    requires: {literacy_bp: 1000}
    resistance: [{group: clergy, level: 2}]
    effects: [{type: knowledge_gain, bp: 2000}]
    flavour: "Do not argue about how many teeth a horse has. Open its mouth and count."
    history: "Francis Bacon's 'Novum Organum' (1620) set out reasoning from careful experiment."

  - id: universities
    name: Universities
    keywords: [university, universities, college, academy of scholars, higher learning]
    category: knowledge
    year: 1088
    complexity: 3
    prerequisites: [schools, writing]
    requires: {buildings: [school]}
    effects: [{type: knowledge_gain, bp: 1000}, {type: literacy_growth, bp: 50}, {type: cultural_influence, bp: 500}]
    flavour: "Scholars gather where there are books and freedom to argue."
    history: "The University of Bologna, from 1088, was the first in Europe; older schools of learning stood in Fez, Cairo and Nalanda."

  - id: algebra
    name: Algebra
    keywords: [algebra, equations, unknowns, al-jabr, mathematics]
    category: knowledge
    year: 820
    complexity: 3
    prerequisites: [place_value_numerals]
    effects: [{type: knowledge_gain, bp: 800}, {type: wealth_output, bp: 300}]
    flavour: "Name the unknown x, and it gives itself up."
    history: "Al-Khwarizmi wrote 'The Compendious Book on Calculation by Completion and Balancing' in Baghdad around AD 820."

  - id: double_entry
    name: Double-entry bookkeeping
    keywords: [double entry, double-entry, debits and credits, balance sheet, pacioli]
    category: trade
    year: 1300
    complexity: 2
    prerequisites: [bookkeeping]
    effects: [{type: wealth_output, bp: 800}, {type: trade_income, bp: 500}]
    flavour: "Every coin is written twice, and the books always balance - or someone is stealing."
    history: "Double-entry books were kept by Italian merchants by 1300; Luca Pacioli described the method in 1494."

  - id: banking
    name: Banks and bills of exchange
    keywords: [bank, banking, bills of exchange, credit, loans, letters of credit, interest]
    category: trade
    year: 1150
    complexity: 3
    prerequisites: [coinage, bookkeeping]
    requires: {buildings: [market]}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: trade_income, bp: 1200}, {type: wealth_output, bp: 600}]
    flavour: "Gold stays safe at home; a piece of paper travels instead."
    history: "Italian merchants of Genoa and Florence developed banks and bills of exchange in the 12th century."

  - id: joint_stock_company
    name: Joint-stock company
    keywords: [joint stock, shares, company, stock exchange, investors, corporation]
    category: trade
    year: 1600
    complexity: 3
    prerequisites: [banking, double_entry]
    effects: [{type: trade_income, bp: 1500}, {type: naval_strength, bp: 500}]
    flavour: "Many purses, one ship, and the risk shared by all."
    history: "The Dutch East India Company (1602) was the first company whose shares anyone could buy."

  - id: caravel
    name: Ocean-going ships
    keywords: [caravel, ocean ship, carrack, galleon, ocean going, lateen sail, blue water]
    category: maritime
    year: 1440
    complexity: 3
    prerequisites: [sternpost_rudder, compass]
    requires: {materials: [timber], buildings: [harbour]}
    effects: [{type: naval_strength, bp: 1200}, {type: trade_income, bp: 1000}, {type: mobility, bp: 600}]
    flavour: "A ship that can sail against the wind and come home from beyond the edge of the map."
    history: "Portuguese caravels, able to sail into the wind, explored the African coast from the 1440s."

  - id: astrolabe
    name: Navigation by the stars
    keywords: [astrolabe, quadrant, sextant, latitude, navigation, star navigation]
    category: maritime
    year: 800
    complexity: 2
    prerequisites: [astronomy_calendar, sailing]
    effects: [{type: naval_strength, bp: 400}, {type: mobility, bp: 400}]
    flavour: "The pole star's height tells the sailor how far north he is."
    history: "Astrolabes came from Greek astronomers; Arab navigators and scholars perfected them by about AD 800."

  - id: cannon
    name: Cannon
    keywords: [cannon, artillery, bombard, siege gun, big guns]
    category: military
    year: 1326
    complexity: 3
    prerequisites: [gunpowder, bronze_working]
    requires: {buildings: [forge]}
    effects: [{type: military_strength, bp: 1200}]
    flavour: "No wall stands for long against a gun that throws stone balls."
    history: "The first European picture of a cannon is from 1326; Chinese bronze guns are older."

  - id: musket
    name: Muskets
    keywords: [musket, arquebus, matchlock, firearms, guns, rifle, harquebus, tanegashima, volley, volleys]
    category: military
    year: 1450
    complexity: 3
    prerequisites: [gunpowder, iron_working]
    effects: [{type: military_strength, bp: 1500}]
    flavour: "A farmer with a month's drill and a gun can stop a knight."
    history: "Handguns spread through Europe and the Ottoman empire in the 1400s; the matchlock musket came around 1450."

  - id: star_fort
    name: Star forts
    keywords: [star fort, bastion, trace italienne, angled walls, artillery fortress]
    category: military
    year: 1500
    complexity: 3
    prerequisites: [cannon, fortification, surveying]
    effects: [{type: military_strength, bp: 800}, {type: legitimacy, bp: 100}]
    flavour: "Low, thick, angled walls that cannon cannot break and every gun can cover."
    history: "Italian engineers built angled 'star' bastions against cannon from about 1500."

  - id: seed_drill
    name: Seed drill
    keywords: [seed drill, sow in rows, planting machine]
    category: agriculture
    year: -150
    complexity: 2
    prerequisites: [ox_plough, iron_working]
    effects: [{type: food_output, bp: 700}]
    flavour: "Seeds in neat rows, not scattered to the birds."
    history: "The Chinese used multi-tube iron seed drills by the 2nd century BC; Europe adopted them only in the 1700s."

  - id: new_world_crops
    name: New crops (maize, potatoes)
    keywords: [potato, potatoes, maize, corn, sweet potato, new crops]
    category: agriculture
    year: 1550
    complexity: 2
    prerequisites: [agriculture]
    effects: [{type: food_output, bp: 1200}, {type: population_cap, bp: 800}]
    flavour: "A crop that grows where wheat will not, and feeds twice as many."
    history: "Maize and potatoes, grown in the Americas for thousands of years, reached Europe and Asia after 1492."

  - id: spinning_wheel
    name: Spinning wheel
    keywords: [spinning wheel, spinning, thread, yarn, textiles]
    category: craft
    year: 1000
    complexity: 2
    prerequisites: [wheel]
    effects: [{type: wealth_output, bp: 500}, {type: labour_output, bp: 300}]
    flavour: "A wheel turns, and a day's thread is spun in an hour."
    history: "The spinning wheel came from India around AD 1000 and reached Europe in the 13th century."

  - id: spinning_machine
    name: Spinning machines
    keywords: [spinning jenny, water frame, textile machine, cotton mill, factory, mill]
    category: craft
    year: 1765
    complexity: 4
    prerequisites: [spinning_wheel, water_wheel]
    requires: {buildings: [workshop]}
    resistance: [{group: guilds, level: 2}]
    effects: [{type: wealth_output, bp: 1500}, {type: labour_output, bp: 1000}]
    flavour: "One machine, eight spindles - and the spinners riot."
    history: "James Hargreaves' spinning jenny (about 1765) and Arkwright's water frame (1769) began the factory age."

  - id: coke_smelting
    name: Coke smelting
    keywords: [coke, coke smelting, coal iron, darby]
    category: metallurgy
    year: 1709
    complexity: 3
    prerequisites: [coal_mining, blast_furnace]
    requires: {materials: [coal], buildings: [forge, mine]}
    effects: [{type: materials_output, bp: 1500}]
    flavour: "Iron from coal, not forests - and suddenly iron is cheap."
    history: "Abraham Darby smelted iron with coke at Coalbrookdale in 1709."

  - id: steam_engine
    name: Steam engine
    keywords: [steam engine, steam power, boiling water push, piston engine, watt, newcomen, engine]
    category: craft
    year: 1712
    complexity: 5
    prerequisites: [coke_smelting, piston_bellows]
    requires: {materials: [iron, coal], literacy_bp: 1500, buildings: [mine]}
    effects: [{type: labour_output, bp: 1500}, {type: materials_output, bp: 1000}]
    flavour: "Fire makes water into a giant that never sleeps."
    history: "Thomas Newcomen's steam engine pumped water from a mine in 1712; James Watt improved it from 1769."

  - id: railways
    name: Railways
    keywords: [railway, railroad, train, locomotive, rails, steam train]
    category: construction
    year: 1825
    complexity: 5
    prerequisites: [steam_engine, roads]
    requires: {materials: [iron, coal], buildings: [mine]}
    effects: [{type: mobility, bp: 2000}, {type: trade_income, bp: 1500}, {type: military_strength, bp: 500}]
    flavour: "Iron roads and fire horses: a month's journey in a day."
    history: "The Stockton and Darlington Railway opened in 1825, the first public railway worked by steam."

  - id: lightning_rod
    name: Lightning rod
    keywords: [lightning rod, electricity, franklin, lightning]
    category: knowledge
    year: 1752
    complexity: 2
    prerequisites: [scientific_method, iron_working]
    effects: [{type: knowledge_gain, bp: 400}, {type: legitimacy, bp: 100}]
    flavour: "Heaven's fire, led politely into the ground."
    history: "Benjamin Franklin proved lightning was electricity with his kite in 1752 and invented the lightning rod."

  - id: hospitals
    name: Hospitals
    keywords: [hospital, hospitals, infirmary, care for the sick]
    category: health
    year: 400
    complexity: 2
    prerequisites: [herbal_medicine, masonry]
    requires: {buildings: [temple]}
    effects: [{type: health, bp: 800}, {type: legitimacy, bp: 100}]
    flavour: "A house where the sick are cared for, not merely prayed over."
    history: "Hospitals for all comers were founded by Christian bishops in the 4th century, and by Islamic rulers from the 8th; Buddhist India had them earlier."

  - id: census
    name: The census
    keywords: [census, count the people, population count, registry, records of people]
    category: governance
    year: -500
    complexity: 2
    prerequisites: [writing, standard_measures]
    effects: [{type: wealth_output, bp: 600}, {type: labour_output, bp: 300}]
    flavour: "Count every household, and the tax collector cannot be cheated."
    history: "Censuses were taken in ancient Egypt, Persia and China; Rome counted its citizens every five years from about 500 BC."

  - id: written_law
    name: Written law code
    keywords: [law code, written law, laws, legal code, courts, justice]
    category: governance
    year: -1750
    complexity: 2
    prerequisites: [writing]
    effects: [{type: legitimacy, bp: 200}, {type: unrest, bp: -100}]
    flavour: "The same law for the farmer and the lord - in theory."
    history: "Hammurabi of Babylon had his laws carved on a stone stele around 1754 BC; Ur-Nammu's code is older still."

  - id: republic
    name: Elected magistrates
    keywords: [republic, elected, election, consuls, magistrates, senate, term limits]
    category: governance
    year: -509
    complexity: 3
    prerequisites: [written_law]
    resistance: [{group: nobility, level: 2}]
    effects: [{type: legitimacy, bp: 150}, {type: unrest, bp: -100}]
    flavour: "Rulers chosen for a year, and answerable when it ends."
    history: "Rome expelled its last king in 509 BC and chose two consuls each year instead."

  - id: citizen_assembly
    name: Citizens' assembly
    keywords: [democracy, democratic, vote, voting, assembly, citizens, ballot, parliament, people rule]
    category: governance
    year: -508
    complexity: 3
    prerequisites: [republic, alphabet]
    resistance: [{group: nobility, level: 3}]
    effects: [{type: unrest, bp: -200}, {type: cultural_influence, bp: 400}, {type: legitimacy, bp: 100}]
    flavour: "Every citizen may speak in the assembly - and must live with what it decides."
    history: "Cleisthenes' reforms in Athens (508 BC) gave every citizen a voice in the assembly."

  - id: windpump_polders
    name: Polders and pumps
    keywords: [polder, dykes, drain the marsh, reclaim land, land from the sea]
    category: agriculture
    year: 1400
    complexity: 3
    prerequisites: [windmill, canals]
    effects: [{type: food_output, bp: 800}, {type: population_cap, bp: 600}]
    flavour: "God made the world; the Dutch made Holland."
    history: "Dutch windmills pumped water out of the polders from about 1400, making new land from the sea."

  - id: battery
    name: Electric battery
    keywords: [electricity, electric, battery, voltaic pile, current, galvanic, lightning in a jar, electric power]
    category: knowledge
    year: 1800
    complexity: 5
    prerequisites: [copper_smelting, alchemy, scientific_method]
    requires: {materials: [copper], literacy_bp: 1500}
    effects: [{type: knowledge_gain, bp: 800}]
    flavour: "Copper, zinc and brine: a spark that never runs out."
    history: "Alessandro Volta built the first electric battery in 1800."

  - id: telegraph
    name: Electric telegraph
    keywords: [telegraph, morse, wires, messages by wire, electric messages, cable]
    category: governance
    year: 1837
    complexity: 5
    prerequisites: [battery, postal_relay]
    requires: {materials: [copper]}
    effects: [{type: information_speed, bp: 3000}, {type: legitimacy, bp: 200}, {type: trade_income, bp: 500}]
    flavour: "News that once took a month arrives before the messenger has saddled his horse."
    history: "Cooke and Wheatstone (1837) and Samuel Morse (1838-44) built the first working electric telegraphs."

  - id: telephone
    name: Telephone
    keywords: [telephone, phone, voice over wire, talking at a distance]
    category: governance
    year: 1876
    complexity: 5
    prerequisites: [telegraph]
    requires: {materials: [copper]}
    effects: [{type: information_speed, bp: 2000}, {type: trade_income, bp: 500}]
    flavour: "A voice from a hundred miles away, as if in the next room."
    history: "Alexander Graham Bell patented the telephone in 1876."

  - id: photography
    name: Photography
    keywords: [photography, photograph, camera, daguerreotype, pictures of light, capture an image]
    category: knowledge
    year: 1839
    complexity: 4
    prerequisites: [lenses, alchemy]
    effects: [{type: cultural_influence, bp: 400}, {type: knowledge_gain, bp: 300}]
    flavour: "Light itself paints the picture, and it never lies - or so they say."
    history: "Louis Daguerre announced his photographs in 1839; Niépce had made the first in 1826."

  - id: anaesthesia
    name: Anaesthesia
    keywords: [anaesthesia, anesthesia, ether, chloroform, painless surgery, sleep for surgery]
    category: health
    year: 1846
    complexity: 4
    prerequisites: [distillation, herbal_medicine]
    effects: [{type: health, bp: 800}]
    flavour: "The surgeon may take his time: the patient sleeps through the knife."
    history: "William Morton showed surgery under ether in Boston in 1846."

  - id: steamship
    name: Steamships
    keywords: [steamship, steamboat, paddle steamer, steam ship, ships without sails]
    category: maritime
    year: 1807
    complexity: 5
    prerequisites: [steam_engine, caravel]
    requires: {materials: [iron, coal], buildings: [harbour]}
    effects: [{type: naval_strength, bp: 2000}, {type: trade_income, bp: 1500}, {type: mobility, bp: 800}]
    flavour: "Against the wind and against the current, on time."
    history: "Robert Fulton's 'Clermont' carried passengers up the Hudson by steam in 1807."

  - id: canning
    name: Canned food
    keywords: [canning, tin cans, preserved food, canned food, sealed jars, rations]
    category: agriculture
    year: 1810
    complexity: 3
    prerequisites: [glassmaking, iron_working]
    effects: [{type: storage, bp: 2000}, {type: military_strength, bp: 300}]
    flavour: "Summer's harvest, sealed and boiled, still good next winter."
    history: "Nicolas Appert sealed food in jars and boiled it in 1810, winning Napoleon's prize; tin cans followed."

  - id: fertiliser
    name: Chemical fertiliser
    keywords: [fertiliser, fertilizer, chemical fertiliser, superphosphate, nitrates, feed the soil]
    category: agriculture
    year: 1842
    complexity: 4
    prerequisites: [alchemy, crop_rotation]
    effects: [{type: food_output, bp: 2000}, {type: population_cap, bp: 1000}]
    flavour: "What the soil lacks, the chemist can put back."
    history: "John Bennet Lawes patented superphosphate fertiliser in 1842."

  - id: bessemer_steel
    name: Cheap steel
    keywords: [bessemer, cheap steel, mass steel, steel mill, converter]
    category: metallurgy
    year: 1856
    complexity: 5
    prerequisites: [blast_furnace, coke_smelting]
    requires: {materials: [iron, coal]}
    effects: [{type: materials_output, bp: 1500}, {type: military_strength, bp: 800}]
    flavour: "Blow air through molten iron and steel pours out by the ton."
    history: "Henry Bessemer blew air through molten iron to make cheap steel in 1856."

  - id: dynamite
    name: Dynamite
    keywords: [dynamite, nitroglycerine, high explosive, blasting]
    category: military
    year: 1867
    complexity: 5
    prerequisites: [gunpowder, distillation]
    effects: [{type: materials_output, bp: 800}, {type: military_strength, bp: 800}]
    flavour: "Mountains move aside; so, sadly, do armies."
    history: "Alfred Nobel patented dynamite in 1867."
