schema_version: 1
# Medieval to early-modern advancements: the ideas a player is most likely to bring back.
# year = approximate first appearance anywhere (placeholder values pending the source review,
# see DECISIONS D-040 and D-075). complexity 1-5 drives cost and duration.
techs:
  - id: eyeglasses
    name: Eyeglasses
    keywords: [eyeglasses, spectacles, glasses, lenses for eyes, reading glasses]
    category: craft
    year: 1286
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}, {type: literacy_growth, bp: 20}]
    flavour: "Old scholars read again; old craftsmen see their work."

  - id: glassmaking
    name: Clear glass
    keywords: [glass, glassmaking, glassblowing, clear glass, windows]
    category: craft
    year: -100
    complexity: 2
    prerequisites: [pottery_kiln]
    requires: {materials: [clay]}
    effects: [{type: wealth_output, bp: 400}, {type: health, bp: 200}]
    flavour: "Sand and ash made into something you can see through."

  - id: lenses
    name: Ground lenses
    keywords: [lens, lenses, magnifying glass, ground glass, optics]
    category: knowledge
    year: 1000
    complexity: 2
    prerequisites: [glassmaking]
    effects: [{type: knowledge_gain, bp: 500}]
    flavour: "A curved glass that makes the small large."

  - id: telescope
    name: Telescope
    keywords: [telescope, spyglass, looking glass, see far]
    category: knowledge
    year: 1608
    complexity: 3
    prerequisites: [lenses, astronomy_calendar]
    effects: [{type: knowledge_gain, bp: 800}, {type: naval_strength, bp: 500}]
    flavour: "The moon has mountains, and the enemy's sails are seen an hour sooner."

  - id: microscope
    name: Microscope
    keywords: [microscope, tiny creatures, small life, animalcules]
    category: health
    year: 1670
    complexity: 3
    prerequisites: [lenses]
    effects: [{type: knowledge_gain, bp: 600}, {type: health, bp: 400}]
    flavour: "A drop of pond water holds a city of tiny beasts."

  - id: germ_theory
    name: Germ theory
    keywords: [germs, germ theory, disease is caused by, invisible creatures cause disease, contagion, wash hands]
    category: health
    year: 1860
    complexity: 4
    prerequisites: [microscope, quarantine]
    requires: {literacy_bp: 2000}
    resistance: [{group: clergy, level: 1}]
    effects: [{type: health, bp: 1500}, {type: population_cap, bp: 600}]
    flavour: "Sickness is not a curse or a bad air. It is alive, and it can be killed."

  - id: vaccination
    name: Vaccination
    keywords: [vaccine, vaccination, cowpox, jenner, immunise]
    category: health
    year: 1796
    complexity: 3
    prerequisites: [inoculation]
    effects: [{type: health, bp: 1200}]
    resistance: [{group: clergy, level: 1}]
    flavour: "The milkmaids never caught smallpox. Now no one has to."

  - id: soap
    name: Soap
    keywords: [soap, washing, lye, cleanliness]
    category: health
    year: -2800
    complexity: 1
    prerequisites: [pottery_kiln]
    effects: [{type: health, bp: 400}]
    flavour: "Fat, ash and water - and fewer fevers."

  - id: distillation
    name: Distillation
    keywords: [distillation, distil, still, spirits, alcohol, alembic]
