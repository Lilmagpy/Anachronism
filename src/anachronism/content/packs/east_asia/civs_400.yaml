schema_version: 1
# Korea, Japan and their neighbours around AD 400.
civs:
  - id: goguryeo
    name: Goguryeo
    adjective: Goguryeo
    lineage: goguryeo
    colour: "#b3261e"
    emblem: 麗
    portrait: hills
    description: >-
      A warrior kingdom of mountain fortresses and mounted archers, north of the Han River and across the Yalu, now ruled by a young king who means to be great.
  - id: baekje
    name: Baekje
    adjective: Baekje
    lineage: baekje
    colour: "#2e6fb5"
    emblem: 濟
    portrait: court
    description: >-
      A kingdom of the south-west, cultured and sea-going, friend of the Wa and the Jin court, enemy of Goguryeo since the king was killed at Pyongyang in 371.
  - id: silla
    name: Silla
    adjective: Silla
    lineage: silla
    colour: "#d4a017"
    emblem: 羅
    portrait: court
    description: >-
      The smallest and most remote of the three kingdoms, on the south-east coast, ruled by gold-crowned kings and pressed by the Wa.
  - id: gaya
    name: Gaya
    adjective: Gaya
    lineage: gaya
    colour: "#5a8f29"
    emblem: 伽
    portrait: hills
    description: >-
      A league of small states on the Nakdong River, famous across the sea for their iron.
  - id: wa
    name: Wa (Yamato)
    adjective: Wa
    lineage: wa
    colour: "#8a3d8f"
    emblem: 倭
    portrait: southern
    description: >-
      The kingdom of Yamato and its allied chiefs, building vast keyhole-shaped tombs and sending soldiers across the strait.
  - id: later_yan
    name: Later Yan
    adjective: Yan
    lineage: later_yan
    colour: "#4f6d7a"
    emblem: 後燕
    portrait: steppe
    description: >-
      A Xianbei kingdom of the Murong clan, driven north-east by the Northern Wei and holding out in Liaoxi and Liaodong.
  - id: northern_wei
    name: Northern Wei
    adjective: Wei
    lineage: northern_wei
    colour: "#7a5230"
    emblem: 北魏
    portrait: steppe
    description: >-
      The Tuoba Xianbei, conquerors of northern China, ruling from Pingcheng with steppe cavalry and Chinese officials.
  - id: later_qin
    name: Later Qin
    adjective: Qin
    lineage: later_qin
    colour: "#9b3a3a"
    emblem: 後秦
    portrait: court
    description: >-
      A Qiang dynasty ruling Chang'an and Luoyang, patrons of the great Buddhist translator Kumarajiva.
  - id: southern_yan
    name: Southern Yan
    adjective: Yan
    lineage: southern_yan
    colour: "#3b7a6d"
    emblem: 南燕
    portrait: steppe
    description: >-
      A breakaway Murong kingdom holding Shandong, squeezed between Wei and Jin.
  - id: eastern_jin
    name: Eastern Jin
    adjective: Jin
    lineage: eastern_jin
    colour: "#c46b1b"
    emblem: 東晉
    portrait: court
    description: >-
      The Chinese court in exile at Jiankang, ruling the rich south while great families and generals quarrel.
  - id: rouran
    name: Rouran
    adjective: Rouran
    lineage: rouran
    colour: "#6b6b2f"
    emblem: 柔然
    portrait: steppe
    description: >-
      Nomads of the Mongolian steppe whose khagans raid the Wei frontier.
