schema_version: 1
# Chronicle mode (D-120, D-147): the Kamakura shogunate and the Hojo regents, 1206-1284.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Azuma kagami (the shogunate's own chronicle, which favours the Hojo), the
# Jokyuki, the Gukansho, Nichiren's writings, the Mongol invasion scrolls of Takezaki
# Suenaga and Korean and Yuan records, with modern work by Mass, Conlan, Souyri and Segal.
# The real power passed from the shoguns to the Hojo regents; the chronicle follows it.
# benchmark_provinces counts the provinces of this map the real shogunate held.
chapters:
  - id: kam_wada
    scenario: great_khan
    civ: kamakura
    year: 1213
    title: "The Wada Rising"
    place: "Kamakura"
    speaker: steward
    speaker_name: "Hojo Yoshitoki"
    speaker_title: "Regent, your mother's brother"
    benchmark_provinces: 4
    story: >-
      You are Minamoto no Sanetomo, shogun since you were eleven. You write fine poems in the
      old court style and dream of sailing to China. Your uncle Hojo Yoshitoki and your
      grandmother Masako run the government.


      Wada Yoshimori, the old head of the shogun's samurai board, a hero of the wars that
      founded Kamakura, has been humiliated by the Hojo once too often. His clan has risen,
      and is attacking your palace and the Hojo mansions.
    choices:
      - label: "Stand with the Hojo"
        historical: true
        legitimacy_bp: 800
        unrest_bp: -800
        outcome: >-
          For two days Kamakura burns. The Wada are destroyed, and Yoshitoki takes Wada's post
          as well as his own. No family in the east can stand against the Hojo now. You go back
          to your poetry.
        deeds: {martial_bp: 500}
      - label: "Side with Wada against your uncle"
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          The Wada fight their way to the palace and proclaim that they have freed the shogun.
          The Hojo hold their mansions. Kamakura has two governments for a summer.
    history: >-
      The Wada rebellion of 1213 was crushed by the Hojo, who took the leadership of the
      samurai board (samurai-dokoro) and dominated the shogunate.
    sources: ["Azuma kagami, Kenpo 1", "Mass, The Development of Kamakura Rule (1979)"]

  - id: kam_ginkgo
    scenario: great_khan
    civ: kamakura
    year: 1219
    title: "The Ginkgo Tree"
    place: "The steps of Tsurugaoka Hachiman shrine, Kamakura"
    speaker: diviner
    speaker_name: "A shrine priest"
    speaker_title: "Of Tsurugaoka Hachiman"
    benchmark_provinces: 4
    story: >-
      Snow has fallen on Kamakura. You are going to the Hachiman shrine to celebrate your
      appointment as Minister of the Right - the highest court rank any warrior has ever held.
      Your uncle Yoshitoki was to carry your sword, but he has suddenly felt ill and gone home.


      At the top of the great stone steps stands a huge ginkgo tree. Your nephew Kugyo, the
      young head priest of the shrine, whose father was shogun before you and who believes
      you killed him, has been seen near it.
    choices:
      - label: "Go up the steps as planned"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          As you come down the steps in the dark, Kugyo leaps out from behind the ginkgo and
          cuts you down, shouting that he has avenged his father. He is killed within hours.
          The Minamoto line of shoguns is ended. From now on the shoguns will be children from
          Kyoto, and the Hojo regents will rule.
        deeds: {ruler_falls: "is murdered by his nephew on the shrine steps"}
      - label: "Have the shrine searched first"
        legitimacy_bp: 500
        outcome: >-
          Kugyo is found with a sword under his robe. He is sent to a temple far away. You go up
          the steps, and come down them again.
    history: >-
      Sanetomo was assassinated by his nephew Kugyo at Tsurugaoka Hachimangu on 13 February
      1219, ending the Minamoto shoguns. The legend of the ginkgo is later; the tree fell in a
      storm in 2010.
    sources: ["Azuma kagami, Shokyu 1", "Gukansho"]

  - id: kam_jokyu
    scenario: great_khan
    civ: kamakura
    year: 1221
    title: "Higher Than the Mountains"
    place: "Kamakura"
    speaker: steward
    speaker_name: "Hojo Masako"
    speaker_title: "The 'nun shogun', widow of Yoritomo"
    benchmark_provinces: 4
    story: >-
      The retired emperor Go-Toba has declared you, Hojo Yoshitoki, an outlaw and called on
      all the warriors of Japan to destroy you. He thinks that without a Minamoto shogun the
      eastern samurai will not fight for the Hojo against the throne itself. Many of the
      vassals gathered in Kamakura are frightened. Who fights an emperor?


      Your sister Masako, widow of the first shogun Yoritomo, has asked to speak to them.
    choices:
      - label: "Let Masako speak, and march on Kyoto"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          'The late lord's favour to you is higher than the mountains and deeper than the sea,'
          Masako tells them. 'Whoever wishes to join the capital, go now.' Nobody goes. Within
          a month a hundred and ninety thousand eastern warriors take Kyoto. Go-Toba is exiled to
          the islands of Oki for the rest of his life, and the lands of his supporters are
          shared among your men.
        deeds: {martial_bp: 1000}
      - label: "Defend Kamakura, and offer terms"
        legitimacy_bp: -1500
        outcome: >-
          You wait in the east. Go-Toba's army grows. Some of your vassals begin to slip away.
    history: >-
      In the Jokyu war of 1221, after Masako's famous speech, the shogunate defeated Go-Toba's
      forces within a month and exiled three retired emperors. Kamakura's power reached Kyoto.
    sources: ["Azuma kagami, Jokyu 3", "Jokyuki"]

  - id: kam_shikimoku
    scenario: great_khan
    civ: kamakura
    year: 1232
    title: "Fifty-One Articles"
    place: "Kamakura"
    speaker: scholar
    speaker_name: "Miyoshi Yasutsura"
    speaker_title: "Of the board of inquiry"
    benchmark_provinces: 4
    story: >-
      You are Hojo Yasutoki, regent. Your warriors fight each other in your courts over land,
      inheritance and stewardships, and your judges decide by guesswork, or the old court
      laws that no warrior can read.


      You want a law for warriors, written in plain language: fifty-one articles, one for each
      thing that keeps going wrong. And a council of thirteen to judge by it.
    choices:
      - label: "Issue the Goseibai Shikimoku"
        historical: true
        legitimacy_bp: 2000
        knowledge_bp: 1000
        unrest_bp: -1000
        outcome: >-
          The code is short and practical: a man who has held land for twenty years keeps it; a
          wife may inherit; a vassal who speaks ill of another is punished. You write to your
          brother in Kyoto that it is only meant for people who cannot read Chinese. It will be
          the basis of Japanese warrior law for three hundred years.
      - label: "Leave it to the judges and precedent"
        outcome: >-
          The courts go on as before, slowly and expensively.
      - label: "✦ Print it, so that every steward has a copy"
        needs_adopted: [printing_press]
        legitimacy_bp: 2500
        knowledge_bp: 2500
        unrest_bp: -1500
        outcome: >-
          The fifty-one articles are printed and sent to every estate in the country. Your
          stewards settle disputes on the spot, citing article and line.
    history: >-
      The Goseibai Shikimoku (1232) was the first legal code written for the warrior class.
    sources: ["Goseibai Shikimoku", "Yasutoki's letter to Hojo Shigetoki (1232)"]

  - id: kam_nichiren
    scenario: great_khan
    civ: kamakura
    year: 1260
    title: "The Prophet of the Lotus"
    place: "Kamakura"
    speaker: diviner
    speaker_name: "Nichiren"
    speaker_title: "A monk of the Lotus Sutra"
    benchmark_provinces: 4
    story: >-
      Earthquakes, famine and epidemic have struck Japan for three years. A monk called
      Nichiren, a fisherman's son, has sent the retired regent Tokiyori a treatise: these
      disasters, he says, are because Japan follows false teachings - above all the popular
      Pure Land devotion to Amida. If Japan does not embrace the Lotus Sutra alone, it will
      suffer rebellion within and invasion from without.


      He is preaching this in the streets of Kamakura. The Pure Land believers have burned his
      hut.
    choices:
      - label: "Exile him to the Izu peninsula"
        historical: true
        influence: {clergy: 1000}
        outcome: >-
          Nichiren is exiled, pardoned, arrested again and nearly executed, exiled again to the
          island of Sado. Eight years after his treatise, a letter arrives from the Great
          Mongol State. His followers will say he foresaw it.
      - label: "Hear him out"
        influence: {clergy: -1000}
        knowledge_bp: 500
        outcome: >-
          Nichiren preaches at court. The other monks are furious. The regent listens
          politely, and begins to think about the coast of Kyushu.
        deeds: {martial_bp: 500}
    history: >-
      Nichiren presented his Rissho ankoku ron to Hojo Tokiyori in 1260, prophesying foreign
      invasion; he was exiled to Izu (1261) and Sado (1271).
    sources: ["Nichiren, Rissho ankoku ron", "Stone, Original Enlightenment (1999)"]

  - id: kam_letter
    scenario: great_khan
    civ: kamakura
    year: 1268
    title: "A Letter from the Great Mongol State"
    place: "Kamakura"
    speaker: mongols
    speaker_name: "Kublai Khan, by letter"
    speaker_title: "Emperor of the Great Mongol State"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      A Korean envoy has brought a letter from Kublai, emperor of the Mongols. 'From time
      immemorial, rulers of small states have sought to maintain friendly relations with
      their neighbours,' it says. It addresses your emperor as 'the king of Japan'. It hopes
      that relations will be friendly. 'Nobody would wish to resort to arms.'


      You are Hojo Tokimune, seventeen years old, regent since this spring. The court in
      Kyoto has drafted a polite reply. Your councillors in Kamakura say: no reply at all.
    choices:
      - label: "Send no reply"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The envoys go home without an answer. More will come; they will go home the same
          way. You order the vassals of Kyushu to their posts.
        deeds: {grudges: {mongols: 2000}}
      - label: "Let the court send its polite reply"
        legitimacy_bp: -500
        outcome: >-
          The court's letter goes to Kublai. It is polite, and it does not say yes. Kublai
          sends another envoy.
    history: >-
      Kublai's letter reached Japan in 1268; on the shogunate's insistence it went unanswered,
      as did several later embassies.
    diverged: >-
      The Mongols are gone.
    sources: ["Text of Kublai's letter (Todaiji copy)", "Conlan, In Little Need of Divine Intervention (2001)"]

  - id: kam_bunei
    scenario: great_khan
    civ: kamakura
    year: 1274
    title: "Bun'ei"
    place: "Hakata bay, Kyushu"
    speaker: general
    speaker_name: "Takezaki Suenaga"
    speaker_title: "A young warrior of Higo"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      Nine hundred ships have come: Mongols, Chinese and Koreans. They have taken Tsushima and
      Iki, killing almost everyone, and landed on the beach at Hakata. Your warriors rode down
      to meet them as warriors do - calling out their names and ancestry, looking for a worthy
      opponent - and the enemy answered with drums, poisoned arrows and iron bombs that
      explode with a noise like thunder.


      A young warrior called Takezaki Suenaga, with five followers, wants to charge.
    choices:
      - label: "Let every man win glory where he can"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Suenaga charges and is nearly killed by an exploding bomb; it will be painted on his
          scroll. By nightfall your army has fallen back to the old fortress of Mizuki. Then the
          invaders go back to their ships for the night - and in the night a storm comes up,
          and in the morning the bay is empty.
        deeds: {martial_bp: 500}
      - label: "Hold the line together at the beach"
        legitimacy_bp: 800
        outcome: >-
          Your samurai stand shoulder to shoulder behind their shields, and the bombs do less
          damage. The invaders take the beach but not the town. That night they go back to their
          ships, and the storm comes.
        deeds: {martial_bp: 1000}
    history: >-
      The first Mongol invasion (Bun'ei, November 1274) landed at Hakata; after a day's fighting
      the invaders re-embarked and withdrew, with heavy losses in a storm. Takezaki Suenaga's
      invasion scrolls show the exploding bombs.
    diverged: >-
      The Mongols are gone.
    sources: ["Moko shurai ekotoba", "Hachiman gudokun", "Korean records (Goryeosa)"]

  - id: kam_wall
    scenario: great_khan
    civ: kamakura
    year: 1275
    title: "The Envoys and the Wall"
    place: "Kamakura"
    speaker: general
    speaker_name: "Adachi Yasumori"
    speaker_title: "Commissioner of rewards"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      Kublai has sent new envoys to demand your submission. They are in Kamakura now. Your
      generals want to build a wall of stone along the whole shore of Hakata bay - twenty
      kilometres long, two metres high - and to keep the Kyushu vassals on guard there in
      rotation, year after year.


      And they want an answer sent to Kublai that he will understand.
    choices:
      - label: "Behead the envoys, and build the wall"
        historical: true
        legitimacy_bp: 1500
        materials_bp: -2500
        outcome: >-
          The five envoys are beheaded at Tatsunokuchi. The wall is built, province by
          province, each responsible for a stretch. When the Mongols come back, they will
          find it.
        deeds: {martial_bp: 2000, grudges: {mongols: 3000}}
      - label: "Send the envoys home, and build the wall"
        legitimacy_bp: 500
        materials_bp: -2500
        outcome: >-
          The envoys go home with a refusal. The wall goes up.
        deeds: {martial_bp: 2000}
      - label: "✦ Build a fleet of steamships to strike first"
        needs_adopted: [steamship]
        materials_bp: -3000
        legitimacy_bp: 2000
        outcome: >-
          Your steamships cross to Korea against the wind and burn the half-built invasion fleet
          in its harbours. Kublai's admirals will need years to start again.
        deeds: {ships: 60, grudges: {mongols: 3000}}
    history: >-
      In 1275 the shogunate executed Mongol envoys at Tatsunokuchi and began the stone wall
      (genko borui) along Hakata bay, parts of which still stand.
    diverged: >-
      The Mongols are gone.
    sources: ["Kamakura nendaiki", "Fukuoka city excavations of the genko borui"]

  - id: kam_koan
    scenario: great_khan
    civ: kamakura
    year: 1281
    title: "Koan"
    place: "Hakata bay"
    speaker: general
    speaker_name: "Kono Michiari"
    speaker_title: "A warrior of Iyo"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      They have come again: two fleets, one from Korea and one from south China, four thousand
      ships and a hundred and forty thousand men - the greatest seaborne invasion in history.
      But the wall has held: they cannot land at Hakata, and their ships lie crowded at anchor
      off the islands in the summer heat, with sickness spreading.


      Your warriors want to row out at night in small boats and attack the great ships.
    choices:
      - label: "Raid them by night"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Kono Michiari, wounded, climbs aboard an enemy ship using his own mast as a ladder
          and takes a general prisoner. For seven weeks the night raids go on. Then, at the end
          of the summer, a typhoon strikes the crowded fleets at Takashima. Most of the ships
          are wrecked; tens of thousands drown. Your priests call it the kamikaze, the divine
          wind.
        deeds: {martial_bp: 1000}
      - label: "Stay behind the wall and wait"
        legitimacy_bp: 1000
        outcome: >-
          The invaders sit in their ships, and sicken, and the typhoon comes.
    history: >-
      The second invasion (Koan, 1281) was held at the stone wall; Japanese night raids harried
      the fleet before a typhoon destroyed much of it. Its wrecks have been found off Takashima.
    diverged: >-
      The Mongols are gone.
    sources: ["Moko shurai ekotoba", "Sasaki, The Origin of the Lost Fleet (2015)", "Conlan (2001)"]

  - id: kam_rewards
    scenario: great_khan
    civ: kamakura
    year: 1285
    title: "No Land to Give"
    place: "Kamakura"
    speaker: general
    speaker_name: "Takezaki Suenaga"
    speaker_title: "Still waiting for his reward"
    benchmark_provinces: 4
    story: >-
      Tokimune is dead at thirty-three, worn out. You are his son Sadatoki, fourteen. The
      warriors who fought the Mongols want their rewards - as they always have after a war,
      in land. Takezaki Suenaga has ridden all the way from Kyushu to Kamakura to plead his
      case in person.


      But this war was fought at home. No enemy land was won. There is nothing to give.
    choices:
      - label: "Give what little there is, to a few"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 2000
        outcome: >-
          Suenaga gets a small estate and a horse, and has the scrolls of his deeds painted in
          gratitude. Most warriors get nothing, and must keep guarding the wall for another
          thirty years at their own cost. They begin to borrow, and to resent Kamakura.
      - label: "Cancel the warriors' debts by decree"
        wealth_bp: -2000
        legitimacy_bp: 1000
        influence: {guilds: -1500}
        outcome: >-
          The moneylenders lose their loans; the warriors keep their lands. The moneylenders
          stop lending to warriors.
    history: >-
      Tokimune died in 1284. Unable to reward the defenders with land, the shogunate faced
      growing discontent; its debt-cancellation decree of 1297 failed, and the Hojo fell in
      1333.
    sources: ["Moko shurai ekotoba", "Segal, Coins, Trade, and the State (2011)"]
