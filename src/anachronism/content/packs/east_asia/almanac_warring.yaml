schema_version: 1
# Chronicle mode (D-120): meanwhile, in the world, 350-221 BC (told in a Qin chronicle).
almanac:
  - id: ws_mencius_liang
    scenario: warring_states
    year: -320
    needs_alive: [wei]
    text: >-
      In Daliang, the philosopher Mencius tells King Hui of Wei that a ruler who speaks of
      profit teaches his people to steal: let him speak of humaneness and rightness instead.
      The king is not persuaded.
  - id: ws_alexander_india
    scenario: warring_states
    year: -326
    text: >-
      Far to the west, beyond the deserts and the roof of the world, a Macedonian king
      named Alexander crosses the Indus with an army, defeats King Porus and his elephants
      at the Hydaspes, and turns back only when his own soldiers refuse to go further.
  - id: ws_chandragupta
    scenario: warring_states
    year: -321
    text: >-
      In India, Chandragupta Maurya overthrows the Nanda kings of Magadha and founds an
      empire that will stretch from Bengal to the Hindu Kush.
  - id: ws_zhuangzi
    scenario: warring_states
    year: -310
    text: >-
      In Song, the philosopher Zhuang Zhou, asked to become chief minister of Chu, tells the
      envoys he would rather be a turtle dragging its tail in the mud than a sacred shell
      kept in a box in a temple.
  - id: ws_wuling_hufu
    scenario: warring_states
    year: -307
    needs_alive: [zhao]
    text: >-
      King Wuling of Zhao orders his soldiers to put on the trousers of the steppe nomads
      and learn to shoot from horseback. His nobles call it barbarism. Within a few years
      Zhao has the finest cavalry in China.
  - id: ws_euclid
    scenario: warring_states
    year: -300
    text: >-
      In Alexandria in Egypt, a teacher called Euclid sets down the Elements of geometry,
      proving everything from a handful of axioms.
  - id: ws_zhongshan
    scenario: warring_states
    year: -296
    needs_alive: [zhao]
    text: >-
      Zhao swallows the little state of Zhongshan, whose kings were buried with bronze
      tigers inlaid in gold and silver.
  - id: ws_song_falls
    scenario: warring_states
    year: -286
    needs_alive: [qi]
    text: >-
      King Min of Qi conquers Song. Its last king, called "Jie Song" after the worst tyrant
      of legend, is said to have shot arrows into a leather bag of blood and declared that he
      had wounded Heaven.
  - id: ws_alexandria_library
    scenario: warring_states
    year: -285
    text: >-
      The kings of Egypt are gathering every book they can find into a great library at
      Alexandria; ships in the harbour are searched for scrolls to copy.
  - id: ws_tian_dan
    scenario: warring_states
    year: -279
    needs_alive: [qi]
    text: >-
      At Jimo, the last town of Qi, Tian Dan ties blades to the horns of a thousand oxen and
      burning reeds to their tails and drives them by night into the Yan camp. Qi wins back
      all seventy cities.
  - id: ws_punic
    scenario: warring_states
    year: -264
    text: >-
      Far in the west, two cities called Rome and Carthage go to war over an island named
      Sicily. The war will last twenty-three years.
  - id: ws_ashoka_kalinga
    scenario: warring_states
    year: -261
    text: >-
      In India, the emperor Ashoka conquers Kalinga. Sickened by the slaughter, he turns to
      the teachings of the Buddha and has edicts of mercy carved on rocks and pillars across
      his empire.
  - id: ws_xunzi
    scenario: warring_states
    year: -255
    needs_alive: [chu]
    text: >-
      Xunzi, the greatest Confucian of the age, becomes magistrate of Lanling in Chu. Man's
      nature is bad, he teaches; goodness is learned. Two of his pupils are Han Fei and Li
      Si.
  - id: ws_archimedes
    scenario: warring_states
    year: -250
    text: >-
      In Syracuse, Archimedes works out the law of the lever and boasts that, given a place
      to stand, he could move the earth.
  - id: ws_chunshen
    scenario: warring_states
    year: -241
    needs_alive: [chu]
    text: >-
      Chu moves its capital east again, to Shouchun on the Huai river, out of Qin's reach.
  - id: ws_lushi_chunqiu
    scenario: warring_states
    year: -239
    text: >-
      Lü Buwei's scholars finish the Annals of Lü Buwei, an encyclopaedia of all the
      learning of the age. He hangs it at the gate of Xianyang with a thousand pieces of
      gold for anyone who can add or remove a single word.
  - id: ws_eratosthenes
    scenario: warring_states
    year: -230
    text: >-
      In Alexandria, Eratosthenes measures the shadow of a stick at noon in two cities and
      works out the size of the whole earth, very nearly right.
  - id: ws_xiongnu
    scenario: warring_states
    year: -224
    text: >-
      On the northern steppes, the horse peoples whom the Chinese call the Xiongnu are
      gathering under a single chief, Touman.
