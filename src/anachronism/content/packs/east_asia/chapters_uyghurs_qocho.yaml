schema_version: 1
# Chronicle mode (D-120, D-XXX): the Uyghurs of Qocho (Turfan) and their Idiqut Barchuq Art
# Tegin, 1206-1221. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Juvaini's History of the World-Conqueror (1.4, the
# chapter on the Uyghur Idiqut), the Yuan shi biography of Barchuq (chapter 124), the
# Secret History of the Mongols, with modern work by Allsen ("The Yuan dynasty and the
# Uighurs of Turfan", 1983) and Biran. Dates are approximate by a year: the killing of the
# Khitan resident is put in 1209, Barchuq's journey to Chinggis Khan in 1211. The later
# history of the idiqut line (Kesmes, Salindi, the war with Kaidu from 1275) is left out,
# because its order and dates are not secure enough to put names in a ruler list.
# benchmark_provinces counts the provinces of this map the real kingdom held (one).
chapters:
  - id: uy_shaukem
    scenario: great_khan
    civ: uyghurs
    year: 1206
    title: "The Gurkhan's Resident"
    place: "Qocho, the Idiqut's palace"
    speaker: steward
    speaker_name: "An old minister"
    speaker_title: "Of your council"
    benchmark_provinces: 1
    story: >-
      You are Barchuq Art Tegin, Idiqut, 'Holy Fortune', of the Uyghurs of Qocho. Your
      ancestors left the steppe when the Kirghiz broke their khanate, four centuries ago,
      and built fields, canals, temples and libraries in the oasis of Turfan. Your people
      are Buddhists and Manichaeans, with a growing Church of the East community; they
      write books in their own script and trade with every road in Asia.


      For two generations you have paid tribute to the Gurkhan of the Qara Khitai, whose
      resident sits in your city and grows richer and ruder every year. News from the north
      says that a man named Temujin has been proclaimed Genghis Khan, and the steppe is
      tidying itself up.
    choices:
      - label: "Pay the tribute, and bide your time"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          You pay and you listen. Merchants arrive from the north with stories of how the
          Mongols treat those who submit to them, and of how they treat those who do not. You
          send a few trusted men to find out.
      - label: "Stop payment and trust the mountains"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          The Gurkhan's resident writes to his master. Nobody comes at once, but the oasis
          merchants who travel west are quietly turned back at the passes.
    history: >-
      The Uyghurs of Qocho were tributaries of the Qara Khitai; their Idiqut Barchuq
      endured the Khitan resident (shaukem) until about 1209.
    sources: ["Juvaini 1.4", "Allsen, 'The Yuan dynasty and the Uighurs of Turfan' (1983)"]

  - id: uy_tower
    scenario: great_khan
    civ: uyghurs
    year: 1209
    title: "The Resident Is Dead"
    place: "Qocho"
    speaker: general
    speaker_name: "The captain of your guard"
    speaker_title: "Of the Idiqut's household"
    benchmark_provinces: 1
    story: >-
      The Qara Khitai resident has been insulting your officers again and demanding more
      gifts. Your people have had enough. The Mongol khan, to whom you have sent men, has
      let it be known that he will receive you kindly if you break from the Gurkhan, and that
      he is not waiting for anyone else's permission to be a conqueror.


      The resident is in your city, with a small escort. The Gurkhan's army is a long
      way off. This is the only chance you will have.
    choices:
      - label: "Have the resident killed, and send to Genghis Khan"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          The resident is dead, and Qocho is yours. Your envoys ride north to the Kherlen with
          a message saying that the Idiqut will be the khan's servant and his fifth son,
          if the khan will look favourably upon him. The Khitan do not come.
        deeds: {peace_with: [kara_khitai], grudges: {kara_khitai: 1500}}
      - label: "Send the resident home with gifts, and wait longer"
        legitimacy_bp: -500
        outcome: >-
          The resident goes back to Balasagun and tells the Gurkhan that the Uyghurs are
          loyal. The Mongols go on growing.
    history: >-
      In 1209 Barchuq had the Khitan resident put to death and sent envoys to Chinggis Khan,
      offering submission and asking to be his fifth son.
    sources: ["Juvaini 1.4", "Yuan shi 124 (Barchuq)", "Allsen (1983)"]

  - id: uy_kerulen
    scenario: great_khan
    civ: uyghurs
    year: 1211
    title: "The Fifth Son"
    place: "The Kherlen river, the Great Khan's camp"
    speaker: mongols
    speaker_name: "A Mongol officer"
    speaker_title: "The Khan's escort"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are the Idiqut, and you have come north in person, with the Khan's welcome in
      your pocket. You bring gold, silver, pearls, silk brocade and fine furs. You have
      also brought Uyghur musicians and a train of servants. It is a long way to the
      Kherlen, and every day you wonder whether the Khan means what his envoys said.


      If you go into his camp, you place yourself in his hands. If you stop short, you
      insult the man who is breaking the Gurkhan for you.
    choices:
      - label: "Go in person and kneel before him"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1000
        outcome: >-
          Genghis Khan receives you with honour, calls you his fifth son, and promises you one
          of his daughters, Il-Altun. You keep your kingdom, your throne, and your priests.
          You return home an adopted member of the royal house, a position no other ruler
          outside the steppe holds.
        deeds: {ally_with: [mongols]}
      - label: "Send your sons and your gifts, and stay at home"
        legitimacy_bp: 300
        outcome: >-
          The Khan accepts the tribute. He remembers who came and who did not.
        deeds: {tributaries: [mongols]}
    history: >-
      In 1211 Barchuq came in person to Chinggis Khan on the Kherlen, was called his fifth
      son, and was promised the khan's daughter Il-Altun. Qocho kept its own ruler and
      institutions as an allied state.
    diverged: >-
      The Mongols are gone.
    sources: ["Juvaini 1.4", "Yuan shi 124 (Barchuq)", "Allsen (1983)"]

  - id: uy_scribes
    scenario: great_khan
    civ: uyghurs
    year: 1215
    title: "Writing for the Khan"
    place: "Qocho"
    speaker: mongols
    speaker_name: "A Mongol envoy"
    speaker_title: "From the Khan's household"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      The Mongols have conquered half the world by now, and they cannot write. Their khan
      has taken up your script, the vertical, flowing alphabet your people took from the
      Sogdians, because it is the only one the Naiman scribe he captured could teach him.
      Now he orders his sons to learn it, and he needs clerks to write down his laws,
      count his plunder and draft his letters.


      A Mongol officer is at your gate asking for scribes: teachers for the princes,
      secretaries for the army, tax-counters for the conquered cities. The best of your
      young men will be gone for years.
    choices:
      - label: "Send your best scribes"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 800
        outcome: >-
          Uyghur clerks teach the Mongol princes, write the Khan's letters, and keep the
          accounts of the cities he takes. Over the next decades they serve in every part of
          the empire, from Persia to China. The Mongol language will be written in your script
          for centuries after.
      - label: "Send a few, and keep your best at home"
        legitimacy_bp: 200
        outcome: >-
          A handful of clerks go north. The Khan finds Uyghurs for his needs from elsewhere.
          You are less indispensable than you would have liked to be.
    history: >-
      The Mongols adopted the Uyghur script in the early years of Chinggis Khan's reign, and
      Uyghur scribes and officials staffed the chancery of the empire and its successor
      states.
    sources: ["Juvaini 1.4", "Allsen (1983)", "Atwood, Encyclopedia of Mongolia and the Mongol Empire (2004)"]

  - id: uy_west
    scenario: great_khan
    civ: uyghurs
    year: 1219
    title: "The Khan Goes West"
    place: "Qocho"
    speaker: mongols
    speaker_name: "A messenger of Genghis Khan"
    speaker_title: "With the golden tablet"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      The Khan has marched against the Khwarazmshah, and he has called for the troops of
      every ally. You are expected to bring your own horsemen: a few thousand men who know
      the Silk Road better than any Mongol.


      The campaign will be long and bloody. If it goes well, Qocho will be one of the most
      favoured states in the new empire. If it goes badly, you will have emptied your oasis
      of fighting men for nothing.
    choices:
      - label: "Lead your troops west in person"
        historical: true
        legitimacy_bp: 1200
        wealth_bp: 500
        outcome: >-
          You ride with the Khan. The Yuan shi says that Barchuq served in his wars and was
          rewarded for it; the Uyghurs are given a share in the spoils, and the caravan trade
          is protected by the Mongol peace.
        deeds: {martial_bp: 800}
      - label: "Send a general in your place"
        legitimacy_bp: 300
        outcome: >-
          Your troops go west under a deputy. The Khan reads the difference.
    history: >-
      Barchuq took part with Uyghur troops in Chinggis Khan's wars; the Yuan shi lists his
      services against the western states. Qocho was treated as a privileged ally of the
      empire.
    diverged: >-
      The Mongols are gone.
    sources: ["Yuan shi 124 (Barchuq)", "Juvaini 1.4", "Allsen (1983)"]
