schema_version: 1
# Chronicle mode (D-120, D-XXX): the ancient Korean kingdom of Joseon (Gojoseon), from its
# claim to a royal title to Wiman's coup, about 322-194 BC. Each chapter opens in its year;
# one choice is what history chose (historical: true). Facts follow the Weilue (a lost
# third-century AD work quoted in the commentary to Sanguo zhi 30, "Wei, Dongyi"), Sima Qian's
# Shiji 115 (Chaoxian) and Shiji 110, with modern work by Di Cosmo, Lee Ki-baik and Byington
# (Early Korea). Most dates are approximate: the Weilue gives no years for the Hou's
# quarrel with Yan, for Qin Kai's attack (about 300, in King Zhao of Yan's reign), for King
# Bu's submission (after Qin's unification of 221, and before the wall to Liaodong was
# finished about 210), or for Wiman's coup; the usual date for the coup is 194 BC, but some
# historians prefer a year or two either side (the Weilue also leaves open where Joseon's
# centre lay at this time, Liaodong or the Taedong/Pyongyang area, and the dispute is still
# live). No ruler's name survives from before King Bu (Bu) and his son Jun (Zhun). The
# Dangun foundation story (the bear-woman, the 2333 BC date) is a later tradition: it is
# first written down in Iryeon's Samguk yusa, about 1281 AD, and appears nowhere in these
# sources, so it is not used as fact here. benchmark_provinces counts the provinces of this
# map the real Joseon held at that date.
chapters:
  - id: gojoseon_hou
    scenario: warring_states
    civ: gojoseon
    year: -322
    title: "The Hou Wants a Crown"
    place: "Your capital"
    speaker: scholar
    speaker_name: "Li"
    speaker_title: "A great officer of Joseon"
    needs_alive: [yan]
    benchmark_provinces: 2
    story: >-
      You are the Hou, the lord, of Joseon. The Zhou kings who once gave lords their titles
      are weak, and the king of Yan, your neighbour to the west, has begun to call himself a
      king as well. Your own court thinks that if Yan can do it, so can Joseon.


      The Weilue says you meant to attack Yan, to punish the upstart and to "uphold the Zhou
      house", a good excuse for taking a king's title yourself. One of your great officers,
      Li, begs you not to. A war with a state that size could cost you your towns.
    choices:
      - label: "Send your officer Li to Yan with terms"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          Li goes to Yan, argues his case, and Yan gives up the plan to fight you. The Weilue
          says the war was stopped. Your court is grateful, and a little disappointed.
      - label: "March on Yan to answer its king's title"
        unrest_bp: 600
        legitimacy_bp: 1400
        outcome: >-
          Your army goes west with its bronze daggers and its fine crossbows, and meets an army with
          iron swords. It is not a short war, and it is not your last.
      - label: "Fortify the Liao border and wait"
        legitimacy_bp: 300
        wealth_bp: -500
        outcome: >-
          Your engineers raise earthworks and watch-towers along the western river. Yan's king
          takes his title and does nothing for the moment; your court grumbles at the cost.
        deeds: {"men": 4000}
    history: >-
      The Weilue says that when Yan took the title of king, the Hou of Joseon planned to
      attack it in order to uphold the Zhou house, but a great officer, Li, dissuaded him
      and was sent to Yan to talk instead. The Dangun foundation story, of a bear woman and a
      date of 2333 BC, is a later Korean tradition (first written in the 1280s AD) and is not
      in these sources.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Byington, Early Korea (2008)"]

  - id: gojoseon_qin_kai
    scenario: warring_states
    civ: gojoseon
    year: -300
    title: "Two Thousand Li"
    place: "The western border"
    speaker: general
    speaker_name: "Your western commander"
    speaker_title: "At the border"
    needs_alive: [yan]
    benchmark_provinces: 1
    story: >-
      You are the king of Joseon. Your fathers' descendants, the Weilue says, grew proud and
      harsh, and the western lands have paid for it. The Yan general Qin Kai has crossed your
      border with an army, the one who knows the northern peoples and has already driven the
      Donghu off the steppe.


      Your commanders say the iron weapons of Yan are better than the bronze weapons of Joseon,
      and the fighting at the border is going badly. They ask whether to hold the Liaodong
      plain or to give it up and keep the hills and rivers to the east.
    choices:
      - label: "Retreat to the Taedong and regroup"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Yan takes the west: the Weilue says two thousand li, a Chinese reckoning, up to
          Manfanhan, which then marks the new border. Joseon becomes weaker. Your court moves
          east, behind rivers that Yan will not cross. (In the game you also gain a friend in Qi, Yan's rival across the sea; no source records such a pact.)
        deeds: {give: [joseon_liaodong], give_to: yan, capital: joseon_taedong, peace_with: [yan], ally_with: [qi], grudges: {yan: 300}, martial_bp: 6000, men: 15000}
      - label: "Stand and fight for the Liaodong plain"
        legitimacy_bp: -400
        unrest_bp: 1500
        influence: {"nobility": -800}
        outcome: >-
          Your army fights for the plain and loses most of its best men, and Yan still ends
          the year in Liaodong.
        deeds: {give: [joseon_liaodong], give_to: yan, capital: joseon_taedong, peace_with: [yan], martial_bp: -500}
      - label: "Pay Yan tribute to keep the plain"
        legitimacy_bp: -1000
        wealth_bp: -1500
        unrest_bp: 400
        outcome: >-
          Your envoys carry bronze, furs and hostages to Qin Kai's camp. He takes them, and
          the army stays on your border to watch you.
        deeds: {"peace_with": ["yan"], "men": 8000, "martial_bp": 1000}
    history: >-
      The Weilue says that Yan sent Qin Kai to attack Joseon's western lands and took more
      than two thousand li, up to Manfanhan, which became the border; Joseon grew weak.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Shiji 110 (Xiongnu)"]

  - id: gojoseon_bu
    scenario: warring_states
    civ: gojoseon
    year: -214
    title: "The Wall to Liaodong"
    place: "The Pae river"
    speaker: general
    speaker_name: "Your border envoy"
    speaker_title: "Come from the new wall"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      You are King Bu of Joseon. The king of Qin now rules everything under heaven, and the
      emperor's general Meng Tian has built a long wall that runs all the way to Liaodong. It
      has brought the empire to the edge of your land.


      Your people are afraid that Qin's army will walk over the river. Qin's officers have asked
      you to come to the court and bow, and to send your sons.
    choices:
      - label: "Send gifts and an envoy, not yourself"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          You send gifts and an envoy, and accept Qin as your overlord on paper. The Weilue
          says you were afraid of a Qin attack, so you made a rough submission, and still you
          would not come yourself. The emperor has other things to worry about.
        deeds: {peace_with: [qin], grudges: {qin: 300}}
      - label: "Make the journey and bow before the emperor"
        legitimacy_bp: -1000
        wealth_bp: -400
        outcome: >-
          You make the long journey, bow in front of the emperor, and come home with a title
          and a debt. Your court does not forgive you, and your nobles ask what Qin will want
          next.
        deeds: {peace_with: [qin]}
      - label: "Fortify the Pae river and send an envoy"
        legitimacy_bp: 200
        wealth_bp: -500
        outcome: >-
          You raise the garrisons along the river and let your envoy argue the border. Qin's
          officers note it and report to the capital.
        deeds: {"men": 6000, "martial_bp": 500}
    history: >-
      The Weilue says that when Qin united the world and had Meng Tian build the wall to
      Liaodong, King Bu of Joseon, afraid of a Qin attack, made a nominal submission but
      refused to attend the court. He died, and his son Zhun (Jun) succeeded him.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Shiji 88 (Meng Tian)"]

  - id: gojoseon_refugees
    scenario: warring_states
    civ: gojoseon
    year: -206
    title: "The Refugees from the West"
    place: "Your western towns"
    speaker: steward
    speaker_name: "Your chief officer"
    speaker_title: "Of the western towns"
    benchmark_provinces: 1
    story: >-
      You are King Jun of Joseon. Qin has fallen, and across the wall the world is on fire.
      Chen Sheng, Xiang Yu and Liu Bang are fighting, and the people of Yan, Qi and Zhao, tired
      of war, are coming east, a few at first, then families, then whole villages. Hundreds of
      thousands, the Weilue says.


      Some of your lords say let them in: they are farmers and craftsmen, many with iron tools.
      Others say that so many strangers will want more than a field.
    choices:
      - label: "Admit them and settle the western border"
        historical: true
        legitimacy_bp: 500
        knowledge_bp: 600
        food_bp: 500
        unrest_bp: 400
        outcome: >-
          The Weilue says you put them in the west, along the border. The land fills up. Your
          country gets iron, grain and people who know the ways of the Han lands. It also gets
          people who do not know you.
      - label: "Turn them back at the Pae river"
        legitimacy_bp: 300
        unrest_bp: 300
        wealth_bp: 400
        outcome: >-
          The border towns close their gates and the refugees go elsewhere. Your land stays
          quiet and poor, and you wonder, a few years later, if it was wise.
        deeds: {"men": 4000}
      - label: "Admit only craftsmen and farmers with tools"
        legitimacy_bp: 400
        knowledge_bp: 300
        food_bp: 300
        wealth_bp: 300
        outcome: >-
          Your officers at the river sort the newcomers and let through those with iron tools
          and a trade. The rest wander on. Your western villages grow, more slowly.
    history: >-
      The Weilue says that after Chen Sheng and Xiang Yu rose (209 BC), the people of Yan, Qi
      and Zhao, worn out by the wars, gradually fled to Jun, who settled them in his western
      lands.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Lee Ki-baik, A New History of Korea (1984)"]

  - id: gojoseon_wiman
    scenario: warring_states
    civ: gojoseon
    year: -195
    title: "A Man in Hu Clothes"
    place: "The Pae river"
    speaker: general
    speaker_name: "Wiman"
    speaker_title: "A fugitive from Yan"
    needs_alive: [han]
    benchmark_provinces: 1
    story: >-
      You are King Jun. Han has a new emperor, Liu Bang, and his friend Lu Wan, whom he made
      king of Yan, has run away to the Xiongnu. The border of Yan, on the river, is your
      own border. One day a man arrives at the Pae river with a thousand followers. He wears
      the dress of the Hu, with his hair in a topknot. His name is Wiman. He was a Yan man.


      He asks to be allowed to live in your western lands and defend the border for you. The Weilue says
      you trusted him and made him a "doctor", gave him a jade tablet and a hundred li of land,
      and told him to guard your western border.
    choices:
      - label: "Give Wiman land to guard the western border"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          You make him a doctor of your court, give him the jade tablet of an officer and a
          hundred li of land, and send him to the west. The Weilue says that you trusted and loved
          him. Wiman starts to collect more men.
      - label: "Send him and his followers back across the river"
        legitimacy_bp: -200
        unrest_bp: 200
        outcome: >-
          Wiman goes. He is a clever man, and he does not go far.
      - label: "Let him camp at the Pae river, under watch"
        legitimacy_bp: 500
        outcome: >-
          Wiman and his men camp on the bank for a season under your officers' eyes. He is
          polite, patient and not at all hurried.
        deeds: {"men": 2000}
    history: >-
      The Weilue says that after Lu Wan fled to the Xiongnu (195 BC), Wiman, a man of Yan, in
      Hu dress, crossed the Pae river with some thousand followers and submitted to Jun, who
      made him a doctor, gave him land and sent him to guard the western border.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Shiji 115 (Chaoxian)"]

  - id: gojoseon_coup
    scenario: warring_states
    civ: gojoseon
    year: -194
    title: "Ten Roads of Han"
    place: "The palace"
    speaker: general
    speaker_name: "Wiman"
    speaker_title: "Guardian of the western border"
    after: [gojoseon_wiman]
    needs_alive: [han]
    benchmark_provinces: 1
    story: >-
      You are King Jun of Joseon. Wiman's western lands are full of Yan men, refugees and exiles,
      and they are loyal to him. And now he sends a messenger with news: the armies of Han are
      coming, by ten roads. He asks to bring his men to the capital to guard the palace.


      Nobody else has seen Han's armies. The Weilue says the message was a lie.
    choices:
      - label: "Accept Wiman's offer of an escort for the capital"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Wiman's men march in, and then turn on you. You fight him, but you cannot beat him.
          The Weilue says you escaped by sea, to the land of the Han people in the south, and
          called yourself King of Han there. Wiman made himself king of Joseon, with his capital
          at Wanggeom.
        deeds: {ruler_falls: "is driven out by Wiman, and flees by sea"}
      - label: "Send out scouts first, and keep the gates shut"
        legitimacy_bp: 500
        outcome: >-
          The scouts find no Han army. Wiman says that the roads are many and the scouts are
          few. The gates stay shut, and a long, uneasy wait begins.
        deeds: {men: 3000}
      - label: "Let him come with a small guard under your officers"
        legitimacy_bp: 200
        unrest_bp: 400
        outcome: >-
          Wiman arrives with a few hundred men and is quartered outside the palace walls,
          under your officers. He bows low and bides his time.
        deeds: {"men": 2000}
    history: >-
      The Weilue says that Wiman falsely reported that Han armies were coming by ten roads and
      asked to guard the palace, then attacked Jun; Jun lost, and fled by sea to the Han people
      of the south. The usual date is 194 BC, but modern historians vary. Wiman's Joseon
      lasted until Han conquered it in 108 BC.
    sources: ["Weilue, quoted in Sanguo zhi 30 (Wei, Dongyi)", "Shiji 115 (Chaoxian)", "Byington, Early Korea (2008)"]
