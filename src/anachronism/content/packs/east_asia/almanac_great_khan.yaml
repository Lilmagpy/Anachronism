schema_version: 1
# Chronicle mode (D-120, D-136): meanwhile, in the world, 1206-1279 (told in a Mongol chronicle).
almanac:
  - {id: gk_magna_carta, scenario: great_khan, year: 1215, text: "In England, at a meadow called Runnymede, King John's barons force him to set his seal to a charter promising that no free man shall be imprisoned except by the law of the land."}
  - {id: gk_francis, scenario: great_khan, year: 1219, text: "In Assisi, a merchant's son called Francis, who gave away everything, sails with the crusaders to Egypt and walks into the Sultan's camp to preach to him. The Sultan listens politely and sends him back."}
  - {id: gk_kalka, scenario: great_khan, year: 1223, text: "On the river Kalka, Jebe and Subotai's scouting army destroys the princes of Rus. The captured princes are crushed under the boards of the victory feast."}
  - {id: gk_tripitaka, scenario: great_khan, year: 1237, needs_alive: [goryeo], text: "On Ganghwa island, Goryeo's monks begin carving the entire Buddhist canon onto 81,258 wooden printing blocks. They will finish in 1248, and the blocks still survive at Haeinsa temple without a single error found."}
  - {id: gk_kiev, scenario: great_khan, year: 1240, text: "Batu's army takes Kiev, the mother of Russian cities. Six years later a papal envoy passing through counts barely two hundred houses."}
  - {id: gk_carpini, scenario: great_khan, year: 1246, text: "An old Franciscan friar, John of Plano Carpini, reaches the Mongol court with a letter from the Pope telling the Great Khan to be baptised. Guyuk replies that the Pope should come in person, with all the kings of Europe, to serve him."}
  - {id: gk_louis, scenario: great_khan, year: 1250, text: "King Louis IX of France, on crusade in Egypt, is captured by the Mamluks at Mansurah and ransomed for 400,000 livres."}
  - {id: gk_rubruck, scenario: great_khan, year: 1254, text: "In Karakorum, the friar William of Rubruck takes part in a public debate between Christians, Muslims and Buddhists before the Great Khan Mongke. Afterwards everyone gets very drunk."}
  - {id: gk_baghdad, scenario: great_khan, year: 1258, text: "Hulegu, Mongke's brother, takes Baghdad. The last Abbasid caliph is rolled in a carpet and trampled by horses, so that no royal blood touches the ground."}
  - {id: gk_ain_jalut, scenario: great_khan, year: 1260, text: "At Ain Jalut in Palestine, the Mamluks of Egypt defeat a Mongol army for the first time. The Mongol tide in the west has reached its high-water mark."}
  - {id: gk_polo, scenario: great_khan, year: 1275, text: "A Venetian merchant's son, Marco Polo, arrives at Kublai's summer capital, Shangdu - the Xanadu of a poem not yet written. He will stay seventeen years."}
  - {id: gk_aquinas, scenario: great_khan, year: 1274, text: "In Italy, Thomas Aquinas dies, leaving unfinished his Summa Theologica, an attempt to fit Aristotle and Christianity into one system of thought."}
