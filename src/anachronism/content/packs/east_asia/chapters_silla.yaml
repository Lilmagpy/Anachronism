schema_version: 1
# Chronicle mode (D-120, D-154): Silla, from Goguryeo's little brother to the conqueror of
# Gaya, 400-562. Each chapter opens in its year; one choice is what history chose.
# Facts follow the Samguk sagi (Silla annals and biographies), the Samguk yusa (Buddhist
# and folk tradition), the Gwanggaeto stele, the Silla steles of Jinheung and Naengsu-ri, and
# modern work by Lee Ki-baik, Best and Kim Pusik's translators. benchmark_provinces counts the
# provinces of this map the real Silla held at that date.
chapters:
  - id: sil_rescue
    scenario: three_kingdoms
    civ: silla
    year: 400
    title: "Fifty Thousand from the North"
    place: "Gyeongju (Seorabeol)"
    speaker: goguryeo
    speaker_name: "A messenger of Gwanggaeto"
    speaker_title: "From the Great King of Goguryeo"
    needs_alive: [goguryeo]
    benchmark_provinces: 2
    story: >-
      You are King Naemul, old now. The Wa from across the sea have filled your land, broken
      your walls and carried off your people, with Baekje's blessing and Gaya's iron. You
      have written to Gwanggaeto of Goguryeo: 'I am your subject. I look to you for orders.'


      His answer has come. Fifty thousand horse and foot are marching south to drive out the
      Wa. He will want something in return.
    choices:
      - label: "Accept the Goguryeo army, and send a prince north"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Goguryeo's armoured horsemen drive the Wa out of Silla and pursue them into Gaya. Your
          nephew Silseong, and later your own son, go north to Goguryeo as hostages. Goguryeo
          soldiers stay in your capital for half a century. You are safe - and a little brother.
        deeds: {war_with: [wa]}
      - label: "Fight the Wa alone"
        legitimacy_bp: 1000
        food_bp: -2500
        outcome: >-
          Silla's warriors fight the Wa from fort to fort for a year. They burn half the
          country before they sail away.
        deeds: {war_with: [wa], break_away: [goguryeo]}
    history: >-
      The Gwanggaeto stele records that in 400 Goguryeo sent 50,000 men to rescue Silla from
      the Wa. Silla sent princes as hostages to Goguryeo and Wa, and Goguryeo troops stayed in
      Silla for decades.
    diverged: >-
      Goguryeo is gone; no army comes.
    sources: ["Gwanggaeto stele", "Samguk sagi, Silla annals"]

  - id: sil_jesang
    scenario: three_kingdoms
    civ: silla
    year: 418
    title: "Bak Je-sang"
    place: "Gyeongju"
    speaker: steward
    speaker_name: "Bak Je-sang"
    speaker_title: "Governor of Sapnaguk"
    benchmark_provinces: 2
    story: >-
      You are King Nulji. Your two younger brothers are hostages: Bokho in Goguryeo, Misaheun
      among the Wa across the sea. You long to see them.


      Bak Je-sang, a minor governor, has offered to bring them both home. He has already
      talked Bokho out of Goguryeo. Now he means to go to the Wa, pretend to be a defector from
      Silla, and smuggle Misaheun out. If he is caught, he will die. He left without stopping
      at his own house; his wife ran to the shore and fell weeping on the sand.
    choices:
      - label: "Let him go"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Bak Je-sang gets Misaheun away by boat one foggy morning and stays behind to cover his
          escape. The Wa king offers him rank and riches to become his subject. 'I would rather
          be a dog or a pig of Silla than a lord of Wa,' he says. They make him walk on cut
          reeds and burn him. His wife, the story says, climbs a hill to look towards Wa, and
          turns to stone there.
      - label: "Send gold to ransom your brother instead"
        wealth_bp: -2000
        legitimacy_bp: 300
        outcome: >-
          The Wa take the gold and send Misaheun home, eventually. Bak Je-sang goes back to his
          county and his wife.
    history: >-
      Bak Je-sang (Kim Je-sang in the Samguk yusa) rescued Nulji's brothers from Goguryeo and
      Wa around 418 and was executed by the Wa; his loyalty became legendary.
    sources: ["Samguk sagi 45 (Bak Je-sang)", "Samguk yusa 1"]

  - id: sil_naje
    scenario: three_kingdoms
    civ: silla
    year: 433
    until_year: 440
    title: "Little Brother No More"
    place: "Gyeongju"
    speaker: baekje
    speaker_name: "Envoys of King Biyu"
    speaker_title: "From Baekje"
    needs_alive: [baekje]
    benchmark_provinces: 2
    story: >-
      Goguryeo's king Jangsu has moved his capital south to Pyongyang. Goguryeo soldiers still
      stand in Gyeongju, and Goguryeo officials tell you how to run your kingdom.


      Baekje, your old enemy, has sent envoys with gifts of fine horses. They suggest that
      the two southern kingdoms stop fighting each other and start watching Goguryeo together.
    choices:
      - label: "Make peace with Baekje"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You send Baekje a bright pearl; they send white falcons. In 450 one of your generals
          kills a Goguryeo officer hunting on your border, and you apologise - but by 455 your
          soldiers are fighting beside Baekje's against Goguryeo. Little brother has grown up.
        deeds: {ally_with: [baekje], break_away: [goguryeo]}
      - label: "Stay loyal to Goguryeo"
        legitimacy_bp: -500
        outcome: >-
          Baekje's envoys go home. Goguryeo's officials stay.
    history: >-
      Silla and Baekje made peace in 433 (the Naje alliance) and gradually freed Silla from
      Goguryeo's domination.
    diverged: >-
      Baekje is gone.
    sources: ["Samguk sagi, Silla and Baekje annals (433-455)"]

  - id: sil_wang
    scenario: three_kingdoms
    civ: silla
    year: 503
    title: "A Name and a Title"
    place: "Gyeongju"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council of nobles"
    benchmark_provinces: 2
    story: >-
      You are King Jijeung, sixty-four years old and, the annals say, enormously large. Your
      kingdom has been called by many names: Seorabeol, Saro, Sara. Its rulers have been called
      maripgan - an old title meaning something like 'head chief'.


      Your ministers propose that from now on the kingdom be called Silla, 'new and spreading
      in all directions', and that you take the Chinese title wang, king, like the rulers of
      Goguryeo and Baekje.
    choices:
      - label: "Become King of Silla"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Silla takes its name. You order that the dead no longer be buried with living
          servants, that oxen be used for ploughing, and that markets be opened in the capital.
          Silla begins to look like a state.
        deeds: {martial_bp: 500}
      - label: "Keep the old names"
        influence: {nobility: 1000}
        outcome: >-
          Saro keeps its maripgan and its old ways. The great families are comfortable.
    history: >-
      In 503 Jijeung fixed the name Silla and the title wang; he also banned human sacrifice
      at royal burials and promoted ox-ploughing.
    sources: ["Samguk sagi, Silla annals (502-503)", "Naengsu-ri stele (503)"]

  - id: sil_usan
    scenario: three_kingdoms
    civ: silla
    year: 512
    title: "Wooden Lions"
    place: "The east coast"
    speaker: general
    speaker_name: "Isabu"
    speaker_title: "Governor of Hasla"
    benchmark_provinces: 2
    story: >-
      Out in the eastern sea lies the island of Usan, whose people pay tribute to no one and
      are fierce in a fight. Your governor Isabu says they are simple people and can be
      frightened more easily than conquered.


      He has had his carpenters make lions of wood, with painted manes and teeth, and wants to
      put them on the bows of his warships.
    choices:
      - label: "Let Isabu try his lions"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Isabu's ships sail into the harbour of Usan with the lions on their bows. 'Surrender,'
          he shouts, 'or I will let these beasts loose to eat you all.' The islanders submit at
          once and pay tribute to Silla ever after. The island is called Ulleungdo today.
        deeds: {ships: 10}
      - label: "Send soldiers, not lions"
        legitimacy_bp: 300
        food_bp: -1000
        outcome: >-
          The islanders fight from their cliffs for a season, and then submit.
    history: >-
      In 512 Isabu took Usan-guk (Ulleungdo) by frightening its people with wooden lions,
      according to the Samguk sagi.
    sources: ["Samguk sagi 44 (Isabu)"]

  - id: sil_ichadon
    scenario: three_kingdoms
    civ: silla
    year: 527
    title: "White Blood"
    place: "Gyeongju"
    speaker: diviner
    speaker_name: "Ichadon"
    speaker_title: "A young court official"
    benchmark_provinces: 2
    story: >-
      You are King Beopheung. You want Silla to accept Buddhism, as Goguryeo and Baekje have,
      and to build a temple. The great nobles refuse: the foreign monks dress strangely and
      talk nonsense, and the old gods of Silla's mountains are enough.


      Your young official Ichadon has a plan. He will start building the temple without your
      permission. When the nobles demand his punishment, you will order his execution. He
      says there will be a sign.
    choices:
      - label: "Let Ichadon die"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 2500, nobility: -1500}
        outcome: >-
          When the executioner strikes, the story goes, Ichadon's head flies to Mount Geumgang,
          the earth shakes, flowers rain from the sky, and milk-white blood gushes from his neck.
          The terrified nobles no longer oppose the Buddha. Silla's first great temple,
          Heungnyunsa, is built, and you will end your life as a monk.
      - label: "Spare him, and wait"
        influence: {nobility: 1000}
        outcome: >-
          Ichadon is demoted and sent to the provinces. Buddhism waits another generation.
    history: >-
      The martyrdom of Ichadon in 527 led to Silla's official acceptance of Buddhism, according
      to the Samguk sagi and Samguk yusa; a carved stone pillar of 818 depicts it.
    sources: ["Samguk sagi, Silla annals (527)", "Samguk yusa 3", "Ichadon martyrdom pillar (818)"]

  - id: sil_geumgwan
    scenario: three_kingdoms
    civ: silla
    year: 532
    until_year: 545
    title: "The Iron Kingdom Surrenders"
    place: "Gimhae"
    speaker: gaya
    speaker_name: "King Guhae of Geumgwan Gaya"
    speaker_title: "Last king of the iron kingdom"
    needs_alive: [gaya]
    benchmark_provinces: 2
    story: >-
      Geumgwan Gaya, on the coast at Gimhae, has made iron for five hundred years - ingots so
      good they were used as money across the sea in Wa. But it is small, and squeezed between
      Silla, Baekje and the sea.


      Its king, Guhae, has come to you with his queen and three sons and the treasures of his
      house. He will surrender his kingdom, he says, if his family is honoured.
    choices:
      - label: "Accept, and give his family rank in Silla"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Guhae is given the highest bone-rank and his old kingdom as a fief. His family becomes
          Silla nobility. A hundred and thirty years later his great-grandson, Kim Yu-sin, will
          be the general who unites the Korean peninsula for Silla.
        deeds: {take: [k4_gimhae]}
      - label: "Take the land, and send the king away"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Gimhae is yours. Guhae's sons go to Baekje, and tell everyone what Silla's word is
          worth.
        deeds: {take: [k4_gimhae], grudges: {gaya: 2000}}
    history: >-
      King Guhae of Geumgwan Gaya surrendered to Silla in 532 and was given high rank; Kim
      Yu-sin, Silla's great general of the 7th century, was his great-grandson.
    diverged: >-
      Gaya is gone already.
    sources: ["Samguk sagi, Silla annals (532)", "Samguk yusa 2 (Garak-guk gi)"]

  - id: sil_han_river
    scenario: three_kingdoms
    civ: silla
    year: 553
    until_year: 560
    title: "The Han River"
    place: "The Han river valley"
    speaker: general
    speaker_name: "Geochilbu"
    speaker_title: "Your general in the north"
    needs_alive: [baekje]
    benchmark_provinces: 3
    story: >-
      You are King Jinheung, twenty, and you have ruled since you were seven. Two years ago,
      Silla and Baekje together drove Goguryeo out of the Han river valley, after seventy-five
      years. Baekje took the lower river, with its old capital Hanseong; you took the upper.


      Your general says Baekje's garrisons on the lower river are thin. Whoever holds the
      whole of the Han holds the road to the Yellow Sea - and to China.
    choices:
      - label: "Take the lower Han from Baekje"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your soldiers seize Baekje's forts on the lower Han. The alliance of a hundred and
          twenty years is over. The next year King Seong of Baekje marches to take revenge, and
          at Gwansan fortress your ambush catches him with fifty horsemen; a Silla slave, the
          story says, cuts off his head. You set up a stone on Mount Bukhan to mark your new
          border.
        deeds: {take: [k4_hanseong], war_with: [baekje], grudges: {baekje: 5000}}
      - label: "Keep faith with Baekje"
        legitimacy_bp: 500
        outcome: >-
          The alliance holds. Silla's merchants must go through Baekje's ports to reach China.
    history: >-
      In 553 Jinheung seized the lower Han from Baekje; Baekje's King Seong was killed at
      Gwansan in 554. Jinheung's border stele on Mount Bukhan survives.
    diverged: >-
      Baekje is gone.
    sources: ["Samguk sagi, Silla annals (551-555)", "Bukhansan stele of Jinheung"]

  - id: sil_daegaya
    scenario: three_kingdoms
    civ: silla
    year: 562
    until_year: 570
    title: "Sadaham's Reward"
    place: "Goryeong"
    speaker: general
    speaker_name: "Sadaham"
    speaker_title: "A sixteen-year-old hwarang"
    needs_alive: [gaya]
    benchmark_provinces: 4
    story: >-
      Daegaya, the last of the Gaya kingdoms, has rebelled. Isabu, now very old, is leading
      the army. A sixteen-year-old boy, Sadaham, leader of a band of hwarang - the 'flower
      youths', young aristocrats trained in war, poetry and loyalty - has begged to lead the
      vanguard.
    choices:
      - label: "Give Sadaham the vanguard"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Sadaham's horsemen ride through the gate of Daegaya before its defenders can close it,
          and the kingdom falls. You reward him with three hundred captives; he sets them all
          free. You give him land; he gives it to his men. When his friend dies, he refuses to
          eat and dies seven days later, aged seventeen. Gaya is gone, and with it its music:
          its musician Ureuk has come to Silla with his twelve-string zither, the gayageum.
        deeds: {war_with: [gaya], conquer: [gaya]}
      - label: "Let Isabu do it the slow way"
        legitimacy_bp: 800
        food_bp: -1500
        outcome: >-
          Isabu besieges the city for a season. It surrenders. The hwarang go home grumbling.
        deeds: {war_with: [gaya], conquer: [gaya]}
    history: >-
      In 562 Silla conquered Daegaya, the last Gaya state; the hwarang Sadaham led the vanguard.
      The gayageum, Korea's zither, was brought to Silla by the Gaya musician Ureuk.
    diverged: >-
      Gaya is gone already.
    sources: ["Samguk sagi 44 (Sadaham)", "Samguk sagi 32 (music)"]
