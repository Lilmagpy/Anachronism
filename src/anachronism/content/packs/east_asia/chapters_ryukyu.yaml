schema_version: 1
# Chronicle mode (D-120, D-XXX): the Kingdom of Ryukyu, from the end of the great sea trade to
# the reforms of Sai On, 1560-1728. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Chuzan seikan (1650), the Rekidai hoan (the
# kingdom's diplomatic archive), and modern work by Kerr, Smits, Sakihara and Kamiya.
# The legend of the boiling of Jana Teido is told as a later tradition. Reigns follow the
# standard lists: Sho Gen (1556-72), Sho Ei (1573-88), Sho Nei (1589-1620), Sho Hou
# (1621-40), Sho Ken (1641-47), Sho Shitsu (1648-68), Sho Tei (1669-1709), Sho Eki
# (1710-12), Sho Kei (1713-51). Years of accession are approximate (+/- 1). The 1609
# conquest is told without a province changing hands: Ryukyu keeps its only province and
# its king, as in history. benchmark_provinces stays 1 throughout.
chapters:
  - id: ryu_south
    scenario: sengoku
    civ: ryukyu
    year: 1560
    title: "Ships to the South"
    place: "Naha harbour"
    speaker: steward
    speaker_name: "The Kume interpreters"
    speaker_title: "Families of Chinese pilots"
    benchmark_provinces: 1
    story: >-
      You are Sho Gen, thirty-two, king of Ryukyu. For a century and a half your ships have
      carried Chinese silk and porcelain to Japan, Japanese swords and silver to China, and
      pepper and sappanwood from Siam and Malacca, and have made Naha one of the richest
      ports of the eastern sea. The Chinese families of Kume, who first settled here under the
      Ming, pilot your ships and write your letters to the emperor.


      But the world is changing around you. Ming China has forbidden its own people to trade
      by sea, and pirates ravage its coast. Portuguese ships have been in Malacca for fifty
      years, and your southern voyages grow rarer. The Ming emperor still receives your
      tribute ships at Fuzhou.
    choices:
      - label: "Keep the tribute trade with China and turn more to Japan"
        historical: true
        wealth_bp: 500
        legitimacy_bp: 500
        outcome: >-
          Your ships go less often to Siam and Malacca; the last Ryukyuan ship recorded in Siam
          sails in 1570. China and Japan become your two worlds. The Satsuma lords across the
          water begin to ask for more.
      - label: "Spend the royal treasury on a fleet to the south"
        wealth_bp: -2000
        outcome: >-
          The ships go south, and come back poorer than they left. The Portuguese hold the
          ports.
    history: >-
      Ryukyu's southern voyages dwindled in the later sixteenth century, the last recorded
      ship to Siam going in 1570; the kingdom kept its Chinese tribute trade and traded more
      with Japan.
    sources: ["Rekidai hoan", "Kerr, Okinawa: The History of an Island People (1958)", "Sakihara, Okinawa Kokaishi (1987)"]

  - id: ryu_imjin
    scenario: sengoku
    civ: ryukyu
    year: 1591
    title: "Rice for Hideyoshi"
    place: "Shuri castle"
    speaker: shimazu
    speaker_name: "Satsuma's envoy"
    speaker_title: "Sent by the Shimazu"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      You are Sho Nei, twenty-seven, king of Ryukyu. Toyotomi Hideyoshi, who has united Japan,
      says that he will invade Ming China through Korea. The Shimazu of Satsuma, who have
      lost their wars and been made to serve him, are to pass on his orders to you: he wants
      seven thousand soldiers and ten months of food for them, to be sent to Kyushu.


      Your ministers are divided. Jana Teido, the chief of them, thinks your duty is to
      Ming, who has granted your crown for two centuries. Others say a Japanese army is a thing
      to be placated.
    choices:
      - label: "Send rice, but no soldiers, and warn the Ming secretly"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -1000
        outcome: >-
          You send about half of the food asked and nothing else, and your envoys carry word of
          Hideyoshi's plan to the Fuzhou authorities. The Shimazu are furious at how little
          comes. They file the matter away.
        deeds: {grudges: {shimazu: 1500}}
      - label: "Send what Hideyoshi asks, soldiers included"
        wealth_bp: -2500
        legitimacy_bp: -1500
        outcome: >-
          The ships leave Naha and do not come back easily. You are the vassal of a man who
          means to make war on your overlord.
      - label: "Refuse, and tell the Shimazu to deal with the Ming"
        legitimacy_bp: 500
        outcome: >-
          Satsuma's envoy goes home with a flat refusal. The Shimazu will not forget it.
        deeds: {grudges: {shimazu: 3000}}
    history: >-
      In 1591 Hideyoshi, through the Shimazu, demanded troops and ten months' food from
      Ryukyu; the kingdom supplied only part of the food and passed word of the planned
      invasion to the Ming.
    diverged: >-
      The Shimazu are gone.
    sources: ["Rekidai hoan", "Kerr, Okinawa: The History of an Island People (1958)"]

  - id: ryu_potato
    scenario: sengoku
    civ: ryukyu
    year: 1605
    title: "A Root from Fujian"
    place: "Kadena, Okinawa"
    speaker: scholar
    speaker_name: "Noguni Sokan"
    speaker_title: "Returned envoy"
    benchmark_provinces: 1
    story: >-
      You are Sho Nei, forty-one. Okinawa is a poor island for rice. Typhoons knock down the
      grain; droughts wither it; hunger is never far. An envoy back from Fuzhou, Noguni Sokan,
      has brought with him a plant unknown here: a creeping vine whose root is sweet and starchy,
      which the Chinese call a barbarian yam and which came to Fujian from the Spanish across
      the sea.


      He asks leave to give vines to farmers, and to plant them in dry soil nobody wants.
    choices:
      - label: "Plant the vines in the poor soil"
        historical: true
        food_bp: 2500
        unrest_bp: -1000
        outcome: >-
          The sweet potato grows where nothing else will, and survives typhoons. It will feed
          the islands in bad years, and for centuries the farmers will remember Sokan, and a
          farmer called Gima Shinjo who spread it.
      - label: "Leave it to the gardens of the nobles"
        food_bp: 300
        outcome: >-
          The root is curious in a lord's garden. The farmers continue as before.
    history: >-
      Noguni Sokan brought sweet potatoes from Fujian in 1605; they spread through Ryukyu and
      later to Satsuma and Japan.
    sources: ["Chuzan seikan", "Kerr, Okinawa: The History of an Island People (1958)"]

  - id: ryu_1609
    scenario: sengoku
    civ: ryukyu
    year: 1609
    title: "Three Thousand Men and a Hundred Ships"
    place: "Shuri castle"
    speaker: shimazu
    speaker_name: "Shimazu Tadatsune"
    speaker_title: "Lord of Satsuma"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      You are Sho Nei, forty-five. Tokugawa Ieyasu, the new ruler of Japan, wants trade with
      Ming China, and he wants Ryukyu's help. You have not sent an envoy of thanks to his court,
      nor given him what he asked. The Shimazu, who owe him a favour, have won his leave to
      punish you.


      In the spring Satsuma's fleet - a hundred ships and about three thousand men, with
      muskets - sails south. The northern islands fall without a fight. A Satsuma army lands
      in the north and burns the castle of Nakijin. You have swords, spears and some old guns, and an army
      that has not fought a war in generations.
    choices:
      - label: "Open the gates of Shuri to save the city"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          After a few days' resistance you surrender the castle. The Satsuma army takes the
          treasury and your chief ministers, and sets you on a ship for Kagoshima as a captive.
          Satsuma does not
          take the throne from you; it needs a king, for the Ming will trade only with a king.
        deeds: {grudges: {shimazu: 1000}}
      - label: "Fight in the hills and at the castle"
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          Your army cannot stand against the muskets. The castle falls anyway, with the
          fighting costlier on both sides.
    history: >-
      In 1609 the Shimazu invaded Ryukyu with the Tokugawa shogunate's leave. King Sho Nei
      surrendered Shuri and was taken to Kagoshima.
    diverged: >-
      The Shimazu are gone.
    sources: ["Chuzan seikan", "Kerr, Okinawa: The History of an Island People (1958)", "Smits, Visions of Ryukyu (1999)"]

  - id: ryu_oath
    scenario: sengoku
    civ: ryukyu
    year: 1611
    title: "The Oath of Fifteen Articles"
    place: "Kagoshima"
    speaker: shimazu
    speaker_name: "Shimazu Tadatsune"
    speaker_title: "Lord of Satsuma"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      You are Sho Nei, forty-seven. You have been taken to Sunpu, where Ieyasu received you, and
      to Edo, where the shogun Hidetada did. Now you are back at Kagoshima, and the Shimazu will
      let you go home. They require a pledge of loyalty to Satsuma, to be signed by you and by
      your ministers, together with fifteen articles: no trade without Satsuma's leave, no
      Ryukyuan officer to take rank without it, and a rice tax laid on your islands.


      Jana Teido, your chief minister, refuses to sign. He says Ryukyu belongs to the king and
      to the Ming emperor, not to Satsuma.
    choices:
      - label: "Sign the oath, and go home"
        historical: true
        legitimacy_bp: -1500
        wealth_bp: -1000
        outcome: >-
          Jana Teido is put to death in Kagoshima; a later tradition says he was boiled in a
          cauldron, and calls him a hero of Okinawa. The rest sign. You go home to Shuri, still
          king. Satsuma keeps the northern islands of Amami, sends officials to Naha, and
          surveys your land for rice. But the Ming court is not told. You go on being
          an obedient tributary of China.
      - label: "Refuse, with Jana Teido"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          The Shimazu are patient. You remain at Kagoshima, and your ministers wait at home for
          a king who does not come.
    history: >-
      Sho Nei and his ministers signed a Satsuma oath in 1611; Jana Teido refused and was
      executed. Satsuma took the Amami islands and from then on controlled Ryukyu's trade,
      while the kingdom remained a Ming tributary.
    diverged: >-
      The Shimazu are gone.
    sources: ["Chuzan seikan", "Kerr, Okinawa: The History of an Island People (1958)", "Smits, Visions of Ryukyu (1999)"]

  - id: ryu_envoys
    scenario: sengoku
    civ: ryukyu
    year: 1663
    title: "The Investiture, and What the Envoys Must Not See"
    place: "Shuri castle"
    speaker: steward
    speaker_name: "The Sanshikan, your council of three"
    speaker_title: "Chief ministers"
    benchmark_provinces: 1
    story: >-
      You are Sho Shitsu, thirty-four, king of Ryukyu. The Ming empire fell nineteen years ago.
      For a time Ryukyu waited, and then it sent tribute to the new Qing court at Beijing. Now
      an investiture mission has come from China to crown you, the first of its kind from the
      Qing: hundreds of Chinese officials and sailors, who will stay for months at Naha.


      Satsuma officials live in your kingdom, and Japanese books and goods and Japanese
      habits are everywhere in Shuri. Your ministers know what Satsuma wants: that China should
      learn nothing of it.
    choices:
      - label: "Hide every sign of Satsuma while the envoys stay"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Japanese books are packed away, Satsuma residents are asked to keep indoors, and
          the envoys go home with a good report. This is the pattern for two centuries: Ryukyu
          serves two masters and shows each only one face.
      - label: "Tell the Qing envoys the truth"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          The envoys are polite and keep silent. In Kagoshima the news is received in a very
          different way.
    history: >-
      Ryukyu was invested by the Qing in 1663 (Kangxi 2) while hiding Satsuma's influence from
      the Chinese mission, a practice repeated at each investiture.
    sources: ["Rekidai hoan", "Smits, Visions of Ryukyu (1999)", "Kamiya, Ryukyu-shi (1992)"]

  - id: ryu_saion
    scenario: sengoku
    civ: ryukyu
    year: 1728
    title: "A Scholar of Kume"
    place: "Shuri castle"
    speaker: scholar
    speaker_name: "Sai On"
    speaker_title: "Tutor to the royal house"
    benchmark_provinces: 1
    story: >-
      You are Sho Kei, twenty-eight, king of Ryukyu. Your kingdom has now lived under two
      masters for more than a century. Shuri was burnt in 1709 and has been rebuilt, with
      great costs. The forests have been cut and the rivers carry the soil down in floods. The
      rice tax to Satsuma must be paid every year.


      Sai On, a scholar from the Chinese families of Kume who was your own tutor, has studied
      the books of the Confucian classics and the practice of government in China and Japan.
      He tells you that a state which is small must be well ruled, and offers a plan: to
      plant forests, protect rivers, mend the irrigation and make the officials honest.
    choices:
      - label: "Make Sai On a member of the Sanshikan, the council of three"
        historical: true
        legitimacy_bp: 1500
        food_bp: 1500
        materials_bp: 1000
        unrest_bp: -1000
        outcome: >-
          Sai On sits on the council for the next quarter of a century. Forests are replanted
          and guarded by law, rivers are straightened and embanked, and the officials are
          taught to write the plain edicts that all can follow. Ryukyu stays small and
          stays poor, but the islands are ready to meet the century.
      - label: "Leave the council to the old lords"
        legitimacy_bp: -500
        outcome: >-
          The old lords thank you. The rivers go on flooding.
    history: >-
      Sai On became a member of the Sanshikan in 1728 and held office until 1752; he is
      remembered for forestry, river and irrigation works and for a reform of administration.
    sources: ["Kerr, Okinawa: The History of an Island People (1958)", "Smits, Visions of Ryukyu (1999)"]
