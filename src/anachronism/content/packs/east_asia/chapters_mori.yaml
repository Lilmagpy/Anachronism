schema_version: 1
# Chronicle mode (D-120, D-183): the Mori of Aki, from Motonari's letter to his sons to
# Sekigahara, 1560-1600. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Mori family documents (Mori-ke monjo), including
# Motonari's admonition of 1557, the Shincho koki, Frois, the Korean and Japanese records of
# the Imjin war, and modern work by Berry, Conlan, Turnbull and Kishida. benchmark_provinces
# counts the provinces of this map the real Mori held at that date.
chapters:
  - id: mori_arrows
    scenario: sengoku
    civ: mori
    year: 1560
    title: "A Letter to Three Sons"
    place: "Yoshida-Koriyama castle, Aki"
    speaker: general
    speaker_name: "Kobayakawa Takakage"
    speaker_title: "Your third son"
    benchmark_provinces: 2
    story: >-
      You are Mori Motonari. You were a minor lord in the hills of Aki; by marriage, adoption,
      murder and war you have made yourself master of the west of Honshu. Five years ago, at
      Itsukushima, you lured an army five times the size of yours onto a holy island and
      destroyed it in a storm.


      You are sixty-three. You have put your second son into the Kikkawa family and your third
      into the Kobayakawa, so that both great houses are yours. What will hold your three sons
      together when you are gone?
    choices:
      - label: "Write them a letter of advice"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          You have already written it: fourteen articles, telling Takamoto, Motoharu and
          Takakage that the Mori name comes first, that the Kikkawa and Kobayakawa must serve
          it, and that if they quarrel all three houses will fall. Later storytellers turn it
          into three arrows: one breaks easily, three together do not. The brothers never
          quarrel.
      - label: "Make the eldest master of the others"
        legitimacy_bp: 500
        unrest_bp: 500
        influence: {nobility: -1000}
        outcome: >-
          Takamoto gives orders, and his brothers obey, with long faces.
      - label: "Bind them with oaths sworn at a shrine"
        legitimacy_bp: 1500
        unrest_bp: -500
        influence: {clergy: 300}
        outcome: >-
          The three brothers swear before the gods to stand together, and are married into houses
          that will hold them to it. The oaths are solemn, and rather less detailed than a written
          rule would be. The oaths are widely admired, and the house is calm.
    history: >-
      Motonari's admonition to his three sons (1557) urged them to stand together for the
      Mori; the 'three arrows' story is a later embellishment.
    sources: ["Mori Motonari, Sanshi kunkai jo (1557)", "Kishida, Mori Motonari (2014)"]

  - id: mori_ginzan
    scenario: sengoku
    civ: mori
    year: 1562
    title: "The Silver Mountain"
    place: "Iwami"
    speaker: steward
    speaker_name: "Your mine stewards"
    speaker_title: "From Iwami"
    needs_alive: [amago]
    benchmark_provinces: 2
    story: >-
      Iwami Ginzan, the silver mountain on the Sea of Japan, is the richest mine in Japan.
      Thirty years ago a merchant from Hakata brought in Korean smelters who taught the miners
      to separate silver with lead, and now its silver goes to China and to the Portuguese.
      The Amago and you have fought over it for years.


      Amago Haruhisa has died suddenly. His son is young.
    choices:
      - label: "Seize the silver mountain from the Amago"
        historical: true
        wealth_bp: 3500
        legitimacy_bp: 500
        outcome: >-
          Iwami Ginzan is yours, and its silver pays for every war you fight from now on.
          Portuguese maps begin to mark the 'silver mines' of the kingdom of Japan.
        deeds: {grudges: {amago: 2000}}
      - label: "Make peace with the Amago and share the mine"
        wealth_bp: 3200
        legitimacy_bp: 300
        outcome: >-
          The silver is shared, and the Amago rebuild their strength. The Amago's share is smaller
          than they hoped, and the silver flows.
      - label: "Strike at Izumo while the Amago are weak"
        legitimacy_bp: 500
        unrest_bp: 500
        wealth_bp: -500
        outcome: >-
          The army marches into the Amago heartland instead of the mine. The silver can wait, you
          say; a broken enemy can be dealt with at leisure.
        deeds: {men: 8000}
    history: >-
      After Amago Haruhisa's death (1561), Mori Motonari secured the Iwami silver mine
      (1562), one of the largest silver sources of the age.
    diverged: >-
      The Amago are gone.
    sources: ["Iwami Ginzan records", "Kishida, Mori Motonari (2014)"]

  - id: mori_gassan
    scenario: sengoku
    civ: mori
    year: 1566
    title: "The Moon-Mountain Castle"
    place: "Before Gassan-Toda castle, Izumo"
    speaker: general
    speaker_name: "Kikkawa Motoharu"
    speaker_title: "Your second son"
    needs_alive: [amago]
    benchmark_provinces: 3
    story: >-
      The Amago have shut themselves up in Gassan-Toda, their mountain castle, too steep to
      storm. You have surrounded it for over a year, and refused to let the people inside
      out, so that there are more mouths to feed. Some of the garrison have begun to escape
      to you; you have had them sent back, to starve with the rest.


      The castle is starving. A young Amago retainer, Yamanaka Shikanosuke, has fought one of
      your champions in single combat at the river, and won.
    choices:
      - label: "Take the castle on terms of surrender"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Amago Yoshihisa gives up the castle and is sent to a temple. Izumo is yours. Yamanaka
          Shikanosuke prays to the new moon: "Give me seven hardships and eight sorrows" - and
          spends twelve years trying to bring the Amago back, until he is murdered on the way
          to a Mori prison.
        deeds: {conquer: [amago]}
      - label: "Storm the castle at once"
        materials_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Six thousand more men are sent up the mountain, and die on its walls. The castle holds
          another winter.
        deeds: {men: 6000}
      - label: "Tighten the siege through another winter"
        legitimacy_bp: 2000
        food_bp: -500
        outcome: >-
          Your lines are strengthened and the blockade is made close. The Amago are starved, but
          it takes time, and the army needs feeding too. Your captains admire the discipline, and
          the Amago starve out in time.
        deeds: {men: 3000}
    history: >-
      Gassan-Toda surrendered to Motonari in 1566, ending the Amago as a power; Yamanaka
      Shikanosuke led attempts to restore them until his death in 1578.
    diverged: >-
      The Amago are gone.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: mori_motonari
    scenario: sengoku
    civ: mori
    year: 1571
    title: "Do Not Seek the Realm"
    place: "Yoshida-Koriyama castle"
    speaker: steward
    speaker_name: "Mori Terumoto"
    speaker_title: "Your grandson and heir, eighteen"
    benchmark_provinces: 3
    story: >-
      You are seventy-four, and dying. Your eldest son Takamoto died eight years ago; his son
      Terumoto, eighteen, will be lord of ten provinces. In Kyoto, Oda Nobunaga has put his
      own shogun in power and is fighting everyone.


      Terumoto asks for your last advice.
    choices:
      - label: "Tell him to keep what the Mori hold"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You tell him: keep what we hold; never try to rule the whole country; let the uncles
          guide you. You die that summer. For years the Mori stay out of the struggle for
          Kyoto, until Nobunaga comes to them.
      - label: "Tell him to march on Kyoto"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Terumoto's uncles exchange looks. Eight thousand men are mustered, and the army begins
          to prepare for the road east.
        deeds: {men: 8000, grudges: {oda: 2000}}
      - label: "Tell him to make terms with Nobunaga"
        legitimacy_bp: 500
        outcome: >-
          You advise paying court to the new master of Kyoto and keeping the peace with him.
          Terumoto's uncles approve, and think he need not hurry.
        deeds: {peace_with: [oda]}
    history: >-
      Motonari died in 1571, having told his heirs to preserve the house rather than seek
      national power.
    sources: ["Mori-ke monjo", "Berry, Hideyoshi (1982)"]

  - id: mori_kizugawa
    scenario: sengoku
    civ: mori
    year: 1576
    title: "Fire Pots at Kizugawa"
    place: "The mouth of the Kizu river, Osaka bay"
    speaker: general
    speaker_name: "Murakami Takeyoshi"
    speaker_title: "Lord of the Murakami sea-captains"
    needs_alive: [oda]
    benchmark_provinces: 3
    story: >-
      You are Mori Terumoto. Nobunaga is besieging the fortress-temple of Ishiyama Honganji, at
      Osaka, where the warrior monks of the True Pure Land sect have held out against him for
      six years. His ships blockade the river mouth. The monks ask you to bring them food.


      The Murakami, pirate lords of the Inland Sea who now sail for you, have a weapon: clay
      pots full of gunpowder, thrown by hand or sling onto enemy decks.
    choices:
      - label: "Send the fleet with the rice"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          Your fleet burns the Oda ships at the river mouth and carries the rice into the
          fortress. Nobunaga does not take a defeat quietly: two years later he sends six great
          ships plated with iron, and they beat your fleet in the same waters.
        deeds: {ships: 20, grudges: {oda: 2500}}
      - label: "Stay out of Nobunaga's quarrel"
        legitimacy_bp: -1000
        food_bp: 500
        outcome: >-
          The monks hold out without your rice, for a while. Nobunaga notes who did not help him,
          and the Mori rice stays in the granaries.
        deeds: {peace_with: [oda]}
      - label: "Send the rice in merchant boats alone"
        legitimacy_bp: 1000
        food_bp: -1000
        wealth_bp: -500
        outcome: >-
          The rice goes by quiet routes in many small boats, without the fleet. Some of it
          arrives, and Nobunaga's ships take much of the rest. Your captains approve of the quiet
          help.
    history: >-
      In 1576 the Mori fleet, with the Murakami, defeated the Oda blockade at the first battle
      of Kizugawaguchi; Oda's armoured ships won the second (1578).
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki 9", "Turnbull, Fighting Ships of the Far East 2 (2003)"]

  - id: mori_takamatsu
    scenario: sengoku
    civ: mori
    year: 1582
    title: "A Castle in a Lake"
    place: "Takamatsu castle, Bitchu"
    speaker: general
    speaker_name: "Shimizu Muneharu"
    speaker_title: "Commander of Takamatsu castle"
    needs_alive: [oda]
    benchmark_provinces: 3
    story: >-
      Nobunaga's general Hashiba Hideyoshi has surrounded Takamatsu castle with a dyke two
      miles long and turned a river into it. The castle stands in a lake that rises every day
      of the rainy season. Your relief army can only watch from the hills.


      Hideyoshi has offered peace: give up five provinces, and the life of the castle's
      commander, Shimizu Muneharu. Muneharu says he will gladly die to save his men. Then a
      strange thing: Hideyoshi suddenly wants peace at once, and asks less.
    choices:
      - label: "Make peace on Hideyoshi's terms"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Muneharu rows out into the lake in a small boat, dances, writes a farewell poem and
          cuts himself open, in sight of both armies. The next day you learn why Hideyoshi was
          in a hurry: Nobunaga was killed at Honno-ji three days ago. Hideyoshi is already
          racing east. Your uncles decide not to follow him. In a few years he is master of
          Japan, and you are his loyal vassal.
        deeds: {peace_with: [oda]}
      - label: "Hold out for better terms"
        legitimacy_bp: 300
        food_bp: -1500
        outcome: >-
          The water keeps rising. Hideyoshi's envoys come back every day, more nervous each
          time.
      - label: "Break the dyke with a night attack"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your men creep down from the hills in the rain to cut the long dyke and let the water
          out. The attempt is bold, and Hideyoshi's guards are watchful.
        deeds: {men: 8000}
    history: >-
      Hideyoshi's flooding of Takamatsu castle (1582) ended with Shimizu Muneharu's suicide and
      a peace concluded as news of Nobunaga's death arrived.
    diverged: >-
      The Oda are gone.
    sources: ["Taikoki", "Berry, Hideyoshi (1982)"]

  - id: mori_korea
    scenario: sengoku
    civ: mori
    year: 1592
    title: "Thirty Thousand Men for Korea"
    place: "Hiroshima, your new castle town"
    speaker: general
    speaker_name: "Kobayakawa Takakage"
    speaker_title: "Your uncle, sixty"
    benchmark_provinces: 3
    story: >-
      You have built a new castle and a new town at the mouth of the Ota river, and called it
      Hiroshima. Now Hideyoshi, master of Japan, has ordered the invasion of Korea and China,
      and the Mori must send thirty thousand men.


      Your uncle Takakage, who has never lost a battle, will command them.
    choices:
      - label: "Send the full levy under your uncle"
        historical: true
        wealth_bp: -2500
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          The Mori army holds the south-west of Korea. At Byeokjegwan in 1593 Takakage beats a
          Ming army sent to retake Seoul. In the end the war achieves nothing, and the men who
          come home are fewer than the men who went.
      - label: "Plead poverty and send fewer men"
        legitimacy_bp: -1500
        wealth_bp: 1000
        outcome: >-
          Hideyoshi's inspectors count your soldiers on the beach at Nagoya, and write down the
          number.
      - label: "Send silver and rice instead of men"
        legitimacy_bp: 200
        wealth_bp: -2000
        food_bp: -1000
        outcome: >-
          Supply ships go to Nagoya instead of troops. Hideyoshi accepts the grain, and notes the
          missing soldiers. Hideyoshi is satisfied with the supplies.
    history: >-
      The Mori sent some 30,000 men to Korea in 1592; Kobayakawa Takakage won at Byeokjegwan
      in 1593.
    sources: ["Swope, A Dragon's Head and a Serpent's Tail (2009)", "Turnbull, The Samurai Invasion of Korea (2008)"]

  - id: mori_sekigahara
    scenario: sengoku
    civ: mori
    year: 1600
    title: "The Commander Who Stayed in Osaka"
    place: "Osaka castle"
    speaker: general
    speaker_name: "Kikkawa Hiroie"
    speaker_title: "Your cousin, son of Motoharu"
    benchmark_provinces: 1
    story: >-
      Hideyoshi is dead, and Tokugawa Ieyasu is making himself master. The western lords have
      made you their commander-in-chief, and you hold Osaka castle with Hideyoshi's little
      son. Your army is on the mountain of Nangu, above the field of Sekigahara.


      Your cousin Hiroie has quietly told Ieyasu that the Mori army will not fight, if Ieyasu
      leaves the Mori their lands. He asks you to stay in Osaka.
    choices:
      - label: "Remain in Osaka and keep the army still"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          On the day of the battle Hiroie's troops block the path down the mountain, and the
          Mori army sits and eats its lunch while the west is destroyed. Ieyasu keeps his word
          only to Hiroie: you lose seven of your ten provinces, and keep Suo and Nagato. You
          shave your head. Two and a half centuries later, Mori samurai will bring the Tokugawa
          down.
        deeds: {give: [j_aki, j_izumo]}
      - label: "Ride to Sekigahara with Hideyori's banner"
        legitimacy_bp: 1000
        unrest_bp: 2000
        outcome: >-
          You ride out of Osaka with Hideyoshi's son's standard. When it appears above the
          field, half the eastern lords waver.
        deeds: {men: 10000}
      - label: "Declare neutrality and take the army home to Aki"
        legitimacy_bp: -1500
        wealth_bp: -500
        unrest_bp: 300
        outcome: >-
          You recall the army from Nangu and write to both sides that the Mori take no part.
          Neither side is pleased to be refused.
    history: >-
      Mori Terumoto, nominal commander of the Western Army, remained in Osaka during
      Sekigahara (1600); Kikkawa Hiroie kept the Mori troops out of the battle. The Mori lost
      most of their domain but survived, and Choshu led the overthrow of the shogunate in
      1868.
    sources: ["Kikkawa-ke monjo", "Bryant, Sekigahara 1600 (1995)", "Conlan, in Japan Emerging (2012)"]
