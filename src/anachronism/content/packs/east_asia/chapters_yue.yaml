schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Yue, from King Wujiang's war to the
# kingdom of Minyue, about 336-202 BC. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow Sima Qian's Shiji (ch. 41, Goujian of
# Yue; ch. 6, the First Emperor; ch. 114, Minyue and Dongyue). The date of Wujiang's defeat
# is debated: the Shiji ties it to King Wei of Chu (died 329), the scenario's Chu chapter
# uses 334, and some historians put it much later (the scenario's Chu script says c. 306).
# The Qi envoy's visit is placed shortly before; the names and dates of Wujiang's
# predecessors and of the clan's heirs are not recorded, so the heir is left unnamed.
# Wuzhu and Yao are named in Shiji 114. benchmark_provinces counts the provinces of this map
# the real Yue (and, from 222, the house of Goujian's chiefs) held at that date.
chapters:
  - id: yue_envoy
    scenario: warring_states
    civ: yue
    year: -336
    title: "The Envoy from Qi"
    place: "Wu"
    speaker: qi
    speaker_name: "An envoy of King Wei of Qi"
    speaker_title: "Guest at your court"
    benchmark_provinces: 2
    story: >-
      You are King Wujiang of Yue, heir of Goujian, who broke Wu and made Yue a power in the
      east. Your ancestors' wars are a century old, but the Shiji says that in your time Yue
      marched north against Qi and west against Chu, to contend with the great states of the
      middle plain. Your fleets move on the rivers and the sea, and your swordsmiths are the
      best in the world.


      An envoy has come from King Wei of Qi. He says that Qi is not your true enemy. Chu, he
      says, is the state whose strength stands in the way of everyone, and a Yue that
      strikes Chu will find friends in the north. It is a clever speech, and you cannot tell
      whether he serves Qi, or you.
    choices:
      - label: "Turn your army against Chu"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          You leave Qi alone and march on Chu. The Shiji says that Yue gave up its war on Qi
          and attacked Chu instead. King Wei of Chu rises to meet you.
        deeds: {grudges: {chu: 1500}}
      - label: "Attack Qi as you had planned"
        legitimacy_bp: 300
        outcome: >-
          You send the envoy home and send eight thousand men north. Qi's king is not pleased,
          and the road to the north is long. Chu watches the quarrel with interest.
        deeds: {men: 8000, grudges: {qi: 800}}
      - label: "Keep out, and build the fleet"
        legitimacy_bp: 300
        wealth_bp: -600
        outcome: >-
          You thank the envoy, give him gifts, and go back to your shipyards. Qi and Chu are
          left to their own quarrels, and your ships grow more numerous.
        deeds: {ships: 20}
    history: >-
      King Wujiang of Yue was persuaded by an envoy of King Wei of Qi to attack Chu rather
      than Qi (Shiji 41; the exact year is debated).
    sources: ["Shiji 41 (Goujian of Yue)", "Zhanguo ce, Qi"]

  - id: yue_defeat
    scenario: warring_states
    civ: yue
    year: -334
    title: "King Wei of Chu"
    place: "The Yue frontier"
    speaker: general
    speaker_name: "Your commander in the field"
    speaker_title: "General of the western army"
    benchmark_provinces: 1
    story: >-
      You are King Wujiang of Yue. Chu's King Wei has raised an army and has come to meet
      you, and it is not a small one. Your ships are in the rivers and the old lands of Wu lie
      behind them, rich and open. Your commander says the men of Yue fight well in boats
      and in the marshes, and that nobody has beaten them at that. He says it is not the same
      on dry land.
    choices:
      - label: "Give battle to the army of Chu"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Chu defeats you. The Shiji says that King Wei destroyed the army of Yue, killed
          King Wujiang, took all the old land of Wu as far as the Zhe river, and beat Qi at
          Xuzhou in the north. Yue is broken. You are killed, and the Wu country goes to Chu.
        deeds: {give: [yue_wu], give_to: chu, ruler_falls: "is killed in the war with Chu"}
      - label: "Withdraw south and give up the Wu country for peace"
        legitimacy_bp: -1200
        unrest_bp: 600
        outcome: >-
          You pull back to Kuaiji and send gifts. Chu takes the lands of Wu and does not
          pursue you into the south.
        deeds: {give: [yue_wu], give_to: chu, peace_with: [chu]}
      - label: "Fight from the rivers and marshes"
        legitimacy_bp: -1000
        unrest_bp: 800
        wealth_bp: -1500
        outcome: >-
          You pull the army back into the water country, where Chu's heavy columns cannot
          follow easily, and fight from your boats. It is a long and costly war and the fields
          of Wu are burned.
        deeds: {martial_bp: -800}
    history: >-
      King Wei of Chu defeated Yue and killed King Wujiang, seizing the old land of Wu
      (Shiji 41). The date is traditionally about 334-333 BC; some historians put it later.
    sources: ["Shiji 41 (Goujian of Yue)", "Shiji 40 (Chu)"]

  - id: yue_scattered
    scenario: warring_states
    civ: yue
    year: -328
    title: "The Sons of the Clan"
    place: "Kuaiji"
    speaker: steward
    speaker_name: "An elder of the royal clan"
    speaker_title: "Keeper of the ancestral temple"
    benchmark_provinces: 1
    story: >-
      You are a prince of the house of Goujian. The king is dead and the Wu country is lost,
      and the Shiji says that the sons of the clan are now quarrelling over what is left.
      Some call themselves king, some lord; they have scattered along the rivers and the sea
      coast of the south. Chu is in the north, and it is strong.


      Your elder says that the temple of Goujian is on the hill at Kuaiji and that it must be
      kept. A house that cannot be a kingdom may still be a house, and the coast is a long
      one.
    choices:
      - label: "Hold the coast as a lord and pay court to Chu"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          You do homage to Chu and keep your temple, your boats and your hill. The Shiji says
          the clan of Yue scattered in just this way, and that they paid court to Chu while
          they lived along the shore of the southern sea.
      - label: "Keep the title of king and defy Chu"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          You keep the title, and the title brings a Chu army to ask for it.
        deeds: {grudges: {chu: 1500}}
      - label: "Sail south with the clan to the Min coast"
        legitimacy_bp: -300
        wealth_bp: -500
        outcome: >-
          You load the clan's household, shrine vessels and ships and sail south, far from
          Chu. The Min coast is poor and its tribes are strangers, but nobody follows you
          there.
        deeds: {ships: 15}
    history: >-
      After Wujiang's death the clan of Yue split; the Shiji says that some took the title of
      king and some of lord, along the Yangtze's south and the sea coast, and paid court to
      Chu.
    sources: ["Shiji 41 (Goujian of Yue)"]

  - id: yue_qin
    scenario: warring_states
    civ: yue
    year: -222
    title: "The General Wang Jian"
    place: "Kuaiji"
    speaker: general
    speaker_name: "A captain of Yue"
    speaker_title: "Of the coast watch"
    benchmark_provinces: 1
    story: >-
      You are the lord of Yue, a descendant of Goujian, in a land where the old kings are
      remembered and their power is not. Qin has taken Chu, and Qin's general Wang Jian is
      moving south of the great river with an army.


      Your captain says that the Yue are good in boats and in the mountains, and that Qin
      has crossbows and numbers. The old men say the clan has bent before Chu for a hundred
      years, and can bend again.
    choices:
      - label: "Submit to Qin"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          You surrender, and the Shiji says that Wang Jian received the submission of the
          lord of Yue and made his country the commandery of Kuaiji. The temple is
          allowed to stand. The clan's lords withdraw to the south, among the mountains.
        deeds: {ruler_falls: "submits to Qin"}
      - label: "Retreat into the mountains"
        legitimacy_bp: -1200
        wealth_bp: -500
        outcome: >-
          You leave the coast to the Qin army and go south with the clan, to the mountains of
          Min. The Qin army does not follow far, and the coast's wealth is left behind.
        deeds: {ruler_falls: "withdraws to the mountains of Min"}
      - label: "Give battle at the river crossing"
        legitimacy_bp: -1800
        outcome: >-
          Your boats and archers hold the crossing for a few days. Qin's crossbows and numbers
          tell, and the clan's lords pay for the stand.
        deeds: {men: 12000}
    history: >-
      In 222 BC Wang Jian settled Chu's lands south of the Yangtze, received the surrender of
      the lord of Yue and set up Kuaiji commandery (Shiji 6).
    sources: ["Shiji 6 (First Emperor)"]

  - id: yue_wuzhu
    scenario: warring_states
    civ: yue
    year: -209
    title: "Wuzhu and Yao"
    place: "Minzhong"
    speaker: general
    speaker_name: "Yao, a kinsman"
    speaker_title: "Chief of the Yue"
    benchmark_provinces: 1
    story: >-
      You are Wuzhu, descended from King Goujian of Yue. Qin has abolished the kings of the
      south and has made the likes of you into mere chiefs, whose land is now Minzhong
      commandery. You and your kinsman Yao keep the Yue people together on the coast. Now
      all the east is rising against the Second Emperor.


      The magistrate of Poyang, Wu Rui, known as the Lord of Po, is raising an army, and
      the Yue are being asked to join him. Qin is far, and its garrisons weak. Chu's
      Xiang Yu is the real master of the rebellion, and your kinsman says that Xiang Yu is
      not a man who shares his titles.
    choices:
      - label: "Join the Lord of Po against Qin"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You and Yao lead the Yue people to Wu Rui and fight with the lords to bring down
          Qin. When the war is won Xiang Yu, who now gives out the titles, does not make
          you a king; for that reason, the Shiji says, the Yue do not follow Chu.
      - label: "Stay in the south and wait"
        legitimacy_bp: -300
        outcome: >-
          You keep your people home. The war goes on without you, and when it is over nobody
          owes you a title.
      - label: "Raise the Yue for yourself, and take the coast"
        legitimacy_bp: 1000
        wealth_bp: 600
        unrest_bp: 800
        outcome: >-
          You raise the clans of the coast under your own banner and drive out the Qin
          officials. You have a little kingdom and a large number of rivals.
        deeds: {men: 8000}
    history: >-
      Wuzhu and Yao, descended from Goujian, were demoted by Qin to chiefs and joined the Lord
      of Po in the rebellion against Qin. Xiang Yu, in charge of the new titles, did not make
      them kings, so they did not side with Chu (Shiji 114).
    sources: ["Shiji 114 (Minyue and Dongyue)"]

  - id: yue_minyue
    scenario: warring_states
    civ: yue
    year: -202
    title: "The King of Minyue"
    place: "Ye"
    speaker: ruler
    benchmark_provinces: 1
    story: >-
      You are Wuzhu. Xiang Yu is beaten, and the Han king, who fought him, has become
      emperor. You and Yao, with the Yue people, helped Han against Chu, and now Han is giving
      out kingdoms.


      It is the fifth year of the Han reign. Your old land of Minzhong is empty of Qin. Han's
      emperor can restore you as king there, and he asks what you will do for him.
    choices:
      - label: "Accept the kingdom of Minyue under Han"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Emperor Gaozu of Han makes you King of Minyue, with the old land of Minzhong, and
          you hold your court at Ye. Goujian's sacrifices are yours to keep. Your cousin Yao
          will be made King of Dongyue a few years later.
        deeds: {take: [min_yue]}
      - label: "Ask for the lands of Wu and Yue as well"
        legitimacy_bp: -300
        outcome: >-
          You ask for the whole of Goujian's old lands. The envoys are polite, and the
          emperor does not reply. You are given the same Minzhong in the end, but the clan has
          lost a little of its favour.
        deeds: {take: [min_yue]}
      - label: "Take Minzhong and call yourself king before Han names you"
        legitimacy_bp: 1800
        wealth_bp: 300
        outcome: >-
          You take the old land of Minzhong, declare yourself its king and send word to Han
          afterwards. Han's court is not pleased, but is not in a position to argue.
        deeds: {take: ["min_yue"], men: 6000, grudges: {han: 1500}}
    history: >-
      In 202 BC (the fifth year of the Han reign) Gaozu restored Wuzhu as King of Minyue,
      ruling the old Minzhong country from Ye (Shiji 114). Minyue lasted until Han Wudi ended
      it in 110 BC.
    sources: ["Shiji 114 (Minyue and Dongyue)"]
