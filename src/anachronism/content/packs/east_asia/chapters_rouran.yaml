schema_version: 1
# Chronicle mode (D-120, D-XXX): the Rouran khaganate on the steppe, from Shelun's title to
# the Türk revolt, 402-552. Each chapter opens in its year; one choice is what history chose
# (historical: true). The Rouran left no writing of their own that survives: the facts follow
# the Wei shu ch. 103 (Ruanruan zhuan), the Wei shu annals, the Qi shu ch. 59, the Zhou shu
# ch. 50 and the Zizhi tongjian, all written by their enemies, with modern work by Golden,
# Sinor, Di Cosmo and Pearce, so the story is the Chinese one. Dates are traditional;
# ages are approximate (the sources give none); the khagans' names are the Chinese forms.
# The chapter of 428 tells the great Wei campaign of 429 on the two-year grid. The brief rule of Buluzhen in 414 is left out. Chounu was killed in 520; the ruler line has
# his death in 519 so that the chapter of 520 opens as Anagui (see the two-year grid), and
# Anagui's own ten-day first reign, his flight to Wei and his restoration (521) are told in
# that chapter. Anagui died in the first months of 552; the ruler line has 553 so that he is still the ruler when the chapter of 552 opens. benchmark_provinces counts the
# provinces of this map the real Rouran held; the map has only the steppe core for them
# (the khaganate's reach to the Tarim and Manchuria falls outside it).
chapters:
  - id: rou_khagan
    scenario: three_kingdoms
    civ: rouran
    year: 402
    title: "Qiudoufa Khagan"
    place: "The steppe north of the Gobi"
    speaker: general
    speaker_name: "One of your clan chiefs"
    speaker_title: "Of the Yujiulü"
    benchmark_provinces: 1
    story: >-
      You are Shelun, of the Yujiulü, a people of herdsmen with no name in the histories until
      the Tuoba of Wei began to burn them out. Your brother Heduohan was beaten and killed by a
      Wei general, and in 394 you fled west across the Gobi. Five years later the Wei beat you
      again, and you fled further.


      Since then you have gathered the tribes of the northern grassland, and beaten the
      Tiele, who have herds beyond counting. The Wei shu says that your power now runs from
      Yanqi in the west to Korea in the east, and from the Gobi in the south to the Han Sea in
      the north. You have been a chief among chiefs. Your men say it is time to be more.
    choices:
      - label: "Take the title of khagan, and drill the army"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          In 402 you take the title Qiudoufa Khagan; the Wei shu gives its sense as something
          like "he who holds the reins and opens wide". You divide the army in the manner of
          the Xiongnu: a thousand men to a unit, with a commander, and a hundred to a company.
          Whoever is first up the enemy's wall is given what is plundered. The Wei shu says
          that a man who ran away had his head broken with a stone. The Tuoba, who call you the
          Ruanruan, the wriggling insects, will learn what they have made.
        deeds: {martial_bp: 1000}
      - label: "Stay a chief, and send tribute to the Wei"
        legitimacy_bp: -500
        wealth_bp: -800
        outcome: >-
          Tuoba Gui accepts your gifts. You have bought a few years of quiet, and the other
          chiefs wonder whom you serve.
        deeds: {peace_with: ["northern_wei"]}
      - label: "Take the title, and raid the Wei frontier"
        legitimacy_bp: 1200
        wealth_bp: 1000
        unrest_bp: 300
        outcome: >-
          You are acclaimed khagan on the grass and send your riders down on the Wei's border
          towns. They come home with herds and silk, and the Wei begin to count the cost of
          leaving you alone.
        deeds: {men: 10000}
      - label: "Rule through a council of tribal chiefs"
        legitimacy_bp: 1000
        wealth_bp: 600
        influence: {nobility: 800}
        outcome: >-
          You keep the name of chief but sit at the head of a council of the tribal leaders,
          who pay in men and horses. The arrangement is strong while they agree.
        deeds: {martial_bp: 500}
    history: >-
      Yujiulü Shelun united the tribes of the northern steppe and took the title Qiudoufa
      Khagan in 402, organising his army by thousands and hundreds; he died in 410.
    sources: ["Wei shu 103 (Ruanruan)", "Zizhi tongjian 112", "Golden, 'An Introduction to the History of the Turkic Peoples' (1992)"]

  - id: rou_shengle
    scenario: three_kingdoms
    civ: rouran
    year: 424
    title: "Fifty Rings of Horsemen"
    place: "Shengle, on the Wei frontier"
    speaker: general
    speaker_name: "Yujiulü Yuheti"
    speaker_title: "Your great chief"
    needs_alive: [northern_wei]
    benchmark_provinces: 1
    story: >-
      You are Datan, the khagan of the Rouran. The Wei have built a wall against you, some two
      thousand li of it, and their old emperor is dead and his heir a boy of sixteen. You have
      brought sixty thousand horse to the frontier, and the boy has ridden out with only his
      guard to meet you. You have him in a ring of horsemen, fifty deep, they say, in the
      plain of Shengle.


      Your great chief Yuheti wants to press the ring closer. Others say that a cornered
      emperor is dangerous, even a young one, and that it is better to wait for him to break
      out.
    choices:
      - label: "Keep him ringed, and wait"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          The boy emperor sits calmly in his camp while the arrows fall. When Yuheti comes near,
          a Wei archer kills him, and your riders lose heart, and you ride away. Next year
          Taiwu leads five columns across the Gobi. You scatter before him, and he goes home
          with what he has found.
        deeds: {peace_with: [northern_wei], grudges: {northern_wei: 800}}
      - label: "Storm the camp"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Your riders break against a camp that is ready for them, and many do not come back.
        deeds: {men: 10000, martial_bp: 500}
      - label: "Offer the boy emperor terms, and ride home"
        legitimacy_bp: -300
        wealth_bp: -1200
        outcome: >-
          You send an envoy into the ring with an offer of terms and ride home with whatever
          gifts the Wei will give you. The Wei remember that you let them go.
        deeds: {peace_with: ["northern_wei"]}
    history: >-
      In 424 the Rouran surrounded the young Emperor Taiwu of Wei at Shengle; their commander
      was killed by an archer and they withdrew. Taiwu attacked them across the Gobi in 425.
    diverged: >-
      Northern Wei is gone.
    sources: ["Wei shu 4 (Shizu)", "Wei shu 103 (Ruanruan)", "Zizhi tongjian 120"]

  - id: rou_gobi
    scenario: three_kingdoms
    civ: rouran
    year: 428
    title: "The Summer Camps"
    place: "The summer pastures, north of the Gobi"
    speaker: general
    speaker_name: "A scout"
    speaker_title: "Come in from the south"
    needs_alive: [northern_wei]
    benchmark_provinces: 1
    story: >-
      You are Datan. It is summer, and your people are on the northern pastures with all
      their herds. The Wei court argued about this for weeks: their astrologers said the
      stars were against a war, and their ministers said the Song would attack in the south.
      Their emperor, Taiwu, has decided to come anyway, and a scout says there are two armies, one
      from the east and one from the west, already across the Gobi. They have come
      faster than you would have thought possible.
    choices:
      - label: "Burn the tents and flee west"
        historical: true
        legitimacy_bp: -3000
        wealth_bp: -2500
        unrest_bp: 1500
        outcome: >-
          The Wei fall on your camps before they can move. Your people scatter, and the Wei
          take herds and prisoners by the hundred thousand; the Wei shu says that dozens of tribes
          submitted. You burn your own tents and flee west, and soon after you are dead, the sources say, from rage. Your son Wuti takes the title.
        deeds: {peace_with: [northern_wei]}
      - label: "Stand and fight"
        legitimacy_bp: -2500
        wealth_bp: -1000
        outcome: >-
          You fight, and you lose. The Wei have more horses than you thought, and your own
          best riders are lost.
        deeds: {martial_bp: -1500}
      - label: "Scatter the tribes in small bands across the north"
        legitimacy_bp: -2000
        wealth_bp: -1500
        unrest_bp: 1000
        outcome: >-
          You send the tribes off in small bands in every direction, to meet again later. The
          Wei can catch few of them, but you have no army left, and the khagan's name means
          little to bands that do not see him.
        deeds: {martial_bp: -800}
    history: >-
      In the summer of 429 Taiwu led two armies across the Gobi against the Rouran, who were
      caught unprepared. Datan fled and died soon after; his son Wuti succeeded him.
    diverged: >-
      Northern Wei is gone.
    sources: ["Wei shu 4 (Shizu)", "Wei shu 35 (Cui Hao)", "Wei shu 103 (Ruanruan)", "Zizhi tongjian 121"]

  - id: rou_tuhezhen
    scenario: three_kingdoms
    civ: rouran
    year: 448
    title: "The Emperor Comes Again"
    place: "The northern steppe, in winter"
    speaker: general
    speaker_name: "A scout"
    speaker_title: "Come in from the south"
    needs_alive: [northern_wei]
    benchmark_provinces: 1
    story: >-
      You are Tuhezhen, khagan of the Rouran. For some years you have kept the peace with Wei,
      because the last khagans who fought it were broken by it. But the Wei emperor
      Taiwu has lost patience, and has come north with his son the crown prince, in the
      winter, to find you.


      Your herds are in the shelter of the hills. A hard winter is a good time for a
      hunter, and a bad time for a hunted man.
    choices:
      - label: "Slip away north without battle"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          Taiwu and his son ride into the empty steppe and find nothing, and go home. You have
          saved the herds, but in the autumn of 449 a Wei general, Tuoba Na, falls on your
          camps, and does you heavy harm. For some years you do not raid the border.
        deeds: {peace_with: [northern_wei]}
      - label: "Stand and give the Wei battle"
        legitimacy_bp: -1000
        food_bp: -1500
        outcome: >-
          You fight the Wei emperor on his own terms, and the herds pay for it.
        deeds: {martial_bp: -800}
      - label: "Buy the emperor off with tribute"
        legitimacy_bp: 300
        wealth_bp: -400
        outcome: >-
          Your envoys ride south through the snow with horses and furs. Taiwu takes them and
          turns for home, but your own men see how it was done.
        deeds: {peace_with: ["northern_wei"]}
    history: >-
      In the winter of 448 and spring of 449 Taiwu and Crown Prince Huang attacked the Rouran,
      but Tuhezhen eluded them; in the autumn of 449 the Wei general Tuoba Na inflicted heavy
      losses on them.
    diverged: >-
      Northern Wei is gone.
    sources: ["Wei shu 4 (Shizu)", "Wei shu 103 (Ruanruan)", "Zizhi tongjian 125"]

  - id: rou_qi
    scenario: three_kingdoms
    civ: rouran
    year: 478
    title: "An Envoy from the South"
    place: "The khagan's camp"
    speaker: general
    speaker_name: "Wang Hongfan"
    speaker_title: "Envoy of Xiao Daocheng"
    benchmark_provinces: 1
    story: >-
      You are Yucheng, khagan of the Rouran, son of Tuhezhen. You have ruled for fourteen
      years, and the Wei, who once marched through your country, are weaker towards you now;
      the tribes to the west have sent you tribute, and the Khotanese king has written to the Wei
      that all the west is yours.


      A strange guest has come to your camp: Wang Hongfan, who the Qi shu says has come by
      way of the north-east from Jiankang, where Xiao Daocheng rules the Song court and is
      about to make a dynasty of his own. Xiao Daocheng proposes that you and he attack the
      Wei together, from north and south.
    choices:
      - label: "Ally with Xiao Daocheng against Wei"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You agree, and the Qi shu says that you sent a great army against the Wei. In
          fact nothing much comes of it, and the Wei hold. In 485 you will have one of the envoys of Southern Qi, as Xiao Daocheng's dynasty is called, killed for not kneeling to you. A khaganate can be proud.
        deeds: {grudges: {northern_wei: 500}}
      - label: "Stay out of the southern quarrel"
        legitimacy_bp: 700
        outcome: >-
          The envoy goes home. The Wei have an easier time of it, and you keep your strength
          for the steppe.
      - label: "Turn west, and take tribute from the oasis cities"
        legitimacy_bp: 900
        wealth_bp: 1200
        outcome: >-
          Your riders ride west to the oasis cities, whose kings send horses, jade and silk.
          The Wei are not troubled for the moment, and the road west is yours.
    history: >-
      Yucheng agreed to an alliance with Xiao Daocheng, the future Emperor Gao of Southern
      Qi, against Northern Wei (late 470s); little came of it. In 485 he died and was
      succeeded by his son Doulun.
    sources: ["Qi shu 59 (Ruru)", "Wei shu 103 (Ruanruan)", "Zizhi tongjian 134"]

  - id: rou_anagui
    scenario: three_kingdoms
    civ: rouran
    year: 520
    title: "Ten Days a Khagan"
    place: "The khagan's camp, then the road south"
    speaker: general
    speaker_name: "One of your followers"
    speaker_title: "At the tent door"
    needs_alive: [northern_wei]
    benchmark_provinces: 1
    story: >-
      You are Anagui, the son of Futu, a Yujiulü of the khagan's house. Your brother Chounu has
      just been killed by his mother and his ministers, and the nobles have put you on the
      throne. But your cousin has raised an army, and in ten days he beats you in the field,
      and you have nothing left but your horse.


      The Wei, over the Gobi, are no friends of yours. But the Wei court at Luoyang will
      take in a refugee khagan, and may find it useful to have one who owes them his life.
    choices:
      - label: "Ride south, and ask the Wei for help"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Emperor Xiaoming's court shelters you in Luoyang. In 521, as you are about to leave, he changes his mind and helps you with men and supplies to go home. You come back to the
          steppe as the Wei's creature, and as khagan. When your rival is beaten by the
          Gaoche, in the following years, the Wei divide the Rouran between you and him, and
          you hold the north. You will rule for thirty years, and the Wei will be glad of you
          when their own garrisons rise in the north.
      - label: "Flee west to the Gaoche"
        legitimacy_bp: -300
        outcome: >-
          The Gaoche give you shelter, and a price. You will be a long time getting home.
      - label: "Gather your retainers in the hills, and fight on"
        legitimacy_bp: -700
        unrest_bp: 500
        outcome: >-
          You gather the men who are still loyal in the hills and raid your cousin's camps.
          You win some small fights and lose others, and the winter is hard.
        deeds: {men: 5000}
    history: >-
      After Chounu was killed in 520, Anagui was defeated by a cousin within ten days and fled
      to Northern Wei; with Wei help he returned in 521 and ruled the Rouran until 552.
    diverged: >-
      Northern Wei is gone.
    sources: ["Wei shu 103 (Ruanruan)", "Zizhi tongjian 149", "Golden, 'An Introduction to the History of the Turkic Peoples' (1992)"]

  - id: rou_bumin
    scenario: three_kingdoms
    civ: rouran
    year: 552
    title: "The Blacksmith Slave"
    place: "The Rouran court"
    speaker: general
    speaker_name: "The envoy of Tumen"
    speaker_title: "Of the Türks"
    benchmark_provinces: 1
    story: >-
      You are Anagui. The Türks of the Altai, the Ashina clan, have long forged iron for
      you, and have been counted among your servants. Their chief, Tumen, has just beaten a rising
      of the Tiele that you could not put down, and fifty thousand households of Tiele have
      gone over to him instead. He now sends his envoy to ask for a Rouran princess to marry.


      The Zhou shu says that you gave this answer. You can still change it.
    choices:
      - label: "Refuse the marriage with scorn"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          "You are my blacksmith slave," you say, according to the Zhou shu; "how dare you say
          such a thing?" Tumen turns instead to Western Wei and marries a Chinese princess. In the
          first months of 552 he beats you north of Huaihuang, and you take your own life.
          Tumen takes the title Illig Khagan, and the Türk khaganate, which will be bigger than
          yours, begins. Tiefa tries to hold the east, and Dengshuzi the west, but in a few years the Rouran will be gone from the steppe.
        deeds: {ruler_falls: "is beaten by Tumen and takes his own life"}
      - label: "Grant him the marriage and a dowry"
        legitimacy_bp: -1500
        wealth_bp: -1500
        outcome: >-
          Tumen has a princess, a dowry and a claim. He will want something more, and not long
          after.
      - label: "Strike first, before the Türks grow"
        legitimacy_bp: -1200
        unrest_bp: 1500
        outcome: >-
          You send your best horsemen against Tumen's camps in the Altai. They fight well, but
          Tumen has the Tiele households and his smiths, and the war is no easy one.
        deeds: {men: 20000}
    history: >-
      Tumen of the Türks, refused a Rouran bride with insults, allied with Western Wei, defeated
      Anagui in early 552 and took the title Illig Khagan; Anagui killed himself.
    sources: ["Zhou shu 50 (Tujue)", "Bei shi 99", "Zizhi tongjian 164"]
