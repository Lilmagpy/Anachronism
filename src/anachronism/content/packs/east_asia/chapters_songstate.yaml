schema_version: 1
# Chronicle mode (D-120, D-XXX): the state of Song (not the later dynasties), from Lord
# Ticheng's fall to the partition of Song, about 330-286 BC. Each chapter opens in its year;
# one choice is what history chose (historical: true). Facts follow Sima Qian's Shiji (ch.
# 38, the house of Song; ch. 46, Qi) and the Mencius; the Zhanguo ce has more stories. The
# Shiji's picture of King Yan is a HOSTILE source: it was written after Song fell, by authors
# for whom Song's last king had to be a second Jie or Zhou Xin, and the chapters say so.
# Dates are approximate: the Shiji gives Ticheng 41 years and King Yan 47 and counts his
# title from his 11th year; modern chronologies place the coup about 329, the title about 318
# and the end 286 (some say 285). benchmark_provinces counts the provinces of this map the
# real Song held at that date.
chapters:
  - id: songstate_brother
    scenario: warring_states
    civ: song
    year: -330
    title: "Your Brother Yan"
    place: "Shangqiu"
    speaker: steward
    speaker_name: "An old minister"
    speaker_title: "Of the court of Song"
    benchmark_provinces: 1
    story: >-
      You are Ticheng, lord of Song, and you have ruled for the better part of forty years.
      Song is the old state of the Shang kings' heirs, small and rich, where the great
      merchants of the central plain meet and where the rites of the fallen dynasty are still
      kept. Your neighbours Qi, Chu and Wei would each like to have it.


      Your younger brother Yan is at court, with his own men about him. He is a soldier and
      popular with the guard. Some at court say he is ambitious, and others that he is only loyal and impatient; no one can say for certain.
    choices:
      - label: "Keep Yan at court, in command of the guard"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Yan attacks you by surprise, and the guard goes over to him. You escape to Qi with
          what you can carry, and Yan makes himself lord of Song. He will rule for a long time,
          and he will have no more brothers to fear.
        deeds: {ruler_falls: "is overthrown by his brother Yan and flees to Qi"}
      - label: "Send your brother to a distant fief"
        wealth_bp: -300
        unrest_bp: 300
        legitimacy_bp: 500
        outcome: >-
          You remove him from the guard and from the court. He is sulking, and so are his
          friends; Song is quieter for a time.
      - label: "Keep Yan close and watch him"
        legitimacy_bp: -200
        unrest_bp: 200
        deeds: {men: 2000}
        outcome: >-
          You keep your brother at court, but set your own men beside his, and have your sons
          trained to the sword. The household grows tense, and your officers gossip about who
          is watching whom.
    history: >-
      Ticheng, lord of Song, was overthrown by his brother Yan, and fled to Qi (about 329 BC,
      Shiji 38, in Ticheng's 41st year). The Shiji gives no reason.
    sources: ["Shiji 38 (Song)"]

  - id: songstate_mencius
    scenario: warring_states
    civ: song
    year: -322
    title: "The Heir of Tang"
    place: "Shangqiu"
    speaker: scholar
    speaker_name: "Mencius, a teacher from Zou"
    speaker_title: "A visitor at court"
    benchmark_provinces: 1
    story: >-
      You are Yan, lord of Song, seven years after seizing your brother's seat. The scholar
      Mencius is passing through, on his long walk from court to court, and your ministers
      have arranged that he meet you. The books of the Mencius say he spoke to a Song minister
      named Dai Bu Sheng, who wanted a good king for Song, and said that a lone worthy man in
      a court full of flatterers cannot do much.


      His other idea is more dangerous. Song, he says, is the heir of the Shang kings, and
      Tang of Shang began with a single small town. A ruler who practised true kingly rule
      would make people come to him from the four quarters. Qi and Chu, however, would not
      love him for it.
    choices:
      - label: "Give him a gift for the road and arm your guard"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          Mencius leaves with a parting gift of gold, for the roads are dangerous and the
          custom of the time was to supply a traveller; he explains elsewhere in the book why
          he took it. You do not take his advice about the king's way. You conclude that Song
          needs more spearmen, not fewer.
        deeds: {martial_bp: 300}
      - label: "Keep him at court and follow the rites of Tang"
        legitimacy_bp: 800
        outcome: >-
          You remit taxes and give audiences. The merchants approve. Qi's agents write home that
          Song is turning soft.
        deeds: {martial_bp: -300}
      - label: "Employ him as an adviser on the schools"
        knowledge_bp: 500
        wealth_bp: -200
        outcome: >-
          You give him a post and a hall, and ask him to advise the minister Dai Bu Sheng on
          teaching the sons of the court. The scholars are pleased; the army is not consulted.
    history: >-
      Mencius visited Song (the date is unknown; about the 320s BC). The Mencius records his
      advice to the Song minister Dai Bu Sheng, and his reception, but does not say that Song
      followed it.
    sources: ["Mencius 2B.3", "Mencius 3B.5-6", "Shiji 38 (Song)"]

  - id: songstate_king
    scenario: warring_states
    civ: song
    year: -318
    title: "The Title of King"
    place: "Shangqiu"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the court of Song"
    benchmark_provinces: 1
    story: >-
      You are Yan, in the eleventh year since you took the seat of Song. Across the plain,
      Wei, Qi, Chu, Qin, Han and Yan all call their rulers kings, and Zhao's ruler is the only
      one of the great lords who does not. Even Zhongshan, a hill-fortress of the White Di,
      has taken the title.


      You have won a few small wars. Your army is large for the size of the state, and the
      priests say the Shang rites have always put the ruler of Song above the lesser lords.
    choices:
      - label: "Take the title of king"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -300
        outcome: >-
          You are King of Song. The sacrifices are reorganised, the merchants of Shangqiu cheer,
          and your name is proclaimed in all the markets of the plain. In Linzi, they
          note it.
        deeds: {grudges: {qi: 400}}

      - label: "Remain a lord of Song"
        wealth_bp: 300
        legitimacy_bp: -400
        outcome: >-
          Your ministers whisper that Song is the only state of any size whose ruler is
          content to be called less.
      - label: "Ask Zhou to rank you senior lord"
        legitimacy_bp: 500
        wealth_bp: -300
        outcome: >-
          You send an embassy to the Zhou king at Luoyang with gifts, and ask him to set Song
          above the lesser lords. The Zhou king is glad to be asked, but he has no power to
          enforce his answer.
    history: >-
      Yan declared himself king of Song in his 11th year (about 318 BC, Shiji 38).
    sources: ["Shiji 38 (Song)"]

  - id: songstate_wars
    scenario: warring_states
    civ: song
    year: -300
    title: "Wars on Three Sides"
    place: "The frontier of Song"
    speaker: general
    speaker_name: "Your marshal"
    speaker_title: "Of the royal army"
    benchmark_provinces: 1
    story: >-
      You are King Yan. Your armies have been out for years. The Shiji says that in the east
      you beat Qi and took five towns, in the south you beat Chu and took three hundred li,
      and in the west you beat Wei, until you stood as an equal of the great kings. The
      dates and the places are not given, and the numbers are the kind that stories like to
      have.


      Meanwhile Song's farmers pay for every campaign. Your marshal says that victory is
      cheap now, and that every neighbour is grinding its teeth. Qi's king Min, in particular,
      is not a man who forgets.
    choices:
      - label: "Press on against all three"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 800
        outcome: >-
          Your armies take towns on three borders. Your neighbours bury their quarrels in order
          to look at Song together. The people of Song pay the tax, and are weary.
        deeds: {martial_bp: 500, grudges: {qi: 700, chu: 500, wei: 500}}
      - label: "Hold what you have and make peace"
        deeds: {peace_with: [qi, chu, wei]}
        legitimacy_bp: 200
        unrest_bp: -400
        outcome: >-
          You count your gains and stop. Your neighbours are not sure whether to trust you.
      - label: "Strike at Qi alone"
        legitimacy_bp: 400
        unrest_bp: 400
        deeds: {men: 5000}
        outcome: >-
          You put the whole army against Qi and leave the other fronts quiet. Qi gives ground
          in the east, but King Min is not a man to forget it.
    history: >-
      The Shiji (38) says King Yan defeated Qi, Chu and Wei and became their equal. Its
      claims are brief and cannot be checked from other sources.
    sources: ["Shiji 38 (Song)", "Zhanguo ce, Song and Wey"]

  - id: songstate_heaven
    scenario: warring_states
    civ: song
    year: -296
    title: "Shooting at Heaven"
    place: "The palace at Shangqiu"
    speaker: diviner
    speaker_name: "A court diviner"
    speaker_title: "Of the Shang rites"
    benchmark_provinces: 1
    story: >-
      This is the story as the enemies of Song told it. The Shiji says that King Yan filled a
      leather bag with blood, hung it up and shot arrows at it, and called this 'shooting
      at Heaven'; that he drank all night and kept women; and that when his ministers
      remonstrated, he shot them. The other lords, it says, began to call him 'Jie of Song',
      after the last tyrant of Xia, and said that Song was repeating the crimes of Zhou, the last Shang king and must be punished.


      Some historians suspect all this. It is the kind of thing that was written about
      every last ruler of a fallen house, and about a king whom Qi and others needed to be
      wicked. Your diviner says that people are saying it anyhow, and that this is as much a
      danger as an army.
    choices:
      - label: "Hold your course and answer no one"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1200
        outcome: >-
          Whether or not you ever shot at the sky, the tale grows. Qi's king calls you a
          tyrant, Chu and Wei listen, and there is a war party in every court. Song is
          alone.
        deeds: {grudges: {qi: 600}}

      - label: "Hold a sacrifice and send gifts to the lords"
        wealth_bp: -300
        legitimacy_bp: 800
        unrest_bp: -300
        outcome: >-
          You make offerings at the Shang altars, you send envoys with gifts to the courts,
          and Song's name is better in the markets than it was. Qi is not persuaded.
      - label: "Fortify Shangqiu and call up the levy"
        legitimacy_bp: -300
        unrest_bp: 400
        deeds: {men: 6000, martial_bp: 200}
        outcome: >-
          You tell the lords nothing, but you have the walls of Shangqiu repaired and the levy
          called up. The people see the work and the soldiers, and some of them say that it is
          a poor answer to a rumour.
    history: >-
      The Shiji (ch. 38) tells of the 'shooting at Heaven' and the king's cruelty, and says the
      lords called him Jie of Song. Later writers add more. These accounts come from sources
      hostile to King Yan, written after his fall.
    sources: ["Shiji 38 (Song)", "Zhanguo ce, Song and Wey"]

  - id: songstate_fall
    scenario: warring_states
    civ: song
    year: -286
    title: "The Partition"
    place: "Shangqiu"
    speaker: general
    speaker_name: "A captain from the east gate"
    speaker_title: "Of the royal guard"
    needs_alive: [qi]
    benchmark_provinces: 1
    story: >-
      You are King Yan. King Min of Qi has brought his armies to your border, with the troops
      of Wei and Chu beside him. Qi's king has been waiting for this for years, and the other
      two have come for their shares.


      You have ruled for about forty-seven years by the Shiji's count and you are an old
      man. Your captain says the towns will not hold, and that the army has gone over town
      by town. There is nobody to send to, for nobody in the world is on your side.
    choices:
      - label: "Leave Shangqiu for the west"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          You leave Shangqiu and go west, to a town called Wen on the river, where you die.
          Qi takes most of Song, and Wei and Chu take their shares. The old state of the Shang
          kings' heirs is gone. The Shang rites, which were kept here for seven hundred years,
          are kept now only by scholars.
        deeds: {ruler_falls: "flees west and dies at Wen"}
      - label: "Hold Shangqiu to the last"
        deeds: {men: 5000, martial_bp: 200}
        legitimacy_bp: -1500
        outcome: >-
          The walls of the old capital hold for a few days. Then they do not.
      - label: "Offer Qi terms and tribute"
        wealth_bp: -800
        legitimacy_bp: -1200
        deeds: {peace_with: [qi, wei, chu]}
        outcome: >-
          You send envoys to King Min with gold and with the offer of a yearly tribute. Qi and
          the others take the gold and answer slowly; your captains watch the border while
          they wait.
    history: >-
      Qi, Wei and Chu attacked Song and divided it. King Yan fled to Wen and died there
      (Shiji 38, about 286 BC). The Shiji counts 47 years of his reign; Qi's conquest alarmed
      the other states and led to the coalition against Qi in 284.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 38 (Song)", "Shiji 46 (Tian Jingzhong Wan)"]
