schema_version: 1
# Chronicle mode (D-120, D-135): the Mauryas, from Chandragupta to Ashoka, 321-232 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Greek writers (Megasthenes in Arrian's Indica and Strabo; Justin;
# Plutarch's Alexander), Ashoka's own edicts, the Junagadh inscription of Rudradaman, and
# much later Indian traditions - the Buddhist Ashokavadana and Mahavamsa, the Jain
# Parishishtaparvan, the play Mudrarakshasa - which are legend as much as history, and
# are told as such. Modern work: Thapar, Singh, Trautmann, Olivelle. Dates before Ashoka
# are uncertain by several years. benchmark_provinces counts the provinces of this map the
# real Mauryas held at that date.
chapters:
  - id: mau_porridge
    scenario: maurya
    civ: maurya
    year: -321
    title: "The Child and the Porridge"
    place: "A village on the edge of Magadha"
    speaker: steward
    speaker_name: "Chanakya"
    speaker_title: "Your teacher"
    benchmark_provinces: 2
    story: >-
      Chanakya is a brahmin of Taxila, ugly, brilliant and unforgiving. Years ago King Dhana
      Nanda had him thrown out of a feast at Pataliputra, and he swore he would not tie up
      his hair again until the Nanda line was gone. He found you, they say, as a boy playing
      at being king with the village children, and bought you from your foster-father.


      Your first attack on the Nanda heartland has failed. You are hiding in a village.
      Tonight a woman gave her son a bowl of hot porridge; he burned his fingers by
      plunging them into the middle. 'You fool,' she scolded, 'you are like Chandragupta.
      Eat from the edges, where it has cooled.' Chanakya is smiling.
    choices:
      - label: "Raise the frontier clans before the plain"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You turn away from Pataliputra and start on the frontier: the warlike clans of the
          Punjab, mercenaries, outlaws, anyone who hates the Nandas or the Greeks. One by one
          the border towns open to you. The Nanda kingdom begins to look smaller from the
          outside than it did from within.
        deeds: {men: 30000, war_with: [nanda]}
      - label: "Attack Magadha again with a larger army"
        legitimacy_bp: -500
        food_bp: -2000
        outcome: >-
          Your second attack on Magadha bleeds out on the Ganges plain like the first.
          Chanakya says nothing, which is worse than anything he could say.
        deeds: {war_with: [nanda]}
      - label: "Sow discord among the Nanda ministers first"
        wealth_bp: -400
        legitimacy_bp: 1000
        outcome: >-
          Chanakya's agents spend a year buying officers and spreading rumours at Pataliputra. Several
          of the Nanda commanders begin to answer your letters, and you raise a modest band from the
          men who defect. The frontier clans hear of it and your name is respected, but the year of
          waiting empties your purse.
        deeds: {men: 12000, martial_bp: 300}
    history: >-
      The porridge story is told in the Buddhist Mahavamsa commentary and the Jain
      Parishishtaparvan. Chandragupta rose against the Nandas in about 322-321 BC; the Greek
      writer Justin says he gathered 'a band of robbers'.
    sources: ["Parishishtaparvan 8", "Justin 15.4", "Trautmann, Kautilya and the Arthasastra (1971)"]

  - id: mau_pataliputra
    scenario: maurya
    civ: maurya
    year: -320
    until_year: -312
    title: "The Fall of the Nandas"
    place: "Before Pataliputra"
    speaker: steward
    speaker_name: "Chanakya"
    speaker_title: "Your teacher"
    needs_alive: [nanda]
    needs_war_with: [nanda]
    benchmark_provinces: 2
    story: >-
      The Nanda army is said to have two hundred thousand foot, twenty thousand horse and
      three thousand elephants - the army that frightened Alexander's men into turning back.
      But Dhana Nanda is hated: he taxed even skins, gums, trees and stones, and his family
      began, people whisper, with a barber who murdered a king.


      Chanakya has a plan. A Himalayan king, Parvataka, will join you for half the
      kingdom. And Chanakya has agents inside the palace: a poisoned girl, he hints, can
      be sent to whomever he chooses.
    choices:
      - label: "Accept Parvataka's hill army for half the spoils"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: 800
        outcome: >-
          Pataliputra falls. Dhana Nanda is allowed to leave with as much as one chariot can
          carry. Parvataka, the legend says, dies soon after, poisoned by the girl meant for
          you - and his half of the kingdom is yours. Chanakya ties up his hair.
        deeds: {conquer: [nanda]}
      - label: "Ally with Parvataka and truly divide the realm"
        legitimacy_bp: 1400
        outcome: >-
          Parvataka takes the hill country and the north of the plain. You take Magadha and
          the river. It is not an empire, but it is a kingdom with friends.
        deeds: {take: [in_magadha, in_anga, in_kashi, in_vatsa, in_kosala]}
      - label: "Besiege Pataliputra alone, and keep the prize"
        food_bp: -1500
        legitimacy_bp: 1700
        outcome: >-
          Your own army sits before the wooden walls through a hard winter. The city is starved out in
          the spring, and the prize is wholly yours; but the cost is heavy and your men are worn.
        deeds: {men: 20000, war_with: [nanda]}
    history: >-
      Chandragupta overthrew the Nandas and took Pataliputra around 321 BC. The tales of
      Parvataka and the poison maiden come from the play Mudrarakshasa (perhaps 4th-8th
      century AD) and the Jain tradition.
    diverged: >-
      The Nandas are gone, or at peace with you: Pataliputra will be won another way.
    sources: ["Mudrarakshasa", "Parishishtaparvan 8", "Plutarch, Alexander 62"]

  - id: mau_rakshasa
    scenario: maurya
    civ: maurya
    year: -318
    after: [mau_pataliputra]
    title: "The Minister's Seal"
    place: "Pataliputra"
    speaker: steward
    speaker_name: "Chanakya"
    speaker_title: "Your chief minister"
    benchmark_provinces: 14
    story: >-
      The Nandas' old chief minister, Rakshasa, is still loyal to his dead masters. From
      exile he plots with mountain kings and Greek captains to win back Pataliputra, and
      he is the ablest administrator in India.


      Chanakya does not want him dead. He wants him working for you. He has obtained
      Rakshasa's signet ring, and he has a plan involving a forged letter, a friend of
      Rakshasa's about to be executed, and a great deal of patience.
    choices:
      - label: "Let Chanakya turn him to your side"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 1500}
        outcome: >-
          Rakshasa's allies are turned against him one by one with forged letters. Finally,
          to save his friend from the stake, he gives himself up - and is offered the post
          of chief minister. He accepts. The officials of the Nandas follow him into your
          service.
      - label: "Hunt him down and have him killed"
        unrest_bp: 800
        influence: {nobility: -1000}
        outcome: >-
          Rakshasa dies in a hill fort. His clerks do not forgive you, and Pataliputra's
          offices run slowly for years.
      - label: "Pardon him and offer a lesser post"
        wealth_bp: -400
        legitimacy_bp: 1400
        influence: {nobility: 800}
        outcome: >-
          Rakshasa refuses a minor post from the men who destroyed his masters. He goes on plotting
          from exile, though with fewer friends each year; your clemency is praised in the markets,
          and the Nanda clerks serve you with less grudge.
    history: >-
      Rakshasa and the signet ring come from Vishakhadatta's play Mudrarakshasa ('Rakshasa's
      Ring'). Whatever the truth of it, the Mauryas took over and expanded the Nanda
      administration.
    sources: ["Mudrarakshasa"]

  - id: mau_yavanas
    scenario: maurya
    civ: maurya
    year: -317
    until_year: -310
    title: "The Greeks Leave the Indus"
    place: "Taxila"
    speaker: satraps
    speaker_name: "Eudemus"
    speaker_title: "Commander of the Macedonian garrisons"
    needs_alive: [satraps]
    benchmark_provinces: 14
    story: >-
      Alexander's generals are at war with each other on the other side of the world.
      Eudemus, who murdered King Porus to keep the Punjab, has been called west to fight in
      Persia, and wants to take his army and a hundred and twenty elephants with him.


      He is offering to leave you the Indus country - Sindh and the lower river - in peace
      if you let him march out unhindered.
    choices:
      - label: "Let his army march out and claim the Indus"
        historical: true
        legitimacy_bp: 1200
        outcome: >-
          The Macedonian garrisons march west and never come back. Eudemus will be executed in
          Persia within the year. The Indus is yours down to the sea.
        deeds: {take: [in_sindh]}
      - label: "Fall on his column as it marches"
        legitimacy_bp: 1900
        unrest_bp: 500
        outcome: >-
          Your horsemen cut up his rearguard in the Swat valley. He gets away with most of the
          elephants. Every Greek in Asia now knows your name.
        deeds: {take: [in_sindh], war_with: [satraps], grudges: {satraps: 3000}}
      - label: "Let him go, and recruit the Greek veterans who stay"
        legitimacy_bp: 600
        wealth_bp: -400
        outcome: >-
          Eudemus marches west with his elephants. Several hundred of his Greek and Thracian
          soldiers prefer to stay and take your pay, and your army learns Macedonian drill.
        deeds: {"men": 8000}
    history: >-
      Eudemus left India around 317 BC with 120 elephants to fight for Eumenes. The Punjab
      and Indus passed into Chandragupta's hands.
    diverged: >-
      The Macedonian garrisons are already gone.
    sources: ["Diodorus 19.14", "Justin 15.4"]

  - id: mau_seleucus
    scenario: maurya
    civ: maurya
    year: -305
    until_year: -298
    title: "Five Hundred Elephants"
    place: "The Indus crossing"
    speaker: satraps
    speaker_name: "Seleucus Nicator"
    speaker_title: "King of Babylon and the East"
    needs_alive: [satraps]
    benchmark_provinces: 15
    story: >-
      Seleucus, who has fought his way from Babylon to Bactria, has crossed the Indus to win
      back Alexander's Indian provinces. He is an old companion of Alexander's, and very good.


      But he is also in trouble: Antigonus One-Eye is gathering an army in the west to
      destroy him, and he cannot fight two wars at once. His envoys ask what you would give
      for peace.
    choices:
      - label: "Give elephants for the western lands"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Seleucus gives you Gandhara, Arachosia and the Hindu Kush, and a marriage alliance;
          you give him five hundred war elephants. At Ipsus four years later, your elephants
          win him the battle that makes him the greatest of Alexander's heirs. He sends you
          an ambassador.
        deeds: {conquer: [satraps]}
      - label: "Hold the Indus crossings by force"
        legitimacy_bp: 1000
        unrest_bp: 1000
        food_bp: -2000
        outcome: >-
          Your army holds the crossings for a summer. Seleucus goes home to fight Antigonus,
          promising to come back.
        deeds: {war_with: [satraps], grudges: {satraps: 3000}}
      - label: "Pay him in gold, and keep your own lands"
        wealth_bp: -500
        legitimacy_bp: 2700
        outcome: >-
          Seleucus takes a payment and a promise of friendship, and goes home to face Antigonus
          without any new province. Your court praises a cheap peace, though the western lands stay in
          dispute.
        deeds: {peace_with: [satraps]}
    history: >-
      Around 305-303 BC Seleucus I and Chandragupta made a treaty: Seleucus ceded the eastern
      satrapies for 500 elephants, with a marriage alliance; the elephants helped win Ipsus
      (301 BC).
    diverged: >-
      The Greeks of the east are already gone.
    sources: ["Strabo 15.2.9", "Appian, Syriaca 55", "Plutarch, Alexander 62"]

  - id: mau_megasthenes
    scenario: maurya
    civ: maurya
    year: -302
    title: "The Ambassador from Babylon"
    place: "Pataliputra"
    speaker: scholar
    speaker_name: "Megasthenes"
    speaker_title: "Ambassador of Seleucus"
    benchmark_provinces: 18
    story: >-
      A Greek ambassador has come to live at your court. He walks through Pataliputra with
      his mouth open: the city is fifteen kilometres long along the Ganges, with a wooden
      wall, five hundred and seventy towers and sixty-four gates. He wants to see
      everything - the markets, the elephants, the philosophers who go naked in the forest,
      the inspectors who measure the roads.


      He is writing a book about India for the Greeks. Chanakya says ambassadors are spies
      with manners.
    choices:
      - label: "Give him free run of the city and the court"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 800
        outcome: >-
          Megasthenes writes that Indians never lie, that there is no slavery in India, that
          the people are divided into seven classes, and that there are ants which dig gold.
          He gets some of it right. His book will be the West's picture of India for a
          thousand years.
      - label: "Show him the parade grounds and armouries"
        legitimacy_bp: 500
        outcome: >-
          Megasthenes sees the armouries, the elephants and the parade grounds, and writes
          home that India cannot be conquered. Seleucus believes him.
        deeds: {martial_bp: 500}
      - label: "✦ Give him a printed gazetteer of the empire"
        needs_adopted: [woodblock_printing]
        knowledge_bp: 2500
        wealth_bp: 1000
        outcome: >-
          Your clerks hand him a book printed from carved blocks: every province, road and
          market of the empire, with its taxes. Megasthenes is speechless. Greek merchants
          begin to arrive within the year.
      - label: "Seat him among the philosophers only"
        knowledge_bp: 1000
        unrest_bp: -300
        legitimacy_bp: 600
        outcome: >-
          Megasthenes spends his days with brahmins and ascetics and writes a pious, rather dreamy
          book that is much read at home. The markets and the army stay out of his notes.
    history: >-
      Megasthenes was Seleucus's ambassador to Chandragupta around 300 BC. His Indica is lost
      but quoted at length by Arrian, Strabo and Diodorus. Wooden walls of Pataliputra have
      been excavated.
    sources: ["Arrian, Indica 10", "Strabo 15.1", "Spooner, excavations at Kumrahar (1912-15)"]

  - id: mau_arthashastra
    scenario: maurya
    civ: maurya
    year: -300
    title: "The Science of Wealth"
    place: "Pataliputra"
    speaker: steward
    speaker_name: "Chanakya"
    speaker_title: "Your chief minister"
    benchmark_provinces: 18
    story: >-
      Chanakya has written down how a kingdom should be run, and it is not a gentle book.
      The king's agents are everywhere: disguised as monks, merchants, beggars and
      students. The state owns the mines, the forests and the salt; a superintendent
      inspects every weight in every market; a fine is fixed for every offence, down to
      urinating in the street. A neighbouring king is always an enemy; the king beyond him,
      always a friend.


      He wants you to make it the law of the empire.
    choices:
      - label: "Adopt it as the rule of the empire"
        historical: true
        wealth_bp: 2000
        unrest_bp: 800
        legitimacy_bp: 800
        outcome: >-
          Spies report from every town; inspectors count every cow. The treasury fills, and
          people learn to be careful what they say in the market.
        deeds: {martial_bp: 1000}
      - label: "Take the good parts, and leave out the spies"
        wealth_bp: 1000
        unrest_bp: -500
        legitimacy_bp: 700
        outcome: >-
          Weights and measures are fixed and roads are built. The secret service is quietly
          disbanded. Chanakya says you will regret it.
        deeds: {"martial_bp": 300}
      - label: "✦ Copy it on paper for every official"
        needs_adopted: [paper]
        wealth_bp: 2500
        knowledge_bp: 1500
        outcome: >-
          Every district officer receives a copy of the rules on cheap, light paper instead of
          bundles of palm leaves. For the first time the empire is run by the same rules from
          the Hindu Kush to Bengal.
      - label: "Let the brahmin ministers draft a gentler code"
        legitimacy_bp: 1000
        unrest_bp: -300
        influence: {"clergy": 1200}
        outcome: >-
          The brahmins write a code of duty and penance in place of fines and spies. It is
          loved by the priests and respected by the people, and the levy is a little lighter.
        deeds: {"martial_bp": -300}
    history: >-
      The Arthashastra is traditionally attributed to Chanakya (Kautilya); most scholars now
      think it reached its present form between the 2nd century BC and the 3rd century AD,
      but it preserves older material.
    sources: ["Arthashastra (tr. Olivelle, 2013)", "Trautmann (1971)"]

  - id: mau_girnar
    scenario: maurya
    civ: maurya
    year: -299
    title: "The Lake at Girnar"
    place: "Girnar, in Saurashtra"
    speaker: steward
    speaker_name: "Pushyagupta"
    speaker_title: "Your governor in the west"
    benchmark_provinces: 18
    story: >-
      Your governor in the west, Pushyagupta, has taken Saurashtra and the desert country to
      its north. The land below Mount Girnar is good, but the monsoon either drowns it or
      leaves it dry. He wants to dam the river and build a lake: Sudarshana, 'the beautiful
      to look at', to water the fields all year.
    choices:
      - label: "Dam the river to water the fields"
        historical: true
        materials_bp: -2000
        food_bp: 2500
        legitimacy_bp: 600
        outcome: >-
          An earth dam closes the valley, and the lake fills. Four and a half centuries later
          a king called Rudradaman will repair it after a storm and carve the story of its
          building, naming you and your governor, on the rock where your grandson's edicts
          already stand.
        deeds: {take: [in_saurashtra, in_marwar]}
      - label: "Take the land and leave the river alone"
        legitimacy_bp: 300
        wealth_bp: 800
        unrest_bp: 400
        outcome: >-
          Saurashtra is yours. Its farmers go on praying for rain.
        deeds: {take: [in_saurashtra, in_marwar]}
      - label: "✦ Build it of concrete, with sluice gates"
        needs_adopted: [concrete]
        materials_bp: -2000
        food_bp: 4000
        legitimacy_bp: 800
        outcome: >-
          A dam of lime concrete with wooden sluices lets the engineers feed the fields
          through the dry season. It never breaks.
        deeds: {take: [in_saurashtra, in_marwar]}
      - label: "Dig wells and granaries instead of a lake"
        materials_bp: -1000
        food_bp: 1200
        legitimacy_bp: 300
        outcome: >-
          Cheaper works go in across Saurashtra: deep wells, stone granaries, small channels.
          They soften the dry years without taming the monsoon.
        deeds: {"take": ["in_saurashtra", "in_marwar"]}
    history: >-
      Rudradaman's Junagadh inscription (AD 150) records that Chandragupta's governor
      Pushyagupta built the Sudarshana lake, which Ashoka's officials improved with channels.
    sources: ["Junagadh rock inscription of Rudradaman", "Epigraphia Indica 8"]

  - id: mau_renounce
    scenario: maurya
    civ: maurya
    year: -297
    title: "The King Who Became a Monk"
    place: "Pataliputra"
    speaker: diviner
    speaker_name: "Bhadrabahu"
    speaker_title: "A Jain teacher"
    benchmark_provinces: 18
    story: >-
      You are about forty-five, and you rule from the Hindu Kush to the Bay of Bengal. You
      have spent your life listening to Chanakya. Lately you have been listening to someone
      else: Bhadrabahu, an old Jain teacher, who says that a famine of twelve years is
      coming to the north, and that he will lead his monks south.


      He has told you that the only victory that lasts is the victory over oneself. Your
      son Bindusara is a grown man.
    choices:
      - label: "Hand the throne to Bindusara and follow Bhadrabahu"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You leave Pataliputra on foot with nothing. On a hill at Shravanabelagola, far in
          the south, you live as a monk, and at the end, the Jains say, you starve yourself
          to death by the ancient vow of sallekhana. The hill is still called after you.
        deeds: {ruler_falls: "renounces the throne and goes south as a Jain monk"}
      - label: "Stay on the throne and rule on"
        legitimacy_bp: 300
        outcome: >-
          Bhadrabahu goes south without you. You go on ruling, and from time to time you
          wonder about the hill in the south.
      - label: "Make Bindusara regent in the north and keep the throne"
        legitimacy_bp: 500
        influence: {"nobility": 600}
        outcome: >-
          Bindusara takes up the work of the north-west under your eye. Bhadrabahu goes south
          alone with his monks; you stay, a little less alone than before.
    history: >-
      Jain tradition says Chandragupta abdicated, became a disciple of Bhadrabahu and died
      by ritual fasting at Shravanabelagola, Karnataka, around 297 BC. Greek and Buddhist
      sources say nothing of it.
    sources: ["Parishishtaparvan 8", "Shravanabelagola inscriptions (7th century onwards)"]

  - id: mau_deccan
    scenario: maurya
    civ: maurya
    year: -290
    title: "The Slayer of Foes"
    place: "The Narmada river"
    speaker: general
    speaker_name: "Your commander in the south"
    speaker_title: "General of the Deccan army"
    benchmark_provinces: 18
    story: >-
      Bindusara's Greek friends call him Amitrochates: 'the slayer of foes'. South of the
      Narmada, the high plateau of the Deccan is a country of small kingdoms and forest
      peoples, and its rivers run with gold dust and diamonds.


      Your commander wants to march south as far as the Tamil lands. The Tamil kings
      themselves, he admits, would be a war too far.
    choices:
      - label: "March south across the Narmada"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          Year by year the armies push south. Sixteen cities, says a Tibetan history written
          two thousand years later, fall between the two seas. The Tamil kings send gifts
          and keep their independence.
        deeds: {take: [in_vidarbha, in_asmaka, in_andhra, in_karnata, in_konkan]}
      - label: "Fortify the southern frontier and rule what you hold"
        unrest_bp: -500
        wealth_bp: -500
        outcome: >-
          The Deccan chiefs pay a little tribute and go on as before.
        deeds: {"men": 15000}
      - label: "Take only the gold-bearing Karnata hills"
        wealth_bp: 800
        unrest_bp: 600
        legitimacy_bp: 1000
        outcome: >-
          A smaller campaign into the south-west takes the hill country and its gold workings, and no
          more. The Tamil kings are left to themselves; the hill chiefs are not so easily quieted, and
          the new province is restless.
        deeds: {take: [in_karnata], men: 8000}
    history: >-
      Bindusara (r. c. 297-273 BC) seems to have extended the empire into the Deccan; Taranatha
      (17th century) credits Chanakya with conquering sixteen cities 'between the eastern and
      western seas'. Ashoka's edicts are found as far south as Karnataka.
    sources: ["Athenaeus 14.652", "Taranatha, History of Buddhism in India", "Thapar, Asoka and the Decline of the Mauryas (1961)"]

  - id: mau_figs
    scenario: maurya
    civ: maurya
    year: -282
    title: "Wine, Figs and a Philosopher"
    place: "Pataliputra"
    speaker: scholar
    speaker_name: "Deimachus"
    speaker_title: "Ambassador of King Antiochus"
    benchmark_provinces: 23
    story: >-
      A letter is going to your friend Antiochus, king of the Greeks in Syria. You have asked
      for some sweet Greek wine, some dried figs - and a philosopher, because you would like
      someone to argue with.


      Your scribe asks whether you want to add anything.
    choices:
      - label: "Send the letter as it is"
        historical: true
        knowledge_bp: 800
        wealth_bp: 500
        outcome: >-
          Antiochus replies that he is sending the figs and the wine with pleasure; 'but in
          Greece the laws forbid a sophist to be sold.' The letter will be quoted for two
          thousand years as the first Greek joke about India.
      - label: "Offer to pay any philosopher who will come"
        knowledge_bp: 1500
        wealth_bp: -800
        outcome: >-
          Two Athenian philosophers, short of money, arrive at Pataliputra a year later. One
          converts to the naked ascetics of the forest; the other goes home and writes a
          book.
      - label: "Ask for their best engineers, too"
        knowledge_bp: 1200
        outcome: >-
          Antiochus sends three Greek engineers along with the figs. They are astonished by
          the wooden walls of Pataliputra and suggest stone.
        deeds: {martial_bp: 300}
    history: >-
      Athenaeus, quoting Hegesander, says Bindusara asked Antiochus I for sweet wine, dried
      figs and a sophist; Antiochus sent the wine and figs but replied that Greek law forbade
      the sale of a sophist.
    sources: ["Athenaeus, Deipnosophists 14.652-653"]

  - id: mau_brothers
    scenario: maurya
    civ: maurya
    year: -272
    until_year: -264
    title: "The Throne of Pataliputra"
    place: "Pataliputra"
    speaker: general
    speaker_name: "Radhagupta"
    speaker_title: "A minister of the late king"
    benchmark_provinces: 23
    story: >-
      King Bindusara is dead. He wanted his eldest son Susima to follow him. But Susima is
      away in Taxila, and the ministers in Pataliputra - Radhagupta first among them - have
      chosen Ashoka, who put down a rebellion there years ago and is feared for his temper.


      Susima is marching on the capital with an army.
    choices:
      - label: "Ashoka shuts the gates against Susima"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Susima's army reaches the east gate. The Buddhists will later say Radhagupta set a
          pit of burning coals behind it, and that Ashoka killed ninety-nine brothers to take
          the throne. It is four years before he is crowned. They will call him Chandashoka,
          'Ashoka the fierce'.
      - label: "Ashoka agrees to share power with his brother"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          The brothers divide the duties: Susima the north-west, Ashoka the throne. It holds,
          uneasily.
      - label: "Let the ministers' council judge the claims"
        legitimacy_bp: 600
        unrest_bp: 300
        influence: {"nobility": 800}
        outcome: >-
          The council sits for days while Susima's army waits outside. Ashoka accepts whatever
          it decides, and the ministers are glad to have been asked, though the losing brother
          will not be.
    history: >-
      Ashoka succeeded Bindusara around 268 BC after a disputed succession; the stories of the
      fratricide come from the much later Buddhist Ashokavadana and Sri Lankan chronicles.
    diverged: >-
      The succession has gone another way.
    sources: ["Ashokavadana", "Mahavamsa 5", "Thapar (1961)"]

  - id: mau_kalinga
    scenario: maurya
    civ: maurya
    year: -261
    until_year: -255
    title: "Kalinga"
    place: "The Daya river, Kalinga"
    speaker: general
    speaker_name: "Your commander in the east"
    speaker_title: "Leader of the Kalinga war"
    needs_alive: [kalinga]
    benchmark_provinces: 23
    story: >-
      Kalinga, on the Bay of Bengal, is the last great kingdom between your empire and the
      sea. Its ships trade with Lanka and the lands to the east; its army has seventy
      thousand foot and seven hundred elephants. It has refused you tribute.


      Eight years into your reign, you have decided that it will be yours.
    choices:
      - label: "March on Kalinga with the whole army"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          Kalinga falls. A hundred and fifty thousand people are carried off, a hundred
          thousand are killed, and many times that number die after, of hunger and disease.
          The Daya river runs red, the story goes. You ride over the battlefield and see what
          you have done.
        deeds: {war_with: [kalinga], conquer: [kalinga]}
      - label: "Leave Kalinga its freedom, for tribute"
        wealth_bp: 1500
        legitimacy_bp: -300
        outcome: >-
          Kalinga sends elephants and pearls. Its kings watch you warily.
        deeds: {tributaries: [kalinga]}
      - label: "Blockade its ports and demand its elephants"
        wealth_bp: 800
        legitimacy_bp: 500
        outcome: >-
          Your fleets and your horse close Kalinga's ports and roads. After a bitter season its
          council hands over elephants and pearls, but its army stays unbroken behind the hills.
        deeds: {men: 20000}
    history: >-
      Ashoka conquered Kalinga around 261 BC. His own Rock Edict XIII gives the figures: 150,000
      deported, 100,000 killed, 'and many times that number died'.
    diverged: >-
      Kalinga is gone already.
    sources: ["Rock Edict XIII", "Thapar (1961)"]

  - id: mau_dhamma
    scenario: maurya
    civ: maurya
    year: -260
    after: [mau_kalinga]
    title: "The Conquest by Dhamma"
    place: "Pataliputra"
    speaker: diviner
    speaker_name: "Upagupta"
    speaker_title: "A Buddhist monk"
    benchmark_provinces: 24
    story: >-
      You have not been able to forget Kalinga. You have been listening to the Buddhist
      monks, and you have decided something no king before you has decided: that the only
      conquest worth having is the conquest by dhamma - by right conduct.


      Your generals are worried. The south is still unconquered. The empire's enemies have
      not changed their minds just because you have.
    choices:
      - label: "Rule by right conduct, not by arms"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1500
        influence: {clergy: 2000, nobility: -1000}
        outcome: >-
          You announce, on stone, your remorse for Kalinga. Animal sacrifices are restricted;
          the royal kitchen kills fewer and fewer animals; officers of dhamma tour the empire
          to make sure people are treated kindly. The army is kept - but it does not march
          again in your lifetime.
        deeds: {martial_bp: -2000}
      - label: "Regret Kalinga, and march on the Tamil kings"
        legitimacy_bp: 300
        unrest_bp: 800
        influence: {"nobility": 1000}
        outcome: >-
          You build a monastery for the monks and send the army south against the Tamil
          kings.
        deeds: {"men": 30000, "war_with": ["chola"]}
      - label: "Keep the army, but fight only if attacked"
        wealth_bp: -200
        unrest_bp: -1300
        legitimacy_bp: 1400
        influence: {clergy: 1000}
        outcome: >-
          You keep your soldiers in their camps and send your officers out to preach. The Tamil kings
          are not threatened and you are not tempted; the officers' preaching is well received, if the
          treasury pays for the pilgrimages.
        deeds: {martial_bp: -500}
    history: >-
      Ashoka's Rock Edict XIII records his remorse for Kalinga and his turn to 'conquest by
      dhamma'. He became a Buddhist lay follower, though his dhamma was a broad moral code,
      not Buddhism alone.
    sources: ["Rock Edict XIII", "Minor Rock Edict I", "Olivelle et al., Reimagining Asoka (2012)"]

  - id: mau_edicts
    scenario: maurya
    civ: maurya
    year: -257
    title: "Words on Stone"
    place: "Pataliputra"
    speaker: scholar
    speaker_name: "Your chief scribe"
    speaker_title: "Keeper of the royal records"
    benchmark_provinces: 24
    story: >-
      You want every person in the empire to know the dhamma, and to know that it comes
      from you, 'Devanampiya Piyadasi, beloved of the gods'. Your scribe proposes to carve
      it in stone: on polished pillars of sandstone fifteen metres high, crowned with
      lions, and on rock faces beside the great roads.


      In the north-west, where people write in Greek and Aramaic, he will translate. In the
      rest of the empire he will use the new Brahmi letters - which hardly anyone can read.
    choices:
      - label: "Carve the edicts on pillars and rocks across the empire"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -1500
        knowledge_bp: 800
        outcome: >-
          The pillars go up from Nepal to Karnataka. The lions of Sarnath will one day be the
          emblem of the Republic of India, and the wheel beneath them will be on its flag.
          The Brahmi letters will be forgotten for two thousand years, until a British
          scholar, James Prinsep, deciphers them in 1837 and finds your name.
      - label: "Send heralds to read the edicts aloud instead"
        legitimacy_bp: 1000
        unrest_bp: -500
        outcome: >-
          Heralds in every market read your words twice a year. People hear them. Nobody will
          remember them.
      - label: "✦ Print the edicts and post them in every village"
        needs_adopted: [woodblock_printing]
        legitimacy_bp: 2500
        knowledge_bp: 2500
        outcome: >-
          Printed sheets of the dhamma are pasted up in every village and read aloud by
          whoever can read. Within a generation, more people can read in your empire than in
          the rest of the world together.
      - label: "Appoint officers to teach the dhamma in person"
        wealth_bp: -500
        unrest_bp: -400
        legitimacy_bp: 1500
        outcome: >-
          Your officers of dhamma tour the districts, settling quarrels and preaching. People remember
          the faces, not the words, and the officers' justice is praised across the districts.
    history: >-
      Ashoka's edicts, in Prakrit in the Brahmi and Kharosthi scripts and in Greek and Aramaic
      in the north-west, survive at some 30 sites. James Prinsep deciphered Brahmi in 1837.
    sources: ["Hultzsch, Inscriptions of Asoka (1925)", "Prinsep, JASB 1837"]

  - id: mau_mahinda
    scenario: maurya
    civ: maurya
    year: -250
    title: "A Prince for Lanka"
    place: "Pataliputra"
    speaker: lanka
    speaker_name: "Envoys of Devanampiya Tissa"
    speaker_title: "From the king of Lanka"
    needs_alive: [lanka]
    benchmark_provinces: 24
    story: >-
      A thousand monks have met at Pataliputra to fix the true teaching of the Buddha and
      expel the frauds. Now the elders want to send missionaries to every land: to the
      Himalayas, to the Greeks, to Burma - and to Lanka, whose new king Devanampiya Tissa,
      'beloved of the gods' as you are, has sent you envoys and gifts of pearls.


      Your son Mahinda, a monk, wants to go to Lanka himself. So does your daughter
      Sanghamitta, a nun, who would bring a cutting of the tree under which the Buddha found
      enlightenment.
    choices:
      - label: "Send them both, with the sacred tree"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          Mahinda meets the king of Lanka hunting deer on the mountain of Mihintale and asks
          him a riddle about mango trees. The king becomes a Buddhist. Sanghamitta plants
          the cutting at Anuradhapura, where it is still alive, the oldest tree planted by a
          person whose date is known.
        deeds: {ally_with: [lanka]}
      - label: "Send missionaries, but keep your children home"
        wealth_bp: 200
        unrest_bp: 200
        legitimacy_bp: 1700
        outcome: >-
          Monks sail to Lanka and preach. The king is polite and keeps his old gods; some of the monks
          complain that they were sent without royal blood to carry weight.
        deeds: {ally_with: [lanka]}
      - label: "Send gifts and a fleet escort, but no monks"
        legitimacy_bp: 400
        wealth_bp: -400
        outcome: >-
          Your envoys return the gifts of pearls with elephants and cloth. The two kings
          exchange courtesies, and the new faith does not go with them.
        deeds: {"ships": 6}
    history: >-
      The Sri Lankan chronicles say Ashoka's son Mahinda brought Buddhism to Lanka around 250
      BC and his daughter Sanghamitta brought a cutting of the Bodhi tree. The Jaya Sri Maha
      Bodhi at Anuradhapura is held to be that tree.
    diverged: >-
      Lanka has fallen; no prince sails there.
    sources: ["Mahavamsa 13-19", "Dipavamsa"]

  - id: mau_amalaka
    scenario: maurya
    civ: maurya
    year: -235
    title: "Half a Fruit"
    place: "Pataliputra"
    speaker: steward
    speaker_name: "Radhagupta"
    speaker_title: "Your old chief minister"
    benchmark_provinces: 24
    story: >-
      You are old. You have given the Buddhist order so much that the ministers have begun
      to refuse your orders to the treasury. Your grandson, the crown prince, has forbidden
      the officials to pay out any more in your name.


      This morning they brought you your meal on a gold plate, then a silver one, then
      clay. Now all you have left to give is half an amalaka fruit in your hand.
    choices:
      - label: "Give the half-fruit to the monks"
        historical: true
        legitimacy_bp: 1000
        influence: {clergy: 1000}
        outcome: >-
          The monks grind it into their soup so that every one of them may share it. 'The
          lord of all India,' you say, 'is now the lord of half a fruit.' The story will be
          told in every Buddhist land.
      - label: "Make the ministers obey you"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          The ministers bow and pay. The crown prince remembers.
      - label: "Retire quietly and let the prince rule"
        unrest_bp: -300
        legitimacy_bp: 500
        outcome: >-
          You stop giving orders and let your grandson run the treasury. The court breathes more
          easily, and the monks have to find another patron.
    history: >-
      The half-amalaka story comes from the Ashokavadana. Ashoka died about 232 BC; within
      fifty years the empire had broken up, and in 185 BC the last Maurya was murdered by his
      general Pushyamitra.
    sources: ["Ashokavadana", "Thapar (1961)"]
