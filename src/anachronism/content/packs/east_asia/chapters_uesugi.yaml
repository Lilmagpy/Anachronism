schema_version: 1
# Chronicle mode (D-120, D-152): Uesugi Kenshin, the Dragon of Echigo, 1560-1580.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Uesugi house documents, the Koyo gunkan, the Shincho koki, and modern
# work by Turnbull and Imatani. Kenshin's legend grew large in the Edo period; the notes say
# where. benchmark_provinces counts the provinces of this map the real Uesugi held.
chapters:
  - id: ues_odawara
    scenario: sengoku
    civ: uesugi
    year: 1560
    until_year: 1563
    title: "The Siege of Odawara"
    place: "The Kanto plain"
    speaker: steward
    speaker_name: "Uesugi Norimasa"
    speaker_title: "The exiled Kanto deputy"
    needs_alive: [hojo]
    benchmark_provinces: 1
    story: >-
      You are Nagao Kagetora, lord of Echigo, thirty years old. You have never married, you
      drink a great deal of sake, and you pray to Bishamon, god of war, whose avatar many
      believe you are. Your banner is a single character: Bi, for Bishamon.


      Uesugi Norimasa, the shogun's deputy for the Kanto, was driven from his lands by the Hojo
      of Odawara and has taken refuge with you. He offers you his name, his title and his
      cause, if you will drive out the Hojo. The lords of the Kanto are waiting to see what you
      do.
    choices:
      - label: "Lead the Kanto lords against Odawara"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          A hundred thousand men gather under your banner and besiege Odawara. Its walls are too
          strong and its stores too full; after a month your allies begin to drift home. At the
          shrine of Tsurugaoka Hachiman in Kamakura you are adopted into the Uesugi house and
          made Kanto deputy. From now on your name is Uesugi Masatora - and later, Kenshin.
        deeds: {war_with: [hojo], grudges: {hojo: 2500}}
      - label: "Stay in Echigo"
        legitimacy_bp: -500
        outcome: >-
          Norimasa lives on in your guest house. The Hojo grow stronger in the Kanto.
    history: >-
      In 1560-61 Kagetora led a great army into the Kanto and besieged Odawara; he was adopted
      as heir by Uesugi Norimasa and appointed Kanto kanrei.
    diverged: >-
      The Hojo are gone.
    sources: ["Uesugi-ke monjo", "Turnbull, Samurai Warfare (1996)"]

  - id: ues_kawanakajima
    scenario: sengoku
    civ: uesugi
    year: 1561
    until_year: 1564
    title: "Three Strokes of the Sword"
    place: "Mount Saijo, above Kawanakajima"
    speaker: general
    speaker_name: "Kakizaki Kageie"
    speaker_title: "Your vanguard commander"
    needs_alive: [takeda]
    benchmark_provinces: 1
    story: >-
      Takeda Shingen has invaded northern Shinano again, and you have come south and camped on
      Mount Saijo, above his castle at Kaizu. Tonight you see too much smoke rising from his
      kitchens: he is cooking for a night march.


      He means to attack you from behind and drive you down the mountain onto his waiting
      army.
    choices:
      - label: "Slip down the mountain in the dark, and hit his main army at dawn"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your army comes silently down the mountain with the horses' bits gagged. When the fog
          lifts at dawn, Shingen finds you in front of him instead of above him. His brother and
          his strategist die. The legend says you ride into his camp alone on a white horse, and
          strike at him three times; he parries with his iron war fan. Then his other army
          comes back from the mountain, and you withdraw. Nothing has changed - except the
          legend.
        deeds: {war_with: [takeda], grudges: {takeda: 2000}}
      - label: "Stay on the mountain and wait for him"
        legitimacy_bp: 300
        outcome: >-
          Shingen's night attack climbs the mountain and finds your fortified camp ready. It is
          a long, bloody day. Both of you go home.
        deeds: {war_with: [takeda]}
    history: >-
      At the fourth battle of Kawanakajima (1561) Kenshin anticipated Shingen's 'woodpecker'
      plan. The single combat is told in the Koyo gunkan and may be legend.
    diverged: >-
      The Takeda are gone.
    sources: ["Koyo gunkan", "Uesugi-ke monjo"]

  - id: ues_salt
    scenario: sengoku
    civ: uesugi
    year: 1568
    title: "I Fight with Swords"
    place: "Kasugayama castle, Echigo"
    speaker: steward
    speaker_name: "Naoe Kagetsuna"
    speaker_title: "Your chief retainer"
    needs_alive: [takeda]
    benchmark_provinces: 1
    story: >-
      Takeda Shingen has broken with the Imagawa and the Hojo, and they have closed the
      Pacific coast roads to Kai. Kai has no sea. No salt is reaching it, and the farmers of
      Kai cannot preserve their food for the winter.


      Echigo is on the Sea of Japan. Its salt merchants could reach Kai through the mountains.
      Your retainers say: let Shingen's people starve, and Shingen with them.
    choices:
      - label: "Let the salt go through, at a fair price"
        historical: true
        legitimacy_bp: 2000
        influence: {guilds: 1000}
        outcome: >-
          'I fight with swords, not with salt,' you say. The salt goes over the mountains to
          Kai. Shingen sends you a fine sword in thanks. 'To send salt to your enemy' will become
          a Japanese proverb for honourable generosity.
      - label: "Close the passes too"
        legitimacy_bp: -500
        outcome: >-
          Kai goes hungry. Shingen's men do not forget whose salt they did not get.
        deeds: {grudges: {takeda: 2000}}
    history: >-
      The story that Kenshin let salt reach Kai during the 1568 embargo is traditional and may
      be embellished; it gave Japanese the idiom 'teki ni shio wo okuru'.
    diverged: >-
      The Takeda are gone.
    sources: ["Edo-period chronicles", "Turnbull (1996)"]

  - id: ues_noto
    scenario: sengoku
    civ: uesugi
    year: 1576
    title: "The Road West"
    place: "Kasugayama"
    speaker: ashikaga
    speaker_name: "Ashikaga Yoshiaki, by letter"
    speaker_title: "The exiled shogun"
    benchmark_provinces: 1
    story: >-
      Shingen is dead. The shogun Yoshiaki, driven from Kyoto by Oda Nobunaga, writes from
      exile begging you to come west and destroy the tyrant. The warrior monks of the
      Ikko sect, your enemies for years, have offered peace, because they hate Nobunaga more.


      To go west you must first take Noto and Kaga, on the coast.
    choices:
      - label: "Make peace with the monks, and march west"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You take the great castle of Nanao in Noto after a year's siege and march into Kaga.
          Nobunaga's general Shibata Katsuie is coming to meet you with forty thousand men.
        deeds: {take: [j_kaga]}
      - label: "Stay in the east and fight the Hojo"
        legitimacy_bp: -300
        outcome: >-
          You turn east again. Nobunaga is grateful.
    history: >-
      From 1576 Kenshin allied with the Ikko-ikki and the exiled shogun against Nobunaga and
      took Nanao castle in Noto (1577).
    sources: ["Uesugi-ke monjo", "Shincho koki 10"]

  - id: ues_tedorigawa
    scenario: sengoku
    civ: uesugi
    year: 1577
    until_year: 1579
    title: "The Tedori River"
    place: "Kaga, by the Tedori river"
    speaker: general
    speaker_name: "Kakizaki Kageie"
    speaker_title: "Your vanguard commander"
    needs_alive: [oda]
    benchmark_provinces: 2
    story: >-
      Shibata Katsuie's army has crossed the Tedori river, swollen with autumn rain, not
      knowing that Nanao has already fallen and that you are close. Hideyoshi has quarrelled
      with Katsuie and taken his men home.


      It is night. The river is behind the Oda army.
    choices:
      - label: "Attack them with the river at their backs"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Your attack drives the Oda army into the flooded river; a thousand drown. A mocking
          song goes round: 'Meeting the Uesugi, the Oda are weak; Kenshin, the Tedori swept them
          away.' You go home to Kasugayama to prepare a greater army for next spring, and
          Kyoto.
        deeds: {war_with: [oda], grudges: {oda: 3000}}
      - label: "Let them retreat, and wait for spring"
        legitimacy_bp: 500
        outcome: >-
          Katsuie gets back across the river in good order. Both armies winter at home.
        deeds: {war_with: [oda]}
    history: >-
      At the Tedorigawa (1577) Kenshin defeated Shibata Katsuie's Oda army, which lost many men
      in the flooded river.
    diverged: >-
      The Oda are gone.
    sources: ["Uesugi-ke monjo", "Shincho koki 10"]

  - id: ues_otate
    scenario: sengoku
    civ: uesugi
    year: 1578
    title: "The Dragon Dies"
    place: "Kasugayama castle"
    speaker: steward
    speaker_name: "Naoe Kanetsugu"
    speaker_title: "A young retainer of Kagekatsu"
    benchmark_provinces: 2
    story: >-
      Kenshin is dead. He collapsed in the privy of Kasugayama in the spring, as the army was
      gathering for the march on Kyoto, and died four days later at forty-eight. He wrote a
      death poem: 'Forty-nine years, one sleep; a lifetime of glory, a cup of sake.'


      He never married and never named an heir. He adopted two sons: his nephew Kagekatsu, an
      Echigo man; and Kagetora, a son of the Hojo, given to him as a hostage once and loved like
      a son. You are Kagekatsu, and your men have taken the castle's main tower and its gold.
      Kagetora's men have taken the outer residence. The Hojo and the Takeda are watching.
    choices:
      - label: "Fight Kagetora for the inheritance"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 3000
        outcome: >-
          A year of civil war follows. You bribe the Takeda to stay out with gold and the offer
          of a Takeda bride. Kagetora is cornered and kills himself. Echigo is yours, and half its
          warriors are dead. Nobunaga's generals take Kaga and Noto back.
        deeds: {give: [j_kaga]}
      - label: "Divide the inheritance with Kagetora"
        legitimacy_bp: 500
        outcome: >-
          You keep Echigo; Kagetora takes the Kanto title and the lands near the Hojo. The two
          brothers are polite to each other, and the Uesugi stay strong.
    history: >-
      Kenshin died suddenly on 19 April 1578, probably of a stroke. His adopted sons fought the
      Otate disturbance (1578-79); Kagekatsu won and Kagetora killed himself.
    sources: ["Uesugi-ke monjo", "Imatani, Uesugi Kenshin (1991)"]
