schema_version: 1
# Chronicle mode (D-120, D-XXX): the Qara Khitai (Western Liao), 1206-1218. Each chapter opens
# in its year; one choice is what history chose (historical: true). Facts follow Juvaini's
# History of the World-Conqueror, the Liao shi (the chapter on Yelu Zhilugu and Kuchlug),
# Ibn al-Athir and the Yuan shi, with modern work by Biran (The Empire of the Qara Khitai,
# 2005). Dates before 1218 are approximate: the sources disagree by a year or two on Kuchlug's
# arrival (c. 1204-1206), the battle of Talas (c. 1210) and the ambush of the Gurkhan
# (1211, sometimes 1212). benchmark_provinces counts the provinces of this map the real
# state held at that date.
chapters:
  - id: kk_naiman
    scenario: great_khan
    civ: kara_khitai
    year: 1206
    title: "The Prince Without a Tribe"
    place: "Balasagun, the Gurkhan's court"
    speaker: steward
    speaker_name: "A minister of the Gurkhan"
    speaker_title: "At your court"
    benchmark_provinces: 3
    story: >-
      You are Yelu Zhilugu, Gurkhan of the Qara Khitai, the Khitan who fled the Jurchen eighty
      years ago and made themselves masters of the cities from Kashgar to the Syr Darya. The
      Muslim princes of the west pay you tribute, and the Uyghurs of Turfan keep your
      resident in their city.


      A guest has come out of the east. Kuchlug is the son of the last khan of the Naimans,
      whom Temujin beat on the steppe two years ago; he got away with a few followers and
      has asked for shelter. He is a young man of good family, and an able one. Your ministers
      say it would be a shame to waste him.
    choices:
      - label: "Welcome him, and give him your daughter"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You give Kuchlug a wife of your own house and a place at court. He is grateful, and
          he is watching. The Muslim chroniclers, who write about all this a generation later,
          say he spent these years learning how your kingdom was held together.
      - label: "Send him on, and keep your own counsel"
        legitimacy_bp: 1100
        unrest_bp: 400
        outcome: >-
          Kuchlug goes off to wander among the Merkits and the Kirghiz. You have one less
          problem at court, and one more at the border.
      - label: "Hold him at court as a hostage, unmarried"
        legitimacy_bp: -300
        outcome: >-
          The Naiman prince sits at your table and says nothing. His followers murmur in the
          lodges outside.
    history: >-
      Kuchlug, son of the last Naiman khan, fled to the Qara Khitai after the Mongol victory
      of 1204; the Gurkhan received him kindly and gave him a daughter in marriage.
    sources: ["Juvaini 1.3 and 1.9", "Liao shi 30", "Biran, The Empire of the Qara Khitai (2005)"]

  - id: kk_envoy
    scenario: great_khan
    civ: kara_khitai
    year: 1209
    title: "The Resident Who Was Killed"
    place: "Balasagun"
    speaker: general
    speaker_name: "A courier from the east"
    speaker_title: "Mud to the knee"
    benchmark_provinces: 3
    story: >-
      You are the Gurkhan. The courier is breathless. The Uyghurs of Turfan, who have paid
      you tribute for two generations, have murdered your resident in their city. Their
      Idiqut, Barchuq, has sent word to the Mongol khan in the north, and he is asking to be
      taken as one of the khan's own household.


      Your treasury is thin and your western vassals are restless. An army sent over the
      Tianshan would show the oasis cities what happens to men who kill the Gurkhan's agents.
      It would also be a long way from home.
    choices:
      - label: "Send an army to punish Turfan"
        legitimacy_bp: 500
        unrest_bp: 1000
        wealth_bp: -800
        outcome: >-
          Your horsemen cross the mountains and the Uyghurs shut themselves behind their walls.
          You have shown your teeth. You have also shown the Khwarazmshah that the Gurkhan's
          army is far away.
      - label: "Let it pass, and watch the west"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          No army goes east, and the sources speak of none. Turfan is lost to you, and the
          other tribute-payers take note. The Karluk lord of Almaliq will soon go to the
          Mongols as well.
        deeds: {grudges: {uyghurs: 1500}}
      - label: "Send envoys to demand the killers"
        wealth_bp: -300
        legitimacy_bp: 300
        outcome: >-
          Your envoys cross the mountains to ask for the men who killed your resident and a fine
          in horses. The Idiqut receives them politely and sends them home with excuses. The
          silver you spent on their journey is the whole of what Turfan costs him.
    history: >-
      In 1209 the Uyghur Idiqut Barchuq had the Qara Khitai resident killed and submitted to
      Chinggis Khan. The Gurkhan took no recorded action, and the Karluk ruler of Almaliq
      followed the Uyghurs to the Mongols within a few years.
    sources: ["Juvaini 1.4", "Biran, The Empire of the Qara Khitai (2005)"]

  - id: kk_hunt
    scenario: great_khan
    civ: kara_khitai
    year: 1211
    title: "The Gurkhan Goes Hunting"
    place: "Near Balasagun"
    speaker: steward
    speaker_name: "A minister of the Gurkhan"
    speaker_title: "At your stirrup"
    benchmark_provinces: 3
    story: >-
      You are Zhilugu, Gurkhan, and the last two years have gone badly. The Khwarazmshah
      Muhammad and the lord of Samarkand have refused your tribute, and your army under
      Taniku has been beaten near the river Talas. Whatever the Muslim traders now say of
      you in the bazaars of Samarkand, it is not good.


      Kuchlug has come to you again. The Naiman and Merkit refugees are scattered across
      the steppe; if he is allowed to gather them, he says, he will bring you an army
      of loyal horsemen to refill your ranks. He is your son-in-law. Your ministers think it
      a bold and sensible offer.
    choices:
      - label: "Give him leave to gather his people"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          Kuchlug rides off, and he does gather an army. He also makes an understanding with
          the Khwarazmshah that they will divide your kingdom between them, and seizes your
          treasury at Uzgend. Then, while you are out hunting, his men fall on your
          party. You are made his prisoner. He keeps you in your own palace, with the
          title of Retired Emperor, and rules in your name. You will die within two years.
        deeds: {ruler_falls: "is seized by his son-in-law Kuchlug"}
      - label: "Refuse, and keep him at court"
        legitimacy_bp: 300
        outcome: >-
          Kuchlug thanks you with a smile. You raise what troops you can from your own
          lands, and they are not enough for the Khwarazmshah.
      - label: "Have him arrested before he rides"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          The Naiman prince is taken in his lodging. His wife, your daughter, weeps in the
          women's tents, and his followers are no longer yours to rely on.
    history: >-
      After the defeat at Talas (c. 1210), Kuchlug asked leave to gather the scattered Naiman
      and Merkit; instead he allied with the Khwarazmshah, plundered the treasury and, in 1211,
      captured the Gurkhan while he was hunting. Zhilugu was left on the throne in name and
      died in 1213.
    sources: ["Juvaini 1.9", "Liao shi 30", "Ibn al-Athir, year 607 AH", "Biran, The Empire of the Qara Khitai (2005)"]

  - id: kk_madrasa
    scenario: great_khan
    civ: kara_khitai
    year: 1215
    title: "The Door of the Madrasa"
    place: "Khotan"
    speaker: scholar
    speaker_name: "A Khitan priest"
    speaker_title: "Newly come from your wife"
    benchmark_provinces: 3
    story: >-
      You are Kuchlug. You were born a Christian of the Church of the East; your Khitan wife
      has made you a Buddhist, and your Buddhist priests have the ear of your court. You
      are lord of Kashgar, Khotan and Yarkand, and the great majority of your subjects
      are Muslims.


      You have a plan to bring them into line. They are to give up their Islam and take either
      Christianity or Buddhism, or else dress as the Khitan do. Your soldiers are to be
      quartered in their houses. Their imams are no longer to call to prayer. The old
      imam of Khotan, who will not be silenced, is the first to be dealt with.
    choices:
      - label: "Enforce the order, and make an example of the imam"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 3500
        outcome: >-
          The imam of Khotan, Ala al-Din Muhammad, is nailed to the door of his own madrasa.
          Soldiers lodge in Muslim homes and take what they like. Merchants stop coming to
          Kashgar, and the oasis towns begin to wait for any army that will come.
      - label: "Withdraw the order, and let the mosques open"
        legitimacy_bp: 1000
        unrest_bp: -1000
        outcome: >-
          The Muslim notables send you thanks and the Khitan priests send you reproaches. The
          towns are quiet, for the moment.
      - label: "Ban the call to prayer, but leave the imams alone"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          The muezzins fall silent and the imams are told to keep to their houses. The towns
          do not rise. They grow quiet in the way that a town grows quiet when it is waiting.
    history: >-
      Kuchlug, converted to Buddhism by his wife, persecuted the Muslims of Kashgar, Khotan
      and Yarkand from about 1213 to 1218, crucifying the imam of Khotan, and so earned the
      hatred of his subjects. He also killed the ruler of Almaliq, a Mongol vassal.
    sources: ["Juvaini 1.9 and 1.10", "Biran, The Empire of the Qara Khitai (2005)"]

  - id: kk_jebe
    scenario: great_khan
    civ: kara_khitai
    year: 1218
    title: "The Arrow"
    place: "Kashgar"
    speaker: mongols
    speaker_name: "Jebe's envoy"
    speaker_title: "From the Mongol army"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Kuchlug. A Mongol army twenty thousand strong, under the general Jebe, has
      come over the Tianshan. Your own men are scattered across the oases, and they are
      not in love with you. Your officers are asking whether anyone will fight for
      Kashgar.


      Jebe has had a proclamation read in every town: let each man keep his own faith. The
      mosques that you shut are being opened by the townspeople themselves.
    choices:
      - label: "Flee into the mountains"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          You ride south into the Pamirs with a handful of men. Local hunters, hearing what
          you are, show the Mongols the way. You are caught in the valley of Sarikol, in
          Badakhshan, and killed. Your head is paraded through Kashgar.
        deeds: {give: [g_kashgar, g_almaliq], give_to: mongols, ruler_falls: "is killed by hunters in the Pamirs"}
      - label: "Stand and fight outside the city"
        legitimacy_bp: -500
        unrest_bp: 2000
        outcome: >-
          Your men do not fight. The Muslim townsfolk close the gates behind you and open them
          for the Mongols.
        deeds: {give: [g_kashgar, g_almaliq], give_to: mongols}
      - label: "Offer Jebe submission and tribute"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your envoy goes out with a hostage and a gift of horses. Jebe sends him back with
          the same proclamation that has been read in every town, and an order to open
          Kashgar. He has not come to bargain with a man whom his own people have turned out.
        deeds: {give: [g_kashgar], give_to: mongols}
    history: >-
      In 1218 Jebe's army entered the Qara Khitai lands, proclaimed freedom of religion and was
      welcomed by the Muslim towns. Kuchlug fled south and was caught and killed by local
      hunters in Badakhshan. The Qara Khitai state ended.
    diverged: >-
      The Mongols are gone.
    sources: ["Juvaini 1.9", "Yuan shi 120 (Jebe)", "Biran, The Empire of the Qara Khitai (2005)"]
