schema_version: 1
# Chronicle mode (D-120, D-185): the Later Hojo of Odawara, masters of the Kanto, from
# Kenshin's siege to Hideyoshi's, 1561-1590. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow the Hojo godai ki, the Hojo letters
# and land registers, the Koyo gunkan (used with care), the Uesugi records, and modern work
# by Kuroda Motoki, Birt and Turnbull. benchmark_provinces counts the provinces of this map
# the real Hojo held at that date.
chapters:
  - id: hojo_kenshin
    scenario: sengoku
    civ: hojo
    year: 1561
    title: "A Hundred Thousand at the Gates"
    place: "Odawara castle"
    speaker: general
    speaker_name: "Hojo Tsunashige"
    speaker_title: "Commander of Tamanawa castle, your brother-in-law"
    needs_alive: [uesugi]
    benchmark_provinces: 2
    story: >-
      You are Hojo Ujiyasu. Your grandfather, a wandering adventurer, took Odawara by a trick;
      your father and you have taken the whole Kanto plain from the old lords. Those lords
      have now called in Uesugi Kenshin from Echigo, and he has come over the mountains with,
      they say, a hundred thousand men.


      They are camped around Odawara, burning the town. Your castle is the strongest in the
      east, and well stocked.
    choices:
      - label: "Shut the gates and wait"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          Kenshin rides up to the moat, it is said, and sits his horse drinking sake within
          bowshot while your archers miss him. After a month his allies start going home to
          plant their rice. He leaves, takes the title of Kanto deputy at Kamakura, and goes
          back over the mountains. You retake everything he took within the year.
      - label: "Sally out and fight"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Your samurai ride out into a hundred thousand men, and few ride back.
      - label: "Buy off Kenshin's allies with gold and promises"
        legitimacy_bp: 1700
        wealth_bp: -1500
        outcome: >-
          Your agents ride out of the postern by night with gold and the promise of land.
          Several of the Kanto lords find that their harvests need them, and Kenshin finds
          himself with fewer men and less to say.
    history: >-
      Uesugi Kenshin besieged Odawara in 1561 with a coalition of Kanto lords but withdrew
      after about a month; the Hojo recovered their losses.
    diverged: >-
      The Uesugi are gone.
    sources: ["Hojo godai ki", "Kuroda Motoki, Sengoku Hojo-shi godai (2012)"]

  - id: hojo_saburo
    scenario: sengoku
    civ: hojo
    year: 1569
    title: "A Son for the Enemy"
    place: "Odawara"
    speaker: steward
    speaker_name: "Hojo Saburo"
    speaker_title: "Your seventh son"
    needs_alive: [takeda, uesugi]
    benchmark_provinces: 2
    story: >-
      Takeda Shingen has broken the alliance of the three houses: he has invaded Suruga and
      driven out the Imagawa, your daughter's husband's family. Now he has come to the gates
      of Odawara itself, burned the town, and gone home through the mountains.


      Your enemy of twenty years, Uesugi Kenshin, also hates Shingen. He would make an
      alliance with you, if you send him one of your sons, to be adopted as his own.
    choices:
      - label: "Send Saburo to Kenshin"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Saburo goes to Echigo. Kenshin likes him at once, gives him his own former name,
          Kagetora, and his niece as a wife. The alliance with Kenshin never does much good.
          Saburo will die because of it.
        deeds: {peace_with: [uesugi]}
      - label: "Make it up with Shingen instead"
        legitimacy_bp: -500
        outcome: >-
          Your envoys go to Kofu with gifts. Shingen accepts them, and keeps Suruga.
        deeds: {peace_with: [takeda]}
      - label: "Keep your sons, and fortify the passes"
        legitimacy_bp: 1200
        wealth_bp: -500
        outcome: >-
          You send neither son anywhere. The passes are strengthened and your vassals are
          called to castle-guard, and you wait to see who moves first.
        deeds: {men: 6000}
    history: >-
      After Shingen's invasion of Suruga (1568) and attack on Odawara (1569), the Hojo allied
      with Kenshin and sent Hojo Saburo, who became Uesugi Kagetora.
    diverged: >-
      The Takeda or the Uesugi are gone.
    sources: ["Uesugi-ke monjo", "Kuroda Motoki, Sengoku Hojo-shi godai (2012)"]

  - id: hojo_ujiyasu
    scenario: sengoku
    civ: hojo
    year: 1571
    title: "The Old Lion's Advice"
    place: "Odawara"
    speaker: steward
    speaker_name: "Hojo Ujimasa"
    speaker_title: "Your son and heir"
    needs_alive: [takeda]
    benchmark_provinces: 2
    story: >-
      You are dying. You have fought everyone in the east, and won most of the time. Your son
      Ujimasa will rule after you. He is careful, and slow, and eats his rice with too much
      soup, which you once said showed he could not judge measures.


      You tell him what to do about Shingen.
    choices:
      - label: "Renew the Takeda alliance"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          'Do not trust Kenshin. Make peace with Shingen.' Ujimasa does as you say: he breaks
          with Kenshin and renews the old alliance with the Takeda. Saburo stays in Echigo,
          hostage to an alliance that no longer exists.
        deeds: {peace_with: [takeda]}
      - label: "Keep fighting Shingen"
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Ujimasa keeps your enemies and your allies as they are. The war in the mountains
          goes on, with its raids, its plunder and its losses.
        deeds: {martial_bp: 600, men: 6000}
      - label: "Hold the castles, and sign with neither"
        legitimacy_bp: 700
        outcome: >-
          Ujimasa is told to keep the castles in good order, and to trust neither Shingen nor
          Kenshin. It is a safe plan, and a slow one.
        deeds: {men: 5000, martial_bp: 500}
    history: >-
      Hojo Ujiyasu died in 1571, reportedly advising reconciliation with the Takeda; Ujimasa
      renewed the Takeda alliance that year.
    diverged: >-
      The Takeda are gone.
    sources: ["Hojo godai ki", "Kuroda Motoki, Sengoku Hojo-shi godai (2012)"]

  - id: hojo_otate
    scenario: sengoku
    civ: hojo
    year: 1578
    title: "Two Heirs in Echigo"
    place: "Odawara"
    speaker: general
    speaker_name: "A messenger from Echigo"
    speaker_title: "From your brother Kagetora"
    needs_alive: [uesugi]
    benchmark_provinces: 2
    story: >-
      You are Hojo Ujimasa. Uesugi Kenshin has died of a stroke without naming an heir. His
      two adopted sons - your brother Kagetora and his nephew Kagekatsu - are fighting for
      Echigo. Kagetora holds out in the old Kanto deputy's residence and begs for an army.


      Your ally Takeda Katsuyori is nearer, and you have asked him to help Kagetora. You hear
      that Kagekatsu has offered Katsuyori gold and a marriage.
    choices:
      - label: "Rely on your ally Katsuyori to act"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Katsuyori takes Kagekatsu's gold and his sister, and goes home. Your own army arrives
          late and goes home for the winter. Kagetora's castle falls, and he kills himself. You
          break with the Takeda, and in four years Nobunaga destroys them.
        deeds: {grudges: {takeda: 1500}}
      - label: "Send your own army over the mountains now"
        materials_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Your army crosses the passes before the snow. Kagekatsu is caught between two
          armies.
      - label: "Send a small force with letters to Kagetora's men"
        legitimacy_bp: -500
        outcome: >-
          A small column crosses the passes with letters for Kagetora's supporters. It is too
          small to turn the war and too large to be disowned.
        deeds: {men: 5000}
    history: >-
      In the Otate disturbance (1578-1579) Uesugi Kagetora, born Hojo Saburo, lost to Uesugi
      Kagekatsu, who was backed by Takeda Katsuyori; Kagetora killed himself.
    diverged: >-
      The Uesugi are gone.
    sources: ["Uesugi-ke monjo", "Kuroda Motoki, Sengoku Hojo-shi godai (2012)"]

  - id: hojo_odawara
    scenario: sengoku
    civ: hojo
    year: 1590
    title: "The Council That Never Ended"
    place: "Odawara castle"
    speaker: steward
    speaker_name: "Your council"
    speaker_title: "In session, again"
    benchmark_provinces: 1
    story: >-
      Toyotomi Hideyoshi, master of the rest of Japan, ordered you to come to Kyoto and bow.
      You did not. Now two hundred thousand men are around Odawara, by land and sea. Your
      outlying castles are falling one by one.


      Hideyoshi has built a stone castle on the hill opposite in eighty days, hidden behind
      the trees, and then cut the trees down all at once, so that it seems to have appeared
      overnight. He holds tea ceremonies and has brought his concubine. Your councillors meet
      every day to decide whether to fight or surrender, and decide nothing.
    choices:
      - label: "Let the council go on debating"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          After three months, Odawara surrenders. You and your brother are ordered to cut your
          bellies; your son is sent to a monastery on Mount Koya. Hideyoshi gives the Kanto to
          Tokugawa Ieyasu, who makes the fishing village of Edo his capital. 'Odawara council'
          becomes a Japanese proverb for a meeting that never decides anything.
        deeds: {ruler_falls: "is ordered to cut his belly by Hideyoshi", give: [j_musashi]}
      - label: "Ride to Hideyoshi's camp and bow"
        legitimacy_bp: -1500
        outcome: >-
          You go out in plain clothes and kneel. Hideyoshi lets the Hojo keep Sagami, and moves
          on to the north.
        deeds: {give: [j_musashi]}
      - label: "Fight on to the last, with every retainer"
        legitimacy_bp: -2000
        unrest_bp: 500
        outcome: >-
          You order every castle held and every retainer to the walls. Odawara stands for
          months, and when it falls it falls with its lord.
        deeds: {ruler_falls: "dies in the last stand at Odawara", give: ["j_musashi"]}
    history: >-
      Hideyoshi besieged Odawara in 1590; the Hojo, after long indecisive councils,
      surrendered. Ujimasa and his brother were ordered to commit seppuku and the Kanto went
      to Tokugawa Ieyasu.
    sources: ["Hojo godai ki", "Berry, Hideyoshi (1982)", "Turnbull, The Samurai Sourcebook (1998)"]
