schema_version: 1
# Chronicle mode (D-120, D-146): Baekje, from the hostage prince to the fall of Hanseong,
# 400-477. Each chapter opens in its year; one choice is what history chose.
# Facts follow the Samguk sagi (Baekje annals), the Nihon shoki (which quotes lost Baekje
# books but has its own Japanese agenda), the Song shu and Wei shu, and the Gwanggaeto stele
# (Goguryeo's side), with modern work by Best, Lee Ki-baik and Farris. Early Baekje dates are
# uncertain. benchmark_provinces counts the provinces of this map the real Baekje held.
chapters:
  - id: bae_wa
    scenario: three_kingdoms
    civ: baekje
    year: 400
    title: "The Prince Across the Sea"
    place: "Hanseong, on the Han river"
    speaker: steward
    speaker_name: "Haechung"
    speaker_title: "A minister of the court"
    benchmark_provinces: 3
    story: >-
      Four years ago Gwanggaeto of Goguryeo stormed fifty-eight of your walled towns and made
      you kneel and swear to be his slave forever. You did not mean it. You have sent your
      eldest son, Prince Jeonji, across the sea to the Wa kings of Yamato as a hostage, in
      return for their soldiers.


      Now the Wa are raiding Silla, Goguryeo's little brother, and Gwanggaeto is said to be
      marching south with fifty thousand men to defend it. Your ministers ask whether Baekje
      will fight beside the Wa.
    choices:
      - label: "Join the Wa against Goguryeo"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Baekje ships carry Wa soldiers, and Baekje gold pays them. Goguryeo's horsemen drive
          the Wa out of Silla and into Gaya. Four years later, Baekje and Wa ships land an army
          on Goguryeo's own coast - and it, too, is destroyed.
        deeds: {ally_with: [wa], war_with: [goguryeo], grudges: {goguryeo: 2000}}
      - label: "Keep your oath to Goguryeo"
        legitimacy_bp: -800
        wealth_bp: 500
        outcome: >-
          The Wa fight alone. Your son in Yamato is treated more coldly.
        deeds: {peace_with: [goguryeo]}
      - label: "Send the Wa supplies but not soldiers"
        wealth_bp: 100
        legitimacy_bp: 300
        outcome: >-
          Baekje ships carry rice and iron to the Wa, and no Baekje man joins the fighting.
          The Wa are glad of the help and sorry there is not more of it.
        deeds: {ships: 3}
    history: >-
      In 397 King Asin sent Prince Jeonji as a hostage to Wa. Baekje and Wa fought Goguryeo
      and Silla around 400-404, according to the Gwanggaeto stele and the Samguk sagi.
    sources: ["Samguk sagi, Baekje annals (397)", "Gwanggaeto stele"]

  - id: bae_return
    scenario: three_kingdoms
    civ: baekje
    year: 405
    title: "Wait on the Island"
    place: "An island off the coast"
    speaker: steward
    speaker_name: "Haechung"
    speaker_title: "A minister of the court"
    benchmark_provinces: 3
    story: >-
      King Asin is dead, and you, Prince Jeonji, have been sent home from Yamato with a Wa
      escort to take the throne. But before you have landed, Haechung has rowed out to meet
      you: your uncle Hunhae, who was keeping the throne for you, has been murdered by your
      youngest uncle Seollye, who has made himself king.
    choices:
      - label: "Wait offshore until the people decide"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You wait on an island, with your Wa guards, while the people of Hanseong hear that
          their rightful king is offshore. They kill Seollye themselves and send for you. You
          are crowned, and you make Haechung your chief minister.
      - label: "Land with your Wa guards and seize the throne"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Your Wa escort storms the palace. You are king - with foreign soldiers in your
          capital, and every noble family counting the dead.
        deeds: {men: 3000}
      - label: "Send Haechung ahead to win over the nobles"
        legitimacy_bp: 1100
        influence: {nobility: 800}
        outcome: >-
          Haechung goes ashore with your name and a purse for the great families. Some of them
          receive him warmly, and some are not yet sure which uncle will last.
    history: >-
      On Asin's death in 405, Jeonji returned from Wa; his uncle Seollye had seized power.
      Warned by Haechung, Jeonji waited on an island until the people killed Seollye.
    sources: ["Samguk sagi, Baekje annals (405)", "Nihon shoki, Ojin 16"]

  - id: bae_jin
    scenario: three_kingdoms
    civ: baekje
    year: 416
    title: "Ships to the Southern Court"
    place: "Hanseong"
    speaker: scholar
    speaker_name: "A Baekje scholar of the Five Classics"
    speaker_title: "Back from Jiankang"
    needs_alive: [eastern_jin]
    benchmark_provinces: 3
    story: >-
      Baekje's ships sail across the Yellow Sea to Jiankang, capital of the southern Chinese
      empire of Jin, carrying furs and ginseng and bringing back silk, books and Buddhist
      teachers. Now the Jin emperor has sent you a title: 'Commander of the armies, King of
      Baekje'.


      Your scholars want more: teachers of the classics, physicians, astronomers, and more
      monks. Some of your nobles say Baekje is turning into a copy of China.
    choices:
      - label: "Send more ships for teachers and books"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 800
        outcome: >-
          Scholars of the Five Classics and Buddhist monks come to Hanseong. And Baekje passes
          the learning on: to the Wa, whose courts will one day say that a Baekje scholar called
          Wang In brought them the Analects and the Thousand Character Classic, and with them,
          writing.
        deeds: {ally_with: [eastern_jin]}
      - label: "Keep to Baekje's own ways and arms"
        influence: {nobility: 1000}
        outcome: >-
          The ships still sail, but carry only trade.
        deeds: {men: 1500}
      - label: "Send only trading ships and a few monks"
        legitimacy_bp: 400
        knowledge_bp: 800
        wealth_bp: 1200
        outcome: >-
          Furs and ginseng go out, silk and a handful of monks come back. It is a quieter
          road than your scholars wished for.
        deeds: {ships: 2}
    history: >-
      Eastern Jin granted Jeonji a title in 416. Baekje was the main channel of Chinese learning
      and Buddhism to Japan; the Nihon shoki credits the Baekje scholar Wani (Wang In) with
      bringing books to Japan.
    diverged: >-
      The Jin court is gone.
    sources: ["Song shu 97", "Nihon shoki, Ojin 15-16", "Best, A History of the Early Korean Kingdom of Paekche (2006)"]

  - id: bae_alliance
    scenario: three_kingdoms
    civ: baekje
    year: 433
    until_year: 440
    title: "White Falcons for Silla"
    place: "Hanseong"
    speaker: silla
    speaker_name: "Envoys of King Nulji"
    speaker_title: "From Silla"
    needs_alive: [silla]
    benchmark_provinces: 3
    story: >-
      Goguryeo's great King Jangsu has moved his capital south to Pyongyang, only a few days'
      march from Hanseong. Silla, which has been Goguryeo's little brother for a generation,
      has had enough of Goguryeo soldiers in its capital too.


      Silla's envoys have come with gifts of fine horses. They propose that the two southern
      kingdoms forget their old quarrels.
    choices:
      - label: "Make peace with Silla"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You send Silla white falcons; Silla sends you a bright pearl. The alliance between
          Baekje and Silla will last a hundred and twenty years - until Silla breaks it.
        deeds: {ally_with: [silla]}
      - label: "Strike Silla's border before it turns"
        wealth_bp: 1000
        legitimacy_bp: 600
        outcome: >-
          Your raiders bring home cattle. Silla goes back to Goguryeo for protection.
        deeds: {men: 2000, grudges: {silla: 2000}}
      - label: "Take the gifts but sign nothing"
        wealth_bp: 500
        legitimacy_bp: -200
        outcome: >-
          The envoys go home with warm words and no pact. Silla notes that you took the horses
          and gave only courtesy in return.
    history: >-
      In 433 Baekje's King Biyu and Silla's King Nulji made peace, the start of the Naje
      alliance against Goguryeo that lasted until 553.
    diverged: >-
      Silla is gone.
    sources: ["Samguk sagi, Baekje annals (433-434)"]

  - id: bae_gonji
    scenario: three_kingdoms
    civ: baekje
    year: 461
    title: "A Prince Born on an Island"
    place: "Hanseong"
    speaker: steward
    speaker_name: "Prince Gonji"
    speaker_title: "Your younger brother"
    needs_alive: [wa]
    benchmark_provinces: 3
    story: >-
      You are King Gaero. The Wa alliance must be kept warm, and you are sending your brother
      Gonji to the court of the Wa king. Gonji has asked for one of your consorts to go with
      him as his wife. She is pregnant.


      The Nihon shoki, written in Japan two centuries later, will say that you agreed - on
      condition that if the child was born on the way, it was to be sent home.
    choices:
      - label: "Let her go with him"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          On the island of Kakara, off Kyushu, the consort gives birth to a son. He is sent home
          to Baekje in a boat, and named Sama, 'island'. Forty years later he will be King
          Muryeong, and his tomb, found by accident in 1971, will be the only royal tomb of the
          Three Kingdoms whose owner is known for certain.
        deeds: {ally_with: [wa]}
      - label: "Send Gonji with an escort of your own men"
        legitimacy_bp: 300
        outcome: >-
          Gonji goes to the Wa court with his own men, and without a wife of your giving, and stays fifteen years.
        deeds: {ally_with: [wa]}
      - label: "Send Gonji with a lady of the court"
        legitimacy_bp: 300
        wealth_bp: -300
        outcome: >-
          Gonji sails with a young woman of a good family as his wife, and the Wa court receives
          the match with pleasure.
        deeds: {ally_with: [wa]}
    history: >-
      The Nihon shoki tells how Gaero's brother Gonji went to Wa in 461 and King Muryeong was
      born on Kakara island; Muryeong's tomb at Gongju (1971) confirms his name and dates.
    diverged: >-
      The Wa are gone.
    sources: ["Nihon shoki, Yuryaku 5", "Muryeong tomb epitaph (Gongju)"]

  - id: bae_wei_letter
    scenario: three_kingdoms
    civ: baekje
    year: 472
    until_year: 475
    title: "A Letter to the Emperor of Wei"
    place: "Hanseong"
    speaker: scholar
    speaker_name: "Your court scribe"
    speaker_title: "Keeper of the royal letters"
    needs_alive: [northern_wei, goguryeo]
    benchmark_provinces: 3
    story: >-
      Goguryeo grows stronger every year. King Jangsu has reigned for sixty years and shows no
      sign of dying. Your scribe has drafted a letter to the emperor of Northern Wei, who rules
      all of north China: Goguryeo, it says, is cruel and rotten, its king a 'wild dog'. Let
      Wei send an army, and Baekje will help destroy it.
    choices:
      - label: "Send the letter to Northern Wei"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          The Wei emperor reads it and sends an envoy - to Goguryeo, asking what this is about.
          Jangsu makes sure the envoy never reaches you, and Wei tells you to make your own
          peace. Jangsu now knows exactly what you think of him.
        deeds: {grudges: {goguryeo: 2500}}
      - label: "Send it to the Song court in the south"
        legitimacy_bp: 300
        outcome: >-
          The Song are far away and friendly. They send you a title, a robe and their best
          wishes.
      - label: "Send gifts to Jangsu and ask for peace"
        wealth_bp: -800
        legitimacy_bp: -300
        outcome: >-
          Your envoys carry gold and fine cloth north. Jangsu receives them courteously, and
          keeps his army where it is.
        deeds: {peace_with: [goguryeo]}
    history: >-
      In 472 King Gaero asked Northern Wei for help against Goguryeo; his letter survives in
      the Wei shu. Wei refused.
    diverged: >-
      Wei or Goguryeo is gone.
    sources: ["Wei shu 100 (Baekje)"]

  - id: bae_dorim
    scenario: three_kingdoms
    civ: baekje
    year: 474
    until_year: 478
    title: "A Game of Baduk"
    place: "The palace, Hanseong"
    speaker: diviner
    speaker_name: "Dorim"
    speaker_title: "A monk from Goguryeo"
    needs_alive: [goguryeo]
    needs_owner: {k4_hanseong: baekje}
    benchmark_provinces: 3
    story: >-
      A monk called Dorim fled to you from Goguryeo, he says, in disgrace. He is the best
      baduk player you have ever met, and you play with him every day. He has become your
      friend.


      Dorim says that a great king should have walls worthy of him, a palace worthy of him,
      tombs worthy of his ancestors and dikes along the Han. You have begun them all. Your
      treasury is nearly empty, and the people are tired.
    choices:
      - label: "Finish the walls and the palace"
        historical: true
        legitimacy_bp: 500
        materials_bp: -3000
        unrest_bp: 2000
        outcome: >-
          The new walls rise and the granaries empty. Then Dorim disappears. Weeks later King
          Jangsu's army crosses the Han with thirty thousand men. The northern city falls in
          seven days. You flee with a few horsemen and are caught by two Goguryeo generals who
          were once Baekje men; they spit in your face and behead you. Your son escapes south
          to Ungjin.
        deeds: {ruler_falls: "is captured and killed by Goguryeo", give: [k4_hanseong], give_to: goguryeo}
      - label: "Stop the building and fill the granaries"
        food_bp: 2500
        legitimacy_bp: -300
        outcome: >-
          The workmen go home. Dorim, finding his game finished, slips away to Goguryeo. When
          Jangsu's army comes, Hanseong is ready for it.
        deeds: {martial_bp: 1000}
      - label: "✦ Have Dorim followed"
        needs_adopted: [newspapers]
        legitimacy_bp: 1000
        outcome: >-
          Your printed court gazette reports, in all innocence, the monk's every visit to the
          docks - where, it turns out, he has been meeting Goguryeo merchants. Dorim is
          arrested. The building stops. Jangsu's army finds Hanseong full and waiting.
        deeds: {martial_bp: 1500}
      - label: "Finish the walls only, and halve the rest"
        materials_bp: -1500
        legitimacy_bp: 300
        unrest_bp: 800
        outcome: >-
          The walls are finished, the palace and the tombs wait, and Dorim says a king's house
          should not be half built. You answer that the treasury is half empty.
    history: >-
      The Samguk sagi tells how Jangsu sent the monk Dorim to exhaust Baekje with building
      projects; in 475 Goguryeo took Hanseong and killed King Gaero. Baekje moved its capital
      to Ungjin (Gongju).
    diverged: >-
      Hanseong is not yours, or Goguryeo is gone.
    sources: ["Samguk sagi, Baekje annals (475)", "Nihon shoki, Yuryaku 20"]

  - id: bae_ungjin
    scenario: three_kingdoms
    civ: baekje
    year: 476
    after: [bae_dorim]
    title: "The Bear Ford"
    place: "Ungjin (Gongju), on the Geum river"
    speaker: steward
    speaker_name: "Hae Gu"
    speaker_title: "Commander of the guard"
    benchmark_provinces: 2
    story: >-
      You are King Munju, Gaero's son. You went to Silla for help while your father was
      besieged, and came back with ten thousand Silla soldiers to find the capital burned and
      your father dead. Baekje has lost the Han river, its oldest city and the graves of its
      kings.


      You have brought the court south to Ungjin, the 'bear ford', a small fortress on the
      Geum river behind the mountains. The great families who came with you are quarrelling
      over who is to blame.
    choices:
      - label: "Make Ungjin your capital"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1500
        outcome: >-
          Ungjin becomes the capital. The great families fight for power; within two years
          Hae Gu has you murdered. But Baekje survives, and in fifty years, under King
          Muryeong - the boy born on Kakara island - and his son Seong, it will be rich and brilliant again.
        deeds: {capital: k4_ungjin}
      - label: "March north to retake Hanseong"
        legitimacy_bp: 1500
        food_bp: -3000
        outcome: >-
          Baekje's army, with Silla's soldiers, marches on the burned city. Goguryeo's
          garrison is waiting.
        deeds: {war_with: [goguryeo]}
      - label: "Hold the Geum with Silla's soldiers"
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          The Silla troops stay through the winter and keep the river crossings. They are
          a guest army, and the great families do not like owing Silla.
        deeds: {men: 4000}
    history: >-
      Munju moved the capital to Ungjin in 475 and was assassinated in 477 by Hae Gu. Baekje
      recovered under Muryeong (r. 501-523) and moved its capital again to Sabi in 538.
    sources: ["Samguk sagi, Baekje annals (475-477)"]
