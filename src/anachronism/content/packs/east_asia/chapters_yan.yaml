schema_version: 1
# Chronicle mode (D-120, D-178): the kingdom of Yan, from Zizhi's abdication to the fall of
# Liaodong, 316-222 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Shiji (Yan, Yue Yi, the assassins), the Zhanguo
# ce, the Mencius, and Yue Yi's letter to King Hui, with modern work by Lewis, Di Cosmo and
# Pines. benchmark_provinces counts the provinces of this map the real kings held at that
# date.
chapters:
  - id: yan_zizhi
    scenario: warring_states
    civ: yan
    year: -316
    title: "Like Yao Giving the Throne to Shun"
    place: "Ji, the capital"
    speaker: steward
    speaker_name: "Lu Maoshou"
    speaker_title: "A persuader at court"
    benchmark_provinces: 3
    story: >-
      You are King Kuai of Yan. The sage kings of antiquity, Yao and Shun, did not leave
      their thrones to their sons, but to the worthiest man in the realm. Your persuaders
      say your minister Zizhi is such a man, and that if you give him the throne, you will be
      remembered with Yao.


      Your son, Prince Ping, and the old nobility are not consulted.
    choices:
      - label: "Give the throne to Zizhi"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2500
        outcome: >-
          You hand over the seals of every office above a certain rank to Zizhi, and he rules
          as king. Within three years Prince Ping and the generals rise against him; the
          fighting in the capital kills tens of thousands, and the people stop trusting
          anyone.
        deeds: {ruler_falls: "gives his throne to his minister Zizhi"}
      - label: "Keep the throne for your son"
        legitimacy_bp: 500
        outcome: >-
          Zizhi is disappointed, and the persuaders go to another court with the same speech.
    history: >-
      King Kuai of Yan abdicated in favour of his minister Zizhi (c. 316 BC), provoking civil
      war.
    sources: ["Shiji 34 (Yan)", "Zhanguo ce, Yan 1", "Mencius 2B.8"]

  - id: yan_qi_invades
    scenario: warring_states
    civ: yan
    year: -314
    title: "Qi Comes to Help"
    place: "Ji"
    speaker: qi
    speaker_name: "Envoys of King Xuan of Qi"
    speaker_title: "At the border"
    needs_alive: [qi]
    benchmark_provinces: 3
    story: >-
      You are Zizhi, king of Yan for three years. Prince Ping's rebels are in the streets of
      the capital. King Xuan of Qi has sent to say that he will help restore order in Yan,
      as a good neighbour should, and his army is already over the border.
    choices:
      - label: "Fight the rebels, and trust Qi"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          The Qi army takes Ji in fifty days, kills you, and plunders the ancestral temples of
          Yan. The people of Yan rise against Qi, and Qi withdraws. The prince Zhi comes home
          from Han, where he was a hostage, to be king. He will be called King Zhao, and he will
          never forget.
      - label: "Make peace with Prince Ping"
        legitimacy_bp: 1000
        outcome: >-
          You and the prince share the capital uneasily. Qi's army waits at the border.
    history: >-
      Qi invaded Yan in 314 BC during the civil war; Zizhi was killed. The Qi occupation
      provoked a rising and King Zhao was installed.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 34 (Yan)", "Zhanguo ce, Yan 1", "Mencius 1B.10-11"]

  - id: yan_golden
    scenario: warring_states
    civ: yan
    year: -311
    title: "Start with Me"
    place: "Ji"
    speaker: scholar
    speaker_name: "Guo Wei"
    speaker_title: "An old scholar"
    benchmark_provinces: 3
    story: >-
      You are King Zhao of Yan. The people of Yan have risen against the Qi garrisons and
      driven them out, and Qi's army has gone home with the treasures of your ancestral
      temple. Your kingdom is free again, and plundered, and you have sworn revenge. For that you need able men, and able men go to the great courts of Qi and Wei,
      not to cold, ruined Yan.


      Old Guo Wei tells you a story: a king offered a thousand pieces of gold for a horse
      that could run a thousand li a day, and his servant came back with the bones of a dead
      one, bought for five hundred. The king was furious; but within a year three such
      horses were brought to him. "If you want worthy men," says Guo Wei, "start with me."
    choices:
      - label: "Start with Guo Wei"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1500
        wealth_bp: -1500
        unrest_bp: -2500
        outcome: >-
          You build Guo Wei a palace and treat him as your teacher. The story of the
          thousand-li horse's bones goes round every court. Yue Yi comes from Wei, Zou Yan from
          Qi, Ju Xin from Zhao. Later poets will call the hall where you welcomed them the
          Golden Terrace.
        deeds: {peace_with: [qi], take: [yan_ji, yan_yi, yan_coast], martial_bp: 500}
      - label: "Send heralds to every court"
        knowledge_bp: 500
        outcome: >-
          A few clever men come, and look at the burnt-out capital, and leave.
        deeds: {peace_with: [qi], take: [yan_ji, yan_yi, yan_coast]}
    history: >-
      King Zhao of Yan (r. 311-279 BC) honoured Guo Wei and attracted Yue Yi, Zou Yan and Ju
      Xin to his court; the Golden Terrace is a later name.
    sources: ["Zhanguo ce, Yan 1", "Shiji 34 (Yan)"]

  - id: yan_qin_kai
    scenario: warring_states
    civ: yan
    year: -300
    title: "A Thousand Li Beyond the Wall"
    place: "The northern frontier"
    speaker: general
    speaker_name: "Qin Kai"
    speaker_title: "Who was a hostage among the Donghu"
    needs_alive: [donghu]
    benchmark_provinces: 5
    story: >-
      Your general Qin Kai spent years as a hostage among the Donghu, the horse peoples of
      the north-east, and they came to trust him. He knows their pastures, their chiefs and
      their quarrels.


      Now he is home, and he wants to lead an army against them, drive them north, and build
      a wall to keep them there, with new commanderies all the way to the Liao river and
      beyond.
    choices:
      - label: "Send Qin Kai north"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The Donghu are driven back a thousand li. Yan builds a long wall from the hills north
          of the capital to beyond the Liao, and sets up five commanderies, Liaodong among
          them. Qin Kai's grandson will ride with the assassin Jing Ke.
        deeds: {take: [donghu_xilamulun, joseon_liaodong]}
      - label: "Hold the old frontier"
        legitimacy_bp: -500
        outcome: >-
          The Donghu keep raiding, and Qin Kai keeps telling everyone how easy it would have
          been.
    history: >-
      Around 300 BC the Yan general Qin Kai drove the Donghu back a thousand li; Yan built
      walls and five commanderies, including Liaodong, and pushed into Gojoseon's lands.
    diverged: >-
      The Donghu are gone.
    sources: ["Shiji 110 (Xiongnu)", "Sanguo zhi 30 (Weilüe on Chaoxian)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: yan_yue_yi
    scenario: warring_states
    civ: yan
    year: -284
    title: "Seventy Cities of Qi"
    place: "West of the Ji river"
    speaker: general
    speaker_name: "Yue Yi"
    speaker_title: "Supreme commander of five kingdoms"
    needs_alive: [qi]
    benchmark_provinces: 7
    story: >-
      Twenty-eight years after Qi plundered Yan, your revenge is ready. King Min of Qi has
      swallowed Song and made enemies of everyone. Yue Yi has brought Qin, Zhao, Wei and Han
      into an alliance with you, and commands all their armies.


      The allies have beaten the Qi army west of the Ji river. They want to go home with
      their plunder. Yue Yi wants to march on Linzi alone, with the army of Yan.
    choices:
      - label: "Let Yue Yi march on Linzi"
        historical: true
        legitimacy_bp: 3000
        wealth_bp: 3000
        outcome: >-
          Linzi falls. The treasures and ritual vessels of Qi, and the bronzes Qi stole from
          Yan, are carried to your capital. In half a year Yue Yi takes more than seventy
          cities; only Ju and Jimo hold out. He governs the conquered lands mildly, lowers
          their taxes, and honours their worthies. You make him Lord of Changguo.
        deeds: {take: [qi_linzi, qi_pingyuan]}
      - label: "Take the plunder, and come home"
        wealth_bp: 2000
        outcome: >-
          Yan has its revenge, and Qi is left bleeding but whole.
    history: >-
      Yue Yi's coalition broke Qi in 284 BC; the Yan army took Linzi and more than seventy
      cities.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 80 (Yue Yi)", "Zhanguo ce, Yan 2"]

  - id: yan_recall
    scenario: warring_states
    civ: yan
    year: -279
    title: "A Letter from Yue Yi"
    place: "Ji"
    speaker: general
    speaker_name: "Yue Yi"
    speaker_title: "In exile in Zhao"
    needs_alive: [qi]
    benchmark_provinces: 5
    story: >-
      You are King Hui. Your father King Zhao is dead, and you never liked Yue Yi. Spies from
      Jimo whisper that Yue Yi has been besieging Jimo and Ju for five years because he means
      to make himself King of Qi; the people of Jimo, they say, fear only that you will send
      a harder general.


      You have already sent Qi Jie to replace him. Yue Yi has fled to Zhao.
    choices:
      - label: "Keep Qi Jie in command"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          At Jimo, Tian Dan's fire oxen break Qi Jie's army in a night, and every city in Qi
          goes back to Qi. Yue Yi writes you a letter from Zhao: a good minister, he says,
          leaves without speaking ill of his lord. It will be read in Chinese schools for two
          thousand years.
        deeds: {give: [qi_linzi, qi_pingyuan], give_to: qi, peace_with: [qi]}
      - label: "Beg Yue Yi to come back"
        legitimacy_bp: -500
        outcome: >-
          Yue Yi comes back, warily. Jimo goes on holding out.
    history: >-
      King Hui of Yan replaced Yue Yi with Qi Jie in 279 BC; Tian Dan then destroyed the Yan
      army and recovered Qi. Yue Yi's letter to King Hui survives.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 80 (Yue Yi, with his letter)", "Shiji 82 (Tian Dan)"]

  - id: yan_hao
    scenario: warring_states
    civ: yan
    year: -251
    title: "Zhao Has No Young Men Left"
    place: "Ji"
    speaker: steward
    speaker_name: "Li Fu"
    speaker_title: "Chief minister"
    needs_alive: [zhao]
    benchmark_provinces: 5
    story: >-
      You are King Xi. Nine years ago at Changping, Qin buried four hundred thousand men of
      Zhao alive. Your minister Li Fu has just come back from Zhao with gifts, and says: Zhao's
      young men are all dead and their orphans are not yet grown. Now is the time to attack.


      Yue Jian, Yue Yi's son, who lives in Zhao, sends word: Zhao is a country of soldiers,
      and its people are used to war.
    choices:
      - label: "Attack Zhao"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Zhao's old general Lian Po meets your army at Hao and destroys it; Li Fu is killed.
          Lian Po pursues your army five hundred li and besieges your capital, and you have to
          give up five cities for peace.
        deeds: {grudges: {zhao: 2500}}
      - label: "Send Zhao condolences"
        legitimacy_bp: 500
        outcome: >-
          Zhao thanks you, and remembers who was kind.
    history: >-
      Yan attacked Zhao in 251 BC on Li Fu's advice; Lian Po defeated and killed him at Hao
      and besieged the Yan capital.
    diverged: >-
      Zhao is gone.
    sources: ["Shiji 34 (Yan)", "Shiji 81 (Lian Po)", "Zhanguo ce, Yan 3"]

  - id: yan_jing_ke
    scenario: warring_states
    civ: yan
    year: -227
    title: "The Dagger in the Map"
    place: "On the bank of the Yi river"
    speaker: steward
    speaker_name: "Crown Prince Dan"
    speaker_title: "Your son"
    needs_alive: [qin]
    benchmark_provinces: 5
    story: >-
      Han and Zhao are gone. The Qin armies are on your border. Your son Dan was a hostage in
      Qin with the young King Zheng, who is now its ruler, and escaped hating him.


      Dan has found an assassin, Jing Ke, and given him two gifts to take to the King of Qin:
      the head of a Qin general who fled to Yan with a price on it, and a map of Yan's best
      farmland, rolled around a dagger poisoned so that a scratch will kill. The friends who
      see Jing Ke off at the Yi river wear white, the colour of mourning.
    choices:
      - label: "Let Jing Ke go"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          The musician Gao Jianli plays, and Jing Ke sings: "The wind is sighing, the Yi river
          is cold; the brave man goes, and does not come back." In the Qin palace, as the map
          unrolls, he seizes the king's sleeve and strikes; the sleeve tears, and the king runs
          round a pillar, unable to draw his long sword, until a courtier shouts at him to push
          it round onto his back. Jing Ke dies laughing. Qin's armies march on Yan.
        deeds: {grudges: {qin: 4000}}
      - label: "Send the King of Qin tribute instead"
        wealth_bp: -2500
        outcome: >-
          The King of Qin accepts the tribute and the map of the farmland, and comes to take
          the rest.
    history: >-
      Jing Ke's attempt on the life of King Zheng of Qin (227 BC), sent by Crown Prince Dan of
      Yan, failed; Qin attacked Yan and took its capital in 226.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 86 (Jing Ke)", "Zhanguo ce, Yan 3"]

  - id: yan_dan
    scenario: warring_states
    civ: yan
    year: -226
    title: "A Son's Head for Qin"
    place: "Liaodong"
    speaker: steward
    speaker_name: "Jia, King of Dai"
    speaker_title: "The last prince of Zhao, in a letter"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      Ji has fallen. You have fled east to Liaodong, behind the Liao river, with what remains
      of your court. Prince Dan is hiding with his followers in the marshes.


      A letter comes from Jia, the last prince of Zhao, holding out in Dai: Qin wants only
      Prince Dan. Send his head,
      and Qin will let Yan live.
    choices:
      - label: "Send Dan's head"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          You have your son killed and send his head to Qin. Qin takes it, and stops for a
          while, to deal with Wei and Chu. Then it comes back.
        deeds: {give: [yan_ji, yan_yi, yan_coast, donghu_xilamulun], give_to: qin}
      - label: "Refuse"
        legitimacy_bp: 500
        outcome: >-
          You keep your son. The Qin generals keep coming.
        deeds: {give: [yan_ji, yan_yi, yan_coast, donghu_xilamulun], give_to: qin}
    history: >-
      After Ji fell in 226 BC, King Xi of Yan fled to Liaodong and had Crown Prince Dan killed,
      sending his head to Qin.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 34 (Yan)", "Shiji 86 (Jing Ke)"]

  - id: yan_end
    scenario: warring_states
    civ: yan
    year: -222
    title: "Beyond the Liao"
    place: "Liaodong"
    speaker: general
    speaker_name: "Your last commander"
    speaker_title: "On the Liao river"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      Wei has fallen, and Chu. Wang Ben, son of the Qin general Wang Jian, has crossed the Liao
      river with his army. You are the king of a few towns at the end of the world.
    choices:
      - label: "Surrender"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          Wang Ben takes Liaodong and you with it. Yan, which has stood for eight hundred years
          since the Zhou kings gave it to the Duke of Shao, is over. Next year Qi surrenders, and
          there is one king under heaven.
        deeds: {ruler_falls: "is captured in Liaodong by the Qin general Wang Ben"}
      - label: "Flee across the Yalu"
        legitimacy_bp: -1000
        outcome: >-
          You and a few hundred followers cross into the lands of Joseon. Yan lives on, in a
          valley, for a while.
    history: >-
      Wang Ben conquered Liaodong and captured King Xi in 222 BC, ending Yan.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 34 (Yan)", "Shiji 6 (Qin Shi Huang)"]
