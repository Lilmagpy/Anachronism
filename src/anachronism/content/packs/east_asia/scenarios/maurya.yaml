schema_version: 1
scenarios:
  - id: maurya
    name: "The Mauryan dawn, 321 BC"
    description: >-
      321 BC. Alexander has come and gone, and died in Babylon; his garrisons linger on
      the Indus. On the Ganges, the hated Nanda kings sit on the richest treasury in India.
      In the Punjab a young man named Chandragupta and his teacher Chanakya, the author
      of a ruthless book on statecraft, gather an army. To the south, the Tamil kingdoms
      trade pepper and pearls with the world.
    start_year: -321
    years_per_turn: 10
    campaign_years_per_turn: 3
    player_civ: maurya
    map: east_asia
    music: asian  # the client plays client/music/<name>.mp3 (D-208)
    cost_scale: 10
    # what every state of the age knows, where it has the prerequisites
    common_techs: {written_law: adopted}
    civs:
      maurya:
        disposition: aggressive
        capital: in_punjab
        leader: "Chandragupta"
        leader_age: 19
        leader_until: -296
        successors: [{name: "Bindusara", age: 20, disposition: aggressive, died: -273}, {name: "Ashoka", age: 30, disposition: aggressive, died: -232}]
        martial_bp: 40000
        pitch: "Chanakya swore to destroy the Nanda king who insulted him, and he chose you to do it. You have the Punjab and a hungry army. Pataliputra is a month's march away."
        provinces:
          in_punjab: 700000
          in_trigarta: 300000
        stockpiles: {food: 1600, materials: 400, wealth: 800, knowledge: 260}
        stats: {literacy_bp: 500, unrest_bp: 1200, legitimacy_bp: 5000}
        influence: {clergy: 4500, nobility: 4000, guilds: 1500}
        techs:
