schema_version: 1
scenarios:
  - id: sengoku
    name: "Japan's Warring States, 1560"
    description: >-
      1560. The shoguns in Kyoto have lost their power, and a hundred warlords fight for
      Japan. Portuguese ships brought the musket seventeen years ago; Jesuits preach in
      Kyushu. In Owari, a young lord called Oda Nobunaga waits for Imagawa Yoshimoto's
      army of 25,000. Across the sea, Joseon Korea has known a century of peace, and the
      Ming emperor has not held court in years.
    start_year: 1560
    years_per_turn: 10
    player_civ: oda
    map: east_asia
    cost_scale: 10
    civs:
      oda:
        disposition: aggressive
        capital: j_owari
        leader: Oda Nobunaga
        leader_age: 26
        successors: [{name: "Oda Nobutada", age: 25}]
        pitch: "Imagawa Yoshimoto marches on Kyoto with 25,000 men, and Owari is in his way. You have 3,000. History says you win - and then unite Japan. Do it sooner."
        provinces:
          j_owari: 550000
        stockpiles: {food: 880, materials: 220, wealth: 275, knowledge: 147}
        stats: {literacy_bp: 500, unrest_bp: 900, legitimacy_bp: 6000}
        influence: {clergy: 2500, nobility: 6000, guilds: 1500}
        techs:
          agriculture: widespread
          irrigation: widespread
