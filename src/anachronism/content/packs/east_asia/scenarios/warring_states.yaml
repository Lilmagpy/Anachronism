schema_version: 1
scenarios:
  - id: warring_states
    name: "The Warring States, 350 BC"
    description: >-
      350 BC. The Zhou king reigns in name only. Seven great states - Qin, Wei, Zhao,
      Han, Qi, Yan and Chu - and a ring of smaller states and peoples compete for
      survival. Iron tools and crossbows are spreading, philosophers argue in every
      court, and in the west Shang Yang is turning Qin into a machine for farming and
      war. Qin moves its capital to Xianyang this year.
    start_year: -350
    years_per_turn: 10
    campaign_years_per_turn: 2
    player_civ: qin
    map: east_asia
    cost_scale: 10
    # what every state of the age knows, where it has the prerequisites (Zichan's cast law codes (536 BC), Li Kui's Canon of Laws, household registers)
    common_techs: {written_law: adopted, census: adopted}
    civs:
      qin:
        disposition: aggressive
        scripts:
          - {id: "qin_takes_hexi", goal: "conquer", target: "wei", preconditions: {after_year: -345, min_strength_ratio_bp: 8000}, note: "Qin, remade by Shang Yang, defeats Wei and takes the Hexi lands west of the Yellow River (340-328 BC)."}
          - {id: "qin_conquers_shu", goal: "conquer", target: "shu", preconditions: {after_year: -320, min_strength_ratio_bp: 13000}, note: "Sima Cuo leads Qin over the Qinling mountains and conquers Shu (316 BC)."}
          - {id: "qin_conquers_ba", goal: "conquer", target: "ba", preconditions: {after_year: -320}, depends_on: ["qin_conquers_shu"], note: "Qin absorbs Ba in the same campaign (316 BC)."}
          - {id: "qin_crushes_yiqu", goal: "conquer", target: "yiqu", preconditions: {after_year: -285}, note: "Queen Dowager Xuan destroys the Yiqu Rong (272 BC)."}
          - {id: "qin_sacks_ying", goal: "conquer", target: "chu", preconditions: {after_year: -290, min_strength_ratio_bp: 11000}, depends_on: ["qin_conquers_shu"], note: "Bai Qi sacks Ying, the capital of Chu (278 BC)."}
          - {id: "qin_at_changping", goal: "conquer", target: "zhao", preconditions: {after_year: -270, min_strength_ratio_bp: 11000}, note: "The battle of Changping breaks Zhao (260 BC)."}
          - {id: "qin_takes_han", goal: "conquer", target: "han", preconditions: {after_year: -240, min_strength_ratio_bp: 15000}, note: "Han is the first of the six states to fall (230 BC)."}
        capital: qin_guanzhong
        leader: Duke Xiao
        leader_age: 31
        leader_died: -338
        generals: [{name: "Sima Cuo", skill: 4, trait: siege, note: "Will conquer Shu and Ba in 316 BC."}, {name: "Bai Qi", skill: 5, trait: bold, note: "Born about 332 BC: the victor of Changping, Qin's most feared general."}]
        successors: [{name: "King Huiwen", age: 19, disposition: "aggressive", died: -311}, {name: "King Wu", age: 19, disposition: "aggressive", died: -307}, {name: "King Zhaoxiang", age: 19, disposition: "aggressive", died: -251}, {name: "King Xiaowen", age: 53, died: -250}, {name: "King Zhuangxiang", age: 31, died: -247}, {name: "King Zheng", age: 13, disposition: "aggressive", died: -210}]
        pitch: "A poor, tough frontier state in the middle of radical reform. Turn Shang Yang's farmers and soldiers into the first empire - decades early."
