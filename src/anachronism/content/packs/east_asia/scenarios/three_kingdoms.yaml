schema_version: 1
scenarios:
  - id: three_kingdoms
    name: "The Three Kingdoms of Korea, AD 400"
    description: >-
      AD 400. Goguryeo, Baekje and Silla contend for the Korean peninsula, with the iron
      states of Gaya between them and the Wa of Japan across the strait. Goguryeo's young
      king Gwanggaeto has humbled Baekje and now marches south to rescue Silla from the Wa.
      In China the north belongs to horse peoples - the Tuoba Wei, the Murong Yan, the Qiang
      Qin - while the Jin court rules the south from Jiankang, and Buddhism spreads everywhere.
    start_year: 400
    years_per_turn: 10
    player_civ: goguryeo
    map: east_asia
    cost_scale: 10
    civs:
      goguryeo:
        disposition: aggressive
        scripts:
          - {id: "gwanggaeto_takes_liaodong", goal: "conquer", target: "later_yan", preconditions: {after_year: 400}, note: "Gwanggaeto seizes Liaodong from Later Yan (c. 404)."}
          - {id: "gwanggaeto_humbles_baekje", goal: "conquer", target: "baekje", preconditions: {after_year: 400, min_strength_ratio_bp: 12000}, note: "Goguryeo's southern campaigns; Jangsu takes Hanseong in 475."}
        capital: k4_gungnae
        leader: King Gwanggaeto
        leader_age: 26
        successors: [{name: "King Jangsu", age: 19, disposition: "aggressive"}]
        pitch: "Gwanggaeto the Great has just come to the throne. Push the frontiers to the Liao and the Han - and give Goguryeo ideas no one else has."
        provinces:
          k4_gungnae: 400000
          k4_pyongyang: 500000
