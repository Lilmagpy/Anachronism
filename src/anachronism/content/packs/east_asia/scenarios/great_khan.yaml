schema_version: 1
scenarios:
  - id: great_khan
    name: "The Great Khan, 1206"
    description: >-
      1206. At a great assembly by the Onon river the steppe tribes have named Temujin
      their Genghis Khan. To the south the Tangut, the Jurchen Jin and the Southern Song
      eye one another - the Song have just attacked the Jin. Goryeo prints its sutras,
      Japan's first warrior government sits at Kamakura, and the Silk Road cities pay
      tribute to the fading Qara Khitai.
    start_year: 1206
    years_per_turn: 10
    player_civ: mongols
    map: east_asia
    cost_scale: 10
    # what every state of the age knows, where it has the prerequisites
    common_techs: {written_law: widespread, census: adopted}
    civs:
      mongols:
        navy_bp: 0
        disposition: aggressive
        scripts:
          - {id: "raids_on_xia", goal: "conquer", target: "western_xia", preconditions: {after_year: 1205}, note: "Genghis Khan's campaigns against the Tangut (1205-1209) end with Xia a Mongol vassal."}
          - {id: "invasion_of_jin", goal: "conquer", target: "jurchen_jin", preconditions: {after_year: 1210}, note: "The Mongols break through the Great Wall (1211); Zhongdu falls in 1215."}
          - {id: "fall_of_qara_khitai", goal: "conquer", target: "kara_khitai", preconditions: {after_year: 1215}, note: "Jebe overruns the Qara Khitai and hunts down Kuchlug (1218)."}
          - {id: "conquest_of_dali", goal: "conquer", target: "dali", preconditions: {after_year: 1250}, note: "Kublai crosses the mountains and takes Dali (1253)."}
          - {id: "war_on_song", goal: "conquer", target: "southern_song", preconditions: {after_year: 1255}, note: "Mongke and then Kublai make war on the Song (1258-1279)."}
          - {id: "invasion_of_goryeo", goal: "conquer", target: "goryeo", preconditions: {after_year: 1230}, note: "Thirty years of Mongol invasions of Goryeo (1231-1259)."}
        capital: g_onon
        leader: "Genghis Khan"
        leader_age: 44
        generals: [{name: "Subutai", skill: 5, trait: horse, note: "The greatest of the Mongol generals: from China to Hungary."}, {name: "Jebe", skill: 4, trait: horse, note: "'The Arrow': once shot Temujin's horse, then served him."}, {name: "Muqali", skill: 4, trait: siege, note: "Viceroy of the war on the Jin in north China."}, {name: "Jochi", skill: 3, trait: horse, note: "Genghis Khan's eldest son."}]
        successors: [{name: "Ogedei Khan", age: 43, disposition: aggressive}, {name: "Guyuk Khan", age: 40, disposition: aggressive}, {name: "Mongke Khan", age: 42, disposition: aggressive}, {name: "Kublai Khan", age: 45, disposition: cautious}]
        martial_bp: 150000
        pitch: "At the kurultai of 1206 the tribes have named you Genghis Khan. You have the finest horsemen on earth and almost nothing else. History says you conquer half the world; build something that lasts."
        provinces:
          g_onon: 300000
          g_orkhon: 250000
          g_altai: 120000
          g_selenge: 100000
          g_hulunbuir: 150000
          g_gobi: 50000
