schema_version: 1
# Chronicle mode (D-120, D-184): the Shimazu of Satsuma, from the first muskets to the
# invasion of Ryukyu, 1560-1609. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Shimazu family records (Shimazu-ke monjo), the
# Uwai Kakken diary, Frois, the Korean and Ming records of the Imjin war, the Chuzan seikan
# of Ryukyu, and modern work by Turnbull, Berry, Kerr and Smits. benchmark_provinces counts
# the provinces of this map the real Shimazu held at that date.
chapters:
  - id: shi_guns
    scenario: sengoku
    civ: shimazu
    year: 1560
    title: "The Iron Sticks of Tanegashima"
    place: "Kagoshima"
    speaker: general
    speaker_name: "Shimazu Yoshihiro"
    speaker_title: "Your second son"
    benchmark_provinces: 1
    story: >-
      You are Shimazu Takahisa, lord of Satsuma at the far south of Kyushu. Seventeen years
      ago a Chinese junk with Portuguese aboard drifted onto the island of Tanegashima, in
      your waters, and its lord bought two of their matchlock guns. Your smiths copied them.
      Your men were the first in Japan to fire them in battle. A Jesuit, Francis Xavier,
      stayed a year in Kagoshima and found you curious and courteous.


      Your son Yoshihiro wants to arm a third of the army with guns, and drill them to fire
      in volleys.
    choices:
      - label: "Arm them"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 500
        outcome: >-
          The forges of Satsuma turn out guns by the hundred. The Shimazu will become famous
          for a tactic using them: a small force pretends to flee, drawing the enemy into an
          ambush of hidden gunners on both flanks.
        deeds: {martial_bp: 1500}
      - label: "Keep to bows and spears"
        legitimacy_bp: 500
        outcome: >-
          Your old warriors are pleased. The smiths sell their guns to other lords.
    history: >-
      Portuguese firearms reached Tanegashima in 1543; the Shimazu used guns in battle by 1549
      and became noted for the 'tsuri-nobuse' ambush tactic.
    sources: ["Teppoki (1606)", "Lidin, Tanegashima (2002)", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: shi_handover
    scenario: sengoku
    civ: shimazu
    year: 1566
    title: "Four Brothers"
    place: "Kagoshima"
    speaker: steward
    speaker_name: "Shimazu Yoshihisa"
    speaker_title: "Your eldest son"
    benchmark_provinces: 1
    story: >-
      You are fifty-two. You have united Satsuma and Osumi after a century of family wars, and
      you have four sons: Yoshihisa the wise, Yoshihiro the warrior, Toshihisa the
      strategist, Iehisa the tactician, as the family will remember them.


      Your grandfather said the four should be one. You can stay in power, or step aside now,
      while you can still advise them.
    choices:
      - label: "Hand the house to Yoshihisa, and become a monk"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You shave your head and retire, and watch your sons set out to conquer Kyushu
          together. You live five more years.
        deeds: {ruler_falls: "retires, and shaves his head as a monk"}
      - label: "Keep the reins a while longer"
        unrest_bp: 500
        outcome: >-
          Your sons wait, and their retainers begin to pick sides.
    history: >-
      Shimazu Takahisa retired in favour of his son Yoshihisa in 1566 and died in 1571.
    sources: ["Shimazu-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: shi_kizaki
    scenario: sengoku
    civ: shimazu
    year: 1572
    title: "Three Hundred Against Three Thousand"
    place: "Kizakibaru, on the Hyuga border"
    speaker: general
    speaker_name: "Shimazu Yoshihiro"
    speaker_title: "Your brother, at Kakuto castle"
    benchmark_provinces: 1
    story: >-
      You are Shimazu Yoshihisa. The Ito of Hyuga have sent three thousand men across the
      border at night. Your brother Yoshihiro holds the castle of Kakuto with about three
      hundred.


      He proposes not to wait for help: to attack the Ito camp at once, with part of his men
      showing themselves and running, and the rest hidden in the grass with guns.
    choices:
      - label: "Let him fight"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The Ito chase the bait into the trap. Their commanders are killed and their army is
          broken. Kizaki becomes 'the Okehazama of Kyushu', and the Ito never recover.
        deeds: {martial_bp: 500}
      - label: "Order him to hold the castle"
        legitimacy_bp: -500
        outcome: >-
          Kakuto holds. The Ito ravage the farmland around it and go home.
    history: >-
      At Kizakibaru (1572) Shimazu Yoshihiro, with some 300 men, defeated an Ito army of about
      3,000.
    sources: ["Shimazu-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: shi_mimigawa
    scenario: sengoku
    civ: shimazu
    year: 1578
    title: "The Christian King's Crusade"
    place: "The Mimi river, Hyuga"
    speaker: otomo
    speaker_name: "Otomo Sorin"
    speaker_title: "Lord of Bungo, baptised Francisco"
    needs_alive: [otomo]
    benchmark_provinces: 2
    story: >-
      The Ito have fled to Otomo Sorin of Bungo, the richest lord in Kyushu, who has been
      baptised by the Jesuits and dreams of founding a Christian kingdom in Hyuga. He has sent
      an army of forty thousand south, burning temples and shrines as it goes.


      The Otomo army is camped on the Mimi river, divided, its generals quarrelling.
    choices:
      - label: "Draw them across the river into the trap"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          The Otomo vanguard charges across the river after your decoys, and is shot down from
          both sides. Thousands drown in the Mimi. Hyuga is yours, and Sorin goes home and
          never leads an army again.
        deeds: {take: [j_hyuga], grudges: {otomo: 2500}}
      - label: "Hold the castles, and let them starve"
        food_bp: -1500
        outcome: >-
          The Otomo army sits in Hyuga through the summer, and goes home in the autumn.
    history: >-
      The Shimazu destroyed the Otomo army at Mimigawa (1578), taking Hyuga.
    diverged: >-
      The Otomo are gone.
    sources: ["Frois, Historia de Japam", "Shimazu-ke monjo"]

  - id: shi_okitanawate
    scenario: sengoku
    civ: shimazu
    year: 1584
    title: "The Bear of Hizen"
    place: "Okitanawate, Shimabara"
    speaker: general
    speaker_name: "Shimazu Iehisa"
    speaker_title: "Your youngest brother"
    benchmark_provinces: 3
    story: >-
      Ryuzoji Takanobu, the 'bear of Hizen', has conquered the north-west of Kyushu and is
      besieging the Christian lord Arima at Shimabara. Arima asks you for help. Takanobu has
      twenty-five thousand men; your brother Iehisa can bring perhaps five thousand.


      Between the sea and the marshes at Okitanawate there is a narrow road. Iehisa says the
      bear will not be able to use his numbers there.
    choices:
      - label: "Send Iehisa"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Takanobu's army crowds onto the narrow road between the marsh and the sea, and Arima's
          cannon fire from the ships into its flank. A Shimazu warrior reaches the bear's
          palanquin and cuts off his head. Hizen is yours to command.
        deeds: {take: [j_hizen]}
      - label: "Let Arima fend for himself"
        legitimacy_bp: -1000
        outcome: >-
          Arima surrenders. The bear of Hizen turns south.
    history: >-
      Shimazu Iehisa and Arima Harunobu defeated and killed Ryuzoji Takanobu at Okitanawate
      (1584).
    sources: ["Frois, Historia de Japam", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: shi_bungo
    scenario: sengoku
    civ: shimazu
    year: 1586
    title: "All Kyushu but One"
    place: "Bungo"
    speaker: otomo
    speaker_name: "Otomo Sorin"
    speaker_title: "Lord of Bungo, in his last castle"
    needs_alive: [otomo]
    benchmark_provinces: 4
    story: >-
      Only the Otomo still stand against you in Kyushu. Old Sorin has gone to Osaka in person
      to beg Toyotomi Hideyoshi, now master of all Japan, for help, and Hideyoshi has ordered
      you to stop fighting. Your brothers say that Hideyoshi is far away and Bungo is here.


      Hideyoshi's vanguard has already landed, with Chosokabe of Shikoku.
    choices:
      - label: "Take Bungo anyway"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          At the Hetsugi river your brother Iehisa traps Hideyoshi's vanguard and destroys it.
          Funai, the Otomo capital, falls, with its Christian church and its Portuguese
          merchants. All Kyushu is yours. Hideyoshi is assembling two hundred thousand men.
        deeds: {take: [j_bungo]}
      - label: "Obey Hideyoshi's order"
        legitimacy_bp: -1000
        outcome: >-
          You stop at the border of Bungo. Hideyoshi's envoys thank you, and draw a new map of
          Kyushu that leaves you less than you hold.
    history: >-
      The Shimazu ignored Hideyoshi's order of truce, destroyed his vanguard at Hetsugigawa
      (1586) and took Funai, provoking his invasion of Kyushu.
    diverged: >-
      The Otomo are gone.
    sources: ["Frois, Historia de Japam", "Berry, Hideyoshi (1982)"]

  - id: shi_hideyoshi
    scenario: sengoku
    civ: shimazu
    year: 1587
    title: "Two Hundred Thousand"
    place: "Taihei-ji temple, Satsuma"
    speaker: oda
    speaker_name: "Toyotomi Hideyoshi"
    speaker_title: "Imperial regent"
    benchmark_provinces: 1
    story: >-
      Hideyoshi's armies have come down both coasts of Kyushu, more men than you have ever
      seen, with guns, cannon and an endless supply train by sea. Your castles are falling
      one by one. He has sent word that if you submit, he will leave you Satsuma and Osumi.
    choices:
      - label: "Shave your head and submit"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          You come to Hideyoshi's camp in a monk's robe, with your head shaved, and kneel.
          He keeps his word: Satsuma and Osumi stay Shimazu. Your brother Yoshihiro will lead
          the clan. Everything else you took is given to others.
        deeds: {ruler_falls: "shaves his head and submits to Hideyoshi", give: [j_hyuga, j_hizen, j_bungo]}
      - label: "Fight in the mountains"
        unrest_bp: 2500
        outcome: >-
          Your men take to the hills of Satsuma. Hideyoshi's army settles in to burn the rice
          fields.
    history: >-
      Hideyoshi's Kyushu campaign (1587) forced Shimazu Yoshihisa to submit; the Shimazu kept
      Satsuma and Osumi.
    sources: ["Berry, Hideyoshi (1982)", "Shimazu-ke monjo"]

  - id: shi_sacheon
    scenario: sengoku
    civ: shimazu
    year: 1598
    title: "Demon Shimazu"
    place: "Sacheon castle, Korea"
    speaker: general
    speaker_name: "Your son Tadatsune"
    speaker_title: "In the castle"
    needs_alive: [ming]
    benchmark_provinces: 1
    story: >-
      You are Shimazu Yoshihiro, sixty-three, in a new Japanese castle on the south coast of
      Korea, at the end of a war that Hideyoshi started and that everyone else wants to end.
      A Ming and Korean army, perhaps thirty or forty thousand strong, is coming to take the
      castle. You have about seven thousand.
    choices:
      - label: "Let them reach the walls, then charge"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          An explosion in the Ming gunpowder wagons throws their ranks into confusion, and you
          sally out and rout them. The Koreans and Chinese call you 'Demon Shimazu'. Then
          Hideyoshi dies, and the army goes home; on the way, the Shimazu ships are caught by
          Admiral Yi Sun-sin at Noryang, and Yi dies winning.
      - label: "Abandon the castle"
        legitimacy_bp: -1500
        outcome: >-
          You withdraw to the coast. The Ming army takes Sacheon without a fight.
    history: >-
      At Sacheon (1598) Shimazu Yoshihiro defeated a much larger Ming-Korean army; the Shimazu
      fleet fought at Noryang during the withdrawal.
    diverged: >-
      The Ming are gone.
    sources: ["Swope, A Dragon's Head and a Serpent's Tail (2009)", "Turnbull, The Samurai Invasion of Korea (2008)"]

  - id: shi_retreat
    scenario: sengoku
    civ: shimazu
    year: 1600
    title: "Through the Middle of the Enemy"
    place: "Sekigahara"
    speaker: general
    speaker_name: "Shimazu Toyohisa"
    speaker_title: "Your nephew"
    benchmark_provinces: 1
    story: >-
      You came to Sekigahara with fifteen hundred men to fight for the West, and the West has
      lost. Its armies are fleeing west through the hills, and the Tokugawa armies are all
      around you. Your nephew Toyohisa says there is only one way home that no one will
      expect: straight forward, through the middle of the enemy.
    choices:
      - label: "Charge through the Tokugawa army"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          The Shimazu ride straight at Ieyasu's lines. Small groups stay behind on the road,
          kneeling, to fire their guns and die so that the rest can get away. Toyohisa is
          killed; a Tokugawa general is badly wounded. About eighty men reach Satsuma with you.
          Ieyasu decides that the Shimazu are not worth fighting again, and leaves them their
          lands.
      - label: "Surrender to Ieyasu"
        legitimacy_bp: -2500
        outcome: >-
          You give up your sword to the Tokugawa. Ieyasu sends you home without your domain.
    history: >-
      At Sekigahara (1600) the Shimazu broke out through the Eastern army ('the Shimazu
      retreat'), losing most of their men; the domain survived intact.
    sources: ["Shimazu-ke monjo", "Bryant, Sekigahara 1600 (1995)"]

  - id: shi_ryukyu
    scenario: sengoku
    civ: shimazu
    year: 1609
    title: "A Hundred Ships for Ryukyu"
    place: "Yamakawa harbour, Satsuma"
    speaker: general
    speaker_name: "Kabayama Hisataka"
    speaker_title: "Commander of the expedition"
    needs_alive: [ryukyu]
    benchmark_provinces: 2
    story: >-
      You are Shimazu Tadatsune. Your domain is poor and in debt after the wars. The kingdom of
      Ryukyu to the south grows rich trading with China, Japan and the south seas, and its
      king has ignored your demands for envoys and tribute.


      The new shogun has given you leave to punish it. Your commander has three thousand men
      and a hundred ships, half of them with guns. The Ryukyuans have hardly fought a war in
      a century.
    choices:
      - label: "Sail for Ryukyu"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 1000
        outcome: >-
          The islands fall one by one. Shuri castle surrenders in April, and King Sho Nei is
          taken to Kagoshima and then to Edo. He is sent home two years later, after swearing
          loyalty to the Shimazu. Ryukyu keeps its king and keeps paying tribute to China, and
          for two and a half centuries secretly pays Satsuma too.
        deeds: {take: [j_ryukyu]}
      - label: "Trade with Ryukyu instead"
        wealth_bp: 1000
        outcome: >-
          Your merchants go to Naha and haggle like everyone else.
    history: >-
      Satsuma invaded Ryukyu in 1609, capturing King Sho Nei; Ryukyu became a vassal of
      Satsuma while continuing its tribute to China.
    diverged: >-
      Ryukyu is gone.
    sources: ["Chuzan seikan", "Kerr, Okinawa: The History of an Island People (1958)", "Smits, Visions of Ryukyu (1999)"]
