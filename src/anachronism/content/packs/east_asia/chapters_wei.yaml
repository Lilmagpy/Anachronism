schema_version: 1
# Chronicle mode (D-120, D-181): the kingdom of Wei (Liang), from King Hui's crown to the
# flooding of Daliang, 344-225 BC. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Shiji (the Wei family, Sun Bin, Shang
# Yang and Lord Xinling chapters), the Zhanguo ce, the Mencius and the Bamboo Annals, with
# modern work by Lewis and Pines. Reigns follow the Bamboo Annals, which correct the
# Shiji's order of the kings. benchmark_provinces counts the provinces of this map the real
# kings held at that date.
chapters:
  - id: wei_king
    scenario: warring_states
    civ: wei
    year: -344
    title: "The First of the Kings"
    place: "Fengze"
    speaker: steward
    speaker_name: "Your chancellor"
    speaker_title: "Of Wei"
    benchmark_provinces: 5
    story: >-
      You are Hui, Marquis of Wei, ruler of the strongest state under heaven for a hundred
      years. The Zhou king, in his little domain at Luoyang, is the only king; the great lords
      like you are dukes and marquises, in name his servants.


      You have called the lords to an assembly at Fengze, and arrived in a royal carriage
      with royal banners. Your chancellor says the time has come to call yourself King.
    choices:
      - label: "Take the royal title at Fengze"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          You are King Hui of Wei. Within a few years every great lord under heaven has done
          the same, and the Zhou king is one king among many. The other lords never forgive
          you for going first.
        deeds: {grudges: {qi: 1000, qin: 1000}}
      - label: "Stay a marquis and lead the lords"
        legitimacy_bp: 1600
        unrest_bp: -300
        outcome: >-
          The lords are relieved. Within a few years one of them takes the title anyway.
      - label: "Ask the Zhou king to confirm you as hegemon"
        legitimacy_bp: 800
        wealth_bp: -500
        outcome: >-
          Gifts go to Luoyang, and the Zhou king grants the old title of hegemon, protector of
          the lords. It is an honour, but not a crown, and the other lords will say that a
          protector who needs the king's leave is no great master.
    history: >-
      Marquis Hui of Wei took the title of king around 344 BC, at the assembly of Fengze; the
      other great rulers followed.
    sources: ["Zhanguo ce, Qin 4 (the Fengze assembly)", "Shiji 44 (Wei)", "Lewis, in Cambridge History of Ancient China (1999)"]

  - id: wei_maling
    scenario: warring_states
    civ: wei
    year: -342
    title: "The Counted Fires"
    place: "On the road east"
    speaker: general
    speaker_name: "Pang Juan"
    speaker_title: "Your general"
    needs_alive: [qi]
    benchmark_provinces: 5
    story: >-
      Your army was besieging Han's capital when Qi marched on Daliang, and Pang Juan has
      turned back to chase them. He has counted the Qi cooking fires: a hundred thousand the
      first night, fifty thousand the second, thirty thousand the third. The men of Qi, he
      says, are cowards, and more than half have deserted.


      He wants to leave the infantry behind and ride after them with the light troops, day
      and night. Your son, the crown prince, will go with him.
    choices:
      - label: "Let him ride after them"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1500
        outcome: >-
          At Maling, at dusk, Pang Juan finds a peeled tree with writing on it, and calls for a
          torch. Ten thousand Qi crossbowmen shoot at the light. Pang Juan cuts his own
          throat, and your son is taken. The crippled strategist Sun Bin, whose feet Pang Juan
          had cut off years ago, has his revenge. Wei is never first under heaven again.
      - label: "Keep the whole army together"
        legitimacy_bp: -500
        wealth_bp: -500
        outcome: >-
          The army marches east together, slowly. The Qi army reaches home.
      - label: "Seek terms with Qi and go home"
        legitimacy_bp: -300
        wealth_bp: -400
        outcome: >-
          You send envoys to the Qi camp and offer to withdraw from Han's land. Qi accepts the
          gold and the withdrawal, and both armies go home.
        deeds: {peace_with: [qi]}
    history: >-
      Pang Juan pursued the Qi army and was ambushed at Maling (342 or 341 BC); he died and
      the Wei crown prince Shen was captured.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 65 (Sun Bin)", "Shiji 44 (Wei)"]

  - id: wei_ang
    scenario: warring_states
    civ: wei
    year: -340
    title: "A Feast with an Old Friend"
    place: "The western frontier"
    speaker: qin
    speaker_name: "Shang Yang"
    speaker_title: "Chancellor of Qin, once a clerk in your service"
    needs_alive: [qin]
    benchmark_provinces: 3
    story: >-
      Twenty years ago, a clerk named Gongsun Yang served your chancellor, who told you on his
      deathbed either to make the young man chancellor or to kill him. You did neither, and
      he went to Qin, where he is now Lord Shang and has made Qin a machine for war.


      Now he has invaded the Hexi lands west of the Yellow River. He writes to your commander,
      Prince Ang, an old friend: why should two friends fight? Let us meet, drink, swear a
      treaty, and both go home.
    choices:
      - label: "Let Prince Ang meet Shang Yang"
        historical: true
        legitimacy_bp: -2500
        outcome: >-
          Shang Yang's soldiers seize Prince Ang at the feast, and the leaderless Wei army is
          destroyed. In the following years you give up the lands west of the river, piece by
          piece. "I regret," you say, "that I did not take Gongshu Cuo's advice."
        deeds: {give: [wei_hexi, wei_shang], give_to: qin}
      - label: "Order Prince Ang to hold the river"
        legitimacy_bp: 500
        materials_bp: -400
        outcome: >-
          Prince Ang refuses the feast and holds the river crossings. Qin's army stays, and the
          war goes on.
        deeds: {men: 1500}
      - label: "Offer Qin the Hexi lands in return for a treaty"
        legitimacy_bp: -800
        wealth_bp: 500
        outcome: >-
          Your envoys offer Shang Yang the land west of the river if he will go home. Qin takes
          the land and the peace, and your ministers murmur that you have given up in a year
          what your grandfathers won in ten.
        deeds: {give: [wei_hexi], give_to: qin}
    history: >-
      In 340 BC Shang Yang captured Prince Ang of Wei by treachery at a parley and defeated
      his army; Wei lost the Hexi lands to Qin by 328.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 68 (Lord Shang)", "Shiji 44 (Wei)"]

  - id: wei_mencius
    scenario: warring_states
    civ: wei
    year: -320
    title: "Why Speak of Profit?"
    place: "Daliang"
    speaker: scholar
    speaker_name: "Mencius"
    speaker_title: "A Confucian teacher"
    benchmark_provinces: 3
    story: >-
      You are old, and you have lost a son and a crown prince to Qi, and lands to Qin and Chu.
      You have invited wise men from everywhere, with good gifts, to tell you how to win back
      what is lost.


      The first to arrive is Mencius. You say to him: "Venerable sir, you have come a
      thousand li. You must have something that will profit my state."
    choices:
      - label: "Hear him out respectfully"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 500
        outcome: >-
          "Why must Your Majesty speak of profit?" says Mencius. "There is benevolence and
          righteousness, and that is all. If the king says 'how can I profit my state?', the
          ministers will say 'how can I profit my family?', and everyone will try to profit
          at the others' expense, and the state will be in danger." You listen. You die the
          next year, and the conversation opens the book of Mencius for ever after.
      - label: "Ask for a man with a plan for the army"
        legitimacy_bp: -300
        outcome: >-
          Mencius leaves. The strategists who come next have plenty of plans.
        deeds: {martial_bp: 500}
      - label: "Offer him land and a post, and ask for his plan"
        wealth_bp: -500
        knowledge_bp: 2100
        outcome: >-
          Mencius thanks you for the land and says that a king must first become a good man
          before he can become a great one. He does not take the post.
    history: >-
      The Mencius opens with Mencius's audience with King Hui of Liang (Wei), who asked how
      Mencius would profit his state.
    sources: ["Mencius 1A.1", "Shiji 74 (Mencius)"]

  - id: wei_anyi
    scenario: warring_states
    civ: wei
    year: -286
    title: "The Old Capital"
    place: "Daliang"
    speaker: general
    speaker_name: "Your commander at Anyi"
    speaker_title: "In the old capital"
    needs_alive: [qin]
    benchmark_provinces: 2
    story: >-
      You are King Zhao of Wei. Qin has beaten your armies and Han's at Yique and taken city
      after city in Hedong. Now it demands Anyi, the old capital of your house, where your
      ancestors' temples stand.


      Your commander says Anyi can hold out. Your ministers say the price of holding it is
      the whole army.
    choices:
      - label: "Give Anyi to Qin"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Qin takes Anyi, sends its people away to Wei, and fills it with its own settlers and
          pardoned criminals. Hedong is Qin's.
        deeds: {give: [wei_hedong], give_to: qin}
      - label: "Garrison Anyi and refuse"
        materials_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Anyi holds, for a year. Qin's armies take the countryside around it.
        deeds: {men: 5000}
      - label: "Offer Qin gold and ask for peace"
        legitimacy_bp: -500
        wealth_bp: -1500
        outcome: >-
          You send a heavy chest of gold with your envoy. Qin takes it and keeps its demand,
          and your ministers ask how many chests there are to send.
        deeds: {men: 1500}
    history: >-
      Wei ceded Anyi to Qin in 286 BC; Qin expelled its people and settled its own there.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 5 (Qin)", "Shiji 44 (Wei)"]

  - id: wei_tally
    scenario: warring_states
    civ: wei
    year: -257
    title: "The Tiger Tally"
    place: "Daliang"
    speaker: steward
    speaker_name: "Lord Xinling"
    speaker_title: "Your half-brother"
    needs_alive: [zhao, qin]
    benchmark_provinces: 2
    story: >-
      You are King Anxi. Qin has destroyed Zhao's army at Changping and is besieging its
      capital, Handan. Zhao begs for help. You have sent your general Jin Bi with a hundred
      thousand men - and ordered him to halt at the border, because Qin has warned that
      whoever helps Zhao will be next.


      Your half-brother Lord Xinling, who keeps three thousand retainers and whose sister is
      married into the Zhao royal family, begs you to let the army march.
    choices:
      - label: "Hold Jin Bi at the border"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Xinling has your favourite consort steal the tiger tally from your bedchamber - half
          of the bronze token that commands the army. At the border, Jin Bi doubts it, and
          Xinling's retainer, a butcher named Zhu Hai, kills him with a forty-pound iron mallet.
          Xinling marches on Handan and breaks the siege. He does not dare come home for ten
          years.
        deeds: {grudges: {qin: 2000}}
      - label: "Let the army march on Handan"
        legitimacy_bp: 1500
        outcome: >-
          Jin Bi marches. Handan is saved, and Qin turns its eyes on Wei.
        deeds: {grudges: {qin: 3000}}
      - label: "Send Zhao grain and a small force"
        legitimacy_bp: 300
        food_bp: -800
        outcome: >-
          Supplies go to Handan with a few thousand men, while the main army waits. It is not
          enough to break the siege, and Qin counts it against you.
        deeds: {men: 3000}
    history: >-
      In 257 BC Lord Xinling stole the tiger tally, killed Jin Bi and relieved Handan against
      the king's orders.
    diverged: >-
      Zhao or Qin is gone.
    sources: ["Shiji 77 (Lord Xinling)", "Zhanguo ce, Wei 4"]

  - id: wei_xinling
    scenario: warring_states
    civ: wei
    year: -247
    title: "The Prince Who Was Too Popular"
    place: "Daliang"
    speaker: steward
    speaker_name: "A Qin envoy"
    speaker_title: "With gifts"
    needs_alive: [qin]
    benchmark_provinces: 2
    story: >-
      Qin attacked again, and you begged Lord Xinling to come home. He led the armies of five
      kingdoms against the Qin general Meng Ao and drove him back through the Hangu pass. The
      whole world says that Wei has a great general at last.


      Now Qin's envoys keep arriving, with gifts for Lord Xinling, and asking whether he has
      become king yet. Your ministers say that a prince that popular is a danger to his king.
    choices:
      - label: "Recall him and give the army to others"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          You relieve Xinling of his command. He stays at home, drinking day and night with
          women, and in four years he is dead. In eighteen years Wei is gone. Liu Bang, the
          founder of the Han dynasty, will honour his tomb whenever he passes it.
      - label: "Keep him in command of the armies"
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          Xinling keeps his command and his retainers, and the Qin envoys go home empty-handed.
        deeds: {martial_bp: 1500}
      - label: "Make him chancellor, and give the army to another"
        legitimacy_bp: 500
        influence: {nobility: -500}
        outcome: >-
          Xinling is given the first office of the state and your own officers take the army.
          He accepts it, though the soldiers still look to him.
    history: >-
      Lord Xinling defeated Meng Ao in 247 BC; Qin rumours led King Anxi to remove him, and he
      drank himself to death in 243.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 77 (Lord Xinling)", "Shiji 8 (Gaozu)"]

  - id: wei_flood
    scenario: warring_states
    civ: wei
    year: -225
    title: "The River in the Streets"
    place: "Daliang"
    speaker: general
    speaker_name: "Your commander of the walls"
    speaker_title: "Daliang"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      You are King Jia. Han and Zhao have fallen. Wang Ben, son of the great Qin general
      Wang Jian, has surrounded Daliang, and its walls are too strong to storm. So he has
      dug channels from the Yellow River and the Hong canal, and turned the water on the
      city.


      For three months the water has stood against the walls. Now they are starting to
      crumble.
    choices:
      - label: "Surrender the city to Wang Ben"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The walls fall, and you surrender, and are taken away a prisoner. Wei, which was the
          strongest state under heaven when your great-great-grandfather called himself king,
          is a Qin commandery.
        deeds: {ruler_falls: "surrenders to Qin as the walls fall", give: [wei_henei], give_to: qin}
      - label: "Fight on from the flooded rooftops"
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          Your soldiers fight from rooftops and boats. The water keeps rising.
        deeds: {men: 3000}
      - label: "Offer Qin the Henei lands for terms"
        legitimacy_bp: -1500
        wealth_bp: 500
        outcome: >-
          Your envoys go out in a boat with the offer. Qin takes the lands
          and says that the city is a separate matter, and the water stays against the walls.
        deeds: {give: [wei_henei], give_to: qin}
    history: >-
      Wang Ben flooded Daliang in 225 BC; after three months the walls collapsed and King Jia
      surrendered, ending Wei.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 44 (Wei)", "Shiji 6 (Qin Shi Huang)"]
