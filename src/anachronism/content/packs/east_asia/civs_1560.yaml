schema_version: 1
# Japan, Korea and the Ming coast in 1560.
civs:
  - id: oda
    name: Oda
    adjective: Oda
    lineage: oda
    colour: "#c0392b"
    emblem: 織田
    portrait: samurai
    description: >-
      A minor clan of Owari province, led by a young lord his own retainers call 'the fool of Owari'.
  - id: imagawa
    name: Imagawa
    adjective: Imagawa
    lineage: imagawa
    colour: "#2e6fb5"
    emblem: 今川
    portrait: samurai
    description: >-
      The most powerful clan on the Tokaido road, cultured and rich, marching to take the capital.
  - id: takeda
    name: Takeda
    adjective: Takeda
    lineage: takeda
    colour: "#b22222"
    emblem: 武田
    portrait: samurai
    description: >-
      Mountain lords of Kai, famed for their cavalry and for their daimyo, 'the Tiger of Kai'.
  - id: uesugi
    name: Uesugi
    adjective: Uesugi
    lineage: uesugi
    colour: "#1f4e9c"
    emblem: 上杉
    portrait: samurai
    description: >-
      The clan of Echigo, led by the devout 'Dragon of Echigo', Shingen's great rival.
  - id: hojo
    name: Hojo
    adjective: Hojo
    lineage: hojo
    colour: "#7a4f9c"
    emblem: 北条
    portrait: samurai
    description: >-
      Masters of the Kanto from their great castle at Odawara, the best-governed domain in Japan.
  - id: date
    name: Date
    adjective: Date
    lineage: date
    colour: "#16a085"
    emblem: 伊達
    portrait: samurai
    description: >-
      A great clan of the far north, torn by family feuds.
  - id: asakura
    name: Asakura
    adjective: Asakura
    lineage: asakura
    colour: "#8e6b3e"
    emblem: 朝倉
    portrait: samurai
    description: >-
      A cultured clan of Echizen, whose castle town Ichijodani rivals Kyoto.
  - id: saito
    name: Saito
    adjective: Saito
    lineage: saito
    colour: "#556b2f"
    emblem: 斎藤
    portrait: samurai
    description: >-
      Lords of Mino, who took the province by treachery and killed their own father.
  - id: miyoshi
    name: Miyoshi
    adjective: Miyoshi
    lineage: miyoshi
    colour: "#d35400"
    emblem: 三好
    portrait: samurai
    description: >-
      The real power in the capital region, ruling from Osaka Bay while the shogun reigns in name.
  - id: ashikaga
    name: Ashikaga shogunate
    adjective: Ashikaga
    lineage: ashikaga
    colour: "#f5f0e1"
    emblem: 足利
    portrait: court
    description: >-
      The shogun in Kyoto, heir to two centuries of rule, with a great name and almost no army.
  - id: mori
    name: Mori
    adjective: Mori
    lineage: mori
    colour: "#2c3e50"
    emblem: 毛利
    portrait: samurai
    description: >-
      A small clan grown great under its old, wily lord, now master of the western Inland Sea.
  - id: amago
    name: Amago
    adjective: Amago
    lineage: amago
    colour: "#6d4c41"
    emblem: 尼子
    portrait: samurai
    description: >-
      Lords of Izumo and the Iwami silver mine, the richest in Asia.
  - id: otomo
    name: Otomo
    adjective: Otomo
    lineage: otomo
    colour: "#27ae60"
    emblem: 大友
    portrait: samurai
    description: >-
      The great clan of northern Kyushu, friend to Portuguese traders and Jesuit missionaries.
  - id: shimazu
    name: Shimazu
    adjective: Shimazu
    lineage: shimazu
    colour: "#8e44ad"
    emblem: 島津
    portrait: samurai
    description: >-
      Tough warriors of Satsuma at the southern tip of Japan, first to copy the Portuguese guns.
  - id: chosokabe
    name: Chosokabe
    adjective: Chosokabe
    lineage: chosokabe
    colour: "#a0522d"
    emblem: 長宗
    portrait: samurai
    description: >-
      A small clan of Tosa on the island of Shikoku.
  - id: joseon
    name: Joseon
    adjective: Joseon
    lineage: joseon
    colour: "#1e5aa8"
    emblem: 朝鮮
    portrait: joseon
    description: >-
      A Confucian kingdom of scholars and officials, with its own alphabet and metal movable type, at peace for a century.
  - id: ming
    name: Ming
    adjective: Ming
    lineage: ming
    colour: "#e3b505"
    emblem: 大明
    portrait: court
    description: >-
      The Great Ming, the largest and richest state on earth, whose coasts are plagued by wokou pirates.
  - id: ryukyu
    name: Ryukyu
    adjective: Ryukyuan
    lineage: ryukyu
    colour: "#16a0a0"
    emblem: 琉球
    portrait: southern
    description: >-
      An island kingdom of traders, linking Japan, China and Southeast Asia.
