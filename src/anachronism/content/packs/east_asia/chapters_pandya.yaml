schema_version: 1
# Chronicle mode (D-120, D-XXX): the Pandyas of Madurai, 321-153 BC. Thin sources: no Pandya
# document survives from these years, and no Pandya king is known by name before the first
# Tamil-Brahmi cave inscriptions, so you are "the king" throughout. Facts follow the Greek
# writers on India (Megasthenes as reported in Arrian's Indica 8 and in Pliny), who tell a
# story of a Pandaean queen that may be a garbled report; the Arthashastra (Pandya pearls;
# its date is disputed); Ashoka's Rock Edicts II and XIII (c. 258-256 BC); the Tamil-Brahmi
# cave inscriptions at Mangulam and elsewhere near Madurai, dated by palaeography from the
# 3rd to the 1st century BC (Mahadevan, Subbarayalu); the Hathigumpha inscription of
# Kharavela of Kalinga, whose date is disputed (early 2nd century BC to the 1st; this file
# takes c. 170 BC) and which says a Pandya king sent him pearls and other gifts; and, as
# later tradition, the Sangam poems and the story of the three academies of Madurai, which are
# first told in writing centuries after these years. The poems are real poems, but were
# composed over centuries, perhaps the 1st-3rd century AD, and are not used as evidence of events
# in these years. Modern work by Sastri, Thapar, Mahadevan, Subbarayalu and Olivelle.
# Dates after Ashoka are approximate. benchmark_provinces is 1: this map has one province for
# the Pandya country.
chapters:
  - id: pnd_queen
    scenario: maurya
    civ: pandya
    year: -300
    title: "The Queen the Greeks Invented"
    place: "Madurai"
    speaker: steward
    speaker_name: "A merchant just back from Pataliputra"
    speaker_title: "A dealer in pearls"
    benchmark_provinces: 1
    story: >-
      You are the king of the Pandyas. Your pearls, from the gulf of Korkai, are traded across
      India: Chandragupta's minister Kautilya will list Pandya pearls among the best, and Greek
      ambassadors at Pataliputra have asked for the story of where they come from.


      The ambassador Megasthenes is writing a book about India. The Greeks will say that the
      Pandaean land, in the far south, is ruled by a woman: the daughter of the Indian Herakles,
      Pandaia, whom her father gave the south and its pearls. Your merchant says the
      ambassador has been told it as a fact, and that it will be written down, and read in
      Greek.
    choices:
      - label: "Say nothing and sell the pearls"
        historical: true
        wealth_bp: 800
        outcome: >-
          The Greek story stays in the book. Nobody knows where it came from: scholars suggest a
          garbled report of a goddess, a queen, or of the Tamil habit of tracing descent through
          the mother. Pearls and pepper go north, and Madurai gets rich on both.
      - label: "Send an envoy to Pataliputra with the true story"
        wealth_bp: -500
        legitimacy_bp: 300
        outcome: >-
          Your envoy is received kindly, and the Greek writes down what he has been told, as he
          did before.
      - label: "Send fine pearls to Chandragupta's court"
        wealth_bp: -900
        legitimacy_bp: 500
        outcome: >-
          The gift is accepted with thanks. Pataliputra now knows exactly how much the south
          is worth.
    history: >-
      Megasthenes (in Arrian and Pliny) says the Pandaean country was ruled by a queen, a
      daughter of Herakles. Pandya pearls are named in the Arthashastra. Later Tamil
      sources know only kings.
    sources: ["Arrian, Indica 8", "Pliny, Natural History 6", "Arthashastra 2.11", "Sastri, The Pandyan Kingdom (1929)"]

  - id: pnd_edicts
    scenario: maurya
    civ: pandya
    year: -258
    title: "Physicians from Pataliputra"
    place: "Madurai"
    speaker: maurya
    speaker_name: "Officers of King Ashoka"
    speaker_title: "From the north, with medicines"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are the king of the Pandyas. Officers have come from the emperor Ashoka, who calls
      himself 'Beloved of the Gods' and has been writing his sayings on rocks all over his empire.
      He wishes well to everyone, they say, in his own empire and in the lands next to it.


      In his inscriptions he will name your people, Pamdiya, with the Cholas, the Keralaputras,
      the Satiyaputras and Tambapanni, as neighbours outside his empire where he has had doctors
      for men and animals, herbs, wells and trees provided. He also sends teachers of his Dhamma.
    choices:
      - label: "Receive them, as a king who is free"
        historical: true
        legitimacy_bp: 500
        unrest_bp: -300
        influence: {clergy: 500}
        outcome: >-
          They dig their wells and plant their herbs, and go home. No Pandya source mentions
          it. In Rock Edict XIII Ashoka will list you among the lands where his 'conquest by
          Dhamma' has been won, and not one of them is a subject.
      - label: "Send them back with thanks"
        legitimacy_bp: 300
        outcome: >-
          Pataliputra is told that the Pandyas are proud, and that their pearls are for sale.
        deeds: {grudges: {maurya: 1000}}
    history: >-
      Ashoka's Rock Edicts II and XIII (about 258-256 BC) name the Pandyas and Cholas as peoples
      beyond his borders. The Tamil lands never belonged to the Mauryan empire.
    diverged: >-
      Ashoka's empire is gone; no officers come.
    sources: ["Rock Edict II", "Rock Edict XIII", "Olivelle, Ashoka: Portrait of a Philosopher King (2023)"]

  - id: pnd_poets
    scenario: maurya
    civ: pandya
    year: -231
    title: "The Poets of Madurai"
    place: "Madurai"
    speaker: scholar
    speaker_name: "A poet from the Tamil country"
    speaker_title: "At your gate"
    benchmark_provinces: 1
    story: >-
      You are the king of the Pandyas. A poet has come to your gate to sing your praises, as
      poets do in the Tamil country, for a gift: gold, a horse, an elephant, a meal.


      The story will be told, a thousand years later, that the Pandya kings of Madurai kept an
      academy, a Sangam, of poets, and that earlier ones were lost to the sea. There is no
      sign of such an academy in this age. The poems that survive from the Tamil country are
      real, but they are later than your time, and no one can say now which of them recall
      you.
    choices:
      - label: "Welcome the poet and give him a gift"
        historical: true
        legitimacy_bp: 600
        unrest_bp: -300
        wealth_bp: -300
        outcome: >-
          Your poet sings, and the song is not written down. The surviving collections, the
          Eight Anthologies and the Ten Idylls, will be gathered much later and are mostly
          about later kings, but they say that the Pandya court was a place where poets
          were paid.
      - label: "Send him away"
        wealth_bp: 300
        legitimacy_bp: -300
        outcome: >-
          A poet who is sent away makes a poor enemy. He sings elsewhere.
    history: >-
      The Sangam poems are dated by most scholars to the first centuries AD. The tale of three
      academies at Madurai is first written down about the 8th century AD. The poems do show that
      Tamil kings paid poets for praise.
    sources: ["Zvelebil, The Smile of Murugan (1973)", "Iraiyanar Akapporul (c. 8th century AD, the 'three Sangams' story)", "Hart, Poets of the Tamil Anthologies (1979)"]

  - id: pnd_cave
    scenario: maurya
    civ: pandya
    year: -201
    title: "A Cave for the Monks"
    place: "A hill near Madurai"
    speaker: diviner
    speaker_name: "A Jain monk"
    speaker_title: "From the north"
    benchmark_provinces: 1
    story: >-
      You are the king of the Pandyas. Jain monks, who have lived in the country for generations,
      are asking for a place to live out of the rain: a cave on a hill outside Madurai, with
      beds cut in the stone.


      They want to write down who gave it. In the north, they use an alphabet called Brahmi. It
      was made for another language, but with a few extra letters it can write Tamil.
    choices:
      - label: "Give the cave, and let them record it in Tamil"
        historical: true
        legitimacy_bp: 600
        influence: {clergy: 500}
        knowledge_bp: 1000
        outcome: >-
          The monks cut their lines in the rock. The oldest Tamil writing we have is in these caves
          at Mangulam and other hills round Madurai: a king, Nedunchezhiyan, whom later
          scholars take to be a Pandya, a few officials, and the donors of the beds. Their
          dating, between the third and first centuries BC, is debated; so is whether the
          Tamils wrote earlier on other materials.
      - label: "Refuse: the monks must find their own shelter"
        legitimacy_bp: -200
        outcome: >-
          The monks go to another hill, and another king.
    history: >-
      Tamil-Brahmi cave inscriptions near Madurai, such as those at Mangulam, record gifts of
      stone beds to Jain monks, one under a king who is generally read as a Pandya
      Nedunchezhiyan. Most scholars date them between the 3rd and 1st centuries BC.
    sources: ["Mahadevan, Early Tamil Epigraphy (2003)", "Subbarayalu, South India under the Cholas (2012), intro", "Mangulam Tamil-Brahmi inscriptions"]

  - id: pnd_pearls
    scenario: maurya
    civ: pandya
    year: -168
    title: "Pearls for Kharavela"
    place: "Madurai"
    speaker: general
    speaker_name: "A captain of the coast"
    speaker_title: "From the eastern harbours"
    benchmark_provinces: 1
    story: >-
      You are the king of the Pandyas. From the Bay of Bengal, where the ships of Kalinga go, a
      story reaches you of a Jain king named Kharavela, who builds and wins battles, and writes
      them on a rock at Udayagiri.


      He will say that in his thirteenth year the Pandya king sent him horses, elephants,
      jewels and a great load of pearls, and that in his eleventh he broke a league of Tamil
      lands a hundred and thirteen years old. His inscription is boastful and hard to read; the
      reading is disputed, and so is the date, from the early second century BC to the first.
      Your captain says that Kalinga is a long way to sail, and that Kalinga likes pearls.
    choices:
      - label: "Send pearls and horses to Kalinga"
        historical: true
        wealth_bp: -900
        legitimacy_bp: -300
        outcome: >-
          The gifts sail north. Whether they were tribute or a trade, or whether it is just
          Kharavela's boast, no Pandya source says.
      - label: "Refuse to send anything"
        legitimacy_bp: 600
        outcome: >-
          Kalinga is a long way off, and the pearls stay in Madurai. If Kharavela is angry, he does
          not come.
      - label: "Call the Cholas and Cheras to a council"
        unrest_bp: 300
        legitimacy_bp: 300
        outcome: >-
          The kings meet and are polite, and they are still rivals when they leave.
        deeds: {peace_with: [chola]}
    history: >-
      The Hathigumpha inscription says a Pandya king sent Kharavela horses, elephants, jewels and
      pearls (read in lines 13 and 14, disputed) and that he broke a Tamil confederacy of 113 years.
      Its date is disputed; no Tamil source remembers it.
    sources: ["Hathigumpha inscription, lines 11 and 13-14 (disputed readings)", "Sircar, Select Inscriptions", "Salomon, Indian Epigraphy (1998)"]
