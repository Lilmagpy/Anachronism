schema_version: 1
# Chronicle mode (D-120, D-XXX): the Qiang kingdom of Later Qin, from Kumarajiva's summons to the
# fall of Chang'an, 400-417. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Jin shu (chs. 117-118, the Yao Xing and Yao Hong
# records), the Wei shu, the Zizhi tongjian 111-118 and, for Kumarajiva, the Gao seng zhuan
# (ch. 2) and the Chu sanzang ji ji, with modern work by Lewis, Holcombe and Mather.
# Dates are traditional lunar-calendar years; Kumarajiva's own dates (344-413) are traditional
# and disputed, and the "ten women" and "unburnt tongue" stories are told in the Gao seng
# zhuan, written a century later, so the text marks them as such. Yao Ping, who died at
# Chaibi, is called a kinsman because sources differ on whether he was Yao Xing's brother or
# cousin. Yao Xing died in the second month of 416; the chapter of that year opens as Yao Hong
# on the two-year grid. Yao Hong surrendered in the ninth month of 417 (Chang'an fell to Wang
# Zhen'e, not "Zhenwu"); no chapter can open in 417, so the last one ends the story.
# benchmark_provinces counts the provinces of this map the real Qin held at that date (Luoyang
# from 399 to 416).
chapters:
  - id: lq_kumarajiva
    scenario: three_kingdoms
    civ: later_qin
    year: 400
    title: "An Army for a Monk"
    place: "Chang'an, the Qin court"
    speaker: scholar
    speaker_name: "A Buddhist monk of the capital"
    speaker_title: "Of the Chang'an monasteries"
    benchmark_provinces: 2
    story: >-
      You are Yao Xing, ruler of the Qiang kingdom of Qin, thirty-four years old, and a
      devout Buddhist. Your father Yao Chang killed the old Fu Jian, and you have taken the
      Wei valley and, last year, Luoyang. You hold Chang'an, the old capital of the Han.


      Far to the west, in Guzang, lives a monk from Kucha named Kumarajiva. The Gao seng
      zhuan says that he was carried off as a captive by the Lü family when they conquered
      Kucha, and that he has been kept in Liangzhou for some seventeen years. Your father
      and you have both asked for him, and Lü Guang would not let him go, fearing that such a
      counsellor would only help Qin. The monks of Chang'an say that no one can put the
      Indian scriptures into good Chinese but him. To fetch him, you must send an army
      against the Later Liang.
    choices:
      - label: "Send the army west to bring him back"
        historical: true
        legitimacy_bp: 1000
        knowledge_bp: 1500
        wealth_bp: -500
        influence: {clergy: 1500}
        outcome: >-
          Your army beats the Later Liang, and Kumarajiva reaches Chang'an at the end of 401. You
          meet him as a teacher, not a captive. You give him the Xiaoyao garden to live in,
          and set up a translation bureau there: hundreds of monks gather. You sometimes sit
          in the hall yourself, and the Gao seng zhuan says you held the palm-leaf book in your
          own hands while he explained it. Over the next years he and his helpers put into
          Chinese the Lotus Sutra, the Vimalakirti, the Amitabha Sutra and the great treatises
          of the Middle Way. Many of his translations are still read today.
      - label: "Keep the army at home against Wei and Jin"
        legitimacy_bp: 300
        outcome: >-
          Wei and Jin are the dangers of the day, and the monk stays in Liangzhou. The monks of
          Chang'an, in time, go to other courts.
    history: >-
      Yao Xing sent armies against the Later Liang in 400-401 and Kumarajiva arrived in
      Chang'an at the end of 401, where Yao Xing made him a national teacher and supported
      his translation bureau.
    sources: ["Gao seng zhuan 2 (Kumarajiva)", "Jin shu 117 (Yao Xing)", "Zizhi tongjian 111-112", "Mather, 'Chinese Buddhism' studies (Kumarajiva)"]

  - id: lq_chaibi
    scenario: three_kingdoms
    civ: later_qin
    year: 402
    title: "Yao Ping on the Hill"
    place: "The east bank of the Fen river, Shanxi"
    speaker: general
    speaker_name: "One of your officers"
    speaker_title: "On the river bank"
    needs_alive: [northern_wei]
    benchmark_provinces: 2
    story: >-
      You are Yao Xing. Around the new year Tuoba Gui of Wei attacked your vassal Moyigan,
      and the peace between Qin and Wei is over. In the summer you led an army to the Fen
      valley. Your kinsman Yao Ping went ahead with the vanguard, and the Wei emperor has
      shut him up on the hill of Chaibi, in a bend of the river, with the Wei cavalry all round
      the foot of it.


      Yao Ping's men have no food but what they have carried. From the far bank you can see
      the Wei lines. Your officers say you cannot force the river without losing the army
      too. Yao Ping is your own blood.
    choices:
      - label: "Try to break the siege and relieve him"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        knowledge_bp: -200
        outcome: >-
          You attack and attack again, and the Wei hold every crossing. In the winter Yao Ping
          tries to break out, fails, and throws himself into the river, the Wei shu says; his
          army is taken. You go home beaten, and in the next years make your peace with the Wei and look west instead.
        deeds: {peace_with: [northern_wei]}
      - label: "Retreat, and write Yao Ping off"
        legitimacy_bp: -800
        outcome: >-
          You pull back with the army whole, and Yao Ping and his men are taken on the hill.
          Many of your Qiang chiefs say you should have tried.
        deeds: {peace_with: [northern_wei]}
    history: >-
      In 402 Yao Xing led an army against Northern Wei; his vanguard under Yao Ping was
      trapped at Chaibi, and in the winter Yao Ping's army was captured despite Yao Xing's
      attempts to relieve it.
    diverged: >-
      Northern Wei is gone.
    sources: ["Wei shu 2 (Taizu)", "Jin shu 117 (Yao Xing)", "Zizhi tongjian 112"]

  - id: lq_ten_women
    scenario: three_kingdoms
    civ: later_qin
    year: 404
    title: "The Teacher's Heirs"
    place: "The Xiaoyao garden, Chang'an"
    speaker: scholar
    speaker_name: "Sengrui"
    speaker_title: "A pupil of Kumarajiva"
    benchmark_provinces: 2
    story: >-
      You are Yao Xing. The master from Kucha has been with you three years. Every day the
      translators gather in the Xiaoyao garden, and the hall is full of monks writing down
      what he says. He is a man of whom no one can say that he is not clever.


      The Gao seng zhuan tells a story of this time, and the later monks tell it with some
      shame. You say to your court that such a mind must not die without sons, that wise men
      are scarce, and you wish to give him women of the palace. Kumarajiva is a monk, and has
      kept the rule since boyhood, though, the book says, the Lü family once forced him to break it, in Liangzhou.
    choices:
      - label: "Give him the women of the palace"
        historical: true
        legitimacy_bp: -300
        knowledge_bp: 500
        influence: {clergy: -500}
        outcome: >-
          The Gao seng zhuan says that you gave him ten palace women, and that Kumarajiva,
          unwilling to refuse his patron, lived in a house of his own. Some monks, it says,
          were tempted to follow his example, and he showed them a bowl of needles, and said
          that whoever could eat them as he did might take wives. He ate the needles. The
          story is a monk's story: but all agree that he went on translating.
      - label: "Honour his vows, and leave him to his books"
        legitimacy_bp: 300
        influence: {clergy: 500}
        outcome: >-
          Kumarajiva thanks you. The work goes on in the garden, and no more is said.
    history: >-
      According to the Gao seng zhuan, Yao Xing, wishing to have heirs of Kumarajiva's genius,
      gave him women to live with; he went on with his translation of the scriptures until
      his death (traditionally 413).
    sources: ["Gao seng zhuan 2 (Kumarajiva)", "Chu sanzang ji ji 14"]

  - id: lq_bobo
    scenario: three_kingdoms
    civ: later_qin
    year: 406
    title: "Peace with the Wei"
    place: "Chang'an"
    speaker: general
    speaker_name: "Your commander in the north"
    speaker_title: "Of the Shuofang frontier"
    needs_alive: [northern_wei]
    benchmark_provinces: 2
    story: >-
      You are Yao Xing. In the north, on the Ordos steppe, you have set a Xiongnu chief
      named Liu Bobo over more than thirty thousand men of the Tiefu and other tribes. He is
      the son of a chief whom the Wei killed, and he hates them, which seemed like a
      good thing in a frontier commander. He is also brave and cruel, and your officers
      have warned you of both.


      Meanwhile the war with Wei has cost you dear since Chaibi. Wei would now make peace.
      Your officers tell you that if you make it, Bobo will lose his enemy; and a
      man like that has to have one.
    choices:
      - label: "Make peace with the Wei, and keep Bobo where he is"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          The peace is agreed. Bobo, in the Ordos, is angry at it. In 407 he kills his
          father-in-law Moyigan in an ambush, takes his men, takes the name Helian (Linked
          with Heaven), claims descent from the sage kings of Xia, and calls himself Heavenly
          King and Great Chanyu. Your armies chase him through the Ordos for years and never
          catch him. He raids your northern towns each autumn, as long as you reign.
        deeds: {peace_with: [northern_wei]}
      - label: "Break up Bobo's command and refuse the peace"
        legitimacy_bp: -300
        outcome: >-
          You take the tribes away from him. The Wei war goes on, and Bobo goes with it.
        deeds: {martial_bp: 300}
    history: >-
      In 407 Liu Bobo, angered by Yao Xing's peace with the Wei, killed his father-in-law
      Moyigan, took his troops and founded Great Xia as Helian Bobo, Heavenly King and Great
      Chanyu. His raids damaged Later Qin for the rest of its life.
    diverged: >-
      Northern Wei is gone.
    sources: ["Jin shu 130 (Helian Bobo)", "Wei shu 95", "Zizhi tongjian 114"]

  - id: lq_tongue
    scenario: three_kingdoms
    civ: later_qin
    year: 412
    title: "The Tongue That Would Not Burn"
    place: "The Xiaoyao garden"
    speaker: scholar
    speaker_name: "Kumarajiva"
    speaker_title: "The teacher, on his sickbed"
    benchmark_provinces: 2
    story: >-
      You are Yao Xing. The master is ill. The Gao seng zhuan says he tried charms and mantras, and they did not help, and that he took leave of his pupils. He told them that he had put many scriptures into Chinese, and that if his translations were true to the teaching, his tongue would not burn when his body was burnt.


      Traditionally he dies in 413, though the sources disagree about the year.
    choices:
      - label: "Honour him, and burn his body as he asked"
        historical: true
        legitimacy_bp: 500
        influence: {clergy: 1000}
        outcome: >-
          When he is cremated in the Xiaoyao garden, the story goes, the body is consumed but
          the tongue is left whole. Whatever happened at the fire, it was believed, and his pupils Sengzhao, Sengrui and others carry his teaching on.
      - label: "Keep him alive at all costs, by every doctor in Chang'an"
        legitimacy_bp: 100
        wealth_bp: -300
        outcome: >-
          The doctors can do nothing, and the old man smiles at you.
    history: >-
      Kumarajiva died in Chang'an, traditionally in 413, and the Gao seng zhuan reports that
      his tongue survived cremation.
    sources: ["Gao seng zhuan 2 (Kumarajiva)", "Chu sanzang ji ji 14"]

  - id: lq_heirs
    scenario: three_kingdoms
    civ: later_qin
    year: 414
    title: "The Sons of Yao Xing"
    place: "Chang'an, the palace"
    speaker: steward
    speaker_name: "Liang Xi"
    speaker_title: "Your minister"
    benchmark_provinces: 2
    story: >-
      You are Yao Xing, forty-eight and ill. You have many sons, and the crown prince is Yao
      Hong, a gentle man, said to be fonder of books than of war. Another son, Yao Bi, plots to take
      his place, and has been gathering his friends. Three of your other sons have been calling
      out their men to stop him.


      Your ministers Liang Xi and Yin Zhao say: execute Yao Bi, or at least strip him of his
      command. Yao Hong, who is soft-hearted, has pleaded for his brother in the past.
    choices:
      - label: "Strip Yao Bi of his offices, and spare him"
        historical: true
        legitimacy_bp: -300
        unrest_bp: 500
        outcome: >-
          Yao Bi is dismissed, and your other sons stand down. The family quarrel is
          quiet, but it does not end. Your sons and nephews hold the armies of Qin in
          their hands, and none of them forgets it. When you die in 416, the sons who rebelled and were spared are still there to trouble Yao Hong.
      - label: "Execute Yao Bi"
        legitimacy_bp: -800
        unrest_bp: 800
        outcome: >-
          Yao Bi dies, and your other sons see what you will do. The court is afraid.
    history: >-
      Yao Xing fell seriously ill in 414; Yao Bi plotted to replace the crown prince Yao Hong,
      but was stripped of his posts and spared. Yao Xing died in the second month of 416.
    sources: ["Jin shu 117 (Yao Xing)", "Jin shu 118 (Yao Hong)", "Zizhi tongjian 116-117"]

  - id: lq_liu_yu
    scenario: three_kingdoms
    civ: later_qin
    year: 416
    title: "The Jin Come Up the River"
    place: "Chang'an"
    speaker: general
    speaker_name: "Yao Shao"
    speaker_title: "A kinsman and your commander"
    needs_alive: [eastern_jin]
    benchmark_provinces: 1
    story: >-
      You are Yao Hong, the son of Yao Xing, and your father is dead. Your brother Yao Xuan
      has moved his troops without orders, and your cousin Yao Hui is about to rise in
      Anding. The Xia of Helian Bobo raid your northern country every year. And now the great
      general of the Jin, Liu Yu, is coming up the Yellow River with a fleet and an army,
      and has taken Luoyang.


      Your kinsman Yao Shao is a good general, and knows that the realm can be held only if the
      Qin princes stand together and fight Liu Yu at the Tong pass. The princes do not
      trust each other.
    choices:
      - label: "Fight on at Chang'an with what you have"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          Yao Shao puts down Yao Xuan and Yao Hui, but cannot hold the pass. The Jin general
          Wang Zhen'e reaches Chang'an in the ninth month of 417. You surrender to him; the Qin,
          which Yao Chang founded in 384, is over. Liu Yu sends you to Jiankang, where you are
          executed. A great Jin general holds Chang'an for the first time since 316, but
          not for long.
        deeds: {ruler_falls: "surrenders to the Jin general Wang Zhen'e"}
      - label: "Flee west to Anding before the Jin come"
        legitimacy_bp: -3000
        outcome: >-
          You leave Chang'an to its fate and ride for the Qiang country, where nobody wants you.
    history: >-
      Liu Yu's armies took Luoyang in 416 and Chang'an in the ninth month of 417; Yao Hong
      surrendered and was sent to Jiankang and executed.
    diverged: >-
      The Jin are gone.
    sources: ["Jin shu 118 (Yao Hong)", "Song shu 1-2", "Zizhi tongjian 117-118"]
