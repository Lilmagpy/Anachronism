schema_version: 1
# Chronicle mode (D-120, D-XXX): the Donghu, the "Eastern Hu" of the Xilamulun steppe, from
# the hostage Qin Kai to Modu's destruction of them, about 306-208 BC. Each chapter opens in
# its year; one choice is what history chose (historical: true). Facts follow Sima Qian's
# Shiji 110 (the Xiongnu), Shiji 81 (Li Mu) and the Hou Hanshu 90 (Wuhuan and Xianbei), with
# modern work by Di Cosmo (Ancient China and Its Enemies, 2002) and Barfield (The Perilous
# Frontier, 1989). The Donghu left no writing of their own and no ruler's name survives, so
# the player is "the Donghu king". All dates are approximate: Qin Kai's campaign is "about 300"
# (the Shiji only places it in King Zhao of Yan's reign, 311-279); the Li Mu campaign is
# undated in the Shiji (the years after about 250); Modu's accession is 209 BC but when he
# struck the Donghu is not given (the Shiji says soon after). The horse, wife and land story
# is one of the best-known in the Shiji; it is told by a Han historian about a people he did
# not love, so the telling is labelled as such in the text. benchmark_provinces counts the
# provinces of this map the real Donghu held: the map has one for them.
chapters:
  - id: donghu_hostage
    scenario: warring_states
    civ: donghu
    year: -306
    title: "The Hostage from Yan"
    place: "Your camp on the Xilamulun"
    speaker: general
    speaker_name: "Qin Kai"
    speaker_title: "A hostage from Yan"
    needs_alive: [donghu, yan]
    benchmark_provinces: 1
    story: >-
      You are the king of the Donghu, the Eastern Hu: herders of horses, sheep and cattle on
      the grass between the hills and the Liao river. The Yan court beyond the hills is
      rich, and weak at the edges, and it has sent you a young nobleman as a hostage to keep
      the peace. His name is Qin Kai.


      He has lived in your tents for years. He speaks your language and rides well, he has
      learned your pastures, your chiefs and their quarrels, and your people like him. Now he
      asks leave to go home: his father is old, he says, and the king of Yan is asking for him.
    choices:
      - label: "Send Qin Kai home with gifts"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You send him off with gifts and a horse. The Shiji says the Hu trusted him greatly.
          He remembers every camp he passed.
      - label: "Keep the hostage until Yan sends another"
        unrest_bp: 300
        legitimacy_bp: -200
        outcome: >-
          Yan sends polite letters and more silk. A year later the answer is the same, and Qin
          Kai's smile grows a little thinner.
      - label: "Release him, but for a ransom in silk"
        wealth_bp: 400
        legitimacy_bp: 400
        unrest_bp: 300
        outcome: >-
          Yan pays, with some grumbling, and Qin Kai rides south with your chiefs' blessing
          and the knowledge of every well on the road. Some of your people think you have
          sold a friend; others think you have driven a hard bargain.
    history: >-
      Qin Kai, a Yan nobleman, was a hostage among the Hu (the Donghu), who trusted him
      greatly; on his return he led Yan's army against them (about 300 BC).
    sources: ["Shiji 110 (Xiongnu)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: donghu_thousand_li
    scenario: warring_states
    civ: donghu
    year: -300
    title: "A Thousand Li"
    place: "The Xilamulun pastures"
    speaker: general
    speaker_name: "Your chief of scouts"
    speaker_title: "Just in from the south"
    needs_alive: [yan]
    benchmark_provinces: 1
    story: >-
      You are the king of the Donghu. The Yan army is coming up the valleys, and at its head
      is the man who ate your bread: Qin Kai. He knows where the herds winter, where the wells
      are, and which chiefs will quarrel with which.


      Your riders can strike and vanish, but they cannot stand against a Yan army that has
      come to stay. Your chiefs say fight at the passes. Others say take the herds and the
      people north, and let the grass decide how far Yan can follow. A few of the older
      men would send horses to the Yan camp and ask what price they want.
    choices:
      - label: "Take the herds and people north"
        historical: true
        legitimacy_bp: -800
        unrest_bp: 600
        outcome: >-
          The tents are struck, the herds are driven north, and the Donghu withdraw. The Shiji
          says a thousand li, the way a Chinese writer measures a retreat. Behind you Yan
          builds a long wall, with commanderies from Shanggu to Liaodong, to keep the grass
          from the plough and the plough from the grass. You are weaker, and alive.
        deeds: {peace_with: [yan], grudges: {yan: 500}, martial_bp: 2000, men: 6000}
      - label: "Fight them at the mountain passes"
        legitimacy_bp: 300
        unrest_bp: 800
        outcome: >-
          Your riders ambush the Yan columns twice and are caught on the third day by an army
          that knew where to wait. You lose many men, and Yan keeps coming.
        deeds: {martial_bp: 1000, men: 3000}
      - label: "Buy peace with horses and tribute"
        wealth_bp: -800
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          Your envoys drive a string of horses to the Yan camp and return with a truce, for
          now. Your chiefs mutter that a people who pays once will be asked again, and Qin
          Kai knows exactly what your herds are worth.
        deeds: {peace_with: [yan]}
    history: >-
      Around 300 BC the Yan general Qin Kai drove the Donghu back "a thousand li"; Yan then
      built a wall from Zaoyang to Xiangping and set up the commanderies of Shanggu, Yuyang,
      Youbeiping, Liaoxi and Liaodong against the Hu.
    sources: ["Shiji 110 (Xiongnu)", "Shiji 34 (Yan)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: donghu_li_mu
    scenario: warring_states
    civ: donghu
    year: -244
    title: "The Lord of Dai"
    place: "The northern border"
    speaker: general
    speaker_name: "A border chief"
    speaker_title: "From the Zhao frontier"
    needs_alive: [zhao]
    benchmark_provinces: 1
    story: >-
      You are the king of the Donghu. For half a century you have kept to the north of Yan's
      wall. Zhao's general Li Mu, who guards the north from Dai, has a way with the Hu.
      For years he fought none of them, keeping his men inside the forts, and let them think
      him a coward.


      Then, the Shiji says, he changed. Your chiefs say that a Zhao army, fresh and full of
      cavalry and crossbowmen, is heading north. It has beaten the Xiongnu already.
    choices:
      - label: "Fall back and keep the herds safe"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          Li Mu is said to have crushed the Donghu and the Linhu, and to have overcome the
          Xiongnu. His life was cut short in 229 when Zhao's own king listened to slander, but for
          the years that he lived, Zhao's border was quiet, and you were not on it. Writers
          who like a round number say the Xiongnu lost a hundred thousand riders. Others doubt
          the numbers. In the years after, you turn your quarrel with Zhao into a truce and a
          pact against Yan, the neighbour that has hurt you longest. (That pact is the game's
          invention, not the Shiji's: it keeps Yan from swallowing a people the sources lose
          sight of for the next forty years.)
        deeds: {peace_with: [yan, zhao], ally_with: [zhao], martial_bp: 8000, men: 20000}
      - label: "Raid the Zhao villages before he is ready"
        legitimacy_bp: 300
        unrest_bp: 400
        outcome: >-
          A raid brings home sheep and silk, and brings Li Mu's whole army down on you a year
          sooner. Your chiefs call up every rider they can find.
        deeds: {martial_bp: 1500, men: 4000}
      - label: "Offer Zhao horses for a truce"
        wealth_bp: -500
        legitimacy_bp: -300
        outcome: >-
          Zhao has always bought horses from the steppe, and its envoys do not refuse yours.
          The truce is kept while Li Mu watches, and you are left to wonder what he is
          counting.
        deeds: {peace_with: [zhao], martial_bp: 1500, men: 8000}
    history: >-
      The Shiji says that Zhao's general Li Mu defeated the Xiongnu, destroyed the Dan Lan,
      crushed the Donghu and received the Linhu's surrender. It gives no year; historians place
      it in the 250s and 240s BC, and the details are debated.
    sources: ["Shiji 81 (Lian Po and Lin Xiangru)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: donghu_horse
    scenario: warring_states
    civ: donghu
    year: -209
    title: "The Horse and the Woman"
    place: "Your royal tent"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the Donghu court"
    benchmark_provinces: 1
    story: >-
      You are the king of the Donghu, and the Donghu are strong. On your western border the
      Xiongnu have a new chanyu. His name is Modu. The Shiji says he killed his own father,
      Touman, with an arrow that whistled, and that his guards shot with him. You have
      heard that he has a horse that can run a thousand li in a day.


      What follows is the famous story that Sima Qian tells, and a historian of the Han
      writing about a people the Han feared is not a neutral witness. But this is how the
      story goes. You send an envoy to ask Modu for the horse. His lords tell him to refuse,
      for a horse like that is the treasure of the country. Modu says: "Why should one grudge
      a horse to a neighbour?" And he gives it. Soon afterwards you ask again: now
      for one of his wives.
    choices:
      - label: "Ask for the chanyu's wife"
        historical: true
        legitimacy_bp: 400
        outcome: >-
          Modu's lords are furious. Modu says again: "Why grudge a woman to a neighbour?" and
          sends her. You and your court laugh: the new chanyu is a boy who is afraid. But in the
          Xiongnu tents, by the story, the arrows are being counted.
      - label: "Keep the horse, and ask for nothing more"
        legitimacy_bp: -100
        outcome: >-
          You sit in your tents with a good horse and a young chanyu who is quietly
          counting his arrows. The Donghu are in no hurry to find out what he is counting
          them for.
      - label: "Send gifts, and treat him as an equal"
        wealth_bp: -500
        legitimacy_bp: -300
        outcome: >-
          Modu accepts your silk and says nothing. Your envoys come home and say that the
          Xiongnu court is quiet, and that quiet is not what they expected of a young man who
          had just killed his father.
    history: >-
      In the story told in the Shiji (110), the Donghu king, hearing that the new chanyu Modu
      (who took power in 209 BC) was weak, sent for his thousand-li horse and then for one of
      his consorts; Modu gave both.
    sources: ["Shiji 110 (Xiongnu)", "Barfield, The Perilous Frontier (1989)"]

  - id: donghu_land
    scenario: warring_states
    civ: donghu
    year: -208
    title: "The Land Between"
    place: "Your royal tent"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the Donghu court"
    benchmark_provinces: 1
    story: >-
      You are the king of the Donghu. Between your pastures and the Xiongnu there is a
      strip of empty land, a thousand li of grass with no one living in it: a good place
      to hold a border. You have the horse, you have the woman, and now you ask Modu for
      the land.


      The story says that Modu asked his lords. Some said: it is wasteland, give it. Modu
      shouted that land is the root of the state, and had the ones who said "give it" put to
      death. Then he mounted and gave the order: anyone who lags behind is to be beheaded.
      His army rode east.
    choices:
      - label: "Ask Modu for the empty land"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Modu's riders arrive like the wind. By the story, the Donghu despised him and had no
          defences at all. He kills the king, takes the people, the herds and the women, and
          comes home with all of it. Those who flee become later peoples, the Wuhuan and the
          Xianbei, who will have histories of their own.
        deeds: {ruler_falls: "is killed when Modu's riders overrun the camps"}
      - label: "Do not ask: set a guard on the western border"
        legitimacy_bp: -1200
        unrest_bp: 1200
        outcome: >-
          You choose to be careful, and the camps grumble at the cost of riders kept awake
          all summer. The Xiongnu are still coming. Your riders are awake when they arrive,
          and the fight is long, and not certain.
        deeds: {martial_bp: 1500, men: 4000}
      - label: "Pull the herds back from the border"
        legitimacy_bp: -1500
        unrest_bp: 1500
        wealth_bp: -800
        outcome: >-
          The herds are moved east, away from the empty land, and your chiefs complain of
          lost pasture and lost face. The Xiongnu are still coming, and they find a people
          that is thinner on the ground but harder to catch.
    history: >-
      By the story in the Shiji, Modu answered the Donghu demand for the border wasteland by
      attacking, destroyed the Donghu king and took his people and herds (about 209-208 BC).
      The survivors withdrew; later the Wuhuan and Xianbei are said to descend from them.
    sources: ["Shiji 110 (Xiongnu)", "Hou Hanshu 90 (Wuhuan and Xianbei)"]
