schema_version: 1
# Chronicle mode (D-120, D-174): the late Ming, from the wokou wars to Sarhu, 1561-1619.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Ming shi, the Veritable Records (Ming shilu), Hai Rui's memorial, Qi
# Jiguang's New Treatise on Military Efficiency, Ricci's journals (as edited by Trigault),
# and modern work by Ray Huang (1587, A Year of No Significance), Brook, Swope, Dardess and
# Spence. benchmark_provinces counts the provinces of this map the real Ming held at that
# date.
chapters:
  - id: ming_qi
    scenario: sengoku
    civ: ming
    year: 1561
    title: "The Mandarin Duck Formation"
    place: "Taizhou, Zhejiang"
    speaker: general
    speaker_name: "Qi Jiguang"
    speaker_title: "Commander in Zhejiang"
    benchmark_provinces: 5
    story: >-
      You are the Jiajing Emperor. For forty years you have reigned from inside the palace,
      making elixirs with Daoist priests, and your ministers rarely see you. On the coast,
      the wokou - pirates, Japanese and Chinese both, many of them smugglers driven to it by
      your ban on sea trade - burn towns from Shandong to Guangdong.


      Your commander Qi Jiguang says the regular garrisons are useless. He wants to recruit
      four thousand miners and peasants from Yiwu, tough men who have fought each other over
      the silver mines, and drill them in squads of twelve, each with long bamboo spears,
      shields, tridents and swords working together: the 'mandarin duck' formation.
    choices:
      - label: "Let Qi raise his own army"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          At Taizhou, Qi's army wins nine battles in a month. Within five years the great
          pirate bands are destroyed. Qi writes down everything he has learned in a book that
          Korean and Japanese generals will study for centuries.
        deeds: {men: 4000, martial_bp: 1000}
      - label: "Send more of the regular army"
        wealth_bp: -2000
        outcome: >-
          The garrison troops march to the coast, and the pirates sail away until they leave.
    history: >-
      Qi Jiguang's Yiwu army destroyed the wokou at Taizhou in 1561 and in Fujian in 1562-1565.
    sources: ["Qi Jiguang, Jixiao xinshu", "Ming shi 212 (Qi Jiguang)", "Huang, 1587, A Year of No Significance (1981)"]

  - id: ming_hai_rui
    scenario: sengoku
    civ: ming
    year: 1565
    title: "A Coffin Bought in Advance"
    place: "The Forbidden City"
    speaker: scholar
    speaker_name: "Hai Rui"
    speaker_title: "A secretary in the Ministry of Revenue"
    benchmark_provinces: 5
    story: >-
      A junior official, Hai Rui, has sent you a memorial. It says that you have neglected
      the government for twenty years for the sake of Daoist elixirs, that you have not seen
      your own sons, that the treasury is empty and the people are poor, and that the whole
      empire says: 'Jiajing - every house is clean', meaning cleaned out.


      Your eunuchs tell you that Hai Rui has already bought his coffin, said goodbye to his
      family and sent away his servants. He is waiting to be arrested.
    choices:
      - label: "Throw him in prison, but do not kill him"
        historical: true
        legitimacy_bp: -500
        influence: {nobility: 500}
        outcome: >-
          You throw the memorial on the floor, pick it up and read it again, and sigh: "He
          wants to be Bi Gan, the loyal minister. But I am not the tyrant Zhou." Hai Rui sits
          in prison, waiting for death. You die before you sign the order, and the new emperor
          releases him. He becomes the most famous honest official in Chinese history.
      - label: "Read it again, and change your ways"
        legitimacy_bp: 1500
        influence: {clergy: -1500}
        outcome: >-
          The Daoist priests are dismissed and you hold court for the first time in years. Your
          ministers do not know what to do.
    history: >-
      Hai Rui's memorial of 1565 rebuked the Jiajing Emperor; Hai was imprisoned and released
      on the emperor's death in early 1567.
    sources: ["Hai Rui, Zhi'an shu (memorial on public order)", "Ming shi 226 (Hai Rui)"]

  - id: ming_yuegang
    scenario: sengoku
    civ: ming
    year: 1567
    title: "Moon Harbour"
    place: "The Forbidden City"
    speaker: steward
    speaker_name: "Tu Zemin"
    speaker_title: "Governor of Fujian"
    benchmark_provinces: 5
    story: >-
      You are the Longqing Emperor. Your father's sea ban - no Chinese ship to sail abroad -
      has been the law for two hundred years, and it made the coast a smugglers' paradise and
      the pirates' recruiting ground.


      The governor of Fujian proposes opening one port, Moon Harbour near Zhangzhou, to
      licensed merchant ships sailing to the southern seas, with customs duties paid to the
      treasury. Not to Japan, though: never Japan.
    choices:
      - label: "Open Moon Harbour"
        historical: true
        wealth_bp: 4000
        unrest_bp: -1000
        outcome: >-
          The junks sail for Manila, Siam and Java, and come home with silver: from 1571 the
          Spanish galleons bring it to Manila from the mines of Potosí and Mexico, to buy silk
          and porcelain. By the end of the century perhaps a third of the world's silver ends
          up in China.
      - label: "Keep the sea ban"
        legitimacy_bp: 500
        outcome: >-
          The coast stays closed. The smugglers go on smuggling.
    history: >-
      In 1567 the Longqing court partly lifted the sea ban, licensing trade from Yuegang
      (Moon Harbour) in Fujian, except to Japan.
    sources: ["Ming shilu, Longqing reign", "Brook, The Troubled Empire (2010)", "Flynn and Giráldez, 'Born with a Silver Spoon' (1995)"]

  - id: ming_altan
    scenario: sengoku
    civ: ming
    year: 1571
    title: "The Obedient and Loyal King"
    place: "The Forbidden City"
    speaker: steward
    speaker_name: "Gao Gong"
    speaker_title: "Grand Secretary"
    benchmark_provinces: 5
    story: >-
      For thirty years Altan Khan of the Mongols has raided the northern frontier; twenty
      years ago he camped outside Beijing. Last year his grandson, furious that Altan had
      taken his bride, fled to the Ming border and gave himself up.


      Your ministers propose to send the grandson back with honour, and in return make peace:
      Altan to be named a Ming prince, the 'Obedient and Loyal King', and horse markets to be
      opened on the frontier where the Mongols can trade their horses for silk and tea.
    choices:
      - label: "Make peace, and open the markets"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        food_bp: 1000
        outcome: >-
          Altan accepts. The raids stop, the horse markets thrive, and the northern frontier is
          quieter for decades than it has been in a century. Altan's wife Sanniangzi, whom the
          Ming will honour as the Lady Loyal and Obedient, keeps the peace after him. Altan
          himself turns to Tibetan Buddhism and gives the title 'Dalai Lama' to the head of the
          Yellow Hat school.
      - label: "Execute the grandson, and fight on"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Altan's horsemen come over the wall in the autumn, as every autumn.
    history: >-
      The peace of 1571 made Altan Khan 'Shunyi Wang' and opened border horse markets; in
      1578 Altan gave Sonam Gyatso the title Dalai Lama.
    sources: ["Ming shi 327 (Dada)", "Serruys, Sino-Mongol Relations during the Ming (1967-1975)"]

  - id: ming_survey
    scenario: sengoku
    civ: ming
    year: 1580
    title: "Measuring Every Field"
    place: "The Forbidden City"
    speaker: steward
    speaker_name: "Zhang Juzheng"
    speaker_title: "Senior Grand Secretary, your teacher"
    benchmark_provinces: 5
    story: >-
      You are the Wanli Emperor. You came to the throne at nine; you are seventeen now, and
      your teacher Zhang Juzheng still runs the empire, and runs it well: the treasury that
      was empty is full, the frontier is quiet, and officials who miss their deadlines are
      punished.


      Zhang wants to measure every field in the empire, so that the great landowners who
      hide their land from the tax registers pay their share, and to collect all the taxes
      and labour services as one payment in silver: the 'single whip'.
    choices:
      - label: "Measure the fields"
        historical: true
        wealth_bp: 3000
        unrest_bp: 1000
        influence: {nobility: -2000}
        outcome: >-
          The survey finds millions of acres that were never taxed. The single whip spreads
          across the provinces. The landowners hate Zhang, and so, more quietly, do you: he
          treats you like a schoolboy, and lives like a prince.
      - label: "Leave the landowners alone"
        legitimacy_bp: -500
        influence: {nobility: 1500}
        outcome: >-
          The registers stay as they are, and the burden stays on those who cannot hide.
    history: >-
      Zhang Juzheng ordered a national land survey (1580-1582) and extended the single-whip
      tax reform.
    sources: ["Ming shi 213 (Zhang Juzheng)", "Huang, Taxation and Governmental Finance in Sixteenth-Century Ming China (1974)"]

  - id: ming_zhang_falls
    scenario: sengoku
    civ: ming
    year: 1582
    title: "The Teacher's Disgrace"
    place: "The Forbidden City"
    speaker: steward
    speaker_name: "Feng Bao"
    speaker_title: "Chief eunuch, Zhang's ally"
    benchmark_provinces: 5
    story: >-
      Zhang Juzheng is dead, and you are twenty. Officials whom Zhang punished are sending in
      memorials by the dozen: he lived in luxury, he was carried in a palanquin that needed
      thirty-two bearers, he did not go home to mourn his father, he treated the emperor as
      a pupil.


      You can protect his memory, or let them have him.
    choices:
      - label: "Let them have him"
        historical: true
        legitimacy_bp: -1000
        wealth_bp: 1500
        outcome: >-
          Zhang's titles are stripped and his family's property confiscated; his eldest son
          hangs himself. The lesson to every official is that reform is dangerous. Zhang's
          reforms are quietly abandoned.
      - label: "Honour your teacher"
        legitimacy_bp: 500
        influence: {nobility: -1000}
        outcome: >-
          Zhang is buried with honour, and his men stay in office. The reforms go on, without
          their author.
    history: >-
      After Zhang Juzheng's death (1582), Wanli had him posthumously disgraced and his
      family's property confiscated (1584).
    sources: ["Ming shi 213 (Zhang Juzheng)", "Huang, 1587, A Year of No Significance (1981)"]

  - id: ming_strike
    scenario: sengoku
    civ: ming
    year: 1589
    title: "The Emperor Stays in the Palace"
    place: "The Forbidden City"
    speaker: scholar
    speaker_name: "Shen Shixing"
    speaker_title: "Senior Grand Secretary"
    benchmark_provinces: 5
    story: >-
      You want to make your favourite consort's son, Zhu Changxun, your heir. The law and the
      whole civil service say it must be your eldest son, Zhu Changluo, the son of a palace
      maid. Every day the memorials come in, more and more of them, telling you your duty.


      Your grand secretary begs you to name the eldest son and be done with it. You are tired
      of being told what to do.
    choices:
      - label: "Stop seeing your ministers"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1500
        outcome: >-
          You stop holding audiences, stop answering memorials, stop filling posts. For thirty
          years whole ministries go without heads. In the end you name the eldest son, in
          1601, after fifteen years of argument. Historians will date the fall of the Ming from
          your reign.
      - label: "Name the eldest son, now"
        legitimacy_bp: 1500
        outcome: >-
          The bureaucracy is delighted. Your favourite consort is not, and neither are you.
    history: >-
      The 'contest over the root of the state' (guoben) lasted from 1586 to 1601; Wanli
      withdrew from court audiences and left many posts unfilled for decades.
    sources: ["Ming shi 20-21 (Shenzong)", "Huang, 1587, A Year of No Significance (1981)"]

  - id: ming_korea
    scenario: sengoku
    civ: ming
    year: 1592
    title: "Lips and Teeth"
    place: "The Forbidden City"
    speaker: joseon
    speaker_name: "Envoys of King Seonjo"
    speaker_title: "Of Joseon"
    needs_alive: [joseon]
    benchmark_provinces: 5
    story: >-
      Toyotomi Hideyoshi, the man who has unified Japan, has landed a huge army at Busan.
      Seoul has fallen in three weeks and Pyongyang soon after. The King of Joseon, your most
      loyal vassal, has fled to the Yalu and begs for help. Hideyoshi has written that he
      means to go on and conquer China.


      Your ministers say: if the lips are gone, the teeth will be cold.
    choices:
      - label: "Send an army to Korea"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -3000
        outcome: >-
          Li Rusong crosses the Yalu with forty thousand men and cannon, and in early 1593
          takes Pyongyang back by storm. The war drags on for six years and costs the treasury
          more than twenty million ounces of silver. When Hideyoshi dies in 1598, the Japanese
          go home.
        deeds: {martial_bp: 500}
      - label: "Guard the Yalu, and wait"
        legitimacy_bp: -2000
        outcome: >-
          Your army holds the river. Across it, Korea burns.
    history: >-
      Ming armies intervened in Korea from 1592; Li Rusong retook Pyongyang in February 1593.
      The Imjin War ended in 1598.
    diverged: >-
      Joseon is gone.
    sources: ["Ming shi 320 (Chaoxian)", "Swope, A Dragon's Head and a Serpent's Tail (2009)"]

  - id: ming_ricci
    scenario: sengoku
    civ: ming
    year: 1601
    title: "The Clocks That Ring Themselves"
    place: "The Forbidden City"
    speaker: scholar
    speaker_name: "Matteo Ricci"
    speaker_title: "A Jesuit from Italy"
    benchmark_provinces: 5
    story: >-
      A bearded man from the far west who dresses like a Confucian scholar and speaks good
      Mandarin has been allowed into the capital after eighteen years in China. He has
      brought gifts: a clavichord, paintings, and two clocks that strike the hours by
      themselves. When the clocks stop, only he knows how to wind them.


      He also has a map of the whole world, with China near the middle, and asks to be
      allowed to stay in Beijing.
    choices:
      - label: "Let him stay"
        historical: true
        knowledge_bp: 2500
        outcome: >-
          Ricci lives in Beijing until he dies, in 1610, and is the first westerner buried in
          China by imperial permission. With the scholar Xu Guangqi he translates Euclid into
          Chinese. You never see him: you watch his clocks.
      - label: "Keep the clocks, and send him south"
        knowledge_bp: 500
        outcome: >-
          The clocks stop a month later. Nobody in Beijing can start them.
    history: >-
      Matteo Ricci reached Beijing in 1601 and was allowed to stay; he and Xu Guangqi
      translated the first six books of Euclid (1607).
    sources: ["Ricci and Trigault, De Christiana expeditione apud Sinas (1615)", "Spence, The Memory Palace of Matteo Ricci (1984)"]

  - id: ming_sarhu
    scenario: sengoku
    civ: ming
    year: 1619
    title: "Four Armies at Sarhu"
    place: "The Forbidden City"
    speaker: general
    speaker_name: "Yang Hao"
    speaker_title: "Commander in Liaodong"
    benchmark_provinces: 4
    story: >-
      A Jurchen chieftain named Nurhaci, once your loyal frontier officer, has proclaimed a
      Later Jin state, listed 'seven grievances' against the Ming, and taken the town of
      Fushun. You have sent nearly a hundred thousand men to Liaodong, with Korean allies.


      Your commander Yang Hao plans to send them into the mountains in four columns, to meet
      at Nurhaci's capital. Some officers warn that the columns will be too far apart to help
      each other.
    choices:
      - label: "Send the four columns"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Nurhaci concentrates his whole army against one column after another, and in five
          days destroys three of them. Forty-five thousand men are lost. Within two years the
          Jurchens hold Shenyang and Liaoyang, and in twenty-five years their sons will be in
          Beijing.
        deeds: {give: [m_liaodong]}
      - label: "Hold the forts, and starve Nurhaci of trade"
        wealth_bp: -2000
        outcome: >-
          The armies stay behind the walls of Liaodong. Nurhaci raids, and waits.
    history: >-
      At Sarhu (April 1619) Nurhaci destroyed the Ming columns in turn; Liaodong was largely
      lost by 1621. The Wanli Emperor died in 1620.
    sources: ["Ming shi 259 (Yang Hao)", "Manwen laodang", "Swope, The Military Collapse of China's Ming Dynasty (2014)"]
