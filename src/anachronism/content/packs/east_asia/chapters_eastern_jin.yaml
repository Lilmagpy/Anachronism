schema_version: 1
# Chronicle mode (D-120, D-XXX): the Eastern Jin court at Jiankang, from Sun En's rising to
# the founding of the Song, 400-420. The Jin emperors of these years were puppets, so the
# player is not simply "the emperor". Emperor An (Sima Dezong, r. 396-418) was, the Jin shu
# says, so feeble in mind that he could not tell hot from cold, and was ruled by regents and
# warlords; in the first two chapters you are the court that acts in his name. When Huan
# Xuan pushes him aside (402-403) the ruler line passes to Liu Yu (363-422), the soldier who
# really held Jin power from his coup of 404 until he took the throne himself: from chapter
# three on you are Liu Yu, "restoring" the Jin on An's behalf (An was back in Jiankang in 405
# and died, strangled, at the end of 418) and then ending it (420). Liu Yu died in 422.
# Dates are the traditional lunar-calendar years; many events straddle two Western years
# and months are approximate. Tao Yuanming's resignation (end of 405) opens in 406 on the
# two-year turn grid, and his dates (365?-427) are traditional and approximate. Faxian
# (c. 337-c. 422) is dated by his own Record of Buddhist Kingdoms and Liu Yu's reign. Facts
# follow the Jin shu (esp. chs. 10, 99, 100, 128), Song shu (chs. 1-3, 93, 97), Zizhi
# tongjian 111-118, Faxian's Foguo ji, and Gao seng zhuan, with modern work by Lewis
# (China Between Empires), Tang Changru, Holcombe and Mather. benchmark_provinces counts the
# provinces of this map the real Jin held at that date.
chapters:
  - id: jin_sun_en
    scenario: three_kingdoms
    civ: eastern_jin
    year: 400
    title: "The Rebels of the Sea"
    place: "The palace at Jiankang"
    speaker: general
    speaker_name: "Liu Laozhi"
    speaker_title: "Commander of the Northern Garrison army"
    benchmark_provinces: 4
    story: >-
      You are the court of Emperor An. The Emperor himself is eighteen and, so the histories
      say, cannot dress himself or tell hot from cold; his father's cousin Sima Yuanxian and
      Yuanxian's son rule in his name. Your enemies are everywhere: the warlord Huan Xuan
      upriver at Jingzhou, the northern kingdoms across the Huai, and now a rebellion at home.


      Last winter a man named Sun En, a believer in the Daoist Way of the Celestial Masters,
      whose uncle the court had put to death, rose in the sea-coast prefectures of Kuaiji,
      killed the governor, Wang Ningzhi, and gathered tens of thousands of followers. The
      great families of the east are fleeing. Liu Laozhi, who commands the hard soldiers of
      the Northern Garrison, the refugee army of Jingkou, says send me.
    choices:
      - label: "Send the Northern Garrison against Sun En"
        historical: true
        legitimacy_bp: 500
        unrest_bp: -500
        outcome: >-
          Liu Laozhi's veterans, among them a young officer from Jingkou named Liu Yu, hunt the
          rebels through the east. Sun En takes to the islands off the coast, and comes back by
          sea in 401 to the very gates of Jiankang, where he is driven off again. In 402,
          beaten once more, he drowns himself, and the story is that his wives and followers
          threw themselves into the water after him, believing that they would become
          immortals of the water. His brother-in-law Lu Xun takes command of what is left. The
          Northern Garrison has saved the dynasty, and has learnt what it can do.
        deeds: {martial_bp: 500}
      - label: "Offer Sun En a rank and a pardon"
        legitimacy_bp: 300
        wealth_bp: 500
        outcome: >-
          Sun En accepts the title and keeps his army, and the eastern prefectures pay their
          taxes again. The great families of the east, who lost their sons and their servants
          to him, are not consoled, and the rank is a reward for murder.
      - label: "Let the great eastern families raise their own levies"
        legitimacy_bp: -300
        wealth_bp: -500
        outcome: >-
          The families of Kuaiji and Wu arm their tenants and their household guards and take
          back their own lands. The court is spared the cost of a campaign and pays instead in
          favours, and every great house now has an army that is its own.
        deeds: {men: 10000}
    history: >-
      Sun En's rising began in the winter of 399-400 in Kuaiji and spread across the eastern
      coast; the Northern Garrison under Liu Laozhi and Liu Yu defeated him, and he drowned
      himself in 402.
    sources: ["Jin shu 100 (Sun En)", "Song shu 1", "Zizhi tongjian 111-112", "Lewis, China Between Empires (2009)"]

  - id: jin_huan_xuan
    scenario: three_kingdoms
    civ: eastern_jin
    year: 402
    title: "The Fleet from Jingzhou"
    place: "The Yangzi, above Jiankang"
    speaker: steward
    speaker_name: "Sima Yuanxian"
    speaker_title: "Regent, in the Emperor's name"
    benchmark_provinces: 4
    story: >-
      You are still the court of Emperor An. Huan Xuan, governor of Jingzhou, son of the great
      general Huan Wen who once nearly took the throne himself, has sailed down the Yangzi
      with his fleet, saying that he comes to rid the Emperor of bad ministers. The bad
      ministers are the regent and his son. Huan Xuan's soldiers are the best on the river.


      Your army is led by Liu Laozhi, who has not forgotten that the regent never rewarded
      him enough. The regent is sure that he will fight. Others whisper that he will not.
    choices:
      - label: "Send Liu Laozhi's army to meet the fleet"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Liu Laozhi's army goes over to Huan Xuan without a battle. Huan Xuan enters Jiankang,
          has the regent put to death, and has himself named chancellor. In 403 he is
          Prince of Chu, and in the last month of that year he orders the Emperor to write out an
          abdication, takes the throne for himself, and carries the Emperor off up the river.
          Among the officers who go on serving the new Chu dynasty is Liu Yu.
        deeds: {ruler_falls: "is pushed aside by Huan Xuan in 403"}
      - label: "Make Huan Xuan chancellor and ask for peace"
        legitimacy_bp: -2500
        unrest_bp: 1000
        outcome: >-
          He does not stop. In 403 he is Prince of Chu, and in the last month of that year he
          takes the throne himself.
        deeds: {ruler_falls: "is pushed aside by Huan Xuan in 403"}
      - label: "Hold the river forts with levies from the great families"
        legitimacy_bp: -2000
        unrest_bp: 500
        outcome: >-
          The families send their tenants to the forts below the capital. The levies are brave
          enough, but they have never faced Jingzhou's men, and the Northern Garrison watches
          from the walls. The forts fall in a week, and so does the regent. In 403 Huan Xuan
          takes the throne.
        deeds: {men: 8000, ruler_falls: "is pushed aside by Huan Xuan in 403"}
    history: >-
      Huan Xuan marched on Jiankang in 402, took power, and proclaimed the dynasty of Chu in the
      last month of 403, setting aside Emperor An.
    sources: ["Jin shu 99 (Huan Xuan)", "Zizhi tongjian 112-113"]

  - id: jin_restoration
    scenario: three_kingdoms
    civ: eastern_jin
    year: 404
    title: "A Handful of Men at Jingkou"
    place: "Jingkou, on the Yangzi"
    speaker: general
    speaker_name: "He Wuji"
    speaker_title: "Your companion in the plot"
    benchmark_provinces: 4
    story: >-
      You are Liu Yu, forty-one years old. You were born in a poor house at Jingkou; your
      mother died in your birth, the Song shu says, and it is said you sold straw sandals and
      cut firewood, and gambled away what you earned. You are a soldier of the Northern
      Garrison and Huan Xuan's own officer, and you have watched him lose the empire's
      confidence in a few months: he does everything fast, and nothing carefully.


      You and a few friends, the chief of them Liu Yi and He Wuji, have been plotting to kill
      his governors of Jingkou and Guangling on the same morning and march on Jiankang. Huan
      Xuan's armies are many. You have very few.
    choices:
      - label: "Strike at Jingkou in the new year"
        historical: true
        legitimacy_bp: 3000
        unrest_bp: -1000
        outcome: >-
          Your friends kill the Chu governors at dawn, and your small force beats off the men
          sent against it. Huan Xuan's army in the capital loses its nerve. You enter
          Jiankang, and Huan Xuan flees upriver with the captive Emperor. He is killed on the
          river, in the Shu country, in the fifth month. Next spring the Emperor is brought
          home, and the Jin is restored: Emperor An on the throne, and you the man who made it
          possible.
        deeds: {martial_bp: 1000}
      - label: "Wait until Huan Xuan's army has gone west"
        legitimacy_bp: -1000
        outcome: >-
          Huan Xuan's grip on the capital hardens, and one of your friends talks.
      - label: "Win over Huan Xuan's officers by letter, then strike together"
        legitimacy_bp: 3000
        unrest_bp: -500
        outcome: >-
          Several of the commanders in Jingkou and Guangling promise to come over on the day,
          and a few of them keep the promise. Your friends' plot takes three months longer to
          ripen, and one man in the circle talks. The rising still comes, with more men behind
          it, and with Huan Xuan better warned.
        deeds: {men: 5000}
    history: >-
      In the second or third month of 404 Liu Yu and a few friends rose at Jingkou and
      Jiankang against Huan Xuan, who was killed in the fifth month on the upper Yangzi; Emperor
      An was restored in 405.
    sources: ["Song shu 1 (Wudi)", "Jin shu 99", "Zizhi tongjian 113"]

  - id: jin_tao_yuanming
    scenario: three_kingdoms
    civ: eastern_jin
    year: 406
    title: "Five Pecks of Rice"
    place: "Pengze, a county on the Yangzi in Jiangzhou"
    speaker: scholar
    speaker_name: "Tao Yuanming"
    speaker_title: "A magistrate in Pengze"
    benchmark_provinces: 4
    story: >-
      You are Liu Yu, in charge of the restored Jin. You are crowded with men who want office
      and men who want revenge, and you take both sorts as they come. At Pengze a magistrate
      named Tao Yuanming, great-grandson of the general Tao Kan, has been in post
      for eighty-odd days, on a salary of rice, the stories say, that could be counted by
      the peck.


      The circuit inspector is coming to see him. The county clerk has told him to put on
      his full formal robes and make a deep bow to the inspector. The tradition says that he
      answered that he would not bend his waist for five pecks of rice to a country nobody. He has
      sent in his resignation.
    choices:
      - label: "Accept his resignation and let him go home"
        historical: true
        knowledge_bp: 500
        legitimacy_bp: 200
        outcome: >-
          Tao Yuanming goes back to his farm near Mount Lu and writes a poem about it, the
          'Return Home', that every educated Chinese will know by heart. The court asks him
          to come back more than once, and he refuses. He grows chrysanthemums, drinks
          wine, and writes the plainest and most beautiful poetry of the age. The state loses
          one magistrate, and China gains one of its poets.
      - label: "Refuse the resignation and offer a better post"
        legitimacy_bp: 300
        outcome: >-
          He thanks you politely and goes anyway. An honest official is hard to keep in an
          age of warlords.
      - label: "Reprove the inspector and ask him to stay"
        legitimacy_bp: 600
        unrest_bp: 300
        outcome: >-
          The inspector is rebuked for his manners, and sends his complaints to his friends in
          the capital. Tao thanks you for your kindness, says that it was never the inspector
          he wished to be rid of, and leaves all the same.
    history: >-
      Tao Yuanming resigned as magistrate of Pengze at the end of 405 after only about eighty
      days, and wrote 'Gui qu lai xi ci' on going home; he refused later appointments.
    sources: ["Song shu 93 (Tao Qian)", "Tao Yuanming, Gui qu lai xi ci", "Davis, T'ao Yuan-ming (1983)"]

  - id: jin_southern_yan
    scenario: three_kingdoms
    civ: eastern_jin
    year: 410
    title: "The Walls of Guanggu"
    place: "Jiankang, the council chamber"
    speaker: general
    speaker_name: "Liu Muzhi"
    speaker_title: "Your chief of staff"
    needs_alive: [southern_yan]
    benchmark_provinces: 5
    story: >-
      You are Liu Yu. Murong Chao, king of Southern Yan, the small Xianbei state in the
      Shandong peninsula, has raided across the Huai and carried off people. You want to attack him; you want
      the northern provinces back, and a victory that would make you safe at home.


      Your council is against it. The rebel Lu Xun, Sun En's brother-in-law, still has a
      fleet in the south, and if you go north he will come up the river. Your advisers say
      that Murong Chao will hold the mountain passes and starve you out. They also
      say he won't.
    choices:
      - label: "Take the army north"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Murong Chao leaves the passes undefended, as you had said he would, and you
          besiege his capital of Guanggu for months. The city falls early in 410. Murong Chao is
          sent to Jiankang and put to death, and the later histories say that thousands of the
          Yan nobles were killed and their families enslaved. At the very moment of victory, Lu
          Xun sails up the Yangzi, as your council feared; you rush south, beat him outside
          Jiankang, and he flees to the far south, where he dies in 411.
        deeds: {take: [k4_qingzhou], martial_bp: 500}
      - label: "Put down Lu Xun first"
        legitimacy_bp: 1500
        outcome: >-
          Lu Xun is beaten decisively and the rebel fleet is burned, and the south is quiet.
          Murong Chao grows bolder meanwhile, and your northern borderlands are raided for
          years.
        deeds: {martial_bp: 500}
      - label: "Send a fleet round the coast to land in Shandong"
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Your ships land raiding parties on the Shandong coast, burn some Yan granaries and
          carry off their grain. The Yan kingdom is hurt, and it is not conquered. Lu Xun, who
          has watched the fleet leave, sails on his own.
        deeds: {ships: 30}
    history: >-
      Liu Yu took Guanggu and destroyed Southern Yan in 410; the rebel Lu Xun, Sun En's
      brother-in-law, attacked Jiankang while he was away and was driven off, dying in the far
      south in 411.
    diverged: >-
      Southern Yan is gone.
    sources: ["Jin shu 128 (Murong Chao)", "Song shu 1", "Zizhi tongjian 115"]

  - id: jin_faxian
    scenario: three_kingdoms
    civ: eastern_jin
    year: 412
    title: "The Monk Who Walked to India"
    place: "Mount Lao, on the Shandong coast, then Jiankang"
    speaker: scholar
    speaker_name: "Faxian"
    speaker_title: "A monk, newly landed"
    benchmark_provinces: 5
    story: >-
      You are Liu Yu. A very old monk has come ashore at Mount Lao, on the coast of your new
      territory of Qingzhou, from a merchant ship blown off course. His name is Faxian. He
      left Chang'an thirteen years ago with a few companions to find the rules of monastic
      discipline for Chinese monks, which were not yet complete in any Chinese translation. He
      walked across the Taklamakan and the Pamirs, spent years in the valley of the Ganges
      and in Pataliputra, copying texts, and crossed the sea by way of Sri Lanka and the islands
      of the southern seas.


      Most of his companions stayed behind or died. He carries scrolls in Sanskrit, and he
      asks for nothing except a place to translate them.
    choices:
      - label: "Bring him to Jiankang to translate his scrolls"
        historical: true
        knowledge_bp: 2000
        influence: {clergy: 1000}
        outcome: >-
          Faxian goes to the Daochang monastery at Jiankang, and with the Indian monk
          Buddhabhadra begins translating the Vinaya and a Nirvana sutra; he writes down what
          he saw, a plain, matter-of-fact record of the Buddhist kingdoms that will one day
          help archaeologists find the sites of Lumbini and Kapilavastu. By the usual
          reckoning he dies, aged eighty or more, about ten years later.
      - label: "Hand him over to the governor of Qingzhou"
        knowledge_bp: 200
        outcome: >-
          Faxian's scrolls sit on a shelf for years, and a good part of what he saw is never
          written down.
      - label: "Send him to the monks of Mount Lu"
        knowledge_bp: 1800
        wealth_bp: -300
        influence: {clergy: 1500}
        outcome: >-
          The great community of monks on Mount Lu, far from the court, takes him in. His scrolls
          are copied and read there and in the monasteries upriver, and the monks gain
          standing in the Yangzi country. Jiankang sees little of him, and what he saw is only
          partly written down.
    history: >-
      Faxian returned from India by sea in 412 and landed on the Shandong coast, then went to
      Jiankang where he translated Buddhist texts with Buddhabhadra and wrote his Record of
      Buddhist Kingdoms (c. 416).
    sources: ["Faxian, Foguo ji", "Gao seng zhuan 3 (Faxian)", "Legge, A Record of Buddhistic Kingdoms (1886)"]

  - id: jin_changan
    scenario: three_kingdoms
    civ: eastern_jin
    year: 416
    title: "The Crescent on the River Bank"
    place: "Pengcheng, at the head of the army"
    speaker: northern_wei
    speaker_name: "Envoys of Tuoba Si"
    speaker_title: "Emperor Mingyuan of Wei"
    needs_alive: [later_qin, northern_wei]
    benchmark_provinces: 7
    story: >-
      You are Liu Yu. In the last two years you have put down the warlords Liu Yi and Sima
      Xiuzhi who could have unseated you and the Jin, and your general Zhu Lingshi has
      retaken Sichuan from the rebel Qiao Zong. Now Yao Xing, king of Later Qin, is dead, and his sons are fighting
      each other for his throne in Chang'an, the old capital of the Han and Western Jin.


      You mean to retake the old north. The army will go by water up the Yellow River, and
      the Wei, who hold its north bank, may not like it. The envoys of the Wei emperor have
      come to say what they intend.
    choices:
      - label: "Sail up the Yellow River, ready to fight Wei's horse"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          Luoyang falls in 416. As you sail up the river the Wei horse follow your ships along the
          north bank, and they attack a landing party on the bank. You answer with
          the crescent formation: a hundred armoured carts drawn up in a bow with the ends on the
          river, crossbowmen behind them and short spears to hold the horse. The Wei cavalry
          breaks on it. In the autumn of 417 your general Wang Zhen'e storms Chang'an, and the Qin
          king, Yao Hong, surrenders. You enter the city yourself: the Jin holds Chang'an for the first time since it fell
          in 316.
        deeds: {take: [k4_luoyang, k4_changan], martial_bp: 1500}
      - label: "Send only a small force to retake Luoyang"
        legitimacy_bp: 2500
        outcome: >-
          You retake Luoyang and the Luo valley, and the old capital of the Han rings with
          your name. You leave Chang'an to the Qin princes, who go on fighting one another
          until someone else comes.
        deeds: {take: [k4_luoyang], martial_bp: 500}
      - label: "Seek Wei's leave, then march up the river"
        legitimacy_bp: 1500
        outcome: >-
          The Wei emperor sends back a courteous reply that says neither yes nor no. You wait
          for it for a month, and the army goes up the river in the end with a Wei escort
          riding along the bank, watching, and not fighting.
        deeds: {take: [k4_luoyang], peace_with: [northern_wei]}
    history: >-
      In 416-417 Liu Yu led the Jin armies up the Yellow River against Later Qin, took Luoyang
      and, in the autumn of 417, Chang'an, and sent the captive Yao Hong to Jiankang for
      execution.
    diverged: >-
      Later Qin or Northern Wei is gone.
    sources: ["Song shu 1-2", "Jin shu 117-118 (Yao Xing, Yao Hong)", "Wei shu 3, 35", "Zizhi tongjian 117"]

  - id: jin_an
    scenario: three_kingdoms
    civ: eastern_jin
    year: 418
    title: "The Emperor in the East Hall"
    place: "Chang'an, then Jiankang"
    speaker: scholar
    speaker_name: "Wang Shaozhi"
    speaker_title: "A courtier at the palace"
    benchmark_provinces: 6
    story: >-
      You are Liu Yu. You have gone home from Chang'an after only a few months, because
      Liu Muzhi, who has run your government in the south for you for twelve years, has died,
      and because you have your eye on something that is not in the north. You left your
      twelve-year-old son behind with an army and some good advisers, who are now quarrelling.
      The Xia ruler, Helian Bobo, is riding down on Chang'an.


      You are Duke, then Prince, of Song, with the nine bestowals that every would-be
      founder takes. You are the real ruler of the empire. But Emperor An, now thirty-six,
      is on the throne, and his younger brother, Sima Dewen, is beside him. The tale is that a
      prophecy had said that after Emperor Xiaowu the Jin would have two more emperors and
      then end. An is the first of them.
    choices:
      - label: "Have Emperor An quietly removed"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Wang Shaozhi, who is already in the palace, strangles Emperor An with a sash in the East
          Hall, at the end of the year, and the court is told that he has died. His brother
          becomes Emperor Gong. In the same winter, Helian Bobo takes Chang'an; your son
          escapes and the north bank is lost again. You have the Luoyang plain, and the throne
          within reach.
        deeds: {give: [k4_changan]}
      - label: "Leave Emperor An where he is"
        legitimacy_bp: 500
        outcome: >-
          Emperor An sits on, as he has always done, doing nothing. Your officers wonder what
          you are waiting for.
        deeds: {give: [k4_changan]}
      - label: "Hurry back to Chang'an with the army"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          You turn north again, leaving the capital to the officials and your throne-hunting for
          later. Chang'an is held through the winter, at a heavy cost, and in the south the
          court, the great families and your own plotters are glad to see you go.
        deeds: {men: 10000}
    history: >-
      Emperor An was strangled at Liu Yu's order at the end of 418 and replaced by Emperor Gong;
      Helian Bobo's Xia took Chang'an, abandoned by the Jin army, soon after.
    sources: ["Jin shu 10 (Emperor An)", "Song shu 1-2", "Zizhi tongjian 118"]

  - id: jin_song
    scenario: three_kingdoms
    civ: eastern_jin
    year: 420
    title: "The Mandate Changes Hands"
    place: "Jiankang"
    speaker: scholar
    speaker_name: "Fu Liang"
    speaker_title: "Your secretary"
    benchmark_provinces: 6
    story: >-
      You are Liu Yu, fifty-seven. You have beaten the rebels, the warlords, the Southern
      Yan and the Qin, and you have been made King of Song. Everyone at court knows
      what must come next. Emperor Gong, Sima Dewen, who is thirty-five, has no power and has
      never pretended to have.


      Your secretary Fu Liang has drafted the abdication. The tale is that the Emperor
      copied it out in his own hand, and said only that he had long expected it, since the
      Jin's fortune was lost once already to Huan Xuan and you have won it back. The Jin house has held the throne, in the north and then in the south, since
      266.
    choices:
      - label: "Take the throne for yourself"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          In the sixth month of 420 you become Emperor Wu of Song. The Jin is over. Emperor
          Gong is made Prince of Lingling, and is smothered with a quilt the next year; the
          story goes that one of your men who was sent with poison drank it himself rather
          than give it to him. You rule for two years, and die in 422. The Wei, in the north,
          are waiting.
      - label: "Stay as chief minister of the Jin"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your officers, who have fought for you for twenty years, do not understand. A throne
          that is offered and refused is a throne for someone else.
      - label: "Win one more northern victory before the throne"
        legitimacy_bp: 1000
        unrest_bp: 500
        wealth_bp: -1000
        outcome: >-
          You put off the abdication and take the army north again. The victory is a small one
          and the treasury pays for it. Fu Liang writes to you that the court is losing patience.
        deeds: {men: 15000}
    history: >-
      In the sixth month of 420 Liu Yu received the abdication of Emperor Gong and founded the
      Liu Song dynasty; Gong was killed the next year and Liu Yu died in 422.
    sources: ["Song shu 2-3 (Wudi)", "Jin shu 10", "Zizhi tongjian 119"]
