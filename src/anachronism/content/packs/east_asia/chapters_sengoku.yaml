schema_version: 1
# Chronicle mode (D-120, D-130): Oda Nobunaga, from Okehazama to Honno-ji, 1560-1582.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Ota Gyuichi's Shincho koki (the chronicle of Nobunaga by his own archer),
# Luis Frois's letters and Historia de Japam, and modern histories (Lamers, Japonius
# Tyrannus; Berry, Hideyoshi; Conlan; Turnbull), with legends marked as such. Japan has no
# Tokugawa state on this map, so Matsudaira Motoyasu's Mikawa is counted as Oda land once he
# joins Nobunaga. benchmark_provinces counts the provinces of this map the real Oda held, or
# fought through allies, at that date.
chapters:
  - id: oda_okehazama
    scenario: sengoku
    civ: oda
    year: 1560
    title: "Okehazama"
    place: "Kiyosu castle, Owari"
    speaker: general
    speaker_name: "Shibata Katsuie"
    speaker_title: "Senior retainer of the Oda"
    benchmark_provinces: 1
    story: >-
      Imagawa Yoshimoto, lord of Suruga and Totomi and Mikawa, is marching on Kyoto with
      twenty-five thousand men, and Owari is in his way. Your border forts at Marune and
      Washizu are already burning. You have perhaps three thousand.


      Your elders want to shut the gates of Kiyosu and wait out a siege. Shibata Katsuie
      would rather die fighting. Scouts say Yoshimoto has halted in a narrow wooded gorge
      called Okehazama to view the heads his men have taken, and that his soldiers are
      drinking to the victory. The sky over the hills is turning black.


      In the night you have sung the old verse from the play Atsumori: "Man's life is fifty
      years; compared with the world below heaven, it is but a dream." Now your horse is
      saddled.
    choices:
      - label: "Ride for the gorge in the storm, and strike his camp"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -500
        influence: {nobility: 1500}
        outcome: >-
          A cloudburst hides your approach. When it lifts, your three thousand come down
          the slope into the Imagawa camp. Yoshimoto thinks it is a brawl among his own men
          and steps out of his tent to shout at them. Hattori Koheita wounds him; Mori
          Shinsuke takes his head. His army, ten times yours, breaks and runs for home. In
          Mikawa, a young hostage-lord of the Imagawa called Matsudaira Motoyasu takes back
          his family's castle at Okazaki - and watches you.
        deeds: {grudges: {imagawa: 6000}}
      - label: "Hold Kiyosu and let him wear himself out on the walls"
        legitimacy_bp: -1000
        food_bp: -2000
        outcome: >-
          Yoshimoto takes the border forts one by one and ravages the rice fields of Owari.
          Kiyosu holds, and at the end of the summer he moves on towards Kyoto, leaving a
          garrison behind. Your retainers say nothing, but they have begun to wonder.
        deeds: {war_with: [imagawa]}
      - label: "Offer Yoshimoto your submission and a hostage"
        legitimacy_bp: -2500
        influence: {nobility: -2000}
        outcome: >-
          Yoshimoto accepts graciously, as befits the man who expects to rule Japan. Owari
          becomes a road for his armies. The fool of Owari, men say, has proved them right.
        deeds: {peace_with: [imagawa]}
    history: >-
      On 12 June 1560 (the 19th day of the fifth month, Eiroku 3) Nobunaga attacked
      Yoshimoto's camp at Okehazama in a sudden storm and killed him. The battle made
      Nobunaga's name and freed Matsudaira Motoyasu - later Tokugawa Ieyasu - from the
      Imagawa.
    sources: ["Shincho koki, book 1", "Lamers, Japonius Tyrannus (2000)"]

  - id: oda_kiyosu
    scenario: sengoku
    civ: oda
    year: 1562
    until_year: 1564
    title: "The Kiyosu Alliance"
    place: "Kiyosu castle"
    speaker: steward
    speaker_name: "Ishikawa Kazumasa"
    speaker_title: "Envoy of Matsudaira Motoyasu"
    after_choice: {oda_okehazama: 0}
    needs_owner: {j_mikawa: imagawa}
    benchmark_provinces: 2
    story: >-
      The envoy from Okazaki is careful, and very polite. His lord, Matsudaira Motoyasu,
      grew up as a hostage - first of your father, then of the Imagawa. Since Okehazama
      he has fought Yoshimoto's weak son Ujizane and taken back most of Mikawa. He would
      like to stop fighting you.


      He offers this: Mikawa will guard your eastern flank against the Imagawa and the
      Takeda, and you will be free to turn north on Mino and west on Kyoto. His son will
      marry your daughter.


      He is nineteen. He is cautious. He has never yet broken his word.
    choices:
      - label: "Make the alliance; let Mikawa guard your back"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          You meet Motoyasu at Kiyosu and swear the alliance. It will hold for twenty years
          - the longest friendship of the age. Within a year he breaks with the Imagawa
          completely and takes a new name: Ieyasu. Mikawa's soldiers march under their own
          banners, but where you point.
        deeds: {take: [j_mikawa], grudges: {imagawa: 2000}}
      - label: "Demand that Mikawa submit as a vassal"
        legitimacy_bp: 300
        unrest_bp: 800
        outcome: >-
          Motoyasu's envoy goes home without a word. Mikawa makes its own peace with the
          Imagawa, and its musketeers watch your border instead of guarding it.
        deeds: {grudges: {imagawa: 1500}}
    history: >-
      In 1562 Nobunaga and Matsudaira Motoyasu (Tokugawa Ieyasu from 1566) made the Kiyosu
      alliance. It lasted until Nobunaga's death, freeing him to turn on Mino and Kyoto.
    diverged: >-
      Mikawa is not Imagawa land to break away from: there is no alliance at Kiyosu.
    sources: ["Shincho koki", "Sadler, The Maker of Modern Japan (1937)"]

  - id: oda_guns
    scenario: sengoku
    civ: oda
    year: 1563
    title: "The Smiths of Kunitomo"
    place: "Kunitomo village, Omi"
    speaker: scholar
    speaker_name: "Hashimoto Ippa"
    speaker_title: "Master gunner"
    benchmark_provinces: 2
    story: >-
      Twenty years ago, two Portuguese traders were blown ashore on Tanegashima island with
      matchlocks in their hands. The island's lord bought both for a fortune and set his
      swordsmith to copying them; the smith, it is said, gave his own daughter to a
      Portuguese sailor to learn how to close the breech with a screw.


      Now the smiths of Sakai and Kunitomo make guns faster than anyone in Europe. Your
      gunnery master Hashimoto Ippa says a matchlock costs less than a good horse, and
      a farmer can learn it in a month. A samurai needs a lifetime.


      Your father bought five hundred guns when you were fifteen. Your elders thought it
      was another of your follies.
    choices:
      - label: "Buy every gun Kunitomo and Sakai can make"
        historical: true
        wealth_bp: -2500
        influence: {guilds: 1500, nobility: -500}
        outcome: >-
          Agents go to Kunitomo with silver and contracts. Your foot soldiers - ashigaru,
          'light feet', farmers' sons - drill with matchlocks in ranks while the samurai
          watch. You buy saltpetre from the Portuguese, who are glad to sell it.
        deeds: {martial_bp: 2500}
      - label: "Spend the silver on horses and bowmen, as your father's fathers did"
        wealth_bp: -1500
        influence: {nobility: 1000}
        outcome: >-
          The old retainers approve. Your cavalry is splendid. Somewhere in Kai, the Takeda
          are doing the same.
        deeds: {martial_bp: 1000}
      - label: "✦ Smelt with coke, and cast gun barrels by the thousand"
        needs_adopted: [coke_smelting]
        wealth_bp: -1500
        materials_bp: 1500
        influence: {guilds: 2500}
        outcome: >-
          You build furnaces in Owari that burn coked coal and run day and night. Iron flows
          like water. Within two years your armouries hold more guns than all the other
          lords of Japan together - and iron plates for your ships, if you want them.
        deeds: {martial_bp: 5000}
    history: >-
      Matchlocks reached Japan on Tanegashima in 1543. By the 1560s Kunitomo, Sakai and
      Negoro were making them in thousands, and Nobunaga - who ordered 500 as a youth -
      armed his ashigaru with them on a scale no other lord matched.
    sources: ["Teppo-ki (1606)", "Lidin, Tanegashima (2002)"]

  - id: oda_inabayama
    scenario: sengoku
    civ: oda
    year: 1566
    until_year: 1570
    title: "The Castle of Inabayama"
    place: "Below Mount Kinka, Mino"
    speaker: general
    speaker_name: "Kinoshita Tokichiro"
    speaker_title: "Captain of foot"
    needs_alive: [saito]
    needs_owner: {j_mino: saito}
    benchmark_provinces: 2
    story: >-
      Mino was your father-in-law's land. Saito Dosan - an oil-seller, they say, who
      murdered his way to a province - left it to you in his will before his own son killed
      him. His grandson Tatsuoki now drinks in Inabayama castle on its crag above the river,
      while his best men drift away. Two years ago Takenaka Hanbei, one of his own
      retainers, took the castle with sixteen men to shame him, then gave it back.


      Your sandal-bearer turned captain, Kinoshita Tokichiro, a monkey-faced peasant's son
      whom the others laugh at, says he can build a fort at Sunomata, across the river from
      Mino, in a single night, and that he has been talking quietly to the Three of West
      Mino - the lords who guard Tatsuoki's flank.
    choices:
      - label: "Let the monkey build his fort, and buy the Three of West Mino"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 1500
        outcome: >-
          The Three of West Mino come over to you. Inabayama falls; Tatsuoki escapes by
          boat. You rename the town Gifu, after the hill where the founder of the Zhou
          dynasty began to unite China, and you take a new seal: Tenka fubu - 'the realm
          under arms'. Tokichiro's fort at Sunomata becomes a legend.
        deeds: {conquer: [saito]}
      - label: "Storm Inabayama with everything you have"
        legitimacy_bp: 800
        food_bp: -1500
        outcome: >-
          Your men claw their way up Mount Kinka under fire. They take the castle, at a
          price your widows will remember.
        deeds: {conquer: [saito], grudges: {asakura: 1500}}
      - label: "Leave Mino to its fool of a lord for now"
        outcome: >-
          Tatsuoki drinks on. Mino will keep.
    history: >-
      Nobunaga took Inabayama in 1567 after the Three of West Mino deserted Saito Tatsuoki,
      renamed it Gifu and began to use the seal 'Tenka fubu'. The story of Hideyoshi's
      one-night castle at Sunomata appears only in much later accounts.
    diverged: >-
      The Saito no longer hold Mino: Inabayama will not be yours to take.
    sources: ["Shincho koki, book 1", "Berry, Hideyoshi (1982)"]

  - id: oda_kyoto
    scenario: sengoku
    civ: oda
    year: 1568
    until_year: 1572
    title: "The Road to Kyoto"
    place: "Gifu castle"
    speaker: ashikaga
    speaker_name: "Ashikaga Yoshiaki"
    speaker_title: "Brother of the murdered shogun"
    needs_alive: [ashikaga]
    needs_owner: {j_mino: oda}
    benchmark_provinces: 4
    story: >-
      Three years ago the Miyoshi lords and their ally Matsunaga Hisahide killed the shogun
      Yoshiteru in his palace and set up a puppet of their own. Yoshiteru's brother
      Yoshiaki, a monk who left his temple to escape them, has wandered from lord to lord
      asking for an army. The Asakura gave him poems and no soldiers.


      Now he is at Gifu. Escort him to Kyoto, he says, and he will be shogun, and you will
      be his father, his right hand, anything you like. The road runs through Omi, where
      the Rokkaku will try to stop you, and the Miyoshi hold the city.


      Whoever holds Kyoto speaks for the Emperor and the shogun - and so, in a sense, for
      Japan.
    choices:
      - label: "March on Kyoto and make Yoshiaki shogun"
        historical: true
        legitimacy_bp: 2500
        wealth_bp: 1500
        influence: {nobility: 1000, guilds: 1000}
        outcome: >-
          You brush the Rokkaku aside in Omi and enter Kyoto with fifty thousand men. The
          Miyoshi flee to Settsu. Yoshiaki is made the fifteenth Ashikaga shogun and offers
          you any title you want; you ask instead for the right to govern the trading towns
          of Sakai, Otsu and Kusatsu, and to levy their tolls. Sakai's merchants pay twenty
          thousand kan in silver.
        deeds: {tributaries: [ashikaga], take: [j_omi, j_ise], war_with: [miyoshi], men: 20000}
      - label: "Take Kyoto for yourself, and leave the shogun's title empty"
        legitimacy_bp: -1000
        unrest_bp: 1500
        influence: {nobility: -1500, clergy: -1000}
        outcome: >-
          You enter Kyoto as its master. Yoshiaki writes to every lord in Japan that you
          are a usurper, and many of them believe him.
        deeds: {conquer: [ashikaga], take: [j_omi], war_with: [miyoshi], grudges: {asakura: 3000, takeda: 2000, mori: 2000}}
      - label: "✦ Charter a company of Sakai merchants, with shares"
        needs_adopted: [joint_stock_company]
        legitimacy_bp: 2000
        wealth_bp: 3500
        influence: {guilds: 3000}
        outcome: >-
          At Sakai you do something the merchants have never seen: you sell shares in a
          company to trade with Luzon, Siam and Macao, and promise its profits to whoever
          holds the paper. The richest port in Japan pours its silver into your venture
          and its loyalty with it. Yoshiaki becomes shogun on your silver.
        deeds: {tributaries: [ashikaga], take: [j_omi, j_ise], war_with: [miyoshi], men: 20000}
    history: >-
      In 1568 Nobunaga escorted Ashikaga Yoshiaki into Kyoto and had him made shogun. He
      declined high office, asking instead for control of Sakai, Otsu and Kusatsu, and took
      Ise from the Kitabatake the next year.
    diverged: >-
      There is no shogun to escort: the Ashikaga have fallen, and Kyoto has other masters.
    sources: ["Shincho koki, book 1", "Lamers, Japonius Tyrannus (2000)"]

  - id: oda_kanegasaki
    scenario: sengoku
    civ: oda
    year: 1570
    until_year: 1573
    title: "A Bag of Beans"
    place: "Kanegasaki castle, Echizen"
    speaker: general
    speaker_name: "Kinoshita Tokichiro"
    speaker_title: "Captain of foot"
    needs_alive: [asakura]
    needs_owner: {j_mino: oda}
    benchmark_provinces: 5
    story: >-
      Asakura Yoshikage would not come to Kyoto to pay his respects to the new shogun, so
      you have marched into Echizen to teach him manners. Kanegasaki castle fell
      yesterday.


      This morning a present came from your sister Oichi, who is married to Azai Nagamasa,
      lord of northern Omi and your ally: a bag of red beans, tied shut at both ends.


      Your army is in a long valley. Ahead of you are the Asakura. Behind you is Omi.
      Tokichiro is looking at the bag.
    choices:
      - label: "Understand the beans: run for Kyoto now"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Nagamasa has turned against you, and the bag is the trap closing at both ends.
          You ride for Kyoto through the mountains with a handful of guards. Tokichiro
          holds the rear at Kanegasaki and gets most of his men home. Two months later,
          with Ieyasu at your side, you meet the Azai and the Asakura on the Ane river
          and beat them, though not badly enough. The war with the Asakura has begun.
        deeds: {war_with: [asakura], grudges: {asakura: 2000}}
      - label: "Press on into Echizen: beans are only beans"
        legitimacy_bp: -2000
        unrest_bp: 1500
        food_bp: -2500
        outcome: >-
          The Azai come down behind you and close the valley. You fight your way out at
          last, but you leave half your army in Echizen.
        deeds: {war_with: [asakura], give: [j_omi], grudges: {asakura: 3000}}
    history: >-
      In May 1570 Azai Nagamasa betrayed Nobunaga during his attack on the Asakura. The
      bag of beans is a later legend, but the 'Kanegasaki retreat', with Hideyoshi in the
      rear, was real; in July Nobunaga and Ieyasu won the battle of Anegawa.
    diverged: >-
      There is no march on Echizen: the Asakura, or Mino, are not where history put them.
    sources: ["Shincho koki, book 3", "Asakura shimatsuki"]

  - id: oda_hiei
    scenario: sengoku
    civ: oda
    year: 1571
    until_year: 1574
    title: "Mount Hiei"
    place: "Below Enryaku-ji, above Lake Biwa"
    speaker: general
    speaker_name: "Akechi Mitsuhide"
    speaker_title: "Lord of Sakamoto"
    needs_war_with: [asakura]
    benchmark_provinces: 5
    story: >-
      Enryaku-ji has stood on Mount Hiei for eight hundred years: three thousand halls and
      lodges, the mother temple of half the Buddhism of Japan. Its warrior monks have burned
      Kyoto before. Last winter they sheltered the Asakura and Azai armies on their slopes,
      and laughed when you told them to stay out of the war.


      Akechi Mitsuhide, whose lands lie at the foot of the mountain, has been ordered to
      prepare the attack. He is a learned man, a poet. He has written to his friends that
      he will do as he is told.
    choices:
      - label: "Burn the mountain, and kill everyone on it"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 2000
        influence: {clergy: -5000}
        outcome: >-
          Your army climbs the mountain from every side and sets fire to everything on it.
          Monks, women and children are cut down as they run. The chroniclers say three or
          four thousand died. Frois writes that the most famous university of Japan is ash.
          No temple in the land will defy you again - but none will forgive you either.
        deeds: {grudges: {takeda: 2000, ashikaga: 2000}}
      - label: "Surround the mountain and starve it into neutrality"
        food_bp: -1500
        influence: {clergy: -1000}
        outcome: >-
          Your lines close round Hiei for a season. The monks send down an embassy at last
          and swear on their sutras to keep out of the war. Whether they will keep the oath
          is another matter.
      - label: "✦ Print broadsheets, and turn Kyoto against the warrior monks"
        needs_adopted: [newspapers]
        legitimacy_bp: 1500
        influence: {clergy: -1500, guilds: 1000}
        outcome: >-
          Every week a printed sheet is pasted up at the gates of Kyoto: the monks' loans
          at ruinous interest, their mistresses, their armouries. The city that once feared
          Hiei begins to jeer at it. When you ride up with a few hundred men, the abbots
          hand over their weapons without a fight.
    history: >-
      On 29 September 1571 Nobunaga's army burned the Enryaku-ji complex on Mount Hiei and
      massacred its inhabitants. Mitsuhide was given Sakamoto, at its foot, as his reward.
    diverged: >-
      The war with the Asakura is over, and Mount Hiei is spared.
    sources: ["Shincho koki, book 4", "Frois, letter of 1571", "McMullin, Buddhism and the State (1984)"]

  - id: oda_mikatagahara
    scenario: sengoku
    civ: oda
    year: 1572
    until_year: 1574
    title: "The Tiger of Kai"
    place: "Gifu castle"
    speaker: takeda
    speaker_name: "Takeda Shingen"
    speaker_title: "Lord of Kai and Shinano"
    needs_alive: [takeda]
    benchmark_provinces: 5
    story: >-
      A letter from Shingen, written with a brush that does not hurry: the shogun has asked
      him to come to Kyoto and free it from you. He is coming. He apologises for the
      inconvenience.


      Thirty thousand men of Kai are already in Totomi, burning Ieyasu's castles. Ieyasu
      begs you for soldiers. Shingen is the best general in Japan; Uesugi Kenshin, who has
      fought him five times at Kawanakajima, has never beaten him.


      Shingen is fifty-one. Your spies say he coughs.
    choices:
      - label: "Send Ieyasu three thousand men, and keep the rest at home"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          On a frozen evening at Mikatagahara, Ieyasu marches out to fight against all
          advice and is crushed. He gets back to Hamamatsu with five men, and has his
          portrait painted as he looked that night, so as never to be rash again. Shingen
          does not follow up. In spring he turns for home - and on the road, in the fourth
          month, he dies. His son Katsuyori keeps it secret for three years.
        deeds: {grudges: {takeda: 2000}}
      - label: "Throw everything you have against him in Totomi"
        food_bp: -2000
        unrest_bp: 1000
        outcome: >-
          You meet Shingen with every man you can raise. He refuses battle, picks off your
          columns for a month, and then goes home ill. Nobody can say who won.
        deeds: {war_with: [takeda]}
      - label: "Write back, offering Shingen your daughter for his son"
        legitimacy_bp: -1000
        outcome: >-
          Shingen reads your letter, smiles, and goes on marching - but more slowly. A
          month later he turns home ill. Kai remains at peace with you, for now.
    history: >-
      Takeda Shingen invaded Tokugawa lands in late 1572 at the shogun's call and routed
      Ieyasu at Mikatagahara in January 1573. He died of illness in May 1573, probably
      of tuberculosis or stomach cancer, and the Takeda march on Kyoto ended.
    diverged: >-
      The Takeda are gone, and no tiger comes out of Kai.
    sources: ["Koyo gunkan", "Shincho koki, book 5"]

  - id: oda_last_shogun
    scenario: sengoku
    civ: oda
    year: 1573
    until_year: 1576
    title: "The Last Shogun"
    place: "Nijo palace, Kyoto"
    speaker: steward
    speaker_name: "Akechi Mitsuhide"
    speaker_title: "Lord of Sakamoto"
    needs_alive: [ashikaga]
    benchmark_provinces: 6
    story: >-
      The shogun you made has been writing letters all year: to Shingen, to the Asakura,
      to the Mori, to the Ikko monks of Osaka - to anyone who might rid him of you. Now, with
      Shingen's army in the east, he has fortified his palace at Nijo and declared against
      you openly.


      Shingen has gone home, and Yoshiaki has not heard yet. He has a few hundred men, and
      the shogunate of the Ashikaga has lasted two hundred and thirty-five years.
    choices:
      - label: "Burn upper Kyoto, take him, and send him into exile"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          You burn the upper city to frighten him and besiege him at Makishima. He
          surrenders, and you send him away alive - you do not need a murdered shogun's
          ghost. The Ashikaga shogunate, which began in 1338, is over. You choose a new era
          name for the Emperor: Tensho, 'heaven rightly ordered'. The Miyoshi, with no
          shogun left to fight for, sue for peace; so does Hojo Ujimasa, far away in the east,
          who sees nothing to gain from a war with the man who holds Kyoto.
        deeds: {conquer: [ashikaga], peace_with: [miyoshi, hojo]}
      - label: "Forgive him, and keep him as a figurehead"
        legitimacy_bp: 500
        outcome: >-
          Yoshiaki weeps, apologises and goes on writing letters.
    history: >-
      In 1573 Nobunaga drove Yoshiaki out of Kyoto, ending the Ashikaga shogunate. Yoshiaki
      lived on in exile under the Mori's protection and kept the title until 1588.
    diverged: >-
      There is no shogun left in Kyoto to depose.
    sources: ["Shincho koki, book 6"]

  - id: oda_asakura
    scenario: sengoku
    civ: oda
    year: 1573
    until_year: 1578
    title: "Ichijodani"
    place: "The Echizen road"
    speaker: general
    speaker_name: "Shibata Katsuie"
    speaker_title: "Senior retainer of the Oda"
    needs_alive: [asakura]
    needs_war_with: [asakura]
    needs_stronger_than: {asakura: 15000}
    benchmark_provinces: 6
    story: >-
      With Shingen dead, the Asakura are alone. Yoshikage has come south to save the Azai
      at Odani and lost his nerve in a storm; his army is retreating towards Ichijodani, his
      capital in its narrow valley, where he has gardens and tea houses and a court of
      poets from Kyoto.


      Shibata Katsuie wants to follow him all the way. Your sister Oichi and her three
      little daughters are inside Odani castle with the Azai.
    choices:
      - label: "Pursue to Ichijodani, then finish the Azai"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You catch the Asakura on the pass and destroy them. Ichijodani burns for three
          days. Yoshikage, betrayed by his own cousin, kills himself. Then you turn on
          Odani. Nagamasa sends Oichi and the girls out before he dies; their skulls, his
          and his father's and Yoshikage's, are lacquered in gold and set before your guests
          at the New Year feast.
        deeds: {conquer: [asakura]}
      - label: "Take Echizen, but offer the Asakura a pardon"
        legitimacy_bp: 800
        influence: {nobility: 800}
        outcome: >-
          Yoshikage accepts and becomes a vassal on a small fief in the mountains. The poets
          go back to Kyoto.
        deeds: {conquer: [asakura]}
    history: >-
      In September 1573 Nobunaga destroyed the Asakura at Ichijodani and the Azai at
      Odani. The excavated ruins of Ichijodani are one of the finest Sengoku sites in Japan.
    diverged: >-
      The Asakura war has ended another way.
    sources: ["Shincho koki, book 6", "Ichijodani Asakura Family Site Museum"]

  - id: oda_nagashino
    scenario: sengoku
    civ: oda
    year: 1575
    until_year: 1578
    title: "Nagashino"
    place: "Shitaragahara, Mikawa"
    speaker: general
    speaker_name: "Hashimoto Ippa"
    speaker_title: "Master gunner"
    needs_alive: [takeda]
    benchmark_provinces: 7
    story: >-
      Takeda Katsuyori, Shingen's son, has besieged Nagashino castle with fifteen thousand
      men, and the five hundred inside are down to their last rice. One of them, Torii
      Suneemon, swam out through the river nets to beg for help; he was caught on the way
      back and crucified before the walls, and shouted to his friends that help was
      coming.


      You and Ieyasu have come with thirty-eight thousand. The Takeda horsemen are the most
      feared in Japan. Your master gunner says: build a fence of logs along the little
      stream at Shitaragahara, put three thousand guns behind it, and let them come.
    choices:
      - label: "Build the fence, and let them come"
        historical: true
        legitimacy_bp: 2500
        influence: {nobility: 500}
        outcome: >-
          At dawn the Takeda charge across the stream, wave after wave, into the fire. By
          early afternoon it is over. Ten thousand of Katsuyori's men are dead, and with
          them most of Shingen's famous generals. The age of the mounted warrior in Japan is
          over.
        deeds: {war_with: [takeda], grudges: {takeda: 3000}}
      - label: "Relieve the castle by a night march, and avoid a battle"
        legitimacy_bp: 800
        outcome: >-
          Katsuyori lifts the siege rather than be caught between you. Nagashino is saved;
          the Takeda army is not destroyed.
        deeds: {war_with: [takeda]}
      - label: "✦ Watch the Takeda through spyglasses, and spring a trap"
        needs_adopted: [telescope]
        legitimacy_bp: 3000
        outcome: >-
          From the hills your officers watch every Takeda banner through their brass
          glasses. You know where Katsuyori is before he moves. When he charges, guns open
          on him from three sides at once. He is taken alive.
        deeds: {war_with: [takeda], take: [j_shinano], grudges: {takeda: 3000}}
    history: >-
      On 28 June 1575 Oda and Tokugawa troops behind palisades shattered Takeda Katsuyori's
      army at Nagashino. The famous 'three-rank volley' is probably a later embellishment,
      but the guns were decisive.
    diverged: >-
      The Takeda are gone or at peace with you; there is no battle at Nagashino.
    sources: ["Shincho koki, book 8", "Turnbull, Nagashino 1575 (2000)"]

  - id: oda_azuchi
    scenario: sengoku
    civ: oda
    year: 1576
    title: "Azuchi"
    place: "Azuchi hill, Lake Biwa"
    speaker: steward
    speaker_name: "Niwa Nagahide"
    speaker_title: "Master of works"
    benchmark_provinces: 7
    story: >-
      You want a castle on Lake Biwa, on the road between Gifu and Kyoto, and you want it
      to be like nothing Japan has seen. Niwa Nagahide has the plans: a stone base forty
      metres high, and on it a tower of seven storeys, the top two lacquered red and gold
      and painted inside by Kano Eitoku with sages and dragons. At the top: the Buddha's
      disciples, Confucius and his followers.


      It will cost more than anything you have built. It will tell every lord on the road
      to Kyoto who rules Japan.
    choices:
      - label: "Build Azuchi, the castle of heaven's lord"
        historical: true
        materials_bp: -3000
        wealth_bp: -2000
        legitimacy_bp: 3000
        influence: {nobility: 1500, guilds: 1000}
        outcome: >-
          Tens of thousands of men drag stones up the hill; one stone, men say, needs ten
          thousand haulers. Three years later Frois climbs the tower and writes that it
          rivals anything in Europe. You open it to the public, for a fee.
      - label: "Build something smaller and spend the rest on soldiers"
        materials_bp: -1000
        legitimacy_bp: 800
        outcome: >-
          A solid, grey, practical castle rises over the lake. Nobody writes about it.
        deeds: {men: 8000}
      - label: "✦ Build an academy at Azuchi, and test every idea"
        needs_adopted: [scientific_method]
        knowledge_bp: 4000
        legitimacy_bp: 2000
        influence: {clergy: -1000, guilds: 1500}
        outcome: >-
          Below the tower you found a school where Jesuit astronomers, Sakai gun founders and
          Buddhist physicians must prove what they claim, before witnesses, by experiment.
          Visitors come from Kyushu and Korea to watch. The Jesuits are not sure they
          approve.
    history: >-
      Azuchi castle, begun in 1576 and finished in 1579, was the first great tenshu castle
      and the model for all that followed. It burned in 1582, days after Nobunaga's death.
    sources: ["Shincho koki, book 9", "Frois, Historia de Japam", "Wheelwright, 'A Visualization of Eitoku's Lost Paintings at Azuchi Castle' (1981)"]

  - id: oda_kizugawa
    scenario: sengoku
    civ: oda
    year: 1578
    until_year: 1581
    title: "The Iron Ships"
    place: "The mouth of the Kizu river, Osaka bay"
    speaker: general
    speaker_name: "Kuki Yoshitaka"
    speaker_title: "Admiral of Shima"
    needs_alive: [miyoshi]
    benchmark_provinces: 8
    story: >-
      For eight years the fortress-temple of Ishiyama Hongan-ji at Osaka has defied you.
      Its Ikko monks and their farmer armies chant that the Buddha Amida will save
      whoever calls his name, and fight like men who believe it. They are fed by sea:
      two years ago the Mori fleet came into the bay, burned your ships with fire-pots,
      and resupplied the temple under your nose.


      Your admiral Kuki Yoshitaka has an answer. Six great ships, the largest ever built in
      Japan, their sides plated with iron so fire-pots slide off them, each carrying
      cannon.
    choices:
      - label: "Build the six iron ships"
        historical: true
        materials_bp: -2500
        wealth_bp: -1500
        legitimacy_bp: 1500
        outcome: >-
          The Mori fleet - six hundred boats - comes into the bay again. Its fire-pots
          bounce off Kuki's iron sides; his cannon sink the Mori flagships. The bay is
          closed. Two years later the starving temple surrenders, and burns.
        deeds: {ships: 40, war_with: [miyoshi, mori], take: [j_settsu]}
      - label: "Block the bay with a boom and sunken ships"
        materials_bp: -1000
        outcome: >-
          The boom holds for a season and then breaks in a storm. The siege of Osaka goes
          on.
        deeds: {war_with: [miyoshi]}
      - label: "✦ Build steamships the wind cannot stop"
        needs_adopted: [steamship]
        materials_bp: -3000
        legitimacy_bp: 3000
        outcome: >-
          Smoke pours from your ships' funnels as they steam into the bay against wind and
          tide. The Mori captains have never seen a ship move without oars or sail; most of
          them turn and run. You follow them all the way to Aki.
        deeds: {ships: 80, war_with: [miyoshi, mori], take: [j_settsu, j_harima]}
    history: >-
      In 1576 the Mori navy beat Oda's fleet at Kizugawaguchi and supplied Ishiyama
      Hongan-ji; in 1578 Kuki Yoshitaka's six large 'iron ships' (how much iron they carried
      is still argued) defeated it. The temple surrendered in 1580.
    diverged: >-
      Osaka bay is quiet: the war with the temple and its friends is over.
    sources: ["Shincho koki, book 11", "Tamon'in nikki (diary of a Nara monk, 1578)"]

  - id: oda_tenmokuzan
    scenario: sengoku
    civ: oda
    year: 1581
    until_year: 1584
    title: "The End of the Takeda"
    place: "The passes into Kai"
    speaker: general
    speaker_name: "Oda Nobutada"
    speaker_title: "Your heir"
    needs_alive: [takeda]
    needs_stronger_than: {takeda: 15000}
    benchmark_provinces: 10
    story: >-
      Since Nagashino the Takeda have been dying slowly. Katsuyori has built a new
      capital, and his own vassals are leaving him; this winter Kiso Yoshimasa, his
      brother-in-law, went over to you. In the east, Mount Asama has erupted, which the
      people of Kai think is an omen.


      Your son Nobutada, twenty-five and eager, asks to lead the army into Kai. Ieyasu
      will come from the south, the Hojo from the east.
    choices:
      - label: "Send Nobutada into Kai"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The Takeda castles open their gates one after another. Katsuyori flees into the
          mountains with a few hundred followers and, cornered at Tenmokuzan, kills himself
          with his son. Nobutada brings his head to you. The house of Shingen is gone,
          and the Hojo, who marched with you, are your friends.
        deeds: {conquer: [takeda], ally_with: [hojo]}
      - label: "Offer Katsuyori a small fief, and his life"
        legitimacy_bp: 1000
        outcome: >-
          Katsuyori bows. The Takeda keep a valley in Kai and nothing else.
        deeds: {conquer: [takeda]}
      - label: "✦ Cross the winter passes with tinned rations"
        needs_adopted: [canning]
        legitimacy_bp: 2500
        food_bp: 1000
        outcome: >-
          Your army crosses the snowbound passes in midwinter, living on tinned rice and
          fish while the Takeda wait for spring. Katsuyori wakes to find you in his capital.
        deeds: {conquer: [takeda, hojo]}
    history: >-
      In March and April 1582 Oda and Tokugawa armies overran Takeda lands in a few weeks.
      Katsuyori killed himself at Tenmokuzan on 3 April.
    diverged: >-
      The Takeda are already gone, or too strong to fall like this.
    sources: ["Shincho koki, book 15", "Koyo gunkan"]

  - id: oda_honnoji
    scenario: sengoku
    civ: oda
    year: 1582
    until_year: 1586
    after: [oda_azuchi]
    title: "The Enemy Is at Honno-ji"
    place: "Honno-ji temple, Kyoto"
    speaker: general
    speaker_name: "Mori Ranmaru"
    speaker_title: "Your page"
    needs_owner: {j_kyoto: oda}
    benchmark_provinces: 12
    story: >-
      You are in Kyoto on your way west, where Hashiba Hideyoshi - the monkey,
      Tokichiro, a great lord now - is besieging the Mori castle of Takamatsu and has asked
      you to come and take the credit. You have a hundred guards with you. Last night you
      held a tea gathering and showed your guests thirty-eight of the finest tea bowls in
      Japan.


      Akechi Mitsuhide was told to lead thirteen thousand men west to reinforce
      Hideyoshi. You humiliated him at a banquet last month - some say you struck him.
      Your page Ranmaru, eighteen, says that the Akechi army left Kameyama last night by
      the eastern road. The western road goes to Hideyoshi. The eastern road goes to
      Kyoto.
    choices:
      - label: "It is nothing: sleep, and leave for the west tomorrow"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2500
        outcome: >-
          At dawn there is shouting, and the sound of guns. Ranmaru looks out: the banners
          are Akechi bellflowers. 'Ze hi ni oyobazu,' you say - it cannot be helped. You
          fight with a bow until the string breaks, then a spear, then go inside, set fire
          to the temple and cut open your belly. Your body is never found. Nobutada dies the
          same morning at Nijo. Mitsuhide holds Kyoto.
        deeds: {ruler_falls: "is killed at Honno-ji by Akechi Mitsuhide", give: [j_kyoto]}
      - label: "Send Ranmaru to see where Mitsuhide really is"
        legitimacy_bp: -500
        outcome: >-
          Ranmaru comes back at a gallop: the bellflower banners are crossing the Katsura
          river. You slip out of Kyoto by the eastern gate with your guards. Mitsuhide
          finds the temple empty, and his own men begin to slip away in the dark.
        deeds: {men: 10000}
      - label: "✦ Spyglasses on the temple roof, watching the roads"
        needs_adopted: [telescope]
        legitimacy_bp: 1500
        outcome: >-
          Before dawn the watchman on the roof sees bellflower banners on the wrong road,
          miles off. By the time Mitsuhide reaches Kyoto your guards have been reinforced
          from Nijo and the city gates are shut against him. He kills himself at Sakamoto
          the next day.
        deeds: {men: 15000}
    history: >-
      Before dawn on 21 June 1582 (the 2nd day of the sixth month, Tensho 10) Akechi
      Mitsuhide attacked Nobunaga at Honno-ji. Nobunaga died in the burning temple, and
      his heir Nobutada at Nijo. Mitsuhide's motives remain one of Japan's great
      mysteries.
    diverged: >-
      Kyoto is not yours, and you never lodge at Honno-ji.
    sources: ["Shincho koki, book 15", "Frois, letter of 5 November 1582", "Honnoji no hen (Lamers)"]

  - id: oda_yamazaki
    scenario: sengoku
    civ: oda
    year: 1582
    until_year: 1586
    after_choice: {oda_honnoji: 0}
    title: "Thirteen Days"
    place: "Takamatsu castle, Bitchu"
    speaker: general
    speaker_name: "Hashiba Hideyoshi"
    speaker_title: "Lord of Nagahama"
    benchmark_provinces: 12
    story: >-
      The messenger was Mitsuhide's, carrying a letter to the Mori; Hideyoshi's guards
      caught him. Hideyoshi wept for a night. In the morning he made peace with the Mori
      before they could hear the news, and watched the castle's lord kill himself in a boat
      on the flooded lake as the terms required.


      Now he is two hundred kilometres from Kyoto with twenty thousand men. Mitsuhide has
      had days to win friends; none have come. Hideyoshi asks the house of Oda for its
      blessing - and for its armies.
    choices:
      - label: "Let Hideyoshi run east and avenge his lord"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -1000
        outcome: >-
          Hideyoshi's army covers the road to Kyoto in days, in rain. At Yamazaki, between
          the river and the mountain, it crushes Mitsuhide, thirteen days after Honno-ji.
          Mitsuhide is killed by peasants as he flees. Hideyoshi has avenged Nobunaga - and
          everyone now knows who will rule the realm Nobunaga made.
        deeds: {take: [j_kyoto], men: 20000}
      - label: "Wait for the Oda heirs to agree on a commander"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The Oda sons and generals argue at Kiyosu. Mitsuhide holds Kyoto and has the
          Emperor's ear for a whole season.
    history: >-
      Hideyoshi made peace with the Mori, marched his army back in about ten days and
      beat Mitsuhide at Yamazaki on 2 July 1582. Within eight years he had united Japan.
    sources: ["Shincho koki", "Berry, Hideyoshi (1982)"]
