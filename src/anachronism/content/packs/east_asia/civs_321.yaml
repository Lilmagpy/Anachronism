schema_version: 1
# States of India in 321 BC.
civs:
  - id: maurya
    name: The Mauryas
    adjective: Mauryan
    lineage: maurya
    colour: "#d35400"
    emblem: MAU
    portrait: indian
    description: >-
      A young adventurer and a ruthless brahmin strategist, with an army raised in the Punjab, set out to take the richest throne in India.
  - id: nanda
    name: The Nanda Empire
    adjective: Nanda
    lineage: nanda
    colour: "#6c3483"
    emblem: NAN
    portrait: indian
    description: >-
      Masters of the Ganges plain from Pataliputra, with a vast army and a vaster treasury - and a king his people despise.
  - id: satraps
    name: The Macedonian Satraps
    adjective: Macedonian
    lineage: satraps
    colour: "#566573"
    emblem: ΜΑΚ
    portrait: hellenistic
    description: >-
      Alexander's garrisons on the Indus, left behind when he turned for home, and now leaderless since his death in Babylon.
  - id: kalinga
    name: Kalinga
    adjective: Kalingan
    lineage: kalinga
    colour: "#117864"
    emblem: KAL
    portrait: indian
    description: >-
      A proud seafaring kingdom on the eastern coast, with war elephants and ships that trade as far as Lanka.
  - id: chola
    name: The Cholas
    adjective: Chola
    lineage: chola
    colour: "#b03a2e"
    emblem: CHO
    portrait: indian
    description: >-
      A Tamil kingdom of the Kaveri delta: rice, cotton and a tiger on its banner.
  - id: pandya
    name: The Pandyas
    adjective: Pandya
    lineage: pandya
    colour: "#1f618d"
    emblem: PAN
    portrait: indian
    description: >-
      The southernmost Tamil kingdom, rich in pearls from the gulf and in poets at Madurai.
  - id: chera
    name: The Cheras
    adjective: Chera
    lineage: chera
    colour: "#7d6608"
    emblem: CHE
    portrait: indian
    description: >-
      Lords of the western Tamil coast, where pepper grows and foreign ships come to buy it.
  - id: lanka
    name: Anuradhapura
    adjective: Sinhalese
    lineage: lanka
    colour: "#a04000"
    emblem: LAN
    portrait: indian
    description: >-
      A young kingdom on the island of Lanka, its great tanks just begun.
