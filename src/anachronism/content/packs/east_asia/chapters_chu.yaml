schema_version: 1
# Chronicle mode (D-120, D-150): Chu, the great southern kingdom, 334-223 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Shiji (the house of Chu; the lives of Qu Yuan, Zhang Yi, Lord Chunshen
# and Wang Jian), the Zhanguo ce and the Chu ci (the 'Songs of Chu', with Qu Yuan's Li
# Sao), with modern work by Cook & Major, Lewis and Hawkes. Qu Yuan's life is known mostly
# from Sima Qian and from legend. benchmark_provinces counts the provinces of this map the
# real Chu held at that date.
chapters:
  - id: chu_yue
    scenario: warring_states
    civ: chu
    year: -334
    until_year: -320
    title: "The Kingdom of Yue"
    place: "Ying, the capital of Chu"
    speaker: general
    speaker_name: "Your commander in the east"
    speaker_title: "General of the eastern army"
    needs_alive: [yue]
    benchmark_provinces: 6
    story: >-
      King Wujiang of Yue, whose ancestors destroyed Wu a century and a half ago, has been
      persuaded by envoys from Qi that his natural enemy is not Qi but Chu, and has marched
      against you.


      Your generals say the men of Yue - who tattoo their bodies and cut their hair short,
      who fight from boats among the lakes and rivers of the east - are brave but disorganised.
    choices:
      - label: "Crush Yue and take its heartland"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          King Wujiang is killed and his army scattered. Chu takes the old lands of Wu and Yue
          down to the sea. The princes of Yue scatter along the southern coast, each calling
          himself king.
        deeds: {war_with: [yue], conquer: [yue]}
      - label: "Defend your borders and let Yue tire"
        legitimacy_bp: 300
        outcome: >-
          Yue's army wears itself out on your forts and goes home.
        deeds: {grudges: {yue: 1500}}
    history: >-
      Chu defeated Yue and killed its king Wujiang, traditionally in 334 BC (some historians
      date it to the 300s), and took its homeland.
    diverged: >-
      Yue is gone already.
    sources: ["Shiji 41", "Shiji 40"]

  - id: chu_six_li
    scenario: warring_states
    civ: chu
    year: -313
    until_year: -308
    title: "Six Hundred Li"
    place: "Ying"
    speaker: qin
    speaker_name: "Zhang Yi"
    speaker_title: "Envoy of Qin"
    needs_alive: [qin, qi]
    benchmark_provinces: 7
    story: >-
      You are King Huai. Chu and Qi together are too strong for Qin, and Qin knows it. Qin's
      great diplomat Zhang Yi has come with an offer: break your alliance with Qi, and Qin will
      give you six hundred li of land in Shang and Yu.


      Your ministers are delighted. One of them, your kinsman Qu Yuan - poet, diplomat, a man
      of stiff and solitary virtue - says that Zhang Yi is lying.
    choices:
      - label: "Break with Qi, and claim the land"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          You insult the King of Qi so thoroughly that he joins Qin. Your envoy goes to collect
          the land. Zhang Yi, after pretending to fall off his carriage and staying home ill for
          three months, receives him at last: 'I promised six li, from my own estate.' In fury
          you attack Qin, and lose eighty thousand men at Danyang and the Hanzhong.
        deeds: {grudges: {qi: 3000, qin: 3000}, martial_bp: -1500}
      - label: "Listen to Qu Yuan: keep faith with Qi"
        legitimacy_bp: 800
        outcome: >-
          Zhang Yi goes home empty-handed. The alliance of Chu and Qi holds a little longer,
          and Qin looks for another way in.
        deeds: {ally_with: [qi]}
    history: >-
      In 313 BC Zhang Yi persuaded King Huai to break with Qi in return for 600 li of land,
      then offered six. Chu attacked Qin and was defeated at Danyang (312), losing Hanzhong.
    diverged: >-
      Qin or Qi is gone.
    sources: ["Shiji 40, 70, 84", "Zhanguo ce, Qin 2"]

  - id: chu_wuguan
    scenario: warring_states
    civ: chu
    year: -299
    until_year: -295
    title: "The Meeting at Wu Pass"
    place: "Ying"
    speaker: scholar
    speaker_name: "Qu Yuan"
    speaker_title: "Your kinsman, out of favour"
    needs_alive: [qin]
    benchmark_provinces: 7
    story: >-
      King Zhaoxiang of Qin has written to you most warmly. Your two kingdoms are related by
      marriage, he says; let us meet at the Wu pass, on the border, and swear a new alliance.


      Your son Zilan says it would be rude to refuse. Qu Yuan says that Qin is a country of
      tigers and wolves, and cannot be trusted.
    choices:
      - label: "Go to the Wu pass"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          As soon as you pass through the gate, it shuts behind you. You are taken to Xianyang
          and received not as a king but as a vassal, and ordered to give up Chu's western
          commanderies. You refuse. You escape once and are caught. Three years later you die
          in Qin, and your body is sent home. The people of Chu weep for you as for a father.
        deeds: {ruler_falls: "is seized at the Wu pass and held prisoner in Qin"}
      - label: "Stay home, and send an envoy"
        legitimacy_bp: 500
        outcome: >-
          Your envoy goes to the pass and is treated politely. King Zhaoxiang, disappointed,
          says nothing.
    history: >-
      In 299 BC King Huai went to meet the King of Qin at the Wu pass, was seized and held in
      Qin, and died there in 296.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 40, 84"]

  - id: chu_li_sao
    scenario: warring_states
    civ: chu
    year: -296
    title: "Encountering Sorrow"
    place: "Ying"
    speaker: steward
    speaker_name: "Zilan"
    speaker_title: "Chief minister, your brother"
    benchmark_provinces: 7
    story: >-
      You are King Qingxiang. Your father died a prisoner in Qin. Qu Yuan says it was your
      brother Zilan's advice that sent him there, and says so loudly, in poems that everyone
      at court is copying out.


      Zilan wants Qu Yuan banished to the far south.
    choices:
      - label: "Banish Qu Yuan to the south"
        historical: true
        legitimacy_bp: -500
        knowledge_bp: 1000
        outcome: >-
          Qu Yuan wanders by the rivers and lakes of the south with his hair unbound, writing.
          His long poem Li Sao, 'Encountering Sorrow', tells of a man who flies through heaven
          in a chariot drawn by dragons looking for a ruler worthy of him, and cannot find one.
          It will be the first great poem in Chinese with an author's name.
      - label: "Make Qu Yuan your chief minister"
        legitimacy_bp: 1000
        influence: {nobility: -1500}
        outcome: >-
          Qu Yuan takes office and stops writing poems. He makes many enemies, and some
          reforms.
        deeds: {martial_bp: 1000}
    history: >-
      Qu Yuan was exiled under King Qingxiang, traditionally after offending Zilan; the Li
      Sao and other poems of the Chu ci are attributed to him.
    sources: ["Shiji 84", "Chu ci (tr. Hawkes, 1985)"]

  - id: chu_ying_falls
    scenario: warring_states
    civ: chu
    year: -278
    until_year: -274
    title: "The Miluo River"
    place: "Ying, burning"
    speaker: general
    speaker_name: "Zhuang Qiao"
    speaker_title: "A general far away in the southwest"
    needs_alive: [qin]
    needs_owner: {chu_ying: chu}
    benchmark_provinces: 7
    story: >-
      Bai Qi of Qin has come down the Han river and taken Yan, flooding the city by breaking a
      dam. Now his army is at the gates of Ying, your capital for four hundred years. Behind it
      are the tombs of your ancestors at Yiling.


      Your general Zhuang Qiao, with Chu's best army, is far away in the southwest, conquering
      the kingdom of Dian by the great lake. He cannot come back in time.
    choices:
      - label: "Abandon Ying and move the court east to Chen"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Bai Qi takes Ying and burns the royal tombs at Yiling. The court flees to Chen. Far to
          the south, the exiled Qu Yuan hears the news, writes a last poem, clasps a stone to his
          chest and walks into the Miluo river. The fishermen race out in their boats to find him
          and throw rice into the water so the fish will not eat his body. They will do it every
          year, on the fifth day of the fifth month, for two thousand three hundred years.
        deeds: {give: [chu_ying], give_to: qin, capital: chu_chen}
      - label: "Defend Ying to the last"
        legitimacy_bp: 1000
        food_bp: -3000
        outcome: >-
          Ying holds for a season with its walls and its lake. Bai Qi brings up more men.
        deeds: {war_with: [qin]}
    history: >-
      In 278 BC Bai Qi took Ying and burned the Chu royal tombs; Chu moved its capital to Chen.
      Qu Yuan's suicide in the Miluo is commemorated by the Dragon Boat festival (Duanwu).
      Zhuang Qiao, cut off, founded the kingdom of Dian in Yunnan.
    diverged: >-
      Ying is not yours, or Qin is gone.
    sources: ["Shiji 40, 73, 84, 116"]

  - id: chu_chunshen
    scenario: warring_states
    civ: chu
    year: -263
    title: "The Prince in Disguise"
    place: "Xianyang, in Qin"
    speaker: steward
    speaker_name: "Huang Xie"
    speaker_title: "Tutor to the crown prince"
    benchmark_provinces: 6
    story: >-
      King Qingxiang is dying in Chen. His heir, Prince Wan, is a hostage in Qin, and Qin will
      not let him go - it would rather choose Chu's next king itself.


      The prince's tutor, Huang Xie, has a plan: the prince will put on the clothes of a
      carriage driver and drive out of Xianyang with the Chu envoys, while Huang Xie stays
      behind, pretends the prince is ill, and takes the blame.
    choices:
      - label: "Let the prince escape in disguise"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The prince is far beyond the pass before Qin notices. Huang Xie tells the King of Qin
          what he has done and asks to die. The Qin minister Fan Ju persuades the king that it
          would be wiser to let such a loyal man go home. The prince becomes King Kaolie, and
          makes Huang Xie his chief minister, Lord Chunshen, with three thousand retainers.
      - label: "Wait for Qin to release him"
        legitimacy_bp: -800
        unrest_bp: 1500
        outcome: >-
          The old king dies. Chu's princes quarrel over the empty throne while Qin decides.
    history: >-
      In 263 BC Huang Xie smuggled the crown prince out of Qin; the prince became King Kaolie
      and Huang Xie, as Lord Chunshen, ran Chu for 25 years.
    sources: ["Shiji 78"]

  - id: chu_lanling
    scenario: warring_states
    civ: chu
    year: -256
    until_year: -250
    title: "The Land of Confucius"
    place: "Qufu, in Lu"
    speaker: scholar
    speaker_name: "Xunzi"
    speaker_title: "A philosopher from Zhao"
    needs_alive: [lu]
    benchmark_provinces: 6
    story: >-
      Lu, the little state where Confucius was born, has no army worth the name. Lord Chunshen
      proposes to annex it. And he wants to give a magistracy to the philosopher Xunzi, the
      greatest teacher of his age, who argues that human nature is bad and only education and
      ritual make men good.
    choices:
      - label: "Annex Lu, and make Xunzi magistrate of Lanling"
        historical: true
        legitimacy_bp: 800
        knowledge_bp: 1500
        outcome: >-
          The last duke of Lu becomes a commoner. Xunzi governs Lanling and teaches there. Two
          of his students will change the world: Han Fei, who will write the bible of
          Legalism, and Li Si, who will be chancellor of Qin.
        deeds: {war_with: [lu], conquer: [lu]}
      - label: "Leave Lu alone, as a shrine to Confucius"
        influence: {clergy: 1000}
        outcome: >-
          Lu keeps its duke and its temples. Xunzi goes to Qi instead.
    history: >-
      Chu annexed Lu in 256 BC; Xunzi was magistrate of Lanling under Lord Chunshen. Han Fei and
      Li Si were his students.
    diverged: >-
      Lu is gone already.
    sources: ["Shiji 74, 78, 87"]

  - id: chu_xiang_yan
    scenario: warring_states
    civ: chu
    year: -225
    until_year: -221
    title: "Xiang Yan"
    place: "The Huai river"
    speaker: general
    speaker_name: "Xiang Yan"
    speaker_title: "Commander of Chu"
    needs_alive: [qin]
    benchmark_provinces: 5
    story: >-
      Han, Zhao and Wei have fallen. Qin sent the young general Li Xin against you with two
      hundred thousand men - and Xiang Yan destroyed his army, killing seven of his commanders.


      Now Qin has sent its oldest and best general, Wang Jian, with six hundred thousand -
      every man Qin has. He has built a fortified camp and sits in it. His soldiers spend their
      days throwing stones and long-jumping. For a year he has refused to fight.
    choices:
      - label: "Draw the army off east; he will not attack"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          The moment your army turns east, Wang Jian comes out of his camp and falls on it. Xiang
          Yan is killed, or kills himself. Shouchun falls; your king is captured. In twenty years
          Xiang Yan's grandson, Xiang Yu, will burn Qin's capital and the people will sing that
          even if only three households were left in Chu, Chu would destroy Qin.
        deeds: {ruler_falls: "is captured by Qin", give: [chu_chen, chu_huainan, chu_nanyang], give_to: qin}
      - label: "Stay in front of his camp, however long it takes"
        food_bp: -3000
        legitimacy_bp: 1000
        outcome: >-
          Your army waits; so does his. Six hundred thousand men eat Qin's grain. A year later
          Qin's granaries are empty, and Wang Jian goes home.
        deeds: {grudges: {qin: 3000}}
    history: >-
      Xiang Yan defeated Li Xin in 225 BC but was destroyed by Wang Jian in 224-223, and Chu
      fell. The Chu saying about three households, and Xiang Yu's revenge, are in the Shiji.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 7, 40, 73"]
