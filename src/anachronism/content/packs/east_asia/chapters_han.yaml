schema_version: 1
# Chronicle mode (D-120, D-182): the kingdom of Han, smallest of the seven, from Shen
# Buhai's reforms to its fall, 351-230 BC. Each chapter opens in its year; one choice is
# what history chose (historical: true). Facts follow the Shiji (the Han family, Shen
# Buhai and Han Fei, Su Qin, Bai Qi and the canal treatise), the Zhanguo ce, the Han Feizi
# and the surviving fragments of Shen Buhai, with modern work by Creel, Lewis and Pines.
# benchmark_provinces counts the provinces of this map the real kings held at that date.
chapters:
  - id: han_shen_buhai
    scenario: warring_states
    civ: han
    year: -350
    title: "The Art of the Ruler"
    place: "Xinzheng"
    speaker: scholar
    speaker_name: "Shen Buhai"
    speaker_title: "A minor official of the old state of Zheng"
    benchmark_provinces: 3
    story: >-
      You are Marquis Zhao of Han. Your state is the smallest of the great powers, squeezed
      between Qin, Wei, Chu and Zhao, with the best ironworks and crossbow makers in the world
      and no room to grow.


      Shen Buhai, a former clerk, has a theory of government he calls 'technique': the ruler
      should say little and reveal nothing, give each official a title and a task, and
      compare what each man achieves with what he promised, rewarding and punishing without
      exception. He asks to be made chancellor.
    choices:
      - label: "Make him your chancellor"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 1000
        unrest_bp: -1000
        outcome: >-
          For fifteen years Shen Buhai runs Han, and the Shiji says that in all that time no
          state dared attack it. His ideas, with Shang Yang's, will be gathered up a century
          later by a prince of your house, Han Fei, into the doctrine of the Legalists.
      - label: "Keep the old families in office"
        legitimacy_bp: 1000
        unrest_bp: 500
        influence: {nobility: 1500}
        outcome: >-
          The noble houses keep their offices, and their habit of quarrelling over them. They
          are grateful, and they are not hurried.
      - label: "Take the arsenals into royal hands"
        materials_bp: 1500
        wealth_bp: 1000
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          Royal officials now count every crossbow lock and every ingot at the ironworks of
          Han. The arsenals prosper and the old owners sulk, and the court learns who is
          to be obeyed.
    history: >-
      Shen Buhai was chancellor of Han under Marquis Zhao (from c. 351 BC until his death in
      337), and developed the idea of administrative 'technique' (shu).
    sources: ["Shiji 63 (Shen Buhai)", "Creel, Shen Pu-hai (1974)"]

  - id: han_maling
    scenario: warring_states
    civ: han
    year: -342
    title: "Five Battles Lost, and Qi Comes"
    place: "Xinzheng"
    speaker: qi
    speaker_name: "Tian Ji"
    speaker_title: "General of Qi"
    needs_alive: [wei, qi]
    benchmark_provinces: 3
    story: >-
      King Hui of Wei, who has just called himself king, has invaded Han. Your army has lost
      five battles and your capital is in danger. You have begged Qi for help, and Qi has
      promised it - and waited, until both Han and Wei were exhausted, as its strategist Sun
      Bin advised.


      Now word comes that Qi's army has finally marched, and nobody at your court is sure
      where it is going.
    choices:
      - label: "Hold out until Qi acts"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          The Wei army turns back to defend its own capital, and at Maling Sun Bin destroys
          it. Wei makes peace, and never threatens you so badly again. Qi's help has cost you
          your best soldiers, which is what Qi wanted.
        deeds: {peace_with: [wei]}
      - label: "Make terms with Wei"
        legitimacy_bp: -1500
        wealth_bp: -2000
        outcome: >-
          You pay Wei and give hostages. Qi's army goes home, and remembers.
        deeds: {peace_with: [wei]}
      - label: "Raise every levy to hold Xinzheng"
        legitimacy_bp: 900
        unrest_bp: 1200
        outcome: >-
          Farmers and craftsmen are handed spears and sent to the walls. The capital is
          manned, the fields are not, and the court is not sure that Qi will ever arrive.
        deeds: {men: 6000, martial_bp: 1000}
    history: >-
      Wei's invasion of Han (342 BC) was defeated when Qi, after delaying, intervened and
      destroyed the Wei army at Maling.
    diverged: >-
      Wei or Qi is gone.
    sources: ["Shiji 65 (Sun Bin)", "Shiji 45 (Han)", "Zhanguo ce, Qi 1"]

  - id: han_vertical
    scenario: warring_states
    civ: han
    year: -318
    title: "Better the Head of a Chicken"
    place: "Xinzheng"
    speaker: scholar
    speaker_name: "Su Qin"
    speaker_title: "A travelling persuader"
    needs_alive: [qin]
    benchmark_provinces: 3
    story: >-
      You are King Xuanhui. A persuader has come with a plan: all the states east of the
      mountains to join in a 'vertical' alliance, north to south, against Qin. He says the
      strongest bows and crossbows under heaven come from Han, that your soldiers can shoot
      six hundred paces, and that to serve Qin would be shameful. Others at court point out
      that Han is Qin's nearest neighbour and will be the first to feel its anger.


      "Better to be the head of a chicken than the tail of an ox," he says.
    choices:
      - label: "Join the alliance against Qin"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Five states march on Qin through the Hangu pass in 318. The allies quarrel, and next
          year Qin destroys the Han and Zhao armies at Xiuyu. The vertical alliance falls apart,
          and Qin's own persuader, Zhang Yi, arrives to sell the 'horizontal' one: every
          state alone, at peace with Qin.
        deeds: {grudges: {qin: 2000}}
      - label: "Make your own peace with Qin"
        legitimacy_bp: -1000
        outcome: >-
          Qin sends you its thanks, and an ambassador who watches everything.
        deeds: {peace_with: [qin]}
      - label: "Join, but send only a token force"
        legitimacy_bp: 800
        outcome: >-
          Your crossbowmen march with the allies, a few thousand of the best, and the rest stay
          at home. The other kings note that Han has promised less than it could, and the
          campaign goes much as it would have anyway.
        deeds: {men: 4000}
    history: >-
      Han joined the alliance of five states that attacked Qin in 318 BC; Qin defeated Han and
      Zhao at Xiuyu in 317. The chicken-and-ox saying is Su Qin's in the Shiji.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 69 (Su Qin)", "Zhanguo ce, Han 1"]

  - id: han_yiyang
    scenario: warring_states
    civ: han
    year: -308
    title: "The Gate to the Zhou Capital"
    place: "Yiyang"
    speaker: general
    speaker_name: "Your commander at Yiyang"
    speaker_title: "Of the great fortress"
    needs_alive: [qin]
    benchmark_provinces: 2
    story: >-
      You are King Xiang. The young King Wu of Qin is a strongman who likes to wrestle and
      lift weights. He has said he wants to ride his chariot through the passes and see the
      Zhou capital at Luoyang before he dies. Your fortress city of Yiyang stands in his way.


      His general Gan Mao has besieged Yiyang for five months. Your commander asks for a
      relief army that you do not have.
    choices:
      - label: "Let Yiyang fall"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Yiyang falls in 307, with sixty thousand dead. King Wu rides to Luoyang and, in the
          Zhou temple, tries to lift one of the sacred bronze cauldrons. It falls and breaks
          his leg, and he dies of it. Qin keeps Yiyang.
        deeds: {give: [han_yiyang], give_to: qin}
      - label: "Strip the capital to save it"
        materials_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Your last reserves and last levies march west. Yiyang holds a little longer.
        deeds: {men: 8000}
      - label: "Buy off Qin with silk and iron"
        wealth_bp: -1000
        legitimacy_bp: -300
        materials_bp: -500
        outcome: >-
          Wagons of silk and iron ingots go west to Qin's camp. Gan Mao accepts them politely
          and does not lift the siege.
        deeds: {peace_with: [qin]}
    history: >-
      Qin took Yiyang from Han in 307 BC; King Wu of Qin died after trying to lift a cauldron
      at Luoyang.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 5 (Qin)", "Shiji 71 (Gan Mao)", "Zhanguo ce, Qin 2"]

  - id: han_shangdang
    scenario: warring_states
    civ: han
    year: -262
    title: "A Gift That Starts a War"
    place: "Xinzheng"
    speaker: general
    speaker_name: "Feng Ting"
    speaker_title: "Governor of Shangdang"
    needs_alive: [qin, zhao]
    benchmark_provinces: 1
    story: >-
      You are King Huanhui. Qin has cut the road between Xinzheng and your northern province
      of Shangdang, on its high plateau. It cannot be held. You have offered Shangdang to Qin
      for peace.


      Your governor there, Feng Ting, writes that the people of Shangdang would rather be
      ruled by Zhao than by Qin, and that if Shangdang goes to Zhao, Qin will fight Zhao
      instead of Han.
    choices:
      - label: "Let Feng Ting give Shangdang to Zhao"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Zhao accepts the seventeen cities of Shangdang. Qin is enraged, and two years later
          its army and Zhao's meet at Changping, where Bai Qi buries four hundred thousand
          Zhao prisoners alive. Han has bought a few years.
        deeds: {give: [han_shangdang], give_to: zhao}
      - label: "Give Shangdang to Qin, as promised"
        legitimacy_bp: -1000
        outcome: >-
          Qin takes Shangdang, and its armies stand on the plateau above your capital.
        deeds: {give: [han_shangdang], give_to: qin}
      - label: "Fortify the passes and hold on"
        legitimacy_bp: -500
        unrest_bp: 1200
        outcome: >-
          Feng Ting is ordered to hold the plateau by himself, with what soldiers can be
          sent. The garrison digs in and the Qin army, which has been told that the province
          is already theirs, is angry.
        deeds: {men: 4000, martial_bp: 1500}
    history: >-
      In 262 BC the Han governor of Shangdang, Feng Ting, handed the province to Zhao rather
      than Qin, provoking the Changping campaign.
    diverged: >-
      Qin or Zhao is gone.
    sources: ["Shiji 43 (Zhao)", "Shiji 73 (Bai Qi)", "Zhanguo ce, Zhao 1"]

  - id: han_canal
    scenario: warring_states
    civ: han
    year: -246
    title: "A Canal to Exhaust Qin"
    place: "Xinzheng"
    speaker: scholar
    speaker_name: "Zheng Guo"
    speaker_title: "Water engineer"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      Qin is unstoppable on the battlefield. Your ministers have a different idea: send your
      best hydraulic engineer, Zheng Guo, to Qin, to persuade the new boy king's ministers to
      dig an enormous irrigation canal across the Wei valley. It will take years and tens of
      thousands of labourers - labourers who will not be soldiers marching on Han.
    choices:
      - label: "Send Zheng Guo"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Qin takes the bait. Halfway through, the plot is discovered. Zheng Guo tells the
          Qin court: "I came as a spy, but when the canal is finished it will benefit Qin for
          ten thousand generations." They let him finish it. The canal turns forty
          thousand qing of salty land into farmland, the Shiji says, and Qin, fed from its own fields, grows stronger
          than ever.
      - label: "Keep him at home"
        knowledge_bp: 500
        outcome: >-
          Zheng Guo builds canals in Han instead, and Han's fields are better watered.
      - label: "Send gifts and an envoy to Qin"
        wealth_bp: -600
        legitimacy_bp: 200
        outcome: >-
          Your envoy carries silk and polite words to the Qin court, and is thanked for both.
          Qin's ministers do not ask what else Han might be doing.
    history: >-
      The Han engineer Zheng Guo persuaded Qin to build a great canal (begun c. 246 BC) as a
      plan to exhaust it; the Zhengguo canal greatly enriched the Qin heartland.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 29 (Rivers and Canals)", "Han shu 29"]

  - id: han_fei
    scenario: warring_states
    civ: han
    year: -234
    title: "The Stammering Prince"
    place: "Xinzheng"
    speaker: scholar
    speaker_name: "Han Fei"
    speaker_title: "A prince of your house"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      You are King An. Your kinsman Han Fei stammers too badly to argue at court, so he
      writes: about how rulers can hold power, how ministers deceive them, how laws must be
      clear and punishments certain. You have never listened to him.


      The King of Qin has. He read two of his essays and said that if he could meet their
      author, he would die without regret. Now Qin is attacking, and demands Han Fei as an
      envoy.
    choices:
      - label: "Send Han Fei to Qin"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          The King of Qin is delighted with him. But the chancellor Li Si, who studied with Han
          Fei under Xunzi and knows he is the better mind, warns that a prince of Han will
          always serve Han. Han Fei is thrown into prison, where Li Si sends him poison. The
          king changes his mind too late. His book survives, and Qin rules by it.
      - label: "Make him your chancellor instead"
        legitimacy_bp: 1000
        influence: {nobility: -1000}
        outcome: >-
          Han Fei takes office, writes new laws, and stammers at the officials, who are
          terrified of him.
        deeds: {grudges: {qin: 2000}}
      - label: "Send gifts and another envoy"
        wealth_bp: -500
        legitimacy_bp: -300
        outcome: >-
          A senior minister goes to Xianyang with silk and an apology. The King of Qin takes
          the silk and repeats his request for the prince.
    history: >-
      Han Fei went to Qin as an envoy in 234-233 BC and died in prison there, poisoned at Li
      Si's instigation.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 63 (Han Fei)", "Han Feizi", "Watson, Han Fei Tzu: Basic Writings (1964)"]

  - id: han_end
    scenario: warring_states
    civ: han
    year: -230
    title: "The First to Fall"
    place: "Xinzheng"
    speaker: general
    speaker_name: "Your last commander"
    speaker_title: "At the walls"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      The Qin general Teng, who was once a Han official and went over to Qin, is outside
      Xinzheng with an army. He knows every road and every wall. Your ministers say there
      are three ways open: to yield, to fight, or to bargain.
    choices:
      - label: "Open the gates to Teng"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Xinzheng falls, and you are taken prisoner. Han is the first of the six states to be
          conquered by Qin. In nine years there will be none left.
        deeds: {ruler_falls: "is taken prisoner by Qin"}
      - label: "Fight in the streets"
        legitimacy_bp: -500
        unrest_bp: 2500
        outcome: >-
          The crossbowmen of Han, the best in the world, hold the walls for a season.
      - label: "Ask Teng for terms as a vassal"
        legitimacy_bp: -1800
        wealth_bp: -1000
        outcome: >-
          Your envoy goes out with the royal seals and a list of gifts. Teng listens, and
          sends the list on to Xianyang.
    history: >-
      Qin conquered Han in 230 BC under the general Teng (Neishi Teng) and captured King An.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 45 (Han)", "Shiji 6 (Qin Shi Huang)"]
