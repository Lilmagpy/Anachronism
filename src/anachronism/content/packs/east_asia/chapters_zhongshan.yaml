schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Zhongshan, from the five kings to its fall,
# about 322-298 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Zhanguo ce (Zhongshan, Zhao, Yan), Sima Qian's Shiji
# (Zhao, ch. 43), and the bronze inscriptions of King Cuo's tomb at Pingshan, with modern work
# by Wu Hung and the Hebei excavation report. Zhongshan's own history is thinly recorded and
# the dates are approximate: King Cuo's reign (about 327-309) and his death, the Zhao
# campaigns (about 307-305), and the end (296 in the Shiji's Zhao chapter) vary by a year or
# two between sources. benchmark_provinces counts the provinces of this map the real
# Zhongshan held at that date.
chapters:
  - id: zhongshan_king
    scenario: warring_states
    civ: zhongshan
    year: -322
    title: "A King Among Kings"
    place: "Lingshou"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    benchmark_provinces: 1
    story: >-
      You are Cuo, ruler of Zhongshan. Your people are the White Di, who were driven out of
      the Zhou world once and came back; your grandfathers rebuilt this hill-fortress at
      Lingshou after Wei's armies broke the first Zhongshan. Now your neighbours are making
      themselves kings. Wei and Qi have worn the title for years; Han and Yan are taking it
      now, and the five states of Wei, Han, Yan, Zhao and Zhongshan are being asked to
      recognise one another in a pact.


      Your minister says the Zhou kings will never again command anyone, and a ruler who
      keeps the lesser title will be treated as lesser. But the Zhanguo ce tells that Qi, the
      great power of the east, let it be known that it was ashamed to stand as an equal
      beside little Zhongshan.
    choices:
      - label: "Take the title of king"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -300
        outcome: >-
          You are King of Zhongshan, and you sign the pact with the other new kings. Qi is
          angry, as it said it would be; Zhao is cool, and does not take the title itself.
          But your bronze-casters begin to put the word king on every vessel in the royal
          workshops, and your court speaks of itself as the equal of the Zhou heirs.
      - label: "Keep the title of lord"
        legitimacy_bp: -500
        outcome: >-
          You wait. Qi is satisfied, for now. In the council there are those who say that the
          neighbours who have crowned themselves will not forget that you did not.
    history: >-
      Zhongshan's ruler took the title of king in 323 BC, as one of five states that
      recognised each other's kingship (Zhanguo ce, Zhongshan 1). Qi objected.
    sources: ["Zhanguo ce, Zhongshan 1", "Shiji 43 (Zhao)", "Hebei Provincial Institute, Cuo mu (1995)"]

  - id: zhongshan_yan
    scenario: warring_states
    civ: zhongshan
    year: -314
    title: "The Tripod of Cuo"
    place: "Lingshou, the royal foundry"
    speaker: general
    speaker_name: "Zhou, your chancellor"
    speaker_title: "Commander of the host"
    needs_alive: [yan]
    benchmark_provinces: 2
    story: >-
      Your southern neighbour Yan is in ruins. King Kuai gave his throne away to his minister
      Zizhi; Prince Ping rose against Zizhi; the streets of Ji ran with blood. Qi's armies
      are marching on Yan, and your chancellor Zhou says that the whole north is open to
      whoever moves first.


      He also says something more. In the lands beyond the border, a ruler who throws away
      his ancestors' seat is a ruler Heaven has abandoned, and a king who punishes such a man
      acts for Heaven. It is a good story to cast in bronze.
    choices:
      - label: "March north behind Qi"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your army goes into Yan while Yan is fighting itself. The inscription you later cast
          on a great bronze tripod, found in your tomb at Pingshan more than two thousand
          years afterwards, says that Zhou led the host, that he took several hundred li of
          land and several dozen towns, and that Yan's lord and his ministers had broken the
          rules of Heaven. It is one of the longest texts on any Zhongshan bronze. When Qi withdraws,
          you keep part of what you took.
        deeds: {martial_bp: 300, take: [yan_yi], grudges: {yan: 1500}}
      - label: "Stay behind your walls"
        legitimacy_bp: -300
        outcome: >-
          Qi plunders Yan and goes home. Prince Zhi comes back from Han to be king. A weak
          Yan would have been a gift to you, and you leave it unwrapped.
    history: >-
      In 314 BC, during the civil war in Yan, Zhongshan under King Cuo attacked and took land
      and towns, recorded in the king's bronze tripod inscription (found at Pingshan, 1977).
      The size of the gain is the inscription's own claim.
    diverged: >-
      Yan is gone.
    sources: ["Zhanguo ce, Yan 1", "Hebei Provincial Institute, Cuo mu (1995)", "Wu Hung, Monumentality in Early Chinese Art (1995)"]

  - id: zhongshan_tomb
    scenario: warring_states
    civ: zhongshan
    year: -312
    title: "The Plan of the Tomb"
    place: "Lingshou, the royal workshops"
    speaker: scholar
    speaker_name: "The master of works"
    speaker_title: "Of the royal tomb"
    benchmark_provinces: 2
    story: >-
      You are King Cuo, and you are not young. The royal tombs of Zhongshan are to lie on the
      hill beside your capital, under mounds as tall as halls, and your master of works has
      brought you a copper plate inlaid in gold and silver. On it is the plan of the burial
      ground: terraces, halls, walls, gates, and the sizes of each.


      He wants your command cast on the plate itself, so that nobody dares change the plan
      after you are gone. The workshops would need to be taken from the army's arsenals for a
      year or two, and the granaries are thin.
    choices:
      - label: "Have the plan cast with the king's command"
        historical: true
        knowledge_bp: 800
        legitimacy_bp: 1000
        wealth_bp: -800
        outcome: >-
          The plate is made, with the plan, the measurements, and your own order that the plan
          be kept and that any who change it be punished. Dragons, tigers and deer are cast
          in your bronzes for the afterlife, and a
          generation of Zhongshan's craftsmen work in a style that no other court has.
      - label: "Spend the metal on weapons"
        legitimacy_bp: -300
        outcome: >-
          The arsenals fill, and the workshops go quiet. The court wonders if the king
          expects to need his army more than his tomb.
        deeds: {martial_bp: 200}
    history: >-
      The royal tomb plan on a gold-and-silver inlaid bronze plate (the Zhaoyu tu), with the
      king's command, was found in Cuo's tomb at Pingshan, Hebei, in 1977.
    sources: ["Hebei Provincial Institute, Cuo mu (1995)", "Wu Hung, Monumentality in Early Chinese Art (1995)"]

  - id: zhongshan_hu
    scenario: warring_states
    civ: zhongshan
    year: -306
    title: "The Horsemen of Zhao"
    place: "The border at Dai"
    speaker: general
    speaker_name: "A border captain"
    speaker_title: "At the Zhao frontier"
    needs_alive: [zhao]
    benchmark_provinces: 2
    story: >-
      You are Shang, King of Zhongshan; Cuo is dead. Across the border, King
      Wuling of Zhao has done something strange. He has put his army into the short coat and
      trousers of the Hu herdsmen and taught his nobles to ride and shoot from horseback, over
      the shouts of his own uncles, who say that a king ought not to dress like a barbarian.


      Your captain says that the Zhao horsemen have started riding the whole circuit of your
      frontier. Wuling himself has been seen looking at your passes. Some of your ministers
      want your army to learn the new ways at once; others say that the Di were born in the
      saddle and need no lessons from Zhao.
    choices:
      - label: "Hold the passes and the walls"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          Your walls are good and your garrisons are many. The Zhao columns do not stop to
          besiege towns they can ride around, and the old chariot-and-spearman ways are of no
          use against them. You fall back from the open land, and when the season ends there
          is an uneasy truce.
        deeds: {peace_with: [zhao], martial_bp: 200}
      - label: "Ride out and fight in the open"
        legitimacy_bp: -800
        outcome: >-
          You risk everything on your cavalry in the plain. It does not go as you hoped, and
          many of your best are lost.
        deeds: {martial_bp: 600}
    history: >-
      King Wuling of Zhao adopted nomad dress and mounted archery in 307 BC, and from about
      306 he attacked Zhongshan repeatedly.
    diverged: >-
      Zhao is gone.
    sources: ["Shiji 43 (Zhao)", "Zhanguo ce, Zhao 2", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: zhongshan_four
    scenario: warring_states
    civ: zhongshan
    year: -304
    title: "Four Towns for Peace"
    place: "Lingshou"
    speaker: steward
    speaker_name: "Sima Xi"
    speaker_title: "Your minister"
    needs_alive: [zhao]
    benchmark_provinces: 1
    story: >-
      The Zhao armies have come in three columns, King Wuling riding in person. They have
      taken towns in your east, and they are far from your walls and the royal mounds. Your
      minister, a persuader who has served your house in several courts, says that Zhao will
      take peace for a price, and that the price is four towns.


      He says more, in private. If Zhongshan pays, Wuling will be pleased for a while. But a
      king who has built a new army wants somewhere to use it.
    choices:
      - label: "Pay four towns for peace"
        historical: true
        unrest_bp: 500
        legitimacy_bp: -1000
        outcome: >-
          The Zhao army withdraws. You are king in a smaller kingdom, and Wuling goes home to think about the north and the west.
        deeds: {peace_with: [zhao], give: [yan_yi], give_to: zhao}
      - label: "Refuse and fight on"
        legitimacy_bp: 300
        outcome: >-
          You keep your towns for now. But your army is no match for Zhao's, and you know it.
        deeds: {martial_bp: 300}
    history: >-
      After heavy Zhao attacks in 306-305 BC, Zhongshan ceded four towns to Zhao to make
      peace (Shiji 43). The terms are given in the Shiji; the towns are not named here.
    diverged: >-
      Zhao is gone.
    sources: ["Shiji 43 (Zhao)", "Zhanguo ce, Zhongshan"]

  - id: zhongshan_end
    scenario: warring_states
    civ: zhongshan
    year: -298
    title: "The Last King"
    place: "Lingshou"
    speaker: general
    speaker_name: "The captain of the gate"
    speaker_title: "At Lingshou"
    needs_alive: [zhao]
    benchmark_provinces: 1
    story: >-
      King Wuling has stepped down from the throne of Zhao and given it to his young son,
      but he is still the commander of the army, and the army is at your gates. Zhao has been
      at war with you, off and on, for ten years. Behind you is the hill of the royal tombs,
      where your father lies under his bronzes. Before you is a Zhao army of horse archers
      and crossbowmen who have been fighting for years.


      There is no help coming from Qi or Yan, which have their own quarrels. The sources
      differ about how this ends.
    choices:
      - label: "Surrender the capital and go into exile"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Lingshou falls to Zhao. Later chroniclers say you were moved to a place called
          Fushi, far to the west; others say that you fled to Qi and died there. Zhongshan,
          the kingdom of the White Di, becomes part of Zhao. Its royal tombs remain on their
          hill, with their bronzes, until archaeologists open them in the 1970s.
        deeds: {ruler_falls: "is driven from Lingshou by Zhao"}
      - label: "Hold Lingshou to the last"
        legitimacy_bp: -1000
        outcome: >-
          You shut the gates. The siege is hard and the army is tired.
    history: >-
      Zhao conquered Zhongshan about 296 BC (Shiji 43 gives Huiwen's 3rd year, 296). The
      last king, Shang, was moved to Fushi, by the Shiji's account; another tradition says
      he fled to Qi and died there.
    diverged: >-
      Zhao is gone.
    sources: ["Shiji 43 (Zhao)", "Zhanguo ce, Zhongshan", "Hebei Provincial Institute, Cuo mu (1995)"]
