schema_version: 1
# Chronicle mode (D-120, D-162): the Tangut kingdom of Western Xia, 1206-1227.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# The Tangut wrote their own history in their own script, and almost all of it was lost
# when the Mongols destroyed them; the facts follow the Song shi and Jin shi chapters on
# Xia, the Yuan shi, the Secret History of the Mongols, Rashid al-Din, and modern work by
# Dunnell, Kychanov and Atwood. benchmark_provinces counts the provinces of this map the
# real kingdom held at that date.
chapters:
  - id: xia_coup
    scenario: great_khan
    civ: western_xia
    year: 1206
    title: "The Cousin and the Dowager"
    place: "Zhongxing, the capital"
    speaker: steward
    speaker_name: "Empress Dowager Luo"
    speaker_title: "Your mother"
    benchmark_provinces: 4
    story: >-
      You are Emperor Huanzong of the Great State of White and High, as the Tangut call their
      kingdom: Xia, to the Chinese. Your people write in their own script of six thousand
      characters, print Buddhist books by the hundred thousand, and hold the Hexi corridor,
      the road to the west. For thirteen years you have kept peace with everyone.


      Last year the Mongols raided your frontier and carried off your camels. Your cousin Li
      Anquan says a soldier should rule now, not a man of peace. Your mother, the Dowager,
      agrees with him. She has come to tell you so, and the palace guard is behind her.
    choices:
      - label: "Give up the throne"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          You are confined to a palace, and you die there within the year. Your mother writes
          to the Jin court that you abdicated of your own free will, and asks the Jin emperor
          to recognise Li Anquan. He does.
        deeds: {ruler_falls: "is deposed by his cousin Li Anquan"}
      - label: "Arrest your cousin"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          Li Anquan is taken in his house, and your mother retires to a nunnery. The generals
          who backed them are watching you.
      - label: "Make your cousin commander of the army"
        legitimacy_bp: -300
        unrest_bp: 300
        deeds: {martial_bp: 300}
        outcome: >-
          Li Anquan takes the baton and the guard stays loyal to him. Your mother says it is a
          fair division of the burdens, and the court waits to see which of you gives the
          orders.
    history: >-
      Li Anquan (Xiangzong) deposed his cousin Huanzong in 1206, with the support of the
      Empress Dowager Luo; Huanzong died in confinement.
    sources: ["Song shi 486 (Xia guo)", "Jin shi 134 (Xi Xia)", "Dunnell, in Cambridge History of China vol. 6 (1994)"]

  - id: xia_flood
    scenario: great_khan
    civ: western_xia
    year: 1209
    title: "The River Turned"
    place: "The walls of Zhongxing"
    speaker: general
    speaker_name: "Your commander of the walls"
    speaker_title: "Zhongxing"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      You are Emperor Xiangzong. The Mongols have come in force: they have beaten your army in
      the field and have been besieging Zhongxing for months. They do not know how to take a
      walled city, so Genghis Khan has had the Yellow River dammed to drown it.


      You sent to the Jin for help. The Jin emperor replied: "It is to our advantage when our
      enemies attack one another." Last night the Mongol dyke broke, and the flood went the
      other way, into the Khan's camp. Now his envoys are at the gate: submit, and he will
      go.
    choices:
      - label: "Submit, and send the Khan your daughter"
        historical: true
        wealth_bp: -2000
        legitimacy_bp: -1000
        outcome: >-
          Your daughter Chaqa goes to the Khan's tents with a dowry of camels, falcons and
          woollen cloth. You promise to be his right hand in war. The Mongols ride away, and
          you will remember who refused to help you.
        deeds: {peace_with: [mongols]}
      - label: "The flood has saved us; fight on"
        legitimacy_bp: 500
        food_bp: -2000
        outcome: >-
          The Mongols drain their camp and wait. The city eats its horses.
        deeds: {grudges: {mongols: 2000}}
      - label: "Send camels and gold, but no daughter"
        wealth_bp: -2500
        legitimacy_bp: -500
        deeds: {peace_with: [mongols]}
        outcome: >-
          Your envoys carry out camels, falcons and gold. The Khan, whose army is soaked and has
          no walls to climb, takes them and rides away. The treasury is empty, and nobody in
          the court forgets what the Jin said.
    history: >-
      Genghis Khan besieged Zhongxing in 1209 and tried to flood it; the dyke broke and
      flooded his own camp. Xiangzong submitted and gave him a daughter. The Jin refused to
      help Xia.
    diverged: >-
      The Mongols are gone; nobody came.
    sources: ["Yuan shi 1 (Taizu)", "Secret History of the Mongols 249", "Jin shi 134 (Xi Xia)"]

  - id: xia_graduate
    scenario: great_khan
    civ: western_xia
    year: 1213
    title: "The Scholar on the Throne"
    place: "Zhongxing"
    speaker: general
    speaker_name: "A Tangut general"
    speaker_title: "Of the eastern frontier"
    needs_alive: [jurchen_jin]
    benchmark_provinces: 4
    story: >-
      You are Emperor Shenzong. You took the throne from your kinsman Xiangzong two years ago.
      Before that you were a prince who sat the state examinations, as if you were a commoner,
      and came first: the only examination champion ever to become an emperor.


      The Mongols have smashed the Jin armies at the Badger's Mouth and are besieging the
      Jin capital. Your generals say the Jin, who would not help you in 1209, are falling,
      and the lands along your eastern border are there to be taken.
    choices:
      - label: "Attack the Jin"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          For ten years your armies raid the Jin border towns. Sometimes you win, often you
          lose. In 1220 you even agree with the Song to attack the Jin together; the Song army
          turns up late, and goes home. The war ruins both of you, and the Mongols watch.
        deeds: {martial_bp: 500, grudges: {jurchen_jin: 3000}}
      - label: "Help the Jin against the Mongols"
        legitimacy_bp: -200
        wealth_bp: -500
        outcome: >-
          Your envoys go to the Jin court and a Tangut army marches east to stand beside them.
          The Jin are surprised, and accept. The Mongols are told.
        deeds: {men: 1500, grudges: {mongols: 2000}}
      - label: "Hold the frontier and wait on events"
        legitimacy_bp: 1000
        wealth_bp: -300
        deeds: {men: 2000}
        outcome: >-
          Your army camps along the eastern border and does nothing for a season. The Jin do not
          trust you, the Mongols do not thank you, and the generals mutter about lost chances.
    history: >-
      Shenzong (r. 1211-1223), the only zhuangyuan to become emperor, attacked the Jin from
      1214; the Xia-Jin war lasted a decade and exhausted both states.
    diverged: >-
      The Jin are gone.
    sources: ["Song shi 486 (Xia guo)", "Jin shi 134 (Xi Xia)", "Dunnell, in Cambridge History of China vol. 6 (1994)"]

  - id: xia_asha
    scenario: great_khan
    civ: western_xia
    year: 1219
    title: "If He Has Not Enough Soldiers"
    place: "Zhongxing"
    speaker: steward
    speaker_name: "Asha Gambu"
    speaker_title: "Your chief minister and general"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      Genghis Khan is going west, against the Khwarazm-shah, who murdered his merchants. He
      has sent to remind you that you promised to be his right hand, and to ask for your
      army.


      Before you can answer, your minister Asha Gambu answers for you, in front of the Mongol
      envoy: "If Genghis has not enough soldiers, he has no business being Khan."
    choices:
      - label: "Let the answer stand"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          The envoy rides away. The Secret History says the Khan swore that if he lived to come
          back, he would settle with the Tangut. He goes west without you, and destroys
          Khwarazm.
        deeds: {grudges: {mongols: 4000}}
      - label: "Apologise, and send the soldiers"
        food_bp: -2500
        legitimacy_bp: -1000
        outcome: >-
          Your horsemen ride west with the Mongols, to Samarkand and beyond. Few come back, but
          the Khan says the Tangut kept their word.
      - label: "Send a token force, with excuses"
        legitimacy_bp: 800
        deeds: {men: 1000}
        outcome: >-
          A thousand horse ride west under a minor commander, with a letter of regrets. The
          Khan notes the smallness of the gift.
    history: >-
      In 1219 Xia refused to send troops for Genghis Khan's campaign against Khwarazm; the
      Secret History puts the insolent reply in the mouth of Asha Gambu.
    diverged: >-
      The Mongols are gone.
    sources: ["Secret History of the Mongols 256", "Atwood, Encyclopedia of Mongolia and the Mongol Empire (2004)"]

  - id: xia_brothers
    scenario: great_khan
    civ: western_xia
    year: 1223
    title: "Brothers with the Jin"
    place: "Zhongxing"
    speaker: steward
    speaker_name: "Your envoy to the Jin"
    speaker_title: "Back from Kaifeng"
    needs_alive: [jurchen_jin]
    benchmark_provinces: 4
    story: >-
      You are Emperor Xianzong. Your father Shenzong has given you the throne, worn out by the
      war he started, and the Mongols, whom he joined against the Jin and then left in the
      middle of a siege, are angry.


      The new Jin emperor, Aizong, has sent to propose peace: not as overlord and vassal, as
      in the old days, but as brothers. He is the elder brother; you will be the younger. And
      the Mongols have sent to say that your son must come to the Khan's court as a hostage.
    choices:
      - label: "Make peace with the Jin as brothers"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          The treaty of 1225 ends twelve years of war. You also send envoys to the northern
          tribes to talk about an alliance against the Mongols. Your son stays at home. The
          Khan, back from the west, hears all of it.
        deeds: {peace_with: [jurchen_jin], grudges: {mongols: 3000}}
      - label: "Send your son to the Khan"
        legitimacy_bp: -1500
        outcome: >-
          The prince rides north with a small household. The Khan takes him in and sends word
          that the Tangut have remembered their duty, for now.
      - label: "Make peace, and send gifts not your son"
        legitimacy_bp: 1500
        unrest_bp: -1000
        wealth_bp: -500
        deeds: {peace_with: [jurchen_jin]}
        outcome: >-
          The treaty is signed, and a caravan of silk and horses goes north to the Khan in
          your son's place. Whether he thinks it enough, nobody can tell you.
    history: >-
      Shenzong abdicated in 1223. His son Xianzong made peace with the Jin in 1225 and refused
      to send a hostage to the Mongols.
    diverged: >-
      The Jin are gone.
    sources: ["Jin shi 134 (Xi Xia)", "Yuan shi 1 (Taizu)", "Rashid al-Din, Compendium of Chronicles"]

  - id: xia_lingzhou
    scenario: great_khan
    civ: western_xia
    year: 1226
    title: "The Frozen River"
    place: "Lingzhou, on the Yellow River"
    speaker: general
    speaker_name: "Wei Ming Linggong"
    speaker_title: "Commander of the last army"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Li Xian, the last emperor of Xia; your kinsman Xianzong died this summer, it is
      said of fear. Genghis Khan has come back from the west and kept his oath. He has taken
      Khara-Khoto, Ganzhou, Suzhou, Shazhou, Liangzhou: the whole Hexi corridor, city by city,
      killing the people of every city that resisted.


      Now he is at Lingzhou, a day from your capital, and the Yellow River is frozen hard
      enough to ride across. Your general has your last army, the best of the Tangut. He
      asks whether to fight on the ice, or to fall back behind the walls of Zhongxing.
    choices:
      - label: "Fight on the river"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          The Mongol horsemen cross the ice and break your army. Rashid al-Din says the dead
          lay in heaps. Only Zhongxing is left. In the Khan's camp, they say he has had a fall
          from his horse while hunting wild asses, and is feverish.
        deeds: {give: [g_hexi, g_shazhou, g_ordos], give_to: mongols}
      - label: "Fall back to Zhongxing"
        food_bp: -1500
        outcome: >-
          Lingzhou falls. The army reaches the capital intact, and the Mongols ride up to its
          walls behind it.
        deeds: {give: [g_hexi, g_shazhou], give_to: mongols}
      - label: "Ask the Khan for terms at Lingzhou"
        legitimacy_bp: -1500
        wealth_bp: -800
        deeds: {give: [g_hexi], give_to: mongols}
        outcome: >-
          Your envoys ride out over the ice. The Khan answers that terms mean surrender, and
          his horsemen are already moving.
    history: >-
      In 1226 Genghis Khan conquered the Hexi corridor and destroyed the Xia army near
      Lingzhou on the frozen Yellow River. Xianzong had died that summer.
    diverged: >-
      The Mongols are gone.
    sources: ["Yuan shi 1 (Taizu)", "Rashid al-Din, Compendium of Chronicles", "Secret History of the Mongols 265-267"]

  - id: xia_end
    scenario: great_khan
    civ: western_xia
    year: 1227
    title: "A Month's Grace"
    place: "Zhongxing, besieged"
    speaker: mongols
    speaker_name: "The Khan's envoy"
    speaker_title: "At the gate"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      Zhongxing has been besieged for six months. There has been an earthquake, and the
      plague is in the city. You have sent to the Khan to say you will surrender, and asked
      for a month to prepare gifts worthy of him: golden Buddhas, gold and silver vessels,
      boys and girls, horses and camels, in nines.


      The envoy says the Khan agrees, and will receive you. He has not seen the Khan himself.
      Nobody has, for some days.
    choices:
      - label: "Go out and surrender"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Genghis Khan has been dead for weeks, and his sons have kept it secret, by his
          order, until Zhongxing was theirs. You are killed when you come out. Then the city
          is put to the sword. The Tangut kingdom, its emperors and their histories, are
          ended so completely that its script will not be read again for seven hundred years.
        deeds: {ruler_falls: "is put to death by the Mongols"}
      - label: "Stay behind the walls"
        legitimacy_bp: 500
        food_bp: -2500
        outcome: >-
          The month passes. You hear that the Mongols are mourning someone. Then they break
          camp, and ride north with a covered cart.
      - label: "Break out with your household"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          A guard of horsemen cuts a way through the camp at night. The Mongol patrols are many,
          and the road south is long.
    history: >-
      Li Xian surrendered Zhongxing in 1227 and was executed; Genghis Khan had died during
      the siege. The Mongols massacred the city and ended the Xia state.
    diverged: >-
      The Mongols are gone.
    sources: ["Secret History of the Mongols 267-268", "Yuan shi 1 (Taizu)", "Dunnell, in Cambridge History of China vol. 6 (1994)"]
