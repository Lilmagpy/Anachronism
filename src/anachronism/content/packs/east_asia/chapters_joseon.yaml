schema_version: 1
# Chronicle mode (D-120, D-159): Joseon Korea and the Imjin War, 1567-1598.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Veritable Records of King Seonjo, Yu Seong-ryong's Jingbirok (Book of
# Corrections), Yi Sun-sin's War Diary (Nanjung ilgi), Japanese and Ming records, and modern
# work by Hawley, Swope, Turnbull and Lewis. benchmark_provinces counts the provinces of this
# map the real Joseon court held at that date.
chapters:
  - id: jos_seonjo
    scenario: sengoku
    civ: joseon
    year: 1567
    title: "The Grandson of a Concubine"
    place: "Gyeongbok palace, Hanyang"
    speaker: steward
    speaker_name: "Yi Hwang (Toegye)"
    speaker_title: "The greatest scholar of the age"
    benchmark_provinces: 5
    story: >-
      King Myeongjong has died without a son. The council has chosen you, Ha-seong, fifteen, the
      grandson of a king by a concubine, to be King Seonjo.


      The old scholar Yi Hwang, who has retired to teach in his academy in the south, has come
      back to court. He offers you the Ten Diagrams of Sage Learning: a guide to how a king
      should cultivate his mind. The men of his school - the sarim, scholars from the
      countryside - want the ministers who served the old queen's family purged and their own
      men in office.
    choices:
      - label: "Bring the sarim scholars into government"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 1000
        influence: {nobility: -1000}
        outcome: >-
          The scholars of the academies fill the ministries. It is the beginning of a golden age
          of Korean Confucian learning - and of a court that will spend more time arguing about
          ritual than about armies.
      - label: "Keep the experienced old ministers"
        influence: {nobility: 1000}
        outcome: >-
          The old ministers keep their seats. The scholars go back to their academies and write
          memorials against them.
    history: >-
      Seonjo became king in 1567; under him the sarim scholars took over the government. Yi
      Hwang presented the Ten Diagrams of Sage Learning in 1568.
    sources: ["Seonjo sillok", "Kalton, To Become a Sage (1988)"]

  - id: jos_factions
    scenario: sengoku
    civ: joseon
    year: 1575
    title: "East and West"
    place: "Hanyang"
    speaker: steward
    speaker_name: "Yi I (Yulgok)"
    speaker_title: "A scholar-minister"
    benchmark_provinces: 5
    story: >-
      Two officials, Kim Hyo-won and Sim Ui-gyeom, have quarrelled over who should get a junior
      post in the Ministry of Personnel - the post that decides who gets every other post. Kim
      lives in the east of Hanyang, Sim in the west. Now every official at court is an
      'Easterner' or a 'Westerner'.


      Yi I, wisest of your ministers, says both men are good and both factions are foolish.
      He wants you to send both men away to the provinces.
    choices:
      - label: "Send both away, and hope it ends"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Both men go to the provinces. It does not end. The Easterners and Westerners, and the
          factions they split into, will fight each other at your court for three hundred years.
      - label: "Ban faction by royal decree"
        legitimacy_bp: -300
        influence: {nobility: -1500}
        outcome: >-
          The decree is posted. The factions meet in private houses instead.
    history: >-
      The split into Easterners and Westerners in 1575 began the factional struggles that
      dominated Joseon politics until the 19th century.
    sources: ["Seonjo sillok", "Lee Ki-baik, A New History of Korea (1984)"]

  - id: jos_hundred_thousand
    scenario: sengoku
    civ: joseon
    year: 1583
    title: "A Hundred Thousand Soldiers"
    place: "Hanyang"
    speaker: general
    speaker_name: "Yi I (Yulgok)"
    speaker_title: "Minister of War"
    benchmark_provinces: 5
    story: >-
      Joseon has been at peace for two hundred years. Its army exists mostly on paper: men pay
      a cloth tax instead of serving, and the cloth is spent elsewhere. The Jurchen tribes have
      just sacked a frontier fort in the north.


      Yi I, now Minister of War, proposes that ten thousand soldiers be trained in the capital
      and in each province - a hundred thousand in all - before trouble comes. The court says
      there is no money, and no trouble.
    choices:
      - label: "Thank him, and do nothing"
        historical: true
        wealth_bp: 500
        outcome: >-
          The proposal is filed. Yi I dies the next year, aged forty-eight. Nine years later his
          colleague Yu Seong-ryong will write that if his advice had been taken, the disaster
          might never have happened.
      - label: "Train the hundred thousand"
        wealth_bp: -3000
        unrest_bp: 800
        outcome: >-
          Every province drills its ten thousand. The great families complain about losing their
          farmhands. Joseon will have an army when it needs one.
        deeds: {martial_bp: 3000, men: 20000}
      - label: "✦ Arm them with rifles, and train them in volleys"
        needs_adopted: [bessemer_steel]
        wealth_bp: -3000
        outcome: >-
          Korean smiths make long rifles of hard steel that kill at four hundred paces. The
          drill-masters train the provinces in volleys.
        deeds: {martial_bp: 5000, men: 20000}
    history: >-
      Yi I's proposal (c. 1583) to train 100,000 soldiers was not adopted; he died in 1584.
      Yu Seong-ryong recorded the regret in his Jingbirok.
    sources: ["Yulgok jeonseo", "Yu Seong-ryong, Jingbirok (tr. Byonghyon Choi, 2002)"]

  - id: jos_envoys
    scenario: sengoku
    civ: joseon
    year: 1590
    title: "Two Envoys, Two Reports"
    place: "Hanyang"
    speaker: steward
    speaker_name: "Kim Seong-il"
    speaker_title: "Deputy envoy to Japan, an Easterner"
    benchmark_provinces: 5
    story: >-
      A new ruler, Toyotomi Hideyoshi, has united Japan. His letter to you demanded that Joseon
      let his armies pass through to conquer Ming China. You sent envoys to see him.


      They have come back with different stories. The chief envoy, Hwang Yun-gil, a Westerner,
      says Hideyoshi's eyes shine with ambition and an invasion is certain. His deputy, Kim
      Seong-il, an Easterner, says Hideyoshi's eyes are like a rat's and he is not to be
      feared - and that frightening the people would be a mistake.
    choices:
      - label: "Believe Kim Seong-il"
        historical: true
        legitimacy_bp: -500
        unrest_bp: -500
        outcome: >-
          The court agrees with the Easterner. A few walls are repaired. In Japan, a hundred
          and sixty thousand men and seven hundred ships are gathering at Nagoya, on the coast
          of Kyushu.
      - label: "Believe Hwang Yun-gil, and prepare"
        wealth_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Walls are rebuilt, the southern garrisons reinforced, and the Ming warned. The people
          are frightened. When the Japanese come, they find the gates shut.
        deeds: {martial_bp: 2000}
    history: >-
      The envoys of 1590-91 gave contradictory reports; the court, dominated by Easterners,
      accepted Kim Seong-il's reassurance.
    sources: ["Jingbirok 1", "Seonjo sillok"]

  - id: jos_turtle
    scenario: sengoku
    civ: joseon
    year: 1591
    title: "The Turtle Ship"
    place: "Yeosu, Jeolla province"
    speaker: general
    speaker_name: "Yi Sun-sin"
    speaker_title: "Commander of the Left Navy of Jeolla"
    benchmark_provinces: 5
    story: >-
      Yu Seong-ryong, your chief minister, has used his influence to give a little-known
      officer, Yi Sun-sin, command of the Left Navy of Jeolla. Yi has been dismissed and
      demoted twice by jealous superiors. Now he is drilling his men, repairing his ships,
      stockpiling arrows - and building something new.


      It is a warship covered with a roof of spiked iron plates, with a dragon's head at the
      bow that breathes smoke, and cannon on every side. He calls it the turtle ship.
    choices:
      - label: "Let him build it"
        historical: true
        materials_bp: -1500
        legitimacy_bp: 800
        outcome: >-
          The first turtle ship fires its cannon in a trial on the twelfth day of the fourth
          month of 1592. The next day, the Japanese fleet appears off Busan.
        deeds: {ships: 30}
      - label: "Tell him to stop wasting money"
        wealth_bp: 500
        outcome: >-
          Yi obeys, and keeps drilling his men on the ships he has.
        deeds: {ships: 15}
      - label: "✦ Steam engines in the turtle ships"
        needs_adopted: [steamship]
        materials_bp: -2500
        legitimacy_bp: 1500
        outcome: >-
          Yi's turtle ships move without oars or wind, against any tide. No Japanese ship will be
          able to escape them.
        deeds: {ships: 50}
    history: >-
      Yi Sun-sin took command of the Jeolla Left Navy in 1591 and built the first turtle ships
      (geobukseon); his diary records a gunnery trial on 12 April 1592 (lunar), one day before
      the invasion.
    sources: ["Nanjung ilgi", "Jingbirok", "Hawley, The Imjin War (2005)"]

  - id: jos_busan
    scenario: sengoku
    civ: joseon
    year: 1592
    title: "The Fourteenth Day of the Fourth Month"
    place: "Hanyang"
    speaker: general
    speaker_name: "Sin Rip"
    speaker_title: "The hero of the northern frontier"
    benchmark_provinces: 5
    story: >-
      The Japanese have landed at Busan with tens of thousands of men carrying muskets. Busan
      fell in hours; at Dongnae, its magistrate Song Sang-hyeon sat in his robes at his post
      while the Japanese killed him. Konishi Yukinaga's army is marching on Hanyang.


      Your famous general Sin Rip, who beat the Jurchen with cavalry, wants to meet the
      Japanese on the open plain at Chungju, with the river behind him, so that his men cannot
      run away.
    choices:
      - label: "Let Sin Rip fight at Chungju - and leave Hanyang"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Sin Rip's cavalry charge into the Japanese volleys and are destroyed; he drowns himself
          in the river. You leave Hanyang in the rain at night; the people burn the palace and
          the slave registers behind you. You flee north to Pyongyang, and then to Uiju, on the
          Chinese border, and beg the Ming emperor for help. Within two months the Japanese hold
          most of Korea.
        deeds: {give: [c_hanyang, c_gyeongsang, c_pyongan]}
      - label: "Hold the mountain passes at Mungyeong"
        legitimacy_bp: 1000
        food_bp: -2000
        outcome: >-
          Your army blocks the Bird Pass in the mountains, where muskets are less use than
          rocks. The Japanese take Gyeongsang, but not Hanyang - not this summer.
        deeds: {give: [c_gyeongsang]}
    history: >-
      The Japanese invasion began on 23 May 1592 (14th day, 4th month); Sin Rip was defeated
      at Chungju, and Seonjo fled Hanyang, eventually to Uiju. Hanyang fell on 12 June.
    sources: ["Jingbirok 1", "Turnbull, Samurai Invasion (2002)", "Swope, A Dragon's Head and a Serpent's Tail (2009)"]

  - id: jos_hansan
    scenario: sengoku
    civ: joseon
    year: 1592
    after: [jos_busan]
    title: "The Crane's Wing"
    place: "Off the island of Hansan"
    speaker: general
    speaker_name: "Yi Sun-sin"
    speaker_title: "Commander of the Left Navy of Jeolla"
    benchmark_provinces: 2
    story: >-
      On land, everything is lost. At sea, Yi Sun-sin has won every fight: at Okpo, Sacheon,
      Dangpo, the turtle ship broke into the Japanese lines and burned their ships. Now the
      Japanese commander Wakisaka Yasuharu is coming with seventy-three ships to finish him.
      They are in the narrow strait of Gyeonnaeryang.


      Yi wants to draw them out into open water off Hansan island.
    choices:
      - label: "Lure them out, and close the crane's wing"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          Six of Yi's ships feign flight; the Japanese follow them out of the strait - into a
          great half-circle of Korean ships, like a crane spreading its wings. Fifty-nine
          Japanese ships are sunk or taken. The Japanese army in Korea will never get its
          supplies by sea up the western coast. The invasion stalls at Pyongyang.
        deeds: {ships: 20, martial_bp: 1000}
      - label: "Fight them in the strait"
        legitimacy_bp: 1000
        outcome: >-
          It is a hard fight in close water, and the turtle ships are the stars of it. Both
          fleets limp home.
    history: >-
      At Hansan island (14 August 1592) Yi Sun-sin's 'crane wing' formation destroyed Wakisaka's
      fleet, cutting the Japanese sea supply line along the west coast.
    sources: ["Nanjung ilgi", "Hawley (2005)"]

  - id: jos_ming
    scenario: sengoku
    civ: joseon
    year: 1593
    after: [jos_busan]
    title: "The Ming Army"
    place: "Uiju, on the Yalu"
    speaker: ming
    speaker_name: "Li Rusong"
    speaker_title: "Commander of the Ming relief army"
    needs_alive: [ming]
    benchmark_provinces: 2
    story: >-
      The Ming have come: forty thousand men under Li Rusong, with heavy cannon that fire
      flaming arrows and stone shot. In the depth of winter they storm Pyongyang and drive out
      Konishi Yukinaga. Righteous armies of Korean volunteers - farmers, slaves, Buddhist monks
      led by the old master Hyujeong - are fighting everywhere behind the Japanese lines.


      Li Rusong wants Korean guides and Korean grain. His soldiers are taking it anyway.
    choices:
      - label: "Give the Ming everything they ask"
        historical: true
        food_bp: -3000
        legitimacy_bp: 1500
        outcome: >-
          The Ming army marches south. It is ambushed at Byeokjegwan and loses heart, and the war
          becomes a long stalemate and negotiation. But at Haengju fortress, Gwon Yul's garrison -
          the women carrying stones in their aprons, the story goes - throws back a huge Japanese
          attack, and in the spring the Japanese leave Hanyang.
        deeds: {take: [c_hanyang, c_pyongan], ally_with: [ming]}
      - label: "Keep the grain for Korea's own armies"
        food_bp: -1000
        legitimacy_bp: 500
        outcome: >-
          The Ming army waits at Pyongyang. The righteous armies fight on.
        deeds: {take: [c_pyongan]}
    history: >-
      Ming troops under Li Rusong retook Pyongyang in February 1593; after Byeokjegwan and
      Gwon Yul's victory at Haengju, the Japanese evacuated Hanyang in May 1593.
    diverged: >-
      The Ming are gone; no army comes.
    sources: ["Jingbirok 2", "Swope (2009)"]

  - id: jos_twelve_ships
    scenario: sengoku
    civ: joseon
    year: 1597
    title: "I Still Have Twelve Ships"
    place: "Myeongnyang strait"
    speaker: general
    speaker_name: "Yi Sun-sin"
    speaker_title: "Restored to command"
    benchmark_provinces: 4
    story: >-
      Peace talks failed, and the Japanese have invaded again. Before they came, a Japanese
      double agent told your court where their fleet would sail, and you ordered Yi Sun-sin to
      attack. He refused, suspecting a trap. You had him arrested, tortured and sent to serve
      as a common soldier. His replacement, Won Gyun, took the whole fleet out and lost it at
      Chilcheollyang.


      Now Yi is back in command of what is left. You have written that he should give up the
      navy and fight on land. He has written back: 'I still have twelve ships.'
    choices:
      - label: "Let him fight at sea"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          With thirteen ships Yi waits in the Myeongnyang strait, where the tide runs like a
          river. A hundred and thirty Japanese ships come through. When the tide turns, it carries
          them back on one another, and Yi's cannon sink thirty-one. Not one Korean ship is
          lost.
        deeds: {ships: 13}
      - label: "Order him ashore"
        legitimacy_bp: -1000
        outcome: >-
          Yi obeys. The Japanese fleet sails up the west coast unopposed.
        deeds: {give: [c_jeolla]}
    history: >-
      At Myeongnyang (26 October 1597) Yi Sun-sin's 13 ships defeated a Japanese fleet of over
      a hundred in a narrow tidal strait.
    sources: ["Nanjung ilgi", "Seonjo sillok"]

  - id: jos_noryang
    scenario: sengoku
    civ: joseon
    year: 1598
    title: "Do Not Tell Them I Have Died"
    place: "The Noryang strait"
    speaker: general
    speaker_name: "Yi Sun-sin"
    speaker_title: "Admiral of the combined fleets"
    benchmark_provinces: 4
    story: >-
      Hideyoshi is dead in Japan, and his generals want to go home. Konishi Yukinaga is trapped
      at Suncheon and has bribed the Ming admiral to let him sail away. Yi Sun-sin will not let
      him. A great Japanese fleet is coming to rescue him through the Noryang strait.
    choices:
      - label: "Fight the last battle"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          In the dark before dawn the fleets meet. Two hundred Japanese ships are destroyed. As
          the sun rises, a bullet strikes Yi Sun-sin in the chest. 'The battle is at its height,'
          he says. 'Do not tell them I have died.' His nephew wears his armour and beats his drum
          until the battle is won. The Japanese are gone from Korea. Hanyang's palaces are ashes,
          and a third of the farmland lies waste.
        deeds: {take: [c_gyeongsang, c_jeolla]}
      - label: "Let them go home"
        legitimacy_bp: 500
        outcome: >-
          The Japanese sail home, and Yi Sun-sin lives. He is still alive when the court next
          decides it is jealous of him.
        deeds: {take: [c_gyeongsang]}
    history: >-
      At Noryang (16 December 1598) Yi Sun-sin destroyed much of the withdrawing Japanese fleet
      and was killed by a bullet; his last words are recorded by his nephew.
    sources: ["Nanjung ilgi", "Yi Bun, life of Yi Sun-sin", "Hawley (2005)"]
