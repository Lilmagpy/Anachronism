schema_version: 1
# Historical choices for the East Asia pack's moments (D-104).
dilemmas:
  - id: shang_yang
    title: Shang Yang's reforms
    text: "A minister from Wei, Shang Yang, proposes to remake {civ}: rewards for farming and fighting, collective punishment, the old nobility stripped of its privileges."
    chance_bp: 8000
    scenarios: [warring_states]
    civs: [qin]
    choices:
      - {label: "Enact them all", outcome: "Qin becomes a machine for farming and war. The nobles hate it - and Shang Yang.", food_bp: 1500, legitimacy_bp: 800, unrest_bp: 800, influence: {nobility: -2000}, idea: written_law}
      - {label: "Only the farming laws", outcome: "More land is ploughed; the old order is spared.", food_bp: 1000}
      - {label: "Send him away", outcome: "The nobles are relieved. Shang Yang takes his ideas to another court.", influence: {nobility: 800}}

  - id: arthashastra
    title: Chanakya's book of statecraft
    text: "Chanakya has written down the art of ruling: spies in every village, taxes on everything, treaties made to be broken. {ruler} must decide how to rule."
    chance_bp: 6000
    scenarios: [maurya]
    civs: [maurya]
    choices:
      - {label: "Rule by the book", outcome: "Spies, censuses and tax collectors everywhere. The treasury fills; no one dares complain aloud.", wealth_bp: 2500, legitimacy_bp: 500, unrest_bp: 800, idea: census}
      - {label: "Temper it with mercy", outcome: "The harsher chapters stay on the shelf. The people breathe easier.", wealth_bp: 800, unrest_bp: -500}

  - id: yassa
    title: The Great Yassa
    text: "The tribes are one now, but each has its own customs and feuds. {ruler} can give them one law."
    chance_bp: 7000
    scenarios: [great_khan]
    civs: [mongols]
    choices:
      - {label: "Proclaim one law for all", outcome: "The Yassa: no theft, no feuds, death for treachery. The steppe has never been so orderly.", legitimacy_bp: 1200, unrest_bp: -800, idea: written_law}
      - {label: "Let each tribe keep its ways", outcome: "The chiefs are pleased. The feuds go on.", influence: {nobility: 800}, unrest_bp: 400}

  - id: captured_artisans
    title: The craftsmen of the conquered city
    text: "The city has fallen. Among the prisoners are weavers, smiths, engineers and scribes."
    chance_bp: 4000
    scenarios: [great_khan]
    civs: [mongols]
    at_war: true
    choices:
      - {label: "Spare them and bring them home", outcome: "Caravans of artisans go east. The camps grow workshops; the khan's army gets engineers.", materials_bp: 2000, knowledge_bp: 1500, idea: surveying}
      - {label: "Make an example", outcome: "The other cities hear of it, and some open their gates without a fight.", unrest_bp: -200, legitimacy_bp: 400}

  - id: tanegashima
    title: The Portuguese guns
    text: "Portuguese traders landed on Tanegashima with fire-lances that kill at a hundred paces. Smiths in Sakai are already copying them. {ruler} can buy as many as the treasury allows."
    chance_bp: 7000
    scenarios: [sengoku]
    choices:
      - {label: "Buy every gun in Sakai", outcome: "Rows of gunners, firing in turns. No samurai charge will ever be the same.", wealth_bp: -2500, idea: musket}
      - {label: "Trust the sword", outcome: "Guns are for peasants. The samurai approve.", influence: {nobility: 600}}
