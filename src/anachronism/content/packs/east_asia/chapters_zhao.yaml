schema_version: 1
# Chronicle mode (D-120, D-144): Zhao, from King Wuling's horsemen to the fall of Handan,
# 307-228 BC. Each chapter opens in its year; one choice is what history chose.
# Facts follow Sima Qian's Shiji (the house of Zhao, and the lives of Lian Po and Lin
# Xiangru, Lord Pingyuan, Bai Qi and Li Mu) and the Zhanguo ce, with legends marked as
# such; the numbers of the dead are the traditional ones. benchmark_provinces counts the
# provinces of this map the real Zhao held at that date.
chapters:
  - id: zhao_hu_clothing
    scenario: warring_states
    civ: zhao
    year: -307
    title: "Trousers and Bows"
    place: "Handan"
    speaker: steward
    speaker_name: "Prince Cheng"
    speaker_title: "Your uncle"
    benchmark_provinces: 3
    story: >-
      North of Zhao the steppe begins, and the horse peoples - the Linhu, the Loufan, the
      Donghu - ride faster and shoot better than any of your chariot crews. You, King Wuling,
      have decided that Zhao will learn from them: your soldiers will wear the short tunics
      and trousers of the Hu instead of long robes, and ride horses and shoot from the saddle.


      Your uncle Prince Cheng says that the Middle Kingdom is where the sages taught and the
      rites are kept; that barbarians copy China, not China barbarians. He is pretending to be
      ill so as not to have to wear trousers to court.
    choices:
      - label: "Visit your uncle, and change his mind"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: -1000}
        outcome: >-
          You go to your uncle's house in person and argue for a day: the rites serve the
          people, not the other way round; the sages changed their customs to suit their
          times. He gives way and comes to court in Hu clothes. Within a few years Zhao has the
          best cavalry in China, and the horse peoples of the north are paying you tribute.
        deeds: {martial_bp: 4000, take: [ordos_linhu, loufan]}
      - label: "Strengthen the chariots with crossbows"
        legitimacy_bp: 1000
        wealth_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          The chariots stay, with crossbowmen beside them in ranks. The Hu horsemen go on
          raiding, a little less boldly than before.
        deeds: {martial_bp: 1500}
      - label: "✦ Give the new cavalry stirrups as well"
        needs_adopted: [stirrup]
        legitimacy_bp: 2000
        outcome: >-
          With iron stirrups your horsemen can shoot backwards at a gallop and charge with
          lances without being thrown. The Hu chiefs come to Handan to ask how it is done.
        deeds: {martial_bp: 6000, take: [ordos_linhu, loufan]}
      - label: "Hire Hu horsemen as auxiliaries"
        legitimacy_bp: 1500
        wealth_bp: -300
        outcome: >-
          Hu chiefs who have quarrelled with their neighbours bring their riders to your
          banner for pay. They fight well, and they leave when the silk stops, and your own
          men go on wearing robes.
        deeds: {men: 6000, martial_bp: 1500}
    history: >-
      In 307 BC King Wuling ordered 'Hu clothing and mounted archery' (hu fu qi she) and
      persuaded his uncle Prince Cheng; Zhao defeated the Linhu and Loufan and built new
      commanderies in the north.
    sources: ["Shiji 43", "Zhanguo ce, Zhao 2"]

  - id: zhao_zhongshan
    scenario: warring_states
    civ: zhao
    year: -300
    until_year: -294
    title: "Zhongshan"
    place: "Before Lingshou"
    speaker: general
    speaker_name: "Your cavalry commander"
    speaker_title: "Of the new horse archers"
    needs_alive: [zhongshan]
    benchmark_provinces: 5
    story: >-
      In the middle of your kingdom, between Handan and your northern lands, sits the little
      state of Zhongshan, founded by the White Di people and grown rich and cultivated. Its
      kings have bronze vessels inscribed with long poems; they have called themselves kings
      for twenty years, like you.


      Your new horsemen have been raiding it for five years. Lingshou, its capital, is ready
      to fall.
    choices:
      - label: "Conquer Zhongshan"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Lingshou falls; its king is exiled to Fushi. Zhongshan is gone, and your kingdom is
          joined north to south for the first time. The tombs of its kings will be found, full
          of bronze, in 1974.
        deeds: {war_with: [zhongshan], conquer: [zhongshan]}
      - label: "Make Zhongshan a vassal"
        wealth_bp: 700
        legitimacy_bp: 1000
        outcome: >-
          Zhongshan's king kneels and pays. He waits for a better day.
        deeds: {tributaries: [zhongshan]}
      - label: "Raid its border towns and wait"
        legitimacy_bp: 600
        unrest_bp: 300
        outcome: >-
          Your horse archers burn the harvest in the border towns, and withdraw before the
          garrisons can come out. Zhongshan is weaker every autumn, and so are you.
        deeds: {men: 4000, martial_bp: 1500}
    history: >-
      Zhao conquered Zhongshan between 300 and 296 BC. The royal tombs at Pingshan, excavated
      from 1974, yielded famous inscribed bronzes.
    diverged: >-
      Zhongshan is gone already.
    sources: ["Shiji 43", "Hebei Provincial Institute, Cuo mu (1995)"]

  - id: zhao_zhufu
    scenario: warring_states
    civ: zhao
    year: -299
    title: "The Father of the Ruler"
    place: "Handan"
    speaker: steward
    speaker_name: "Fei Yi"
    speaker_title: "Chief minister"
    benchmark_provinces: 5
    story: >-
      You have an idea no king has had. You will give the throne now to your young son He,
      and call yourself Zhufu, 'Father of the Ruler', and keep command of the army. The boy can
      deal with the rites and the paperwork; you will conquer.


      You mean to go to Qin yourself, disguised as an envoy, to see its king and its roads with
      your own eyes. Your minister Fei Yi asks about your eldest son, Prince Zhang, whom you
      passed over for He.
    choices:
      - label: "Abdicate and keep the army"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          King Huiwen is crowned at eleven. You travel to Qin as your own envoy; the king of
          Qin, struck by the envoy's bearing, sends after him - too late. You are back in Zhao,
          laughing. But Prince Zhang is brooding.
        deeds: {ruler_falls: "gives the throne to his son and calls himself Zhufu"}
      - label: "Stay king as before"
        legitimacy_bp: 800
        outcome: >-
          You stay on the throne. Your sons wait.
      - label: "Give Prince Zhang a fief in Dai"
        legitimacy_bp: 400
        wealth_bp: -300
        outcome: >-
          Zhang is given Dai with a title and a household. He thanks you in the proper words,
          and the court wonders whether a fief is a reward or a place to put him.
    history: >-
      Wuling abdicated in 299 BC in favour of his son He (King Huiwen) and took the title
      Zhufu; he visited Qin in disguise. In 295 BC Prince Zhang's revolt ended with Wuling
      starved to death in the palace at Shaqiu.
    sources: ["Shiji 43"]

  - id: zhao_jade
    scenario: warring_states
    civ: zhao
    year: -283
    title: "The Jade Returned Intact"
    place: "Handan"
    speaker: scholar
    speaker_name: "Lin Xiangru"
    speaker_title: "Retainer of the chief eunuch"
    needs_alive: [qin]
    benchmark_provinces: 6
    story: >-
      Zhao owns the jade disc of Mr He, the most famous jewel in the world. The King of Qin has
      written offering fifteen cities for it. Nobody believes he will hand them over. Nobody
      dares refuse.


      Lin Xiangru, a retainer of your chief eunuch, a nobody, says he will take the jade to
      Qin: if the cities are given, he will leave it; if not, he will bring it back intact.
    choices:
      - label: "Send Lin Xiangru with the jade"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The King of Qin passes the jade around his concubines and says nothing of cities. Lin
          Xiangru says there is a flaw in it, takes it back to show him, backs against a pillar
          and threatens to smash his head and the jade together. While Qin performs five days of
          purification for the handover, Lin's servant slips back to Zhao with the jade in his
          clothes. The King of Qin, outwitted, lets Lin go. You make him a high minister.
      - label: "Send the jade with an envoy"
        legitimacy_bp: -1000
        wealth_bp: -500
        outcome: >-
          The jade goes to Qin. The fifteen cities do not come back.
      - label: "Refuse, and guard the frontier"
        legitimacy_bp: 1500
        wealth_bp: -300
        outcome: >-
          You write that the jade is Zhao's and will stay in Zhao, and send soldiers to the
          passes. Qin makes no answer but its envoys leave early, and every officer on the
          western border is told to sleep with his armour on.
        deeds: {men: 3000}
    history: >-
      The story of Lin Xiangru 'returning the jade intact to Zhao' (wan bi gui Zhao), around
      283 BC, is told in Shiji 81 and is still a Chinese proverb.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 81"]

  - id: zhao_thorns
    scenario: warring_states
    civ: zhao
    year: -279
    title: "Thorns on His Back"
    place: "Handan"
    speaker: general
    speaker_name: "Lian Po"
    speaker_title: "Your great general"
    benchmark_provinces: 6
    story: >-
      At the meeting of kings at Mianchi, the King of Qin ordered you to play the zither for
      him, and had it written in the Qin records. Lin Xiangru stepped forward with a clay pot
      and asked the King of Qin to beat it for you - and when he refused, said he was close
      enough to spatter the king with his blood. Qin beat the pot.


      You have made Lin Xiangru chief minister, above Lian Po, your general, who has fought
      for Zhao for thirty years. Lian Po says he will humiliate this upstart the next time he
      meets him. Lin Xiangru has been avoiding him, turning his carriage aside in the street.
    choices:
      - label: "Let the two of them sort it out"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          Lin Xiangru's servants ask why he runs from Lian Po. 'Qin does not attack us,' he
          says, 'because the two of us are here. If two tigers fight, one will die.' Lian Po
          hears of it, strips to the waist, ties a bundle of thorns on his back, and goes to Lin
          Xiangru's door to beg forgiveness. They become friends to the death.
        deeds: {martial_bp: 1000}
      - label: "Demote Lin Xiangru to please Lian Po"
        influence: {nobility: 1000}
        legitimacy_bp: -500
        outcome: >-
          Lian Po is satisfied. Lin Xiangru retires to his estates, and Qin's envoys begin to
          find Handan easier to deal with.
        deeds: {martial_bp: 500}
      - label: "Send Lian Po off to the frontier"
        legitimacy_bp: 2200
        outcome: >-
          Lian Po is given a command on the frontier and a reason to ride out of Handan. He
          comes back with victories, and with no better opinion of Lin Xiangru.
        deeds: {men: 3000, martial_bp: 1500}
    history: >-
      The meeting at Mianchi (279 BC) and Lian Po's apology 'carrying thorns' (fu jing qing
      zui) are told in Shiji 81; the phrase is still used for a humble apology.
    sources: ["Shiji 81"]

  - id: zhao_yuyu
    scenario: warring_states
    civ: zhao
    year: -269
    until_year: -265
    title: "Two Rats in a Hole"
    place: "Yuyu"
    speaker: general
    speaker_name: "Zhao She"
    speaker_title: "A tax collector turned general"
    needs_alive: [qin]
    benchmark_provinces: 6
    story: >-
      A Qin army is besieging Yuyu, deep in the mountains. Lian Po says the road is too long
      and narrow to relieve it. Zhao She, who was a tax collector until recently, says: 'The
      road is long and narrow - it is like two rats fighting in a hole. The bravest will win.'
    choices:
      - label: "Send Zhao She to relieve Yuyu"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Zhao She marches out of Handan, stops after thirty li, and builds a fortified camp for
          twenty-eight days, while Qin's spies report that he is afraid. Then he marches two
          days and a night, seizes the heights above the Qin army, and destroys it. You make him
          Lord Mafu.
        deeds: {war_with: [qin], grudges: {qin: 2000}}
      - label: "Leave Yuyu to its fate"
        legitimacy_bp: -800
        wealth_bp: 300
        outcome: >-
          Yuyu falls. Qin's generals note that Zhao gives way.
      - label: "Send Lian Po instead"
        legitimacy_bp: 2700
        wealth_bp: -500
        outcome: >-
          Lian Po takes the road with a larger army and a longer baggage train, and arrives
          after twenty days with his men tired and his plans untried. The Qin army has had
          time to dig in.
        deeds: {men: 5000}
    history: >-
      Zhao She defeated Qin at Yuyu in 269 BC. His son was Zhao Kuo.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 81"]

  - id: zhao_shangdang
    scenario: warring_states
    civ: zhao
    year: -262
    until_year: -258
    title: "A Gift of Seventeen Cities"
    place: "Handan"
    speaker: han
    speaker_name: "Feng Ting"
    speaker_title: "Governor of Shangdang, in the state of Han"
    needs_owner: {han_shangdang: han}
    benchmark_provinces: 7
    story: >-
      Qin has cut the Han commandery of Shangdang off from the rest of Han. Han has told its
      governor, Feng Ting, to surrender Shangdang to Qin. Instead he has come to you: the
      seventeen walled towns of Shangdang will give themselves to Zhao, he says, rather than
      be Qin's.


      Your uncle Lord Pingyang says that a gift like this is a disaster: Qin has spent years
      cutting Shangdang off and will fight to the death for it. Lord Pingyuan says: when do
      we ever get seventeen cities for nothing?
    choices:
      - label: "Accept the seventeen cities"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Shangdang becomes Zhao's. Qin's army marches. Lian Po digs in at Changping with
          Zhao's whole army.
        deeds: {take: [han_shangdang], war_with: [qin]}
      - label: "Decline the offer politely"
        legitimacy_bp: 500
        wealth_bp: 500
        outcome: >-
          Feng Ting goes back to Shangdang, and Qin takes it. Zhao is not at war - this year.
        deeds: {peace_with: [qin]}
      - label: "Send grain and men, but not take it"
        legitimacy_bp: 800
        food_bp: -500
        outcome: >-
          You send grain and a few thousand men to the seventeen towns, and let their governor
          answer to Han in name. Qin counts every one of the soldiers.
        deeds: {men: 4000}
    history: >-
      In 262 BC Feng Ting offered Shangdang to Zhao, which accepted against Lord Pingyang's
      advice. This led to the battle of Changping.
    diverged: >-
      Shangdang is not Han's to give.
    sources: ["Shiji 43, 73"]

  - id: zhao_changping
    scenario: warring_states
    civ: zhao
    year: -260
    until_year: -256
    title: "The General Who Had Read Every Book"
    place: "Changping"
    speaker: general
    speaker_name: "Lian Po"
    speaker_title: "Commander at Changping"
    needs_war_with: [qin]
    benchmark_provinces: 7
    story: >-
      For three years Lian Po has sat behind his walls at Changping, refusing every Qin
      challenge. The granaries of Zhao are emptying into the valley. In Handan a rumour is
      everywhere: the only Zhao general Qin fears is young Zhao Kuo, son of Zhao She, who has
      read every book on war and can quote them all.


      You are impatient. Lin Xiangru, old and ill, says Zhao Kuo knows his father's books but
      not how to adapt them. Zhao Kuo's own mother has asked you not to appoint him: his
      father, she says, never thought him fit to command.
    choices:
      - label: "Replace Lian Po with Zhao Kuo"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Zhao Kuo changes every arrangement and attacks. The Qin army - commanded in secret by
          Bai Qi - falls back, lets him come on, and closes behind him. Forty-six days later,
          starving, the army of Zhao surrenders. The histories say four hundred thousand were
          put to death; two hundred and forty boys were sent home to tell Zhao.
        deeds: {martial_bp: -5000, give: [han_shangdang], give_to: qin}
      - label: "Keep Lian Po, and keep waiting"
        food_bp: -3000
        legitimacy_bp: 500
        outcome: >-
          Lian Po holds. Qin's granaries are emptying too. In the autumn both armies are
          starving, and both go home.
        deeds: {peace_with: [qin]}
      - label: "Ask Qin for a truce on terms"
        legitimacy_bp: -1000
        wealth_bp: -1500
        unrest_bp: 500
        outcome: >-
          Your envoys cross the lines with silk and an offer. Qin hears them out and keeps
          them waiting, while its army digs in a little deeper.
        deeds: {peace_with: [qin]}
    history: >-
      In 260 BC Zhao replaced Lian Po with Zhao Kuo; at Changping Bai Qi surrounded and
      destroyed his army. Mass graves have been excavated at Yonglu, Gaoping.
    diverged: >-
      There is no war with Qin at Changping.
    sources: ["Shiji 73, 81", "Shanxi Provincial Institute report (1996)"]

  - id: zhao_mao_sui
    scenario: warring_states
    civ: zhao
    year: -258
    until_year: -255
    title: "The Awl in the Bag"
    place: "Handan, besieged"
    speaker: steward
    speaker_name: "Lord Pingyuan"
    speaker_title: "Your uncle, chief minister"
    needs_war_with: [qin]
    needs_owner: {zhao_handan: zhao}
    benchmark_provinces: 6
    story: >-
      Qin is besieging Handan. The people are eating their children. Lord Pingyuan is going to
      Chu to beg for an alliance, and wants twenty of his three thousand retainers to come
      with him; he has nineteen. A retainer called Mao Sui, whom no one has noticed in three
      years, asks to be the twentieth.


      'A talented man is like an awl in a bag,' Pingyuan tells him. 'The point soon pokes
      through. I have never heard of you.' Mao Sui says: 'Then put me in the bag today.'
    choices:
      - label: "Take Mao Sui as the twentieth"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          In Chu, the talks drag on all day. Mao Sui climbs the steps with his hand on his sword
          and tells the King of Chu that within ten paces the king's life is in his hands. The
          alliance is sworn in blood. Chu's army marches; and in Wei, Lord Xinling steals his
          brother's tiger tally and brings Wei's army too. Qin is driven from Handan.
        deeds: {ally_with: [chu, wei], peace_with: [qin]}
      - label: "Go with the nineteen you have"
        legitimacy_bp: 2000
        wealth_bp: -500
        outcome: >-
          Chu's king listens, and Pingyuan argues for a day and sends back to Handan for more
          gifts, and in the end the alliance is sworn, at a price.
        deeds: {ally_with: [chu]}
      - label: "Send to Lord Xinling of Wei first"
        legitimacy_bp: 1500
        wealth_bp: -300
        outcome: >-
          A second party goes to Wei, where Lord Xinling is your kinsman by marriage. He will
          do what he can, but the king of Wei is afraid of Qin and stays at home.
        deeds: {ally_with: [wei]}
    history: >-
      Mao Sui's self-recommendation (Mao Sui zi jian) and the Chu alliance of 258 BC are told
      in Shiji 76; with Wei's Lord Xinling, Chu relieved Handan in 257.
    diverged: >-
      Handan is not besieged.
    sources: ["Shiji 76, 77"]

  - id: zhao_li_mu_frontier
    scenario: warring_states
    civ: zhao
    year: -244
    title: "The Frontier General"
    place: "Yanmen, on the northern frontier"
    speaker: general
    speaker_name: "Li Mu"
    speaker_title: "Commander of the north"
    benchmark_provinces: 6
    story: >-
      For years Li Mu has commanded the northern frontier against the Xiongnu horsemen and has
      refused to fight them: when they raid, his men retreat into the forts with the herds. The
      Xiongnu think he is a coward; so did your father, who replaced him - and the new man
      fought, and lost every time. Now Li Mu is back, and says he is ready.


      He wants to let the Xiongnu capture a few herds and herders, to draw their whole army
      south.
    choices:
      - label: "Let Li Mu spring his trap"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          The Xiongnu chief comes south with his whole host after the bait. Li Mu's chariots,
          cavalry, archers and infantry close round them. More than a hundred thousand horsemen
          are killed. For ten years no Xiongnu dares come near the Zhao frontier.
        deeds: {martial_bp: 1500}
      - label: "Tell him to stay behind his walls"
        legitimacy_bp: -300
        wealth_bp: 700
        outcome: >-
          The Xiongnu raid as they please. The border farmers pay in blood, and your treasury
          is spared the cost of a campaign.
      - label: "Let Li Mu raid their winter camps"
        legitimacy_bp: 1800
        wealth_bp: 300
        outcome: >-
          Li Mu's cavalry rides out in the snow, finds the herds in their winter pastures, and
          drives off what it can. It is a hard campaign, and the Xiongnu are not broken by it.
        deeds: {men: 3000}
    history: >-
      Li Mu's great victory over the Xiongnu, around 244 BC, is described in Shiji 81.
    sources: ["Shiji 81"]

  - id: zhao_li_mu
    scenario: warring_states
    civ: zhao
    year: -229
    until_year: -224
    title: "The Rumour about Li Mu"
    place: "Handan"
    speaker: steward
    speaker_name: "Guo Kai"
    speaker_title: "Your favourite minister"
    needs_war_with: [qin]
    needs_alive: [qin]
    benchmark_provinces: 5
    story: >-
      Li Mu, the last great general of Zhao, has beaten the Qin armies twice in five years.
      Now the Qin general Wang Jian is attacking again, and Li Mu is holding him.


      Your minister Guo Kai, who has always hated Li Mu, brings you a report: Li Mu is
      plotting with Qin to betray you. Others at court say that Guo Kai has always had his own reasons.
    choices:
      - label: "Replace Li Mu, and arrest him"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 3000
        outcome: >-
          Li Mu refuses to give up his command in the middle of a war. Your men seize him and
          put him to death. Three months later Wang Jian breaks the Zhao army; Handan falls, and
          you are taken prisoner. Your brother Jia escapes to Dai with a few hundred men.
        deeds: {ruler_falls: "is captured by Qin", give: [zhao_handan, zhao_jinyang], give_to: qin}
      - label: "Have Guo Kai arrested instead"
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          Guo Kai's house is searched; Qin gold is found. Li Mu holds the line. Qin's spies have
          wasted their money.
        deeds: {martial_bp: 500, grudges: {qin: 2000}}
      - label: "Send an inspector to Li Mu's camp"
        legitimacy_bp: -500
        wealth_bp: -300
        unrest_bp: 800
        outcome: >-
          Your inspector counts the supplies, questions the officers, and reports that
          nothing is quite as it should be. Li Mu, who is no fool, has noticed what the visit
          means.
    history: >-
      Bribed by Qin, Guo Kai slandered Li Mu, who was executed in 229 BC. Handan fell in 228
      and King Youmiu was captured; Prince Jia held Dai until 222.
    diverged: >-
      Qin is gone, or at peace with Zhao.
    sources: ["Shiji 43, 81", "Zhanguo ce, Zhao 4"]
