schema_version: 1
# Chronicle mode (D-120, D-136): the Mongol empire from the great assembly to the fall of
# the Song, 1206-1279. Each chapter opens in its year; one choice is what history chose.
# Facts follow the Secret History of the Mongols (c. 1228/1252), Rashid al-Din's
# Compendium of Chronicles, Juvaini, the Yuan shi, Song and Korean records, Marco Polo, and
# modern work by de Rachewiltz, Allsen, Atwood, Biran, May and Rossabi. The map ends east
# of Khwarazm, so the western campaigns happen beyond its edge. benchmark_provinces counts
# the provinces of this map the real Mongols held at that date.
chapters:
  - id: mgl_kurultai
    scenario: great_khan
    civ: mongols
    year: 1206
    title: "The Assembly on the Onon"
    place: "The source of the Onon river"
    speaker: scholar
    speaker_name: "Shigi Qutuqu"
    speaker_title: "Your adopted brother, the supreme judge"
    benchmark_provinces: 6
    story: >-
      The white standard with nine tails flies over the Onon. Every tribe of the felt-walled
      tents has come: Tatars, Kereyids, Naimans, Merkits - the peoples you have spent twenty
      years fighting, now kneeling. The shaman Teb Tengri has declared that Heaven has made
      you Genghis Khan, the oceanic ruler.


      But tribes that knelt can stand up again. Your adopted brother Shigi Qutuqu, whom
      your mother found in a burned camp as a child, has a plan: break the tribes apart for
      ever. Every man between fifteen and seventy in a unit of ten; tens into hundreds,
      hundreds into thousands, under captains you choose for loyalty, not birth. And write
      down the judgements in a blue book, in the Uyghur letters a captured scribe has taught
      him.
    choices:
      - label: "Replace the tribes with new army units"
        historical: true
        legitimacy_bp: 2000
        influence: {nobility: -1500}
        outcome: >-
          Ninety-five thousands are drawn up; a shepherd's son can command one, and a prince's
          son can serve in one. A guard of ten thousand - your keshig - lives around your tent,
          and the sons of every commander serve in it as hostages and students. The old tribes
          dissolve into the army. The judgements go into the Blue Book.
        deeds: {martial_bp: 4000}
      - label: "Keep the tribes, and rule through their chiefs"
        legitimacy_bp: 800
        influence: {nobility: 1500}
        outcome: >-
          The chiefs swear to you and go home to their own people. They will ride when you
          call - most of them, most of the time.
        deeds: {martial_bp: 1000}
      - label: "Set your own captains over each tribe"
        legitimacy_bp: 2500
        wealth_bp: -300
        influence: {nobility: -500}
        outcome: >-
          Each tribe keeps its name, its herds and its old customs, and a captain of your own
          choosing rides at its head. It is quicker than rebuilding the whole army, and the
          elders, glad of an order that leaves their camps alone, accept your word. The tribes
          obey you for as long as the captains do.
        deeds: {martial_bp: 2000}
    history: >-
      At the quriltai of 1206 Temujin was proclaimed Chinggis Khan. He organised the steppe
      into 95 decimal 'thousands' under loyal commanders, created the keshig guard, and
      appointed Shigi Qutuqu supreme judge, recording decisions in the Uyghur script.
    sources: ["Secret History of the Mongols 202-234", "Atwood, Encyclopedia of Mongolia (2004)"]

  - id: mgl_teb_tengri
    scenario: great_khan
    civ: mongols
    year: 1207
    title: "The Shaman's Back"
    place: "Your camp on the Kherlen"
    speaker: diviner
    speaker_name: "Teb Tengri"
    speaker_title: "The great shaman"
    benchmark_provinces: 6
    story: >-
      Teb Tengri, who rides to Heaven on a white horse and speaks with the spirits, says that
      Heaven has told him something else now: that your brother Qasar will rule after you.
      His seven brothers have beaten your youngest brother Temuge in front of his own people.
      Men are leaving their units to follow the shaman.


      Your wife Borte weeps and says that if they do this while you live, what will they do
      to your sons when you are dead? Temuge asks for permission to wrestle the shaman.
    choices:
      - label: "Let Temuge wrestle him, outside the tent"
        historical: true
        legitimacy_bp: 2000
        influence: {clergy: -1500}
        outcome: >-
          Three strong men are waiting outside. They break Teb Tengri's back and throw him by
          a cart. You put a tent over the body and close the smoke hole; on the third night,
          they say, the body rises up through the roof and is gone. You announce that Heaven
          stopped loving him. No shaman will ever again stand between you and the sky.
      - label: "Exile the shaman and his brothers"
        legitimacy_bp: 600
        unrest_bp: 800
        outcome: >-
          Teb Tengri rides north with his family to the forest peoples, still talking to
          Heaven. Heaven, some of your men suspect, may still be listening.
      - label: "Call the shaman before the assembly"
        legitimacy_bp: 1800
        unrest_bp: 300
        influence: {clergy: -500}
        outcome: >-
          Teb Tengri and your brothers are summoned before the chiefs to answer in the open. He
          speaks well, but your brothers answer him point by point, and the assembly turns
          against the man who beat a prince. His followers, humiliated, will not forget it.
    history: >-
      The Secret History tells how Chinggis Khan let Temuge kill the shaman Kokochu (Teb
      Tengri) after he tried to divide the royal family, ending the shamans' political power.
    sources: ["Secret History of the Mongols 244-246"]

  - id: mgl_forest
    scenario: great_khan
    civ: mongols
    year: 1207
    title: "The Peoples of the Forest"
    place: "The edge of the taiga"
    speaker: general
    speaker_name: "Jochi"
    speaker_title: "Your eldest son"
    benchmark_provinces: 6
    story: >-
      North of the steppe, the grassland gives way to forest: the Oirats, the Buryats, the
      Kirghiz of the upper Yenisei, reindeer hunters and fur-trappers who have never paid
      anyone tribute. Your eldest son Jochi, twenty-five, wants his first command.
    choices:
      - label: "Send Jochi into the forest"
        historical: true
        legitimacy_bp: 800
        wealth_bp: 800
        outcome: >-
          The Oirat chief comes out of the forest to meet Jochi and leads him to the others.
          The Kirghiz submit without a fight and send white gyrfalcons, white geldings and
          black sables. Jochi comes home with the forest peoples' chiefs behind him.
        deeds: {take: [g_baikal, g_tuva, g_kirghiz]}
      - label: "Leave the forest to its hunters"
        legitimacy_bp: -200
        wealth_bp: 300
        outcome: >-
          The forest stays quiet, and so does its fur trade.
      - label: "Send envoys with gifts to the chiefs"
        legitimacy_bp: 500
        wealth_bp: -300
        outcome: >-
          Your envoys ride into the taiga with silk and iron. The Buryat chiefs take the gifts
          and send tribute, and the others say that they will think about it.
        deeds: {take: [g_baikal]}
      - label: "Send a general with a small force"
        legitimacy_bp: 500
        wealth_bp: 800
        outcome: >-
          A few thousand horsemen ride into the trees under an experienced captain. They bring
          back furs worth more than the whole expedition cost, and some chiefs' sons as
          hostages; the forest's deeper valleys are left alone.
        deeds: {men: 2000, take: [g_tuva]}
    history: >-
      In 1207 Jochi led the campaign that brought the Oirats, Buryats, Kirghiz and other forest
      peoples under Mongol rule.
    sources: ["Secret History of the Mongols 239"]

  - id: mgl_tangut
    scenario: great_khan
    civ: mongols
    year: 1209
    until_year: 1214
    title: "The Dyke at Zhongxing"
    place: "Before the Tangut capital"
    speaker: general
    speaker_name: "Muqali"
    speaker_title: "Commander of the left wing"
    needs_alive: [western_xia]
    benchmark_provinces: 9
    story: >-
      Your horsemen have swept through the Tangut kingdom of Xia and beaten its armies in the
      field. Now they are sitting outside its capital, Zhongxing, on the Yellow River, and
      they do not know how to take walls. Nobody in your army has ever besieged a city.


      Muqali has an idea: the city is low and the river is high. Dam the river, and drown
      them.
    choices:
      - label: "Divert the river against the walls"
        historical: true
        legitimacy_bp: 1200
        outcome: >-
          The water rises around the walls - and then the dyke bursts and floods your own
          camp. It hardly matters: the Tangut king, frightened and hungry, submits anyway. He
          gives you his daughter, camels, falcons and cloth, and promises to be your right
          hand in war. You have learned that you need engineers.
        deeds: {war_with: [western_xia], tributaries: [western_xia]}
      - label: "Raid the countryside and go home rich"
        wealth_bp: 2000
        deeds: {martial_bp: 300, grudges: {western_xia: 2000}}
        outcome: >-
          Your army comes home with herds and captives. The Tangut rebuild their towns and
          close their gates.
      - label: "✦ Bring Chinese engineers and dynamite"
        needs_adopted: [dynamite]
        legitimacy_bp: 2000
        outcome: >-
          A few carts of a strange yellow paste, packed into a tunnel under the walls, bring
          down a whole gatehouse. Zhongxing surrenders that afternoon.
        deeds: {war_with: [western_xia], conquer: [western_xia]}
      - label: "Starve the city with a long blockade"
        legitimacy_bp: 800
        wealth_bp: -500
        outcome: >-
          Your horsemen ring Zhongxing and cut every road to it. It is slow, cold work for
          steppe riders, and the Tangut have granaries, but by the second winter the city is
          sending envoys, and the camps talk of your patience.
        deeds: {men: 3000}
    history: >-
      In 1209 the Mongols besieged Zhongxing (Yinchuan); their attempt to flood the city
      broke its dyke and flooded their own camp, but Xia submitted and gave a princess in
      marriage.
    diverged: >-
      The Tangut are gone already.
    sources: ["Yuan shi 1", "Rashid al-Din", "Dunnell, The Great State of White and High (1996)"]

  - id: mgl_uyghurs
    scenario: great_khan
    civ: mongols
    year: 1209
    title: "The Idiqut's Letter"
    place: "Your camp on the Kherlen"
    speaker: uyghurs
    speaker_name: "Envoy of Barchuq"
    speaker_title: "From the Idiqut of the Uyghurs"
    needs_alive: [uyghurs]
    benchmark_provinces: 9
    story: >-
      The Idiqut of the Uyghurs, in his oasis city of Qocho, has killed the tax-collector of
      the Gurkhan of Qara Khitai - shut him in a tower and pulled it down on top of him.
      Now his envoy is here with a letter. 'If the khan will show me his favour,' it says,
      'I will be his fifth son.'


      The Uyghurs are rich, settled and literate: their merchants know every road to the
      west, and their scribes can write anything.
    choices:
      - label: "Accept Barchuq into your family"
        historical: true
        legitimacy_bp: 1000
        knowledge_bp: 1500
        outcome: >-
          Barchuq comes in person with gold, silver, pearls and silk. You give him your
          daughter, and he becomes the first ruler to join the empire of his own accord.
          Uyghur scribes will run your chancery for a century; your own Mongolian will be
          written in their script until today.
        deeds: {ally_with: [uyghurs]}
      - label: "Demand his submission as a vassal"
        wealth_bp: 1000
        outcome: >-
          Barchuq submits, stiffly. His scribes work for you, and take their time about it.
        deeds: {tributaries: [uyghurs]}
      - label: "Take his gifts, and call his men to your army"
        legitimacy_bp: 1500
        knowledge_bp: 1200
        outcome: >-
          Barchuq's gold and his horsemen come to your camp, with a company of his scribes, and
          you give him a place among your commanders. He serves well, and his clerks begin to
          teach yours their letters.
        deeds: {men: 2000}
    history: >-
      In 1209 the Uyghur Idiqut Barchuq Art Tegin threw off Qara Khitai and submitted
      voluntarily to Chinggis Khan, who called him his fifth son. Uyghurs became the empire's
      first bureaucrats.
    diverged: >-
      The Uyghurs are gone.
    sources: ["Juvaini 1.6", "Allsen, 'The Yuan dynasty and the Uighurs of Turfan' (1983)"]

  - id: mgl_badger
    scenario: great_khan
    civ: mongols
    year: 1211
    until_year: 1216
    title: "The Badger's Mouth"
    place: "The pass of Yehuling, beyond the Great Wall"
    speaker: general
    speaker_name: "Muqali"
    speaker_title: "Commander of the left wing"
    needs_alive: [jurchen_jin]
    benchmark_provinces: 9
    story: >-
      The new emperor of the Jin has sent an envoy to demand your submission, and you spat
      towards the south and rode off. Now you have climbed a mountain and prayed for three
      days with your belt round your neck: the Jin killed your ancestor Ambaghai, nailed to
      a wooden donkey.


      The Jin army - perhaps four hundred thousand men - is waiting for you in a pass called
      the Badger's Mouth. Its commander has sent a Khitan officer to negotiate with you.
      The officer, it turns out, hates the Jin more than you do.
    choices:
      - label: "Take the Khitan's news, and charge the pass"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Muqali leads the charge straight up the pass. The Jin army breaks and is cut down
          for thirty miles; a Chinese chronicler, visiting ten years later, finds the bones
          still lying there. The Jin frontier is open.
        deeds: {war_with: [jurchen_jin], take: [g_liaoxi], men: 20000}
      - label: "Raid around the Wall, and avoid their army"
        wealth_bp: 2000
        outcome: >-
          Your horsemen ride round the Jin fortresses and plunder the plains. The Jin army
          stays in its pass, wondering where you went.
        deeds: {war_with: [jurchen_jin]}
      - label: "Take the border forts one at a time"
        legitimacy_bp: 2000
        wealth_bp: 400
        outcome: >-
          You leave the great army alone and take the walled posts of the frontier one by one,
          with the Khitan as your guides. Every fallen fort brings more Khitan to your side and
          shows the Jin that you cannot be stopped, but it is slow, and the Jin emperor has time
          to call up his reserves.
        deeds: {war_with: [jurchen_jin], men: 10000}
    history: >-
      At Yehuling (the 'Badger's Mouth') in 1211 the Mongols destroyed the main Jin army.
      The Taoist monk Changchun saw the bones on the battlefield in 1221.
    diverged: >-
      The Jin are gone already.
    sources: ["Yuan shi 1, 119 (Muqali)", "Li Zhichang, Journey to the West of Changchun"]

  - id: mgl_zhongdu
    scenario: great_khan
    civ: mongols
    year: 1215
    until_year: 1220
    title: "Zhongdu Burns"
    place: "Before the Jin capital"
    speaker: general
    speaker_name: "Muqali"
    speaker_title: "Commander of the left wing"
    needs_war_with: [jurchen_jin]
    needs_owner: {g_zhongdu: jurchen_jin}
    benchmark_provinces: 10
    story: >-
      The Jin emperor has fled south to Kaifeng, leaving his great capital Zhongdu - the
      city that will one day be Beijing - behind its walls with a garrison and a million
      starving people. Its commanders are eating their own soldiers, men say.


      The city is ready to fall. Your soldiers have never sacked a city like this.
    choices:
      - label: "Let the army take it"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 800
        outcome: >-
          Zhongdu burns for a month. Years later an envoy from the Khwarazm Shah rides past
          and sees a hill of bones and the ground greasy with human fat. The imperial
          treasure comes north on an endless train of carts. Among the captives is a tall
          Khitan official with a long beard who will not bow.
        deeds: {take: [g_zhongdu, g_hebei]}
      - label: "Spare the city, and govern it"
        legitimacy_bp: 1500
        wealth_bp: 1500
        outcome: >-
          You appoint a governor and leave a garrison. The officials of Zhongdu go back to
          their desks, a little surprised to be alive. The taxes start coming in.
        deeds: {take: [g_zhongdu, g_hebei]}
      - label: "Take a ransom, and leave a garrison"
        wealth_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          The city buys itself off with silver and silk, and you put a small garrison in the
          gate-towers. The starving people are fed a little, and the garrison finds that it is
          a very small one for so large a city.
        deeds: {take: [g_zhongdu]}
    history: >-
      Zhongdu fell in 1215 after the Jin court moved to Kaifeng; it was sacked and burned.
      Among those who entered Mongol service was Yelu Chucai.
    diverged: >-
      Zhongdu is not Jin's to lose.
    sources: ["Yuan shi 1", "Juzjani, Tabaqat-i Nasiri"]

  - id: mgl_long_beard
    scenario: great_khan
    civ: mongols
    year: 1218
    title: "Long Beard"
    place: "Your camp on the Kherlen"
    speaker: steward
    speaker_name: "Yelu Chucai"
    speaker_title: "A Khitan scholar from Zhongdu"
    benchmark_provinces: 12
    story: >-
      He is twenty-eight, very tall, with a beard to his waist: a prince of the old Khitan
      royal house, astronomer, physician and poet, who served the Jin. You told him you had
      avenged his family on the Jin, who destroyed them. He told you he had served the Jin
      loyally, and would not thank you for destroying his masters.


      Your officers call him Urtu Saqal, 'Long Beard'. He wants to be your astrologer and
      secretary.
    choices:
      - label: "Keep him at your side"
        historical: true
        knowledge_bp: 2000
        legitimacy_bp: 600
        outcome: >-
          Long Beard reads the stars and writes your letters. One day he will stop your son
          from turning north China into pasture.
      - label: "Send him back to Zhongdu as governor"
        wealth_bp: 1500
        knowledge_bp: 500
        outcome: >-
          He governs Zhongdu well, and writes poems about the snow.
      - label: "Send him to speak for you in the Chinese towns"
        knowledge_bp: 1300
        wealth_bp: 600
        legitimacy_bp: 300
        outcome: >-
          Yelu Chucai rides south with your letters to the scholars and magistrates of the
          conquered towns. They are surprised to find a Khitan prince speaking for the khan, and
          many of them listen; the tax rolls begin to fill.
    history: >-
      Yelu Chucai (1190-1244) entered Chinggis Khan's service in 1218 and became the leading
      Chinese-style administrator under Ogedei.
    sources: ["Yuan shi 146", "de Rachewiltz, 'Yeh-lu Ch'u-ts'ai' (1962)"]

  - id: mgl_kuchlug
    scenario: great_khan
    civ: mongols
    year: 1218
    until_year: 1222
    title: "Jebe and the Usurper"
    place: "Kashgar"
    speaker: general
    speaker_name: "Jebe"
    speaker_title: "'The Arrow'"
    needs_alive: [kara_khitai]
    benchmark_provinces: 12
    story: >-
      Kuchlug, prince of the Naimans you destroyed, fled west and stole the throne of Qara
      Khitai from his own father-in-law, the Gurkhan. He was a Christian; he has become a
      Buddhist, and he persecutes the Muslims of Kashgar and Khotan - he crucified the imam of
      Khotan on the door of his own madrasa.


      Jebe - 'the Arrow', the man who once shot your horse from under you and whom you
      named for it - asks for twenty thousand men.
    choices:
      - label: "Send Jebe, and proclaim freedom of worship"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Jebe announces that everyone may keep their own religion. The Muslim towns rise and
          kill Kuchlug's soldiers in their streets. Kuchlug flees into the Pamirs and is
          hunted down. Jebe sends you a thousand white-muzzled horses, to apologise for
          the one he shot.
        deeds: {war_with: [kara_khitai], conquer: [kara_khitai]}
      - label: "Leave Kuchlug alone and trade by other roads"
        wealth_bp: 500
        legitimacy_bp: -300
        outcome: >-
          Kuchlug rules on, hated. The road west stays closed.
      - label: "Send Jebe with twenty thousand men, no promises"
        legitimacy_bp: 2200
        outcome: >-
          Jebe rides west with his army and makes no speeches. Kuchlug's army is beaten quickly,
          and the Muslim towns, tired of the usurper, open their gates to the victor without
          waiting for promises.
        deeds: {war_with: [kara_khitai], men: 5000}
    history: >-
      In 1218 Jebe conquered Qara Khitai; proclaiming religious freedom, he was welcomed by its
      Muslim population, and Kuchlug was killed in Badakhshan.
    diverged: >-
      Qara Khitai is gone already.
    sources: ["Juvaini 1.9", "Biran, The Empire of the Qara Khitai (2005)"]

  - id: mgl_otrar
    scenario: great_khan
    civ: mongols
    year: 1219
    title: "The Caravan of Otrar"
    place: "Your camp on the Kherlen"
    speaker: general
    speaker_name: "Subotai"
    speaker_title: "Your greatest general"
    benchmark_provinces: 15
    story: >-
      Your new neighbour in the west is the Khwarazm Shah, Muhammad, master of Samarkand,
      Bukhara and Persia. You sent him a letter of friendship and a caravan of four hundred
      and fifty Muslim merchants with gold, silver, silk and furs.


      At the border town of Otrar his governor accused the merchants of spying and killed
      them all. One camel driver escaped. You sent three envoys to demand the governor; the
      Shah killed one and shaved the beards of the other two.
    choices:
      - label: "Go west, with everything you have"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 3000
        unrest_bp: 800
        outcome: >-
          Far beyond the western edge of your maps, Otrar, Bukhara, Samarkand, Urgench, Merv
          and Nishapur fall in four years. Millions die. The Shah flees to an island in the
          Caspian Sea and dies there in rags. Jebe and Subotai ride round the Caspian and
          beat the Russians on the Kalka. The plunder comes home in caravans that take
          months to arrive.
        deeds: {martial_bp: 1000}
      - label: "Demand compensation, and wait"
        legitimacy_bp: -800
        unrest_bp: 300
        outcome: >-
          The Shah sends nothing. Merchants stop coming from the west.
      - label: "Send a punitive army against Otrar"
        legitimacy_bp: 1200
        wealth_bp: 2500
        unrest_bp: 300
        outcome: >-
          A strong army goes west to take Otrar and its governor, and no further. The town
          falls, the governor is taken, and the caravan goods and ransoms of the border city
          fill your treasury. The Shah, who has lost his border fortress and nothing else, must
          decide whether he has been warned or insulted.
        deeds: {men: 10000}
    history: >-
      The Otrar massacre (1218) provoked the Mongol invasion of the Khwarazmian empire
      (1219-1223), one of the most destructive campaigns in history.
    sources: ["Juvaini 1.11-1.17", "Nasawi", "Ibn al-Athir"]

  - id: mgl_last_campaign
    scenario: great_khan
    civ: mongols
    year: 1226
    until_year: 1230
    title: "The Last Campaign"
    place: "The Tangut frontier"
    speaker: diviner
    speaker_name: "Yelu Chucai"
    speaker_title: "Your astrologer"
    needs_alive: [western_xia]
    benchmark_provinces: 15
    story: >-
      When you went west, you asked the Tangut king for soldiers, as he had sworn. His
      minister Asha Gambu answered for him: 'If you have not enough soldiers, why call
      yourself khan?' You have not forgotten.


      This winter you fell from your horse while hunting wild asses, and you have a fever.
      Your sons want you to go home and let the Tangut wait. You are sixty-four.
    choices:
      - label: "March on the Tangut at once"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        outcome: >-
          The Tangut cities fall one after another. You do not live to see the last: you die
          in the summer, in the mountains, making your sons promise to keep your death secret
          until the capital has surrendered. When it does, the city is put to the sword. Your
          body is carried home to the Burkhan Khaldun, and everyone the funeral escort meets on
          the road is killed so that no one will know where you lie. No one ever has.
        deeds: {conquer: [western_xia]}
      - label: "Go home to rest, and let your sons finish it"
        legitimacy_bp: 1000
        outcome: >-
          Your sons besiege the Tangut capital while you lie in your tent, and the army is glad
          to see them command in your name. The fever does not break.
        deeds: {conquer: [western_xia]}
      - label: "Demand hostages and tribute from Xia"
        wealth_bp: 1500
        legitimacy_bp: 300
        outcome: >-
          You send heralds to Zhongxing with a demand for hostages, soldiers and silver. The
          Tangut king hears them and sends back a polite answer and no soldiers.
        deeds: {tributaries: [western_xia]}
    history: >-
      Chinggis Khan died in August 1227 during the final campaign against Western Xia, which
      the Mongols destroyed; the location of his grave is unknown.
    diverged: >-
      The Tangut are gone already.
    sources: ["Secret History of the Mongols 265-268", "Rashid al-Din"]

  - id: mgl_ogedei
    scenario: great_khan
    civ: mongols
    year: 1229
    title: "Pasture or Taxes"
    place: "The great assembly at Kodoe Aral"
    speaker: steward
    speaker_name: "Yelu Chucai"
    speaker_title: "Your chief secretary"
    benchmark_provinces: 19
    story: >-
      Ogedei, your third son and your father's choice, is Great Khan. He is generous, likes his
      wine, and laughs easily; his brothers trust him, which is why his father chose him.


      Some of the generals have a proposal for the lands of north China: they are full of
      people who are no use to Mongols. Kill them, or drive them off, and turn the land into
      pasture for the horses. Yelu Chucai says: let them live and tax them, and he will
      bring you five hundred thousand ounces of silver, eighty thousand bolts of silk and
      four hundred thousand sacks of grain a year.
    choices:
      - label: "Let Yelu Chucai levy taxes"
        historical: true
        wealth_bp: 3000
        legitimacy_bp: 1000
        outcome: >-
          Ten tax offices are set up in north China, staffed by Confucian scholars. At the
          end of the year Yelu Chucai lays the silver, silk and grain before you. 'How did you
          do it,' Ogedei asks, 'without ever leaving my side?' Millions of people live who
          would have died.
      - label: "Clear the land for the horses"
        food_bp: -2000
        unrest_bp: 3000
        legitimacy_bp: -1500
        outcome: >-
          The farms are burned and the people driven south. The horses grow fat. The silver
          stops.
        deeds: {martial_bp: 1000}
      - label: "✦ Keep the accounts in double entry, and a census of every household"
        needs_adopted: [double_entry]
        wealth_bp: 5000
        knowledge_bp: 1000
        outcome: >-
          Every tax office keeps two ledgers that must balance. Embezzlers are caught within a
          season. The silver comes in at twice Long Beard's estimate.
      - label: "Tax the towns, and graze the open fields"
        legitimacy_bp: 1200
        wealth_bp: 3500
        unrest_bp: 500
        outcome: >-
          The walled towns pay heavily in silver and the open farmland is turned to pasture. The
          tax-gatherers and the herdsmen quarrel over every boundary, but the treasury fills and
          the great houses are pleased with the grazing.
    history: >-
      Ogedei became Great Khan in 1229. According to his biography, Yelu Chucai persuaded
      him not to depopulate north China but to tax it, delivering the promised revenue by
      1231.
    sources: ["Yuan shi 146", "Allsen, Mongol Imperialism (1987)"]

  - id: mgl_goryeo
    scenario: great_khan
    civ: mongols
    year: 1231
    until_year: 1240
    title: "The Island Court"
    place: "Before Kaegyong"
    speaker: general
    speaker_name: "Saritai"
    speaker_title: "Commander in Goryeo"
    needs_alive: [goryeo]
    benchmark_provinces: 19
    story: >-
      A Mongol envoy was murdered on his way home from Goryeo six years ago. Now your army is
      at the walls of Kaegyong, and the king has submitted and paid. But the real ruler of
      Goryeo, the military dictator Choe U, has a different idea: move the whole court to
      the island of Ganghwa, a mile offshore, where your horsemen cannot follow, and fight
      on.
    choices:
      - label: "Ignore the island, and ravage the mainland"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 800
        outcome: >-
          The Goryeo court rows across to Ganghwa and stays there for twenty-eight years. Your
          armies return again and again and lay waste to the peninsula; on their island the
          monks carve the whole Buddhist canon onto eighty-one thousand wooden blocks to beg the
          Buddha's help. In 1259 the crown prince comes to submit at last.
        deeds: {war_with: [goryeo], grudges: {goryeo: 3000}}
      - label: "Build a fleet, and take the island"
        materials_bp: -2500
        legitimacy_bp: 1500
        outcome: >-
          Chinese shipwrights build you a fleet. Ganghwa falls in a season, and Goryeo
          becomes a son-in-law kingdom of the khans.
        deeds: {war_with: [goryeo], conquer: [goryeo]}
      - label: "Take hostages and tribute, and withdraw"
        wealth_bp: 1500
        legitimacy_bp: 300
        outcome: >-
          You accept the king's submission and the gifts that go with it, leave a few officials
          in the towns, and ride home. Choe U's court on its island has not been consulted,
          and does not feel itself bound.
        deeds: {tributaries: [goryeo]}
    history: >-
      The Mongols invaded Goryeo in 1231. In 1232 the Choe regime moved the court to Ganghwa
      island, resisting until 1259; the Tripitaka Koreana was carved there (1237-1248).
    diverged: >-
      Goryeo is gone already.
    sources: ["Goryeosa", "Henthorn, Korea: The Mongol Invasions (1963)"]

  - id: mgl_kaifeng
    scenario: great_khan
    civ: mongols
    year: 1232
    until_year: 1238
    title: "The Fall of the Jin"
    place: "Before Kaifeng"
    speaker: general
    speaker_name: "Subotai"
    speaker_title: "Your greatest general"
    needs_alive: [jurchen_jin]
    needs_war_with: [jurchen_jin]
    benchmark_provinces: 19
    story: >-
      Subotai has destroyed the last great Jin army in the snow at Sanfeng Pass, and is now
      besieging Kaifeng, where the Jin defend their walls with 'heaven-shaking thunder'
      bombs - iron pots full of gunpowder that blow men and their armour to pieces - and
      lances that spurt fire.


      The Song in the south have offered to join you against the Jin, their old enemy, in
      return for a share of the land.
    choices:
      - label: "Accept the Song's offer to share the war"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Kaifeng falls in 1233. The last Jin emperor flees to Caizhou, where Mongol and Song
          armies besiege him together; he hangs himself as they break in. Then the Song
          march north to take back their old capitals - and you find yourself at war with
          the Song.
        deeds: {conquer: [jurchen_jin], ally_with: [southern_song]}
      - label: "Refuse the Song, and take the Jin lands alone"
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          It takes two more years. The Jin are gone; the Song watch your armies arrive on
          their border, and begin to dig in.
        deeds: {conquer: [jurchen_jin], grudges: {southern_song: 2000}}
      - label: "Make the last Jin emperor your tributary"
        wealth_bp: 1000
        legitimacy_bp: 500
        outcome: >-
          You offer the Jin court terms: a tribute, an oath, and a Mongol officer at every
          gate. The emperor, in Kaifeng behind his thunder-bombs, thinks about it for a long
          time.
        deeds: {tributaries: [jurchen_jin]}
    history: >-
      The Mongols took Kaifeng in 1233 and, allied with the Song, destroyed the last Jin
      emperor at Caizhou in 1234. The Song then tried to seize Kaifeng and Luoyang, starting
      a 45-year war with the Mongols.
    diverged: >-
      The Jin are gone already.
    sources: ["Jin shi 113", "Yuan shi 121 (Subotai)"]

  - id: mgl_yam
    scenario: great_khan
    civ: mongols
    year: 1235
    title: "Karakorum and the Yam"
    place: "The Orkhon valley"
    speaker: steward
    speaker_name: "Chinqai"
    speaker_title: "Head of the chancery"
    benchmark_provinces: 28
    story: >-
      Your empire runs from the Yellow Sea to the Volga. Ogedei wants a capital, with walls,
      a palace and markets, at Karakorum in the Orkhon valley. And he wants the empire
      joined up: a chain of relay stations, a day's ride apart, each with horses, food and
      men, so that a messenger with your tablet of authority can cross from China to Persia
      in weeks.
    choices:
      - label: "Build Karakorum and the yam"
        historical: true
        materials_bp: -2000
        wealth_bp: 1500
        legitimacy_bp: 1500
        outcome: >-
          Karakorum rises: a palace, a Chinese quarter, a Muslim quarter, twelve temples, two
          mosques and a church. Merchants from everywhere come. The relay stations stretch
          across Asia; messengers ride two hundred miles a day. Ogedei later commissions a
          Parisian goldsmith to build a silver tree that pours wine, mare's milk and mead
          from its branches.
      - label: "Build the yam, and keep the court in tents"
        wealth_bp: 1000
        legitimacy_bp: 800
        outcome: >-
          The khan's court moves with the seasons, as it always has. The relay stations go up
          all the same.
      - label: "✦ String telegraph wires along the relay roads"
        needs_adopted: [telegraph]
        legitimacy_bp: 2500
        knowledge_bp: 2000
        outcome: >-
          Copper wires on wooden poles follow the yam roads. Orders from Karakorum reach
          Persia in minutes instead of weeks. No rebellion in your empire ever again gets a
          head start.
        deeds: {martial_bp: 1500}
      - label: "Build Karakorum only, and keep the old roads"
        materials_bp: -1500
        legitimacy_bp: 1000
        knowledge_bp: 300
        outcome: >-
          Karakorum goes up with its walls and its palace, and the old tracks across the grass
          are left as they were. Messengers still take months to cross the empire, and the
          markets of the new city are famous for their goods.
    history: >-
      Ogedei built Karakorum's walls in 1235 and organised the yam relay system, which later
      astonished Marco Polo. William of Rubruck described Guillaume Boucher's silver tree in
      1254.
    sources: ["Rubruck, Itinerarium 30", "Allsen, Mongol Imperialism", "Pohl et al., Karakorum excavations"]

  - id: mgl_mohi
    scenario: great_khan
    civ: mongols
    year: 1241
    title: "News from Hungary"
    place: "Karakorum"
    speaker: general
    speaker_name: "A messenger of the yam"
    speaker_title: "Riding from the west"
    benchmark_provinces: 28
    story: >-
      The messengers from the west bring astonishing news. Batu and Subotai have crossed the
      mountains into Europe. In Poland they have destroyed an army of German knights at
      Liegnitz and sent back nine sacks of ears. In Hungary they have crushed King Bela's
      army at the river Sajo. Their scouts have reached the Adriatic and the gates of Vienna.


      And Ogedei, at a hunting party, has drunk himself into a fever.
    choices:
      - label: "Recall the armies to the quriltai"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Ogedei dies in December. When the news reaches Hungary, the princes turn their
          horses round to go home and quarrel over who will rule. Europe never learns why
          the Mongols left.
      - label: "Keep the armies in Europe for now"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Batu stays in Hungary through the winter. The Pope writes letters. In Karakorum the
          princes quarrel without him.
        deeds: {martial_bp: 500}
      - label: "Winter in Hungary, then ride home"
        legitimacy_bp: 300
        unrest_bp: 800
        outcome: >-
          Batu decides to stay the winter and let the news from Karakorum settle. The army eats
          the Hungarian plain bare, and goes east in the spring.
    history: >-
      In April 1241 the Mongols won at Liegnitz and Mohi. Ogedei died in December 1241, and
      the armies withdrew from central Europe in 1242, perhaps because of the succession,
      perhaps for want of pasture.
    sources: ["Rogerius, Carmen miserabile", "Juvaini", "Jackson, The Mongols and the West (2005)"]

  - id: mgl_dali
    scenario: great_khan
    civ: mongols
    year: 1253
    until_year: 1258
    title: "The Kingdom of Dali"
    place: "The Jinsha river"
    speaker: general
    speaker_name: "Uriyangkhadai"
    speaker_title: "Subotai's son"
    needs_alive: [dali]
    benchmark_provinces: 28
    story: >-
      Your brother Kublai is leading the army into the mountains of the south-west, to take
      the old kingdom of Dali and outflank the Song. The army has crossed the Jinsha river on
      rafts of inflated sheepskins.


      Your adviser Yao Shu, a Confucian, has told Kublai the story of an old Chinese
      general who took a city without killing anyone. Kublai wants to try it.
    choices:
      - label: "Spare Dali and keep its king in office"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Kublai's men march into Dali with banners promising that no one will be killed if
          the city surrenders. It does. The king of the Duan family stays on as governor
          under the Mongols, and his family will rule there for another century.
        deeds: {war_with: [dali], conquer: [dali]}
      - label: "Storm Dali, and make an example of it"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Dali is stormed. The mountain peoples of the south-west will fight you for a
          generation.
        deeds: {war_with: [dali], conquer: [dali]}
      - label: "Take tribute and leave a garrison"
        legitimacy_bp: 1000
        wealth_bp: 400
        outcome: >-
          Your envoys offer the king a place as a tributary, with a Mongol garrison on the hills
          overlooking the city. The Duan court weighs it, accepts, and your mild terms are
          talked of across the south-west.
        deeds: {tributaries: [dali]}
    history: >-
      Kublai conquered Dali in 1253-1254; the Duan royal family became hereditary Mongol
      governors (maharajas) of Yunnan.
    diverged: >-
      Dali is gone already.
    sources: ["Yuan shi 4, 121", "Rossabi, Khubilai Khan (1988)"]

  - id: mgl_diaoyu
    scenario: great_khan
    civ: mongols
    year: 1259
    title: "The Fishing Town"
    place: "Diaoyu fortress, Sichuan"
    speaker: general
    speaker_name: "Kublai"
    speaker_title: "Your brother"
    benchmark_provinces: 30
    story: >-
      The Great Khan Mongke has died at the walls of Diaoyu, the 'Fishing Town', a Song fortress
      on a cliff above three rivers that his army could not take in five months. Some say
      dysentery; some say a stone from a Song catapult.


      Kublai is besieging Ezhou on the Yangzi when the messenger comes. In Karakorum, your
      youngest brother Ariq Boke is already gathering the princes to make himself khan. The
      Song chancellor Jia Sidao has sent a secret envoy offering tribute for a truce.
    choices:
      - label: "Accept the truce and ride north"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 1500
        outcome: >-
          Kublai rides north and has himself proclaimed khan at Kaiping. Ariq Boke is
          proclaimed khan at Karakorum. For four years two Great Khans fight each other,
          until Ariq Boke surrenders. The empire will never again have one master: Persia,
          Russia and Central Asia go their own ways.
        deeds: {peace_with: [southern_song]}
      - label: "Finish the Song first, then go home"
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          Kublai crosses the Yangzi. In Karakorum, Ariq Boke is proclaimed sole Great Khan.
          You may win the south and lose the steppe.
        deeds: {war_with: [southern_song]}
      - label: "Send envoys north, and hold the Yangzi"
        legitimacy_bp: 1000
        unrest_bp: 1200
        outcome: >-
          Your envoys ride to the princes and to Ariq Boke, and your army stays at Ezhou. The
          answers come back slowly, each more doubtful than the last, and the Song, watching
          your camp, wait to see which way you will turn. The princes respect a khan who tries
          to settle matters before he moves.
        deeds: {men: 5000}
    history: >-
      Mongke died at Diaoyucheng in August 1259. Kublai accepted a truce from Jia Sidao and
      was proclaimed khan in 1260; the civil war with Ariq Boke lasted until 1264.
    sources: ["Yuan shi 3-4", "Rashid al-Din", "Rossabi (1988)"]

  - id: mgl_xiangyang
    scenario: great_khan
    civ: mongols
    year: 1268
    until_year: 1276
    title: "Xiangyang"
    place: "The twin cities on the Han river"
    speaker: general
    speaker_name: "Aju"
    speaker_title: "Commander on the Han"
    needs_alive: [southern_song]
    needs_owner: {g_xiangyang: southern_song}
    benchmark_provinces: 30
    story: >-
      Kublai is now Great Khan and emperor of China, with a new capital at Dadu. The Song
      will not submit, and the key to the Song is Xiangyang and its twin city Fancheng, on
      either side of the Han river, with walls that have held for years and a garrison fed by
      the river.


      You have learned to build ships and blockade a river. But the walls still stand. Your
      nephew, the Ilkhan of Persia, writes that he has two engineers, Ismail and Ala al-Din,
      who build catapults with counterweights that throw stones of ninety kilograms.
    choices:
      - label: "Blockade the river, and call for engineers"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -2000
        outcome: >-
          After five years of blockade the engineers arrive. Their great trebuchets smash
          Fancheng's walls; Xiangyang's commander, seeing his city's towers fall one by one,
          surrenders. The road down the Han to the Yangzi is open.
        deeds: {war_with: [southern_song], take: [g_xiangyang]}
      - label: "Storm the walls with every man"
        legitimacy_bp: 800
        food_bp: -2500
        unrest_bp: 1000
        outcome: >-
          Wave after wave goes up the ladders and falls back. Xiangyang holds.
        deeds: {war_with: [southern_song]}
      - label: "✦ Bring up cannon"
        needs_adopted: [cannon]
        legitimacy_bp: 3000
        outcome: >-
          Bronze guns firing iron balls bring down the walls of Fancheng in a week and
          Xiangyang in a month. The Song generals have never seen anything like it.
        deeds: {war_with: [southern_song], take: [g_xiangyang, g_hanzhong]}
      - label: "Starve them with a ring of forts"
        legitimacy_bp: 1500
        materials_bp: -1500
        outcome: >-
          A chain of forts goes up around both cities, cutting each from the other and from the
          country. It is slower than any assault and cheaper in men, though the forts eat timber
          and iron, and the garrison holds on, expecting a relief army that is slow to come.
          Your patience is noted with approval at court.
        deeds: {war_with: [southern_song], men: 8000}
    history: >-
      The siege of Xiangyang lasted from 1268 to 1273 and ended when Muslim engineers from the
      Ilkhanate built counterweight trebuchets ('Muslim catapults'). Marco Polo later claimed
      the credit for his family.
    diverged: >-
      Xiangyang has fallen already, or is not the Song's: there is no great siege.
    sources: ["Yuan shi 203 (Ismail, Ala al-Din)", "Song shi", "Marco Polo, ch. 145"]

  - id: mgl_kamikaze
    scenario: great_khan
    civ: mongols
    year: 1274
    until_year: 1282
    title: "The Wind from the Gods"
    place: "Hakata bay, Kyushu"
    speaker: general
    speaker_name: "Hong Dagu"
    speaker_title: "Commander of the Korean fleet"
    needs_alive: [kamakura]
    benchmark_provinces: 31
    story: >-
      Japan has ignored six embassies from the Great Khan. The regent in Kamakura, Hojo
      Tokimune, a young man of twenty-three, has sent the envoys home without an answer.


      Nine hundred Korean ships have carried your army across the strait. On the beach at
      Hakata your soldiers have beaten the samurai with exploding iron bombs and volleys of
      poisoned arrows; the samurai expected single combat. Night is falling, and the
      Korean captains are worried about the weather.
    choices:
      - label: "Reboard the ships for the night"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          In the night a storm drives the fleet onto the rocks. A third of the army drowns.
          Seven years later a second invasion - four thousand ships, the largest fleet in
          history until D-Day - will be destroyed by a typhoon too. The Japanese will call
          it the kamikaze, the divine wind.
        deeds: {war_with: [kamakura]}
      - label: "Stay ashore and dig in"
        legitimacy_bp: 800
        unrest_bp: 800
        outcome: >-
          The storm wrecks half the empty fleet, but the army is safe on land. You hold
          Hakata through the winter and the samurai come at you every night.
        deeds: {war_with: [kamakura], take: [g_kyushu]}
      - label: "✦ Read the barometer and wait out the storm in harbour"
        needs_adopted: [scientific_method]
        legitimacy_bp: 1500
        outcome: >-
          Your weather-men watch the falling glass and order the fleet into the shelter of
          Tsushima. The storm blows over an empty sea. Two days later the army lands at
          Hakata again.
        deeds: {war_with: [kamakura], take: [g_kyushu]}
      - label: "Keep half the army ashore"
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          Half the army sleeps on the beach and half in the ships, so that neither is
          caught alone. The night is wet and the Korean captains grow louder about the
          weather.
        deeds: {men: 2000}
    history: >-
      Mongol-Korean invasions of Japan in 1274 and 1281 were both wrecked by storms after
      landing at Hakata. Underwater archaeology at Takashima has found their ships and the
      earliest known exploding bombs.
    diverged: >-
      There is no Kamakura to invade.
    sources: ["Moko shurai ekotoba (the Mongol invasion scrolls)", "Conlan, In Little Need of Divine Intervention (2001)", "Sasaki, The Origin of the Lost Fleet (2015)"]

  - id: mgl_yamen
    scenario: great_khan
    civ: mongols
    year: 1276
    until_year: 1285
    title: "The Last Emperor of the Song"
    place: "Yamen, at the mouth of the Pearl River"
    speaker: general
    speaker_name: "Bayan of the Baarin"
    speaker_title: "Commander-in-chief against the Song"
    needs_alive: [southern_song]
    benchmark_provinces: 31
    story: >-
      Lin'an, the Song capital, the greatest city on earth, opened its gates to Bayan
      without a fight; the boy emperor and his grandmother came out to submit. But Song
      loyalists fled south by sea with two younger princes and have kept fighting from the
      coast. Now the last Song fleet - a thousand ships chained together - lies at Yamen, with
      a seven-year-old emperor on board.
    choices:
      - label: "Attack the chained fleet"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Your ships attack at high tide and low, and the chained fleet cannot move. When it is
          over, the minister Lu Xiufu takes the boy emperor on his back and jumps into the sea.
          Thousands of courtiers follow them. The Song dynasty, which has ruled for three
          hundred and nineteen years, is over. For the first time, China is ruled by a people
          from beyond the Wall.
        deeds: {war_with: [southern_song], conquer: [southern_song]}
      - label: "Offer the loyalists honourable terms"
        unrest_bp: 300
        legitimacy_bp: 3000
        outcome: >-
          Some accept, and the honour of the terms is remembered. Many fight on, and the
          loyalists' refusals cost you peace at home. Wen Tianxiang, captured, refuses to serve
          and writes the Song of the Righteous Spirit in prison before he is executed.
        deeds: {war_with: [southern_song], conquer: [southern_song]}
      - label: "Cut the fleet off from fresh water"
        legitimacy_bp: 1200
        unrest_bp: 300
        outcome: >-
          Your ships hold the water-places along the shore, and the thousand ships of the Song
          sit chained together in the heat. The sailors drink seawater and fall ill, and
          the court on board begins to weigh its choices.
        deeds: {war_with: [southern_song], conquer: [southern_song]}
    history: >-
      Lin'an surrendered in 1276. The last Song loyalist fleet was destroyed at Yamen in
      March 1279; Lu Xiufu drowned himself with the child emperor Zhao Bing.
    diverged: >-
      The Song are gone already.
    sources: ["Song shi 47", "Yuan shi 127 (Bayan)", "Davis, Wind Against the Mountain (1996)"]
