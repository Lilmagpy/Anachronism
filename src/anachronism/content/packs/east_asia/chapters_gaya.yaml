schema_version: 1
# Chronicle mode (D-120, D-XXX): Gaya, from Goguryeo's blow at Imna Gara to the fall of
# Daegaya, AD 400-562. Each chapter opens in its year; one choice is what history chose
# (historical: true). Gaya left no records of its own, so every fact here comes from outsiders:
# the Gwanggaeto stele, the Samguk sagi (Silla and Baekje annals and the biographies of
# Isabu and Sadaham, 1145), the Samguk yusa (Garak-guk gi, c. 1280, which gives the kings'
# reigns), the Nanqi shu (the 479 embassy), the Nihon shoki (720, a Wa court's view, with
# its own agenda), and the tomb finds of Daeseong-dong, Bokcheon-dong and Goryeong, with
# modern work by Barnes, Best, Lee Ki-baik and Kim Tae-sik. The Samguk yusa's reign dates for
# the Geumgwan kings (Isipum to 407, Jwaji to 421, Chwihui to 451, Jilji to 492, Gyeomji to
# 521, Guhyeong to 532) are late and traditional, and the earlier ones surely too long;
# ages are placeholders. Gaya was never one kingdom but a league of towns: here the player
# is the king of Geumgwan (Gimhae) until 532 and then the king of Daegaya (Goryeong), the
# 'last' king being Doseolji by a late tradition; the Daegaya kings between are not named by
# any early source. The 'Mimana Japanese Office' of the Nihon shoki, once taken for a Wa
# colony in Gaya, is rejected by most scholars today; the Nihon shoki's Gaya stories are
# told as the Wa court's view. benchmark_provinces counts the provinces of this map Gaya
# held (Gimhae, Goryeong).
chapters:
  - id: gaya_jongbal
    scenario: three_kingdoms
    civ: gaya
    year: 400
    title: "The Fortress at Imna Gara"
    place: "Imna Gara, the port of Gimhae"
    speaker: general
    speaker_name: "Your commander of the fortress"
    speaker_title: "On the wall"
    needs_alive: [goguryeo]
    benchmark_provinces: 2
    story: >-
      You are the king of Geumgwan Gaya, called Isipum by later writers, ruler of the iron
      port at the mouth of the Nakdong. Your smiths have made iron bars for generations, and
      the traders of Wa, Baekje and Silla all come to your quay.


      Wa soldiers are running down the coast, with Goguryeo's armoured horsemen close behind
      them. The Wa captain says that his men are your guests and your sworn friends, and that
      you should hold the fortress with them. Goguryeo's herald is under your wall, and he
      says that those who open the gates will be spared.
    choices:
      - label: "Let the Wa fall back into the fortress, and hold it beside them"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          The fortress holds a few days. Then Goguryeo's horse climb the wall, the Wa run for
          their ships, and the garrison gives way. Goguryeo does not stay. But the iron
          port has learned how far the horsemen can ride, and the Silla king no longer
          takes your envoys seriously.
        deeds: {grudges: {goguryeo: 2000}}
      - label: "Shut the gates on the Wa and send to Goguryeo's king"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          The Wa captain curses you and sails away. Goguryeo's herald is courteous, takes
          your gifts, and rides on. The Wa do not forget who shut the gate.
        deeds: {grudges: {wa: 2500}}
      - label: "Send the treasures and families to the hills, and fight at the shore"
        legitimacy_bp: -500
        outcome: >-
          Your people are safe at Goryeong, where the hill kingdom welcomes them. The port is
          burned.
        deeds: {grudges: {goguryeo: 1500}}
    history: >-
      The Gwanggaeto stele records that in 400 Goguryeo drove the Wa from Silla and pursued
      them to the fortress of Jongbal in Imna Gara, which 'submitted at once'; the damaged
      lines after it name the men of Ara, another Gaya town, and the course of the battle is
      uncertain. Geumgwan's great chieftain tombs at Daeseong-dong become rare after this
      time, and some scholars see Gimhae's decline from here; others stress that the
      port went on for another century.
    diverged: >-
      Goguryeo is gone.
    sources: ["Gwanggaeto stele, year 10", "Barnes, State Formation in Japan (2007)", "Lee Ki-baik, A New History of Korea (1984)"]

  - id: gaya_iron
    scenario: three_kingdoms
    civ: gaya
    year: 418
    title: "Iron Bars for Everyone"
    place: "The quay at Gimhae"
    speaker: steward
    speaker_name: "Your master of the quay"
    speaker_title: "Counting the ingots"
    benchmark_provinces: 2
    story: >-
      You are Jwaji. A century and a half ago a Chinese historian wrote that the people of this
      coast produce iron, that the Han, the Ye and the Wa all come to buy it, and that every
      market uses bars of iron as money, as China uses coin. That is still true. Your smiths
      make bars of a standard shape and weight, and potters on the coast turn out the hard grey
      stoneware that fires at a high heat.


      Wa traders come every year, and take iron home for their chiefs' tools and weapons;
      some Wa craftsmen come to learn the kilns. Silla and Baekje want your iron too. Your
      master of the quay asks who should have it.
    choices:
      - label: "Sell iron to anyone who brings goods or soldiers"
        historical: true
        wealth_bp: 1500
        knowledge_bp: 500
        outcome: >-
          Bars from your forges go out to Wa and Baekje and Silla alike, and nobody rises
          to take the quay. Your tombs fill with Wa jade, with Baekje gold and with bronze
          mirrors from China. In Japan, the Sue stoneware that will carry your kiln-craft
          across the strait is copied from the Gaya.
      - label: "Make it the king's iron: sell it only to the Wa"
        wealth_bp: 1000
        unrest_bp: 500
        outcome: >-
          The Wa pay well. Silla and Baekje turn their eyes to the hills, and to the Gaya
          towns that will sell them iron for less.
        deeds: {grudges: {silla: 1500, baekje: 1000}}
      - label: "Keep the iron for your own armies"
        wealth_bp: -800
        outcome: >-
          Your smiths make armour, and your soldiers are better dressed than your
          neighbours' soldiers. But the quay is quiet.
        deeds: {martial_bp: 400}
    history: >-
      The Sanguo zhi (Dongyi zhuan) says that iron was used as money in Byeonhan and
      Jinhan and that Han, Ye and Wa all fetched it from there; the tombs of Gimhae and
      Busan hold standard iron ingots, and ingots of Gaya type have been found in Silla,
      Baekje and Wa. The year here is only a mark for a trade that lasted centuries.
    sources: ["Sanguo zhi 30 (Dongyi zhuan: Han, Byeonjin)", "Daeseong-dong and Bokcheon-dong tomb reports", "Barnes, State Formation in Japan (2007)"]

  - id: gaya_haji
    scenario: three_kingdoms
    civ: gaya
    year: 479
    title: "The King of Gara Writes to the New Emperor"
    place: "Goryeong, in the hills"
    speaker: steward
    speaker_name: "Your envoy to the south"
    speaker_title: "With the embassy"
    benchmark_provinces: 2
    story: >-
      You are Jilji, king of Geumgwan. Up the river, in the hills at Goryeong, the
      kingdom of Daegaya has grown rich on its iron and its farms, and its kings have been
      crowned with gold. Its king, Haji, has sent ships to China, where a general named Xiao
      Daocheng has just taken the throne from the Song and called his dynasty Qi.


      Your own port's trade is slipping to the hills. The hill kingdom will return with a
      Chinese title, and its envoys will tell the world that Gara is a kingdom.
    choices:
      - label: "Let the hill king speak for the league"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Haji's envoys arrive at Jiankang. The Chinese court is told that Gara is a country
          of the Three Han, sends gifts, and makes its king a General Who Supports the
          State and king of his own country. Two years later, Silla appeals for help against
          Goguryeo and Malgal, and the Gaya send soldiers with Baekje's. The league is
          stronger with Daegaya at its head.
        deeds: {capital: k4_goryeong}
      - label: "Send a Geumgwan embassy of your own to the Qi court"
        legitimacy_bp: -500
        knowledge_bp: 500
        outcome: >-
          Your ship reaches the south. The court cannot tell which of two Gara kings to
          honour, and honours neither.
      - label: "Press the hill kings to come under Geumgwan's name"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Goryeong does not answer. Its tombs grow larger.
    history: >-
      The Nanqi shu records that in 479 the king of Gara, Haji, sent an embassy to the new
      Southern Qi court and was made General Who Supports the State and king of his own
      country; most scholars identify this Gara with Daegaya at Goryeong, a few with Gimhae.
      The Samguk sagi (Silla annals, 481) records Baekje and Gaya troops helping Silla against
      Goguryeo and the Malgal. The Gaya league's centre of gravity moved to the hills in the
      later fifth century.
    sources: ["Nanqi shu 58 (Garaguk)", "Samguk sagi, Silla annals (481)", "Barnes, State Formation in Japan (2007)", "Best, A History of the Early Korean Kingdom of Paekche (2006)"]

  - id: gaya_marriage
    scenario: three_kingdoms
    civ: gaya
    year: 522
    title: "A Bride from Silla"
    place: "Goryeong"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "At the council"
    needs_alive: [silla]
    benchmark_provinces: 2
    story: >-
      You are Guhyeong, king of Geumgwan, and the league of Gaya towns looks to you and to the
      hill kingdom. Baekje has been eating the western Gaya lands for ten years. The Nihon
      shoki records that in 512-513 the Wa court gave Baekje four districts and then
      the lands of Gimun and Daesa on the Seomjin river, over Gaya's protest. Silla, under King
      Beopheung, is rising in the east.


      A marriage with Silla would bring you a protector. Your neighbour to the east has
      been your rival for years, and a Silla princess will bring a retinue of her own into your
      palace.
    choices:
      - label: "Ask Beopheung for a bride, and ally with Silla"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Beopheung sends the sister of his minister Bijobu with her household. For a
          few years it is a good match. Then a quarrel breaks it: her retinue, it is said,
          wear Silla clothes at your court, and your chiefs protest. She goes home, and Silla
          takes fortresses on the frontier.
        deeds: {grudges: {silla: 1000}}
      - label: "Turn to Baekje and the Wa for protection"
        legitimacy_bp: -500
        outcome: >-
          Baekje's king Muryeong is friendly. But he is also the one who has taken your
          western lands, and the Wa court is far away.
        deeds: {grudges: {baekje: 500}}
      - label: "Stay independent of all three"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your envoys go to all three courts and sign nothing. Each of them knows how small you are.
    history: >-
      The Samguk sagi (Silla annals, 522) records that the king of Gaya asked for a bride and
      King Beopheung sent the sister of the Ichan Bijobu. The Nihon shoki tells of the
      marriage breaking in 529 and Silla seizing frontier towns. The Nihon shoki's account of
      the 'cession' of Gimun and Daesa to Baekje (Keitai 6-7) is a Wa court's story and is
      doubted in detail; Baekje certainly expanded into the Seomjin and Namwon region at
      this time.
    diverged: >-
      Silla is gone.
    sources: ["Samguk sagi, Silla annals (522)", "Nihon shoki, Keitai 6-7 and 23", "Barnes, State Formation in Japan (2007)"]

  - id: gaya_geumgwan
    scenario: three_kingdoms
    civ: gaya
    year: 532
    title: "The Iron Kingdom Surrenders"
    place: "Gimhae"
    speaker: silla
    speaker_name: "King Beopheung's envoy"
    speaker_title: "At the gate"
    needs_alive: [silla]
    benchmark_provinces: 1
    story: >-
      You are Guhyeong, called Guhae in the Silla annals, tenth king of Geumgwan after Suro. For
      five hundred years your house has made iron on this coast. Silla's army is on your
      frontier, your friends in the hills are far away, and your sons ask what the king means to
      do.


      Silla's envoy has said that if you come out with your family, your treasures and your
      people, the king will treat you as a lord and not as a captive.
    choices:
      - label: "Go out with the queen, three sons and the treasury, and give up Geumgwan"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Beopheung gives you a high rank in Silla and your old kingdom as a fief. Your
          youngest son, Muryeok, will become a general. Two generations on, your great-grandson
          Kim Yu-sin will be the general who unites Korea under Silla. You are the last king of
          Geumgwan, and your line is not ended. The hill kingdom of Daegaya now stands alone at the
          head of the league.
        deeds: {give: [k4_gimhae], give_to: silla, capital: k4_goryeong, ruler_falls: "gives his kingdom to Silla"}
      - label: "Fight at Gimhae and take the consequences"
        legitimacy_bp: -500
        unrest_bp: 1500
        outcome: >-
          You shut the gates, and Silla besieges the city. The iron-makers are not soldiers.
        deeds: {grudges: {silla: 2500}}
      - label: "Take the treasure and flee to Baekje"
        legitimacy_bp: -1500
        outcome: >-
          Your family reaches Sabi, where King Seong receives you politely. Silla takes Gimhae
          without a fight, and your people do not forgive the flight.
        deeds: {give: [k4_gimhae], give_to: silla, capital: k4_goryeong, ruler_falls: "flees to Baekje"}
    history: >-
      The Samguk sagi (Silla annals, 532) records that the king of Geumgwan Gaya, Kim
      Gu-hae, came with his queen and three sons, Nojong, Mudeok and Muryeok, and surrendered
      with the treasures of the kingdom. King Beopheung gave him high rank and his old land as
      a fief; Muryeok became a general, and was the grandfather of Kim Yu-sin, the great
      general of the unification wars.
    diverged: >-
      Silla is gone.
    sources: ["Samguk sagi, Silla annals (532)", "Samguk sagi 41-43 (Kim Yu-sin)", "Samguk yusa 2 (Garak-guk gi)"]

  - id: gaya_sabi
    scenario: three_kingdoms
    civ: gaya
    year: 541
    title: "The Conference at Sabi"
    place: "Sabi, Baekje's new capital"
    speaker: baekje
    speaker_name: "King Seong of Baekje"
    speaker_title: "At the head of the table"
    needs_alive: [baekje]
    benchmark_provinces: 1
    story: >-
      You are the king of Daegaya. Geumgwan has gone, and the Gaya towns that are left are
      small and divided: Ara at Haman, Gosong, Daegaya itself, and others. Baekje's king has
      invited their chiefs to Sabi, with Wa envoys, to talk about what the Nihon shoki calls the
      restoration of Imna.


      Seong's argument is simple. Silla has taken one Gaya state after another, and will take the
      rest, and Gaya and Baekje must act together. He asks the chiefs to drive out the Silla
      garrisons from their towns. He does not say what he will want in return.
    choices:
      - label: "Attend, agree to everything, and do nothing yet"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Your chiefs say they will consider, and go home. Seong calls a second conference
          three years later, and the chiefs again plead for time. Some have Silla men in their
          halls; some are afraid of Baekje. The league does not drive out a single Silla
          garrison.
      - label: "Join Baekje wholeheartedly, and expel Silla's men"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          Silla's garrisons go. So does the peace you had with Silla, and Baekje's king is
          now your patron and your master.
        deeds: {grudges: {silla: 3000}}
      - label: "Seek Silla's protection against both"
        legitimacy_bp: -1000
        outcome: >-
          Silla receives your envoys graciously, and tells them to wait. Baekje hears that you
          have gone.
        deeds: {grudges: {baekje: 2500}}
    history: >-
      The Nihon shoki records two conferences convened by King Seong at Sabi, in 541 and 544
      (Kinmei 2 and 5), at which Gaya chiefs and Wa envoys were urged to restore Imna against
      Silla; the Gaya chiefs delayed. The account is the Nihon shoki's and the Wa court's own
      view of its role in Gaya is much doubted.
    diverged: >-
      Baekje is gone.
    sources: ["Nihon shoki, Kinmei 2 and 5", "Best, A History of the Early Korean Kingdom of Paekche (2006)", "Barnes, State Formation in Japan (2007)"]

  - id: gaya_gwansan
    scenario: three_kingdoms
    civ: gaya
    year: 554
    title: "Seong's Last Campaign"
    place: "Goryeong"
    speaker: baekje
    speaker_name: "An envoy of King Seong"
    speaker_title: "In your hall"
    needs_alive: [baekje, silla]
    benchmark_provinces: 1
    story: >-
      You are the king of Daegaya. Silla has taken the lower Han from Baekje, which had held it
      for only two years. King Seong is raising an army to take it back, and has asked for soldiers
      from Gaya and from Wa.


      You know what Silla's king Jinheung wants. If Baekje is beaten, you have no friend left
      in the peninsula. If it wins, it will own you.
    choices:
      - label: "Send your soldiers to march with Seong"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Your men march with Baekje's, and with the Wa troops. At Gwansan fortress, in the
          night, Silla's men ambush the Baekje king and his small guard, and Seong is killed.
          Baekje's army is broken, and Silla is master of the peninsula's north and centre.
        deeds: {martial_bp: 300, grudges: {silla: 3000}}
      - label: "Hold your army at home"
        legitimacy_bp: 500
        outcome: >-
          Baekje marches without you. When Seong dies, you are the only one left to
          face Silla, with no friend.
        deeds: {grudges: {baekje: 1500}}
      - label: "Send word to Jinheung of Seong's plans"
        legitimacy_bp: -1500
        outcome: >-
          Silla thanks you. Baekje's king is killed all the same, and nobody trusts a league
          whose king sells its friends.
        deeds: {grudges: {baekje: 4000}}
    history: >-
      The Samguk sagi (Baekje and Silla annals, 554) and the Nihon shoki (Kinmei 15) record
      that King Seong attacked Silla in 554 with Gaya and Wa troops and was killed in an ambush at
      Gwansan fortress (near modern Okcheon).
    diverged: >-
      Baekje or Silla is gone.
    sources: ["Samguk sagi, Baekje annals (554), Silla annals (554)", "Nihon shoki, Kinmei 15", "Best, A History of the Early Korean Kingdom of Paekche (2006)"]

  - id: gaya_daegaya
    scenario: three_kingdoms
    civ: gaya
    year: 562
    title: "The Gate of Daegaya"
    place: "Goryeong"
    speaker: general
    speaker_name: "Your commander of the gate"
    speaker_title: "On the wall"
    needs_alive: [silla]
    benchmark_provinces: 1
    story: >-
      You are Doseolji, the last king of Daegaya, the story says. Your tombs in the hills
      outside the city have held kings buried with their servants. Silla's king Jinheung says
      that you have rebelled, and has sent the old general Isabu with an army.


      Your scouts say the army includes a company of young nobles, led by a boy of sixteen,
      Sadaham, and that they are riding for the gate.
    choices:
      - label: "Hold the gates and fight"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          Sadaham's horsemen ride in at the gate before the defenders can close it, and the
          city falls. Daegaya is gone, and with it the last Gaya state. A Gaya musician,
          Ureuk, goes to Silla with his zither, and the gayageum goes on being played.
        deeds: {ruler_falls: "loses Daegaya to Silla"}
      - label: "Surrender the city on terms before the army arrives"
        legitimacy_bp: -1500
        outcome: >-
          Isabu accepts, and your family is given rank. Gaya is gone all the same.
        deeds: {ruler_falls: "gives Daegaya to Silla"}
      - label: "Send your family to Baekje, and the army to the hills"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          Your family reaches Baekje. Your army holds the hill roads for a season.
    history: >-
      The Samguk sagi records that in 562 Daegaya rebelled and King Jinheung sent Isabu with
      an army, Sadaham leading the vanguard; Sadaham rode in at the gate and Gaya was ended.
      The Samguk sagi does not name Daegaya's king; the late tradition calls him Doseolji. The
      musician Ureuk, who left for Silla before the fall, is said to have composed music for
      the gayageum.
    diverged: >-
      Silla is gone.
    sources: ["Samguk sagi 44 (Sadaham)", "Samguk sagi 4 (Jinheung, 562)", "Samguk sagi 32 (music)", "Samguk yusa 2 (Garak-guk gi)"]
