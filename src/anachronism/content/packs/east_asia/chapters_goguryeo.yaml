schema_version: 1
# Chronicle mode (D-120, D-131): Goguryeo under Gwanggaeto the Great and Jangsu, AD 400-475.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Gwanggaeto stele (414), the Samguk sagi (1145) and the Chinese dynastic
# histories (Jin shu, Wei shu, Song shu), with modern work by Byington and Lee Ki-baik; the
# Samguk sagi was written seven centuries later and its stories are told as stories. The
# early Japanese side (the 'Wa') is known mostly from these same Korean and Chinese texts.
# benchmark_provinces counts the provinces of this map the real Goguryeo held at that date.
chapters:
  - id: gog_silla
    scenario: three_kingdoms
    civ: goguryeo
    year: 400
    title: "Fifty Thousand for Silla"
    place: "Gungnae, on the Yalu"
    speaker: silla
    speaker_name: "Envoy of King Naemul"
    speaker_title: "From Silla"
    benchmark_provinces: 4
    story: >-
      Last year King Naemul of Silla sent to you in despair: the Wa from across the sea had
      filled his land, broken his walls and made his people their slaves. 'I am your
      subject,' he wrote, 'and I look to you for orders.' You sent his envoy home with a
      secret plan.


      Now the Wa have come back, with Baekje's blessing and Gaya's iron, and the envoy is
      here again. You are twenty-six and have been king for nine years. Your reign's name is
      Yeongnak, 'eternal joy' - the first king of the east to take one of his own instead of
      counting in a Chinese emperor's years. You have already taken fifty-eight walled towns
      from Baekje and made its king swear to be your slave forever.
    choices:
      - label: "Send fifty thousand horse and foot to save Silla"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          Your army, horsemen in scale armour on armoured horses, sweeps down the
          peninsula. The Wa fall back before it into Gaya; your men follow them to the iron
          town of Jongbal and take it. Silla's new king sends his own nephew to Gungnae as a
          hostage. The south now knows whose protection matters.
        deeds: {war_with: [wa], grudges: {gaya: 2500, baekje: 1500}}
      - label: "Let Silla fend for itself"
        legitimacy_bp: -1000
        outcome: >-
          The Wa burn Silla's towns at their leisure. In Gyeongju they learn that Goguryeo's
          protection is a word, not an army.
        deeds: {break_away: [silla]}
      - label: "Send an army, and keep it there"
        legitimacy_bp: 800
        unrest_bp: 800
        outcome: >-
          Your soldiers drive out the Wa - and stay, in a fort beside the Silla king's
          palace. He thanks you through his teeth.
        deeds: {war_with: [wa], take: [k4_jinhan], grudges: {silla: 3000, gaya: 2000}}
    history: >-
      The Gwanggaeto stele records that in 400 the king sent 50,000 troops to relieve
      Silla, pursued the Wa to Imna Gara and took Jongbal castle. Goguryeo soldiers and
      influence remained in Silla for decades: a Goguryeo bronze bowl inscribed with
      Gwanggaeto's name was found in a 5th-century Silla tomb at Gyeongju.
    sources: ["Gwanggaeto stele, year 10", "Samguk sagi, Silla annals", "Lee Ki-baik, A New History of Korea (1984)"]

  - id: gog_liaodong
    scenario: three_kingdoms
    civ: goguryeo
    year: 402
    until_year: 408
    title: "Across the Liao"
    place: "The Liao river"
    speaker: general
    speaker_name: "Your marshal of the west"
    speaker_title: "Commander on the Liao"
    needs_alive: [later_yan]
    needs_war_with: [later_yan]
    needs_owner: {k4_liaodong: later_yan}
    benchmark_provinces: 4
    story: >-
      While your army was in Silla, the Murong of Later Yan crossed the Liao with thirty
      thousand men and took two of your towns. Their king, Murong Sheng, is dead now - killed
      by his own officers - and his uncle Murong Xi, seventeen, rules from Longcheng, more
      interested in his new empress than in his frontier.


      Beyond the river lies the plain of Liaodong: the walled city that the Chinese built
      there five hundred years ago, salt, iron, grain, and the road west. Goguryeo's kings
      have wanted it for three centuries.
    choices:
      - label: "Cross the Liao, and take the plain"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Your horsemen take Sukgun fortress, and the Yan governor flees to Pingzhou. Over
          the next two years the whole of Liaodong comes into your hands. For the first
          time, Goguryeo's border is the Liao river - and it will stay there for two
          hundred and fifty years.
        deeds: {take: [k4_liaodong], grudges: {later_yan: 3000}}
      - label: "Raid across the river, and come home rich"
        wealth_bp: 2000
        food_bp: 1000
        outcome: >-
          Your horsemen burn the Yan farms to the walls of Liaodong city and drive the herds
          home. The Yan are poorer; you are richer; the border is where it was.
        deeds: {grudges: {later_yan: 2000}}
      - label: "✦ Haul siege towers on horse-collar teams, and take Longcheng too"
        needs_adopted: [horse_collar]
        legitimacy_bp: 2500
        outcome: >-
          Your horses pull from their shoulders now, not their throats, and every team
          drags twice what it did. Siege towers roll across the Liao behind your army and on
          over the hills. Liaodong falls, then Longcheng itself. Murong Xi flees west.
        deeds: {take: [k4_liaodong, k4_longcheng], grudges: {later_yan: 5000}}
    history: >-
      Goguryeo attacked Later Yan's Sukgun fortress in 402 and took Liaodong around 404-405.
      It held the region until the Tang conquest of 668.
    diverged: >-
      Liaodong is not Yan's to lose: the war on the Liao never happens.
    sources: ["Samguk sagi, Goguryeo annals", "Jin shu 124 (Murong Sheng, Murong Xi)"]

  - id: gog_daebang
    scenario: three_kingdoms
    civ: goguryeo
    year: 404
    until_year: 408
    title: "The Wa on the Daebang Coast"
    place: "The old Daebang commandery, south of Pyongyang"
    speaker: general
    speaker_name: "Your marshal of the south"
    speaker_title: "Commander at Pyongyang"
    needs_war_with: [wa]
    needs_alive: [wa]
    benchmark_provinces: 5
    story: >-
      The Wa have landed again - this time not in Silla but on your own coast, in the old
      Daebang lands, with Baekje ships to carry them. They are said to be marching on
      Pyongyang.


      Your marshal asks whether you will come yourself.
    choices:
      - label: "Lead the army yourself, and throw them into the sea"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You march south with the royal guard and catch the Wa between your cavalry and
          the shore. The stele will say that they were cut down in countless numbers. No
          Wa army will land in Goguryeo again.
        deeds: {grudges: {wa: 2000, baekje: 2000}}
      - label: "Hold the walls and let them go home with their loot"
        legitimacy_bp: -800
        food_bp: -1000
        outcome: >-
          The Wa plunder the coast for a summer and sail away. Your marshal does not look
          you in the eye.
      - label: "Offer the Wa peace, and trade for their iron"
        legitimacy_bp: -300
        wealth_bp: 1500
        outcome: >-
          The Wa captains are surprised, then interested. They sail home with Goguryeo
          furs and silks.
        deeds: {peace_with: [wa]}
    history: >-
      The Gwanggaeto stele records that in 404 the Wa invaded the Daebang region and were
      routed by the king, 'cut down in countless numbers'.
    diverged: >-
      There is no war with the Wa, and no landing on the Daebang coast.
    sources: ["Gwanggaeto stele, year 14"]

  - id: gog_murong_xi
    scenario: three_kingdoms
    civ: goguryeo
    year: 405
    until_year: 410
    title: "The Empress Must Enter First"
    place: "Liaodong city"
    speaker: general
    speaker_name: "The commander of Liaodong"
    speaker_title: "Holding the walls"
    needs_alive: [later_yan]
    needs_owner: {k4_liaodong: goguryeo}
    benchmark_provinces: 5
    story: >-
      Murong Xi has come back to Liaodong with the army of Yan, and his empress Fu
      Xunying rides beside him in a carriage. For twenty days his men have battered your
      walls. This morning a stretch of the wall came down, and the Yan soldiers were
      pouring towards the breach -


      - and stopped. Murong Xi had ordered them back: no one was to go in until the road
      was smoothed, so that he and the empress could ride in first in their carriage.


      The breach is open. The Yan army is waiting for a road to be built.
    choices:
      - label: "Rebuild the wall tonight, with everything in the city"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Every man, woman and child in Liaodong carries stones and timber through the
          night. By morning the breach is closed. When the Yan come on again they find a
          new wall and hot pitch. In the winter mud, Murong Xi goes home. A year later he
          tries again at another fort, and fails again.
        deeds: {grudges: {later_yan: 2000}}
      - label: "Sally out through the breach while they wait"
        legitimacy_bp: 2000
        food_bp: -500
        outcome: >-
          Your horsemen burst out of the breach into an army standing in ranks with nothing
          to do. The Yan break. Murong Xi's carriage is found in the ditch, empty.
        deeds: {grudges: {later_yan: 3000}}
      - label: "✦ Roll fire-powder pots down on them from the walls"
        needs_adopted: [gunpowder]
        legitimacy_bp: 2500
        outcome: >-
          Clay pots packed with the new black powder burst among the waiting Yan with a
          noise like the end of the world. Their horses bolt; their army runs. Your
          horsemen follow them all the way to Longcheng.
        deeds: {take: [k4_longcheng], grudges: {later_yan: 4000}}
    history: >-
      In 405 Murong Xi besieged Liaodong; according to the Jin shu, when the wall was about
      to fall he ordered his men not to go in until the way was levelled so that he and
      Empress Fu could enter in their carriage, and the defenders repaired the wall in
      time. He failed again at Mokjeo in 406.
    diverged: >-
      Liaodong is not yours, or Yan is gone: there is no siege.
    sources: ["Jin shu 124 (Murong Xi)", "Zizhi tongjian 114"]

  - id: gog_gao_yun
    scenario: three_kingdoms
    civ: goguryeo
    year: 407
    until_year: 412
    title: "A Cousin on the Dragon Throne"
    place: "Gungnae"
    speaker: later_yan
    speaker_name: "Gao Yun"
    speaker_title: "The new king in Longcheng"
    needs_alive: [later_yan]
    benchmark_provinces: 5
    story: >-
      Empress Fu is dead, and Murong Xi made his whole court mourn her and dug a tomb so
      large that the treasury emptied. Then his generals killed him. The man they have put
      on the throne in Longcheng is Gao Yun - whose grandfather was a prince of Goguryeo,
      carried off as a prisoner when the Murong sacked your capital sixty years ago.


      His envoy says that Gao Yun has not forgotten whose blood he has. He would like
      peace between Yan and Goguryeo, as between kin.
    choices:
      - label: "Send him your greetings, as one of the family"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Your envoy goes to Longcheng with gifts and a letter about 'our common ancestors'.
          Gao Yun sends back an envoy of his own. The Liao frontier falls quiet for the first
          time in a hundred years.
        deeds: {peace_with: [later_yan]}
      - label: "Strike now, while Longcheng is in turmoil"
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Your army crosses the Liao while Yan's generals are still murdering each other.
        deeds: {war_with: [later_yan], take: [k4_longcheng], grudges: {later_yan: 4000}}
    history: >-
      In 407 Feng Ba killed Murong Xi and put Gao Yun (Murong Yun), a descendant of
      Goguryeo's royal house, on the throne of Yan. In 408 Gwanggaeto sent an envoy to
      recognise him as kin. Gao Yun was murdered in 409, and Feng Ba founded Northern Yan.
    diverged: >-
      Yan is gone, and no cousin sits on its throne.
    sources: ["Samguk sagi, Goguryeo annals (408)", "Jin shu 124"]

  - id: gog_buyeo
    scenario: three_kingdoms
    civ: goguryeo
    year: 410
    until_year: 414
    title: "The Last Campaign"
    place: "The road to Eastern Buyeo"
    speaker: general
    speaker_name: "Your marshal of the north"
    speaker_title: "Commander of the royal guard"
    benchmark_provinces: 5
    story: >-
      Eastern Buyeo, far to the north-east in the forests, was once the home of your
      ancestors: Jumong, founder of Goguryeo, fled from Buyeo on a bridge of fishes and
      turtles. Its chiefs have stopped sending tribute.


      You are thirty-six. You have taken sixty-four walled towns and fourteen hundred
      villages. You would like to see the forests where Jumong was born.
    choices:
      - label: "Lead the march to Eastern Buyeo yourself"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          At the sight of your army the chiefs of Eastern Buyeo come out to submit. Their
          lands, and the forest peoples beyond, send tribute to Gungnae again.
        deeds: {take: [k4_mohe]}
      - label: "Send a general, and stay home"
        legitimacy_bp: 500
        outcome: >-
          Your general does the work. The chiefs submit, a little less humbly.
        deeds: {take: [k4_mohe]}
      - label: "Let the forest keep its chiefs"
        outcome: >-
          Eastern Buyeo sends no tribute and receives no army.
    history: >-
      In 410 Gwanggaeto marched against Eastern Buyeo, which submitted. The stele lists
      the towns and villages his reign brought under Goguryeo.
    diverged: >-
      The forests of the north are out of reach.
    sources: ["Gwanggaeto stele, year 20"]

  - id: gog_great_king
    scenario: three_kingdoms
    civ: goguryeo
    year: 412
    until_year: 416
    title: "The Great King Dies"
    place: "Gungnae"
    speaker: steward
    speaker_name: "Prince Geoyeon"
    speaker_title: "Crown prince, nineteen"
    benchmark_provinces: 6
    story: >-
      You are thirty-nine, and you are dying. The physicians have nothing left to try.
      Your son Geoyeon sits by your bed: a tall, grave young man who reads Chinese better
      than you ever did and has never yet led an army.


      There is time for one more command. The kingdom has never been larger. What will you
      tell him?
    choices:
      - label: "'Hold what we have; grow strong; then go south'"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          King Gwanggaeto - 'broad opener of lands' - dies in the twenty-second year of
          Eternal Joy. Geoyeon becomes king. He will reign for seventy-nine years and outlive
          everyone in this room, and history will call him Jangsu: 'long life'.
        deeds: {ruler_falls: "dies at thirty-nine", peace_with: [wa]}
      - label: "'Never stop. Our horsemen are the best under heaven'"
        legitimacy_bp: 200
        unrest_bp: 800
        outcome: >-
          The great king dies. Geoyeon calls the generals together the day after the
          funeral.
        deeds: {ruler_falls: "dies at thirty-nine", martial_bp: 2000}
      - label: "'Make friends with the Chinese courts, and learn from them'"
        legitimacy_bp: 300
        knowledge_bp: 2000
        outcome: >-
          The great king dies. Geoyeon sends envoys to the Jin court in the south and to Wei
          in the north, with scholars in their trains.
        deeds: {ruler_falls: "dies at thirty-nine", peace_with: [later_yan, northern_wei]}
    history: >-
      Gwanggaeto died in 412 or 413 aged 39 (the stele and the Samguk sagi disagree by a
      year). His son Jangsu reigned until 491 and died at 97.
    sources: ["Gwanggaeto stele", "Samguk sagi, Goguryeo annals"]

  - id: gog_stele
    scenario: three_kingdoms
    civ: goguryeo
    year: 414
    after: [gog_great_king]
    title: "A Stone for the Great King"
    place: "Beside the royal tomb, Gungnae"
    speaker: scholar
    speaker_name: "Your court scribe"
    speaker_title: "Keeper of the records"
    benchmark_provinces: 6
    story: >-
      Your father lies in his great stone tomb. The court asks how his deeds should be
      remembered. Your scribe proposes a stone: a single block of rough volcanic rock six
      metres tall, carved on all four sides with the story of the kingdom from Jumong to
      your father's last campaign - every town he took, and the families charged with
      guarding his tomb forever.


      Every king's deeds fade. Stone does not.
    choices:
      - label: "Raise the stone, and carve every deed"
        historical: true
        legitimacy_bp: 2000
        materials_bp: -1000
        outcome: >-
          Seventeen hundred and seventy-five characters are cut into the four faces of the
          stone. It will stand there, half forgotten, until Chinese farmers clearing the
          ground find it under the moss in the 1870s, and scholars from three countries
          start arguing about every line.
      - label: "Spend it on the living: grain for the families of the soldiers"
        food_bp: -2000
        unrest_bp: -1000
        outcome: >-
          The widows and the wounded are fed. The great king gets a tomb and a short entry in
          the annals.
      - label: "✦ Print his deeds, and send a copy to every town"
        needs_adopted: [woodblock_printing]
        legitimacy_bp: 2500
        knowledge_bp: 1500
        outcome: >-
          The scribes carve the text on wooden blocks and print it a thousand times on
          paper. Every walled town in the kingdom has a copy; children learn to read from
          the deeds of the Great King. The stone is raised too.
    history: >-
      The Gwanggaeto stele was raised in 414 near his tomb at Ji'an (Gungnae) and
      rediscovered around 1875-1880. It is the longest early Korean inscription, and its
      lines about the Wa have been argued over by Korean, Japanese and Chinese historians
      ever since.
    sources: ["Gwanggaeto stele", "Ikeuchi; Wang Jianqun; Takeda Yukio (stele studies)"]

  - id: gog_pyongyang
    scenario: three_kingdoms
    civ: goguryeo
    year: 427
    until_year: 440
    title: "The Move to Pyongyang"
    place: "Gungnae"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Daedaero"
    needs_owner: {k4_pyongyang: goguryeo, k4_gungnae: goguryeo}
    benchmark_provinces: 6
    story: >-
      Gungnae has been the capital for four hundred years, tucked into the mountains on the
      Yalu where no Chinese army could easily reach it. The great families have their
      tombs and their estates here.


      But the kingdom has moved south. Pyongyang, on the Taedong river, has the old
      Chinese commandery's fields and the ports to the Yellow Sea, and it is three hundred
      kilometres nearer Baekje. The great families will hate it. You are thirty-three.
    choices:
      - label: "Move the court to Pyongyang"
        historical: true
        legitimacy_bp: 1000
        materials_bp: -2000
        influence: {nobility: -1500}
        outcome: >-
          The court moves south. A new palace rises at Anhak, and a mountain fortress behind
          it. The old families grumble in Gungnae, and many of them come anyway.
        deeds: {capital: k4_pyongyang}
      - label: "Stay in the mountains"
        influence: {nobility: 1000}
        outcome: >-
          The court stays where it has always been. Pyongyang remains a provincial city,
          and the south stays far away.
    history: >-
      Jangsu moved the capital from Gungnae to Pyongyang in 427, signalling Goguryeo's
      turn south against Baekje and Silla.
    diverged: >-
      Goguryeo no longer holds both cities: the court cannot move.
    sources: ["Samguk sagi, Goguryeo annals (427)"]

  - id: gog_naje
    scenario: three_kingdoms
    civ: goguryeo
    year: 433
    until_year: 445
    title: "Baekje and Silla Shake Hands"
    place: "Pyongyang"
    speaker: general
    speaker_name: "Your envoy to Silla"
    speaker_title: "Back from Gyeongju"
    needs_alive: [silla, baekje]
    benchmark_provinces: 6
    story: >-
      For a generation Silla has been your little brother: Goguryeo soldiers in its
      capital, its princes hostages in yours. Now your envoy brings bad news. King Nulji of
      Silla has made peace with Baekje. Envoys have gone back and forth with gifts of
      white falcons and fine horses.


      Everyone understands what it means. The two kingdoms of the south are afraid of
      you.
    choices:
      - label: "Let them make their peace; Goguryeo can wait"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          You do nothing for now. Silla's king quietly sends your soldiers home from his
          capital. The two southern kingdoms will stand together against you for a
          hundred and twenty years.
        deeds: {break_away: [silla], grudges: {silla: 1500}}
      - label: "Send an army into Silla to remind Nulji who his friends are"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your horsemen ride through Silla's western valleys. Nulji apologises, sends a
          prince to Pyongyang, and goes on talking to Baekje in secret.
        deeds: {grudges: {silla: 3000, baekje: 1500}}
      - label: "Offer Silla a marriage and a share of Baekje"
        legitimacy_bp: 300
        wealth_bp: -1500
        outcome: >-
          Nulji is tempted. He takes your gifts, and your princess, and keeps his treaty with
          Baekje anyway - but more quietly.
    history: >-
      In 433 Silla and Baekje made peace (the 'Naje alliance'), the beginning of a
      long cooperation against Goguryeo that lasted until Silla turned on Baekje in 553.
    diverged: >-
      One of the southern kingdoms is gone; there is no alliance to make.
    sources: ["Samguk sagi, Baekje annals (433), Silla annals (434)"]

  - id: gog_feng_hong
    scenario: three_kingdoms
    civ: goguryeo
    year: 436
    until_year: 446
    title: "A Guest from Longcheng"
    place: "Pyongyang"
    speaker: northern_wei
    speaker_name: "Envoy of Emperor Taiwu"
    speaker_title: "From the Wei court at Pingcheng"
    needs_alive: [northern_wei, later_yan]
    needs_owner: {k4_longcheng: later_yan}
    benchmark_provinces: 6
    story: >-
      The armies of Wei are at the gates of Longcheng. Emperor Taiwu, master of all north
      China, has come to finish Yan, and its last king, Feng Hong, has sent to you begging
      for refuge for himself, his household and as many of his people as can get out.


      The Wei envoy is in Pyongyang too. If Feng Hong comes to you, he says, the emperor
      will want him back. And Feng Hong, your envoys warn, is not an easy guest: he still
      thinks he is a king, and he has friends at the southern Chinese court.
    choices:
      - label: "Bring him out, refuse Wei - and later rid yourself of him"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Your army reaches Longcheng first, loads Feng Hong's people and treasure into
          carts and burns the empty city behind them; the fires are seen for ten days. Wei
          takes the ashes. You tell the Wei envoy that Feng Hong is your guest. Two years
          later, when ships come from the south to fetch him, you have him and his sons
          killed. You keep his people, and his treasure.
        wealth_bp: 1000
        deeds: {men: 8000, grudges: {northern_wei: 1500}}
      - label: "Refuse him, and stay friends with Wei"
        legitimacy_bp: -800
        outcome: >-
          Your envoy tells Feng Hong that Goguryeo cannot help. Longcheng falls to Wei; Feng
          Hong dies in it. The emperor is pleased; your court is ashamed.
        deeds: {ally_with: [northern_wei]}
      - label: "Take Longcheng yourself before Wei can"
        legitimacy_bp: 1000
        unrest_bp: 800
        outcome: >-
          Your horsemen ride into Longcheng as Feng Hong rides out to meet them. The Wei
          army arrives to find Goguryeo banners on the walls - and an angry emperor begins
          to think about the east.
        deeds: {take: [k4_longcheng], grudges: {northern_wei: 4000}}
    history: >-
      Northern Wei took Longcheng in 436. Goguryeo troops escorted Feng Hong and his people
      to Liaodong, refused to give him up to Wei, and in 438 killed him when he tried to
      leave for the Liu Song court.
    diverged: >-
      Yan is already gone, or Wei with it: no fugitive king comes to you.
    sources: ["Wei shu 97 (Feng Hong)", "Song shu 97 (Goguryeo)", "Samguk sagi (436, 438)"]

  - id: gog_silla_general
    scenario: three_kingdoms
    civ: goguryeo
    year: 450
    until_year: 470
    title: "A General Killed While Hunting"
    place: "The eastern coast"
    speaker: general
    speaker_name: "Your marshal of the east"
    speaker_title: "Commander in the east"
    needs_alive: [silla]
    benchmark_provinces: 6
    story: >-
      One of your generals was out hunting on Silla's border, on the east coast. Silla's
      commander at Haseulla had him seized and killed.


      Silla's king has sent an envoy at speed with apologies. Your marshal of the east
      would rather send an army, and says the eastern mountains between the two kingdoms
      are thinly held.
    choices:
      - label: "Send the army into Silla's west, then accept the apology"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your army ravages Silla's western border. King Nulji grovels in the proper form;
          your marshal comes home with captives. Over the next twenty years Goguryeo's hold
          on the east coast creeps south, deep into Silla's old lands.
        deeds: {take: [k4_gangwon], grudges: {silla: 2000}}
      - label: "Accept the apology and the gifts"
        wealth_bp: 1000
        legitimacy_bp: -300
        outcome: >-
          Silla sends gold and a hostage. Your marshal is not happy.
      - label: "Make war on Silla in earnest"
        unrest_bp: 1000
        outcome: >-
          Your horsemen pour across the mountains. Baekje, true to its treaty, sends an army
          to help Silla.
        deeds: {war_with: [silla], take: [k4_gangwon], grudges: {silla: 3000, baekje: 2000}}
    history: >-
      In 450 Silla's commander at Haseulla killed a Goguryeo general who was hunting; Jangsu
      attacked Silla's western border and King Nulji apologised. Goguryeo inscriptions
      and the Jungwon stele show its power reached deep into central Korea in this century.
    diverged: >-
      Silla is gone; there is no border to hunt on.
    sources: ["Samguk sagi, Silla annals (450)", "The Jungwon Goguryeo stele (5th century)"]

  - id: gog_gaero_letter
    scenario: three_kingdoms
    civ: goguryeo
    year: 472
    until_year: 476
    title: "Baekje Writes to the Emperor"
    place: "Pyongyang"
    speaker: northern_wei
    speaker_name: "Envoy of Emperor Xiaowen"
    speaker_title: "From the Wei court"
    needs_alive: [baekje, northern_wei]
    benchmark_provinces: 6
    story: >-
      King Gaero of Baekje has written to the Wei emperor - the letter has been shown to
      you - calling you a 'wild dog' and begging Wei to send an army to destroy Goguryeo,
      which he says is rotten with cruelty and ripe to fall.


      The Wei emperor has not sent an army. He has sent an envoy - to you - asking politely
      what all this is about, and whether the envoy might pass through your land to reach
      Baekje.
    choices:
      - label: "Feast the envoy - and lose his road to Baekje"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          The envoy is treated to every courtesy. Somehow the roads south are always
          flooded, the guides always ill, the boats always leaking. He goes home. Wei
          tells Baekje to make its own peace with Goguryeo. Gaero has called you a dog in
          front of the emperor for nothing.
        deeds: {grudges: {baekje: 1500}}
      - label: "Let him go, and send your own letter about Baekje"
        legitimacy_bp: 300
        outcome: >-
          Your letter is longer than Gaero's, and better written. The emperor says that both
          kings are his loyal vassals and should stop quarrelling.
    history: >-
      In 472 Gaero of Baekje asked Northern Wei for an army against Goguryeo. Wei refused
      and sent envoys, whom Goguryeo prevented from reaching Baekje. The letter survives in
      the Wei shu.
    diverged: >-
      Baekje or Wei is gone; there is no letter.
    sources: ["Wei shu 100 (Baekje)", "Samguk sagi, Baekje annals (472)"]

  - id: gog_dorim
    scenario: three_kingdoms
    civ: goguryeo
    year: 475
    until_year: 480
    title: "The Monk Who Played Baduk"
    place: "Pyongyang"
    speaker: scholar
    speaker_name: "Dorim"
    speaker_title: "A monk, and your agent"
    needs_alive: [baekje]
    needs_owner: {k4_hanseong: baekje}
    benchmark_provinces: 6
    story: >-
      Some years ago you sent a monk called Dorim to Baekje. He pretended to have fled
      Goguryeo in disgrace. King Gaero loves baduk, the game of black and white stones, and
      Dorim is the best player in either kingdom. He became the king's friend.


      Then Dorim talked. A king like Gaero, he said, deserved walls worthy of him, a palace
      worthy of him, a tomb worthy of his ancestors, dikes along the Han. Gaero built them
      all. Dorim is back in Pyongyang now. Baekje's granaries, he says, are empty, its
      people worn out, its king friendless.
    choices:
      - label: "Thirty thousand men to Hanseong"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Your army crosses the Han and storms the northern city in seven days. Gaero flees
          with a few horsemen and is caught. Two of your generals - Baekje men who fled to
          you years ago - spit in his face and send him to Acha Fortress to be beheaded. His
          son escapes south to Ungjin with the remnant of the court. The Han river is yours.
        deeds: {war_with: [baekje], take: [k4_hanseong], grudges: {baekje: 6000, silla: 2000}}
      - label: "Let Baekje rot a little longer"
        outcome: >-
          Dorim smiles and goes back to his temple. Baekje mends its granaries.
      - label: "✦ Bring bronze cannon to Hanseong's earthen walls"
        needs_adopted: [cannon]
        legitimacy_bp: 2500
        outcome: >-
          Your guns open the walls of Hanseong in an afternoon, and the roads south are open
          before the Baekje court can flee. Ungjin falls before it can be fortified.
        deeds: {war_with: [baekje], take: [k4_hanseong, k4_ungjin], grudges: {baekje: 6000, silla: 2500}}
    history: >-
      In 475 Jangsu took Hanseong, Baekje's capital, and killed King Gaero; Baekje's court
      moved south to Ungjin (Gongju). The tale of the monk Dorim comes from the Samguk sagi.
      Goguryeo held the Han valley until 551.
    diverged: >-
      Hanseong is not Baekje's to lose: the great blow is never struck.
    sources: ["Samguk sagi, Baekje annals (475)", "Nihon shoki, Yuryaku 20"]
