schema_version: 1
# Chronicle mode (D-120, D-142): the Southern Song in the Mongol century, 1206-1279.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Song shi (compiled under the Mongols in 1345), the Jin shi, Zhao Gong's
# Mengda beilu, Zhou Mi's memoirs of Hangzhou, Wen Tianxiang's own writings, and modern
# work by Davis, Lorge, Mote and Gernet. benchmark_provinces counts the provinces of this
# map the real Song held at that date.
chapters:
  - id: song_kaixi
    scenario: great_khan
    civ: southern_song
    year: 1206
    title: "The Head of Han Tuozhou"
    place: "Lin'an (Hangzhou)"
    speaker: steward
    speaker_name: "Shi Miyuan"
    speaker_title: "Vice-minister of rites"
    benchmark_provinces: 10
    story: >-
      Your chief minister Han Tuozhou launched a war this year to win back the north from the
      Jurchen Jin, who took it from your ancestors eighty years ago. It has gone badly: the
      armies have been beaten everywhere except where the general Bi Zaiyu fought, and now the
      Jin are across the Huai river.


      The Jin will make peace, their envoys say. They want more tribute. And they want the
      head of the man who started the war.
    choices:
      - label: "Let Shi Miyuan settle it with the Jin"
        historical: true
        legitimacy_bp: -1000
        wealth_bp: -2000
        outcome: >-
          Han Tuozhou is beaten to death by palace guards on his way to court. His head is
          lacquered and sent to the Jin in a box. Peace is made at Jiading: more silver, more
          silk. Shi Miyuan becomes chief minister, and will run the empire for twenty-six years.
        deeds: {peace_with: [jurchen_jin]}
      - label: "Stand by your minister and fight on"
        legitimacy_bp: 500
        food_bp: -2000
        unrest_bp: 1500
        outcome: >-
          The war on the Huai grinds on for another year. Neither side can break the other.
        deeds: {war_with: [jurchen_jin]}
      - label: "Hold the Huai with Bi Zaiyu's army and bargain"
        legitimacy_bp: 300
        wealth_bp: -1000
        outcome: >-
          Bi Zaiyu's veterans hold the river while your envoys haggle. The Jin find the Huai
          harder to cross than they hoped and lower their price, but the war party at court
          never forgives you for the lost north.
        deeds: {men: 20000, martial_bp: 800}
    history: >-
      The Kaixi war (1206-1207) failed; Han Tuozhou was murdered at Shi Miyuan's instigation and
      his head sent to the Jin as part of the peace of Jiading (1208).
    sources: ["Song shi 474 (Han Tuozhou)", "Davis, Court and Family in Sung China (1986)"]

  - id: song_tribute
    scenario: great_khan
    civ: southern_song
    year: 1214
    title: "Stop the Silver"
    place: "Lin'an"
    speaker: scholar
    speaker_name: "Zhen Dexiu"
    speaker_title: "A Confucian scholar-official"
    needs_alive: [jurchen_jin]
    benchmark_provinces: 10
    story: >-
      News from the north: a new people from the steppe, the Mongols, have beaten the Jin
      armies, besieged their capital, and forced the Jin emperor to flee south to Kaifeng. The
      Jin are weak for the first time in a hundred years.


      The scholar Zhen Dexiu says: why should we go on paying silver to a dying enemy? Stop
      the tribute. Others warn that a wounded tiger bites hardest, and that the Mongols may be
      worse neighbours than the Jin.
    choices:
      - label: "Stop the silver to the Jin"
        historical: true
        wealth_bp: 2000
        legitimacy_bp: 800
        outcome: >-
          The silver stops. The Jin, desperate for money, attack along the Huai in 1217 to take it
          by force, and for seven years the two old enemies wear each other out - while the
          Mongols watch.
        deeds: {war_with: [jurchen_jin]}
      - label: "Keep paying, to keep the Jin as a wall"
        legitimacy_bp: -500
        wealth_bp: -1500
        outcome: >-
          The silver goes north. The Jin, grateful and broke, hold the Mongols a little
          longer. Your scholars grumble that you are feeding a beast that will not live out
          the decade.
        deeds: {peace_with: ["jurchen_jin"]}
      - label: "Pay half, and strengthen the Huai garrisons"
        wealth_bp: 1000
        legitimacy_bp: 700
        food_bp: 1000
        unrest_bp: 400
        outcome: >-
          You send half the silver and put the rest into forts and soldiers along the Huai.
          The Jin complain but accept it; your treasury is lighter and your frontier is better
          manned.
          Their farms along the Huai marshes feed the frontier, and the Jin, still receiving
          half, say little.
        deeds: {men: 15000, martial_bp: 500}
    history: >-
      From 1214 the Song stopped paying tribute to the weakened Jin, who attacked Song in 1217;
      the war lasted until 1224.
    diverged: >-
      The Jin are gone.
    sources: ["Song shi 437 (Zhen Dexiu)", "Jin shi 14"]

  - id: song_zhao_gong
    scenario: great_khan
    civ: southern_song
    year: 1221
    title: "A Full Account of the Mongol Tatars"
    place: "Lin'an"
    speaker: scholar
    speaker_name: "Zhao Gong"
    speaker_title: "Envoy to the Mongol camp"
    benchmark_provinces: 10
    story: >-
      You sent an envoy, Zhao Gong, north to the camp of Muqali, the Mongol commander in
      north China. He has come back with a report like nothing your scholars have read. The
      Mongols, he writes, have no cities and no fields; they eat meat and drink mare's milk;
      every man is a soldier; they can ride for days on dried milk curd. Their khan's name
      is Chinggis. They are interested in an alliance against the Jin.
    choices:
      - label: "Study them, and keep your distance"
        historical: true
        knowledge_bp: 1500
        outcome: >-
          Zhao Gong's book, the Full Account of the Mongol Tatars, is copied and read at court.
          The court decides the Mongols are distant barbarians who will be useful against the
          Jin.
      - label: "Make an alliance with them now"
        legitimacy_bp: 300
        outcome: >-
          Song and Mongol envoys exchange gifts. Muqali's men seem very interested in the roads
          south.
        deeds: {ally_with: [mongols]}
      - label: "Send gifts and a second embassy, with no promises"
        legitimacy_bp: 700
        wealth_bp: -400
        knowledge_bp: 1400
        outcome: >-
          A second embassy goes north with silk and tea and a polite letter that commits you
          to nothing. Muqali's officers write down everything your envoys let slip about the
          roads south.
    history: >-
      Zhao Gong's Mengda beilu (1221) is the earliest surviving Chinese account of the
      Mongols.
    sources: ["Mengda beilu", "Olbricht & Pinks, Meng-Ta Pei-Lu und Hei-Ta Shih-Lüeh (1980)"]

  - id: song_lizong
    scenario: great_khan
    civ: southern_song
    year: 1225
    title: "The Chosen Heir"
    place: "The palace, Lin'an"
    speaker: steward
    speaker_name: "Shi Miyuan"
    speaker_title: "Chief minister"
    benchmark_provinces: 10
    story: >-
      Emperor Ningzong is dead. His adopted heir, Prince Zhao Hong, disliked Shi Miyuan and
      was heard to say that one day he would banish him to the far south. So Shi Miyuan, with
      the empress, put another distant prince, Zhao Yun, on the throne as Emperor Lizong.
      Zhao Hong was made a prince and sent to Huzhou.


      Now some Huzhou men have tried to proclaim Zhao Hong emperor, against his will. The
      rebellion is already over. Shi Miyuan asks what is to be done with the prince.
    choices:
      - label: "Leave the prince's fate to Shi Miyuan"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Zhao Hong is forced to kill himself. The scholar-officials who protest are demoted.
          Shi Miyuan rules on until his death in 1233; the young emperor reads philosophy and
          leaves the government to his ministers.
      - label: "Pardon the prince, who did nothing"
        legitimacy_bp: 800
        influence: {nobility: -500}
        outcome: >-
          Zhao Hong lives quietly in Huzhou. The scholars praise your humanity; Shi Miyuan
          sulks.
      - label: "Send Zhao Hong to a remote county under guard"
        legitimacy_bp: 300
        wealth_bp: -500
        outcome: >-
          The prince is sent to a far county with a guard and a small household. The scholars
          are uneasy that he is neither pardoned nor tried, and Shi Miyuan keeps the guards
          loyal to himself.
    history: >-
      Shi Miyuan engineered Lizong's succession in 1224 and forced Zhao Hong's death after the
      Huzhou incident of 1225, provoking protests from the scholar-officials.
    sources: ["Song shi 246, 414", "Davis (1986)"]

  - id: song_three_capitals
    scenario: great_khan
    civ: southern_song
    year: 1234
    until_year: 1240
    title: "The Three Capitals"
    place: "Lin'an"
    speaker: general
    speaker_name: "Zhao Kui"
    speaker_title: "Commander on the Huai"
    benchmark_provinces: 10
    story: >-
      The Jin are finished: your armies and the Mongols took their last emperor at Caizhou
      together, and Meng Gong brought his bones home. The Mongol armies have ridden back north
      for the summer, and Henan - with the old Song capitals at Kaifeng, Luoyang and the
      southern capital - lies empty between you.


      Zhao Kui says: march now, and take back the three capitals the Jurchen stole from our
      ancestors a hundred years ago. The cautious say that the Mongols will regard it as war.
    choices:
      - label: "March on the three capitals"
        historical: true
        legitimacy_bp: 1000
        food_bp: -2500
        outcome: >-
          Your armies enter a ruined, starving Kaifeng in triumph. Then the food runs out; the
          Mongols break the Yellow River dykes and ambush the column marching on Luoyang. The
          survivors stagger home. The Mongols declare war, and it will last forty-five years.
        deeds: {war_with: [mongols]}
      - label: "Hold the Huai, and send envoys north"
        legitimacy_bp: -300
        wealth_bp: -500
        outcome: >-
          Your envoys congratulate the Great Khan on his victory, with silk for his officers.
          The border stays quiet for now. The Mongols, however, have not forgotten the south.
        deeds: {peace_with: ["mongols"]}
      - label: "Garrison Kaifeng alone, and fortify the road"
        legitimacy_bp: 500
        food_bp: -1000
        outcome: >-
          A small column occupies Kaifeng and holds the road behind it. The empty countryside
          cannot feed it, and the Mongols see Song soldiers on land they think of as theirs.
        deeds: {men: 10000, grudges: {mongols: 1500}}
    history: >-
      In 1234 Song forces occupied Kaifeng and Luoyang after the fall of the Jin; the Mongols
      repulsed them, and the Mongol-Song war began in 1235.
    diverged: >-
      History has turned before the capitals could be claimed.
    sources: ["Song shi 41", "Yuan shi 2", "Lorge, War, Politics and Society in Early Modern China (2005)"]

  - id: song_ci
    scenario: great_khan
    civ: southern_song
    year: 1247
    title: "Washing Away of Wrongs"
    place: "Hunan"
    speaker: scholar
    speaker_name: "Song Ci"
    speaker_title: "Judicial commissioner of Hunan"
    benchmark_provinces: 10
    story: >-
      Your judicial commissioner Song Ci has spent twenty years investigating deaths for the
      courts. He has written a book telling coroners how to examine a body: how to tell
      drowning from murder by water in the lungs, strangling from hanging by the marks on the
      neck; how a sickle with traces of blood draws flies when the murderer's neighbours lay
      their sickles down in the sun.


      He wants it given to every magistrate in the empire.
    choices:
      - label: "Print it and send it to every county"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 800
        unrest_bp: -500
        outcome: >-
          'The Washing Away of Wrongs' goes out to every magistrate. It will still be used in
          Chinese courts six hundred years later, and be translated into Dutch, French and
          English as the first book of forensic medicine.
      - label: "Keep coroners to their old practice"
        wealth_bp: 800
        knowledge_bp: -300
        outcome: >-
          The coroners go on doing what their fathers did. The treasury is spared the cost of
          printing, and the old methods remain unchallenged.
      - label: "✦ Add a lens to every coroner's kit"
        needs_adopted: [microscope]
        knowledge_bp: 3000
        legitimacy_bp: 1200
        outcome: >-
          Through their magnifying lenses your coroners see the fibres under fingernails and
          the grains of poison in the stomach. Murderers learn to fear the coroner.
      - label: "Give it to the judicial commissioner of each circuit"
        knowledge_bp: 1500
        legitimacy_bp: 600
        wealth_bp: -300
        unrest_bp: -500
        outcome: >-
          Each circuit's commissioner receives a copy, and the best of them use it. In the
          counties it is slow to spread, and many coroners never see it.
    history: >-
      Song Ci's Collected Cases of Injustice Rectified (Xi yuan ji lu, 1247) is the oldest
      surviving book on forensic medicine.
    sources: ["Song Ci, Xi yuan ji lu (tr. McKnight, 1981)"]

  - id: song_diaoyu
    scenario: great_khan
    civ: southern_song
    year: 1259
    until_year: 1262
    title: "The Fishing Town Holds"
    place: "Diaoyu fortress, Sichuan"
    speaker: general
    speaker_name: "Wang Jian"
    speaker_title: "Commander of Diaoyu"
    needs_war_with: [mongols]
    benchmark_provinces: 9
    story: >-
      The Great Khan Mongke himself has come to Sichuan with his army and has sat for five
      months below Diaoyu, the 'Fishing Town', a fortress on a cliff above three rivers. Your
      commander Wang Jian has fields and wells inside the walls, and has thrown down every
      assault.


      The Mongols are suffering in the summer heat. Wang Jian wants to send the khan a
      message: two fresh fish and a hundred pancakes, with a note saying the fortress can
      hold out for ten more years.
    choices:
      - label: "Send the khan a message of defiance"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Mongke is said to be furious. A month later he is dead - of dysentery, or of a stone
          from your catapults. His army withdraws to bury him, and the Mongol princes go home to
          fight over the throne. Diaoyu will hold for twenty more years.
        deeds: {grudges: {mongols: 2000}}
      - label: "Sally out against the camp"
        legitimacy_bp: 2200
        food_bp: -700
        wealth_bp: 600
        outcome: >-
          Your sortie burns some siege engines and loses many men. The siege goes on until the
          khan's death.
          The sortie is the talk of the camp, and the stores taken make up for some of the men
          lost.
      - label: "Send an envoy to ask the khan's terms"
        wealth_bp: -1000
        legitimacy_bp: -500
        outcome: >-
          Mongke's answer is the old one: surrender, and your lives will be spared. Wang Jian
          will not accept it, but the court hears of the offer and does not forget it.
    history: >-
      Diaoyucheng withstood Mongke's siege in 1259; Mongke died there in August, possibly of
      illness, possibly of wounds. The fortress held until 1279.
    diverged: >-
      There is no war with the Mongols, and no siege at Diaoyu.
    sources: ["Song shi 44", "Yuan shi 3", "Hechuan county gazetteer"]

  - id: song_jia_sidao
    scenario: great_khan
    civ: southern_song
    year: 1259
    until_year: 1263
    title: "The Secret Truce"
    place: "Ezhou, on the Yangzi"
    speaker: steward
    speaker_name: "Jia Sidao"
    speaker_title: "Chief minister, the emperor's brother-in-law"
    needs_war_with: [mongols]
    benchmark_provinces: 9
    story: >-
      Kublai, the dead khan's brother, has crossed the Yangzi and is besieging Ezhou. But his
      brother Ariq Boke is claiming the throne in Mongolia, and Kublai needs to go home.


      Your chief minister Jia Sidao, who commands at Ezhou, has sent a secret envoy to Kublai
      offering tribute for a truce. Kublai has accepted and gone. Now Jia Sidao asks how the
      victory should be reported to the court.
    choices:
      - label: "Report a great victory; keep the truce secret"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Jia Sidao comes home a hero. When Kublai's envoy arrives to collect the tribute, Jia
          has him locked up for sixteen years so that nobody learns the truth. Kublai, once he
          has beaten his brother, does not forget.
        deeds: {peace_with: [mongols], grudges: {mongols: 3000}}
      - label: "Report the truce honestly, and pay the tribute"
        wealth_bp: -2000
        legitimacy_bp: -800
        outcome: >-
          The court is ashamed and the silver goes north. Kublai keeps his word - for now.
        deeds: {peace_with: [mongols]}
      - label: "Report an honest truce on your own terms, and rearm"
        legitimacy_bp: 1300
        wealth_bp: -300
        outcome: >-
          The court hears that a truce has been made and learns its price. Jia Sidao uses the
          quiet to raise new levies for the Yangzi garrisons; the court is relieved, but the
          tribute is hard to explain.
          The court, relieved, thinks well of him for it.
        deeds: {peace_with: ["mongols"], martial_bp: 800}
    history: >-
      Jia Sidao negotiated with Kublai at Ezhou in 1259, reported a victory, and detained
      Kublai's envoy Hao Jing for sixteen years.
    diverged: >-
      There is no war with the Mongols.
    sources: ["Song shi 474 (Jia Sidao)", "Yuan shi 157 (Hao Jing)"]

  - id: song_xiangyang
    scenario: great_khan
    civ: southern_song
    year: 1268
    until_year: 1276
    title: "Five Years at Xiangyang"
    place: "Xiangyang and Fancheng, on the Han river"
    speaker: general
    speaker_name: "Lü Wenhuan"
    speaker_title: "Commander of Xiangyang"
    needs_owner: {g_xiangyang: southern_song}
    needs_alive: [mongols]
    benchmark_provinces: 9
    story: >-
      Kublai, now emperor of the Mongols and of the north, has sent his armies against
      Xiangyang, the twin city on the Han river that guards the road to the Yangzi. They have
      built forts all around it and blockaded the river with ships.


      Lü Wenhuan has held for years. Jia Sidao keeps the bad news from the emperor and sends
      relief convoys that are cut to pieces. Now news comes that the Mongols have brought
      engineers from Persia who build catapults that throw stones the weight of a man a
      quarter of a mile.
    choices:
      - label: "Hold to the end, and hope for relief"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          The Persian catapults smash Fancheng; one great stone hits a tower of Xiangyang with
          a noise like thunder. Lü Wenhuan surrenders in 1273, and goes over to the Mongols.
          The road to the Yangzi is open.
        deeds: {war_with: [mongols], give: [g_xiangyang], give_to: mongols}
      - label: "Send the whole army of the Yangzi to break the siege"
        food_bp: -3000
        legitimacy_bp: 500
        outcome: >-
          The great relief army fights its way up the Han and into Xiangyang. The city is
          supplied for another two years. The Mongols bring more catapults.
        deeds: {war_with: [mongols]}
      - label: "✦ Answer the catapults with cannon"
        needs_adopted: [cannon]
        legitimacy_bp: 2500
        outcome: >-
          Bronze guns on the walls outrange the Persian catapults and smash them before they
          can be wound. The siege is lifted, and Kublai has to look for another road south.
        deeds: {war_with: [mongols], grudges: {mongols: 3000}}
      - label: "Burn the stores and withdraw the garrison by river"
        legitimacy_bp: -1200
        unrest_bp: 500
        outcome: >-
          Lü Wenhuan's men burn the granaries and take to the boats. The Mongols take an empty
          Xiangyang, and the road to the Yangzi is open without a surrender being signed.
        deeds: {give: ["g_xiangyang"], give_to: "mongols"}
    history: >-
      The Mongols besieged Xiangyang from 1268; Muslim counterweight trebuchets forced its
      surrender in 1273, and Lü Wenhuan joined the Mongols.
    diverged: >-
      Xiangyang is not yours, or the Mongols are gone.
    sources: ["Song shi 46", "Yuan shi 203", "Rashid al-Din"]

  - id: song_linan
    scenario: great_khan
    civ: southern_song
    year: 1276
    until_year: 1282
    title: "The Gates of Lin'an"
    place: "Lin'an"
    speaker: steward
    speaker_name: "Grand Empress Dowager Xie"
    speaker_title: "Regent for the boy emperor"
    needs_war_with: [mongols]
    benchmark_provinces: 7
    story: >-
      Jia Sidao led the last great army out to meet Bayan's Mongols at Dingjiazhou, and it
      broke without fighting. He has been exiled and murdered on the road by his own escort.
      The Mongol army is at the gates of Lin'an, the greatest city in the world, a million
      people.


      The emperor is four years old. His grandmother, the Grand Empress Dowager Xie, is
      sixty-seven. The minister Wen Tianxiang wants to fight in the streets. Bayan has
      promised that if the city surrenders, it will not be sacked.
    choices:
      - label: "Open the gates to spare the people"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          The Empress Dowager hands over the imperial seal. Bayan keeps his word: Lin'an is not
          sacked. The little emperor and his grandmother are taken north to Kublai's court, where
          they are treated with courtesy. But two younger princes have been smuggled out of the
          city, and loyal ministers carry them south to the coast.
        deeds: {ruler_falls: "is taken north as a prisoner of the Mongols", give: [g_linan, g_jiankang, g_huainan], give_to: mongols}
      - label: "Fight for every street of the city"
        legitimacy_bp: 1500
        food_bp: -3000
        outcome: >-
          The city fights. For a month the Mongols cannot get beyond the walls. Then the walls
          go, and Lin'an burns.
        deeds: {give: ["g_jiankang", "g_huainan"], give_to: "mongols"}
      - label: "Take the court by sea to Fujian"
        legitimacy_bp: -800
        outcome: >-
          The court boards ships at the quays of Lin'an and sails south, leaving the city and
          the lower Yangzi to the Mongols. The people of Lin'an are left to Bayan's promise.
        deeds: {give: ["g_linan", "g_jiankang"], give_to: "mongols", capital: "g_fujian"}
    history: >-
      Lin'an surrendered without a fight in February 1276; Emperor Gong and the Grand Empress
      Dowager Xie were taken to Dadu. Loyalists fled south with the princes Zhao Shi and Zhao
      Bing.
    diverged: >-
      The war has ended another way.
    sources: ["Song shi 47", "Yuan shi 127 (Bayan)", "Gernet, Daily Life in China on the Eve of the Mongol Invasion (1962)"]

  - id: song_yamen
    scenario: great_khan
    civ: southern_song
    year: 1279
    until_year: 1285
    after: [song_linan]
    title: "Yamen"
    place: "The mouth of the Pearl River"
    speaker: steward
    speaker_name: "Lu Xiufu"
    speaker_title: "Chief minister of the court at sea"
    needs_war_with: [mongols]
    benchmark_provinces: 2
    story: >-
      The court lives on ships now. The elder prince, made emperor on the coast, died of
      illness after a storm. His seven-year-old brother Zhao Bing is emperor. A thousand
      ships are anchored at Yamen, chained together into a floating fortress, with two
      hundred thousand people aboard: soldiers, officials, wives and children.


      Wen Tianxiang has been captured. The Mongol fleet has cut off your fresh water. Your
      men are drinking seawater and vomiting.
    choices:
      - label: "Fight to the last ship"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The Mongol ships attack at high tide and at low. When your flagship is surrounded, Lu
          Xiufu dresses the boy emperor in his robes, tells him that an emperor must not be
          taken prisoner, takes him on his back and jumps into the sea. Thousands of courtiers
          follow. The Song dynasty is over. In a Mongol prison, Wen Tianxiang refuses to serve
          the new emperor and writes the Song of the Righteous Spirit, which Chinese
          schoolchildren will learn by heart.
        deeds: {ruler_falls: "drowns at Yamen in Lu Xiufu's arms"}
      - label: "Break the chains, and sail for Champa"
        legitimacy_bp: 2100
        unrest_bp: 400
        outcome: >-
          In the night the ships cut their chains and run for the open sea. Some are caught;
          some reach Champa and Vietnam, where the boy emperor's court lives on in exile.
          The escape is told as a bold stroke that kept the line alive.
      - label: "Surrender the fleet to save those aboard"
        legitimacy_bp: -1500
        unrest_bp: -500
        outcome: >-
          Your officers send to the Mongol admiral with the fleet's surrender. The ships are
          taken and the people aboard are spared, but the dynasty ends in a signature rather
          than a battle.
    history: >-
      At Yamen in March 1279 the last Song fleet was destroyed; Lu Xiufu drowned himself with
      the child emperor Zhao Bing. Wen Tianxiang was executed in 1283.
    diverged: >-
      The war has ended another way.
    sources: ["Song shi 47, 451", "Wen Tianxiang, Zhengqi ge"]
