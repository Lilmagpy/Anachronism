schema_version: 1
# Chronicle mode (D-120, D-190): the Miyoshi, from Nagayoshi's mastery of Kyoto to the end of
# the main line at Wakae, 1560-1573. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Tokitsugu kyoki, the Tamon'in nikki (the Kofuku-ji
# monks' diary, which records the burning of the Great Buddha Hall), the Shincho koki, Frois,
# and modern work by Lamers, Turnbull and Berry. The map is coarse: Settsu and Kawachi are one
# province, so the Miyoshi's lands are Settsu (1 province), plus Kyoto after 1565 (2). Later
# events are in the history lines: Matsunaga Hisahide, who submitted to Nobunaga in 1568,
# rebelled in 1577 and died at Shigisan, blowing up his castle with the famous Hiragumo tea
# kettle. The cause of the Todai-ji fire is disputed (later chroniclers blame Hisahide; the
# monks' diary and modern work leave it open) and is told so. Benchmark_provinces cannot go
# below 1; Yoshitsugu's death in 1573 ends the main line and the chronicle.
chapters:
  - id: miy_kyoto
    scenario: sengoku
    civ: miyoshi
    year: 1560
    title: "The Master of the Capital"
    place: "Iimoriyama castle, Kawachi"
    speaker: general
    speaker_name: "Matsunaga Hisahide"
    speaker_title: "Your steward, and a clever man"
    benchmark_provinces: 1
    story: >-
      You are Miyoshi Nagayoshi, thirty-eight. Your family were once only the deputies of the
      Hosokawa, who were the deputies of the shogun. Your father died fighting for them, and you
      have spent your life taking back what the Hosokawa took. You have driven the shogun
      Ashikaga Yoshiteru out of the capital and allowed him to return. You have thrown the
      Hatakeyama out of Kawachi. Your brothers are your best generals.


      Your steward Matsunaga Hisahide, whose family rose from nothing, has just taken Yamato
      with your army. He thinks you should move from Settsu to a great new castle at Iimoriyama,
      above the plain of Kawachi, and put your brothers in charge of the lands round it.
    choices:
      - label: "Make Iimoriyama your seat and post your brothers"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 1000}
        outcome: >-
          You are the master of the lands on both sides of Osaka bay. Your brothers hold Awa,
          Awaji and Sanuki across the water, and Kyoto does what you tell it. What you
          have not got is an heir who is strong, or a family without a quarrel in it.
      - label: "Stay in Settsu and rule through the shogun"
        legitimacy_bp: 500
        wealth_bp: 400
        outcome: >-
          You remain close to the court and the money. The Hatakeyama, in the south, take
          note of your caution.
      - label: "Take up residence in Kyoto by the court"
        legitimacy_bp: 1100
        wealth_bp: 500
        unrest_bp: 400
        outcome: >-
          You move into the capital itself, among the courtiers and the money-lenders. The court
          is flattered and praises the lord who lives among it, the shogun is uneasy, and your
          brothers, left in the provinces, must look after themselves.
    history: >-
      By 1560 Miyoshi Nagayoshi ruled Settsu, Kawachi and Yamato with his steward Matsunaga
      Hisahide, held Kyoto in practice, and had moved to Iimoriyama castle.
    sources: ["Tokitsugu kyoki", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_brothers
    scenario: sengoku
    civ: miyoshi
    year: 1562
    title: "Two Brothers Lost"
    place: "Kumeda, Izumi"
    speaker: general
    speaker_name: "Matsunaga Hisahide"
    speaker_title: "Your steward"
    benchmark_provinces: 1
    story: >-
      The Hatakeyama have come back from the south, with the warrior monks of Negoro and
      Saiga armed with muskets, and the shogun is not unhappy to see you under attack. Last year
      your brother Jikkyu was killed trying to hold Kishiwada. In the spring your brother
      Sogo Kazumasa died at Kumeda, with a hundred of his men.


      Your best generals are gone, and you are afraid the Hatakeyama will be at the gates of
      Iimoriyama before the summer ends.
    choices:
      - label: "Call out every man, and lead them yourself"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1000
        outcome: >-
          Your army, with Hisahide's, defeats the Hatakeyama in a summer campaign. They fall back
          to the south for good. But you have lost two brothers, and are tired.
        deeds: {}
      - label: "Treat with the Hatakeyama"
        legitimacy_bp: -1500
        unrest_bp: 400
        outcome: >-
          They take Izumi for their peace. The shogun is delighted.
      - label: "Send Hisahide to the field, and hold the castle"
        legitimacy_bp: 1000
        wealth_bp: -500
        unrest_bp: 300
        outcome: >-
          Hisahide takes the army south and does what is needed, at a price. The Hatakeyama fall
          back, and your retainers, relieved, accept that the lord of the house must guard its
          heart; a few murmur that a steward won the war.
        deeds: {men: 1500}
    history: >-
      The Miyoshi lost Jikkyu (1561) and Sogo Kazumasa (1562) fighting the Hatakeyama and the
      Negoro monks; Nagayoshi then defeated the Hatakeyama and kept the south.
    sources: ["Tokitsugu kyoki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: miy_heir
    scenario: sengoku
    civ: miyoshi
    year: 1563
    title: "The Death of the Heir"
    place: "Iimoriyama castle"
    speaker: steward
    speaker_name: "Miyoshi Yoshioki"
    speaker_title: "Your son"
    benchmark_provinces: 1
    story: >-
      Your son Yoshioki, twenty-two, the lord of the house in name, has died of a sudden illness
      in the summer. He was to rule Kawachi after you. You are shaken, and the rumours are
      already circulating: Matsunaga Hisahide, they say, whose son Hisamichi is now close to the
      shogun, poisoned him to prevent a strong ruler from coming to power.


      You have a nephew, Jikkyu's son Juro, a boy of fourteen or so. You have no other heir.
    choices:
      - label: "Adopt your nephew Juro as your heir"
        historical: true
        legitimacy_bp: -1500
        influence: {nobility: -500}
        outcome: >-
          The boy is renamed Miyoshi Yoshitsugu. Your wits are going. Nobody in the house knows
          whether Hisahide killed your son or not, and nobody is able to prove that he did.
      - label: "Make Hisahide your regent"
        legitimacy_bp: -2000
        influence: {nobility: -600}
        outcome: >-
          Your brothers' men and your own old retainers are furious, and some of them leave
          the house before the year is out.
      - label: "Name your brother Fuyuyasu your heir"
        legitimacy_bp: -300
        unrest_bp: 300
        influence: {nobility: 500}
        outcome: >-
          Fuyuyasu is a grown man and an able one, and the older retainers are pleased. The
          boy Juro, left out, has friends who are not, and the court says that a brother's line
          is not a son's.
    history: >-
      Nagayoshi's son Yoshioki died in 1563, and the family later said Hisahide had poisoned him;
      Nagayoshi adopted his nephew Yoshitsugu.
    sources: ["Tokitsugu kyoki", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_secret
    scenario: sengoku
    civ: miyoshi
    year: 1564
    title: "A Death Kept Secret"
    place: "Iimoriyama castle"
    speaker: steward
    speaker_name: "Miyoshi Nagayasu"
    speaker_title: "A senior retainer of your house"
    benchmark_provinces: 1
    story: >-
      Your brother Atagi Fuyuyasu is accused of plotting with the Hatakeyama. You listen to
      Hisahide's whisper, and you do not hear Fuyuyasu's defence. You are ill, and weak, and
      your mind wanders.


      In the summer, if you die, your adoptive son Yoshitsugu will be left with a half-wrecked
      house, the shogun waiting to take a revenge, and Hisahide. Your senior retainers are
      already asking what is to be done.
    choices:
      - label: "Have Fuyuyasu put to death"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          Fuyuyasu dies in the spring and you in the summer, aged forty-two. Your retainers keep your
          death secret for two years, so that your enemies will not strike while Yoshitsugu is a boy.
          Three of them, the Miyoshi Three, rule in his name. Kyoto does not know who now holds the
          reins of the house.
        deeds: {}
      - label: "Hear Fuyuyasu out"
        legitimacy_bp: 500
        unrest_bp: -300
        outcome: >-
          Your brother is shown to be innocent. You die all the same, in the summer, and your
          house has one less enemy within it.
      - label: "Confine Fuyuyasu in a temple, and inquire"
        legitimacy_bp: -300
        unrest_bp: 600
        influence: {clergy: 300}
        outcome: >-
          Fuyuyasu is shut up in a temple while your clerks ask questions. The inquiry is
          slow, you are not, and the house is left with an unsettled quarrel and a sick lord.
    history: >-
      Nagayoshi had his brother Atagi Fuyuyasu killed in 1564 and died himself that summer; his
      death was concealed for about two years.
    sources: ["Tokitsugu kyoki", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_eiroku
    scenario: sengoku
    civ: miyoshi
    year: 1565
    title: "The Palace on the Nijo"
    place: "Kyoto"
    speaker: general
    speaker_name: "Matsunaga Hisamichi"
    speaker_title: "Hisahide's son, who leads your men"
    benchmark_provinces: 2
    story: >-
      You are Miyoshi Yoshitsugu, sixteen, lord of the Miyoshi. The shogun Ashikaga Yoshiteru
      is trying to bring the great lords of the provinces together against you. Your three chief
      retainers, the Miyoshi Three, and Hisahide's son Hisamichi say that the shogun must be
      stopped before an army of Uesugi, Takeda and Oda can be gathered.


      They propose to go to the palace with ten thousand men, as petitioners, and ask the shogun
      to replace his advisers.
    choices:
      - label: "Send ten thousand men to petition him"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Your army comes to the gate, and when the shogun's guards refuse to disarm, it breaks
          in. Yoshiteru fights to the end, and is killed with his mother. Court nobles run
          for cover. You make Yoshiteru's cousin Yoshihide shogun. The wise men of Kyoto say
          that a man who has killed a shogun is a lord of nothing but time.
        deeds: {conquer: [ashikaga]}
      - label: "Send envoys with a new set of advisers"
        legitimacy_bp: 500
        wealth_bp: -500
        deeds: {men: 2000}
        outcome: >-
          Yoshiteru refuses and your retainers murmur. Kakukei of Nara, his younger brother, is
          let alone.
      - label: "Arrest the shogun's advisers, and leave him be"
        legitimacy_bp: -500
        unrest_bp: 700
        outcome: >-
          Your men seize the shogun's chief advisers in the city and hold them. Yoshiteru
          writes to the provinces more eagerly than before, and the lords read his letters.
        deeds: {men: 3000}
    history: >-
      On 19 June 1565 Miyoshi Yoshitsugu's men and Matsunaga Hisamichi attacked the Nijo palace
      and killed the shogun Ashikaga Yoshiteru; his brother Kakukei (Yoshiaki) escaped.
    diverged: >-
      The Ashikaga are gone.
    sources: ["Tokitsugu kyoki, Eiroku 8.5", "Frois, Historia de Japam", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_todaiji
    scenario: sengoku
    civ: miyoshi
    year: 1567
    title: "The Great Buddha's Hall"
    place: "Nara"
    speaker: general
    speaker_name: "Miyoshi Masayasu"
    speaker_title: "One of the Miyoshi Three"
    benchmark_provinces: 2
    story: >-
      Matsunaga Hisahide has quarrelled with the Miyoshi Three, and has gone to ground in his
      castle of Tamon in Nara. You, still a boy, are used by both sides. The Three have camped
      at the great temple of Todai-ji, among the monks and the monuments, to surround him.


      They say Hisahide will not be taken while he has his castle. Hisahide's men creep
      close at night.
    choices:
      - label: "Fight Hisahide's men in the temple"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          In the night of the tenth of the tenth month fighting breaks out among the temple
          buildings, and a fire spreads. The Great Buddha Hall, with the great bronze Buddha of
          Nara, burns. The head of the statue melts and falls. Later chroniclers say that Hisahide
          set the fire on purpose; the monks of Kofuku-ji, who kept a diary, do not say so, and
          historians doubt it. Either way, it happened in your camp. Soon after, you leave the Three
          and go over to Hisahide.
        deeds: {}
      - label: "Withdraw your camp from Nara"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Hisahide remains in Tamon, the monks keep their Buddha, and your retainers begin to wonder
          whose side you are on.
      - label: "Besiege Tamon, keeping out of the temple"
        legitimacy_bp: -300
        unrest_bp: 500
        outcome: >-
          The Three set their lines round Tamon castle and keep their men out of the temple
          grounds. The siege is slow and costly, and Hisahide's men look for another way.
        deeds: {men: 1500}
    history: >-
      In October 1567 fighting between Hisahide and the Miyoshi Three at Todai-ji burned the Great
      Buddha Hall; Yoshitsugu went over to Hisahide soon afterwards.
    sources: ["Tamon'in nikki", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_nobunaga
    scenario: sengoku
    civ: miyoshi
    year: 1568
    title: "The Army from Owari"
    place: "Takaya castle, Kawachi"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "Escorting the new shogun, by letter"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      Oda Nobunaga has taken Mino and now comes west with the shogun's brother Yoshiaki and an
      army of fifty thousand. The Miyoshi Three and their men are in Settsu and Kawachi, and
      cannot agree who should defend what. Hisahide is already writing to Nobunaga, with a gift
      of the finest tea kettle in Japan.


      Nobunaga's letter to you is short: those who submit keep their lands.
    choices:
      - label: "Submit to Nobunaga, keeping Kawachi"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Nobunaga takes Kyoto, makes Yoshiaki shogun, and drives the Miyoshi Three out of Settsu.
          Hisahide is allowed to keep Yamato. You are left with Kawachi, and a place among Nobunaga's
          men. It will not last.
        deeds: {peace_with: [oda], give: [j_kyoto]}
      - label: "Fight beside the Three"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Your army holds Settsu for a month and loses it all in two.
        deeds: {men: 3000}
      - label: "Abandon Kyoto, and hold the Kawachi castles"
        legitimacy_bp: -500
        outcome: >-
          You draw your men back from the capital into the castles of Kawachi, and Nobunaga
          rides into Kyoto without a fight. Settsu is lost soon after, and each castle is left
          to stand or fall on its own.
        deeds: {men: 2500, give: [j_kyoto]}
    history: >-
      Nobunaga escorted Ashikaga Yoshiaki to Kyoto in 1568, drove the Miyoshi Three from Settsu;
      Yoshitsugu and Hisahide submitted.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, book 1", "Lamers, Japonius Tyrannus (2000)"]

  - id: miy_wakae
    scenario: sengoku
    civ: miyoshi
    year: 1573
    title: "Wakae Castle"
    place: "Wakae castle, Kawachi"
    speaker: general
    speaker_name: "Your last retainers"
    speaker_title: "In the keep"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Miyoshi Yoshitsugu, twenty-four. Five years ago you submitted to Nobunaga. This
      year you have broken with him, and joined the shogun Yoshiaki, who is raising all of
      Japan against the master of Kyoto. Takeda Shingen has died, and the shogun is beaten.
      Hisahide has made peace.


      Nobunaga's army has come to Kawachi. Your retainers have deserted. At Wakae castle you
      have a few hundred loyal men.
    choices:
      - label: "Make a last stand in the keep"
        historical: true
        legitimacy_bp: -3500
        unrest_bp: 3000
        outcome: >-
          You set fire to your keep and kill yourself with your family, in the eleventh month.
          The main line of the Miyoshi ends. Hisahide, who sheltered under Nobunaga, rebels in
          1577 and, when his castle at Shigisan is stormed, blows himself up with the
          famous Hiragumo tea kettle that Nobunaga wanted.
        deeds: {ruler_falls: "dies in the burning of Wakae castle"}
      - label: "Flee to the Mori by sea"
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          You escape by sea, and live out your days in a western castle as a refugee.
      - label: "Surrender the keep and ask for mercy"
        legitimacy_bp: -2000
        unrest_bp: 500
        outcome: >-
          You open the gate and send out your retainers to ask Nobunaga for your life.
          He is not known for his mercy to men who have broken faith, and no one in the keep
          can say what he will answer.
    history: >-
      Miyoshi Yoshitsugu was defeated by Nobunaga's army at Wakae castle in 1573 and killed
      himself; Matsunaga Hisahide, who rebelled in 1577, died at Shigisan.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, book 7", "Lamers, Japonius Tyrannus (2000)"]
