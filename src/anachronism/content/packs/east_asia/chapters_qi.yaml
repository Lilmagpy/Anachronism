schema_version: 1
# Chronicle mode (D-120, D-177): the Tian kings of Qi, from Maling to the surrender of 221
# BC. Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Shiji (the Tian Jingzhong Wan family, Sun Bin, Yue Yi and Tian Dan
# chapters), the Zhanguo ce, the Mencius, and the Sun Bin bingfa found at Yinqueshan in
# 1972, with modern work by Lewis, Pines and Sawyer. Reign dates follow the Shiji as
# corrected from the Bamboo Annals. benchmark_provinces counts the provinces of this map the
# real kings held at that date.
chapters:
  - id: qi_maling
    scenario: warring_states
    civ: qi
    year: -342
    title: "Pang Juan Dies Under This Tree"
    place: "The road to Maling"
    speaker: general
    speaker_name: "Sun Bin"
    speaker_title: "Strategist, in a cart"
    needs_alive: [wei]
    benchmark_provinces: 4
    story: >-
      You are King Wei of Qi. Wei, your great western rival, is attacking Han, and Han begs for
      help. Your strategist Sun Bin cannot walk: years ago his fellow student Pang Juan, now
      Wei's general, had his feet cut off out of jealousy. Sun Bin rides in a covered cart and
      plans your wars.


      His plan: march on the Wei capital to draw Pang Juan back, then retreat, lighting a
      hundred thousand cooking fires in the first camp, fifty thousand in the second, thirty
      thousand in the third, so that Pang Juan thinks your army is deserting, and chases you
      with his cavalry alone into the gorge at Maling.
    choices:
      - label: "Follow Sun Bin's plan"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Pang Juan counts the fires and rides after you. At Maling, at dusk, he finds a tree
          stripped of its bark with writing on it, and calls for a torch to read it: 'Pang Juan
          dies under this tree.' Ten thousand crossbowmen are waiting for the light. Pang Juan
          cuts his own throat; the Wei crown prince is taken. Wei never recovers its power.
        deeds: {martial_bp: 1500, grudges: {wei: 2500}}
      - label: "Meet Wei in open battle"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          The two armies fight all day on the plain, and both go home.
    history: >-
      At Maling (342 or 341 BC) Sun Bin's feigned retreat led Pang Juan into an ambush; Pang
      Juan died and Wei's power was broken.
    diverged: >-
      Wei is gone.
    sources: ["Shiji 65 (Sun Bin)", "Sun Bin bingfa (Yinqueshan slips)", "Sawyer, Sun Pin: Military Methods (1995)"]

  - id: qi_jixia
    scenario: warring_states
    civ: qi
    year: -318
    title: "The Scholars at the Ji Gate"
    place: "Linzi, the capital"
    speaker: scholar
    speaker_name: "Chunyu Kun"
    speaker_title: "A wit and a scholar"
    benchmark_provinces: 4
    story: >-
      You are King Xuan. Linzi is one of the greatest cities in the world: seventy thousand
      households, streets so crowded, they say, that the people's sleeves make a
      curtain and their sweat falls like rain.


      By the Ji gate your father began housing scholars of every school - Confucians,
      Mohists, Daoists, students of yin and yang, logicians - who argue all day and advise
      the king without holding office. Chunyu Kun says you could make it the greatest
      gathering of learning in the world, with tall houses and good stipends.
    choices:
      - label: "Build the Jixia Academy"
        historical: true
        knowledge_bp: 3000
        legitimacy_bp: 1000
        wealth_bp: -1500
        outcome: >-
          Seventy-six scholars are made 'senior grandees' with houses on a broad avenue, and
          thousands of students follow them. Mencius comes, and Zou Yan with his five
          phases, and later Xunzi, who will teach the men who build the Qin empire. Much of
          what China will think for two thousand years is first argued here.
      - label: "Keep only the useful ones"
        knowledge_bp: 1000
        outcome: >-
          The strategists and the agronomists stay. The philosophers go to other courts.
    history: >-
      The Jixia Academy flourished under King Xuan of Qi (c. 319-301 BC), with Chunyu Kun,
      Zou Yan, Shen Dao and visits by Mencius; Xunzi later presided.
    sources: ["Shiji 46 (Tian Jingzhong Wan shijia)", "Shiji 74 (Mencius and Xunzi)", "Zhanguo ce, Qi"]

  - id: qi_yan
    scenario: warring_states
    civ: qi
    year: -314
    title: "If the People of Yan Rejoice"
    place: "Linzi"
    speaker: scholar
    speaker_name: "Mencius"
    speaker_title: "A Confucian teacher, your guest"
    needs_alive: [yan]
    benchmark_provinces: 4
    story: >-
      The King of Yan, your northern neighbour, has given his throne to his minister Zizhi,
      in imitation of the sage kings of old. The heir has rebelled, the capital is fighting
      in its streets, and tens of thousands are dead.


      Your army could take Yan in a month. You ask Mencius whether you should. He says: if the
      people of Yan rejoice to see you, take it; if they do not, do not.
    choices:
      - label: "Take Yan"
        historical: true
        legitimacy_bp: 500
        wealth_bp: 2500
        outcome: >-
          Your army takes Yan in fifty days. Then it loots the ancestral temples, carries off
          the sacred vessels, and kills the people's fathers and brothers, and the people of
          Yan rise. You have to withdraw. Mencius leaves your court. The new King of Yan will
          spend his whole reign preparing his revenge.
        deeds: {grudges: {yan: 3500}}
      - label: "Restore order, and leave"
        legitimacy_bp: 1500
        outcome: >-
          Your army puts the heir on the throne and comes home. Yan owes you, and knows it.
    history: >-
      Qi occupied Yan during the Zizhi crisis (314 BC) and was driven out after its armies
      plundered the country; Mencius's advice is recorded in the Mencius.
    diverged: >-
      Yan is gone.
    sources: ["Mencius 1B.10-11, 2B.8-9", "Shiji 34 (Yan)", "Zhanguo ce, Yan"]

  - id: qi_song
    scenario: warring_states
    civ: qi
    year: -286
    title: "The Feast of Song"
    place: "Linzi"
    speaker: general
    speaker_name: "One of your generals"
    speaker_title: "Of the southern army"
    needs_alive: [song]
    benchmark_provinces: 5
    story: >-
      You are King Min, the most powerful king in the east. Two years ago you and the King of
      Qin agreed to call yourselves 'emperors' of the east and the west, then thought better
      of it. Now the little kingdom of Song, rich and weak, lies between you and Chu, ruled by
      a king who shoots arrows at the sky and calls it war on Heaven.


      Your generals say Song is a feast laid out for whoever reaches it first.
    choices:
      - label: "Annex Song"
        historical: true
        wealth_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          Song falls. Qi is now the largest power in the east, and every other kingdom is
          afraid. In Yan, a general called Yue Yi is drawing up a plan, and five kingdoms are
          listening.
        deeds: {conquer: [song], grudges: {yan: 1000}}
      - label: "Leave Song as a buffer"
        legitimacy_bp: 500
        outcome: >-
          Song survives a few more years, and the kings of the other states breathe easier.
    history: >-
      Qi annexed Song in 286 BC, alarming the other states, which joined Yan's coalition in
      284.
    diverged: >-
      Song is gone.
    sources: ["Shiji 38 (Song)", "Shiji 46", "Zhanguo ce, Song"]

  - id: qi_yue_yi
    scenario: warring_states
    civ: qi
    year: -284
    title: "Seventy Cities"
    place: "Linzi"
    speaker: general
    speaker_name: "Nao Chi"
    speaker_title: "A general sent by Chu, 'to help'"
    needs_alive: [yan]
    benchmark_provinces: 2
    story: >-
      Yue Yi of Yan has led the armies of Yan, Qin, Zhao, Wei and Han against you. Your army
      has been destroyed west of the Ji river. The allied armies have gone home with their
      plunder; Yue Yi has not. He is marching on Linzi.


      Chu has sent you a general, Nao Chi, with an army to help. He says you should leave the
      capital and go to the city of Ju, where he can protect you.
    choices:
      - label: "Flee to Ju with Nao Chi"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2500
        outcome: >-
          Linzi falls and is stripped of its treasures, which go back to Yan. In half a year
          Yue Yi takes more than seventy cities. Only Ju and Jimo hold out. At Ju, Nao Chi
          lists your crimes to your face, and has you killed. Your son is hidden by a
          gardener, and will be king.
        deeds: {ruler_falls: "is put to death by the Chu general Nao Chi", give: [qi_linzi, qi_pingyuan, song_shangqiu], give_to: yan}
      - label: "Hold Linzi to the last"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          You stay behind your walls. Yue Yi, who never storms what he can starve, sits down
          around Linzi.
        deeds: {give: [qi_pingyuan, song_shangqiu], give_to: yan}
    history: >-
      Yue Yi's coalition defeated Qi in 284 BC and took over seventy cities; King Min fled to
      Ju and was killed by Nao Chi. Only Ju and Jimo held out.
    diverged: >-
      Yan is gone; no one came.
    sources: ["Shiji 80 (Yue Yi)", "Shiji 46", "Zhanguo ce, Qi 6"]

  - id: qi_fire_oxen
    scenario: warring_states
    civ: qi
    year: -279
    title: "A Thousand Oxen on Fire"
    place: "The walls of Jimo"
    speaker: general
    speaker_name: "Tian Dan"
    speaker_title: "Defender of Jimo"
    needs_alive: [yan]
    benchmark_provinces: 4
    story: >-
      You are King Xiang, son of the murdered King Min. For five years Jimo has held out
      against Yan under Tian Dan, a minor official who saved his clan by sheathing their cart
      axles in iron. The old king of Yan has died, and Tian Dan's spies have persuaded the new
      one that Yue Yi means to make himself King of Qi. Yue Yi has been recalled; a lesser
      general has replaced him.


      Tian Dan has gathered a thousand oxen. He has dressed them in red silk painted with
      dragons, tied blades to their horns and reeds soaked in fat to their tails.
    choices:
      - label: "Let the oxen loose"
        historical: true
        legitimacy_bp: 3000
        outcome: >-
          At night the reeds are lit and the oxen are driven through holes in the walls into
          the Yan camp, with five thousand men behind them and the whole city beating bronze
          vessels. The Yan army breaks and its general is killed. Every city that went over
          to Yan comes back. Tian Dan fetches you from Ju to Linzi.
        deeds: {take: [qi_linzi, qi_pingyuan]}
      - label: "Wait for Yan to tire"
        legitimacy_bp: -500
        outcome: >-
          Jimo holds, and Yan holds everything else, and the siege goes on.
    history: >-
      In 279 BC Tian Dan broke the siege of Jimo with his 'fire oxen' and recovered Qi's lost
      cities; King Xiang returned to Linzi.
    diverged: >-
      Yan is gone.
    sources: ["Shiji 82 (Tian Dan)", "Zhanguo ce, Qi 6"]

  - id: qi_changping
    scenario: warring_states
    civ: qi
    year: -260
    title: "Grain for Zhao"
    place: "Linzi"
    speaker: steward
    speaker_name: "Zhou Zi"
    speaker_title: "A minister"
    needs_alive: [zhao, qin]
    benchmark_provinces: 4
    story: >-
      You are King Jian, young, and your mother the Queen Dowager Jun governs with you. She
      has a policy: be polite to Qin, keep out of everyone's wars, and Qi will be left alone.
      Once, Qin sent her a puzzle of linked jade rings, saying the clever people of Qi would
      know how to separate them. She took a hammer and broke them, and sent back word that
      the rings were separated.


      Now the armies of Qin and Zhao have faced each other at Changping for three years, and
      Zhao has run out of grain. Its envoys ask you for some. Your minister Zhou Zi says Zhao
      is Qi's shield: lips and teeth.
    choices:
      - label: "Keep out of it"
        historical: true
        food_bp: 500
        legitimacy_bp: -1000
        outcome: >-
          You refuse. At Changping, Zhao's starving army surrenders to Qin, and Bai Qi buries
          four hundred thousand men alive. Zhou Zi was right. Qi stays at peace, alone, for
          forty years, while Qin swallows everyone else.
      - label: "Send the grain"
        food_bp: -2500
        legitimacy_bp: 1000
        outcome: >-
          Your grain carts roll west. Qin's envoys come to Linzi to ask why.
        deeds: {grudges: {qin: 2500}}
    history: >-
      Qi refused Zhao's request for grain during the Changping campaign (260 BC), against
      Zhou Zi's advice; the Queen Dowager Jun kept Qi at peace with Qin.
    diverged: >-
      Zhao or Qin is gone.
    sources: ["Shiji 46", "Zhanguo ce, Qi 6 (the jade rings)"]

  - id: qi_surrender
    scenario: warring_states
    civ: qi
    year: -221
    title: "Among the Pines and Cypresses"
    place: "Linzi"
    speaker: steward
    speaker_name: "Hou Sheng"
    speaker_title: "Your chief minister"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      Han, Zhao, Wei, Chu and Yan are gone, all conquered by Qin in nine years. You never sent
      an army to help any of them. Your minister Hou Sheng and many of your officials have
      been taking gold from Qin for years.


      Now the Qin general Wang Ben has come from the north, from Yan, where nobody was
      watching. Hou Sheng says Qin promises you a fief of five hundred li if you surrender.
    choices:
      - label: "Surrender"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          You surrender without a battle. Qin gives you no fief; you are sent to live among the
          pines and cypresses at Gong, and starve. The people of Qi sing: 'Was it the pines,
          was it the cypresses? It was the advisers who brought Jian to this.' The King of Qin
          calls himself the First Emperor.
        deeds: {ruler_falls: "surrenders to Qin and starves in exile", give: [qi_pingyuan, qi_jimo, qi_langya], give_to: qin}
      - label: "Fight at the walls of Linzi"
        legitimacy_bp: 1000
        unrest_bp: 2000
        outcome: >-
          Too late, Qi fights. The last free state under heaven closes its gates.
        deeds: {grudges: {qin: 3000}}
    history: >-
      Qi, the last of the six states, surrendered to Qin without a fight in 221 BC; King Jian
      starved in exile.
    diverged: >-
      Qin is gone; there is no one left to conquer you.
    sources: ["Shiji 46", "Shiji 6 (Qin Shi Huang)", "Zhanguo ce, Qi 6"]
