schema_version: 1
# Chronicle mode (D-120, D-XXX): the Chera country of the Malabar coast, from the pepper
# trade to Ashoka's edicts, 321-255 BC (dates approximate). A short chronicle on purpose.
# The Cheras left no writing of this age. What we have: Ashoka's own Rock Edicts II and XIII
# (about 257-256 BC), which name the Keralaputra ("son of Kerala", very likely the Chera
# kings) among his neighbours; Theophrastus (died c. 287 BC), who knew of pepper; and
# the Tamil Sangam poems, which praise Chera kings and the pepper port of Muciri, but were
# composed and collected centuries afterwards (usually put in the first to third centuries AD,
# with the dating much disputed), so they cannot date anything in this chronicle. The poems are
# used only as "later tradition", never for the facts of a year. The names of the kings of these
# years are unknown, so the ruler is simply the king of the Cheras. Modern work by Thapar,
# Champakalakshmi, Subbarayalu, Singh, Olivelle and Tomber. benchmark_provinces is 1: this map
# gives the Chera country one province.
chapters:
  - id: chera_pepper
    scenario: maurya
    civ: chera
    year: -321
    title: "The Pepper of the Western Hills"
    place: "The Malabar coast"
    speaker: scholar
    speaker_name: "A Tamil poet, some centuries later"
    speaker_title: "Who remembers the coast in song"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cheras. Your country is a narrow green land between the western
      mountains and the sea, and its wealth is a vine that climbs the forest trees: pepper.
      The Greek writer Theophrastus, who is now old, already knows the spice and tells of two
      kinds. How it reaches him, through whose hands, we do not know. The Tamil poets of later
      centuries say that Greek ships came to your port of Muciri with gold, and went
      away with pepper.


      The Sangam poems that tell this were written long after your time, and do not name you.
      What you can see now is simpler: the north is changing. A king named Chandragupta
      is making a great state on the Ganges. Whether he will want the pepper coast, nobody
      can say.
    choices:
      - label: "Keep the pepper trade open to all who come"
        historical: true
        wealth_bp: 1500
        influence: {guilds: 800}
        outcome: >-
          The traders come: Tamils from the east coast and, as the centuries pass, ships
          from the Red Sea and the Greeks. Pepper, pearls and timber go out; gold, wine and
          horses come in. Archaeology has found the coast busy in the centuries ahead, but it
          cannot give a king's name or a date for any of it.
      - label: "Make the king's house the only buyer"
        wealth_bp: 800
        influence: {guilds: -800}
        unrest_bp: 400
        outcome: >-
          Your treasury grows, and the merchants of the coast grumble and look at the other
          ports.
    history: >-
      Pepper from the Malabar coast reached the Mediterranean world in this age
      (Theophrastus, Enquiry into Plants 9.20); the Chera ports and the Greek ('Yavana') ships are
      mainly known from Tamil poems and Greek and Roman writers of the first centuries BC and AD.
    sources: ["Theophrastus, Historia plantarum 9.20", "Akananuru 149 and Purananuru 343 (Sangam, later)", "Tomber, Indo-Roman Trade (2008)", "Champakalakshmi, Trade, Ideology and Urbanization (1996)"]

  - id: chera_moriyar
    scenario: maurya
    civ: chera
    year: -291
    title: "The Mauryan Chariots"
    place: "The Palakkad gap"
    speaker: scholar
    speaker_name: "A Tamil poet, much later"
    speaker_title: "Who sings of the northerners"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cheras. Travellers from the north tell you that Chandragupta's
      son Bindusara now sits on the throne at Pataliputra, and that his father overran, say the
      Greek writers, the whole of India. Your country lies behind the hills, with a single
      wide gap, and no writer tells you how far north's power reaches.


      Later Tamil poems say that the Moriyar, the Mauryas, brought their chariots and cut a
      road through the mountains of the south. Historians do not agree what that
      means, whether it recalls a real march in this age, or one of Ashoka's, or only a
      name. Nothing from your own time confirms it.
    choices:
      - label: "Send gifts and a messenger north, and keep the gap guarded"
        historical: true
        influence: {nobility: 500}
        legitimacy_bp: 500
        outcome: >-
          You make your peace on your own terms and keep watch. Whatever the poets later
          remembered, Ashoka's edicts will show the Cheras outside the Mauryan empire, as
          neighbours with whom Ashoka has dealings, though not as subjects.
      - label: "Raise the hill chiefs and close the gap"
        unrest_bp: 300
        outcome: >-
          The hill chiefs come, in exchange for gifts. It costs you much, and nothing comes
          through the gap.
        deeds: {men: 2000}
    history: >-
      Later Tamil poems speak of the Moriyar and their chariots in the south; scholars debate
      whether they describe a Mauryan advance, which is not otherwise attested. Ashoka's
      edicts later place the Keralaputra among his neighbours rather than among his subjects.
    sources: ["Akananuru 69, 251, 281 (Sangam, later)", "Thapar, Asoka and the Decline of the Mauryas (1961)", "Rock Edicts II and XIII"]

  - id: chera_edicts
    scenario: maurya
    civ: chera
    year: -255
    title: "The Keralaputra in the King's Edicts"
    place: "Muciri, on the coast"
    speaker: maurya
    speaker_name: "Envoys of Ashoka"
    speaker_title: "Ministers of the Dhamma"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cheras. Envoys have come from Ashoka, who is said to have won
      a bloody war in Kalinga and now speaks of conquest by Dhamma, by right living. Rock
      Edict II says that in his realm and in the lands of his neighbours, the Cholas, the
      Pandyas, the Satiyaputra, the Keralaputra, Tambapanni (Lanka) and the Greek king
      Antiochus, he has made two kinds of medical care, for men and for animals,
      planted medicinal plants and fruit trees, and dug wells along the roads.


      The envoys speak of virtue, of mercy to living creatures, of a state which will pay for
      doctors and wells. They do not ask for tribute, or say they mean to take your
      country. They would, Ashoka's edicts say, be pleased to have you as a friend.
    choices:
      - label: "Welcome the envoys, as a neighbour and a friend"
        historical: true
        legitimacy_bp: 800
        knowledge_bp: 400
        outcome: >-
          They are lodged and sent on their way home with gifts. Ashoka carves your people's
          name, the Keralaputra, on rocks far away, among the lands where his Dhamma has
          been 'victorious', and no Mauryan army marches south. You remain independent;
          the edicts say you were a neighbour, and nothing else.
      - label: "Send them away; you want no northern teaching"
        legitimacy_bp: -300
        outcome: >-
          The envoys go home. The edicts do not record any answer from the Cheras, so
          the rest is yours to write.
        deeds: {grudges: {maurya: 1500}}
    history: >-
      Ashoka's Rock Edicts II and XIII (about 257-256 BC) name the Keralaputra among his
      neighbours, with the Cholas, Pandyas, Satiyaputra and Tambapanni; they are not
      listed among his subjects. The Sangam poems that praise the Chera kings are much
      later and undated.
    sources: ["Ashoka, Rock Edicts II and XIII", "Olivelle, Ashoka: Portrait of a Philosopher King (2023)", "Thapar, Asoka and the Decline of the Mauryas (1961)"]
