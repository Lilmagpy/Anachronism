schema_version: 1
# Chronicle mode (D-120, D-XXX): the Wa kings of Yamato, from the stele's invasions to the
# coming of the Buddha, AD 400-552. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Gwanggaeto stele (414), the Jin shu, Song shu 97
# (the Wa chapter, with the five kings' embassies), Nanqi shu and Liang shu, the sword
# inscriptions of Inariyama and Eta Funayama, the Samguk sagi, and the Nihon shoki (720),
# which was compiled three centuries later with its own court agenda and whose early dates
# are not reliable, with modern work by Barnes, Piggott, Farris and Kidder. The Chinese
# histories name five kings of Wa (San, Chin, Sai, Ko, Bu); which later sovereigns of the
# Nihon shoki they were is DISPUTED. The usual guesses (San = Richu or Nintoku, Chin = Hanzei
# or Nintoku, Sai = Ingyo, Ko = Anko, Bu = Yuryaku) are sure only for Bu, and the game names
# the rulers as the Chinese histories do. Before San the king of Wa is not named in any
# contemporary source. Ages and exact death years of every Wa king here are placeholders (the
# sources give none; Bu's death is set near the Liang title of 502); Keitai's and Kinmei's
# reign dates are the Nihon shoki's and approximate (some read Keitai's death as 534, and the
# Buddha's arrival as 538, not 552). benchmark_provinces counts the provinces of this map
# the Wa court really held: the six of the scenario throughout, since how far its writ ran
# in the east and in Kyushu before the sixth century is argued over.
chapters:
  - id: wa_silla
    scenario: three_kingdoms
    civ: wa
    year: 400
    title: "The Walls of Silla"
    place: "Before Gyeongju, in Silla"
    speaker: general
    speaker_name: "Your captain in Silla"
    speaker_title: "At the siege"
    needs_alive: [goguryeo]
    benchmark_provinces: 6
    story: >-
      You are the king of Wa, in the plain of Yamato, where your people are raising great
      keyhole-shaped mounds over their dead chiefs. Your name is not written in any record
      of your own age. What is written is that your ships have crossed the strait, with the
      king of Baekje as your friend and the iron-makers of Gaya as your hosts, and that your
      soldiers have filled the land of Silla and broken its walls.


      Now your captain sends word from the siege: Goguryeo, which Silla begged for help, is
      coming south with fifty thousand horse and foot. They are in armour and they do not
      stop. He asks whether to hold the walls or fall back to the coast of Gaya, where your
      ships lie.
    choices:
      - label: "Fall back to Imna Gara and hold the fortress there"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Your men fall back down the peninsula, with Goguryeo's horse at their heels. At
          Imna Gara, the Gaya port, the fortress gives way almost at once. Your soldiers
          find their ships and go home, and the Silla king, who had called himself
          Goguryeo's subject, is Goguryeo's again. The strait is still open. Your captains
          have learned what an armoured cavalry charge is.
        deeds: {grudges: {goguryeo: 1500, silla: 1500}}
      - label: "Stand at Silla's walls and fight the Goguryeo army"
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          Your foot soldiers have no answer to the armoured horse. The army is cut up in the
          open, and few ships come back. Silla no longer fears you.
        deeds: {grudges: {goguryeo: 2500, silla: 2500}}
      - label: "Sail home at once, before the road is cut"
        wealth_bp: 500
        outcome: >-
          Your fleet brings the army home with its plunder and its slaves. Baekje and Gaya,
          left to meet Goguryeo alone, remember it.
        deeds: {grudges: {baekje: 1000, gaya: 1500}}
    history: >-
      The Gwanggaeto stele records that in 399 Silla complained that the Wa filled its land,
      and that in 400 Goguryeo sent 50,000 troops, drove the Wa out of Silla and pursued them
      to the fortress of Imna Gara, which 'submitted at once'; the following lines are damaged
      and the exact course of the fighting is argued over. The stele is Goguryeo's own record,
      cut in 414.
    diverged: >-
      Goguryeo is gone.
    sources: ["Gwanggaeto stele, years 9-10", "Samguk sagi, Silla annals", "Barnes, State Formation in Japan (2007)", "Piggott, The Emergence of Japanese Kingship (1997)"]

  - id: wa_daebang
    scenario: three_kingdoms
    civ: wa
    year: 404
    until_year: 410
    title: "A Landing on the Daebang Coast"
    place: "Baekje's western ports"
    speaker: baekje
    speaker_name: "Envoy of King Asin"
    speaker_title: "From Hanseong"
    needs_alive: [goguryeo, baekje]
    benchmark_provinces: 6
    story: >-
      Baekje has sworn to Goguryeo that it is a subject, and has broken the oath, and it
      still hopes to get back what Gwanggaeto took from it. Its envoy proposes that your
      ships, with Baekje's guides and Baekje's gold, land an army on the old Daebang coast
      below Pyongyang, where Goguryeo's rule is newest.


      Your captains are cautious. Last time your men met Goguryeo's horse they lost. But
      Baekje has promised that this time the landing will be on ground Goguryeo cannot
      charge across.
    choices:
      - label: "Land an army on the Daebang coast"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Your ships land men on the Daebang shore and they march inland. Goguryeo's king
          comes against them in person, with his horse and his standard-bearers, and cuts
          them off before they can regain the ships. Goguryeo will carve in stone that your
          dead were beyond counting. After this you do not send an army against Goguryeo
          again.
        deeds: {peace_with: [goguryeo], grudges: {goguryeo: 2500}}
      - label: "Raid the coast from the ships, and do not land"
        wealth_bp: 500
        outcome: >-
          Your ships burn a few fishing villages and sail away before Goguryeo can reach
          them. Baekje calls it half a help. Your army is intact.
        deeds: {grudges: {goguryeo: 1000}}
      - label: "Refuse, and trade with Goguryeo instead"
        legitimacy_bp: 500
        outcome: >-
          Baekje's envoy leaves without ships. Goguryeo's gold-workers are glad to sell
          you armour, and your smiths copy it.
        deeds: {peace_with: [goguryeo], grudges: {baekje: 1500}}
    history: >-
      The Gwanggaeto stele records that in 404 the Wa 'broke the peace' and invaded the old
      Daebang region, and that Gwanggaeto led his army against them and slew them in great
      numbers. This is the stele's own boast, and Baekje's role is read between its lines.
      After 404, no record shows a Wa army fighting Goguryeo again.
    diverged: >-
      Goguryeo or Baekje is gone: no landing is planned.
    sources: ["Gwanggaeto stele, year 14", "Samguk sagi, Baekje annals", "Barnes, State Formation in Japan (2007)"]

  - id: wa_san
    scenario: three_kingdoms
    civ: wa
    year: 421
    title: "A Letter to the Emperor Across the Sea"
    place: "Your court in Yamato"
    speaker: scholar
    speaker_name: "A scribe whose family came from Baekje"
    speaker_title: "Keeper of the writing"
    benchmark_provinces: 6
    story: >-
      You are San, king of Wa. Nine years ago, the Jin shu says, a Wa embassy brought gifts
      to the Jin court in the south, but the Jin house is gone, and in the south there is a
      new emperor, Liu Yu, who has founded the Song dynasty. Nobody at your court can say
      what he calls himself in his own language, but your scribes can write Chinese, after a
      fashion.


      A Chinese title would tell your own chiefs, and Goguryeo and Baekje as well, that the
      empire of the south thinks of you as a king. Your scribes can write the letter. It
      costs the gifts, and a ship, and a lot of luck at sea.
    choices:
      - label: "Send ships with a letter and gifts to the Song court"
        historical: true
        knowledge_bp: 1000
        legitimacy_bp: 1500
        wealth_bp: -500
        outcome: >-
          The ships cross to the mouth of the Yangtze and go up to Jiankang. The new
          emperor, pleased that a king of so distant a land should send tribute, orders that
          you be rewarded with an appointment. Four years later you send another embassy,
          with a man of Chinese name to carry your letter. You are the first king of the Wa
          the Chinese histories name.
      - label: "Send word through Baekje, who already know the road"
        legitimacy_bp: 500
        outcome: >-
          The Baekje king sends your gifts to Jiankang with his own. Your name is on his
          list, and nowhere else.
      - label: "Send nothing; your chiefs follow you without a Chinese seal"
        influence: {nobility: 1000}
        outcome: >-
          Your great houses are pleased that you need no seal from the empire. The Chinese
          court never hears of you.
    history: >-
      The Song shu records that in 421 (Yongchu 2) the founder of the Song ordered San of Wa to
      be rewarded for his tribute from so far away, and that San sent another embassy in 425.
      The Jin shu mentions an embassy from Wa in 413. Which later sovereign San was is disputed;
      Richu and Nintoku have both been suggested.
    sources: ["Song shu 97 (Wa)", "Jin shu 10 (Emperor An, 413)", "Barnes, State Formation in Japan (2007)"]

  - id: wa_chin
    scenario: three_kingdoms
    civ: wa
    year: 438
    title: "A Title Longer Than Your Reach"
    place: "Yamato"
    speaker: scholar
    speaker_name: "Your chief scribe"
    speaker_title: "At the writing board"
    benchmark_provinces: 6
    story: >-
      You are Chin. San, your brother, is dead, and the chiefs have made you king after him.
      Your ships are ready for the Song court, and the question is what you will ask for.


      Your brother's rank was small. But an emperor will confirm what a king asks for,
      sometimes, and the title you ask for will be read in Baekje, in Silla and in Gaya. You
      could call yourself commander of the armies of all the countries across the strait, and
      ask for the seal of a great general. You have never commanded in most of those countries.
    choices:
      - label: "Claim command of six countries, Baekje among them, and ask to be confirmed"
        historical: true
        legitimacy_bp: 1000
        influence: {nobility: 800}
        outcome: >-
          Your envoys call you, in their letter, commander of the armies of six countries,
          General Who Pacifies the East, King of Wa. The emperor does not give the six
          countries. He confirms you as General Who Pacifies the East and King of Wa, which
          is rank enough, and when you ask for ranks for thirteen of your own men, as generals
          of the west, of the expeditions and of the guard, he gives those too. Your
          captains now have Chinese titles to show their men.
      - label: "Ask only to be confirmed as king of Wa"
        legitimacy_bp: 500
        outcome: >-
          The emperor confirms you, and no one in Silla or Baekje reads anything into your
          title.
      - label: "Send no embassy; your brother's seal is enough"
        legitimacy_bp: -500
        outcome: >-
          The Song court hears nothing from Wa for five years. Your captains grumble that
          they have no rank to show.
    history: >-
      The Song shu records that after San's death his brother Chin sent tribute in 438
      (Yuanjia 15), styled himself commander of the armies of six countries (Wa, Baekje,
      Silla, Imna, Jinhan, Mokhan) and General Who Pacifies the East, and asked to be
      confirmed. The emperor made him General Who Pacifies the East and King of Wa, and
      granted ranks to thirteen of his men.
    sources: ["Song shu 97 (Wa)", "Barnes, State Formation in Japan (2007)", "Farris, Sacred Texts and Buried Treasures (1998)"]

  - id: wa_sai
    scenario: three_kingdoms
    civ: wa
    year: 451
    title: "Six Countries Without Baekje"
    place: "Yamato"
    speaker: scholar
    speaker_name: "Your chief scribe"
    speaker_title: "Back from the Song court"
    benchmark_provinces: 6
    story: >-
      You are Sai, king of Wa. Eight years ago you were confirmed in your rank by the Song
      court. Now your envoys have come back from Jiankang with more: the emperor has added to
      your title command of the armies of Wa, Silla, Imna, Gara, Jinhan and Mokhan, and
      twenty-three of your followers have been given Chinese ranks.


      Baekje's name is not in the list. Baekje has been the Song's own tributary for longer
      than you have, and the emperor will not take it from the king of Baekje and give it to
      you. Your scribes ask whether to press for it.
    choices:
      - label: "Accept the title, and send gifts"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You keep the six names, which are worth something in the eyes of your own chiefs
          and nothing at all in the eyes of the kings of Silla and Gaya, who have never
          been asked. The Samguk sagi records Wa raids on Silla in these decades, but no
          Wa king rules there.
      - label: "Press the emperor to add Baekje too"
        legitimacy_bp: -500
        outcome: >-
          Your envoy goes back to Jiankang. The emperor is polite and gives you nothing more,
          and the king of Baekje hears that you have tried.
        deeds: {grudges: {baekje: 1500}}
      - label: "Send an army to Silla to give the title some weight"
        legitimacy_bp: 500
        unrest_bp: 1200
        outcome: >-
          Your fleet raids Silla's coast and returns. Silla and Baekje, which are allies by
          now, tighten their alliance.
        deeds: {grudges: {silla: 3000}, men: 2000}
    history: >-
      The Song shu records that Sai sent tribute in 443 and was made General Who Pacifies the
      East and King of Wa, and that in 451 the court added command of six countries: Wa,
      Silla, Imna, Gara, Jinhan and Mokhan, not Baekje, and gave titles to twenty-three of his
      followers. The Samguk sagi records Wa raids on Silla in the 440s and 450s.
    sources: ["Song shu 97 (Wa)", "Samguk sagi, Silla annals (440-459)", "Barnes, State Formation in Japan (2007)"]

  - id: wa_bu
    scenario: three_kingdoms
    civ: wa
    year: 478
    title: "Armour on the Mountains and Rivers"
    place: "Yamato"
    speaker: scholar
    speaker_name: "Your scribes"
    speaker_title: "Drafting the memorial"
    needs_alive: [goguryeo]
    benchmark_provinces: 6
    story: >-
      You are Bu, king of Wa. Your father and your brother are dead. Goguryeo has taken
      Baekje's capital, and stands across the sea road your envoys use to reach China. Your
      scribes are drafting a letter to the new Song emperor, who is a boy, and whose generals
      do not obey him.


      You are proud of what your family has done. Your swords, with their gold-inlaid
      inscriptions, are carried in the east as far as the plains of Kanto and in the west into
      Kyushu. In your letter you want to say so, and to ask the emperor to allow you to march
      on Goguryeo.
    choices:
      - label: "Write the memorial, and ask for the emperor's blessing on a war against Goguryeo"
        historical: true
        legitimacy_bp: 1500
        knowledge_bp: 500
        outcome: >-
          Your scribes write that your ancestors put on armour and crossed mountains and
          rivers without rest, and brought in, they say, fifty-five countries of hairy men in
          the east, sixty-six in the west, and ninety-five across the sea; that Goguryeo has
          blocked the road; that your father and brother died before the ships could sail; and
          that you are ready now. The emperor makes you General Who Pacifies the East, king of
          Wa and commander of the armies of six countries. No Chinese soldier comes. The
          dynasty is overthrown within the year.
        deeds: {grudges: {goguryeo: 1500}}
      - label: "Raise an army and send it to Baekje without waiting for China"
        unrest_bp: 1000
        outcome: >-
          You send ships to Baekje with soldiers for its young king. They arrive, and Goguryeo
          does not attack. Your people pay for the ships.
        deeds: {martial_bp: 300, men: 3000, grudges: {goguryeo: 2500}}
      - label: "Make peace with Goguryeo and ask for the road"
        legitimacy_bp: -500
        outcome: >-
          Goguryeo's king is courteous, and sends no escort. Your embassies reach Jiankang
          by another way, and slowly.
        deeds: {peace_with: [goguryeo]}
    history: >-
      The Song shu records Bu's memorial of 478 (Shengming 2), in which he claims conquests
      over fifty-five countries to the east, sixty-six to the west and ninety-five across the
      sea, complains that Goguryeo blocks his road to China, and asks to be allowed to attack it.
      Emperor Shun made him General Who Pacifies the East and king of Wa; the Song fell in
      479 and the Southern Qi gave him a higher rank. The Liang raised him again in 502. The
      Inariyama and Eta Funayama swords, inscribed with the name Wakatakeru, 'Great King',
      show a court whose authority reached Saitama and Kumamoto; the Chinese king Bu and
      Wakatakeru are widely, not universally, identified as one man.
    diverged: >-
      Goguryeo is gone.
    sources: ["Song shu 97 (Wa)", "Nanqi shu 58 (Wa)", "Liang shu 54", "Inariyama sword inscription", "Eta Funayama sword inscription", "Barnes, State Formation in Japan (2007)"]

  - id: wa_iwai
    scenario: three_kingdoms
    civ: wa
    year: 527
    title: "Iwai of Tsukushi"
    place: "The Naniwa harbour"
    speaker: general
    speaker_name: "Omi no Kenu"
    speaker_title: "Commander of the army for Mimana"
    benchmark_provinces: 6
    story: >-
      You are Keitai, a king whom the great houses fetched from a distant branch of the royal
      line to rule after the old line failed. The Nihon shoki says that Silla has taken
      districts in Gaya, and that your friends there have asked for help. You have mustered an
      army of sixty thousand under Omi no Kenu to cross to Mimana.


      But in Tsukushi, in northern Kyushu, where the army must pass, the local chief, Iwai,
      has shut the straits to your ships. The story told later at court is that Silla has
      bribed him. Iwai has been a vassal of your house, and he has an army of his own.
    choices:
      - label: "Send the Mononobe general Arakahi against Iwai first"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 800}
        outcome: >-
          Arakahi's army fights Iwai for most of a year. At Mii, in the end, Iwai is killed,
          and his son offers the estate of Kasuya to your house to spare his own life. The
          expedition for Mimana never sails. Silla is left to do as it likes in Gaya, and your
          court now directly holds the lands of Tsukushi.
        deeds: {men: 4000, grudges: {silla: 1500}}
      - label: "Send the army on to Mimana by another road, and leave Iwai"
        legitimacy_bp: -500
        outcome: >-
          Your army finds no other way. Iwai's men and Silla's together hold the straits.
      - label: "Pardon Iwai if he opens the straits"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          Iwai agrees, and demands more. Your other chiefs notice how far a chief may go.
    history: >-
      According to the Nihon shoki (Keitai 21-22, traditionally 527-528), Omi no Kenu's army was
      blocked in Tsukushi by Iwai, who had been bribed by Silla; Mononobe no Arakahi defeated
      and killed Iwai about 528, and Iwai's son gave the Kasuya estate to the king. The Kojiki
      and the fudoki also know Iwai. The dates and the bribery story are the Nihon shoki's.
    sources: ["Nihon shoki, Keitai 21-22", "Kojiki, Keitai", "Chikuzen fudoki (fragment)", "Piggott, The Emergence of Japanese Kingship (1997)"]

  - id: wa_buddha
    scenario: three_kingdoms
    civ: wa
    year: 552
    title: "A Gilded Image from Baekje"
    place: "The palace"
    speaker: baekje
    speaker_name: "Envoy of King Seong of Baekje"
    speaker_title: "From Sabi"
    needs_alive: [baekje]
    benchmark_provinces: 6
    story: >-
      You are Kinmei. Baekje's king, Seong, has sent you a gilded-bronze image of the Buddha,
      with banners, umbrellas and scrolls of the sutras, and a letter praising the teaching
      as the most wonderful of all doctrines. He wants your soldiers against Silla.


      Your ministers are divided. Soga no Iname says that all the countries to the west
      honour the Buddha, and that Wa alone should not refuse. Mononobe no Okoshi and Nakatomi
      no Kamako say that the spirits of the land will be angry if a foreign god is worshipped.
    choices:
      - label: "Give the image to Soga no Iname to worship, as a trial"
        historical: true
        legitimacy_bp: 500
        knowledge_bp: 1000
        influence: {clergy: 800}
        outcome: >-
          Iname enshrines it in his house and prays to it. Then plague comes. Okoshi and
          Kamako say it is the spirits' anger, and the image is thrown into the Naniwa canal and
          the temple burned. Buddhism will be back, and the Soga will make it the faith of the
          court.
      - label: "Accept the Buddha as the faith of the court"
        legitimacy_bp: -500
        unrest_bp: 1500
        influence: {clergy: 1500, nobility: -1000}
        outcome: >-
          The Mononobe and Nakatomi leave the council. When plague comes, the court has no
          answer.
      - label: "Refuse the gift, and send the envoy home"
        legitimacy_bp: 500
        influence: {clergy: -500}
        outcome: >-
          Baekje takes the refusal coldly. Your priests of the old rites are glad.
        deeds: {grudges: {baekje: 1500}}
    history: >-
      The Nihon shoki dates the gift of a Buddha image from King Seong of Baekje to 552 (Kinmei
      13); the temple Gango-ji's record and a tradition of Shotoku Taishi's give 538. The
      quarrel between the Soga and the Mononobe and Nakatomi, the plague, and the image thrown
      into the canal are the Nihon shoki's story, shaped by its authors. The Soga prevailed in
      587.
    sources: ["Nihon shoki, Kinmei 13", "Gango-ji garan engi (747)", "Piggott, The Emergence of Japanese Kingship (1997)", "Kidder, Himiko and Japan's Elusive Chiefdom of Yamatai (2007)"]
