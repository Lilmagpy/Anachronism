schema_version: 1
# Chronicle mode (D-120, D-186): the Date of Oshu and Date Masamune, the One-Eyed Dragon,
# 1564-1613. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Date chronicles (Date chika kiroku), Masamune's
# letters, the Spanish and Vatican records of the Keicho embassy, and modern work by
# Kobayashi Seiji, Turnbull and Lee. Some well-known stories (the white robe, the wagtail
# seal) come from later chronicles and are told as such. benchmark_provinces counts the
# provinces of this map the real Date held at that date.
chapters:
  - id: date_retire
    scenario: sengoku
    civ: date
    year: 1564
    title: "A Father Steps Aside"
    place: "Yonezawa"
    speaker: steward
    speaker_name: "Date Terumune"
    speaker_title: "Your son"
    benchmark_provinces: 1
    story: >-
      You are Date Harumune. Twenty years ago you went to war with your own father, who was
      giving away the family's lands to marry his children into every house in the north. You
      won, after six years in which every family in Oshu took one side or the other.


      Your son Terumune has grown up and is impatient. You can keep the house, and perhaps
      fight him as you fought your father, or step aside.
    choices:
      - label: "Step aside for Terumune"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You hand the house to Terumune and retire to the castle of Marumori, where you live
          another fourteen years and quarrel with him only in letters.
        deeds: {ruler_falls: "retires, and leaves the house to his son Terumune"}
      - label: "Keep the house in your own hands"
        unrest_bp: 1500
        outcome: >-
          Terumune waits. His retainers begin to count who would follow whom.
      - label: "Share the governing, and keep the seal"
        legitimacy_bp: 900
        unrest_bp: 300
        outcome: >-
          Terumune is given the daily work of the house, and you keep the seal and the last
          word. The retainers learn to carry petitions to one of you or to the other, and
          some of them learn to play you against each other.
    history: >-
      Date Harumune, victor of the Tenbun war against his father, retired in favour of
      Terumune in the mid-1560s and died in 1578.
    sources: ["Date chika kiroku", "Kobayashi Seiji, Date Masamune (1959)"]

  - id: date_masamune
    scenario: sengoku
    civ: date
    year: 1584
    title: "The One-Eyed Boy"
    place: "Yonezawa"
    speaker: general
    speaker_name: "Katakura Kojuro"
    speaker_title: "Your son's retainer"
    benchmark_provinces: 1
    story: >-
      You are Date Terumune, forty. Your son Masamune is seventeen. Smallpox took his right
      eye when he was a child, and his mother never loved him after; the story goes that he
      had his retainer Katakura Kojuro cut out the dead eye so that no enemy could seize it in
      a fight. He is brilliant, ambitious and impatient.


      You want to hand him the house while you are still alive to guide him.
    choices:
      - label: "Give the house to Masamune"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Masamune becomes lord of the Date at seventeen, and begins at once to pick fights
          with his neighbours. You retire to a nearby castle to advise him.
        deeds: {ruler_falls: "hands the house to his son Masamune"}
      - label: "Make him wait some years more"
        unrest_bp: 1000
        outcome: >-
          Masamune waits, and sharpens his sword, and his father's retainers start to watch
          him.
      - label: "Give him the army, and keep the seal"
        legitimacy_bp: 1500
        unrest_bp: 300
        outcome: >-
          Masamune is made captain of your armies, and he is delighted. You keep the seal and
          the household accounts, and the old retainers wonder aloud who will really rule at
          Yonezawa.
        deeds: {men: 3000}
    history: >-
      Date Terumune retired in favour of Masamune in 1584, when Masamune was seventeen.
    sources: ["Date chika kiroku", "Kobayashi Seiji, Date Masamune (1959)"]

  - id: date_awatanosu
    scenario: sengoku
    civ: date
    year: 1585
    title: "On the Bank of the Abukuma"
    place: "Awatanosu, on the Abukuma river"
    speaker: general
    speaker_name: "Your musketeers"
    speaker_title: "On the riverbank"
    benchmark_provinces: 1
    story: >-
      You are Date Masamune. Hatakeyama Yoshitsugu, a lord you have beaten, came to your
      father's castle to thank him for interceding on his behalf. At the gate, his men seized
      your father and dragged him off on horseback towards the Hatakeyama lands.


      You were out hunting. You have caught up with them at the river crossing. Your father
      is in their midst, a sword at his throat. Your men have their guns raised.
    choices:
      - label: "Order your musketeers to fire"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Your men fire. Yoshitsugu, the kidnappers and your father all die on the riverbank.
          Some say your father shouted to you to shoot. Within months a coalition of every
          house in the region marches against you, thirty thousand to your seven, and at
          Hitotoribashi you barely survive.
        deeds: {martial_bp: 1000}
      - label: "Let them cross, and bargain for him"
        legitimacy_bp: -800
        unrest_bp: 600
        outcome: >-
          The Hatakeyama take your father across the river. The price of his return is every
          castle you took from them, and your garrisons march out.
        deeds: {martial_bp: -500}
      - label: "Race ahead and bar the next ford"
        legitimacy_bp: -700
        unrest_bp: 700
        outcome: >-
          Your horsemen reach the next ford before the kidnappers and block it. With a sword
          at your father's throat you cannot attack, and the standoff drags on until
          Yoshitsugu's friends arrive. The bargain at the end of it is harder than the one
          you could have made at the first river.
        deeds: {men: 2000}
    history: >-
      In 1585 Hatakeyama Yoshitsugu abducted Date Terumune; Masamune's men attacked at the
      Abukuma river and Terumune was killed along with his captors.
    sources: ["Date chika kiroku", "Kobayashi Seiji, Date Masamune (1959)"]

  - id: date_odawara
    scenario: sengoku
    civ: date
    year: 1590
    title: "Summons to Odawara"
    place: "Hideyoshi's camp before Odawara"
    speaker: oda
    speaker_name: "Toyotomi Hideyoshi"
    speaker_title: "Imperial regent, master of Japan"
    benchmark_provinces: 1
    story: >-
      Last year at Suriage-hara you destroyed the Ashina and took Aizu, defying Hideyoshi's
      order that the lords of Japan stop fighting each other. Now Hideyoshi is besieging the
      Hojo in Odawara, and has summoned every lord to come and bow. You have waited months to
      see who would win.


      You have arrived very late. Your retainers think you may be ordered to cut your belly.
    choices:
      - label: "Go to Hideyoshi's camp in person"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The story goes that you came in a white burial robe, with your hair cut short.
          Hideyoshi touched the back of your neck with his staff and said you were lucky to have
          come when you did. You keep your head and your old lands, and lose Aizu.
      - label: "Send gifts, and stay in the north"
        legitimacy_bp: -1500
        outcome: >-
          When Odawara falls, Hideyoshi's army turns north. Your gifts are returned.
        deeds: {grudges: {oda: 3000}}
      - label: "Bring an army and stores to the siege"
        legitimacy_bp: 600
        wealth_bp: -500
        outcome: >-
          You march to Odawara with spearmen and carts of rice, and offer both to Hideyoshi.
          He takes them and your oath, and he does not forget how late you came. Aizu is taken
          from you all the same.
        deeds: {men: 3000}
    history: >-
      Masamune submitted to Hideyoshi at Odawara in 1590 after arriving late; he lost Aizu.
      The white robe is a famous later story.
    sources: ["Date chika kiroku", "Berry, Hideyoshi (1982)"]

  - id: date_wagtail
    scenario: sengoku
    civ: date
    year: 1591
    title: "A Summons to Kyoto"
    place: "Kyoto"
    speaker: steward
    speaker_name: "Gamo Ujisato"
    speaker_title: "Hideyoshi's new lord of Aizu, your accuser"
    benchmark_provinces: 1
    story: >-
      The peasants of Kasai and Osaki, north of your lands, have risen against their new
      lords. Gamo Ujisato, who now holds Aizu, has sent Hideyoshi a letter in your hand
      encouraging the rebels, sealed with your seal: a wagtail.


      You have been summoned to Kyoto to explain yourself.
    choices:
      - label: "Go to Kyoto and answer the charge in person"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You march into Kyoto, the later chronicles say, with a golden cross carried before
          you, as a man ready to be crucified. You tell Hideyoshi that every genuine letter of
          yours has a tiny hole pierced through the wagtail's eye, and that this one has none.
          Hideyoshi checks your other letters, and lets you go - with your lands moved
          further north.
      - label: "Admit the letter, and beg for mercy"
        legitimacy_bp: -2500
        outcome: >-
          Hideyoshi is not merciful to men who admit things.
      - label: "Send your heir and gold to Kyoto as a pledge"
        legitimacy_bp: 2200
        wealth_bp: -500
        outcome: >-
          Your heir goes to Kyoto as a hostage, with chests of gold for Hideyoshi's court.
          Hideyoshi accepts them and lets the matter drop, but he moves you from your old
          lands all the same, and your enemies in the north take note of your price.
    history: >-
      Masamune was suspected of encouraging the Kasai-Osaki rising (1590-1591) and cleared
      himself before Hideyoshi; the pierced-wagtail and golden-cross stories are told in later
      accounts.
    sources: ["Date chika kiroku", "Kobayashi Seiji, Date Masamune (1959)"]

  - id: date_sendai
    scenario: sengoku
    civ: date
    year: 1601
    title: "A Castle on Aoba Hill"
    place: "Sendai"
    speaker: general
    speaker_name: "Katakura Kojuro"
    speaker_title: "Your closest retainer"
    benchmark_provinces: 1
    story: >-
      At Sekigahara you sided with Tokugawa Ieyasu, and fought his enemies in the north.
      Ieyasu had promised you a million koku of land; he has given you much less. You are
      thirty-four.


      You want a new capital: a castle on Aoba hill above the river Hirose, and a town
      planned below it, wide streets and canals, with a port for ships.
    choices:
      - label: "Move your court to a new castle on Aoba hill"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -1500
        outcome: >-
          Sendai castle rises on its hill, and a city of tens of thousands grows beneath it.
          You drain the marshes, dig canals and plant rice, and your domain becomes one of the
          richest in Japan. Your statue still rides on the castle hill.
      - label: "Keep your court at Iwadeyama"
        wealth_bp: 1000
        outcome: >-
          You stay in your old castle in the hills, and the new port is built by someone else.
      - label: "Spend on border castles and the army"
        legitimacy_bp: 1100
        wealth_bp: -1200
        outcome: >-
          The money goes into stone walls on the frontier and into spearmen, and the court
          stays where it is. Your retainers are proud, and the domain is safe, but there is
          no new port and no new town.
        deeds: {martial_bp: 500}
    history: >-
      Masamune founded Sendai and began Sendai castle in 1600-1601, after supporting Ieyasu.
    sources: ["Date chika kiroku", "Kobayashi Seiji, Date Masamune (1959)"]

  - id: date_hasekura
    scenario: sengoku
    civ: date
    year: 1613
    title: "An Embassy to the Pope"
    place: "Tsukinoura harbour, Sendai"
    speaker: diviner
    speaker_name: "Luis Sotelo"
    speaker_title: "A Spanish Franciscan friar"
    benchmark_provinces: 1
    story: >-
      You want trade with New Spain, across the Pacific, and the ships and silver that come
      with it. A Spanish friar, Luis Sotelo, offers to take an embassy from you to the King of
      Spain and to the Pope, if you will let him preach in your lands.


      Your shipwrights, helped by Spanish sailors, have built a great Western-style galleon.
      Your retainer Hasekura Tsunenaga will lead the embassy.
    choices:
      - label: "Send an embassy to Spain and the Pope"
        historical: true
        knowledge_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          The San Juan Bautista crosses the Pacific to Acapulco. Hasekura crosses Mexico and
          the Atlantic, meets King Philip III, is baptised in Madrid, and is made a citizen of
          Rome by the Pope. He comes home seven years later, to a Japan where the shogun has
          banned Christianity. He never speaks of it again. His portrait hangs in Rome.
      - label: "Trade through Nagasaki and the Portuguese"
        wealth_bp: 1000
        outcome: >-
          The galleon is sold, and your merchants buy Spanish goods from the Portuguese.
      - label: "Keep the galleon, and hire Spanish shipwrights"
        knowledge_bp: 2400
        legitimacy_bp: 1100
        wealth_bp: -300
        outcome: >-
          Sotelo's friends and a few Spanish craftsmen stay at Tsukinoura to teach your men to
          build and sail ocean ships, and to work silver. The ships, though, go no further than
          the Pacific coast, and the king and the Pope hear nothing of Date.
        deeds: {ships: 2}
    history: >-
      Masamune's Keicho embassy under Hasekura Tsunenaga (1613-1620) reached Mexico, Spain and
      Rome; on his return Christianity had been banned in Japan.
    sources: ["Records of the Keicho embassy (Archivo de Indias; Vatican)", "Lee, 'The Keicho Embassy' (2011)"]
