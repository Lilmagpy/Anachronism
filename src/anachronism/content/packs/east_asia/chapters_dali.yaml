schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Dali (Yunnan), 1206-1257. Each chapter opens
# in its year; one choice is what history chose (historical: true). Facts follow the Yuan
# shi (the biography of Uriyangkhadai and the account of Yunnan), the Song shi on Dali, the
# Nanzhao yeshi tradition, and modern work by Yang Bin (Between Winds and Clouds, 2009),
# Backus (The Nan-chao Kingdom, 1981, for the background) and Rossabi (Khubilai Khan, 1988).
# APPROXIMATE: the order and dates of the later Duan kings are not secure in the sources;
# this file uses Zhixiang (to 1238), Xiangxing (to c. 1251) and Xingzhi (from c. 1251, last
# king, then Mongol maharaja). Dali fell in the winter of 1253-54. benchmark_provinces
# counts the provinces of this map the real kingdom held at that date.
chapters:
  - id: dali_gao
    scenario: great_khan
    civ: dali
    year: 1206
    title: "The Chancellor's Family"
    place: "Dali, the royal city"
    speaker: steward
    speaker_name: "A court scholar"
    speaker_title: "Keeper of the royal annals"
    benchmark_provinces: 2
    story: >-
      You are King Duan Zhixiang of Dali, the Buddhist kingdom among the lakes and snow
      mountains of Yunnan. Your house, the Duan, has held the throne since Duan Siping founded
      it in 937. Your kingdom sits between the Song empire, the Tibetan highlands and the
      jungle kingdoms to the south, and grows rich on horses, salt, tea and the road to Burma
      and India.


      Your kingdom is run, in practice, by the Gao family. A century ago the chancellor Gao
      Shengtai drove out a Duan king and tried to rule himself; the Duan were restored in
      a year or two, but only on condition that the Gao keep the office of chancellor
      for ever. Since then the Gao have held the chancellorship, and the Duan kings have
      grown used to spending much of their reigns in prayer, and many of them have
      ended their lives as monks. Your scholar suggests this is a good moment to think
      about whose kingdom this is.
    choices:
      - label: "Confirm the Gao in the chancellorship"
        historical: true
        legitimacy_bp: 200
        influence: {clergy: 500, nobility: 500}
        outcome: >-
          The Gao family rule the court, and the Duan kings stay on the throne, pious and
          powerless. It is a quiet arrangement and it works well enough, while nothing
          threatens the kingdom.
      - label: "Take the chancellorship back for the Duan"
        legitimacy_bp: -800
        unrest_bp: 1500
        influence: {nobility: -800}
        outcome: >-
          The Gao take it badly. Their cousins command the garrisons of the lakeside towns,
          and your own officers wait to see who will win.
      - label: "Name a Gao and a Duan joint chancellors"
        legitimacy_bp: 300
        unrest_bp: 300
        influence: {"nobility": 300}
        outcome: >-
          The Gao accept a Duan colleague beside them and obstruct him quietly. The garrisons
          are neither pleased nor angry.
    history: >-
      After the coup of Gao Shengtai (1094-96), the Gao family held the chancellorship of Dali
      in a line, and controlled most real power; many Duan kings abdicated into monasteries.
    sources: ["Yuan shi 121 (Wuliangheutai)", "Yang Bin, Between Winds and Clouds (2009)", "Backus, The Nan-chao Kingdom (1981)"]

  - id: dali_horses
    scenario: great_khan
    civ: dali
    year: 1215
    title: "Horses for the Song"
    place: "The market of Hengshan, on the Song border"
    speaker: steward
    speaker_name: "A horse merchant of Dali"
    speaker_title: "Back from the border"
    benchmark_provinces: 2
    story: >-
      The Song empire lost the northern grasslands, and its good war horses, ninety years ago.
      Ever since, the Song have bought horses from Dali, which breeds them in the cold
      meadows by the lakes. The horses are driven to the border market at Hengshan, in
      Guangxi, where Song officials weigh them and pay in silk, salt and tea.


      Your merchants report that the Song are asking for more every year, and sometimes
      asking for something else: a closer tie, even a promise of help in the north. The
      Song court has never treated Dali as an equal.
    choices:
      - label: "Keep selling horses, and ask for nothing"
        historical: true
        wealth_bp: 1000
        outcome: >-
          The horse market brings in silk, salt and tea, and the Song go on thinking of Dali
          as a quiet, useful kingdom that sends its tribute to the south and gives them no
          trouble. Neither state has the other's interests at heart.
      - label: "Hold back the best horses, to be sure of your own army"
        wealth_bp: -500
        outcome: >-
          The Song buy fewer horses from you, and look for them in Tibet and the south.
      - label: "Ask the Song court for a formal alliance"
        wealth_bp: 200
        legitimacy_bp: 500
        outcome: >-
          Your envoys are received politely, and the Song court sends gifts of silk and books and
          nothing else.
    history: >-
      Dali supplied horses to the Song through the border markets of Guangnan through the
      twelfth and thirteenth centuries; the Song treated it as a distant frontier kingdom, not
      an ally.
    sources: ["Song shi 488 (Dali)", "Yang Bin, Between Winds and Clouds (2009)"]

  - id: dali_jinsha
    scenario: great_khan
    civ: dali
    year: 1253
    title: "The Envoys at the Jinsha"
    place: "The Dali palace"
    speaker: general
    speaker_name: "Gao Taixiang"
    speaker_title: "Chancellor of Dali"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are King Duan Xingzhi, a young man, and the king in name only. The Mongol army
      of Kublai, the Great Khan Mongke's brother, has crossed the Dadu river and the upper
      Yangtze (the Jinsha) on rafts of inflated sheepskins and marched down into your
      kingdom. Kublai has sent three envoys to your court to demand your submission.


      Gao Taixiang, the chancellor, is the real ruler of the kingdom, as the chancellors of
      his family have been for generations. He tells you that the Mongols are barbarians,
      that your mountains are strong, and that his soldiers will be enough to hold them.
    choices:
      - label: "Let Gao Taixiang kill the envoys"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          The three envoys are put to death. The Mongols march on Dali at once. Your
          army is beaten at the city, and you are left with the walls. Gao Taixiang flees to
          the south, and is caught and executed by the Mongol general Uriyangkhadai.
          You yourself escape east to Shanchan (the city of Kunming), where you are captured
          the following year.
        deeds: {peace_with: [mongols], give: [g_dali], give_to: mongols, capital: g_yunnan}
      - label: "Accept Kublai's terms of submission"
        legitimacy_bp: -500
        outcome: >-
          The Mongols march into Dali under banners promising that no one will be harmed.
          You keep your life, and your chancellor keeps his head, for now.
        deeds: {peace_with: [mongols], give: [g_dali], give_to: mongols, capital: g_yunnan}
      - label: "Hold the passes and delay the envoys"
        legitimacy_bp: -300
        unrest_bp: 500
        outcome: >-
          The envoys are kept at the border while your soldiers gather in the passes. The
          Mongols do not wait long.
        deeds: {"men": 15000, "martial_bp": 500}
    history: >-
      In 1253 Kublai's army crossed the Jinsha and entered Dali; Gao Taixiang killed the Mongol
      envoys, was defeated, and was caught and executed. King Duan Xingzhi was captured in 1254.
    diverged: >-
      The Mongols are gone.
    sources: ["Yuan shi 4 (Xianzong)", "Yuan shi 121 (Uriyangkhadai)", "Rossabi, Khubilai Khan (1988)"]

  - id: dali_maharaja
    scenario: great_khan
    civ: dali
    year: 1256
    title: "The Maharaja"
    place: "The Mongol camp"
    speaker: mongols
    speaker_name: "An officer of Mongke Khan"
    speaker_title: "At the Mongol court"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Duan Xingzhi, the last king of Dali, and the Mongols have kept you alive. The
      Great Khan Mongke has decided to appoint you his governor in Yunnan, with the Sanskrit
      title of maharaja, 'great king'. The Mongols' own
      commissioners will run the tax rolls and the garrisons next to yours.


      First you must go to the Khan, in his camp, and ask for the post. They want to hear
      what you know of the country: the roads, the hill tribes and the lands to the
      south, for the Mongol plan is to surround the Song empire from the west.
    choices:
      - label: "Go to the Khan and ask for the post"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You present the Khan with a map of Yunnan and your advice on the country beyond.
          You are confirmed as maharaja. Your family's rule continues in Yunnan under
          Mongol overseers, and the Duan will remain hereditary governors until the Ming
          conquest of 1382.
        deeds: {peace_with: [mongols]}
      - label: "Refuse the title, and retire to a monastery"
        legitimacy_bp: -500
        influence: {"clergy": 500}
        outcome: >-
          You follow the tradition of your fathers. The Mongols give the post to your son, or to
          someone else, and Yunnan goes on without you.
      - label: "Take the title, and send your son to the Khan"
        wealth_bp: -200
        legitimacy_bp: 1900
        outcome: >-
          Your son makes the journey in your place and is received kindly. The Mongols are satisfied
          that Dali's house will cooperate, and you remain in Dali in name, with your people's respect
          for sparing the throne.
        deeds: {peace_with: [mongols]}
    history: >-
      After his capture Duan Xingzhi was received by Mongke, was made maharaja of Dali, and his
      descendants governed Yunnan for the Mongols until the Ming conquest in 1382.
    sources: ["Yuan shi 4 (Xianzong)", "Yang Bin, Between Winds and Clouds (2009)", "Rossabi, Khubilai Khan (1988)"]
