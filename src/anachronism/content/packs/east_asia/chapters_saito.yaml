schema_version: 1
# Chronicle mode (D-120, D-XXX): the Saito of Mino, from the aftermath of Okehazama to the
# death of Tatsuoki, 1560-1573. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Shincho koki, with the Taikoki (late and
# romantic, used with care: the Hanbei tale and the Sunomata one-night fort are told as later
# accounts) and modern work by Turnbull, Berry and Sadler. Yoshitatsu's death date (2 June
# 1561) and the fall of Inabayama (autumn 1567) are approximate to the month. Mino is the player's only province,
# so its loss in 1567 is told but not enacted (last province cannot be given away) and
# benchmark_provinces stays 1 (the real Saito held nothing after 1567). Yoshitatsu's reign
# is ended by ruler_falls in 1561; Tatsuoki's by ruler_falls in 1573.
chapters:
  - id: sai_blood
    scenario: sengoku
    civ: saito
    year: 1560
    title: "Your Father's Blood"
    place: "Inabayama castle, Mino"
    speaker: general
    speaker_name: "Your Mino captains"
    speaker_title: "At the council in Inabayama"
    benchmark_provinces: 1
    story: >-
      You are Saito Yoshitatsu, thirty-three, lord of Mino, a man so tall that the chronicles
      call you a giant. Four years ago you fought your father, Dosan, at the river Nagara and killed
      him. Before that you had your brothers killed. The tales say your father was an oil-seller
      who rose by murder to rule Mino; modern historians think those tales join two lives,
      father's and son's. Either way, he left a strong, feared house.


      Now Oda Nobunaga, whose wife is your half-sister, has destroyed the Imagawa army at
      Okehazama. He is no longer the fool of Owari, and a story is going round Mino that Dosan,
      before he died, wrote a testament leaving the province to him. Modern scholars doubt the
      letter. Your captains want to know what you will do about the border.
    choices:
      - label: "Keep raiding Owari along the rivers"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Raids and counter-raids go back and forth across the Kiso and the Nagara, and in the
          new year the fighting reaches Moribe, inside your border. Neither side can break the
          other, but Mino's captains begin to count the cost.
      - label: "Make peace with Nobunaga, your sister's husband"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          Nobunaga sends a polite answer. Your own men mutter that you have let the man who
          shamed Imagawa grow in peace.
      - label: "Fortify the border castles and wait"
        legitimacy_bp: 300
        materials_bp: -500
        outcome: >-
          You strengthen the castles on the Kiso and the Nagara and let Nobunaga come to you. The
          border is quiet, and your captains wonder what they are waiting for.
        deeds: {men: 3000}
    history: >-
      After Okehazama (1560) Oda Nobunaga and Saito Yoshitatsu fought on the border of Owari and
      Mino; Dosan's supposed testament leaving Mino to Nobunaga is of doubtful authenticity.
    sources: ["Shincho koki, book 1", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: sai_sickness
    scenario: sengoku
    civ: saito
    year: 1561
    title: "A Sickness in the Giant"
    place: "Inabayama castle"
    speaker: steward
    speaker_name: "The Three of West Mino"
    speaker_title: "Your leading vassals"
    benchmark_provinces: 1
    story: >-
      You are Saito Yoshitatsu, and you are ill. In the spring the physicians stopped
      speaking of recovery. In early summer you can no longer walk the castle. Your son
      Tatsuoki is thirteen.


      The three great lords of western Mino - Inaba, Ujiie and Ando, whom the chronicles call
      the Three of West Mino - say they will serve him. They ask what you wish to say to the
      house.
    choices:
      - label: "Name Tatsuoki heir and trust the elders"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You die on 2 June, aged thirty-four. The elders keep Tatsuoki on the seat of Mino, and
          wait to see what kind of lord he will be. Nobunaga, who has just heard of your death,
          is watching the border.
        deeds: {ruler_falls: "dies of his illness"}
      - label: "Appoint a regent from the Saito kin"
        legitimacy_bp: 300
        influence: {nobility: 1000}
        outcome: >-
          A regent is chosen from among the old men of the house. Tatsuoki is told to learn
          from him, and the Three begin to wonder who is really lord.
      - label: "Bind the Three to him with grants of land"
        wealth_bp: -800
        legitimacy_bp: 300
        influence: {nobility: 800}
        outcome: >-
          You give Inaba, Ujiie and Ando fresh estates and ask each to swear to your son. They
          swear gladly, and are richer for it.
    history: >-
      Saito Yoshitatsu died on 2 June 1561 (Eiroku 4) of illness, aged thirty-four, and was
      succeeded by his thirteen-year-old son Tatsuoki.
    sources: ["Shincho koki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: sai_hanbei
    scenario: sengoku
    civ: saito
    year: 1564
    title: "Sixteen Men"
    place: "Inabayama castle"
    speaker: general
    speaker_name: "A frightened castle steward"
    speaker_title: "At the gate of Inabayama"
    benchmark_provinces: 1
    story: >-
      You are Saito Tatsuoki, sixteen, lord of Mino. You have grown up among drinkers and
      flatterers, and you have favourites who are quicker to laugh than to serve. One of them
      is said to have jeered at a retainer called Takenaka Hanbei, a thin, pale man who looks
      more scholar than soldier. Later storytellers say the jeer was a particularly vulgar one.


      One night in the second month of the year, Hanbei's brother is brought in sick, and
      Hanbei and his small party are let into the castle to visit him. A few hours later the
      alarm is raised. Hanbei has taken Inabayama with about sixteen men. You have been
      driven out of your own castle, and the Three of West Mino, Hanbei's own kinsmen among
      them, are not coming at once to put it right.
    choices:
      - label: "Wait, and treat with Hanbei for the castle"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Hanbei, it turns out, wants no province. Nobunaga sends word that he will pay him
          half of Mino for the castle; Hanbei refuses. After about half a year he gives
          Inabayama back and retires to the mountain of Bodai with his books. You are once
          more lord of Mino, and the whole country has laughed at you.
      - label: "Raise the province and storm the castle"
        legitimacy_bp: 500
        food_bp: -800
        unrest_bp: 500
        outcome: >-
          Your retainers come out in grudging numbers. The siege of your own castle is brief
          but disorderly, and Hanbei slips away with his men and his reputation.
      - label: "Offer Hanbei gifts and a pardon for the castle"
        wealth_bp: -1000
        legitimacy_bp: -300
        influence: {nobility: 300}
        outcome: >-
          Envoys carry silver and a promise of pardon up to the walls of your own castle. Hanbei
          hears them out politely, and does not seem to want silver.
    history: >-
      In 1564 Takenaka Hanbei (Shigeharu) seized Inabayama with a small band to shame Saito
      Tatsuoki, held it for about half a year, then returned it; the details, including the
      insult and the number sixteen, come from later accounts.
    sources: ["Shincho koki", "Taikoki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: sai_sunomata
    scenario: sengoku
    civ: saito
    year: 1566
    title: "The Fort Across the River"
    place: "Sunomata, on the Nagara"
    speaker: general
    speaker_name: "Ando Morinari"
    speaker_title: "One of the Three of West Mino"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Saito Tatsuoki, eighteen. The Oda are building a fort at Sunomata, where the
      Nagara and the Ibi rivers meet, a short march from Mino. Your scouts say that an
      earlier attempt was driven off, and that a new man, Kinoshita Tokichiro, a peasant's
      son, is trying again with local timber and river-men's help. A story told much later
      says he built it in one night. Whatever the truth, a fort there threatens you.


      Ando Morinari, who commands the fighting nearest the river, says the Three can go and see
      about it. He has said the same of many things. You do not know whether he is loyal.
    choices:
      - label: "Send the army to drive the builders off"
        historical: true
        legitimacy_bp: 500
        materials_bp: -500
        outcome: >-
          Your men attack the Oda workers and are beaten back by the fort's new palisades. The
          fort stands, and your lords hear that Nobunaga's agents are already talking to the
          men of western Mino.
      - label: "Strengthen Inabayama and keep the army at home"
        materials_bp: -300
        legitimacy_bp: -300
        outcome: >-
          The fort goes up unopposed. Your captains say you have given the enemy a foothold.
      - label: "Send raiders to burn the builders' timber"
        legitimacy_bp: 300
        materials_bp: -300
        outcome: >-
          A small band goes by night to fire the stacks of cut timber and the rafts. The fort is
          delayed, not stopped.
        deeds: {men: 2000}
    history: >-
      In 1566 Oda forces built a fort at Sunomata against Saito opposition; the famous story of
      Hideyoshi building it in a single night appears only in much later sources.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Berry, Hideyoshi (1982)"]

  - id: sai_inabayama
    scenario: sengoku
    civ: saito
    year: 1567
    title: "The Fall of Inabayama"
    place: "Inabayama castle, above the Nagara"
    speaker: general
    speaker_name: "Inaba Ittetsu"
    speaker_title: "One of the Three of West Mino"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Saito Tatsuoki, nineteen. In the eighth month of the year Inaba Ittetsu, Ujiie
      Bokuzen and Ando Morinari - the Three of West Mino - have gone over to Nobunaga, and
      with them most of Mino's strength. Oda troops have burnt the town below your castle.
      The castle stands on a crag, but your garrison is small and your allies are gone.


      Nobunaga's men have surrounded the foot of the mountain. A boat could take you downriver
      to Nagashima in Ise, where friends of Mino's enemies might shelter a lord with no land.
    choices:
      - label: "Slip away by night down the river"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 1000
        outcome: >-
          You are in Nagashima by the end of the week. Behind you, Nobunaga walks into the
          castle, renames it Gifu after a hill in a far-off Chinese kingdom, and takes a new
          seal. The Saito, who ruled Mino for two generations, are lords of nothing.
      - label: "Stay and defend the castle to the end"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Your garrison fights for three days. At the end you are alive, which you are not
          sure is better.
      - label: "Ask Nobunaga for terms through a priest"
        legitimacy_bp: -1500
        wealth_bp: -500
        outcome: >-
          A priest goes down the mountain under a white banner. Nobunaga receives him, and the
          talk goes on late.
        deeds: {peace_with: [oda]}
    history: >-
      In September 1567 (Eiroku 10) the Three of West Mino defected and Nobunaga took Inabayama;
      Tatsuoki fled by boat to Nagashima, the Saito losing Mino. Nobunaga renamed the place Gifu.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, book 1", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: sai_ichijodani
    scenario: sengoku
    civ: saito
    year: 1573
    title: "The Last Refuge"
    place: "Ichijodani, Echizen"
    speaker: general
    speaker_name: "Asakura Yoshikage"
    speaker_title: "Your host"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Saito Tatsuoki, twenty-five. Six years have passed since you fled Mino. You found
      shelter first at Nagashima, then in Echizen with Asakura Yoshikage, whose castle town of
      Ichijodani is full of exiles from Kyoto. Nobunaga beat the Asakura beside the river
      Ane three years ago. This summer the Asakura army, having stood by their allies in Omi,
      has been caught as it fell back.


      In late summer 1573 Nobunaga pursues it into Echizen. Yoshikage's army is beaten at the
      pass of Tonezaka. Ichijodani is in flames; its lord has fled to a temple.
    choices:
      - label: "Fight beside the Asakura to the end"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          You are killed in the burning town, aged twenty-five, among the last of the Asakura
          warriors. Yoshikage kills himself within the week. The line that once held Mino has
          ended.
        deeds: {ruler_falls: "is killed at Ichijodani"}
      - label: "Slip away to the mountains with a few retainers"
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          You get as far as the first pass. Nobunaga's riders are already waiting there.
      - label: "Ask Nobunaga's captains for terms"
        legitimacy_bp: -1500
        outcome: >-
          You send word to the captains of the Oda that Saito Tatsuoki will lay down his arms if
          his life is spared. They say they will ask their lord.
        deeds: {peace_with: [oda]}
    history: >-
      Saito Tatsuoki, in exile at the Asakura court, was killed during Nobunaga's attack on
      Echizen in 1573, when Ichijodani was destroyed.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Turnbull, The Samurai Sourcebook (1998)"]
