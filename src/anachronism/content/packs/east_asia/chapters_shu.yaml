schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Shu, the Chengdu plain before Qin, about
# 337-316 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Shu's own script is undeciphered, so Shu is known only through Qin and Han writers. Facts follow the Shiji (Qin
# annals, ch. 5; Zhang Yi, ch. 70) and the Zhanguo ce (Qin 1), with the much later Huayang
# guo zhi (Chang Qu, 4th century AD), which supplies the Marquis of Ju, the stone oxen and the
# names of the Kaiming kings, marked as late tradition wherever it is used; modern work by
# Sage (Ancient Sichuan, 1992) and the Chengdu excavation reports. The king's name is not
# reliably known, so the game calls him only "a Kaiming". The stone-ox and five-women stories
# are legend. The dates 324 (oxen) and 320 (Ju) are approximate; 316 is firm. The King of
# Shu's death at Wuyang is the Huayang guo zhi's. benchmark_provinces counts the provinces of
# this map the real kings held at that date.
chapters:
  - id: shu_court
    scenario: warring_states
    civ: shu
    year: -336
    title: "Gifts for the Lord of Qin"
    place: "Chengdu"
    speaker: steward
    speaker_name: "Your master of the court"
    speaker_title: "Of the Kaiming house"
    benchmark_provinces: 2
    story: >-
      You are the King of Shu, of the Kaiming line, and your plain is the richest in the
      west: rice, salt, timber, bronze, lacquer and silk, and a script of your own that no
      lord in the east can read. Between you and the world lie the mountains, and across them
      is Qin, which has lately been remade by Shang Yang and has a new lord, Huiwen, who has
      just put Shang Yang to death.


      Your master of the court says that envoys of Chu, Han and Zhao have gone to the new
      lord's court with gifts to greet his accession, and that Qin would take it well if
      Shu did too. Your mountains are your wall, and a king who sends gifts across them
      shows the road to those who might use it.
    choices:
      - label: "Send envoys with gifts to Qin"
        historical: true
        wealth_bp: -300
        legitimacy_bp: 400
        outcome: >-
          Your envoys make the long journey north by the mountain tracks, are received with
          honour, and come home with a good report of Qin's wealth and bad news of its
          ambitions. The road has been walked once, and it can be walked again.
      - label: "Send no one: the mountains are wall enough"
        wealth_bp: 200
        legitimacy_bp: 200
        outcome: >-
          Shu keeps its silence. Qin takes note, and has long memories of who greets it and
          who does not.
        deeds: {grudges: {qin: 500}}
      - label: "Send your gifts to Chu instead"
        wealth_bp: -300
        legitimacy_bp: 200
        deeds: {grudges: {qin: 300}}
        outcome: >-
          Your envoys go down the river to the court of Chu, and are well received. Qin hears
          of it, and does not count it a courtesy to itself.
    history: >-
      The Shiji records that in 337 BC, in the first year of King Huiwen of Qin, envoys of
      Chu, Han, Zhao and Shu came to his court. The annals say nothing of what was said.
    sources: ["Shiji 5 (Qin)", "Sage, Ancient Sichuan and the Unification of China (1992)"]

  - id: shu_oxen
    scenario: warring_states
    civ: shu
    year: -324
    title: "Oxen of Stone"
    place: "The mountain road"
    speaker: steward
    speaker_name: "A frontier officer"
    speaker_title: "From the northern passes"
    benchmark_provinces: 2
    story: >-
      This is the story that the later chroniclers tell, and it may be only a story. The
      Lord of Qin, the Huayang guo zhi says, wanted to attack Shu but had no road, for the
      mountains stand in the way. So his craftsmen carved five great oxen out of stone and
      laid gold beneath their tails, and let it be known that these were oxen that dropped
      gold.


      An officer brings you the news. A Qin envoy has come to the border, saying that the
      Lord of Qin offers you the oxen as a gift. The road to carry them is steep and narrow,
      and your five strong men could drag them over, if the mountains were cut through. Your
      ministers are divided. Some say a king who keeps his mountains does not open them to
      gifts.
    choices:
      - label: "Accept the oxen as a gift of Qin"
        historical: true
        wealth_bp: 400
        legitimacy_bp: -500
        outcome: >-
          The story says that your strongmen cut the cliff and dragged the oxen home, and the
          road they made was called the Road of the Stone Oxen. Whether or not any gold was ever
          under their tails, the road is real, and the Qin army will not be slow to use it.
        deeds: {grudges: {qin: 300}}
      - label: "Refuse the oxen at the border"
        wealth_bp: -200
        legitimacy_bp: 600
        outcome: >-
          Your ministers breathe again. Qin will have to find another way over the mountains.
          Gifts that cost a road are dear.
      - label: "Receive the oxen at the border and send gifts"
        wealth_bp: -400
        legitimacy_bp: 300
        outcome: >-
          You meet the Qin envoy at the foot of the mountains, take the oxen no further than
          your own border, and send back gifts of your own. The road is not cut.
    history: >-
      The stone-ox story is told in the Huayang guo zhi and its Shu wang benji, centuries
      after the event, and is a legend; the Zhanguo ce does not know it. What is certain is
      that in 316 BC Qin did come into Shu by a mountain road from Hanzhong, which tradition
      called the Shiniu or Stone-Ox Road, and that the plank roads of the Qinling were later
      the main route between the Wei valley and Sichuan.
    sources: ["Huayang guo zhi 3 (Shu zhi), late tradition", "Sage, Ancient Sichuan and the Unification of China (1992)"]

  - id: shu_ju
    scenario: warring_states
    civ: shu
    year: -320
    title: "Your Brother in Hanzhong"
    place: "Chengdu"
    speaker: steward
    speaker_name: "Your chancellor"
    speaker_title: "Of the council"
    benchmark_provinces: 2
    story: >-
      The Huayang guo zhi, our only long account of the Kaiming house, says that your
      ancestor gave Hanzhong to his younger brother, with the title Marquis of Ju, and his
      seat at Jiameng by the river. The brothers' houses have been quarrelling ever since.
      The present Marquis of Ju is on good terms with Ba, your oldest enemy, and has begun to
      act as if Hanzhong were his own and not yours.


      Your chancellor says that if the Marquis will not bow, you must make him. The Qin
      border is close, though, and Qin watches Hanzhong more closely than anything else in
      the south. A family quarrel carried over the mountains can have a very long reach.
    choices:
      - label: "Send the army against Ju"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          Your army marches north and Ju's marquis flees, as the later account tells,
          into the arms of Ba. You are master of Hanzhong again. The marquis and the King of
          Ba then send, each in their own way, to Qin for help.
        deeds: {martial_bp: 200, men: 8000, grudges: {ba: 1500}}
      - label: "Settle with your brother at Jiameng"
        deeds: {men: 2000}
        legitimacy_bp: 300
        unrest_bp: -200
        outcome: >-
          The Marquis keeps his title and his town. It is an uneasy peace, but nobody has
          sent a letter over the mountains.
      - label: "Send a minister to demand his homage"
        wealth_bp: -200
        legitimacy_bp: 200
        deeds: {martial_bp: 100}
        outcome: >-
          Your minister goes to Jiameng and the Marquis sends polite words and small gifts,
          but no oath. The quarrel is neither healed nor fought out, and Ju looks more and
          more to Ba.
    history: >-
      The Shiji (Zhang Yi) says that Shu and Ba attacked each other and each appealed to
      Qin for aid, which is firm. That the cause was Shu's attack on the Marquis of Ju, who fled
      to Ba, is told only by the much later Huayang guo zhi.
    sources: ["Shiji 70 (Zhang Yi)", "Huayang guo zhi 3 (Shu zhi), late tradition"]

  - id: shu_fall
    scenario: warring_states
    civ: shu
    year: -316
    title: "Sima Cuo Crosses the Mountains"
    place: "Jiameng, on the northern road"
    speaker: general
    speaker_name: "A captain of the pass"
    speaker_title: "Of the Shu army"
    benchmark_provinces: 1
    story: >-
      The news from the north is the worst that Shu could hear. In the Qin court, the
      Zhanguo ce says, Zhang Yi argued for marching east on Han and the Zhou king, and Sima
      Cuo argued that Shu was rich, ill-defended and a barbarian state that would offend no
      one if taken. The lord of Qin chose Sima Cuo. Now the Qin army is in Hanzhong in the
      autumn, with Zhang Yi beside Sima Cuo, and it is coming down the road to
      Jiameng.


      Your captain says the passes are good ground, and your men are brave, but Qin has iron,
      crossbows and ten years of Shang Yang's drilled farmers.
    choices:
      - label: "Meet Qin in the field at the passes"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          The Huayang guo zhi says that you fought them at Jiameng and lost, and that you fled
          south and were killed at Wuyang, on the plain. Qin takes Shu in the same campaign
          and the next king, in Qin's grant, is called a marquis. Your house is gone.
        deeds: {ruler_falls: "is killed fleeing from Qin"}
      - label: "Pull back to the plain and treat for peace"
        deeds: {peace_with: [qin]}
        legitimacy_bp: -500
        outcome: >-
          You pull back to the plain and send gifts to Sima Cuo. He thanks you, and keeps
          marching.
      - label: "Break the mountain road and wait behind it"
        legitimacy_bp: -800
        wealth_bp: -400
        deeds: {men: 3000}
        outcome: >-
          Your engineers drop the cliff path into the gorge, and your men dig in at the plain.
          Qin has to rebuild the road before it can bring up supplies, and it has a great many
          men to do it.
    history: >-
      Qin under Sima Cuo conquered Shu in 316 BC. Qin first demoted the king to marquis
      and made Chen Zhuang chancellor of Shu (Shiji 70). The Shiji says Shu's chancellor Zhuang killed the Marquis
      of Shu in 311 BC; and that Marquis Hui's rebellion was put down by Sima Cuo in 301. Li
      Bing, Qin's governor, built the Dujiangyan weir later (Shiji 29), in the next century.
    sources: ["Shiji 5, 70", "Zhanguo ce, Qin 1", "Shiji 29 (Rivers)", "Huayang guo zhi 3 (Shu zhi), late tradition"]
