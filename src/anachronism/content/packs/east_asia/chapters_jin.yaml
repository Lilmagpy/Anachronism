schema_version: 1
# Chronicle mode (D-120, D-161): the Jurchen Jin and its fall to the Mongols, 1206-1234.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Jin shi, the Yuan shi, the Secret History of the Mongols, Song sources
# (the Song shi and Zhao Gong's report on the Mongols), Liu Qi's memoir of the siege of
# Kaifeng, and modern work by Franke, Tao Jing-shen, Allsen, Atwood and Needham on the
# gunpowder weapons. benchmark_provinces counts the provinces of this map the real Jin held
# at that date.
chapters:
  - id: jin_kaixi
    scenario: great_khan
    civ: jurchen_jin
    year: 1206
    title: "The Minister's Head"
    place: "Zhongdu"
    speaker: general
    speaker_name: "Pusan Kui"
    speaker_title: "Commander on the Huai river"
    needs_alive: [southern_song]
    benchmark_provinces: 9
    story: >-
      You are Emperor Zhangzong, the sixth emperor of the Jin. Your forefathers, Jurchen
      hunters from the Manchurian forests, took the north of China from the Song eighty years
      ago, and the Song have paid you tribute ever since. You write Chinese poetry and collect
      Song paintings.


      Now the Song chief minister, Han Tuozhou, has declared war to win back the north. His
      armies have crossed the Huai and been beaten. The Song general in Sichuan, Wu Xi, has
      offered to change sides. Your commander Pusan Kui says you can dictate the peace.
    choices:
      - label: "Strike back, and ask for Han Tuozhou's head"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 2500
        outcome: >-
          Your armies cross the Huai and take town after town. Wu Xi becomes your King of Shu,
          until his own officers kill him. In Hangzhou, Han Tuozhou's rivals club him to death
          on his way to court, and in 1208 his lacquered head arrives in your capital with the
          peace treaty: the Song will pay more silver and silk every year, and three million
          ounces of silver for the war.
        deeds: {peace_with: [southern_song], grudges: {southern_song: 1500}}
      - label: "Make peace on the old terms"
        legitimacy_bp: 500
        outcome: >-
          The Song are surprised and grateful, for a while.
        deeds: {peace_with: [southern_song]}
      - label: "Accept Wu Xi's offer, and take Sichuan"
        legitimacy_bp: 1200
        wealth_bp: 2800
        unrest_bp: 500
        outcome: >-
          Wu Xi brings his Sichuan garrisons over to you and the Song are forced to fight in
          the west as well as on the Huai. Silver and silk follow the peace, though the new
          province is restless.
        deeds: {men: 8000, grudges: {southern_song: 2500}}
    history: >-
      The Song's Kaixi war (1206-1208) failed. Han Tuozhou was murdered and his head sent to
      the Jin under the Treaty of Jiading (1208), which raised the Song's annual payments.
    sources: ["Jin shi 93 (Pusan Kui)", "Song shi 474 (Han Tuozhou)", "Franke, in Cambridge History of China vol. 6 (1994)"]

  - id: jin_weakling
    scenario: great_khan
    civ: jurchen_jin
    year: 1210
    title: "The Khan Does Not Bow"
    place: "Zhongdu"
    speaker: steward
    speaker_name: "Your envoy"
    speaker_title: "Just back from the Mongols"
    needs_alive: [mongols]
    benchmark_provinces: 9
    story: >-
      You are Wanyan Yongji, Prince of Wei, emperor since your nephew Zhangzong died without
      a son. As Prince of Wei you once went to the frontier to collect the tribute of the
      Mongols, and their chief Temujin - now Genghis Khan - did not bow to you then either.


      Your envoy has gone to tell him of your accession and to receive his homage. He reports
      that the Khan turned to the south and spat, and said: "I thought the emperor of the
      Middle Kingdom was a man of Heaven. Can an idiot like this be emperor? Why should I bow
      to him?" Then he rode away. The Onggut, who guard your outer wall for you, have
      married their chief's son to his daughter.
    choices:
      - label: "Meet him at the passes with every man you have"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2000
        outcome: >-
          In 1211 the Onggut open the wall. Your great army waits for the Mongols in the hills
          at the Badger's Mouth, strung out along the passes, and the Mongols break it in a
          day. The Secret History says the dead lay piled like rotten logs for thirty miles.
          The Khan's horsemen ride to the walls of Zhongdu, look at them, and go home with the
          herds of your imperial horse farms.
        deeds: {grudges: {mongols: 2000}}
      - label: "Win back the Onggut, and hold the walls of the cities"
        wealth_bp: -2000
        legitimacy_bp: -500
        outcome: >-
          Gifts go north to the Onggut, and the armies stay behind city walls. The Mongols ride
          through the countryside unopposed, burning, but the cities hold.
      - label: "Pull the frontier armies back to the Yellow River"
        legitimacy_bp: -1500
        wealth_bp: -500
        outcome: >-
          Your frontier garrisons withdraw south and the passes are left to the Mongols. The
          army is saved for the defence of the river, but the people of the north see their
          emperor give up the outer wall.
        deeds: {men: 15000}
    history: >-
      Genghis Khan refused homage to Wanyan Yongji (r. 1208-1213) and invaded in 1211; the
      Jin field army was destroyed at Yehuling (the Badger's Mouth).
    diverged: >-
      The Mongols are gone; nobody came south.
    sources: ["Yuan shi 1 (Taizu)", "Secret History of the Mongols 247", "Jin shi 13 (Weishao wang)"]

  - id: jin_hushahu
    scenario: great_khan
    civ: jurchen_jin
    year: 1213
    title: "The Kingmaker"
    place: "Zhongdu"
    speaker: general
    speaker_name: "Hushahu"
    speaker_title: "Commander of the Zhongdu garrison"
    benchmark_provinces: 9
    story: >-
      You are Emperor Xuanzong. A month ago the general Hushahu, who lost a battle and was
      dismissed for it, marched his men into Zhongdu, killed Yongji and sent for you. You are
      fifty and you did not ask for the throne.


      The Mongols are back, and the north is burning. Hushahu, the man who made you emperor,
      wants to be marshal of all your armies.
    choices:
      - label: "Make him marshal"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Hushahu commands the defence, and quarrels with everyone. Two months later another
          general, Zhuhu Gaoqi, afraid of being executed for losing a battle, breaks into
          Hushahu's house and cuts off his head. You pardon Gaoqi too.
        deeds: {martial_bp: 300}
      - label: "Have him killed while you still can"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Hushahu dies at a banquet. His soldiers riot for three days, and then the Mongols
          come.
      - label: "Make him commander of the guards only"
        legitimacy_bp: -300
        outcome: >-
          Hushahu takes the palace guard and a share of the Zhongdu garrison, and no more. He
          accepts it, for the moment, and watches you.
        deeds: {men: 5000, martial_bp: 300}
    history: >-
      Hushahu (Heshilie Zhizhong) murdered Wanyan Yongji in 1213 and enthroned Xuanzong, who
      made him marshal; he was killed by Zhuhu Gaoqi later that year.
    sources: ["Jin shi 132 (Heshilie Zhizhong)", "Jin shi 14 (Xuanzong)"]

  - id: jin_kaifeng
    scenario: great_khan
    civ: jurchen_jin
    year: 1214
    title: "A Princess for the Khan"
    place: "Zhongdu, besieged"
    speaker: steward
    speaker_name: "Wanyan Chenghui"
    speaker_title: "Chief minister"
    needs_alive: [mongols]
    benchmark_provinces: 5
    story: >-
      The Mongols have taken ninety towns north of the Yellow River and are camped below your
      walls. Zhongdu has not fallen, but it is starving, and the Khan has offered to go home
      for a price: a princess of the imperial house for his wife, gold and silk, five hundred
      boys and girls, three thousand horses.


      Your ministers say that when he has gone, the court should leave too, for Kaifeng, the
      old Song capital south of the Yellow River, where the Mongols have never been. Your
      chief minister, Wanyan Chenghui, says that if you leave Zhongdu it is lost.
    choices:
      - label: "Pay the Khan, and move the court to Kaifeng"
        historical: true
        wealth_bp: -3000
        legitimacy_bp: -1500
        outcome: >-
          The Khan takes the princess and goes. Then he hears that you have gone south, and
          calls it treachery. In 1215 Zhongdu falls. Wanyan Chenghui takes poison. The city
          burns for a month, and an envoy from the Khwarazm-shah, passing a year later, sees
          a hill of bones by the gate.
        deeds: {capital: g_kaifeng, give: [g_zhongdu, g_liaoxi], give_to: mongols}
      - label: "Pay the Khan, and stay in Zhongdu"
        wealth_bp: -3000
        legitimacy_bp: 500
        outcome: >-
          The court stays, with a larger garrison, and fills the granaries while the Mongols
          are away.
        deeds: {men: 10000}
      - label: "Refuse the Khan, and hold Zhongdu to the end"
        legitimacy_bp: 800
        food_bp: -2500
        outcome: >-
          You send the Khan's envoys away and call the garrisons in. Zhongdu is crowded and
          hungry, but the court is seen to have stood its ground.
        deeds: {men: 20000, martial_bp: 500}
    history: >-
      In 1214 Xuanzong paid off Genghis Khan with a princess and tribute, then moved his court
      to Kaifeng. The Mongols returned and took Zhongdu in 1215.
    diverged: >-
      The Mongols are gone; there was no one to pay.
    sources: ["Jin shi 14 (Xuanzong)", "Jin shi 101 (Wanyan Chenghui)", "Juzjani, Tabaqat-i Nasiri"]

  - id: jin_wannu
    scenario: great_khan
    civ: jurchen_jin
    year: 1215
    title: "The King of Great Zhen"
    place: "Kaifeng"
    speaker: steward
    speaker_name: "A messenger from Liaodong"
    speaker_title: "Who took the sea road"
    benchmark_provinces: 5
    story: >-
      The homeland of your people, the forests and rivers of the north-east, is cut off. The
      Khitans there rose two years ago under Yelu Liuge and swore themselves to the Khan. You
      sent your commander Puxian Wannu with an army to put them down.


      He was beaten. Now he has stopped answering your letters, and the messenger says he
      has proclaimed himself King of Great Zhen in Liaodong.
    choices:
      - label: "Let him go; you cannot reach him"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          The land your ancestors rode out of a hundred years ago is gone. Puxian Wannu's
          kingdom of Eastern Xia lasts nearly twenty years, sometimes the Khan's vassal and
          sometimes not, until the Mongols put an end to it.
        deeds: {give: [g_liaodong, g_shangjing]}
      - label: "Offer him a title and a pardon"
        legitimacy_bp: -500
        wealth_bp: -1000
        outcome: >-
          Wannu accepts the title of Prince of Liaodong, sends a letter of thanks, and keeps
          the province as his own, doing as he pleases.
        deeds: {give: ["g_liaodong"]}
      - label: "Send a second army against him"
        legitimacy_bp: 300
        food_bp: -1500
        outcome: >-
          A second army marches into Liaodong, short of grain and short of friends. It cannot
          reach Wannu through the Khitan country, and comes home thinner than it set out.
        deeds: {men: 12000, martial_bp: 500}
    history: >-
      Puxian Wannu, a Jin commander, declared his own state (Great Zhen, or Eastern Xia) in
      Liaodong in 1215; it survived until 1233.
    sources: ["Yuan shi 1 (Taizu)", "Jin shi 15", "Atwood, Encyclopedia of Mongolia and the Mongol Empire (2004)"]

  - id: jin_south
    scenario: great_khan
    civ: jurchen_jin
    year: 1217
    title: "Compensation in the South"
    place: "Kaifeng"
    speaker: general
    speaker_name: "Zhuhu Gaoqi"
    speaker_title: "Chief minister"
    needs_alive: [southern_song]
    benchmark_provinces: 5
    story: >-
      Since you fled to Kaifeng, the Song have stopped paying their silver and silk. The north
      is lost to the Mongols, the Shandong peasants have risen as the 'Red Coats', and the
      treasury is empty.


      Your minister Zhuhu Gaoqi, the man who killed Hushahu, says: what the Mongols have taken
      in the north, take from the Song in the south. Their armies are soft, and their cities
      are rich.
    choices:
      - label: "Attack the Song"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          For seven years your armies raid across the Huai. They take plunder and lose men, and
          take no city they can keep. The Song, who might have been your allies against the
          Mongols, learn to hate you more.
        deeds: {martial_bp: 500, grudges: {southern_song: 3000}}
      - label: "Ask the Song for an alliance against the Mongols"
        legitimacy_bp: -1000
        wealth_bp: -1500
        outcome: >-
          Your envoys go to Hangzhou with a proposal that 'lips and teeth' stand together, and
          a gift of silver. The Song ministers argue about it for a year.
        deeds: {peace_with: ["southern_song"]}
      - label: "Raise a peasant army for the Mongol front"
        legitimacy_bp: -300
        unrest_bp: 800
        outcome: >-
          You levy the Hebei and Shandong peasants for the northern passes and leave the Song
          alone. The army is large, ragged and resented, and the Red Coats grow bolder.
        deeds: {men: 15000}
    history: >-
      Xuanzong attacked the Song in 1217 to recover lost revenue; the war dragged on until
      1224 with no gain.
    diverged: >-
      The Song are gone.
    sources: ["Jin shi 106 (Zhuhu Gaoqi)", "Franke, in Cambridge History of China vol. 6 (1994)"]

  - id: jin_aizong
    scenario: great_khan
    civ: jurchen_jin
    year: 1224
    title: "Peace on Two Fronts"
    place: "Kaifeng"
    speaker: steward
    speaker_name: "Wanyan Heda"
    speaker_title: "Your general and councillor"
    benchmark_provinces: 2
    story: >-
      You are Emperor Aizong, twenty-six. Your father's wars have left you the land between
      the Yellow River and the Huai, the passes to the west, and an army that has learned to
      fight the Mongols from behind walls.


      Genghis Khan is in the far west. Your general Wanyan Heda says this is the moment to
      end every other war: with the Song in the south, with the Tangut kingdom of Xia in the
      west, and to face the Mongols alone, with everything you have.
    choices:
      - label: "Make peace with the Song and with Xia"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        outcome: >-
          You stop the raids across the Huai, and in 1225 you sign a treaty with Xia as
          'brothers'. Two years later Xia is destroyed by the Mongols, and Genghis Khan dies.
          His sons will come for you next.
        deeds: {peace_with: [southern_song, western_xia]}
      - label: "Keep fighting on every frontier"
        unrest_bp: 500
        legitimacy_bp: 1000
        wealth_bp: 1500
        outcome: >-
          The raids go on. The Song keep a list of them.
          The raids bring plunder and prestige, and the Song keep a list of them.
        deeds: {martial_bp: 500}
      - label: "Make peace with the Song, and send Xia an army"
        legitimacy_bp: 1900
        unrest_bp: -800
        outcome: >-
          The Song raids stop, and you send horsemen west to help Xia against the Mongols.
          Xia's court is grateful, and your own people feel the lightening of one front.
        deeds: {peace_with: ["southern_song"], men: 10000}
    history: >-
      Aizong (r. 1224-1234) made peace with the Song in 1224 and with Xia in 1225.
    sources: ["Jin shi 17 (Aizong)", "Jin shi 112 (Wanyan Heda)"]

  - id: jin_loyal
    scenario: great_khan
    civ: jurchen_jin
    year: 1229
    title: "The Loyal and Filial Army"
    place: "Kaifeng"
    speaker: general
    speaker_name: "Wanyan Chen Heshang"
    speaker_title: "Commander of the Loyal and Filial Army"
    needs_alive: [mongols]
    benchmark_provinces: 2
    story: >-
      Wanyan Chen Heshang was a Mongol prisoner, escaped, and now commands the Loyal and
      Filial Army: Uighurs, Naimans, Tanguts and Han Chinese, men who fled from the Mongols
      and fight them for pay and for revenge. They are the best soldiers you have.


      The Mongols are probing the passes again. Chen Heshang asks for horses, armour and the
      pay of a thousand more men.
    choices:
      - label: "Give the Loyal and Filial Army everything it needs"
        historical: true
        wealth_bp: -2000
        legitimacy_bp: 1000
        outcome: >-
          At Dachangyuan four hundred of his horsemen rout eight thousand Mongols, the first
          time in twenty years the Mongols have been beaten in the field. Two years later, at
          Three Peaks Mountain, in snow, the Mongols destroy your last great army. Chen
          Heshang gives himself up, names himself, and refuses to kneel; they cut his legs and
          slit his mouth, and he dies cursing them. A Mongol general pours out mare's milk for
          his spirit.
        deeds: {men: 8000, martial_bp: 800}
      - label: "Spread the money among all the garrisons"
        wealth_bp: -2000
        outcome: >-
          Every fortress gets a few more bowmen. None of them can take the field.
        deeds: {men: 4000}
      - label: "Raise a conscript levy from the Hebei peasants"
        legitimacy_bp: 1200
        unrest_bp: 500
        wealth_bp: -1500
        outcome: >-
          Thousands of peasants are marched to the passes with spears and a few weeks of
          drill. They fill the lines, but not the places where good soldiers are needed.
          The levy is welcomed in the towns that were being raided, and the passes are manned.
        deeds: {men: 15000}
    history: >-
      Wanyan Chen Heshang's Loyal and Filial Army (zhongxiaojun) beat the Mongols at
      Dachangyuan (1228-1229). The Jin field army was destroyed at Sanfengshan in 1232.
    diverged: >-
      The Mongols are gone.
    sources: ["Jin shi 123 (Wanyan Chen Heshang)", "Jin shi 112 (Wanyan Heda)"]

  - id: jin_thunder
    scenario: great_khan
    civ: jurchen_jin
    year: 1232
    title: "Thunder That Shakes Heaven"
    place: "The walls of Kaifeng"
    speaker: general
    speaker_name: "The commander of the walls"
    speaker_title: "Kaifeng"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      Subutai is besieging Kaifeng. Your defenders have new weapons: iron pots packed with
      gunpowder, the 'thunder that shakes heaven', lowered down the walls on chains into the
      Mongol trenches, which blow men and their leather shelters to pieces; and 'flying fire
      lances', tubes of powder on spears, that spit flame ten paces.


      Kaifeng holds. But the plague has come into the city, and the carts take out the dead
      by the hundred thousand. Your councillors say you must leave it, raise an army in the
      east, and come back.
    choices:
      - label: "Leave Kaifeng to raise an army"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          You slip out in the winter. The army you raise is beaten. In Kaifeng the commander
          Cui Li kills your ministers, opens the gates, and hands the empresses and princes to
          the Mongols, who take them north. Subutai wants to put the city to the sword; the
          Khan's Khitan minister, Yelu Chucai, talks him out of it. You go to Caizhou.
      - label: "Stay, and die with your capital if need be"
        legitimacy_bp: 1000
        unrest_bp: 2000
        outcome: >-
          You stay. The bombs keep the Mongols out of the trenches, and the plague keeps
          everyone else out of the streets.
      - label: "✦ Cast cannon for the walls"
        needs_adopted: [cannon]
        legitimacy_bp: 1000
        outcome: >-
          Your founders cast bronze tubes that throw iron balls instead of flame. The Mongol
          siege towers are knocked down one by one, and Subutai, who has never been stopped by
          a wall, draws back to think.
        deeds: {martial_bp: 1500}
      - label: "Open talks with Subutai from inside the walls"
        legitimacy_bp: -1000
        wealth_bp: -2000
        outcome: >-
          Your envoys go out with silk and horses and bring back a truce on harsh terms.
          Kaifeng can feed its people for a while, but the plague is not impressed by
          treaties.
        deeds: {peace_with: ["mongols"]}
    history: >-
      During the siege of Kaifeng (1232-1233) the Jin used iron gunpowder bombs (zhentianlei)
      and fire lances. Aizong left the city; Cui Li surrendered it in 1233.
    diverged: >-
      The Mongols are gone; there was no siege.
    sources: ["Jin shi 113 (Chixian Heshang)", "Liu Qi, Guiqian zhi", "Needham, Science and Civilisation in China 5.7 (1986)"]

  - id: jin_caizhou
    scenario: great_khan
    civ: jurchen_jin
    year: 1233
    title: "The Last Emperor of Jin"
    place: "Caizhou"
    speaker: steward
    speaker_name: "Wanyan Chenglin"
    speaker_title: "Commander of the guard, of the imperial clan"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      Caizhou is a small walled town, and you are in it. The Mongols are outside, and so is
      a Song army: the Song have made an alliance with the Khan, to share out what is left of
      you. Inside, the soldiers are eating their horses, and then their saddles.


      You say to your ministers: "I have been emperor for ten years. I have no great crimes.
      Why should I end like the tyrants who lost their states?" You do not want to be the
      last emperor of the Jin. Your kinsman Wanyan Chenglin, a soldier who can ride and
      shoot, might be.
    choices:
      - label: "Hand the throne to Chenglin"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Chenglin takes the throne in a hurried ceremony while the Song are on the south wall.
          You hang yourself, and your body is burned so the enemy cannot have it. Chenglin
          dies in the street fighting the same day. The Song general Meng Gong takes half your
          bones home to Hangzhou, to lay before the tombs of the Song emperors your ancestors
          captured a century ago.
        deeds: {ruler_falls: "gives up the throne and hangs himself"}
      - label: "Break out west, to Gongchang"
        legitimacy_bp: -500
        unrest_bp: 2000
        outcome: >-
          At night the last guards cut a way through the Song lines. In the hills of the far
          west, a Jin governor still holds out, and still uses your reign name.
      - label: "Make a last stand on the walls of Caizhou"
        legitimacy_bp: 1000
        unrest_bp: 500
        outcome: >-
          You put on armour and go up to the south wall with the last of the guards. The Song
          attack is thrown back for a day, and the garrison remembers that its emperor stood
          with it.
    history: >-
      Aizong abdicated to Wanyan Chenglin (Mozong) and hanged himself as Caizhou fell to a
      Mongol and Song army in February 1234; Chenglin was killed the same day, ending the Jin.
    diverged: >-
      The Mongols are gone, and the Jin did not end at Caizhou.
    sources: ["Jin shi 18 (Aizong)", "Song shi 412 (Meng Gong)", "Franke, in Cambridge History of China vol. 6 (1994)"]
