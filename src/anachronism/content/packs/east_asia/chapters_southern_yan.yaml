schema_version: 1
# Chronicle mode (D-120, D-XXX): the Murong kingdom of Southern Yan in Shandong, from Murong
# De's imperial title to the fall of Guanggu, 400-410. Each chapter opens in its year; one
# choice is what history chose (historical: true). Facts follow the Jin shu (ch. 127-128,
# the Murong De and Murong Chao records), the Song shu ch. 1, the Wei shu ch. 95 and the Zizhi
# tongjian 110-115, with modern work by Lewis, Holcombe and Graff. Dates are traditional
# lunar-calendar years. Murong De died in the eleventh month (Western calendar, November) of
# 405; his nephew Murong Chao reached Guanggu earlier that year. The musicians' bargain is
# dated 407-408 and the raid on Jin the new year of 409, so the chapter on it opens in 408 on the
# two-year grid. Liu Yu's army crossed the border in 409 and Guanggu fell in the spring of 410
# (the Jin chapter jin_southern_yan opens in 410 too); Murong Chao's death is entered as 411 in the ruler line so that he is still the ruler when the chapter of 410 opens. benchmark_provinces counts the
# provinces of this map the real kingdom held (Qingzhou only).
chapters:
  - id: sy_guanggu
    scenario: three_kingdoms
    civ: southern_yan
    year: 400
    title: "An Emperor at Guanggu"
    place: "Guanggu, in Qingzhou"
    speaker: steward
    speaker_name: "Your Yan counsellors"
    speaker_title: "The court in exile"
    benchmark_provinces: 1
    story: >-
      You are Murong De, sixty-four years old, the youngest brother of Murong Chui, who built
      the great Later Yan. The Tuoba of Wei took the plain of Hebei from your nephew Murong
      Bao, and Bao fled north to Longcheng and was murdered there. You held Ye as long as you
      could, and then took your followers over the Yellow River, to Huatai in 398 and to
      Guanggu in 399, where you have made a kingdom out of the rich peninsula of Shandong
      that the Jin could not defend.


      Your nephew Murong Sheng, in Longcheng, calls himself emperor of Yan. Your counsellors say that your people need a real throne. You are a prince in a
      province; they would have you be a Son of Heaven in a capital.
    choices:
      - label: "Take the title of emperor at Guanggu"
        historical: true
        legitimacy_bp: 1200
        unrest_bp: 300
        outcome: >-
          You take the imperial title in 400 and rule as Murong Beide, the Jin shu says. Your
          Yan, called the Southern Yan to tell it from the Yan in Longcheng, has one province
          and a good deal of pride. Jin on the south and the Tuoba on the north are both too
          busy, for the moment, to trouble you.
      - label: "Stay a prince, and acknowledge Murong Sheng"
        legitimacy_bp: 200
        unrest_bp: 200
        outcome: >-
          Sheng thanks you from his capital, a long way off, and can do nothing to help you.
          Your counsellors are not pleased.
      - label: "Ask Jin to confirm you as Qingzhou's governor"
        legitimacy_bp: -300
        wealth_bp: 400
        outcome: >-
          Your envoys go south with gifts. Jiankang, glad to have the border quiet, may or may
          not answer; the roads reopen for a while and the merchants of Guanggu do well out of
          them, but your own people wonder what has become of the house of Yan.
    history: >-
      Murong De moved from Huatai to Guanggu in 399 and took the imperial title of Yan there
      in 400. The later chroniclers call his state Southern Yan.
    sources: ["Jin shu 127 (Murong De)", "Wei shu 95", "Zizhi tongjian 110-111"]

  - id: sy_heir
    scenario: three_kingdoms
    civ: southern_yan
    year: 404
    title: "A Nephew from Chang'an"
    place: "Guanggu, the palace"
    speaker: steward
    speaker_name: "Your Yan counsellors"
    speaker_title: "At court"
    benchmark_provinces: 1
    story: >-
      You are Murong De, nearly seventy, and ill. You have been emperor for four years, and
      you have no son. There is no heir. The court is full of your relations, and each of them
      thinks that he should have the throne.


      From Chang'an, now, comes a rumour that your nephew Murong Chao, the son of your brother
      Murong Na, is alive there, living among the poor as a beggar and playing the madman so
      that Yao Xing, the Qin king, will not look at him too closely. His mother and his wife
      are kept by the Qin as hostages. He is eighteen or nineteen years old.
    choices:
      - label: "Send for Murong Chao and make him your heir"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 300
        outcome: >-
          Murong Chao reaches Guanggu in 405, and you make him heir almost at once. You die late in that year and he takes the throne. He turns out to be vain,
          and he is rash. He sets aside the old ministers you left him, such as Murong Zhong,
          and favours his own friends, above all a certain Gongsun Wulou. The government
          falls into disorder.
      - label: "Let your council choose among the princes"
        legitimacy_bp: -300
        unrest_bp: 600
        outcome: >-
          The princes quarrel. Each of them is certain of the throne, and the council cannot
          agree.
      - label: "Name Murong Zhong, your old minister, as heir"
        legitimacy_bp: 300
        unrest_bp: 400
        outcome: >-
          Murong Zhong is a seasoned man, and the older ministers are glad of him. The younger
          princes, who thought the throne should pass down the family line, are not, and the
          court is divided before you are cold.
    history: >-
      Murong De had no surviving sons. He took his nephew Murong Chao, who had been living in
      obscurity in Later Qin, as his heir in 405; De died that year and Chao succeeded him,
      governing badly.
    sources: ["Jin shu 128 (Murong Chao)", "Zizhi tongjian 113"]

  - id: sy_musicians
    scenario: three_kingdoms
    civ: southern_yan
    year: 406
    title: "A Price for a Mother"
    place: "Guanggu"
    speaker: later_qin
    speaker_name: "Yao Xing's envoy"
    speaker_title: "From Chang'an"
    needs_alive: [later_qin]
    benchmark_provinces: 1
    story: >-
      You are Murong Chao, the emperor of Southern Yan, twenty-one years old. Your mother,
      Lady Duan, and your wife are still in Chang'an in the hands of Yao Xing, and he will give them back only for a price.


      The price is that you call yourself his vassal and send to Chang'an your court musicians, who once belonged to the court of the old Former Qin. Without them your court will have no music, which is a thing an emperor needs. Your ministers are
      divided. A mother is a mother, and an emperor is an emperor.
    choices:
      - label: "Become Qin's vassal and send the musicians"
        historical: true
        legitimacy_bp: -800
        wealth_bp: -300
        outcome: >-
          Yao Xing sends your mother and your wife to Guanggu in 407. You give a hundred and
          twenty musicians to Chang'an. In 408 you honour your mother as empress dowager. The
          hall is quiet at the next New Year's feast: there is no music, and the emperor of
          Yan has to look at it.
      - label: "Refuse the price and keep your dignity"
        legitimacy_bp: 500
        unrest_bp: 300
        outcome: >-
          Your mother stays in Chang'an. You will not speak of it to your court.
      - label: "Offer gold and silk for your mother and wife"
        wealth_bp: -800
        legitimacy_bp: -200
        outcome: >-
          Your envoys carry silk and gold to Chang'an. Yao Xing counts it, and says that
          the price was never gold. Your mother and your wife stay where they are, and your
          treasury is lighter.
    history: >-
      Murong Chao agreed to become Yao Xing's vassal and to give up his court musicians;
      Yao Xing returned his mother and wife in 407, and Chao honoured his mother as empress
      dowager in 408.
    diverged: >-
      Later Qin is gone.
    sources: ["Jin shu 128 (Murong Chao)", "Zizhi tongjian 114"]

  - id: sy_raid
    scenario: three_kingdoms
    civ: southern_yan
    year: 408
    title: "The Silent Hall"
    place: "Guanggu, at the New Year"
    speaker: steward
    speaker_name: "One of your favourites"
    speaker_title: "Of your inner circle"
    benchmark_provinces: 1
    story: >-
      You are Murong Chao. The hall is full for the New Year feast of 409, and the players
      who should fill it are in Chang'an. You are ashamed of the silence, and you say so in
      front of the court. One of your favourites says: Jin, over the Huai, is full of
      people who can play and sing. Let us take some.


      Others at the court say that Jin has the general Liu Yu, who defeated the sea-rebels of
      Sun En, and that his answer will not be a polite one.
    choices:
      - label: "Raid across the Huai for singers and players"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          Your horsemen cross the Huai in 409 and carry off thousands of men and women from the
          Jin border towns. You pick out the best of the young, and have them taught to play
          and sing. You have your music. And in Jiankang, the Jin court sends Liu Yu north.
        deeds: {grudges: {eastern_jin: 1000}}
      - label: "Send gifts to Jin for singers and players"
        legitimacy_bp: 300
        wealth_bp: -400
        outcome: >-
          Jin does not send musicians. It does not send an army, either.
      - label: "Train players from your own household"
        wealth_bp: -400
        knowledge_bp: 400
        outcome: >-
          Boys and girls of the palace staff are set to learn the old songs from the few
          musicians who stayed behind. It takes years, and the hall stays quiet for a long while,
          but the music that comes in the end is your own.
    history: >-
      In the New Year of 409 Murong Chao raided the Jin border to carry off people to be
      trained as musicians, and the Jin court sent Liu Yu against him.
    diverged: >-
      The Jin are gone.
    sources: ["Jin shu 128 (Murong Chao)", "Song shu 1", "Zizhi tongjian 115"]

  - id: sy_guanggu_falls
    scenario: three_kingdoms
    civ: southern_yan
    year: 410
    title: "The Fall of Guanggu"
    place: "Guanggu, under siege"
    speaker: general
    speaker_name: "Your last commanders"
    speaker_title: "On the wall"
    needs_alive: [eastern_jin]
    benchmark_provinces: 1
    story: >-
      You are Murong Chao. When Liu Yu's army crossed the border, your best generals begged
      you to hold the mountain pass of Daxian and strip the fields before the Jin could eat the crops. You said that you had the best cavalry in the world and would fight on the
      plain. Liu Yu's army marched through the pass unopposed, beat your cavalry at Linqu,
      and has surrounded Guanggu for months.


      You have asked Qin for help, and Qin, hard pressed by Helian Bobo, could not give it. The
      food is going. Your mother and your wife are with you in the city.
    choices:
      - label: "Hold the walls and wait for the winter"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Guanggu falls in the spring of 410. One account says that you broke out of the city with a few horsemen, and were caught. Liu Yu sends you to Jiankang and has you
          put to death, and he kills your nobles and officials; the histories say thousands. Before you go, you
          ask a Jin man, Liu Jingxuan, to look after your mother and your wife. Southern Yan is
          over, after ten years.
        deeds: {ruler_falls: "is captured at Guanggu and executed in Jiankang"}
      - label: "Open the gates and beg for mercy"
        legitimacy_bp: -2000
        unrest_bp: 500
        outcome: >-
          Liu Yu takes the surrender and, he says, will think about mercy. You are left to
          imagine what he thinks.
      - label: "Break out by night with your horsemen"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          You ride out of a gate in the dark with your best horse, leaving the walls to your
          captains. The Jin patrols are thick on the plain, and the survivors of the garrison
          wonder, to the end, why they were not told.
        deeds: {men: 600}
    history: >-
      Liu Yu defeated the Southern Yan army at Linqu in 409, besieged Guanggu, and took it in
      410; Murong Chao was executed in Jiankang.
    diverged: >-
      The Jin are gone.
    sources: ["Jin shu 128 (Murong Chao)", "Song shu 1", "Zizhi tongjian 115"]
