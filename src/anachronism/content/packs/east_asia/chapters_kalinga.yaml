schema_version: 1
# Chronicle mode (D-120, D-XXX): Kalinga, on the Bay of Bengal, from the fall of the Nandas to
# Ashoka's conquest, 321-261 BC. The chronicle stops there on purpose: Kalinga's own story
# stops there. Each chapter opens in its year; one choice is what history chose (historical:
# true). Sources are thin and no king of Kalinga is known by name for these years, so you are
# "the king" throughout. Facts follow Ashoka's Rock Edict XIII and the separate Kalinga edicts
# (Dhauli and Jaugada); Pliny's Natural History 6, which reports Megasthenes's figures for the
# Calingae (60,000 foot, 1,000 horse, 700 elephants); the Arthashastra, which praises the
# elephants of Kalinga (its date is itself disputed, from the Mauryan age to the early
# centuries AD); the Buddhist chronicles' tale of Ashoka's accession; and the Hathigumpha
# inscription of King Kharavela, cut at Udayagiri near Bhubaneswar, which says a Nanda king
# once carried off a sacred Jina image from Kalinga. Kharavela's own date is disputed (from
# the early 2nd century BC to the 1st), and the inscription is hard to read and boastful, so it
# is used only as a witness for the Nanda story. Modern work by Thapar, Sircar, Salomon and
# Olivelle. Dates before 261 are approximate by a few years. benchmark_provinces is 1: this map
# has one province for Kalinga.
chapters:
  - id: kal_jina
    scenario: maurya
    civ: kalinga
    year: -318
    title: "The Image the Nanda Took"
    place: "Your capital, Kalinga"
    speaker: diviner
    speaker_name: "A Jain teacher"
    speaker_title: "Keeper of the Kalinga shrines"
    benchmark_provinces: 1
    story: >-
      You are the king of Kalinga, a land of rice, rivers and harbours between the Mahanadi
      and the Godavari. Your people follow the Jain teaching of Mahavira, and your harbours
      send ships east across the Bay of Bengal.


      The news from the Ganges is that the Nanda king, the richest in India, who made Kalinga
      pay him, is falling to a young man from the Punjab and his clever teacher. A later king of
      Kalinga will say, in an inscription, that a Nanda carried off the sacred image of the
      Jina from your land. Your priests ask if this is the time to go to Pataliputra and bring
      it home.
    choices:
      - label: "Keep to your country and let the image go"
        historical: true
        unrest_bp: 300
        outcome: >-
          You stay at home, and Kalinga stays free of the new rulers of the Ganges, whoever they
          turn out to be. The image does not come back. According to that later inscription
          (if it is read right), it is still in Magadha a century and a half on, until a king of
          Kalinga brings it home.
      - label: "Send an army to Pataliputra for the Jina"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your army marches north into a war between two sides that both want to rule the Ganges,
          and neither wants a third. Whatever you win, it is not the image.
        deeds: {men: 6000, grudges: {nanda: 1500, maurya: 1000}}
      - label: "Send envoys to the young man from the Punjab"
        legitimacy_bp: 200
        outcome: >-
          Your envoys go to Chandragupta with gifts. He thanks you and promises nothing.
        deeds: {peace_with: [nanda]}
    history: >-
      Kalinga was probably under Nanda power before the Mauryas, since the later Hathigumpha
      inscription remembers a Nanda king taking the Jina image and cutting a canal there. By the
      time of Megasthenes (c. 300 BC) it is an independent kingdom again.
    sources: ["Hathigumpha inscription, lines 6 and 12 (disputed readings)", "Puranas on Mahapadma Nanda", "Thapar, Asoka and the Decline of the Mauryas (1961)"]

  - id: kal_elephants
    scenario: maurya
    civ: kalinga
    year: -300
    title: "Seven Hundred Elephants"
    place: "The elephant stables"
    speaker: general
    speaker_name: "Your master of elephants"
    speaker_title: "Keeper of the royal herd"
    benchmark_provinces: 1
    story: >-
      You are the king of Kalinga. A Greek ambassador, Megasthenes, who is living in Pataliputra
      for Seleucus, asks the Indians about the lands around him, and he has been told of
      yours. The Greeks will write that the Calingae live nearest the sea, and that their king
      keeps sixty thousand foot, a thousand horse and seven hundred elephants always ready for
      war.


      The treatise of Kautilya, who is Chandragupta's minister, ranks the elephants of Kalinga
      among the best in India, and an elephant is the one thing the Mauryan armies cannot have
      enough of. Your master of elephants says a messenger from Pataliputra has come
      to ask a price.
    choices:
      - label: "Keep your elephants and your independence"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          The herd stays in Kalinga. The Mauryan empire grows all round you for the next forty
          years while you stay outside it, with your harbours and your elephants.
        deeds: {martial_bp: 500}
      - label: "Sell elephants to Pataliputra for gold"
        wealth_bp: 1800
        legitimacy_bp: -300
        outcome: >-
          The treasury is richer; the herd is smaller, and your army a little weaker for it.
          Pataliputra pays well, and now knows what you have to lose.
        deeds: {martial_bp: -300}
      - label: "Send gifts to the Mauryan court and ask to be left alone"
        legitimacy_bp: 200
        wealth_bp: -800
        unrest_bp: -300
        outcome: >-
          The gifts are accepted. Nothing is written, nothing is promised.
        deeds: {peace_with: [maurya]}
    history: >-
      Pliny (from Megasthenes) describes Kalinga as an independent kingdom with a large army and
      many elephants. Nothing shows that Chandragupta or Bindusara conquered it: Ashoka's own
      Rock Edict XIII says that he did, in the eighth year after his consecration.
    sources: ["Pliny, Natural History 6 (from Megasthenes)", "Arthashastra 2.2", "Rock Edict XIII"]

  - id: kal_succession
    scenario: maurya
    civ: kalinga
    year: -270
    title: "A Throne in Dispute"
    place: "The northern frontier"
    speaker: general
    speaker_name: "Your frontier commander"
    speaker_title: "On the road to Magadha"
    benchmark_provinces: 1
    story: >-
      You are the king of Kalinga. Bindusara is dead, and his sons are at war with one another
      over the throne at Pataliputra. The Buddhist chronicles will say that Ashoka killed
      ninety-nine brothers, which is a monk's number, not a count; Ashoka's own edicts later
      mention brothers' households that were still alive. What is certain is that it will
      take him four years from taking the throne to his consecration.


      Your commander says Magadha has never been so busy with itself. Your priests ask you to
      think of the Jina image, and of a king who has been waiting forty years for a neighbour
      to be weak.
    choices:
      - label: "Watch the frontier and keep your army ready"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          No source says Kalinga moved. When Ashoka came for it, in about 261, it was an
          independent kingdom with a well-trained army, and he did not find it easy.
        deeds: {martial_bp: 500}
      - label: "Strike north while the Mauryas quarrel"
        unrest_bp: 800
        legitimacy_bp: -300
        outcome: >-
          Your army crosses the frontier into a rich land with no king worth the name. The brothers stop
          quarrelling and look at you instead.
        deeds: {men: 8000, grudges: {maurya: 2500}}
      - label: "Offer one of the princes help against the others"
        legitimacy_bp: 400
        wealth_bp: -600
        outcome: >-
          Your gold goes to one prince, and he writes a letter of thanks. He may win. If he does,
          he will remember who his friends were, and who his neighbours. The prince thanks you
          generously.
    history: >-
      Bindusara died about 273 BC and Ashoka was consecrated about 269/268 BC, which has led to
      the belief that there was a fight for the throne. The ninety-nine murdered brothers are
      a later Buddhist story. Kalinga's part, if it had one, is unrecorded.
    sources: ["Mahavamsa 5", "Dipavamsa 6", "Rock Edict V", "Thapar (1961)"]

  - id: kal_conquest
    scenario: maurya
    civ: kalinga
    year: -261
    title: "The Army of Ashoka"
    place: "Kalinga, near the sea"
    speaker: general
    speaker_name: "Your commander"
    speaker_title: "Leader of your army"
    benchmark_provinces: 1
    story: >-
      You are the king of Kalinga. Ashoka, eight years consecrated, has crossed your frontier
      with the army of the Magadhan empire, which is larger than any Kalinga has seen. Your
      people are Jains and Buddhists, brahmins and householders, and the war is about to be fought
      in their villages.


      Your commander tells you that you can fight, and perhaps hold the hills. Your priests say
      that there is another way: to open the gates and pay.
    choices:
      - label: "Meet Ashoka's army in the field"
        historical: true
        unrest_bp: 1500
        legitimacy_bp: -1500
        outcome: >-
          Kalinga fights, and Kalinga loses. Ashoka himself will say it on stone: a hundred and
          fifty thousand people were carried away, a hundred thousand were killed, and many times
          that number died. Of your own fate nothing is known. The Daya river running red is a
          later tale, from Orissa; the edict does not say it.
        deeds: {ruler_falls: "is lost in the Mauryan conquest of Kalinga", grudges: {maurya: 3000}}
      - label: "Open the gates and pay tribute"
        legitimacy_bp: -2000
        wealth_bp: -1500
        outcome: >-
          Ashoka accepts your submission. Your people live, and Kalinga becomes a province, as it
          would have been anyway.
        deeds: {ruler_falls: "submits to Ashoka and is set aside", grudges: {maurya: 500}}
      - label: "Offer terms and keep your throne"
        legitimacy_bp: -500
        wealth_bp: -800
        outcome: >-
          Your envoys ride out under green branches with the offer. Ashoka's army does not halt,
          and your commander uses the days it buys to call out more men.
        deeds: {men: 5000}
    history: >-
      Ashoka conquered Kalinga about 261 BC. His Rock Edict XIII says the suffering of the war
      moved him to regret, and the separate edicts cut in the Kalingan towns of Tosali (Dhauli) and
      Samapa (Jaugada) tell his officers there that all men are his children. Kalinga was ruled
      from then on as a Mauryan province under a prince. It stood on its own again after the
      empire's fall, perhaps under Kharavela (the date is disputed).
    sources: ["Rock Edict XIII", "Separate Kalinga Edicts I-II (Dhauli, Jaugada)", "Thapar (1961)", "Olivelle, Ashoka (2023)"]
