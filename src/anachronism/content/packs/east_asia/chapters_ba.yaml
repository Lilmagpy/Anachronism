schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Ba, the Yangtze gorges and the salt country,
# about 320-316 BC. Each chapter opens in its year; one choice is what history chose
# (historical: true). Ba left no written history; facts follow the Shiji (Zhang Yi, ch. 70;
# Qin annals, ch. 5), the Zhanguo ce (Qin 1), the Hou Han shu (ch. 86, the Southwestern
# Man) for Ba under Qin, and the late Huayang guo zhi (4th century AD), whose names and
# stories are marked as late wherever used; modern work by Sage (Ancient Sichuan, 1992). The
# King of Ba's name is not reliably known. The Qin conquest is firm for 316 BC, and
# the Huayang guo zhi says the King of Ba was taken prisoner; the dates 320 for the Ju
# refugee, 318 for the appeal and 314 for Zhang Yi's fort at Jiangzhou are approximate. benchmark_provinces counts
# the provinces of this map the real Ba held at that date.
chapters:
  - id: ba_refugee
    scenario: warring_states
    civ: ba
    year: -320
    title: "The Marquis of Ju Asks for Shelter"
    place: "Jiangzhou, on the river"
    speaker: general
    speaker_name: "A captain of the river forts"
    speaker_title: "Of the Ba army"
    benchmark_provinces: 1
    story: >-
      You are the King of Ba, and your people are the old warriors of the river valleys,
      who work the salt springs, fight with bronze, and honour the tiger, and have been
      enemies of Shu longer than anyone remembers. Now a lord of the Shu house has come to
      your gates: the Marquis of Ju, whose lands lie along the Han river to the north, has
      been driven out by his own brother the King of Shu, or so the Huayang guo zhi tells it.


      Your captain says that the Shu army is not far behind him. If you shelter the Marquis,
      Shu will say you have taken a side in their family quarrel, and your own border will
      burn. If you give him up, you cannot be sure that anyone will ever shelter a Ba
      lord in the same trouble.
    choices:
      - label: "Shelter the Marquis, and fight Shu"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          Your river forts are manned and your boats are drawn up. The King of Shu is
          furious, and the war between the two kingdoms is open.
        deeds: {martial_bp: 200, men: 6000, grudges: {shu: 1500}}
      - label: "Turn the Marquis away"
        legitimacy_bp: -300
        outcome: >-
          The Marquis rides on, and the quarrel goes on without you. The King of Shu
          is pleased for the moment. He will not be so pleased when your turn comes.
    history: >-
      The Shiji (Zhang Yi, ch. 70) says that Shu and Ba attacked each other. The cause, in
      the later Huayang guo zhi, was Shu's attack on its own Marquis of Ju, who fled to Ba;
      the date is approximate.
    sources: ["Shiji 70 (Zhang Yi)", "Huayang guo zhi 1 (Ba zhi) and 3 (Shu zhi), late tradition"]

  - id: ba_help
    scenario: warring_states
    civ: ba
    year: -318
    title: "Help from the Mountains"
    place: "Jiangzhou"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    benchmark_provinces: 1
    story: >-
      The war with Shu has dragged on. Neither side can win by itself: your
      boats hold the river and Shu's men hold the passes. The Marquis of Ju sits in your
      hall, and every month he says the same thing: that the King of Shu cannot be beaten
      without a third power.


      Your minister names two. To the east is Chu, a great kingdom with its own claims in
      your valleys; to the north is Qin, whose lords have not long had a taste for
      southern land. Either would come, and either would stay.
    choices:
      - label: "Send to Qin for help against Shu"
        historical: true
        legitimacy_bp: 200
        outcome: >-
          Your envoys go north. The Shiji says that Shu and Ba each begged Qin for help, and
          that the matter was argued out before the lord of Qin. Qin sends an army, and it is
          Qin that you must now live beside.
        deeds: {men: 4000}
      - label: "Send to Chu"
        legitimacy_bp: -200
        outcome: >-
          Chu is slow to answer, and when it does it asks for more than you can give.
      - label: "Make peace with Shu, and send the Marquis away"
        unrest_bp: -300
        legitimacy_bp: -400
        outcome: >-
          The King of Shu is surprised to be offered peace, and he accepts. Your border is
          quiet, and the Marquis of Ju leaves with your leave.
    history: >-
      The Shiji says that in the conflict between Shu and Ba, both sent to Qin for help
      (Zhang Yi, ch. 70). The debate that followed is dated 316 BC; the appeal itself must
      be a little earlier.
    sources: ["Shiji 70 (Zhang Yi)", "Zhanguo ce, Qin 1"]

  - id: ba_qin
    scenario: warring_states
    civ: ba
    year: -316
    title: "Qin Comes South"
    place: "Jiangzhou"
    speaker: general
    speaker_name: "A captain of the northern road"
    speaker_title: "Of the Ba army"
    benchmark_provinces: 1
    story: >-
      Qin has answered. At the court of Xianyang Zhang Yi argued for attacking Han, and Sima
      Cuo for attacking Shu, and Sima Cuo's side won. Now the army has come over the
      mountains. Shu's king has been killed in the autumn, and Shu is breaking up. This was
      the help you asked for, and the army that came with it is not leaving.


      Your captain brings word that the Qin general is already on the Great River, in
      Ba country. The Qin commanders, he says, say little of what they want from you, but
      they keep a list of your towns and your salt springs, and they count your boats.
    choices:
      - label: "Hold Jiangzhou and fight"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          Your river fort holds for a time. Then the Qin armies, with the Shu army broken, come
          down the river from both sides. The King of Ba is taken prisoner, as the Huayang guo
          zhi says, and the kingdom of Ba passes into Qin hands.
        deeds: {ruler_falls: "is taken prisoner by Qin"}
      - label: "Open the gates to Qin and keep your lords"
        legitimacy_bp: -800
        outcome: >-
          The Qin general accepts, as he accepted every town that did not shut its gates. Your
          chiefs are left their lands, for a price.
        deeds: {peace_with: [qin]}
    history: >-
      Qin under Sima Cuo and Zhang Yi conquered Ba with Shu in 316 BC, and the Ba king was
      taken. Later the Hou Han shu (ch. 86) says Qin left the Ba chiefs their rank, let them marry
      Qin women, and fixed their yearly tax, a yearly payment by the chiefs of 2,016 coins.
      Zhang Yi built a fort at Jiangzhou, about 314. The Ba warriors later fought for the
      first Han emperor in the war that followed Qin's fall.
    sources: ["Shiji 5, 70", "Zhanguo ce, Qin 1", "Hou Han shu 86 (Southwestern Man)", "Huayang guo zhi 1 (Ba zhi), late tradition"]
