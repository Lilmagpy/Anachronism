schema_version: 1
# Chronicle mode (D-120, D-XXX): the small state of Wey (Wey, not Wei), the last of the
# old states, about 346-209 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow the Shiji (ch. 37, the house of Wey; ch. 6 and 15,
# Qin; ch. 68, Shang Yang). The Shiji's years for Wey's lords do not agree with one another
# and later reckonings differ by several years, so every date here is approximate: the
# lowering of the title to marquis (346, the 16th year of Marquis Cheng), the second lowering
# to lord (about 320, the 5th year of Lord Si), the killing of Lord Huai at Wei's court
# (about 252), the move to Yewang (242, when Qin set up Dong commandery), and the end of the
# house (209, the first year of the Second Emperor). Lords: Cheng to about 332, Ping to about
# 325, Si to about 283, Huai to about 252, Yuan to about 230, Jue to 209. The real Wey held
# one province on this map throughout. benchmark_provinces counts it.
chapters:
  - id: wey_marquis
    scenario: warring_states
    civ: wey
    year: -346
    title: "A Lesser Title"
    place: "Puyang"
    speaker: steward
    speaker_name: "Your master of ceremonies"
    speaker_title: "Of the ancestral temple"
    benchmark_provinces: 1
    story: >-
      You are Lord Cheng of Wey (the small river state of Wey, not the great Wei beside it
      whose name is spelled almost alike). Your first ancestor was Kang Shu, a brother of the
      founder of Zhou, and your house has ruled by the Yellow River for seven hundred years.
      Your lords have been dukes. In recent years you have watched what the great states do to
      small ones: Wei, which lies on three sides of you, has made your land a guest in its own
      house.


      Fifteen years ago a man of your own ruling clan, Gongsun Yang, left Wey and went west to
      serve Qin. He is now its chief minister, and is known there by the name of Lord Shang. He
      is a reminder that Wey's sons can do much when they leave it. Now the ministers say
      that Wey's title must be lowered from duke to marquis. The Shiji does not say who
      required it, only that it was done, and that Wei is the power in these lands.
    choices:
      - label: "Accept the title of marquis"
        historical: true
        legitimacy_bp: -800
        influence: {nobility: -300}
        outcome: >-
          You are Marquis of Wey. The ancestral temple keeps its rites, the walls of Puyang
          keep their garrison, and nothing changes except the name on the bronzes. Within a
          generation the title will fall again.
        deeds: {martial_bp: 1500, men: 3000}
      - label: "Send to the Zhou king to protest"
        legitimacy_bp: -500
        wealth_bp: -300
        influence: {nobility: 300}
        outcome: >-
          Your envoy goes to Luoyang with gifts, where the Son of Heaven expresses his
          sympathy. Nobody in the Zhou court has an army to enforce his sympathy, and nobody
          at Daliang cares, but your nobles are pleased that Wey's rank was spoken for.
        deeds: {grudges: {wei: 800}}
      - label: "Strengthen Puyang's walls instead"
        legitimacy_bp: -700
        unrest_bp: 300
        wealth_bp: -400
        outcome: >-
          You say nothing about the title and set the farmers of the district to rebuild the
          walls and drill with spears. Wei notices the new brick and the new levies, and
          your people notice the cost.
        deeds: {martial_bp: 1200, men: 2500}
    history: >-
      The Shiji says that in the sixteenth year of Marquis Cheng (346 BC) Wey's title was
      lowered to marquis. Gongsun Yang, a scion of Wey's ruling house, had gone to Qin in 361.
    sources: ["Shiji 37 (Wey Kang Shu)", "Shiji 68 (Shang Yang)"]

  - id: wey_lord
    scenario: warring_states
    civ: wey
    year: -320
    title: "Lord of One City"
    place: "Puyang"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    benchmark_provinces: 1
    story: >-
      You are Lord Si of Wey. The great states have made themselves kings, and Wei's king
      dwells at Daliang, a few days away. Wey has fallen again, from marquis to lord, and of
      all the lands your ancestors held you have only Puyang, the walled city on the river, and
      its fields.


      Your minister says that a lord can still be a ruler, and that a ruler of one city who
      keeps his head can outlast the king of ten. Others on the council want friends abroad,
      or more spears at home. There is a Wey saying that people go to Puyang for the river,
      not for the lord.
    choices:
      - label: "Accept the lower title and keep Puyang"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          The Shiji says Wey was reduced to the title of lord, holding Puyang alone. You keep
          the rites, the walls and the fields, and give no one cause to take them. In the
          years that follow you reign for forty-odd years, and you make quiet understandings with
          the neighbours who might otherwise swallow a one-city state. Wey remains.
        deeds: {ally_with: [zhao, song], martial_bp: 3000, men: 6000}
      - label: "Seek protection from Wei's enemies"
        legitimacy_bp: 300
        unrest_bp: 300
        wealth_bp: -400
        outcome: >-
          You send gifts and a messenger to the far-off courts that hate Wei. They are polite
          and they promise a truce on Qi's side; they are far away; and Wei notes who wrote.
        deeds: {peace_with: [qi], men: 2000, grudges: {wei: 1500}}
      - label: "Raise a militia to hold Puyang"
        legitimacy_bp: -200
        unrest_bp: 400
        outcome: >-
          You call up every able farmer in the district, and the walls are manned all summer.
          The harvest is thin and the grumbling is loud, but no one in the neighbourhood
          thinks Puyang an easy prize.
        deeds: {martial_bp: 2000, men: 4000}
    history: >-
      About 320 BC Wey's title was lowered again, to lord (jun), and it held only Puyang
      (Shiji 37).
    sources: ["Shiji 37 (Wey Kang Shu)"]

  - id: wey_huai
    scenario: warring_states
    civ: wey
    year: -252
    title: "The Summons to Daliang"
    place: "Puyang"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    needs_alive: [wei]
    benchmark_provinces: 1
    story: >-
      You are Lord Huai of Wey, thirty years on the throne. Your father's long reign is the
      pattern you keep: no wars, no plots, no expense. The Wey rites are performed, your
      fields are sown and your treasury is small.


      A message comes from Wei's king at Daliang. You are summoned to court. It is
      worded as an honour. Your minister says that Wei keeps Wey as a gate keeps its hinge,
      and that nobody refuses the summons of the power on three sides. But he also says
      that a lord who stays away is remembered in Daliang for a long time.
    choices:
      - label: "Go to Wei's court"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          You go, and at Daliang the Wei king has you seized and put to death. Your younger
          brother is set up in your place as Lord Yuan. He is a son-in-law of the royal house
          of Wei, so Wey is bound more tightly than ever. No reason is given in the Shiji.
        deeds: {ruler_falls: "is seized and killed at Wei's court"}
      - label: "Send your chief minister in your place"
        legitimacy_bp: 100
        outcome: >-
          Your chief minister goes with gifts. Wei receives him, hears out his excuses, and
          lets him go home. It remembers that Wey's lord sent his servant.
        deeds: {grudges: {wei: 600}}
      - label: "Plead illness and send gifts"
        wealth_bp: -300
        legitimacy_bp: -200
        outcome: >-
          Wei's envoy leaves with a chest of silk and a doubtful look. The king accepts the
          gifts, and the excuse, and does not forget either.
    history: >-
      The Shiji says that Lord Huai of Wey was summoned to Wei's court and killed there, about
      252 BC, and that Wei set up his brother as Lord Yuan, who was married into the Wei royal
      family (Shiji 37).
    diverged: >-
      Wei is gone; nobody in the east summons the lord of Wey any more.
    sources: ["Shiji 37 (Wey Kang Shu)"]

  - id: wey_yewang
    scenario: warring_states
    civ: wey
    year: -242
    title: "The County of Yewang"
    place: "Puyang"
    speaker: general
    speaker_name: "A Qin officer"
    speaker_title: "Of the army of the east"
    benchmark_provinces: 1
    story: >-
      You are Lord Yuan of Wey. The great war between Qin and its neighbours has come to your
      gate. Qin's armies have taken thirty cities from Wei, including Puyang, and Qin is making
      the whole stretch of country east of the Yellow River into a new command, called Dong
      commandery. The walls of your capital are now the walls of a Qin town.


      A Qin officer brings you a message. Wey is not to be abolished, because the temple of
      the Wey lords is of the oldest kind and no one is willing to disturb it. Instead you
      are to move, with your household and your rites, to Yewang, a county town on the Yellow
      River's northern shore. Puyang will be absorbed.
    choices:
      - label: "Move your household to Yewang"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Your household, your treasury and your ancestral tablets go north in wagons. In
          Yewang you reign over a county, and the Qin magistrate reigns over you. Wey still
          has its lord, its temple and its sacrifices. By the standards of this age that is
          not nothing: the kings are falling one by one.
      - label: "Refuse to leave Puyang"
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          You say that Wey was founded at the Yellow River and that the lord will remain on
          it. The Qin officer says that it will be made easier for you to leave.
        deeds: {grudges: {qin: 1500}}
      - label: "Offer Qin tribute to stay in Puyang"
        legitimacy_bp: -700
        wealth_bp: -500
        unrest_bp: 300
        outcome: >-
          You send silk and grain to the Qin officer and ask that the lord and the temple stay
          where they are. He takes the gifts, thanks you, and repeats the order.
    history: >-
      In 242 BC Qin took Wei's lands east of the Yellow River and set up Dong commandery; it
      absorbed Puyang and moved the lord of Wey to Yewang (Shiji 37 and 6).
    sources: ["Shiji 37 (Wey Kang Shu)", "Shiji 6 (First Emperor)"]

  - id: wey_survives
    scenario: warring_states
    civ: wey
    year: -225
    title: "The One Left Over"
    place: "Yewang"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    benchmark_provinces: 1
    story: >-
      You are Lord Jue of Wey, a young man who has inherited a county and a temple. In five
      years Qin has destroyed Han, taken Zhao's capital, and now floods the walls of Wei's
      Daliang with the river. Chu and Yan and Qi stand next in line. The last of the Warring
      States are going down one after another, and each of them in its day was larger than
      Wey.


      Your minister says Qin has not asked for your submission. Nobody has told Wey to arm,
      to ally, or to resign. Some at court say to keep quiet while nothing is demanded;
      others say that Wey should speak first, before Qin remembers it.
    choices:
      - label: "Say nothing and stay in Yewang"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You wait, and nothing is asked of you. The Shiji says that Qin united the world in
          221 BC, and that the first emperor took the title of Shihuangdi, and that the
          conquest of the east was complete. Wey is not on any list. The Shiji does not say
          why, only that the lord of Wey remained in Yewang for another twelve years.
      - label: "Send a gift to Qin's court"
        legitimacy_bp: 700
        outcome: >-
          You send tribute with a respectful letter. It is received without comment, and you
          are told nothing. You wonder whether you have helped yourself or only reminded Qin
          that you exist.
      - label: "Send a kinsman to serve at Qin's court"
        legitimacy_bp: 300
        wealth_bp: -200
        outcome: >-
          A young man of the Wey house goes west with a letter, in the footsteps of Gongsun
          Yang. He is given a small post and a place to sleep, and he is told nothing about
          Wey.
    history: >-
      Qin destroyed Han (230), Zhao (228), Wei (225), Chu (223), Yan (222) and Qi (221). The
      lord of Wey was left in Yewang and outlived all of them, until 209 BC (Shiji 37).
    sources: ["Shiji 37 (Wey Kang Shu)", "Shiji 6 (First Emperor)"]

  - id: wey_last
    scenario: warring_states
    civ: wey
    year: -209
    title: "The Last Lord of Wey"
    place: "Yewang"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "Of the council"
    benchmark_provinces: 1
    story: >-
      You are Lord Jue of Wey. The First Emperor is dead, and his younger son, who is called
      the Second Emperor, sits at Xianyang. In the east men are beginning to rise against him.
      You are still, as you have been for twenty years, the lord of a county town on the
      Yellow River.


      An order arrives from Xianyang. The rule of the Qin empire is that there shall be
      no more lords with their own names and temples. Your minister says that every answer
      you can give will cost you something.
    choices:
      - label: "Submit to the Emperor's order"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The Second Emperor removes you from your rank and makes you a commoner. The Shiji
          says that the sacrifices of Wey ended. Wey had been founded in the first generation
          of the Zhou dynasty, by Kang Shu, and outlasted every other state of the Zhou world
          by twelve years. Within three years, Qin itself is gone.
        deeds: {ruler_falls: "is made a commoner by the Second Emperor"}
      - label: "Join the rebels in the east"
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          You send word east to the men who are rising, but Yewang is a county town with
          a Qin garrison, and the letter goes into the river.
      - label: "Petition the throne to spare the temple"
        legitimacy_bp: -2500
        wealth_bp: -300
        outcome: >-
          Your petition goes west with gifts for the officials who can read it. The answer is
          slow, and the garrison is not.
    history: >-
      In the first year of the Second Emperor (209 BC) the lord of Wey was reduced to a commoner and
      the sacrifices ended. Wey, the oldest of the Zhou states, outlived the others (Shiji 37).
    sources: ["Shiji 37 (Wey Kang Shu)", "Shiji 6 (First Emperor)"]
