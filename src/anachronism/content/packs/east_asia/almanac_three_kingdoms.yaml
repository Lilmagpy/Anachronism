schema_version: 1
# Chronicle mode (D-120, D-131): meanwhile, in the world, AD 400-475 (told in a Goguryeo chronicle).
almanac:
  - id: tk_faxian
    scenario: three_kingdoms
    year: 402
    text: >-
      The Chinese monk Faxian, who set out from Chang'an three years ago on foot to find
      the true Buddhist scriptures, crosses the Pamirs into India. He will come home by sea
      fifteen years later with the books he went for.
  - id: tk_kumarajiva
    scenario: three_kingdoms
    year: 402
    needs_alive: [later_qin]
    text: >-
      In Chang'an, the Kuchean monk Kumarajiva, brought to the city by the Later Qin king,
      begins translating the Lotus Sutra into Chinese with a team of hundreds. His
      translation is still the one read in Korea and Japan.
  - id: tk_rome_410
    scenario: three_kingdoms
    year: 410
    text: >-
      Far to the west, the Goths of Alaric sack Rome. It is the first time in eight hundred
      years that the city has fallen to a foreign enemy.
  - id: tk_jin_falls
    scenario: three_kingdoms
    year: 420
    needs_alive: [eastern_jin]
    text: >-
      In Jiankang, the general Liu Yu deposes the last emperor of Jin and founds the Song
      dynasty. Within a year the deposed emperor is smothered.
  - id: tk_hypatia
    scenario: three_kingdoms
    year: 415
    text: >-
      In Alexandria, a Christian mob drags the philosopher and mathematician Hypatia from
      her carriage and murders her.
  - id: tk_wei_north
    scenario: three_kingdoms
    year: 439
    needs_alive: [northern_wei]
    text: >-
      Emperor Taiwu of Northern Wei conquers Northern Liang in the far west. For the first
      time in a hundred and twenty years one power rules all of north China.
  - id: tk_attila
    scenario: three_kingdoms
    year: 451
    text: >-
      In Gaul, Attila's Huns are stopped on the Catalaunian plains by a Roman and Gothic
      army. Two years later Attila dies on his wedding night.
  - id: tk_wa_kings
    scenario: three_kingdoms
    year: 438
    needs_alive: [wa]
    text: >-
      A king of the Wa sends envoys to the Song court in Jiankang asking to be recognised as
      ruler of Wa, Baekje, Silla and Gaya. The emperor grants him Wa and leaves out Baekje.
  - id: tk_zu_chongzhi
    scenario: three_kingdoms
    year: 462
    text: >-
      In the Song capital the mathematician Zu Chongzhi presents a new calendar. He has
      worked out pi to seven decimal places - closer than anyone will for nine hundred years.
  - id: tk_yungang
    scenario: three_kingdoms
    year: 460
    needs_alive: [northern_wei]
    text: >-
      Near the Wei capital at Pingcheng, the monk Tanyao begins carving five colossal
      Buddhas into the cliffs at Yungang, each thirteen to seventeen metres tall.
  - id: tk_bodhidharma
    scenario: three_kingdoms
    year: 470
    text: >-
      In the Wei lands, legend will say, an Indian monk called Bodhidharma sits facing a
      cave wall for nine years: the beginning of Chan Buddhism, which Korea will call Seon
      and Japan Zen.
  - id: tk_romulus
    scenario: three_kingdoms
    year: 476
    text: >-
      In Italy, the barbarian general Odoacer sends the last emperor of the West, a boy called
      Romulus Augustulus, into retirement on a pension.
