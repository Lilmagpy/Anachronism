schema_version: 1
# Chronicle mode (D-120, D-187): the last Ashikaga shoguns, from Yoshiteru's swordsmanship
# to Yoshiaki's expulsion, 1560-1573. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Shincho koki, the diaries of courtiers
# (Tokitsugu kyoki), Frois, the Uesugi records, Nobunaga's seventeen articles to Yoshiaki,
# and modern work by Lamers, Berry, Tonomura and Yamada Yasuhiro. The famous story of
# Yoshiteru's swords stuck in the floor is told as a story. Kyoto is one province.
chapters:
  - id: ash_kenshin
    scenario: sengoku
    civ: ashikaga
    year: 1560
    title: "A Shogun Who Can Fight"
    place: "The shogun's palace, Kyoto"
    speaker: uesugi
    speaker_name: "Nagao Kagetora"
    speaker_title: "Lord of Echigo, the future Uesugi Kenshin"
    benchmark_provinces: 1
    story: >-
      You are Ashikaga Yoshiteru, thirteenth shogun. For a hundred years the shoguns have
      ruled nothing outside Kyoto, and often not Kyoto: you have been driven out of the
      capital several times by the Miyoshi, and have lately made your peace with them. You have
      studied the sword with the master Tsukahara Bokuden, and are said to be the best
      swordsman ever to hold the office.


      The lord of Echigo, Nagao Kagetora, has come to Kyoto with a strong escort to pay his
      respects. He asks for the honours of a shogunal retainer and your blessing to punish the
      Hojo of the Kanto.
    choices:
      - label: "Grant him the titles"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Kagetora goes home with your blessing, and becomes Uesugi Kenshin, the most loyal
          lord the shogunate has. He is also the furthest away. Young Oda Nobunaga of Owari has
          also come to pay his respects, with a handful of men, and you have hardly noticed
          him.
      - label: "Ask him to stay and guard Kyoto"
        legitimacy_bp: 500
        outcome: >-
          Kagetora stays a month, then goes home, because Echigo will not govern itself.
    history: >-
      Nagao Kagetora (Kenshin) visited Kyoto in 1559 and received honours and favour from
      Yoshiteru, who was a noted swordsman; he became Kanto Kanrei in 1561.
    sources: ["Uesugi-ke monjo", "Tokitsugu kyoki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ash_eiroku
    scenario: sengoku
    civ: ashikaga
    year: 1565
    title: "Swords in the Floor"
    place: "The Nijo palace, Kyoto"
    speaker: general
    speaker_name: "Your last guards"
    speaker_title: "In the palace"
    needs_alive: [miyoshi]
    benchmark_provinces: 1
    story: >-
      The Miyoshi chief Nagayoshi is dead. His heirs - three senior retainers and the son of
      the schemer Matsunaga Hisahide - want a shogun who will do as he is told. They have
      come to the palace with ten thousand men, on the pretext of presenting a petition.


      You have a few hundred guards. They are already fighting in the gardens.
    choices:
      - label: "Fight to the last"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          The story goes that you drove a row of famous swords from your collection into the
          floor, and when one blade dulled you pulled out the next. You are killed, with your
          mother and your guards. The Miyoshi make your cousin shogun. Your younger brother
          Kakukei, a monk at Nara, escapes, and goes looking for a lord who will make him
          shogun instead.
        deeds: {ruler_falls: "is killed fighting in his palace"}
      - label: "Escape by the back gate"
        legitimacy_bp: -1000
        outcome: >-
          You get out through the kitchens with a few men, and ride for Omi, as you have done
          before.
    history: >-
      In the Eiroku incident (1565) Miyoshi forces and Matsunaga Hisamichi attacked the Nijo
      palace and killed the shogun Yoshiteru, who fought to the end.
    diverged: >-
      The Miyoshi are gone.
    sources: ["Tokitsugu kyoki, Eiroku 8.5", "Frois, Historia de Japam", "Lamers, Japonius Tyrannus (2000)"]

  - id: ash_yoshiaki
    scenario: sengoku
    civ: ashikaga
    year: 1568
    title: "Escorted to the Capital"
    place: "Gifu"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "Lord of Owari and Mino"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Ashikaga Yoshiaki, Yoshiteru's brother, once the monk Kakukei. You have spent
      three years begging the great lords to put you on your brother's seat. The Asakura
      gave you a home and did nothing. Now Oda Nobunaga, who has just taken Mino, offers to
      escort you to Kyoto with his army.


      He has said he wants nothing for himself.
    choices:
      - label: "Ride to Kyoto with Nobunaga"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Nobunaga's army sweeps the Miyoshi out of the capital in a month, and you are made
          the fifteenth shogun. You call him 'father' in a letter and offer him any title he
          wants. He asks only for the right to govern the towns of Sakai, Otsu and Kusatsu.
          You begin to understand.
        deeds: {peace_with: [miyoshi]}
      - label: "Wait for a lord of older family"
        legitimacy_bp: -1000
        outcome: >-
          You stay in Echizen with the Asakura, who are kind to you, and in no hurry.
    history: >-
      Oda Nobunaga escorted Ashikaga Yoshiaki to Kyoto in 1568, and he was made the fifteenth
      shogun.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki 1", "Lamers, Japonius Tyrannus (2000)"]

  - id: ash_articles
    scenario: sengoku
    civ: ashikaga
    year: 1572
    title: "Seventeen Articles"
    place: "The Nijo palace, Kyoto"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "Your 'father', in a letter"
    needs_alive: [oda, takeda]
    benchmark_provinces: 1
    story: >-
      Nobunaga built you a new palace, and then told you that every letter you send must be
      read by him first. Now he has sent you seventeen articles of complaint, published for
      all to read: you neglect the court, you hoard rice, you reward the undeserving, you
      give the people cause to call you a 'bad shogun'.


      In secret, the Asakura, the Azai, the monks of the Honganji and Mount Hiei have been
      fighting Nobunaga for two years. Takeda Shingen, the greatest general in Japan, is
      answering your letters, and is ready to march west.
    choices:
      - label: "Call on Shingen to march"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Your letters go out to Shingen, to the Asakura, to the monks. Shingen marches west
          and crushes Nobunaga's ally Tokugawa at Mikatagahara. Then he turns back, ill, and dies on the road home.
        deeds: {grudges: {oda: 2500}}
      - label: "Apologise to Nobunaga"
        legitimacy_bp: -1500
        outcome: >-
          You reply humbly, agree to everything, and go back to writing poems.
    history: >-
      Nobunaga's seventeen-article remonstrance (1572) rebuked Yoshiaki, who encouraged the
      coalition against Nobunaga, including Takeda Shingen's march west.
    diverged: >-
      The Oda or the Takeda are gone.
    sources: ["Shincho koki 5 (the seventeen articles)", "Lamers, Japonius Tyrannus (2000)"]

  - id: ash_makishima
    scenario: sengoku
    civ: ashikaga
    year: 1573
    title: "The Last Shogun of Kyoto"
    place: "Makishima castle, on the Uji river"
    speaker: general
    speaker_name: "Your commander at Makishima"
    speaker_title: "Of the shogun's guard"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You have declared war on Nobunaga and shut yourself up in the river castle of Makishima.
      You were waiting for Shingen. Shingen is dead, though his family is keeping it secret.


      Nobunaga's army has waded across the Uji river and is at the gate.
    choices:
      - label: "Surrender the castle"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Nobunaga spares your life, takes your son as a hostage, and sends you away. You
          wander from lord to lord, ending with the Mori in the west, still calling yourself
          shogun, until you give up the title in 1588. The Ashikaga shogunate, two hundred and
          thirty-five years old, ends without anyone noticing the exact day.
        deeds: {ruler_falls: "is driven out of Kyoto by Nobunaga", break_away: [oda]}
      - label: "Fight in the castle"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          Your guards fight on the walls of Makishima. The river is full of Nobunaga's men.
    history: >-
      Yoshiaki rose against Nobunaga in 1573, surrendered Makishima and was expelled from
      Kyoto, conventionally ending the Ashikaga shogunate; he resigned the title in 1588.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki 6", "Lamers, Japonius Tyrannus (2000)"]
