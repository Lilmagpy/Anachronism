schema_version: 1
# Chronicle mode (D-120, D-XXX): the Yiqu Rong, Qin's oldest enemy, about 327-272 BC. Each
# chapter opens in its year; one choice is what history chose (historical: true). The Yiqu
# left no writing: facts follow the Shiji (Qin annals, ch. 5; Xiongnu, ch. 110), the
# Zhanguo ce (Qin 2) and the Hou Han shu (ch. 87, the Western Qiang), with modern work by
# Di Cosmo (Ancient China and Its Enemies, 2002). The names of the Yiqu rulers are lost, and
# the game's rulers ("the Lord of Yiqu", then "the King of Yiqu") are placeholders: their
# succession is a game convenience, since 55 years separate the first and last chapters. The
# Chen Zhen story (about 318) is from the Zhanguo ce, whose dates are loose; the 25 towns are
# in the Shiji under about 315; Luo and Yuzhi are in the Hou Han shu. The Shiji gives no year
# for the Queen Dowager's killing of the King; 272 is the common reckoning (the Qin
# chronicle puts it near 273). benchmark_provinces counts the provinces of this map the real
# Yiqu held at that date.
chapters:
  - id: yiqu_county
    scenario: warring_states
    civ: yiqu
    year: -326
    title: "Lord of Yiqu, Subject of Qin"
    place: "Yiqu, in the loess hills"
    speaker: steward
    speaker_name: "An elder of the council"
    speaker_title: "Of the walled towns"
    benchmark_provinces: 1
    story: >-
      You are the Lord of Yiqu, a Rong people with walled towns and herds on Qin's
      north-western border. Qin has been your neighbour since before anyone alive, and it is
      growing: Shang Yang's reforms have made it a state of farmers and spearmen, and
      Qin's new lord, Huiwen, has the strength to press against your border.


      A Qin envoy is in your hall. He says that the lord of Qin will make a county of your
      land and let you rule it as his subject. Your elders say a lord who bows keeps his
      towns and his sons for another year, and those who refuse will have to fight.
    choices:
      - label: "Accept, and become Qin's subject"
        historical: true
        legitimacy_bp: -800
        unrest_bp: 500
        outcome: >-
          Qin writes in its annals that it has made Yiqu a county and that the lord of Yiqu is its subject.
          Your people do not feel subject to anyone, and the towns say so, in their own way,
          the next year.
      - label: "Refuse, and hold your border"
        legitimacy_bp: 600
        outcome: >-
          The envoy leaves. The Qin garrisons on the border are doubled, and so are yours.
        deeds: {martial_bp: 300, grudges: {qin: 800}}
      - label: "Pay Qin a yearly tribute, but stay a lord"
        wealth_bp: -400
        legitimacy_bp: -200
        outcome: >-
          The envoy takes the offer back to Xianyang. Qin accepts silk and horses for the
          year, and the border is quiet for now, though no one in Yiqu thinks the matter is
          closed.
    history: >-
      The Shiji (Qin annals) says that in 327 BC Qin "made Yiqu a county" and the lord of
      Yiqu became its subject. What this meant on the ground is unclear: Yiqu was soon at
      war with Qin again.
    sources: ["Shiji 5 (Qin)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: yiqu_gifts
    scenario: warring_states
    civ: yiqu
    year: -318
    title: "A Thousand Bolts of Silk"
    place: "The Yiqu hall"
    speaker: steward
    speaker_name: "An elder of the council"
    speaker_title: "Of the walled towns"
    benchmark_provinces: 1
    story: >-
      You are the Lord of Yiqu. When you went to the court of Wei, the persuader Gongsun
      Yan told you something shrewd. When the middle states of the east are
      at peace with Qin, he says, Qin will burn and plunder your country; when they are
      quarrelling with Qin, it will send you gifts.


      And now the gifts have come: so the Zhanguo ce says, a thousand bolts of embroidered
      silk and a hundred beautiful women. A minister at the Qin court, Chen Zhen,
      has advised them. If Gongsun Yan was right, Qin has trouble in the east and wants your
      peace to be quiet. Qin may also be fooling you.
    choices:
      - label: "Take the gifts and march on Qin"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          The Zhanguo ce says that you gathered your officers and told them that Gongsun Yan
          had warned you of this, and that your army raised the border and defeated the Qin army
          at the foot of Libo. Qin does not forget it. Later the Hou Han shu adds that Yiqu
          defeated Qin again, at the Luo.
        deeds: {martial_bp: 200, men: 8000}
      - label: "Take the gifts and keep the peace"
        deeds: {men: 2000}
        wealth_bp: 500
        legitimacy_bp: -300
        outcome: >-
          Qin's silk is well spent. The war you did not fight will be fought in a year or
          two on worse terms.
      - label: "Take the gifts and fortify the border"
        wealth_bp: 300
        unrest_bp: 200
        deeds: {men: 3000, martial_bp: 100}
        outcome: >-
          You take the silk and the women, and set your elders to repairing the walls and
          watch-towers along the Qin frontier. Qin sees a neighbour who is not fooled, and is
          in no hurry to change its policy.
    history: >-
      The Zhanguo ce (Qin 2) tells the Chen Zhen and Gongsun Yan story and says Yiqu defeated Qin
      at Libo; the Hou Han shu has Yiqu beaten at Yuzhi and winning at the Luo. Dates in the
      Zhanguo ce are loose; about 318 BC is the usual guess.
    sources: ["Zhanguo ce, Qin 2", "Hou Han shu 87 (Western Qiang)", "Di Cosmo, Ancient China and Its Enemies (2002)"]

  - id: yiqu_towns
    scenario: warring_states
    civ: yiqu
    year: -316
    title: "Twenty-Five Towns"
    place: "The border towns"
    speaker: general
    speaker_name: "A border captain"
    speaker_title: "Of the walled towns"
    benchmark_provinces: 1
    story: >-
      Qin has changed since it last saw your banners. Shu and Ba lie across its southern
      road, and it is looking at the north-west again. A Qin army has come into your country in
      force, with armed men and crossbows, under the Qin generals, and the towns on the frontier
      are going down one by one.


      Your captain says the walls are good, and the herds can be driven north. To fight for
      every town is to lose every town in the end; to give up the frontier is to be pushed
      back onto the steppe.
    choices:
      - label: "Yield the frontier, hold the heartland"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Qin takes twenty-five of your towns, and the Shiji records it in a single line. You
          keep your capital, your herds and your hills, and the Qin border moves north.
      - label: "Hold every frontier town and wall"
        legitimacy_bp: -400
        outcome: >-
          The walls hold for a season, and many of your best fighters die on them.
        deeds: {martial_bp: 300, men: 4000}
      - label: "Buy a truce with a payment of herds"
        wealth_bp: -500
        legitimacy_bp: -500
        deeds: {peace_with: [qin]}
        outcome: >-
          Your envoys drive a great herd to the Qin camp and ask for terms. The Qin generals
          take the herd, and give you a pause in the fighting, but not the towns back.
    history: >-
      The Shiji (Qin annals) says that Qin took twenty-five towns of Yiqu in the 310s BC
      (about 315 or 314). The Hou Han shu names Yuzhi among the places Qin took.
    sources: ["Shiji 5 (Qin)", "Hou Han shu 87 (Western Qiang)"]

  - id: yiqu_court
    scenario: warring_states
    civ: yiqu
    year: -306
    title: "A Welcome in Qin"
    place: "The Qin court"
    speaker: qin
    speaker_name: "Queen Dowager Xuan"
    speaker_title: "Mother of the King of Qin"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      You are the King of Yiqu, and a new king has come to the throne of Qin: Zhaoxiang, a
      young man, whose mother, the Queen Dowager Xuan, a woman of Chu, is the real power at his court.
      The Hou Han shu says that when the new king was set up, the King of Yiqu came to pay
      his respects at the Qin court.


      The invitation is warm. Your elders have long memories of what Qin has done to your
      towns, and wonder what Qin wants of a king who walks into its palace. But for
      Yiqu the truce is worth having, and the queen mother is said to be a person
      who likes to be pleased.
    choices:
      - label: "Go to the Qin court yourself"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You are received with honour. The Shiji and the Hou Han shu both say that you and
          the Queen Dowager Xuan became lovers, and had two sons. Your visits to Qin go on for years.
        deeds: {peace_with: [qin], men: 10000, martial_bp: 600}
      - label: "Send gifts and stay at home"
        deeds: {men: 4000, martial_bp: 200}
        legitimacy_bp: -200
        outcome: >-
          The queen mother accepts the gifts with a cool note. Qin's border officers
          write more often.
      - label: "Send a son to Qin as a pledge"
        legitimacy_bp: 300
        deeds: {peace_with: [qin], men: 3000}
        outcome: >-
          Your son goes to Xianyang with gifts and an escort. Qin receives him civilly and
          keeps him; the truce holds, but on its terms.
    history: >-
      The Hou Han shu (ch. 87) says that the King of Yiqu came to the Qin court when King
      Zhaoxiang was set up (306 BC), and became the Queen Dowager's lover. The Shiji
      (ch. 110) says they had two sons. The sources then say little of Yiqu until its end.
    diverged: >-
      Qin is gone.
    sources: ["Hou Han shu 87 (Western Qiang)", "Shiji 110 (Xiongnu)"]

  - id: yiqu_ganquan
    scenario: warring_states
    civ: yiqu
    year: -272
    title: "The Invitation to Ganquan"
    place: "The Qin palace at Ganquan"
    speaker: qin
    speaker_name: "Queen Dowager Xuan"
    speaker_title: "Mother of the King of Qin"
    needs_alive: [qin]
    benchmark_provinces: 1
    story: >-
      You are the King of Yiqu. For years you have gone to the Qin court, and the Qin queen
      mother, Xuan, a woman of Chu and the most powerful person in Qin, has been your
      lover. She has borne you two sons. The Shiji and the Hou Han shu both say so.


      Now she invites you again to the palace at Ganquan, among the pines on the hill. Some of your captains say you should not go, for Qin has not forgiven the Luo, or the years of fighting before it. Others say that the queen has always been kind to you, and that a king who stays away from her table gives offence.
    choices:
      - label: "Go to Ganquan at her invitation"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          She has you killed in the palace. The Shiji says that Queen Dowager Xuan
          tricked the King of Yiqu and killed him at Ganquan, and then raised an army and
          destroyed the Yiqu. Your two sons are not mentioned again. Your people are
          scattered across the hills, and Qin makes its commanderies where your towns stood.
        deeds: {ruler_falls: "is killed at Ganquan by the Queen Dowager of Qin"}
      - label: "Stay home, and send gifts instead"
        wealth_bp: -300
        legitimacy_bp: 500
        outcome: >-
          The queen mother is gracious. In a year or two she sends again. Your captains
          watch the border more closely.
      - label: "Refuse the invitation and fortify the border"
        legitimacy_bp: -1500
        deeds: {men: 6000, martial_bp: 300}
        outcome: >-
          You send word that the border needs you, and set your men to the walls. The queen
          mother is offended, and the Qin court talks of an ungrateful ally.
    history: >-
      The Shiji (Xiongnu, ch. 110) says Queen Dowager Xuan lured the King of Yiqu to the
      Ganquan palace and killed him, and Qin then destroyed Yiqu and set up the commanderies
      of Longxi, Beidi and Shang. The Shiji adds the affair and two sons; the Hou Han shu (ch. 87) tells it again. The
      commonly given year is 272 BC. Qin then built a wall against the northern peoples.
    diverged: >-
      Qin is gone.
    sources: ["Shiji 110 (Xiongnu)", "Hou Han shu 87 (Western Qiang)", "Di Cosmo, Ancient China and Its Enemies (2002)"]
