schema_version: 1
# Chronicle mode (D-120, D-XXX): the Murong Yan and the Feng Yan of Longcheng, from Murong
# Sheng's strike on Goguryeo to the burning of Longcheng, AD 400-436. The state is Later Yan
# until 407 and, after Feng Ba's coup, Northern Yan (409-436), which the game keeps under the
# one id. Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Jin shu (chs. 124 Murong Sheng and Murong Xi, 125 Feng Ba), the Wei shu (ch.
# 97, Feng Hong), the Zizhi tongjian (chs. 111-122) and the Samguk sagi (Goguryeo annals), with
# modern work by Holcombe, Lewis and Lee Ki-baik. Dates are the traditional lunar years and
# months are not given. Murong Xi's end and Feng Ba's coup are dated 407 in the sources; on
# the two-year turn grid the chapter opens in 408 and Xi's 'died' is set to 409 (the 407 of
# history is two years earlier). Gao Yun (Murong Yun) is told as Goguryeo's chapters tell him.
# Ages are placeholders. benchmark_provinces counts the provinces of this map the real state
# held at that date.
chapters:
  - id: ly_goguryeo
    scenario: three_kingdoms
    civ: later_yan
    year: 400
    title: "A Careless Bow"
    place: "Longcheng"
    speaker: general
    speaker_name: "Your marshal of the east"
    speaker_title: "From the Liao frontier"
    needs_alive: [goguryeo]
    benchmark_provinces: 3
    story: >-
      You are Murong Sheng, king of Yan. Three years ago the Tuoba took your heartland, and
      two years ago your father was killed in a mutiny; you crushed it and
      took the throne yourself. You are strict, and men have died for small faults.


      This spring Goguryeo's king sent an envoy to your court. The Samguk sagi says that your
      court judged his manner careless, not that of a subject. Goguryeo's army, your scouts
      say, is far away in the south, fighting for Silla.
    choices:
      - label: "Send horse across the Liao to the forts"
        historical: true
        legitimacy_bp: 800
        wealth_bp: 500
        outcome: >-
          Your horse cross the river and take two of Goguryeo's forts. Five thousand households
          are moved west into your lands, and your frontier is seven hundred li wider. Goguryeo's
          king will not forget it.
        deeds: {grudges: {goguryeo: 2500}}
      - label: "Receive the envoy and keep the peace"
        legitimacy_bp: 1000
        wealth_bp: 500
        outcome: >-
          The envoy goes home pleased, and leaves gifts behind. The Liao frontier stays quiet for a year more, and your
          generals are restless.
      - label: "Write to Silla offering friendship"
        legitimacy_bp: -300
        outcome: >-
          Silla's king is flattered and does nothing. Goguryeo hears of the letter.
        deeds: {grudges: {goguryeo: 1500}}
    history: >-
      The Samguk sagi and Jin shu record that in 400 Murong Sheng attacked Goguryeo with 30,000
      troops, took the forts of Xincheng and Nansu, enlarged his frontier by seven hundred li
      and moved five thousand households to Liaoxi, because, the Samguk sagi says, Goguryeo's
      king had been lax in his courtesy. Sheng was killed by his own officers in 401.
    diverged: >-
      Goguryeo is gone.
    sources: ["Jin shu 124 (Murong Sheng)", "Samguk sagi, Goguryeo annals (400)", "Zizhi tongjian 111"]

  - id: ly_sukgun
    scenario: three_kingdoms
    civ: later_yan
    year: 402
    title: "A King of Sixteen"
    place: "Longcheng"
    speaker: steward
    speaker_name: "A minister of the council"
    speaker_title: "In the audience hall"
    needs_alive: [goguryeo]
    benchmark_provinces: 3
    story: >-
      You are Murong Xi, sixteen years old, youngest son of Murong Chui. Your nephew Murong
      Sheng was killed by his officers last year, in the palace, and the court put you on
      the throne because you were a prince and a boy.


      A message from the frontier says that Goguryeo's army has crossed the Liao and is attacking
      the fortress of Sukgun, held by your governor of Pingzhou. Your court is full of men who
      have killed one king and are not sure about another.
    choices:
      - label: "Secure the court first"
        historical: true
        legitimacy_bp: 500
        unrest_bp: -500
        outcome: >-
          You deal with the palace. Sukgun falls and your governor flees. The Liao
          plain lies open to Goguryeo, which takes it over the next two years.
        deeds: {grudges: {goguryeo: 1500}}
      - label: "Send the whole army to relieve Sukgun"
        legitimacy_bp: 1700
        unrest_bp: 500
        outcome: >-
          The army marches out through a palace still full of plots. It relieves the fort.
          The plotters use the empty capital.
      - label: "Send an envoy to Goguryeo with gifts"
        wealth_bp: -500
        outcome: >-
          Goguryeo's king accepts the gifts and takes the fort.
    history: >-
      After Sheng's murder in 401, Murong Xi (born about 385) was put on the throne by the
      court. Goguryeo attacked Sukgun in 402 and the governor of Pingzhou fled; Goguryeo took
      Liaodong in the following years.
    diverged: >-
      Goguryeo is gone.
    sources: ["Jin shu 124 (Murong Xi)", "Samguk sagi, Goguryeo annals (402)", "Zizhi tongjian 112"]

  - id: ly_liaodong
    scenario: three_kingdoms
    civ: later_yan
    year: 405
    title: "The Road for the Empress's Carriage"
    place: "Before Liaodong city"
    speaker: general
    speaker_name: "Your marshal at the wall"
    speaker_title: "At the breach"
    needs_alive: [goguryeo]
    benchmark_provinces: 2
    story: >-
      You are Murong Xi, twenty years old. Your army has besieged Liaodong, which Goguryeo
      took from you, for twenty days. This morning part of the wall came down, and your
      soldiers began to go in.


      Your empress, Lady Fu, is in her carriage behind the lines. The Jin shu says you
      wanted to ride in with her first, and ordered the army to stop until a road was levelled.
      Your marshal has come to ask whether the order stands.
    choices:
      - label: "Hold the army until the road is smooth"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 800
        outcome: >-
          The soldiers stop at the breach. Inside the city, men, women and children carry
          stones and timber all night, and by morning the wall is whole. Your army goes home
          in the winter mud. Next year you try again at another fort and fail again.
        deeds: {grudges: {goguryeo: 2000}}
      - label: "Order the storm at once, and let the empress follow"
        legitimacy_bp: 800
        outcome: >-
          Your horse go in through the breach. The city falls the same day, and Liaodong is
          yours again. Lady Fu enters in her carriage the next morning.
        deeds: {take: [k4_liaodong], grudges: {goguryeo: 3000}}
      - label: "Break off the siege and go home"
        legitimacy_bp: -500
        outcome: >-
          Liaodong stays with Goguryeo. Your marshals say that you gave up a won city.
    history: >-
      In 405 Murong Xi besieged Liaodong. According to the Jin shu, when the wall was about to
      fall he ordered his men to wait until the way was levelled so that he and Empress Fu
      could enter in their carriage; the defenders mended the wall and the siege failed. In 406
      he failed again at Mokjeo. Goguryeo held Liaodong till 668.
    diverged: >-
      Goguryeo is gone, or Liaodong is yours already.
    sources: ["Jin shu 124 (Murong Xi)", "Zizhi tongjian 114"]

  - id: ly_funeral
    scenario: three_kingdoms
    civ: later_yan
    year: 407
    title: "The Funeral of Lady Fu"
    place: "Longcheng"
    speaker: steward
    speaker_name: "A minister of rites"
    speaker_title: "At the funeral"
    benchmark_provinces: 2
    story: >-
      Lady Fu is dead. You, Murong Xi, loved her more than anything, say the sources, and
      loved her more than the army, the treasury or your own court. The Jin shu says you have
      ordered your ministers to mourn her, and a tomb dug so large that the treasury is empty.


      The hearse is leaving the palace. You mean to walk behind it with the court. Your guard
      captain says that some of the generals, Feng Ba and his brother among them, have been
      seen at night with soldiers who are not on the duty roll.
    choices:
      - label: "Walk behind the hearse, with the court"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Feng Ba and his brother take the city while you are outside the gate. You run to the
          woods, but you are recognised and caught, and you are killed. You are twenty-two. The
          generals put on the throne a man named Gao Yun, who is, people say, a descendant of a
          Goguryeo prince taken captive by a Murong army sixty years ago.
        deeds: {ruler_falls: "is caught and killed in a coup led by Feng Ba"}
      - label: "Hold the funeral in the palace, and call out the guard"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          The guard arrests some of the officers. The others rise anyway, and the court
          holds its breath.
      - label: "End the mourning and pay the army"
        legitimacy_bp: 500
        wealth_bp: -1500
        outcome: >-
          Your generals are pleased. Lady Fu's party at court is not.
    history: >-
      The Jin shu records that Lady Fu (Fu Xunying) died in 407 and Murong Xi's extravagant
      mourning and tomb provoked his officers; while he was away from the capital with the
      funeral, Feng Ba and his brothers seized Longcheng, and Xi was captured and killed (he
      was about twenty-two). Gao Yun (Murong Yun), a Murong by adoption of Goguryeo descent, was
      made king.
    sources: ["Jin shu 124 (Murong Xi)", "Jin shu 125 (Feng Ba)", "Zizhi tongjian 114"]

  - id: ly_throne
    scenario: three_kingdoms
    civ: later_yan
    year: 410
    title: "The Heavenly King of a Han Family"
    place: "Longcheng"
    speaker: general
    speaker_name: "Feng Su"
    speaker_title: "Your brother"
    benchmark_provinces: 2
    story: >-
      You are Feng Ba. Your family are Han Chinese, who served the Murong. Three years ago you put Gao Yun on the throne. Last year,
      the Jin shu says, two of his favourites killed him in his own palace, and the court is
      asking you to rule.


      You have no Murong blood. But the Xianbei who follow you are unwilling to be led by a
      commoner of another people, and the Han families in your army would not follow a
      Xianbei boy. Your brother Su and your generals each have a different plan to hold both
      of them.
    choices:
      - label: "Take the throne as Heavenly King"
        historical: true
        legitimacy_bp: 1500
        influence: {nobility: 500}
        outcome: >-
          You take the title and keep Yan's name and its customs. Your ministers are Han and
          Xianbei both. You make peace with Goguryeo, whose king has already recognised the
          man you replaced as kin. The Chinese historians will call yours Northern Yan.
        deeds: {peace_with: [goguryeo]}
      - label: "Set up a Murong prince as king"
        legitimacy_bp: 2200
        wealth_bp: -500
        influence: {nobility: 500}
        outcome: >-
          There are few Murong princes left, and the one you find is a boy. The generals
          who put him up expect to be paid, and they are.
        deeds: {men: 3000}
      - label: "Submit to the Jin court as a duke"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          The Jin court makes you a duke at the other end of the empire. The Xianbei walk
          out of your council.
        deeds: {peace_with: [eastern_jin]}
    history: >-
      Gao Yun was murdered in 409; Feng Ba succeeded as Heavenly King of Yan, with the era name
      Taiping, and ruled until 430. Historians call his state Northern Yan. He kept friendly
      relations with Goguryeo, whose king had in 408 acknowledged Gao Yun as kin.
    sources: ["Jin shu 125 (Feng Ba)", "Wei shu 97 (Feng Hong)", "Zizhi tongjian 115", "Samguk sagi, Goguryeo annals (408)"]

  - id: ly_taiping
    scenario: three_kingdoms
    civ: later_yan
    year: 414
    title: "Mulberries on the Frontier"
    place: "Longcheng"
    speaker: scholar
    speaker_name: "A Han minister"
    speaker_title: "Reader to the king"
    benchmark_provinces: 2
    story: >-
      You are Feng Ba. The fields of Liaoxi have been fought over for twenty years. Refugees
      have come to you from the lands of the Tuoba, from the south and from the steppe, and many
      of the old soldiers have not yet been given land. The Wei court at Pingcheng is stronger
      than you, and is watching you.


      Your minister says that a king should make the land fruitful before he builds a city.
      He asks that farmers be allowed to settle on the empty land, that taxes be light, and
      that every household plant mulberries. Your generals say the frontier comes first.
    choices:
      - label: "Settle the refugees and plant mulberries"
        historical: true
        food_bp: 1500
        legitimacy_bp: 1000
        unrest_bp: -800
        outcome: >-
          Your fields are sown and your silk is traded. The Jin shu will praise your
          frugality, and say you spent little on yourself. Wei does not attack, for now.
        deeds: {peace_with: [northern_wei]}
      - label: "Build forts along the Wei frontier first"
        legitimacy_bp: 1000
        food_bp: -500
        outcome: >-
          Your garrisons are strong and your granaries thin. The refugees go home or die
          where they are.
        deeds: {martial_bp: 500, men: 5000}
      - label: "Ride out and raid the steppe for herds"
        wealth_bp: 2500
        legitimacy_bp: 1000
        unrest_bp: 700
        outcome: >-
          The herds come in, and the steppe peoples learn that Yan is a neighbour to fear.
        deeds: {martial_bp: 500}
    history: >-
      The Jin shu (ch. 125) praises Feng Ba's frugality and mild government, and records his
      policies of attracting refugees and promoting agriculture and mulberry-planting. The
      date 414 is a mark for his rule, 409-430, not an event the sources date.
    sources: ["Jin shu 125 (Feng Ba)", "Holcombe, The Genesis of East Asia (2001)"]

  - id: ly_hong
    scenario: three_kingdoms
    civ: later_yan
    year: 430
    title: "The Brother at the Palace Gate"
    place: "Longcheng"
    speaker: steward
    speaker_name: "Your chief minister"
    speaker_title: "At your bedside"
    benchmark_provinces: 2
    story: >-
      You are Feng Ba. You have ruled for twenty-one years, and you are dying. Your empress
      Song wants her son Yi to be your heir, and your brother Feng Hong, who commands the
      army, has been seen with soldiers at night.


      Your chief minister says that you can put your son in charge of the guard, or name
      your brother regent, or send your brother away from the capital. He says it must be
      done tonight.
    choices:
      - label: "Put your son Yi in charge of the palace guard"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          The guard is not enough. Your brother Hong forces his way in with his soldiers. The
          sources say you die of shock. Hong kills the empress's sons, and many of your own,
          and takes the throne.
        deeds: {ruler_falls: "dies as his brother storms the palace"}
      - label: "Name your brother Feng Hong regent"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Hong takes the regency and the palace. Your sons remain alive for a while, and the
          empress is afraid.
        deeds: {ruler_falls: "dies, leaving his brother Feng Hong regent"}
      - label: "Send Hong away to a distant command"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Hong will not go. The army follows him.
    history: >-
      Feng Ba fell gravely ill in 430. His brother Feng Hong forced his way into the palace
      with soldiers, Feng Ba died shortly after, and Hong killed many of Ba's sons and took the
      throne. Wei began to press Northern Yan in 432.
    sources: ["Jin shu 125 (Feng Ba)", "Wei shu 97 (Feng Hong)", "Zizhi tongjian 121"]

  - id: ly_longcheng
    scenario: three_kingdoms
    civ: later_yan
    year: 436
    title: "The Fires of Longcheng"
    place: "Longcheng"
    speaker: goguryeo
    speaker_name: "King Jangsu's general"
    speaker_title: "At the gate"
    needs_alive: [northern_wei, goguryeo]
    benchmark_provinces: 1
    story: >-
      You are Feng Hong, the last king of Yan. The Wei army of Emperor Taiwu is on your
      frontier. Four years ago you offered submission and refused to send your son as a hostage;
      you no longer have a way out.


      Goguryeo has sent soldiers. Their general says that Jangsu will take you, your family,
      your officials and as many of your people as can march, to Goguryeo's land.
    choices:
      - label: "Burn Longcheng and go east"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          The palace and the armoury are fired, and the smoke is said to rise for ten days.
          You go east with your family and your people and your treasure, into Liaodong. Wei
          takes the ashes. Two years later you will try to go south to the Song, and be killed.
        deeds: {ruler_falls: "burns Longcheng and flees to Goguryeo"}
      - label: "Hold Longcheng against Wei"
        legitimacy_bp: -1000
        unrest_bp: 1500
        outcome: >-
          Wei's army is strong and the city will not hold. You know it.
      - label: "Submit to Emperor Taiwu"
        legitimacy_bp: -2000
        outcome: >-
          The emperor accepts, and demands your family. His promises, you know, are as long
          as his memory of Yan.
        deeds: {give: [k4_longcheng], give_to: northern_wei}
    history: >-
      Wei attacked Longcheng in 436; Feng Hong, begging Goguryeo for help, fled to Liaodong
      with the Goguryeo army, which looted the armouries and set the city on fire. Hong was
      killed at Goguryeo's order in 438 when he tried to go to the Song.
    diverged: >-
      Goguryeo or Wei is gone.
    sources: ["Wei shu 97 (Feng Hong)", "Wei shu 4 (Shizu)", "Samguk sagi 18 (Jangsu)"]
