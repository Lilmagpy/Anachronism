schema_version: 1
# Chronicle mode (D-120, D-XXX): the Amago of Izumo, from Haruhisa's last year to the fall of
# Kozuki castle, 1560-1578. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Mori family documents (Mori-ke monjo), Amago-side
# chronicles written long afterwards (the Amago kinsei ki-type tales, used with care), and
# modern work by Turnbull, Berry and Conlan. The duel of Yamanaka Shikanosuke and the prayer
# to the new moon are told as later stories. Dates for the Mori advance in Izumo (1562-65) and
# Katsuhisa's landing (1569) are approximate to the year. Haruhisa is taken to have died at
# the turn of 1560-61 (24 December 1560 by the old calendar). Katsuhisa's age is approximate.
# Izumo is the player's only province, so its loss in 1566 is told but not enacted (last
# province cannot be given away); benchmark_provinces stays 1 (the real Amago held no
# province after 1566, only a single castle in Harima in 1578). Yoshihisa is ended by
# ruler_falls in 1566 (Katsuhisa then stands for the house, a little earlier than in history);
# Katsuhisa by ruler_falls in 1578.
chapters:
  - id: ama_silver
    scenario: sengoku
    civ: amago
    year: 1560
    title: "Silver and Friends"
    place: "Gassan-Toda castle, Izumo"
    speaker: steward
    speaker_name: "Your Iwami stewards"
    speaker_title: "From the silver mountain"
    benchmark_provinces: 1
    story: >-
      You are Amago Haruhisa, forty-six. Your grandfather Tsunehisa once ruled eleven provinces
      from this mountain castle. Six years ago you had your cousin Kunihisa and the Shingun,
      the best of your army, put to death on a rumour; the story says the rumour was spread by
      Mori Motonari, and some historians doubt that. You have not recovered from the loss.


      The silver of Iwami has been fought over for years, and it is the reason the Mori
      want you gone. You are not well. The doctors have told you to put your affairs in order.
    choices:
      - label: "Ask Otomo and the shogun to press the Mori"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Your envoys cross the sea to Kyoto and to Bungo. The shogun's court sends polite
          letters. For a time the Mori look west as well as east, and then they settle their
          quarrel with the Otomo. You die at the turn of the year, and your son Yoshihisa is twenty
          years old.
        deeds: {ruler_falls: "dies at the turn of the year"}
      - label: "Spend the silver on a standing gunner army"
        deeds: {men: 3000}
        wealth_bp: -2000
        outcome: >-
          Your treasury runs dry in a year, and the new gunners have not seen a battle.
      - label: "Offer the Mori a settlement over Iwami"
        wealth_bp: 300
        legitimacy_bp: -600
        deeds: {peace_with: [mori]}
        outcome: >-
          You send a priest to Motonari with an offer to share the Iwami silver and to cease
          raiding the Mori border. He listens with courtesy and gives no promises, but there
          is a lull in the fighting.
    history: >-
      The Amago looked to the Otomo and the Ashikaga shogun for help against the Mori. Amago
      Haruhisa died at the end of 1560 (by the old calendar) and was succeeded by his son
      Yoshihisa.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_izumo
    scenario: sengoku
    civ: amago
    year: 1562
    title: "The Mori Come Down the Valley"
    place: "Izumo"
    speaker: general
    speaker_name: "Yamanaka Shikanosuke"
    speaker_title: "A young retainer"
    benchmark_provinces: 1
    story: >-
      You are Amago Yoshihisa, twenty-two. Iwami, with its silver, has slipped from your hands.
      Mori Motonari is in Izumo with a large army, and his sons Kikkawa Motoharu and
      Kobayakawa Takakage are with him. Your outer castles are falling one by one, among them
      Shiraga, which guards the road to the plain.


      Your captains argue. The old men say you must save the castles with one great relief
      march. The young say the Mori are too many, and you should let the outer forts go and
      keep the army whole.
    choices:
      - label: "March to relieve the outer castles"
        deeds: {men: 8000}
        legitimacy_bp: -1500
        outcome: >-
          Your relief force is turned back with loss, and the castles you wished to save fall
          anyway, one after another, over the next year.
      - label: "Abandon the outer forts, hold Gassan-Toda"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 800
        outcome: >-
          Shiraga and the other forts are lost by the autumn of 1563. Your people crowd into the
          mountain castle, and the Mori army settles down to starve you.
      - label: "Raid the Mori supply lines with light troops"
        legitimacy_bp: -300
        unrest_bp: 300
        deeds: {men: 4000, martial_bp: 200}
        outcome: >-
          You send light troops into the hills to cut the Mori baggage trains on the river
          roads. The Mori lose men and time, but the castles are still besieged.
    history: >-
      Between 1562 and 1565 the Mori took the outer castles of Izumo, and the Amago withdrew to
      Gassan-Toda.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_hunger
    scenario: sengoku
    civ: amago
    year: 1565
    title: "The Moon-Mountain Winter"
    place: "Gassan-Toda castle"
    speaker: general
    speaker_name: "Yamanaka Shikanosuke"
    speaker_title: "Your best young captain"
    benchmark_provinces: 1
    story: >-
      You are Amago Yoshihisa, twenty-five. The Mori have drawn their lines round the foot of
      Gassan-Toda and have held them for months. Food does not reach you. Your people eat
      what they can find. Mori Motonari will not let anyone out - he wishes the mouths inside
      to be as many as possible - and has had deserters sent back.


      A story told later says that Yamanaka Shikanosuke fought a champion of the Mori in single
      combat by the river, and won. Whatever the truth of it, Shikanosuke wants you to
      break out. The older men think help will arrive from Bungo or from the shogun.
    choices:
      - label: "Hold the walls and wait for help"
        historical: true
        legitimacy_bp: -800
        unrest_bp: 1500
        food_bp: -1500
        outcome: >-
          No army comes. The shogun is murdered this year by his own captains in Kyoto, and
          the Otomo are fighting the Mori elsewhere. By the next year the dead are lying in the
          lanes of the castle.
      - label: "Break out with your best men"
        deeds: {men: 500}
        food_bp: 500
        legitimacy_bp: -1500
        outcome: >-
          A few hundred men get through the lines at night, and many do not. Those you leave
          behind do not forgive it.
      - label: "Send night raiders to bring in rice"
        food_bp: 800
        unrest_bp: 500
        legitimacy_bp: -400
        deeds: {martial_bp: 200}
        outcome: >-
          Shikanosuke and a picked band go out by night to the Mori storehouses. Some rice
          comes back, and some of the men do not.
    history: >-
      The Mori blockaded Gassan-Toda from 1565; the Otomo and the shogun gave no relief.
      Shogun Yoshiteru was killed in the Eiroku incident in June 1565.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_surrender
    scenario: sengoku
    civ: amago
    year: 1566
    title: "Terms"
    place: "Gassan-Toda castle"
    speaker: general
    speaker_name: "Kikkawa Motoharu"
    speaker_title: "Mori commander, by herald"
    benchmark_provinces: 1
    story: >-
      You are Amago Yoshihisa, twenty-six. The castle is starving. Your men can hardly hold
      their spears, and the Mori have offered terms by herald: lay down arms, open the gates,
      and the lives of the garrison and of the three brothers will be spared.


      Your retainers are split. Some say to die with swords in hand; others say that the house
      is more than the castle.
    choices:
      - label: "Open the gates and ask for the garrison's lives"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          In the eleventh month you open the gates. You and your brothers are sent to a temple in
          Aki, under guard. Your retainers are scattered. Yamanaka Shikanosuke, so the tale
          goes, prays to the new moon in the mountains: 'Give me seven hardships and eight
          sorrows.' Izumo belongs to Mori Motonari. The Amago, who once ruled eleven provinces,
          have none.
        deeds: {ruler_falls: "surrenders Gassan-Toda and goes to a temple in Aki"}
      - label: "Charge out of the gate and die"
        deeds: {martial_bp: 300}
        legitimacy_bp: 300
        outcome: >-
          Your retainers will not follow. A few hundred starving men die on the slope in the
          morning, and the Mori take the castle in the afternoon.
      - label: "Send Shikanosuke to treat for the house name"
        legitimacy_bp: -1800
        deeds: {peace_with: [mori]}
        outcome: >-
          Shikanosuke goes down to the Mori camp as your envoy. The Mori hear him, and answer
          that the castle must open its gates first and the house will be spoken of
          afterwards.
    history: >-
      Gassan-Toda surrendered to the Mori in the eleventh month of 1566 (Eiroku 9), ending the
      Amago as rulers of Izumo; Yoshihisa and his brothers were confined in Aki.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_katsuhisa
    scenario: sengoku
    civ: amago
    year: 1569
    title: "A Monk Named Katsuhisa"
    place: "Tofuku-ji temple, Kyoto"
    speaker: general
    speaker_name: "Yamanaka Shikanosuke"
    speaker_title: "A masterless warrior"
    benchmark_provinces: 1
    story: >-
      You are Amago Katsuhisa, a young man of the cadet line of the house, a monk at a Kyoto
      temple. You were a child when Gassan-Toda fell. Yamanaka Shikanosuke has found you.
      He tells you that the old Amago retainers, scattered through the mountains of Izumo and
      Hoki and on the island of Oki, will rise for the name, and that the Mori army is busy
      in Kyushu against the Otomo.


      He wants you to put off the monk's robe, take up the Amago name, and cross the sea.
    choices:
      - label: "Take the Amago name and cross the sea"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          In the summer of 1569 you cross from Oki to Izumo with Shikanosuke and a small band.
          Old retainers gather to you, and for a time some of the valleys of Izumo are yours.
          Mori Motonari has to recall his sons from Kyushu. They return with their army, and
          your followers are beaten back. By the end of 1570 you and Shikanosuke are escaping
          again.
      - label: "Wait in Kyoto for a stronger friend"
        legitimacy_bp: -500
        outcome: >-
          Shikanosuke bows, and is back in a month. He is not a man who is easily put off.
      - label: "Ask the shogun for troops before sailing"
        legitimacy_bp: 300
        wealth_bp: -300
        deeds: {men: 2000}
        outcome: >-
          You go to the court of the shogun Yoshiaki and ask for spearmen. He receives you
          kindly and gives you a letter and a few men, no more.
    history: >-
      In 1569 Yamanaka Yukimori (Shikanosuke) brought Amago Katsuhisa from a Kyoto temple to
      Izumo and revived the Amago for a few months; the Mori, recalled from Kyushu, defeated
      them by 1570.
    sources: ["Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_kozuki
    scenario: sengoku
    civ: amago
    year: 1577
    title: "A Castle in Harima"
    place: "Kozuki castle, Harima"
    speaker: oda
    speaker_name: "Hashiba Hideyoshi"
    speaker_title: "Nobunaga's commander in the west"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Amago Katsuhisa, with Yamanaka Shikanosuke still at your elbow. Seven years have
      gone since you were driven from Izumo. Through the introduction of Akechi Mitsuhide you
      have been taken into the service of Oda Nobunaga, who has declared war on the Mori.


      Hashiba Hideyoshi, his commander in the west, has stormed the little castle of Kozuki in
      Harima, on the road the Mori must take. He offers it to you. It is a small castle in
      a place far from Izumo, and it is the only place in Japan that is yours to hold.
    choices:
      - label: "Take Kozuki, and hold it for Nobunaga"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Hideyoshi hands you the castle and goes on to the Bessho at Miki. You settle behind
          the walls of Kozuki with your retainers, ready for the Mori.
      - label: "Refuse, and ask for a force in Izumo"
        legitimacy_bp: -500
        outcome: >-
          Hideyoshi laughs politely. The only castle he is willing to give you is the one
          he has offered.
      - label: "Ask to serve in Hideyoshi's field army"
        legitimacy_bp: 300
        deeds: {men: 2000}
        outcome: >-
          You ask for a place beside Hideyoshi in the field instead of a castle. He gives you
          a command in his own army and a share of its fortunes, but nothing that is yours to
          hold.
    history: >-
      In December 1577 Hideyoshi took Kozuki and entrusted it to Amago Katsuhisa and Yamanaka
      Yukimori.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ama_fall
    scenario: sengoku
    civ: amago
    year: 1578
    title: "The Order from Azuchi"
    place: "Kozuki castle, Harima"
    speaker: oda
    speaker_name: "Hashiba Hideyoshi"
    speaker_title: "By letter"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      You are Amago Katsuhisa. Over the spring the Mori armies - Kikkawa Motoharu and
      Kobayakawa Takakage with a very large army - have surrounded Kozuki. Hideyoshi
      marched to relieve you, but the Bessho of Miki have turned against Nobunaga and he cannot
      be in two places. Nobunaga's order is to leave Kozuki to its fate and take Miki first.


      Your garrison is small. The Mori will spare the soldiers if you
      yield. Your own life is another matter.
    choices:
      - label: "Yield the castle on the garrison's behalf"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          In the seventh month you surrender. You take your own life, and the garrison is
          spared. Yamanaka Shikanosuke is taken to be sent to Mori Terumoto; on the way, at the
          crossing of the Abe river in Bitchu, the Mori have him killed. The long attempt to
          restore the Amago is finished. Later tellers make Shikanosuke the great loyalist
          of the Sengoku age, the man who asked for seven hardships and eight sorrows - and
          got them.
        deeds: {ruler_falls: "kills himself at Kozuki"}
      - label: "Hold out for Hideyoshi's relief"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Another week of siege. The Mori engineers dig and the wells grow low.
      - label: "Treat with Kikkawa Motoharu for the garrison"
        legitimacy_bp: -1500
        deeds: {peace_with: [mori]}
        outcome: >-
          You send an envoy to the Mori lines to ask for the garrison to go free. The Mori
          demand the castle and the leaders; the talk goes on while the wells run low.
    history: >-
      Kozuki fell to the Mori in July 1578 after Nobunaga ordered Hideyoshi to abandon it for
      Miki; Amago Katsuhisa died by his own hand and Yamanaka Yukimori was killed by the Mori.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Mori-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]
