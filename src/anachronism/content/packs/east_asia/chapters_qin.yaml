schema_version: 1
# Chronicle mode (D-120): Qin from Shang Yang's reforms to the first emperor, 350-221 BC.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow Sima Qian (Shiji, the annals of Qin and the lives of Shang Yang, Zhang Yi,
# Bai Qi, Fan Ju, Lü Buwei, Li Si, Jing Ke and Wang Jian) and the Zhanguo ce, with the
# legends the ancients told marked as such; the large numbers of the dead are the
# traditional ones and are surely inflated. benchmark_provinces counts the provinces of this
# map the real Qin held at that date, to measure the player against history.
chapters:
  - id: qin_xianyang
    scenario: warring_states
    civ: qin
    year: -350
    title: "The Second Reform"
    place: "Xianyang, the new capital"
    speaker: steward
    speaker_name: "Wei Yang (Shang Yang)"
    speaker_title: "Grand Chief of the Multitude"
    benchmark_provinces: 3
    story: >-
      Eleven years ago you posted a notice at the south gate of the old capital: fifty
      pieces of gold to whoever would carry a log to the north gate. Nobody believed it.
      One man did it, and was paid, and from that day the people of Qin have known that
      the law means what it says.


      Now Wei Yang, the lean, unsmiling exile from Wey whom men will remember as Lord
      Shang, wants more. The court moves this year to Xianyang, north of the Wei river. He
      would go further: tear up the old field boundaries so that land can be bought and
      sold; gather the villages into counties under magistrates you appoint; make every
      household of five or ten answerable for the crimes of the others; one set of
      weights and measures for the whole state. Rank, he says, should come from the heads
      of enemies taken and the grain delivered - not from birth.


      The great families hate him. They say he is turning men into cattle. They may be
      right. But Qin is poor, half-barbarian in the eyes of the eastern states, and
      surrounded.
    choices:
      - label: "Carry the reform through, whatever the nobles say"
        historical: true
        food_bp: 1500
        legitimacy_bp: 300
        unrest_bp: 500
        influence: {nobility: -1200, guilds: 300}
        deeds: {martial_bp: 4000}
        outcome: >-
          Thirty-one counties are drawn on the map, each with its magistrate. The old
          boundary ridges are ploughed under. When the crown prince breaks the law, Lord
          Shang cannot punish an heir - so he brands the prince's tutor and cuts off the
          nose of his guardian. After that, no one in Qin doubts that the law reaches
          everyone. The nobles bide their time.
      - label: "Reform the fields, but spare the great families"
        unrest_bp: 200
        food_bp: 800
        legitimacy_bp: 200
        influence: {nobility: 300}
        deeds: {martial_bp: 1500}
        outcome: >-
          The counties are drawn and the fields opened, but the old lineages keep their
          ranks and their private retainers. Qin grows richer, though not yet stronger
          than its neighbours.
      - label: "Stop here: one revolution is enough"
        legitimacy_bp: 100
        unrest_bp: -300
        influence: {nobility: 800}
        outcome: >-
          Lord Shang bows and says nothing. The court settles into Xianyang; the old
          families breathe again.
    history: >-
      In 350 BC Duke Xiao moved his capital to Xianyang and Shang Yang carried out his
      second reform: counties under appointed officials, private land, standard measures
      (a bronze measuring vessel of his, dated 344 BC, still survives in Shanghai). Over
      the next century these laws made Qin the most efficiently mobilised state in China.
    sources: ["Shiji 68 (Lord Shang)", "Lewis, The Early Chinese Empires (2007)"]

  - id: qin_gongzi_ang
    scenario: warring_states
    civ: qin
    year: -341
    until_year: -334
    title: "A Feast for an Old Friend"
    place: "The Wei frontier, west of the Yellow River"
    speaker: steward
    speaker_name: "Shang Yang"
    speaker_title: "Grand Chief of the Multitude"
    needs_alive: [wei]
    story: >-
      News from the east: at Maling, the state of Qi has trapped the army of Wei in a
      narrow valley. Its strategist Sun Bin - whose kneecaps the Wei general Pang Juan
      once had removed out of jealousy - had a tree stripped and written on: "Pang Juan
      dies beneath this tree." When Pang Juan reached it at night and lit a torch to read
      it, ten thousand crossbows loosed at the light. Wei's crown prince is a prisoner;
      Wei's best army is gone.


      Lord Shang comes to you before the news is cold. Wei, he says, is like a disease in
      Qin's belly: one of the two must swallow the other. Wei holds the lands west of the
      Yellow River that were once Qin's. Now is the moment.


      He has one more thing to say. The commander Wei will send against him is Prince Ang,
      his friend from the days when he was a poor clerk in Wei. He would like to invite the
      prince to a feast.
    choices:
      - label: "Let him invite the prince - and seize him at the feast"
        historical: true
        legitimacy_bp: 300
        influence: {nobility: 300}
        outcome: >-
          Lord Shang writes a warm letter: two old friends should not have to fight; let
          them drink together and make peace. Prince Ang comes. Armed men hidden behind
          the screens seize him at the wine cups, and the leaderless Wei army is cut to
          pieces. Lord Shang is rewarded with fifteen towns and the title by which he will
          be remembered.
        deeds: {war_with: [wei], men: 15000, grudges: {wei: 3000}}
      - label: "Make war on Wei, but fight it openly"
        legitimacy_bp: 200
        outcome: >-
          Qin's armies cross into Wei's western lands in the open. Wei is weakened, but
          its fortresses still stand, and the war will be long.
        deeds: {war_with: [wei], men: 10000}
      - label: "Let Qi and Wei bleed each other. Wait."
        food_bp: 500
        outcome: >-
          Qin tills its fields and watches the east. Lord Shang says that the sick man
          will recover.
    history: >-
      Qi destroyed Wei's army at Maling in 342 or 341 BC. In 340 Shang Yang attacked Wei,
      captured Prince Ang by inviting him to a parley and feast, and routed his army. Wei
      began to give up its lands west of the river, and Shang Yang was enfeoffed with Shang
      - hence his name.
    sources: ["Shiji 65 (Sun Bin)", "Shiji 68"]

  - id: qin_shang_yang_falls
    scenario: warring_states
    civ: qin
    year: -338
    title: "The Fall of Lord Shang"
    place: "Xianyang"
    speaker: ruler
    story: >-
      Duke Xiao is dead. His son - the same prince whose tutor Lord Shang branded - is
      ruler now, and the great families have come to him at once. Lord Shang, they say,
      means to rebel: he has a fief of fifteen towns, his own men, and the whole state
      knows his laws better than it knows its ruler.


      Lord Shang has fled. The story told everywhere is that he tried to stay at an inn
      near the border, and the innkeeper turned him away: under Lord Shang's own law, an
      innkeeper who lodges a man without papers is punished with him. "Alas," he is said to
      have sighed, "that my laws should come to this." Now he is back on his fief, raising
      men.


      The nobles want his death. But the laws he made are the bones of the state.
    choices:
      - label: "Kill the man, keep his laws"
        historical: true
        legitimacy_bp: 800
        unrest_bp: -300
        influence: {nobility: 1200}
        outcome: >-
          Lord Shang is caught at Mianchi. His body is torn apart by chariots in the
          market place as a warning, and his whole family is put to death. Not one of his
          laws is repealed. The nobles have their revenge; the state keeps its machine.
      - label: "Pardon him: Qin needs his mind"
        knowledge_bp: 1000
        legitimacy_bp: -800
        unrest_bp: 500
        influence: {nobility: -1500}
        outcome: >-
          You send Lord Shang your seal and your forgiveness. He returns to court, older
          and more careful. The great families do not forgive you, and they have long
          memories.
      - label: "Kill him and repeal his laws"
        food_bp: -500
        unrest_bp: -600
        legitimacy_bp: 800
        influence: {nobility: 2500}
        outcome: >-
          Lord Shang dies, and his counties are handed back to the great families. The people are glad
          to be free of the mutual-responsibility groups, and the granaries are only a little the
          lighter for it; the nobles thank you loudly.
        deeds: {martial_bp: -3000}
    history: >-
      In 338 BC the new ruler, later King Huiwen, had Shang Yang executed by being torn
      apart by chariots and his family exterminated - but kept every one of his laws. It is
      the great paradox of Qin: it killed its reformer and became exactly what he had
      designed.
    sources: ["Shiji 68", "Shiji 5 (the annals of Qin)"]

  - id: qin_zhang_yi
    scenario: warring_states
    civ: qin
    year: -329
    until_year: -320
    title: "The Man with the Tongue"
    place: "Xianyang"
    speaker: steward
    speaker_name: "Zhang Yi"
    speaker_title: "Wandering persuader, of Wei"
    needs_alive: [wei]
    benchmark_provinces: 5
    story: >-
      A wandering strategist from Wei asks to be heard. Once, the story goes, he was beaten
      half to death in Chu on suspicion of stealing a jade. When he crawled home his wife
      scolded him for studying persuasion instead of farming. He opened his mouth and asked
      her: "Is my tongue still there?" She laughed and said it was. "Then that is enough."


      His name is Zhang Yi. The eastern states, he says, are trying to join in a "vertical"
      alliance, north to south, to shut Qin behind its passes. He would answer with a
      "horizontal" one: bind them to Qin one at a time, with fear and with gifts, so that
      they never stand together. And he would begin with Wei, which is already bleeding:
      let Wei give up the Upper Commandery and the rest of its lands west of the river, and
      Qin will call it a friend.
    choices:
      - label: "Make him chancellor and press Wei"
        historical: true
        legitimacy_bp: 500
        influence: {nobility: 200}
        outcome: >-
          Zhang Yi goes to Wei with Qin's armies at his back. Wei hands over the lands
          west of the river and the Upper Commandery - fifteen counties - and the
          Yellow River becomes Qin's moat. Ruler of a state that has doubled, the lord of
          Qin will soon call himself king.
        deeds: {take: [wei_hexi, wei_shang], peace_with: [wei], grudges: {wei: 2500}}
      - label: "Send him away and trust the army"
        influence: {nobility: 300}
        legitimacy_bp: 200
        outcome: >-
          Zhang Yi shrugs and goes east. Within months he is telling the court of Chu how
          dangerous Qin is.
        deeds: {men: 10000, grudges: {chu: 800}}
      - label: "Send him to Wei as an envoy only"
        legitimacy_bp: 300
        wealth_bp: -400
        deeds: {men: 8000}
        outcome: >-
          Zhang Yi goes to Wei with Qin's letters and a small escort, but without the
          chancellor's seal. Wei listens politely and gives ground slowly, and Qin's court is
          divided on whether the envoy is being used or is using them.
    history: >-
      Wei ceded its lands west of the Yellow River in 330 BC and the Upper Commandery in
      328. Zhang Yi became chancellor of Qin in 328, and in 325 Qin's ruler took the title
      of king. For a generation Zhang Yi's "horizontal" diplomacy and Su Qin's "vertical"
      alliance against Qin were the great game of the age.
    diverged: >-
      Wei no longer stands as it did: Zhang Yi takes his tongue to other courts.
    sources: ["Shiji 70 (Zhang Yi)", "Zhanguo ce"]

  - id: qin_hangu
    scenario: warring_states
    civ: qin
    year: -318
    title: "Five Kings at the Hangu Pass"
    place: "The Hangu Pass"
    speaker: general
    needs_alive: [han, zhao]
    benchmark_provinces: 5
    story: >-
      It has happened at last. Wei, Zhao, Han, Yan and Chu have sworn the vertical
      alliance, and their armies are marching west together under the King of Chu. Scouts
      count their banners for days.


      The Hangu Pass is the door to Qin: a narrow road between high loess walls, where one
      man, the soldiers say, can hold off ten thousand. Behind it lies the Wei valley, the
      granaries, Xianyang.


      Your generals want to hold the pass and wait. Five kings never agree for long. When
      their supplies run out and they start to blame each other, Qin can come down out of
      the mountains and fall on whichever of them is closest.
    choices:
      - label: "Hold the pass, then counter-attack"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          The allies throw themselves at the pass and get nowhere. Chu and Yan barely fight
          at all. When the alliance breaks up, Qin's army comes down and catches Han and Zhao
          at Xiuyu: the reports speak of eighty-two thousand heads taken.
        deeds: {war_with: [han, zhao], men: 30000}
      - label: "Hold the pass and let them go home"
        legitimacy_bp: 300
        outcome: >-
          The allies quarrel and drift away. Qin is safe, and no wiser.
        deeds: {men: 15000}
      - label: "Buy off Chu, the weakest link"
        wealth_bp: -2500
        outcome: >-
          Qin's gold reaches the King of Chu's favourites. Chu's army turns for home, and
          the others follow.
        deeds: {peace_with: [chu]}
    history: >-
      In 318 BC Wei, Zhao, Han, Yan and Chu attacked Qin and were driven back at the Hangu
      Pass. In 317 Qin crushed Han and Zhao at Xiuyu; the Shiji says 82,000 were beheaded.
      The vertical alliance never fully recovered.
    sources: ["Shiji 5", "Shiji 69 (Su Qin)"]

  - id: qin_shu_or_han
    scenario: warring_states
    civ: qin
    year: -316
    until_year: -306
    title: "Shu, or the Nine Cauldrons?"
    place: "The audience hall at Xianyang"
    speaker: general
    speaker_name: "Sima Cuo"
    speaker_title: "General of Qin"
    needs_alive: [shu]
    benchmark_provinces: 7
    story: >-
      Two envoys from beyond the southern mountains: the kingdoms of Shu and Ba are at war
      with each other, and both ask Qin for help. Your two best minds disagree, before the
      whole court, about what to do.


      Zhang Yi says: forget the south. March east, take the Han lands at Yiyang, stand at
      the gates of Luoyang where the Zhou king still sits, and seize the Nine Cauldrons -
      the bronze vessels of the Son of Heaven. Whoever holds them commands all under Heaven.
      Shu is a backwater of barbarians; fighting there wins no fame.


      Sima Cuo says: to be rich, a state needs land; to be strong, its people must be
      prosperous; to be king, it needs virtue. Shu is a land of rich rice fields and
      timber, ruled by a weak king. Taking it harms no one the other states care about. But
      attack the Zhou king and Han, and every state in the east will unite against Qin.
    choices:
      - label: "Sima Cuo: over the mountains to Shu"
        historical: true
        food_bp: 2000
        materials_bp: 1500
        legitimacy_bp: 300
        outcome: >-
          Sima Cuo leads the army south by the plank roads bolted into the cliffs of the
          Qinling. The King of Shu is killed in battle in the autumn; Ba falls soon after.
          Qin has gained a granary as large as itself, behind mountains no enemy can
          cross.
        deeds: {war_with: [shu], conquer: [ba], take: [shu_chengdu], men: 20000}
      - label: "Zhang Yi: east to Luoyang and the Nine Cauldrons"
        food_bp: 600
        materials_bp: 1000
        wealth_bp: 1200
        unrest_bp: 400
        legitimacy_bp: 1600
        outcome: >-
          The army marches east on Yiyang and takes it. The road to Luoyang lies open, and the plunder
          is rich; but every court in the east hears that Qin means to lay hands on the vessels of
          Heaven, and their envoys begin riding to one another.
        deeds: {war_with: [han], men: 20000, grudges: {wei: 1500, zhao: 1500, qi: 1500, chu: 1500}}
      - label: "Help neither: let the southern kings fight it out"
        legitimacy_bp: -300
        wealth_bp: 500
        food_bp: 500
        outcome: >-
          The envoys of Shu and Ba go home. In the end Shu swallows Ba, and has a long
          border with Qin.
    history: >-
      The debate is recorded in the Zhanguo ce and the Shiji. King Huiwen sided with Sima
      Cuo, and in 316 BC Qin conquered Shu and then Ba. The Sichuan basin became the
      breadbasket that fed Qin's armies for the next century.
    diverged: >-
      Shu is gone, or changed beyond recognising, before Qin's court ever argued over it.
    sources: ["Zhanguo ce, Qin 1", "Shiji 70", "Sage, Ancient Sichuan and the Unification of China (1992)"]

  - id: qin_six_li
    scenario: warring_states
    civ: qin
    year: -313
    until_year: -306
    title: "Six Hundred Li, or Six?"
    place: "Ying, the court of Chu"
    speaker: steward
    speaker_name: "Zhang Yi"
    speaker_title: "Chancellor of Qin"
    needs_alive: [chu, qi]
    needs_peace_with: [chu]
    benchmark_provinces: 8
    story: >-
      Chu and Qi have bound themselves together, and between them they are larger than
      Qin. Zhang Yi has a plan to break them apart, and he is not ashamed of it.


      He will go to King Huai of Chu and promise him six hundred li of Qin's land in the
      Shang and Wu country - if Chu breaks with Qi. King Huai is greedy and proud. He will
      break with Qi; he may even send a man to insult the King of Qi in his own court, to
      prove it.


      And then, says Zhang Yi, when Chu's envoy comes to collect the land, he will tell him
      that he said six li - six li from his own fief - and that the envoy must have
      misheard.


      If Chu goes to war over the insult, so much the better: it will be fighting alone.
    choices:
      - label: "Let him go to Chu and lie"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          It goes exactly as Zhang Yi said. Chu breaks with Qi and sends a man to curse
          the King of Qi; then the envoy hears "six li". King Huai, beside himself, throws
          his whole army at Qin. At Danyang the Chu army is destroyed - the reports say
          eighty thousand dead and seventy officers captured - and Qin takes the Hanzhong
          valley. A second Chu army is beaten at Lantian, a day's march from Xianyang.
        deeds: {take: [shu_hanzhong], men: 15000, grudges: {chu: 5000}}
      - label: "Offer Chu real land for a real alliance"
        wealth_bp: -1500
        legitimacy_bp: 400
        outcome: >-
          King Huai, astonished, accepts. Qin and Chu become allies, and Qi is left
          alone in the east.
        deeds: {ally_with: [chu]}
      - label: "Leave Chu and Qi alone"
        legitimacy_bp: -200
        wealth_bp: 500
        outcome: >-
          The alliance of Chu and Qi holds, and Qin's eastern road stays blocked.
    history: >-
      In 313 BC Zhang Yi tricked King Huai of Chu into breaking with Qi with the promise
      of 600 li, then claimed to have said six. Chu attacked and was crushed at Danyang in
      312, and Qin took Hanzhong; a second Chu army was beaten at Lantian. The story was
      told for centuries as the classic deceit of the age.
    sources: ["Shiji 70", "Shiji 40 (Chu)"]

  - id: qin_yiyang
    scenario: warring_states
    civ: qin
    year: -308
    until_year: -300
    title: "The Road to the Cauldrons"
    place: "Yiyang, on the road to Luoyang"
    speaker: ruler
    needs_alive: [han]
    needs_owner: {han_yiyang: han}
    benchmark_provinces: 9
    story: >-
      The young King Wu is strong as an ox and loves strong men; his favourite companions
      are wrestlers. He has one dream: to drive through the Three Rivers country in his
      chariot and look upon the house of Zhou. "Then I could die without regret."


      Between him and Luoyang stands Yiyang, the great Han fortress-city, walled and full
      of men. General Gan Mao says it can be taken, but it will be slow, and the court will
      grumble, and Han will appeal to every state in the east. Before he marches, he wants
      the king's oath that he will not be recalled however long the siege lasts.
    choices:
      - label: "Swear the oath and besiege Yiyang"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          The siege lasts five months, and the court grumbles exactly as Gan Mao said.
          The king remembers his oath. Yiyang falls with sixty thousand Han dead, and the
          road to Luoyang lies open. In the Zhou capital the king of Qin asks to see the
          Nine Cauldrons.
        deeds: {take: [han_yiyang], men: 10000, grudges: {han: 3000}}
      - label: "No sieges: Qin cannot wait for months"
        legitimacy_bp: -200
        deeds: {men: 5000}
        food_bp: 500
        outcome: >-
          Gan Mao does not march. The king sulks; Han breathes.
      - label: "Offer Han peace in return for Yiyang"
        legitimacy_bp: 200
        wealth_bp: -500
        deeds: {peace_with: [han]}
        outcome: >-
          You send an envoy to Han with the offer of peace in exchange for the fortress. Han
          is tempted, but the king will not give the walls of his strongest city without a
          fight, and the talks drag on.
    history: >-
      Gan Mao took Yiyang in 307 BC after a five-month siege. King Wu went on to Luoyang
      and, the Shiji says, tried to lift one of the Nine Cauldrons in a contest of strength,
      broke his kneecaps and died. His half-brother became King Zhaoxiang, who reigned for
      fifty-six years.
    diverged: >-
      Yiyang is no longer Han's; the road to Luoyang has already changed hands.
    sources: ["Shiji 5", "Shiji 71 (Gan Mao)"]

  - id: qin_king_huai
    scenario: warring_states
    civ: qin
    year: -299
    until_year: -294
    title: "The King Who Came to Wuguan"
    place: "The Wu Pass"
    speaker: chu
    speaker_name: "King Huai of Chu"
    speaker_title: "King of Chu"
    needs_alive: [chu]
    story: >-
      King Zhaoxiang has written to King Huai of Chu - the same King Huai whom Zhang Yi
      once deceived with six hundred li. Let us meet at the Wu Pass, the letter says, and
      swear a covenant, as kings should.


      King Huai's ministers begged him not to go. The poet Qu Yuan told him that Qin is a
      land of tigers and wolves and cannot be trusted. His youngest son told him that it
      would be rude to refuse. He has come.


      The King of Chu is at the pass now, with a small escort. Behind the gate are your
      soldiers. Your ministers want to close the gate behind him, carry him to Xianyang,
      and keep him until Chu hands over the Wu and Qianzhong commanderies.
    choices:
      - label: "Close the gate behind him"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          King Huai is taken to Xianyang and received not as a king but as a vassal.
          When he refuses to give up the commanderies, he is kept. Chu crowns his son
          instead. Three years later the old king escapes, is caught on the road and
          brought back, and dies a prisoner in Qin. Chu sends his body home, and the
          people of Chu weep for him "as for a lost kinsman".
        deeds: {grudges: {chu: 6000, qi: 1000, wei: 1000}}
      - label: "Swear the covenant, and let him go"
        legitimacy_bp: 600
        outcome: >-
          The two kings drink blood from the same cup. King Huai goes home amazed, and
          Chu and Qin are at peace.
        deeds: {peace_with: [chu]}
      - label: "Let him go home with a demand for land"
        legitimacy_bp: -200
        deeds: {men: 5000, grudges: {chu: 2500}}
        outcome: >-
          You receive King Huai with honour, then name your price: the commanderies of Wu and
          Qianzhong. He refuses, and goes home; Chu does not forget the demand, and neither
          does he.
    history: >-
      In 299 BC King Huai of Chu came to a meeting at the Wu Pass and was seized and taken
      to Xianyang. Chu refused to cede land and enthroned his son. He died a captive in
      296. Qu Yuan, who had warned him, is remembered as China's first great poet.
    sources: ["Shiji 40", "Shiji 84 (Qu Yuan)"]

  - id: qin_yique
    scenario: warring_states
    civ: qin
    year: -294
    title: "A Commoner General"
    place: "Xianyang"
    speaker: general
    speaker_name: "Bai Qi"
    speaker_title: "Left Chief of the Multitude"
    needs_alive: [han, wei]
    benchmark_provinces: 9
    story: >-
      Han and Wei have joined their armies and marched to the Yi Gate, south of Luoyang,
      to win back what Qin has taken. The army against them needs a commander.


      The chancellor, Wei Ran, uncle of the king, puts forward a man nobody at court
      knows: Bai Qi, from the village of Mei, a soldier who rose through Lord Shang's
      ranks by the heads he took. He has no family, no patrons, no friends. He is quiet,
      and the soldiers say he does not lose.


      The great families find it insulting that such a man should command a royal army.
    choices:
      - label: "Give Bai Qi command of the army"
        historical: true
        legitimacy_bp: 600
        influence: {nobility: -300}
        outcome: >-
          Bai Qi sees that each of the allies hopes the other will bear the brunt. He
          feints at the stronger Han army, falls on Wei's, then turns on Han. At Yique the
          allied army ceases to exist: the Shiji says 240,000 heads were taken, and Bai Qi
          captured the enemy commander. No one at court calls him a commoner again.
        deeds: {take: [wei_hedong], men: 20000, grudges: {han: 3000, wei: 3000}}
      - label: "Give the army to a royal prince"
        influence: {nobility: 600}
        outcome: >-
          A prince takes command. He fights bravely and honourably, and Han and Wei go home
          with their armies intact.
        deeds: {war_with: [han, wei], men: 15000}
      - label: "Give the army to Wei Ran, the chancellor"
        legitimacy_bp: 800
        influence: {nobility: 300}
        deeds: {men: 18000, martial_bp: 200}
        outcome: >-
          Wei Ran takes the field himself, with Bai Qi in a lower place under him. The army is
          large and the command is divided, and the allies are not blind to it.
    history: >-
      In 293 BC Bai Qi destroyed the armies of Han and Wei at Yique. It was the first great
      victory of the man who became the most feared general of the age; over his career
      the Shiji credits him with killing nearly a million men.
    sources: ["Shiji 73 (Bai Qi)"]

  - id: qin_emperor_west
    scenario: warring_states
    civ: qin
    year: -288
    title: "Emperor of the West"
    place: "Xianyang"
    speaker: steward
    speaker_name: "Wei Ran, Marquis of Rang"
    speaker_title: "Chancellor of Qin"
    needs_alive: [qi]
    benchmark_provinces: 11
    story: >-
      Every lord of a Warring State is a king now; the title means nothing. The chancellor
      has a bolder idea. Qin and Qi are the two strongest powers, at the two ends of the
      world. Let the King of Qin take the title of Di - the word men use for the gods and
      the sage-rulers of old - as Emperor of the West, and the King of Qi as Emperor of the
      East. Between them they will divide all under Heaven.


      Qi has agreed. The envoys are ready.
    choices:
      - label: "Take the title, and judge the reaction"
        historical: true
        legitimacy_bp: 200
        outcome: >-
          For two months the King of Qin is Emperor of the West. Then a persuader in Qi
          tells its king that the world hates the title and will love whoever gives it up
          first. Qi renounces it; Qin, embarrassed, does the same. The word Di waits.
      - label: "Take the title and keep it"
        legitimacy_bp: 1000
        suspicion_bp: 500
        outcome: >-
          Qin keeps the title alone. In every eastern court it is called arrogance, and
          the envoys begin to talk of a new vertical alliance.
        deeds: {grudges: {qi: 2000, zhao: 2000, wei: 1500, han: 1500, chu: 1500, yan: 1500}}
      - label: "Refuse: a title must be earned"
        legitimacy_bp: 300
        outcome: >-
          Qi takes the title alone and is mocked for it. Qin waits.
    history: >-
      In 288 BC King Zhaoxiang of Qin and King Min of Qi took the titles of Western and
      Eastern Di (emperor) and renounced them about two months later. Sixty-seven years on,
      the first emperor would combine Di with Huang, "august", to make the title Huangdi.
    sources: ["Shiji 5", "Shiji 46 (Tian Qi)"]

  - id: qin_fall_of_qi
    scenario: warring_states
    civ: qin
    year: -285
    until_year: -280
    title: "Five States Against Qi"
    place: "The court of Yan"
    speaker: yan
    speaker_name: "Yue Yi"
    speaker_title: "General of Yan"
    needs_alive: [qi, yan]
    story: >-
      King Min of Qi has swallowed the little state of Song and frightened everyone. Now
      the King of Yan - whose father Qi once humiliated - has sent his general Yue Yi
      around the courts with a proposal: Yan, Zhao, Han, Wei and Qin together, to break Qi
      once and for all.


      Yue Yi is persuasive and very able. He wants Qin's army in the west of Qi, while Yan
      strikes from the north. He asks for nothing in return but that Qin keep its word.
    choices:
      - label: "Join the five states against Qi"
        historical: true
        legitimacy_bp: 400
        wealth_bp: 1500
        outcome: >-
          The allied armies break Qi's main army west of the Ji river. Then the others go
          home, and Yue Yi alone pushes on: he takes the capital Linzi and its treasures,
          and within months more than seventy Qi cities. Only Ju and Jimo hold out. Qi, the
          great rival in the east, is broken.
        deeds: {grudges: {qi: 3000}}
      - label: "Stay out: let them weaken one another"
        food_bp: 1200
        wealth_bp: 500
        legitimacy_bp: 400
        outcome: >-
          Qin watches. Qi is broken without it, and the spoils go to Yan and Zhao; meanwhile grain and
          salt change hands at good prices in the war-starved east. Some at court call you a
          bystander.
      - label: "Warn Qi, and win a friend in the east"
        legitimacy_bp: 300
        outcome: >-
          Qi's king thanks you, and sends gifts, and does nothing useful with the warning.
        deeds: {ally_with: [qi], grudges: {yan: 2000}}
    history: >-
      In 284 BC Yan, Qin, Zhao, Han and Wei attacked Qi. Yue Yi of Yan took Linzi and over
      seventy cities; only Ju and Jimo held out. In 279 Tian Dan of Jimo broke out with a
      herd of oxen with burning reeds tied to their tails, and won Qi back - but Qi never
      again threatened Qin.
    diverged: >-
      The east is no longer the east of Yue Yi's alliance: the war against Qi never comes.
    sources: ["Shiji 80 (Yue Yi)", "Shiji 82 (Tian Dan)"]

  - id: qin_ying
    scenario: warring_states
    civ: qin
    year: -279
    until_year: -270
    title: "The Fall of Ying"
    place: "The Han river, on the border of Chu"
    speaker: general
    speaker_name: "Bai Qi"
    speaker_title: "General of Qin"
    needs_alive: [chu]
    needs_owner: {chu_ying: chu}
    benchmark_provinces: 12
    story: >-
      Chu is the largest state in the world: its lands run from the Han river to the lakes
      of the south, and its kings have called themselves kings for longer than anyone. Its
      capital, Ying, has stood for four hundred years.


      Bai Qi asks for a small army - a few tens of thousands - and leave to go deep into
      Chu without waiting for supplies. He will burn the bridges behind him, he says, so
      that his men know there is no going home except through Ying. On the way he means to
      dam a river and send it into the walled city of Yan.
    choices:
      - label: "Let Bai Qi go"
        historical: true
        legitimacy_bp: 800
        materials_bp: 1500
        outcome: >-
          The river is turned into Yan; the drowned, it is said, were counted in the
          hundreds of thousands. A year later Ying falls, and Bai Qi burns the tombs of the
          kings of Chu at Yiling. Chu's court flees east to Chen. Somewhere on the Miluo
          river, the poet Qu Yuan fills his robe with stones and walks into the water.
        deeds: {take: [chu_ying, chu_qianzhong], men: 15000, grudges: {chu: 5000}}
      - label: "Take the frontier towns, but spare Ying and the tombs"
        materials_bp: 1000
        wealth_bp: 300
        legitimacy_bp: 600
        outcome: >-
          Qin takes a string of towns on the Han river and stops, sparing Ying and the tombs. The
          towns bring grain, tolls and iron. Chu loses land but not its heart.
        deeds: {take: [chu_nanyang], men: 8000, grudges: {chu: 2000}}
      - label: "Peace with Chu"
        wealth_bp: 500
        outcome: >-
          Bai Qi goes home and waits for another king's war.
        deeds: {peace_with: [chu]}
    history: >-
      In 279-278 BC Bai Qi flooded Yan and took Ying, burning the royal tombs at Yiling;
      Chu moved its capital to Chen. The poet Qu Yuan is traditionally said to have drowned
      himself in the Miluo river in grief - the origin of the Dragon Boat festival. In 277
      Qin took Chu's Qianzhong and Wu commanderies too.
    diverged: >-
      Ying is no longer Chu's to lose. Bai Qi's great march south never happens.
    sources: ["Shiji 73", "Shiji 84"]

  - id: qin_yiqu
    scenario: warring_states
    civ: qin
    year: -273
    until_year: -265
    title: "The Queen Dowager and the King of Yiqu"
    place: "The Ganquan palace"
    speaker: steward
    speaker_name: "Queen Dowager Xuan"
    speaker_title: "Mother of the king"
    needs_alive: [yiqu]
    benchmark_provinces: 13
    story: >-
      For two centuries the Yiqu, a people of walled towns on Qin's north-western border,
      have been Qin's oldest enemy. Their king has been coming to the Ganquan palace for
      many years, for the Queen Dowager Xuan - the king's mother, a woman of Chu, the
      most powerful person in Qin - took him as her lover long ago. She has borne him two
      sons.


      Now she comes to you, calm and practical. The Yiqu king is in the palace. His people
      are leaderless without him. The army is ready on the border. She asks only for the
      word.
    choices:
      - label: "Let the Queen Dowager have her way"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          The King of Yiqu is killed in the Ganquan palace, and the army marches the same
          day. Within the year the Yiqu are gone as a state, and their lands become the
          commanderies of Longxi, Beidi and Shang. The Queen Dowager is not asked about the
          two sons, and does not say.
        deeds: {conquer: [yiqu], grudges: {donghu: 1000}}
      - label: "Send the king home unharmed"
        deeds: {men: 5000}
        legitimacy_bp: 400
        influence: {clergy: 300}
        outcome: >-
          The King of Yiqu rides home, never knowing. Qin will have to beat his people in
          the field.
      - label: "Bind the king to you as a vassal"
        legitimacy_bp: 300
        deeds: {tributaries: [yiqu]}
        outcome: >-
          You keep the King of Yiqu at Ganquan as a guest and put it to him that his people
          should be Qin's vassals. He agrees in the palace, and his people do not all agree on
          the border.
    history: >-
      According to the Hou Hanshu, Queen Dowager Xuan had a long affair with the king of
      the Yiqu Rong and bore him two sons; in 272 BC she lured him to the Ganquan palace and
      had him killed, and Qin destroyed the Yiqu. It is one of the strangest stories of the
      age, and the sources tell it plainly.
    diverged: >-
      The Yiqu are already gone; the old story never needs its ending.
    sources: ["Hou Hanshu 87 (the Western Qiang)", "Shiji 110"]

  - id: qin_fan_ju
    scenario: warring_states
    civ: qin
    year: -270
    title: "Befriend the Far, Attack the Near"
    place: "A side gate of the palace"
    speaker: steward
    speaker_name: "Fan Ju"
    speaker_title: "A refugee from Wei"
    benchmark_provinces: 14
    story: >-
      A man who calls himself Zhang Lu has been smuggled into Qin in an envoy's carriage.
      His real name is Fan Ju. In Wei, falsely accused of selling secrets, he was beaten
      until his ribs broke and his teeth came out, rolled up in a mat, thrown in the
      latrine, and pissed on by drunken guests. He lived.


      He has waited a year for an audience. When at last he is brought to the palace he
      pretends not to know the way and wanders into the private apartments, saying loudly
      that he had heard Qin has a Queen Dowager and a Marquis of Rang - but no king.


      Then he says what he came to say. Qin's armies march past Han and Wei to fight Qi,
      far away: every victory there feeds someone else. Make friends with the distant
      states. Devour the near ones, one inch at a time, and every inch you take is yours
      forever.
    choices:
      - label: "Make Fan Ju your counsellor"
        historical: true
        legitimacy_bp: 600
        influence: {nobility: -800}
        outcome: >-
          Fan Ju becomes the king's closest adviser, and in a few years he is chancellor.
          The Marquis of Rang is sent to his fief and the Queen Dowager to her palace; the
          king of Qin rules his own court for the first time. From now on Qin makes peace
          with Qi and Yan and eats Han and Wei, county by county.
        deeds: {peace_with: [qi, yan, chu], grudges: {han: 1500, wei: 1500}}
      - label: "Thank him, and keep to the old ways"
        deeds: {men: 15000}
        legitimacy_bp: 200
        influence: {nobility: 500}
        outcome: >-
          Fan Ju is given a house and a pension. The Marquis of Rang goes on planning wars
          against Qi.
      - label: "Give him a small post and test his plan"
        legitimacy_bp: 800
        influence: {nobility: -200}
        deeds: {peace_with: [yan]}
        outcome: >-
          You give Fan Ju a minor office and watch him. He advises, and you try the plan
          against Han alone before you commit to it.
    history: >-
      Fan Ju reached Qin in about 270 BC and argued for the policy of "befriending the
      distant and attacking the near". He became chancellor in 266, displacing the Marquis
      of Rang and the Queen Dowager. The policy guided Qin until the unification.
    sources: ["Shiji 79 (Fan Ju)"]

  - id: qin_shangdang
    scenario: warring_states
    civ: qin
    year: -262
    until_year: -256
    title: "The Gift of Shangdang"
    place: "The Taihang mountains"
    speaker: zhao
    speaker_name: "Feng Ting"
    speaker_title: "Governor of Shangdang"
    needs_alive: [zhao]
    needs_not_owner: {han_shangdang: qin}
    benchmark_provinces: 14
    story: >-
      Qin has taken Yewang and cut the Han commandery of Shangdang off from the rest of
      Han. Its seventeen walled towns sit on their high plateau, isolated. Han's king,
      terrified, has offered to give Shangdang to Qin.


      But the governor of Shangdang, Feng Ting, would rather be ruled by anyone than Qin.
      He has offered the whole commandery to Zhao instead. Some of Zhao's ministers warned
      their king that this was a trap - that taking it meant war with Qin. Lord Pingyuan
      told him that seventeen cities do not fall into a king's hands every day. The King of
      Zhao has accepted.


      Zhao has the best soldiers in the east, and an old fox of a general, Lian Po.
    choices:
      - label: "Go to war with Zhao over Shangdang"
        historical: true
        legitimacy_bp: 400
        outcome: >-
          Qin's army climbs onto the Shangdang plateau. Lian Po meets it near Changping,
          loses a few skirmishes, and then digs in behind walls and ditches and refuses to
          come out. Month after month, then year after year, two great armies face each
          other on the plateau.
        deeds: {war_with: [zhao], men: 40000}
      - label: "Leave Shangdang, and press Han instead"
        legitimacy_bp: 200
        outcome: >-
          Zhao takes Shangdang and fortifies it. Qin's armies turn on what is left of Han.
        deeds: {war_with: [han], men: 15000}
      - label: "Buy Shangdang's towns from Zhao"
        wealth_bp: -2000
        legitimacy_bp: 300
        deeds: {peace_with: [zhao]}
        outcome: >-
          You send gold and envoys to Handan. Zhao's ministers weigh the offer against the
          gift they have already taken. The king hesitates, and does not sell.
    history: >-
      In 262 BC Han's commandery of Shangdang, cut off by Qin, gave itself to Zhao rather
      than Qin. Qin attacked, and Lian Po held it off for nearly three years from fortified
      lines near Changping.
    diverged: >-
      Shangdang is not Han's to give: the road to Changping runs elsewhere now.
    sources: ["Shiji 73", "Shiji 81 (Lian Po)"]

  - id: qin_changping
    scenario: warring_states
    civ: qin
    year: -260
    until_year: -256
    title: "Changping"
    place: "The Changping valley"
    speaker: general
    speaker_name: "Fan Ju"
    speaker_title: "Chancellor of Qin"
    needs_war_with: [zhao]
    after_choice: {qin_shangdang: 0}
    needs_alive: [zhao]
    benchmark_provinces: 15
    story: >-
      Three years on the plateau, and Lian Po will not come out of his walls. Both states
      are emptying their granaries into this valley.


      Fan Ju has an idea. Spend a thousand pieces of gold in Handan, he says, and spread a
      rumour: the only Zhao general Qin fears is young Zhao Kuo, son of the great Zhao She.
      Lian Po is old and timid and about to surrender. The young King of Zhao is impatient;
      he will believe it. Zhao Kuo has read every book on war and can quote them all. His
      own mother has begged the king not to give him command.


      Then, says Fan Ju, send Bai Qi secretly - and let anyone who reveals that he is
      in command be put to death.
    choices:
      - label: "Spread the rumour; send Bai Qi in secret"
        historical: true
        legitimacy_bp: 600
        unrest_bp: 300
        outcome: >-
          Zhao Kuo replaces Lian Po and attacks at once. Bai Qi falls back, lets him come
          on, and closes behind him with twenty-five thousand men; another five thousand cut
          his lines. The Zhao army starves in a ring for forty-six days. Zhao Kuo dies
          trying to break out, and his army surrenders. Bai Qi says that the men of Zhao are
          changeable and cannot be trusted, and has them put to death. The histories say
          four hundred thousand. Two hundred and forty of the youngest are sent home to
          tell Zhao. Mass graves will still be found in the valley twenty-two centuries
          later.
        deeds: {take: [han_shangdang], grudges: {zhao: 8000, wei: 1500, han: 1500, chu: 1500}}
      - label: "Spread the rumour, and plan for mercy"
        food_bp: -800
        legitimacy_bp: 1300
        outcome: >-
          The ring closes as before, and the army of Zhao surrenders. You order the prisoners marched
          west and settled on new land in Shu and the Wei valley. Feeding them strains the granaries,
          and a few generals mutter that you are raising the next army of Zhao. But in the east, men
          say Qin can be merciful.
        deeds: {take: [han_shangdang], men: 20000, grudges: {zhao: 3000}}
      - label: "✦ Send armoured horsemen round them on stirrups"
        needs_adopted: [stirrup]
        legitimacy_bp: 900
        outcome: >-
          With feet braced in iron stirrups, Qin's heavy horsemen ride round the Zhao lines
          in a single night and stand across the roads to Handan. Zhao Kuo's army, cut off
          on the plateau before it can attack, surrenders within days. The prisoners are
          spared and sent home without weapons. Zhao has lost its army and Shangdang -
          and has no grudge of blood to nurse.
        deeds: {take: [han_shangdang, zhao_jinyang], grudges: {zhao: 2000}}
      - label: "Levy every man at home and press the siege"
        legitimacy_bp: 200
        unrest_bp: 800
        food_bp: -1000
        deeds: {men: 30000}
        outcome: >-
          Qin's king calls up every man of the home counties old enough to bear arms and sends
          them to the plateau. The lines grow thick, and the granaries thin, and Zhao hears of
          it.
    history: >-
      In 260 BC Zhao replaced Lian Po with Zhao Kuo after Qin spread rumours in Handan.
      Bai Qi surrounded his army; after 46 days it surrendered, and the Shiji says 400,000
      prisoners were buried alive or otherwise killed - surely an exaggeration, but
      archaeologists have found mass graves at Gaoping. Changping was the bloodiest battle
      of the age and broke Zhao's power.
    diverged: >-
      There is no war on the plateau: Zhao and Qin never come to Changping.
    sources: ["Shiji 73", "Shiji 81", "Shanxi Provincial Institute, excavation report on Yonglu pit 1 (1996)"]

  - id: qin_handan
    scenario: warring_states
    civ: qin
    year: -258
    until_year: -254
    title: "Handan, and the Stolen Tally"
    place: "Before the walls of Handan"
    speaker: general
    speaker_name: "Bai Qi"
    speaker_title: "Lord Wu'an"
    needs_war_with: [zhao]
    needs_alive: [zhao]
    needs_owner: {zhao_handan: zhao}
    benchmark_provinces: 15
    story: >-
      After Changping, Bai Qi wanted to march straight on Handan. He was stopped: Fan Ju
      grew jealous and persuaded you to accept Zhao's offer of a few towns. Now the King
      of Zhao has broken his word, and you have sent another general to besiege Handan.
      For two years the siege has gone badly. The people of Handan, it is said, are eating
      their children.


      You want Bai Qi to take command. He says no. The moment has passed, he says. Zhao has
      recovered, the other states are coming to its rescue, and Qin's army is far from
      home. When your envoy presses him, he says he is ill.


      In Wei, meanwhile, Lord Xinling - the king's brother - is said to have had the
      tiger tally stolen from the king's bedchamber, the token that commands Wei's army,
      and to be marching on Handan with eighty thousand men. Chu is coming too.
    choices:
      - label: "Order Bai Qi to take command"
        historical: true
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          Bai Qi is stripped of his rank and exiled. On the road from Xianyang a messenger
          brings him a sword. He says: "What crime have I committed against Heaven, to come
          to this?" Then, after a time: "I should die. At Changping I buried hundreds of
          thousands of men who had surrendered." Lord Xinling and the men of Chu break the
          siege; Qin's army is driven back from Handan with great losses.
        deeds: {peace_with: [zhao], grudges: {zhao: 2000, wei: 2000}}
      - label: "Lift the siege, as Bai Qi advises"
        unrest_bp: -200
        legitimacy_bp: 200
        outcome: >-
          The army comes home from Handan in good order. Bai Qi keeps his head, and Qin
          keeps its best general - though Fan Ju does not forgive him for being right.
        deeds: {peace_with: [zhao]}
      - label: "✦ Bring down the walls of Handan with fire-powder"
        needs_adopted: [gunpowder]
        legitimacy_bp: 1000
        outcome: >-
          Sappers tunnel under the walls and pack the galleries with the new black
          powder. At dawn a stretch of the walls of Handan rises into the air and falls into
          the ditch. The city is taken before Lord Xinling's army is three days out of Wei;
          he turns back.
        deeds: {take: [zhao_handan], grudges: {zhao: 4000}}
      - label: "Send a new commander and press the siege"
        legitimacy_bp: 300
        wealth_bp: -800
        deeds: {men: 50000}
        outcome: >-
          You recall the army's old commander and send another to press the siege with fresh
          men. The new levies are brave, and the soldiers of Zhao and its helpers are fresher.
    history: >-
      Qin besieged Handan from 259 BC. Bai Qi refused the command and was ordered to kill
      himself in 257. That year Lord Xinling of Wei, using a tally stolen for him by the
      king's concubine, seized command of Wei's army and, with Chu, relieved Handan - Qin's
      worst defeat of the century.
    diverged: >-
      Qin is not at Handan's walls; the famous siege never begins.
    sources: ["Shiji 73", "Shiji 77 (Lord Xinling)"]

  - id: qin_end_of_zhou
    scenario: warring_states
    civ: qin
    year: -256
    until_year: -248
    title: "The End of the House of Zhou"
    place: "Luoyang"
    speaker: zhou
    speaker_name: "King Nan of Zhou"
    speaker_title: "Son of Heaven"
    needs_alive: [zhou]
    benchmark_provinces: 16
    story: >-
      For eight hundred years the kings of Zhou have been the Sons of Heaven. For four
      hundred of them they have ruled nothing but a few towns around Luoyang, and every
      Warring State has bowed to them while ignoring them.


      King Nan of Zhou is old and in debt. He has been foolish enough to join a league
      against Qin, and now he is frightened. His envoys say he will give up his
      thirty-six towns and his thirty thousand people and come to Xianyang himself, and
      kowtow, if you will spare him.


      The Nine Cauldrons of Yu are in Luoyang.
    choices:
      - label: "Take Zhou's towns and the cauldrons"
        historical: true
        legitimacy_bp: 1500
        suspicion_bp: 300
        outcome: >-
          King Nan comes to Xianyang and bows to the King of Qin. He dies the same year.
          The house that had ruled since the conquest of Shang is ended, and Qin carries
          the Nine Cauldrons west. (The story was later told that one of them fell into the
          Si river on the way, and was never recovered.)
        deeds: {take: [zhou_luoyang], grudges: {wei: 1000, han: 1000, chu: 1000}}
      - label: "Spare the house of Zhou and honour its king"
        legitimacy_bp: 700
        influence: {clergy: 800}
        outcome: >-
          You send King Nan gifts and a promise of protection. The other kings are
          astonished; some are almost grateful.
        deeds: {peace_with: [zhou]}
      - label: "Take the cauldrons, but leave Zhou its towns"
        legitimacy_bp: 1000
        deeds: {tributaries: [zhou]}
        outcome: >-
          You send an officer to carry the Nine Cauldrons west and tell King Nan that he may
          keep his towns and his title. The other courts watch to see whether Qin means it.
    history: >-
      In 256 BC King Nan surrendered to Qin and died; the Zhou dynasty, founded about 1046
      BC, came to an end. Qin destroyed the last Eastern Zhou remnant in 249.
    diverged: >-
      The house of Zhou has already fallen, and not to Qin's choosing.
    sources: ["Shiji 4 (Zhou)", "Shiji 5"]

  - id: qin_dujiangyan
    scenario: warring_states
    civ: qin
    year: -255
    until_year: -245
    title: "The Weir at Dujiangyan"
    place: "Where the Min river leaves the mountains"
    speaker: steward
    speaker_name: "Li Bing"
    speaker_title: "Governor of Shu"
    needs_owner: {shu_chengdu: qin}
    story: >-
      The Min river comes down from the snows of the west and floods the Chengdu plain
      every summer, then leaves it dry. Li Bing, your governor of Shu, has studied it for a
      year.


      He does not want to dam it. He wants to split it: a long artificial island like a
      fish's mouth in the middle of the stream to divide it in two; a spillway to throw
      the floodwater and silt back into the old bed; and a channel cut through the
      mountain to carry the rest out across the plain. The rock is too hard for picks, so
      his men will heat it with fire and crack it with cold water. The dikes will be
      built of long bamboo baskets filled with stones, which the river cannot wash away.


      It will take years, and every pair of hands in Shu.
    choices:
      - label: "Build it as Li Bing says"
        historical: true
        food_bp: 3000
        materials_bp: -1500
        legitimacy_bp: 400
        outcome: >-
          The Fish Mouth divides the Min, the Bottle Neck carries its water out across the
          plain, and every year the people dredge the channels to the depth of stone markers
          Li Bing sets down. The Chengdu plain becomes "the Land of Abundance", which
          never knows famine.
      - label: "✦ Add water wheels along the channels to grind the grain"
        needs_adopted: [water_wheel]
        food_bp: 3500
        materials_bp: -1000
        wealth_bp: 1500
        outcome: >-
          The weir is built, and along its channels great wheels turn day and night,
          grinding the grain of Shu and working the bellows of its iron foundries.
      - label: "Raise levees along the river"
        legitimacy_bp: -200
        materials_bp: 300
        food_bp: 500
        outcome: >-
          The levees hold in a dry year, and break in a wet one.
      - label: "Settle farmers on higher ground"
        legitimacy_bp: 700
        food_bp: 2200
        materials_bp: -500
        unrest_bp: 300
        outcome: >-
          You send settlers to the dry hills above the flood line and give them seed and tools. They
          farm better than you feared, and the new villages are productive; but the river still floods
          the lower fields, and the settlers are restless.
    history: >-
      Li Bing, governor of Shu from about 256 BC, built the Dujiangyan irrigation system.
      It still waters some 5,000 square kilometres of the Chengdu plain today, after more
      than 2,200 years - one of the oldest working water works in the world.
    diverged: >-
      Shu is not Qin's, and the Min river runs wild.
    sources: ["Shiji 29 (Rivers and Canals)", "Huayang guozhi 3"]

  - id: qin_zheng_guo
    scenario: warring_states
    civ: qin
    year: -246
    title: "The Spy Who Dug a Canal"
    place: "Xianyang"
    speaker: ruler
    benchmark_provinces: 17
    story: >-
      The new king is thirteen years old. His name is Ying Zheng; he was born a hostage in
      Handan, and the merchant Lü Buwei, who rules in his name as chancellor, is said by
      some to be his real father.


      A hydraulic engineer from Han, Zheng Guo, has proposed a canal three hundred li long,
      from the Jing river to the Luo, across the dry northern edge of the Wei valley. Work
      has begun. Now a report from your agents: Zheng Guo was sent by the King of Han. The
      canal is a plot to exhaust Qin with labour so that it has no strength left to attack
      Han.


      Zheng Guo, in chains, does not deny it. "I began as a spy," he says. "But when the
      canal is finished, it will profit Qin for ten thousand generations. I have bought
      Han a few years. I will give Qin a granary."
    choices:
      - label: "Let him finish the canal"
        historical: true
        food_bp: 3000
        materials_bp: -1500
        legitimacy_bp: 300
        outcome: >-
          Zheng Guo goes back to his surveying. Ten years later the canal is finished. Its
          silty water turns the salty lands north of the Wei into fields, and Guanzhong
          becomes fertile country that never knows a bad year. Qin grows richer and
          stronger, and Han gains nothing at all.
      - label: "Execute him and abandon the work"
        materials_bp: 1000
        unrest_bp: -300
        outcome: >-
          Zheng Guo is executed and the half-dug canal is left to silt up. The labourers
          go home.
      - label: "Shorten the canal and hold Zheng Guo in chains"
        food_bp: 1500
        materials_bp: -700
        unrest_bp: 200
        outcome: >-
          You keep Zheng Guo in chains and set Qin's own engineers to shorten the canal to
          what the labour can bear. It brings water to part of the Wei valley and not the
          whole of it.
    history: >-
      The Zheng Guo canal, begun about 246 BC, was proposed by a Han engineer to drain
      Qin's strength. The plot was discovered, but the canal was finished; the Shiji says
      it irrigated 40,000 qing (some 2,700 square kilometres) and made Qin rich and strong
      enough to conquer the other states.
    sources: ["Shiji 29", "Shiji 85 (Lü Buwei)"]

  - id: qin_li_si
    scenario: warring_states
    civ: qin
    year: -237
    title: "Expel the Foreigners?"
    place: "Xianyang"
    speaker: steward
    speaker_name: "Li Si"
    speaker_title: "Senior scribe, of Chu"
    benchmark_provinces: 18
    story: >-
      It has been a bad year for foreigners. The palace scandal of Lao Ai - the Queen
      Mother's lover, smuggled into her palace as a false eunuch, who raised a rebellion -
      has been put down, and with it has fallen the chancellor Lü Buwei, a merchant from
      Wey. The canal-digging spy Zheng Guo was from Han. The old families of Qin say it is
      time: an edict to expel every foreign-born official from the state.


      Li Si is one of them. He was a petty clerk in Chu who, watching rats in the latrine
      cower and rats in the granary grow fat, decided that a man's worth depends on where
      he puts himself. He has sent up a memorial from the road. Mount Tai, he writes, does
      not refuse a single clod of earth, and so it is great; the rivers and seas do not
      reject the smallest stream, and so they are deep. Qin's greatest ministers - Shang
      Yang, Zhang Yi, Fan Ju - were all foreigners. Send them away, and you arm your
      enemies with men.
    choices:
      - label: "Rescind the edict; call Li Si back"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 400
        influence: {nobility: -500}
        outcome: >-
          A rider catches Li Si at Lishui and brings him back. The edict is withdrawn.
          Li Si rises to be Minister of Justice, and the cleverest men in the world keep
          coming to Qin.
      - label: "Expel them: Qin for the men of Qin"
        knowledge_bp: -2000
        legitimacy_bp: 200
        influence: {nobility: 1200}
        outcome: >-
          The foreign officials pack their carts and go east. Every court from Han to Qi
          finds itself with able new ministers who know Qin's secrets.
      - label: "✦ Choose all officials by examination, wherever they were born"
        needs_adopted: [civil_service]
        knowledge_bp: 2500
        legitimacy_bp: 700
        influence: {nobility: -1200}
        outcome: >-
          Instead of an edict of expulsion, an edict of examination: any man, from Qin or
          from anywhere, may sit the tests on law, accounts and writing, and the best will
          serve. Qin's offices fill with the able, and the great families find their sons
          must study.
      - label: "Keep them, under Qin overseers"
        knowledge_bp: 1200
        unrest_bp: 200
        legitimacy_bp: 400
        influence: {nobility: 300}
        outcome: >-
          You withdraw the order, but set Qin officers over each foreign minister and require their
          letters to be read. The foreigners stay and the work of government goes on, though some of
          the best are not at ease and the learning of the court grows more slowly.
    history: >-
      In 237 BC, after the Zheng Guo affair and the fall of Lü Buwei, Qin ordered all
      foreign officials expelled. Li Si's "Memorial against the expulsion of guest
      officials", preserved in the Shiji, changed the king's mind. Li Si became the
      architect of the empire's institutions.
    sources: ["Shiji 87 (Li Si)", "Shiji 6 (the first emperor)"]

  - id: qin_han_falls
    scenario: warring_states
    civ: qin
    year: -231
    until_year: -222
    title: "The First of the Six"
    place: "Xinzheng"
    speaker: general
    needs_alive: [han]
    needs_stronger_than: {han: 15000}
    benchmark_provinces: 19
    story: >-
      Han is the smallest and weakest of the great states, squeezed between Qin, Wei and
      Chu. It has given land, sent princes as hostages, sent its finest philosopher - Han
      Fei, whom the king so admired that he said he would die content if he could only talk
      with him, and who died in a Qin prison after Li Si turned against him.


      Han's king, An, has offered to become a vassal. Your general Teng, governor of the
      Southern Commandery, asks for the order to march.
    choices:
      - label: "March: Han ends this year"
        historical: true
        legitimacy_bp: 800
        materials_bp: 1500
        outcome: >-
          Xinzheng falls with hardly a fight. King An is taken prisoner, and Han becomes
          the commandery of Yingchuan. The first of the six states is gone.
        deeds: {war_with: [han], conquer: [han], grudges: {wei: 1500, zhao: 1500, chu: 1500, qi: 1000, yan: 1000}}
      - label: "Accept Han as a vassal"
        wealth_bp: 1400
        legitimacy_bp: 400
        outcome: >-
          King An keeps his title and pays a heavy tribute. The other courts wonder what Qin is
          waiting for.
        deeds: {tributaries: [han]}
      - label: "Take hostages and garrison Han's towns"
        wealth_bp: 500
        legitimacy_bp: 300
        deeds: {men: 8000}
        outcome: >-
          Teng takes the king's sons and heirs as hostages and puts Qin garrisons in Han's
          frontier towns. Han keeps its king and its court, and not much else.
    history: >-
      In 230 BC Qin's general Teng conquered Han and captured King An - the first of the
      six states to fall. Han Fei, whose writings became the bible of the Legalist school,
      had died in prison in Qin in 233.
    diverged: >-
      Han survives, unconquered: Qin is not strong enough to swallow it as history did, or
      Han is no longer there to swallow.
    sources: ["Shiji 6", "Shiji 63 (Han Fei)"]

  - id: qin_li_mu
    scenario: warring_states
    civ: qin
    year: -229
    until_year: -222
    title: "Gold for Guo Kai"
    place: "The Zhao frontier"
    speaker: general
    speaker_name: "Wang Jian"
    speaker_title: "General of Qin"
    needs_alive: [zhao]
    needs_owner: {zhao_handan: zhao}
    needs_stronger_than: {zhao: 12000}
    benchmark_provinces: 21
    story: >-
      Zhao is starving: an earthquake, then a famine. Wang Jian is in the field against it.
      But Zhao still has Li Mu, the general who once lured the Xiongnu horsemen into a trap
      on the northern frontier and killed a hundred thousand of them. Li Mu has beaten Qin
      twice already. As long as he commands, Wang Jian says, Handan will not fall.


      In Handan the king's favourite is a minister called Guo Kai, who loves gold.
    choices:
      - label: "Send gold to Guo Kai"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 600
        outcome: >-
          Guo Kai whispers that Li Mu is plotting with Qin. The king orders him relieved;
          Li Mu refuses to give up his command, and is seized and beheaded. Three months
          later Wang Jian breaks the Zhao army and takes Handan. King Qian is captured.
          A prince flees north to Dai, and calls himself king there.
        deeds: {war_with: [zhao], take: [zhao_handan, zhao_jinyang], grudges: {zhao: 4000}}
      - label: "Meet Li Mu in the field"
        legitimacy_bp: 300
        outcome: >-
          Wang Jian goes on with the war. Li Mu holds the passes, and the war drags on.
        deeds: {war_with: [zhao], men: 30000}
      - label: "Offer Li Mu a high post in Qin"
        wealth_bp: -800
        legitimacy_bp: 200
        deeds: {men: 10000}
        outcome: >-
          Wang Jian's envoy brings Li Mu an offer of rank and lands in Qin. Li Mu sends the
          envoy back with a refusal, and Zhao's court hears that he has been approached.
    history: >-
      In 229 BC Qin bribed the Zhao minister Guo Kai to slander Li Mu, who was executed.
      In 228 Wang Jian took Handan and captured King Qian; Prince Jia ruled a rump state at
      Dai until 222.
    diverged: >-
      Handan is not Zhao's, or Zhao no longer fears Qin: the bribe is never paid.
    sources: ["Shiji 6", "Shiji 81"]

  - id: qin_jing_ke
    scenario: warring_states
    civ: qin
    year: -227
    until_year: -220
    title: "The Map and the Dagger"
    place: "The audience hall at Xianyang"
    speaker: yan
    speaker_name: "Jing Ke"
    speaker_title: "Envoy of Yan"
    needs_alive: [yan]
    story: >-
      Two envoys from Yan have come to surrender: one carries a box with the head of Fan
      Yuqi, a Qin general who deserted to Yan; the other a rolled map of Dukang, the
      richest land of Yan, which Yan offers to Qin. The first of them, Jing Ke, unrolls
      the map before the throne.


      At the end of the map is a dagger, its blade poisoned. He seizes your sleeve with one
      hand and stabs with the other. The sleeve tears. You run behind a pillar; your
      sword is too long to draw. No guard may climb the steps of the throne without an
      order, on pain of death. The court physician throws his bag of medicines at the
      assassin. Someone shouts: "Put the sword on your back!" You draw it over your
      shoulder and cut Jing Ke down.


      He sits against the pillar, laughing, and says he failed only because he wanted to
      take you alive. Prince Dan of Yan sent him.
    choices:
      - label: "Send Wang Jian against Yan"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Wang Jian is sent north. In the next year Ji, the capital of Yan, falls. The King
          of Yan flees to Liaodong, and to appease Qin he has his own son, Prince Dan,
          beheaded and sends the head to Xianyang. It does not save him.
        deeds: {war_with: [yan], take: [yan_ji, yan_yi], grudges: {yan: 6000}}
      - label: "Demand Prince Dan's head from Yan"
        legitimacy_bp: 400
        outcome: >-
          The King of Yan sends the head of his son, and kneels to Qin from afar.
        deeds: {tributaries: [yan]}
      - label: "Strike the Yan border towns, then halt"
        legitimacy_bp: 500
        deeds: {men: 10000, martial_bp: 200}
        outcome: >-
          You send a strong force to take the border towns of Yan and stop. Yan knows what it
          has done, and expects more.
    history: >-
      In 227 BC Jing Ke, sent by Prince Dan of Yan, tried to kill the king of Qin in his
      own hall with a dagger hidden in a map. He failed. Qin took Ji in 226, the King of Yan
      sent Prince Dan's head, and Yan was finally destroyed in 222. The scene was carved on
      Han dynasty tombs for centuries.
    sources: ["Shiji 86 (the assassins)", "Shiji 6"]

  - id: qin_daliang
    scenario: warring_states
    civ: qin
    year: -225
    until_year: -219
    title: "The Flooding of Daliang"
    place: "Daliang, capital of Wei"
    speaker: general
    speaker_name: "Wang Ben"
    speaker_title: "General of Qin, son of Wang Jian"
    needs_alive: [wei]
    needs_stronger_than: {wei: 12000}
    benchmark_provinces: 23
    story: >-
      Daliang, the capital of Wei, has the thickest walls in the world, and Qin's army has
      sat before them for weeks. Wang Ben, the son of Wang Jian, has looked at the canals
      and the Yellow River to the north. Daliang lies low.


      He proposes to cut the dikes and turn the river into the city.
    choices:
      - label: "Turn the river on the walls"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 300
        outcome: >-
          For three months the water rises against the walls of Daliang. They soften, and
          fall. King Jia of Wei surrenders, and Wei - once the strongest state under Heaven
          - becomes three commanderies of Qin.
        deeds: {war_with: [wei], conquer: [wei], grudges: {chu: 1500, qi: 1500}}
      - label: "Besiege Daliang until it starves"
        legitimacy_bp: 200
        food_bp: -1500
        outcome: >-
          The siege drags on into the winter. Daliang does not fall this year.
        deeds: {war_with: [wei], men: 20000}
      - label: "Offer King Jia terms and tribute"
        legitimacy_bp: 400
        wealth_bp: 800
        deeds: {tributaries: [wei]}
        outcome: >-
          You send Wang Ben's heralds to Daliang with an offer: the king may keep his title
          and his temples, and Wei will pay tribute to Qin. The king takes his council.
    history: >-
      In 225 BC Wang Ben flooded Daliang by diverting the Yellow River and its canals;
      after three months the walls collapsed and King Jia of Wei surrendered.
    diverged: >-
      Wei is gone, or Qin is not the giant history made it: Daliang never floods.
    sources: ["Shiji 6", "Shiji 44 (Wei)"]

  - id: qin_chu_falls
    scenario: warring_states
    civ: qin
    year: -224
    until_year: -219
    title: "Six Hundred Thousand Men"
    place: "Xianyang"
    speaker: general
    speaker_name: "Wang Jian"
    speaker_title: "General of Qin"
    needs_alive: [chu]
    needs_stronger_than: {chu: 12000}
    benchmark_provinces: 28
    story: >-
      Last year you asked your generals how many men it would take to conquer Chu. Young
      Li Xin, who had chased Prince Dan of Yan into the swamps, said two hundred thousand.
      Old Wang Jian said six hundred thousand. You thought Wang Jian had grown old and
      timid, and he went home to his estates. Li Xin marched with two hundred thousand, and
      the Chu general Xiang Yan followed him for three days and nights and destroyed his
      army.


      You have driven to Wang Jian's home yourself to apologise. He still says six hundred
      thousand. And, he adds, as you are giving him every soldier in Qin, he would like you
      to promise him good fields and gardens and ponds for his family. He will ask again,
      many times, on the march. (His friends tell you why: a king who has given a general
      every soldier he owns must be sure the general wants nothing more than land.)
    choices:
      - label: "Give Wang Jian the army he asks for"
        historical: true
        legitimacy_bp: 900
        food_bp: -2000
        outcome: >-
          Wang Jian builds a camp and does not move. For a year his soldiers bathe, eat
          well, and throw stones for sport. When the Chu army gives up waiting and moves
          away, he falls on it, kills Xiang Yan, and marches through Chu. King Fuchu is
          captured. The largest state in the world is gone.
        deeds: {war_with: [chu], conquer: [chu], men: 60000, grudges: {qi: 2000, yan: 2000}}
      - label: "Send Li Xin again, with more men"
        food_bp: -1000
        legitimacy_bp: 400
        outcome: >-
          Li Xin goes back with three hundred thousand. Chu holds the line of the Huai for another
          year.
        deeds: {war_with: [chu], men: 30000}
      - label: "Wait a season and levy more men"
        legitimacy_bp: 200
        wealth_bp: -500
        food_bp: -1000
        deeds: {men: 40000}
        outcome: >-
          You send Wang Jian home and keep the army at the Chu border while new levies are
          raised. Chu watches and uses the pause well.
    history: >-
      In 225 BC Li Xin invaded Chu with 200,000 men and was defeated. The king went to Wang
      Jian, who took 600,000; he waited a year in a fortified camp, then destroyed the Chu
      army in 224. Chu fell in 223, and Wang Jian went on to conquer the lands of Yue south
      of the Yangzi in 222.
    diverged: >-
      Chu stands, too large to swallow: the great campaign of Wang Jian is never fought.
    sources: ["Shiji 73 (Wang Jian)", "Shiji 6"]

  - id: qin_all_under_heaven
    scenario: warring_states
    civ: qin
    year: -221
    until_year: -210
    title: "All Under Heaven"
    place: "Xianyang"
    speaker: steward
    speaker_name: "Li Si"
    speaker_title: "Minister of Justice"
    needs_alive: [qi]
    needs_stronger_than: {qi: 12000}
    benchmark_provinces: 38
    story: >-
      Qi is the last. For forty years its king has kept out of every war, trusting to
      Qin's friendship; his chief minister, they say, was paid by Qin to advise exactly
      that. Now Wang Ben's army has marched in from the north, where Yan used to be, and
      there is nobody to fight. The King of Qi has surrendered without a battle.


      For the first time since the legendary emperors, all under Heaven is one. You are
      thirty-eight years old.


      The ministers have proposed a new title: Huangdi, combining the "august" of the
      Three Sovereigns and the "emperor" of the Five Emperors. Your father's
      posthumous names, and yours, will be abolished: you will be the First Emperor, and
      your heirs the Second, the Third, for ten thousand generations.


      Now the question is how to rule it. The chancellor Wang Wan says: make the emperor's
      sons kings in the distant lands of Yan, Qi and Chu, as Zhou did. Li Si says: that is
      how the Zhou ended - sons become cousins, and cousins become enemies. Divide the
      empire into commanderies under governors you appoint, one law, one script, one
      measure, one axle-width for every cart.
    choices:
      - label: "Li Si: commanderies under governors"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 800
        influence: {nobility: -2000}
        outcome: >-
          The empire is divided into thirty-six commanderies. The weapons of the six states
          are melted down and cast into twelve giant bronze statues. The script of Qin
          becomes the script of China; weights, measures, coins and the axles of carts are
          made the same everywhere. A hundred and twenty thousand families of the old
          nobility are moved to Xianyang, where they can be watched.
        deeds: {war_with: [qi], conquer: [qi, yan, zhao, yue]}
      - label: "Wang Wan: kingdoms for the emperor's sons"
        legitimacy_bp: 1000
        influence: {nobility: 1500}
        outcome: >-
          The emperor's sons ride east to rule as kings. For now they are loyal.
        deeds: {war_with: [qi], conquer: [qi, yan, zhao, yue]}
      - label: "✦ Carve the one script on wood blocks and print it for every county"
        needs_adopted: [woodblock_printing]
        legitimacy_bp: 1500
        knowledge_bp: 3000
        influence: {nobility: -1500}
        outcome: >-
          The commanderies are drawn as Li Si wished - but the script is not merely
          decreed. Primers and law codes are carved on wood blocks in Xianyang and printed
          by the cartload, and in a few years every county magistrate and many a village
          elder can read the same characters. A thousand years before history, China
          becomes a land of printed books.
        deeds: {war_with: [qi], conquer: [qi, yan, zhao, yue]}
      - label: "Compromise: commanderies, and kings in the far east"
        legitimacy_bp: 1200
        unrest_bp: 300
        influence: {nobility: 300}
        deeds: {war_with: [qi], conquer: [qi, yan, zhao, yue]}
        outcome: >-
          You divide the heartland into commanderies and give the emperor's sons the far
          provinces of Yan, Qi and Chu as kingdoms. The empire is half one thing and half the
          other.
    history: >-
      In 221 BC Qi surrendered without a fight and Ying Zheng became Qin Shi Huangdi, the
      First Emperor. On Li Si's advice he divided the empire into 36 commanderies and
      standardised script, measures, coinage and axles. The dynasty fell only fifteen years
      later - but the state Qin built, and the name, endured: China.
    diverged: >-
      There is no Qi left to receive the last surrender - the unification, if it comes,
      will come another way.
    sources: ["Shiji 6", "Shiji 87", "Bodde, China's First Unifier (1938)"]
