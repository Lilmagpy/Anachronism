schema_version: 1
# Chronicle mode (D-120, D-160): Goryeo under the Choe dictators and the Mongols, 1211-1274.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Goryeosa and Goryeosa jeolyo, the Yuan shi, Yi Gyu-bo's collected
# writings and the colophons of the Tripitaka Koreana, with modern work by Shultz, Henthorn,
# Breuker, Lee Ki-baik and Seth. The kings reigned; until 1258 the Choe house ruled. The
# chronicle follows the kings, and the Choe speak to them. benchmark_provinces counts the
# provinces of this map the real kingdom held at that date.
chapters:
  - id: gor_huijong
    scenario: great_khan
    civ: goryeo
    year: 1211
    title: "A Paper Screen"
    place: "The royal palace, Kaegyong"
    speaker: steward
    speaker_name: "Wang Jun-myeong"
    speaker_title: "Palace eunuch"
    benchmark_provinces: 4
    story: >-
      You are King Huijong. You were put on the throne by Choe Chung-heon, the general who
      has ruled Goryeo for fifteen years, since he cut down the last strongman and deposed
      your uncle. He appoints the ministers, keeps three thousand armed retainers in his own
      house, and comes to the palace when he pleases.


      Your eunuch Wang Jun-myeong has a plan. Choe is coming to the palace with a petition
      this month. Armed men will be waiting in the corridors. His bodyguards will be kept in
      the outer court, and he will be alone.
    choices:
      - label: "Strike at Choe in the palace"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your men cut down Choe's attendants, but Choe himself hides behind a paper screen in
          the duty-room, and his retainers break in and carry him out alive. Wang Jun-myeong is
          exiled. So are you: to Ganghwa Island, and then to smaller islands still. Choe puts
          your cousin, the old prince who will be King Gangjong, on the throne.
        deeds: {ruler_falls: "is deposed by Choe Chung-heon and exiled"}
      - label: "Send the armed men home and wait"
        legitimacy_bp: -500
        influence: {nobility: 1000}
        outcome: >-
          The armed men are sent home. Choe brings his petition, bows, and leaves. You keep
          your throne, and he keeps the kingdom.
      - label: "Strengthen the palace guard first"
        legitimacy_bp: 300
        wealth_bp: -500
        outcome: >-
          You quietly enlarge the guard about the palace and give its captains your trust. Choe
          sees the new faces at the gates and the next petition is carried by his own men.
        deeds: {men: 1500}
    history: >-
      In 1211 King Huijong's plot to kill Choe Chung-heon in the palace failed; Choe hid,
      was rescued, and deposed Huijong in favour of Gangjong (r. 1211-1213).
    sources: ["Goryeosa 21 (Huijong)", "Goryeosa 129 (Choe Chung-heon)", "Shultz, Generals and Scholars (2000)"]

  - id: gor_gangdong
    scenario: great_khan
    civ: goryeo
    year: 1218
    title: "The Fortress of Gangdong"
    place: "Before the fortress of Gangdong"
    speaker: general
    speaker_name: "Kim Chwi-ryeo"
    speaker_title: "Commander in the north"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      You are King Gojong. Two years ago tens of thousands of Khitans, fleeing the Mongols,
      crossed the Yalu and plundered the north of your kingdom. They have shut themselves in
      the fortress of Gangdong, and the snow is coming.


      Now a Mongol army has arrived, with Jurchen allies, and sent to ask for rice and for
      your help in the siege. Its commanders say that when the Khitans are destroyed, the
      Mongols and Goryeo will be brothers for ever. Your general Kim Chwi-ryeo, who has
      fought the Khitans for two years, would like to see these Mongols for himself.
    choices:
      - label: "Join the Mongols in the siege"
        historical: true
        legitimacy_bp: 1000
        food_bp: -1000
        outcome: >-
          Kim Chwi-ryeo, a head taller than any Mongol, drinks with their commander, and the
          Khitans at Gangdong hang themselves or surrender. The treaty is sworn. The next year,
          the Mongol envoys come to collect what brothers owe: otter skins, silk, paper, by the
          thousand. They throw back what they do not like in the king's face.
        deeds: {martial_bp: 300}
      - label: "Send rice, but no soldiers"
        food_bp: -1500
        legitimacy_bp: -300
        outcome: >-
          The Mongols take the rice and Gangdong on their own. Their envoys remember that you
          held back.
        deeds: {grudges: {mongols: 1000}}
      - label: "Send a small force with the rice"
        legitimacy_bp: 500
        food_bp: -1000
        outcome: >-
          Two or three thousand of your soldiers march north with the rice. They share the
          hardships of the siege and do not share in the planning, and the Mongols say you have
          done something but not enough.
        deeds: {men: 2000}
    history: >-
      In 1218-1219 Goryeo joined a Mongol and Eastern Xia army in taking Gangdong from the
      Khitan invaders, and swore a treaty of brotherhood with the Mongols, who then demanded
      heavy tribute.
    sources: ["Goryeosa 22-23 (Gojong)", "Goryeosa 103 (Kim Chwi-ryeo)", "Henthorn, Korea: The Mongol Invasions (1963)"]

  - id: gor_guju
    scenario: great_khan
    civ: goryeo
    year: 1231
    title: "The Walls of Guju"
    place: "Kaegyong"
    speaker: general
    speaker_name: "Pak Seo"
    speaker_title: "Commander of Guju fortress"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      Six years ago a Mongol envoy was murdered on his way home from your court, nobody knows
      by whom. The Mongols say it was you. Now Saritai has crossed the Yalu with an army.


      At Guju, Pak Seo has held out for months against catapults, fire carts, scaling towers
      and tunnels; he pours molten iron on the towers and water on the fires. An old Mongol
      general who has fought since boyhood says he has never seen a city take such a battering
      and not surrender. But the rest of the north has fallen, and the Mongols are at the
      gates of Kaegyong. Their envoys offer peace, for a price.
    choices:
      - label: "Make peace and pay the Mongols"
        historical: true
        wealth_bp: -3000
        legitimacy_bp: -800
        outcome: >-
          Gold, silver, horses and clothing go north, and you order Pak Seo to open his gates.
          He refuses until the order comes a third time. The Mongols leave seventy-two
          overseers, the darughachi, to govern your northwest, and ride home.
        deeds: {peace_with: [mongols]}
      - label: "Fight on from the walls"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          Guju holds. The countryside around it does not: the Mongols burn it and drive its
          people north.
        deeds: {martial_bp: 500}
      - label: "Pay a lesser sum and keep your garrisons"
        wealth_bp: -1500
        legitimacy_bp: -300
        outcome: >-
          Your envoys offer silver and horses, though not enough, and refuse to hand over the
          northern forts. The Mongols take the gifts and say the matter is not closed.
        deeds: {men: 2000}
    history: >-
      The first Mongol invasion (1231-1232) ended with Goryeo's submission. Pak Seo's defence
      of Guju became famous; the Mongols left darughachi in the northwest.
    diverged: >-
      The Mongols are gone.
    sources: ["Goryeosa 103 (Pak Seo)", "Yuan shi 208 (Gaoli)"]

  - id: gor_ganghwa
    scenario: great_khan
    civ: goryeo
    year: 1232
    title: "The Island Capital"
    place: "Choe U's house, Kaegyong"
    speaker: steward
    speaker_name: "Choe U"
    speaker_title: "Military dictator, son of Choe Chung-heon"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      Choe U, who succeeded his father as master of Goryeo, will not be governed by Mongol
      overseers. Ganghwa Island lies a mile offshore, across a strait with fierce tides. The
      Mongols are horsemen; they have no ships.


      He wants to move the court, the government, the treasury and the families of the
      officials to the island, build a new palace there, and order the people of the
      mainland into the mountain fortresses and onto the islands. Your ministers weep. One
      general who objects is beheaded in front of them.
    choices:
      - label: "Move the court to Ganghwa"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 2500
        outcome: >-
          In the rains of summer the court crosses to Ganghwa. Saritai comes back that winter
          to punish you, and at the little fortress of Cheoin a monk called Kim Yun-hu shoots
          him dead with an arrow. The Mongols go home. The monk refuses the reward. Then they
          come back, again and again, for twenty-five years: Ganghwa is never taken, and the
          mainland is burned from end to end.
        deeds: {grudges: {mongols: 3000}}
      - label: "Stay in Kaegyong and live with the overseers"
        legitimacy_bp: -1500
        wealth_bp: -2000
        influence: {nobility: -1500}
        outcome: >-
          The Choe house will not forgive you. The Mongols take their tribute every year, and
          ask for more.
      - label: "Hold Kaegyong and fortify the north road"
        legitimacy_bp: 300
        materials_bp: -1000
        outcome: >-
          Walls are repaired and the passes north of the capital are manned. Choe U
          is not convinced, and the Mongol horsemen come round the walls.
        deeds: {men: 3000}
    history: >-
      In 1232 Choe U moved the Goryeo court to Ganghwa Island, where it stayed until 1270.
      Saritai was killed at Cheoin by the monk Kim Yun-hu late in 1232.
    diverged: >-
      The Mongols are gone, and the court never needed its island.
    sources: ["Goryeosa 23 (Gojong 19)", "Goryeosa 103 (Kim Yun-hu)", "Shultz, Generals and Scholars (2000)"]

  - id: gor_metal_type
    scenario: great_khan
    civ: goryeo
    year: 1234
    title: "Letters Cast in Bronze"
    place: "Ganghwa Island"
    speaker: scholar
    speaker_name: "Yi Gyu-bo"
    speaker_title: "Poet and minister"
    benchmark_provinces: 4
    story: >-
      The court left its books behind in Kaegyong. Of the great book of state ritual, the
      Prescribed Rites of Past and Present, only one copy came to the island, in Choe U's
      house. The court cannot conduct its ceremonies without it, and it would take years to
      carve the whole thing in wood.


      Your minister Yi Gyu-bo says there is a quicker way. The bronze-founders who cast coins
      and temple bells can cast single letters, each the size of a fingertip, which can be
      set in a frame, inked, printed, taken apart and set again for the next page.
    choices:
      - label: "Cast the letters in bronze"
        historical: true
        knowledge_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          Twenty-eight copies are printed and sent to the ministries. Yi Gyu-bo writes a
          postscript to say how it was done: the first record of printing with metal type,
          two centuries before Gutenberg. The book does not survive; the postscript does.
      - label: "Carve it in wooden blocks"
        knowledge_bp: 3400
        materials_bp: -800
        outcome: >-
          The carvers take three years. The ceremonies wait.
      - label: "✦ Build a press to print with the metal letters"
        needs_adopted: [printing_press]
        knowledge_bp: 5000
        legitimacy_bp: 1000
        outcome: >-
          The bronze letters and a screw press together turn out a page a minute. Every
          magistrate's office on the islands has its own copy within the year, and the
          printers start on the classics.
      - label: "Have scribes copy it out by hand"
        knowledge_bp: 400
        wealth_bp: -400
        outcome: >-
          A hundred scribes copy the one book, a leaf at a time. It is slow and every copy is a
          little different from the next.
    history: >-
      Yi Gyu-bo's collected works record that the Sangjeong gogeum yemun was printed in 28
      copies with cast metal type on Ganghwa, in the 1230s.
    sources: ["Yi Gyu-bo, Tongguk Yi sangguk jip, later collection 11", "Sohn Pow-key, 'Early Korean Printing' (1959)"]

  - id: gor_tripitaka
    scenario: great_khan
    civ: goryeo
    year: 1236
    title: "The Burned Blocks"
    place: "Ganghwa Island"
    speaker: diviner
    speaker_name: "The monk Sugi"
    speaker_title: "Abbot and scholar of the sutras"
    benchmark_provinces: 4
    story: >-
      Two hundred years ago, when the Khitans invaded, the kings of Goryeo carved the whole
      Buddhist canon in wood, and the Khitans went home. The blocks were kept at Buin temple
      near Daegu. The Mongols burned them.


      The monk Sugi asks you to carve them again, better: every text checked against the
      Song and Khitan editions, every error corrected. It will take tens of thousands of
      blocks of seasoned birch and cherry, carved on both sides, and fifteen years.
    choices:
      - label: "Carve the whole canon again"
        historical: true
        knowledge_bp: 1500
        legitimacy_bp: 1500
        wealth_bp: -2000
        influence: {clergy: 2000}
        outcome: >-
          A Directorate is set up on Ganghwa, with a branch on Namhae island. The carvers bow
          three times before every letter, the story goes. In 1251 the work is finished: 81,258
          blocks, some fifty-two million characters, with hardly an error. They are still
          there, at Haein temple, and you can still print from them.
      - label: "Put the money into arms for the fortresses"
        materials_bp: -1500
        legitimacy_bp: 500
        unrest_bp: -300
        outcome: >-
          The money buys armour and bows for the mountain fortresses, and some of it reaches
          them.
        deeds: {men: 5000}
      - label: "Carve only the most needed sutras"
        knowledge_bp: 800
        legitimacy_bp: 1100
        wealth_bp: -800
        influence: {clergy: 800}
        outcome: >-
          A shorter canon of the essential texts is carved on a few thousand blocks. It is quick
          and cheap, and the monks say that a half-canon is no match for the one the Khitans
          feared.
    history: >-
      The second Tripitaka Koreana was carved between 1236 and 1251 under Sugi's editorship;
      its 81,258 blocks are kept at Haeinsa.
    sources: ["Tripitaka Koreana colophons", "Lancaster and Park, The Korean Buddhist Canon (1979)"]

  - id: gor_last_choe
    scenario: great_khan
    civ: goryeo
    year: 1257
    title: "The Last of the Choe"
    place: "Ganghwa Island"
    speaker: general
    speaker_name: "Kim Jun"
    speaker_title: "Retainer of the Choe house, son of a slave"
    benchmark_provinces: 4
    story: >-
      Choe U died in 1249. His son, born to a slave, ruled after him; now his grandson Choe
      Ui is master of Goryeo, young and greedy. Three years ago the Mongol general Jalairtai
      carried off more than two hundred thousand of your people as captives. Famine has come
      to the island itself, and Choe Ui keeps his granaries shut.


      Kim Jun, who rose from slavery in the Choe house, and the officials Yu Gyeong and Pak
      Hui-sil ask your blessing. They will kill Choe Ui and give the kingdom back to its king.
    choices:
      - label: "Give them your blessing"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -1000
        influence: {nobility: -1500}
        outcome: >-
          In the spring of 1258 Choe Ui is cut down, and the Choe granaries are opened to the
          people. Sixty years of Choe rule are over. The rule of the generals is not: within a
          few years Kim Jun himself is the strongman, until he too is killed.
      - label: "Refuse, and keep faith with the Choe"
        legitimacy_bp: -1000
        unrest_bp: 500
        influence: {nobility: 1000}
        outcome: >-
          Kim Jun bows and leaves. Choe Ui does not learn of it, this year.
      - label: "Press Choe Ui to open his granaries"
        legitimacy_bp: 1100
        food_bp: 1000
        influence: {nobility: -500}
        outcome: >-
          A royal messenger carries your wish to Choe Ui. He opens a few storehouses to the
          officials and keeps the rest shut, and his guards are doubled.
    history: >-
      Choe Ui was killed in 1258 by Kim Jun, Yu Gyeong and others, ending the Choe house's
      rule; Kim Jun dominated the court until he was killed in 1268.
    sources: ["Goryeosa 24 (Gojong 45)", "Goryeosa 130 (Kim Jun)", "Shultz, Generals and Scholars (2000)"]

  - id: gor_kublai
    scenario: great_khan
    civ: goryeo
    year: 1259
    title: "A Prince on the Northern Road"
    place: "On the road north of Kaifeng"
    speaker: mongols
    speaker_name: "Kublai"
    speaker_title: "Brother of the Great Khan"
    needs_alive: [mongols]
    benchmark_provinces: 4
    story: >-
      You are King Wonjong. Last year your father sent you, the crown prince, to submit in
      person to the Great Khan Mongke. When you reached China, Mongke was dead of sickness
      outside a Song fortress, and his brothers were racing to take the throne. Your father,
      too, has died while you were away.


      You turned aside to meet one of the brothers, Kublai. He is delighted. Goryeo, he says,
      is the kingdom that even Tang Taizong could not conquer, and now its crown prince has
      come to him of his own accord. He offers to send you home as king, with his favour.
    choices:
      - label: "Take Kublai's offer and go home as king"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Kublai becomes Great Khan and keeps his word. Goryeo keeps its dynasty, its laws and
          its own customs, which no other kingdom the Mongols conquered was promised. In
          return your sons will marry Mongol princesses and grow up at the Khan's court, and
          the court must leave its island.
        deeds: {peace_with: [mongols]}
      - label: "Go home and hold the island against him"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          You slip away from Kublai's camp. Whoever wins the Mongol throne will remember the
          prince who came of himself and left without asking.
        deeds: {men: 3000, grudges: {mongols: 3000}}
      - label: "Send gifts to both brothers and wait"
        legitimacy_bp: 1100
        wealth_bp: 0
        outcome: >-
          You give gifts to Kublai and to his brother Ariq Boke, who also claims the throne,
          and wait to see which of them is stronger. Both thank you, and neither is quite
          pleased.
    history: >-
      Crown Prince Wang Jeon met Kublai in 1259; Gojong died that summer, and Kublai sent the
      prince home as King Wonjong, promising that Goryeo could keep its customs.
    diverged: >-
      The Mongols are gone; there was no Khan to meet.
    sources: ["Goryeosa 25 (Wonjong)", "Yuan shi 4 (Shizu)", "Robinson, Empire's Twilight (2009)"]

  - id: gor_sambyeolcho
    scenario: great_khan
    civ: goryeo
    year: 1270
    title: "The Three Elite Patrols"
    place: "Ganghwa Island"
    speaker: general
    speaker_name: "Bae Jung-son"
    speaker_title: "Commander of the Sambyeolcho"
    needs_alive: [mongols]
    benchmark_provinces: 3
    story: >-
      Kim Jun is dead and his killer, Im Yeon, tried to depose you; Kublai's army put you back
      on your throne. In the northwest, rebels have handed sixty towns to the Mongols. Kublai
      says it is time the court came home from its island to Kaegyong.


      The Sambyeolcho, the elite patrols the Choe raised to fight the Mongols, have been the
      island's army for forty years. Their commander Bae Jung-son says they will not go back
      to be ruled by the Mongols. If you go, he will make another prince king and fight on
      without you.
    choices:
      - label: "Return to Kaegyong and disband the patrols"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 2000
        outcome: >-
          The Sambyeolcho seize a thousand ships and the treasury, crown a royal cousin and
          sail south to Jindo, then to Jeju. It takes three years, and a Mongol army, to
          destroy them. Kublai keeps the northwest, under his own officials, for twenty years.
        deeds: {give: [g_seogyong], give_to: mongols}
      - label: "Stay on the island with the patrols"
        legitimacy_bp: -500
        unrest_bp: 1000
        outcome: >-
          You refuse to cross. Kublai's envoys leave Ganghwa without bowing, and the patrols
          drill on the beaches.
        deeds: {men: 4000, grudges: {mongols: 4000}}
      - label: "Return and make the patrols your royal guard"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Your offer reaches Bae Jung-son at the harbour. He remembers the Mongol envoys, and
          the oaths that were sworn to the Choe, and the men of the patrols are divided.
        deeds: {men: 3000}
    history: >-
      In 1270 the court returned to Kaegyong. The Sambyeolcho rebelled under Bae Jung-son and
      held out on Jindo and Jeju until 1273. The northwest was ruled by the Mongols as
      Dongnyeong prefecture until 1290.
    diverged: >-
      The Mongols are gone.
    sources: ["Goryeosa 26-27 (Wonjong)", "Goryeosa 130 (Bae Jung-son)"]

  - id: gor_ships
    scenario: great_khan
    civ: goryeo
    year: 1274
    title: "Nine Hundred Ships"
    place: "The shipyards of the south coast"
    speaker: general
    speaker_name: "Kim Bang-gyeong"
    speaker_title: "Commander of the Goryeo army"
    needs_alive: [mongols, kamakura]
    benchmark_provinces: 3
    story: >-
      You are King Chungnyeol. You grew up at Kublai's court, and this year you married his
      daughter. Your father is dead.


      Kublai means to conquer Japan, whose shogunate has ignored his letters for six years.
      He has ordered Goryeo to build nine hundred ships in a few months and to send eight
      thousand soldiers and six thousand sailors with them. Thirty thousand of your people are
      cutting timber in the southern hills, and the harvest is rotting in the fields.
    choices:
      - label: "Build the fleet and send the army"
        historical: true
        materials_bp: -3000
        food_bp: -1500
        unrest_bp: 1500
        legitimacy_bp: 500
        outcome: >-
          The ships are built in the Korean way, flat-bottomed and quick. In the autumn the
          fleet takes Tsushima and Iki and lands at Hakata, where the samurai fight hard. One
          night a storm comes up. More than thirteen thousand men do not come home. Kublai
          orders more ships.
        deeds: {grudges: {kamakura: 2000}}
      - label: "Plead famine and build slowly"
        legitimacy_bp: -1000
        materials_bp: -1500
        food_bp: 500
        outcome: >-
          Kublai's envoys count the ships on the slipways and send the numbers to the Khan.
          Your wife writes to her father too.
        deeds: {grudges: {mongols: 1500}}
      - label: "Build half the fleet and send fewer men"
        materials_bp: -1800
        food_bp: -700
        unrest_bp: 800
        legitimacy_bp: 200
        outcome: >-
          Four hundred and fifty ships and a smaller army go to the muster. The Mongol officers
          count them and write down the shortfall.
    history: >-
      Goryeo built the fleet for the first Mongol invasion of Japan (1274), which reached
      Hakata Bay and withdrew after a storm with heavy losses. Kim Bang-gyeong led the Goryeo
      troops.
    diverged: >-
      The Mongols, or the shogunate, are gone; there is no invasion to build for.
    sources: ["Goryeosa 27-28 (Wonjong, Chungnyeol)", "Goryeosa 104 (Kim Bang-gyeong)", "Conlan, In Little Need of Divine Intervention (2001)"]
