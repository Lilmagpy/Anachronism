schema_version: 1
# Chronicle mode (D-120, D-XXX): the Cholas of the Kaveri country, 321-153 BC. This is the
# thinnest chronicle in the pack. No Chola source survives from these years and no Chola king
# is known by name before the Christian era, so you are "the king" throughout, and the
# chapters are the few places where outsiders write the Cholas down. Facts follow Ashoka's
# Rock Edicts II and XIII (the Cholas as independent neighbours, c. 258-256 BC); Sangam
# poems attributed to Mamulanar, which mention the Mauryas (Moriyar) coming south (the poems
# were composed over several centuries and written down much later, perhaps 1st-3rd century
# AD, and cannot be dated to a year); the Mahavamsa (monks of Anuradhapura, written about
# the 5th century AD) for Elara, "a Damila of noble family from the Chola country"; and the
# Hathigumpha inscription of Kharavela of Kalinga, whose date is disputed (early 2nd
# century BC to the 1st; this file takes the early date c. 170 BC, and the chapter says
# so) and which boasts of breaking a league of Tamil lands 113 years old. Modern work by
# Thapar, Sastri, Subbarayalu, Mahadevan, Gunawardana and Olivelle. The great Chola kings of
# the poems (Karikala) belong to later centuries and are not in this chronicle. Year dates
# are approximate and the first chapter's is a guess. benchmark_provinces is 1: this map
# has one province for the Chola country.
chapters:
  - id: chl_moriyar
    scenario: maurya
    civ: chola
    year: -291
    title: "Wheels in the Mountains"
    place: "Uraiyur, by the Kaveri"
    speaker: general
    speaker_name: "A captain of your northern border"
    speaker_title: "Come from the hills"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cholas, lord of the rich rice land of the Kaveri. In the north,
      beyond the hills, there is an empire now whose names are not Tamil. The poets will call
      its people the Moriyar, the Mauryas, and will remember them coming south with a vanguard of
      Vadukar, northerners, and chariots that cut a road through the rocks.


      The poems are much later than these years, and no one can say now which king ruled in
      which valley. But in your own time your captain says the same thing in plainer words:
      an army is coming down from Karnataka, and it is not yours.
    choices:
      - label: "Hold your border and send no tribute"
        historical: true
        legitimacy_bp: 600
        outcome: >-
          The Mauryas come as far as the Karnataka plateau, where Ashoka's inscriptions will
          later stand, and no farther. Forty years on, Ashoka will name the Cholas among his
          neighbours, as free as the Pandyas.
        deeds: {martial_bp: 500}
      - label: "Send gifts to the northern king"
        wealth_bp: -900
        legitimacy_bp: -300
        outcome: >-
          Your gifts are accepted. No ruler of the north is known to have taken tribute from the
          Cholas, but the gifts did not make them any wiser about you.
      - label: "Call the Pandyas and Cheras to meet them together"
        legitimacy_bp: 1000
        unrest_bp: 200
        outcome: >-
          The Pandyas, with whom you have fought for the Kaveri lands for years, think about it,
          and send an answer that means nothing.
        deeds: {peace_with: [pandya]}
    history: >-
      Sangam poems say the Mauryas came south with chariots, perhaps in the time of
      Bindusara. Ashoka's inscriptions in Karnataka mark the limit of his empire in the south;
      the Tamil kingdoms remained outside.
    sources: ["Akananuru 69, 251 (Mamulanar)", "Purananuru 175", "Thapar, Asoka and the Decline of the Mauryas (1961)", "Sastri, History of South India"]

  - id: chl_edicts
    scenario: maurya
    civ: chola
    year: -258
    title: "Physicians from Pataliputra"
    place: "Uraiyur"
    speaker: maurya
    speaker_name: "Officers of King Ashoka"
    speaker_title: "From the north, with medicines"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are the king of the Cholas. Envoys have come from Pataliputra, from the emperor
      Ashoka, who calls himself 'Beloved of the Gods' and is carving his sayings onto rocks all
      over India. They say he wants well-being for everyone: for those in his own empire and for
      those in the neighbouring lands as well.


      In his inscriptions he will name you, Choda, with the Pandyas, the Keralaputras, the
      Satiyaputras and Tambapanni, as foreign neighbours where he has had doctors for men and
      animals, medicinal herbs, wells and shade trees provided. He is also sending
      teachers of his Dhamma, a way of living in which every religion should be respected.
    choices:
      - label: "Receive the physicians and the teachers"
        historical: true
        legitimacy_bp: 500
        unrest_bp: -300
        influence: {clergy: 500}
        outcome: >-
          They dig their wells, and plant their herbs, and go home. We do not know how long
          they stayed, or what you thought of them: no Tamil source mentions it. Ashoka does not
          claim you as subjects, even when he boasts of his 'conquest by Dhamma' in Rock Edict XIII.
      - label: "Turn the envoys back at the border"
        legitimacy_bp: 300
        outcome: >-
          Your court does not like foreign advisers, even helpful ones. The envoys go home, and
          Pataliputra is told the Cholas are proud.
        deeds: {grudges: {maurya: 1500}}
      - label: "Take the physicians, and send the teachers home"
        knowledge_bp: 400
        legitimacy_bp: 300
        unrest_bp: -200
        outcome: >-
          The doctors are welcome: your people value their herbs, and the wells they dig. The
          teachers of the Dhamma are thanked and sent on their way, and your own priests are
          not asked to share the temple steps.
    history: >-
      Ashoka's Rock Edicts II and XIII (about 258-256 BC) name the Cholas (Choda) and
      Pandyas as peoples beyond his borders, where he says he provided medical care and
      sent the Dhamma. The Tamil lands never belonged to the Mauryan empire.
    diverged: >-
      Ashoka's empire is gone; no officers come.
    sources: ["Rock Edict II", "Rock Edict XIII", "Olivelle, Ashoka: Portrait of a Philosopher King (2023)"]

  - id: chl_elara
    scenario: maurya
    civ: chola
    year: -207
    title: "A Nobleman Asks for Ships"
    place: "The harbour at Kaveripattinam"
    speaker: steward
    speaker_name: "Your harbour master"
    speaker_title: "At the quay"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cholas. A nobleman named Elara has come to ask for ships. He wants
      to cross to Lanka, where the king in Anuradhapura is dead and where the throne, he has
      heard, has gone to two foreign horse-dealers, then to a brother of the old king. He has
      men who will follow him.


      This is the story of the Lankan monks, who dislike Tamil kings and do not say that you
      sent him. The Cholas trade rice and cloth to the island already, and a king of Anuradhapura
      who knows your coast might be a useful neighbour; or he might not be.
    choices:
      - label: "Let him sail, with those who will follow"
        historical: true
        unrest_bp: -400
        outcome: >-
          Elara sails with his followers and lands in Lanka. The Mahavamsa says he overthrew King
          Asela and ruled at Anuradhapura for forty-four years, and the same monks, who found him
          an unbeliever, call him just. What the Chola king thought of it, they do not say.
      - label: "Forbid it: Lanka is a friend and a market"
        legitimacy_bp: 300
        wealth_bp: 300
        outcome: >-
          The nobleman goes elsewhere, or he does not. Your rice and cloth go on crossing the
          straits as before.
      - label: "Send him with a royal fleet and an army"
        legitimacy_bp: 400
        outcome: >-
          Elara sails under your banner. A king who sends armies abroad is a king whom
          Anuradhapura will remember.
        deeds: {ships: 4, men: 4000, grudges: {lanka: 2500}}
    history: >-
      The Mahavamsa says a Damila of noble family named Elara came from the Chola country,
      killed King Asela and ruled at Anuradhapura for forty-four years (traditionally c. 205-161
      BC). It does not say the Chola king sent him.
    sources: ["Mahavamsa 21.13-14", "Gunawardana, Robe and Plough (1979)"]

  - id: chl_league
    scenario: maurya
    civ: chola
    year: -168
    title: "The Boast of Kharavela"
    place: "Uraiyur"
    speaker: general
    speaker_name: "An envoy of the king of Kalinga"
    speaker_title: "From the Bay of Bengal"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cholas. A king of Kalinga named Kharavela, a Jain, a builder, and
      a man who likes his deeds written on rock, is said to have sent word down the
      coast. Whether or not an envoy ever reached you, you must decide what to do about Kalinga.


      Kharavela will say in his inscription that in his eleventh year he broke a league of the
      Tamil lands which had lasted a hundred and thirteen years. The inscription is hard to
      read, and when it was cut is itself disputed: some scholars put him in the early
      second century BC, as here, others in the first. It does not name the Cholas, and
      no Tamil source remembers any such league.
    choices:
      - label: "Let the league lapse and keep your army at home"
        historical: true
        legitimacy_bp: -300
        outcome: >-
          Nothing is known of what the Cholas did. The inscription says the league was broken,
          and the Tamil poems say nothing about it. The kings of the south go on with their
          own quarrels.
      - label: "Raise the Pandyas and the Cheras against Kalinga"
        legitimacy_bp: 300
        unrest_bp: 300
        outcome: >-
          The kings agree to meet, and to meet again. Kalinga is a long way off.
        deeds: {men: 4000, peace_with: [pandya]}
      - label: "Send gifts to Kharavela"
        wealth_bp: -800
        outcome: >-
          Kharavela's envoy takes the gifts home, and no doubt reports a Chola who knows his
          place.
    history: >-
      The Hathigumpha inscription at Udayagiri says Kharavela broke a Tamil confederacy of 113 years
      and received tribute from a Pandya king. Its date is disputed; the Cholas are not named in
      it.
    sources: ["Hathigumpha inscription, lines 11 and 13 (disputed readings)", "Sircar, Select Inscriptions", "Salomon, Indian Epigraphy (1998)"]

  - id: chl_dutugemunu
    scenario: maurya
    civ: chola
    year: -159
    title: "News from Anuradhapura"
    place: "The harbour at Kaveripattinam"
    speaker: steward
    speaker_name: "A merchant of the Lanka trade"
    speaker_title: "Just landed"
    benchmark_provinces: 1
    story: >-
      You are the king of the Cholas. A ship from Lanka brings news. Elara, who sailed from this
      coast, is dead after forty-four years on the throne, killed in a duel on elephants by
      Dutugemunu, the prince of Ruhuna in the south of the island. The monks of Anuradhapura are
      singing the prince's praise.


      The merchants say that Dutugemunu has done something odd. He has built a monument over the
      place where Elara died, and ordered that no one should pass it with music. He wishes to honour
      the old king, they say, and to do it quickly.
    choices:
      - label: "Mourn him and do nothing"
        historical: true
        legitimacy_bp: 200
        outcome: >-
          No source records any Chola answer. The Mahavamsa says that the monument to Elara
          was still honoured in the monks' own day, many centuries later. Within sixty years, the
          chronicle says, Tamils will land in Lanka again, and it will tell that as a disaster.
      - label: "Send an army to avenge him"
        unrest_bp: 500
        outcome: >-
          Your army is raised in a season, and the ships are hired on the quay. Lanka is a
          long way off, and Dutugemunu has all the island now.
        deeds: {men: 5000, grudges: {lanka: 3000}}
      - label: "Send an envoy to the new king"
        wealth_bp: -300
        legitimacy_bp: 700
        outcome: >-
          Dutugemunu receives him with honour. The trade goes on.
        deeds: {peace_with: [lanka]}
    history: >-
      The Mahavamsa says Dutugemunu killed Elara in single combat and built a monument to him
      (traditionally c. 161 BC). South Indian invaders reach Lanka again from c. 103 BC. No source
      says what the Chola homeland did in 161.
    sources: ["Mahavamsa 25", "Geiger, Culavamsa and Mahavamsa", "Gunawardana, Robe and Plough (1979)"]
