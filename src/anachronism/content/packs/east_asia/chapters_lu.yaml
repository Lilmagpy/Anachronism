schema_version: 1
# Chronicle mode (D-120, D-XXX): the duchy of Lu, Confucius's homeland, from the age of
# Chu's expansion to its annexation, about 334-256 BC. Each chapter opens in its year; one
# choice is what history chose (historical: true). Facts follow the Shiji (ch. 33, the house
# of Lu; ch. 46 and 47, Qi and Confucius; ch. 41, Yue), the Mencius and the Zhanguo ce, with
# the tale of the closed gate marked as a story. Lu's late dukes are recorded in the Shiji
# with reign lengths only, so dates are approximate: Duke Kang (to about 344), Jing (to about
# 316), Ping (to about 296), Wen (to about 273), Qing (to 249 by the Shiji). The Shiji dates
# Chu's annexation of Lu to 249; the scenario uses 256 (some chronologies give 255). The
# last chapter opens in 260 because the scenario's Chu script takes Qufu in the 258 turn, so
# a 256 chapter could never play. The real Lu held one province on this map throughout. benchmark_provinces counts it.
chapters:
  - id: lu_chu
    scenario: warring_states
    civ: lu
    year: -334
    title: "Chu on the Si"
    place: "Qufu"
    speaker: steward
    speaker_name: "A minister of Lu"
    speaker_title: "At the ancestral temple"
    benchmark_provinces: 1
    story: >-
      You are Duke Jing of Lu. Your house is the house of the Duke of Zhou, whose son was given
      this land when the Zhou kings conquered the east, and you hold the rites of the Zhou
      court as no one else does. You also have a few thousand soldiers.


      To the south, King Wei of Chu has just broken the old kingdom of Yue and killed its king,
      and in the north he has beaten Qi at Xu. The Shiji says nothing of Lu in all this. But Chu is now a great power on your southern road, with Qi on your northern, and Lu lies between them.
    choices:
      - label: "Send gifts to both courts"
        historical: true
        legitimacy_bp: 300
        wealth_bp: -300
        outcome: >-
          Your envoys travel both ways with bronzes and silk. Neither neighbour takes Lu, and
          neither gives it anything. For another eighty years the Duke of Zhou's temple is
          still served by the Duke of Zhou's heirs.
      - label: "Build up your border towns"
        wealth_bp: -400
        outcome: >-
          The towns are fortified. Everyone knows they cannot hold against a real army, and
          both neighbours send questions.
        deeds: {martial_bp: 300}
      - label: "Seek Chu's protection against Qi"
        wealth_bp: -200
        influence: {nobility: 300}
        legitimacy_bp: -300
        outcome: >-
          Chu's envoys accept the compliment and promise nothing. Qi hears that Lu is leaning
          south, and the old courtesy between the two courts cools.
    history: >-
      Chu defeated Yue and Qi about 333 BC (Shiji 41, 40). Lu is not recorded as involved and
      kept its independence.
    sources: ["Shiji 33 (Lu Zhougong)", "Shiji 41 (Yue Wang Goujian)"]

  - id: lu_mencius
    scenario: warring_states
    civ: lu
    year: -312
    title: "The Teacher from Zou"
    place: "Qufu"
    speaker: scholar
    speaker_name: "Yue Zheng"
    speaker_title: "Mencius's disciple"
    benchmark_provinces: 1
    story: >-
      You are Duke Ping of Lu. Mencius, the teacher from Zou who walked from court to court
      telling kings how to rule, has come to Lu. His disciple Yue Zheng is at your court, and
      you have thought of putting Yue Zheng in charge of the government. The Mencius says
      that when the old man heard of it, he could not sleep for joy.


      Your duke's own day is arranged; your carriage waits to take you to visit the teacher.
      Your favourite, Zang Cang, asks why a duke should go to call on a commoner. Mencius, he says, buried his mother with more ceremony than his father, which is not what the rites ask.
    choices:
      - label: "Turn the carriage back"
        historical: true
        legitimacy_bp: -400
        knowledge_bp: -300
        outcome: >-
          You do not go. Yue Zheng comes to ask why. You tell him what Zang Cang said. When
          the words are carried to Mencius, he says that a man may be led to go or to stop, but
          that whether it succeeds is in Heaven's hand, and that Zang can do nothing against
          Heaven. He goes home to Zou and to his books, which will outlast the dukes of Lu.
      - label: "Go to call on Mencius"
        knowledge_bp: 1000
        legitimacy_bp: 500
        influence: {nobility: -500}
        outcome: >-
          You are driven through Qufu to the teacher's lodging. He talks to you; the
          nobles murmur. Yue Zheng takes part of the government, and Lu is, for a few years,
          a little better run.
      - label: "Send Yue Zheng to him with gifts"
        wealth_bp: -200
        knowledge_bp: 400
        outcome: >-
          Mencius receives the gifts courteously, and Yue Zheng takes a part in the government.
          The teacher, who looked for the duke's own visit, stays only a short while before he
          goes home to Zou.
    history: >-
      The Mencius (1B.16, 6B.13) records that Duke Ping of Lu was about to visit Mencius but
      turned back on the advice of Zang Cang, and that Yue Zheng was proposed to govern Lu.
      The meeting did not take place. The date is not given; Duke Ping reigned about 316-296.
    sources: ["Mencius 1B.16", "Mencius 6B.13", "Shiji 33 (Lu Zhougong)"]

  - id: lu_song
    scenario: warring_states
    civ: lu
    year: -286
    title: "Qi Eats Song"
    place: "Qufu"
    speaker: steward
    speaker_name: "A minister of Lu"
    speaker_title: "At the southern gate"
    needs_alive: [qi]
    benchmark_provinces: 1
    story: >-
      You are Duke Wen of Lu. South-west of you, the kingdom of Song has fallen. King Min of
      Qi has taken most of it, with some left over for Wei and Chu. Song was the neighbour
      that kept Qi at arm's length from you; now there is nothing between your border and
      the greatest army in the east.


      Your ministers say that Qi's king may look at the temple of the Duke of Zhou next. Some
      would cut the border with Qi and make friends with Chu. Others would send a mission to
      the Qi court at once.
    choices:
      - label: "Send gifts to Qi's court"
        historical: true
        wealth_bp: -300
        legitimacy_bp: 100
        outcome: >-
          Qi's king takes the gifts and does not come. His mind is on Song and on the other
          great kings. Lu is passed over again.
      - label: "Make friends with Chu"
        legitimacy_bp: 300
        outcome: >-
          Chu sends a polite answer. Qi notes it.
        deeds: {grudges: {qi: 500}}

      - label: "Garrison the Song border"
        wealth_bp: -500
        deeds: {men: 1500}
        outcome: >-
          You muster the levy and put it in the border towns. Qi's king does not test them, but
          the harvest is thin for a year with so many men from the fields.
    history: >-
      Qi annexed Song in 286 BC, sharing parts with Wei and Chu (Shiji 38). Lu is not recorded
      as acting against Qi at this time.
    diverged: >-
      Qi is gone.
    sources: ["Shiji 38 (Song)", "Shiji 33 (Lu Zhougong)"]

  - id: lu_gate
    scenario: warring_states
    civ: lu
    year: -284
    title: "The Fugitive King"
    place: "The gate of Qufu"
    speaker: steward
    speaker_name: "The captain of the gate"
    speaker_title: "At Qufu"
    needs_alive: [qi]
    benchmark_provinces: 1
    story: >-
      You are Duke Wen of Lu. The five-kingdom army of Yan's Yue Yi has broken Qi, and King
      Min, who frightened every state two years ago, has run from his capital. The Shiji says
      he went first to Wey, where the lord gave up his own palace to him and served him as a
      subject, and the king treated the Wey lord with contempt. It adds that he then came towards Zou and Lu with an arrogant air.


      A later story, told in the Zhanguo ce, makes it a scene: the king's retinue demanding
      that Lu receive him with the greatest sacrifice, and that the duke give up his own
      palace and stand attendance on him. The Zhanguo ce is a
      later work, and its scene is a story; the Shiji's own version is shorter. Whatever the
      truth of it, the king's party is now on the road to Qufu, and the gatekeepers wait for
      your word.
    choices:
      - label: "Refuse the king entry"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -300
        outcome: >-
          King Min goes on to Ju, in the south-east. There the Chu general Nao Chi, who has come
          with an army to help Qi, has him put to death. Lu has done nothing and lost nothing,
          and in later generations Confucians will remember the gate.
        deeds: {peace_with: [chu], grudges: {qi: 300}}
      - label: "Receive him as a guest"
        legitimacy_bp: -800
        wealth_bp: -600
        unrest_bp: 500
        outcome: >-
          You give him lodging in the guest-hall and his retinue takes the rest. The people
          of Qufu grumble at the cost, and the Yan army wants to know why.
      - label: "Lodge him outside the walls"
        wealth_bp: -200
        legitimacy_bp: 2200
        deeds: {men: 500}
        outcome: >-
          A guard-post is set up in a lodge beyond the city, and food is sent out. The king's
          party takes offence at the shabby welcome and moves on; the Yan army hears of it.
    history: >-
      In 284 BC King Min of Qi fled his capital and was refused entry by Zou and Lu (Shiji 46);
      the king was killed at Ju by the Chu general Nao Chi. The detailed scene of the gate
      comes from the Zhanguo ce and is a story.
    sources: ["Shiji 46 (Tian Jingzhong Wan)", "Zhanguo ce, Zhao 3"]

  - id: lu_end
    scenario: warring_states
    civ: lu
    year: -260
    title: "The Ancestral Temple"
    place: "Qufu"
    speaker: steward
    speaker_name: "The master of ceremonies"
    speaker_title: "Of the ducal temple"
    needs_alive: [chu]
    benchmark_provinces: 1
    story: >-
      You are Duke Qing of Lu. Since Chu's King Qingxiang moved east after Qin took Ying,
      Chu has been spreading through the old lands of the Huai and the Si, taking small
      states one by one. Lu is one of the last. Its dukes have ruled this land for eight
      centuries, since the Duke of Zhou's son came to it; its temple still keeps the rites,
      and Confucius's family is in Qufu.


      Chu's army is at your border. You have a few thousand men. Qin is far away and busy
      against Zhao. Your master of ceremonies says only that the temple must be saved.
    choices:
      - label: "Submit to Chu"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Chu takes Lu, and you are made a commoner. The Shiji says that the sacrifices of Lu
          ceased, and that Lu had lasted thirty-four generations. Chu's chancellor Lord
          Chunshen will make the philosopher Xunzi the magistrate of Lanling, in the old Lu
          country. The Kong family stays in Qufu, and in 195 BC the first Han emperor will pass through and sacrifice at the tomb of Confucius.
        deeds: {ruler_falls: "is made a commoner when Chu annexes Lu"}
      - label: "Fight at the border"
        legitimacy_bp: -1000
        outcome: >-
          Your army is a few thousand strong. The Chu army is not.
      - label: "Appeal to Qin for help"
        legitimacy_bp: -1500
        wealth_bp: -500
        outcome: >-
          Your envoys go west with the temple's bronzes. Qin is busy against Zhao and sends
          nothing, and the Chu army arrives before they return.
    history: >-
      Chu annexed Lu (256 BC by the usual count; the Shiji's Lu chapter gives 249). Duke Qing
      became a commoner and the sacrifices ended. Chu's Lord Chunshen made Xunzi magistrate of
      Lanling, in the former Lu country, about 255 BC.
    diverged: >-
      Chu is gone.
    sources: ["Shiji 33 (Lu Zhougong)", "Shiji 78 (Lord Chunshen)", "Shiji 74 (Xunzi)"]
