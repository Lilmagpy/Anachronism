schema_version: 1
# Chronicle mode (D-120, D-135): meanwhile, in the world, 321-232 BC (told in a Mauryan chronicle).
almanac:
  - {id: my_ipsus, scenario: maurya, year: -301, text: "At Ipsus in Phrygia, Seleucus's Indian elephants cut off Demetrius's cavalry, and old Antigonus One-Eye dies under a shower of javelins, still waiting for his son to come back and save him."}
  - {id: my_euclid, scenario: maurya, year: -300, text: "In Alexandria, a geometer called Euclid sets down everything the Greeks know about lines, circles and numbers in thirteen books. Schoolchildren will learn from them for two thousand years."}
  - {id: my_qin_shu, scenario: maurya, year: -316, text: "Far to the north-east, beyond the Himalayas, the Chinese state of Qin crosses the Qinling mountains and conquers the land of Shu."}
  - {id: my_lighthouse, scenario: maurya, year: -280, text: "On the island of Pharos at Alexandria, a lighthouse more than a hundred metres tall is finished. Its fire can be seen fifty kilometres out to sea."}
  - {id: my_aristarchus, scenario: maurya, year: -270, text: "On Samos, the astronomer Aristarchus argues that the Earth goes round the Sun, and that the stars are other suns, enormously far away. Almost nobody believes him."}
  - {id: my_rome_italy, scenario: maurya, year: -272, text: "In the far west, Rome takes Tarentum and becomes master of all Italy south of the Po."}
  - {id: my_punic, scenario: maurya, year: -264, text: "Rome and Carthage go to war over Sicily: the first of three wars that will decide who rules the western sea."}
  - {id: my_changping, scenario: maurya, year: -260, text: "In China, the army of Qin surrounds the army of Zhao at Changping; the prisoners, said to number four hundred thousand, are put to death."}
  - {id: my_archimedes, scenario: maurya, year: -250, text: "In Syracuse, Archimedes works out how to measure the volume of a crown by sinking it in water, and is said to run through the streets shouting 'Eureka!'"}
  - {id: my_parthia, scenario: maurya, year: -247, text: "Arsaces, chief of a steppe people called the Parni, seizes the Seleucid province of Parthia. His heirs will rule Persia for nearly five hundred years."}
  - {id: my_eratosthenes, scenario: maurya, year: -240, text: "In Alexandria, Eratosthenes measures the shadow of a stick at noon and works out the size of the Earth - and gets it nearly right."}
