schema_version: 1
# Chronicle mode (D-120, D-XXX): the Macedonian Satraps of the Indus and Hindu Kush, 321-301 BC.
# The state has two real faces. Chapters 1-3 are Eudemus, Alexander's officer on the Indus
# (c. 326-316 BC). From chapter 4 the chronicle speaks for SELEUCUS NICATOR in Babylon: he never
# held the Indus lands himself (his satrapy was Babylonia), but he is the Macedonian who in the
# end dealt with Chandragupta over them, and the game's "Seleucus Nicator" successor is the
# only way to tell that part. His real kingdom (Babylonia, Iran, Bactria) is not on this map,
# so from chapter 4 on the real state held at most Kabul (Paropamisadae), and after the
# treaty (c. 303) nothing: benchmark_provinces is 1 throughout, the lowest the schema allows.
# Facts follow Diodorus 18-20 (Triparadisus, Eudemus and Porus, Eumenes' war, Seleucus' return to
# Babylon), Arrian's Events after Alexander and Anabasis, Justin 15.4, Appian (Syriaca 55),
# Strabo 15.2.9, Plutarch (Alexander 62, Demetrius), with modern work by Bosworth, Grainger and
# Thapar. Dates are approximate: Eudemus' murder of Porus c. 317, Gabiene winter 316/315, the
# Indus crossing c. 305, the treaty c. 303 (some put it 305-303), Megasthenes' embassy c. 302-298.
# The terms of the treaty are debated; see chapter 6. Province choices follow the map, not the
# real boundaries: Gandhara stands for the upper Indus posts (Taxila), Kabul for the Paropamisadae,
# Sindh for the lower Indus (Patala). The Eudemus years are set so that he is still ruler in
# chapter 3 and Seleucus in 4-8 (leader_until -314). Consistency: the Mauryan chronicle (mau_yavanas,
# mau_seleucus) is told from the other side; the Mauryan one has Gandhara passing in the
# treaty, while here it is lost in 317 (Taxila lies east of the Indus), see REPORT.
chapters:
  - id: sat_triparadisus
    scenario: maurya
    civ: satraps
    year: -321
    title: "The Settlement at Triparadisus"
    place: "Taxila, on the upper Indus"
    speaker: steward
    speaker_name: "A Macedonian captain"
    speaker_title: "Of your garrison"
    benchmark_provinces: 3
    story: >-
      You are Eudemus, an officer of Alexander's, who holds the Greek posts on the Indus. The
      king is two years dead, and his marshals have divided the empire between them, then
      fought over it, then divided it again. News has come from Triparadisus in Syria, where
      old Antipater has made the new settlement.


      The kings of the Indus, Porus and Taxiles, are to keep their lands. Another officer,
      Peithon son of Agenor, is named for the Greek colonies of the river. Nobody has asked
      you. The soldiers of your garrison, who have been paid late, want to know whom they
      obey.
    choices:
      - label: "Keep your garrisons and accept the settlement"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          You write to Antipater's officers that the posts are held, and you hold them. The
          settlement is a paper on the far side of Asia; the garrisons are here. Porus, Taxiles
          and you watch each other.
      - label: "Rule the Indus in your own name"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          Your men cheer, and for a season you are king in all but name. The marshals in the
          west remember who did not ask them.
    history: >-
      At Triparadisus (321 BC) Antipater confirmed Porus and Taxiles in their kingdoms and
      named Peithon son of Agenor over the Greek colonies on the Indus. Eudemus had been left
      in command of troops there since the murder of the satrap Philip (c. 325).
    sources: ["Arrian, Events after Alexander 1.36", "Diodorus 18.39.6", "Arrian, Anabasis 6.27.2"]

  - id: sat_porus
    scenario: maurya
    civ: satraps
    year: -318
    title: "The King Who Was Your Guest"
    place: "Your camp on the Indus"
    speaker: general
    speaker_name: "Eumenes' envoys"
    speaker_title: "From Persia"
    benchmark_provinces: 1
    story: >-
      You are Eudemus. The marshals' wars have reached the east. Eumenes of Cardia, the
      cleverest of Alexander's secretaries, has been outlawed by the new masters of Asia, and
      is gathering an army in Persia. He needs elephants. The only large herd of trained
      elephants in the east belongs to King Porus, the same Porus who fought Alexander on the
      Hydaspes.


      Your envoys say the king can be had. He trusts the Greeks, and you are a Greek he knows.
      Meanwhile in the Punjab a young man called Chandragupta is gathering an army of his
      own, and sooner or later he will come to the Indus.
    choices:
      - label: "Kill Porus, take his elephants, and march west to Eumenes"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Diodorus says you killed Porus by treachery and took the elephants, a hundred and
          twenty of them, with your soldiers. The Indus posts are left to whoever wants them. Within a
          few years they will be Chandragupta's. Your column marches out of India for ever.
        deeds: {give: [in_gandhara, in_sindh], give_to: maurya, capital: in_kabul}
      - label: "Stay on the Indus, and let Eumenes find his elephants elsewhere"
        legitimacy_bp: 500
        outcome: >-
          Eumenes sends again, and then he stops sending. Porus is your neighbour still, and
          the young man in the Punjab is another year stronger.
    history: >-
      Eudemus killed Porus by treachery and went west to Eumenes with 120 elephants and his
      troops (c. 318-317 BC, Diodorus 19.14). The Greek posts on the Indus then passed to
      Chandragupta Maurya.
    sources: ["Diodorus 19.14.8", "Justin 15.4.12-13", "Thapar, Asoka and the Decline of the Mauryas (1961)"]

  - id: sat_gabiene
    scenario: maurya
    civ: satraps
    year: -315
    title: "The Elephants of Gabiene"
    place: "The plains of Gabiene, in Persia"
    speaker: general
    speaker_name: "Eumenes"
    speaker_title: "Your commander"
    benchmark_provinces: 1
    story: >-
      You are Eudemus, with Eumenes in the east of Persia. Last autumn, at Paraitakene, you and
      Antigonus One-Eye fought a battle that neither of you could win. Now it is winter, and
      Antigonus comes again.


      Your master wants every elephant on the field. Your soldiers' wagons, with their baggage
      and their families, are in the camp behind. If the camp is lost, the old Silver Shields
      may lose heart. They are the hardest men in Asia, but they are sixty or seventy years
      old.
    choices:
      - label: "Hold your place in the line with the elephants"
        historical: true
        legitimacy_bp: 300
        unrest_bp: 500
        outcome: >-
          Your elephants and the Silver Shields hold their ground, but Antigonus' cavalry
          takes the baggage camp. The Silver Shields sell Eumenes to Antigonus to get their
          families back, and he is put to death. Antigonus puts you to death too.
        deeds: {ruler_falls: "is put to death by Antigonus"}
      - label: "Go over to Antigonus before the fighting"
        legitimacy_bp: -800
        outcome: >-
          Antigonus takes your elephants and thanks you. Whether he would have spared a man
          who changed sides twice, nobody learns.
    history: >-
      After Paraitakene (317) and Gabiene (winter 316/315) Eumenes was handed over and killed;
      Antigonus also put Eudemus to death.
    sources: ["Diodorus 19.26-32, 19.40-44", "Plutarch, Eumenes 15-19"]

  - id: sat_babylon
    scenario: maurya
    civ: satraps
    year: -312
    title: "A Thousand Men for Babylon"
    place: "Gaza, then the road east"
    speaker: ruler
    speaker_name: "Ptolemy"
    speaker_title: "King of Egypt in all but name"
    benchmark_provinces: 1
    story: >-
      From here the chronicle speaks for Seleucus, son of Antiochus, once an officer of
      Alexander's and satrap of Babylonia. He never held the Indus himself. But he is the man
      who in the end settles it with Chandragupta, so the story passes to him.


      You are Seleucus. Four years ago Antigonus drove you out of Babylon and you fled to
      Egypt. Ptolemy and you have just beaten Antigonus' son Demetrius at Gaza. Ptolemy will
      give you a small force to go home with. Babylon remembers you kindly, but Antigonus'
      men hold the citadel.
    choices:
      - label: "Ride for Babylon with what Ptolemy gives you"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Diodorus says you had eight hundred foot and two hundred horse. The people of
          Babylonia, who had liked your rule, welcome you, and the citadel falls. The
          Babylonian priests will date their years from your return, and so will every year
          called Seleucid after.
      - label: "Stay in Egypt as Ptolemy's general"
        legitimacy_bp: -500
        outcome: >-
          You grow old in a good house at Alexandria. Babylonia is Antigonus' for as long as he
          lasts.
    history: >-
      After the Battle of Gaza (312 BC) Seleucus returned to Babylon with a small force from
      Ptolemy and recovered Babylonia; later reckoning, the Seleucid era, starts from this return (311 BC).
    sources: ["Diodorus 19.90-92", "Appian, Syriaca 54", "Grainger, Seleukos Nikator (1990)"]

  - id: sat_indus
    scenario: maurya
    civ: satraps
    year: -306
    title: "The River Again"
    place: "The west bank of the Indus"
    speaker: general
    speaker_name: "Your officers"
    speaker_title: "In the camp"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are Seleucus, lord of Babylon, and for six years you have been marching east. You
      beat Antigonus' men in Media, took the high country, and brought Bactria under your rule. Now you stand where Alexander stood, on the Indus.


      Beyond it is an empire that did not exist when Alexander came: Chandragupta's, which
      has swallowed the Nanda kings and the Greek posts, and which (the Greeks say) fields
      armies of six hundred thousand. Meanwhile the other marshals have begun to call
      themselves kings, and Antigonus has not forgotten you.
    choices:
      - label: "Cross the Indus, and test Chandragupta"
        historical: true
        legitimacy_bp: 600
        unrest_bp: 300
        outcome: >-
          You cross. Appian says there was war, and then friendship; no account of a battle
          survives. Chandragupta has more elephants than you have ever seen.
      - label: "Stay on the west bank and treat from there"
        legitimacy_bp: 300
        outcome: >-
          Chandragupta is not in a hurry. His envoys say he would be glad to talk, for a price.
      - label: "Turn west, now, against Antigonus"
        legitimacy_bp: -300
        outcome: >-
          You march home with the Indus unsettled. In the west, Antigonus gains a year.
    history: >-
      Seleucus crossed the Indus and made war with Chandragupta (c. 305 BC) before they came
      to terms (Appian, Syriaca 55; Justin 15.4).
    diverged: >-
      The Mauryan empire is gone.
    sources: ["Appian, Syriaca 55", "Justin 15.4.20-21", "Plutarch, Alexander 62"]

  - id: sat_elephants
    scenario: maurya
    civ: satraps
    year: -303
    title: "Five Hundred Elephants"
    place: "The border of the two empires"
    speaker: maurya
    speaker_name: "Envoys of Chandragupta"
    speaker_title: "At your tent"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are Seleucus. Chandragupta's envoys offer a treaty, and Antigonus is moving in the
      west. They would take the lands of the Hindu Kush and Arachosia, which Alexander took from
      the Persians and settled with Greeks, and give you elephants.


      Later writers say five hundred, and that you would be bound by a marriage. What the
      marriage was, and what exactly was ceded, is not clear in any source: Strabo is the
      fullest, and he writes two centuries later.
    choices:
      - label: "Cede the eastern lands for five hundred elephants and a marriage tie"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          Strabo says you gave Chandragupta the Paropamisadae, Arachosia and Gedrosia (Hindu
          Kush country) for five hundred elephants and a marriage agreement. Historians still
          argue whether you gave a daughter or only the right to marry across the border.
          With the elephants you turn west.
        deeds: {peace_with: [maurya], give: [in_kabul], give_to: maurya}
      - label: "Refuse, and hold the Hindu Kush"
        legitimacy_bp: 300
        unrest_bp: 800
        food_bp: -1000
        outcome: >-
          You keep the passes, but you keep a war against a state far bigger than yours too,
          while Antigonus comes.
    history: >-
      About 303 BC Seleucus and Chandragupta made a treaty: Seleucus ceded Arachosia, Gedrosia
      and the Paropamisadae for 500 elephants, with a marriage agreement; the elephants fought
      at Ipsus.
    diverged: >-
      The Mauryan empire is gone.
    sources: ["Strabo 15.2.9", "Appian, Syriaca 55", "Plutarch, Alexander 62", "Justin 15.4.21"]

  - id: sat_megasthenes
    scenario: maurya
    civ: satraps
    year: -302
    title: "An Envoy to Pataliputra"
    place: "Arachosia, on the road to India"
    speaker: scholar
    speaker_name: "Megasthenes"
    speaker_title: "A Greek in your service"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are Seleucus. You have made peace with a land you know little about. Megasthenes,
      a Greek who has lived in Arachosia with Sibyrtius, the satrap there, offers to go as
      your ambassador to Pataliputra and to write what he sees.
    choices:
      - label: "Send him as ambassador to Chandragupta's court"
        historical: true
        knowledge_bp: 3000
        legitimacy_bp: 500
        outcome: >-
          Megasthenes goes to Pataliputra and stays, on and off, for years. His account, the
          Indica, is lost, but later Greeks copy it. For centuries he is how the West knows
          India, and he says that the city is surrounded by a timber palisade with five
          hundred and seventy towers.
      - label: "Send a soldier, not a scholar"
        outcome: >-
          Your officer reports on the roads and the elephants. Nobody ever reads it.
    history: >-
      Megasthenes was sent by Seleucus as an envoy to Chandragupta, and his Indica was used by
      Diodorus, Strabo and Arrian; the date is approximate (c. 302-298 BC).
    diverged: >-
      The Mauryan empire is gone.
    sources: ["Arrian, Anabasis 5.6.2", "Strabo 2.1.9", "Arrian, Indica 10", "Trautmann, Arthashastra (1971)"]

  - id: sat_ipsus
    scenario: maurya
    civ: satraps
    year: -301
    title: "Ipsus"
    place: "Phrygia"
    speaker: general
    speaker_name: "Lysimachus' envoy"
    speaker_title: "From the north"
    benchmark_provinces: 1
    story: >-
      You are Seleucus. The other marshals have joined against Antigonus, who is nearly
      eighty and wants the whole of Alexander's empire. Lysimachus and Cassander's men wait for
      you in Phrygia. You have brought the elephants from the Indus.


      Antigonus' son Demetrius has the finest cavalry in the world. If he can be cut off
      from his father's phalanx, the day is won.
    choices:
      - label: "Take the elephants to Phrygia and fight Antigonus"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Demetrius' cavalry charges and wins its fight, but when it turns round, your elephants
          are between it and the phalanx, and the horses will not charge them. Antigonus is
          killed. You take Syria and the east; Lysimachus takes Asia Minor. You are the strongest
          of all Alexander's heirs.
      - label: "Stay in Babylon and leave the war to the others"
        legitimacy_bp: -500
        outcome: >-
          Without elephants, Lysimachus and Cassander have no hope. Antigonus hears of your
          absence and is glad.
    history: >-
      At Ipsus (301 BC) Seleucus' elephants kept Demetrius' cavalry from the phalanx; Antigonus
      was killed and the empire divided among Seleucus, Lysimachus, Cassander and Ptolemy.
    sources: ["Plutarch, Demetrius 28-29", "Diodorus 20.113", "Appian, Syriaca 55"]
