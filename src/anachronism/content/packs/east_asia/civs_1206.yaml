schema_version: 1
# The steppe, China, Korea and Japan in 1206.
civs:
  - id: mongols
    name: Mongols
    adjective: Mongol
    lineage: mongols
    colour: "#4a6fa5"
    emblem: 蒙古
    portrait: steppe
    description: >-
      The tribes of the steppe, just united under one khan at a great assembly by the Onon river.
  - id: onggut
    name: Ongut
    adjective: Ongut
    lineage: onggut
    colour: "#8fa5c4"
    emblem: 汪古
    portrait: steppe
    description: >-
      Christian Turkic herders who guard the Jin frontier - and have chosen Genghis Khan's side.
  - id: western_xia
    name: Western Xia
    adjective: Tangut
    lineage: western_xia
    colour: "#b5651d"
    emblem: 西夏
    portrait: court
    description: >-
      The Tangut empire of the Yellow River bend and the Silk Road, with its own script and a devout Buddhist court.
  - id: jurchen_jin
    name: Jin
    adjective: Jurchen
    lineage: jurchen_jin
    colour: "#c9a227"
    emblem: 大金
    portrait: court
    description: >-
      The Jurchen dynasty ruling northern China from Zhongdu, rich, cultured - and grown soft.
  - id: southern_song
    name: Southern Song
    adjective: Song
    lineage: southern_song
    colour: "#c0392b"
    emblem: 南宋
    portrait: court
    description: >-
      The richest, most inventive state on earth: printing, paper money, the compass, gunpowder weapons and great sea-going junks.
  - id: goryeo
    name: Goryeo
    adjective: Goryeo
    lineage: goryeo
    colour: "#1e5aa8"
    emblem: 高麗
    portrait: court
    description: >-
      A Buddhist kingdom of celadon and printed sutras, where the Choe military family rules behind the throne.
  - id: kamakura
    name: Kamakura shogunate
    adjective: Japanese
    lineage: kamakura
    colour: "#2c3e50"
    emblem: 鎌倉
    portrait: samurai
    description: >-
      Japan under its first warrior government, ruled from Kamakura in the name of a boy shogun.
  - id: kara_khitai
    name: Qara Khitai
    adjective: Khitan
    lineage: kara_khitai
    colour: "#7a4f9c"
    emblem: 西遼
    portrait: steppe
    description: >-
      The Western Liao, Khitan exiles ruling the cities of Central Asia, their power fading.
  - id: uyghurs
    name: Uyghurs of Qocho
    adjective: Uyghur
    lineage: uyghurs
    colour: "#16a085"
    emblem: 高昌
    portrait: steppe
    description: >-
      Buddhist oasis-dwellers of Turfan, scribes and merchants of the Silk Road, whose script the Mongols have just adopted.
  - id: dali
    name: Dali
    adjective: Dali
    lineage: dali
    colour: "#d35400"
    emblem: 大理
    portrait: southern
    description: >-
      A Buddhist kingdom in the mountains of Yunnan, between Song China, Tibet and Southeast Asia.
