schema_version: 1
# Chronicle mode (D-120, D-188): Otomo Sorin and his house, from the Funai hospital to the
# loss of Bungo, 1560-1593. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow Luis Frois's Historia de Japam and the Jesuit annual
# letters, the Otomo family papers (Otomo-ke monjo), Gualtieri's account of the Tensho
# embassy, and modern work by Boxer, Elison, Turnbull and Berry. Dates are as given in
# modern histories; Sorin's baptism is placed in 1578 and the battle of Mimigawa in the
# winter of that year (Tensho 6). Sorin's retirement in 1562 is ignored: the chronicle keeps
# him as the ruling will of the house until his death in 1587, as the Jesuits did. The map
# is coarse: Bungo is the only province of this map the Otomo held securely; their lands in
# Buzen, Chikuzen and Chikugo lie inside other provinces here, so benchmark_provinces is 1
# throughout (in 1593 the real house held none, but the benchmark cannot be lower than 1).
# Yoshimune's age at taking over (1587, born 1558) is exact; Sorin's age is as in the scenario.
chapters:
  - id: oto_funai
    scenario: sengoku
    civ: otomo
    year: 1560
    title: "The Hospital at Funai"
    place: "Funai, capital of Bungo"
    speaker: scholar
    speaker_name: "Luis de Almeida"
    speaker_title: "A Portuguese surgeon turned Jesuit brother"
    benchmark_provinces: 1
    story: >-
      You are Otomo Yoshishige, lord of Bungo, thirty years old, the richest and best placed
      of the lords of Kyushu. Your harbour at Funai is open to the Portuguese ships, and
      their cargoes of silk and silver, lead and gunpowder make you richer each year. Nine years
      ago you received the Jesuit Francis Xavier in your palace, and asked him long questions
      about the heavens and the soul.


      Three years ago a Portuguese surgeon, Luis de Almeida, opened a hospital in your capital,
      with Western medicine and a ward for the poor. Your Buddhist priests are furious: they
      say the foreigners will bring your house bad luck. The Jesuits say that if you protect
      them, more ships will come.
    choices:
      - label: "Protect the Jesuits and their hospital"
        historical: true
        wealth_bp: 1500
        legitimacy_bp: 500
        influence: {clergy: -500}
        outcome: >-
          The hospital stays, a church is built, and the Portuguese ships keep coming. You do not
          become a Christian, not yet. You think of it as the best trade in Kyushu, and the
          priests who run it as very learned men. In time, in your own words to the Jesuits, you
          will think of it as something more.
        deeds: {}
      - label: "Send the foreign priests away"
        wealth_bp: -700
        legitimacy_bp: 500
        influence: {clergy: 1000}
        outcome: >-
          Your monks are delighted. The Portuguese captains take their ships to your rivals' ports,
          and your treasury notices.
      - label: "Let the Jesuits stay, confined to the harbour"
        wealth_bp: 1400
        unrest_bp: 200
        legitimacy_bp: 300
        influence: {clergy: 300}
        outcome: >-
          You allow the priests to keep a house in the port, but forbid them to preach in the town or
          to build a church at Funai. The Portuguese ships keep coming and the treasury gains well;
          neither the priests nor the monks are satisfied, and the townsmen mutter.
    history: >-
      Otomo Yoshishige (Sorin) protected the Jesuit mission at Funai, where Luis de Almeida had
      opened a hospital in 1557, and drew Portuguese trade to his harbour.
    sources: ["Frois, Historia de Japam", "Boxer, The Christian Century in Japan (1951)"]

  - id: oto_mori
    scenario: sengoku
    civ: otomo
    year: 1569
    title: "Fire Behind the Mori"
    place: "Funai"
    speaker: general
    speaker_name: "Tachibana Dosetsu"
    speaker_title: "Your general in Chikuzen"
    needs_alive: [mori]
    benchmark_provinces: 1
    story: >-
      Mori Motonari, master of the west, has crossed the Kanmon strait and taken the Otomo
      lands in Buzen and the port of Hakata. Your armies cannot throw him out of the north of
      Kyushu: his men are many, and his fleet rules the straits.


      But the Mori have many enemies at home. The sons of the old Amago house, holding out in
      Izumo, and a boy of the Ouchi family whom you shelter, would rise if they were paid and
      armed.
    choices:
      - label: "Pay for risings behind the Mori"
        historical: true
        wealth_bp: -1500
        legitimacy_bp: 1500
        outcome: >-
          The Amago and Ouchi rise, and Motonari cannot be in two places. His armies cross back
          to the mainland, and in 1571 he dies, an old man, with the north of Kyushu back in
          your hands.
        deeds: {grudges: {mori: 1500}}
      - label: "Buy peace with a share of the north"
        deeds: {peace_with: [mori]}
        wealth_bp: -1000
        legitimacy_bp: -500
        outcome: >-
          The Mori accept, and keep Hakata. Your generals say what they think of the bargain.
      - label: "Fight on for Buzen with all your men"
        wealth_bp: -800
        unrest_bp: 300
        legitimacy_bp: 1000
        outcome: >-
          You call out every retainer and throw the whole army against the Mori in Buzen. The Mori
          have the straits, and the fighting is long and costly, but your men hold ground, and the
          clans rally to a lord who fights. The levies are tired.
        deeds: {men: 8000}
    history: >-
      In 1569 Otomo Sorin backed the Amago remnants and an Ouchi claimant against the Mori;
      Mori forces withdrew from northern Kyushu and Motonari died in 1571.
    diverged: >-
      The Mori are gone.
    sources: ["Otomo-ke monjo", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: oto_ichijo
    scenario: sengoku
    civ: otomo
    year: 1575
    title: "A Son-in-Law Without a Country"
    place: "Funai"
    speaker: ruler
    speaker_name: "Ichijo Kanesada"
    speaker_title: "Lord of Tosa in exile, your son-in-law"
    needs_alive: [chosokabe]
    benchmark_provinces: 1
    story: >-
      Your daughter is married to Ichijo Kanesada, a court noble who ruled southern Tosa across
      the sea. His own retainers, with the Chosokabe of Tosa behind them, have driven him out
      for being a poor ruler, and he has come to you with his wife and a small hope.


      He asks for ships and soldiers to go back. Your own war with the Shimazu in the south is
      coming. Tosa is a long way off.
    choices:
      - label: "Send him home with ships and men"
        historical: true
        wealth_bp: -1000
        legitimacy_bp: 500
        outcome: >-
          Kanesada lands in Tosa and gathers his old vassals, and meets Chosokabe Motochika at the
          Shimanto river. He is beaten in a day. He sails back, and dies ten years later, a
          pensioner of other men. Tosa is Chosokabe's.
        deeds: {grudges: {chosokabe: 1000}}
      - label: "Keep him at Funai and send letters"
        legitimacy_bp: -300
        wealth_bp: -200
        outcome: >-
          Kanesada lives as your guest, and writes to his old friends, who do not write back.
      - label: "Send him home with silver and a small escort"
        wealth_bp: -300
        legitimacy_bp: 200
        deeds: {men: 1000}
        outcome: >-
          You give Kanesada silver and a small escort, and your blessing, and he sails alone
          for Tosa. His old vassals are more interested in the Chosokabe than in him.
    history: >-
      Ichijo Kanesada, Sorin's son-in-law, was driven from Tosa in 1574 and tried to return with
      Otomo support in 1575; he was defeated by Chosokabe Motochika at the Shimanto river.
    diverged: >-
      The Chosokabe are gone.
    sources: ["Chosokabe-ki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: oto_francisco
    scenario: sengoku
    civ: otomo
    year: 1578
    title: "Francisco"
    place: "Usuki, in Bungo"
    speaker: scholar
    speaker_name: "Francisco Cabral"
    speaker_title: "Superior of the Jesuits in Japan"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      You are a man of forty-eight, a lord who has taken the tonsure of a Buddhist monk and
      called himself Sorin, and who has spent thirty years listening to the Jesuits. Your first wife,
      a fierce enemy of the foreign religion, has been put out of your house, and you have
      taken a Christian wife. Now you ask for baptism, and are given the name Francisco, after Xavier.


      The Ito of Hyuga, driven out by the Shimazu, have come to Bungo to beg for help. You have
      a dream: a realm in Hyuga where there will be no Buddhist temple, and the laws will be
      those of Christ. Your generals say that the Shimazu are many and their guns are good.
    choices:
      - label: "Be baptised, and march south into Hyuga"
        historical: true
        legitimacy_bp: -1000
        unrest_bp: 1500
        influence: {clergy: -1500}
        outcome: >-
          You march with the cross on your banners, and your men burn the temples and shrines of
          Hyuga as they go. On the Mimi river the Otomo army splits in two, quarrelling, and the
          Shimazu catch it. Your best generals die in the water. You go home an old man, and
          never lead an army again. Your vassals, who have never liked the foreign god, begin to
          look at their neighbours.
        deeds: {martial_bp: -1000, grudges: {shimazu: 2000}}
      - label: "Be baptised, but keep your army at home"
        deeds: {men: 2000}
        influence: {clergy: -500}
        legitimacy_bp: 500
        outcome: >-
          You are baptised, and rule Bungo as a quiet and thoughtful Christian prince. The Ito
          leave your court in disgust, and the Shimazu keep Hyuga.
      - label: "Aid the Ito with a small force, baptism later"
        wealth_bp: -500
        legitimacy_bp: 200
        unrest_bp: 500
        deeds: {men: 4000, martial_bp: 200}
        outcome: >-
          You send a small force with the Ito lords and put off your baptism until the spring.
          The Jesuits are patient with you, and your generals are relieved.
    history: >-
      Otomo Sorin was baptised as Francisco in 1578; his army, sent into Hyuga against the
      Shimazu, was destroyed at Mimigawa (Tensho 6).
    diverged: >-
      The Shimazu are gone.
    sources: ["Frois, Historia de Japam", "Elison, Deus Destroyed (1973)", "Boxer, The Christian Century in Japan (1951)"]

  - id: oto_embassy
    scenario: sengoku
    civ: otomo
    year: 1582
    title: "Four Boys for Rome"
    place: "Nagasaki"
    speaker: scholar
    speaker_name: "Alessandro Valignano"
    speaker_title: "Visitor of the Jesuit missions in the East"
    benchmark_provinces: 1
    story: >-
      Your realm is weaker than it was: your vassals have turned on you since Mimigawa, and
      the bear of Hizen is taking your lands from the west. The Jesuit Valignano has a plan to
      show Europe that Japan is Christian. He will send four boys of good family, about thirteen
      years old, to see the King of Spain and the Pope. One of them, Ito Mancio, is your kinsman
      and speaks for you.


      The voyage will take years, and no one can say what Japan will be when they return.
      Valignano says that Christian Europe will think better of the Japanese Church once it
      has seen them.
    choices:
      - label: "Send the embassy to Rome"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        influence: {clergy: -500}
        outcome: >-
          The four sail from Nagasaki in February, bound for Lisbon by way of Goa. They kneel to
          Philip II in Madrid, and to Pope Gregory XIII in Rome in March 1585, and are fed and
          painted and cheered through every town in Italy. The Pope dies a month later. They are
          back in Japan in 1590, when you have been dead three years, and the Jesuits are
          banned.
        deeds: {}
      - label: "Spend the money on guns"
        wealth_bp: 500
        outcome: >-
          Your gunsmiths are pleased. Valignano finds other Christian lords to send his boys,
          and your kinsman Mancio goes to Rome without your name.
        deeds: {martial_bp: 500}
      - label: "Build a college for the Jesuits at Funai"
        knowledge_bp: 600
        wealth_bp: -400
        legitimacy_bp: 200
        outcome: >-
          You give the Jesuits land and money for a college and a printing house at Funai, and
          Valignano is pleased. The money goes into teaching and books.
    history: >-
      The Tensho embassy of four Japanese youths, among them Ito Mancio for Otomo Sorin, left
      Nagasaki in 1582 and met Philip II and Pope Gregory XIII in 1584-85, returning in 1590.
    sources: ["Gualtieri, Relationi della venuta degli ambasciatori giaponesi (1586)", "Boxer, The Christian Century in Japan (1951)"]

  - id: oto_osaka
    scenario: sengoku
    civ: otomo
    year: 1586
    title: "To Osaka, Hat in Hand"
    place: "Osaka castle"
    speaker: oda
    speaker_name: "Toyotomi Hideyoshi"
    speaker_title: "Imperial regent"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      The Shimazu have swallowed Hyuga, Higo and Hizen and are marching north into Bungo. Your
      vassals desert you each week, your sons are weak, and Hizen is gone. You are fifty-six,
      and a monk and a Christian, and there is one man in Japan who can still save you.


      Toyotomi Hideyoshi, who rules from Osaka, has said that he will help any lord who submits.
      Your Jesuits tell you it is a long journey, and that he is not a friend of the Church.
    choices:
      - label: "Go to Osaka to seek Hideyoshi's help"
        historical: true
        legitimacy_bp: -500
        influence: {nobility: -500}
        outcome: >-
          You sail to Osaka in the spring, and Hideyoshi receives you with great courtesy and
          shows you his golden tea-room. He promises help, and orders the Shimazu to stop. They
          do not. In December Hideyoshi's vanguard is destroyed at the Hetsugi river and
          Funai falls to the Shimazu. You hold the sea-cliff castle of Usuki, with a Portuguese
          cannon that, the story goes, the Shimazu cannot answer, until Hideyoshi's army arrives
          in the spring.
        deeds: {grudges: {shimazu: 1500}}
      - label: "Make terms with the Shimazu"
        deeds: {peace_with: [shimazu]}
        legitimacy_bp: -1500
        outcome: >-
          You become a vassal of the lords you have fought for twenty years. Hideyoshi's envoys
          are told that Bungo has no need of help.
      - label: "Hold Bungo with the vassals who remain"
        unrest_bp: 600
        legitimacy_bp: 300
        outcome: >-
          You call up the vassals who have not deserted, and ask each of them for a last oath. They
          give it, and the Shimazu continue to advance; your retainers' wives start to leave for the
          hills.
        deeds: {men: 5000, martial_bp: 200}
    history: >-
      In 1586 Otomo Sorin went to Osaka to ask Hideyoshi for help; the Shimazu invaded Bungo
      in the winter, taking Funai, and Hideyoshi's army relieved Bungo in 1587.
    diverged: >-
      The Shimazu are gone.
    sources: ["Frois, Historia de Japam", "Berry, Hideyoshi (1982)"]

  - id: oto_tsukumi
    scenario: sengoku
    civ: otomo
    year: 1587
    title: "The Old Man at Tsukumi"
    place: "Tsukumi, Bungo"
    speaker: general
    speaker_name: "Otomo Yoshimune"
    speaker_title: "Your son"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      Hideyoshi's armies have crossed to Kyushu, and the Shimazu have drawn back south. You are
      a sick man at Tsukumi, with only months to live. Your son Yoshimune, who has not the
      qualities of a general, has been offered Bungo again by the regent, nothing more. You
      lost Hizen, Chikugo and the northern coast, and the regent has given them to his own men.


      Your son wants you to ask for more. The Jesuits say only that Hideyoshi's mood towards
      the Church is uncertain.
    choices:
      - label: "Accept Bungo and counsel loyalty"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You die in June, in your fifties, a Christian, and are buried with the rites of the
          Church. A month later Hideyoshi proclaims that the foreign priests must leave Japan
          within twenty days. It is not strictly enforced, and your son is still Lord of Bungo.
        deeds: {}
      - label: "Demand your old lands back"
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Hideyoshi's secretaries are polite, and nothing is returned. The regent's patience
          is not long.
      - label: "Ask Hideyoshi for Chikugo as well"
        unrest_bp: 200
        legitimacy_bp: 300
        outcome: >-
          You send a respectful request through the regent's secretaries for Chikugo to be added to
          your son's grant. They write it down and say that the matter will be considered; your
          retainers take it as a sign that you have not given up.
    history: >-
      Otomo Sorin died at Tsukumi in June 1587; Hideyoshi confirmed his son Yoshimune in Bungo
      only, and a few weeks later issued his first edict against the Jesuits.
    diverged: >-
      The Oda are gone.
    sources: ["Frois, Historia de Japam", "Elison, Deus Destroyed (1973)", "Berry, Hideyoshi (1982)"]

  - id: oto_pyongyang
    scenario: sengoku
    civ: otomo
    year: 1593
    title: "The Shame in Korea"
    place: "Hosan castle, Korea"
    speaker: general
    speaker_name: "Konishi Yukinaga"
    speaker_title: "Commander at Pyongyang"
    needs_alive: [ming]
    benchmark_provinces: 1
    story: >-
      You are Otomo Yoshimune, thirty-five, lord of Bungo by Hideyoshi's grace. You have crossed
      the sea with Hideyoshi's army to conquer Korea and China. Now a Ming army has driven the
      Japanese out of Pyongyang, and you hold a small fort at Hosan, a long way north of the
      main force.


      The commander has told you that Pyongyang has fallen. You have a few thousand men, and
      the Ming and Korean armies are marching your way.
    choices:
      - label: "Fall back from Hosan to the main army"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          You abandon the fort and fall back with the rest of the army. Hideyoshi, furious,
          calls it cowardice. In the autumn he takes Bungo from you and sends you to be kept by
          the Mori. The lands that Sorin built with trade and ships and the Jesuits' god pass to
          other hands. The house of Otomo ends its time as a great family.
        deeds: {ruler_falls: "is stripped of Bungo for cowardice in Korea"}
      - label: "Hold the fort at Hosan"
        legitimacy_bp: 1000
        unrest_bp: 1000
        outcome: >-
          Your garrison dies on the walls. Your name is remembered among Hideyoshi's loyal men.
      - label: "Wait at Hosan for the commander's orders"
        legitimacy_bp: -800
        unrest_bp: 300
        deeds: {men: 2000}
        outcome: >-
          You send riders to the main force and hold the gate while you wait. The answer is
          slow, and the Ming and Korean armies are not.
    history: >-
      In 1593 Otomo Yoshimune withdrew from his post in Korea; Hideyoshi accused him of
      cowardice and confiscated Bungo, and Yoshimune was placed in the custody of the Mori.
    diverged: >-
      The Ming are gone.
    sources: ["Berry, Hideyoshi (1982)", "Turnbull, The Samurai Invasion of Korea (2008)"]
