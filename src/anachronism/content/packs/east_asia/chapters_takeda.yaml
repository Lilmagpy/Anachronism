schema_version: 1
# Chronicle mode (D-120, D-143): the Takeda of Kai, Shingen and Katsuyori, 1560-1582.
# Each chapter opens in its year; one choice is what history chose (historical: true).
# Facts follow the Koyo gunkan (a Takeda house chronicle compiled decades later, rich in
# legend), the Shincho koki, letters and documents of the Takeda, and modern work by
# Shibatsuji, Hirayama and Turnbull. benchmark_provinces counts the provinces of this map
# the real Takeda held at that date.
chapters:
  - id: tak_kawanakajima
    scenario: sengoku
    civ: takeda
    year: 1561
    until_year: 1564
    title: "The Fourth Battle of Kawanakajima"
    place: "Kaizu castle, northern Shinano"
    speaker: general
    speaker_name: "Yamamoto Kansuke"
    speaker_title: "Your one-eyed strategist"
    needs_alive: [uesugi]
    benchmark_provinces: 2
    story: >-
      For the fourth time, Uesugi Kenshin of Echigo has come south to fight you for the
      plain of Kawanakajima, where two rivers meet. He calls himself the avatar of Bishamon,
      god of war; he drinks, does not marry, and has never lost.


      Kenshin's army is camped on Mount Saijo, above your castle. Yamamoto Kansuke has a
      plan he calls the woodpecker: a woodpecker taps the back of the tree so that the insects
      come out of the front. Send twelve thousand men up the mountain by night to attack
      Kenshin from behind; he will come down onto the plain - where you will be waiting with
      the rest.
    choices:
      - label: "Try the woodpecker"
        historical: true
        legitimacy_bp: 800
        outcome: >-
          Kenshin sees the smoke of extra cooking fires in your castle, guesses the plan, and
          slips down the mountain in the night. At dawn the fog lifts and your half-army finds
          his whole army in front of it. Your brother Nobushige dies; Kansuke, ashamed, charges
          into the enemy and is killed. The legend says Kenshin himself rode into your camp and
          slashed at you three times, and you parried with your iron war fan. When your other
          twelve thousand come down from the mountain, Kenshin withdraws. Both sides claim
          victory. Nothing has changed.
        deeds: {war_with: [uesugi], grudges: {uesugi: 2000}}
      - label: "Keep the army together, and starve him off the mountain"
        legitimacy_bp: 500
        food_bp: -1500
        outcome: >-
          You sit in your castle with all your men. After a month Kenshin's food runs out, and
          he marches home to Echigo.
        deeds: {war_with: [uesugi]}
    history: >-
      The fourth battle of Kawanakajima (1561) was the bloodiest of the five; Takeda
      Nobushige and Yamamoto Kansuke were killed. The famous single combat comes from the Koyo
      gunkan and may be legend.
    diverged: >-
      The Uesugi are gone.
    sources: ["Koyo gunkan", "Uesugi documents (Uesugi-ke monjo)", "Turnbull, Kawanakajima 1553-64 (2003)"]

  - id: tak_yoshinobu
    scenario: sengoku
    civ: takeda
    year: 1565
    title: "The Son Who Disagreed"
    place: "Tsutsujigasaki, Kai"
    speaker: steward
    speaker_name: "Obu Toramasa"
    speaker_title: "Your son's tutor, a senior retainer"
    benchmark_provinces: 2
    story: >-
      The Imagawa have never recovered from Okehazama. You want to break your old alliance
      with them and take Suruga, with its coast and its gold. Your eldest son Yoshinobu is
      married to an Imagawa princess and is against it. Now you have learned that he and his
      tutor Obu Toramasa have been plotting to stop you - perhaps to replace you, as you
      replaced your own father twenty-four years ago.
    choices:
      - label: "Imprison your son, and execute his tutor"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 800
        outcome: >-
          Obu Toramasa is made to kill himself. Yoshinobu is locked up in a temple, and two
          years later he dies there - of illness, or by his own hand. Your heir is now Katsuyori,
          the son of a concubine. Toramasa's famous red-armoured cavalry is given to his younger
          brother, Yamagata Masakage.
      - label: "Pardon them, and keep the Imagawa alliance"
        legitimacy_bp: -500
        outcome: >-
          Yoshinobu thanks you on his knees. Suruga stays Imagawa, and your ambitions stay in
          the mountains.
    history: >-
      In 1565 Shingen discovered a plot involving his heir Yoshinobu and Obu Toramasa;
      Toramasa was forced to commit suicide and Yoshinobu died in confinement in 1567.
    sources: ["Koyo gunkan", "Shibatsuji, Takeda Shingen (2008)"]

  - id: tak_suruga
    scenario: sengoku
    civ: takeda
    year: 1568
    until_year: 1571
    title: "The Road to the Sea"
    place: "The Fuji river"
    speaker: general
    speaker_name: "Yamagata Masakage"
    speaker_title: "Commander of the red cavalry"
    needs_alive: [imagawa]
    benchmark_provinces: 2
    story: >-
      Kai is a land of mountains with no coast and no salt. Suruga, below Mount Fuji, has
      both - and the weak Imagawa Ujizane to defend it. You have made a secret agreement with
      Tokugawa Ieyasu of Mikawa to divide the Imagawa lands between you.


      The Hojo of Sagami, your allies, are also allied to the Imagawa, and will not like this.
    choices:
      - label: "Invade Suruga"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Sunpu falls in days; Ujizane flees. Suruga is yours, and with it the sea. The Hojo,
          furious, break with you, and in revenge cut off Kai's salt from the coast.
        deeds: {war_with: [imagawa], take: [j_suruga], grudges: {hojo: 3000}}
      - label: "Keep the old alliance"
        legitimacy_bp: -300
        outcome: >-
          Ieyasu takes the Imagawa lands alone, and becomes stronger than you would like.
    history: >-
      Shingen invaded Suruga in late 1568 in agreement with Ieyasu, breaking the Kai-Sagami-
      Suruga alliance. The Hojo retaliated, though they were reconciled with Shingen in 1571.
    diverged: >-
      The Imagawa are gone already.
    sources: ["Koyo gunkan", "Shibatsuji (2008)"]

  - id: tak_salt
    scenario: sengoku
    civ: takeda
    year: 1568
    title: "Salt from an Enemy"
    place: "Kai"
    speaker: uesugi
    speaker_name: "A message from Uesugi Kenshin"
    speaker_title: "Lord of Echigo"
    needs_alive: [uesugi]
    benchmark_provinces: 2
    story: >-
      The Imagawa and the Hojo have closed the roads from the Pacific coast, and no salt is
      reaching Kai. Your people cannot preserve their food for the winter.


      A message has come from your great enemy, Uesugi Kenshin, whose province of Echigo lies
      on the Sea of Japan. 'I fight with swords, not with salt,' he writes. He will let his
      merchants sell salt to Kai at a fair price.
    choices:
      - label: "Accept, and send Kenshin a sword in thanks"
        historical: true
        food_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          The salt comes over the mountains from Echigo. You send Kenshin a fine sword. Your
          war with him goes on, but no one in Japan will forget the courtesy.
      - label: "Refuse: you will not owe Kenshin anything"
        food_bp: -2000
        unrest_bp: 1500
        legitimacy_bp: 300
        outcome: >-
          Kai goes hungry for a winter. Your pride is intact.
    history: >-
      The story that Kenshin supplied salt to his enemy's people during the 1568 salt embargo
      ('sending salt to the enemy' is still a Japanese idiom) is traditional and may be
      embellished.
    diverged: >-
      The Uesugi are gone.
    sources: ["Tradition recorded in Edo-period chronicles", "Turnbull, Samurai Warfare (1996)"]

  - id: tak_mikatagahara
    scenario: sengoku
    civ: takeda
    year: 1572
    until_year: 1574
    title: "The Shogun's Call"
    place: "Tsutsujigasaki, Kai"
    speaker: ashikaga
    speaker_name: "Ashikaga Yoshiaki"
    speaker_title: "Shogun in Kyoto"
    needs_alive: [oda]
    benchmark_provinces: 3
    story: >-
      The shogun Yoshiaki, whom Oda Nobunaga put on the throne and now treats as a puppet, has
      written to every great lord in Japan asking to be rescued. The Asakura, the Azai, the
      warrior monks of Osaka and the Mori are all ready.


      You are fifty-one, and you have been coughing blood. But Kai has never been stronger.
      The road to Kyoto runs through Ieyasu's lands, then Nobunaga's.
    choices:
      - label: "March for Kyoto"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Thirty thousand men march into Totomi in the autumn. At Mikatagahara, on a frozen
          evening, Ieyasu comes out of his castle to fight you against all advice, and you
          crush him; he gets back to Hamamatsu with five men. You take Noda castle in the
          spring. Then you can go no further: the cough has become a fever. You turn for home,
          and die on the road, telling your son to keep your death secret for three years.
        deeds: {war_with: [oda], take: [j_mikawa]}
      - label: "Stay home and rest"
        legitimacy_bp: -500
        outcome: >-
          The shogun's letters go unanswered from Kai. Nobunaga deals with his enemies one at
          a time.
    history: >-
      Shingen invaded Tokugawa lands in late 1572, defeated Ieyasu at Mikatagahara (January
      1573), and died of illness in May 1573 near Komaba on the way home.
    diverged: >-
      The Oda are gone.
    sources: ["Koyo gunkan", "Shincho koki 5"]

  - id: tak_takatenjin
    scenario: sengoku
    civ: takeda
    year: 1574
    title: "The Son of the Tiger"
    place: "Takatenjin castle, Totomi"
    speaker: general
    speaker_name: "Baba Nobuharu"
    speaker_title: "Your father's oldest general"
    benchmark_provinces: 3
    story: >-
      You are Katsuyori, and your father is dead - though officially he is still ill. His old
      generals obey you, but they compare you with him every day. You have just taken
      Takatenjin, a castle your father failed to take, and Ieyasu's lands are open.


      Baba Nobuharu, who fought seventy battles beside your father without a wound, advises
      caution: hold what you have, fortify, wait. You want to show them who you are.
    choices:
      - label: "Push on into Mikawa"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          Your army marches into Mikawa. Next spring you will besiege a small castle called
          Nagashino.
        deeds: {martial_bp: 500}
      - label: "Hold your father's borders, as Baba says"
        legitimacy_bp: -300
        unrest_bp: -500
        outcome: >-
          You fortify the frontier and wait. Nobunaga and Ieyasu use the time to buy guns.
    history: >-
      Katsuyori took Takatenjin in 1574, which Shingen had never captured, and then
      overreached in 1575.
    sources: ["Koyo gunkan", "Hirayama, Takeda Katsuyori (2007)"]

  - id: tak_nagashino
    scenario: sengoku
    civ: takeda
    year: 1575
    until_year: 1578
    title: "The Fence at Shitaragahara"
    place: "Before Nagashino castle"
    speaker: general
    speaker_name: "Baba Nobuharu"
    speaker_title: "Your father's oldest general"
    needs_alive: [oda]
    benchmark_provinces: 3
    story: >-
      You have been besieging Nagashino, and now Nobunaga and Ieyasu have come to relieve it
      with thirty-eight thousand men. You have fifteen thousand. They have dug in behind a
      little stream at Shitaragahara and built a fence of stakes along it - a strange thing to
      do - and behind the fence, your scouts say, are thousands of musketeers.


      Baba and the old generals say: retreat. Your father would never have charged into a
      prepared position. Your younger officers say the Takeda cavalry has never been stopped.
    choices:
      - label: "Charge"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2000
        outcome: >-
          Wave after wave of your horsemen charge across the stream into the volleys. By
          afternoon ten thousand of your men are dead: Baba, Yamagata, Naito - most of your
          father's great generals. Baba dies covering your retreat. The Takeda will never
          recover.
        deeds: {martial_bp: -3000, give: [j_mikawa], give_to: oda}
      - label: "Retreat, as the old generals say"
        legitimacy_bp: -800
        outcome: >-
          You lift the siege and march home with your army whole. Men say Katsuyori ran from a
          fence. Your army is alive to hear them.
      - label: "✦ Answer guns with guns: bring your own rifled muskets"
        needs_adopted: [bessemer_steel]
        legitimacy_bp: 2500
        outcome: >-
          Your marksmen, with long rifled barrels of a hard new steel, pick off Oda's gunners
          from beyond their range. When the fence is silent, your cavalry goes over it.
        deeds: {grudges: {oda: 3000}}
    history: >-
      At Nagashino (28 June 1575) Oda and Tokugawa musketeers behind palisades destroyed
      Katsuyori's army; most of Shingen's senior generals were killed.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki 8", "Koyo gunkan", "Turnbull, Nagashino 1575 (2000)"]

  - id: tak_shinpu
    scenario: sengoku
    civ: takeda
    year: 1581
    title: "A New Castle"
    place: "Nirasaki, Kai"
    speaker: steward
    speaker_name: "Sanada Masayuki"
    speaker_title: "A clever young retainer"
    benchmark_provinces: 2
    story: >-
      Your father never built a great castle: 'People are my castle,' he said, 'people are my
      walls, people are my moat.' But the world has changed since Nagashino. Sanada Masayuki,
      your cleverest retainer, has designed a new fortress for you at Shinpu, on cliffs above
      a river.


      Building it means heavy new labour and taxes on your vassals, who are already
      grumbling, and some of whom are writing letters to Nobunaga.
    choices:
      - label: "Build Shinpu"
        historical: true
        materials_bp: -2000
        unrest_bp: 1500
        influence: {nobility: -1500}
        outcome: >-
          The castle goes up in a hurry. The vassals pay, and some of them decide that
          Nobunaga might be a better master.
        deeds: {martial_bp: 500}
      - label: "Trust the people, as your father did"
        unrest_bp: -1000
        influence: {nobility: 1000}
        outcome: >-
          The money stays with your vassals. They are grateful, for now.
    history: >-
      Katsuyori moved his capital to the new castle of Shinpu in 1581; the cost alienated his
      vassals. The 'people are my castle' saying is attributed to Shingen in the Koyo gunkan.
    sources: ["Koyo gunkan", "Hirayama (2007)"]

  - id: tak_tenmokuzan
    scenario: sengoku
    civ: takeda
    year: 1582
    until_year: 1585
    title: "Tenmokuzan"
    place: "The mountains of Kai"
    speaker: general
    speaker_name: "Tsuchiya Masatsune"
    speaker_title: "One of your last loyal retainers"
    needs_alive: [oda]
    benchmark_provinces: 2
    story: >-
      Your brother-in-law Kiso Yoshimasa has gone over to Nobunaga. Oda, Tokugawa and Hojo
      armies have entered your lands from three sides. Your castles are surrendering without a
      fight; your own cousin has defected. You have burned the unfinished Shinpu castle and
      fled with a few hundred people, your wife and your son, towards the mountain of
      Tenmokuzan.


      The enemy is close behind.
    choices:
      - label: "Make a last stand"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          At Tenmokuzan, with the enemy on the slope below, your wife of nineteen writes a last
          poem and kills herself; your son Nobukatsu, sixteen, fights beside you. Tsuchiya
          Masatsune holds a narrow path with one hand on a vine. Then you and your son take
          your own lives. Nobunaga has your head displayed in Kyoto. The house of Takeda, which
          has held Kai for four hundred years, is gone.
        deeds: {ruler_falls: "dies at Tenmokuzan"}
      - label: "Escape over the mountains to the Uesugi"
        legitimacy_bp: -500
        outcome: >-
          You slip through the passes with a handful of men and reach Echigo, where Uesugi
          Kagekatsu, your sister's husband, takes you in. The Takeda live on, in exile.
        deeds: {give: [j_kai], give_to: oda}
    history: >-
      In 1582 Oda and Tokugawa armies overran the Takeda lands; Katsuyori and his son killed
      themselves at Tenmokuzan on 3 April. The Takeda clan was destroyed.
    diverged: >-
      The Oda are gone, and no one comes for the Takeda.
    sources: ["Shincho koki 15", "Koyo gunkan"]
