schema_version: 1
# Chronicle mode (D-120, D-XXX): the Onggut (Ongut), Turkic herders of the Jin wall frontier
# and heirs, in tradition, of an old Church of the East community, from the Naiman warning
# to the death of Prince George, 1206-1298. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Secret History of the Mongols (189-190,
# the Naiman message), the Yuan shi (118, on the Onggut, and 109, on the princesses), Rashid
# al-Din, the History of Mar Yahballaha and Rabban Sauma, Marco Polo, and John of
# Montecorvino's letter of 1305, with modern work by Rossabi (Voyager from Xanadu, 1992),
# Atwood and Halbertsma (Early Christian Remains of Inner Mongolia, 2008). Evidence is thin
# and sources disagree on several points, so dates are approximate: Alaqush's murder (about
# 1207, which some sources place nearer 1204-1206), the marriage of Alaqai Beki to his son
# Boyaohe, Boyaohe's death (placed about 1226, in the years after the western campaign),
# and the regency are all as the Yuan shi tells them, with details that vary. The rulers
# between Alaqai Beki and George are given by placeholders ("a prince of the Onggut house")
# because the lineage in the Yuan shi is not certain enough to name. The chapters about
# Alaqush's warning (1204) and the Jin wall of 1211 are told from the first turn of the game,
# 1206 and 1212. benchmark_provinces counts the provinces of this map the real Onggut
# held: the map has one for them.
chapters:
  - id: onggut_naiman
    scenario: great_khan
    civ: onggut
    year: 1206
    title: "The Right Hand of Tayang Khan"
    place: "The Jin frontier, near the wall"
    speaker: mongols
    speaker_name: "Genghis Khan's envoy"
    speaker_title: "At your tent"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Alaqush Digit Quri, the lord of the Onggut. Your people herd horses on the
      grass behind the long Jin wall, and the Jin emperor pays you in silk and titles to
      keep the wall's gates and watch the tribes beyond it. Many among you are Christians of
      the Church of the East, and others follow the old sky-gods. You live between two worlds.


      Two years ago, the Secret History says, the king of the Naimans, Tayang, sent a
      messenger to you: Join me as my right hand, and together we will cut off the arrows of
      the Mongols. Instead of answering, you told Temujin. The Naimans were crushed that year,
      and the Mongols have just proclaimed him Genghis Khan. His envoy now stands in your tent
      and asks what you will give him, and what you will not.
    choices:
      - label: "Stand with the Khan, openly"
        historical: true
        legitimacy_bp: 800
        unrest_bp: 500
        influence: {nobility: -300}
        outcome: >-
          You swear to the Khan, and send your sons to ride with his armies. The Jin court,
          which is paying you to watch the wall, does not yet know. Some of your own people
          do. Not all are glad.
        deeds: {martial_bp: 1000}
      - label: "Serve the Jin and keep the Khan at a distance"
        legitimacy_bp: 300
        wealth_bp: 500
        outcome: >-
          The Jin are pleased and the Mongol envoy goes away with polite thanks and a long
          memory. The Jin wall is quiet for now.
        deeds: {grudges: {mongols: 800}}
    history: >-
      In 1204 Tayang Khan of the Naimans asked Alaqush Digit Quri to join him against
      Genghis; he told Genghis instead and the Naimans were beaten. The Onggut became the
      Mongols' allies, and Alaqush a loyal client (Secret History 189-190; Yuan shi 118).
    sources: ["Secret History of the Mongols 189-190", "Yuan shi 118", "Atwood, Encyclopedia of Mongolia (2004)"]

  - id: onggut_murder
    scenario: great_khan
    civ: onggut
    year: 1207
    title: "The Knives of Your Own People"
    place: "Your camp on the plains"
    speaker: steward
    speaker_name: "Boyaohe"
    speaker_title: "Your son"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Alaqush. You have come home from the Khan's camp, and your people are uneasy.
      Not everyone wanted a Mongol alliance. Your sons are young, and Jin gold is still
      welcome in many tents. You have heard of whispers among the chiefs.


      Your son Boyaohe is at your side. The sources say very little about who your enemies
      were or why, only that they were your own people, and that you do not have long.
    choices:
      - label: "Send Boyaohe away to the Khan for safety"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 2500
        outcome: >-
          Boyaohe rides to Genghis Khan with a few companions. The plotters kill you. Genghis
          protects your son, as you protected the Khan, and gives him his own daughter
          Alaqai Beki in marriage.
        deeds: {ruler_falls: "is murdered by his own people"}
      - label: "Ride out to meet the plotters, with your guard"
        legitimacy_bp: 300
        unrest_bp: 1500
        outcome: >-
          You face them at the head of your guard. A few are put in chains, and the rest
          go home and wait.
    history: >-
      The Yuan shi says that Alaqush was murdered by Onggut who opposed the Mongol alliance
      (about 1207; sources differ on the date); his son Boyaohe escaped to Genghis, who gave
      him his daughter Alaqai Beki as wife.
    sources: ["Yuan shi 118", "Yuan shi 109 (Princesses)", "Rashid al-Din, Jami al-tawarikh"]

  - id: onggut_wall
    scenario: great_khan
    civ: onggut
    year: 1211
    title: "The Gates of the Wall"
    place: "The wall of the Jin"
    speaker: mongols
    speaker_name: "Genghis Khan"
    speaker_title: "At your gate"
    needs_alive: [mongols, jurchen_jin]
    benchmark_provinces: 1
    story: >-
      You are Boyaohe, lord of the Onggut, husband of the Khan's daughter Alaqai Beki. Your
      father's people have guarded the gates of the Jin wall for the emperor. Now the Khan
      himself is on the grass outside it, with an army, and wants to go through.


      The Jin emperor, Wanyan Yongji, whose envoy the Khan once spat in front of, has no field
      army that can reach you in time. Your own chiefs, the ones who did not kill your father,
      are looking at you.
    choices:
      - label: "Open the gates to the Khan"
        historical: true
        legitimacy_bp: 800
        influence: {nobility: 300}
        outcome: >-
          You open the gates, and the Mongols ride through, to the hills where the Jin
          army waits at the Badger's Mouth. The Jin do not forget which of their old
          wardens held the keys. You hold the road for the Khan, and after it your people
          fight in his armies.
        deeds: {martial_bp: 1000, men: 2000}
      - label: "Hold the gates for the Jin emperor"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The Khan's army is far larger than your garrison, and you are
          the husband of his daughter.
        deeds: {grudges: {mongols: 2000}}
    history: >-
      In 1211 Genghis's army invaded the Jin; the Onggut, who had guarded the Jin frontier
      wall, were by then allies of the Mongols, and the Jin frontier gave way. The Jin army
      was defeated at Yehuling.
    sources: ["Yuan shi 1 (Taizu)", "Yuan shi 118", "Secret History of the Mongols 247"]

  - id: onggut_regent
    scenario: great_khan
    civ: onggut
    year: 1226
    title: "The Khan's Daughter"
    place: "Your camp, in the Khan's absence"
    speaker: steward
    speaker_name: "An old chief"
    speaker_title: "Of the Onggut"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are Alaqai Beki, a daughter of Genghis Khan and the wife of Boyaohe. The Yuan shi
      says that Boyaohe went with her father's armies, and then he died. Your children are
      small. The Onggut chiefs are looking at a widow and a child.


      Some chiefs say an Onggut man should lead, an older relative. The Khan's own order, you
      know, is that the Onggut should be ruled by his house. You are his daughter, and you
      are on the spot.
    choices:
      - label: "Rule as regent for your children"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          You govern the Onggut yourself, as a wife and a mother and the Khan's daughter. The
          Yuan shi says that when a plot among the chiefs came to light, you dealt with it
          sternly, and kept the peace, and the Mongol sovereigns trusted you to do it. Later
          generations remember Alaqai Beki as the lady of the Onggut.
      - label: "Let an Onggut elder take the lead"
        legitimacy_bp: -500
        unrest_bp: 800
        outcome: >-
          The old man is respected and slow, and your chiefs argue at his elbow. The Khan's
          court sends envoys to ask who really leads the Onggut.
    history: >-
      After Boyaohe's death (perhaps about 1226; the date is not certain) Alaqai Beki, Genghis
      Khan's daughter, governed the Onggut as regent. The Yuan shi credits her with
      saving the people from a plot and holding the frontier.
    sources: ["Yuan shi 118", "Yuan shi 109 (Princesses)", "Rashid al-Din, Jami al-tawarikh"]

  - id: onggut_pilgrims
    scenario: great_khan
    civ: onggut
    year: 1275
    title: "The Two Pilgrims"
    place: "Your lands, and the road west"
    speaker: scholar
    speaker_name: "Rabban Sauma"
    speaker_title: "A monk of the Church of the East"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are the Onggut prince, and your land has Christians in it. The Church of the East
      came to the Turkic peoples of the steppe from Syria and Persia, some centuries ago, and
      many of your people are Christians, though not all of them. Two monks of the Church, the
      older Rabban Sauma and the younger Markos, who is said to be of an Onggut family, are
      going on pilgrimage to Jerusalem.


      The Khan, Kublai, rules in the east and in the south, and he has given them leave to
      go. They ask you for letters, for horses and for a safe road across the grass as far
      as the next border.
    choices:
      - label: "Give them horses, letters and an escort"
        historical: true
        knowledge_bp: 600
        legitimacy_bp: 600
        outcome: >-
          They set out about 1275 and reach Persia. Markos is made head of the Church of the
          East in 1281, as Mar Yahballaha III, and Sauma goes on to the courts of Europe as an
          envoy, speaking to the Pope and the French king. The monks' account of it will be
          written down in Syriac. Your people have a patriarch.
      - label: "Ask them to stay and serve your own people"
        knowledge_bp: 200
        legitimacy_bp: -200
        outcome: >-
          They stay a year, teach, and then leave anyway. Monks go where they are called.
    history: >-
      Rabban Sauma and Markos, Christians of the Church of the East from the Mongol-ruled
      north (Markos from an Onggut or Uighur family, as tradition has it), set out for
      Jerusalem about 1275 and reached Persia; Markos became patriarch as Mar Yahballaha III
      in 1281, and Sauma made an embassy to Europe in 1287-88.
    sources: ["History of Mar Yahballaha and Rabban Sauma", "Rossabi, Voyager from Xanadu (1992)"]

  - id: onggut_george
    scenario: great_khan
    civ: onggut
    year: 1296
    title: "King George"
    place: "Tenduc"
    speaker: scholar
    speaker_name: "John of Montecorvino"
    speaker_title: "A Latin friar from Rome"
    needs_alive: [mongols]
    benchmark_provinces: 1
    story: >-
      You are George (Körgüz), prince of the Onggut, a young man of twenty-three, married
      into the house of Kublai Khan. You were raised in the Church of the East, but a
      Latin friar, John of Montecorvino, has come to the Khan's capital from the pope in Rome.
      Marco Polo, years ago, called your family descended from the priest-king John, which is a
      tale the West loved, and you do not know what it was based on.


      The friar's teaching differs from your church's. In his own letter of 1305 he says you
      were converted, and came to the Roman rite. Your people are divided. Over the grass to
      the west, Duwa, the khan of the Chagatai, is raising an army against the Khan's lands.
    choices:
      - label: "Follow the friar to Rome's church, and keep the border"
        historical: true
        legitimacy_bp: -300
        unrest_bp: 800
        influence: {clergy: 800}
        outcome: >-
          The friar says that you took minor orders and had the Roman mass sung in your own
          tongue. Many of your people do not follow. In 1298 Duwa's army comes over the border and
          you are killed in the fighting. Your people go on, Christians of whichever sort.
      - label: "Stay with the church of your fathers"
        legitimacy_bp: 400
        outcome: >-
          Your people are glad, and the friar goes on to the capital to build his church there.
          The Chagatai army is still on the border.
    history: >-
      Prince George (Körgüz), the Onggut ruler, married into Kublai's house, was converted
      by John of Montecorvino to the Roman church (as the friar wrote in 1305) and was killed
      fighting Duwa of the Chagatai in 1298.
    sources: ["John of Montecorvino, letter of 1305", "Marco Polo, Travels (Tenduc)", "Rossabi, Voyager from Xanadu (1992)"]
