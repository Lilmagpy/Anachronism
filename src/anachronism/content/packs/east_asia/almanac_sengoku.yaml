schema_version: 1
# Chronicle mode (D-120, D-130): meanwhile, in the world, 1560-1582 (told in an Oda chronicle).
almanac:
  - id: sg_ming_wako
    scenario: sengoku
    year: 1561
    needs_alive: [ming]
    text: >-
      On the coast of Zhejiang, the Ming general Qi Jiguang wins nine battles in a row
      against the wokou pirates - many of them Japanese - with soldiers he drills himself
      in small teams of spears, shields and fire-lances.
  - id: sg_omura_christian
    scenario: sengoku
    year: 1563
    text: >-
      In Hizen, Omura Sumitada becomes the first Japanese lord to be baptised a Christian.
      Portuguese ships begin calling at his ports.
  - id: sg_shakespeare
    scenario: sengoku
    year: 1564
    text: >-
      In England, in a market town called Stratford-upon-Avon, a glover's wife gives birth
      to a son named William Shakespeare. In Pisa, the same year, Galileo Galilei is born.
  - id: sg_kawanakajima
    scenario: sengoku
    year: 1561
    needs_alive: [takeda, uesugi]
    text: >-
      At Kawanakajima, Takeda Shingen and Uesugi Kenshin fight the fourth and bloodiest of
      their five battles. Legend says Kenshin rode into Shingen's camp and slashed at him,
      and Shingen parried with his iron war fan.
  - id: sg_yoshiteru
    scenario: sengoku
    year: 1565
    needs_alive: [ashikaga]
    text: >-
      In Kyoto, the Miyoshi lords and Matsunaga Hisahide storm the palace of the shogun
      Ashikaga Yoshiteru. The shogun, a famous swordsman, fights with blade after blade
      planted in the floor beside him until he is cut down.
  - id: sg_legazpi
    scenario: sengoku
    year: 1565
    text: >-
      Miguel Lopez de Legazpi lands in the Philippines with five Spanish ships, and Andres
      de Urdaneta finds the way back across the Pacific to Mexico. The Manila galleons
      will soon carry American silver to China.
  - id: sg_mercator
    scenario: sengoku
    year: 1569
    text: >-
      In Duisburg, Gerardus Mercator publishes a map of the world on which a straight line
      is a true compass bearing. Sailors will use it for four hundred years.
  - id: sg_haijin
    scenario: sengoku
    year: 1567
    needs_alive: [ming]
    text: >-
      The new Longqing emperor of Ming lifts the ban on private sea trade, though not with
      Japan. Junks sail from Yuegang in Fujian to Manila, Siam and Java.
  - id: sg_nagasaki
    scenario: sengoku
    year: 1571
    text: >-
      The Portuguese great ship from Macao anchors for the first time at Nagasaki, a fishing
      village in Omura Sumitada's lands. Nine years later he will give the port to the
      Jesuits.
  - id: sg_lepanto
    scenario: sengoku
    year: 1571
    text: >-
      Off Lepanto in Greece, the galleys of Spain, Venice and the Pope destroy the Ottoman
      fleet. Among the wounded is a Spanish soldier called Miguel de Cervantes, who loses
      the use of his left hand.
  - id: sg_manila
    scenario: sengoku
    year: 1571
    text: >-
      Legazpi takes the Muslim town of Maynila and makes it the capital of the Spanish
      Philippines.
  - id: sg_wanli
    scenario: sengoku
    year: 1573
    needs_alive: [ming]
    text: >-
      A boy of nine becomes emperor of Ming as the Wanli emperor. His grand secretary Zhang
      Juzheng will reform the taxes into payments in silver - silver that comes from
      Japan and Peru.
  - id: sg_tycho
    scenario: sengoku
    year: 1572
    text: >-
      In Denmark, Tycho Brahe sees a new star in Cassiopeia, brighter than Venus. The
      heavens, which were supposed to be unchanging, have changed.
  - id: sg_bartholomew
    scenario: sengoku
    year: 1572
    text: >-
      In Paris, on St Bartholomew's day, Catholic mobs murder thousands of Protestant
      Huguenots who have come to the city for a royal wedding.
  - id: sg_kenshin_dies
    scenario: sengoku
    year: 1578
    needs_alive: [uesugi]
    text: >-
      Uesugi Kenshin, the 'Dragon of Echigo', who beat an Oda army at the Tedori river last
      year, dies suddenly in the privy at Kasugayama castle while preparing to march. His
      adopted sons go to war over his lands.
  - id: sg_drake
    scenario: sengoku
    year: 1577
    text: >-
      Francis Drake sails from Plymouth with five ships. He will come home three years later
      in the Golden Hind, loaded with Spanish treasure - the first captain to sail round
      the world and live.
  - id: sg_valignano
    scenario: sengoku
    year: 1579
    text: >-
      The Jesuit visitor Alessandro Valignano lands in Japan. He orders the missionaries to
      learn Japanese, eat Japanese food and respect Japanese manners.
  - id: sg_yasuke
    scenario: sengoku
    year: 1581
    text: >-
      Valignano brings to Kyoto a tall African servant. Crowds break down doors to see him.
      Nobunaga has him scrubbed to see if the colour is real, then takes him into his
      service and names him Yasuke.
  - id: sg_dutch
    scenario: sengoku
    year: 1581
    text: >-
      The northern provinces of the Netherlands declare that they no longer have a king,
      and fight on against Spain as a republic.
  - id: sg_gregorian
    scenario: sengoku
    year: 1582
    text: >-
      Pope Gregory XIII reforms the calendar: in Catholic lands, Thursday 4 October is
      followed by Friday 15 October. The same year four young Japanese Christian nobles sail
      from Nagasaki to meet the Pope in Rome.
  - id: sg_ricci
    scenario: sengoku
    year: 1582
    needs_alive: [ming]
    text: >-
      The Jesuit Matteo Ricci reaches Macao to learn Chinese. He will draw the Chinese the
      first map of the whole world they have seen, with China in the middle.
