schema_version: 1
# Chronicle mode (D-120, D-190): the Asakura of Echizen, from "Little Kyoto" to the burning
# of Ichijodani, 1560-1573. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Shincho koki, Frois, the Asakura-related papers (Asakura
# Yoshikage-ki), and modern work by Lamers, Turnbull and Berry. Kanegasaki (April 1570),
# Anegawa (July 1570) and the Mount Hiei encirclement (autumn 1570) fall in the same year, so
# the 1570 chapter covers Kanegasaki and Anegawa and its outcome tells the Hiei campaign; the
# burning of Hiei itself (September 1571) is the 1571 chapter. The lacquered skulls of
# Yoshikage, Azai Hisamasa and Azai Nagamasa, shown at Nobunaga's New Year banquet in 1574, are
# told in the outcome of the last chapter as the chronicles tell it (the Shincho koki). The
# map has no other Asakura land, so Echizen cannot be given away: its fall is told but not
# enacted (benchmark_provinces cannot go below 1).
chapters:
  - id: asa_ichijodani
    scenario: sengoku
    civ: asakura
    year: 1560
    title: "Little Kyoto"
    place: "Ichijodani, Echizen"
    speaker: scholar
    speaker_name: "A refugee courtier"
    speaker_title: "From the ruined capital"
    benchmark_provinces: 1
    story: >-
      You are Asakura Yoshikage, twenty-seven, lord of Echizen. Your castle town of Ichijodani,
      in a narrow valley behind a river gate, has grown for a hundred years into a rich and
      beautiful place: streets of craftsmen, temples, gardens, and the houses of nobles and monks
      who have fled the wars of the capital. Men call it Little Kyoto.


      The Asakura have never marched on Kyoto. Your fathers kept to Echizen and held it well.
      Your uncles say it is time to look further.
    choices:
      - label: "Keep to Echizen, and be the patron of exiles"
        historical: true
        wealth_bp: 500
        knowledge_bp: 800
        legitimacy_bp: 500
        outcome: >-
          The wanderers keep coming. You give them houses and pensions, and they give you poems,
          tea and an exact knowledge of what is happening in the capital. Echizen is rich and
          at peace, and has no army to speak of.
      - label: "March for the capital"
        legitimacy_bp: 1000
        food_bp: -1500
        outcome: >-
          Your army crosses into Omi and comes home with nothing, having lost its harvest.
    history: >-
      Under Yoshikage, Ichijodani flourished as a refuge for nobles and monks from Kyoto; the
      Asakura did not attempt to march to the capital.
    sources: ["Asakura Yoshikage-ki", "Lamers, Japonius Tyrannus (2000)"]

  - id: asa_yoshiaki
    scenario: sengoku
    civ: asakura
    year: 1566
    title: "A Shogun in Exile"
    place: "Ichijodani"
    speaker: general
    speaker_name: "Akechi Mitsuhide"
    speaker_title: "A masterless warrior in your service"
    benchmark_provinces: 1
    story: >-
      Ashikaga Yoshiaki, brother of the murdered shogun, has come to Echizen after a year of
      wandering, begging every lord who will listen to help put him on his brother's seat. He is
      a guest at Ichijodani, and a very troublesome one. Among your retainers is Akechi
      Mitsuhide, who knows both the shogun's court and the lord of Mino, and speaks well.


      Yoshiaki wants an army to march to Kyoto. Your elders will not send one: you have no quarrel
      with the Miyoshi, and the roads are long.
    choices:
      - label: "Shelter him, but send no army"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          Yoshiaki spends two years in Echizen, and grows angrier. Mitsuhide, who now serves both
          you and the shogun, writes to Oda Nobunaga. In 1568 Yoshiaki goes to Nobunaga, and
          Nobunaga takes him to Kyoto. The Asakura have given the future master of Japan a
          reason to see them as lazy.
      - label: "Send an army to Kyoto in his name"
        legitimacy_bp: 1500
        food_bp: -1500
        unrest_bp: 1000
        outcome: >-
          Your men get as far as the Omi border, and the Rokkaku block the road. Yoshiaki
          is no nearer to Kyoto.
    history: >-
      Ashikaga Yoshiaki lived under Asakura protection in Echizen from 1566 until 1568, when he
      went to Nobunaga; Yoshikage did not send an army.
    sources: ["Shincho koki, book 1", "Lamers, Japonius Tyrannus (2000)"]

  - id: asa_kanegasaki
    scenario: sengoku
    civ: asakura
    year: 1570
    title: "Kanegasaki and Anegawa"
    place: "Tsuruga, on the Echizen border"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "By his messenger"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      Nobunaga is the master of Kyoto and of the new shogun, and he has ordered every lord of
      the west to come and pay him homage. You, who sheltered the shogun before he did and
      were not thanked, did not go. In April he marches on Echizen with thirty thousand men and
      takes the border castles of Tezutsuyama and Kanegasaki.


      Then the news comes: Azai Nagamasa, Nobunaga's brother-in-law and your old ally, has
      turned on him in the rear. Nobunaga is running for Kyoto, with a handful of men.
    choices:
      - label: "Join the Azai against Nobunaga"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Nobunaga escapes by the skin of his teeth, with Hideyoshi and Ieyasu guarding the rear.
          In July at the Ane river your army of eight thousand, under your cousin Kagetake, joins
          the Azai, and Nobunaga and Ieyasu drive them from the field. In the autumn you climb
          Mount Hiei with the Azai, and the monks shelter you, and Nobunaga cannot reach you. In
          December the Emperor himself orders a truce and you go home.
        deeds: {war_with: [oda], grudges: {oda: 2000}}
      - label: "Keep the peace and send an envoy"
        legitimacy_bp: -1500
        outcome: >-
          Nobunaga takes your envoy's words as a surrender, and turns on the Azai alone.
    history: >-
      After Azai Nagamasa turned on Nobunaga at Kanegasaki (April 1570), the Asakura joined the
      Azai; they were beaten at the Ane river (Anegawa, July) and then sheltered on Mount Hiei
      until a truce in December.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, book 4", "Lamers, Japonius Tyrannus (2000)", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: asa_hiei
    scenario: sengoku
    civ: asakura
    year: 1571
    title: "The Mountain in Flames"
    place: "Ichijodani"
    speaker: general
    speaker_name: "Your council of elders"
    speaker_title: "In Echizen"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      The monks of Mount Hiei, who sheltered you in the winter, have been punished: in
      September Nobunaga burned the temples, the monasteries and the people living near them, and
      thousands, monks and townsfolk alike, were killed. The Honganji, the Takeda and the
      shogun are all writing to you, and they all want you to march.


      Your snow will come in two months. A winter army in Omi will have no road home.
    choices:
      - label: "Stay in Echizen until spring"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Your elders have kept your army alive. Nobunaga holds Yokoyama castle on the border of the Azai
          lands, with Hideyoshi in command, and is tightening his grip on Omi. You are being shut in.
      - label: "March into Omi in the autumn"
        legitimacy_bp: 500
        food_bp: -1500
        outcome: >-
          Your men are caught by snow, and the army that comes back is half the size of the army
          that left.
    history: >-
      Nobunaga destroyed the Enryaku-ji on Mount Hiei in September 1571. The Asakura remained
      in Echizen that winter while Nobunaga strengthened his hold on Omi.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, book 6", "Lamers, Japonius Tyrannus (2000)"]

  - id: asa_withdrawal
    scenario: sengoku
    civ: asakura
    year: 1572
    title: "The Army That Went Home"
    place: "Mount Odani and Kita-Omi"
    speaker: ruler
    speaker_name: "Takeda Shingen"
    speaker_title: "By letter, from Totomi"
    needs_alive: [takeda]
    benchmark_provinces: 1
    story: >-
      This year Takeda Shingen, the greatest soldier of his age, has marched on Nobunaga's
      friend Ieyasu. You and the Azai have kept Nobunaga's armies in the north of Omi through
      the autumn. Shingen's letters to you, and the shogun's, say the same thing: one more
      winter, and Nobunaga is finished.


      Your army has been in the field for months. It is cold, the men are tired, and the
      Asakura captains would like to go home, which is where their supply lines end. Nobunaga
      has sent a messenger to say that he is ready to treat for peace.
    choices:
      - label: "Take the army home for the winter"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1000
        outcome: >-
          Shingen, who is fighting Ieyasu with all his army, is furious at your leaving, and says
          so in a letter. Nobunaga does not need a peace after all: free of the north, he
          sends help to Ieyasu and turns round on the Azai.
        deeds: {grudges: {takeda: 1000}}
      - label: "Hold the line through the winter"
        legitimacy_bp: 1500
        unrest_bp: 1500
        food_bp: -1000
        outcome: >-
          Your men freeze in the north of Omi. Nobunaga has to keep his own army there.
    history: >-
      In December 1572 Asakura Yoshikage withdrew from the north of Omi, against Shingen's urging;
      Nobunaga took the chance to break the coalition.
    diverged: >-
      The Takeda are gone.
    sources: ["Shincho koki, book 6", "Lamers, Japonius Tyrannus (2000)"]

  - id: asa_ichijodani_burns
    scenario: sengoku
    civ: asakura
    year: 1573
    title: "The Valley That Burned"
    place: "Rokubo, Echizen"
    speaker: general
    speaker_name: "Asakura Kageakira"
    speaker_title: "Your cousin, at Ono"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      In August Nobunaga attacks again. He storms the Azai castle of Odani and the Asakura army
      is beaten as it retreats, at the pass of Tonezaka. You flee to Ichijodani, with almost
      nothing left. Your retainers are deserting by the hundred.


      Your cousin Kageakira advises you to leave and go to the temple of Rokubo, in the hills,
      where he can keep you safe until help arrives.
    choices:
      - label: "Go to Rokubo with Kageakira"
        historical: true
        legitimacy_bp: -3500
        unrest_bp: 3000
        outcome: >-
          Kageakira's men surround the temple. He has already sent to Nobunaga, and you kill
          yourself on 24 August, at forty, while the Oda army sets fire to Ichijodani and burns
          it for three days. Of Little Kyoto's streets and gardens nothing is left above the
          ground. Your mother and your son are put to death. At Nobunaga's New Year feast the
          next year, the skulls of Yoshikage and the Azai lords, lacquered and gilded, are
          passed round the guests.
        deeds: {ruler_falls: "kills himself at Rokubo, betrayed by his cousin"}
      - label: "Hold Ichijodani to the last"
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          Your hundreds of men die in the valley, and the town burns around them.
    history: >-
      Nobunaga destroyed the Asakura in August 1573; Yoshikage was betrayed by his cousin
      Kageakira and killed himself at Rokubo, and Ichijodani was burned. His skull, with those
      of the Azai, was displayed at Nobunaga's New Year banquet of 1574.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki, books 6 and 7", "Lamers, Japonius Tyrannus (2000)"]
