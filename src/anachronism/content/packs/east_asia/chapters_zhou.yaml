schema_version: 1
# Chronicle mode (D-120, D-XXX): the Eastern Zhou kings, from King Xian to the fall of the
# last Zhou remnant, 343-249 BC. Each chapter opens in its year; one choice is what history
# chose (historical: true). Facts follow Sima Qian's Shiji (ch. 4, the house of Zhou; ch. 5,
# the house of Qin) and the Zhanguo ce (Zhou), with the debt-avoiding terrace marked as a
# later story. Reign dates are approximate and differ by a year or two between reckonings:
# Xian to 321, Shenjing 320-315, Nan 314-256. The Shiji's own years for the surrender
# (the 59th year of King Nan = 256) and for the end of East Zhou (249) are used. The Shiji
# says it was the Duke of West Zhou, in whose house the king lived, who went to Xianyang in
# 256; the Qin chapter in this pack gives the act to the king, and both agree that Qin took
# the lands and the cauldrons. The real Zhou held one province on this map throughout.
# benchmark_provinces counts it.
chapters:
  - id: zhou_hegemon
    scenario: warring_states
    civ: zhou
    year: -343
    title: "The Title of Overlord"
    place: "Luoyang"
    speaker: steward
    speaker_name: "Your chamberlain"
    speaker_title: "Of the royal household"
    benchmark_provinces: 1
    story: >-
      You are King Xian of Zhou, Son of Heaven. Your family has held the Mandate of Heaven
      for seven centuries, and has held very little else for three. A generation ago the
      house itself split: after the Duke of West Zhou died, his sons quarrelled, and Zhao and
      Han set one of them up at Gong as Duke of East Zhou (367 BC, as the Shiji has it).
      Now there are two small lords in your lands, and a king who lives between them.


      One thing you still own is the power to name. In the old days the Son of Heaven
      conferred the title of "bo", the overlord who keeps the peace in his name, on the
      strongest lord of the age. Qin, in the far west, has been remade in a few years by
      the laws of Shang Yang, and its Duke Xiao has sent to your court. Your chamberlain says
      the title costs you nothing. But it is also true that once it is given you cannot
      take it back.
    choices:
      - label: "Grant Duke Xiao the overlord's title"
        historical: true
        legitimacy_bp: 300
        influence: {nobility: 300}
        outcome: >-
          The messengers go west with the title. The Shiji says that the lords came to
          congratulate Qin, and that the next year Duke Xiao sent a prince of his house to
          meet the lords at Fengze and to pay court to the Son of Heaven. For one season the
          old order looks alive, and the Zhou king has made it so. Whether it has made Qin
          safer or only stronger, nobody at court can tell.
      - label: "Withhold the title"
        legitimacy_bp: 300
        influence: {nobility: -300}
        outcome: >-
          You let the envoys wait, and they go home with courteous words. Qin does not ask
          twice. Its duke does not forget which courts gave him honour and which did not.
        deeds: {grudges: {qin: 800}}
      - label: "Send Qin sacrificial meat, and no title"
        legitimacy_bp: 100
        wealth_bp: -200
        outcome: >-
          The meat from the ancestral sacrifice is a real honour, and Duke Xiao's envoys take it
          home with polite faces. It is not what they came for, and Qin's court notes the
          difference.
    history: >-
      In 343 BC King Xian conferred the title of overlord (bo) on Duke Xiao of Qin, and the
      lords sent congratulations (Shiji 4 and 5).
    sources: ["Shiji 4 (Zhou)", "Shiji 5 (Qin)", "Zhanguo ce, Zhou"]

  - id: zhou_two_zhous
    scenario: warring_states
    civ: zhou
    year: -314
    title: "A King Between Two Dukes"
    place: "Wangcheng"
    speaker: steward
    speaker_name: "The Duke's steward"
    speaker_title: "Of West Zhou"
    benchmark_provinces: 1
    story: >-
      You are King Nan of Zhou, a new king in a poor house. Your father has died after six
      years on the throne, and your grandfather before him. All that is left of Zhou is
      two small seats: West Zhou, at the old royal city of Wangcheng, and East Zhou, at
      Gong, each under its own duke. Neither duke pays you much, and the two quarrel with one
      another. The Zhanguo ce tells a tale, of uncertain date, in which East Zhou wished to plant
      rice and West Zhou cut off the water.


      Your steward says you must live somewhere, and that where a king lives is where the
      dukes will send their grain. The Duke of West Zhou offers you a house at Wangcheng, under
      his roof. The Duke of East Zhou says the king belongs at the heart of the Zhou lands,
      and would be pleased to have the honour at Gong.
    choices:
      - label: "Live at Wangcheng under West Zhou"
        historical: true
        legitimacy_bp: 200
        outcome: >-
          You settle at Wangcheng. The Shiji says that in your day the East and West Zhou
          governed apart, and that the king made his seat in West Zhou. Your table is
          supplied, after a fashion, and your ceremonies are kept. But the roof is the
          duke's, and so are the soldiers.
      - label: "Go to the Duke of East Zhou at Gong"
        legitimacy_bp: -300
        influence: {nobility: -300}
        outcome: >-
          You go to Gong. The Duke of West Zhou keeps his grain, and the quarrel between the
          two houses becomes a quarrel about you. A king without a household of his own
          is welcome nowhere for very long.
      - label: "Stay in the royal city on both dukes' gifts"
        legitimacy_bp: -100
        wealth_bp: -400
        outcome: >-
          You keep your own poor house, and each duke sends a little to show he is not the
          other's servant. Winter comes, and the gifts come late.
    history: >-
      The Shiji says that in King Nan's time East and West Zhou governed separately and that
      the king moved his seat to West Zhou (Wangcheng), the lord of whom he depended on.
    sources: ["Shiji 4 (Zhou)", "Zhanguo ce, Zhou 4"]

  - id: zhou_cauldrons
    scenario: warring_states
    civ: zhou
    year: -308
    until_year: -300
    title: "Qin at Yiyang"
    place: "Luoyang"
    speaker: steward
    speaker_name: "Your chamberlain"
    speaker_title: "Of the royal household"
    benchmark_provinces: 1
    story: >-
      You are King Nan of Zhou. For centuries your treasure-house has held the Nine Cauldrons
      of the founder kings, cast, it is said, in the days of Yu, and handed from dynasty to
      dynasty as the proof of rule. Everybody knows that whoever carries them off will
      claim that he, and not you, holds the Mandate. The Zhanguo ce tells of an older Qin
      demand for them, which Zhou's envoy Yan Shuai once turned aside by asking Qi for help.
      Nobody now believes that Qi would come.


      Qin has a new king, young Wu, who loves strong men and wrestlers. His army is before
      Yiyang, the great Han fortress, not a day's march from your gates, and it is said that
      once he has taken it he will come to Luoyang to see the cauldrons for himself.
    choices:
      - label: "Receive the King of Qin at Luoyang"
        historical: true
        legitimacy_bp: -200
        outcome: >-
          Yiyang falls, and Qin's king comes to Luoyang. The Shiji says that he tried to lift
          one of the cauldrons with his strongman Meng Yue, that his kneecap broke, and that
          he died in the eighth month; Meng Yue's family was put to death. The cauldrons stay
          where they are. Qin has a new king, his half-brother, and he is more patient.
      - label: "Refuse to open the treasure-house"
        legitimacy_bp: 300
        outcome: >-
          You send word that the cauldrons are not to be shown. The reply is that the King
          of Qin will come anyway, and that Yiyang has just fallen to his army. He does not
          take the cauldrons, this time, but he takes note of who refused him.
        deeds: {grudges: {qin: 1200}}
      - label: "Send gifts to Qin's king instead of a welcome"
        wealth_bp: -500
        legitimacy_bp: -100
        outcome: >-
          Your envoys carry silk and bronze to Yiyang. Qin's king takes them, and comes to
          Luoyang all the same.
    history: >-
      Qin took Han's Yiyang in 307 BC, and King Wu of Qin went to Luoyang, where, the Shiji
      says, he tried to lift one of the cauldrons, broke his kneecap and died the same year.
    sources: ["Shiji 5 (Qin)", "Shiji 4 (Zhou)", "Zhanguo ce, Zhou 1"]

  - id: zhou_league
    scenario: warring_states
    civ: zhou
    year: -258
    until_year: -252
    title: "The League Against Qin"
    place: "Wangcheng"
    speaker: general
    speaker_name: "The Duke of West Zhou"
    speaker_title: "Your host"
    benchmark_provinces: 1
    story: >-
      You are King Nan of Zhou, in the fifty-ninth year of your reign. You are old, and
      you are poor. The Shiji records no debts of yours, but later commentators, centuries
      afterwards, told that you borrowed from rich men to pay for soldiers, and that when
      they came for repayment you hid in a high building afterwards called the debt-avoiding
      terrace. Take it as a story.


      Qin has just taken the Han cities of Yangcheng and Fushu, on your doorstep. The Duke
      of West Zhou, your host, is afraid and proposes to join the lords' league, to lead the
      armies of the world out of the Yique pass and shut the road to Yangcheng against
      Qin. Qin's old king is angry already. The Duke asks for your name on the call to
      arms.
    choices:
      - label: "Put the royal name to the league"
        historical: true
        legitimacy_bp: 500
        unrest_bp: 300
        outcome: >-
          The call goes out under the Zhou name, and the old king in his borrowed house has
          become the banner of the world against Qin. It is a gesture of a proud house. Qin's
          general Jiu marches on West Zhou before the lords have moved.
        deeds: {grudges: {qin: 2000}}
      - label: "Keep out of it and send Qin gifts"
        legitimacy_bp: -400
        outcome: >-
          You write to Qin and decline, and the Duke of West Zhou goes ahead without you.
          Qin does not take the difference into account.
      - label: "Lend the Duke your guard, not your name"
        legitimacy_bp: 200
        unrest_bp: 300
        deeds: {men: 500}
        outcome: >-
          The Duke has your household troops and no royal banner. The lords see a small band and
          a duke, not the Son of Heaven, and Qin hears of it all the same.
    history: >-
      In 256 BC the Duke of West Zhou joined the lords' league, to be used against Qin
      (Shiji 4). Qin's general Jiu attacked West Zhou at once.
    sources: ["Shiji 4 (Zhou)", "Hanshu, commentary of Ying Shao (the terrace story)"]

  - id: zhou_surrender
    scenario: warring_states
    civ: zhou
    year: -256
    until_year: -250
    title: "Qin at Wangcheng"
    place: "Xianyang"
    speaker: steward
    speaker_name: "The Duke of West Zhou"
    speaker_title: "Your host"
    benchmark_provinces: 1
    story: >-
      You are King Nan of Zhou. The lords did not come. Qin's general Jiu is at the walls
      of Wangcheng with the army that shut Yique, and the Duke of West Zhou says there is
      nothing left but to go to Xianyang and ask for terms.


      Thirty-six towns and thirty thousand households are all that is left of the house of
      Zhou. The house that conquered Shang eight and a half centuries ago will go to the
      King of Qin with its hands empty. The Nine Cauldrons are in the treasury and Qin knows it.
    choices:
      - label: "Give up the towns and go to Xianyang"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 1000
        outcome: >-
          The towns and the people are given up. The Shiji says that the Duke of West Zhou
          came to Qin, kowtowed and confessed his guilt, and that Qin received the gift and
          sent him home; in the same year King Nan died. The people of Zhou fled east. Qin
          carried the Nine Cauldrons west to Xianyang. The tale was told later that one of
          them fell into the Si river on the way, and was never found. The Duke of West Zhou
          was moved to Danhu.
        deeds: {ruler_falls: "dies, the last king of Zhou"}
      - label: "Hold the walls and wait for the lords"
        legitimacy_bp: -1000
        unrest_bp: 800
        outcome: >-
          You hold Wangcheng for the days it takes the lords to refuse. The wall is old, and
          Qin's engineers are not.
        deeds: {grudges: {qin: 1500}}
      - label: "Offer the towns, and keep the Cauldrons"
        legitimacy_bp: -2000
        unrest_bp: 500
        outcome: >-
          Your envoy offers the towns and people and says nothing of the treasure-house. Qin's
          general answers that he will take the whole of it.
    history: >-
      In 256 BC Qin took West Zhou: its duke gave up thirty-six towns and thirty thousand
      people, King Nan died that year, and Qin carried off the Nine Cauldrons. The Zhou
      dynasty, founded about 1046 BC, was over except for East Zhou.
    sources: ["Shiji 4 (Zhou)", "Shiji 5 (Qin)"]

  - id: zhou_east
    scenario: warring_states
    civ: zhou
    year: -249
    title: "The Duke of East Zhou"
    place: "Gong"
    speaker: steward
    speaker_name: "A minister of East Zhou"
    speaker_title: "Of the ducal household"
    benchmark_provinces: 1
    story: >-
      You are the Duke of East Zhou, the last head of the house, at Gong. Seven years have
      passed since West Zhou fell and the Nine Cauldrons went west. Qin has a new king,
      Zhuangxiang, who is young and has just taken the throne, and a chancellor named Lu
      Buwei. The lords whisper that Qin's grip on its new conquests is loose.


      Some of your ministers say the lords are sending to every court in the east, and that
      East Zhou, which has the ancestral temples, should be at their table. Others say that
      a house that has lost its king and its treasure should keep quiet and keep its temples.
    choices:
      - label: "Join the lords against Qin"
        historical: true
        legitimacy_bp: 300
        outcome: >-
          The Shiji says only that the Duke of East Zhou plotted with the lords against Qin.
          Qin sends its chancellor Lu Buwei, who puts the plot down and takes all of your
          land. Yet Qin does not end your sacrifices: the Duke is given the village of
          Yangren, to keep the ancestral rites of Zhou. The Shiji says that after that Zhou's
          offerings were no more.
        deeds: {ruler_falls: "loses East Zhou to Qin"}
      - label: "Keep quiet and keep the temples"
        legitimacy_bp: -300
        outcome: >-
          You write to nobody. The rites go on at Gong in a thin way, as before.
      - label: "Send gifts and an envoy to Qin's new king"
        legitimacy_bp: 100
        wealth_bp: -300
        outcome: >-
          Qin's court receives the envoy and the gifts without warmth. Gong is watched, and the
          lords' plots go on without you.
    history: >-
      In 249 BC East Zhou plotted with the lords, and Qin's chancellor Lu Buwei destroyed it
      and took all its land; Qin kept the sacrifices going on a small estate at Yangren, and
      by this the dynasty of Zhou came to an end (Shiji 4 and 5).
    sources: ["Shiji 4 (Zhou)", "Shiji 5 (Qin)"]
