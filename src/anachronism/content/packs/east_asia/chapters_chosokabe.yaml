schema_version: 1
# Chronicle mode (D-120, D-189): the Chosokabe of Tosa, from the "Princess boy" to the last
# Chosokabe, 1560-1614. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Chosokabe-ki and Chosokabe-shi okite hyakkajo (the
# hundred-article code of 1597), Frois, the Jesuit and Spanish accounts of the San Felipe,
# and modern work by Turnbull, Berry and Elison. Stories about Motochika's youth come from
# later chronicles and are told as stories. Map note: Iyo and Sanuki are one province here
# (j_iyo), standing for the part of Shikoku outside Tosa, including Awa, so taking it in 1584
# means the conquest of Shikoku. Dates of Hideyoshi's Shikoku and Kyushu campaigns and the San
# Felipe are as in modern histories. Morichika's 1600 and 1614 reigns are shown as one reign,
# since the map has no other Chosokabe land: Tosa cannot be taken from the player by a choice
# (the last province cannot be given away), so the 1600 loss is told but not enacted, and
# benchmark_provinces cannot go below 1 (in 1601 the real house held none).
chapters:
  - id: cho_tonomoto
    scenario: sengoku
    civ: chosokabe
    year: 1560
    title: "The Princess Boy"
    place: "Okō castle, Tosa"
    speaker: general
    speaker_name: "Chosokabe Motochika"
    speaker_title: "Your son, twenty-two"
    benchmark_provinces: 1
    story: >-
      You are Chosokabe Kunichika, lord of the Chosokabe of Tosa, on the island of Shikoku.
      Your house was once the master of the Nagaoka plain, and has been brought low: you spent
      years in exile at the court of the Ichijo, the court nobles who rule the southern coast,
      and have only lately taken back your castle. Tosa is split between seven powerful
      families.


      Your son Motochika is tall, pale and shy, and the whole province calls him 'the Princess
      boy' for his quiet manners and soft voice. He has never been in a battle. Your men are
      besieging Tonomoto, a castle of the Motoyama, one of the seven houses, and the young man
      has asked you for a command.
    choices:
      - label: "Let Motochika fight in the front rank"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The story goes that at his first battle the boy asked his retainers how a spear
          should be used, and was laughed at, and then charged with the first rank and took a
          head. Tonomoto falls. Within weeks you are dead, in the summer of 1560, and
          Motochika is head of the house. His enemies call him a girl; they will not do so
          for much longer.
        deeds: {}
      - label: "Keep Motochika behind the lines"
        legitimacy_bp: -500
        unrest_bp: 300
        outcome: >-
          The siege drags on. When you die that summer your son takes over without having once heard
          a battle, and the retainers whisper.
      - label: "Give Motochika a small guard to command"
        legitimacy_bp: 500
        wealth_bp: -300
        outcome: >-
          The boy leads a handful of retainers at the edge of the fighting and does what he is
          told. Tonomoto falls, and when you die that summer the men say he is a careful young
          man, which is not the same as a brave one.
    history: >-
      Chosokabe Motochika's first battle was at Tonomoto in 1560; his father Kunichika died
      the same year and he became head of the house.
    sources: ["Chosokabe-ki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: cho_shimanto
    scenario: sengoku
    civ: chosokabe
    year: 1575
    title: "The Court Noble and the Warrior"
    place: "The Shimanto river, Tosa"
    speaker: general
    speaker_name: "Your captains"
    speaker_title: "At the river"
    needs_alive: [otomo]
    benchmark_provinces: 1
    story: >-
      You are Chosokabe Motochika. You have beaten the Motoyama, the Kira and the other
      houses of the east and the middle of the island, and only the Ichijo remain: the court
      nobles of Nakamura, the 'little capital' of Tosa. Their lord, Kanesada, has been driven
      out by his own retainers, and has fled to Bungo, where his wife's father, Otomo Sorin, is
      the strongest lord in Kyushu.


      Now Kanesada has come back with Otomo ships and soldiers, and the old Ichijo vassals are
      gathering to him at the Shimanto river.
    choices:
      - label: "Give battle at the Shimanto"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          Kanesada's Ichijo vassals break and scatter, and with them the last of the old
          nobles of Tosa. He is sent into exile for life. You are lord of the whole province,
          and every man in it has seen you win. You turn to the sea.
        deeds: {grudges: {otomo: 500}}
      - label: "Make Kanesada's son lord of Nakamura"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          You keep the Ichijo name as a figurehead, and Tosa is never quite yours.
      - label: "Buy the Ichijo vassals with new lands"
        wealth_bp: -1000
        legitimacy_bp: 800
        unrest_bp: -300
        outcome: >-
          Many of the old Ichijo vassals take your lands and your promises and go home. Kanesada
          is left with his Otomo soldiers and a smaller following, and the matter is not yet
          settled.
    history: >-
      Motochika defeated Ichijo Kanesada, restored with Otomo help, at the Shimanto river in
      1575 and became master of all Tosa.
    diverged: >-
      The Otomo are gone.
    sources: ["Chosokabe-ki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: cho_nobunaga
    scenario: sengoku
    civ: chosokabe
    year: 1582
    title: "Nobunaga's Order"
    place: "Okō castle, Tosa"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "Lord of Kyoto, by letter"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      Some years ago you sought Nobunaga's friendship, by way of Akechi Mitsuhide, whose
      retainers are kin to your house by marriage, and he allowed you to take Shikoku 'by
      the sword'. You have named your heir Nobuchika, with a syllable of his name. You have since taken Awa and are fighting in Sanuki. Now his mood
      has changed, and a letter has come from Kyoto: you may keep Tosa and half of Awa, and
      must give up the rest.


      Your retainers say Nobunaga has sixty provinces and an army that destroyed the Takeda in
      a month. He is said to be sending his son Nobutaka with an army across the sea.
    choices:
      - label: "Refuse the letter, prepare for war"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: 500
        outcome: >-
          Nobunaga's son and Niwa Nagahide gather men at Sakai, and an army is ready to sail. On
          the second of June, at the Honno-ji temple in Kyoto, Akechi Mitsuhide kills Nobunaga,
          and the army melts away. That summer you smash the Miyoshi at the Nakatomi river and
          hold almost all Shikoku.
        deeds: {}
      - label: "Give up Awa and Sanuki as ordered"
        legitimacy_bp: -1500
        unrest_bp: -300
        outcome: >-
          You give up what you have won. The island is cut into two and you have nothing to show
          for the war but wounds. A few weeks later Nobunaga is dead.
      - label: "Send hostages and gifts, keep your gains"
        wealth_bp: -1000
        legitimacy_bp: 200
        unrest_bp: 300
        outcome: >-
          Envoys carry gifts and hostages to Kyoto and plead that Shikoku was won by the sword
          Nobunaga himself allowed. The answer is slow in coming, and then it is overtaken by
          events in the capital.
    history: >-
      Nobunaga turned against Chosokabe's conquests in 1582 and prepared an invasion of
      Shikoku, which was cancelled by his death at Honno-ji; Chosokabe then defeated the
      Miyoshi at Nakatomigawa.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Chosokabe-ki", "Berry, Hideyoshi (1982)"]

  - id: cho_shikoku
    scenario: sengoku
    civ: chosokabe
    year: 1584
    title: "All Shikoku"
    place: "Iyo, on the Seto Inland Sea"
    speaker: general
    speaker_name: "Your commanders in Iyo"
    speaker_title: "At the front"
    benchmark_provinces: 2
    story: >-
      You are lord of Tosa, Awa and most of Sanuki. Only Iyo, in the north-west of the island,
      stands against you, with the Kono family behind its walls and the Mori on the far shore of
      the sea ready to help them. Your army of the 'one-field soldiers', farmers who fight in
      season, has never been beaten for long.


      In the east, Tokugawa Ieyasu is fighting Toyotomi Hideyoshi, the new master of the capital,
      and you are Ieyasu's ally. If Hideyoshi wins, he will want to share Shikoku with his
      friends.
    choices:
      - label: "Press on into Iyo"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: 500
        outcome: >-
          The Kono and their allies are driven into their castles and then out. By 1585 you hold
          all four provinces of Shikoku. You have gone from one province to four in twenty years,
          and are the first man to hold the island.
        deeds: {take: [j_iyo], grudges: {mori: 1500}}
      - label: "Halt at the Iyo border"
        legitimacy_bp: -500
        unrest_bp: -300
        outcome: >-
          You hold what you have, and the Kono remain in their castles, waiting for Hideyoshi.
        deeds: {peace_with: [mori]}
      - label: "Garrison Awa and raise more levies"
        wealth_bp: -500
        legitimacy_bp: 300
        outcome: >-
          The one-field soldiers are called up for a second season, and the castles of Awa and
          Sanuki are strengthened. Iyo waits, and so does the regent.
        deeds: {men: 3000, martial_bp: 500}
    history: >-
      By 1585 Chosokabe Motochika had conquered all four provinces of Shikoku, defying
      Hideyoshi's demands to give some of them up.
    sources: ["Chosokabe-ki", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: cho_hideyoshi
    scenario: sengoku
    civ: chosokabe
    year: 1585
    title: "A Hundred Thousand on the Sea"
    place: "Ichinomiya castle, Awa"
    speaker: oda
    speaker_name: "Toyotomi Hideyoshi"
    speaker_title: "Imperial regent"
    needs_alive: [mori]
    benchmark_provinces: 1
    story: >-
      The regent's brother Hidenaga has landed in Shikoku with about a hundred thousand men,
      the Mori and Ukita armies among them, landing in three places. Your castles are falling,
      and no help is coming.


      Hideyoshi's terms are simple: you keep Tosa, and give up the rest, and fight for him
      where he says.
    choices:
      - label: "Submit to the regent, keep Tosa only"
        historical: true
        legitimacy_bp: -2000
        outcome: >-
          You keep Tosa, the province you began with. Iyo goes to Kobayakawa Takakage, and the
          rest is given to the regent's own men. Your 'one-field soldiers' are to be sent to
          fight Hideyoshi's wars.
        deeds: {give: [j_iyo], give_to: mori}
      - label: "Withdraw to the high valleys and fight on"
        unrest_bp: 2500
        legitimacy_bp: 500
        outcome: >-
          Your army retreats into the high valleys. The regent's men are in no hurry.
        deeds: {martial_bp: 500}
      - label: "Bargain: hostages for Awa and Tosa"
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Hideyoshi accepts the hostages and refuses the bargain. Iyo and Sanuki go to his men,
          and in the end Awa follows them, and you have given your word twice.
        deeds: {give: [j_iyo], give_to: mori}
    history: >-
      Hideyoshi's army invaded Shikoku in 1585; Chosokabe Motochika submitted and was left
      with Tosa alone.
    diverged: >-
      The Mori are gone.
    sources: ["Berry, Hideyoshi (1982)", "Chosokabe-ki"]

  - id: cho_hetsugi
    scenario: sengoku
    civ: chosokabe
    year: 1586
    title: "The Heir at the Hetsugi River"
    place: "Hetsugi river, Bungo"
    speaker: general
    speaker_name: "Sengoku Hidehisa"
    speaker_title: "Hideyoshi's commander on the field"
    needs_alive: [shimazu]
    benchmark_provinces: 1
    story: >-
      You are sent to Kyushu with your son Nobuchika, twenty-one, the pride of your life, to
      fight the Shimazu for Hideyoshi. The commander, Sengoku Hidehisa, wants to cross the
      Hetsugi river and attack the Shimazu army outside Funai. You say it is a trap: Shimazu
      armies pretend to flee, and the enemy is many.


      Hidehisa is a Hideyoshi man, and does not like being taught.
    choices:
      - label: "Cross the river with Sengoku"
        historical: true
        legitimacy_bp: -1500
        outcome: >-
          The Shimazu feint, and then close in from three sides. Sengoku runs away, and
          Nobuchika is killed trying to hold the line. The chronicles say you wanted to die
          beside him, and were taken from the field by your men. You carry his sword home. You
          name your fourth son Morichika as heir, over the objections of several loyal
          retainers; one, the stories say, is made to die for it.
        deeds: {}
      - label: "Withdraw your own men alone"
        legitimacy_bp: -2000
        unrest_bp: 300
        outcome: >-
          You keep your son alive and lose Hideyoshi's goodwill. The Shimazu destroy the
          vanguard without you.
      - label: "Scout the Shimazu line before crossing"
        legitimacy_bp: -500
        knowledge_bp: 300
        outcome: >-
          Your scouts come back with word of Shimazu banners that are too few for an army that
          means to fight, and Sengoku waves it away. He crosses at dawn, and you and your son
          follow with the rear of the column.
    history: >-
      At Hetsugigawa (December 1586) the Shimazu destroyed Hideyoshi's vanguard; Chosokabe
      Nobuchika was killed, and Motochika's choice of his fourth son Morichika as heir split
      the house.
    diverged: >-
      The Shimazu are gone.
    sources: ["Chosokabe-ki", "Frois, Historia de Japam", "Berry, Hideyoshi (1982)"]

  - id: cho_felipe
    scenario: sengoku
    civ: chosokabe
    year: 1596
    title: "The Ship That Came to Urado"
    place: "Urado harbour, Tosa"
    speaker: general
    speaker_name: "Masuda Nagamori"
    speaker_title: "Hideyoshi's envoy"
    benchmark_provinces: 1
    story: >-
      A great ship has come ashore, battered by a storm, off your coast: a Spanish galleon, the
      San Felipe, from Manila bound for Mexico with a cargo of silk and silver. Your boats
      tow it into Urado harbour, and it runs aground there.


      Your own officers say that the cargo is a gift of the sea. The regent in Kyoto does not
      think so, and has sent Masuda Nagamori with a long list of questions.
    choices:
      - label: "Report the wreck and open the ship"
        historical: true
        legitimacy_bp: -500
        wealth_bp: -500
        outcome: >-
          Masuda's men take everything off the ship, and the regent keeps it. The story goes that
          the Spanish pilot, shown a map, boasts that the King of Spain sends priests first and
          armies after; Hideyoshi, who has long been wary of the Church, orders twenty-six
          Christians crucified at Nagasaki in the new year. You are thanked for your help.
        deeds: {}
      - label: "Help the Spaniards repair and sail"
        legitimacy_bp: 500
        unrest_bp: 1000
        wealth_bp: -300
        outcome: >-
          Hideyoshi's wrath falls on Tosa as well as the foreigners, and you spend a year
          justifying yourself.
      - label: "Keep part of the cargo, report the rest"
        wealth_bp: 1500
        legitimacy_bp: -1000
        unrest_bp: 500
        outcome: >-
          Masuda's clerks count the bales and chests and find that the lists do not agree.
          Hideyoshi forgives nothing he can prove, and you pay for the difference in goodwill.
    history: >-
      The San Felipe was wrecked at Urado in Tosa in October 1596; Hideyoshi's agent Masuda
      Nagamori confiscated its cargo, and the incident helped lead to the execution of twenty-
      six Christians at Nagasaki in 1597.
    sources: ["Boxer, The Christian Century in Japan (1951)", "Elison, Deus Destroyed (1973)"]

  - id: cho_code
    scenario: sengoku
    civ: chosokabe
    year: 1597
    title: "A Hundred Articles"
    place: "Urado castle, Tosa"
    speaker: steward
    speaker_name: "Chosokabe Morichika"
    speaker_title: "Your heir"
    benchmark_provinces: 1
    story: >-
      You are Chosokabe Motochika, fifty-eight. You have fought in Kyushu, in the siege of
      Odawara and in Korea, and your best men and your heir are dead. Your province is
      worn out, your retainers quarrel over the succession, and the farmer-soldiers have been
      gone for years.


      A new castle is rising at Urado, on the sea. Your advisers want a law for the house and the
      province, so that it will outlast you: how retainers must behave, how the farmers must
      be ruled, how a castle town must be kept.
    choices:
      - label: "Issue a written code for your house"
        historical: true
        legitimacy_bp: 1500
        unrest_bp: -500
        outcome: >-
          The code is issued in the third month. It deals with the duties of retainers and the
          order of the province, from the conduct of war to the conduct of daily life. It is one
          of the best-known 'house laws' of the warring-states age, and it does not save the
          Chosokabe.
        deeds: {}
      - label: "Rule by the old customs"
        legitimacy_bp: -500
        unrest_bp: 500
        outcome: >-
          The retainers continue to quarrel. You die in 1599 without a clear line.
      - label: "Settle the succession before any laws"
        legitimacy_bp: 800
        influence: {nobility: 500}
        unrest_bp: 300
        outcome: >-
          You gather the retainers and swear them to your heir Morichika before you write a line
          of law. The quarrels grow quieter, but the house has no written rules to hold them to.
    history: >-
      In 1597 Chosokabe Motochika and his heir Morichika issued the Chosokabe-shi okite
      hyakkajo, a house code of one hundred articles; Motochika died in 1599.
    sources: ["Chosokabe-shi okite hyakkajo (1597)", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: cho_sekigahara
    scenario: sengoku
    civ: chosokabe
    year: 1600
    title: "The Army That Did Not Fight"
    place: "Mount Nangu, near Sekigahara"
    speaker: general
    speaker_name: "Kikkawa Hiroie"
    speaker_title: "Commander of the Mori vanguard"
    benchmark_provinces: 1
    story: >-
      You are Chosokabe Morichika, twenty-five, lord of Tosa since your father's death last
      year. Hideyoshi is dead, and Tokugawa Ieyasu and Ishida Mitsunari are at war for his
      heir. You marched with the West, and now your six thousand men are on the slope of Mount
      Nangu behind the Mori army, with the Mori and Kikkawa in front of you.


      The Mori have not moved, and you can see little of the battle from where you are.
    choices:
      - label: "Wait for the Mori to move"
        historical: true
        legitimacy_bp: -3000
        unrest_bp: 2500
        outcome: >-
          The Mori never move: Kikkawa Hiroie has already agreed with Ieyasu to stay out of the
          fight. By afternoon the West is broken, and you slip away to Tosa without fighting.
          Ieyasu takes Tosa from the Chosokabe, whom he does not forgive, and gives it to
          Yamauchi Kazutoyo. The retainers who will not give up Urado are put to death in the
          uprising that follows. You live as a landless man in Kyoto, giving lessons in
          writing, the stories say.
        deeds: {}
      - label: "Charge the enemy on your own"
        legitimacy_bp: 500
        unrest_bp: 1500
        outcome: >-
          Your six thousand charge down the slope into the Eastern line, and are cut to pieces
          within the hour.
      - label: "Slip away toward Tosa now"
        legitimacy_bp: -1500
        unrest_bp: 1000
        wealth_bp: 500
        outcome: >-
          You march your six thousand south before the battle is decided, and arrive home with
          your army whole. The East will remember that you did not wait to see who won.
    history: >-
      The Chosokabe force at Sekigahara (1600) did not fight; Ieyasu confiscated Tosa and gave
      it to Yamauchi Kazutoyo.
    sources: ["Bryant, Sekigahara 1600 (1995)", "Chosokabe-ki"]

  - id: cho_osaka
    scenario: sengoku
    civ: chosokabe
    year: 1614
    title: "The Last Chosokabe"
    place: "Osaka castle"
    speaker: general
    speaker_name: "Sanada Nobushige"
    speaker_title: "A fellow outcast in Osaka"
    benchmark_provinces: 1
    story: >-
      You are Chosokabe Morichika, forty, a ronin in Kyoto, teaching village children to
      write. You live under watch. Tokugawa Ieyasu, who is old, means to destroy Toyotomi Hideyori
      in Osaka castle before he dies.
      Hideyori is sending out for every ronin in Japan who knows how to fight.


      An offer arrives: money, a rank, and the old banner of the Chosokabe. If the Toyotomi
      win, you may hope to have Tosa again.
    choices:
      - label: "Join Hideyori in Osaka"
        historical: true
        legitimacy_bp: 1000
        outcome: >-
          You slip out of Kyoto and take your place with the ronin in the castle. In the summer
          campaign of 1615 your men fight at Yao and lose; you are taken, brought to the shogun's
          camp and beheaded in June. Your sons are put to death. The Chosokabe are no more.
        deeds: {ruler_falls: "is captured at Osaka and beheaded"}
      - label: "Keep your head down in Kyoto"
        legitimacy_bp: -1000
        outcome: >-
          You do not go. Osaka falls in the summer, without you, and you spend your last years
          teaching in a back street.
      - label: "Offer your service to Ieyasu"
        legitimacy_bp: 300
        wealth_bp: 500
        unrest_bp: -300
        outcome: >-
          Ieyasu's retainers have not forgotten Sekigahara and do not answer you. Osaka falls in
          the summer, and you are left to teach in a back street.
    history: >-
      Chosokabe Morichika joined Hideyori in Osaka in 1614; he was captured after the battle of
      Yao in 1615 and executed.
    sources: ["Chosokabe-ki", "Turnbull, Osaka 1615 (2006)"]
