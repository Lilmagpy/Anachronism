schema_version: 1
# Chronicle mode (D-120, D-167): the Tuoba emperors of Northern Wei, from Chaibi to the move
# to Luoyang, 402-494. Each chapter opens in its year; one choice is what history chose
# (historical: true). Facts follow the Wei shu, the Song shu, the Zizhi tongjian, the
# Treatise on Buddhism and Daoism (Shilao zhi) and the inscriptions at Yungang, with modern
# work by Pearce, Holcombe, Eisenberg, Lewis and Chen Yinke. benchmark_provinces counts the
# provinces of this map the real Wei held at that date.
chapters:
  - id: wei_chaibi
    scenario: three_kingdoms
    civ: northern_wei
    year: 402
    title: "The River at Chaibi"
    place: "Chaibi, on the Fen river"
    speaker: general
    speaker_name: "One of your Xianbei commanders"
    speaker_title: "Of the Tuoba horse"
    needs_alive: [later_qin]
    benchmark_provinces: 3
    story: >-
      You are Tuoba Gui, the Emperor Daowu of Wei. Your Xianbei people were a federation of
      steppe clans on the northern frontier a generation ago; you have smashed the Murong Yan
      and taken the great plain of Hebei, with its millions of Chinese farmers, and built a
      capital at Pingcheng by the Great Wall.


      Yao Xing of Later Qin, the other great power of the north, has sent his brother Yao
      Ping with forty thousand men to take your western border. You have trapped them on a
      hill at Chaibi, against the river. Yao Xing is coming to relieve them, from the other
      bank.
    choices:
      - label: "Hold the river, and starve them out"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          You hold every crossing. Yao Xing watches from the far bank, unable to reach his
          brother. Yao Ping tries to break out, fails, and drowns himself in the Fen with his
          officers; his army surrenders. The Qin will never threaten you again.
        deeds: {martial_bp: 1000, grudges: {later_qin: 2000}}
      - label: "Storm the hill"
        legitimacy_bp: 500
        outcome: >-
          Your horsemen ride up the hill into Qin spears, and win, at a price.
        deeds: {martial_bp: 500}
    history: >-
      Emperor Daowu destroyed a Later Qin army at Chaibi in 402; its commander Yao Ping
      drowned himself while Yao Xing watched from across the river.
    diverged: >-
      Later Qin is gone.
    sources: ["Wei shu 2 (Taizu)", "Zizhi tongjian 112", "Holcombe, The Genesis of East Asia (2001)"]

  - id: wei_mother
    scenario: three_kingdoms
    civ: northern_wei
    year: 408
    title: "The Mother of the Heir"
    place: "The palace at Pingcheng"
    speaker: steward
    speaker_name: "Cui Hong"
    speaker_title: "Your Chinese minister"
    benchmark_provinces: 3
    story: >-
      You have read in the Chinese histories how the Han emperor Wu, when he chose his heir,
      ordered the boy's mother to die, so that she could never rule through her son. You
      mean to name your eldest son, Tuoba Si, as heir, and do the same with his mother, Lady
      Liu.


      Your health is bad: you take the Cold Food Powder, an elixir of the immortals, and it
      makes you suspicious and violent. Officials are killed for a wrong look. Your son weeps
      for his mother. Another of your sons, Tuoba Shao, a wild youth, has a mother you have
      just thrown in prison.
    choices:
      - label: "Name the heir, and order his mother to die"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          Lady Liu dies. Your heir weeps so much that you are angry with him, and he flees the
          palace. In the night, Tuoba Shao and his men break into your rooms and kill you.
          Tuoba Si comes back and puts Shao to death. The custom you began - the heir's mother
          must die - will last nearly a hundred years.
        deeds: {ruler_falls: "is murdered in his palace by his son Tuoba Shao"}
      - label: "Name the heir, and spare his mother"
        legitimacy_bp: 500
        influence: {nobility: -1000}
        outcome: >-
          Lady Liu lives, and your Xianbei nobles start to cultivate her.
    history: >-
      Emperor Daowu introduced the custom of killing the heir's mother (zi gui mu si) and was
      murdered by his son Tuoba Shao in 409; Tuoba Si became Emperor Mingyuan.
    sources: ["Wei shu 2-3", "Wei shu 13 (Empresses)", "Holmgren, 'Women and Political Power in Northern Wei' (1983)"]

  - id: wei_liu_yu
    scenario: three_kingdoms
    civ: northern_wei
    year: 416
    title: "The Crescent on the River Bank"
    place: "Pingcheng"
    speaker: scholar
    speaker_name: "Cui Hao"
    speaker_title: "Your adviser, son of Cui Hong"
    needs_alive: [eastern_jin]
    benchmark_provinces: 3
    story: >-
      You are Tuoba Si, the Emperor Mingyuan. The great general of the southern Jin, Liu Yu,
      has destroyed Southern Yan and is now sailing up the Yellow River with a fleet, to
      attack Later Qin in Chang'an. Your wife is a Qin princess, and the Qin have asked you
      for help. Liu Yu has asked you to let his fleet pass.


      Your court wants to attack the Jin boats from the north bank. Your young adviser Cui
      Hao, a man who reads the stars and the Chinese classics, says: let Liu Yu take
      Chang'an. He cannot hold it, so far from home, and it will fall to us in the end.
    choices:
      - label: "Let him pass, but shadow the fleet"
        historical: true
        legitimacy_bp: -500
        outcome: >-
          Your horsemen ride along the north bank, and finally attack Liu Yu's landing party.
          He has drawn up a hundred wagons in a crescent with its tips on the river, with
          crossbowmen behind them and long spears cut down to fit the narrow space. Your
          cavalry breaks on it. Liu Yu takes Chang'an; within two years his army has lost it,
          as Cui Hao said.
      - label: "Attack the fleet with everything"
        legitimacy_bp: 500
        unrest_bp: 1000
        outcome: >-
          Your cavalry cannot reach boats in midstream. Liu Yu takes Chang'an anyway, and now
          the Jin are your enemies.
        deeds: {grudges: {eastern_jin: 2000}}
    history: >-
      In 416-417 Liu Yu sailed up the Yellow River against Later Qin; Wei, advised by Cui Hao,
      did not oppose him seriously, and its cavalry was beaten by his 'crescent formation'.
    diverged: >-
      The southern Jin are gone.
    sources: ["Wei shu 35 (Cui Hao)", "Song shu 2 (Wudi)", "Zizhi tongjian 118"]

  - id: wei_hulao
    scenario: three_kingdoms
    civ: northern_wei
    year: 422
    title: "The Two Hundred Days of Hulao"
    place: "Before the pass of Hulao"
    speaker: general
    speaker_name: "Xi Jin"
    speaker_title: "Your commander in the south"
    benchmark_provinces: 4
    story: >-
      Liu Yu has made himself emperor of a new southern dynasty, Song, and has died. His son
      is a boy. Luoyang, the old capital of the Han and the Jin, is held by a Song garrison,
      and the fortress of Hulao guards the road to it.


      Your commanders say: now, while the south mourns.
    choices:
      - label: "Take Luoyang"
        historical: true
        legitimacy_bp: 1500
        food_bp: -1500
        outcome: >-
          Luoyang falls quickly. Hulao does not: its commander Mao Dezu holds out for two
          hundred days, until the wells run dry and the walls are undermined, and he is carried
          out wounded. You come south yourself to see it end, and go home exhausted. You die
          the next year, at thirty-one.
        deeds: {take: [k4_luoyang]}
      - label: "Keep the peace with Song"
        legitimacy_bp: -500
        outcome: >-
          The Song envoys thank you. Luoyang stays Chinese, and southern.
    history: >-
      After Liu Yu's death (422), Mingyuan took Luoyang and, after a long siege, Hulao
      (423), defended by Mao Dezu.
    sources: ["Wei shu 3 (Taizong)", "Song shu 48 (Mao Dezu)"]

  - id: wei_shengle
    scenario: three_kingdoms
    civ: northern_wei
    year: 424
    title: "Fifty Rings of Horsemen"
    place: "Shengle, on the northern frontier"
    speaker: rouran
    speaker_name: "Datan"
    speaker_title: "Khagan of the Rouran"
    needs_alive: [rouran]
    benchmark_provinces: 4
    story: >-
      You are Tuoba Tao, Emperor Taiwu, sixteen. The Rouran, the new masters of the steppe,
      heard that your father was dead and came south with sixty thousand horsemen. You rode
      out to meet them with the guard, and now you are surrounded at Shengle, they say fifty
      rings deep.


      Your officers want you to break out at night and run for the Wall.
    choices:
      - label: "Sit still, and let them see you"
        historical: true
        legitimacy_bp: 2500
        outcome: >-
          You sit calmly in the middle of your camp while the arrows fall. Your soldiers take
          heart, and when the Rouran come close enough your archers kill their great chief
          Yujiulü Yuheti. The Rouran ride away. Next year you ride after them, across the
          Gobi.
        deeds: {martial_bp: 1000, grudges: {rouran: 2000}}
      - label: "Break out in the night"
        legitimacy_bp: -1500
        outcome: >-
          You get out, and lose half the guard. The Rouran sack Shengle and go home rich.
    history: >-
      In 424 the Rouran surrounded the young Taiwu at Shengle; he stood firm and they withdrew
      after their commander was killed.
    diverged: >-
      The Rouran are gone.
    sources: ["Wei shu 4 (Shizu)", "Wei shu 103 (Ruanru)", "Zizhi tongjian 120"]

  - id: wei_tongwan
    scenario: three_kingdoms
    civ: northern_wei
    year: 427
    title: "The White City"
    place: "Before Tongwan, in the Ordos"
    speaker: general
    speaker_name: "Xi Jin"
    speaker_title: "Your commander"
    benchmark_provinces: 6
    story: >-
      In the Ordos desert stands Tongwan, the White City, capital of the Xiongnu warlord
      Helian Bobo, who has died, and of his Xia state, which holds Chang'an too. Its walls are
      of rammed earth mixed with lime and steamed. When they were built, Bobo had an awl
      driven into each section; if it went in an inch, the builders were killed.


      You cannot take it by storm. Your general suggests a trick: pretend to retreat, as if
      short of supplies, and draw the Xia army out.
    choices:
      - label: "Feign a retreat"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 2000
        outcome: >-
          The Xia ride out after you, and the wind turns and blows sand in your faces, and a
          Daoist at your side says it is an evil omen; Cui Hao says that omens are for men to
          make. You turn and charge, and break them. You ride into the White City first, and
          take its treasure, its horses and its women. Chang'an is yours within a few years.
        deeds: {take: [k4_ordos, k4_changan]}
      - label: "Starve it out"
        food_bp: -2000
        outcome: >-
          The siege lasts a year. The White City's granaries are deeper than yours.
    history: >-
      Taiwu took Tongwan, the Xia capital, in 427 after a feigned retreat; Wei took Chang'an
      from Xia between 426 and 431.
    sources: ["Wei shu 4 (Shizu)", "Jin shu 130 (Helian Bobo)", "Zizhi tongjian 120"]

  - id: wei_rouran
    scenario: three_kingdoms
    civ: northern_wei
    year: 429
    title: "Across the Gobi"
    place: "The court at Pingcheng"
    speaker: scholar
    speaker_name: "Cui Hao"
    speaker_title: "Your chief adviser"
    needs_alive: [rouran]
    benchmark_provinces: 6
    story: >-
      Your ministers, and the court astrologers, say that this is no year for a war on the
      Rouran: the stars are against it, and the Song in the south will attack while you are
      away.


      Cui Hao says the stars are on your side, the Song are too slow to matter, and that in
      summer the Rouran graze their herds in the north and do not expect you.
    choices:
      - label: "Ride north"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: 2000
        outcome: >-
          You cross the Gobi in summer and fall on the Rouran camps. Their khagan burns his
          tents and flees west, and dies of rage, it is said. You come home with hundreds of
          thousands of horses, cattle and captives. Cui Hao is the man of the hour.
        deeds: {grudges: {rouran: 2000}}
      - label: "Listen to the astrologers"
        legitimacy_bp: -500
        outcome: >-
          You wait. The Rouran raid the border in the autumn, as they do every year.
    history: >-
      In 429, on Cui Hao's advice and against the court's, Taiwu led a great campaign against
      the Rouran and took vast numbers of captives and animals.
    diverged: >-
      The Rouran are gone.
    sources: ["Wei shu 35 (Cui Hao)", "Wei shu 103 (Ruanru)"]

  - id: wei_longcheng
    scenario: three_kingdoms
    civ: northern_wei
    year: 436
    title: "The Last of the Yan"
    place: "Before Longcheng"
    speaker: general
    speaker_name: "Your commander in the east"
    speaker_title: "Before the walls"
    needs_alive: [later_yan]
    benchmark_provinces: 8
    story: >-
      Of all the kingdoms of the north, only two are left that are not yours: Northern Liang
      far in the west, and Northern Yan in the north-east, in its old capital of Longcheng.
      Its king, Feng Hong, has asked Goguryeo for help, and a Goguryeo army has arrived.


      Your army is ready to storm the city.
    choices:
      - label: "Take Longcheng"
        historical: true
        legitimacy_bp: 2000
        outcome: >-
          Before you can storm it, the Goguryeo soldiers take Feng Hong and his people away to
          Goguryeo, plundering the city's armouries on the way out and leaving it burning for
          ten days. You take what is left. You demand Feng Hong from the king of Goguryeo; he
          refuses, and two years later has Feng Hong killed himself. In 439 you take Northern
          Liang, and the whole of the north is yours.
        deeds: {take: [k4_longcheng, k4_youzhou]}
      - label: "Let Feng Hong go, and keep the peace with Goguryeo"
        legitimacy_bp: -500
        outcome: >-
          Feng Hong rules a shrinking kingdom from Longcheng, paying tribute to both of you.
    history: >-
      Northern Yan fell to Wei in 436; its king Feng Hong fled to Goguryeo, whose troops
      burned Longcheng. Wei conquered Northern Liang in 439, uniting northern China.
    diverged: >-
      The Yan are already gone.
    sources: ["Wei shu 4 (Shizu)", "Wei shu 97 (Feng Hong)", "Samguk sagi 18 (Jangsu)"]

  - id: wei_buddhists
    scenario: three_kingdoms
    civ: northern_wei
    year: 446
    title: "Weapons in the Monastery"
    place: "Chang'an"
    speaker: scholar
    speaker_name: "Cui Hao"
    speaker_title: "Your chief minister"
    benchmark_provinces: 8
    story: >-
      You came to Chang'an to put down a rebellion. In a Buddhist monastery your soldiers
      found bows, spears and shields, a wine-brewery, rich men's goods left for safe keeping,
      and secret rooms where the monks kept women.


      Cui Hao, who follows the Daoist Celestial Master Kou Qianzhi and calls you the Perfect
      Lord of Great Peace, says Buddhism is a foreign creed that has no place in China. He
      wants every monk in the empire killed and every image and scripture destroyed. Your son
      the crown prince, a devout Buddhist, begs you not to.
    choices:
      - label: "Destroy the Buddhists"
        historical: true
        influence: {clergy: -3000}
        legitimacy_bp: -1000
        unrest_bp: 2000
        outcome: >-
          The edict goes out. The crown prince delays publishing it, so that many monks have
          time to escape and hide their scriptures. The temples are burned. Within six years
          you will regret it, and your grandson will make it up in stone.
      - label: "Punish the monastery, and no more"
        legitimacy_bp: 500
        outcome: >-
          The monks of Chang'an are executed. The others are told to keep their monasteries
          clean.
    history: >-
      Taiwu's persecution of Buddhism (446), urged by Cui Hao and associated with Kou
      Qianzhi's Daoism, followed the discovery of arms in a Chang'an monastery; the crown
      prince Huang delayed the edict.
    sources: ["Wei shu 114 (Shilao zhi)", "Wei shu 35 (Cui Hao)", "Ware, 'Wei Shou on Buddhism' (1933)"]

  - id: wei_cui_hao
    scenario: three_kingdoms
    civ: northern_wei
    year: 450
    title: "History in Stone"
    place: "Beside the road outside Pingcheng"
    speaker: scholar
    speaker_name: "Cui Hao"
    speaker_title: "Editor of the state history"
    benchmark_provinces: 8
    story: >-
      You have ordered Cui Hao to write the history of the Tuoba house, truthfully. He has
      done it, and had it carved on stone steles a hundred paces long, set up beside the road
      out of the capital, for everyone to read.


      Every traveller is now reading how your ancestors lived in tents, intermarried in ways
      the Chinese find shocking, and murdered one another. Your Xianbei nobles are furious,
      and have long hated Cui Hao, the Chinese gentleman who has run your empire for twenty
      years. They are at the door.
    choices:
      - label: "Give them Cui Hao"
        historical: true
        legitimacy_bp: 500
        influence: {nobility: 2000}
        knowledge_bp: -1500
        outcome: >-
          The steles are smashed. Cui Hao is carted through the streets in a cage while
          soldiers urinate on him, and put to death with his whole clan and those of his
          relatives by marriage, the greatest Chinese families of the north. The same year
          your armies ride to the Yangtze, and look across at the southern capital, and turn
          back.
      - label: "Take the steles down, and keep Cui Hao"
        legitimacy_bp: -500
        influence: {nobility: -1500}
        outcome: >-
          The steles are buried. Cui Hao keeps his office and his head, and the Xianbei nobles
          keep their grudge.
    history: >-
      Cui Hao was executed in 450 with his clan and allied families after his state history,
      carved on steles, offended the Tuoba; the same year Wei armies reached the Yangtze at
      Guabu.
    sources: ["Wei shu 35 (Cui Hao)", "Zizhi tongjian 125", "Mather, 'K'ou Ch'ien-chih and the Taoist Theocracy' (1979)"]

  - id: wei_yungang
    scenario: three_kingdoms
    civ: northern_wei
    year: 460
    title: "Five Buddhas in the Cliff"
    place: "The Wuzhou hills west of Pingcheng"
    speaker: diviner
    speaker_name: "Tanyao"
    speaker_title: "Chief of the Buddhist clergy"
    benchmark_provinces: 8
    story: >-
      You are Emperor Wencheng. Your grandfather Taiwu was murdered by a eunuch; your father
      the crown prince died before him, of grief, it is said. You have restored Buddhism and
      made the monk Tanyao its head. Tanyao survived the persecution in hiding.


      He proposes to carve five caves into the sandstone cliffs west of the capital, each
      holding a Buddha fifty feet high, one for each of the emperors of Wei from Daowu to
      you, so that the emperor is the Buddha and the Buddha is the emperor.
    choices:
      - label: "Carve the five caves"
        historical: true
        legitimacy_bp: 2000
        wealth_bp: -2000
        influence: {clergy: 2500}
        outcome: >-
          The caves of Yungang are cut into the cliff, and the great Buddhas look out across
          the river valley, their faces Xianbei and Indian and Chinese at once. Fifty more
          caves follow, with fifty thousand carved figures. They are still there.
      - label: "Rebuild the temples in the capital"
        legitimacy_bp: 1000
        influence: {clergy: 1500}
        outcome: >-
          New temples rise in Pingcheng, in wood and tile, and in a century they have all
          burned down.
    history: >-
      The first five 'Tanyao caves' at Yungang (c. 460-465) were begun under Wencheng; their
      colossal Buddhas are traditionally linked to the Wei emperors.
    sources: ["Wei shu 114 (Shilao zhi)", "Caswell, Written and Unwritten (1988)"]

  - id: wei_fields
    scenario: three_kingdoms
    civ: northern_wei
    year: 485
    title: "Equal Fields"
    place: "Pingcheng"
    speaker: steward
    speaker_name: "Grand Empress Dowager Feng"
    speaker_title: "Your grandmother, regent"
    benchmark_provinces: 8
    story: >-
      You are Emperor Xiaowen, eighteen. Your grandmother, the Dowager Feng, a Chinese woman
      of the old Yan royal house, has ruled for you since you were a child, and rules still.
      She survived the custom that kills an heir's mother because she was not one.


      Her minister Li Anshi proposes that all the empire's land belong to the state, and be
      shared out: so much to each man and each woman, to be returned when they die or grow
      old, with mulberry land for silk that can be inherited. Great families now hide whole
      villages from the tax collectors; under this law every farmer would be counted, and
      every farmer would have land.
    choices:
      - label: "Share out the fields"
        historical: true
        food_bp: 2500
        wealth_bp: 1500
        unrest_bp: -1500
        influence: {nobility: -1500}
        outcome: >-
          The equal-field law comes into force, with new village heads to keep the registers.
          It will be the land law of China for three hundred years, under the Sui and the Tang,
          and Japan and Korea will copy it.
      - label: "Leave the land as it is"
        influence: {nobility: 1000}
        outcome: >-
          The great families keep their hidden villages. The tax registers stay short.
    history: >-
      The equal-field system (juntian) was proclaimed in 485 under Xiaowen and the Dowager
      Feng, on Li Anshi's proposal, and lasted into the Tang.
    sources: ["Wei shu 110 (Shihuo zhi)", "Wei shu 53 (Li Anshi)", "Holcombe, The Genesis of East Asia (2001)"]

  - id: wei_luoyang
    scenario: three_kingdoms
    civ: northern_wei
    year: 493
    title: "A Campaign That Stopped at Luoyang"
    place: "Luoyang, in the autumn rain"
    speaker: general
    speaker_name: "Tuoba Cheng, Prince of Rencheng"
    speaker_title: "Your kinsman"
    benchmark_provinces: 8
    story: >-
      Your grandmother is dead. You want to move the capital from Pingcheng, on the frontier,
      to Luoyang, the ancient heart of China, and to make your people Chinese: Chinese dress,
      Chinese speech at court, Chinese names. Your Xianbei nobles will never agree.


      So you have announced a great campaign against the south, and marched three hundred
      thousand men to Luoyang, in rain that has not stopped for a month. Now, in armour, you
      order the march to go on. The nobles kneel in the mud in front of your horse and beg
      you to stop. You say you will - if they agree to make Luoyang the capital.
    choices:
      - label: "Make Luoyang the capital"
        historical: true
        legitimacy_bp: 1000
        unrest_bp: 1500
        influence: {nobility: -2000}
        knowledge_bp: 1500
        outcome: >-
          They agree, cheering. Within three years the Xianbei language is banned at court,
          Xianbei dress is forbidden, and your own family name, Tuoba, becomes Yuan. Your
          crown prince, who hates it all, plots to flee north to Pingcheng; you have him put
          to death. In thirty years the frontier garrisons left behind will rise, and the Wei
          will break in two.
        deeds: {capital: k4_luoyang}
      - label: "Go on to the south"
        food_bp: -2000
        outcome: >-
          The army marches on into the rain. The nobles go with you, and they are not happy.
    history: >-
      Xiaowen moved the Wei capital to Luoyang in 493-494 under cover of a southern campaign,
      then banned Xianbei dress and language at court and changed the imperial surname to
      Yuan (496).
    sources: ["Wei shu 7 (Gaozu)", "Wei shu 19 (Tuoba Cheng)", "Zizhi tongjian 138-140"]
