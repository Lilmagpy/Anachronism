schema_version: 1
# Chronicle mode (D-120, D-XXX): the kingdom of Anuradhapura in Lanka, from Pandukabhaya's
# long reign to Dutugemunu's tomb for Elara, 321-153 BC. Almost everything we know of this
# age comes from the Mahavamsa and the older Dipavamsa, written by monks of the Mahavihara
# monastery in Anuradhapura some seven to eight centuries later (c. 5th century AD, the
# Mahavamsa by the monk Mahanama). They are Buddhist, they favour the Sinhalese kings who
# supported their monastery, and they are hostile to Tamil rulers; so the stories here are
# told as tradition. Outside evidence is thin: Ashoka's Rock Edicts II and XIII name
# Tambapanni (Lanka) as a neighbouring land, Brahmi cave inscriptions begin in the third
# century BC, and archaeology shows people living at Anuradhapura centuries before the
# traditional founding. The reign dates are the Mahavamsa's lists adjusted by modern
# scholars, and are approximate and disputed by decades: the chronicle counts from the
# Buddha's death (543 BC in Sinhalese tradition), and its reign lengths do not agree with
# the synchronism with Ashoka. This file follows the common reckoning: Pandukabhaya c. 377-307
# (a legendary seventy years), Mutasiva to c. 255, Devanampiya Tissa c. 254-211 (the mission
# of Mahinda c. 250, matching chapters_maurya), Elara c. 205-161 and Dutugemunu c. 161-137
# (the commonly quoted dates). The kings the chronicle puts between Tissa and Elara
# (Uttiya, Mahasiva, Suratissa, Sena and Guttika) are left out, as their reign lengths cannot
# be fitted into the few years left, and Asela, the last of them, takes Tissa's place in
# this line. The Mahavamsa's account of Dutugemunu's reign is real source material for later
# Sinhalese national feeling; take the war as that, not as neutral report. Facts follow the
# Mahavamsa (trans. Geiger), Dipavamsa, Ashoka's edicts, and modern work by Gunawardana,
# Paranavitana, Coningham, Bechert and Walters. benchmark_provinces is 1: this map has one
# province for the island.
chapters:
  - id: lanka_pandukabhaya
    scenario: maurya
    civ: lanka
    year: -321
    title: "The City of Pandukabhaya"
    place: "Anuradhapura, by the Malvatu river"
    speaker: scholar
    speaker_name: "A monk of the Mahavihara, eight centuries later"
    speaker_title: "Who wrote it down"
    benchmark_provinces: 1
    story: >-
      You are Pandukabhaya, the first great king of the island, as the Mahavamsa tells it. It
      says you are very old: the monks give you seventy years on the throne, which is the kind
      of figure only a legend uses. They say that an astrologer warned your grandfather that his
      grandson would kill his uncles, that your mother was kept in a tower, that your
      uncles hunted you through the hills, and that you killed them at a battle, and that a
      yakkha spirit helped you.


      Whatever the truth of that, you are king over the villages of the dry zone, and
      you have marked out a city by a stream. The monks say you gave each group its place:
      shrines for the yakkha spirits, a cemetery, quarters for the outcast, a house for each of the
      holy men of other faiths. And that the heart of the country will be a great tank.
    choices:
      - label: "Make a permanent city, with a place for every people and every god"
        historical: true
        legitimacy_bp: 1500
        wealth_bp: -500
        outcome: >-
          Anuradhapura becomes the capital, and stays one for more than a thousand years. The tradition
          calls its first tank the Abhaya wewa after you, and says you set the boundaries of the
          villages across the island. Archaeologists find that people have lived on the site since
          long before your day, and that a city, with writing, grew there in the next two
          centuries. Over it are laid the spirit-shrines, then the Buddhist stupas, in a pattern
          that outlasts you.
      - label: "Rule from camp, among the village headmen"
        legitimacy_bp: -500
        outcome: >-
          Your headmen like it. The island has no capital, and the next king has to start again.
    history: >-
      The Mahavamsa credits Pandukabhaya with founding Anuradhapura (traditionally c. 377
      BC); archaeology shows the site was already settled and grew into a city in the
      following centuries.
    sources: ["Mahavamsa 9-10", "Coningham et al., Anuradhapura (1999-2006)", "Gunawardana, Robe and Plough (1979)"]

  - id: lanka_embassy
    scenario: maurya
    civ: lanka
    year: -252
    title: "Pearls for the Friend in Pataliputra"
    place: "Anuradhapura"
    speaker: maurya
    speaker_name: "Envoys of Ashoka"
    speaker_title: "Returning from Pataliputra"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are Devanampiya Tissa, 'Tissa, Beloved of the Gods'. Your father Mutasiva
      has died after a very long reign. You are the second of his sons, and the monks of later
      days say the best. In India, the great king Ashoka, of the Maurya empire, has been
      your friend, though you have never met: you sent him, the Mahavamsa says, pearls, conches
      and other gifts, and he replied with the things of a coronation.


      The envoys are back from Pataliputra with a message. Ashoka says that he has taken
      refuge in the Buddha, the teaching and the order of monks, and that you, too, should.
      The tradition says that you are to be crowned a second time, with Ashoka's own regalia.
    choices:
      - label: "Be crowned again with the Mauryan regalia"
        historical: true
        legitimacy_bp: 1500
        outcome: >-
          The coronation is held in the old city, in the presence of Ashoka's ambassadors, with
          a fan, a diadem, a sword and sandals sent from Pataliputra, and you take the title
          'Devanampiya' that Ashoka uses himself. The island has not had a friend so large before.
          You do not yet say whether you will take refuge in the Buddha.
      - label: "Send gifts back, and keep your own coronation"
        legitimacy_bp: 200
        outcome: >-
          Ashoka's envoys are polite. Lanka stays small.
    history: >-
      The Mahavamsa says that Tissa sent gifts to Ashoka, that Ashoka's embassy brought a second
      consecration, and that the title 'Devanampiya' was shared with Ashoka; Ashoka's Rock Edicts
      II and XIII name Tambapanni as a neighbouring land.
    diverged: >-
      Ashoka's empire is gone; no envoys come.
    sources: ["Mahavamsa 11", "Ashoka, Rock Edicts II and XIII", "Thapar, Asoka and the Decline of the Mauryas (1961)"]

  - id: lanka_mahinda
    scenario: maurya
    civ: lanka
    year: -250
    title: "The Riddle of the Mango Tree"
    place: "Mihintale, the Missaka mountain"
    speaker: diviner
    speaker_name: "Mahinda"
    speaker_title: "A monk from India, son of Ashoka"
    benchmark_provinces: 1
    story: >-
      You are Devanampiya Tissa. On the full-moon day of the month of Jetthamula, according to
      the Mahavamsa, you went hunting deer with a retinue of forty thousand men on Mount
      Missaka. A stag led you astray, and on a ledge beneath the mountain's rock you met a
      monk in a yellow robe and six others, who called you by name.


      They say he is Mahinda, the son of the Emperor Ashoka, and has come over the sea, through
      the air, as the story says, from India. He is a monk of the Buddha. He asks you a riddle
      about a mango tree, and about the other trees, and about whether there is a tree that is
      not a mango tree.
    choices:
      - label: "Answer the riddle, and listen to the teaching"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1500}
        outcome: >-
          You answer well. Mahinda preaches to you, and to your retinue, and to the women of your
          court, and you are converted that day. You give him your Mahameghavana pleasure garden,
          where the Great Monastery is built, with the order of monks the earliest in Lanka.
          Lanka will be a Buddhist country for the next two thousand years. The Sinhalese
          remember the day, the Poson full moon, as the coming of the teaching.
      - label: "Honour the monks, but keep your ancestral gods"
        legitimacy_bp: 500
        outcome: >-
          Mahinda is a courteous guest and preaches in the villages. It takes a generation for
          the new teaching to spread.
    history: >-
      Sri Lankan tradition (Dipavamsa, Mahavamsa) says that Mahinda, son of Ashoka, brought
      Buddhism to Lanka c. 250 BC and converted Devanampiya Tissa at Mihintale; the story is
      later than the events but Buddhism certainly flourished in Lanka from this age.
    sources: ["Mahavamsa 13-15", "Dipavamsa 12-14", "Bechert, Buddhism in Ceylon (1978)"]

  - id: lanka_bodhi
    scenario: maurya
    civ: lanka
    year: -246
    title: "A Branch of the Tree of Enlightenment"
    place: "The port of Jambukola, and Anuradhapura"
    speaker: maurya
    speaker_name: "Sanghamitta"
    speaker_title: "A nun, daughter of Ashoka"
    needs_alive: [maurya]
    benchmark_provinces: 1
    story: >-
      You are Devanampiya Tissa. The nuns of your kingdom cannot be ordained without nuns of
      their own, and Mahinda asks you to send for his sister Sanghamitta, who is a nun in
      India. She is also, the Mahavamsa says, bringing the right branch of the tree in
      Bodh Gaya under which the Buddha reached enlightenment, which Ashoka has cut off with
      ceremony and carried to the sea in a golden pot.


      You stand waist-deep in the sea at the port of Jambukola to welcome the ship. Then the
      tree must be carried inland to the city and planted.
    choices:
      - label: "Plant the branch in the Great Monastery's garden"
        historical: true
        legitimacy_bp: 1500
        influence: {clergy: 1000}
        outcome: >-
          The tradition says the branch is planted at Anuradhapura with an earthquake, and that
          it put out leaves and fruit at once. Sanghamitta ordains Queen Anula and the women of the court. The
          Jaya Sri Maha Bodhi is still alive, venerated and fenced about; it is the oldest tree
          planted by a person for which a date is recorded. You also build the first stupa of
          the island, the Thuparama, over a relic of the Buddha that Mahinda brought.
      - label: "Keep the branch within the palace"
        legitimacy_bp: -500
        outcome: >-
          The monks object. The tree is not a possession of kings, they say, but of the order.
    history: >-
      The Mahavamsa says the nun Sanghamitta brought a branch of the Bodhi tree to Anuradhapura,
      where the Sri Maha Bodhi still grows; the Thuparama is the island's oldest traditional
      stupa.
    diverged: >-
      Ashoka's empire is gone; no ship comes.
    sources: ["Mahavamsa 15-19", "Dipavamsa 15-17", "Coningham, Anuradhapura (1999)"]

  - id: lanka_elara
    scenario: maurya
    civ: lanka
    year: -204
    title: "A Prince from the Chola Country"
    place: "Anuradhapura"
    speaker: chola
    speaker_name: "Elara"
    speaker_title: "A nobleman from the Chola country"
    benchmark_provinces: 1
    story: >-
      You are Asela, king in Anuradhapura, a brother of the pious Tissa, who is dead. The
      chronicle says that two horse dealers from the south of India, Sena and Guttika, held
      the throne for twenty-two years, and that you overthrew them. Now another comes: Elara, a nobleman of the Chola country, with an army and
      a following of southern men.


      You have an army, and you have the monks, who preach that it is a king's duty to defend
      the teaching. The people of the south coast say nothing: they do not love you
      much, and they may not love him either.
    choices:
      - label: "Take the field against Elara"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 1000
        outcome: >-
          The Mahavamsa says you were beaten and killed in battle. Elara takes the capital and,
          for forty-four years, reigns from Anuradhapura. The monk-chroniclers, who disliked a
          non-Buddhist king, say nothing worse of him than that he was an unbeliever, and speak
          with some respect of his justice.
        deeds: {ruler_falls: "is beaten and killed by Elara"}
      - label: "Offer Elara a place at court"
        legitimacy_bp: -1000
        outcome: >-
          Elara is polite and takes it. In a few years, there is no difference between his place
          and yours.
        deeds: {ruler_falls: "is pushed aside by Elara"}
    history: >-
      According to the Mahavamsa, a Tamil prince, Elara, defeated Asela and ruled at Anuradhapura
      for forty-four years (traditionally c. 205-161 BC).
    sources: ["Mahavamsa 21", "Geiger, Culavamsa and Mahavamsa", "Gunawardana, Robe and Plough (1979)"]

  - id: lanka_bell
    scenario: maurya
    civ: lanka
    year: -180
    title: "The Bell of Justice"
    place: "Anuradhapura, before the palace"
    speaker: steward
    speaker_name: "A minister"
    speaker_title: "Of your council"
    benchmark_provinces: 1
    story: >-
      You are Elara. Tamil from the Chola country, you have been king in Lanka for a quarter of
      a century. The Mahavamsa tells a story of you, which later tellers love: you have hung a
      bell by the palace, with a rope, so that anyone wronged can ring it and be heard at any hour.


      The story says that a cow has rung it. Your son, riding in a chariot to a temple,
      accidentally ran a wheel over the neck of her calf. The cow rings the bell, not for
      herself. Your ministers wait to see what the king will do about his son.
    choices:
      - label: "Give the cow the justice you would give anyone"
        historical: true
        legitimacy_bp: 2000
        unrest_bp: -1500
        outcome: >-
          The tradition says that you had your son's head cut off by a wheel of the same
          chariot, in the same place. In another tale a snake swallowed a bird's young and you
          punished it. They are tales, told to show a king who loved the law more than his own
          house; the chroniclers, who liked neither your religion nor your race, tell them
          anyway. Your people remember you. In most of Lanka you keep the peace for decades,
          and the south is the only part of the island you cannot rule.
      - label: "Pay the cow's keeper, and spare your son"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          The bell hangs unrung afterwards. Nobody trusts it.
    history: >-
      The Mahavamsa tells of Elara's bell of justice and of his rigorous judgement of his own
      son as a story of a just king; whatever its truth, the chroniclers' respect for him was
      long remembered.
    sources: ["Mahavamsa 21.15-34", "Geiger, Mahavamsa (1912)"]

  - id: lanka_duel
    scenario: maurya
    civ: lanka
    year: -161
    title: "Two Kings on Two Elephants"
    place: "The south gate of Anuradhapura"
    speaker: general
    speaker_name: "A messenger of Gamani"
    speaker_title: "Prince of Ruhuna"
    benchmark_provinces: 1
    story: >-
      You are Elara, now an old man. In the south of the island, in Ruhuna, a Sinhalese prince
      named Gamani, who will be called Dutugemunu, has been raised on stories of Tamil
      oppression and the glory of the faith. The Mahavamsa says that as a boy he lay on his bed
      with his knees drawn up and said that he could not stretch himself out, because the Tamil
      was north of him and the sea to the south.


      He has now taken the forts north of Ruhuna, one by one, and stands before your capital. He
      sends word. Let no more men die; let the two kings fight alone, on elephants, at the
      south gate, and the winner will have the island.
    choices:
      - label: "Accept the challenge, and ride out on your elephant"
        historical: true
        legitimacy_bp: 500
        outcome: >-
          You fight him from your elephant, Maha Pabbata, and he from his, Kandula. He
          dodges your spear, and you die from his. The Mahavamsa says that your elephant fell
          dead with you. The island is united, in the monks' account, under a Sinhalese
          Buddhist king for the first time. The chronicle makes much of that. Archaeology
          sees only a long series of contests between ports and river valleys.
        deeds: {ruler_falls: "is killed in single combat by Dutugemunu"}
      - label: "Close the gates and hold the city"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The siege is long, and your allies in the north begin to wonder whom to follow.
        deeds: {ruler_falls: "dies while the city is besieged"}
    history: >-
      The Mahavamsa tells that Dutugemunu killed Elara in single combat in c. 161 BC and became
      king of all Lanka; the account is one-sided and later in date.
    sources: ["Mahavamsa 22-25", "Gunawardana, Robe and Plough (1979)"]

  - id: lanka_stupa
    scenario: maurya
    civ: lanka
    year: -153
    title: "A Tomb for the Enemy, a Stupa for the Faith"
    place: "Anuradhapura"
    speaker: scholar
    speaker_name: "The elders of the Great Monastery"
    speaker_title: "Come to ask for a stupa"
    benchmark_provinces: 1
    story: >-
      You are Dutugemunu, king of all the island, by the telling of the monks. You have
      defeated thirty-odd Tamil chiefs in your war, if the chronicle is right, and you are not
      at peace with yourself. The monks say you wept for the men who died on your way; eight
      arahats, called to comfort you, told you that of all the dead only one and a half had
      been true followers of the Buddha, and the rest did not count. That is how the story is
      told, by monks who needed your help.


      Two things are before you. You have burned Elara's body at the place where he fell and
      raised a tomb, and ordered that no one, not even a prince on a litter, shall pass it with
      music playing. And the elders ask you now for the great stupa of the Mahavihara, the
      Maha Thupa, which later ages call the Ruwanweli.
    choices:
      - label: "Honour Elara's tomb, and begin the great stupa"
        historical: true
        legitimacy_bp: 2500
        unrest_bp: -1500
        influence: {clergy: 1500}
        outcome: >-
          The tomb stands for centuries; even in the nineteenth century, it is said, the
          Sinhalese kings passing the spot got down from their litters. The foundation stone of
          the stupa is laid on the full moon of the month of Vesakha, a dome rising to the
          sky, and the monks of many lands are invited to see it. You die in about 137 BC,
          before it is finished, and are carried to see its glory in the last hour. The
          Ruwanweli, rebuilt and whitened, is still the pride of Anuradhapura.
      - label: "Level Elara's tomb, and build the stupa on its stones"
        legitimacy_bp: -1500
        unrest_bp: 1500
        outcome: >-
          The stupa goes up, and the Tamils of the north, and the Sinhalese who admired Elara,
          remember the tomb.
    history: >-
      Dutugemunu ruled c. 161-137 BC in the Mahavamsa's reckoning; it tells of his honours to
      Elara's tomb and of the Maha Thupa (Ruwanweli) at Anuradhapura, begun in his reign and
      finished after his death.
    sources: ["Mahavamsa 25-32", "Geiger, Mahavamsa (1912)", "Bechert, Buddhism in Ceylon (1978)"]
