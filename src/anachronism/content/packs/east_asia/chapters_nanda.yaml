schema_version: 1
# Chronicle mode (D-120, D-XXX): the Nanda kingdom of Magadha, from the last king's
# great army to the fall of Pataliputra, 321-315 BC (all dates approximate). This is a short
# chronicle on purpose, because the sources are late and disagree. There is no Nanda writing
# at all. What survives: the Greek historians of Alexander (Diodorus 17.93, Curtius 9.2,
# Plutarch Alexander 62), who heard of the king of the Gangaridae and Prasii, "Agrammes" or
# "Xandrames", at the Hyphasis in 326 BC, and wrote some three centuries later; the Puranas;
# the Buddhist Mahavamsa and its much later commentary, the Mahavamsa-tika (the story of the
# hoarded treasure, of the porridge and of the general Bhaddasala); the Jain
# Parishishtaparvan of Hemachandra (12th century AD); and the play Mudrarakshasa
# (perhaps 4th-8th century AD). They do not agree on the king's birth, on his name (Agrammes
# is generally taken to be the Greek form of a title or name of the last Nanda, but even that
# is a guess), or on how he ended. The year of the fall is 321 BC or a few years later by the
# usual reckoning; some scholars put it about 317-313. Dhana Nanda's reign is set to end at
# the last chapter, with a comment in the scenario. Modern work by Thapar, Raychaudhuri
# and Trautmann. benchmark_provinces counts the provinces of this map the real Nandas held at
# that date (the last chapter is 1, since the map cannot show none).
chapters:
  - id: nanda_great_army
    scenario: maurya
    civ: nanda
    year: -321
    title: "The Barber's Son and the Largest Army in India"
    place: "Pataliputra"
    speaker: scholar
    speaker_name: "A Greek historian, three centuries later"
    speaker_title: "Who knows you only by rumour"
    benchmark_provinces: 12
    story: >-
      You are Dhana Nanda, the last of the Nandas, lord of Magadha and the whole Ganges
      plain. Your family took the throne from the Shaishunagas two generations ago; the
      Puranas call your ancestor Mahapadma 'the destroyer of all the warrior houses'.
      The Greeks who saw India's frontier say that you are called Agrammes, that you can
      put two hundred thousand foot, twenty thousand horse, two thousand chariots and
      thousands of elephants in the field, and that when Alexander's men heard it, they
      refused to march on. Curtius adds that your father was a barber, the queen's lover,
      who murdered his master. The Jain tradition tells a version of the same story.


      The Buddhist tradition, written much later, says you hoarded wealth beyond counting, and
      taxed hides, gums, trees and stones to get it, and then buried the treasure in the river.
      Your people do not love you. The story goes that a poor brahmin, Chanakya, was once
      thrown out of your dining hall, and that he has sworn not to tie up his hair until you
      are gone. Nobody will say whether the story is true.
    choices:
      - label: "Keep the taxes, the treasure and the great army"
        historical: true
        wealth_bp: 1500
        unrest_bp: 800
        legitimacy_bp: -500
        outcome: >-
          Your treasury stays the richest in India, and your army the largest. Your officials
          go on collecting from the traders and the villages, and nobody dares complain at
          court. In the Greek telling, this is the king whom his subjects despised for his
          low birth and his greed; in the Buddhist telling, his gold would not save him.
      - label: "Ease the taxes and win your people back"
        wealth_bp: -1500
        unrest_bp: -1200
        legitimacy_bp: 1000
        outcome: >-
          The merchants of Pataliputra bless you for a season, and the treasurers
          do not. The grain flows in more slowly, and the army must be paid from the
          hoard.
    history: >-
      Greek writers of Alexander's time (Diodorus 17.93, Curtius 9.2, Plutarch, Alexander
      62) describe a hated king of the Prasii and Gangaridae, with a great army, whose father,
      they say, was a barber. The Buddhist and Jain traditions add a hoard and a feud with
      Chanakya; they are much later and cannot be checked.
    sources: ["Diodorus 17.93", "Curtius 9.2", "Plutarch, Alexander 62", "Mahavamsa-tika (Vamsatthappakasini) on Mahavamsa 5", "Parishishtaparvan 8", "Thapar, Asoka and the Decline of the Mauryas (1961)"]

  - id: nanda_bhaddasala
    scenario: maurya
    civ: nanda
    year: -318
    title: "A Boy in the Punjab"
    place: "Pataliputra"
    speaker: general
    speaker_name: "Bhaddasala"
    speaker_title: "Commander of your armies, in the Buddhist tradition"
    benchmark_provinces: 12
    story: >-
      You are Dhana Nanda. Word comes from the north-west that a young man named
      Chandragupta, the Greeks call him Sandrokottos, has gathered an army in the Punjab,
      among the clans and the leaderless Greek garrisons of Alexander's empire, and that the
      brahmin Chanakya is behind him. The Buddhist chronicle commentary says that
      he first marched straight at your heart and was beaten, and that Chanakya, so the tale
      goes, then taught him to take the border towns first and leave the capital for last.
      It names your general as Bhaddasala.


      None of this can be checked: the commentary was written some fifteen hundred years after
      the events, and Greek writers only say that Sandrokottos was a poor boy who seized power
      by raising the people against a hated king. Your generals say that the boy must be crushed
      before he is strong.
    choices:
      - label: "Send the army west to crush the upstart"
        historical: true
        unrest_bp: 500
        outcome: >-
          The army marches. The tradition says that the contest was long, and that the
          border country fell to Chandragupta before the heartland did. What is certain
          is that the army that frightened Alexander's soldiers did not save the plain.
        deeds: {men: 8000}
      - label: "Hold the capital, and let the boy come"
        legitimacy_bp: -300
        outcome: >-
          You keep your strength at Pataliputra. The Punjab is lost to you in the meantime, and
          the boy grows bolder.
    history: >-
      Chandragupta Maurya rose against the Nandas from the north-west; the Buddhist commentary
      gives the story of the failed first attack and of Bhaddasala. The Greek writers
      (Plutarch, Alexander 62; Justin 15.4) show only that Sandrokottos raised the people
      against a hated king.
    sources: ["Plutarch, Alexander 62", "Justin 15.4", "Mahavamsa-tika (Vamsatthappakasini)", "Thapar, A History of India (1966)"]

  - id: nanda_last_day
    scenario: maurya
    civ: nanda
    year: -315
    title: "The Last Day of Pataliputra"
    place: "Pataliputra"
    speaker: steward
    speaker_name: "A minister of the Nandas"
    speaker_title: "Whom the Jains and the playwrights both remember"
    benchmark_provinces: 1
    story: >-
      You are Dhana Nanda. The Mauryan army is before Pataliputra, and the
      Greeks who later saw it described a great timber wall with hundreds of towers and a
      wide moat. In the story, your officials are slipping away. How you
      ended is the part of your story on which the old writers differ most.


      The Buddhist chronicles say you were killed when the city fell. The Jain
      Parishishtaparvan says you were allowed to leave, with as much as a single chariot
      could carry, and that your daughter, as you left, fell in love with Chandragupta and was allowed to go to him. The
      play Mudrarakshasa, the latest of these, has Chanakya win over your loyal chief minister Rakshasa by a
      trick, so that he serves the Mauryas. The Greeks do not say.
    choices:
      - label: "Leave the city with what one chariot can carry"
        historical: true
        legitimacy_bp: -2000
        unrest_bp: 1500
        outcome: >-
          The gates are opened. The Jain tale says you drive out with your treasure in one
          chariot, and that you are allowed to go. Chanakya, the tales say, ties up his hair at last.
          Your ministers, in the play, go to work for the new king.
        deeds: {ruler_falls: "leaves Pataliputra with one chariot", give: [in_magadha, in_anga, in_kashi, in_vatsa, in_kosala, in_panchala, in_kuru, in_surasena, in_vanga, in_pundra, in_chedi], give_to: maurya}
      - label: "Hold the walls to the last man"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          This is the Buddhist ending, in which you are killed in the fall of the city. Your
          captains die with you, and the house of Nanda has no one left to rally.
        deeds: {ruler_falls: "is killed when Pataliputra falls"}
    history: >-
      Chandragupta Maurya took Pataliputra and ended the Nanda dynasty, about 321 BC by the
      usual reckoning, perhaps later. Sources disagree: Buddhist tradition has Dhana Nanda
      killed, Jain tradition has him leave with one chariot of treasure. Both are late.
    sources: ["Mahavamsa 5", "Parishishtaparvan 8", "Mudrarakshasa", "Thapar, Asoka and the Decline of the Mauryas (1961)"]
