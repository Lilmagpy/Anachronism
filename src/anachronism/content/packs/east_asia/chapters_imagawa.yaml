schema_version: 1
# Chronicle mode (D-120, D-190): the Imagawa of Suruga, from Okehazama to the surrender of
# Kakegawa, with an epilogue in 1575. Each chapter opens in its year; one choice is what
# history chose (historical: true). Facts follow the Shincho koki, the Mikawa monogatari, the
# Koyo gunkan (a later and partisan source, used with care), and modern work by Turnbull,
# Conlan and Sadler. The story that Uesugi Kenshin sent salt to his enemy Shingen is a later
# tale (the "salt to the enemy" legend) and is told as one. Map note: Totomi is part of
# Suruga on this map, so Mikawa is the only other province. Because Suruga is the player's
# last province after 1562, it cannot be given away: its loss in 1568-69 is told but not
# enacted, and benchmark_provinces stays 1 (the real house held nothing after 1569).
chapters:
  - id: ima_okehazama
    scenario: sengoku
    civ: imagawa
    year: 1560
    title: "The Road to Kyoto"
    place: "The gorge of Okehazama, Owari"
    speaker: general
    speaker_name: "Matsudaira Motoyasu"
    speaker_title: "Your vassal, in the van"
    benchmark_provinces: 2
    story: >-
      You are Imagawa Yoshimoto, forty-one, lord of Suruga, Totomi and Mikawa, the greatest
      lord of the east. You are marching on Kyoto with an army of perhaps twenty-five thousand
      to put the shogun in his place. Between you and the capital is Owari, a small province
      ruled by a young man the world calls a fool.


      Your vanguard has taken the border forts of Marune and Washizu, with your young hostage
      vassal Matsudaira Motoyasu in the van. Now you are camped in a narrow, wooded gorge
      called Okehazama, where the local people have brought you gifts of sake and the heads of
      the enemy have been laid out for your inspection. The afternoon is hot and heavy.
    choices:
      - label: "Rest the army in the gorge"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          A cloudburst covers the hills, and out of the rain comes Oda Nobunaga with three
          thousand men. Your guards think it is a brawl among your own and you step out of
          your tent to shout at them. Hattori Koheita wounds you, and Mori Shinsuke takes
          your head. Your army, ten times as large, turns and runs for home. Your son Ujizane
          inherits a house that has lost its best generals in one afternoon.
        deeds: {ruler_falls: "is killed at Okehazama"}
      - label: "Press on past the gorge before dark"
        legitimacy_bp: 500
        unrest_bp: 500
        outcome: >-
          Your army is clear of the gorge when the rain begins. Nobunaga's attack falls on empty
          ground, and the road to Kyoto stays open.
      - label: "Entrench the camp and send out scouts"
        legitimacy_bp: 500
        materials_bp: -500
        outcome: >-
          Your scouts find Nobunaga's men moving in the hills, and the camp is ready when the
          storm breaks. The march to Kyoto is delayed, and the army grows restless.
    history: >-
      On 12 June 1560 (Eiroku 3) Oda Nobunaga surprised Imagawa Yoshimoto's camp at Okehazama
      in a storm and killed him; his son Ujizane succeeded.
    sources: ["Shincho koki, book 1", "Mikawa monogatari", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ima_mikawa
    scenario: sengoku
    civ: imagawa
    year: 1561
    title: "The Hostages of Sunpu"
    place: "Sunpu castle, Suruga"
    speaker: general
    speaker_name: "Your retainers"
    speaker_title: "At the council in Sunpu"
    benchmark_provinces: 1
    story: >-
      You are Imagawa Ujizane, twenty-three, the new lord of Suruga. Your father is dead and
      your men are quarrelling about what to do about Mikawa. Matsudaira Motoyasu, your father's
      hostage vassal, went home to his castle at Okazaki after Okehazama and did not come back.
      He is now making war on your border castles, and has made peace with Oda Nobunaga.


      His wife, Lady Tsukiyama, and his young children are still in Sunpu. So is his
      father-in-law Sekiguchi Chikanaga, who has not been heard to condemn him. Your elders
      say that they should be made an example.
    choices:
      - label: "Make an example of the family"
        historical: true
        legitimacy_bp: -1500
        unrest_bp: 500
        outcome: >-
          Sekiguchi Chikanaga is ordered to kill himself. In the spring of 1562 Motoyasu captures
          the family of one of your Kaminogo captains and exchanges them for his wife and
          children, who go home. In 1562 he and Nobunaga swear an alliance at Kiyosu, and
          Mikawa is lost to you for good. He takes a new name: Ieyasu.
        deeds: {give: [j_mikawa], grudges: {oda: 500}}
      - label: "Send the army to retake Mikawa"
        legitimacy_bp: 500
        unrest_bp: 1000
        food_bp: -1000
        outcome: >-
          Your army fights through a hard summer, and in the end Mikawa remains as before, and
          so does Motoyasu.
        deeds: {men: 8000}
      - label: "Trade the hostages for terms"
        legitimacy_bp: -1000
        wealth_bp: -500
        outcome: >-
          You send the family home to Okazaki in exchange for a truce. Motoyasu keeps Mikawa,
          and your elders say you have given away what the sword could have kept.
        deeds: {give: [j_mikawa]}
    history: >-
      Matsudaira Motoyasu (Ieyasu) broke from the Imagawa in 1561, retook Mikawa and allied
      with Nobunaga in 1562; Ujizane punished his wife's family and later exchanged the
      hostages.
    sources: ["Mikawa monogatari", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ima_salt
    scenario: sengoku
    civ: imagawa
    year: 1567
    title: "Salt for Kai"
    place: "Sunpu castle, Suruga"
    speaker: general
    speaker_name: "Your Hojo kinsmen"
    speaker_title: "Envoys from Odawara"
    needs_alive: [takeda]
    benchmark_provinces: 1
    story: >-
      You are Imagawa Ujizane, twenty-nine. For thirteen years the Imagawa, the Takeda and the
      Hojo have been bound by marriage in the three-way pact of 1554. Now Takeda Shingen has
      begun to look at Suruga: his heir Yoshinobu, who held to the alliance, has been shut up and
      is dying, and your sister, Yoshinobu's wife, has been sent back to Sunpu.


      Kai has no sea, and every grain of salt for Shingen's soldiers and peasants comes over your
      roads or the Hojo's. Your Hojo kinsmen propose that both of you stop it.
    choices:
      - label: "Cut the salt road to Kai"
        historical: true
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          The salt stops coming. Shingen's people suffer for a time. A story told later says that
          Uesugi Kenshin, Shingen's old enemy, sent salt across the mountains rather than see him
          beaten by hunger; that is a legend of a later century, but it is certain that Shingen
          found other roads, and a reason for his own invasion.
        deeds: {grudges: {takeda: 2000}}
      - label: "Keep the salt roads open"
        wealth_bp: 500
        outcome: >-
          Shingen thanks you, and his agents go on mapping your passes. The salt merchants
          of Suruga grow rich.
      - label: "Ask the Hojo to mediate"
        legitimacy_bp: 500
        wealth_bp: -500
        outcome: >-
          Odawara sends envoys to Kai, and Shingen receives them politely and answers with
          delays. Your Hojo kinsmen are not pleased to be used as messengers.
    history: >-
      In 1567 the Imagawa (and Hojo) cut off salt to the Takeda, after the break between
      Shingen and Ujizane; the story of Kenshin sending salt to his enemy is a later tale.
    diverged: >-
      The Takeda are gone.
    sources: ["Koyo gunkan", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ima_satta
    scenario: sengoku
    civ: imagawa
    year: 1568
    title: "Twenty-One Turncoats"
    place: "Satta pass, Suruga"
    speaker: ruler
    speaker_name: "Takeda Shingen"
    speaker_title: "Lord of Kai, by letter"
    needs_alive: [takeda]
    benchmark_provinces: 1
    story: >-
      In December Takeda Shingen crosses the mountains into Suruga with an army, and in the
      same weeks Tokugawa Ieyasu marches on Totomi from the west, the two having divided your
      lands between them. Your elders ride to meet the Takeda at the Satta pass, above the bay.


      On the morning of the fight, twenty-one of your commanders, long bribed by Shingen's
      letters, lead their men away from you. You have too few to hold the pass.
    choices:
      - label: "Fall back on Sunpu"
        historical: true
        legitimacy_bp: -2500
        unrest_bp: 2000
        outcome: >-
          Sunpu is plundered. Your wife, Lady Hayakawa, a daughter of the Hojo, has to flee on
          foot, and her father is furious. You take what is left of the army to Kakegawa, on the
          western border, where Ieyasu's army is already closing in.
        deeds: {grudges: {takeda: 1000}}
      - label: "Ask Shingen for terms"
        legitimacy_bp: -1500
        wealth_bp: -500
        outcome: >-
          Shingen's envoy takes your message and sends back a demand for your lands.
      - label: "Stand at the pass with the men who remain"
        legitimacy_bp: -1000
        unrest_bp: 1000
        outcome: >-
          Your loyal men hold the pass for a morning against twice their number, and are
          swept away by noon.
        deeds: {men: 3000}
    history: >-
      In December 1568 Shingen invaded Suruga; more than twenty Imagawa retainers defected and
      Ujizane fled to Kakegawa.
    diverged: >-
      The Takeda are gone.
    sources: ["Koyo gunkan", "Mikawa monogatari"]

  - id: ima_kakegawa
    scenario: sengoku
    civ: imagawa
    year: 1569
    title: "Five Months at Kakegawa"
    place: "Kakegawa castle, Totomi"
    speaker: ruler
    speaker_name: "Hojo Ujiyasu"
    speaker_title: "Your wife's father, from Odawara"
    needs_alive: [hojo]
    benchmark_provinces: 1
    story: >-
      You are Imagawa Ujizane, thirty-one. Tokugawa Ieyasu has surrounded Kakegawa with his
      army, and the siege is in its fifth month. Your men are hungry. Shingen holds Sunpu.


      Your wife's father, Hojo Ujiyasu, who has quarrelled with Shingen over what he did to you,
      offers to arrange terms: you leave the castle and live under his protection. Your
      captains say that to surrender is to lose Totomi for ever.
    choices:
      - label: "Leave the castle, and go to the Hojo"
        historical: true
        legitimacy_bp: -3000
        outcome: >-
          Ieyasu takes Totomi, as he had agreed with Shingen. You go to Odawara under Hojo
          protection, and your father-in-law makes peace with the Uesugi against the Takeda
          before the year is out. The Imagawa, who ruled Suruga for two hundred years, are lords
          of nothing.
        deeds: {}
      - label: "Hold Kakegawa to the last"
        legitimacy_bp: 500
        unrest_bp: 2000
        outcome: >-
          Your garrison starves for another month, and the end comes anyway.
      - label: "Treat with Ieyasu for a pension"
        legitimacy_bp: -1500
        wealth_bp: 500
        outcome: >-
          Ieyasu is willing to let you live on a small stipend. Your father-in-law is not
          pleased, and your captains say you have sold the castle.
    history: >-
      Ujizane surrendered Kakegawa in 1569 and went to the Hojo; Totomi went to Ieyasu and
      Suruga to Shingen.
    diverged: >-
      The Hojo are gone.
    sources: ["Mikawa monogatari", "Turnbull, The Samurai Sourcebook (1998)"]

  - id: ima_kemari
    scenario: sengoku
    civ: imagawa
    year: 1575
    title: "A Game of Kemari"
    place: "Kyoto"
    speaker: oda
    speaker_name: "Oda Nobunaga"
    speaker_title: "Master of the capital"
    needs_alive: [oda]
    benchmark_provinces: 1
    story: >-
      Six years on, you are a man of no lands, living in Kyoto on the charity of better-placed
      friends. Your father-in-law is dead. You are known as a lover of poetry and of kemari, the court game of kicking a
      leather ball without letting it touch the ground.


      Oda Nobunaga, the man whose victory at Okehazama began your fall, is in the capital. He
      has asked whether you would play in front of his guests.
    choices:
      - label: "Play before his guests"
        historical: true
        legitimacy_bp: -1000
        outcome: >-
          Your kicks are applauded. Nobunaga's court sees the heir of the great Imagawa as a
          skilled courtier, and nothing more. In time Ieyasu will give you a pension, and your
          sons will serve the Tokugawa as masters of ceremony. You die in 1615.
        deeds: {ruler_falls: "becomes a courtier and a master of the ball"}
      - label: "Decline politely"
        legitimacy_bp: 500
        outcome: >-
          You excuse yourself on grounds of age, and Nobunaga does not ask again.
      - label: "Ask him for a small domain"
        legitimacy_bp: -500
        wealth_bp: 500
        outcome: >-
          Nobunaga listens, smiles, and gives you a courteous refusal and a gift. The
          court notes that you asked.
    history: >-
      Imagawa Ujizane, landless after 1569, performed kemari before Nobunaga in Kyoto in 1575,
      and later served the Tokugawa; he died in 1615.
    diverged: >-
      The Oda are gone.
    sources: ["Shincho koki", "Turnbull, The Samurai Sourcebook (1998)"]
