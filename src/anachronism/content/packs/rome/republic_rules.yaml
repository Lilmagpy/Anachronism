schema_version: 1
# Tunable numbers of the Republic (content/schema/republic.py). Game balance, not history,
# except where a source is named. Ages: the Lex Villia annalis (Livy 40.44.1) fixed the order
# and intervals of offices in 180 BC; the exact minimum ages are the scholars' reconstruction.
republic_rules:
  default_praenomina: [Lucius, Gaius, Marcus, Publius, Quintus, Titus, Aulus, Gnaeus]  # source: the common praenomina (Varro, De lingua latina 9.60 ff.; Livy passim)
  sources: ["Livy 40.44.1 (Lex Villia annalis)", "Cicero, Philippics 5.47"]
  factions:
    - {id: patricians, name: "The patricians", from_year: -509, to_year: -287, order: patrician}
    - {id: plebeians, name: "The plebeians", from_year: -509, to_year: -287, order: plebeian}
    - {id: nobiles, name: "The nobility", from_year: -286, to_year: -134}
    - {id: optimates, name: "The optimates", from_year: -133, populist: false}
    - {id: populares, name: "The populares", from_year: -133, populist: true}
  city:
    # The games calendar (U7). Months and first years are the tradition's; where a passage has not
    # been re-read it is marked unverified. Funeral games: Livy Per. 16 (264 BC, Forum Boarium).
    munus_from_year: -264
    munus_venue: forum_boarium
    munus_min_rank: 5
    senate_houses: [curia_iulia, curia_hostilia, curia_pompeia]
    ludi:
      - {id: ludi_romani, name: "Ludi Romani", kind: circus, month: 9, from_year: -509, venue: circus_maximus, sources: ["Livy 1.35.9 (traditional founding under Tarquinius Priscus)", "Livy 2.36.1"]}
      - {id: ludi_plebeii, name: "Ludi Plebeii", kind: circus, month: 11, from_year: -216, venue: circus_flaminius, sources: ["Livy 23.30.17 (first attested; unverified: passage not re-read)"]}
      - {id: ludi_apollinares, name: "Ludi Apollinares", kind: circus, month: 7, from_year: -208, venue: circus_maximus, sources: ["Livy 27.23.5 (made annual 208; unverified: passage not re-read)"]}
      - {id: ludi_megalenses, name: "Ludi Megalenses", kind: scaenic, month: 4, from_year: -204, venue: aedes_magnae_matris, sources: ["Livy 34.54.3 (games before the temple, 194; unverified: passage not re-read)"]}
