schema_version: 1
# Prodigies reported to the Senate and the expiations it ordered (content/schema/rome_society.py:
# Prodigy), read by engine/religion.py. Livy's yearly notices (books 3-45) and Julius Obsequens'
# Liber prodigiorum (190-11 BC; his years are the consular years his headings give). Each dated
# entry fires in its year; the undated ones at the end are recurring kinds drawn in years the
# list does not cover. `sign` and `expiation` paraphrase the Latin; nothing is copied. `cost` is
# GAME BALANCE (0 = the default in rites.yaml). Passages were read in the Latin Library text
# unless marked # unverified.
prodigies:
