    steps:
      - {year: -353, status: sine_suffragio, note: "Pardoned for its care of the Vestals, a hundred years' truce; the first municipes without the vote.", sources: ["Livy 7.20.7-9 (read)", "Aulus Gellius 16.13.7 (unverified)", "Strabo 5.2.3 (unverified)"]}
    notes: >-
