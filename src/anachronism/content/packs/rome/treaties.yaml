schema_version: 1
# The treaties of Rome's allies (content/schema/italy.py: AllyTreaty), one per ally civ of the
# rome_* scenarios (D-287: the socii are civs allied to Rome). A civ allied to Rome at the start, or
# made its ally by a script or by diplomacy, gets its treaty from here; a civ without an entry gets
# the default terms (status ally, levy 8%, loyalty 60%).
#
# levy_bp is the share of the people the treaty obliges it to furnish (the formula togatorum). The
# proportions follow Polybius 2.24 (read on LacusCurtius), the census of 225 BC: the Latins 80,000
# foot and 5,000 horse (2.24.10), the Samnites 70,000 and 7,000 (2.24.10), the Iapygians and
# Messapians 50,000 and 16,000 (2.24.11), the Lucanians 30,000 and 3,000 (2.24.12), the Marsi,
# Marrucini, Frentani and Vestini 20,000 and 4,000 (2.24.12), the Sabines and Etruscans above 50,000
# and 4,000 (2.24.5), the Umbrians and Sarsinates about 20,000 and the Veneti and Cenomani 20,000
# (2.24.7); the Greek cities of the coast were naval allies and sent ships (Polybius 1.20.14,
# unverified). The Romans and Campanians together: 250,000 foot and 23,000 horse (2.24.14).
# The levy_bp of each people is these numbers against the scenarios' populations, rounded: the
# Samnites' 77,000 men on a people of about 700,000 is 11%; the Etruscans' 54,000 on 1.1 million
# is 5%. Loyalty is GAME BALANCE seeded from each people's record.
#
# steps: what history gave each people (applied in their year while the treaty stands).
treaties:
  # ---- the 509 and 390 starts (e5_ civs) --------------------------------------------------------
  - id: t_e5_latins
    civ: e5_latins
    name: The Latin League
    status: latin
    levy_bp: 1000
    loyalty_bp: 6000
    booty_share: true
    land_share: true
    steps:
      - {year: -338, status: citizen, note: "Lanuvium, Aricia, Nomentum and Pedum given the citizenship; the League dissolved.", sources: ["Livy 8.14.2-3, 8.14.10 (read)"]}
    notes: >-
      The treaty of Spurius Cassius (493) made the Latins Rome's allies on equal terms, sharing booty
      and the land of joint colonies (Livy 2.33.4, 2.33.9; the text in Dionysius 6.95, unverified).
      The step of 338 applies only if the League is still Rome's ally then; in history it fought
      Rome and was dissolved.
    sources: ["Livy 2.33.4, 2.33.9 (unverified: not re-read)", "Dionysius of Halicarnassus 6.95 (unverified)", "Polybius 2.24.10 (read)", "Livy 8.14 (read)"]
    confidence: medium
  - id: t_e5_hernici
    civ: e5_hernici
    name: The Hernici
    status: ally
    levy_bp: 800
    loyalty_bp: 6500
    booty_share: true
    land_share: true
    steps:
      - {year: -306, status: sine_suffragio, note: "Anagnia and the Hernici who had made war on Rome given the citizenship without the vote.", sources: ["Livy 9.43.24 (read)"]}
    notes: >-
      The Hernici joined the Cassian alliance in 486 and were given a share of the land and booty
      (Livy 2.41.1, unverified). Aletrium, Verulae and Ferentinum chose to keep their own laws in
      306 (Livy 9.43.23, read).
    sources: ["Livy 2.41.1 (unverified)", "Livy 9.43.23-24 (read)"]
    confidence: medium
