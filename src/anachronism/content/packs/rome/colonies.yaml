schema_version: 1
# Rome's colonies, each in its year and on the map province that holds its site
# (content/schema/italy.py: ColonyFoundation). Default history founds each in its year unless the
# player's history has turned there. "(read)" marks a passage read for this file: Livy on Perseus
# (the Roberts and Foster translations), the Periochae on livius.org, Velleius and Appian on
# LacusCurtius. Velleius 1.14-15 dates the colonies relative to one another; the years given are
# the tradition's (cross-checked against the consular dates, not against a modern handbook).
# Numbers are men ("names enrolled") unless notes say families. The province is the map grain's
# nearest: a modelling choice, noted where the site lies on a border.
colonies:
